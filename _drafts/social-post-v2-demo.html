<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learni Social Post — טיפ יומי</title>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@300;400;500;600;700;800&family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --hand: 'Playpen Sans Hebrew', cursive;
  --clean: 'Assistant', sans-serif;
  --blue: #7babd4;
  --green: #7dd4ac;
  --dark: #1e3a5f;
  --lavender: #b8a9d4;
  --mint-bg: #f0faf5;
  --mint-light: #e4f7ed;
  --cream: #faf8f3;
  --warm-white: #fefdfb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: #e8e4de;
  font-family: var(--clean);
}

/* ===== THE POST CANVAS ===== */
.post {
  width: 1080px;
  height: 1080px;
  position: relative;
  overflow: hidden;
  background: var(--cream);
}

/* ===== PAPER GRAIN TEXTURE ===== */
.post::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 50;
}

/* ===== LAYERED BACKGROUND SHAPES ===== */

/* Large mint wash — top-right organic blob */
.bg-blob-1 {
  position: absolute;
  top: -80px;
  left: -60px;
  width: 700px;
  height: 700px;
  background: radial-gradient(ellipse at 40% 40%, rgba(125,212,172,0.12) 0%, rgba(125,212,172,0.04) 50%, transparent 70%);
  border-radius: 60% 40% 55% 45% / 50% 60% 40% 50%;
  transform: rotate(-15deg);
  z-index: 1;
}

/* Soft blue circle — bottom-left */
.bg-blob-2 {
  position: absolute;
  bottom: -120px;
  right: -80px;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(123,171,212,0.1) 0%, transparent 65%);
  border-radius: 50%;
  z-index: 1;
}

/* Lavender whisper — center-right */
.bg-blob-3 {
  position: absolute;
  top: 350px;
  left: -50px;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(184,169,212,0.08) 0%, transparent 65%);
  border-radius: 50%;
  z-index: 1;
}

/* ===== DECORATIVE GRID DOTS ===== */
.dot-pattern {
  position: absolute;
  top: 60px;
  left: 60px;
  width: 120px;
  height: 120px;
  background-image: radial-gradient(circle, rgba(123,171,212,0.18) 1.5px, transparent 1.5px);
  background-size: 16px 16px;
  z-index: 2;
}

/* ===== HAND-DRAWN DECORATIVE ELEMENTS ===== */
.deco-svg {
  position: absolute;
  z-index: 3;
  pointer-events: none;
}

/* ===== CATEGORY PILL ===== */
.category {
  position: absolute;
  top: 72px;
  right: 80px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 10px;
}

.cat-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 24px;
  background: var(--green);
  border-radius: 24px;
  font-family: var(--hand);
  font-size: 20px;
  font-weight: 600;
  color: var(--dark);
  box-shadow: 0 3px 0 rgba(30,58,95,0.08);
  position: relative;
}

.cat-pill svg {
  width: 20px;
  height: 20px;
  fill: var(--dark);
}

/* Hand-drawn circle around the pill */
.cat-circle {
  position: absolute;
  top: -14px;
  right: -18px;
  width: calc(100% + 36px);
  height: calc(100% + 28px);
}

/* ===== MAIN TITLE ===== */
.title-block {
  position: absolute;
  top: 150px;
  right: 80px;
  left: 80px;
  z-index: 10;
}

.title-block h1 {
  font-family: var(--hand);
  font-size: 62px;
  font-weight: 800;
  color: var(--dark);
  line-height: 1.25;
  position: relative;
}

.title-num {
  display: inline-block;
  font-size: 88px;
  font-weight: 800;
  color: var(--green);
  line-height: 1;
  margin-left: 8px;
  position: relative;
  top: 4px;
  text-shadow: 3px 3px 0 rgba(125,212,172,0.2);
}

/* Hand-drawn underline under title */
.title-underline {
  position: relative;
  margin-top: -6px;
  margin-right: 4px;
}

/* ===== TIPS SECTION ===== */
.tips {
  position: absolute;
  top: 380px;
  right: 80px;
  left: 80px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.tip {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  position: relative;
}

/* Numbered bubble */
.tip-num {
  flex-shrink: 0;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--hand);
  font-size: 26px;
  font-weight: 800;
  color: #fff;
  position: relative;
  box-shadow: 0 4px 0 rgba(0,0,0,0.06);
}

.tip-num::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2.5px dashed;
  opacity: 0.25;
}

.tip:nth-child(1) .tip-num { background: var(--green); }
.tip:nth-child(1) .tip-num::after { border-color: var(--green); }
.tip:nth-child(2) .tip-num { background: var(--blue); }
.tip:nth-child(2) .tip-num::after { border-color: var(--blue); }
.tip:nth-child(3) .tip-num { background: var(--lavender); }
.tip:nth-child(3) .tip-num::after { border-color: var(--lavender); }

/* Tip card */
.tip-card {
  flex: 1;
  background: #fff;
  border-radius: 18px;
  padding: 22px 28px;
  position: relative;
  box-shadow:
    0 2px 0 rgba(0,0,0,0.03),
    0 8px 24px rgba(30,58,95,0.04);
  border: 1.5px solid rgba(125,212,172,0.15);
  transition: transform 0.3s;
}

.tip:nth-child(2) .tip-card {
  border-color: rgba(123,171,212,0.2);
  transform: translateX(-12px);
}

.tip:nth-child(3) .tip-card {
  border-color: rgba(184,169,212,0.2);
  transform: translateX(8px);
}

/* Quote marks */
.tip-card::before {
  content: '\201F';
  position: absolute;
  top: 8px;
  right: 16px;
  font-family: var(--hand);
  font-size: 40px;
  line-height: 1;
  opacity: 0.08;
  color: var(--dark);
}

.tip-text {
  font-family: var(--hand);
  font-size: 24px;
  font-weight: 500;
  color: var(--dark);
  line-height: 1.5;
  position: relative;
  z-index: 1;
}

/* Subtle highlight strip */
.tip:nth-child(1) .tip-card::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 5px;
  height: 100%;
  background: var(--green);
  border-radius: 0 18px 18px 0;
  opacity: 0.5;
}
.tip:nth-child(2) .tip-card::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 5px;
  height: 100%;
  background: var(--blue);
  border-radius: 0 18px 18px 0;
  opacity: 0.5;
}
.tip:nth-child(3) .tip-card::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 5px;
  height: 100%;
  background: var(--lavender);
  border-radius: 0 18px 18px 0;
  opacity: 0.5;
}

/* ===== CONNECTOR LINE between tips ===== */
.connector {
  position: absolute;
  right: 107px;
  z-index: 5;
}

/* ===== BOTTOM BAR ===== */
.bottom-bar {
  position: absolute;
  bottom: 0;
  right: 0;
  left: 0;
  height: 140px;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 80px;
  background: linear-gradient(180deg, transparent 0%, rgba(240,250,245,0.6) 30%, rgba(228,247,237,0.85) 100%);
}

/* Logo */
.logo {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-circles {
  position: relative;
  width: 46px;
  height: 40px;
}

.logo-circles .c1, .logo-circles .c2 {
  position: absolute;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  top: 4px;
}

.logo-circles .c1 {
  right: 0;
  background: var(--blue);
  opacity: 0.8;
}

.logo-circles .c2 {
  right: 16px;
  background: var(--green);
  opacity: 0.8;
  mix-blend-mode: multiply;
}

.logo-text {
  font-family: var(--hand);
  font-size: 28px;
  font-weight: 700;
  color: var(--dark);
  letter-spacing: -0.5px;
}

.logo-sub {
  font-family: var(--clean);
  font-size: 13px;
  color: rgba(30,58,95,0.5);
  margin-top: -2px;
}

/* CTA */
.cta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--hand);
  font-size: 20px;
  font-weight: 600;
  color: var(--dark);
  padding: 12px 28px;
  background: #fff;
  border-radius: 30px;
  border: 2px solid rgba(125,212,172,0.4);
  box-shadow: 0 3px 0 rgba(125,212,172,0.15);
}

.cta svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: var(--green);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ===== CORNER DECO ===== */
.corner-deco {
  position: absolute;
  z-index: 3;
}

.corner-tl {
  top: 30px;
  right: 30px;
}

.corner-br {
  bottom: 150px;
  left: 30px;
  transform: rotate(180deg);
}

/* ===== FLOATING ELEMENTS ===== */

/* Small scattered shapes */
.float-shape {
  position: absolute;
  z-index: 3;
  opacity: 0.12;
}

.float-star {
  top: 290px;
  left: 100px;
}

.float-diamond {
  top: 520px;
  right: 40px;
}

.float-plus {
  bottom: 200px;
  left: 450px;
}

/* ===== TAPE STRIP (editorial touch) ===== */
.tape {
  position: absolute;
  top: 56px;
  left: 50px;
  width: 80px;
  height: 30px;
  background: rgba(125,212,172,0.25);
  transform: rotate(-8deg);
  z-index: 4;
  border-radius: 2px;
  mix-blend-mode: multiply;
}

.tape::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    90deg,
    transparent,
    transparent 6px,
    rgba(255,255,255,0.3) 6px,
    rgba(255,255,255,0.3) 7px
  );
}

/* Second tape */
.tape-2 {
  position: absolute;
  bottom: 160px;
  right: 55px;
  width: 60px;
  height: 26px;
  background: rgba(184,169,212,0.2);
  transform: rotate(5deg);
  z-index: 4;
  border-radius: 2px;
  mix-blend-mode: multiply;
}

/* ===== STITCH LINE (editorial border) ===== */
.stitch {
  position: absolute;
  top: 20px;
  right: 20px;
  width: calc(100% - 40px);
  height: calc(100% - 40px);
  border: 2px dashed rgba(30,58,95,0.06);
  border-radius: 20px;
  z-index: 2;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="post">
  <!-- Background layers -->
  <div class="bg-blob-1"></div>
  <div class="bg-blob-2"></div>
  <div class="bg-blob-3"></div>
  <div class="dot-pattern"></div>
  <div class="stitch"></div>

  <!-- Editorial tape strips -->
  <div class="tape"></div>
  <div class="tape-2"></div>

  <!-- Corner decorative elements -->
  <svg class="corner-deco corner-tl" width="60" height="60" viewBox="0 0 60 60" fill="none">
    <path d="M4 4 L4 28" stroke="#7dd4ac" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M4 4 L28 4" stroke="#7dd4ac" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
    <circle cx="4" cy="4" r="3" fill="#7dd4ac" opacity="0.2"/>
  </svg>

  <svg class="corner-deco corner-br" width="60" height="60" viewBox="0 0 60 60" fill="none">
    <path d="M4 4 L4 28" stroke="#b8a9d4" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
    <path d="M4 4 L28 4" stroke="#b8a9d4" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
    <circle cx="4" cy="4" r="3" fill="#b8a9d4" opacity="0.15"/>
  </svg>

  <!-- Floating decorative shapes -->
  <svg class="float-shape float-star" width="40" height="40" viewBox="0 0 40 40">
    <path d="M20 4 L23 16 L36 16 L25 23 L29 36 L20 28 L11 36 L15 23 L4 16 L17 16 Z" fill="#7dd4ac"/>
  </svg>

  <svg class="float-shape float-diamond" width="28" height="28" viewBox="0 0 28 28">
    <rect x="14" y="2" width="16" height="16" rx="3" transform="rotate(45 14 2)" fill="#7babd4"/>
  </svg>

  <svg class="float-shape float-plus" width="24" height="24" viewBox="0 0 24 24">
    <path d="M12 4 V20 M4 12 H20" stroke="#b8a9d4" stroke-width="4" stroke-linecap="round"/>
  </svg>

  <!-- Category pill -->
  <div class="category">
    <div class="cat-pill">
      <svg viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
      טיפ יומי
      <!-- Hand-drawn wobbly circle -->
      <svg class="cat-circle" viewBox="0 0 180 60" fill="none">
        <path d="M10 30 Q10 8 50 6 Q90 4 130 8 Q170 12 172 30 Q174 48 130 52 Q90 56 50 54 Q10 52 10 30Z"
              stroke="#7dd4ac" stroke-width="2" fill="none" opacity="0.35"
              stroke-dasharray="4 6" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- Main title -->
  <div class="title-block">
    <h1>
      <span class="title-num">3</span>
      פרומפטים
      <br>שישנו לכם את הבוקר
    </h1>
    <!-- Hand-drawn underline -->
    <svg class="title-underline" width="460" height="20" viewBox="0 0 460 20" fill="none">
      <path d="M5 12 Q60 4 120 14 Q180 22 240 10 Q300 2 360 14 Q400 20 455 8"
            stroke="#7dd4ac" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.45"/>
      <path d="M30 16 Q100 8 180 16 Q260 22 340 12 Q400 6 440 14"
            stroke="#7dd4ac" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.2"/>
    </svg>
  </div>

  <!-- Tips -->
  <div class="tips">
    <!-- Tip 1 -->
    <div class="tip">
      <div class="tip-num">1</div>
      <div class="tip-card">
        <div class="tip-text">תכנן לי את היום ב-5 משימות מרכזיות</div>
      </div>
    </div>

    <!-- Tip 2 -->
    <div class="tip">
      <div class="tip-num">2</div>
      <div class="tip-card">
        <div class="tip-text">תסכם לי את המייל הזה בשלוש נקודות</div>
      </div>
    </div>

    <!-- Tip 3 -->
    <div class="tip">
      <div class="tip-num">3</div>
      <div class="tip-card">
        <div class="tip-text">תכתוב תשובה מנומסת ומקצועית למייל הזה</div>
      </div>
    </div>
  </div>

  <!-- SVG connector line between tip numbers -->
  <svg class="connector" style="top: 434px;" width="4" height="200" viewBox="0 0 4 200" fill="none">
    <path d="M2 0 Q4 50 1 100 Q-1 150 2 200" stroke="#7dd4ac" stroke-width="1.5" stroke-dasharray="6 8" stroke-linecap="round" opacity="0.25"/>
  </svg>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="logo">
      <div class="logo-circles">
        <div class="c1"></div>
        <div class="c2"></div>
      </div>
      <div>
        <div class="logo-text">Learni</div>
        <div class="logo-sub">AI & Digital Consulting</div>
      </div>
    </div>

    <div class="cta">
      <svg viewBox="0 0 24 24">
        <path d="M13 7l5 5-5 5"/>
        <path d="M6 12h12"/>
      </svg>
      learni.ai
    </div>
  </div>
</div>

</body>
</html>
