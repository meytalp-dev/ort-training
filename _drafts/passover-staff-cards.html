@font-face { font-family: 'Cafe'; src: url('../docs/design-studio/fonts/Cafe.ttf'); }
@font-face { font-family: 'Petel Bold'; src: url('../docs/design-studio/fonts/Petel.ttf'); }
@font-face { font-family: 'Gveret Levin'; src: url('../docs/design-studio/fonts/GveretLevinAlefAlefAlef-Regular.otf'); }
@font-face { font-family: 'Dana Yad'; src: url('../docs/design-studio/fonts/DanaYadAlefAlefAlef-Normal.otf'); }
@font-face { font-family: 'Nehama'; src: url('../docs/design-studio/fonts/Nehama.ttf'); }
@font-face { font-family: 'Carmela'; src: url('../docs/design-studio/fonts/Carmela.ttf'); }

:root { --bg: #F5F0E8; --primary: #2A9D8F; --primary-dark: #1a7a6d; --accent: #E9C46A; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Heebo', sans-serif; background: var(--bg); min-height: 100vh; direction: rtl; }

.header { background: linear-gradient(135deg, #2A9D8F 0%, #3CC5B5 50%, #2A9D8F 100%); padding: 28px 32px; text-align: center; color: white; }
.header h1 { font-family: 'Rubik', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 4px; }
.header p { font-size: 14px; opacity: 0.9; }

.controls-bar { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn { padding: 12px 28px; border: none; border-radius: 12px; font-family: 'Heebo'; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 200ms; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(42,157,143,0.3); }
.btn-accent { background: var(--accent); color: #0F172A; }

.progress-bar { display: none; max-width: 600px; margin: 10px auto; text-align: center; }
.progress-bar .bar { height: 6px; background: #e0dcd4; border-radius: 3px; overflow: hidden; margin: 8px 0; }
.progress-bar .fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 300ms; width: 0; }
.progress-bar .label { font-size: 13px; color: #64748B; }

.grid { max-width: 1280px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 28px; }
.card-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; }

.card {
  width: 380px; height: 380px; border-radius: 0; overflow: hidden;
  position: relative; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}
.card.sticker-mode {
  width: 512px; height: 512px;
}
.card-canvas {
  width: 100%; height: 100%; position: relative; overflow: hidden;
  direction: rtl; display: flex; flex-direction: column; align-items: center; justify-content: center;
}

.dl-btn {
  padding: 6px 18px; border: 1.5px solid #d0ccc4; border-radius: 8px; background: white;
  font-family: 'Heebo'; font-size: 12px; cursor: pointer; color: #64748B; transition: all 200ms;
}
.dl-btn:hover { border-color: var(--primary); color: var(--primary); }

@media print { .header, .controls-bar, .progress-bar, .dl-btn { display: none !important; } .card-wrapper { page-break-inside: avoid; } }
@media (max-width: 768px) { .grid { grid-template-columns: 1fr; justify-items: center; } }

</head>

const themeIllustMap = {
  freedom: ['dove-with-olive-branch', 'birds-in-flight', 'butterfly-cluster', 'broken-chains-becoming-flowers'],
  love: ['floral-heart-wreath', 'heart-of-flowers-and-leaves', 'two-hands-holding'],
  hope: ['sunrise-over-hills', 'candle-flame', 'stars-constellation', 'rainbow-arc', 'growing-seedling'],
  bloom: ['almond-blossom-branch', 'wildflowers-bouquet', 'cherry-blossoms-scattered', 'field-of-flowers-border'],
  happy: ['cherry-blossoms-scattered', 'wildflowers-bouquet', 'butterfly-cluster'],
  purity: ['olive-branch', 'growing-seedling', 'almond-blossom-branch']
};
let illustCounter = {};

const illustPositions = [
  { main: 'top:3%;right:3%;width:22%;opacity:0.4;', accent: 'bottom:14%;left:3%;width:14%;opacity:0.25;transform:scaleX(-1);' },
  { main: 'bottom:14%;left:2%;width:20%;opacity:0.35;', accent: 'top:3%;right:4%;width:12%;opacity:0.25;' },
  { main: 'top:2%;left:3%;width:22%;opacity:0.4;transform:scaleX(-1);', accent: 'bottom:15%;right:3%;width:13%;opacity:0.22;' },
  { main: 'bottom:14%;right:2%;width:21%;opacity:0.35;transform:scaleX(-1);', accent: 'top:4%;left:4%;width:12%;opacity:0.25;' },
  { main: 'top:3%;right:3%;width:20%;opacity:0.38;', accent: 'bottom:15%;left:4%;width:14%;opacity:0.22;transform:scaleX(-1);' },
  { main: 'top:2%;left:2%;width:21%;opacity:0.38;', accent: 'bottom:14%;right:3%;width:13%;opacity:0.25;' },
];
let posCounter = 0;

function getLibraryIllust(theme) {
  const ids = themeIllustMap[theme] || themeIllustMap.bloom;
  if (!illustCounter[theme]) illustCounter[theme] = 0;
  const mainId = ids[illustCounter[theme] % ids.length];
  const accentId = ids[(illustCounter[theme] + 1) % ids.length];
  illustCounter[theme]++;
  const mainIl = illustrations.find(x => x.id === mainId);
  const accentIl = illustrations.find(x => x.id === accentId);
  if (!mainIl) return '';
  const pos = illustPositions[posCounter % illustPositions.length];
  posCounter++;
  return `<div style="position:absolute;${pos.main}z-index:1;pointer-events:none;overflow:hidden;">${mainIl.svg}</div>${accentIl ? `<div style="position:absolute;${pos.accent}z-index:1;pointer-events:none;overflow:hidden;">${accentIl.svg}</div>` : ''}`;
}

    <svg style="position:absolute;bottom:14%;right:6%;width:11%;opacity:0.3;z-index:1;" viewBox="0 0 60 60">
      <g transform="translate(30,30)"><circle cx="0" cy="-6" r="5" fill="${c[0]}" opacity="0.5"/><circle cx="5.7" cy="-1.9" r="5" fill="${c[0]}" opacity="0.45"/><circle cx="3.5" cy="4.9" r="5" fill="${c[0]}" opacity="0.5"/><circle cx="-3.5" cy="4.9" r="5" fill="${c[0]}" opacity="0.45"/><circle cx="-5.7" cy="-1.9" r="5" fill="${c[0]}" opacity="0.5"/><circle cx="0" cy="0" r="2.5" fill="${c[2]}" opacity="0.6"/></g>
    </svg>
    <svg style="position:absolute;top:40%;left:4%;width:5%;opacity:0.2;z-index:1;" viewBox="0 0 30 30"><ellipse cx="15" cy="10" rx="5" ry="10" fill="${c[1]}" transform="rotate(15,15,10)"/></svg>
    <svg style="position:absolute;bottom:25%;right:4%;width:4%;opacity:0.2;z-index:1;" viewBox="0 0 30 30"><ellipse cx="15" cy="10" rx="4" ry="9" fill="${c[0]}" transform="rotate(-20,15,10)"/></svg>`;
}

// ====== RENDER ======
function renderCards() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';

  staff.forEach((person, i) => {
    const style = styleTemplates[0]; // botanical for all
    const pal = colorSets[i % colorSets.length];
    const font = fontSets[i % fontSets.length];
    const textColor = pal.textColor;
    const headColor = pal.headColor;
    const blessColor = person.bc || pal.blessColor;
    const divColor = pal.colors[0] + '66';
    const bannerBg = 'linear-gradient(to top, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.7) 40%, rgba(255,255,255,0) 100%)';

    const theme = themes[person.theme] || themes.happy;
    const blessingHTML = person.blessing.split('\n').map(l => l.trim()).join('<br>');
    const themeTextHTML = theme.text.split('\n').map(l => l.trim()).join('<br>');
    const honorific = person.g === 'm' ? 'יקר' : 'יקרה';
    // Cafe font renders small — boost size
    const isCafeBody = font.body.includes('Cafe');
    const isCafeHead = font.heading.includes('Cafe');
    const nameSize = 'clamp(22px,6vw,32px)';
    const headSize = isCafeHead ? 'clamp(18px,5vw,26px)' : 'clamp(16px,4.5vw,22px)';
    const bodySize = isCafeBody ? 'clamp(15px,4vw,20px)' : 'clamp(13px,3.2vw,16px)';
    const themeSize = isCafeBody ? 'clamp(14px,3.5vw,18px)' : 'clamp(12px,2.8vw,14px)';

    const wrapper = document.createElement('div');
    wrapper.className = 'card-wrapper';
    wrapper.innerHTML = `
      <div class="card" id="card-${i}">
        <div class="card-canvas" style="background:${pal.bg};">
          ${style.deco(pal.colors)}
          ${person.illust ? getLibraryIllust(person.theme) : ''}
          ${person.pic ? `<div style="position:absolute;top:12px;left:12px;width:60px;height:60px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,0.9);box-shadow:0 3px 12px rgba(0,0,0,0.15);z-index:4;background:#f0ebe4;"><img src="${driveThumb(person.pic)}" crossorigin="anonymous" style="width:100%;height:100%;object-fit:cover;object-position:center top;" onerror="this.parentElement.style.display='none'"></div>` : ''}
          <div style="position:relative;z-index:2;text-align:center;padding:5% 6% 14%;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;">
            <div style="font-family:'Rubik',sans-serif;font-size:${nameSize};font-weight:700;color:${headColor};line-height:1.2;margin-bottom:1%;">${person.name} ${honorific}</div>
            <div style="font-family:${font.heading};font-size:${headSize};font-weight:700;color:${headColor};line-height:1.3;margin-bottom:1%;opacity:0.85;">${theme.heading}</div>
            <div style="font-family:'Heebo',sans-serif;font-size:${themeSize};font-weight:400;color:${textColor};line-height:1.6;max-width:88%;margin-bottom:2%;opacity:0.7;font-style:italic;">${themeTextHTML}</div>
            <div style="width:25%;height:1px;background:linear-gradient(90deg,transparent,${divColor},transparent);margin-bottom:2%;"></div>
            <div style="font-family:'Gveret Levin',sans-serif;font-size:${bodySize};font-weight:400;color:${blessColor};line-height:1.7;max-width:90%;">${blessingHTML}</div>
          </div>
          <div style="position:absolute;bottom:0;left:0;right:0;padding:3% 0 2%;background:${bannerBg};text-align:center;z-index:3;">
            <div style="width:20%;height:1px;background:linear-gradient(90deg,transparent,${divColor},transparent);margin:0 auto 1%;"></div>
            <div style="font-family:'Suez One',serif;font-size:clamp(11px,3vw,16px);color:${headColor};letter-spacing:1px;">חג חירות שמח</div>
            <div style="font-size:10px;color:${textColor};opacity:0.4;margin-top:2px;">בית ספר אורט בית הערבה</div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="dl-btn" onclick="downloadCard(${i})">הורדה</button>
        <button class="dl-btn flag-btn" id="flag-${i}" onclick="toggleFlag(${i})" style="color:#e76f51;">לשיפור</button>
      </div>
    `;
    grid.appendChild(wrapper);
  });
}

// ====== FLAG FOR IMPROVEMENT ======
const flagged = new Set();
// Reset on load - clean slate
function toggleFlag(i) {
  const btn = document.getElementById('flag-'+i);
  const card = document.getElementById('card-'+i);
  if (flagged.has(i)) {
    flagged.delete(i);
    btn.textContent = 'לשיפור';
    btn.style.background = 'white';
    card.style.outline = 'none';
  } else {
    flagged.add(i);
    btn.textContent = 'סומן!';
    btn.style.background = '#fef0e8';
    card.style.outline = '3px solid #e76f51';
  }
  updateFlagSummary();
}

function updateFlagSummary() {
  let el = document.getElementById('flagSummary');
  if (!el) {
    el = document.createElement('div');
    el.id = 'flagSummary';
    el.style.cssText = 'position:fixed;bottom:16px;right:16px;background:white;border:2px solid #e76f51;border-radius:12px;padding:12px 18px;box-shadow:0 4px 20px rgba(0,0,0,0.15);z-index:999;font-family:Heebo;font-size:13px;max-width:300px;direction:rtl;';
    document.body.appendChild(el);
  }
  if (flagged.size === 0) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  const names = [...flagged].map(i => staff[i].name).join(', ');
  el.innerHTML = `<strong style="color:#e76f51;">סומנו לשיפור (${flagged.size}):</strong><br>${names}<br><button onclick="copyFlagged()" style="margin-top:6px;padding:4px 12px;background:#e76f51;color:white;border:none;border-radius:6px;cursor:pointer;font-family:Heebo;font-size:12px;">העתקת רשימה</button>`;
}

function copyFlagged() {
  const names = [...flagged].map(i => `${i+1}. ${staff[i].name}`).join('\n');
  navigator.clipboard.writeText(names);
  document.querySelector('#flagSummary button').textContent = 'הועתק!';
  setTimeout(() => { document.querySelector('#flagSummary button').textContent = 'העתקת רשימה'; }, 1500);
}

async function downloadCard(index) {
  const card = document.getElementById(`card-${index}`);
  const canvas = await html2canvas(card, { scale: 2, backgroundColor: null, useCORS: true, logging: false });
  const link = document.createElement('a');
  const safeName = staff[index].name.replace(/[׳']/g, '').replace(/\s+/g, '-');
  const sub = staff[index].subtitle ? `-${staff[index].subtitle.replace(/\s+/g,'-')}` : '';
  link.download = `pesach-${safeName}${sub}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function downloadAll() {
  const bar = document.getElementById('progressBar');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  bar.style.display = 'block';
  const zip = new JSZip();
  for (let i = 0; i < staff.length; i++) {
    label.textContent = `מוריד ${i + 1} מתוך ${staff.length}...`;
    fill.style.width = `${((i + 1) / staff.length) * 100}%`;
    const card = document.getElementById(`card-${i}`);
    const canvas = await html2canvas(card, { scale: 2, backgroundColor: null, useCORS: true, logging: false });
    const base64 = canvas.toDataURL('image/png').split(',')[1];
    const safeName = staff[i].name.replace(/[׳']/g, '').replace(/\s+/g, '-');
    const sub = staff[i].subtitle ? `-${staff[i].subtitle.replace(/\s+/g,'-')}` : '';
    zip.file(`pesach-${safeName}${sub}.png`, base64, { base64: true });
    await new Promise(r => setTimeout(r, 50));
  }
  label.textContent = 'מכין קובץ ZIP...';
  const blob = await zip.generateAsync({ type: 'blob' });
  const link = document.createElement('a');
  link.download = 'גלויות-פסח-צוות-אורט.zip';
  link.href = URL.createObjectURL(blob);
  link.click();
  label.textContent = 'הושלם!';
  setTimeout(() => { bar.style.display = 'none'; }, 2000);
}

renderCards();
</script>
