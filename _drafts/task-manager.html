<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>לרני · ניהול משימות</title>

<!-- React 18 + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<style>
/* =============================================================
   Learni — Foundations: Colors + Type tokens. RTL Hebrew-first.
   ============================================================= */

@import url('https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&family=Heebo:wght@300;400;500;600;700;800;900&family=Rubik:wght@400;500;600;700;800;900&family=Caveat:wght@400;500;600;700&display=swap');

@font-face {
  font-family: 'Liron';
  src: url('fonts/liron.ttf') format('truetype');
  font-weight: 400 700;
  font-style: normal;
  font-display: swap;
}

:root {
  --brand-blue:        #7babd4;
  --brand-blue-soft:   #a8c8f0;
  --brand-blue-deep:   #5a93c0;
  --brand-green:       #7dd4ac;
  --brand-green-soft:  #a8e6cf;
  --brand-green-deep:  #5abf92;
  --brand-lavender:    #b8a9d4;
  --brand-lavender-soft:#d4c8eb;
  --brand-ink:         #1e3a5f;
  --brand-ink-soft:    #4a6a8a;

  --paper:             #ffffff;
  --canvas:            #f5f9fb;
  --canvas-warm:       #f3f7f2;
  --line:              #e4ecf2;
  --line-strong:       #cfdbe4;
  --mute:              #eef3f7;

  --success:           #5abf92;
  --warning:           #e9a319;
  --danger:            #e76f7a;
  --info:              #7babd4;

  --fg-1:              var(--brand-ink);
  --fg-2:              var(--brand-ink-soft);
  --fg-3:              #6e8499;
  --fg-on-brand:       #ffffff;

  --bg-1:              var(--paper);
  --bg-2:              var(--canvas);
  --bg-3:              var(--mute);

  --grad-hero:     linear-gradient(135deg, rgba(123,171,212,0.22) 0%, rgba(125,212,172,0.22) 55%, rgba(184,169,212,0.18) 100%);
  --grad-blue:     linear-gradient(135deg, #a8c8f0 0%, #7babd4 100%);
  --grad-green:    linear-gradient(135deg, #a8e6cf 0%, #7dd4ac 100%);
  --grad-lavender: linear-gradient(135deg, #d4c8eb 0%, #b8a9d4 100%);
  --grad-ink:      linear-gradient(135deg, #1e3a5f 0%, #2e4f7a 100%);
  --grad-soft:     linear-gradient(145deg, #ffffff 0%, #f3f7f2 100%);

  --mesh-bg:
    radial-gradient(at 15% 25%, rgba(123,171,212,0.28) 0%, transparent 55%),
    radial-gradient(at 85% 75%, rgba(125,212,172,0.22) 0%, transparent 55%),
    radial-gradient(at 50% 0%,  rgba(184,169,212,0.20) 0%, transparent 65%),
    radial-gradient(at 30% 80%, rgba(168,230,207,0.18) 0%, transparent 45%);
  --dot-pattern:
    radial-gradient(rgba(30,58,95,0.05) 1.2px, transparent 1.2px);
  --dot-size: 20px 20px;

  --r-xs: 8px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 20px;
  --r-xl: 28px;
  --r-2xl: 40px;
  --r-pill: 9999px;

  --r-cloud-1: 24px 24px 40px 24px;
  --r-cloud-2: 24px 40px 24px 24px;
  --r-cloud-3: 40px 24px 24px 24px;
  --r-cloud-4: 24px 24px 24px 40px;

  --shadow-xs:  0 1px 2px   rgba(30,58,95,0.05);
  --shadow-sm:  0 2px 8px   rgba(30,58,95,0.06);
  --shadow-md:  0 2px 8px   rgba(30,58,95,0.04), 0 8px 24px rgba(30,58,95,0.06);
  --shadow-lg:  0 8px 30px  rgba(123,171,212,0.18), 0 12px 40px rgba(30,58,95,0.08);
  --shadow-glow-blue:  0 0 50px rgba(123,171,212,0.28);
  --shadow-glow-green: 0 0 50px rgba(125,212,172,0.26);
  --shadow-inset:      inset 0 1px 2px rgba(30,58,95,0.04);

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;

  --ease-out:     cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out:  cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring:  cubic-bezier(0.34, 1.56, 0.64, 1);
  --dur-fast:    180ms;
  --dur-base:    300ms;
  --dur-slow:    500ms;
  --dur-dreamy:  800ms;

  --font-display:  'Playpen Sans Hebrew', 'Heebo', system-ui, sans-serif;
  --font-body:     'Heebo', 'Rubik', system-ui, sans-serif;
  --font-alt:      'Rubik', 'Heebo', system-ui, sans-serif;
  --font-script:   'Caveat', 'Playpen Sans Hebrew', cursive;
  --font-liron:    'Liron', 'Playpen Sans Hebrew', cursive;
  --font-mono:     ui-monospace, 'SFMono-Regular', Menlo, monospace;

  --fs-xs:   12px;
  --fs-sm:   14px;
  --fs-base: 16px;
  --fs-md:   18px;
  --fs-lg:   20px;
  --fs-xl:   24px;
  --fs-2xl:  30px;
  --fs-3xl:  36px;
  --fs-4xl:  48px;
  --fs-5xl:  64px;
  --fs-6xl:  80px;

  --lh-tight:  1.15;
  --lh-snug:   1.3;
  --lh-normal: 1.55;
  --lh-loose:  1.75;

  --tracking-tight:  -0.02em;
  --tracking-normal: 0;
  --tracking-wide:   0.04em;
}

html { direction: rtl; scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-normal);
  color: var(--fg-1);
  background: var(--bg-2);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  color: var(--fg-1);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  margin: 0 0 var(--space-4);
  font-weight: 700;
  text-wrap: balance;
}
h1 { font-size: clamp(40px, 5vw, var(--fs-5xl)); font-weight: 800; }
h2 { font-size: clamp(30px, 3.5vw, var(--fs-3xl)); font-weight: 700; }
h3 { font-size: var(--fs-2xl); font-weight: 700; }
h4 { font-size: var(--fs-xl);  font-weight: 600; }

h5, h6 {
  font-family: var(--font-alt);
  font-weight: 700;
  margin: 0 0 var(--space-3);
  color: var(--fg-1);
}
h5 { font-size: var(--fs-lg); }
h6 { font-size: var(--fs-md); letter-spacing: var(--tracking-wide); text-transform: none; }

p  { margin: 0 0 var(--space-4); color: var(--fg-2); text-wrap: pretty; }
small { font-size: var(--fs-sm); color: var(--fg-3); }

a  {
  color: var(--brand-blue-deep);
  text-decoration: none;
  transition: color var(--dur-base) var(--ease-out);
}
a:hover { color: var(--brand-ink); }

code, kbd, pre {
  font-family: var(--font-mono);
  font-size: 0.92em;
  background: var(--bg-3);
  border-radius: var(--r-xs);
  padding: 0.1em 0.35em;
}

hr {
  border: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
  margin: var(--space-8) 0;
}

::selection {
  background: rgba(123,171,212,0.35);
  color: var(--brand-ink);
}

.ds-glass-card {
  background: rgba(255,255,255,0.70);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(228,236,242,0.7);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
}
.ds-mesh-bg  { background-image: var(--mesh-bg); }
.ds-dot-bg   { background-image: var(--dot-pattern); background-size: var(--dot-size); }
.ds-text-gradient {
  background-image: linear-gradient(135deg, #5a93c0 0%, #1e3a5f 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.ds-cloud-1 { border-radius: var(--r-cloud-1); }
.ds-cloud-2 { border-radius: var(--r-cloud-2); }
.ds-cloud-3 { border-radius: var(--r-cloud-3); }
.ds-cloud-4 { border-radius: var(--r-cloud-4); }

/* ===== app.css ===== */
html, body { height: 100%; }
body {
  background: var(--canvas);
  background-image: var(--mesh-bg);
  background-attachment: fixed;
  overflow: hidden;
  font-family: var(--font-body);
}

body[data-title-font="playpen"]    { --app-display: 'Playpen Sans Hebrew', 'Heebo', sans-serif; }
body[data-title-font="liron"]      { --app-display: 'Liron', 'Playpen Sans Hebrew', sans-serif; }
body[data-title-font="rubik"]      { --app-display: 'Rubik', 'Heebo', sans-serif; }

.app-display { font-family: var(--app-display, 'Playpen Sans Hebrew'); letter-spacing: -0.01em; }

.stage {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding: 24px;
  overflow: hidden;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.7;
  pointer-events: none;
  animation: float 8s ease-in-out infinite;
}
.orb.blue  { width: 420px; height: 420px; background: #a8c8f0; top: -80px; right: -120px; }
.orb.green { width: 380px; height: 380px; background: #a8e6cf; bottom: -100px; left: -100px; animation-delay: -3s; }
.orb.lav   { width: 320px; height: 320px; background: #d4c8eb; top: 40%; left: -140px; animation-delay: -5s; opacity: 0.6; }

@keyframes float {
  0%,100% { transform: translateY(0) translateX(0); }
  50%     { transform: translateY(-18px) translateX(8px); }
}

.phone {
  position: relative;
  width: 390px;
  height: 844px;
  max-height: calc(100vh - 48px);
  background: linear-gradient(180deg, #fbfcfd 0%, #f5f9fb 100%);
  border-radius: 44px;
  overflow: hidden;
  box-shadow:
    0 30px 80px rgba(30,58,95,0.18),
    0 10px 30px rgba(123,171,212,0.18),
    0 0 0 1px rgba(228,236,242,0.8);
  display: flex;
  flex-direction: column;
  isolation: isolate;
}

.phone::before {
  content:"";
  position: absolute; inset: 0;
  background-image: var(--mesh-bg);
  opacity: 0.65;
  pointer-events: none;
  z-index: 0;
}

.statusbar {
  position: relative; z-index: 2;
  height: 44px;
  padding: 0 28px;
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 15px;
  color: var(--brand-ink);
  direction: ltr;
}
.statusbar .time { font-variant-numeric: tabular-nums; }
.statusbar .icons { display:flex; gap: 6px; align-items:center; }
.statusbar svg { width: 16px; height: 16px; }

.screen-viewport {
  position: relative;
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  z-index: 1;
  padding-bottom: 120px;
  scrollbar-width: none;
}
.screen-viewport::-webkit-scrollbar { display: none; }

.screen {
  animation: screen-in 420ms var(--ease-out) both;
}
@keyframes screen-in {
  from { opacity: 0; transform: translateY(8px) scale(0.99); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.bottomnav {
  position: absolute;
  left: 16px; right: 16px; bottom: 16px;
  z-index: 10;
  height: 76px;
  border-radius: 28px;
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(228,236,242,0.9);
  box-shadow:
    0 10px 30px rgba(30,58,95,0.10),
    0 2px 6px rgba(30,58,95,0.04);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 10px;
  align-items: center;
}

.nav-item {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  border: 0; background: transparent; cursor: pointer;
  color: var(--fg-3);
  padding: 8px 0;
  border-radius: 20px;
  transition: color var(--dur-base) var(--ease-out);
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
}
.nav-item svg { width: 22px; height: 22px; stroke-width: 2; }
.nav-item:hover { color: var(--brand-ink-soft); }

.bottomnav[data-style="pill"] .nav-item.active {
  color: #fff;
}
.bottomnav[data-style="pill"] .nav-active-pill {
  position: absolute;
  top: 8px; bottom: 8px;
  border-radius: 22px;
  background: linear-gradient(135deg, #2e4f7a 0%, #1e3a5f 100%);
  box-shadow: 0 6px 16px rgba(30,58,95,0.28), 0 0 30px rgba(123,171,212,0.35);
  transition: transform 480ms var(--ease-spring), width 480ms var(--ease-spring);
  z-index: 0;
  pointer-events: none;
}
.bottomnav[data-style="pill"] .nav-item > * { position: relative; z-index: 1; }

.bottomnav[data-style="dots"] .nav-active-pill { display: none; }
.bottomnav[data-style="dots"] .nav-item.active { color: var(--brand-ink); }
.bottomnav[data-style="dots"] .nav-item.active::after {
  content: "";
  position: absolute; bottom: 6px; left: 50%;
  width: 6px; height: 6px; border-radius: 50%;
  background: linear-gradient(135deg, var(--brand-blue), var(--brand-green));
  transform: translateX(-50%);
  box-shadow: 0 0 12px rgba(123,171,212,0.6);
}

.bottomnav[data-style="icons"] { height: 72px; }
.bottomnav[data-style="icons"] .nav-item .label { display: none; }
.bottomnav[data-style="icons"] .nav-item svg { width: 26px; height: 26px; }
.bottomnav[data-style="icons"] .nav-active-pill { display: none; }
.bottomnav[data-style="icons"] .nav-item.active {
  color: var(--brand-ink);
}
.bottomnav[data-style="icons"] .nav-item.active::before {
  content: "";
  position: absolute; inset: 6px 12px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(123,171,212,0.22), rgba(125,212,172,0.22));
  z-index: 0;
}

.card {
  background: #fff;
  border: 1px solid rgba(228,236,242,0.7);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}
.card-soft {
  background: linear-gradient(145deg, #ffffff 0%, #f3f7f2 100%);
  border: 1px solid rgba(228,236,242,0.7);
  border-radius: var(--r-lg);
}

.fab {
  position: absolute;
  bottom: 110px; left: 50%; transform: translateX(-50%);
  width: 60px; height: 60px;
  border-radius: 50%;
  border: 0;
  background: linear-gradient(135deg, var(--brand-blue) 0%, var(--brand-green) 100%);
  color: #fff;
  display: grid; place-items: center;
  box-shadow: 0 10px 30px rgba(123,171,212,0.45), 0 4px 12px rgba(125,212,172,0.3);
  cursor: pointer;
  z-index: 20;
  transition: transform var(--dur-base) var(--ease-spring);
}
.fab:hover { transform: translateX(-50%) translateY(-3px) rotate(90deg); }
.fab svg { width: 26px; height: 26px; stroke-width: 2.5; }

.checkbox {
  position: relative;
  width: 26px; height: 26px;
  border-radius: 9px;
  border: 2px solid var(--line-strong);
  background: #fff;
  flex-shrink: 0;
  cursor: pointer;
  transition: all var(--dur-base) var(--ease-out);
  display: grid; place-items: center;
}
.checkbox.checked {
  background: linear-gradient(135deg, var(--brand-blue), var(--brand-green));
  border-color: transparent;
  box-shadow: 0 4px 12px rgba(123,171,212,0.35);
}
.checkbox .tick {
  width: 14px; height: 14px;
  stroke: #fff;
  stroke-width: 3.5;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 22;
  stroke-dashoffset: 22;
  transition: stroke-dashoffset 380ms var(--ease-out);
}
.checkbox.checked .tick { stroke-dashoffset: 0; }

.pri-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.pri-high { background: var(--brand-ink); }
.pri-med  { background: var(--brand-blue); }
.pri-low  { background: var(--brand-lavender); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border-radius: var(--r-pill);
  background: rgba(255,255,255,0.7);
  border: 1px solid rgba(228,236,242,0.9);
  font-size: 12px; font-weight: 600;
  color: var(--fg-2);
  cursor: pointer;
  transition: all var(--dur-base) var(--ease-out);
  white-space: nowrap;
}
.chip.active {
  background: var(--brand-ink);
  color: #fff;
  border-color: var(--brand-ink);
}

.input, .textarea, .select {
  width: 100%;
  border: 1.5px solid var(--line);
  background: #fff;
  border-radius: var(--r-md);
  padding: 14px 16px;
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--brand-ink);
  outline: none;
  transition: border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
  box-shadow: var(--shadow-inset);
  box-sizing: border-box;
}
.input:focus, .textarea:focus, .select:focus {
  border-color: var(--brand-blue);
  box-shadow: 0 0 0 3px rgba(123,171,212,0.18);
}
.textarea { resize: none; min-height: 92px; }
.label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--fg-2);
  margin: 0 4px 8px;
  letter-spacing: 0.01em;
}

.btn-primary {
  width: 100%;
  border: 0;
  padding: 16px;
  border-radius: 20px;
  background: linear-gradient(135deg, #2e4f7a 0%, #1e3a5f 100%);
  color: #fff;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(30,58,95,0.28);
  transition: transform var(--dur-base) var(--ease-spring), box-shadow var(--dur-base) var(--ease-out);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(30,58,95,0.34); }
.btn-primary:active { transform: translateY(0); }
.btn-primary svg { width: 18px; height: 18px; }

.btn-ghost {
  background: transparent; border: 0; color: var(--fg-2);
  font-family: var(--font-body); font-weight: 600; font-size: 14px;
  cursor: pointer; padding: 8px 12px; border-radius: 12px;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background var(--dur-base);
}
.btn-ghost:hover { background: rgba(30,58,95,0.06); }
.btn-ghost svg { width: 16px; height: 16px; }

.tweaks-panel {
  position: fixed;
  bottom: 24px; right: 24px;
  z-index: 100;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(228,236,242,0.9);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 20px 50px rgba(30,58,95,0.18);
  min-width: 260px;
  font-family: var(--font-body);
  display: none;
  animation: screen-in 300ms var(--ease-out);
}
.tweaks-panel.open { display: block; }
.tweaks-panel h6 { margin: 0 0 14px; font-size: 14px; color: var(--brand-ink); font-family: var(--font-body); font-weight: 800;}
.tweak-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.tweak-row:last-child { margin-bottom: 0; }
.tweak-row label { font-size: 11px; color: var(--fg-3); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.tweak-seg {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--bg-3);
  border-radius: 12px;
  padding: 4px;
  gap: 4px;
}
.tweak-seg button {
  border: 0; background: transparent;
  padding: 8px 6px; border-radius: 9px;
  font-family: var(--font-body); font-weight: 600; font-size: 12px;
  color: var(--fg-2); cursor: pointer;
  transition: all var(--dur-base) var(--ease-out);
}
.tweak-seg button.on {
  background: #fff; color: var(--brand-ink);
  box-shadow: 0 2px 6px rgba(30,58,95,0.10);
}

.task-row {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-lg);
}
.task-row .row-actions {
  position: absolute; inset: 0;
  display: flex;
  z-index: 0;
}
.task-row .row-actions .act {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
  font-weight: 700;
  font-size: 14px;
  color: #fff;
}
.task-row .row-actions .act.complete {
  background: linear-gradient(135deg, var(--brand-green) 0%, var(--brand-green-deep) 100%);
}
.task-row .row-actions .act.delete {
  background: linear-gradient(135deg, #f0a0a8 0%, var(--danger) 100%);
}
.task-row .row-actions svg { width: 18px; height: 18px; }

.task-row .row-inner {
  position: relative;
  z-index: 1;
  background: #fff;
  border: 1px solid rgba(228,236,242,0.8);

  const gid = useMemo(() => "g" + Math.random().toString(36).slice(2, 8), []);
  return (
    <div style={{ position: "relative", width: size, height: size }}>

            <stop offset="0%" stopColor={colors[0]} />
            <stop offset="100%" stopColor={colors[1]} />

function SwipeRow({ task, onToggle, onDelete }) {
  const [dx, setDx] = useState(0);
  const [startX, setStartX] = useState(null);
  const [settled, setSettled] = useState(false);

  const MAX = 110;
  const done = task.done;

  const onStart = (x) => { setStartX(x); setSettled(false); };
  const onMove = (x) => {
    if (startX == null) return;
    let d = x - startX;
    d = Math.max(-MAX, Math.min(MAX, d));
    setDx(d);
  };
  const onEnd = () => {
    if (Math.abs(dx) > 60) {
      setDx(dx > 0 ? MAX : -MAX);
      setSettled(true);
    } else {
      setDx(0);
    }
    setStartX(null);
  };

  const c = catOf(task.category);

  return (
    <div className="task-row fade-up">
      <div className="row-actions">
        <div className="act complete" style={{ justifyContent: "flex-start", paddingInlineStart: 20 }}
             onClick={() => { onToggle(task.id); setDx(0); setSettled(false); }}>
          <Icons.Check size={18} /> {done ? "החזר" : "הושלם"}
        </div>
        <div className="act delete" style={{ justifyContent: "flex-end", paddingInlineEnd: 20 }}
             onClick={() => onDelete(task.id)}>
          מחק <Icons.Trash size={18} />
        </div>
      </div>

      <div className="row-inner"
           onMouseDown={(e) => onStart(e.clientX)}
           onMouseMove={(e) => startX != null && onMove(e.clientX)}
           onMouseUp={onEnd}
           onMouseLeave={() => { if (startX != null) onEnd(); }}
           onTouchStart={(e) => onStart(e.touches[0].clientX)}
           onTouchMove={(e) => onMove(e.touches[0].clientX)}
           onTouchEnd={onEnd}
           style={{
             transform: `translateX(${dx}px)`,
             padding: "14px 16px",
             display: "flex", alignItems: "center", gap: 14,
             opacity: done ? 0.55 : 1,
             cursor: "grab",
             userSelect: "none",
           }}>
        <Checkbox checked={done} onChange={() => onToggle(task.id)} />
        <div style={{ width: 3, height: 38, borderRadius: 3, background: c.tint, flexShrink: 0 }} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{
            fontSize: 15, fontWeight: 600, color: "var(--brand-ink)",
            textDecoration: done ? "line-through" : "none",
            lineHeight: 1.35, marginBottom: 4,
          }}>{task.title}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 11, color: "var(--fg-3)", fontWeight: 600 }}>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
              <span className={`pri-dot ${priDotClass(task.priority)}`} />
              {priLabel(task.priority)}
            </span>
            {task.time && (
              <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
                <Icons.Clock size={12} /> {task.time}
              </span>
            )}
            <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
              <Icons.Calendar size={12} /> {task.due}
            </span>
          </div>
        </div>
      </div>
    </div>
  );
}

  ];

  const wrapRef = useRef(null);
  const [pill, setPill] = useState({ left: 0, width: 0 });

  useEffect(() => {
    if (style !== "pill") return;
    const wrap = wrapRef.current;
    if (!wrap) return;
    const idx = items.findIndex(i => i.id === current);
    const btn = wrap.querySelectorAll(".nav-item")[idx];
    if (!btn) return;
    const wrapRect = wrap.getBoundingClientRect();
    const r = btn.getBoundingClientRect();
    setPill({ left: r.left - wrapRect.left, width: r.width });
  }, [current, style]);

  return (
    <div className="bottomnav" data-style={style} ref={wrapRef}>
      {style === "pill" && (
        <div className="nav-active-pill"
             style={{ transform: `translateX(${pill.left}px)`, width: pill.width }} />
      )}
      {items.map((it) => {
        const Ic = Icons[it.icon];
        const active = current === it.id;
        return (
          <button key={it.id}
                  className={`nav-item ${active ? "active" : ""}`}
                  onClick={() => onGo(it.id)}>
            <Ic size={22} stroke={active ? 2.4 : 2} />
            <span className="label">{it.label}</span>
          </button>
        );
      })}
    </div>
  );
}

// ── TweaksPanel ────────────────────────────────────────────────
function TweaksPanel({ tweaks, setTweaks }) {
  const [open, setOpen] = useState(false);

  const update = (patch) => {
    setTweaks(prev => ({ ...prev, ...patch }));
  };

  const Seg = ({ label, value, options, onChange }) => (
    <div className="tweak-row">
      <label>{label}</label>
      <div className="tweak-seg" style={{ gridTemplateColumns: `repeat(${options.length}, 1fr)` }}>
        {options.map(o => (
          <button key={o.id} className={value === o.id ? "on" : ""} onClick={() => onChange(o.id)}>
            {o.label}
          </button>
        ))}
      </div>
    </div>
  );

  return (
    <>
      <button className={`tweaks-toggle ${open ? "hidden" : ""}`} onClick={() => setOpen(true)}>
        <Icons.Sliders size={18} />
      </button>
      <div className={`tweaks-panel ${open ? "open" : ""}`}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <h6 className="app-display" style={{ margin: 0, fontSize: 15 }}>Tweaks</h6>
          <button className="btn-ghost" style={{ padding: 4 }} onClick={() => setOpen(false)}>
            <Icons.X size={16} />
          </button>
        </div>
        <Seg label="סגנון ניווט"
             value={tweaks.navStyle}
             options={[
               { id: "pill",  label: "פיל" },
               { id: "dots",  label: "נקודות" },
               { id: "icons", label: "אייקונים" },
             ]}
             onChange={v => update({ navStyle: v })} />
        <Seg label="פונט כותרות"
             value={tweaks.titleFont}
             options={[
               { id: "playpen", label: "Playpen" },
               { id: "liron",   label: "Liron" },
               { id: "rubik",   label: "Rubik" },
             ]}
             onChange={v => update({ titleFont: v })} />
      </div>
    </>
  );
}

// ── App ────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState("dashboard");
  const [tasks, setTasks] = useState(initialTasks);
  const [tweaks, setTweaks] = useState({ navStyle: "dots", titleFont: "liron" });

  useEffect(() => { document.body.dataset.titleFont = tweaks.titleFont; }, [tweaks.titleFont]);

  const onToggle = (id) => {
    setTasks(ts => ts.map(t => t.id === id ? { ...t, done: !t.done } : t));
  };
  const onDelete = (id) => {
    setTasks(ts => ts.filter(t => t.id !== id));
  };
  const onAdd = (t) => {
    setTasks(ts => [{ id: Date.now(), done: false, ...t }, ...ts]);
  };

  let content = null;
  if (screen === "dashboard") content = <ScreenDashboard tasks={tasks} onToggle={onToggle} goto={setScreen} />;
  else if (screen === "list") content = <ScreenList tasks={tasks} onToggle={onToggle} onDelete={onDelete} goto={setScreen} />;
  else if (screen === "add") content = <ScreenAdd onAdd={onAdd} goto={setScreen} />;
  else if (screen === "profile") content = <ScreenProfile tasks={tasks} goto={setScreen} />;

  return (
    <div className="stage">
      <div className="orb blue" />
      <div className="orb green" />
      <div className="orb lav" />

      <div className="phone" data-screen-label={screen}>
        <StatusBar />
        <div className="screen-viewport" key={screen}>
          {content}
        </div>
        <BottomNav current={screen} onGo={setScreen} style={tweaks.navStyle} />
      </div>

      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
