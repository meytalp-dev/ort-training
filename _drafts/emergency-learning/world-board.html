<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח משימות — רציפות חינוכית בחירום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@500;600;700;800&family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="retzef-motif.css">
<style>
  :root{
    --bg:#f5fafb; --card:#fff; --brand:#0e7c86; --brand-bright:#22b8cf;
    --brand-soft:#e3fafc; --brand-line:#a5e8ef;
    --ink:#173a4a; --ink-soft:#5a7382; --ink-faint:#8ba3ae;
    --line:#e2eef1; --line-strong:#cfe3e8;
    --accent:#0e7c86;
    --shadow:0 1px 2px rgba(23,58,74,.04),0 8px 24px rgba(23,58,74,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Assistant',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Playpen Sans Hebrew','Assistant',sans-serif;margin:0}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 16px 64px}

  .crumbs{font-size:.85rem;color:var(--ink-soft);padding:12px 2px}
  .crumbs a{color:var(--brand);font-weight:600}

  header.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
  .hero .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .badge{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;
    font-family:'Playpen Sans Hebrew';font-weight:800;font-size:1.5rem;color:#fff}
  .hero h1{font-size:1.55rem}
  .hero .user{color:var(--ink-faint);font-size:.85rem;margin-top:2px}
  .hero .goal{color:var(--ink-soft);font-size:.98rem;margin-top:10px;max-width:70ch}
  .prog{margin-inline-start:auto;text-align:center;min-width:96px}
  .prog .pct{font-family:'Playpen Sans Hebrew';font-weight:800;font-size:1.9rem;line-height:1}
  .prog .lbl{color:var(--ink-faint);font-size:.75rem}
  .barwrap{background:var(--line);border-radius:99px;height:9px;overflow:hidden;margin-top:12px}
  .bar{height:100%;border-radius:99px}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
  .toolbar .lbl{font-size:.8rem;color:var(--ink-faint);font-weight:600}
  .pill{border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);
    padding:6px 13px;border-radius:99px;font:600 .82rem 'Assistant';cursor:pointer;transition:.12s}
  .pill:hover{border-color:var(--brand-line)}
  .pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .spacer{flex:1}
  .navworld{display:flex;gap:6px}

  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .col{background:#eef6f8;border:1px solid var(--line);border-radius:18px;padding:12px;min-height:120px}
  .col h2{font-size:1rem;display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:0 4px}
  .col .cnt{background:#fff;border:1px solid var(--line);border-radius:99px;
    font:700 .75rem 'Assistant';padding:1px 9px;color:var(--ink-soft)}
  .dot{width:9px;height:9px;border-radius:99px;display:inline-block}

  .task{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(23,58,74,.04);cursor:pointer;
    transition:transform .1s,box-shadow .1s}
  .task:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .task .tid{font:700 .68rem ui-monospace,monospace;color:var(--ink-faint)}
  .task .tt{font-weight:700;font-size:.96rem;margin:2px 0 4px}
  .task .td{color:var(--ink-soft);font-size:.83rem;line-height:1.45}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center}
  .tag{font:600 .7rem 'Assistant';padding:2px 8px;border-radius:99px}
  .tag.file{background:#eef6f8;color:var(--brand);border:1px solid var(--brand-line)}
  .tag.file:hover{background:var(--brand-soft)}
  .tag.copy{background:var(--brand);color:#fff;border:1px solid var(--brand);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .tag.copy:hover{background:var(--brand-deep,#08666D)}
  .tag.copy.ok{background:#4CAF6A;border-color:#4CAF6A}
  .hint{color:var(--ink-faint);font-size:.75rem;text-align:center;margin:14px 0 0}
  .empty{color:var(--ink-faint);font-size:.85rem;text-align:center;padding:22px 6px}
  .ready{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:.72rem}
  .rchip{padding:2px 9px;border-radius:99px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
  .rchip.ok{background:#ebf8ef;color:#2f9e44;border:1px solid #b9e4c4}
  .rchip.block{background:#fff4e8;color:#c85d1c;border:1px solid #ffd3a8}
  .rchip.col{background:#fff0ee;color:#d9574f;border:1px solid #ffcabf}
  .deps{color:var(--ink-faint);font-size:.7rem;margin-top:5px}
  .task.blocked{opacity:.72}
  .toast{position:fixed;inset-block-end:20px;inset-inline-start:50%;transform:translateX(50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font:600 .85rem 'Assistant';
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:50}
  .toast.show{opacity:1;transform:translateX(50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="crumbs"><a href="worlds-hub.html">מרכז העולמות</a> ‹ <span id="crumbName">…</span></div>

  <header class="hero">
    <div class="row">
      <div class="badge" id="badge">–</div>
      <div>
        <h1 class="rz-ambient" id="wName">…</h1>
        <div class="user" id="wUser"></div>
      </div>
      <div class="prog">
        <div class="pct" id="wPct">0%</div>
        <div class="lbl">התקדמות</div>
      </div>
    </div>
    <div class="goal" id="wGoal"></div>
    <div class="barwrap"><div class="bar" id="wBar" style="width:0%"></div></div>
  </header>

  <div class="toolbar">
    <span class="lbl">גל:</span>
    <button class="pill on" data-phase="all">הכול</button>
    <button class="pill" data-phase="mvpA">גל A — חירום</button>
    <button class="pill" data-phase="mvpB">גל B — שגרה</button>
    <button class="pill" data-phase="later">דחוי</button>
    <span style="width:10px"></span>
    <button class="pill" id="readyToggle">● רק מוכנות להקצאה</button>
    <button class="pill" id="resetOverrides" title="מנקה סטטוסים ששמורים בדפדפן ומסנכרן לקובץ tasks-data.js">🔄 אפס לסטטוס מהקובץ</button>
    <span class="spacer"></span>
    <span class="navworld" id="navworld"></span>
  </div>

  <div class="cols">
    <section class="col"><h2><span class="dot" style="background:#94a3b8"></span>לביצוע <span class="cnt" id="cnt-todo">0</span></h2><div id="col-todo"></div></section>
    <section class="col"><h2><span class="dot" style="background:#1c7ed6"></span>בתהליך <span class="cnt" id="cnt-doing">0</span></h2><div id="col-doing"></div></section>
    <section class="col"><h2><span class="dot" style="background:#2f9e44"></span>הושלם <span class="cnt" id="cnt-done">0</span></h2><div id="col-done"></div></section>
  </div>

  <p class="hint">לחיצה על משימה מקדמת אותה: לביצוע ← בתהליך ← הושלם ← לביצוע. "העתק פרומפט" מעתיק פרומפט מוכן לסוכן המשימה (עם תחילית+סיומת). הסטטוס נשמר במכשיר שלך.</p>
</div>
<div class="toast" id="toast">הפרומפט הועתק ✓</div>

<script src="tasks-data.js"></script>
<script>
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function qp(k){return new URLSearchParams(location.search).get(k)}
  var LSKEY='rachefut_task_status_v1';

  var worldId = parseInt(qp('world'),10); if(isNaN(worldId)) worldId=1;
  var world = window.WORLDS.filter(function(w){return w.id===worldId})[0] || window.WORLDS[1];
  var phaseFilter='all';
  var readyOnly=false;

  // persistence
  function loadOverrides(){try{return JSON.parse(localStorage.getItem(LSKEY))||{}}catch(e){return{}}}
  function saveOverride(id,st){var o=loadOverrides();o[id]=st;localStorage.setItem(LSKEY,JSON.stringify(o))}
  function statusOf(t){var o=loadOverrides();return o[t.id]||t.status}
  function statusById(id){var t=window.TASKS.filter(function(x){return x.id===id})[0];return t?statusOf(t):'todo'}
  function unmetOf(id){return window.depsOf(id).filter(function(d){return statusById(d)!=='done'})}
  function isReady(id){return unmetOf(id).length===0}

  document.documentElement.style.setProperty('--accent', world.color);
  document.getElementById('badge').textContent=world.num;
  document.getElementById('badge').style.background=world.color;
  document.getElementById('wName').textContent=world.name;
  document.getElementById('crumbName').textContent=world.name;
  document.getElementById('wUser').textContent=world.user;
  document.getElementById('wGoal').textContent=world.goal;
  document.title='לוח משימות — '+world.name;

  // world nav (prev/next)
  var ids=window.WORLDS.map(function(w){return w.id});
  var idx=ids.indexOf(worldId);
  var prev=window.WORLDS[(idx-1+ids.length)%ids.length];
  var next=window.WORLDS[(idx+1)%ids.length];
  document.getElementById('navworld').innerHTML=
    '<a class="pill" href="world-board.html?world='+next.id+'">‹ '+esc(next.name)+'</a>'+
    '<a class="pill" href="world-board.html?world='+prev.id+'">'+esc(prev.name)+' ›</a>';

  // phase filter buttons
  Array.prototype.forEach.call(document.querySelectorAll('[data-phase]'),function(b){
    b.addEventListener('click',function(){
      phaseFilter=b.getAttribute('data-phase');
      document.querySelectorAll('[data-phase]').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      render();
    });
  });
  // ready-only toggle
  document.getElementById('readyToggle').addEventListener('click',function(){
    readyOnly=!readyOnly; this.classList.toggle('on',readyOnly); render();
  });
  // reset local overrides → sync board to tasks-data.js (the source of truth)
  document.getElementById('resetOverrides').addEventListener('click',function(){
    if(!confirm('לנקות את כל הסטטוסים ששמורים בדפדפן ולחזור לסטטוס מהקובץ tasks-data.js?')) return;
    localStorage.removeItem(LSKEY); render(); showToast('סונכרן לסטטוס מהקובץ ✓');
  });

  var toastTimer;
  function showToast(msg){
    var el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){el.classList.remove('show')},1600);
  }
  function copyPrompt(ev,id){
    ev.stopPropagation();
    var t=window.TASKS.filter(function(x){return x.id===id})[0];
    if(!t) return;
    var text=window.fullPrompt(t);
    var btn=ev.currentTarget;
    function done(){ btn.classList.add('ok'); btn.textContent='✓ הועתק'; showToast('הפרומפט של '+id+' הועתק ✓');
      setTimeout(function(){btn.classList.remove('ok'); btn.textContent='⧉ העתק פרומפט'},1600); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done,function(){fallback(text);done()});
    } else { fallback(text); done(); }
  }
  function fallback(text){
    var ta=document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy')}catch(e){} document.body.removeChild(ta);
  }

  function cycle(id){
    var order=['todo','doing','done'];
    var t=window.TASKS.filter(function(x){return x.id===id})[0];
    var cur=statusOf(t);
    var nx=order[(order.indexOf(cur)+1)%order.length];
    saveOverride(id,nx);
    render();
  }

  function taskCard(t){
    var c=window.CATEGORIES[t.cat]||{label:t.cat,color:'#888'};
    var ph=window.PHASES[t.phase]||{label:t.phase,color:'#888'};
    var fileTag = t.file ? '<a class="tag file" href="'+esc(t.file)+'" onclick="event.stopPropagation()">'+esc(t.file)+'</a>' : '';
    var copyTag = '<button class="tag copy" onclick="copyPrompt(event,\''+t.id+'\')">⧉ העתק פרומפט</button>';
    // readiness
    var st=statusOf(t), unmet=unmetOf(t.id), allDeps=window.depsOf(t.id), sf=window.sharedFile(t.id);
    var rrow='';
    if(st!=='done'){
      if(unmet.length===0){
        rrow += '<span class="rchip ok">● מוכן להקצאה</span>';
      } else {
        rrow += '<span class="rchip block">⛔ חסום: '+unmet.map(esc).join(', ')+'</span>';
      }
    }
    if(sf.length){ rrow += '<span class="rchip col">⚠ קובץ משותף: '+sf.map(esc).join(', ')+'</span>'; }
    var readyRow = rrow ? '<div class="ready">'+rrow+'</div>' : '';
    var depsLine = allDeps.length ? '<div class="deps">תלוי ב: '+allDeps.map(esc).join(' · ')+'</div>' : '';
    var blockedCls = (st!=='done' && unmet.length) ? ' blocked' : '';
    return '<div class="task'+blockedCls+'" role="button" tabindex="0" aria-label="'+esc(t.id)+' — קידום סטטוס" onclick="cycle(\''+t.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();cycle(\''+t.id+'\')}">'+
      '<div class="tid">'+esc(t.id)+'</div>'+
      '<div class="tt">'+esc(t.title)+'</div>'+
      '<div class="td">'+esc(t.desc)+'</div>'+
      readyRow + depsLine +
      '<div class="tags">'+
        '<span class="tag" style="background:'+c.color+'22;color:'+c.color+'">'+esc(c.label)+'</span>'+
        '<span class="tag" style="background:'+ph.color+'22;color:'+ph.color+'">'+esc(ph.label)+'</span>'+
        fileTag+ copyTag+
      '</div>'+
    '</div>';
  }

  function render(){
    var tasks=window.tasksByWorld(worldId).filter(function(t){
      if(phaseFilter!=='all' && t.phase!==phaseFilter) return false;
      if(readyOnly && (statusOf(t)==='done' || !isReady(t.id))) return false;
      return true;
    });
    var buckets={todo:[],doing:[],done:[]};
    tasks.forEach(function(t){buckets[statusOf(t)].push(t)});

    ['todo','doing','done'].forEach(function(k){
      var col=document.getElementById('col-'+k);
      col.innerHTML = buckets[k].length ? buckets[k].map(taskCard).join('') : '<div class="empty">אין משימות</div>';
      document.getElementById('cnt-'+k).textContent=buckets[k].length;
    });

    // progress from current (overridden) statuses
    var all=window.tasksByWorld(worldId);
    var done=0,doing=0;
    all.forEach(function(t){var s=statusOf(t);if(s==='done')done++;else if(s==='doing')doing++;});
    var pct = all.length ? Math.round(((done+doing*0.5)/all.length)*100) : 0;
    document.getElementById('wPct').textContent=pct+'%';
    document.getElementById('wPct').style.color=world.color;
    var bar=document.getElementById('wBar');
    bar.style.width=pct+'%'; bar.style.background=world.color;
  }

  render();
</script>
</body>
</html>
