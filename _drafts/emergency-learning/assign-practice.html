<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רֶצֶף — הקצאת תרגול</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0B8F98; --teal-deep:#086b72; --teal-soft:#e6f4f5;
    --ink:#1a2b2d; --muted:#5b7377; --line:#d9e6e7; --bg:#f4f9f9; --card:#fff;
    --green:#1a9e6a; --green-soft:#e5f6ee; --amber:#E8722C; --amber-soft:#fdeee3; --purple:#7c5cbf;
    --shadow:0 2px 8px rgba(11,143,152,.07), 0 10px 30px rgba(11,143,152,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Heebo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:760px;margin:0 auto;padding:24px 20px 80px}
  .retzef-line{height:3px;background:linear-gradient(90deg,var(--teal),transparent);border-radius:2px}
  h1{font-size:23px;font-weight:800;margin:12px 0 2px}
  .sub{color:var(--muted);margin:0 0 16px;font-size:15px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-top:14px}
  label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 8px}
  label.f:first-child{margin-top:0}
  select{width:100%;font-family:inherit;font-size:15px;padding:12px 13px;border-radius:11px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
  select:focus{outline:none;border-color:var(--teal)}
  .ctx{background:var(--teal-soft);border-radius:11px;padding:11px 14px;font-size:13px;color:var(--teal-deep);margin-top:12px}

  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
  @media(max-width:560px){.modes{grid-template-columns:1fr}}
  .mode{border:1.5px solid var(--line);border-radius:13px;padding:14px;cursor:pointer;transition:.13s;background:#fff}
  .mode:hover{border-color:var(--teal)}
  .mode.on{border-color:var(--teal);background:var(--teal-soft)}
  .mode .mi{font-size:20px}
  .mode .mt{font-weight:800;font-size:15px;margin-top:4px}
  .mode .md{font-size:12px;color:var(--muted);margin-top:2px}

  .preview{margin-top:16px}
  .preview h3{font-size:15px;margin:0 0 4px}
  .preview .pn{color:var(--muted);font-size:13px;margin:0 0 12px}
  .lvlrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:14px;background:#fbfdfd}
  .lvlrow .av{width:26px;height:26px;border-radius:50%;background:var(--teal-soft);color:var(--teal-deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
  .lvl{margin-inline-start:auto;font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px}
  .lvl.with{background:var(--amber-soft);color:#a8501a}
  .lvl.own{background:var(--teal-soft);color:var(--teal-deep)}
  .lvl.ahead{background:var(--green-soft);color:#0f7a4f}
  .why{font-size:11px;color:var(--muted);margin-inline-start:6px;font-weight:400}
  .clusters{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .cl{border-radius:11px;padding:12px 14px;flex:1;min-width:130px}
  .cl b{display:block;font-size:22px;font-weight:800}
  .cl.a{background:var(--amber-soft);color:#a8501a} .cl.b{background:var(--teal-soft);color:var(--teal-deep)} .cl.c{background:var(--green-soft);color:#0f7a4f}
  .approve-note{font-size:12.5px;color:var(--teal-deep);background:var(--teal-soft);border-radius:10px;padding:10px 12px;margin-top:12px}

  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{border:1.5px solid var(--line);border-radius:10px;padding:9px 15px;cursor:pointer;font-size:14px;font-weight:600;background:#fff}
  .pill.on{background:var(--teal);color:#fff;border-color:var(--teal)}

  .sendbtn{width:100%;margin-top:20px;background:var(--teal);color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
  .sendbtn:hover{background:var(--teal-deep)}
  .done{margin-top:16px;background:var(--green-soft);border:1px solid #c6ead9;border-radius:14px;padding:18px;display:none;text-align:center}
  .done.on{display:block}
  .done b{color:var(--green);font-size:17px}
</style>
</head>
<body>
<div class="wrap">
  <div class="retzef-line"></div>
  <h1>הקצאת תרגול</h1>
  <p class="sub">מקצים ל<b>קבוצת לימוד</b> (הציר האקדמי). <b>המערכת מציעה, את מאשרת.</b></p>

  <div class="card">
    <label class="f">קבוצת לימוד</label>
    <select id="group"></select>
    <div class="ctx" id="ctx"></div>

    <label class="f">נושא / יחידה</label>
    <select id="unit"></select>

    <label class="f">איך להקצות?</label>
    <div class="modes" id="modes">
      <div class="mode on" data-m="auto" onclick="pickMode(this)"><div class="mi">⚙️</div><div class="mt">אוטומטי</div><div class="md">רמה מתאימה לכל תלמיד</div></div>
      <div class="mode" data-m="cluster" onclick="pickMode(this)"><div class="mi">👥</div><div class="mt">קבוצתי</div><div class="md">לפי מצבי-רגע</div></div>
      <div class="mode" data-m="manual" onclick="pickMode(this)"><div class="mi">✍️</div><div class="mt">ידני</div><div class="md">רמה אחת לכולם</div></div>
    </div>

    <div id="modeBody" class="preview"></div>

    <label class="f">משך</label>
    <div class="pills" id="dur"></div>

    <label class="f">מתי</label>
    <div class="pills" id="when"></div>

    <button class="sendbtn" onclick="send()">שלח הקצאה</button>
    <div class="done" id="done"></div>
  </div>
</div>

<script src="seed-pilot.js"></script>
<script>
const SEED=window.PILOT_SEED;
const initials=n=>(n||'?').trim().charAt(0);
let MODE='auto', DUR='לפי קצב', WHEN='היום', manualLevel='own';

const LEVELS={with:{t:'איתך',c:'with'},own:{t:'לבד',c:'own'},ahead:{t:'קדימה',c:'ahead'}};

// רמה מתאימה לפי סימני-הרגע של ההגשה האחרונה (לא תווית קבועה!)
function suggestLevel(studentId){
  const subs=SEED.submissions.filter(s=>s.student_id===studentId).sort((a,b)=>(b.completed_at||'').localeCompare(a.completed_at||''));
  const last=subs[0];
  if(!last) return {level:'own', why:'ברירת מחדל (אין ביצוע קודם)'};
  if(last.support_level==='with_you' || (last.hint_used && !last.recovered_after_error))
    return {level:'with', why:'נעזר ברמז / התקשה'};
  if(last.mastery==='full' && !last.hint_used)
    return {level:'ahead', why:'שלט בליבה+הרחבה בלי רמז'};
  return {level:'own', why:'עבד בקצב, התאושש מטעות'};
}

function initGroups(){
  document.getElementById('group').innerHTML=SEED.learningGroups.map(g=>`<option value="${g.id}">${g.name}</option>`).join('');
  document.getElementById('group').addEventListener('change',()=>{syncCtx();renderMode();});
  document.getElementById('dur').innerHTML=['10 דק׳','15 דק׳','לפי קצב'].map(d=>`<span class="pill ${d===DUR?'on':''}" onclick="pick('dur',this,'${d}')">${d}</span>`).join('');
  document.getElementById('when').innerHTML=['היום','מחר','השבוע'].map(d=>`<span class="pill ${d===WHEN?'on':''}" onclick="pick('when',this,'${d}')">${d}</span>`).join('');
  syncCtx(); renderMode();
}
function pick(kind,el,v){ el.parentElement.querySelectorAll('.pill').forEach(p=>p.classList.remove('on')); el.classList.add('on'); if(kind==='dur')DUR=v; else WHEN=v; }
function curGroup(){ return SEED.learningGroups.find(g=>g.id===document.getElementById('group').value); }
function syncCtx(){
  const g=curGroup(), t=SEED.staffMembers.find(m=>m.id===g.teacher_id), n=SEED.helpers.studentsOfGroup(g.id).length;
  document.getElementById('ctx').innerHTML=`מורה: <b>${t.first_name}</b> · ${g.subject} · <b>${n}</b> תלמידים`;
  const units=SEED.contentUnits.filter(u=>u.subject===g.subject); const list=units.length?units:SEED.contentUnits;
  document.getElementById('unit').innerHTML=list.map(u=>`<option>${u.title}</option>`).join('');
}
function pickMode(el){ document.querySelectorAll('.mode').forEach(m=>m.classList.remove('on')); el.classList.add('on'); MODE=el.dataset.m; renderMode(); }

function renderMode(){
  const g=curGroup(); const roster=SEED.helpers.studentsOfGroup(g.id);
  const box=document.getElementById('modeBody');
  if(MODE==='auto'){
    const rows=roster.map(s=>{ const {level,why}=suggestLevel(s.id); const L=LEVELS[level];
      return `<div class="lvlrow"><span class="av">${initials(s.first_name)}</span>${s.first_name}
        <span class="lvl ${L.c}">${L.t}<span class="why">· ${why}</span></span></div>`;
    }).join('');
    box.innerHTML=`<h3>תצוגה מקדימה — רמה לכל תלמיד</h3>
      <p class="pn">נגזר מסימני-הרגע של ההגשה האחרונה. אפשר לשנות ידנית לפני שליחה.</p>${rows}
      <div class="approve-note">✓ המערכת הציעה. בלחיצה על "שלח" — <b>את מאשרת</b>.</div>`;
  } else if(MODE==='cluster'){
    // חלוקה לפי סימני-רגע
    let a=0,b=0,c=0; roster.forEach(s=>{const l=suggestLevel(s.id).level; if(l==='with')a++;else if(l==='ahead')c++;else b++;});
    box.innerHTML=`<h3>קיבוץ לפי מצבי-רגע</h3><p class="pn">כל מצב מקבל את הרמה הכתובה מראש המתאימה.</p>
      <div class="clusters"><div class="cl a"><b>${a}</b>זקוקים לתיווך → "איתך"</div>
        <div class="cl b"><b>${b}</b>מתרגלים → "לבד"</div>
        <div class="cl c"><b>${c}</b>מוכנים → "קדימה"</div></div>
      <div class="approve-note">המערכת מציעה את החלוקה — את מאשרת או משנה.</div>`;
  } else {
    box.innerHTML=`<h3>רמה אחת לכל הקבוצה</h3><p class="pn">בחרי את הרמה שכולם יקבלו.</p>
      <div class="pills">${Object.entries(LEVELS).map(([k,l])=>`<span class="pill ${k===manualLevel?'on':''}" onclick="setManual('${k}')">${l.t}</span>`).join('')}</div>`;
  }
}
function setManual(k){ manualLevel=k; renderMode(); }

function send(){
  const g=curGroup(); const n=SEED.helpers.studentsOfGroup(g.id).length;
  const modeText={auto:'רמה מותאמת לכל תלמיד',cluster:'לפי מצבי-רגע',manual:'רמה '+LEVELS[manualLevel].t+' לכולם'}[MODE];
  const d=document.getElementById('done');
  d.innerHTML=`<b>ההקצאה נשלחה ✓</b><br>${document.getElementById('unit').value} · <b>${n} תלמידים</b> בקבוצת ${g.name}<br>
    <span style="color:var(--muted);font-size:13px">${modeText} · ${DUR} · ${WHEN}</span>`;
  d.classList.add('on'); d.scrollIntoView({behavior:'smooth',block:'center'});
}
initGroups();
</script>
</body>
</html>
