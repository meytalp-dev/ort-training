<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אדמין תוכן · רֶצֶף · פנימי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css?v=2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M30 16h-4.5' stroke='%2391A5AE' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M7.5 16H2' stroke='%230B8F98' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23fff' stroke='%230B8F98' stroke-width='4'/%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font-body,'Assistant',sans-serif);background:var(--bg,#F6F8F9);color:var(--ink,#22333B);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1140px;margin:0 auto;padding:18px 18px 90px}
  a{color:inherit}
  /* ---- כותרת ---- */
  .head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:6px}
  .mark{width:58px;height:16px}
  .head b{font-family:var(--font-head,'Heebo',sans-serif);font-weight:900;font-size:19px;color:var(--ink-strong,#12252E)}
  .pill{font-size:11px;font-weight:700;color:#A61E64;background:#FDEDF4;border:1px solid #F3C6DA;padding:2px 10px;border-radius:999px}
  h1{font-family:var(--font-head,'Heebo',sans-serif);font-size:22px;font-weight:800;color:var(--ink-strong,#12252E);letter-spacing:-.01em;margin-top:8px}
  .sub{color:var(--ink-soft,#5A6B72);font-size:13.5px;margin-top:2px}
  /* ---- טאבים ---- */
  .tabs{display:flex;gap:5px;flex-wrap:wrap;margin:18px 0 6px;border-bottom:1px solid var(--line,#E1E8EA)}
  .tabs button{font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink-soft,#5A6B72);background:none;border:none;border-bottom:2.5px solid transparent;padding:10px 14px;cursor:pointer;transition:.14s;display:flex;align-items:center;gap:7px;margin-bottom:-1px}
  .tabs button:hover{color:var(--ink-strong,#12252E)}
  .tabs button[aria-selected="true"]{color:var(--brand,#0B8F98);border-bottom-color:var(--brand,#0B8F98)}
  .tabs .tnum{font-size:11px;font-weight:800;background:var(--surface-muted,#EDF1F2);color:var(--ink-soft,#5A6B72);width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
  .tabs button[aria-selected="true"] .tnum{background:var(--brand,#0B8F98);color:#fff}
  /* ---- כללי ---- */
  .bar{background:var(--card,#fff);border:1px solid var(--line,#E1E8EA);border-radius:12px;padding:14px 16px;margin:14px 0;display:flex;gap:22px;flex-wrap:wrap;align-items:center}
  .kpi .n{font-family:var(--font-head,'Heebo',sans-serif);font-size:24px;font-weight:900;color:var(--brand,#0B8F98);font-variant-numeric:tabular-nums;line-height:1}
  .kpi .k{font-size:11.5px;color:var(--ink-soft,#5A6B72);margin-top:3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
  .card{background:var(--card,#fff);border:1px solid var(--line,#E1E8EA);border-radius:13px;padding:15px;cursor:pointer;transition:.15s;text-align:right;font-family:inherit;display:flex;flex-direction:column;gap:8px}
  .card:hover{border-color:var(--brand-line,#9FD9DD);box-shadow:0 8px 22px -13px rgba(11,143,152,.4);transform:translateY(-2px)}
  .card.dim{opacity:.72;cursor:default}
  .card.dim:hover{transform:none;box-shadow:none;border-color:var(--line,#E1E8EA)}
  .ctop{display:flex;align-items:center;gap:8px}
  .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
  .cname{font-family:var(--font-head,'Heebo',sans-serif);font-size:16px;font-weight:800;color:var(--ink-strong,#12252E)}
  .cmeta{font-size:12px;color:var(--ink-soft,#5A6B72);display:flex;gap:10px;flex-wrap:wrap}
  .track{height:7px;border-radius:4px;background:var(--surface-muted,#EDF1F2);overflow:hidden;margin-top:2px}
  .track i{display:block;height:100%;background:var(--brand,#0B8F98);border-radius:4px}
  .chip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .chip.ok{color:#2E7D46;background:#E8F6EC}.chip.warn{color:#8a5a00;background:#FBF3DE}
  .chip.wait{color:#5A6B72;background:#EDF1F2}.chip.rev{color:#0B7A84;background:#E1F4F5}
  .chip.sector-he{color:#1F5FB0;background:#E8F0FC}.chip.sector-ar{color:#8A4B12;background:#FBF0E5}
  /* ---- מבט-מקצוע ---- */
  .back{font-family:inherit;font-size:13px;font-weight:700;color:var(--brand,#0B8F98);background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:6px 0;margin-bottom:6px}
  .modhead{display:flex;align-items:center;gap:11px;margin:16px 0 12px}
  .modhead .dot{width:16px;height:16px}
  .modhead h2{font-family:var(--font-head,'Heebo',sans-serif);font-size:20px;font-weight:800;color:var(--ink-strong,#12252E)}
  details.mod{background:var(--card,#fff);border:1px solid var(--line,#E1E8EA);border-radius:12px;margin-bottom:10px;overflow:hidden}
  details.mod[open]{border-color:var(--brand-line,#9FD9DD)}
  details.mod>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:11px}
  details.mod>summary::-webkit-details-marker{display:none}
  .modn{font-family:var(--font-head,'Heebo',sans-serif);font-size:12px;font-weight:800;color:#fff;background:var(--ink-soft,#5A6B72);min-width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex-shrink:0}
  .modt{font-family:var(--font-head,'Heebo',sans-serif);font-weight:800;font-size:15px;color:var(--ink-strong,#12252E);flex:1}
  .modmeta{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .modbody{padding:2px 16px 16px;border-top:1px solid var(--line,#E1E8EA)}
  .intern{background:#FCFBF6;border:1px solid #EDE6CF;border-radius:10px;padding:11px 13px;margin:12px 0;font-size:12.5px}
  .intern .lab{font-weight:800;color:#8a5a00;font-size:11px;letter-spacing:.02em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .skills{display:flex;gap:5px;flex-wrap:wrap}
  .skill{font-size:11.5px;font-weight:600;color:#5f4a12;background:#F7F0DC;border-radius:6px;padding:3px 9px}
  .kv{color:var(--ink-soft,#5A6B72);margin-top:7px;line-height:1.5}
  .kv b{color:var(--ink-strong,#12252E)}
  .units{margin-top:12px}
  .unit{display:flex;align-items:center;gap:11px;padding:9px 4px;border-top:1px solid var(--line,#E1E8EA)}
  .unit:first-child{border-top:none}
  .uord{font-family:var(--font-head,'Heebo',sans-serif);font-weight:800;font-size:12px;color:var(--ink-faint,#8A9AA0);min-width:20px;font-variant-numeric:tabular-nums}
  .utitle{font-weight:600;font-size:14px;color:var(--ink-strong,#12252E);flex:1}
  .utitle .ui{display:block;font-weight:400;font-size:11.5px;color:var(--ink-soft,#5A6B72);margin-top:1px}
  .lv{display:inline-flex;gap:3px}.lv i{width:8px;height:8px;border-radius:50%}
  .open{font-size:12px;font-weight:700;color:var(--brand,#0B8F98);text-decoration:none;border:1px solid transparent;border-radius:7px;padding:5px 10px;white-space:nowrap}
  .unit:hover .open{border-color:var(--brand-line,#9FD9DD);background:#E8F8F9}
  .empty{color:var(--ink-faint,#8A9AA0);font-size:12.5px;font-style:italic;padding:10px 4px}
  .missing{background:#FBEBEA;border:1px solid #F0C3BF;color:#a33;border-radius:8px;padding:8px 11px;font-size:12px;margin-top:10px}
  /* ---- טבלאות (שכבות/בתי-ספר/תפקידים) ---- */
  .note{background:#FBF3DE;border:1px solid #EBD59A;color:#7a5a12;border-radius:10px;padding:11px 15px;font-size:12.5px;margin:14px 0;line-height:1.55}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px;align-items:center}
  .toolbar input,.toolbar select{font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--line,#E1E8EA);border-radius:9px;background:var(--card,#fff);color:var(--ink)}
  .toolbar .fbtn{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink-soft,#5A6B72);background:var(--card,#fff);border:1px solid var(--line,#E1E8EA);border-radius:999px;padding:7px 13px;cursor:pointer}
  .toolbar .fbtn[aria-pressed="true"]{background:var(--brand,#0B8F98);color:#fff;border-color:var(--brand,#0B8F98)}
  table{width:100%;border-collapse:collapse;background:var(--card,#fff);border:1px solid var(--line,#E1E8EA);border-radius:12px;overflow:hidden;margin-top:12px}
  th,td{text-align:right;padding:11px 13px;font-size:13px;border-top:1px solid var(--line,#E1E8EA)}
  th{background:var(--surface-muted,#EDF1F2);font-weight:800;color:var(--ink-strong,#12252E);font-size:12px;border-top:none;position:sticky;top:0}
  tr:hover td{background:var(--bg-soft,#FAFCFC)}
  .scroll{overflow-x:auto}
  .rolecard{background:var(--card,#fff);border:1px solid var(--line,#E1E8EA);border-radius:13px;padding:16px;margin-bottom:12px}
  .rolecard h3{font-family:var(--font-head,'Heebo',sans-serif);font-size:16px;font-weight:800;color:var(--ink-strong,#12252E);display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .rolecard .who{font-size:12.5px;color:var(--ink-soft,#5A6B72);margin-bottom:11px}
  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  @media(max-width:640px){.rgrid{grid-template-columns:1fr}}
  .rbox{background:var(--bg,#F6F8F9);border-radius:10px;padding:12px 13px}
  .rbox .rt{font-size:11px;font-weight:800;color:var(--brand,#0B8F98);letter-spacing:.02em;margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .rbox ul{margin:0;padding-inline-start:17px}
  .rbox li{font-size:12.5px;color:var(--ink,#22333B);margin:4px 0;line-height:1.45}
  svg.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <svg class="mark" viewBox="0 0 76 20" fill="none" aria-hidden="true">
      <path d="M73 10h-6" stroke="#91A5AE" stroke-width="3.6" stroke-linecap="round"/><path d="M60 10h-4.5" stroke="#91A5AE" stroke-width="3.1" stroke-linecap="round"/><path d="M49 10h-2.5" stroke="#91A5AE" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="35" cy="10" r="6" fill="#fff" stroke="#0B8F98" stroke-width="3.6"/><path d="M28 10H3" stroke="#0B8F98" stroke-width="3.6" stroke-linecap="round"/>
    </svg>
    <b>רֶצֶף</b>
    <span class="pill">אדמין · פנימי בלבד</span>
  </div>
  <h1>מערכת ניהול תוכן</h1>
  <p class="sub">כלי-הסדר שלנו. מודולות וכשירויות מוצגות כאן — הן <b>לא</b> מופיעות באתר-המורה.</p>

  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="view"></div>
</div>

<script src="admin-data.js"></script>
<script>
  var A = window.ADMIN || {meta:{},subjects:[],schools:[],tracks:[]};
  var $ = function(s,r){return (r||document).querySelector(s);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
  var LVC={basic:'#2E7D46',standard:'#2F6FED',advanced:'#A61E64'};
  var SUBJ_COLOR={'עברית':'#C99A2E','מתמטיקה':'#2F6FED','עיצוב מדיה':'#A61E64','עיצוב שיער':'#0B8F98','לוגיסטיקה':'#6B4EA6','מערכות ICT':'#0E7C86','כדורגל':'#2E7D46','קונדיטוריה':'#C56A16','עיצוב טקסטיל':'#B03A6E','ניהול פיננסי':'#1F7A5A','ריתוך':'#B5651A'};
  function subjColor(he){return SUBJ_COLOR[he]||'#0B8F98';}

  var TABS=[
    {k:'subjects', n:1, t:'מקצועות'},
    {k:'grades',   n:2, t:'לפי שכבה'},
    {k:'schools',  n:3, t:'בתי-ספר'},
    {k:'roles',    n:4, t:'מסכי-תפקידים'},
    {k:'qa',       n:5, t:'QA יחידות'}
  ];
  var state={tab:'subjects', subject:null};

  function renderTabs(){
    $('#tabs').innerHTML = TABS.map(function(t){
      return '<button role="tab" data-k="'+t.k+'" aria-selected="'+(state.tab===t.k)+'"><span class="tnum">'+t.n+'</span>'+t.t+'</button>';
    }).join('');
  }
  $('#tabs').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    state.tab=b.dataset.k; state.subject=null; render();
  });

  /* ============ טאב 1 — מקצועות ============ */
  function viewSubjects(){
    if(state.subject) return viewSubjectDetail(state.subject);
    var m=A.meta;
    var built=A.subjects.filter(function(s){return s.built;});
    var plannedOnly=A.subjects.filter(function(s){return !s.built;});
    var html='<div class="bar">'+
      kpi(m.builtSubjects+'/'+m.plannedSubjects,'מקצועות עם תוכן')+
      kpi(m.builtUnits,'יחידות בנויות')+
      kpi(m.plannedModules,'מודולות מתוכננות')+
      '</div>';
    html+='<div class="grid">'+built.map(subjCard).join('')+'</div>';
    html+='<h1 style="font-size:16px;margin-top:26px">ממתינים להפקה — יש תכנית, אין עדיין תוכן</h1>';
    html+='<div class="grid">'+plannedOnly.map(subjCard).join('')+'</div>';
    var v=el('<div>'+html+'</div>');
    v.addEventListener('click',function(e){
      var c=e.target.closest('[data-subj]'); if(!c||c.classList.contains('dim'))return;
      state.subject=c.dataset.subj; render(); window.scrollTo(0,0);
    });
    return v;
  }
  function subjCard(s){
    var col=subjColor(s.he);
    var cov = s.plannedModuleCount? Math.round(s.builtModuleCount/s.plannedModuleCount*100):(s.built?100:0);
    var dim = s.built?'':' dim';
    return '<button class="card'+dim+'" data-subj="'+esc(s.key)+'" '+(s.built?'':'disabled')+' style="cursor:'+(s.built?'pointer':'default')+'">'+
      '<div class="ctop"><span class="dot" style="background:'+col+'"></span><span class="cname">'+esc(s.he)+'</span></div>'+
      '<div class="cmeta"><span>'+(s.unitCount||0)+' יחידות</span><span>'+s.builtModuleCount+'/'+(s.plannedModuleCount||s.moduleCount)+' מודולות</span></div>'+
      '<div class="track"><i style="width:'+cov+'%;background:'+col+'"></i></div>'+
      (s.unverified?'<span class="chip warn" style="align-self:flex-start"><svg class="ic" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>'+s.unverified+' לאימות</span>':(s.built?'<span class="chip ok" style="align-self:flex-start">תוכן קיים</span>':'<span class="chip wait" style="align-self:flex-start">ממתין להפקה</span>')+'')+
    '</button>';
  }
  function viewSubjectDetail(key){
    var s=A.subjects.find(function(x){return x.key===key;}); if(!s)return el('<div>לא נמצא</div>');
    var col=subjColor(s.he);
    var html='<button class="back" id="back"><svg class="ic" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>כל המקצועות</button>';
    html+='<div class="modhead"><span class="dot" style="background:'+col+'"></span><h2>'+esc(s.he)+'</h2>'+
      '<span class="chip wait">'+s.unitCount+' יחידות · '+s.builtModuleCount+'/'+(s.plannedModuleCount||s.moduleCount)+' מודולות</span></div>';
    html+=s.modules.map(function(mod){return modBlock(mod,col);}).join('');
    var v=el('<div>'+html+'</div>');
    $('#back',v)&&$('#back',v).addEventListener('click',function(){state.subject=null;render();window.scrollTo(0,0);});
    return v;
  }
  function modBlock(mod,col){
    var stage = mod.stage==='reviewed'?'<span class="chip rev">נבדק</span>':mod.stage==='built'?'<span class="chip ok">טיוטה</span>':'';
    var cov = mod.builtCount? '<span class="chip ok">'+mod.builtCount+' יחידות</span>' : '<span class="chip wait">אין תוכן</span>';
    var open = mod.builtCount>0;
    var skills = (mod.skills||[]).map(function(k){return '<span class="skill">'+esc(k)+'</span>';}).join('');
    var units = mod.units.length ? mod.units.map(unitRow).join('') :
      '<div class="empty">מודולה מתוכננת — טרם הופקו יחידות ('+mod.plannedKnowledge+' פריטי-ידע בתכנית).</div>';
    var gap = (mod.plannedKnowledge>mod.builtCount && mod.builtCount>0) ?
      '<div class="missing">חסרות ~'+(mod.plannedKnowledge-mod.builtCount)+' יחידות מול התכנית ('+mod.builtCount+'/'+mod.plannedKnowledge+' פריטי-ידע).</div>':'';
    return '<details class="mod"'+(open?'':'')+'>'+
      '<summary><span class="modn" style="background:'+(mod.builtCount?col:'#B4BEC3')+'">'+mod.n+'</span>'+
        '<span class="modt">'+esc(mod.title)+'</span><span class="modmeta">'+stage+cov+'</span></summary>'+
      '<div class="modbody">'+
        (skills?'<div class="intern"><div class="lab"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>פנימי — כשירויות (לא באתר)</div><div class="skills">'+skills+'</div>'+
          (mod.responsibility?'<div class="kv"><b>אחריות/חניכות:</b> '+esc(mod.responsibility)+'</div>':'')+
          (mod.assess?'<div class="kv"><b>הערכה:</b> '+esc(mod.assess)+'</div>':'')+'</div>':'')+
        gap+
        '<div class="units">'+units+'</div>'+
      '</div></details>';
  }
  function unitRow(u){
    var dots=(u.levels||[]).map(function(l){return '<i style="background:'+(LVC[l]||'#ccc')+'"></i>';}).join('');
    var ped = u.pedagogy==='unverified'?'<span class="chip warn">לאימות</span>':'<span class="chip ok">אומת</span>';
    return '<div class="unit"><span class="uord">'+u.order+'</span>'+
      '<span class="utitle">'+esc(u.title)+(u.idea?'<span class="ui">'+esc(u.idea)+'</span>':'')+'</span>'+
      '<span class="lv">'+dots+'</span>'+ped+
      '<a class="open" href="unit-view.html?u='+encodeURIComponent(u.id)+'" target="_blank">פתיחה ›</a></div>';
  }

  /* ============ טאב 2 — לפי שכבה ============ */
  function viewGrades(){
    var html='<div class="note"><b>מצב חלקי — כמתוכנן, לא סופי.</b> שדה השכבה ברמת היחידה עדיין "[לאימות]" ברוב היחידות. '+
      'החלוקה לשכבות תיגזר מ-<code>grade-leveling-plan.md</code> (סדר-ספירלי + שעות אוגדן), לא מנתוני-היחידה. '+
      'כאן — מה שידוע כרגע: אילו מקצועות בנויים ובאיזה היקף, מוכנים לחלוקה.</div>';
    html+='<div class="scroll"><table><thead><tr><th>מקצוע</th><th>יחידות</th><th>מודולות (סדר ספירלי = דרגת קושי)</th><th>שכבות רלוונטיות</th><th>סטטוס חלוקה</th></tr></thead><tbody>';
    A.subjects.filter(function(s){return s.built;}).forEach(function(s){
      var grades = s.key==='football' ? 'י״א (UEFA C) · י״ב (התמחות)' : 'י׳–י״ב';
      var st = s.key==='football' ? '<span class="chip ok">ממופה</span>' : '<span class="chip wait">טרם מופה</span>';
      html+='<tr><td><b>'+esc(s.he)+'</b></td><td>'+s.unitCount+'</td><td>'+s.builtModuleCount+' מודולות בנויות</td><td>'+grades+'</td><td>'+st+'</td></tr>';
    });
    html+='</tbody></table></div>';
    html+='<div class="note" style="background:#EDF1F2;border-color:#D6DEE1;color:#5A6B72"><b>2 ההכרעות שקבעו את המבנה:</b> (1) חומר <b>שונה</b> בכל שכבה → grade = ערך יחיד. (2) הסינון משרת את <b>המורה</b> ("מה ללמד בכיתה שלי השנה"). הרמות basic/standard/advanced נשארות בתוך היחידה — הן לא שכבה.</div>';
    return el('<div>'+html+'</div>');
  }

  /* ============ טאב 3 — בתי-ספר ============ */
  var schoolFilter={sector:'all', q:''};
  function viewSchools(){
    var m=A.meta;
    var wrap=el('<div>'+
      '<div class="bar">'+kpi(m.schools,'בתי-ספר')+kpi(m.sectorHe,'מגזר עברי')+kpi(m.sectorAr,'מגזר ערבי')+kpi(m.tracks,'מגמות בקטלוג')+'</div>'+
      '<div class="toolbar">'+
        '<input id="sq" type="search" placeholder="חיפוש בית-ספר או מגמה…" style="min-width:220px">'+
        '<button class="fbtn" data-sec="all" aria-pressed="true">הכל</button>'+
        '<button class="fbtn" data-sec="he" aria-pressed="false">עברי</button>'+
        '<button class="fbtn" data-sec="ar" aria-pressed="false">ערבי</button>'+
      '</div><div id="stbl"></div></div>');
    function draw(){
      var q=schoolFilter.q.trim();
      var rows=A.schools.filter(function(s){
        if(schoolFilter.sector!=='all'&&s.sector!==schoolFilter.sector)return false;
        if(q){var hay=s.name+' '+s.tracks.join(' ');if(hay.indexOf(q)<0)return false;}
        return true;
      });
      var html='<div class="scroll"><table><thead><tr><th>בית-ספר</th><th>מגזר</th><th>מגמות</th></tr></thead><tbody>'+
        rows.map(function(s){
          return '<tr><td><b>'+esc(s.name)+'</b></td>'+
            '<td><span class="chip sector-'+s.sector+'">'+(s.sector==='he'?'עברי':'ערבי')+(s.sectorDetail?' · '+esc(s.sectorDetail):'')+'</span></td>'+
            '<td>'+(s.tracks.length?s.tracks.map(esc).join(' · '):'<span style="color:#8A9AA0">—</span>')+'</td></tr>';
        }).join('')+'</tbody></table></div><p class="sub" style="margin-top:8px">'+rows.length+' בתי-ספר</p>';
      $('#stbl',wrap).innerHTML=html;
    }
    $('#sq',wrap).addEventListener('input',function(e){schoolFilter.q=e.target.value;draw();});
    wrap.querySelectorAll('[data-sec]').forEach(function(b){b.addEventListener('click',function(){
      schoolFilter.sector=b.dataset.sec;
      wrap.querySelectorAll('[data-sec]').forEach(function(x){x.setAttribute('aria-pressed',x===b);});
      draw();
    });});
    draw();
    return wrap;
  }

  /* ============ טאב 4 — מסכי-תפקידים ============ */
  var ROLES=[
    {r:'תלמיד/ה', who:'נוער יג–יב, קשב/לקויות. נכנס ללמוד, לא לנהל.',
     gate:['בחירת מקצוע/כיתה (מסונן לשכבה שלו)','"היום שלי" — משימות פתוחות','המשך מהיכן שהפסיק'],
     dash:['יחידות פעילות + התקדמות','תרגול קצר מומלץ','ללא מודולות/כשירויות — רק "שיעורים"']},
    {r:'מורה מקצועי/ת', who:'מלמד/ת מגמה. הקהל הראשי של הספרייה.',
     gate:['ספריית התוכן מסוננת לשכבה ולמגמה','יצירת/שיבוץ שיעור לכיתה','המועדפים שלי'],
     dash:['הכיתה שלי — מי ראה/תרגל','שיבוץ יחידה + מעקב','דופק כיתתי (קשיים חוזרים)']},
    {r:'מחנך/ת', who:'אחראי/ת על קבוצת-חינוך, לא בהכרח מקצוע.',
     gate:['התלמידים שלי — תמונת-על','התראות (היעדרות/דגל רגשי "רוצה לדבר")','יומן קשר'],
     dash:['נוכחות ופעילות','דגלים דורשי-מעקב','אין תוכן-הוראה — מעקב בלבד']},
    {r:'מנהל/ת', who:'תמונת בית-ספר. מקבל/ת החלטות, לא עורך תוכן.',
     gate:['דופק בית-ספרי','דו"חות שכבה/מגמה','פערים (מה חסר)'],
     dash:['אחוזי-שימוש לפי מגמה','מורים פעילים','אימות פדגוגי — כמה מוכן']},
    {r:'רכז/ת מגמה', who:'אחראי/ת תוכן ואיכות במגמה.',
     gate:['תוכן המגמה שלי + סטטוס-אימות','אישור/פרסום יחידות','פערי-כיסוי במגמה'],
     dash:['יחידות ממתינות-אימות','QA — ליקויים פתוחים','מפת מודולות מול תכנית']},
    {r:'מפקח/אזור', who:'ראייה על-בית-ספרית (ענת — מנהלת אזור).',
     gate:['מפה ארצית — בתי-ספר','דו"חות ארציים','מגזר עברי/ערבי'],
     dash:['השוואת בתי-ספר','כיסוי-תוכן ארצי','חריגות דורשות התערבות']},
    {r:'הורה', who:'קורא/ת מהיר/ה. רוצה לדעת "מה שלום הילד".',
     gate:['סיכום שבועי של הילד','ללא ניהול — צפייה בלבד'],
     dash:['התקדמות שבועית','נקודות לחיזוק','ערוץ קשר עם המחנך']}
  ];
  function viewRoles(){
    var html='<div class="note">מה כל תפקיד צריך לראות ב<b>שער השני</b> (אחרי הכניסה) וב<b>דשבורד</b>. זו מפת-אפיון — לעדכון תוך כדי בנייה.</div>';
    html+=ROLES.map(function(ro){
      return '<div class="rolecard"><h3><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>'+esc(ro.r)+'</h3>'+
        '<div class="who">'+esc(ro.who)+'</div>'+
        '<div class="rgrid">'+
          '<div class="rbox"><div class="rt"><svg class="ic" viewBox="0 0 24 24"><path d="M3 9h18M9 21V9"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>שער שני</div><ul>'+ro.gate.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'+
          '<div class="rbox"><div class="rt"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>דשבורד</div><ul>'+ro.dash.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'+
        '</div></div>';
    }).join('');
    return el('<div>'+html+'</div>');
  }

  /* ============ טאב 5 — QA יחידות ============ */
  var qaFilter='all';
  function allUnits(){
    var out=[]; A.subjects.forEach(function(s){ s.modules.forEach(function(m){ m.units.forEach(function(u){
      out.push({subj:s.he,col:subjColor(s.he),mod:m.n,modt:m.title,stage:m.stage,u:u});
    });});}); return out;
  }
  function viewQA(){
    var units=allUnits();
    var unv=units.filter(function(x){return x.u.pedagogy==='unverified';}).length;
    var badfmt=units.filter(function(x){return x.u.format==='check';}).length;
    var reviewed=units.filter(function(x){return x.stage==='reviewed';}).length;
    var wrap=el('<div>'+
      '<div class="bar">'+kpi(units.length,'יחידות')+kpi(unv,'טרם אומתו פדגוגית')+kpi(reviewed,'עברו בדיקת-קלוד')+kpi(badfmt,'פורמט חורג')+'</div>'+
      '<div class="note"><b>גשר-פרסום:</b> טיוטה → נבדק (קלוד) → אומת פדגוגית (verify-pedagogy → רכז) → פורסם לאתר-המורה. יחידה עולה לאתר רק בסוף המסלול.</div>'+
      '<div class="toolbar">'+
        ['all|הכל','unv|טרם אומת','fmt|פורמט חורג','rev|נבדק'].map(function(o){var p=o.split('|');
          return '<button class="fbtn" data-qa="'+p[0]+'" aria-pressed="'+(p[0]==='all')+'">'+p[1]+'</button>';}).join('')+
      '</div><div id="qtbl"></div></div>');
    function draw(){
      var rows=units.filter(function(x){
        if(qaFilter==='unv')return x.u.pedagogy==='unverified';
        if(qaFilter==='fmt')return x.u.format==='check';
        if(qaFilter==='rev')return x.stage==='reviewed';
        return true;
      });
      var html='<div class="scroll"><table><thead><tr><th>יחידה</th><th>מקצוע</th><th>מודולה</th><th>שלב</th><th>אימות פדגוגי</th><th>פורמט</th><th></th></tr></thead><tbody>'+
        rows.slice(0,400).map(function(x){
          var stage=x.stage==='reviewed'?'<span class="chip rev">נבדק</span>':x.stage==='built'?'<span class="chip ok">טיוטה</span>':'<span class="chip wait">—</span>';
          var ped=x.u.pedagogy==='unverified'?'<span class="chip warn">לאימות</span>':'<span class="chip ok">אומת</span>';
          var fmt=x.u.format==='ok'?'<span class="chip ok">תקין</span>':'<span class="chip warn">לבדוק</span>';
          return '<tr><td><b>'+esc(x.u.title)+'</b></td><td><span class="dot" style="display:inline-block;background:'+x.col+'"></span> '+esc(x.subj)+'</td>'+
            '<td>'+x.mod+' · '+esc(x.modt)+'</td><td>'+stage+'</td><td>'+ped+'</td><td>'+fmt+'</td>'+
            '<td><a class="open" href="unit-view.html?u='+encodeURIComponent(x.u.id)+'" target="_blank">פתיחה ›</a></td></tr>';
        }).join('')+'</tbody></table></div><p class="sub" style="margin-top:8px">'+rows.length+' יחידות'+(rows.length>400?' (מוצגות 400 ראשונות)':'')+'</p>';
      $('#qtbl',wrap).innerHTML=html;
    }
    wrap.querySelectorAll('[data-qa]').forEach(function(b){b.addEventListener('click',function(){
      qaFilter=b.dataset.qa;
      wrap.querySelectorAll('[data-qa]').forEach(function(x){x.setAttribute('aria-pressed',x===b);});
      draw();
    });});
    draw();
    return wrap;
  }

  function kpi(n,k){return '<div class="kpi"><div class="n">'+n+'</div><div class="k">'+k+'</div></div>';}

  function render(){
    renderTabs();
    var v=$('#view'); v.innerHTML='';
    var map={subjects:viewSubjects,grades:viewGrades,schools:viewSchools,roles:viewRoles,qa:viewQA};
    v.appendChild((map[state.tab]||viewSubjects)());
  }
  render();
</script>
</body>
</html>
