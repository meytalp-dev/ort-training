<!DOCTYPE html>
<html lang="he" dir="rtl" data-mode="routine">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רֶצֶף — בריאות מערכת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css?v=2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M30 16h-4.5' stroke='%2391A5AE' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M7.5 16H2' stroke='%230B8F98' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23fff' stroke='%230B8F98' stroke-width='4'/%3E%3C/svg%3E">
<style>
  /* ============================================================
     בריאות מערכת — **מסך תפעול**. התבנית לכל מסכי התפעול.
     הרגיסטר הזה הוא כלי, לא שיווק:
       · בלי hero · בלי clamp/vw · בלי צללים · בלי כרטיסים מקוננים
       · שורה 46px · רדיוס ≤8 · קווי-שיער
       · המספר בדיו. צבע רק היכן שיש חריגה.
       · פעולת-שורה שקטה. כפתור מלא אחד למסך — הפעולה הקבוצתית.
     שכבה: מעטפת (מי הצליח להתחבר — לא למידה) → פעולה ב---shell.
     ============================================================ */
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--font-body); background:var(--bg); color:var(--ink);
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:22px 20px 70px}

  /* ---------- פס זהות ---------- */
  .brandbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .brandbar a{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brandbar b{font-family:var(--font-head);font-weight:900;font-size:18px;color:var(--ink-strong);letter-spacing:.3px}
  .layer{font-size:11.5px;font-weight:700;color:var(--shell, #A61E64);
    background:var(--shell-soft, #FDEDF4);border:1px solid var(--shell-line, #F3C6DA);
    padding:2px 9px;border-radius:var(--radius-pill)}
  .who{margin-inline-start:auto;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  .who svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
  .mark{display:block;width:60px;height:16px;flex-shrink:0}
  .mark .past{stroke:var(--ink-faint);stroke-linecap:round}
  .mark .next{stroke:var(--brand);stroke-width:3.6;stroke-linecap:round}
  .mark .node{fill:var(--card);stroke:var(--brand);stroke-width:3.6}

  /* ---------- כותרת — גודל קבוע. בלי clamp, בלי vw. ---------- */
  h1{font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--ink-strong);letter-spacing:-.01em}
  /* נקודת-מצב בכותרת — לא עיטור. נורת-מצב: צבע = בריאות המסך, נשימה = חי.
     ירוקה כשהכל רץ · אדומה כשמישהו תקוע. אותה שפה כמו הנקודות באריג. */
  .h1dot{
    display:inline-block;vertical-align:.1em;margin-inline-start:11px;
    width:13px;height:13px;border-radius:50%;
    background:var(--card);border:3.5px solid var(--h,var(--status-good));
    animation:h1breathe var(--pulse,3.6s) ease-out infinite;
  }
  @keyframes h1breathe{
    0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--h,var(--status-good)) 34%,transparent)}
    55%,100%{box-shadow:0 0 0 7px color-mix(in srgb,var(--h,var(--status-good)) 0%,transparent)}
  }
  .sub{color:var(--ink-soft);font-size:14px;margin-top:2px}

  /* ---------- מדדים — לוח אחד, לא ארבעה כרטיסים ---------- */
  .kpi{
    display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;
    background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  }
  .kpi > div{padding:14px 16px;border-inline-start:1px solid var(--line)}
  .kpi > div:first-child{border-inline-start:none}
  .kpi .n{
    font-family:var(--font-head);font-size:27px;font-weight:800;line-height:1.1;
    color:var(--ink-strong);font-variant-numeric:tabular-nums;   /* המספר בדיו — תמיד */
  }
  .kpi .l{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);margin-top:5px}
  .kpi .d{width:7px;height:7px;border-radius:50%;background:var(--status-good);flex-shrink:0}
  .kpi .d.warn{background:var(--status-attention)}
  .kpi .d.bad{background:var(--status-alert)}
  @media(max-width:640px){
    .kpi{grid-template-columns:repeat(2,1fr)}
    .kpi > div:nth-child(3){border-inline-start:none}
    .kpi > div:nth-child(n+3){border-top:1px solid var(--line)}
  }

  /* ---------- האריג — 22 חוטים. החורים הם המסר. ---------- */
  .fabric{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:15px 16px}
  .fabric .ft{font-size:12.5px;color:var(--ink-soft);margin-bottom:11px}
  .fabric .ft b{color:var(--ink-strong)}
  .threads{display:flex;gap:7px;flex-wrap:wrap}
  .th{display:flex;align-items:center;width:34px}
  .th i{flex:1;height:3px;border-radius:2px;background:var(--mode)}
  .th span{width:8px;height:8px;border-radius:50%;background:var(--card);border:2.5px solid var(--mode);flex-shrink:0;margin-inline-start:-1px;
    animation:breathe var(--pulse,3.6s) ease-out infinite}
  /* חוט שלא נולד — אין נקודה, ולכן הוא לא נושם */
  .th.dead i{background:none;background-image:repeating-linear-gradient(90deg,var(--ink-faint) 0 2px,transparent 2px 6px);opacity:.5}
  @keyframes breathe{
    0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--mode) 32%,transparent)}
    55%,100%{box-shadow:0 0 0 6px color-mix(in srgb,var(--mode) 0%,transparent)}
  }

  /* ---------- מקטע ---------- */
  .sec{display:flex;align-items:center;gap:9px;margin:26px 0 9px}
  .sec h2{font-family:var(--font-head);font-size:15px;font-weight:800;color:var(--ink-strong)}
  .sec .cnt{font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--surface-muted);padding:1px 8px;border-radius:var(--radius-pill)}
  /* הכפתור המלא היחיד במסך — הפעולה שרוצים ב-90% מהמקרים */
  .bulk{
    margin-inline-start:auto;font-family:var(--font-body);font-size:13px;font-weight:700;
    background:var(--shell, #A61E64);color:var(--on-shell, #fff);border:none;cursor:pointer;
    border-radius:var(--radius-pill);padding:8px 16px;transition:background .15s;
  }
  .bulk:hover{background:var(--shell-deep, #8A1852)}
  .bulk:focus-visible{outline:3px solid var(--shell, #A61E64);outline-offset:2px}
  .bulk:disabled{background:var(--surface-muted);color:var(--ink-faint);cursor:default}

  /* ---------- שורות — 46px, קו-שיער, בלי צל ---------- */
  .list{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .row{display:flex;align-items:center;gap:11px;min-height:46px;padding:0 14px;border-top:1px solid var(--line);font-size:13.5px}
  .row:first-child{border-top:none}
  .row:hover{background:var(--bg-soft)}
  .av{width:25px;height:25px;border-radius:50%;background:var(--surface-muted);color:var(--ink-soft);
    display:grid;place-items:center;font-weight:700;font-size:11px;flex-shrink:0}
  .nm{font-weight:600;color:var(--ink-strong)}
  .rsn{color:var(--ink-soft);font-size:12.5px}
  .st{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
  .st .d{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .st .d.wait{background:var(--status-attention)}
  .st .d.err{background:var(--status-alert)}
  /* פעולת-שורה — שקטה. מקבלת נוכחות רק בריחוף/פוקוס. */
  .rowact{
    font-family:var(--font-body);font-size:12.5px;font-weight:700;
    background:none;border:1px solid transparent;color:var(--ink-soft);
    border-radius:6px;padding:5px 10px;cursor:pointer;transition:.14s;margin-inline-start:12px;
  }
  .row:hover .rowact{color:var(--shell, #A61E64);border-color:var(--shell-line, #F3C6DA);background:var(--shell-soft, #FDEDF4)}
  .rowact:focus-visible{outline:2px solid var(--shell, #A61E64);outline-offset:1px;color:var(--shell, #A61E64)}
  .rowact.done{color:var(--status-good);border-color:transparent;background:none;pointer-events:none}
  .empty{padding:16px 14px;color:var(--ink-faint);font-size:13px}

  @media (prefers-reduced-motion:reduce){ *{animation:none !important} }
</style>
</head>
<body>
<div class="wrap">

  <div class="brandbar">
    <a href="index.html">
      <svg class="mark" viewBox="0 0 76 20" fill="none" aria-hidden="true">
        <path class="past" d="M73 10h-6" stroke-width="3.6"/>
        <path class="past" d="M60 10h-4.5" stroke-width="3.1"/>
        <path class="past" d="M49 10h-2.5" stroke-width="2.6"/>
        <circle class="node" cx="35" cy="10" r="6"/>
        <path class="next" d="M28 10H3"/>
      </svg>
      <b>רֶצֶף</b>
    </a>
    <span class="layer">תפעול</span>
    <span class="who">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c0-3.6 3.4-5.6 7.5-5.6s7.5 2 7.5 5.6"/></svg>
      דוד · רכז תקשוב
    </span>
  </div>

  <h1>בריאות מערכת<span class="h1dot" id="h1dot" aria-hidden="true"></span></h1>
  <p class="sub" id="sub">מי נכנס, מי נתקע, מה לא הופעל. תצוגה תפעולית — לא פדגוגית.</p>

  <div class="kpi" id="kpi"></div>

  <div class="fabric">
    <p class="ft" id="fabricText"></p>
    <div class="threads" id="threads"></div>
  </div>

  <div class="sec">
    <h2>טרם נכנסו למערכת</h2><span class="cnt" id="cNot"></span>
    <button class="bulk" id="bulkNot"></button>
  </div>
  <div class="list" id="notJoined"></div>

  <div class="sec">
    <h2>נתקעו בשלב הכניסה</h2><span class="cnt" id="cStuck"></span>
    <button class="bulk" id="bulkStuck">אפס גישה לכולם</button>
  </div>
  <div class="list" id="stuck"></div>

  <div class="sec"><h2>הפעלת כיתות</h2><span class="cnt" id="cCls"></span></div>
  <div class="list" id="classes"></div>

</div>

<script src="seed-pilot.js"></script>
<script>
const SEED = window.PILOT_SEED;
const ini = n => (n||'?').trim().charAt(0);
const students = SEED.students;
const total = students.length;

const notJoined = students.slice(0,3);
const stuck     = students.slice(3,5);
const joined    = total - notJoined.length - stuck.length;
const stuckReasons = ['קוד כיתה שגוי','מכשיר משותף — זיהוי'];

/* --- מדדים: המספר בדיו. הצבע עובר לנקודת סטטוס. --- */
const kpi = [
  { n:`${joined}/${total}`, l:'נכנסו בהצלחה', d:'' },
  { n:'1/1',                l:'כיתות שהופעלו', d:'' },
  { n:notJoined.length,     l:'טרם נכנסו',    d:'warn' },
  { n:stuck.length,         l:'נתקעו בכניסה', d:'bad' },
];
document.getElementById('kpi').innerHTML = kpi.map(x =>
  `<div><div class="n">${x.n}</div><div class="l"><span class="d ${x.d}"></span>${x.l}</div></div>`).join('');

/* --- האריג: חוט לכל תלמיד. מי שלא נכנס — אין לו נקודה. --- */
const dead = notJoined.length + stuck.length;
document.getElementById('fabricText').innerHTML =
  `<b>${joined}</b> חוטים נולדו. <b>${dead}</b> עוד לא — הקו שלהם לא התחיל.`;
document.getElementById('threads').innerHTML =
  Array.from({length: total}, (_, i) => {
    const alive = i < joined;
    return `<span class="th${alive?'':' dead'}"><i></i>${alive?'<span></span>':''}</span>`;
  }).join('');

/* --- רשימות --- */
const rowHTML = (name, reason, dotCls, label, action) =>
  `<div class="row">
     <span class="av">${ini(name)}</span>
     <div><div class="nm">${name}</div><div class="rsn">${reason}</div></div>
     <div class="st"><span class="d ${dotCls}"></span>${label}</div>
     <button class="rowact" data-done="${action.done}">${action.text}</button>
   </div>`;

document.getElementById('notJoined').innerHTML = notJoined.length
  ? notJoined.map(s => rowHTML(s.first_name, 'קישור נשלח, לא נפתח', 'wait', 'ממתין', {text:'שלח שוב', done:'נשלח'})).join('')
  : '<div class="empty">כולם נכנסו.</div>';

document.getElementById('stuck').innerHTML = stuck.length
  ? stuck.map((s,i) => rowHTML(s.first_name, stuckReasons[i]||'תקלת כניסה', 'err', 'תקוע', {text:'אפס גישה', done:'אופס'})).join('')
  : '<div class="empty">אין תקיעות.</div>';

document.getElementById('classes').innerHTML = SEED.classes.map(c =>
  `<div class="row">
     <span class="av">${ini(c.name)}</span>
     <div><div class="nm">${c.name}</div><div class="rsn">${total} תלמידים · מצב: שגרה</div></div>
     <div class="st"><span class="d" style="background:var(--status-good)"></span>פעילה</div>
   </div>`).join('');

document.getElementById('cNot').textContent   = notJoined.length;
document.getElementById('cStuck').textContent = stuck.length;
document.getElementById('cCls').textContent   = SEED.classes.length;
document.getElementById('bulkNot').textContent = `שלח קישור לכל ה-${notJoined.length}`;

/* --- נורת-המצב בכותרת: אדומה אם יש תקועים, כתומה אם רק ממתינים, ירוקה אם הכל רץ --- */
function setHealth(){
  const openStuck = document.querySelectorAll('#stuck .rowact:not(.done)').length;
  const openWait  = document.querySelectorAll('#notJoined .rowact:not(.done)').length;
  const dot = document.getElementById('h1dot');
  let color, note;
  if (openStuck){ color = 'var(--status-alert)';     note = `${openStuck} תקועים דורשים טיפול`; }
  else if (openWait){ color = 'var(--status-attention)'; note = `${openWait} ממתינים להתחברות`; }
  else { color = 'var(--status-good)'; note = 'הכל רץ — אין תקיעות פתוחות'; }
  dot.style.setProperty('--h', color);
  dot.title = note;
}
setHealth();

/* --- פעולות --- */
document.addEventListener('click', e => {
  const b = e.target.closest('.rowact');
  if (b && !b.classList.contains('done')) { b.textContent = b.dataset.done; b.classList.add('done'); }
  const bulk = e.target.closest('.bulk');
  if (bulk && !bulk.disabled) {
    const list = bulk.id === 'bulkNot' ? '#notJoined' : '#stuck';
    document.querySelectorAll(list + ' .rowact').forEach(r => { r.textContent = r.dataset.done; r.classList.add('done'); });
    bulk.textContent = 'נשלח לכולם'; bulk.disabled = true;
  }
  if (b || bulk) setHealth();   /* טיפול בתקיעה → נורת-המצב מתעדכנת חיה */
});
</script>
</body>
</html>
