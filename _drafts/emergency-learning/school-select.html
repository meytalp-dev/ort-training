<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רֶצֶף — בחירת בית ספר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="retzef-motif.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: var(--font-body); color: var(--ink);
    background:
      radial-gradient(1100px 560px at 85% -10%, var(--brand-soft) 0%, transparent 55%),
      radial-gradient(820px 460px at 5% 110%, #EEF7F5 0%, transparent 55%),
      var(--bg);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width: 820px; margin:0 auto; padding: clamp(22px,5vw,52px) 20px 60px; }

  /* מותג */
  .brand { display:flex; align-items:center; gap:12px; margin-bottom: clamp(22px,4vw,34px); }
  .brand .mark {
    width:50px; height:50px; border-radius:15px;
    background: linear-gradient(150deg, var(--brand-bright), var(--brand-deep));
    display:grid; place-items:center; box-shadow: var(--shadow-brand); flex-shrink:0;
  }
  .brand .name b { font-family:var(--font-head); font-weight:800; font-size:22px; color:var(--ink-strong); display:block; line-height:1.1; }
  .brand .name span { font-size:12.5px; color:var(--ink-soft); font-weight:600; }

  /* Hero */
  h1 { font-family:var(--font-head); font-size:clamp(26px,4.5vw,38px); font-weight:800; color:var(--ink-strong); line-height:1.15; margin-bottom:10px; }
  .sub { font-size:clamp(15px,2.2vw,18px); color:var(--ink-soft); line-height:1.55; max-width:56ch; margin-bottom:6px; }

  /* בית ספר נוכחי */
  .current {
    display:none; align-items:center; gap:12px; margin-top:18px;
    background:var(--card); border:1px solid var(--brand-line); border-inline-start:4px solid var(--brand);
    border-radius:var(--radius-md); padding:13px 16px;
  }
  .current.show { display:flex; }
  .current .ic { width:38px; height:38px; border-radius:11px; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; flex-shrink:0; }
  .current .ic svg { width:20px; height:20px; }
  .current .txt { flex:1; line-height:1.35; }
  .current .txt b { color:var(--ink-strong); font-size:15px; }
  .current .txt span { display:block; font-size:12.5px; color:var(--ink-soft); }
  .current a { font-size:13px; font-weight:700; color:var(--brand-deep); text-decoration:none; white-space:nowrap; }
  .current a:hover { text-decoration:underline; }

  /* חיפוש */
  .search { position:sticky; top:12px; z-index:5; margin:26px 0 8px; }
  .search .box { display:flex; align-items:center; gap:10px; background:var(--card); border:1.5px solid var(--line-strong); border-radius:var(--radius-pill); padding:13px 18px; box-shadow:var(--shadow-card); }
  .search .box:focus-within { border-color:var(--brand); box-shadow:var(--shadow-brand); }
  .search svg { width:20px; height:20px; color:var(--ink-faint); flex-shrink:0; }
  .search input { flex:1; border:none; outline:none; background:transparent; font-family:var(--font-body); font-size:16px; color:var(--ink); }
  .search .count { font-size:12.5px; font-weight:700; color:var(--ink-faint); white-space:nowrap; }

  /* רשימת בתי ספר */
  .list { display:grid; gap:10px; margin-top:14px; }
  .school {
    display:flex; align-items:center; gap:14px; width:100%; text-align:start;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:15px 17px; cursor:pointer; transition:.15s; font-family:inherit;
  }
  .school:hover { border-color:var(--brand-line); background:var(--brand-soft); transform:translateX(-2px); }
  .school:focus-visible { outline:2.5px solid var(--brand); outline-offset:2px; }
  .school.is-current { border-color:var(--brand); box-shadow:var(--shadow-brand); }
  .school .sec { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-family:var(--font-head); font-weight:800; font-size:13px; flex-shrink:0; }
  .school .sec.he { background:#EDF5FF; color:#2D6CDF; }
  .school .sec.ar { background:#E8F6EC; color:#2E9E58; }
  .school .info { flex:1; min-width:0; }
  .school .info b { display:block; font-family:var(--font-head); font-weight:700; font-size:16.5px; color:var(--ink-strong); line-height:1.2; }
  .school .info .meta { display:flex; gap:7px; flex-wrap:wrap; margin-top:6px; }
  .school .info .meta span { font-size:11.5px; font-weight:600; color:var(--brand-deep); background:var(--brand-soft); border:1px solid var(--brand-line); border-radius:var(--radius-pill); padding:2px 8px; }
  .school .info .meta span.more { color:var(--ink-faint); background:var(--surface-muted); border-color:var(--line); }
  .school .info .meta span.none { color:var(--ink-faint); background:var(--surface-muted); border-color:var(--line); }
  .school .go { color:var(--ink-faint); flex-shrink:0; }
  .school .go svg { width:20px; height:20px; }
  .school:hover .go { color:var(--brand); }

  .empty { display:none; text-align:center; padding:44px 20px; color:var(--ink-faint); font-size:15px; }
  .empty.show { display:block; }

  footer { margin-top:40px; text-align:center; font-size:12.5px; color:var(--ink-faint); line-height:1.7; }
  footer b { color:var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 34 34" width="30" height="30" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 8 C9.5 10.3 11.5 10.3 14 8 C16.5 5.7 18.5 5.7 21 8 C23.5 10.3 25.5 10.3 28 8"/>
        <path d="M4 17 C6.5 14.7 8.5 14.7 11 17 C13.5 19.3 15.5 19.3 18 17 C20.5 14.7 22.5 14.7 25 17 C27.5 19.3 28.5 19.3 30 17"/>
        <path d="M7 26 C9.5 28.3 11.5 28.3 14 26 C16.5 23.7 18.5 23.7 21 26 C23.5 28.3 25.5 28.3 28 26"/>
      </svg>
    </div>
    <div class="name"><b>רֶצֶף</b><span>רציפות למידה — בכל מצב</span></div>
  </div>

  <h1>לאיזה בית ספר אתם נכנסים?</h1>
  <p class="sub">כל בית ספר רואה את המגמות, התוכן והמגזר שלו. בחרו בית ספר כדי להיכנס — הבחירה נשמרת לכל המסכים.</p>

  <!-- בית ספר נוכחי (אם נבחר קודם) -->
  <div class="current" id="current">
    <div class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg></div>
    <div class="txt"><b id="curName">—</b><span id="curMeta">—</span></div>
    <a href="index.html" id="curEnter">כניסה למערכת ←</a>
  </div>

  <!-- חיפוש -->
  <div class="search">
    <div class="box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="חיפוש בית ספר… (שם או עיר)" aria-label="חיפוש בית ספר">
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="list" id="list" role="list"></div>
  <div class="empty" id="empty">לא נמצא בית ספר שמתאים לחיפוש.</div>

  <footer><b>רֶצֶף</b> — מערכת רציפות למידה · שער בחירת בית ספר · טיוטת עבודה</footer>

</div>

<script src="tracks-data.js"></script>
<script src="school-context.js"></script>
<script>
(function () {
  'use strict';
  var S = window.Resef.School;
  var listEl = document.getElementById('list');
  var q = document.getElementById('q');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function norm(s){ return String(s).replace(/[־–"']/g,' ').toLowerCase(); }

  // מגמות של בית ספר לפי id
  function tracksFor(sid){
    var td = window.RETZEF_TRACKS;
    return td.schoolTracks.filter(function(st){ return st.school_id===sid && st.active; })
      .map(function(st){ var t = S.track(st.track_id); return t ? t.name : null; })
      .filter(Boolean);
  }
  function secLabel(sec){ return sec==='he' ? 'עברית' : sec==='ar' ? 'ערבית' : '—'; }

  // בית ספר נוכחי
  function renderCurrent(){
    var cur = S.school();
    var box = document.getElementById('current');
    if (!cur){ box.classList.remove('show'); return; }
    box.classList.add('show');
    document.getElementById('curName').textContent = cur.name;
    var tr = tracksFor(cur.id);
    document.getElementById('curMeta').textContent =
      'מגזר: ' + secLabel(cur.sector) + ' · ' + (tr.length ? tr.length + ' מגמות' : 'ללא מגמות ידועות');
  }

  function schoolHTML(s){
    var tr = tracksFor(s.id);
    var chips = tr.slice(0,3).map(function(n){ return '<span>'+esc(n)+'</span>'; }).join('');
    if (tr.length > 3) chips += '<span class="more">+'+(tr.length-3)+'</span>';
    if (!tr.length) chips = '<span class="none">ללא מגמות ידועות</span>';
    var sec = s.sector || '';
    var isCur = s.id === S.id;
    return '<button class="school'+(isCur?' is-current':'')+'" role="listitem" data-id="'+esc(s.id)+'">' +
      '<span class="sec '+sec+'">'+secLabel(s.sector)+'</span>' +
      '<span class="info"><b>'+esc(s.name)+'</b><span class="meta">'+chips+'</span></span>' +
      '<span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span>' +
    '</button>';
  }

  function render(){
    var term = norm(q.value.trim());
    var all = S.schools();
    var shown = all.filter(function(s){ return !term || norm(s.name).indexOf(term) > -1; });
    listEl.innerHTML = shown.map(schoolHTML).join('');
    count.textContent = term ? shown.length + ' תוצאות' : all.length + ' בתי ספר';
    empty.classList.toggle('show', shown.length === 0);
  }

  // בחירה → שמירה → כניסה לשער
  listEl.addEventListener('click', function(e){
    var btn = e.target.closest('[data-id]'); if (!btn) return;
    S.set(btn.getAttribute('data-id'));
    window.location.href = 'index.html';
  });

  q.addEventListener('input', render);
  renderCurrent();
  render();
})();
</script>
</body>
</html>
