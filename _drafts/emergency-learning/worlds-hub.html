<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מרכז העולמות — רציפות חינוכית בחירום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@500;600;700;800&family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5fafb; --card:#fff; --brand:#0e7c86; --brand-bright:#22b8cf;
    --brand-soft:#e3fafc; --brand-line:#a5e8ef;
    --ink:#173a4a; --ink-soft:#5a7382; --ink-faint:#8ba3ae;
    --line:#e2eef1; --line-strong:#cfe3e8;
    --shadow:0 1px 2px rgba(23,58,74,.04),0 8px 24px rgba(23,58,74,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Assistant',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Playpen Sans Hebrew','Assistant',sans-serif;margin:0}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:24px 16px 64px}

  header.top{padding:28px 0 8px}
  .eyebrow{color:var(--brand);font-weight:700;font-size:.85rem;letter-spacing:.02em}
  h1{font-size:1.9rem;margin:.15em 0 .1em}
  .sub{color:var(--ink-soft);font-size:1.02rem;max-width:64ch}

  .overall{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 8px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 18px;box-shadow:var(--shadow);min-width:120px;flex:1}
  .stat .n{font-family:'Playpen Sans Hebrew';font-size:1.7rem;font-weight:800;line-height:1}
  .stat .l{color:var(--ink-soft);font-size:.82rem;margin-top:4px}

  .barwrap{background:var(--line);border-radius:99px;height:10px;overflow:hidden;margin-top:10px}
  .bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand-bright),var(--brand))}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:18px 18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
    transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(23,58,74,.08),0 16px 36px rgba(23,58,74,.10);border-color:var(--brand-line)}
  .card .head{display:flex;align-items:center;gap:12px}
  .badge{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;
    font-family:'Playpen Sans Hebrew';font-weight:800;font-size:1.2rem;color:#fff}
  .card h3{font-size:1.12rem}
  .card .user{color:var(--ink-faint);font-size:.8rem;margin-top:1px}
  .goal{color:var(--ink-soft);font-size:.9rem;min-height:2.6em}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
  .pct{font-family:'Playpen Sans Hebrew';font-weight:800;font-size:1.05rem}
  .counts{display:flex;gap:6px;font-size:.72rem}
  .chip{padding:2px 8px;border-radius:99px;font-weight:600}
  .chip.done{background:#ebfbee;color:#2f9e44}
  .chip.doing{background:#e7f4fd;color:#1c7ed6}
  .chip.todo{background:#f1f5f7;color:#5a7382}

  .infra{grid-column:1/-1;background:linear-gradient(180deg,#fff,#f8fdfd)}
  footer.note{margin-top:30px;color:var(--ink-faint);font-size:.82rem;text-align:center}
  .links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .links a{color:var(--brand);font-weight:600;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">המערכת הלאומית לרציפות חינוכית בשעת חירום</div>
    <h1>מרכז העולמות</h1>
    <p class="sub">9 עולמות עצמאיים על מסד נתונים משותף אחד. לכל עולם לוח ניהול משימות משלו — לחצו על עולם כדי להיכנס.</p>

    <div class="overall" id="overall"></div>
    <div class="barwrap"><div class="bar" id="overallBar" style="width:0%"></div></div>
  </header>

  <main class="grid" id="grid"></main>

  <footer class="note">
    מקור אמת: <code>tasks-data.js</code> · אפיון מלא: <a href="prd.md" style="color:var(--brand)">prd.md</a>
    <div class="links">
      <a href="prd.md">PRD</a>
      <a href="worlds-detailed-spec.md">איפיון מפורט לכל עולם</a>
      <a href="management.html">ניהול הפרויקט</a>
      <a href="design-system.html">שפה עיצובית</a>
      <a href="roles.html">תפקידים</a>
    </div>
  </footer>
</div>

<script src="tasks-data.js"></script>
<script>
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  // ---- overall ----
  var all = window.TASKS;
  var totDone = all.filter(function(t){return t.status==='done'}).length;
  var totDoing = all.filter(function(t){return t.status==='doing'}).length;
  var totTodo = all.filter(function(t){return t.status==='todo'}).length;
  var overallPct = Math.round(((totDone + totDoing*0.5)/all.length)*100);
  document.getElementById('overall').innerHTML =
    stat(all.length,'משימות סה״כ') + stat(window.WORLDS.length-1,'עולמות') +
    stat(totDone,'הושלמו') + stat(totDoing,'בתהליך') + stat(totTodo,'לביצוע') +
    stat(overallPct+'%','התקדמות כוללת');
  document.getElementById('overallBar').style.width = overallPct+'%';
  function stat(n,l){return '<div class="stat"><div class="n">'+esc(n)+'</div><div class="l">'+esc(l)+'</div></div>'}

  // ---- cards ----
  var grid = document.getElementById('grid');
  window.WORLDS.forEach(function(w){
    var p = window.worldProgress(w.id);
    var card = document.createElement('a');
    card.className = 'card' + (w.id===0 ? ' infra' : '');
    card.href = 'world-board.html?world=' + w.id;
    card.innerHTML =
      '<div class="head">'+
        '<div class="badge" style="background:'+w.color+'">'+esc(w.num)+'</div>'+
        '<div><h3>'+esc(w.name)+'</h3><div class="user">'+esc(w.user)+'</div></div>'+
      '</div>'+
      '<div class="goal">'+esc(w.goal)+'</div>'+
      '<div class="barwrap"><div class="bar" style="width:'+p.pct+'%;background:'+w.color+'"></div></div>'+
      '<div class="foot">'+
        '<span class="pct" style="color:'+w.color+'">'+p.pct+'%</span>'+
        '<span class="counts">'+
          '<span class="chip done">'+p.done+' ✓</span>'+
          '<span class="chip doing">'+p.doing+' בתהליך</span>'+
          '<span class="chip todo">'+p.todo+' לביצוע</span>'+
        '</span>'+
      '</div>';
    grid.appendChild(card);
  });
</script>
</body>
</html>
