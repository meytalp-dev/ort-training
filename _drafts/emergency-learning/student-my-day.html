<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רֶצֶף — היום שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0B8F98; --teal-deep:#086b72; --teal-soft:#e6f4f5;
    --ink:#1a2b2d; --muted:#5b7377; --line:#d9e6e7; --bg:#f4f9f9; --card:#fff;
    --green:#1a9e6a; --green-soft:#e5f6ee; --amber:#E8722C; --amber-soft:#fdeee3; --purple:#7c5cbf; --purple-soft:#efe9fb;
    --shadow:0 2px 8px rgba(11,143,152,.07), 0 10px 30px rgba(11,143,152,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Heebo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 70px}
  .retzef-line{height:3px;background:linear-gradient(90deg,var(--teal),transparent);border-radius:2px}
  .top{display:flex;align-items:center;gap:12px;margin-top:14px}
  .top .av{width:48px;height:48px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
  .top h1{font-size:22px;font-weight:800;margin:0}
  .top p{margin:1px 0 0;color:var(--muted);font-size:13px}
  .picker{margin-inline-start:auto}
  select{font-family:inherit;font-size:13px;padding:8px 11px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}

  .now{background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff;border-radius:18px;padding:20px;margin-top:18px;box-shadow:var(--shadow)}
  .now .lbl{font-size:12px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
  .now h2{margin:6px 0 4px;font-size:20px}
  .now .from{font-size:13px;opacity:.9}
  .now .go{margin-top:14px;background:#fff;color:var(--teal-deep);border:none;border-radius:12px;padding:13px;width:100%;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}

  .sec{font-size:13px;font-weight:700;color:var(--muted);margin:24px 4px 10px}
  .task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;align-items:center;gap:13px}
  .task .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .task .body{flex:1;min-width:0}
  .task .tt{font-weight:700;font-size:15px}
  .task .src{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:3px}
  .task .src .gdot{width:7px;height:7px;border-radius:50%}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .b-assigned{background:var(--teal-soft);color:var(--teal-deep)}
  .b-rec{background:var(--purple-soft);color:var(--purple)}
  .b-free{background:#eef3f3;color:var(--muted)}
  .b-done{background:var(--green-soft);color:var(--green)}
  .task.done .tt{color:var(--muted)}
  .task .dur{font-size:12px;color:var(--muted);margin-top:2px}
  .legend{margin-top:22px;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:14px;font-size:12.5px;color:var(--muted)}
  .legend b{color:var(--ink)}
  .legend .row{display:flex;align-items:center;gap:8px;margin:5px 0}
  .help{margin-top:14px;width:100%;background:#fff;border:1.5px solid var(--line);color:var(--teal-deep);border-radius:12px;padding:12px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="retzef-line"></div>
  <div class="top">
    <div class="av" id="av">ד</div>
    <div><h1 id="hi">היי, דני</h1><p id="cls"></p></div>
    <div class="picker"><select id="stu"></select></div>
  </div>

  <div class="now" id="now"></div>

  <div class="sec">כל המשימות שלי היום</div>
  <div id="tasks"></div>

  <button class="help">✋ אני צריך/ה עזרה</button>

  <div class="legend">
    <div class="row"><span class="badge b-assigned">מהמורה</span> משימה שהמורה של הקבוצה הקצה</div>
    <div class="row"><span class="badge b-rec">מומלץ לך</span> המערכת הציעה לפי הביצוע שלך</div>
    <div class="row"><span class="badge b-free">חופשי</span> תרגול שבחרת בעצמך</div>
    <div style="margin-top:8px">💡 <b>שני צירים:</b> המשימות מגיעות מ<b>מורים שונים</b> — אבל מרוכזות במקום אחד בשבילך.</div>
  </div>
</div>

<script src="seed-pilot.js"></script>
<script>
const SEED=window.PILOT_SEED;
const initials=n=>(n||'?').trim().charAt(0);
const GCOLORS=['#0B8F98','#7c5cbf','#E8722C','#1a9e6a'];
function gColor(gid){ const i=SEED.learningGroups.findIndex(g=>g.id===gid); return GCOLORS[i%GCOLORS.length]; }

function initPicker(){
  document.getElementById('stu').innerHTML=SEED.students.map(s=>`<option value="${s.id}">${s.first_name}</option>`).join('');
  document.getElementById('stu').addEventListener('change',e=>render(e.target.value));
  render('std_01');
}

function tasksFor(studentId){
  // משימה מהמורה — אחת לכל קבוצת לימוד של התלמיד (הציר האקדמי)
  const groups=SEED.helpers.groupsOfStudent(studentId);
  const list=groups.map((g,i)=>{
    const t=SEED.staffMembers.find(m=>m.id===g.teacher_id);
    const unit=SEED.contentUnits.find(u=>u.subject===g.subject)||SEED.contentUnits[0];
    return { type:i===0?'done':'assigned', title:unit.title, group:g, teacher:t.first_name, dur:'10 דק׳' };
  });
  // המלצת מערכת + תרגול חופשי
  const g0=groups[0];
  if(g0){ list.push({type:'rec', title:'חיזוק: זיהוי נושא ונשוא', group:g0,
    teacher:SEED.staffMembers.find(m=>m.id===g0.teacher_id).first_name, dur:'5 דק׳'}); }
  list.push({type:'free', title:'תרגול חופשי — משפטים', group:null, teacher:null, dur:'כפי שתרצה'});
  return list;
}

function render(studentId){
  const s=SEED.students.find(x=>x.id===studentId);
  const cls=SEED.classes.find(c=>c.id===s.class_id);
  document.getElementById('av').textContent=initials(s.first_name);
  document.getElementById('hi').textContent='היי, '+s.first_name;
  document.getElementById('stu').value=studentId;
  const groups=SEED.helpers.groupsOfStudent(studentId);
  document.getElementById('cls').textContent=`${cls.name} · ${groups.length} קבוצות לימוד`;

  const list=tasksFor(studentId);
  // "עכשיו" = המשימה הפעילה הראשונה שלא הושלמה
  const active=list.find(t=>t.type!=='done')||list[0];
  document.getElementById('now').innerHTML=`<div class="lbl">המשימה שלי עכשיו</div>
    <h2>${active.title}</h2>
    <div class="from">${active.group?`${active.group.name} · ${active.teacher}`:'תרגול חופשי'} · ${active.dur}</div>
    <button class="go">${active.type==='done'?'המשך':'התחל'} ←</button>`;

  const meta={
    assigned:{ic:'📌',bg:'var(--teal-soft)',badge:'<span class="badge b-assigned">מהמורה</span>'},
    rec:{ic:'💡',bg:'var(--purple-soft)',badge:'<span class="badge b-rec">מומלץ לך</span>'},
    free:{ic:'🎯',bg:'#eef3f3',badge:'<span class="badge b-free">חופשי</span>'},
    done:{ic:'✓',bg:'var(--green-soft)',badge:'<span class="badge b-done">הושלם</span>'},
  };
  document.getElementById('tasks').innerHTML=list.map(t=>{
    const m=meta[t.type];
    const src=t.group?`<span class="src"><span class="gdot" style="background:${gColor(t.group.id)}"></span>${t.group.name} · ${t.teacher}</span>`:`<span class="src">תרגול עצמאי</span>`;
    return `<div class="task ${t.type==='done'?'done':''}"><div class="ic" style="background:${m.bg}">${m.ic}</div>
      <div class="body"><div class="tt">${t.title}</div>${src}<div class="dur">${t.dur}</div></div>${m.badge}</div>`;
  }).join('');
}
initPicker();
</script>
</body>
</html>
