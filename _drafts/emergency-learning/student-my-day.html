<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רֶצֶף — היום שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0B8F98; --teal-deep:#086b72; --teal-soft:#e6f4f5;
    --ink:#1a2b2d; --muted:#5b7377; --line:#d9e6e7; --bg:#f4f9f9; --card:#fff;
    --green:#1a9e6a; --green-soft:#e5f6ee; --amber:#E8722C; --purple:#7c5cbf; --purple-soft:#efe9fb;
    --shadow:0 2px 8px rgba(11,143,152,.07), 0 10px 30px rgba(11,143,152,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Heebo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:520px;margin:0 auto;padding:20px 18px 70px}
  .retzef-line{height:3px;background:linear-gradient(90deg,var(--teal),transparent);border-radius:2px}
  .top{display:flex;align-items:center;gap:12px;margin-top:14px}
  .top .av{width:46px;height:46px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
  .top h1{font-size:21px;font-weight:800;margin:0}
  .top p{margin:1px 0 0;color:var(--muted);font-size:13px}
  .picker{margin-inline-start:auto}
  select{font-family:inherit;font-size:13px;padding:8px 11px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}

  /* התקדמות */
  .prog{margin-top:18px}
  .prog .ptop{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:6px}
  .prog .ptop b{color:var(--ink);font-size:14px}
  .pbar{height:10px;border-radius:6px;background:#e4eeee;overflow:hidden}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));transition:.4s}

  /* עכשיו — כרטיס-על יחיד */
  .now{background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff;border-radius:20px;padding:22px;margin-top:16px;box-shadow:0 10px 30px rgba(11,143,152,.22)}
  .now .lbl{font-size:12px;font-weight:800;opacity:.9;text-transform:uppercase;letter-spacing:1px}
  .now h2{margin:8px 0 6px;font-size:23px;line-height:1.2}
  .now .from{font-size:13.5px;opacity:.92;display:flex;align-items:center;gap:6px}
  .now .from .gdot{width:8px;height:8px;border-radius:50%;background:#fff}
  .now .go{margin-top:18px;background:#fff;color:var(--teal-deep);border:none;border-radius:14px;padding:15px;width:100%;font-size:18px;font-weight:800;cursor:pointer;font-family:inherit}
  .now .alldone{font-size:16px;font-weight:700;margin-top:6px}

  .sec{font-size:13px;font-weight:800;color:var(--muted);margin:24px 4px 10px;display:flex;align-items:center;gap:7px}
  .task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);margin-bottom:9px;display:flex;align-items:center;gap:12px}
  .task .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--teal-soft)}
  .task .body{flex:1;min-width:0}
  .task .tt{font-weight:700;font-size:15px}
  .task .src{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:2px}
  .task .src .gdot{width:7px;height:7px;border-radius:50%}
  .task .dur{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
  .task .startlink{font-size:13px;font-weight:700;color:var(--teal-deep);white-space:nowrap}

  /* מקופלים */
  .fold{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:10px;overflow:hidden}
  .fold summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  .fold summary::-webkit-details-marker{display:none}
  .fold summary .chev{margin-inline-start:auto;color:var(--muted);transition:.2s}
  .fold[open] summary .chev{transform:rotate(180deg)}
  .fold .inner{padding:0 14px 12px}
  .fold.completed summary{color:var(--green)}
  .task.mini{box-shadow:none;border:none;border-top:1px solid var(--line);border-radius:0;padding:11px 2px}
  .task.mini .ic{background:var(--green-soft);color:var(--green)}
  .task.done-txt .tt{color:var(--muted)}
  .task.extra .ic{background:var(--purple-soft)}

  .help{margin-top:20px;width:100%;background:#fff;border:1.5px solid var(--line);color:var(--teal-deep);border-radius:14px;padding:14px;font-weight:800;cursor:pointer;font-family:inherit;font-size:15px}
  .twonote{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="retzef-line"></div>
  <div class="top">
    <div class="av" id="av">ד</div>
    <div><h1 id="hi">היי, דני</h1><p id="cls"></p></div>
    <div class="picker"><select id="stu"></select></div>
  </div>

  <div class="prog">
    <div class="ptop"><span>ההתקדמות שלי היום</span><b id="progTxt">0 / 0</b></div>
    <div class="pbar"><i id="progBar" style="width:0%"></i></div>
  </div>

  <div class="now" id="now"></div>

  <div id="pendingWrap"></div>
  <div id="extraWrap"></div>
  <div id="completedWrap"></div>

  <button class="help">✋ אני צריך/ה עזרה</button>
  <div class="twonote">💡 המשימות מגיעות ממורים שונים — מרוכזות במקום אחד בשבילך.</div>
</div>

<script src="seed-pilot.js"></script>
<script>
const SEED=window.PILOT_SEED;
const initials=n=>(n||'?').trim().charAt(0);
const GCOLORS=['#0B8F98','#7c5cbf','#E8722C','#1a9e6a'];
const gColor=gid=>{const i=SEED.learningGroups.findIndex(g=>g.id===gid);return GCOLORS[i%GCOLORS.length];};

function initPicker(){
  document.getElementById('stu').innerHTML=SEED.students.map(s=>`<option value="${s.id}">${s.first_name}</option>`).join('');
  document.getElementById('stu').addEventListener('change',e=>render(e.target.value));
  render('std_01');
}

function tasksFor(studentId){
  const groups=SEED.helpers.groupsOfStudent(studentId);
  // משימות "מהמורה" — אחת לכל קבוצת לימוד. הראשונה כבר הושלמה (הדגמה).
  const core=groups.map((g,i)=>{
    const t=SEED.staffMembers.find(m=>m.id===g.teacher_id);
    const unit=SEED.contentUnits.find(u=>u.subject===g.subject)||SEED.contentUnits[0];
    return {status:i===0?'done':'todo', title:unit.title, group:g, teacher:t.first_name, dur:'10 דק׳'};
  });
  const g0=groups[0], t0=g0&&SEED.staffMembers.find(m=>m.id===g0.teacher_id).first_name;
  const extra=[
    {kind:'rec', title:'חיזוק: זיהוי נושא ונשוא', group:g0, teacher:t0, dur:'5 דק׳'},
    {kind:'free', title:'תרגול חופשי — משפטים', group:null, teacher:null, dur:'כרצונך'},
  ];
  return {core, extra};
}
const srcHtml=(g,teacher)=>g?`<span class="src"><span class="gdot" style="background:${gColor(g.id)}"></span>${g.name} · ${teacher}</span>`:`<span class="src">תרגול עצמאי</span>`;

function render(studentId){
  const s=SEED.students.find(x=>x.id===studentId);
  const cls=SEED.classes.find(c=>c.id===s.class_id);
  const groups=SEED.helpers.groupsOfStudent(studentId);
  document.getElementById('av').textContent=initials(s.first_name);
  document.getElementById('hi').textContent='היי, '+s.first_name;
  document.getElementById('cls').textContent=`${cls.name} · ${groups.length} קבוצות לימוד`;
  document.getElementById('stu').value=studentId;

  const {core,extra}=tasksFor(studentId);
  const todo=core.filter(t=>t.status==='todo');
  const done=core.filter(t=>t.status==='done');

  // התקדמות
  const pct=core.length?Math.round(done.length/core.length*100):0;
  document.getElementById('progTxt').textContent=`${done.length} / ${core.length}`;
  document.getElementById('progBar').style.width=pct+'%';

  // עכשיו — המשימה הראשונה שנותרה (או סיום)
  const now=document.getElementById('now');
  if(todo.length){
    const a=todo[0];
    now.innerHTML=`<div class="lbl">עכשיו</div><h2>${a.title}</h2>
      <div class="from"><span class="gdot"></span>${a.group.name} · ${a.teacher} · ${a.dur}</div>
      <button class="go">התחל ←</button>`;
  } else {
    now.innerHTML=`<div class="lbl">כל הכבוד</div><div class="alldone">סיימת את כל המשימות של היום! 🎉</div>
      <button class="go">רוצה עוד תרגול?</button>`;
  }

  // עוד מחכה לי — רק מה שנותר (בלי הראשונה שכבר בכרטיס-על)
  const rest=todo.slice(1);
  document.getElementById('pendingWrap').innerHTML = rest.length? `
    <div class="sec">עוד מחכה לי (${rest.length})</div>` + rest.map(t=>`
    <div class="task"><div class="ic">📌</div>
      <div class="body"><div class="tt">${t.title}</div>${srcHtml(t.group,t.teacher)}</div>
      <span class="dur">${t.dur}</span></div>`).join('') : '';

  // רוצה עוד? — מקופל, זניח
  document.getElementById('extraWrap').innerHTML=`
    <details class="fold"><summary>💡 רוצה עוד תרגול? <span class="chev">▾</span></summary>
      <div class="inner">${extra.map(e=>`
        <div class="task extra mini"><div class="ic">${e.kind==='rec'?'💡':'🎯'}</div>
          <div class="body"><div class="tt">${e.title}</div>${srcHtml(e.group,e.teacher)}</div>
          <span class="startlink">התחל</span></div>`).join('')}</div></details>`;

  // מה שסיימתי — מקופל למטה, קטן
  document.getElementById('completedWrap').innerHTML = done.length? `
    <details class="fold completed"><summary>✓ סיימתי היום (${done.length}) <span class="chev">▾</span></summary>
      <div class="inner">${done.map(t=>`
        <div class="task mini done-txt"><div class="ic">✓</div>
          <div class="body"><div class="tt">${t.title}</div>${srcHtml(t.group,t.teacher)}</div></div>`).join('')}</div></details>` : '';
}
initPicker();
</script>
</body>
</html>
