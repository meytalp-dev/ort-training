<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רֶצֶף — היום שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css?v=2">
<link rel="stylesheet" href="components.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Heebo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:520px;margin:0 auto;padding:20px 18px 70px}
  .top{display:flex;align-items:center;gap:12px;margin-top:14px}
  .top .av{width:46px;height:46px;border-radius:50%;background:var(--surface-muted);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
  .top h1{font-size:21px;font-weight:800;margin:0}
  .top p{margin:1px 0 0;color:var(--ink-soft);font-size:13px}
  .picker{margin-inline-start:auto}
  select{font-family:inherit;font-size:13px;padding:8px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--card,#fff);color:var(--ink)}

  /* התקדמות */
  .prog{margin-top:18px}
  .prog .ptop{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
  .prog .ptop b{color:var(--ink);font-size:14px}
  .pbar{height:10px;border-radius:6px;background:var(--surface-muted,#EEF5F6);overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--brand,#0B8F98);transition:.4s}

  /* עכשיו — כרטיס-על יחיד (משטח פעולה ראשי = דיו) */
  .now{background:var(--action);color:var(--on-action);border-radius:20px;padding:22px;margin-top:16px;box-shadow:var(--shadow-card)}
  .now .lbl{font-size:12px;font-weight:800;opacity:.9;text-transform:uppercase;letter-spacing:1px}
  .now h2{margin:8px 0 6px;font-size:23px;line-height:1.2}
  .now .from{font-size:13.5px;opacity:.92;display:flex;align-items:center;gap:6px}
  .now .from .gdot{width:8px;height:8px;border-radius:50%;background:var(--on-action,#fff)}
  .now .go{margin-top:18px;background:var(--card,#fff);color:var(--action);border:none;border-radius:14px;padding:15px;width:100%;font-size:18px;font-weight:800;cursor:pointer;font-family:inherit}
  .now .alldone{font-size:16px;font-weight:700;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}

  .sec{font-size:13px;font-weight:800;color:var(--ink-soft);margin:24px 4px 10px;display:flex;align-items:center;gap:7px}
  .task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow-card);margin-bottom:9px;display:flex;align-items:center;gap:12px}
  .task .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--surface-muted);color:var(--ink-soft)}
  .task .body{flex:1;min-width:0}
  .task .tt{font-weight:700;font-size:15px}
  .task .src{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);margin-top:2px}
  .task .src .gdot{width:7px;height:7px;border-radius:50%}
  .task .dur{font-size:12px;color:var(--ink-soft);font-weight:600;white-space:nowrap}
  .task .startlink{font-size:13px;font-weight:700;color:var(--action);white-space:nowrap}

  /* מקופלים */
  .fold{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:10px;overflow:hidden}
  .fold summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  .fold summary::-webkit-details-marker{display:none}
  .fold summary .chev{margin-inline-start:auto;color:var(--ink-soft);transition:.2s}
  .fold[open] summary .chev{transform:rotate(180deg)}
  .fold .inner{padding:0 14px 12px}
  .fold.completed summary{color:var(--status-good)}
  .task.mini{box-shadow:none;border:none;border-top:1px solid var(--line);border-radius:0;padding:11px 2px}
  .task.mini .ic{background:var(--status-good-soft);color:var(--status-good)}
  .task.done-txt .tt{color:var(--ink-soft)}
  .task.extra .ic{background:var(--surface-muted)}

  .help{margin-top:20px;width:100%;background:var(--card,#fff);border:1.5px solid var(--line);color:var(--action);border-radius:14px;padding:14px;font-weight:800;cursor:pointer;font-family:inherit;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
  .twonote{margin-top:16px;font-size:12px;color:var(--ink-soft);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
  .twonote svg{flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="av" id="av">ד</div>
    <div><h1 id="hi">היי, דני</h1><p id="cls"></p></div>
    <div class="picker"><select id="stu"></select></div>
  </div>

  <div class="prog">
    <div class="ptop"><span>ההתקדמות שלי היום</span><b id="progTxt">0 / 0</b></div>
    <div class="pbar"><i id="progBar" style="width:0%"></i></div>
  </div>

  <div class="now" id="now"></div>

  <div id="pendingWrap"></div>
  <div id="extraWrap"></div>
  <div id="completedWrap"></div>

  <button class="help"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10"/><path d="M12 10V4.5a1.5 1.5 0 0 1 3 0V10"/><path d="M15 10.5V6.8a1.5 1.5 0 0 1 3 0V14c0 3.3-2.2 5.5-5.5 5.5S8 17.8 7 16l-1.8-3a1.4 1.4 0 0 1 2.3-1.5L9 13"/></svg>אני צריך/ה עזרה</button>
  <div class="twonote"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M8.5 14A5.5 5.5 0 1 1 17 9.5c0 1.9-1 3-1.7 3.7-.5.5-.8.9-.8 1.8H11c0-.9-.3-1.3-.8-1.8"/></svg>המשימות מגיעות ממורים שונים — מרוכזות במקום אחד בשבילך.</div>
</div>

<script src="seed-pilot.js"></script>
<script>
const SEED=window.PILOT_SEED;
const initials=n=>(n||'?').trim().charAt(0);
const GCOLORS=['#0B8F98','#7c5cbf','#E8722C','#1a9e6a'];
const gColor=gid=>{const i=SEED.learningGroups.findIndex(g=>g.id===gid);return GCOLORS[i%GCOLORS.length];};

function initPicker(){
  document.getElementById('stu').innerHTML=SEED.students.map(s=>`<option value="${s.id}">${s.first_name}</option>`).join('');
  document.getElementById('stu').addEventListener('change',e=>render(e.target.value));
  render('std_01');
}

function tasksFor(studentId){
  const groups=SEED.helpers.groupsOfStudent(studentId);
  // משימות "מהמורה" — אחת לכל קבוצת לימוד. הראשונה כבר הושלמה (הדגמה).
  const core=groups.map((g,i)=>{
    const t=SEED.staffMembers.find(m=>m.id===g.teacher_id);
    const unit=SEED.contentUnits.find(u=>u.subject===g.subject)||SEED.contentUnits[0];
    return {status:i===0?'done':'todo', title:unit.title, group:g, teacher:t.first_name, dur:'10 דק׳'};
  });
  const g0=groups[0], t0=g0&&SEED.staffMembers.find(m=>m.id===g0.teacher_id).first_name;
  const extra=[
    {kind:'rec', title:'חיזוק: זיהוי נושא ונשוא', group:g0, teacher:t0, dur:'5 דק׳'},
    {kind:'free', title:'תרגול חופשי — משפטים', group:null, teacher:null, dur:'כרצונך'},
  ];
  return {core, extra};
}
const srcHtml=(g,teacher)=>g?`<span class="src"><span class="gdot" style="background:${gColor(g.id)}"></span>${g.name} · ${teacher}</span>`:`<span class="src">תרגול עצמאי</span>`;

function render(studentId){
  const s=SEED.students.find(x=>x.id===studentId);
  const cls=SEED.classes.find(c=>c.id===s.class_id);
  const groups=SEED.helpers.groupsOfStudent(studentId);
  document.getElementById('av').textContent=initials(s.first_name);
  document.getElementById('hi').textContent='היי, '+s.first_name;
  document.getElementById('cls').textContent=`${cls.name} · ${groups.length} קבוצות לימוד`;
  document.getElementById('stu').value=studentId;

  const {core,extra}=tasksFor(studentId);
  const todo=core.filter(t=>t.status==='todo');
  const done=core.filter(t=>t.status==='done');

  // התקדמות
  const pct=core.length?Math.round(done.length/core.length*100):0;
  document.getElementById('progTxt').textContent=`${done.length} / ${core.length}`;
  document.getElementById('progBar').style.width=pct+'%';

  // עכשיו — המשימה הראשונה שנותרה (או סיום)
  const now=document.getElementById('now');
  if(todo.length){
    const a=todo[0];
    now.innerHTML=`<div class="lbl">עכשיו</div><h2>${a.title}</h2>
      <div class="from"><span class="gdot"></span>${a.group.name} · ${a.teacher} · ${a.dur}</div>
      <button class="go">התחל ←</button>`;
  } else {
    now.innerHTML=`<div class="lbl">כל הכבוד</div><div class="alldone">סיימת את כל המשימות של היום!<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></svg></div>
      <button class="go">רוצה עוד תרגול?</button>`;
  }

  // עוד מחכה לי — רק מה שנותר (בלי הראשונה שכבר בכרטיס-על)
  const rest=todo.slice(1);
  document.getElementById('pendingWrap').innerHTML = rest.length? `
    <div class="sec">עוד מחכה לי (${rest.length})</div>` + rest.map(t=>`
    <div class="task"><div class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16v6"/><path d="M8 3h8l-1.2 7 2.7 2v1H6.5v-1l2.7-2L8 3Z"/></svg></div>
      <div class="body"><div class="tt">${t.title}</div>${srcHtml(t.group,t.teacher)}</div>
      <span class="dur">${t.dur}</span></div>`).join('') : '';

  // רוצה עוד? — מקופל, זניח
  document.getElementById('extraWrap').innerHTML=`
    <details class="fold"><summary><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M8.5 14A5.5 5.5 0 1 1 17 9.5c0 1.9-1 3-1.7 3.7-.5.5-.8.9-.8 1.8H11c0-.9-.3-1.3-.8-1.8"/></svg>רוצה עוד תרגול? <span class="chev">▾</span></summary>
      <div class="inner">${extra.map(e=>`
        <div class="task extra mini"><div class="ic">${e.kind==='rec'?'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M8.5 14A5.5 5.5 0 1 1 17 9.5c0 1.9-1 3-1.7 3.7-.5.5-.8.9-.8 1.8H11c0-.9-.3-1.3-.8-1.8"/></svg>':'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>'}</div>
          <div class="body"><div class="tt">${e.title}</div>${srcHtml(e.group,e.teacher)}</div>
          <span class="startlink">התחל</span></div>`).join('')}</div></details>`;

  // מה שסיימתי — מקופל למטה, קטן
  document.getElementById('completedWrap').innerHTML = done.length? `
    <details class="fold completed"><summary>✓ סיימתי היום (${done.length}) <span class="chev">▾</span></summary>
      <div class="inner">${done.map(t=>`
        <div class="task mini done-txt"><div class="ic">✓</div>
          <div class="body"><div class="tt">${t.title}</div>${srcHtml(t.group,t.teacher)}</div></div>`).join('')}</div></details>` : '';
}
initPicker();
</script>
</body>
</html>
