<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רֶצֶף — אשף הקמת בית ספר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0B8F98; --teal-deep:#086b72; --teal-soft:#e6f4f5;
    --ink:#1a2b2d; --muted:#5b7377; --line:#d9e6e7; --bg:#f4f9f9; --card:#fff;
    --green:#1a9e6a; --green-soft:#e5f6ee; --amber:#E8722C; --amber-soft:#fdeee3;
    --shadow:0 2px 8px rgba(11,143,152,.07), 0 10px 30px rgba(11,143,152,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Heebo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 90px}
  .retzef-line{height:3px;background:linear-gradient(90deg,var(--teal),transparent);border-radius:2px}
  header{margin:14px 0 8px}
  header h1{font-size:25px;font-weight:800;margin:10px 0 2px}
  header p{color:var(--muted);margin:0;font-size:15px}

  /* Stepper */
  .stepper{display:flex;gap:6px;margin:22px 0 10px}
  .stepper .st{flex:1;text-align:center;font-size:12px;color:var(--muted);position:relative}
  .stepper .bar{height:6px;border-radius:4px;background:var(--line);margin-bottom:7px;transition:.25s}
  .stepper .st.done .bar,.stepper .st.active .bar{background:var(--teal)}
  .stepper .st.active{color:var(--teal-deep);font-weight:700}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    padding:26px;margin-top:14px;min-height:320px}
  .step-tag{font-size:12px;font-weight:700;color:var(--teal-deep);text-transform:uppercase;letter-spacing:.5px}
  .card h2{font-size:21px;margin:6px 0 4px;font-weight:800}
  .card .hint{color:var(--muted);font-size:14px;margin:0 0 20px}

  label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
  input,select,textarea{width:100%;font-family:inherit;font-size:15px;padding:11px 13px;border-radius:11px;
    border:1.5px solid var(--line);background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
  textarea{min-height:120px;resize:vertical;font-family:'Assistant',monospace;font-size:13px;direction:ltr;text-align:left}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}

  .rowlist{margin-top:8px}
  .rowitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:7px;font-size:14px;background:#fbfdfd}
  .rowitem .av{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .rowitem .role{margin-inline-start:auto;font-size:12px;color:var(--muted);background:var(--teal-soft);
    padding:3px 9px;border-radius:999px}

  .gbox{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .gbox .gh{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .gbox .gh b{font-size:15px}
  .gbox .gh .gt{font-size:12px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chk{font-size:12px;padding:5px 9px;border-radius:8px;border:1.5px solid var(--line);cursor:pointer;
    user-select:none;background:#fff;transition:.12s}
  .chk.on{background:var(--teal);color:#fff;border-color:var(--teal)}

  .contentgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.contentgrid{grid-template-columns:1fr}}
  .cunit{border:1.5px solid var(--line);border-radius:11px;padding:12px;cursor:pointer;transition:.12s}
  .cunit.on{border-color:var(--teal);background:var(--teal-soft)}
  .cunit b{font-size:14px}
  .cunit small{color:var(--muted);display:block;font-size:12px}

  /* readiness */
  .ready{display:flex;flex-direction:column;gap:10px}
  .check{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:11px;font-size:15px;
    background:var(--green-soft);border:1px solid #c6ead9}
  .check.fail{background:var(--amber-soft);border-color:#f4cdb2}
  .check .ic{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;
    align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
  .check.fail .ic{background:var(--amber)}
  .summary{margin-top:18px;background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff;
    border-radius:16px;padding:22px;text-align:center}
  .summary .big{font-size:19px;font-weight:800}
  .summary .stats{display:flex;justify-content:center;gap:26px;margin-top:14px;flex-wrap:wrap}
  .summary .stats div{text-align:center}
  .summary .stats b{display:block;font-size:30px;font-weight:800;line-height:1}
  .summary .stats small{font-size:12px;opacity:.85}

  /* nav */
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
  button.nav-btn{font-family:inherit;font-size:15px;font-weight:700;padding:12px 26px;border-radius:12px;
    border:none;cursor:pointer;transition:.15s}
  .prev{background:#fff;border:1.5px solid var(--line);color:var(--muted)}
  .prev:hover{border-color:var(--muted)}
  .next{background:var(--teal);color:#fff}
  .next:hover{background:var(--teal-deep)}
  .prev:disabled{opacity:.4;cursor:default}
  .mini{font-size:13px;color:var(--muted);margin-top:10px}
  .linkbtn{background:none;border:none;color:var(--teal-deep);font-weight:700;cursor:pointer;font-size:13px;text-decoration:underline;font-family:inherit;padding:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="retzef-line"></div>
    <h1>אשף הקמת בית ספר</h1>
    <p>שישה צעדים מ"בית ספר חדש" ל"מוכן להפעלה". <b>מודל שני-צירים.</b></p>
  </header>

  <div class="stepper" id="stepper"></div>
  <div class="card" id="card"></div>

  <div class="nav">
    <button class="nav-btn prev" id="prev">חזרה</button>
    <button class="nav-btn next" id="next">הבא ←</button>
  </div>
  <p class="mini" id="mini"></p>
</div>

<script src="seed-pilot.js"></script>
<script>
const SEED = window.PILOT_SEED;
const initials = n => (n||'?').trim().charAt(0);

// ---- מצב האשף (מתחיל ריק, נטען מהדמה לנוחות הדגמה) --------------------------
const state = {
  school:  { name:'', network:'אורט', district:'' },
  cls:     { name:'', grade:'י' },
  staff:   [],       // {id,name,roleLabel}
  students:[],       // {id,name}
  groups:  [],       // {id,name,subject,teacherId,members:Set}
  content: new Set(),// content unit ids פעילים
};

const STEPS = ['בית ספר','כיתה','משתמשים','קבוצות ושיוך','תכנים','מוכנות'];
let step = 0;

// ---- טעינה מהירה מהפיילוט (כדי שמייטל תראה אשף מלא) -------------------------
function loadPilot(){
  state.school = { name:SEED.schools[0].name, network:SEED.schools[0].network, district:SEED.schools[0].district };
  const c = SEED.classes[0];
  state.cls = { name:c.name, grade:c.grade };
  state.staff = SEED.staffMembers.map(m=>{
    const r = SEED.staffRoles.find(x=>x.staff_id===m.id);
    const map={homeroom:'מחנך/ת',subject:'מורה מקצועי',principal:'מנהל/ת',coordinator:'רכז תקשוב',supervisor:'מפקח/ת',substitute:'מורה מחליף/ה'};
    return { id:m.id, name:m.first_name, roleLabel:map[r?.role]||'צוות' };
  });
  state.students = SEED.students.map(s=>({id:s.id,name:s.first_name}));
  state.groups = SEED.learningGroups.map(g=>({
    id:g.id, name:g.name, subject:g.subject, teacherId:g.teacher_id,
    members:new Set(SEED.helpers.studentsOfGroup(g.id).map(s=>s.id)),
  }));
  state.content = new Set(SEED.contentUnits.map(u=>u.id));
  render();
}

// ---- רינדור צעדים -----------------------------------------------------------
function stepper(){
  document.getElementById('stepper').innerHTML = STEPS.map((s,i)=>
    `<div class="st ${i<step?'done':''} ${i===step?'active':''}"><div class="bar"></div>${s}</div>`).join('');
}

function render(){
  stepper();
  const c = document.getElementById('card');
  const R = renderers[step]();
  c.innerHTML = `<div class="step-tag">צעד ${step+1} מתוך 6</div>${R}`;
  document.getElementById('prev').disabled = step===0;
  document.getElementById('next').textContent = step===5 ? 'סיום ✓' : 'הבא ←';
  document.getElementById('next').style.display = step===5 ? 'none':'block';
  document.getElementById('mini').innerHTML = step===0
    ? 'טיפ: <button class="linkbtn" onclick="loadPilot()">טען את נתוני הפיילוט (אורט בית הערבה)</button> כדי לראות אשף מלא.'
    : '';
  if(renderers['after'+step]) renderers['after'+step]();
}

const renderers = {
  0:()=>`<h2>פתיחת בית ספר</h2><p class="hint">הישות הראשונה שנוצרת — לא מורה בודד, אלא בית הספר.</p>
    <label class="f">שם בית הספר</label><input id="i-name" value="${state.school.name}" placeholder="למשל: אורט בית הערבה">
    <div class="grid2">
      <div><label class="f">רשת</label><input id="i-net" value="${state.school.network}"></div>
      <div><label class="f">מחוז / רשות</label><input id="i-dist" value="${state.school.district}" placeholder="מחוז דרום"></div>
    </div>`,
  after0:()=>{
    bind('i-name',v=>state.school.name=v); bind('i-net',v=>state.school.network=v); bind('i-dist',v=>state.school.district=v);
  },

  1:()=>`<h2>שכבה וכיתת אם</h2><p class="hint">כיתת האם = הציר הפסטורלי. עליה יושבים צ'ק-אין ודופק המחנך. (בפיילוט: כיתה אחת.)</p>
    <div class="grid2">
      <div><label class="f">שם הכיתה</label><input id="i-cls" value="${state.cls.name}" placeholder="י'1"></div>
      <div><label class="f">שכבה</label>
        <select id="i-grade">${['ט','י','יא','יב'].map(g=>`<option ${g===state.cls.grade?'selected':''}>${g}</option>`).join('')}</select></div>
    </div>`,
  after1:()=>{ bind('i-cls',v=>state.cls.name=v); bind('i-grade',v=>state.cls.grade=v); },

  2:()=>`<h2>הוספת משתמשים</h2><p class="hint">הדרך הפשוטה להתחיל: הדבקת CSV. עמודות: <code>שם,טלפון,תפקיד</code> (תפקיד ריק = תלמיד).</p>
    <textarea id="i-csv" placeholder="דני,0501112000\nמיכל,0500000101,מחנך"></textarea>
    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
      <button class="nav-btn next" style="padding:9px 18px;font-size:14px" onclick="importCsv()">ייבוא</button>
      <button class="linkbtn" onclick="fillSampleCsv()">טען CSV לדוגמה (22 תלמידים + 5 צוות)</button>
    </div>
    <div id="importResult" class="mini"></div>
    <div class="rowlist" id="userList"></div>`,
  after2:()=>renderUserList(),

  3:()=>{
    return `<h2>קבוצות לימוד ושיוך</h2><p class="hint">הציר האקדמי. סמנו מי בכל קבוצה. <b>שימו לב לתגבור — רק חלק מהתלמידים (חפיפה חלקית).</b></p>
    <div id="groupBox"></div>`;
  },
  after3:()=>renderGroups(),

  4:()=>`<h2>תכנים פעילים</h2><p class="hint">אילו יחידות מהספרייה נדליק לבית הספר. (AI לא מפרסם לבד — הכל מאושר.)</p>
    <div class="contentgrid" id="contentGrid"></div>`,
  after4:()=>renderContent(),

  5:()=>`<h2>בדיקת מוכנות</h2><p class="hint">האם המסלול הזהוב סגור — אפשר להפעיל?</p>
    <div class="ready" id="readyList"></div><div id="summaryBox"></div>`,
  afterafter:()=>{},
};

// ---- helpers ----------------------------------------------------------------
function bind(id,fn){ const el=document.getElementById(id); if(el) el.addEventListener('input',e=>fn(e.target.value)); }

function fillSampleCsv(){
  const staffRows = SEED.staffMembers.map(m=>{
    const r=SEED.staffRoles.find(x=>x.staff_id===m.id);
    const map={homeroom:'מחנך',subject:'מורה',principal:'מנהל',coordinator:'רכז תקשוב',supervisor:'מפקח',substitute:'מחליף'};
    return `${m.first_name},${m.phone},${map[r?.role]||'מורה'}`;
  });
  const stuRows = SEED.students.map(s=>`${s.first_name},${s.phone}`);
  document.getElementById('i-csv').value = staffRows.concat(stuRows).join('\n');
}
function importCsv(){
  const lines = (document.getElementById('i-csv').value||'').split('\n').map(l=>l.trim()).filter(Boolean);
  state.staff=[]; state.students=[]; let si=0, ti=0;
  lines.forEach(line=>{
    const [name,phone,role] = line.split(',').map(x=>(x||'').trim());
    if(!name) return;
    if(role){ state.staff.push({id:'stf_'+(++si),name,roleLabel:role}); }
    else { state.students.push({id:'std_new_'+(++ti),name}); }
  });
  document.getElementById('importResult').innerHTML =
    `<b style="color:var(--teal-deep)">יובאו ${state.staff.length} צוות ו-${state.students.length} תלמידים.</b>`;
  renderUserList();
}
function renderUserList(){
  const el=document.getElementById('userList'); if(!el) return;
  const all=[...state.staff.map(s=>({...s,staff:true})),...state.students.map(s=>({...s,staff:false}))];
  el.innerHTML = all.slice(0,30).map(u=>
    `<div class="rowitem"><span class="av">${initials(u.name)}</span>${u.name}
     <span class="role">${u.staff?u.roleLabel:'תלמיד/ה'}</span></div>`).join('')
    + (all.length>30?`<div class="mini">…ועוד ${all.length-30}</div>`:'');
}

function renderGroups(){
  const box=document.getElementById('groupBox'); if(!box) return;
  if(!state.groups.length){
    // צור קבוצות ברירת מחדל מהדמה אם עוד לא קיימות
    state.groups = SEED.learningGroups.map(g=>({id:g.id,name:g.name,subject:g.subject,teacherId:g.teacher_id,members:new Set()}));
  }
  box.innerHTML = state.groups.map((g,gi)=>{
    const t=state.staff.find(s=>s.id===g.teacherId) || SEED.staffMembers.find(m=>m.id===g.teacherId);
    const tname = t? (t.name||t.first_name):'—';
    const chips = state.students.map(s=>
      `<span class="chk ${g.members.has(s.id)?'on':''}" onclick="toggleMember(${gi},'${s.id}')">${s.name}</span>`).join('');
    return `<div class="gbox"><div class="gh"><b>${g.name}</b>
      <span class="gt">${g.subject} · ${tname} · <b id="gc-${gi}">${g.members.size}</b> תלמידים</span></div>
      <div class="chips">${chips}</div></div>`;
  }).join('');
}
function toggleMember(gi,sid){
  const g=state.groups[gi];
  if(g.members.has(sid)) g.members.delete(sid); else g.members.add(sid);
  renderGroups();
}

function renderContent(){
  const grid=document.getElementById('contentGrid'); if(!grid) return;
  grid.innerHTML = SEED.contentUnits.map(u=>
    `<div class="cunit ${state.content.has(u.id)?'on':''}" onclick="toggleContent('${u.id}')">
      <b>${u.title}</b><small>${u.subject} · ${u.unit_type==='assessment'?'מופע הערכה':'תרגול'}</small></div>`).join('');
}
function toggleContent(id){ state.content.has(id)?state.content.delete(id):state.content.add(id); renderContent(); }

function renderReadiness(){
  const enrolledIds = new Set();
  state.groups.forEach(g=>g.members.forEach(id=>enrolledIds.add(id)));
  const orphans = state.students.filter(s=>!enrolledIds.has(s.id));
  const hasTigburPartial = state.groups.some(g=>g.members.size>0 && g.members.size<state.students.length);
  const checks = [
    { ok:!!state.school.name, t:`בית ספר: ${state.school.name||'— חסר שם'}` },
    { ok:!!state.cls.name, t:`כיתת אם: ${state.cls.name||'— חסרה'}` },
    { ok:state.students.length>0, t:`${state.students.length} תלמידים יובאו` },
    { ok:state.staff.length>0, t:`${state.staff.length} אנשי צוות` },
    { ok:state.groups.length>=2, t:`${state.groups.length} קבוצות לימוד (ציר אקדמי)` },
    { ok:orphans.length===0 && state.students.length>0,
      t: orphans.length? `${orphans.length} תלמידים לא שובצו לאף קבוצה` : 'כל תלמיד משובץ לפחות לקבוצה אחת' },
    { ok:hasTigburPartial, t: hasTigburPartial? 'יש קבוצה עם חפיפה חלקית — שני-צירים פעיל' : 'אין חפיפה חלקית (כל הקבוצות מלאות)' },
    { ok:state.content.size>0, t:`${state.content.size} יחידות תוכן פעילות` },
  ];
  document.getElementById('readyList').innerHTML = checks.map(c=>
    `<div class="check ${c.ok?'':'fail'}"><span class="ic">${c.ok?'✓':'!'}</span>${c.t}</div>`).join('');
  const allOk = checks.every(c=>c.ok);
  document.getElementById('summaryBox').innerHTML = allOk
    ? `<div class="summary"><div class="big">בית הספר מוכן להפעלה ✓</div>
        <div class="stats">
          <div><b>1</b><small>כיתת אם</small></div>
          <div><b>${state.staff.length}</b><small>מורים</small></div>
          <div><b>${state.students.length}</b><small>תלמידים</small></div>
          <div><b>${state.groups.length}</b><small>קבוצות</small></div>
        </div></div>`
    : `<div class="mini" style="margin-top:16px">יש סעיפים שדורשים השלמה (בכתום) לפני הפעלה.</div>`;
}

// ---- ניווט ------------------------------------------------------------------
document.getElementById('next').addEventListener('click',()=>{ if(step<5){step++;render(); if(step===5)renderReadiness();} });
document.getElementById('prev').addEventListener('click',()=>{ if(step>0){step--;render();} });

render();
</script>
</body>
</html>
