<!DOCTYPE html>
<html lang="he" dir="rtl" data-layer="shell">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רֶצֶף — לוח מיגרציה עיצובית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css?v=2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M30 16h-4.5' stroke='%2391A5AE' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M7.5 16H2' stroke='%230B8F98' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23fff' stroke='%230B8F98' stroke-width='4'/%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font-body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 20px 70px}

  .brandbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .brandbar a{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brandbar b{font-family:var(--font-head);font-weight:900;font-size:18px;color:var(--ink-strong)}
  .layer{font-size:11.5px;font-weight:700;color:var(--shell,#A61E64);background:var(--shell-soft,#FDEDF4);border:1px solid var(--shell-line,#F3C6DA);padding:2px 9px;border-radius:var(--radius-pill)}
  .mark{width:60px;height:16px}.mark .p{stroke:var(--ink-faint);stroke-linecap:round}.mark .n{stroke:var(--brand);stroke-width:3.6;stroke-linecap:round}.mark .c{fill:var(--card);stroke:var(--brand);stroke-width:3.6}
  h1{font-family:var(--font-head);font-size:23px;font-weight:800;color:var(--ink-strong);letter-spacing:-.01em}
  .sub{color:var(--ink-soft);font-size:14px;margin-top:2px}
  .rule{font-size:12.5px;color:var(--ink-soft);margin-top:8px}
  .rule a{color:var(--shell,#A61E64);font-weight:700;text-decoration:none}

  .prog{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .prog .top{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .prog .pct{font-family:var(--font-head);font-size:26px;font-weight:900;color:var(--ink-strong);font-variant-numeric:tabular-nums}
  .prog .lbl{font-size:13px;color:var(--ink-soft)}
  .track{height:9px;border-radius:5px;background:var(--surface-muted);overflow:hidden}
  .track i{display:block;height:100%;background:var(--shell,#A61E64);transition:width .5s cubic-bezier(.22,1,.36,1)}

  .filters{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0 4px}
  .filters button{font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-pill);padding:7px 14px;cursor:pointer;transition:.15s}
  .filters button:hover{border-color:var(--shell-line,#F3C6DA)}
  .filters button[aria-pressed="true"]{background:var(--shell,#A61E64);color:var(--on-shell,#fff);border-color:var(--shell,#A61E64)}

  .grp{margin-top:22px}
  .grp h2{font-family:var(--font-head);font-size:15px;font-weight:800;color:var(--ink-strong);display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .grp h2 .cnt{font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--surface-muted);padding:1px 8px;border-radius:var(--radius-pill)}

  .list{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .row{display:flex;align-items:center;gap:11px;min-height:48px;padding:0 14px;border-top:1px solid var(--line);font-size:13.5px}
  .row:first-child{border-top:none}
  .row:hover{background:var(--bg-soft)}
  .row.done{opacity:.55}
  .st{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--status-unknown)}
  .st.done{background:var(--status-good)}
  .fn{font-weight:600;color:var(--ink-strong);font-variant-numeric:tabular-nums}
  .fn a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--line-strong)}
  .tags{display:flex;gap:5px;margin-inline-start:auto;flex-wrap:wrap;align-items:center}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap}
  .tag.shell{color:var(--shell,#A61E64);background:var(--shell-soft,#FDEDF4)}
  .tag.learning{color:var(--ink-strong);background:var(--surface-muted)}
  .tag.ops{color:var(--brand-deep);background:var(--brand-soft)}
  .tag.warn{color:#8a5a00;background:#FBF3DE}
  .tag.flag{color:var(--status-alert);background:var(--status-alert-soft)}
  .copy{font-family:var(--font-body);font-size:12px;font-weight:700;color:var(--shell,#A61E64);background:none;border:1px solid transparent;border-radius:6px;padding:5px 10px;cursor:pointer;transition:.14s;white-space:nowrap}
  .row:hover .copy{border-color:var(--shell-line,#F3C6DA);background:var(--shell-soft,#FDEDF4)}
  .copy.ok{color:var(--status-good)}

  dialog{border:none;border-radius:12px;padding:0;max-width:720px;width:calc(100% - 40px);box-shadow:var(--shadow-lg);margin:auto}
  dialog::backdrop{background:var(--scrim);backdrop-filter:blur(3px)}
  .dlg{padding:22px}
  .dlg h3{font-family:var(--font-head);font-size:18px;font-weight:800;color:var(--ink-strong);margin-bottom:10px}
  .dlg textarea{width:100%;min-height:340px;font-family:'Assistant',monospace;font-size:12.5px;line-height:1.6;direction:rtl;text-align:right;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg-soft);color:var(--ink);resize:vertical}
  .dlg .act{display:flex;gap:10px;margin-top:12px}
  .dlg .primary{font-family:var(--font-body);font-size:14px;font-weight:700;background:var(--shell,#A61E64);color:var(--on-shell,#fff);border:none;border-radius:var(--radius-pill);padding:10px 22px;cursor:pointer}
  .dlg .ghost{font-family:var(--font-body);font-size:14px;font-weight:700;background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:10px}
  @media(max-width:640px){.tags{width:100%;margin:6px 0 0}}
</style>
</head>
<body>
<div class="wrap">

  <div class="brandbar">
    <a href="index.html">
      <svg class="mark" viewBox="0 0 76 20" fill="none" aria-hidden="true">
        <path class="p" d="M73 10h-6" stroke-width="3.6"/><path class="p" d="M60 10h-4.5" stroke-width="3.1"/><path class="p" d="M49 10h-2.5" stroke-width="2.6"/>
        <circle class="c" cx="35" cy="10" r="6"/><path class="n" d="M28 10H3"/>
      </svg>
      <b>רֶצֶף</b>
    </a>
    <span class="layer">תפעול</span>
  </div>

  <h1>לוח מיגרציה עיצובית</h1>
  <p class="sub">יישור כל המסכים לשפה אחת — הכללים היחידים.</p>
  <p class="rule">ספר הכללים: <a href="MIGRATION-RULEBOOK.md">MIGRATION-RULEBOOK.md</a> · תבניות: <a href="index.html">שער</a> · <a href="onboarding-wizard.html">מעטפת</a> · <a href="system-health.html">תפעול</a> · מקור: <a href="design-system.html">design-system</a></p>

  <div class="prog">
    <div class="top"><span class="pct" id="pct">0%</span><span class="lbl" id="progLbl"></span></div>
    <div class="track"><i id="bar"></i></div>
  </div>

  <div class="filters" id="filters"></div>
  <div id="groups"></div>
</div>

<dialog id="promptDlg">
  <div class="dlg">
    <h3 id="dlgTitle"></h3>
    <textarea id="dlgText" readonly></textarea>
    <div class="act">
      <button class="primary" id="dlgCopy">העתק פרומפט</button>
      <button class="ghost" id="dlgClose">סגירה</button>
    </div>
  </div>
</dialog>

<script src="migration-data.js"></script>
<script>
const M = window.MIGRATION, S = M.screens;
const $ = s => document.querySelector(s);
const HE = { shell:'מעטפת', learning:'למידה', ops:'תפעול', form:'טופס', content:'תוכן', meta:'מסמך-פיתוח', marketing:'שיווקי' };

/* ---------- התקדמות ---------- */
function progress(){
  const done = S.filter(x=>x.status==='done').length;
  const pct = Math.round(done/S.length*100);
  $('#pct').textContent = pct+'%';
  $('#bar').style.width = pct+'%';
  $('#progLbl').textContent = `${done} מתוך ${S.length} מסכים · ${S.length-done} נותרו`;
}

/* ---------- פרומפט לסוכן ---------- */
function buildPrompt(x){
  const layerHe = HE[x.layer];
  const tmpl = x.layer==='shell' ? (x.register==='ops'?'system-health.html':'onboarding-wizard.html') : 'index.html (למידה) / demo-unit-hebrew.html';
  const layerInstr = x.layer==='shell'
    ? 'הוסף data-layer="shell" ל-<html>. פעולות ראשיות → פטל.'
    : 'אל תוסיף data-layer (דיו כברירת מחדל). ודא שאין data-layer="shell" שגוי.';
  const opsInstr = x.register==='ops'
    ? '\nזהו מסך תפעול — יישם §4 במלואו: כותרת 22px קבועה, שורות ~46px, קווי-שיער, המספר בדיו והצבע יורד לנקודת-סטטוס, כפתור מלא אחד למסך (הפעולה הקבוצתית), פעולת-שורה שקטה, נקודת-מצב חיה בכותרת.'
    : '';
  const opsHint = x.register==='ops' ? ', §4 תפעול' : '';
  const locHint = x.loc ? ', §3.5 טבלת המיפוי' : '';
  const flagLine = x.flag ? '\n⚠ סיווג-שכבה גבולי — ודא עם מיטל שהשכבה נכונה לפני ריצה.' : '';
  const locInstr = x.loc
    ? `\n\n⚠ למסך פלטה מקומית (loc=1). חובה §3.5:\n· מחק את כל בלוק ה-:root{ --teal… } המקומי — הוא מתנגש בשמות הטוקנים.\n· החלף כל --teal/--muted/--green/--amber… לפי טבלת המיפוי, תמיד עם fallback: var(--brand, #0B8F98).\n· --amber → --status-attention (לא emergency). --teal → --brand.\n· כפתור פעולה מותאם (כמו .runbtn) ופקדים (טוגל/טאב) שהיו --teal → --action, לא --brand.\n· חץ עומד-לבד (בתוך div/span) → SVG. חץ בתוך משפט → תוכן, לא לגעת.`
    : '';
  const noTokInstr = !x.tok
    ? `\n· המסך אינו טוען tokens.css — הוסף <link rel="stylesheet" href="tokens.css?v=2"> ואחריו components.css, לפני ה-<style> המקומי.`
    : '';
  return `אתה מבצע מיגרציית-עיצוב על מסך יחיד ברֶצֶף. אל תמציא כללים — בצע רק את הרשימה.

קובץ: ${x.f}
שכבה: ${x.layer}   (${layerHe})
רגיסטר: ${x.register}
מצב טכני: tokens=${x.tok} components=${x.comp} פלטה-מקומית=${x.loc} גרדיאנטים=${x.grad}
הערה: ${x.note||'—'}${flagLine}

קרא קודם: MIGRATION-RULEBOOK.md (§1 הכללים, §5 הסימן${locHint}${opsHint}).
התבנית לשכבה שלך: ${tmpl}.

בצע את §1 (כל 10 הכללים) + §6 (בדיקה). ${layerInstr}${noTokInstr}${locInstr}${opsInstr}
אל תיגע בלוגיקת JS, בטקסט תוכן, או במבנה הנתונים — רק className, CSS, ותגית <html>.
בסיום: דווח מה שונה בכל כלל, והדבק פלט של grep -E '(background|color):#[0-9a-fA-F]{3,6}' על הקובץ (אמור להיות ריק — hex מותר רק כ-fallback ב-var() וב-SVG).
אם נדרש צבע/החלטה שאין לו כלל — עצור ושאל, אל תמציא.`;
}

/* ---------- רינדור ---------- */
let filter = 'all';
const FILTERS = [
  {k:'all',      l:'הכל'},
  {k:'todo',     l:'ממתין'},
  {k:'shell',    l:'מעטפת'},
  {k:'learning', l:'למידה'},
  {k:'ops',      l:'תפעול'},
  {k:'notok',    l:'ללא טוקנים'},
  {k:'flag',     l:'גבולי ⚠'},
];
$('#filters').innerHTML = FILTERS.map(f=>`<button data-k="${f.k}" aria-pressed="${f.k==='all'}">${f.l}</button>`).join('');

function match(x){
  if(filter==='all')return true;
  if(filter==='todo')return x.status!=='done';
  if(filter==='notok')return !x.tok;
  if(filter==='flag')return x.flag;
  if(filter==='ops')return x.register==='ops';
  return x.layer===filter;
}

const GROUPS = [
  {k:'shell',    t:'מעטפת · פעולה בפטל', test:x=>x.layer==='shell'&&x.register!=='ops'&&x.register!=='meta'},
  {k:'ops',      t:'תפעול · צפוף + נורת-מצב', test:x=>x.register==='ops'},
  {k:'learning', t:'למידה · פעולה בדיו', test:x=>x.layer==='learning'&&x.register!=='ops'},
  {k:'meta',     t:'מסמכי-פיתוח · עדיפות נמוכה', test:x=>x.register==='meta'},
];

function render(){
  $('#groups').innerHTML = GROUPS.map(g=>{
    const items = S.filter(g.test).filter(match);
    if(!items.length) return '';
    return `<div class="grp"><h2>${g.t}<span class="cnt">${items.length}</span></h2><div class="list">${
      items.map(x=>{
        const tags = [
          `<span class="tag ${x.register==='ops'?'ops':x.layer}">${HE[x.layer]}${x.register==='ops'?' · תפעול':''}</span>`,
          !x.tok?'<span class="tag warn">ללא טוקנים</span>':'',
          x.grad>0?`<span class="tag warn">${x.grad} גרדיאנט</span>`:'',
          x.flag?'<span class="tag flag">⚠ גבולי</span>':'',
        ].filter(Boolean).join('');
        return `<div class="row ${x.status==='done'?'done':''}">
          <span class="st ${x.status==='done'?'done':''}"></span>
          <span class="fn"><a href="${x.f}" target="_blank">${x.f}</a></span>
          <div class="tags">${tags}${x.status!=='done'?`<button class="copy" data-f="${x.f}">פרומפט ⧉</button>`:'<span class="tag learning">בוצע</span>'}</div>
        </div>`;
      }).join('')
    }</div></div>`;
  }).join('');
}

/* ---------- אירועים ---------- */
$('#filters').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b)return;
  filter=b.dataset.k;
  document.querySelectorAll('#filters button').forEach(x=>x.setAttribute('aria-pressed', x===b));
  render();
});
document.addEventListener('click', e=>{
  const c=e.target.closest('.copy'); if(!c)return;
  const x=S.find(s=>s.f===c.dataset.f);
  $('#dlgTitle').textContent='פרומפט · '+x.f;
  $('#dlgText').value=buildPrompt(x);
  $('#promptDlg').showModal();
});
$('#dlgCopy').addEventListener('click', ()=>{
  const t=$('#dlgText'); t.select();
  navigator.clipboard.writeText(t.value).then(()=>{$('#dlgCopy').textContent='הועתק ✓';setTimeout(()=>$('#dlgCopy').textContent='העתק פרומפט',1500);});
});
$('#dlgClose').addEventListener('click', ()=>$('#promptDlg').close());
$('#promptDlg').addEventListener('click', e=>{if(e.target.id==='promptDlg')$('#promptDlg').close();});

progress(); render();
</script>
</body>
</html>
