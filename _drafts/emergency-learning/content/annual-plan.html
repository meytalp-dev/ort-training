<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רֶצֶף · תוכנית שנתית וייצור תוכן — כל המקצועות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6FAFB; --panel:#fff; --ink:#173A4A; --ink-strong:#0F2D3A; --ink-soft:#5B7480; --ink-faint:#8FA6AF;
  --brand:#0B8F98; --brand-deep:#08666D; --brand-soft:#E8F8F9; --line:#E2ECEF; --line-soft:#EEF4F5;
  --t2:#3AA65A; --t2s:#EBF8EF; --t3:#7A5CF0; --t3s:#F0ECFE; --t4:#D9574F; --t4s:#FDEEEC; --t5:#D99A18; --t5s:#FFF7E8;
  --k:#0B8F98; --ks:#E8F8F9; --s:#7A5CF0; --ss:#F0ECFE; --r:#D99A18; --rs:#FFF7E8; --h:#C65D8E; --hs:#FCEBF3;
  --font-head:"Heebo",sans-serif; --font-body:"Assistant",sans-serif;
  --sb:312px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-head);color:var(--ink-strong);line-height:1.25}
button{font-family:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}

/* ===== Sidebar ===== */
.sb{width:var(--sb);flex:none;background:var(--panel);border-inline-start:1px solid var(--line);
   height:100vh;position:sticky;top:0;overflow-y:auto;padding:18px 14px 40px}
.sb-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.sb-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#0B8F98,#12B3AE);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:var(--font-head);font-size:19px;flex:none}
.sb-brand b{font-family:var(--font-head);font-size:17px;color:var(--ink-strong);display:block}
.sb-brand span{font-size:11.5px;color:var(--ink-faint);font-weight:600}
.sb-search{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink);background:var(--bg);margin-bottom:14px}
.sb-search:focus{outline:none;border-color:var(--brand)}
.tier-group{margin-bottom:6px}
.tier-lbl{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:var(--ink-faint);
   text-transform:none;letter-spacing:.01em;padding:8px 8px 5px}
.tier-lbl .tdot{width:9px;height:9px;border-radius:99px;flex:none}
.tier-lbl .tc{margin-inline-start:auto;font-weight:700;color:var(--ink-faint);font-size:10.5px}
.subj{display:flex;align-items:center;gap:9px;width:100%;text-align:start;border:none;background:none;
   border-radius:10px;padding:8px 9px;font-size:13.5px;color:var(--ink);font-weight:600;transition:.13s}
.subj:hover{background:var(--line-soft)}
.subj.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:800}
.subj .sn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj .sbadge{font-size:10px;font-weight:800;color:#fff;border-radius:6px;padding:1px 6px;flex:none}
.subj .prog{font-size:10px;color:var(--ink-faint);font-weight:700;flex:none}
.subj.on .prog{color:var(--brand-deep)}

/* ===== Main ===== */
.main{flex:1;min-width:0;padding:26px 30px 80px;max-width:1120px}
.crumbs{font-size:12px;color:var(--ink-faint);font-weight:700;margin-bottom:6px}
.subj-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--line)}
.subj-head h1{font-size:27px;margin-bottom:5px}
.subj-head .meta{font-size:13px;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--line-soft);color:var(--ink-soft)}
.chip.tier{color:#fff}
.chip.danger{background:var(--t4s);color:#B23}
.chip.nqf{background:var(--brand-soft);color:var(--brand-deep)}
.kpis{display:flex;gap:10px;margin-inline-start:auto;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px 15px;text-align:center;min-width:78px}
.kpi b{display:block;font-family:var(--font-head);font-size:21px;color:var(--ink-strong);line-height:1.1}
.kpi span{font-size:10.5px;color:var(--ink-faint);font-weight:700}

.verify-banner{margin-top:14px;background:var(--t4s);border:1px solid #F3C7C2;border-radius:12px;padding:11px 15px;display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:#8a3a33}
.verify-banner svg{width:18px;height:18px;flex:none;margin-top:1px;color:#c0453b}
.verify-banner b{color:#7a2f28}

/* Legend */
.legend{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 15px;display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
.legend .li{display:flex;align-items:center;gap:7px}
.legend .tb{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 8px}
.tb.k{background:var(--ks);color:var(--k)} .tb.s{background:var(--ss);color:var(--s)} .tb.r{background:var(--rs);color:var(--r)}
.mtag{font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;display:inline-block;white-space:nowrap;margin-inline-end:2px}
.mtag.k{background:var(--ks);color:var(--k)} .mtag.s{background:var(--ss);color:var(--s)}
.mtag.r{background:var(--rs);color:var(--r)} .mtag.h{background:var(--hs);color:var(--h)}

/* Module (נושא) card */
.mod{background:var(--panel);border:1px solid var(--line);border-radius:15px;margin-top:14px;overflow:hidden;box-shadow:0 3px 12px rgba(23,58,74,.045)}
.mod-h{display:flex;align-items:center;gap:13px;padding:15px 18px;cursor:pointer;user-select:none}
.mod-h:hover{background:var(--line-soft)}
.mod-num{width:40px;height:40px;border-radius:11px;background:var(--brand-soft);color:var(--brand-deep);
   font-family:var(--font-head);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.mod-ttl{flex:1;min-width:0}
.mod-ttl b{font-family:var(--font-head);font-size:16.5px;color:var(--ink-strong);display:block}
.mod-ttl .sub{font-size:12px;color:var(--ink-faint);font-weight:600;margin-top:2px}
.mod-stat{font-size:11px;font-weight:800;border-radius:99px;padding:3px 11px;flex:none}
.st-planned{background:#EEF2F4;color:#7E939C} .st-doing{background:#E8F8F9;color:#08666D} .st-draft{background:#FFF7E8;color:#946a10}
.st-review{background:#F0ECFE;color:#5b3fc4} .st-verified{background:#EBF8EF;color:#2A8}
.mod-chev{width:20px;height:20px;color:var(--ink-faint);transition:.2s;flex:none}
.mod.open .mod-chev{transform:rotate(180deg)}
.mod-body{display:none;padding:2px 18px 18px}
.mod.open .mod-body{display:block}

/* sub-topic table */
.st-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.st-tbl th{text-align:start;font-size:10.5px;font-weight:800;color:var(--ink-faint);padding:7px 9px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.st-tbl td{padding:9px 9px;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--ink)}
.st-tbl tr:hover td{background:var(--line-soft)}
.st-tbl .c-trait{width:74px}
.st-tbl .c-assess{width:38%;color:var(--ink-soft)}
.tb{font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;display:inline-block;white-space:nowrap}
.check{font-weight:600}
.assess-txt{display:flex;align-items:flex-start;gap:6px}
.assess-txt svg{width:13px;height:13px;flex:none;margin-top:2px;color:var(--ink-faint)}

.mod-assess{margin-top:12px;background:var(--t2s);border:1px solid #C9E8D4;border-radius:11px;padding:11px 14px;font-size:12.5px;color:#2c6b44}
.mod-assess b{color:#1f5233;font-family:var(--font-head)}
.mod-tools{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--ink-strong);display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--brand);color:var(--brand-deep)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-deep);color:#fff}
.btn svg{width:15px;height:15px}

/* overview grid (when no subject selected) */
.ov-head{padding-bottom:16px;border-bottom:2px solid var(--line)}
.ov-head h1{font-size:28px;margin-bottom:6px}
.ov-head p{color:var(--ink-soft);font-size:14px;max-width:640px}
.ov-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:18px}
.ov-stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.ov-stat b{font-family:var(--font-head);font-size:27px;color:var(--brand-deep);display:block}
.ov-stat span{font-size:12px;color:var(--ink-faint);font-weight:700}
.ov-tier{margin-top:24px}
.ov-tier h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:11px}
.ov-tier h3 .tdot{width:11px;height:11px;border-radius:99px}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px}
.ov-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;border-top:4px solid var(--tc);cursor:pointer;transition:.14s}
.ov-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(23,58,74,.09)}
.ov-card h4{font-size:15px;margin-bottom:3px}
.ov-card .dm{font-size:11.5px;color:var(--ink-faint);font-weight:700;margin-bottom:9px}
.ov-card .rows{font-size:11.5px;color:var(--ink-soft)}
.ov-card .rows .r{display:flex;justify-content:space-between;padding:2px 0}
.ov-card .rows .r b{color:var(--ink-strong)}
.pbar{height:6px;background:var(--line);border-radius:99px;margin-top:9px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:99px}

.foot-note{margin-top:30px;font-size:11.5px;color:var(--ink-faint);border-top:1px solid var(--line);padding-top:14px;line-height:1.7}

/* toast */
.toast{position:fixed;inset-block-end:22px;inset-inline-start:50%;transform:translateX(50%) translateY(20px);
  background:var(--ink-strong);color:#fff;padding:11px 20px;border-radius:11px;font-size:13px;font-weight:600;
  opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(50%) translateY(0)}

.mtoggle{display:none}
@media(max-width:880px){
  :root{--sb:100%}
  .app{flex-direction:column}
  .sb{position:relative;width:100%;height:auto;max-height:none;border-inline-start:none;border-bottom:1px solid var(--line)}
  .main{padding:20px 16px 60px}
  .kpis{margin-inline-start:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="sb-brand">
      <div class="sb-logo">ר</div>
      <div><b>רֶצֶף</b><span>תוכנית שנתית · ייצור תוכן</span></div>
    </div>
    <input class="sb-search" id="search" placeholder="חיפוש מקצוע…">
    <nav id="subjList"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script src="production-plan.js"></script>
<script src="curriculum-data.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function(){
  if(!window.PRODUCTION_PLAN || !window.CURRICULUM){
    // last resort: load synchronously already attempted; show hint
    document.getElementById('main').innerHTML='<p style="padding:30px;color:#B23">לא נטענו הנתונים. ודאי ש-<b>production-plan.js</b> ו-<b>curriculum-data.js</b> נמצאים באותה תיקייה.</p>';
    return;
  }
  boot();
});

var STATUS={planned:'מתוכנן',doing:'בעבודה',draft:'טיוטה',review:'בבדיקה',verified:'מאומת'};

/* מאגר דרכי הערכה מגוונות. fam קובע צבע: sel=בחירה/סגור · open=בונה/פתוח · perf=ביצוע · high=חשיבה גבוהה */
var METHODS={
  mc:      {lbl:'שאלה אמריקאית (בחירה מרובה)',            fam:'sel'},
  tf:      {lbl:'נכון / לא נכון + הצדקה',                 fam:'sel'},
  match:   {lbl:'שאלת התאמה (מושג ↔ הגדרה / כלי ↔ שימוש)', fam:'sel'},
  sort:    {lbl:'מיון פריטים לקטגוריות',                   fam:'sel'},
  order:   {lbl:'סידור שלבים לפי הסדר הנכון',              fam:'sel'},
  fill:    {lbl:'השלמת מונח חסר במשפט',                    fam:'sel'},
  label:   {lbl:'זיהוי ותיוג על תרשים / תמונה',            fam:'sel'},
  explain: {lbl:'הסבר במילים שלך + דוגמה',                 fam:'open'},
  example: {lbl:'תן/י דוגמה משלך מהחיים',                  fam:'open'},
  compare: {lbl:'טבלת השוואה (במה שונים?)',                fam:'open'},
  perform: {lbl:'משימת ביצוע + רשימת תיוג (עבר/לא עבר)',    fam:'perf'},
  demo:    {lbl:'הדגמה מצולמת של הביצוע',                  fam:'perf'},
  sim:     {lbl:'תרגול מודרך / סימולציה',                  fam:'perf'},
  calc:    {lbl:'תרגיל פתור + הצגת דרך',                    fam:'perf'},
  scenario:{lbl:'תרחיש: "מה היית עושה?" + נימוק',          fam:'high'},
  cases:   {lbl:'ניתוח מקרה / מקור',                       fam:'high'},
  reflect: {lbl:'רפלקציה קצרה / יומן למידה',               fam:'high'},
  oral:    {lbl:'הצגה בעל-פה / ראיון קצר',                 fam:'high'}
};
var FAM={sel:{t:'בחירה',cls:'k'},open:{t:'בונה',cls:'s'},perf:{t:'ביצוע',cls:'r'},high:{t:'חשיבה',cls:'h'}};

/* בוחר שיטת הערכה לפי תוכן תת-הנושא + סוג המאפיין. rot = מונה סבב לגיוון ויזואלי. */
function pickMethod(text, trait, subj, rot){
  var t=text;
  function has(re){ return re.test(t); }
  if(trait==='מיומנות'){
    if(has(/הדגמ|הצג|הצגת|הנחיה|ליווי/)) return 'demo';
    if(has(/חישוב|מדיד|כמות|יחס|מינון|תמחור|חשב/)) return 'calc';
    if(has(/תרגול|סימולצ|התנסות|הפעל/)) return 'sim';
    return ['perform','demo','sim'][rot%3];
  }
  if(trait==='אחריות') return ['scenario','reflect','oral'][rot%3];
  // ידע — לפי אופי התוכן
  if(subj && (subj.id==='math')) return has(/גרף|נתונים|טבל|תרשים/)?'label':'calc';
  if(has(/שלב|שלבים|תהליך|רצף|נוהל|סדר\b|הכנת|מהלך/)) return 'order';
  if(has(/סוגי|סוגים|מיון|סיווג|קטגור|משפחות|קבוצות/)) return 'sort';
  if(has(/הבחנה|הבדל|לעומת|מול\b|שונה|השוואה|בין .* ל/)) return 'compare';
  if(has(/כלים|מכשיר|אביזר|מונח|מושג|הגדר|מינוח|טרמינ|רכיבים של/)) return 'match';
  if(has(/מבנה|אנטומי|חלקי|רכיבי|מפ[הת]|שרטוט|דיאגרמ|תרשים|צילום|תמונה|זיהוי/)) return 'label';
  if(has(/בטיחות|כלל|תקן|תקנה|חוק|אסור|מותר|זהירות|סיכון|היגיינ|סטריל|חיטוי/)) return 'tf';
  if(has(/מדוע|למה\b|חשיבות|משמעות|עקרון|מטרה|יתרון|השפעה|תפקיד|קשר בין|גורם/)) return 'explain';
  if(has(/שירות|לקוח|אתיק|דילמ|החלט|תקשורת|מקצועי[ת]? התנהג/)) return 'scenario';
  if(has(/דוגמ|יישום|בחיי|יומיומ|שימוש/)) return 'example';
  if(subj && subj.danger && has(/מקור|טקסט|יצירה|תעוד|עדות|רטורי|מניפולצ|ביקורת|פרשנ/)) return 'cases';
  // ברירת מחדל — סבב מגוון של סגורות/פתוחות (לא רק אמריקאית)
  return ['mc','fill','explain','match','tf'][rot%5];
}
function tierColor(t){return getComputedStyle(document.documentElement).getPropertyValue('--t'+t).trim();}

/* חלוקת מודלים — מי כותב. GPT = שכבת הפרכה על כל יחידה (לא מיוחס כיצרן). */
var MODELS={
  claude:{name:'Claude', c:'#C96442', bg:'#FBEEE9'},
  gemini:{name:'Gemini', c:'#3B72E0', bg:'#EAF1FD'}
};
/* טיר-2 שנשאר ל-Claude: שיער (התחלנו) + מדיה (רובד AI עדין). השאר → Gemini לאיזון תפוקה. */
var CLAUDE_TIER2=['hair-design','media-design'];
function producerOf(subj){
  if(subj.tier===4||subj.tier===5) return 'claude';   // אזור-סכנה + מתמטיקה → לולאת Perplexity/verify של Claude
  if(subj.tier===3) return 'gemini';                   // קציר
  return CLAUDE_TIER2.indexOf(subj.id)>-1 ? 'claude' : 'gemini'; // טיר 2 מתחלק
}

function comp(id){ return (window.CURRICULUM[id]||{}).mods||[]; }
function modNum(pmN){ var m=String(pmN).match(/\d+/); return m?parseInt(m[0]):null; }
function compFor(id,pmN){ var n=modNum(pmN); return comp(id).find(function(m){return m.n===n;})||{knowledge:[],skills:[]}; }

function subtopics(mod, subj){
  // mod = curriculum module {knowledge[],skills[]}
  var out=[], rk=0, rs=0;
  (mod.knowledge||[]).forEach(function(k){
    var meth=pickMethod(k,'ידע',subj,rk++);
    out.push({trait:'ידע',cls:'k',text:k,check:'יודע ומסביר: '+k,method:meth});
  });
  (mod.skills||[]).forEach(function(s){
    var meth=pickMethod(s,'מיומנות',subj,rs++);
    out.push({trait:'מיומנות',cls:'s',text:s,check:'מבצע בפועל: '+s,method:meth});
  });
  return out;
}

function subjStats(subj){
  var cm=comp(subj.id), topics=subj.modules.length, subs=0, done=0;
  cm.forEach(function(m){ subs+= (m.knowledge||[]).length+(m.skills||[]).length; });
  subj.modules.forEach(function(m){ if(m.status==='verified'||m.status==='draft'||m.status==='doing') done+=(m.done||0); });
  var totalUnits=subj.modules.reduce(function(a,m){return a+(m.units||0);},0);
  return {topics:topics,subs:subs,units:totalUnits,done:done};
}

var ICON={
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" class="mod-chev"><path d="M6 9l6 6 6-6"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>'
};

function boot(){
  renderSidebar();
  renderOverview();
  document.getElementById('search').addEventListener('input',function(e){ filterSidebar(e.target.value); });
}

function tierOrder(){return [2,4,5,3];}
function renderSidebar(){
  var P=window.PRODUCTION_PLAN, nav=document.getElementById('subjList'), html='';
  html+='<button class="subj" data-home style="font-weight:800;color:var(--brand-deep)"><span class="sn">◆ סקירה כללית</span></button>';
  tierOrder().forEach(function(t){
    var subs=P.subjects.filter(function(s){return s.tier===t;});
    if(!subs.length) return;
    var ti=P.tiers[t];
    html+='<div class="tier-group"><div class="tier-lbl"><span class="tdot" style="background:'+ti.color+'"></span>'+ti.name+'<span class="tc">'+subs.length+'</span></div>';
    subs.forEach(function(s){
      var st=subjStats(s);
      var pm=MODELS[producerOf(s)];
      html+='<button class="subj" data-id="'+s.id+'"><span class="sn">'+s.name+'</span>'+
            '<span class="sbadge" style="background:'+pm.bg+';color:'+pm.c+'" title="כותב: '+pm.name+'">'+pm.name[0]+'</span>'+
            '<span class="prog">'+st.topics+'</span></button>';
    });
    html+='</div>';
  });
  nav.innerHTML=html;
  nav.querySelectorAll('.subj').forEach(function(b){
    b.addEventListener('click',function(){
      if(b.hasAttribute('data-home')){ selectSubject(null); return; }
      selectSubject(b.getAttribute('data-id'));
    });
  });
}
function filterSidebar(q){
  q=q.trim();
  document.querySelectorAll('#subjList .subj').forEach(function(b){
    if(b.hasAttribute('data-home')) return;
    var t=b.querySelector('.sn').textContent;
    b.style.display = (!q||t.indexOf(q)>-1)?'':'none';
  });
}
function markActive(id){
  document.querySelectorAll('#subjList .subj').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-id')===id); });
}

function selectSubject(id){
  markActive(id);
  window.scrollTo(0,0);
  if(!id){ renderOverview(); return; }
  var subj=window.PRODUCTION_PLAN.subjects.find(function(s){return s.id===id;});
  renderSubject(subj);
}

function renderOverview(){
  var P=window.PRODUCTION_PLAN, tot={subjects:P.subjects.length,topics:0,subs:0,units:0};
  P.subjects.forEach(function(s){ var st=subjStats(s); tot.topics+=st.topics; tot.subs+=st.subs; tot.units+=st.units; });
  var html='<div class="ov-head"><div class="crumbs">מדף הרציפות · סל תוכניות תשפ"ז</div>'+
    '<h1>תוכנית שנתית וייצור תוכן — כל המקצועות</h1>'+
    '<p>לכל מקצוע: נושאים → תתי-נושאים, ולכל תת-נושא <b>המאפיין שנבדק</b> ו<b>איך נבחן</b> (נגזר ממודל הכשירויות NQF שבמקור). לחצי מקצוע בתפריט כדי לפתוח את התוכנית השנתית שלו.</p>'+
    '<div class="ov-stats">'+
      stat(tot.subjects,'מקצועות')+stat(tot.topics,'נושאים (מודולות)')+stat(tot.subs.toLocaleString(),'תתי-נושאים')+
      stat('~'+tot.units,'יחידות לייצור')+stat('×3','רמות ליחידה')+
    '</div></div>';
  tierOrder().forEach(function(t){
    var subs=P.subjects.filter(function(s){return s.tier===t;}); if(!subs.length) return;
    var ti=P.tiers[t];
    html+='<div class="ov-tier"><h3><span class="tdot" style="background:'+ti.color+'"></span>'+ti.name+' · '+subs.length+' מקצועות <span style="font-weight:600;color:var(--ink-faint);font-size:12px">— '+ti.desc+'</span></h3><div class="ov-grid">';
    subs.forEach(function(s){
      var st=subjStats(s), pct=st.subs?Math.round(st.done/st.units*100):0;
      html+='<div class="ov-card" style="--tc:'+ti.color+'" data-id="'+s.id+'">'+
        '<h4>'+s.name+'</h4><div class="dm">'+(s.domain||'')+(s.code?' · '+s.code:'')+'</div>'+
        '<div class="rows"><div class="r"><span>נושאים</span><b>'+st.topics+'</b></div>'+
        '<div class="r"><span>תתי-נושאים</span><b>'+st.subs+'</b></div>'+
        '<div class="r"><span>יחידות (הערכה)</span><b>~'+st.units+'</b></div></div>'+
        '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
      '</div>';
    });
    html+='</div></div>';
  });
  html+='<div class="foot-note">מקור: סל תוכניות תשפ"ז (משרד העבודה · ORT · פרטי). כשירויות חולצו אוטומטית ממסמכי המקור למודל NQF (ידע · מיומנות · אחריות). '+
        'כל יחידה נשארת <b>[לאימות]</b> עד חתימת מפקח מקצועי. עוגן: <b>_curriculum-framework.md</b> · <b>content-standard.md §10</b>.</div>';
  var m=document.getElementById('main'); m.innerHTML=html;
  m.querySelectorAll('.ov-card').forEach(function(c){ c.addEventListener('click',function(){ selectSubject(c.getAttribute('data-id')); }); });
}
function stat(v,l){ return '<div class="ov-stat"><b>'+v+'</b><span>'+l+'</span></div>'; }

function renderSubject(subj){
  var cm=comp(subj.id), st=subjStats(subj), tc=tierColor(subj.tier), ti=window.PRODUCTION_PLAN.tiers[subj.tier];
  var nqf = subj.cat==='מגמה' ? 'NQF 3–4' : 'ליבה';
  var html='<div class="crumbs">'+ti.name+' › '+(subj.domain||'')+'</div>'+
   '<div class="subj-head"><div><h1>'+subj.name+'</h1>'+
     '<div class="meta">'+
       '<span class="chip tier" style="background:'+tc+'">'+ti.name+'</span>'+
       (subj.code?'<span class="chip">מגמה '+subj.code+'</span>':'')+
       '<span class="chip nqf">'+nqf+'</span>'+
       '<span class="chip">'+(subj.cert||'')+'</span>'+
       (subj.danger?'<span class="chip danger">אזור-סכנה</span>':'')+
       modelChip(subj)+
     '</div></div>'+
     '<div class="kpis">'+kpi(st.topics,'נושאים')+kpi(st.subs,'תתי-נושאים')+kpi('~'+st.units,'יחידות')+'</div>'+
   '</div>';
  if(subj.danger){
    html+='<div class="verify-banner">'+ICON.warn+'<div><b>אזור-סכנה פדגוגי.</b> כל מאפיין וכל שאלת הערכה עוברים אימות מול מקור סמכותי ('+(subj.verify||'משה"ח')+') דרך Perplexity + הסקיל <b>verify-pedagogy</b> — לפני מסירה. אין יחידה שעולה בלי חתימת מפקח מקצועי.</div></div>';
  }
  html+='<div class="legend"><span style="font-weight:800;color:var(--ink-strong)">דרכי הערכה — נבחרות לפי תוכן:</span>'+
    '<span class="li"><span class="mtag k">בחירה</span> אמריקאית · התאמה · מיון · סידור · נכון/לא-נכון · תיוג</span>'+
    '<span class="li"><span class="mtag s">בונה</span> הסבר · דוגמה · השוואה</span>'+
    '<span class="li"><span class="mtag r">ביצוע</span> משימה · הדגמה · סימולציה · חישוב</span>'+
    '<span class="li"><span class="mtag h">חשיבה</span> תרחיש · ניתוח מקרה · רפלקציה</span></div>';

  subj.modules.forEach(function(pm,i){
    var c=compFor(subj.id,pm.n);
    var subs=subtopics(c,subj);
    var open = pm.status==='doing'||i===0;
    html+='<div class="mod'+(open?' open':'')+'" data-mi="'+i+'">'+
      '<div class="mod-h">'+
        '<div class="mod-num">'+pm.n+'</div>'+
        '<div class="mod-ttl"><b>'+(pm.t||c.title||'')+'</b><span class="sub">'+subs.length+' תתי-נושאים · '+(pm.units||0)+' יחידות'+(pm.kind==='assessment'?' · מטלת גמר':'')+'</span></div>'+
        '<span class="mod-stat st-'+pm.status+'">'+STATUS[pm.status]+(pm.done?' · '+pm.done+' נכתבו':'')+'</span>'+
        ICON.chev+
      '</div>'+
      '<div class="mod-body">'+ modBody(subj,pm,c,subs) +'</div>'+
    '</div>';
  });
  html+='<div class="foot-note">הנתונים נגזרים ממסמך המקור: <b>'+(subj.src||'')+'</b>. תתי-הנושאים = פריטי הידע והמיומנות של כל מודולה. "איך נבחן" נקבע לפי סוג המאפיין (content-standard §10).</div>';

  var m=document.getElementById('main'); m.innerHTML=html;
  m.querySelectorAll('.mod-h').forEach(function(h){ h.addEventListener('click',function(){ h.parentNode.classList.toggle('open'); }); });
  m.querySelectorAll('[data-copy]').forEach(function(b){ b.addEventListener('click',function(e){ e.stopPropagation(); copyPrompt(subj, parseInt(b.getAttribute('data-copy'))); }); });
}
function kpi(v,l){ return '<div class="kpi"><b>'+v+'</b><span>'+l+'</span></div>'; }
function modelChip(subj){ var m=MODELS[producerOf(subj)]; return '<span class="chip" style="background:'+m.bg+';color:'+m.c+'">✍ '+m.name+'</span>'; }

function modBody(subj,pm,c,subs){
  if(!subs.length){
    return '<p style="color:var(--ink-faint);font-size:12.5px;padding:8px 0">— אין פירוט כשירויות במקור למודולה זו (מטלת גמר/מסכמת). ייצור לפי §0.4.</p>'+tools(subj,pm);
  }
  var rows=subs.map(function(s){
    var m=METHODS[s.method], fam=FAM[m.fam];
    return '<tr><td class="c-trait"><span class="tb '+s.cls+'">'+s.trait+'</span></td>'+
      '<td class="check">'+s.check+'</td>'+
      '<td class="c-assess"><span class="mtag '+fam.cls+'">'+fam.t+'</span> '+m.lbl+'</td></tr>';
  }).join('');
  var tbl='<table class="st-tbl"><thead><tr><th class="c-trait">מאפיין</th><th>מה בודקים (תת-נושא)</th><th class="c-assess">איך נבחן</th></tr></thead><tbody>'+rows+'</tbody></table>';
  var assessRow = c.assess ? '<div class="mod-assess"><b>תוצר המודולה (הערכה מסכמת):</b> '+c.assess+'</div>' : '';
  return tbl+assessRow+tools(subj,pm);
}
function tools(subj,pm){
  var mi=subj.modules.indexOf(pm);
  return '<div class="mod-tools">'+
    '<button class="btn primary" data-copy="'+mi+'">'+ICON.copy+'העתקת פרומפט לסוכן</button>'+
    '</div>';
}

function copyPrompt(subj,mi){
  var pm=subj.modules[mi], c=compFor(subj.id,pm.n);
  var subs=subtopics(c,subj);
  var lines=subs.map(function(s){ return '   - ['+s.trait+'] '+s.text+'  → הערכה: '+METHODS[s.method].lbl; }).join('\n');
  var danger = subj.danger ?
    ('5. אזור-סכנה: כל קביעה פדגוגית עוברת Perplexity + מקור סמכותי ('+(subj.verify||'משה"ח / אקדמיה ללשון')+'). הרץ verify-pedagogy לפני מסירה.') :
    '5. מגמה מקצועית: נגזר ממסמך המקור בלבד — בלי המצאות. תייג מקור לכל קביעה.';
  var nn = String(mi+1).padStart(2,'0');
  var prod=MODELS[producerOf(subj)];
  var p =
'צור יחידות תוכן ל"מדף הרציפות" (רֶצֶף · _drafts/emergency-learning).\n\n'+
'‼ קרא/י קודם את **content/unit-dna.md** — זה ה-DNA המחייב של כל יחידה (מבנה, אורך, 3 רמות, תיוג מקור, צ\'ק-DNA). כל יחידה חייבת לצאת זהה לו.\n'+
'מודל כותב: '+prod.name+'. אחרי הכתיבה — יחידה עוברת הפרכה עצמאית ב-GPT ("נבדקה-GPT") לפני אימות אנושי.\n\n'+
'מקצוע: '+subj.name+' ('+subj.cat+') · נושא '+pm.n+' — '+(pm.t||c.title)+'\n'+
'טיר: '+subj.tier+' ('+window.PRODUCTION_PLAN.tiers[subj.tier].name+')'+(subj.danger?' · אזור-סכנה':'')+'\n'+
'מקור (docx · ZIP סל תשפ"ז · פרטי, לא לפרסם): '+ (subj.src||'') +'\n'+
'עוגן: content-standard.md (§0.4, §10) · _curriculum-framework.md · taxonomy.md '+(subj.taxRef||'')+' · content/error-types.md (תיוג טעויות)\n'+
'פורמט יחידה: כמו content/hebrew/module-05/unit-01-source-reliability.md\n\n'+
'תתי-הנושאים לנושא זה (מאפיין → איך נבחן):\n'+lines+'\n'+
(c.assess?('   תוצר מודולה: '+c.assess+'\n'):'')+'\n'+
'הוראות:\n'+
'1. קרא את מסמך המקור, סעיף 8 "פירוק למודולות", מודולה '+pm.n+' — ודא את הכשירויות מול המקור.\n'+
'2. כל תת-נושא → יחידת task ב-3 רמות (basic/standard/advanced). התלמיד לא רואה תוויות רמה.\n'+
'3. סוג ההערכה נקבע לפי המאפיין: ידע→שאלה/חידון · מיומנות→ביצוע+רשימת תיוג · אחריות→תרחיש (content-standard §10).\n'+
'4. תיוג סוגי-טעות (EPA): לכל שאלת ידע — תייג כל מסיח ב-error_type מתוך {concept · rule-application · form-confusion · overgeneralization · attention} (+ אוברליי המקצוע, ר\' content/error-types.md §3). מסיח שלא נופל באף קטגוריה — שכתב, הוא חלש. למיומנות: פריטי רשימת-התיוג (עבר/לא עבר) הם צירי-הטעות.\n'+
'5. תוצר המודולה → יחידת assessment אחת בסוף.\n'+
danger.replace(/^5\./, '6.')+'\n'+
'7. כתוב ל-content/'+subj.id+'/module-'+nn+'/ עם _manifest.md. הסטטוס נשאר [לאימות] — לא לסמן מאומת.\n';
  navigator.clipboard.writeText(p).then(function(){ toast('הפרומפט הועתק — '+subj.name+' '+pm.n); },
    function(){ toast('העתקה נכשלה — סמני והעתיקי ידנית'); prompt('העתקה ידנית:',p); });
}

var _tt;
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(function(){ t.classList.remove('show'); },2600);
}
</script>
</body>
</html>
