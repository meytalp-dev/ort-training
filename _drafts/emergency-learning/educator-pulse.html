<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דופק כיתתי · י'2 — מערכת רציפות למידה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@500;600;700;800&family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   לוח הדופק הכיתתי — המסך של המחנך.
   שואב את השפה מ-design-system.html. מקור אמת אחד.
   ============================================================ */
:root{
  --ink:#173a4a; --ink-soft:#5a7382; --ink-faint:#8ba3ae;
  --bg:#f5fafb; --card:#ffffff; --line:#e2eef1; --line-strong:#cfe3e8;
  --brand:#0e7c86; --brand-bright:#22b8cf; --brand-soft:#e3fafc; --brand-line:#a5e8ef;

  --pulse-green:#2f9e44;  --pulse-green-soft:#ebfbee;  --pulse-green-line:#b2f2bb;
  --pulse-yellow:#c98a00; --pulse-yellow-soft:#fff7e0; --pulse-yellow-line:#ffe08a;
  --pulse-red:#d84a3f;    --pulse-red-soft:#fff0ee;    --pulse-red-line:#ffcabf;

  /* מסגרת רגשית — ורוד רך, לא מלחיץ */
  --flag:#e64980; --flag-soft:#fff0f6; --flag-line:#fcc2d7; --flag-deep:#c2255c;

  /* וואטסאפ */
  --wa:#1fa855; --wa-soft:#e9f9ef; --wa-line:#a9e5c0;

  --radius:16px; --radius-lg:22px; --radius-sm:11px; --tap:44px;
  --shadow:0 6px 22px rgba(23,58,74,.06);
  --shadow-lg:0 12px 34px rgba(23,58,74,.10);

  /* צבע-מצב — ברירת מחדל: חירום (כאן הלוח קריטי ביותר) */
  --mode:#e8722c; --mode-deep:#c85d1c; --mode-soft:#fff2e8; --mode-line:#ffd3ac; --mode-name:"חירום";
}
:root[data-mode="routine"]{ --mode:#2f9e44; --mode-deep:#1f7a30; --mode-soft:#ebfbee; --mode-line:#b2f2bb; --mode-name:"שגרה"; }
:root[data-mode="emergency"]{ --mode:#e8722c; --mode-deep:#c85d1c; --mode-soft:#fff2e8; --mode-line:#ffd3ac; --mode-name:"חירום"; }

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Assistant',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;padding-bottom:40px;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Playpen Sans Hebrew','Assistant',sans-serif;line-height:1.3;font-weight:700}
svg{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.phone{max-width:430px;margin:0 auto;padding:0 14px}

/* ---------- מתג דמו עליון (חירום ↔ שגרה) ---------- */
.demo-bar{position:sticky;top:0;z-index:50;background:rgba(245,250,251,.94);
  backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:saturate(1.2) blur(8px);
  border-bottom:1px solid var(--line);padding:9px 0 11px}
.demo-bar .phone{display:flex;flex-direction:column;gap:7px}
.demo-bar .ttl{font-size:11.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.02em}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px}
.seg button{font-family:'Assistant',sans-serif;font-weight:700;font-size:14px;border:0;border-radius:10px;
  padding:0 6px;height:var(--tap);cursor:pointer;color:var(--ink-soft);background:transparent;
  display:flex;align-items:center;justify-content:center;gap:7px;transition:background .18s,color .18s}
.seg button .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.seg button[data-m="emergency"] .dot{background:#e8722c}
.seg button[data-m="routine"] .dot{background:#2f9e44}
.seg button[aria-pressed="true"]{color:#fff;background:var(--mode)}
.seg button[aria-pressed="true"] .dot{background:#fff}
.seg button:focus-visible{outline:3px solid var(--brand-bright);outline-offset:2px}

/* ---------- כותרת הדופק ---------- */
header.hero{padding:18px 0 4px}
.hero .row1{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.hero .cls{font-family:'Playpen Sans Hebrew';font-weight:800;font-size:26px;color:var(--brand);
  background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:14px;
  width:52px;height:52px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero .htxt h1{font-size:20px;color:var(--ink);line-height:1.2}
.mode-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
  color:var(--mode-deep);background:var(--mode-soft);border:1.5px solid var(--mode-line);
  border-radius:999px;padding:3px 11px;margin-top:5px}
.mode-chip .d{width:8px;height:8px;border-radius:50%;background:var(--mode)}
.mode-chip::after{content:var(--mode-name)}

/* שורת "נראו היום" גדולה */
.bigstat{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:#fff;border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-top:6px}
.bigstat .num{font-family:'Playpen Sans Hebrew';font-weight:800;font-size:34px;color:var(--pulse-green);line-height:1;flex-shrink:0}
.bigstat .num .of{font-size:20px;color:var(--ink-faint);font-weight:700}
.bigstat .lab{flex:1 1 0;min-width:0;font-size:15px;font-weight:700;color:var(--ink)}
.bigstat .lab span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.bigstat .bar{flex:1 1 100%;height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:2px}
.bigstat .bar>span{display:block;height:100%;border-radius:999px;background:var(--pulse-green)}

/* ---------- שורת סינון ---------- */
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:14px 0 4px;
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px}
.filters button{font-family:'Assistant',sans-serif;font-weight:700;font-size:13.5px;border:0;border-radius:10px;
  height:40px;cursor:pointer;color:var(--ink-soft);background:transparent;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:background .16s,color .16s}
.filters button .cnt{font-size:12px;font-weight:800;background:var(--line);color:var(--ink-soft);
  border-radius:999px;min-width:20px;height:19px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center}
.filters button[aria-pressed="true"]{color:#fff;background:var(--brand)}
.filters button[aria-pressed="true"] .cnt{background:rgba(255,255,255,.28);color:#fff}
.filters button:focus-visible{outline:3px solid var(--brand-bright);outline-offset:2px}

/* ---------- רשימת דופק ---------- */
.pulse-list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.p-item{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.p-item.flag-persistent{border:1.5px solid var(--flag-line);background:var(--flag-soft)}
.p-row{display:flex;align-items:center;gap:11px;padding:11px 13px}
.avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;position:relative;
  display:flex;align-items:center;justify-content:center;
  font-family:'Playpen Sans Hebrew';font-weight:700;font-size:16px;color:#fff}
.avatar.a-green{background:#40c057}.avatar.a-yellow{background:#f0a500}.avatar.a-red{background:#e8705f}
/* עיגול סטטוס קטן על האווטאר */
.avatar .ring{position:absolute;bottom:-2px;inset-inline-start:-2px;width:15px;height:15px;border-radius:50%;
  border:2.5px solid #fff}
.avatar .ring.g{background:var(--pulse-green)}
.avatar .ring.y{background:var(--pulse-yellow)}
.avatar .ring.r{background:var(--pulse-red)}
.who{min-width:0;flex:1}
.who .nm{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.who .sub{font-size:12.5px;color:var(--ink-faint);display:flex;align-items:center;gap:5px;margin-top:1px}
.who .sub .mface{width:16px;height:16px;flex-shrink:0}
.who .sub.hard{color:var(--flag-deep);font-weight:700}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:5px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.status .d{width:8px;height:8px;border-radius:50%}
.st-green{color:var(--pulse-green);background:var(--pulse-green-soft);border:1px solid var(--pulse-green-line)}
.st-green .d{background:var(--pulse-green)}
.st-yellow{color:var(--pulse-yellow);background:var(--pulse-yellow-soft);border:1px solid var(--pulse-yellow-line)}
.st-yellow .d{background:var(--pulse-yellow)}
.st-red{color:var(--pulse-red);background:var(--pulse-red-soft);border:1px solid var(--pulse-red-line)}
.st-red .d{background:var(--pulse-red)}

/* אזור פעולה — כפתורים + הודעה */
.p-actions{padding:0 13px 12px;display:flex;flex-direction:column;gap:9px}
.act-btns{display:flex;gap:8px;flex-wrap:wrap}
.wa-btn{font-family:'Assistant',sans-serif;font-weight:700;font-size:14px;border:1.5px solid var(--wa-line);
  background:var(--wa-soft);color:#177d42;border-radius:12px;min-height:var(--tap);padding:0 14px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1;transition:background .16s,transform .12s}
.wa-btn:hover{background:#d8f4e2;transform:translateY(-1px)}
.wa-btn:active{transform:translateY(0)}
.wa-btn:focus-visible{outline:3px solid var(--brand-bright);outline-offset:2px}
.wa-btn svg{width:19px;height:19px;flex-shrink:0}
.esc-btn{font-family:'Assistant',sans-serif;font-weight:700;font-size:14px;border:1.5px solid var(--flag-line);
  background:#fff;color:var(--flag-deep);border-radius:12px;min-height:var(--tap);padding:0 14px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:1;transition:background .16s,transform .12s}
.esc-btn:hover{background:var(--flag-soft);transform:translateY(-1px)}
.esc-btn:focus-visible{outline:3px solid var(--brand-bright);outline-offset:2px}
.esc-btn svg{width:18px;height:18px;flex-shrink:0}

/* בועת הודעה מוכנה */
.wa-msg{display:none;background:#fff;border:1px solid var(--wa-line);border-radius:13px;padding:11px 13px}
.wa-msg.open{display:block}
.wa-msg .lbl{font-size:11.5px;font-weight:700;color:#177d42;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.wa-msg .lbl svg{width:14px;height:14px}
.wa-msg .txt{font-size:14px;color:var(--ink);line-height:1.5;background:var(--wa-soft);
  border-radius:10px;padding:9px 11px;border:1px solid #dff2e6}
.wa-msg .hint{font-size:11.5px;color:var(--ink-faint);margin-top:7px;display:flex;align-items:center;gap:5px}
.wa-msg .hint svg{width:13px;height:13px;flex-shrink:0}

/* אישור העברה ליועצת */
.esc-done{display:none;background:var(--flag-soft);border:1px solid var(--flag-line);border-radius:13px;
  padding:11px 13px;font-size:13.5px;color:var(--flag-deep);font-weight:600;align-items:flex-start;gap:8px}
.esc-done.open{display:flex}
.esc-done svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}

/* מפריד קבוצה */
.grp-sep{display:flex;align-items:center;gap:9px;margin:16px 2px 2px;font-size:12px;font-weight:700;color:var(--ink-faint)}
.grp-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.grp-sep .gi{width:16px;height:16px;flex-shrink:0}
.grp-sep.red{color:var(--pulse-red)}
.grp-sep.flag{color:var(--flag-deep)}
.grp-sep.yellow{color:var(--pulse-yellow)}
.grp-sep.green{color:var(--pulse-green)}

.empty{text-align:center;color:var(--ink-faint);font-size:14px;padding:24px 10px}

.foot-note{margin:26px 0 0;padding:14px;text-align:center;font-size:12px;color:var(--ink-faint);border-top:1px solid var(--line)}
.foot-note b{color:var(--brand)}

/* פנים check-in זעירות */
.mface.m-great{color:#2f9e44}.mface.m-ok{color:#1c7ed6}.mface.m-meh{color:#c98a00}.mface.m-hard{color:#e8722c}
</style>
</head>
<body>

<!-- ===== מתג דמו: חירום ↔ שגרה ===== -->
<div class="demo-bar">
  <div class="phone">
    <span class="ttl">תצוגת דמו · מחליף בין מצבי המערכת</span>
    <div class="seg" role="group" aria-label="בחירת מצב תצוגה">
      <button data-m="emergency" aria-pressed="true"><span class="dot"></span>חירום · דופק רגשי</button>
      <button data-m="routine"   aria-pressed="false"><span class="dot"></span>שגרה · השלמת משימות</button>
    </div>
  </div>
</div>

<div class="phone">

  <!-- ===== כותרת ===== -->
  <header class="hero">
    <div class="row1">
      <div class="cls">י׳2</div>
      <div class="htxt">
        <h1>הדופק הכיתתי שלך</h1>
        <span class="mode-chip"><span class="d"></span></span>
      </div>
    </div>
    <div class="bigstat">
      <span class="num" id="statNum">21<span class="of">/28</span></span>
      <span class="lab" id="statLab">נראו היום<span>מי צריך אותך עכשיו — למעלה</span></span>
      <div class="bar"><span id="statBar" style="width:75%"></span></div>
    </div>
  </header>

  <!-- ===== סינון ===== -->
  <div class="filters" role="group" aria-label="סינון רשימה">
    <button data-f="all"   aria-pressed="true">הכל <span class="cnt" id="cAll">28</span></button>
    <button data-f="unseen" aria-pressed="false"><span id="fUnseen">לא נראו</span> <span class="cnt" id="cUnseen">7</span></button>
    <button data-f="flags"  aria-pressed="false"><span id="fFlags">דגלים</span> <span class="cnt" id="cFlags">3</span></button>
  </div>

  <!-- ===== רשימת דופק (נבנית ב-JS) ===== -->
  <div class="pulse-list" id="list"></div>

  <div class="foot-note">
    <b>מערכת רציפות למידה</b> · לוח הדופק של המחנך<br>
    רציפות למידה · הקשר מפעיל · Mobile First · RTL
  </div>
</div>

<script>
/* ============================================================
   נתונים פיקטיביים — כיתה י'2, 28 תלמידים.
   seen: today / yesterday / 2days / 3days / 4days
   mood (check-in רגשי): great / ok / meh / hard / null(לא נראה)
   hardStreak: כמה ימים ברצף "קשה לי"
   tasks: 0-3 (למצב שגרה)
   ============================================================ */
var STUDENTS = [
  {n:"רון מזרחי",       g:"m", seen:"3days",     mood:null,   hardStreak:0, tasks:0},
  {n:"אליה טסמה",       g:"f", seen:"4days",     mood:null,   hardStreak:0, tasks:0},
  {n:"נור סעיד",        g:"f", seen:"3days",     mood:null,   hardStreak:0, tasks:0},
  {n:"יונתן לוי",       g:"m", seen:"yesterday", mood:null,   hardStreak:0, tasks:1},
  {n:"עומר דהן",        g:"m", seen:"2days",     mood:null,   hardStreak:0, tasks:0},
  {n:"בר סגל",          g:"f", seen:"yesterday", mood:null,   hardStreak:0, tasks:2},
  {n:"מריה איבנוב",     g:"f", seen:"2days",     mood:null,   hardStreak:0, tasks:1},
  {n:"הודיה ביטון",     g:"f", seen:"today",     mood:"hard", hardStreak:3, tasks:2},
  {n:"מוחמד אבו-סאלח",  g:"m", seen:"today",     mood:"hard", hardStreak:1, tasks:1},
  {n:"לינוי אוחיון",    g:"f", seen:"today",     mood:"hard", hardStreak:1, tasks:3},
  {n:"נועה בר-און",     g:"f", seen:"today",     mood:"great",hardStreak:0, tasks:3},
  {n:"שירה כהן",        g:"f", seen:"today",     mood:"ok",   hardStreak:0, tasks:3},
  {n:"אחמד זועבי",      g:"m", seen:"today",     mood:"ok",   hardStreak:0, tasks:2},
  {n:"תמר גולן",        g:"f", seen:"today",     mood:"great",hardStreak:0, tasks:3},
  {n:"ליאם פרץ",        g:"m", seen:"today",     mood:"ok",   hardStreak:0, tasks:2},
  {n:"מאיה אברהם",      g:"f", seen:"today",     mood:"great",hardStreak:0, tasks:3},
  {n:"דניאל רוזנברג",   g:"m", seen:"today",     mood:"ok",   hardStreak:0, tasks:3},
  {n:"יסמין חדד",       g:"f", seen:"today",     mood:"meh",  hardStreak:0, tasks:2},
  {n:"איתי שפירא",      g:"m", seen:"today",     mood:"ok",   hardStreak:0, tasks:3},
  {n:"אגם פרידמן",      g:"f", seen:"today",     mood:"great",hardStreak:0, tasks:3},
  {n:"נטע וינטר",       g:"f", seen:"today",     mood:"ok",   hardStreak:0, tasks:2},
  {n:"רועי אזולאי",     g:"m", seen:"today",     mood:"ok",   hardStreak:0, tasks:3},
  {n:"אמילי קפלן",      g:"f", seen:"today",     mood:"great",hardStreak:0, tasks:3},
  {n:"גבריאל מלכה",     g:"m", seen:"today",     mood:"ok",   hardStreak:0, tasks:2},
  {n:"יהלי ברקוביץ׳",   g:"m", seen:"today",     mood:"meh",  hardStreak:0, tasks:3},
  {n:"דור עמר",         g:"m", seen:"today",     mood:"ok",   hardStreak:0, tasks:3},
  {n:"אורי שלום",       g:"m", seen:"today",     mood:"great",hardStreak:0, tasks:3},
  {n:"סתיו הרוש",       g:"f", seen:"today",     mood:"ok",   hardStreak:0, tasks:2}
];

/* ---------- עזרי טקסט ---------- */
function first(name){ return name.split(/[\s\-]/)[0]; }
var SEEN_TEXT = {
  today:"נראתה היום", yesterday:"לא נראתה מאתמול",
  "2days":"לא נראתה יומיים", "3days":"לא נראתה 3 ימים", "4days":"לא נראתה 4 ימים"
};
var SEEN_WHEN = {
  today:"לפני שעה", yesterday:"אתמול", "2days":"לפני יומיים", "3days":"לפני 3 ימים", "4days":"לפני 4 ימים"
};
function seenLine(s){
  // התאמת מין: "נראתה" (נ) / "נראה" (ז)
  var t = SEEN_TEXT[s.seen];
  if(s.g === "m") t = t.replace("נראתה","נראה");
  return t;
}
var MODE_STATUS = {green:"נראה היום", yellow:"לא היום", red:"דורש פנייה"};

/* ---------- SVG ---------- */
function waIcon(){
  return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2.5a9.5 9.5 0 0 0-8.1 14.4L2.5 21.5l4.7-1.4a9.5 9.5 0 1 0 4.84-17.6zm0 1.7a7.8 7.8 0 0 1 6.6 11.95 7.8 7.8 0 0 1-9.9 2.98l-.34-.16-2.79.83.84-2.72-.18-.35A7.8 7.8 0 0 1 12.04 4.2zm-3.2 3.4c-.16 0-.42.06-.64.3-.22.24-.85.83-.85 2.02 0 1.2.87 2.35.99 2.51.12.16 1.7 2.72 4.18 3.7 2.06.82 2.48.66 2.93.62.45-.04 1.45-.59 1.66-1.17.2-.58.2-1.07.14-1.17-.06-.1-.22-.16-.46-.28-.24-.12-1.45-.72-1.67-.8-.22-.08-.39-.12-.55.12-.16.24-.63.8-.77.96-.14.16-.28.18-.52.06-.24-.12-1.03-.38-1.96-1.21-.72-.64-1.21-1.44-1.35-1.68-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.34-.76-1.83-.2-.47-.4-.41-.55-.42z"/></svg>';
}
function escIcon(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
}
function moodFace(mood){
  var paths = {
    great:'<path d="M8 14s1.5 2 4 2 4-2 4-2"/>',
    ok:'<path d="M8 13.5s1.5 1.5 4 1.5 4-1.5 4-1.5"/>',
    meh:'<path d="M8 15h8"/>',
    hard:'<path d="M8 16s1.5-2 4-2 4 2 4 2"/>'
  };
  return '<svg class="mface m-'+mood+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/>'+paths[mood]+'<path d="M9 9h.01M15 9h.01"/></svg>';
}
var MOOD_LBL = {great:"מעולה", ok:"בסדר", meh:"ככה־ככה", hard:"קשה לי"};

/* ---------- חישוב סטטוס לפי מצב ---------- */
function emStatus(s){ // חירום — לפי מתי נראה לאחרונה
  if(s.seen === "today") return "green";
  if(s.seen === "yesterday" || s.seen === "2days") return "yellow";
  return "red";
}
function isFlag(s){ return s.mood === "hard"; }   // דגל רגשי
function rtStatus(s){ // שגרה — לפי השלמת משימות
  if(s.tasks >= 3) return "green";
  if(s.tasks >= 1) return "yellow";
  return "red";
}

/* ---------- מיון ---------- */
function orderKey(s, mode){
  if(mode === "emergency"){
    var st = emStatus(s);
    if(st === "red") return 0;
    if(isFlag(s)) return 1;         // דגלים רגשיים אחרי אדומים
    if(st === "yellow") return 2;
    return 3;                        // ירוקים תקינים
  } else {
    var r = rtStatus(s);
    if(r === "red") return 0;
    if(r === "yellow") return 1;
    return 2;
  }
}

/* ---------- הודעות וואטסאפ מוכנות ---------- */
function waMessage(s, mode){
  var f = first(s.n);
  if(mode === "emergency"){
    if(isFlag(s)){
      return "היי "+f+", קיבלתי את ה-check-in שלך וראיתי שקצת קשה לך. אני כאן בשבילך. בא לך שנדבר רגע?";
    }
    var when = {yesterday:"מאתמול", "2days":"כבר יומיים", "3days":"כבר שלושה ימים", "4days":"כבר ארבעה ימים"}[s.seen];
    return "היי "+f+", שמנו לב שלא נכנסת אלינו "+when+". הכול בסדר אצלך? נשמח מאוד לשמוע ממך. אנחנו כאן.";
  } else {
    var left = 3 - s.tasks;
    return "היי "+f+", ראיתי שנשארו לך "+left+" משימות פתוחות מהיום. רוצה שנעבור עליהן יחד? אני כאן לעזור.";
  }
}

/* ---------- רינדור ---------- */
var state = { mode:"emergency", filter:"all" };

function subLine(s, mode){
  if(mode === "emergency"){
    if(s.seen === "today"){
      // נראה היום — הצג check-in רגשי אם קיים
      if(s.mood){
        var cls = isFlag(s) ? "sub hard" : "sub";
        var extra = (s.hardStreak >= 3) ? " · 3 ימים ברצף" : "";
        return '<div class="'+cls+'">'+moodFace(s.mood)+' check-in: '+MOOD_LBL[s.mood]+extra+'</div>';
      }
      return '<div class="sub">נכנס היום · בלי check-in</div>';
    }
    return '<div class="sub">נראה לאחרונה '+SEEN_WHEN[s.seen]+'</div>';
  } else {
    var verb = s.g === "m" ? "השלים" : "השלימה";
    return '<div class="sub">'+verb+' '+s.tasks+'/3 משימות היום</div>';
  }
}

function statusPill(s, mode){
  var st = mode === "emergency" ? emStatus(s) : rtStatus(s);
  var txt;
  if(mode === "emergency"){
    if(st === "green") txt = s.g === "m" ? "נראה היום" : "נראתה היום";
    else if(st === "yellow") txt = s.seen === "yesterday" ? "אתמול" : "יומיים";
    else txt = s.seen === "4days" ? "4 ימים" : "3 ימים";
  } else {
    txt = st === "green" ? "הכול הושלם" : (st === "yellow" ? s.tasks+"/3" : "לא התחיל");
  }
  return '<span class="status st-'+st+'"><span class="d"></span>'+txt+'</span>';
}

function rowHTML(s, idx, mode){
  var st = mode === "emergency" ? emStatus(s) : rtStatus(s);
  var av = st === "green" ? "a-green" : (st === "yellow" ? "a-yellow" : "a-red");
  var ringCls = st === "green" ? "g" : (st === "yellow" ? "y" : "r");
  var persistent = (mode === "emergency" && s.hardStreak >= 3);
  var showWa = (st === "yellow" || st === "red") || (mode === "emergency" && isFlag(s));

  var html = '<div class="p-item'+(persistent?' flag-persistent':'')+'" data-idx="'+idx+'">';
  html += '<div class="p-row">';
  html += '<div class="avatar '+av+'">'+s.n.charAt(0)+'<span class="ring '+ringCls+'"></span></div>';
  html += '<div class="who"><div class="nm">'+s.n+'</div>'+subLine(s, mode)+'</div>';
  html += statusPill(s, mode);
  html += '</div>';

  // אזור פעולות
  var actions = '';
  var btns = '';
  if(showWa){
    btns += '<button class="wa-btn" onclick="toggleWa('+idx+')">'+waIcon()+'שלח וואטסאפ</button>';
  }
  if(persistent){
    btns += '<button class="esc-btn" onclick="escalate('+idx+')">'+escIcon()+'העבר ליועצת</button>';
  }
  if(btns){
    actions += '<div class="act-btns">'+btns+'</div>';
  }
  if(showWa){
    actions += '<div class="wa-msg" id="wa-'+idx+'">'
      + '<div class="lbl">'+waIcon()+'הודעה מוכנה · '+first(s.n)+'</div>'
      + '<div class="txt">'+waMessage(s, mode)+'</div>'
      + '<div class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>אפשר לערוך לפני השליחה · בדמו ההודעה רק מוצגת</div>'
      + '</div>';
  }
  if(persistent){
    actions += '<div class="esc-done" id="esc-'+idx+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>הפנייה נשלחה ליועצת. היא תיצור קשר עם '+first(s.n)+' עוד היום, ותתעד ביומן הקשר.</div>';
  }
  if(actions) html += '<div class="p-actions">'+actions+'</div>';

  html += '</div>';
  return html;
}

function sepHTML(kind, icon, text){
  return '<div class="grp-sep '+kind+'"><span class="gi">'+icon+'</span>'+text+'</div>';
}

function passesFilter(s, mode){
  if(state.filter === "all") return true;
  if(mode === "emergency"){
    if(state.filter === "unseen") return emStatus(s) !== "green";
    if(state.filter === "flags")  return isFlag(s);
  } else {
    if(state.filter === "unseen") return rtStatus(s) !== "green"; // "לא השלימו"
    if(state.filter === "flags")  return rtStatus(s) === "red";   // "תקועים"
  }
  return true;
}

function render(){
  var mode = state.mode;
  // מיון: לפי מפתח קבוצה, יציב לפי אינדקס מקורי
  var arr = STUDENTS.map(function(s,i){ return {s:s, i:i}; });
  arr.sort(function(a,b){
    var ka = orderKey(a.s, mode), kb = orderKey(b.s, mode);
    if(ka !== kb) return ka - kb;
    return a.i - b.i;
  });

  var list = document.getElementById("list");
  var html = "";
  var lastKey = -1;
  var shown = 0;

  arr.forEach(function(o){
    if(!passesFilter(o.s, mode)) return;
    var k = orderKey(o.s, mode);
    if(k !== lastKey){
      // מפריד קבוצה
      if(mode === "emergency"){
        if(k===0) html += sepHTML("red", warnIcon(), "דורשים פנייה · לא נראו");
        else if(k===1) html += sepHTML("flag", heartIcon(), "דגלים רגשיים · שווים בדיקה");
        else if(k===2) html += sepHTML("yellow", clockIcon(), "מתעכבים · יום־יומיים");
        else html += sepHTML("green", checkIcon(), "נראו היום · הכול טוב");
      } else {
        if(k===0) html += sepHTML("red", warnIcon(), "לא התחילו · אפס משימות");
        else if(k===1) html += sepHTML("yellow", clockIcon(), "באמצע · השלמה חלקית");
        else html += sepHTML("green", checkIcon(), "סיימו הכול היום");
      }
      lastKey = k;
    }
    html += rowHTML(o.s, o.i, mode);
    shown++;
  });

  if(shown === 0) html = '<div class="empty">אין תלמידים בסינון הזה — כל הכבוד!</div>';
  list.innerHTML = html;

  updateHeader();
}

/* אייקוני מפרידים */
function warnIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';}
function heartIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>';}
function clockIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';}
function checkIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';}

/* עדכון כותרת + מוני סינון לפי מצב */
function updateHeader(){
  var mode = state.mode;
  var total = STUDENTS.length;
  var green = STUDENTS.filter(function(s){
    return (mode==="emergency" ? emStatus(s) : rtStatus(s)) === "green";
  }).length;
  var unseen = total - green;
  var flags = mode==="emergency"
    ? STUDENTS.filter(isFlag).length
    : STUDENTS.filter(function(s){return rtStatus(s)==="red";}).length;

  document.getElementById("statNum").innerHTML = green + '<span class="of">/'+total+'</span>';
  document.getElementById("statLab").innerHTML = (mode==="emergency" ? "נראו היום" : "סיימו משימות")
    + '<span>מי צריך אותך עכשיו — למעלה</span>';
  document.getElementById("statBar").style.width = Math.round(green/total*100) + "%";

  document.getElementById("cAll").textContent = total;
  document.getElementById("cUnseen").textContent = unseen;
  document.getElementById("cFlags").textContent = flags;
  document.getElementById("fUnseen").textContent = mode==="emergency" ? "לא נראו" : "לא השלימו";
  document.getElementById("fFlags").textContent  = mode==="emergency" ? "דגלים" : "תקועים";
}

/* ---------- אינטראקציות ---------- */
function toggleWa(idx){
  var el = document.getElementById("wa-"+idx);
  if(el) el.classList.toggle("open");
}
function escalate(idx){
  var el = document.getElementById("esc-"+idx);
  if(el) el.classList.add("open");
  // הסתר את כפתור ההעברה אחרי לחיצה
  var item = document.querySelector('.p-item[data-idx="'+idx+'"] .esc-btn');
  if(item) item.style.display = "none";
}

/* מתג דמו */
var demoBtns = document.querySelectorAll('.demo-bar .seg button');
demoBtns.forEach(function(b){
  b.addEventListener('click', function(){
    state.mode = b.getAttribute('data-m');
    document.documentElement.setAttribute('data-mode', state.mode);
    demoBtns.forEach(function(x){ x.setAttribute('aria-pressed', x===b ? 'true':'false'); });
    render();
  });
});

/* סינון */
var filterBtns = document.querySelectorAll('.filters button');
filterBtns.forEach(function(b){
  b.addEventListener('click', function(){
    state.filter = b.getAttribute('data-f');
    filterBtns.forEach(function(x){ x.setAttribute('aria-pressed', x===b ? 'true':'false'); });
    render();
  });
});

/* אתחול */
document.documentElement.setAttribute('data-mode', 'emergency');
render();
</script>
</body>
</html>
