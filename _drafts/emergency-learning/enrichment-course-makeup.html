<!DOCTYPE html>
<html dir="rtl" lang="he" data-mode="routine">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קורס העשרה — איפור · קורס מלא (5 שיעורים) · רֶצֶף</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   רֶצֶף · מוצר C — סבב ב' · קורס מלאכת-יד ראשון: "איפור"
   enrichment-course-makeup.html
   אותו מנוע (money/ai/venture) — DATA אחר + 2 רכיבים חדשים למלאכה:
   ▸ simulator mode "shade" — התאמת גוון (ויזואלי אמיתי, בלי צילומים)
   ▸ artifact mode "kit" (צ'קליסט ערכה) · "plan" (תוכנית הלוק — התוצר)
   עיקרון מלאכה: היצירה בידיים. המסך = מדריך (gallery · decide · mission).
   שפה מגדרית: ניטרלי/רבים — איפור הוא לכל מי שרוצה.
   [ ] צילומים: משבצות מסומנות IMG-SLOT — ממתינות לתמונות של מיטל.
   ============================================================ */
:root{
  --brand:#0B8F98; --brand-deep:#08666D; --brand-dark:#073D4A; --brand-soft:#E8F8F9; --brand-line:#B8E7EA;
  --ink:#173A4A; --ink-strong:#0F2D3A; --ink-soft:#607984; --ink-faint:#91A5AE;
  --bg:#F6FAFB; --card:#FFFFFF; --surface-muted:#EEF5F6; --line:#E2ECEF; --line-strong:#CDDDE1;
  --remote:#2D8CFF; --remote-soft:#EDF5FF;
  --emergency:#F28A2E; --emergency-soft:#FFF4E8; --emergency-line:#FFD3A8;
  --good:#3AA65A; --good-soft:#E8F6EC; --good-line:#BCE3C6;
  --warn:#D99A18; --warn-soft:#FBF3DE;
  --joy:#7A3EA6; --joy-soft:#F5EDFB; --joy-line:#E3CFF2;
  --ai:#7A3EA6; --ai-soft:#F5EDFB; --ai-line:#E3CFF2;
  --mk:#C2477F; --mk-soft:#FCEDF4; --mk-line:#F3C8DC;
  --on-brand:#FFFFFF; --shadow-brand:0 2px 8px rgba(11,143,152,.22);
  --font-head:"Heebo","Assistant",sans-serif; --font-body:"Assistant","Heebo",sans-serif;
  --radius-sm:10px; --radius-md:16px; --radius-lg:22px; --radius-btn:12px; --radius-pill:999px;
  --shadow-card:0 6px 22px rgba(23,58,74,.06); --shadow-lg:0 12px 34px rgba(23,58,74,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);
  background:radial-gradient(900px 500px at 80% -10%,#FCEDF4 0%,transparent 60%),
             radial-gradient(700px 460px at -10% 110%,#EAF7F8 0%,transparent 55%),var(--bg);
  color:var(--ink);line-height:1.6;font-size:16px;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:22px 12px}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.28;font-weight:700;color:var(--ink-strong)}
svg{display:block} button{font-family:inherit;cursor:pointer;border:none;background:none}
.app{max-width:432px;width:100%;background:var(--bg);border-radius:30px;overflow:hidden;
  box-shadow:var(--shadow-lg),0 0 0 1px var(--line);display:flex;flex-direction:column;min-height:780px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(246,250,251,.92);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border-bottom:1px solid var(--line);padding:12px 18px 11px}
.tb-row{display:flex;align-items:center;gap:11px}
.tb-back{width:34px;height:34px;border-radius:var(--radius-pill);display:grid;place-items:center;background:var(--card);box-shadow:0 1px 3px rgba(23,58,74,.08);color:var(--ink-soft);flex:0 0 auto}
.tb-back svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tb-back.hidden{visibility:hidden}
.tb-meta{flex:1;min-width:0}
.tb-kicker{font-size:11.5px;font-weight:700;color:var(--mk);letter-spacing:.02em;display:flex;align-items:center;gap:5px}
.tb-kicker svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.7;fill:none}
.tb-title{font-size:14.5px;font-weight:700;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-step{font-size:11px;font-weight:700;color:var(--ink-faint);flex:0 0 auto}
.seq{display:flex;align-items:center;margin-top:11px;padding:0 2px}
.seq-node{flex:0 0 auto;width:11px;height:11px;border-radius:50%;background:var(--surface-muted);border:2px solid var(--line-strong);z-index:2;transition:.35s}
.seq-link{flex:1;height:3px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.seq-link::after{content:"";position:absolute;inset:0;background:var(--mk);transform:scaleX(0);transform-origin:right;transition:transform .5s}
.seq-node.done{background:var(--mk);border-color:var(--mk)}
.seq-node.now{background:var(--card);border-color:var(--mk);box-shadow:0 0 0 4px var(--mk-soft)}
.seq-link.filled::after{transform:scaleX(1)}
.stage{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen{padding:20px 18px 26px;display:flex;flex-direction:column;gap:16px;animation:slideIn .34s cubic-bezier(.22,.61,.36,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kind{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:12px;font-weight:800;padding:6px 12px;border-radius:var(--radius-pill)}
.kind svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.k-scenario{background:var(--remote-soft);color:var(--remote)}
.k-gallery{background:var(--warn-soft);color:#B47B10}
.k-decide{background:var(--joy-soft);color:var(--joy)}
.k-simulator{background:var(--brand-soft);color:var(--brand-deep)}
.k-aihands{background:var(--ai-soft);color:var(--ai)}
.k-artifact{background:var(--mk-soft);color:var(--mk)}
.lead{font-size:15px;color:var(--ink-soft)}
h2.q{font-size:22px;line-height:1.32} h2.q b{color:var(--mk)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-card)}
.cta-bar{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.72);backdrop-filter:blur(8px)}
.btn{width:100%;min-height:52px;border-radius:var(--radius-btn);font-family:var(--font-head);font-weight:800;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn-primary{background:var(--brand-deep);color:var(--on-brand);box-shadow:var(--shadow-brand)}
.btn-primary:active{transform:translateY(1px) scale(.995)}
.btn-ghost{background:transparent;color:var(--brand-deep);min-height:44px;font-size:15px}
.hero{padding:26px 20px 22px;border-radius:var(--radius-lg);color:var(--on-brand);position:relative;overflow:hidden;
  background:linear-gradient(150deg,#D9639A 0%,#C2477F 58%,#7E2450 100%)}
.hero::after{content:"";position:absolute;inset:0;opacity:.5;background:radial-gradient(300px 200px at 88% 8%,rgba(255,255,255,.24),transparent 70%)}
.hero-badge{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:var(--radius-pill);font-size:12px;font-weight:800;margin-bottom:14px}
.hero-badge svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none}
.hero h1{position:relative;z-index:1;color:#fff;font-size:29px;line-height:1.2;margin-bottom:9px}
.hero p{position:relative;z-index:1;color:rgba(255,255,255,.93);font-size:15px}
.hero-facts{position:relative;z-index:1;display:flex;gap:8px;margin-top:18px}
.hero-fact{flex:1;background:rgba(255,255,255,.15);border-radius:var(--radius-sm);padding:10px 8px;text-align:center}
.hero-fact b{display:block;font-family:var(--font-head);font-size:16px;color:#fff}
.hero-fact span{font-size:10.5px;color:rgba(255,255,255,.85)}
.create-box{padding:15px 16px;border-radius:var(--radius-md);background:var(--good-soft);border:1.5px solid var(--good-line);display:flex;gap:11px;align-items:flex-start}
.create-box svg{width:22px;height:22px;flex:0 0 auto;stroke:var(--good);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.create-box b{color:#217A3B;font-family:var(--font-head)} .create-box p{font-size:13.5px;color:var(--ink)}
.les-title{font-size:13px;font-weight:800;color:var(--ink-soft);margin:4px 2px -4px}
.les{width:100%;text-align:right;padding:14px 15px;border-radius:var(--radius-md);background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;gap:13px;box-shadow:var(--shadow-card);transition:.16s}
.les:active{transform:scale(.99)}
.les .num{width:38px;height:38px;border-radius:11px;background:var(--mk-soft);color:var(--mk);display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:17px;flex:0 0 auto}
.les.done .num{background:var(--good-soft);color:var(--good)}
.les.done .num svg{width:20px;height:20px;stroke:var(--good);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.les .tx{flex:1} .les .tx b{display:block;font-family:var(--font-head);font-size:15.5px;color:var(--ink-strong)}
.les .tx span{font-size:12.5px;color:var(--ink-soft)}
.les .go svg{width:18px;height:18px;stroke:var(--ink-faint);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.choices{display:flex;flex-direction:column;gap:11px}
.choice{width:100%;text-align:right;padding:15px 16px;border-radius:var(--radius-md);background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;gap:13px;transition:.18s;box-shadow:var(--shadow-card)}
.choice:active{transform:scale(.99)}
.choice .ic{width:42px;height:42px;border-radius:12px;background:var(--mk-soft);display:grid;place-items:center;flex:0 0 auto}
.choice .ic svg{width:22px;height:22px;stroke:var(--mk);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.choice .tx b{display:block;font-family:var(--font-head);font-size:15.5px;color:var(--ink-strong)}
.choice .tx span{font-size:12.5px;color:var(--ink-soft)}
.choice.sel{border-color:var(--mk);background:var(--mk-soft)}
.result{display:none;padding:15px;border-radius:var(--radius-md);animation:slideIn .3s}
.result.show{display:block}
.result.win{background:var(--good-soft);border:1.5px solid var(--good-line)}
.result.meh{background:var(--warn-soft);border:1.5px solid #EBD59A}
.result.bad{background:#FBEBEA;border:1.5px solid #F0C3BF}
.result h4{font-size:15px;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.result h4 svg{width:18px;height:18px;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.result.win h4{color:var(--good)}.result.win h4 svg{stroke:var(--good)}
.result.meh h4{color:#B47B10}.result.meh h4 svg{stroke:#B47B10}
.result.bad h4{color:#C0392B}.result.bad h4 svg{stroke:#C0392B}
.result p{font-size:14px;color:var(--ink)}
/* gallery + img slot */
.gal{padding:14px;border-radius:var(--radius-md);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-card)}
.gal+.gal{margin-top:11px}
.imgslot{height:104px;border-radius:var(--radius-sm);border:1.5px dashed var(--line-strong);background:var(--surface-muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;margin-bottom:10px;color:var(--ink-faint)}
.imgslot svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.imgslot span{font-size:11px;font-weight:700}
.gal .gt{font-family:var(--font-head);font-weight:700;font-size:15.5px;margin-bottom:4px}
.gal .gd{font-size:13.5px;color:var(--ink-soft);margin-bottom:8px}
.gal .why{font-size:12.5px;color:var(--mk);background:var(--mk-soft);border-radius:var(--radius-sm);padding:8px 10px;font-weight:600}
.pal{display:flex;gap:6px;margin-bottom:9px}
.pal i{flex:1;height:34px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}
.quiz{padding:15px;border-radius:var(--radius-md);background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow-card)}
.quiz b.qq{display:block;font-family:var(--font-head);font-size:15.5px;margin-bottom:10px}
.qopt{width:100%;text-align:right;padding:12px 13px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--card);font-size:13.5px;color:var(--ink);transition:.16s}
.qopt+.qopt{margin-top:8px}
.qopt.ok{border-color:var(--good);background:var(--good-soft);font-weight:700}
.qopt.no{border-color:#F0C3BF;background:#FBEBEA}
.qfb{margin-top:9px;font-size:12.5px;padding:9px 11px;border-radius:var(--radius-sm);display:none}
.qfb.show{display:block;animation:slideIn .25s}
.method{padding:14px;border-radius:var(--radius-md);border:1.5px solid var(--line);background:var(--card);box-shadow:var(--shadow-card);transition:.18s;text-align:right;width:100%;display:block}
.method+.method{margin-top:11px}
.method.sel{border-color:var(--joy);background:var(--joy-soft);box-shadow:0 0 0 3px var(--joy-line)}
.method-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.method-top .ic{width:38px;height:38px;border-radius:11px;background:var(--joy-soft);display:grid;place-items:center;flex:0 0 auto}
.method-top .ic svg{width:20px;height:20px;stroke:var(--joy);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.method-top b{font-family:var(--font-head);font-size:16px;color:var(--ink-strong)}
.method-top span{font-size:11.5px;color:var(--ink-soft);display:block}
.method p{font-size:13px;color:var(--ink);margin-bottom:8px}
.pros{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.pro{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-soft)}
.pro svg{width:13px;height:13px;flex:0 0 auto;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pro.y svg{stroke:var(--good)} .pro.n svg{stroke:var(--ink-faint)}
.fit{font-size:12px;font-weight:800;color:var(--joy);background:var(--joy-soft);border-radius:var(--radius-sm);padding:8px 10px;display:flex;align-items:center;gap:6px}
.fit svg{width:14px;height:14px;stroke:var(--joy);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* shade simulator */
.shade-row{display:flex;gap:0;padding:0 15px 4px}
.sw{flex:1;height:90px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font-size:11px;font-weight:800;color:rgba(0,0,0,.5)}
.sw:first-child{border-radius:var(--radius-md) 0 0 var(--radius-md)}
.sw:last-child{border-radius:0 var(--radius-md) var(--radius-md) 0}
.tones{display:flex;gap:7px;padding:12px 15px;border-top:1px solid var(--line)}
.tone{flex:1;height:42px;border-radius:var(--radius-sm);border:2.5px solid transparent;transition:.16s}
.tone.on{border-color:var(--mk);box-shadow:0 0 0 3px var(--mk-soft)}
.slider{padding:12px 15px;border-top:1px solid var(--line)}
.slider .lab{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.slider .lab .n{font-family:var(--font-head);font-weight:700;font-size:14px}
.slider .lab .v{font-family:var(--font-head);font-weight:800;font-size:13px;color:var(--mk)}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:var(--surface-muted);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--card);border:3px solid var(--mk);box-shadow:0 2px 6px rgba(23,58,74,.2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--card);border:3px solid var(--mk)}
.sim-fb{margin:0 15px 15px;padding:12px 13px;border-radius:var(--radius-sm);font-size:13px;display:flex;gap:9px;align-items:flex-start;transition:.25s}
.sim-fb svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sim-fb.good{background:var(--good-soft);color:#217A3B} .sim-fb.good svg{stroke:var(--good)}
.sim-fb.warn{background:var(--warn-soft);color:#8A6410} .sim-fb.warn svg{stroke:var(--warn)}
/* kit checklist */
.kitrow{display:flex;align-items:center;gap:11px;padding:12px 15px;border-top:1px solid var(--line)}
.kitrow:first-child{border-top:none}
.kitrow .tx{flex:1} .kitrow .tx b{display:block;font-size:14px} .kitrow .tx span{font-size:11.5px;color:var(--ink-faint)}
.kbtn{flex:0 0 auto;border:1.4px dashed var(--line-strong);border-radius:var(--radius-pill);padding:7px 12px;font-size:12px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:5px}
.kbtn svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.kbtn.have{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good)}
.kbtn.need{border-style:solid;border-color:var(--warn);background:var(--warn-soft);color:#8A6410}
.ktally{padding:13px 15px;border-top:2px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-soft);text-align:center}
/* ai-hands */
.ai-safe{padding:12px 14px;border-radius:var(--radius-sm);background:var(--ai-soft);border:1px solid var(--ai-line);font-size:12.5px;color:#5B2E7E;display:flex;gap:8px;align-items:flex-start}
.ai-safe svg{width:17px;height:17px;flex:0 0 auto;stroke:var(--ai);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.steps{counter-reset:st;display:flex;flex-direction:column;gap:9px}
.steps .s{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.steps .s::before{counter-increment:st;content:counter(st);flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--ai-soft);color:var(--ai);font-family:var(--font-head);font-weight:800;font-size:13px;display:grid;place-items:center}
.prompt-box{background:#231038;border-radius:var(--radius-md);padding:14px;color:#E6DAF2;position:relative;font-size:13px;line-height:1.75;white-space:pre-wrap}
.prompt-box .copy{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:5px}
.prompt-box .copy svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none}
.reflect{padding:13px 15px;border-radius:var(--radius-md);background:var(--surface-muted)}
.reflect b{font-size:13.5px;color:var(--ink-strong);display:block;margin-bottom:4px}
.reflect p{font-size:12.5px;color:var(--ink-soft)}
/* plan card */
.plan{padding:20px;border-radius:var(--radius-lg);background:linear-gradient(150deg,#D9639A 0%,#7E2450 100%);color:#fff}
.plan .lbl{font-size:11px;color:rgba(255,255,255,.82);font-weight:700}
.plan .nm{font-family:var(--font-head);font-size:24px;font-weight:800;margin:2px 0 12px}
.plan .rowz{display:flex;gap:8px;margin-bottom:10px}
.plan .box{flex:1;background:rgba(255,255,255,.15);border-radius:var(--radius-sm);padding:9px 8px;text-align:center}
.plan .box b{display:block;font-family:var(--font-head);font-size:13.5px}
.plan .box span{font-size:10px;color:rgba(255,255,255,.8)}
.plan .palw{display:flex;gap:5px;margin-bottom:10px}
.plan .palw i{flex:1;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.3)}
.plan .chk{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.plan .chk svg{width:15px;height:15px;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.field{padding:12px 15px;border-top:1px solid var(--line)}
.field:first-child{border-top:none}
.field .fl{font-family:var(--font-head);font-weight:700;font-size:13.5px;margin-bottom:7px}
.field input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;font-family:inherit;font-size:14px;color:var(--ink)}
.field input[type=text]:focus{outline:none;border-color:var(--mk)}
.uses{display:flex;flex-wrap:wrap;gap:7px}
.use{border:1.5px solid var(--line);border-radius:var(--radius-pill);padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--ink-soft);transition:.16s}

.pp{flex:1;border-radius:var(--radius-sm);border:2.5px solid transparent;padding:5px;transition:.16s}
.pp.on{border-color:var(--mk)}
.pp .strip{display:flex;gap:3px} .pp .strip i{flex:1;height:20px;border-radius:4px}
.pp span{display:block;font-size:10.5px;font-weight:700;color:var(--ink-soft);margin-top:4px;text-align:center}
.mission{padding:16px;border-radius:var(--radius-md);background:var(--emergency-soft);border:1.5px solid var(--emergency-line)}
.mission h3{color:#C56A16;font-size:16.5px;display:flex;align-items:center;gap:8px;margin-bottom:9px}
.mission h3 svg{width:19px;height:19px;stroke:#C56A16;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mission ol{margin:0 18px;font-size:13.5px;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.mission .when{font-size:12px;color:#B47B10;font-weight:700;margin-top:9px;display:flex;align-items:center;gap:6px}
.mission .when svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none}
.remember{padding:16px;border-radius:var(--radius-md);background:var(--brand-soft);border:1.5px solid var(--brand-line)}
.remember .rl{font-size:12px;font-weight:800;color:var(--brand-deep);display:flex;align-items:center;gap:6px;margin-bottom:7px}
.remember .rl svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.remember p{font-size:15px;color:var(--ink-strong);font-weight:600;line-height:1.5}
.done-wrap{text-align:center;padding:14px 8px}
.done-ring{width:76px;height:76px;margin:0 auto 12px;border-radius:50%;background:var(--good-soft);display:grid;place-items:center;animation:pop .4s cubic-bezier(.22,1.4,.5,1)}
.done-ring svg{width:38px;height:38px;stroke:var(--good);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.done-wrap h2{font-size:22px;margin-bottom:5px} .done-wrap p{font-size:14px;color:var(--ink-soft)}
.done-list{text-align:right;padding:15px;border-radius:var(--radius-md);background:var(--good-soft);border:1.5px solid var(--good-line)}
.done-list b{color:#217A3B;font-family:var(--font-head);font-size:14px}
.done-list ul{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.done-list li{font-size:13.5px;color:var(--ink);display:flex;gap:8px;align-items:center}
.done-list li svg{width:15px;height:15px;flex:0 0 auto;stroke:var(--good);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.proto-note{margin-top:4px;padding:10px 13px;border-radius:var(--radius-sm);background:#fff;border:1px dashed var(--line-strong);font-size:11.5px;color:var(--ink-faint);line-height:1.5}
.proto-note b{color:var(--mk)}

function setCta(t){ var b=document.getElementById('cta'); if(t===null){b.style.display='none';return;} b.style.display='flex'; document.getElementById('ctaTx').textContent=t; }
function buildSeq(n,filled){
  var s=document.getElementById('seq'); s.innerHTML='';
  for(var i=0;i<n;i++){ var nd=document.createElement('div');
    nd.className='seq-node'+(i<filled?' done':(i===filled?' now':'')); s.appendChild(nd);
    if(i<n-1){var lk=document.createElement('div'); lk.className='seq-link'+(i<filled?' filled':''); s.appendChild(lk);} }
}
function render(){
  var back=document.getElementById('back');
  if(view==="home"){ back.classList.add('hidden'); document.getElementById('kicker').textContent="קורס העשרה · איפור";
    document.getElementById('crumb').textContent=COURSE.title; document.getElementById('step').textContent="";
    buildSeq(COURSE.lessons.length,doneCount()); renderHome(); setCta(doneCount()>0?"המשך ללמוד":"התחל שיעור 1"); }
  else if(view==="lesson"){ back.classList.remove('hidden'); var L=COURSE.lessons[li];
    document.getElementById('kicker').textContent="שיעור "+L.id+" · "+L.title;
    document.getElementById('crumb').textContent=L.sub; document.getElementById('step').textContent=(si+1)+" / "+totalScreens(li);
    buildSeq(totalScreens(li),si); renderScreen(L.screens[si]);
    setCta(si===totalScreens(li)-1?"סיימתי את השיעור":"הלאה"); }
  else { back.classList.add('hidden'); document.getElementById('step').textContent="";
    document.getElementById('crumb').textContent=COURSE.title+" — הושלם"; buildSeq(COURSE.lessons.length,COURSE.lessons.length); renderDone(); setCta(null); }
  stage().scrollTop=0;
}
function cta(){
  if(view==="home"){ li=firstUndone(); si=0; view="lesson"; render(); }
  else if(view==="lesson"){ if(si<totalScreens(li)-1){si++;render();}
    else { done[li]=true; view=(doneCount()>=COURSE.lessons.length)?"done":"home"; render(); } }
}
function goBack(){ if(view==="lesson"){ if(si>0){si--;render();} else {view="home";render();} } }
function firstUndone(){ for(var i=0;i<COURSE.lessons.length;i++) if(!done[i]) return i; return 0; }
function openLesson(i){ li=i; si=0; view="lesson"; render(); }
function restart(){ done={}; view="home"; li=0; si=0; render(); }

    return '<button class="les'+(d?' done':'')+'" onclick="openLesson('+i+')">'+

      '<span class="go"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></span></button>'; }).join('');
  stage().innerHTML='<div class="screen">'+
    '<div class="hero"><div class="hero-badge"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21.4 8 14 2 9.4h7.6z"/></svg>סבב ב\' · מלאכת יד</div>'+

    '<div class="les-title">השיעורים</div>'+les+
    '<div class="proto-note"><b>הערה למיטל:</b> קורס מלאכה ראשון — היצירה בידיים, המסך מדריך. אותו מנוע, DATA אחר. <b>שיעור 1 מחכה לתמונות שלך</b> (משבצות מסומנות). סימולטור הגוון בשיעור 3 עובד בלי תמונות בכלל.</div></div>';
}
function chip(t){
  var m={scenario:['k-scenario','תרחיש · תבחרו, ותראו','<path d="M9 18l6-6-6-6"/><circle cx="12" cy="12" r="10"/>'],
    gallery:['k-gallery','גלריה · השראה','<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>'],
    decide:['k-decide','השוו והחליטו','<path d="M12 3v18M3 8l9-5 9 5M5 10v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>'],
    simulator:['k-simulator','סימולטור · התאימו וראו','<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'],
    aihands:['k-aihands','AI בידיים · אתם מפעילים','<rect x="4" y="7" width="16" height="12" rx="2"/><path d="M9 7V4h6v3M9 13h.01M15 13h.01"/>'],
    artifact:['k-artifact','התוצר שלכם · בנו אותו','<path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21.4 8 14 2 9.4h7.6z"/>']};
  var c=m[t]; return c?'<span class="kind '+c[0]+'"><svg viewBox="0 0 24 24">'+c[2]+'</svg>'+c[1]+'</span>':'';
}
function renderScreen(s){
  var h='<div class="screen">';
  if(s.type==="hook") h+=renderHook(s);
  else if(s.type==="scenario") h+=chip('scenario')+renderScenario(s);
  else if(s.type==="gallery") h+=chip('gallery')+renderGallery(s);
  else if(s.type==="decide") h+=chip('decide')+renderDecide(s);
  else if(s.type==="simulator"&&s.mode==="shade") h+=chip('simulator')+renderShade(s);
  else if(s.type==="aihands") h+=chip('aihands')+renderAi(s);
  else if(s.type==="artifact"&&s.mode==="kit") h+=chip('artifact')+renderKit(s);
  else if(s.type==="artifact"&&s.mode==="plan") h+=chip('artifact')+renderPlan(s);
  else if(s.type==="mission") h+=renderMission(s);
  h+='</div>'; stage().innerHTML=h;
  if(s.type==="simulator"&&s.mode==="shade") shade();
  if(s.type==="artifact"&&s.mode==="kit") ktally();
  if(s.type==="artifact"&&s.mode==="plan") plan();
}
function renderHook(s){
  return '<div class="hero"><div class="hero-badge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/></svg>נקודת פתיחה</div>'+
    '<h1>'+s.title+'</h1><p>'+s.lead+'</p></div>'+
    '<div class="remember"><div class="rl"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12c1 1 1 2 1 3h6c0-1 0-2 1-3a7 7 0 0 0-4-12z"/></svg>למה זה שלכם</div><p>'+s.why+'</p></div>';
}
function renderScenario(s){
  var ch=s.choices.map(function(c){return '<button class="choice" data-r="'+c.r+'" onclick="pickSc(this)"><span class="ic"><svg viewBox="0 0 24 24">'+c.ic+'</svg></span><span class="tx"><b>'+c.b+'</b><span>'+c.s+'</span></span></button>';}).join('');
  var res=Object.keys(s.results).map(function(k){var r=s.results[k];
    return '<div class="result '+r.tone+'" id="res-'+k+'"><h4><svg viewBox="0 0 24 24">'+(r.tone==="win"?'<path d="M20 6L9 17l-5-5"/>':'<circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/>')+'</svg>'+r.title+'</h4><p>'+r.text+'</p></div>';}).join('');
  return '<h2 class="q">'+s.q+'</h2><div class="choices">'+ch+'</div>'+res;
}
function pickSc(b){ var sc=b.closest('.screen');
  sc.querySelectorAll('.choice').forEach(function(c){c.classList.remove('sel');}); b.classList.add('sel');
  sc.querySelectorAll('.result').forEach(function(r){r.classList.remove('show');});
  var e=sc.querySelector('#res-'+b.getAttribute('data-r')); if(e)e.classList.add('show'); }
function renderGallery(s){
  var items=s.items.map(function(it){
    var media = it.pal
      ? '<div class="pal">'+it.pal.map(function(c){return '<i style="background:'+c+'"></i>';}).join('')+'</div>'
      : '<div class="imgslot"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>משבצת תמונה — ממתינה לצילום</span></div>';
    return '<div class="gal">'+media+'<div class="gt">'+it.t+'</div><div class="gd">'+it.d+'</div><div class="why">'+it.why+'</div></div>';
  }).join('');
  var q='';
  if(s.quiz){ var opts=s.quiz.opts.map(function(o,i){return '<button class="qopt" onclick="pickQ(this,'+(o.ok?1:0)+','+i+')">'+o.t+'</button>';}).join('');
    window._qfb=s.quiz.opts.map(function(o){return o.fb;});
    q='<div class="quiz"><b class="qq">'+s.quiz.q+'</b>'+opts+'<div class="qfb" id="qfb"></div></div>'; }
  return '<h2 class="q">'+s.q+'</h2>'+items+q;
}
function pickQ(btn,ok,i){
  var sc=btn.closest('.quiz');
  sc.querySelectorAll('.qopt').forEach(function(o){o.classList.remove('ok','no');});
  btn.classList.add(ok?'ok':'no');
  var fb=document.getElementById('qfb'); fb.className='qfb show';
  fb.style.background=ok?'var(--good-soft)':'#FBEBEA'; fb.style.color=ok?'#217A3B':'#C0392B';
  fb.textContent=window._qfb[i];
}
function renderDecide(s){
  var op=s.options.map(function(o){
    var pr=o.pros.map(function(p){return '<span class="pro y"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>'+p+'</span>';}).join('');
    var cn=o.cons.map(function(c){return '<span class="pro n"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>'+c+'</span>';}).join('');
    return '<button class="method" onclick="pickM(this)"><div class="method-top"><span class="ic"><svg viewBox="0 0 24 24">'+o.ic+'</svg></span><div><b>'+o.b+'</b><span>'+o.s+'</span></div></div><p>'+o.p+'</p><div class="pros">'+pr+cn+'</div><div class="fit"><svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>'+o.fit+'</div></button>';
  }).join('');
  return '<h2 class="q">'+s.q+'</h2>'+op+(s.reflect?'<div class="reflect"><b>לחשוב לרגע</b><p>'+s.reflect+'</p></div>':'');
}
function pickM(b){ var sc=b.closest('.screen'); sc.querySelectorAll('.method').forEach(function(m){m.classList.remove('sel');}); b.classList.add('sel'); }
/* --- simulator: shade matching --- */
var TONES=[{n:"בהיר",l:88,w:14},{n:"בינוני",l:74,w:20},{n:"שזוף",l:56,w:26},{n:"כהה",l:36,w:30}];
function toneCol(l,w){ /* l=lightness 0-100, w=warmth 0-40 → HSL */
  return 'hsl('+(28 - (w-20)*0.5)+', '+(22+w*0.9)+'%, '+l+'%)';
}
function renderShade(s){
  window._tone=1;
  var chips=TONES.map(function(t,i){return '<button class="tone'+(i===1?' on':'')+'" id="t'+i+'" style="background:'+toneCol(t.l,t.w)+'" onclick="pickTone('+i+')" aria-label="'+t.n+'"></button>';}).join('');
  return '<h2 class="q">'+s.q+'</h2><div class="card">'+
    '<div class="shade-row" style="padding-top:15px"><div class="sw" id="swSkin">העור שלך</div><div class="sw" id="swMake">המייקאפ</div></div>'+
    '<div class="tones">'+chips+'</div>'+
    '<div class="slider"><div class="lab"><span class="n">בהירות</span><span class="v" id="vL">—</span></div>'+
      '<input type="range" id="sL" min="20" max="95" step="1" value="74" oninput="shade()"></div>'+
    '<div class="slider"><div class="lab"><span class="n">אנדרטון · קר ← חם</span><span class="v" id="vW">—</span></div>'+
      '<input type="range" id="sW" min="0" max="40" step="1" value="20" oninput="shade()"></div>'+
    '<div class="sim-fb warn" id="shFb"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v5"/></svg><span id="shTx"></span></div></div>';
}
function pickTone(i){ window._tone=i; TONES.forEach(function(_,j){ document.getElementById('t'+j).className='tone'+(i===j?' on':''); }); shade(); }
function shade(){
  var t=TONES[window._tone], l=+document.getElementById('sL').value, w=+document.getElementById('sW').value;
  document.getElementById('swSkin').style.background=toneCol(t.l,t.w);
  document.getElementById('swMake').style.background=toneCol(l,w);
  document.getElementById('vL').textContent=l>t.l+6?'בהיר מדי':(l<t.l-6?'כהה מדי':'מתאים');
  document.getElementById('vW').textContent=w>t.w+5?'חם מדי':(w<t.w-5?'קר מדי':'מתאים');
  var dl=Math.abs(l-t.l), dw=Math.abs(w-t.w);
  var fb=document.getElementById('shFb'), tx=document.getElementById('shTx');
  if(dl<=5 && dw<=4){ fb.className='sim-fb good'; fb.querySelector('svg').innerHTML='<path d="M20 6L9 17l-5-5"/>';
    tx.textContent='מתאים! הגוון נעלם על העור — בדיוק מה שצריך.'; }
  else { fb.className='sim-fb warn'; fb.querySelector('svg').innerHTML='<circle cx="12" cy="12" r="10"/><path d="M12 8v5"/>';
    if(dl>5 && l>t.l) tx.textContent='בהיר מדי — ייראה כמו מסכה אפורה, ופס לבן בצוואר.';
    else if(dl>5) tx.textContent='כהה מדי — ייראה כמו קו מלוכלך בקו הלסת.';
    else if(w>t.w) tx.textContent='חם מדי — זה הכתום שרואים מקילומטר.';
    else tx.textContent='קר מדי — הפנים ייראו אפורות וחסרות חיים.'; }
}
/* --- artifact: kit checklist --- */
var KIT=[{b:"ספוג / מברשת בסיס",s:"למריחת המייקאפ"},{b:"מייקאפ בגוון שלכם",s:"או טינט קל"},{b:"מברשת סומק",s:"רכה, לא נוקשה"},
  {b:"עיפרון גבות",s:"גוון קרוב לשיער"},{b:"מסקרה אישית",s:"לא משתפים. אף פעם"},{b:"מגבונים / מסיר איפור",s:"מתחילים תמיד מפנים נקיות"}];
function renderKit(s){
  window._kit=KIT.map(function(){return null;});
  var rows=KIT.map(function(k,i){
    return '<div class="kitrow"><div class="tx"><b>'+k.b+'</b><span>'+k.s+'</span></div>'+
      '<button class="kbtn" id="k'+i+'" onclick="togK('+i+')"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>סמנו</button></div>'+
      '<div class="picker" id="kp'+i+'" style="display:none;gap:7px;padding:0 15px 12px">'+
        '<button class="use" onclick="setK('+i+',1)">יש לי</button><button class="use" onclick="setK('+i+',0)">חסר לי</button></div>';
  }).join('');
  return '<p class="lead">'+s.instruction+'</p><div class="card">'+rows+'<div class="ktally" id="kt"></div></div>';
}
function togK(i){ var p=document.getElementById('kp'+i); var open=p.style.display==='flex';
  document.querySelectorAll('[id^=kp]').forEach(function(x){x.style.display='none';}); p.style.display=open?'none':'flex'; }
function setK(i,v){ window._kit[i]=v; var b=document.getElementById('k'+i);
  b.className='kbtn '+(v?'have':'need');
  b.innerHTML=v?'<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>יש לי':'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>חסר לי';
  document.getElementById('kp'+i).style.display='none'; ktally(); }
function ktally(){
  var have=0, need=0, left=0;
  window._kit.forEach(function(v){ if(v===1)have++; else if(v===0)need++; else left++; });
  var el=document.getElementById('kt');
  if(left) el.textContent='סמנו את כל '+KIT.length+' הפריטים · נשארו '+left;
  else if(need===0) el.innerHTML='<span style="color:var(--good)">יש לכם ערכה מלאה. אפשר להתחיל!</span>';
  else el.innerHTML='<span style="color:#8A6410">חסרים '+need+' פריטים — אבל אפשר להתחיל גם בלעדיהם.</span>';
}
/* --- ai-hands --- */
function renderAi(s){

function copyP(b){ var t=document.getElementById('promptTxt').innerText;

  b.innerHTML='<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>הועתק';
  setTimeout(function(){ if(b) b.innerHTML='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>העתק'; },1600); }
/* --- artifact: look plan --- */
var OCC=["יום־יום","ערב / מסיבה","צילום / במה"];
var PALS=[{n:"חמים",c:["#C9A227","#8A5A2B","#E8D2A6"]},{n:"קרים",c:["#5B7BA6","#2E4A6B","#C8D6E5"]},
  {n:"ורוד",c:["#C2477F","#8E2A5C","#F3C8DC"]},{n:"ירוק",c:["#3D5A45","#7A9B76","#D4E2CE"]}];
var FOCUS=["עיניים","שפתיים"];
function renderPlan(s){
  window._occ=-1; window._pal=-1; window._foc=-1;
  var occ=OCC.map(function(o,i){return '<button class="use" id="o'+i+'" onclick="togO('+i+')">'+o+'</button>';}).join('');
  var pals=PALS.map(function(p,i){return '<button class="pp" id="p'+i+'" onclick="togPl('+i+')"><span class="strip" style="display:flex;gap:3px">'+
    p.c.map(function(c){return '<i style="background:'+c+'"></i>';}).join('')+'</span><span>'+p.n+'</span></button>';}).join('');
  var foc=FOCUS.map(function(f,i){return '<button class="use" id="f'+i+'" onclick="togF('+i+')">'+f+'</button>';}).join('');
  return '<p class="lead">'+s.instruction+'</p>'+
    '<div class="plan"><div class="lbl">תוכנית הלוק של</div><div class="nm" id="pName">— השם שלי —</div>'+
      '<div class="palw" id="pPal"><i style="background:rgba(255,255,255,.25)"></i><i style="background:rgba(255,255,255,.25)"></i><i style="background:rgba(255,255,255,.25)"></i></div>'+
      '<div class="rowz"><div class="box"><b id="pOcc">—</b><span>לאן</span></div><div class="box"><b id="pFoc">—</b><span>מדגישים</span></div></div>'+
      '<div class="chk" id="pChk"></div></div>'+
    '<div class="card">'+
      '<div class="field"><div class="fl">השם שלי</div><input type="text" id="pn" placeholder="למשל: נועה" oninput="plan()" maxlength="16"></div>'+
      '<div class="field"><div class="fl">לאן הלוק?</div><div class="uses">'+occ+'</div></div>'+
      '<div class="field"><div class="fl">פלטה</div><div class="palpick">'+pals+'</div></div>'+
      '<div class="field"><div class="fl">מדגישים דבר אחד</div><div class="uses">'+foc+'</div></div>'+
    '</div>';
}
function togO(i){ window._occ=(window._occ===i?-1:i); OCC.forEach(function(_,j){document.getElementById('o'+j).className='use'+(window._occ===j?' on':'');}); plan(); }
function togPl(i){ window._pal=(window._pal===i?-1:i); PALS.forEach(function(_,j){document.getElementById('p'+j).className='pp'+(window._pal===j?' on':'');}); plan(); }
function togF(i){ window._foc=(window._foc===i?-1:i); FOCUS.forEach(function(_,j){document.getElementById('f'+j).className='use'+(window._foc===j?' on':'');}); plan(); }
function plan(){
  var n=(document.getElementById('pn').value||'').trim();
  document.getElementById('pName').textContent=n||'— השם שלי —';
  document.getElementById('pOcc').textContent=window._occ>-1?OCC[window._occ]:'—';
  document.getElementById('pFoc').textContent=window._foc>-1?FOCUS[window._foc]:'—';
  var pw=document.getElementById('pPal');
  pw.innerHTML=(window._pal>-1?PALS[window._pal].c:['rgba(255,255,255,.25)','rgba(255,255,255,.25)','rgba(255,255,255,.25)'])
    .map(function(c){return '<i style="background:'+c+'"></i>';}).join('');
  var ok=n&&window._occ>-1&&window._pal>-1&&window._foc>-1;
  document.getElementById('pChk').innerHTML=ok
    ? '<svg viewBox="0 0 24 24" style="stroke:#F3C8DC"><path d="M20 6L9 17l-5-5"/></svg><span style="color:#FDE7F1">התוכנית מוכנה. עכשיו למראה!</span>'
    : '<svg viewBox="0 0 24 24" style="stroke:#FFD3A8"><circle cx="12" cy="12" r="10"/><path d="M12 8v5"/></svg><span style="color:#FFE7CC">מלאו את כל השדות כדי לסיים.</span>';
}
function renderMission(s){
  return '<div class="mission"><h3><svg viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg>'+s.title+'</h3><ol>'+s.steps.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol>'+
    '<div class="when"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'+s.when+'</div></div>'+
    '<div class="remember"><div class="rl"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12c1 1 1 2 1 3h6c0-1 0-2 1-3a7 7 0 0 0-4-12z"/></svg>מה לזכור</div><p>'+s.remember+'</p></div>';
}
function renderDone(){
  stage().innerHTML='<div class="screen"><div class="done-wrap"><div class="done-ring"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>'+
    '<h2>סיימתם את הקורס</h2><p>5 שיעורים, ולוק אמיתי שעשיתם.</p></div>'+
    '<div class="done-list"><b>מה יש לכם עכשיו</b><ul>'+
      ['גישה: איפור זה עיצוב, לא הסתרה','ערכה בסיסית + כללי היגיינה','לזהות את הגוון שלכם','פלטה וכלל "מדגישים דבר אחד"','תוכנית לוק משלכם','לפני-אחרי שצילמתם'].map(function(x){return '<li><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>'+x+'</li>';}).join('')+
    '</ul></div><button class="btn btn-ghost" onclick="restart()">להתחיל מחדש</button>'+
    '<div class="proto-note"><b>סוף הקורס.</b> הראשון בסבב ב\'. אותו מנוע · DATA אחר · 2 רכיבים חדשים למלאכה (סימולטור גוון, תוכנית לוק).</div></div>';
}
render();
</script>
