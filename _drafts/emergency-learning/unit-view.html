<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תצוגת יחידה — רֶצֶף (בדיקה)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css?v=2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23fff' stroke='%230B8F98' stroke-width='4'/%3E%3Cpath d='M7.5 16H2' stroke='%230B8F98' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font-body,'Assistant',sans-serif);background:var(--bg,#F6F8F9);color:var(--ink,#22333B);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:20px 20px 90px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .back{font-size:13px;font-weight:700;color:var(--brand,#0B8F98);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .back svg{width:15px;height:15px}
  .note{background:#FBF3DE;border:1px solid #EBD59A;color:#7a5a12;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:16px}
  .hero{background:var(--card,#fff);border:1px solid var(--line,#E1E8EA);border-radius:16px;padding:20px;border-top:5px solid var(--_p,#A61E64)}
  .crumbs{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}
  .chip.subj{color:#fff;background:var(--_p,#A61E64)}
  .chip.mod{color:var(--ink-soft,#5A6B72);background:var(--surface-muted,#EDF1F2)}
  h1{font-family:var(--font-head,'Heebo',sans-serif);font-size:24px;font-weight:800;color:var(--ink-strong,#12252E);line-height:1.25;letter-spacing:-.01em}
  .idea{margin-top:12px;background:var(--_ps,#FBF3DE);border-radius:10px;padding:12px 15px;font-size:14px;font-weight:600;color:var(--ink-strong,#12252E)}
  .idea b{color:var(--_p,#A61E64)}
  .seg{display:flex;gap:6px;margin:20px 0 6px;background:var(--surface-muted,#EDF1F2);padding:5px;border-radius:12px}
  .seg button{flex:1;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink-soft,#5A6B72);background:none;border:none;border-radius:9px;padding:9px;cursor:pointer;transition:.14s;display:flex;align-items:center;justify-content:center;gap:6px}
  .seg button i{width:9px;height:9px;border-radius:50%}
  .seg button[aria-pressed="true"]{background:var(--card,#fff);color:var(--ink-strong,#12252E);box-shadow:0 2px 8px -3px rgba(0,0,0,.18)}
  .sec{background:var(--card,#fff);border:1px solid var(--line,#E1E8EA);border-radius:14px;padding:17px 19px;margin-top:12px}
  .sec h3{font-family:var(--font-head,'Heebo',sans-serif);font-size:14px;font-weight:800;color:var(--_p,#A61E64);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .sec p{margin:6px 0;font-size:15px}
  .sec blockquote{border-inline-start:3px solid var(--_p,#A61E64);background:var(--bg,#F6F8F9);border-radius:0 8px 8px 0;padding:10px 14px;margin:9px 0;font-size:14.5px;color:var(--ink-strong,#12252E)}
  .sec ul,.sec ol{margin:8px 0;padding-inline-start:20px}
  .sec li{font-size:14.5px;margin:5px 0;line-height:1.5}
  .sec ul.checklist{list-style:none;padding-inline-start:0}
  .sec ul.checklist li{position:relative;padding-inline-start:26px}
  .sec ul.checklist li:before{content:'';position:absolute;inset-inline-start:0;top:3px;width:15px;height:15px;border:2px solid var(--_p,#A61E64);border-radius:5px;opacity:.65}
  .q{margin:13px 0;padding:15px;background:var(--card,#fff);border:1px solid var(--line,#E1E8EA);border-radius:13px}
  .q .num{font-size:11.5px;font-weight:700;color:var(--ink-faint,#8A9AA0);margin-bottom:4px}
  .q .qh{font-weight:700;font-size:15.5px;color:var(--ink-strong,#12252E);margin-bottom:12px;line-height:1.35}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{width:100%;text-align:start;border:1.5px solid var(--line,#E1E8EA);background:var(--card,#fff);color:var(--ink,#22333B);border-radius:11px;padding:11px 13px;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:11px;transition:border-color .15s,background .15s}
  .opt .mark{width:21px;height:21px;border-radius:50%;border:2px solid var(--line-strong,#C4CFD3);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
  .opt .mark svg{width:13px;height:13px;opacity:0;transition:opacity .15s}
  .opt:hover{border-color:var(--action-line,#9FD9DD);background:var(--action-soft,#E8F8F9)}
  .opt.correct{border-color:var(--status-good,#2E7D46);background:var(--status-good-soft,#E8F6EC)}
  .opt.correct .mark{background:var(--status-good,#2E7D46);border-color:var(--status-good,#2E7D46)}
  .opt.correct .mark svg{opacity:1}
  .opt.tryagain{border-color:#EBD59A;background:#FBF3DE}
  .opt.point{border-color:var(--status-good,#2E7D46);box-shadow:0 0 0 3px var(--status-good-soft,#E8F6EC)}
  .opt.locked{pointer-events:none;opacity:.5}
  .opt.correct.locked,.opt.tryagain{opacity:1}
  .fb{margin-top:11px;border-radius:10px;padding:10px 13px;font-size:14px;display:none;gap:9px;align-items:flex-start;line-height:1.45}
  .fb.show{display:flex}
  .fb svg{flex-shrink:0;margin-top:1px;width:17px;height:17px}
  .fb.good{background:var(--status-good-soft,#E8F6EC);border:1px solid #BCE3C6;color:var(--ink-strong,#12252E)}
  .fb.good svg{color:var(--status-good,#2E7D46)}
  .fb.hint{background:#FBF3DE;border:1px solid #EBD59A;color:#5f4507}
  .fb.hint svg{color:#B5651A}
  .fb b{font-weight:800}
  .open-q{font-size:12.5px;color:var(--ink-soft,#5A6B72);margin-top:4px}
  details.reveal{margin-top:9px}
  details.reveal>summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--brand,#0B8F98);display:inline-flex;align-items:center;gap:5px}
  details.reveal>summary::-webkit-details-marker{display:none}
  details.reveal .fb.good{display:flex;margin-top:9px}
  details.reveal-sec{padding:14px 16px}
  details.reveal-sec>summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:800;color:var(--brand,#0B8F98);display:flex;align-items:center;gap:7px}
  details.reveal-sec>summary::-webkit-details-marker{display:none}
  details.reveal-sec>summary svg{width:15px;height:15px}
  details.reveal-sec .rs-body{margin-top:10px}
  .meta-only{background:var(--card,#fff);border:1px dashed var(--line,#E1E8EA);border-radius:14px;padding:22px;text-align:center;margin-top:16px}
  .meta-only p{font-size:14px;color:var(--ink-soft,#5A6B72);margin:6px 0}
  .meta-only a{color:var(--brand,#0B8F98);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="catalog-preview.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>חזרה לקטלוג</a>
  </div>
  <div class="note">מנוע-התצוגה מרנדר את יחידת ה-<code>.md</code> האמיתית לתצוגת-תלמיד — כל 444 היחידות.</div>
  <div id="app"></div>
</div>

<script src="units-data.js"></script>
<script src="units-content.js"></script>
<script>
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function qs(k){return new URLSearchParams(location.search).get(k);}
  var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var BULB='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>';
  var U = (window.RETZEF_UNITS||[]);
  var SAMPLES = window.RETZEF_SAMPLES||{};
  var CONTENT = window.RETZEF_CONTENT||{};
  var id = qs('u');
  var meta = U.find(function(u){return u.id===id;});
  var sample = null;
  Object.keys(SAMPLES).forEach(function(k){ if(SAMPLES[k].id===id) sample=SAMPLES[k]; });
  var raw = CONTENT[id] || (sample && sample.raw);

  var app = document.getElementById('app');
  if(!meta){ app.innerHTML='<div class="meta-only"><p>יחידה לא נמצאה.</p></div>'; }
  else if(!raw){
    // מטא בלבד — אין raw מוטמע לבדיקה
    app.innerHTML =
      '<div class="hero" style="--_p:'+esc(meta.palette)+'">'+
        '<div class="crumbs"><span class="chip subj">'+esc(meta.subjectHe)+'</span><span class="chip mod">'+esc(meta.moduleHe)+'</span></div>'+
        '<h1>'+esc(meta.title)+'</h1>'+
        (meta.idea?'<div class="idea"><b>רעיון מרכזי:</b> '+esc(meta.idea)+'</div>':'')+
      '</div>'+
      '<div class="meta-only"><p><b>תצוגת-תלמיד מלאה תיפתח כשמנוע-הרינדור ייבנה (שלב ב\').</b></p>'+
        '<p>בבדיקה הזו רק 3 יחידות-דוגמה מרונדרות חיות. היחידה הזו קיימת כ-Markdown אמיתי:</p>'+
        '<p><a href="'+esc(meta.file)+'" target="_blank">'+esc(meta.file)+'</a></p></div>';
  } else {
    renderUnit(raw, meta);
  }

  /* --- פרסר-בדיקה: md-יחידה → מבנה רמות/מקטעים --- */
  function renderUnit(raw, meta){
    var body = raw.replace(/^---[\s\S]*?---\s*/,'');
    var h1 = (body.match(/^#\s+(.+)$/m)||[])[1]||meta.title;
    h1 = h1.replace(/^יחידה\s+[\d.]+\s*[—-]\s*/,'');
    var ideaM = body.match(/^>\s*רעיון מרכזי[^:]*:\s*(.+)$/m);
    var idea = stripMeta(ideaM?ideaM[1]:(meta.idea||''));

    // פיצול לפי כותרות רמה  ## ...
    var LV=[{k:'basic',he:'לאט ובטוח',c:'#2E7D46'},{k:'standard',he:'כרגיל',c:'#2F6FED'},{k:'advanced',he:'אתגר',c:'#A61E64'}];
    var parts = body.split(/\n##\s+/).slice(1); // כל חלק = רמה
    var levels={};
    parts.forEach(function(p){
      var head=p.split('\n')[0];
      var key = /basic/i.test(head)?'basic':/standard/i.test(head)?'standard':/advanced/i.test(head)?'advanced':null;
      if(key) levels[key]=p.slice(head.length);
    });

    var hero =
      '<div class="hero" style="--_p:'+esc(meta.palette)+';--_ps:'+esc(meta.palette)+'18">'+
        '<div class="crumbs"><span class="chip subj">'+esc(meta.subjectHe)+'</span><span class="chip mod">'+esc(meta.moduleHe)+'</span></div>'+
        '<h1>'+esc(h1)+'</h1>'+
        (idea?'<div class="idea"><b>רעיון מרכזי:</b> '+esc(idea)+'</div>':'')+
      '</div>';

    // אין 3 רמות (יחידת-הערכה/מבנה שטוח) → רנדר את מקטעי ה-## ישירות
    if(!Object.keys(levels).length){
      var flat = parts.map(function(p){
        var t=p.split('\n')[0].replace(/`[^`]*`/g,'').trim();
        var b=p.slice(p.indexOf('\n')+1);
        var isQ=/שאל/.test(t);
        return '<div class="sec"><h3>'+iconFor(t)+esc(t)+'</h3>'+(isQ?renderQuestions(b):renderProse(b))+'</div>';
      }).join('');
      app.innerHTML = hero + flat;
      document.querySelector('.hero').style.setProperty('--_ps', hexSoft(meta.palette));
      return;
    }

    var seg = LV.filter(function(l){return levels[l.k];}).map(function(l,i){
      return '<button data-lv="'+l.k+'" aria-pressed="'+(i===0?'true':'false')+'"><i style="background:'+l.c+'"></i>'+l.he+'</button>';
    }).join('');

    app.innerHTML = hero + '<div class="seg">'+seg+'</div><div id="lvbody"></div>';

    // רקע רך לפי פלטת-היחידה
    document.querySelector('.hero').style.setProperty('--_ps', hexSoft(meta.palette));

    function showLevel(k){
      document.getElementById('lvbody').innerHTML = renderSections(levels[k]||'', meta.palette);
    }
    var segEl=document.querySelector('.seg');
    segEl.addEventListener('click',function(e){
      var b=e.target.closest('button'); if(!b) return;
      segEl.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b);});
      showLevel(b.dataset.lv);
    });
    var first=(document.querySelector('.seg button')||{}).dataset; showLevel(first?first.lv:'basic');
  }

  function hexSoft(hex){ // פלטה רכה מאוד לרקע הרעיון
    var m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return '#FBF3DE';
    var n=parseInt(m[1],16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    return 'rgba('+r+','+g+','+b+',.10)';
  }

  function stripMeta(s){
    // מסיר תגי-מקור/מטא-מחבר שאסור שיגיעו לתלמיד
    return String(s)
      .replace(/`\[[^\]]*\]`/g,'')
      .replace(/\[(מקור|לאימות|source)[^\]]*\]/g,'')
      .replace(/\{error_type[^}]*\}/g,'')
      .replace(/`[^`]*`/g,'')
      .replace(/[ \t]{2,}/g,' ');
  }
  function inline(s){ // **מודגש** ו-*נטוי* → HTML
    return esc(stripMeta(s)).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>');
  }
  function renderSections(chunk){
    // אוסף סמני-מקטע משני הפורמטים בו-זמנית: ### כותרת  וגם  **תווית:**
    var marks=[], m;
    var re1=/(?:^|\n)###\s+([^\n]+)/g;
    while((m=re1.exec(chunk))) marks.push({title:m[1].trim(), start:m.index+m[0].indexOf('###'), cs:re1.lastIndex});
    var re2=/\*\*([^*\n]+?):\*\*/g;
    while((m=re2.exec(chunk))) marks.push({title:m[1].trim().replace(/\s*\(\d+\)\s*[—-]?.*$/,''), start:m.index, cs:re2.lastIndex});
    if(!marks.length) return renderProse(chunk);
    marks.sort(function(a,b){return a.start-b.start;});
    return marks.filter(function(x){
      // מוסתר לגמרי — מטא-מחבר (מסיחים=תשובות שגויות, צ'ק-DNA, הערת אימות)
      return !/צ'?ק.?DNA|הערת אימות|מסיחים/i.test(x.title);
    }).map(function(mk,i){
      var end = i+1<marks.length ? marks[i+1].start : chunk.length;
      var body = chunk.slice(mk.cs, end).trim();
      var t = mk.title;
      var isQ=/שאל/.test(t);
      var content = isQ?renderQuestions(body):renderProse(body);
      // מפתח-תשובה / מחוון → מאחורי גילוי, לא חשוף מראש
      if(/תשוב|^משוב|מחוון/.test(t)){
        return '<details class="sec reveal-sec"><summary>'+BULB+'הצג '+esc(t)+'</summary><div class="rs-body">'+content+'</div></details>';
      }
      return '<div class="sec"><h3>'+iconFor(t)+esc(t)+'</h3>'+content+'</div>';
    }).join('');
  }
  function iconFor(t){
    var svg='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.85">';
    if(/פתיח/.test(t)) return svg+'<path d="M12 3v18M3 12h18"/></svg>';
    if(/הסבר/.test(t)) return svg+'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4"/></svg>';
    if(/דוגמה/.test(t)) return svg+'<path d="M4 6h16M4 12h16M4 18h10"/></svg>';
    if(/שאלות/.test(t)) return svg+'<path d="M9 9a3 3 0 1 1 4 2.8c-.9.4-1 .9-1 1.7M12 17h.01"/></svg>';
    if(/סיכום/.test(t)) return svg+'<path d="m5 12 5 5L20 6"/></svg>';
    if(/אימות/.test(t)) return svg+'<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>';
    return svg+'</svg>';
  }
  function renderProse(txt){
    var out=[],lines=stripMeta(txt).split('\n'),buf=[],quote=[],list=null;
    function flush(){ if(buf.length){out.push('<p>'+buf.map(inline).join(' ')+'</p>');buf=[];} }
    function flushQ(){ if(quote.length){out.push('<blockquote>'+quote.map(inline).join('<br>')+'</blockquote>');quote=[];} }
    function flushL(){ if(list){out.push('<'+list.tag+(list.check?' class="checklist"':'')+'>'+list.items.map(function(it){return '<li>'+inline(it)+'</li>';}).join('')+'</'+list.tag+'>');list=null;} }
    function flushAll(){flush();flushQ();flushL();}
    lines.forEach(function(l){
      l=l.trim(); if(!l){flushAll();return;}
      if(/^(-{3,}|\*{3,}|_{3,})$/.test(l)){flushAll();return;}
      var bullet=l.match(/^[-*]\s+(.*)/), num=l.match(/^\d+[.)]\s+(.*)/);
      if(bullet){ flush();flushQ();
        var check=/^\[[ xX]?\]/.test(bullet[1]); var it=bullet[1].replace(/^\[[ xX]?\]\s*/,'');
        if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[],check:check};} list.items.push(it);
      } else if(num){ flush();flushQ();
        if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]};} list.items.push(num[1]);
      } else if(l[0]==='>'){flush();flushL();quote.push(l.replace(/^>\s?/,''));}
      else{flushQ();flushL();buf.push(l);}
    });
    flushAll();
    return out.join('');
  }
  function renderQuestions(txt){
    var blocks=txt.split(/\n(?=\d+\.\s)/).filter(function(b){return /\d+\.\s/.test(b);});
    return blocks.map(function(b,qi){
      var lines=b.split('\n');
      var head=inline(lines[0].replace(/^\d+\.\s*/,'').replace(/\*/g,'').trim());
      var opts=[],fb='',hint='',fbLetter=null;
      lines.slice(1).forEach(function(l){
        var raw=l.trim(); if(!raw) return;
        var lm=stripMeta(raw).trim();
        if(/[✅✓]/.test(raw)){
          fb=lm.replace(/^[-*]\s*/,'').replace(/^משוב:\s*/,'').replace(/[✅✓]\s*/,'').trim();
          var mm=fb.match(/^([א-ת])[\s.]*נכון/)||fb.match(/^([א-ת])\b/);
          if(mm){ fbLetter=mm[1]; fb=fb.replace(/^[א-ת][\s.]*נכון[.:]?\s*/,'').trim(); }
        } else if(/💡/.test(raw)){ if(!/error_type/.test(raw)) hint=lm.replace(/^[-*]\s*/,'').replace(/💡\s*/,'').trim(); }
        else if(/^[-*]?\s*[א-ת]\.\s/.test(lm)){
          var letter=(lm.match(/^[-*]?\s*([א-ת])\.\s/)||[])[1];
          var ok=/\*\*נכון\*\*|—\s*\*\*נכון|נכון\s*$/.test(raw);
          var clean=lm.replace(/^[-*]\s*/,'').replace(/\s*[—-]?\s*\*\*נכון\*\*/,'').replace(/\s*[—-]?\s*נכון\s*$/,'');
          opts.push({t:clean,letter:letter,ok:ok});
        }
      });
      var ci=opts.map(function(o){return o.ok;}).indexOf(true);
      if(ci<0 && fbLetter){ ci=opts.map(function(o){return o.letter;}).indexOf(fbLetter); }
      var num='<div class="num">שאלה '+(qi+1)+'</div>';
      // שאלה פתוחה — אין ברירות
      if(!opts.length){
        return '<div class="q">'+num+'<div class="qh">'+head+'</div><div class="open-q">שאלה פתוחה — כתבו תשובה.</div>'+
          (fb?'<details class="reveal"><summary>'+BULB+'הצג כיוון לתשובה</summary><div class="fb good">'+CHECK+'<span>'+inline(fb)+'</span></div></details>':'')+'</div>';
      }
      var optHtml=opts.map(function(o,i){
        return '<button class="opt" data-i="'+i+'"><span class="mark">'+CHECK+'</span><span>'+inline(o.t)+'</span></button>';
      }).join('');
      return '<div class="q" data-correct="'+ci+'">'+num+'<div class="qh">'+head+'</div>'+
        '<div class="opts">'+optHtml+'</div>'+
        '<div class="fb good">'+CHECK+'<span><b>נכון!</b> '+inline(fb||'')+'</span></div>'+
        (hint?'<div class="fb hint">'+BULB+'<span><b>רמז:</b> '+inline(hint)+'</span></div>':'')+
        '</div>';
    }).join('');
  }
  /* מאזין-לחיצה יחיד לשאלות — התשובה הנכונה מתגלה רק אחרי בחירה */
  document.getElementById('app').addEventListener('click',function(e){
    var opt=e.target.closest('.opt'); if(!opt) return;
    var q=opt.closest('.q'); if(!q||q.classList.contains('answered')) return;
    var ci=parseInt(q.getAttribute('data-correct'),10);
    var good=q.querySelector('.fb.good'), hint=q.querySelector('.fb.hint');
    if(isNaN(ci)||ci<0){ // לא זוהתה תשובה נכונה → מצב-חשיפה: כל בחירה מגלה משוב
      q.querySelectorAll('.opt').forEach(function(o){o.classList.add('locked');});
      opt.classList.remove('locked'); if(good)good.classList.add('show'); q.classList.add('answered'); return;
    }
    if(parseInt(opt.getAttribute('data-i'),10)===ci){
      q.querySelectorAll('.opt').forEach(function(o){o.classList.add('locked');});
      opt.classList.remove('locked'); opt.classList.add('correct');
      if(good)good.classList.add('show'); if(hint)hint.classList.remove('show');
      q.classList.add('answered');
    } else {
      opt.classList.add('tryagain','locked');
      var t=(parseInt(q.dataset.tries||'0',10))+1; q.dataset.tries=String(t);
      if(hint)hint.classList.add('show');
      if(t>=2){ var c=q.querySelector('.opt[data-i="'+ci+'"]'); if(c)c.classList.add('point'); }
    }
  });
</script>
</body>
</html>
