<!DOCTYPE html>

<head>

<title>תצוגת יחידה — רֶצֶף (בדיקה)</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23fff' stroke='%230B8F98' stroke-width='4'/%3E%3Cpath d='M7.5 16H2' stroke='%230B8F98' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font-body,'Assistant',sans-serif);background:var(--bg,#F6F8F9);color:var(--ink,#22333B);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:20px 20px 90px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .back{font-size:13px;font-weight:700;color:var(--brand,#0B8F98);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .back svg{width:15px;height:15px}
  .note{background:#FBF3DE;border:1px solid #EBD59A;color:#7a5a12;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:16px}
  .hero{background:var(--card,#fff);border:1px solid var(--line,#E1E8EA);border-radius:16px;padding:20px;border-top:5px solid var(--_p,#A61E64)}
  .crumbs{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}
  .chip.subj{color:#fff;background:var(--_p,#A61E64)}
  .chip.mod{color:var(--ink-soft,#5A6B72);background:var(--surface-muted,#EDF1F2)}
  h1{font-family:var(--font-head,'Heebo',sans-serif);font-size:24px;font-weight:800;color:var(--ink-strong,#12252E);line-height:1.25;letter-spacing:-.01em}
  .idea{margin-top:12px;background:var(--_ps,#FBF3DE);border-radius:10px;padding:12px 15px;font-size:14px;font-weight:600;color:var(--ink-strong,#12252E)}
  .idea b{color:var(--_p,#A61E64)}
  .seg{display:flex;gap:6px;margin:20px 0 6px;background:var(--surface-muted,#EDF1F2);padding:5px;border-radius:12px}
  .seg button{flex:1;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink-soft,#5A6B72);background:none;border:none;border-radius:9px;padding:9px;cursor:pointer;transition:.14s;display:flex;align-items:center;justify-content:center;gap:6px}
  .seg button i{width:9px;height:9px;border-radius:50%}
  .seg button[aria-pressed="true"]{background:var(--card,#fff);color:var(--ink-strong,#12252E);box-shadow:0 2px 8px -3px rgba(0,0,0,.18)}
  .sec{background:var(--card,#fff);border:1px solid var(--line,#E1E8EA);border-radius:14px;padding:17px 19px;margin-top:12px}
  .sec h3{font-family:var(--font-head,'Heebo',sans-serif);font-size:14px;font-weight:800;color:var(--_p,#A61E64);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .sec p{margin:6px 0;font-size:15px}
  .sec blockquote{border-inline-start:3px solid var(--_p,#A61E64);background:var(--bg,#F6F8F9);border-radius:0 8px 8px 0;padding:10px 14px;margin:9px 0;font-size:14.5px;color:var(--ink-strong,#12252E)}
  .sec ul,.sec ol{margin:8px 0;padding-inline-start:20px}
  .sec li{font-size:14.5px;margin:5px 0;line-height:1.5}
  .sec ul.checklist{list-style:none;padding-inline-start:0}
  .sec ul.checklist li{position:relative;padding-inline-start:26px}
  .sec ul.checklist li:before{content:'';position:absolute;inset-inline-start:0;top:3px;width:15px;height:15px;border:2px solid var(--_p,#A61E64);border-radius:5px;opacity:.65}
  .q{margin:13px 0;padding:15px;background:var(--card,#fff);border:1px solid var(--line,#E1E8EA);border-radius:13px}
  .q .num{font-size:11.5px;font-weight:700;color:var(--ink-faint,#8A9AA0);margin-bottom:4px}
  .q .qh{font-weight:700;font-size:15.5px;color:var(--ink-strong,#12252E);margin-bottom:12px;line-height:1.35}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opts-tf{flex-direction:row;gap:10px}
  .opts-tf .opt{justify-content:center;text-align:center;font-size:15.5px;font-weight:800;padding:14px 10px}
  .opts-tf .opt .mark{display:none}
  .opt{width:100%;text-align:start;border:1.5px solid var(--line,#E1E8EA);background:var(--card,#fff);color:var(--ink,#22333B);border-radius:11px;padding:11px 13px;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:11px;transition:border-color .15s,background .15s}
  .opt .mark{width:21px;height:21px;border-radius:50%;border:2px solid var(--line-strong,#C4CFD3);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
  .opt .mark svg{width:13px;height:13px;opacity:0;transition:opacity .15s}
  .opt:hover{border-color:var(--action-line,#9FD9DD);background:var(--action-soft,#E8F8F9)}
  .opt.correct{border-color:var(--status-good,#2E7D46);background:var(--status-good-soft,#E8F6EC)}
  .opt.correct .mark{background:var(--status-good,#2E7D46);border-color:var(--status-good,#2E7D46)}
  .opt.correct .mark svg{opacity:1}
  .opt.tryagain{border-color:#D98A94;background:#FBEBED;color:#8E2434}
  .opt.tryagain .mark{border-color:#C2374B}
  .opt.point{border-color:var(--status-good,#2E7D46);box-shadow:0 0 0 3px var(--status-good-soft,#E8F6EC)}
  .opt.locked{pointer-events:none;opacity:.5}
  .opt.correct.locked,.opt.tryagain{opacity:1}
  .fb{margin-top:11px;border-radius:10px;padding:10px 13px;font-size:14px;display:none;gap:9px;align-items:flex-start;line-height:1.45}
  .fb.show{display:flex}
  .fb svg{flex-shrink:0;margin-top:1px;width:17px;height:17px}
  .fb.good{background:var(--status-good-soft,#E8F6EC);border:1px solid #BCE3C6;color:var(--ink-strong,#12252E)}
  .fb.good svg{color:var(--status-good,#2E7D46)}
  .fb.hint{background:#FBF3DE;border:1px solid #EBD59A;color:#5f4507}
  .fb.hint svg{color:#B5651A}
  .fb b{font-weight:800}
  .open-q{font-size:12.5px;color:var(--ink-soft,#5A6B72);margin-top:4px}
  /* ---- רכיבים אינטראקטיביים ---- */
  .iact{margin-top:4px}
  .iact-hint-line{font-size:12.5px;color:var(--ink-soft,#5A6B72);margin-bottom:10px}
  .chip-bank{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line,#E1E8EA);background:var(--card,#fff);color:var(--ink,#22333B);border-radius:10px;padding:9px 13px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:.14s}
  .chip:hover{border-color:var(--action-line,#9FD9DD);background:var(--action-soft,#E8F8F9)}
  .chip.sel{border-color:var(--brand,#0B8F98);background:var(--action-soft,#E8F8F9);box-shadow:0 0 0 3px var(--action-soft,#E8F8F9)}
  .chip.used{opacity:.35;pointer-events:none}
  .chip.correct,.ord-pill.correct,.mtch-l.correct,.mtch-r.correct{border-color:var(--status-good,#2E7D46)!important;background:var(--status-good-soft,#E8F6EC)!important;opacity:1}
  .chip.wrong,.ord-pill.wrong,.mtch-l.wrong,.mtch-r.wrong{border-color:#D98A94!important;background:#FBEBED!important;opacity:1}
  .ord-ans{list-style:none;display:flex;flex-direction:column;gap:7px;margin:0 0 12px;padding:0;min-height:6px}
  .ord-pill{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line-strong,#C4CFD3);background:#fff;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;counter-increment:ord}
  .ord-pill::before{content:counter(ord);width:22px;height:22px;flex-shrink:0;background:var(--brand,#0B8F98);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .ord-ans{counter-reset:ord}
  .mtch-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mtch-col{display:flex;flex-direction:column;gap:8px}
  .mtch-l,.mtch-r{position:relative;border:1.5px solid var(--line,#E1E8EA);background:#fff;color:var(--ink,#22333B);border-radius:10px;padding:11px 13px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;text-align:start;transition:.14s}
  .mtch-l.sel{border-color:var(--brand,#0B8F98);background:var(--action-soft,#E8F8F9)}
  .mtch-l.paired,.mtch-r.paired{border-color:var(--brand,#0B8F98);background:var(--action-soft,#E8F8F9)}
  .mtch-l[data-badge]::after,.mtch-r[data-badge]::after{content:attr(data-badge);position:absolute;top:-7px;inset-inline-end:-7px;width:20px;height:20px;background:var(--brand,#0B8F98);color:#fff;border-radius:50%;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .srt-buckets{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .srt-bucket{flex:1 1 140px;min-height:70px;border:1.5px dashed var(--line-strong,#C4CFD3);border-radius:12px;padding:8px;cursor:pointer;transition:.14s}
  .srt-bucket:hover{border-color:var(--brand,#0B8F98);background:var(--action-soft,#E8F8F9)}
  .srt-cat{font-size:12.5px;font-weight:800;color:var(--brand,#0B8F98);margin-bottom:7px;text-align:center}
  .srt-items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .iact-actions{display:flex;gap:9px;margin-top:14px}
  .iact-check{background:var(--brand,#0B8F98);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer}
  .iact-check:disabled{opacity:.4;cursor:default}
  .iact-reset{background:none;border:none;color:var(--ink-soft,#5A6B72);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:underline}
  .iact-fb .fb{display:flex;margin-top:14px}
  .iact.done .iact-reset{display:none}
  details.reveal{margin-top:9px}
  details.reveal>summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--brand,#0B8F98);display:inline-flex;align-items:center;gap:5px}
  details.reveal>summary::-webkit-details-marker{display:none}
  details.reveal .fb.good{display:flex;margin-top:9px}
  details.reveal-sec{padding:14px 16px}
  details.reveal-sec>summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:800;color:var(--brand,#0B8F98);display:flex;align-items:center;gap:7px}
  details.reveal-sec>summary::-webkit-details-marker{display:none}
  details.reveal-sec>summary svg{width:15px;height:15px}
  details.reveal-sec .rs-body{margin-top:10px}
  .meta-only{background:var(--card,#fff);border:1px dashed var(--line,#E1E8EA);border-radius:14px;padding:22px;text-align:center;margin-top:16px}
  .meta-only p{font-size:14px;color:var(--ink-soft,#5A6B72);margin:6px 0}
  .meta-only a{color:var(--brand,#0B8F98);font-weight:700}
  /* ---- אשף מודרך (סרגל-שלבים + מסך-אחר-מסך) ---- */
  .uhead{margin-bottom:12px}
  .uhead .crumbs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
  .uhead h1{font-family:var(--font-head,'Heebo',sans-serif);font-size:22px;font-weight:800;color:var(--ink-strong,#12252E);line-height:1.25;letter-spacing:-.01em}
  .seq{list-style:none;display:flex;margin:4px 0 20px;padding:0}
  .seq li{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-faint,#8A9AA0)}
  .seq li .node{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong,#C4CFD3);background:var(--card,#fff);position:relative;z-index:1;display:grid;place-items:center}
  .seq li .node svg{width:12px;height:12px;color:#fff;opacity:0}
  .seq li::before{content:'';position:absolute;top:10px;right:50%;left:-50%;height:2px;background:var(--line,#E1E8EA)}
  .seq li:first-child::before{display:none}
  .seq li.done::before,.seq li.active::before{background:var(--_p,#0B8F98)}
  .seq li.done .node,.seq li.active .node{border-color:var(--_p,#0B8F98)}
  .seq li.done .node{background:var(--_p,#0B8F98)}
  .seq li.done .node svg{opacity:1}
  .seq li.active .node::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--_p,#0B8F98)}
  .seq li.active{color:var(--ink-strong,#12252E);font-weight:800}
  .screen{display:none;animation:fade .26s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .op-idea{background:var(--_ps,#EEF7F8);border-radius:13px;padding:15px 17px;margin-bottom:14px}
  .op-idea .lbl{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--_p,#0B8F98);margin-bottom:5px}
  .op-idea .lbl svg{width:14px;height:14px}
  .op-idea p{font-size:16px;font-weight:600;color:var(--ink-strong,#12252E);line-height:1.5}
  .levelpick{margin-top:18px}
  .lp-q{font-size:14px;font-weight:600;color:var(--ink-soft,#5A6B72);margin-bottom:10px}
  .lp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .lp-grid button{font-family:inherit;background:var(--card,#fff);border:1.5px solid var(--line,#E1E8EA);border-radius:13px;padding:13px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.14s}
  .lp-grid button:hover{border-color:var(--_p,#0B8F98)}
  .lp-grid button b{font-size:14.5px;font-weight:800;color:var(--ink-strong,#12252E)}
  .lp-grid button small{font-size:11px;color:var(--ink-faint,#8A9AA0)}
  .lp-grid button[aria-pressed="true"]{border-color:var(--_p,#0B8F98);background:var(--_ps,#EEF7F8);box-shadow:0 0 0 2px var(--_ps,#EEF7F8)}
  .lp-grid button[aria-pressed="true"] small{color:var(--_p,#0B8F98)}
  .done-note{text-align:center;padding:22px 16px}
  .done-note .big{width:54px;height:54px;border-radius:50%;background:var(--_ps,#EEF7F8);display:grid;place-items:center;margin:0 auto 12px}
  .done-note .big svg{width:28px;height:28px;color:var(--_p,#0B8F98)}
  .done-note h3{font-family:var(--font-head,'Heebo',sans-serif);font-size:19px;font-weight:800;color:var(--ink-strong,#12252E);margin-bottom:4px}
  .done-note p{font-size:14px;color:var(--ink-soft,#5A6B72)}
  .nav{position:sticky;bottom:0;display:flex;gap:10px;padding:16px 0 8px;margin-top:10px;background:linear-gradient(transparent,var(--bg,#F6F8F9) 34%)}
  .nav button{font-family:inherit;font-size:15px;font-weight:800;border-radius:13px;padding:14px 20px;cursor:pointer;border:none;transition:.14s}
  .nav .primary{flex:1;background:var(--_p,#0B8F98);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
  .nav .primary:hover{filter:brightness(.94)}
  .nav .ghost{background:var(--card,#fff);border:1.5px solid var(--line,#E1E8EA);color:var(--ink-soft,#5A6B72)}
  .nav .ghost[hidden]{display:none}
</style>
</head>

<script>

  var BULB='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>';
  var LVMETA={advanced:{b:'קדימה',s:'ישר לעניין'},standard:{b:'לבד',s:'בקצב רגיל'},basic:{b:'איתי',s:'צעד-צעד'}};
  var U = (window.RETZEF_UNITS||[]);

  /* יחידת-הדגמה מובנית לשיטות-ההערכה — נפתחת ב-?u=demo-methods, בלי לגעת בקורפוס */
  var DEMO_METHODS_RAW = [
    '# יסודות תמחור ורווח',
    '',
    '> **רעיון מרכזי אחד:** מחיר טוב לא מנחשים — מחשבים אותו מהעלות, מהשוק ומהרווח שרוצים.',
    '',
    '## 🟢 רמה: הדגמה (`basic` · "לחוות את השיטות")',
    '',
    '### פתיח',
    'כל עסק — מספרה, סטארטאפ, דוכן בשוק או חנות אונליין — חייב לדעת לתמחר נכון. חמש השאלות למטה בודקות את אותו נושא, כל אחת בשיטת-הערכה אחרת.',
    '',
    '### שאלות',
    '1. *עסק משלם 4,000 ₪ שכירות בכל חודש — בין אם מכר הרבה ובין אם מעט. איך נסווג את ההוצאה?* (א) עלות משתנה (ב) **עלות קבועה** (ג) רווח גולמי',
    '   - ✅ נכון — עלות קבועה נשארת אותו דבר ולא תלויה בכמות שנמכרה.',
    '2. נכון או לא נכון: כשמעלים את מחיר המוצר, הרווח תמיד גדל.',
    '   - ✅ **לא נכון!** מחיר גבוה מדי מבריח קונים — הרווח תלוי גם בכמה נמכר, לא רק במחיר ליחידה.',
    '3. סדרו את השלבים לקביעת מחיר למוצר חדש: {סידור}',
    '   - מחשבים כמה עולה לייצר יחידה אחת',
    '   - בודקים כמה גובים המתחרים על מוצר דומה',
    '   - מוסיפים את אחוז הרווח שרוצים להרוויח',
    '   - קובעים את המחיר הסופי ומפרסמים אותו',
    '   ✅ קודם יודעים את העלות, אז מסתכלים על השוק, מוסיפים רווח — ורק אז נקבע המחיר.',
    '4. התאימו כל מושג עסקי להגדרה הנכונה שלו: {התאמה}',
    '   - רווח גולמי :: ההכנסה ממכירה פחות העלות הישירה של המוצר',
    '   - קהל יעד :: קבוצת האנשים שאליה המוצר מכוון',
    '   - תזרים מזומנים :: תנועת הכסף שנכנס ויוצא מהעסק לאורך זמן',
    '   ✅ שלושה מושגים שכל בעל עסק צריך להכיר לפני שהוא מתמחר.',
    '5. מיינו כל הוצאה — עלות קבועה או עלות משתנה? {מיון}',
    '   - עלות קבועה :: שכירות החנות',
    '   - עלות קבועה :: משכורת חודשית קבועה לעובד',
    '   - עלות משתנה :: חומרי הגלם לכל מוצר שמייצרים',
    '   - עלות משתנה :: עמלת משלוח על כל הזמנה',
    '   ✅ עלות קבועה לא תלויה בכמות; עלות משתנה גדלה ככל שמייצרים ומוכרים יותר.',
    '',
    '### סיכום',
    'מחיר נכון = עלות + שוק + רווח. חמש שיטות-הערכה שונות — מנוע-תצוגה אחד.'
  ].join('\n');
  var DEMO_METHODS_META = { id:'demo-methods', title:'יסודות תמחור ורווח', subjectHe:'יזמות ועסקים', moduleHe:'תמחור ורווחיות', palette:'#1F7A5A' };
  var isDemo = id==='demo-methods';
  var meta = isDemo ? DEMO_METHODS_META : U.find(function(u){return u.id===id;});
  var sample = null;
  Object.keys(SAMPLES).forEach(function(k){ if(SAMPLES[k].id===id) sample=SAMPLES[k]; });
  var raw = isDemo ? DEMO_METHODS_RAW : (CONTENT[id] || (sample && sample.raw));

  var app = document.getElementById('app');
  if(!meta){ app.innerHTML='<div class="meta-only"><p>יחידה לא נמצאה.</p></div>'; }
  else if(!raw){
    // מטא בלבד — אין raw מוטמע לבדיקה
    app.innerHTML =
      '<div class="hero" style="--_p:'+esc(meta.palette)+'">'+
        '<div class="crumbs"><span class="chip subj">'+esc(meta.subjectHe)+'</span><span class="chip mod">'+esc(meta.moduleHe)+'</span></div>'+
        '<h1>'+esc(meta.title)+'</h1>'+
        (meta.idea?'<div class="idea"><b>רעיון מרכזי:</b> '+esc(meta.idea)+'</div>':'')+
      '</div>'+
      '<div class="meta-only"><p><b>תצוגת-תלמיד מלאה תיפתח כשמנוע-הרינדור ייבנה (שלב ב\').</b></p>'+
        '<p>בבדיקה הזו רק 3 יחידות-דוגמה מרונדרות חיות. היחידה הזו קיימת כ-Markdown אמיתי:</p>'+
        '<p><a href="'+esc(meta.file)+'" target="_blank">'+esc(meta.file)+'</a></p></div>';
  } else {
    renderUnit(raw, meta);
  }

  /* --- מנוע-תצוגה: יחידת md → אשף מודרך (4 שלבים · מסך-אחר-מסך) --- */
  function renderUnit(raw, meta){
    var body = raw.replace(/^---[\s\S]*?---\s*/,'');
    var h1 = (body.match(/^#\s+(.+)$/m)||[])[1]||meta.title;
    h1 = h1.replace(/^יחידה\s+[\d.]+\s*[—-]\s*/,'');
    var ideaM = body.match(/^>\s*רעיון מרכזי[^:]*:\s*(.+)$/m);
    var idea = stripMeta(ideaM?ideaM[1]:(meta.idea||''));

    var pal=/^#?[0-9a-fA-F]{6}$/.test(meta.palette||'')?meta.palette:'#0B8F98';
    app.style.setProperty('--_p',pal);
    app.style.setProperty('--_ps',hexSoft(pal));

    var _lv = P.splitLevels(raw);
    var levels=_lv.levels, levelKeys=_lv.levelKeys, flatChunk=_lv.flatChunk;

    app.innerHTML =
      '<div class="uhead"><div class="crumbs"><span class="chip subj" style="background:'+pal+'">'+esc(meta.subjectHe)+'</span><span class="chip mod">'+esc(meta.moduleHe)+'</span></div><h1>'+esc(h1)+'</h1></div>'+
      '<ol class="seq" id="seq"></ol><div id="screens"></div>'+
      '<div class="nav"><button class="ghost" id="prev" hidden>הקודם</button><button class="primary" id="next">הבא ›</button></div>';

    var state={level: levelKeys.length?(levels.basic?'basic':levelKeys[0]):null, idx:0, phases:[]};

    function levelPicker(){
      if(!levelKeys.length) return '';
      var order=['advanced','standard','basic'].filter(function(k){return levels[k];});
      return '<div class="levelpick"><div class="lp-q">איך בא לך ללמוד היום?</div><div class="lp-grid">'+
        order.map(function(k){return '<button data-lv="'+k+'" aria-pressed="'+(state.level===k)+'"><b>'+LVMETA[k].b+'</b><small>'+LVMETA[k].s+'</small></button>';}).join('')+
        '</div></div>';
    }
    function doneNote(){ return '<div class="done-note"><div class="big">'+CHECK+'</div><h3>כל הכבוד!</h3><p>סיימת את היחידה.</p></div>'; }
    function buildPhases(){
      var secs=parseSections(state.level?levels[state.level]:(flatChunk||''));
      var byP={1:[],2:[],3:[],4:[]};
      secs.forEach(function(s){byP[s.phase].push(s.html);});
      var LB={2:'לומדים',3:'תרגול',4:'סיום'};
      var res=[{label:'פתיח', html:
        (idea?'<div class="op-idea"><span class="lbl">'+BULB+'רעיון מרכזי</span><p>'+esc(idea)+'</p></div>':'')+
        byP[1].join('')+ levelPicker() }];
      [2,3].forEach(function(p){ if(byP[p].length) res.push({label:LB[p], html:byP[p].join('')}); });
      res.push({label:'סיום', html: byP[4].join('') + doneNote()});
      return res;
    }
    function renderScreens(){
      state.phases=buildPhases();
      document.getElementById('screens').innerHTML=state.phases.map(function(ph,i){return '<section class="screen" data-i="'+i+'">'+ph.html+'</section>';}).join('');
      initInteractive(document.getElementById('screens'));
      showPhase(Math.min(state.idx,state.phases.length-1));
    }
    function showPhase(i){
      state.idx=Math.max(0,Math.min(state.phases.length-1,i));
      var sc=document.getElementById('screens');
      Array.prototype.forEach.call(sc.children,function(s,j){s.classList.toggle('on',j===state.idx);});
      document.getElementById('seq').innerHTML=state.phases.map(function(ph,j){var cls=j<state.idx?'done':j===state.idx?'active':'';return '<li class="'+cls+'"><span class="node">'+CHECK+'</span>'+esc(ph.label)+'</li>';}).join('');
      document.getElementById('prev').hidden=state.idx===0;
      document.getElementById('next').innerHTML=state.idx===state.phases.length-1?'חזרה לקטלוג':'הבא ›';
      window.scrollTo({top:0,behavior:'smooth'});
    }
    app.addEventListener('click',function(e){
      var lv=e.target.closest('[data-lv]');
      if(lv){ state.level=lv.getAttribute('data-lv'); state.idx=0; renderScreens(); }
    });
    document.getElementById('prev').addEventListener('click',function(){showPhase(state.idx-1);});
    document.getElementById('next').addEventListener('click',function(){
      if(state.idx>=state.phases.length-1){ location.href='catalog-preview.html'; return; }
      showPhase(state.idx+1);
    });
    renderScreens();
  }
  /* עזרים משותפים — מ-unit-parser.js (מקור-אמת יחיד) */
  function phaseOf(t){ return P.phaseOf(t); }
  function hexSoft(hex){ return P.hexSoft(hex); }
  function stripMeta(s){ return P.stripMeta(s); }
  function inline(s){ return P.inline(s); }
  function parseSections(chunk){
    // אוסף סמני-מקטע משני הפורמטים בו-זמנית: ### כותרת  וגם  **תווית:**
    var marks=[], m;
    var re1=/(?:^|\n)###\s+([^\n]+)/g;
    while((m=re1.exec(chunk))) marks.push({title:m[1].trim(), start:m.index+m[0].indexOf('###'), cs:re1.lastIndex});
    var re2=/\*\*([^*\n]+?):\*\*/g;
    while((m=re2.exec(chunk))) marks.push({title:m[1].trim().replace(/\s*\(\d+\)\s*[—-]?.*$/,''), start:m.index, cs:re2.lastIndex});
    if(!marks.length){ var pr=renderProse(chunk); return pr?[{title:'',phase:2,html:'<div class="sec">'+pr+'</div>'}]:[]; }
    marks.sort(function(a,b){return a.start-b.start;});
    var out=[];
    for(var i=0;i<marks.length;i++){
      var mk=marks[i];
      var end = i+1<marks.length ? marks[i+1].start : chunk.length;   // הגבול מחושב מכלל הסמנים (כולל המוסתרים)
      if(/צ'?ק.?DNA|הערת אימות|מסיחים/i.test(mk.title)) continue;      // מוסתר — מטא-מחבר
      var body = chunk.slice(mk.cs, end).trim();
      var t = mk.title;
      var isQ=/שאל/.test(t);
      var content = isQ?renderQuestions(body):renderProse(body);
      var html;
      if(/תשוב|^משוב|מחוון/.test(t)){
        html='<details class="sec reveal-sec"><summary>'+BULB+'הצג '+esc(t)+'</summary><div class="rs-body">'+content+'</div></details>';
      } else {
        html='<div class="sec"><h3>'+iconFor(t)+esc(t)+'</h3>'+content+'</div>';
      }
      out.push({title:t, phase:phaseOf(t), html:html});
    }
    return out;
  }
  function iconFor(t){
    var svg='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.85">';
    if(/פתיח/.test(t)) return svg+'<path d="M12 3v18M3 12h18"/></svg>';
    if(/הסבר/.test(t)) return svg+'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4"/></svg>';
    if(/דוגמה/.test(t)) return svg+'<path d="M4 6h16M4 12h16M4 18h10"/></svg>';
    if(/שאלות/.test(t)) return svg+'<path d="M9 9a3 3 0 1 1 4 2.8c-.9.4-1 .9-1 1.7M12 17h.01"/></svg>';
    if(/סיכום/.test(t)) return svg+'<path d="m5 12 5 5L20 6"/></svg>';
    if(/אימות/.test(t)) return svg+'<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>';
    return svg+'</svg>';
  }
  function renderProse(txt){
    var out=[],lines=stripMeta(txt).split('\n'),buf=[],quote=[],list=null;
    function flush(){ if(buf.length){out.push('<p>'+buf.map(inline).join(' ')+'</p>');buf=[];} }
    function flushQ(){ if(quote.length){out.push('<blockquote>'+quote.map(inline).join('<br>')+'</blockquote>');quote=[];} }
    function flushL(){ if(list){out.push('<'+list.tag+(list.check?' class="checklist"':'')+'>'+list.items.map(function(it){return '<li>'+inline(it)+'</li>';}).join('')+'</'+list.tag+'>');list=null;} }
    function flushAll(){flush();flushQ();flushL();}
    lines.forEach(function(l){
      l=l.trim(); if(!l){flushAll();return;}
      if(/^(-{3,}|\*{3,}|_{3,})$/.test(l)){flushAll();return;}
      var bullet=l.match(/^[-*]\s+(.*)/), num=l.match(/^\d+[.)]\s+(.*)/);
      if(bullet){ flush();flushQ();
        var check=/^\[[ xX]?\]/.test(bullet[1]); var it=bullet[1].replace(/^\[[ xX]?\]\s*/,'');
        if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[],check:check};} list.items.push(it);
      } else if(num){ flush();flushQ();
        if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]};} list.items.push(num[1]);
      } else if(l[0]==='>'){flush();flushL();quote.push(l.replace(/^>\s?/,''));}
      else{flushQ();flushL();buf.push(l);}
    });
    flushAll();
    return out.join('');
  }
  function renderQuestions(txt){
    var blocks=P.questionBlocks(txt);
    return blocks.map(function(b,qi){
      var q=P.parseQuestion(b);
      var num='<div class="num">שאלה '+(qi+1)+'</div>';
      var head='<div class="qh">'+inline(q.stem)+'</div>';
      // שיטה אינטראקטיבית (סידור/התאמה/מיון)
      if(q.type==='interactive'){
        return '<div class="q">'+num+head+renderInteractive(q,qi)+'</div>';
      }
      // שאלה פתוחה — אין ברירות
      if(!q.options.length){
        return '<div class="q">'+num+head+'<div class="open-q">שאלה פתוחה — כתבו תשובה.</div>'+
          (q.feedback?'<details class="reveal"><summary>'+BULB+'הצג כיוון לתשובה</summary><div class="fb good">'+CHECK+'<span>'+inline(q.feedback)+'</span></div></details>':'')+'</div>';
      }
      var tf=q.method==='truefalse';
      var optHtml=q.options.map(function(o,i){
        return '<button class="opt" data-i="'+i+'"><span class="mark">'+CHECK+'</span><span>'+inline(o.text)+'</span></button>';
      }).join('');
      // בנכון/לא-נכון אין לקדם ב"נכון!" — המילה מתנגשת בתוכן. מציגים את המשוב כמו-שהוא.
      var good=tf?('<div class="fb good">'+CHECK+'<span>'+inline(q.feedback||'מדויק!')+'</span></div>')
                 :('<div class="fb good">'+CHECK+'<span><b>נכון!</b> '+inline(q.feedback||'')+'</span></div>');
      return '<div class="q'+(tf?' q-tf':'')+'" data-correct="'+q.correctIndex+'">'+num+head+
        '<div class="opts'+(tf?' opts-tf':'')+'">'+optHtml+'</div>'+good+
        (q.hint?'<div class="fb hint">'+BULB+'<span><b>רמז:</b> '+inline(q.hint)+'</span></div>':'')+
        '</div>';
    }).join('');
  }

  /* ================= רכיבים אינטראקטיביים (סידור · התאמה · מיון) =================
     ה-HTML נושא את כל נתוני-הפתרון ב-data-*; הבקרים משתמשים בלוגיקה הטהורה
     מ-unit-parser (seededShuffle/checkOrder/checkAssign) — נבדקת ב-node. */
  function iactActions(){ return '<div class="iact-actions"><button class="iact-check" disabled>בדקו</button><button class="iact-reset" type="button">התחלה מחדש</button></div>'; }
  function iactFb(q){ return '<div class="iact-fb" hidden><div class="fb good">'+CHECK+'<span>'+inline(q.feedback||'כל הכבוד!')+'</span></div>'+
    (q.hint?'<div class="fb hint">'+BULB+'<span><b>רמז:</b> '+inline(q.hint)+'</span></div>':'')+'</div>'; }

  function renderInteractive(q,qi){
    var seed=(qi+1)*97;
    if(q.method==='order'){
      var shuf=P.seededShuffle(q.items.map(function(t,i){return {t:t,i:i};}), seed+q.items.length);
      var bank=shuf.map(function(o){return '<button class="chip" type="button" data-idx="'+o.i+'">'+inline(o.t)+'</button>';}).join('');
      return '<div class="iact" data-m="order" data-n="'+q.items.length+'">'+
        '<div class="iact-hint-line">הקישו על השלבים לפי הסדר הנכון:</div>'+
        '<ol class="ord-ans"></ol><div class="chip-bank">'+bank+'</div>'+iactActions()+iactFb(q)+'</div>';
    }
    if(q.method==='match'){
      var rights=P.seededShuffle(q.pairs.map(function(p,i){return {t:p.r,i:i};}), seed+q.pairs.length);
      var lefts=q.pairs.map(function(p,i){return '<button class="mtch-l" type="button" data-i="'+i+'">'+inline(p.l)+'</button>';}).join('');
      var rs=rights.map(function(o){return '<button class="mtch-r" type="button" data-r="'+o.i+'">'+inline(o.t)+'</button>';}).join('');
      return '<div class="iact" data-m="match" data-n="'+q.pairs.length+'">'+
        '<div class="iact-hint-line">הקישו פריט בצד ימין, ואז את ההתאמה שלו בצד שמאל:</div>'+
        '<div class="mtch-grid"><div class="mtch-col">'+lefts+'</div><div class="mtch-col">'+rs+'</div></div>'+iactActions()+iactFb(q)+'</div>';
    }
    if(q.method==='sort'){
      var cats=[]; q.pairs.forEach(function(p){ if(cats.indexOf(p.l)<0) cats.push(p.l); });
      var items=P.seededShuffle(q.pairs.map(function(p){return {t:p.r,c:p.l};}), seed+q.pairs.length);
      var bank=items.map(function(o){return '<button class="chip" type="button" data-cat="'+esc(o.c)+'">'+inline(o.t)+'</button>';}).join('');
      var buckets=cats.map(function(c){return '<div class="srt-bucket" data-cat="'+esc(c)+'"><div class="srt-cat">'+esc(c)+'</div><div class="srt-items"></div></div>';}).join('');
      return '<div class="iact" data-m="sort" data-n="'+q.pairs.length+'">'+
        '<div class="iact-hint-line">בחרו פריט, ואז את הקטגוריה שאליה הוא שייך:</div>'+
        '<div class="chip-bank">'+bank+'</div><div class="srt-buckets">'+buckets+'</div>'+iactActions()+iactFb(q)+'</div>';
    }
    return '';
  }

  function initInteractive(root){
    Array.prototype.forEach.call(root.querySelectorAll('.iact'),function(w){
      if(w.dataset.init) return; w.dataset.init='1';
      var m=w.dataset.m, n=+w.dataset.n;
      var check=w.querySelector('.iact-check'), reset=w.querySelector('.iact-reset'), fb=w.querySelector('.iact-fb');
      function reveal(ok){ if(ok){ fb.hidden=false; check.hidden=true; w.classList.add('done'); } }
      function resetAll(){ w.querySelectorAll('.locked,.sel,.correct,.wrong,.used,.paired').forEach(function(x){x.classList.remove('locked','sel','correct','wrong','used','paired'); x.removeAttribute('data-badge');}); }

      if(m==='order'){
        var ans=w.querySelector('.ord-ans'), bank=w.querySelector('.chip-bank'), seq=[];
        function refresh(){ check.disabled=seq.length!==n; }
        bank.addEventListener('click',function(e){ var c=e.target.closest('.chip'); if(!c||c.classList.contains('used')||w.classList.contains('done'))return;
          c.classList.add('used'); var li=document.createElement('li'); li.className='ord-pill'; li.dataset.idx=c.dataset.idx; li.innerHTML=c.innerHTML; ans.appendChild(li); seq.push({idx:+c.dataset.idx,chip:c}); refresh();
        });
        ans.addEventListener('click',function(e){ var li=e.target.closest('.ord-pill'); if(!li||w.classList.contains('done'))return;
          var k=Array.prototype.indexOf.call(ans.children,li); if(k<0)return; seq[k].chip.classList.remove('used'); seq.splice(k,1); ans.removeChild(li); refresh();
        });
        check.addEventListener('click',function(){ var r=P.checkOrder(seq.map(function(s){return s.idx;}),n);
          Array.prototype.forEach.call(ans.children,function(li,i){ li.classList.add(r.correct[i]?'correct':'wrong','locked'); }); reveal(r.ok);
        });
        reset.addEventListener('click',function(){ if(w.classList.contains('done'))return; seq=[]; ans.innerHTML=''; bank.querySelectorAll('.chip').forEach(function(c){c.classList.remove('used');}); refresh(); });
      }

      if(m==='match'){
        var selL=null, pairs={}; // leftIndex -> {r, lEl, rEl}
        function refresh(){ check.disabled=Object.keys(pairs).length!==n; }
        w.querySelectorAll('.mtch-l').forEach(function(l){ l.addEventListener('click',function(){ if(w.classList.contains('done'))return;
          if(l.classList.contains('paired')) return; w.querySelectorAll('.mtch-l.sel').forEach(function(x){x.classList.remove('sel');}); l.classList.add('sel'); selL=l; }); });
        w.querySelectorAll('.mtch-r').forEach(function(rEl){ rEl.addEventListener('click',function(){ if(w.classList.contains('done')||!selL||rEl.classList.contains('paired'))return;
          var li=+selL.dataset.i, badge=Object.keys(pairs).length+1; pairs[li]={r:+rEl.dataset.r,lEl:selL,rEl:rEl};
          selL.classList.remove('sel'); selL.classList.add('paired'); rEl.classList.add('paired'); selL.dataset.badge=badge; rEl.dataset.badge=badge; selL=null; refresh(); }); });
        check.addEventListener('click',function(){ var ok=true;
          Object.keys(pairs).forEach(function(li){ var p=pairs[li], good=(+li===p.r); if(!good)ok=false; p.lEl.classList.add(good?'correct':'wrong','locked'); p.rEl.classList.add(good?'correct':'wrong','locked'); }); reveal(ok);
        });
        reset.addEventListener('click',function(){ if(w.classList.contains('done'))return; pairs={}; selL=null; resetAll(); refresh(); });
      }

      if(m==='sort'){
        var selI=null, bank=w.querySelector('.chip-bank'), placed=0;
        function refresh(){ check.disabled=placed!==n; }
        bank.addEventListener('click',function(e){ var c=e.target.closest('.chip'); if(!c||w.classList.contains('done')||c.classList.contains('used'))return;
          w.querySelectorAll('.chip.sel').forEach(function(x){x.classList.remove('sel');}); c.classList.add('sel'); selI=c; });
        w.querySelectorAll('.srt-bucket').forEach(function(bk){ bk.addEventListener('click',function(){ if(w.classList.contains('done')||!selI)return;
          selI.classList.remove('sel'); selI.classList.add('used'); selI.dataset.picked=bk.dataset.cat; bk.querySelector('.srt-items').appendChild(selI); placed++; selI=null; refresh(); }); });
        // החזרת פריט לבנק בהקשה עליו כשהוא בתוך דלי
        w.querySelector('.srt-buckets').addEventListener('click',function(e){ var c=e.target.closest('.chip'); if(!c||w.classList.contains('done')||!c.dataset.picked)return;
          c.classList.remove('used'); c.removeAttribute('data-picked'); bank.appendChild(c); placed--; refresh(); });
        check.addEventListener('click',function(){ var ok=true;
          w.querySelectorAll('.srt-items .chip').forEach(function(c){ var good=(c.dataset.picked===c.dataset.cat); if(!good)ok=false; c.classList.add(good?'correct':'wrong','locked'); }); reveal(ok);
        });
        reset.addEventListener('click',function(){ if(w.classList.contains('done'))return; selI=null; placed=0;
          w.querySelectorAll('.srt-items .chip').forEach(function(c){ c.classList.remove('used','sel','correct','wrong','locked'); c.removeAttribute('data-picked'); bank.appendChild(c); }); refresh(); });
      }
    });
  }

  /* מאזין-לחיצה יחיד לשאלות — התשובה הנכונה מתגלה רק אחרי בחירה */
  document.getElementById('app').addEventListener('click',function(e){
    var opt=e.target.closest('.opt'); if(!opt) return;
    var q=opt.closest('.q'); if(!q||q.classList.contains('answered')) return;
    var ci=parseInt(q.getAttribute('data-correct'),10);
    var good=q.querySelector('.fb.good'), hint=q.querySelector('.fb.hint');
    if(isNaN(ci)||ci<0){ // לא זוהתה תשובה נכונה → מצב-חשיפה: כל בחירה מגלה משוב
      q.querySelectorAll('.opt').forEach(function(o){o.classList.add('locked');});
      opt.classList.remove('locked'); if(good)good.classList.add('show'); q.classList.add('answered'); return;
    }
    if(parseInt(opt.getAttribute('data-i'),10)===ci){
      q.querySelectorAll('.opt').forEach(function(o){o.classList.add('locked');});
      opt.classList.remove('locked'); opt.classList.add('correct');
      if(good)good.classList.add('show'); if(hint)hint.classList.remove('show');
      q.classList.add('answered');
    } else {
      opt.classList.add('tryagain','locked');
      var t=(parseInt(q.dataset.tries||'0',10))+1; q.dataset.tries=String(t);
      if(hint)hint.classList.add('show');
      if(t>=2){ var c=q.querySelector('.opt[data-i="'+ci+'"]'); if(c)c.classList.add('point'); }
    }
  });
</script>
</body>
</html>
