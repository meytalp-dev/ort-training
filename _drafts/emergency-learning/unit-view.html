<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תצוגת יחידה — רֶצֶף (בדיקה)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css?v=2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23fff' stroke='%230B8F98' stroke-width='4'/%3E%3Cpath d='M7.5 16H2' stroke='%230B8F98' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font-body,'Assistant',sans-serif);background:var(--bg,#F6F8F9);color:var(--ink,#22333B);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:20px 20px 90px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .back{font-size:13px;font-weight:700;color:var(--brand,#0B8F98);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .back svg{width:15px;height:15px}
  .note{background:#FBF3DE;border:1px solid #EBD59A;color:#7a5a12;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:16px}
  .hero{background:var(--card,#fff);border:1px solid var(--line,#E1E8EA);border-radius:16px;padding:20px;border-top:5px solid var(--_p,#0B8F98)}
  .crumbs{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}
  .chip.subj{color:#fff;background:var(--_p,#0B8F98)}
  .chip.mod{color:var(--ink-soft,#5A6B72);background:var(--surface-muted,#EDF1F2)}
  h1{font-family:var(--font-head,'Heebo',sans-serif);font-size:24px;font-weight:800;color:var(--ink-strong,#12252E);line-height:1.25;letter-spacing:-.01em}
  .idea{margin-top:12px;background:var(--_ps,#FBF3DE);border-radius:10px;padding:12px 15px;font-size:14px;font-weight:600;color:var(--ink-strong,#12252E)}
  .idea b{color:var(--_p,#0B8F98)}
  .seg{display:flex;gap:6px;margin:20px 0 6px;background:var(--surface-muted,#EDF1F2);padding:5px;border-radius:12px}
  .seg button{flex:1;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink-soft,#5A6B72);background:none;border:none;border-radius:9px;padding:9px;cursor:pointer;transition:.14s;display:flex;align-items:center;justify-content:center;gap:6px}
  .seg button i{width:9px;height:9px;border-radius:50%}
  .seg button[aria-pressed="true"]{background:var(--card,#fff);color:var(--ink-strong,#12252E);box-shadow:0 2px 8px -3px rgba(0,0,0,.18)}
  .sec{background:var(--card,#fff);border:1px solid var(--line,#E1E8EA);border-radius:14px;padding:17px 19px;margin-top:12px}
  .sec h3{font-family:var(--font-head,'Heebo',sans-serif);font-size:14px;font-weight:800;color:var(--_p,#0B8F98);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .sec p{margin:6px 0;font-size:15px}
  .sec blockquote{border-inline-start:3px solid var(--_p,#0B8F98);background:var(--bg,#F6F8F9);border-radius:0 8px 8px 0;padding:10px 14px;margin:9px 0;font-size:14.5px;color:var(--ink-strong,#12252E)}
  .q{margin:12px 0;padding:13px 15px;background:var(--bg,#F6F8F9);border-radius:11px}
  .q .qh{font-weight:700;font-size:15px;color:var(--ink-strong,#12252E)}
  .q ul{list-style:none;margin:8px 0 0;padding:0}
  .q li{font-size:14px;padding:3px 0;color:var(--ink,#22333B)}
  .fb{margin-top:9px;font-size:13px;color:#2E7D46;background:#E8F6EC;border-radius:8px;padding:8px 11px}
  .hint{margin-top:6px;font-size:12.5px;color:#7a5a12;background:#FBF3DE;border-radius:8px;padding:7px 11px}
  .meta-only{background:var(--card,#fff);border:1px dashed var(--line,#E1E8EA);border-radius:14px;padding:22px;text-align:center;margin-top:16px}
  .meta-only p{font-size:14px;color:var(--ink-soft,#5A6B72);margin:6px 0}
  .meta-only a{color:var(--brand,#0B8F98);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="catalog-preview.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>חזרה לקטלוג</a>
  </div>
  <div class="note">פרוטוטייפ-בדיקה של <b>מנוע-התצוגה</b>: מרנדר יחידת <code>.md</code> אמיתית לתצוגת-תלמיד. בהפקה — כל 444 היחידות ירונדרו כך.</div>
  <div id="app"></div>
</div>

<script src="units-data.js"></script>
<script>
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function qs(k){return new URLSearchParams(location.search).get(k);}
  var U = (window.RETZEF_UNITS||[]);
  var SAMPLES = window.RETZEF_SAMPLES||{};
  var id = qs('u');
  var meta = U.find(function(u){return u.id===id;});
  var sample = null;
  Object.keys(SAMPLES).forEach(function(k){ if(SAMPLES[k].id===id) sample=SAMPLES[k]; });

  var app = document.getElementById('app');
  if(!meta){ app.innerHTML='<div class="meta-only"><p>יחידה לא נמצאה.</p></div>'; }
  else if(!sample){
    // מטא בלבד — אין raw מוטמע לבדיקה
    app.innerHTML =
      '<div class="hero" style="--_p:'+esc(meta.palette)+'">'+
        '<div class="crumbs"><span class="chip subj">'+esc(meta.subjectHe)+'</span><span class="chip mod">'+esc(meta.moduleHe)+'</span></div>'+
        '<h1>'+esc(meta.title)+'</h1>'+
        (meta.idea?'<div class="idea"><b>רעיון מרכזי:</b> '+esc(meta.idea)+'</div>':'')+
      '</div>'+
      '<div class="meta-only"><p><b>תצוגת-תלמיד מלאה תיפתח כשמנוע-הרינדור ייבנה (שלב ב\').</b></p>'+
        '<p>בבדיקה הזו רק 3 יחידות-דוגמה מרונדרות חיות. היחידה הזו קיימת כ-Markdown אמיתי:</p>'+
        '<p><a href="'+esc(meta.file)+'" target="_blank">'+esc(meta.file)+'</a></p></div>';
  } else {
    renderUnit(sample.raw, meta);
  }

  /* --- פרסר-בדיקה: md-יחידה → מבנה רמות/מקטעים --- */
  function renderUnit(raw, meta){
    var body = raw.replace(/^---[\s\S]*?---\s*/,'');
    var h1 = (body.match(/^#\s+(.+)$/m)||[])[1]||meta.title;
    h1 = h1.replace(/^יחידה\s+[\d.]+\s*[—-]\s*/,'');
    var ideaM = body.match(/^>\s*רעיון מרכזי[^:]*:\s*(.+)$/m);
    var idea = ideaM?ideaM[1]:meta.idea;

    // פיצול לפי כותרות רמה  ## ...
    var LV=[{k:'basic',he:'לאט ובטוח',c:'#2E7D46'},{k:'standard',he:'כרגיל',c:'#2F6FED'},{k:'advanced',he:'אתגר',c:'#A61E64'}];
    var parts = body.split(/\n##\s+/).slice(1); // כל חלק = רמה
    var levels={};
    parts.forEach(function(p){
      var head=p.split('\n')[0];
      var key = /basic/i.test(head)?'basic':/standard/i.test(head)?'standard':/advanced/i.test(head)?'advanced':null;
      if(key) levels[key]=p.slice(head.length);
    });

    var seg = LV.filter(function(l){return levels[l.k];}).map(function(l,i){
      return '<button data-lv="'+l.k+'" aria-pressed="'+(i===0?'true':'false')+'"><i style="background:'+l.c+'"></i>'+l.he+'</button>';
    }).join('');

    app.innerHTML =
      '<div class="hero" style="--_p:'+esc(meta.palette)+';--_ps:'+esc(meta.palette)+'18">'+
        '<div class="crumbs"><span class="chip subj">'+esc(meta.subjectHe)+'</span><span class="chip mod">'+esc(meta.moduleHe)+'</span></div>'+
        '<h1>'+esc(h1)+'</h1>'+
        (idea?'<div class="idea"><b>רעיון מרכזי:</b> '+esc(idea)+'</div>':'')+
      '</div>'+
      '<div class="seg">'+seg+'</div>'+
      '<div id="lvbody"></div>';

    // רקע רך לפי פלטת-היחידה
    document.querySelector('.hero').style.setProperty('--_ps', hexSoft(meta.palette));

    function showLevel(k){
      document.getElementById('lvbody').innerHTML = renderSections(levels[k]||'', meta.palette);
    }
    var segEl=document.querySelector('.seg');
    segEl.addEventListener('click',function(e){
      var b=e.target.closest('button'); if(!b) return;
      segEl.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b);});
      showLevel(b.dataset.lv);
    });
    var first=(document.querySelector('.seg button')||{}).dataset; showLevel(first?first.lv:'basic');
  }

  function hexSoft(hex){ // פלטה רכה מאוד לרקע הרעיון
    var m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return '#FBF3DE';
    var n=parseInt(m[1],16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    return 'rgba('+r+','+g+','+b+',.10)';
  }

  function stripMeta(s){
    // מסיר תגי-מקור/מטא-מחבר שאסור שיגיעו לתלמיד
    return String(s).replace(/`\[[^\]]*\]`/g,'').replace(/\{error_type[^}]*\}/g,'').replace(/`[^`]*`/g,'');
  }
  function inline(s){ // **מודגש** ו-*נטוי* → HTML
    return esc(stripMeta(s)).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>');
  }
  function renderSections(chunk){
    var secs;
    if(/\n###\s+/.test(chunk)){
      // פורמט א' — כותרות-מקטע ### פתיח/הסבר...
      secs = chunk.split(/\n###\s+/).slice(1).map(function(s){
        return { title:s.split('\n')[0].trim(), body:s.slice(s.indexOf('\n')+1).trim() };
      });
    } else {
      // פורמט ב' — תוויות מודגשות **פתיח:** ...
      var re=/\*\*([^*]+?):\*\*/g, m, idxs=[];
      while((m=re.exec(chunk))) idxs.push({t:m[1].trim(), s:m.index, e:re.lastIndex});
      secs = idxs.map(function(o,i){
        var end = i+1<idxs.length ? idxs[i+1].s : chunk.length;
        return { title:o.t.replace(/\s*\(\d+\)\s*$/,''), body:chunk.slice(o.e,end).trim() };
      });
    }
    return secs.filter(function(x){return !/צ'?ק.?DNA/i.test(x.title);}).map(function(s){
      var isQ=/שאל/.test(s.title);
      return '<div class="sec"><h3>'+iconFor(s.title)+esc(s.title)+'</h3>'+(isQ?renderQuestions(s.body):renderProse(s.body))+'</div>';
    }).join('');
  }
  function iconFor(t){
    var svg='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.85">';
    if(/פתיח/.test(t)) return svg+'<path d="M12 3v18M3 12h18"/></svg>';
    if(/הסבר/.test(t)) return svg+'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4"/></svg>';
    if(/דוגמה/.test(t)) return svg+'<path d="M4 6h16M4 12h16M4 18h10"/></svg>';
    if(/שאלות/.test(t)) return svg+'<path d="M9 9a3 3 0 1 1 4 2.8c-.9.4-1 .9-1 1.7M12 17h.01"/></svg>';
    if(/סיכום/.test(t)) return svg+'<path d="m5 12 5 5L20 6"/></svg>';
    if(/אימות/.test(t)) return svg+'<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>';
    return svg+'</svg>';
  }
  function renderProse(txt){
    var out=[],lines=stripMeta(txt).split('\n'),buf=[],quote=[];
    function flush(){ if(buf.length){out.push('<p>'+inlineJoin(buf)+'</p>');buf=[];} }
    function flushQ(){ if(quote.length){out.push('<blockquote>'+quote.map(inline).join('<br>')+'</blockquote>');quote=[];} }
    function inlineJoin(arr){ return arr.map(inline).join(' '); }
    lines.forEach(function(l){
      l=l.trim(); if(!l){flush();flushQ();return;}
      if(/^(-{3,}|\*{3,}|_{3,})$/.test(l)){flush();flushQ();return;}
      if(l[0]==='>'){flush();quote.push(l.replace(/^>\s?/,''));}
      else{flushQ();buf.push(l);}
    });
    flush();flushQ();
    return out.join('');
  }
  function renderQuestions(txt){
    // בלוקים: שורה שמתחילה במספר = שאלה חדשה
    var blocks=txt.split(/\n(?=\d+\.\s)/).filter(function(b){return /\d+\.\s/.test(b);});
    return blocks.map(function(b){
      var lines=b.split('\n'),head=inline(lines[0].replace(/^\d+\.\s*/,'').replace(/[?*]+$/,'').trim()),opts=[],fb='',hint='';
      lines.slice(1).forEach(function(l){
        l=l.trim(); if(!l) return;
        var lm=stripMeta(l).trim();
        if(/[✅✓]/.test(l)) fb=lm.replace(/^[-*]\s*/,'').replace(/^משוב:\s*/,'').replace(/[✅✓]\s*/,'');
        else if(/💡/.test(l)){ if(!/error_type/.test(l)) hint=lm.replace(/^[-*]\s*/,'').replace(/💡\s*/,''); }
        else if(/^[-*]?\s*[א-ת]\.\s/.test(lm)){
          var correct=/\*\*נכון\*\*|—\s*\*\*נכון|נכון\s*$/.test(l);
          var clean=lm.replace(/^[-*]\s*/,'').replace(/\s*[—-]?\s*\*\*נכון\*\*/,'');
          opts.push({t:clean, ok:correct});
        }
      });
      return '<div class="q"><div class="qh">'+head+'</div>'+
        (opts.length?'<ul>'+opts.map(function(o){return '<li'+(o.ok?' style="color:#2E7D46;font-weight:600"':'')+'>'+inline(o.t)+(o.ok?' ✔':'')+'</li>';}).join('')+'</ul>':'')+
        (fb?'<div class="fb">'+inline(fb)+'</div>':'')+
        (hint?'<div class="hint">'+inline(hint)+'</div>':'')+'</div>';
    }).join('');
  }
</script>
</body>
</html>
