<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learni — טיפ יומי</title>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@300;400;500;600;700;800&family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #e8e8e8;
    font-family: 'Playpen Sans Hebrew', cursive;
  }

  .post {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: #fdf8f0;
    /* Subtle paper texture via gradient noise */
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(255,248,235,0.5) 0%, transparent 70%),
      radial-gradient(ellipse at 80% 20%, rgba(255,245,225,0.4) 0%, transparent 60%);
  }

  /* ===== NOTEBOOK RULED LINES ===== */
  .ruled-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .ruled-lines line {
    stroke: #c8d8e8;
    stroke-width: 1;
    opacity: 0.5;
  }

  /* ===== RED MARGIN LINE ===== */
  .margin-line {
    position: absolute;
    top: 0;
    right: 90px;
    width: 2px;
    height: 100%;
    background: #e8a0a0;
    opacity: 0.5;
    z-index: 1;
  }

  /* ===== COFFEE RING STAIN ===== */
  .coffee-ring {
    position: absolute;
    left: 60px;
    top: 680px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 12px solid rgba(180, 140, 90, 0.08);
    transform: rotate(-15deg);
    z-index: 1;
    filter: blur(2px);
  }
  .coffee-ring::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 4px solid rgba(170, 130, 80, 0.05);
  }

  /* ===== TORN PAPER EDGE (TOP) ===== */
  .torn-edge-top {
    position: absolute;
    top: -2px;
    left: 0;
    width: 100%;
    height: 30px;
    z-index: 10;
  }

  /* ===== WASHI TAPE ===== */
  .washi-tape {
    position: absolute;
    width: 160px;
    height: 38px;
    opacity: 0.7;
    z-index: 8;
    border-radius: 2px;
  }
  .washi-1 {
    top: 30px;
    left: 40px;
    background: repeating-linear-gradient(
      45deg,
      rgba(123, 171, 212, 0.35),
      rgba(123, 171, 212, 0.35) 6px,
      rgba(123, 171, 212, 0.2) 6px,
      rgba(123, 171, 212, 0.2) 12px
    );
    transform: rotate(-8deg);
  }
  .washi-2 {
    bottom: 180px;
    right: 30px;
    width: 140px;
    background: repeating-linear-gradient(
      -45deg,
      rgba(125, 212, 172, 0.35),
      rgba(125, 212, 172, 0.35) 6px,
      rgba(125, 212, 172, 0.2) 6px,
      rgba(125, 212, 172, 0.2) 12px
    );
    transform: rotate(5deg);
  }
  .washi-3 {
    top: 155px;
    right: 50px;
    width: 120px;
    height: 32px;
    background: repeating-linear-gradient(
      45deg,
      rgba(184, 169, 212, 0.35),
      rgba(184, 169, 212, 0.35) 5px,
      rgba(184, 169, 212, 0.2) 5px,
      rgba(184, 169, 212, 0.2) 10px
    );
    transform: rotate(3deg);
  }

  /* ===== CATEGORY STICKER ===== */
  .category-sticker {
    position: absolute;
    top: 70px;
    right: 110px;
    z-index: 5;
    transform: rotate(-3deg);
  }
  .category-sticker-inner {
    background: #7babd4;
    color: #fff;
    font-family: 'Playpen Sans Hebrew', cursive;
    font-weight: 700;
    font-size: 26px;
    padding: 12px 32px;
    border-radius: 30px;
    box-shadow: 3px 4px 8px rgba(0,0,0,0.15), 0 1px 0 rgba(255,255,255,0.3) inset;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* ===== TITLE ===== */
  .title-area {
    position: absolute;
    top: 160px;
    right: 80px;
    left: 80px;
    z-index: 5;
  }
  .title-text {
    font-family: 'Playpen Sans Hebrew', cursive;
    font-weight: 800;
    font-size: 46px;
    color: #1e3a5f;
    line-height: 1.5;
    /* Highlighter effect behind text */
    display: inline;
    background: linear-gradient(180deg, transparent 55%, rgba(125, 212, 172, 0.25) 55%, rgba(125, 212, 172, 0.25) 90%, transparent 90%);
    padding: 0 8px;
  }

  /* ===== TIP CARDS ===== */
  .tips-area {
    position: absolute;
    top: 320px;
    right: 80px;
    left: 80px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .tip-card {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 18px;
  }

  .tip-number {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playpen Sans Hebrew', cursive;
    font-weight: 800;
    font-size: 28px;
    color: #fff;
    box-shadow: 2px 3px 6px rgba(0,0,0,0.18);
    position: relative;
    top: 4px;
  }
  .tip-1 .tip-number {
    background: #7babd4;
    transform: rotate(-5deg);
  }
  .tip-2 .tip-number {
    background: #7dd4ac;
    transform: rotate(3deg);
  }
  .tip-3 .tip-number {
    background: #b8a9d4;
    transform: rotate(-2deg);
  }

  .tip-content {
    flex: 1;
    position: relative;
  }
  .tip-content-bg {
    background: rgba(255, 255, 255, 0.7);
    border: 2px dashed rgba(123, 171, 212, 0.3);
    border-radius: 12px;
    padding: 20px 24px;
    position: relative;
  }
  .tip-text {
    font-family: 'Playpen Sans Hebrew', cursive;
    font-weight: 500;
    font-size: 28px;
    color: #2a2a2a;
    line-height: 1.6;
    direction: rtl;
  }
  /* Pencil underline effect */
  .tip-text::after {
    content: '';
    display: block;
    height: 3px;
    margin-top: 6px;
    border-radius: 2px;
    opacity: 0.2;
  }
  .tip-1 .tip-text::after { background: #7babd4; width: 85%; }
  .tip-2 .tip-text::after { background: #7dd4ac; width: 70%; }
  .tip-3 .tip-text::after { background: #b8a9d4; width: 90%; }

  /* Post-it quote marks */
  .quote-mark {
    position: absolute;
    top: 6px;
    right: 10px;
    font-family: 'Playpen Sans Hebrew', cursive;
    font-size: 40px;
    color: rgba(123, 171, 212, 0.2);
    font-weight: 800;
    line-height: 1;
  }

  /* ===== MARGIN DOODLES ===== */
  .doodles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  /* ===== BOTTOM BAR ===== */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 130px;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    /* Post-it style */
    background: #fffde0;
    border-top: 3px solid rgba(200, 190, 120, 0.3);
    box-shadow: 0 -3px 12px rgba(0,0,0,0.06);
  }
  .bottom-bar::before {
    content: '';
    position: absolute;
    top: -3px;
    left: 0;
    right: 0;
    height: 3px;
    background: repeating-linear-gradient(90deg, rgba(200,190,120,0.4) 0px, rgba(200,190,120,0.4) 8px, transparent 8px, transparent 16px);
  }

  .logo-circles {
    position: relative;
    width: 48px;
    height: 48px;
  }
  .logo-circle-blue {
    position: absolute;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #7babd4;
    top: 4px;
    right: 0;
    opacity: 0.85;
  }
  .logo-circle-green {
    position: absolute;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #7dd4ac;
    bottom: 4px;
    left: 0;
    opacity: 0.85;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
  }
  .brand-name {
    font-family: 'Playpen Sans Hebrew', cursive;
    font-weight: 700;
    font-size: 30px;
    color: #1e3a5f;
    letter-spacing: 1px;
    line-height: 1.2;
  }
  .brand-url {
    font-family: 'Assistant', sans-serif;
    font-weight: 400;
    font-size: 18px;
    color: #7babd4;
    letter-spacing: 0.5px;
    direction: ltr;
  }

  /* ===== SPIRAL BINDING HOLES ===== */
  .spiral-holes {
    position: absolute;
    left: 28px;
    top: 0;
    bottom: 0;
    z-index: 9;
    display: flex;
    flex-direction: column;
    gap: 60px;
    padding-top: 40px;
  }
  .spiral-hole {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #e0dcd4;
    border: 2px solid #ccc8be;
    box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>
<div class="post">

  <!-- Notebook ruled lines -->
  <svg class="ruled-lines" width="1080" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- Horizontal ruled lines every 36px -->
    <line x1="0" y1="72" x2="1080" y2="72"/>
    <line x1="0" y1="108" x2="1080" y2="108"/>
    <line x1="0" y1="144" x2="1080" y2="144"/>
    <line x1="0" y1="180" x2="1080" y2="180"/>
    <line x1="0" y1="216" x2="1080" y2="216"/>
    <line x1="0" y1="252" x2="1080" y2="252"/>
    <line x1="0" y1="288" x2="1080" y2="288"/>
    <line x1="0" y1="324" x2="1080" y2="324"/>
    <line x1="0" y1="360" x2="1080" y2="360"/>
    <line x1="0" y1="396" x2="1080" y2="396"/>
    <line x1="0" y1="432" x2="1080" y2="432"/>
    <line x1="0" y1="468" x2="1080" y2="468"/>
    <line x1="0" y1="504" x2="1080" y2="504"/>
    <line x1="0" y1="540" x2="1080" y2="540"/>
    <line x1="0" y1="576" x2="1080" y2="576"/>
    <line x1="0" y1="612" x2="1080" y2="612"/>
    <line x1="0" y1="648" x2="1080" y2="648"/>
    <line x1="0" y1="684" x2="1080" y2="684"/>
    <line x1="0" y1="720" x2="1080" y2="720"/>
    <line x1="0" y1="756" x2="1080" y2="756"/>
    <line x1="0" y1="792" x2="1080" y2="792"/>
    <line x1="0" y1="828" x2="1080" y2="828"/>
    <line x1="0" y1="864" x2="1080" y2="864"/>
    <line x1="0" y1="900" x2="1080" y2="900"/>
    <line x1="0" y1="936" x2="1080" y2="936"/>
  </svg>

  <!-- Red margin line -->
  <div class="margin-line"></div>

  <!-- Spiral binding holes -->
  <div class="spiral-holes">
    <div class="spiral-hole"></div>
    <div class="spiral-hole"></div>
    <div class="spiral-hole"></div>
    <div class="spiral-hole"></div>
    <div class="spiral-hole"></div>
    <div class="spiral-hole"></div>
    <div class="spiral-hole"></div>
    <div class="spiral-hole"></div>
    <div class="spiral-hole"></div>
    <div class="spiral-hole"></div>
    <div class="spiral-hole"></div>
    <div class="spiral-hole"></div>
    <div class="spiral-hole"></div>
  </div>

  <!-- Coffee ring stain -->
  <div class="coffee-ring"></div>

  <!-- Torn paper edge top -->
  <svg class="torn-edge-top" viewBox="0 0 1080 30" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,0 L0,12 Q20,18 40,14 Q60,8 80,15 Q100,22 120,13 Q140,6 160,16 Q180,24 200,12 Q220,4 240,14 Q260,20 280,11 Q300,5 320,15 Q340,22 360,12 Q380,6 400,16 Q420,24 440,13 Q460,5 480,14 Q500,20 520,11 Q540,6 560,16 Q580,22 600,12 Q620,4 640,14 Q660,20 680,11 Q700,5 720,16 Q740,24 760,13 Q780,5 800,14 Q820,20 840,11 Q860,6 880,15 Q900,22 920,12 Q940,4 960,14 Q980,22 1000,11 Q1020,5 1040,15 Q1060,20 1080,12 L1080,0 Z" fill="#e8e8e8"/>
  </svg>

  <!-- Margin doodles -->
  <svg class="doodles" width="1080" height="1080" xmlns="http://www.w3.org/2000/svg">
    <!-- Star doodle top-left -->
    <g transform="translate(58, 120) rotate(-10)" opacity="0.25">
      <path d="M12,0 L15,9 L24,9 L17,14 L19,24 L12,18 L5,24 L7,14 L0,9 L9,9 Z" fill="none" stroke="#7babd4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Arrow doodle -->
    <g transform="translate(48, 400)" opacity="0.2">
      <path d="M0,20 Q10,0 20,20" fill="none" stroke="#b8a9d4" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M15,14 L20,20 L13,20" fill="none" stroke="#b8a9d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Swirl doodle bottom-left -->
    <g transform="translate(52, 850)" opacity="0.18">
      <path d="M16,16 Q16,6 26,6 Q36,6 36,16 Q36,28 22,28 Q6,28 6,14 Q6,-2 24,-2" fill="none" stroke="#7dd4ac" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Small star right margin -->
    <g transform="translate(1020, 300) rotate(15)" opacity="0.2">
      <path d="M8,0 L10,6 L16,6 L11,10 L13,16 L8,12 L3,16 L5,10 L0,6 L6,6 Z" fill="none" stroke="#7babd4" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- Check mark doodle -->
    <g transform="translate(1010, 500)" opacity="0.2">
      <path d="M0,10 L6,18 L20,0" fill="none" stroke="#7dd4ac" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Small heart -->
    <g transform="translate(55, 600) rotate(-8)" opacity="0.15">
      <path d="M12,21 Q0,12 0,6 Q0,0 6,0 Q12,0 12,8 Q12,0 18,0 Q24,0 24,6 Q24,12 12,21Z" fill="none" stroke="#e8a0a0" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- Underline scribble decoration -->
    <g transform="translate(160, 280)" opacity="0.15">
      <path d="M0,0 Q80,-4 160,2 Q240,-2 320,0 Q400,3 500,0 Q580,-3 680,1" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Lightning bolt -->
    <g transform="translate(1030, 700) rotate(10)" opacity="0.18">
      <path d="M10,0 L4,12 L10,12 L6,24" fill="none" stroke="#b8a9d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Exclamation doodle -->
    <g transform="translate(60, 760)" opacity="0.15">
      <line x1="8" y1="0" x2="8" y2="16" stroke="#7babd4" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="8" cy="22" r="2" fill="#7babd4"/>
    </g>
  </svg>

  <!-- Washi tape elements -->
  <div class="washi-tape washi-1"></div>
  <div class="washi-tape washi-2"></div>
  <div class="washi-tape washi-3"></div>

  <!-- Category sticker -->
  <div class="category-sticker">
    <div class="category-sticker-inner">
      <!-- Lightbulb SVG icon -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9,21 L15,21 M12,3 C8.13,3 5,6.13 5,10 C5,12.38 6.19,14.47 8,15.74 L8,18 C8,18.55 8.45,19 9,19 L15,19 C15.55,19 16,18.55 16,18 L16,15.74 C17.81,14.47 19,12.38 19,10 C19,6.13 15.87,3 12,3Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10,19 L10,21 M14,19 L14,21" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>טיפ יומי</span>
    </div>
  </div>

  <!-- Title -->
  <div class="title-area">
    <span class="title-text">3 פרומפטים שישנו לכם את הבוקר</span>
  </div>

  <!-- Tips -->
  <div class="tips-area">
    <!-- Tip 1 -->
    <div class="tip-card tip-1">
      <div class="tip-number">1</div>
      <div class="tip-content">
        <div class="tip-content-bg" style="transform: rotate(-0.5deg);">
          <span class="quote-mark">"</span>
          <div class="tip-text">"תכנן לי את היום ב-5 משימות מרכזיות"</div>
        </div>
      </div>
    </div>

    <!-- Tip 2 -->
    <div class="tip-card tip-2">
      <div class="tip-number">2</div>
      <div class="tip-content">
        <div class="tip-content-bg" style="transform: rotate(0.4deg);">
          <span class="quote-mark">"</span>
          <div class="tip-text">"תסכם לי את המייל הזה בשלוש נקודות"</div>
        </div>
      </div>
    </div>

    <!-- Tip 3 -->
    <div class="tip-card tip-3">
      <div class="tip-number">3</div>
      <div class="tip-content">
        <div class="tip-content-bg" style="transform: rotate(-0.3deg);">
          <span class="quote-mark">"</span>
          <div class="tip-text">"תכתוב תשובה מנומסת ומקצועית למייל הזה"</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom bar (Post-it style) -->
  <div class="bottom-bar">
    <div class="logo-circles">
      <div class="logo-circle-blue"></div>
      <div class="logo-circle-green"></div>
    </div>
    <div class="brand-text">
      <span class="brand-name">Learni</span>
      <span class="brand-url">learni.ai</span>
    </div>
  </div>

</div>
</body>
</html>
