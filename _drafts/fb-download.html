<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>הורדת לוגו פייסבוק</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Heebo:wght@300;400;700&family=Karantina:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Heebo',sans-serif;background:#f5f6f8;min-height:100vh;padding:2rem 1rem;display:flex;flex-direction:column;align-items:center;gap:2rem}
  h1{font-size:1.3rem;color:#1e3a5f}
  .sub{color:#6b7280;font-size:.85rem}
  .card{background:#fff;border-radius:16px;padding:1.5rem;box-shadow:0 2px 16px rgba(0,0,0,.06);text-align:center}
  .label{font-size:.8rem;color:#9ca3af;margin:8px 0 4px}
  canvas{border-radius:8px;max-width:100%}
  .btn{display:inline-block;margin:8px 6px;padding:12px 28px;border:none;border-radius:10px;font-size:.9rem;font-family:'Heebo',sans-serif;cursor:pointer;color:#fff}
  .btn.purple{background:#9b7ed8}.btn.purple:hover{background:#8562cc}
  .btn.teal{background:#0d9488}.btn.teal:hover{background:#0f766e}
  .status{font-size:.8rem;color:#059669;margin-top:.5rem;display:none}
</style>
</head>
<body>

<h1>הורדת תמונות פייסבוק</h1>
<p class="sub">פרופיל 500x500 + כיסוי 820x312 — מוכן להעלאה</p>

<div class="card">
  <div class="label">תמונת פרופיל — 500x500</div>
  <canvas id="profile" width="500" height="500"></canvas>
  <br>
  <button class="btn purple" onclick="dl('profile','lerani-fb-profile.png')">הורדת פרופיל</button>
</div>

<div class="card">
  <div class="label">תמונת כיסוי — 820x312</div>
  <canvas id="cover" width="820" height="312"></canvas>
  <br>
  <button class="btn purple" onclick="dl('cover','lerani-fb-cover.png')">הורדת כיסוי</button>
</div>

<button class="btn teal" onclick="dlBoth()">הורדת שניהם</button>
<div class="status" id="status">הקבצים הורדו בהצלחה</div>

<script>
function drawSparkle(ctx, x, y, size) {
  ctx.save();
  const color = '#9b7ed8';
  const hR = size*3.5;
  const h = ctx.createRadialGradient(x,y,size*0.3,x,y,hR);
  h.addColorStop(0,'rgba(155,126,216,0.35)');h.addColorStop(0.3,'rgba(155,126,216,0.12)');h.addColorStop(0.6,'rgba(155,126,216,0.03)');h.addColorStop(1,'transparent');
  ctx.globalAlpha=0.5;ctx.fillStyle=h;ctx.beginPath();ctx.arc(x,y,hR,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.2;ctx.strokeStyle=color;ctx.lineWidth=1;
  for(let i=0;i<6;i++){const a=(i*Math.PI)/3;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*size*0.5,y+Math.sin(a)*size*0.5);ctx.lineTo(x+Math.cos(a)*size*2.5,y+Math.sin(a)*size*2.5);ctx.stroke();}
  ctx.globalAlpha=0.85;ctx.fillStyle=color;ctx.beginPath();
  ctx.moveTo(x,y-size*1.2);ctx.quadraticCurveTo(x+size*0.12,y-size*0.12,x+size*1.2,y);ctx.quadraticCurveTo(x+size*0.12,y+size*0.12,x,y+size*1.2);ctx.quadraticCurveTo(x-size*0.12,y+size*0.12,x-size*1.2,y);ctx.quadraticCurveTo(x-size*0.12,y-size*0.12,x,y-size*1.2);ctx.closePath();ctx.fill();
  ctx.globalAlpha=0.95;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,size*0.25,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawVenn(ctx, cx1, cx2, cy, r) {
  const g1=ctx.createRadialGradient(cx1-r*0.15,cy-r*0.15,r*0.08,cx1,cy,r);
  g1.addColorStop(0,'#a8c8f0');g1.addColorStop(0.5,'#7babd4');g1.addColorStop(1,'#5a93c0');
  ctx.globalAlpha=0.8;ctx.beginPath();ctx.arc(cx1,cy,r,0,Math.PI*2);ctx.fillStyle=g1;ctx.fill();
  const g2=ctx.createRadialGradient(cx2+r*0.15,cy-r*0.15,r*0.08,cx2,cy,r);
  g2.addColorStop(0,'#a8e6cf');g2.addColorStop(0.5,'#7dd4ac');g2.addColorStop(1,'#5abf92');
  ctx.beginPath();ctx.arc(cx2,cy,r,0,Math.PI*2);ctx.fillStyle=g2;ctx.fill();
  ctx.globalAlpha=0.3;ctx.save();ctx.beginPath();ctx.arc(cx2,cy,r,0,Math.PI*2);ctx.clip();
  const go=ctx.createLinearGradient(cx1-r,cy-r,cx2+r,cy+r);go.addColorStop(0,'#7babd4');go.addColorStop(1,'#7dd4ac');
  ctx.beginPath();ctx.arc(cx1,cy,r,0,Math.PI*2);ctx.fillStyle=go;ctx.fill();ctx.restore();
  ctx.globalAlpha=0.3;ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx1,cy,r,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(cx2,cy,r,0,Math.PI*2);ctx.stroke();
}

function drawTagline(ctx, x, y, fs) {
  ctx.font=`400 ${fs}px 'Heebo',sans-serif`;ctx.globalAlpha=0.9;
  const p=[{t:'הגשמת חלומות',c:'#9b7ed8'},{t:'  ·  ',c:'#aaa'},{t:'בינה מלאכותית',c:'#5a93c0'},{t:'  ·  ',c:'#aaa'},{t:'חינוך',c:'#5abf92'}];
  let tw=p.reduce((s,i)=>s+ctx.measureText(i.t).width,0),cx=x+tw/2;
  ctx.textAlign='right';p.forEach(i=>{ctx.fillStyle=i.c;ctx.fillText(i.t,cx,y);cx-=ctx.measureText(i.t).width;});
  ctx.textAlign='center';
}

function drawProfile() {
  const c=document.getElementById('profile'),ctx=c.getContext('2d'),W=500,H=500;
  const bg=ctx.createRadialGradient(W/2,W/2,50,W/2,W/2,350);bg.addColorStop(0,'#fff');bg.addColorStop(1,'#f0fdf9');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  drawVenn(ctx,200,300,180,105);
  drawSparkle(ctx,250,60,8);drawSparkle(ctx,120,130,5.5);drawSparkle(ctx,380,120,5.5);

  ctx.globalAlpha=1;ctx.font="700 68px 'Caveat',cursive";ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#1e3a5f';ctx.shadowColor='rgba(255,255,255,0.6)';ctx.shadowBlur=6;
  ctx.fillText('Learni',W/2,180);ctx.shadowBlur=0;

  drawTagline(ctx,W/2,320,20);

  ctx.globalAlpha=0.5;const lg=ctx.createLinearGradient(130,0,370,0);
  lg.addColorStop(0,'#9b7ed8');lg.addColorStop(0.5,'#7babd4');lg.addColorStop(1,'#7dd4ac');
  ctx.strokeStyle=lg;ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(130,345);ctx.lineTo(370,345);ctx.stroke();

  ctx.globalAlpha=1;ctx.font="700 26px 'Heebo',sans-serif";ctx.fillStyle='#1e3a5f';
  ctx.fillText('מיטל פלג',W/2,390);
  ctx.font="400 17px 'Heebo',sans-serif";ctx.fillStyle='#6b9e8a';
  ctx.fillText('מומחית לחדשנות חינוכית ובינה מלאכותית',W/2,420);
  ctx.globalAlpha=0.7;ctx.font="300 14px 'Heebo',sans-serif";ctx.fillStyle='#9b7ed8';
  ctx.fillText('״131+ תוצרים דיגיטליים · 50+ מורים בהדרכות״',W/2,460);
}

function drawCover() {
  const c=document.getElementById('cover'),ctx=c.getContext('2d'),W=820,H=312;
  const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#f5f0ff');bg.addColorStop(0.5,'#f0fdf9');bg.addColorStop(1,'#eef6fc');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.globalAlpha=0.06;
  for(let x=0;x<W;x+=28)for(let y=0;y<H;y+=28){ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fillStyle='#9b7ed8';ctx.fill();}

  const lx=W/2,ly=108,r=85;
  drawVenn(ctx,lx-48,lx+48,ly,r);
  drawSparkle(ctx,lx,ly-r-14,7);drawSparkle(ctx,lx-48-r+12,ly-28,4.5);drawSparkle(ctx,lx+48+r-12,ly-22,4.5);

  ctx.globalAlpha=1;ctx.font="700 52px 'Caveat',cursive";ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#1e3a5f';ctx.shadowColor='rgba(255,255,255,0.8)';ctx.shadowBlur=6;
  ctx.fillText('Learni',lx,ly);ctx.shadowBlur=0;

  drawTagline(ctx,lx,ly+r+24,16);

  ctx.globalAlpha=0.4;const lg=ctx.createLinearGradient(lx-130,0,lx+130,0);
  lg.addColorStop(0,'#9b7ed8');lg.addColorStop(0.5,'#7babd4');lg.addColorStop(1,'#7dd4ac');
  ctx.strokeStyle=lg;ctx.lineWidth=1.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(lx-130,ly+r+40);ctx.lineTo(lx+130,ly+r+40);ctx.stroke();

  ctx.globalAlpha=1;ctx.font="700 18px 'Heebo',sans-serif";ctx.fillStyle='#1e3a5f';
  ctx.fillText('מיטל פלג',lx,H-32);
  ctx.font="400 14px 'Heebo',sans-serif";ctx.fillStyle='#0d9488';
  ctx.fillText('מומחית לחדשנות חינוכית ובינה מלאכותית',lx,H-12);
}

function dl(id,name){
  const a=document.createElement('a');a.download=name;
  a.href=document.getElementById(id).toDataURL('image/png');a.click();
}
function dlBoth(){
  dl('profile','lerani-fb-profile.png');
  setTimeout(()=>{dl('cover','lerani-fb-cover.png');
    document.getElementById('status').style.display='block';
  },500);
}

async function init(){
  await document.fonts.ready;
  await new Promise(r=>setTimeout(r,800));
  drawProfile();drawCover();
}
init();
</script>
</body>
</html>
