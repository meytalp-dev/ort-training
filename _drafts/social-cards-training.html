<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מצגת הדרכה — Learni</title>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@300;400;500;600;700;800&family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #ddd; }

.canvas {
  width: 1080px; height: 1080px;
  position: relative; overflow: hidden;
  background: #fdf5f7;
}
.canvas::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 25% 20%, rgba(232,160,180,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 50% 55% at 80% 75%, rgba(123,171,212,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(184,169,212,0.1) 0%, transparent 70%);
}

/* Category badge */
.cat {
  position: absolute; top: 50px; right: 60px; z-index: 10;
  background: #e8a0b4; color: #fff;
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 28px; font-weight: 700;
  padding: 12px 30px; border-radius: 24px;
  box-shadow: 0 4px 0 rgba(30,58,95,0.06), 0 8px 20px rgba(232,160,180,0.25);
  display: flex; align-items: center; gap: 12px;
}
.cat svg { width: 24px; height: 24px; fill: #fff; }

/* ========== BURST BADGE ========== */
.burst {
  position: absolute; top: -20px; left: -20px; z-index: 60;
  width: 160px; height: 160px;
  transform: rotate(-12deg);
  filter: drop-shadow(0 6px 18px rgba(210, 80, 120, 0.4));
}
.burst-shape {
  width: 100%; height: 100%;
}
.burst-text {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 38px; font-weight: 800;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.15);
  transform: rotate(5deg);
}

/* ========== TITLE AREA WITH PLAY BUTTON ========== */
.title-block {
  position: absolute; top: 130px; right: 60px; left: 60px; z-index: 10;
  display: flex; align-items: center; gap: 28px;
}
.play-btn {
  flex-shrink: 0; width: 100px; height: 100px; border-radius: 50%;
  background: linear-gradient(135deg, #e8a0b4, #c4607a);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 30px rgba(232,160,180,0.45), 0 0 0 6px rgba(232,160,180,0.15);
  animation: pulse-play 2.5s ease-in-out infinite;
}
@keyframes pulse-play {
  0%, 100% { box-shadow: 0 8px 30px rgba(232,160,180,0.45), 0 0 0 6px rgba(232,160,180,0.15); }
  50% { box-shadow: 0 8px 30px rgba(232,160,180,0.55), 0 0 0 12px rgba(232,160,180,0.1); }
}
.play-btn svg { width: 40px; height: 40px; fill: #fff; margin-right: -4px; }

.title-text-block { display: flex; flex-direction: column; gap: 6px; }
.title {
  font-family: 'Playpen Sans Hebrew', cursive;
  font-weight: 800; font-size: 54px;
  color: #1e3a5f; line-height: 1.15;
}
.subtitle {
  font-family: 'Assistant', sans-serif;
  font-size: 32px; font-weight: 500; color: rgba(30,58,95,0.6);
}

/* ========== CARDS — 1+2 LAYOUT ========== */
.card {
  position: absolute; z-index: 10;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 32px 36px;
  border: 1.5px solid rgba(255,255,255,0.9);
  display: flex; align-items: center; gap: 22px;
}

/* Wide card on top */
.card-1 {
  top: 380px; right: 55px; left: 55px;
  transform: rotate(-2deg);
  box-shadow: 0 14px 45px rgba(232,160,180,0.18), 0 4px 12px rgba(0,0,0,0.05), 0 24px 60px rgba(30,58,95,0.08);
  border-right: 6px solid #e8a0b4;
}

/* Two side-by-side cards below */
.card-2 {
  top: 560px; right: 55px; width: 460px;
  transform: rotate(2.5deg);
  box-shadow: 0 16px 50px rgba(232,160,180,0.22), 0 4px 12px rgba(0,0,0,0.06), 0 30px 70px rgba(30,58,95,0.1);
  border-right: 6px solid #d4849c;
  z-index: 11;
}
.card-3 {
  top: 575px; left: 55px; width: 460px;
  transform: rotate(-3deg);
  box-shadow: 0 12px 40px rgba(232,160,180,0.15), 0 4px 12px rgba(0,0,0,0.05), 0 20px 50px rgba(30,58,95,0.08);
  border-right: 6px solid #c47a90;
}

.num {
  flex-shrink: 0; width: 54px; height: 54px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 28px; font-weight: 800; color: #fff;
  background: linear-gradient(135deg, #e8a0b4, #d4849c);
  box-shadow: 0 4px 14px rgba(232,160,180,0.3);
}

.ico {
  flex-shrink: 0; width: 52px; height: 52px; border-radius: 14px;
  background: rgba(232,160,180,0.12);
  display: flex; align-items: center; justify-content: center;
}
.ico svg { width: 30px; height: 30px; }

.txt {
  font-family: 'Assistant', sans-serif;
  font-size: 30px; font-weight: 600;
  color: #1e3a5f; line-height: 1.4;
}

/* CTA */
.cta {
  position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%);
  z-index: 10;
  background: linear-gradient(135deg, #e8a0b4, #c4607a);
  color: #fff;
  font-family: 'Assistant', sans-serif; font-size: 32px; font-weight: 700;
  padding: 18px 56px; border-radius: 40px; border: none;
  box-shadow: 0 6px 24px rgba(232,160,180,0.4), 0 0 0 4px rgba(232,160,180,0.12);
  display: flex; align-items: center; gap: 14px;
  text-decoration: none;
  white-space: nowrap;
}
.cta svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; }

/* ========== FOOTER ========== */
.bottom {
  position: absolute; bottom: 35px; right: 55px; left: 55px;
  z-index: 10; display: flex; align-items: center; justify-content: space-between;
  direction: rtl;
}
.logo-group {
  display: flex; align-items: center; gap: 14px;
}
.logo-circles {
  position: relative; width: 44px; height: 36px;
}
.logo-circles .circle-blue {
  position: absolute; right: 0; top: 0;
  width: 36px; height: 36px; border-radius: 50%;
  background: #7babd4; opacity: 0.85;
}
.logo-circles .circle-green {
  position: absolute; right: 16px; top: 0;
  width: 36px; height: 36px; border-radius: 50%;
  background: #7dd4ac; opacity: 0.85;
}
.logo-name {
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 28px; font-weight: 700; color: #1e3a5f;
}
.url {
  font-family: 'Assistant', sans-serif;
  font-size: 28px; font-weight: 500; color: rgba(30,58,95,0.55);
  direction: ltr;
}
</style>
</head>
<body>
<div class="canvas">

  <!-- Burst "NEW!" badge -->
  <div class="burst">
    <svg class="burst-shape" viewBox="0 0 200 200">
      <defs>
        <linearGradient id="burstGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#e8607a"/>
          <stop offset="50%" style="stop-color:#e8a0b4"/>
          <stop offset="100%" style="stop-color:#f06090"/>
        </linearGradient>
      </defs>
      <polygon fill="url(#burstGrad)" points="100,10 115,55 108,38 135,58 118,52 140,78 120,65 130,95 115,75 118,105 100,80 100,108 82,80 85,105 68,75 70,95 60,65 62,78 42,52 65,58 48,38 72,55 85,38 60,20 88,45 80,15" transform="translate(0,0)"/>
      <!-- Better starburst with 12 points -->
      <path fill="url(#burstGrad)" d="
        M100,8 L112,42 L132,18 L122,52 L158,32 L138,62 L172,55 L148,78 L185,82 L152,92 L180,112 L145,108 L162,140 L132,122 L135,158 L108,132 L100,168 L92,132 L65,158 L68,122 L38,140 L55,108 L20,112 L48,92 L15,82 L52,78 L28,55 L62,62 L42,32 L78,52 L68,18 L88,42 Z
      "/>
    </svg>
    <div class="burst-text">!חדש</div>
  </div>

  <!-- Category -->
  <div class="cat">
    <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" fill="none" stroke="#fff" stroke-width="2"/><line x1="8" y1="21" x2="16" y2="21" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="21" stroke="#fff" stroke-width="2"/></svg>
    מצגת הדרכה
  </div>

  <!-- Title area with large play button -->
  <div class="title-block">
    <div class="play-btn">
      <svg viewBox="0 0 24 24"><polygon points="7,4 21,12 7,20"/></svg>
    </div>
    <div class="title-text-block">
      <div class="title">הדרכה חדשה: Google Flow</div>
      <div class="subtitle">סטודיו ליצירת וידאו עם AI</div>
    </div>
  </div>

  <!-- Card 1: Wide top card -->
  <div class="card card-1">
    <div class="num">1</div>
    <div class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c47a90" stroke-width="2" stroke-linecap="round">
        <polygon points="5,3 19,12 5,21" fill="rgba(232,160,180,0.2)"/>
      </svg>
    </div>
    <div class="txt">איך ליצור סרטון מקצועי בדקות</div>
  </div>

  <!-- Card 2: Right narrow card -->
  <div class="card card-2">
    <div class="num">2</div>
    <div class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c47a90" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1.5" fill="rgba(232,160,180,0.15)"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5" fill="rgba(232,160,180,0.15)"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5" fill="rgba(232,160,180,0.15)"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5" fill="rgba(232,160,180,0.15)"/>
      </svg>
    </div>
    <div class="txt">4 כלים בפלטפורמה אחת</div>
  </div>

  <!-- Card 3: Left narrow card -->
  <div class="card card-3">
    <div class="num">3</div>
    <div class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c47a90" stroke-width="2" stroke-linecap="round">
        <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z" fill="rgba(232,160,180,0.15)"/>
      </svg>
    </div>
    <div class="txt">תרגול מעשי — יוצרים ביחד</div>
  </div>

  <!-- CTA -->
  <a class="cta" href="#">
    <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
    לצפייה במצגת
  </a>

  <!-- Footer: logo circles on RIGHT, URL on LEFT -->
  <div class="bottom">
    <div class="logo-group">
      <div class="logo-circles">
        <div class="circle-blue"></div>
        <div class="circle-green"></div>
      </div>
      <span class="logo-name">Learni | לרני</span>
    </div>
    <span class="url">learni.ai</span>
  </div>

</div>
</body>
</html>
