<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מאמר — Learni</title>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@300;400;500;600;700;800&family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #ddd; }

.canvas {
  width: 1080px; height: 1080px;
  position: relative; overflow: hidden;
  background: #f8f5fa;
}
.canvas::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 55% 50% at 20% 25%, rgba(184,169,212,0.22) 0%, transparent 70%),
    radial-gradient(ellipse 50% 55% at 80% 70%, rgba(123,171,212,0.14) 0%, transparent 70%),
    radial-gradient(ellipse 45% 40% at 60% 40%, rgba(125,212,172,0.1) 0%, transparent 70%);
}
.canvas::after {
  content: '';
  position: absolute; inset: 0; z-index: 50;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
}

/* ========== CORNER RIBBON BOOKMARK ========== */
.ribbon-wrapper {
  position: absolute;
  top: 0; left: 0;
  width: 180px; height: 180px;
  z-index: 60;
  overflow: hidden;
  pointer-events: none;
}
.ribbon-fold {
  position: absolute;
  top: 0; left: 0;
  width: 0; height: 0;
  border-style: solid;
  border-width: 45px 45px 0 0;
  border-color: #6b5b8a transparent transparent transparent;
}
.ribbon {
  position: absolute;
  top: 28px; left: -38px;
  width: 220px;
  padding: 12px 0;
  background: linear-gradient(135deg, #9b8bc4 0%, #7b6ba4 50%, #6b5b94 100%);
  color: #fff;
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 28px;
  font-weight: 800;
  text-align: center;
  transform: rotate(-45deg);
  transform-origin: center;
  box-shadow: 0 4px 15px rgba(107,91,138,0.5);
  letter-spacing: 1px;
}
.ribbon::before,
.ribbon::after {
  content: '';
  position: absolute;
  bottom: -6px;
  border-style: solid;
  border-color: #5a4a7a transparent transparent transparent;
}
.ribbon::before {
  right: 0;
  border-width: 6px 6px 0 0;
}
.ribbon::after {
  left: 0;
  border-width: 6px 0 0 6px;
}

/* Category badge */
.cat {
  position: absolute; top: 50px; right: 55px; z-index: 10;
  background: #b8a9d4; color: #fff;
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 28px; font-weight: 700;
  padding: 10px 30px; border-radius: 24px;
  box-shadow: 0 4px 0 rgba(30,58,95,0.06), 0 8px 20px rgba(184,169,212,0.3);
  display: flex; align-items: center; gap: 10px;
}
.cat svg { width: 24px; height: 24px; fill: #fff; }

/* ========== BIG PULL-QUOTE TITLE ========== */
.pull-quote {
  position: absolute;
  top: 120px; right: 55px; left: 55px;
  z-index: 10;
  font-family: 'Playpen Sans Hebrew', cursive;
  line-height: 1.3;
}
.pull-quote .line1 {
  font-size: 54px;
  font-weight: 700;
  color: #1e3a5f;
  display: block;
  margin-bottom: 6px;
}
.pull-quote .line2 {
  font-size: 62px;
  font-weight: 800;
  color: #7b6ba4;
  display: block;
}
/* Accent bar beside the pull-quote */
.pull-quote::before {
  content: '';
  position: absolute;
  top: 5px; right: -30px;
  width: 6px;
  height: 85%;
  background: linear-gradient(180deg, #b8a9d4, #7babd4);
  border-radius: 3px;
}

.subtitle {
  position: absolute; top: 370px; right: 55px; z-index: 10;
  font-family: 'Assistant', sans-serif;
  font-size: 32px; font-weight: 600; color: rgba(30,58,95,0.55);
}

/* ========== INSIGHT PILLS ========== */
.insights {
  position: absolute;
  top: 440px; right: 45px; left: 45px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.insight {
  display: flex;
  align-items: center;
  gap: 20px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-radius: 60px;
  padding: 22px 36px;
  box-shadow: 0 8px 30px rgba(184,169,212,0.18), 0 2px 8px rgba(0,0,0,0.04);
}
.insight-num {
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 42px;
  font-weight: 800;
  color: #b8a9d4;
  flex-shrink: 0;
  min-width: 65px;
  text-align: center;
}
.insight:nth-child(2) .insight-num { color: #7babd4; }
.insight:nth-child(3) .insight-num { color: #7dd4ac; }

.insight-text {
  font-family: 'Assistant', sans-serif;
  font-size: 30px;
  font-weight: 600;
  color: #1e3a5f;
  line-height: 1.5;
}

/* Color accents on pills */
.insight:nth-child(1) { border-right: 5px solid #b8a9d4; }
.insight:nth-child(2) { border-right: 5px solid #7babd4; }
.insight:nth-child(3) { border-right: 5px solid #7dd4ac; }

/* ========== CTA PILL ========== */
.cta {
  position: absolute;
  bottom: 120px;
  left: 50%; transform: translateX(-50%);
  z-index: 10;
  background: linear-gradient(135deg, #9b8bc4, #7b6ba4);
  color: #fff;
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 30px;
  font-weight: 700;
  padding: 16px 50px;
  border-radius: 50px;
  box-shadow: 0 6px 24px rgba(123,107,164,0.4), 0 2px 8px rgba(0,0,0,0.08);
  display: flex; align-items: center; gap: 14px;
}
.cta svg {
  width: 26px; height: 26px; fill: #fff;
  transform: scaleX(-1); /* flip for RTL */
}

/* ========== BOTTOM BAR ========== */
.bottom {
  position: absolute; bottom: 40px; right: 55px; left: 55px;
  z-index: 10; display: flex; align-items: center; justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-circles { position: relative; width: 42px; height: 36px; }
.logo-circles .c1, .logo-circles .c2 { position: absolute; width: 28px; height: 28px; border-radius: 50%; top: 4px; }
.logo-circles .c1 { right: 0; background: #7babd4; opacity: 0.85; }
.logo-circles .c2 { right: 14px; background: #7dd4ac; opacity: 0.85; }
.logo-name { font-family: 'Playpen Sans Hebrew', cursive; font-size: 28px; font-weight: 700; color: #1e3a5f; }
.url { font-family: 'Assistant', sans-serif; font-size: 28px; font-weight: 600; color: rgba(30,58,95,0.55); direction: ltr; }
</style>
</head>
<body>
<div class="canvas">

  <!-- Corner Ribbon Bookmark -->
  <div class="ribbon-wrapper">
    <div class="ribbon-fold"></div>
    <div class="ribbon">חובה לקרוא</div>
  </div>

  <!-- Category -->
  <div class="cat">
    <svg viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
    מאמר
  </div>

  <!-- Big Pull-Quote Title -->
  <div class="pull-quote">
    <span class="line1">למה AI לא יחליף מורים --</span>
    <span class="line2">אבל מורים עם AI יחליפו את כולם</span>
  </div>
  <div class="subtitle">3 תובנות מהשטח</div>

  <!-- Insight Pills -->
  <div class="insights">
    <div class="insight">
      <div class="insight-num">01</div>
      <div class="insight-text">הטכנולוגיה לא מלמדת -- היא משחררת זמן למי שכן</div>
    </div>
    <div class="insight">
      <div class="insight-num">02</div>
      <div class="insight-text">מורה עם AI מכין שיעור ב-20 דקות במקום 3 שעות</div>
    </div>
    <div class="insight">
      <div class="insight-num">03</div>
      <div class="insight-text">התלמידים צריכים מורה שיודע להשתמש ב-AI</div>
    </div>
  </div>

  <!-- CTA -->
  <div class="cta">
    <svg viewBox="0 0 24 24"><path d="M13 7l5 5m0 0l-5 5m5-5H6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    קראו את המאמר המלא
  </div>

  <!-- Bottom -->
  <div class="bottom">
    <div class="logo">
      <div class="logo-circles"><div class="c1"></div><div class="c2"></div></div>
      <div class="logo-name">Learni</div>
    </div>
    <div class="url">learni.ai</div>
  </div>

</div>
</body>
</html>
