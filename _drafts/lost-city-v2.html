<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>העיר האבודה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deepest: #06080e;
  --bg-deep: #0a0e18;
  --bg-dark: #10141f;
  --bg-card: rgba(22,27,42,0.85);
  --bg-surface: #1c2235;
  --cyan: #00e5ff;
  --cyan-dim: #00a0b3;
  --cyan-glow: rgba(0,229,255,0.25);
  --purple: #a07de0;
  --purple-glow: rgba(160,125,224,0.25);
  --pink: #e06090;
  --pink-glow: rgba(224,96,144,0.25);
  --gold: #ffd700;
  --gold-glow: rgba(255,215,0,0.3);
  --green: #20e870;
  --text: #e8ecf4;
  --text-dim: #8a92a8;
  --text-faint: #505870;
  --font: 'Heebo', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--font);background:var(--bg-deepest);color:var(--text);overflow:hidden;height:100vh;width:100vw;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.8s}
.screen.active{opacity:1;pointer-events:all}

/* ===== PARTICLES ===== */
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.particle{position:absolute;border-radius:50%;animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-20vh) scale(1);opacity:0}}

/* ===== SPLASH ===== */
#splash{background:linear-gradient(180deg,#020408 0%,#06080e 30%,#0a1025 100%)}
.city-wrap{position:absolute;bottom:0;left:0;right:0;height:55%;pointer-events:none}
.city-layer{position:absolute;bottom:0;width:100%;transition:transform 0.3s}
.moon{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:80px;height:80px}
.moon-core{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#c4b5e0 0%,#8a6dbf 50%,#5a3d8a 100%)}
.moon-glow{position:absolute;inset:-40%;border-radius:50%;background:radial-gradient(circle,rgba(160,125,224,0.3) 0%,transparent 70%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.6}50%{transform:scale(1.15);opacity:1}}
.fog{position:absolute;bottom:0;left:-10%;width:120%;height:40%;background:linear-gradient(0deg,rgba(10,14,24,0.95) 0%,transparent 100%);animation:fogDrift 20s ease-in-out infinite;pointer-events:none}
@keyframes fogDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(3%)}}

.title-wrap{position:relative;z-index:20;text-align:center;margin-bottom:40px}
#splash .btn{position:relative;z-index:20}
.game-title{font-size:clamp(2.5rem,8vw,4.5rem);font-weight:900;color:var(--cyan);text-shadow:0 0 40px var(--cyan-glow),0 0 80px rgba(0,229,255,0.1);letter-spacing:2px;animation:glitch 8s infinite}
@keyframes glitch{0%,92%,100%{text-shadow:0 0 40px var(--cyan-glow)}93%{text-shadow:-2px 0 var(--pink),2px 0 var(--cyan)}94%{text-shadow:2px 0 var(--pink),-2px 0 var(--cyan)}95%{text-shadow:0 0 40px var(--cyan-glow)}}
.game-subtitle{font-size:1.1rem;color:var(--text-dim);margin-top:8px;font-weight:300}
.btn{background:linear-gradient(135deg,var(--cyan),var(--cyan-dim));color:#000;border:none;padding:14px 36px;border-radius:30px;font-family:var(--font);font-size:1.1rem;font-weight:700;cursor:pointer;transition:all 0.3s;box-shadow:0 0 20px var(--cyan-glow)}
.btn:hover{transform:scale(1.05);box-shadow:0 0 30px var(--cyan-glow)}
.btn:active{transform:scale(0.98)}
.btn-ghost{background:transparent;border:1px solid var(--cyan-dim);color:var(--cyan);box-shadow:none}
.btn-ghost:hover{background:rgba(0,229,255,0.1);box-shadow:0 0 15px var(--cyan-glow)}

/* ===== NAME INPUT ===== */
#name-screen .name-box{background:var(--bg-card);backdrop-filter:blur(20px);border:1px solid rgba(0,229,255,0.15);border-radius:16px;padding:40px;text-align:center;max-width:400px;width:90%}
#name-screen h2{color:var(--cyan);font-size:1.5rem;margin-bottom:8px}
#name-screen p{color:var(--text-dim);font-size:0.9rem;margin-bottom:20px}
#name-screen input{width:100%;background:rgba(0,0,0,0.4);border:1px solid var(--text-faint);border-radius:10px;padding:14px;color:var(--text);font-family:var(--font);font-size:1.1rem;text-align:center;outline:none;transition:border-color 0.3s}
#name-screen input:focus{border-color:var(--cyan)}

/* ===== CINEMATIC ===== */
#cinematic{background:var(--bg-deepest)}
.cine-text{max-width:600px;text-align:center;padding:0 24px}
.cine-line{font-size:1.15rem;line-height:1.8;color:var(--text-dim);opacity:0;transform:translateY(15px);transition:all 0.8s}
.cine-line.visible{opacity:1;transform:translateY(0);color:var(--text)}
.cine-line.highlight{color:var(--cyan);font-weight:500}

/* ===== EXPLORE ===== */
#explore{background:linear-gradient(180deg,#050810 0%,#0a1025 40%,#0d1530 100%);overflow:hidden}
.explore-scene{position:absolute;inset:0}
.location-bg{position:absolute;inset:0;transition:opacity 1s}

/* Street scene */
.street-ground{position:absolute;bottom:0;left:0;right:0;height:35%;background:linear-gradient(0deg,#0d1220 0%,#111830 60%,transparent 100%)}
.street-stones{position:absolute;bottom:5%;left:10%;right:10%;height:8%;display:flex;gap:4px;flex-wrap:wrap;opacity:0.3}
.stone{width:30px;height:12px;background:#1a2040;border-radius:2px}

/* Buildings */
.building{position:absolute;bottom:35%;border-radius:4px 4px 0 0;cursor:pointer;transition:all 0.4s}
.building:hover{filter:brightness(1.3)}
.building .window{position:absolute;width:10px;height:14px;background:rgba(0,229,255,0.08);border-radius:2px;transition:all 0.4s}
.building:hover .window{background:rgba(0,229,255,0.25);box-shadow:0 0 8px var(--cyan-glow)}
.building-label{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);font-size:0.75rem;color:var(--text-faint);white-space:nowrap;opacity:0;transition:opacity 0.3s}
.building:hover .building-label{opacity:1;color:var(--cyan)}

/* Characters in scene */
.npc-figure{position:absolute;cursor:pointer;transition:all 0.4s}
.npc-figure:hover{transform:scale(1.08);filter:drop-shadow(0 0 15px var(--cyan-glow))}
.npc-body{width:30px;height:50px;border-radius:15px 15px 8px 8px;position:relative}
.npc-head{width:22px;height:22px;border-radius:50%;position:absolute;top:-14px;left:50%;transform:translateX(-50%)}
.npc-name{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:0.7rem;white-space:nowrap;opacity:0;transition:opacity 0.3s}
.npc-figure:hover .npc-name{opacity:1}
.npc-indicator{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:0.7rem;color:var(--gold);animation:bounce 1.5s infinite}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}

/* Explore HUD */
.hud{position:absolute;top:0;left:0;right:0;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:100;background:linear-gradient(180deg,rgba(6,8,14,0.9) 0%,transparent 100%)}
.shards-bar{display:flex;gap:6px}
.shard-icon{width:20px;height:28px;opacity:0.2;transition:all 0.5s}
.shard-icon.collected{opacity:1;filter:drop-shadow(0 0 6px var(--gold-glow))}
.shard-icon svg{width:100%;height:100%}
.location-name{font-size:0.85rem;color:var(--text-dim)}
.hud-btns{display:flex;gap:8px}
.hud-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--text-faint);background:rgba(0,0,0,0.4);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;font-size:0.9rem}
.hud-btn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,0.1)}

/* ===== DIALOGUE ===== */
.dialogue-overlay{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity 0.4s}
.dialogue-overlay.active{opacity:1;pointer-events:all}
.dialogue-bg{position:absolute;inset:0;background:rgba(6,8,14,0.7)}
.dialogue-box{position:relative;background:var(--bg-card);backdrop-filter:blur(20px);border-top:1px solid rgba(0,229,255,0.1);padding:20px 24px 24px;max-height:50vh;overflow-y:auto}
.dialogue-speaker{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.speaker-avatar{width:44px;height:44px;border-radius:50%;border:2px solid var(--cyan-dim)}
.speaker-name{font-weight:700;font-size:1rem}
.speaker-mood{font-size:0.8rem;color:var(--text-dim)}
.dialogue-text{font-size:1.05rem;line-height:1.7;margin-bottom:16px;min-height:3em}
.dialogue-text .typed-cursor{display:inline-block;width:2px;height:1.1em;background:var(--cyan);animation:blink 0.8s infinite;vertical-align:text-bottom}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.dialogue-choices{display:flex;flex-direction:column;gap:8px}
.choice-btn{background:rgba(0,229,255,0.05);border:1px solid rgba(0,229,255,0.15);border-radius:10px;padding:12px 16px;color:var(--text);font-family:var(--font);font-size:0.95rem;cursor:pointer;text-align:right;transition:all 0.3s;line-height:1.5}
.choice-btn:hover{background:rgba(0,229,255,0.12);border-color:var(--cyan);transform:translateX(-4px)}

/* Trust meter */
.trust-meter{display:flex;align-items:center;gap:8px;margin-top:8px}
.trust-label{font-size:0.75rem;color:var(--text-faint)}
.trust-bar{width:120px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden}
.trust-fill{height:100%;border-radius:3px;transition:width 0.5s,background 0.5s}
.trust-low{background:var(--pink)}
.trust-mid{background:var(--gold)}
.trust-high{background:var(--green)}

/* Emotion picker */
.emotion-picker{display:flex;gap:12px;margin:12px 0}
.emotion-btn{width:48px;height:48px;border-radius:50%;border:2px solid var(--text-faint);background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.3rem;transition:all 0.3s}
.emotion-btn:hover{transform:scale(1.15);border-color:var(--cyan)}
.emotion-btn.selected{border-color:var(--cyan);background:rgba(0,229,255,0.15);box-shadow:0 0 12px var(--cyan-glow)}

/* ===== REMEMBER THIS ===== */
.remember-toast{position:fixed;top:20%;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);border:1px solid var(--gold);border-radius:12px;padding:14px 28px;font-size:0.95rem;color:var(--gold);opacity:0;pointer-events:none;z-index:500;transition:all 0.6s;white-space:nowrap}
.remember-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== CONFETTI ===== */
.confetti-piece{position:fixed;pointer-events:none;z-index:600}

/* ===== GARDEN ===== */
#garden{background:linear-gradient(180deg,#0a1a10 0%,#0d2018 50%,#081510 100%)}
.garden-content{text-align:center;padding:24px}
.garden-content h2{color:var(--green);font-size:1.5rem;margin-bottom:16px}
.breath-circle{width:120px;height:120px;border-radius:50%;border:2px solid var(--green);margin:30px auto;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--green);transition:all 4s}
.breath-circle.inhale{transform:scale(1.4);background:rgba(32,232,112,0.08)}
.breath-circle.hold{transform:scale(1.4)}
.breath-circle.exhale{transform:scale(1);background:transparent}

/* ===== SHARD REVEAL ===== */
.shard-overlay{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity 0.6s}
.shard-overlay.active{opacity:1;pointer-events:all}
.shard-reveal{text-align:center}
.shard-svg{width:80px;height:120px;filter:drop-shadow(0 0 30px var(--gold-glow));animation:shardFloat 3s ease-in-out infinite}
@keyframes shardFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-15px) rotate(2deg)}}
.shard-name{font-size:1.3rem;color:var(--gold);margin-top:16px;font-weight:700}
.shard-desc{font-size:0.9rem;color:var(--text-dim);margin-top:8px;max-width:280px}

/* ===== MOBILE ===== */
@media(max-width:600px){
  .game-title{font-size:2.2rem}
  .dialogue-box{padding:16px}
  .building-label{font-size:0.65rem}
}
</style>
</head>
<body>

<!-- ========== SPLASH ========== -->
<div id="splash" class="screen active">
  <div class="city-wrap">
    <svg class="city-layer" style="opacity:0.3" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice">
      <rect x="50" y="120" width="40" height="180" rx="2" fill="#0d1220"/>
      <rect x="100" y="80" width="55" height="220" rx="2" fill="#0c1020"/>
      <rect x="170" y="140" width="35" height="160" rx="2" fill="#0d1220"/>
      <rect x="220" y="60" width="45" height="240" rx="2" fill="#0b0f1e"/>
      <rect x="280" y="100" width="60" height="200" rx="2" fill="#0d1220"/>
      <rect x="360" y="130" width="40" height="170" rx="2" fill="#0c1020"/>
      <rect x="420" y="70" width="50" height="230" rx="2" fill="#0b0f1e"/>
      <rect x="490" y="110" width="45" height="190" rx="2" fill="#0d1220"/>
      <rect x="550" y="90" width="55" height="210" rx="2" fill="#0c1020"/>
      <rect x="620" y="150" width="35" height="150" rx="2" fill="#0d1220"/>
      <rect x="670" y="65" width="50" height="235" rx="2" fill="#0b0f1e"/>
      <rect x="740" y="120" width="40" height="180" rx="2" fill="#0d1220"/>
      <rect x="800" y="85" width="60" height="215" rx="2" fill="#0c1020"/>
      <rect x="880" y="140" width="45" height="160" rx="2" fill="#0d1220"/>
      <rect x="940" y="100" width="50" height="200" rx="2" fill="#0b0f1e"/>
      <rect x="1010" y="75" width="40" height="225" rx="2" fill="#0d1220"/>
      <rect x="1070" y="130" width="55" height="170" rx="2" fill="#0c1020"/>
    </svg>
    <svg class="city-layer" style="opacity:0.5" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice">
      <rect x="30" y="130" width="50" height="170" rx="2" fill="#111830"/>
      <rect x="90" y="80" width="65" height="220" rx="2" fill="#131a35"/>
      <rect x="230" y="60" width="70" height="240" rx="2" fill="#151c38"/>
      <rect x="320" y="100" width="55" height="200" rx="2" fill="#131a35"/>
      <rect x="395" y="75" width="60" height="225" rx="2" fill="#111830"/>
      <rect x="530" y="90" width="70" height="210" rx="2" fill="#131a35"/>
      <rect x="690" y="55" width="65" height="245" rx="2" fill="#151c38"/>
      <rect x="850" y="130" width="45" height="170" rx="2" fill="#111830"/>
      <rect x="990" y="110" width="50" height="190" rx="2" fill="#131a35"/>
      <!-- Glowing windows -->
      <rect x="103" y="100" width="6" height="8" rx="1" fill="#00e5ff" opacity="0.15"><animate attributeName="opacity" values="0.15;0.4;0.15" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="243" y="80" width="6" height="8" rx="1" fill="#e06090" opacity="0.1"><animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="700" y="75" width="6" height="8" rx="1" fill="#00e5ff" opacity="0.2"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/></rect>
      <rect x="545" y="110" width="6" height="8" rx="1" fill="#a07de0" opacity="0.15"><animate attributeName="opacity" values="0.15;0.35;0.15" dur="3.5s" repeatCount="indefinite"/></rect>
      <rect x="345" y="120" width="6" height="8" rx="1" fill="#00e5ff" opacity="0.1"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite"/></rect>
    </svg>
    <svg class="city-layer" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice">
      <rect x="0" y="150" width="80" height="150" rx="2" fill="#181f38"/>
      <rect x="95" y="90" width="75" height="210" rx="2" fill="#1a2240"/>
      <rect x="185" y="120" width="60" height="180" rx="2" fill="#181f38"/>
      <rect x="260" y="70" width="90" height="230" rx="2" fill="#1c2545"/>

      <rect x="640" y="65" width="85" height="235" rx="2" fill="#1a2240"/>

      <rect x="830" y="80" width="75" height="220" rx="2" fill="#1c2545"/>

      <rect x="1100" y="120" width="100" height="180" rx="2" fill="#1c2545"/>
      <!-- Foreground windows -->
      <rect x="110" y="110" width="8" height="10" rx="1" fill="#00e5ff" opacity="0.2"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="130" y="110" width="8" height="10" rx="1" fill="#00e5ff" opacity="0.1"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite" begin="1s"/></rect>
      <rect x="110" y="135" width="8" height="10" rx="1" fill="#e06090" opacity="0.15"><animate attributeName="opacity" values="0.15;0.45;0.15" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="280" y="90" width="8" height="10" rx="1" fill="#a07de0" opacity="0.2"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite"/></rect>
      <rect x="300" y="90" width="8" height="10" rx="1" fill="#00e5ff" opacity="0.1"><animate attributeName="opacity" values="0.1;0.35;0.1" dur="4.5s" repeatCount="indefinite"/></rect>
      <rect x="660" y="85" width="8" height="10" rx="1" fill="#00e5ff" opacity="0.25"><animate attributeName="opacity" values="0.25;0.6;0.25" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="680" y="85" width="8" height="10" rx="1" fill="#e06090" opacity="0.1"><animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite" begin="2s"/></rect>
      <rect x="660" y="110" width="8" height="10" rx="1" fill="#a07de0" opacity="0.15"><animate attributeName="opacity" values="0.15;0.4;0.15" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="850" y="100" width="8" height="10" rx="1" fill="#00e5ff" opacity="0.2"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite" begin="0.5s"/></rect>
      <rect x="1020" y="115" width="8" height="10" rx="1" fill="#a07de0" opacity="0.15"><animate attributeName="opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite"/></rect>
    </svg>
    <div class="fog"></div>
  </div>
  <div class="moon"><div class="moon-core"></div><div class="moon-glow"></div></div>
  <div class="particles" id="splash-particles"></div>
  <div class="title-wrap">
    <h1 class="game-title">העיר האבודה</h1>
    <p class="game-subtitle">לפעמים, כדי למצוא את הדרך — צריך ללכת לאיבוד</p>
  </div>
  <button class="btn" onclick="goTo('name-screen')">כניסה לעיר</button>
</div>

<!-- ========== NAME ========== -->
<div id="name-screen" class="screen">
  <div class="name-box">
    <h2>מי את/ה?</h2>
    <p>הכנס/י שם. יכול להיות אמיתי, יכול להיות בדוי.</p>
    <input type="text" id="player-name" placeholder="השם שלך..." maxlength="20" autofocus>
    <br><br>
    <button class="btn" onclick="startGame()">יאללה</button>
  </div>
</div>

<!-- ========== CINEMATIC ========== -->
<div id="cinematic" class="screen">
  <div class="cine-text" id="cine-text"></div>
</div>

<!-- ========== EXPLORE ========== -->
<div id="explore" class="screen">
  <!-- HUD -->
  <div class="hud">
    <div class="shards-bar" id="shards-hud"></div>
    <div class="location-name" id="loc-name"></div>

<script>
// ============================================================
// GAME STATE
// ============================================================
const state = {
  playerName: '',
  currentScreen: 'splash',
  npcs: {
    noa: { trust: 20, met: false, talked: 0, questDone: false, remember: [] },
    ido: { trust: 10, met: false, talked: 0, questDone: false, remember: [] },
    dana: { trust: 0, met: false, talked: 0, questDone: false, remember: [] }
  },
  shards: [false, false, false, false, false],
  shardNames: ['שבר חיבור', 'שבר הקשבה', 'שבר דחף', 'שבר כוח', 'שבר בחירה'],
  shardDescs: [
    'נולד כשמישהו בחר להישאר',
    'נולד כשמישהו באמת שמע',
    'נולד כשמישהו לא ויתר',
    'נולד כשמישהו האמין בעצמו',
    'נולד כשמישהו בחר בחירה יקרה'

  soundOn: true,
  dialogueActive: false,
  currentNPC: null,
  dialogueStep: 0
};

// ============================================================
// AUDIO ENGINE (Procedural Web Audio API)
// ============================================================
let audioCtx;
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTone(freq, duration=0.15, type='sine', vol=0.1) {
  if (!audioCtx || !state.soundOn) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playClick() { playTone(800, 0.08, 'sine', 0.05); }
function playSuccess() {
  playTone(523, 0.15, 'sine', 0.08);
  setTimeout(() => playTone(659, 0.15, 'sine', 0.08), 100);
  setTimeout(() => playTone(784, 0.3, 'sine', 0.1), 200);
}
function playReveal() {
  playTone(440, 0.3, 'triangle', 0.06);
  setTimeout(() => playTone(554, 0.3, 'triangle', 0.06), 200);
  setTimeout(() => playTone(659, 0.5, 'triangle', 0.08), 400);
}
function playTrust(up) {
  if (up) { playTone(600, 0.1, 'sine', 0.04); setTimeout(() => playTone(800, 0.15, 'sine', 0.06), 80); }
  else { playTone(400, 0.1, 'sine', 0.04); setTimeout(() => playTone(300, 0.15, 'sine', 0.06), 80); }
}

// Ambient drone
let ambientNode;
function startAmbient() {
  if (!audioCtx || ambientNode) return;
  ambientNode = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  ambientNode.type = 'sawtooth';
  ambientNode.frequency.value = 55;
  filter.type = 'lowpass';
  filter.frequency.value = 200;
  gain.gain.value = 0.015;
  ambientNode.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  ambientNode.start();
}

function toggleSound() {
  state.soundOn = !state.soundOn;
  document.getElementById('sound-btn').style.opacity = state.soundOn ? 1 : 0.3;
}

// ============================================================
// PARTICLES
// ============================================================
function createParticles(containerId, count=25, colors=['var(--cyan)','var(--purple)','var(--pink)']) {
  const c = document.getElementById(containerId);
  if (!c) return;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 2 + Math.random() * 4;
    const color = colors[Math.floor(Math.random() * colors.length)];
    p.style.cssText = `width:${size}px;height:${size}px;background:${color};left:${Math.random()*100}%;animation-duration:${8+Math.random()*15}s;animation-delay:${Math.random()*10}s;opacity:${0.3+Math.random()*0.5}`;
    c.appendChild(p);
  }
}

// ============================================================
// SCREEN TRANSITIONS
// ============================================================
function goTo(id) {
  try { initAudio(); } catch(e) {}
  try { playClick(); } catch(e) {}
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  setTimeout(() => {
    const el = document.getElementById(id);
    if (el) {
      el.classList.add('active');
      state.currentScreen = id;
    }
  }, 400);
}

// ============================================================
// CONFETTI
// ============================================================
function confetti(x, y, count=30) {
  const colors = ['#00e5ff','#a07de0','#e06090','#ffd700','#20e870'];
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 4 + Math.random() * 6;
    el.style.cssText = `width:${size}px;height:${size}px;background:${colors[i%colors.length]};border-radius:${Math.random()>0.5?'50%':'1px'};left:${x}px;top:${y}px;position:fixed;z-index:600`;
    document.body.appendChild(el);
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const dist = 60 + Math.random() * 120;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 50;
    el.animate([
      { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) scale(0) rotate(${360+Math.random()*360}deg)`, opacity: 0 }
    ], { duration: 600 + Math.random() * 400, easing: 'cubic-bezier(0,0.8,0.3,1)' })
    .onfinish = () => el.remove();
  }
}

// ============================================================
// REMEMBER THIS
// ============================================================
function rememberThis(text) {
  const t = document.getElementById('remember-toast');
  t.textContent = text;
  t.classList.add('show');
  playReveal();
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ============================================================
// SHARD REVEAL
// ============================================================
function collectShard(index) {
  if (state.shards[index]) return;
  state.shards[index] = true;
  document.getElementById('shard-name').textContent = state.shardNames[index];
  document.getElementById('shard-desc').textContent = state.shardDescs[index];
  document.getElementById('shard-overlay').classList.add('active');
  playSuccess();
  updateShardsHUD();
  confetti(window.innerWidth/2, window.innerHeight/2, 40);
}
function closeShard() {
  document.getElementById('shard-overlay').classList.remove('active');
}
function updateShardsHUD() {
  const hud = document.getElementById('shards-hud');
  hud.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('div');
    s.className = 'shard-icon' + (state.shards[i] ? ' collected' : '');
    s.innerHTML = '<svg viewBox="0 0 20 28"><polygon points="10,0 18,10 15,28 5,28 2,10" fill="'+(state.shards[i]?'#ffd700':'#303850')+'" stroke="'+(state.shards[i]?'#ffd700':'#404860')+'" stroke-width="0.5"/></svg>';
    hud.appendChild(s);
  }
}

// ============================================================
// DIALOGUE ENGINE
// ============================================================
function talkTo(npcId) {
  initAudio();
  playClick();
  state.currentNPC = npcId;
  const npc = state.npcs[npcId];

  let startNode;
  if (!npc.met) {
    npc.met = true;
    startNode = 'intro';
  } else if (npc.talked > 3 && !npc.questDone) {
    startNode = npcId + '_quest';
  } else {
    startNode = 'intro'; // simplified for now
  }

  showDialogueNode(npcId, startNode);
}

function showDialogueNode(npcId, nodeId) {
  const tree = DIALOGUES[npcId];
  if (!tree || !tree[nodeId]) { closeDialogue(); return; }

  const node = tree[nodeId];
  const overlay = document.getElementById('dialogue');
  overlay.classList.add('active');
  state.dialogueActive = true;

  // Speaker info
  document.getElementById('speaker-name').textContent = node.speaker;
  document.getElementById('speaker-name').style.color = node.color;
  document.getElementById('speaker-mood').textContent = node.mood;
  document.getElementById('speaker-avatar').style.background = `linear-gradient(135deg, ${node.color}, ${node.color}88)`;

  // Trust meter
  const npc = state.npcs[npcId];
  const trustEl = document.getElementById('trust-meter');
  trustEl.style.display = 'flex';
  updateTrustBar(npcId);

  // Type text with pauses
  typeDialogue(node.text, () => {
    showChoices(npcId, node.choices);
  });
}

function typeDialogue(text, onDone) {
  const el = document.getElementById('dialogue-text');
  const choicesEl = document.getElementById('dialogue-choices');
  choicesEl.innerHTML = '';
  el.innerHTML = '';

  const parts = text.split(/\{(pause|longpause)\}/);
  let fullText = parts.filter(p => p !== 'pause' && p !== 'longpause').join('');
  let charIndex = 0;
  let pauseAt = [];
  let currentPos = 0;

  for (const part of parts) {
    if (part === 'pause') { pauseAt.push({ at: currentPos, dur: 500 }); }
    else if (part === 'longpause') { pauseAt.push({ at: currentPos, dur: 1200 }); }
    else { currentPos += part.length; }
  }

  function typeNext() {
    if (charIndex >= fullText.length) {
      el.innerHTML = fullText;
      if (onDone) onDone();
      return;
    }

    const pause = pauseAt.find(p => p.at === charIndex);
    if (pause) {
      pauseAt = pauseAt.filter(p => p !== pause);
      setTimeout(typeNext, pause.dur);
      return;
    }

    charIndex++;
    el.innerHTML = fullText.substring(0, charIndex) + '<span class="typed-cursor"></span>';
    if (charIndex % 3 === 0) playTone(200 + Math.random() * 100, 0.02, 'sine', 0.01);
    setTimeout(typeNext, 30 + Math.random() * 20);
  }

  // Click to skip
  el.onclick = () => {
    charIndex = fullText.length;
    el.innerHTML = fullText;
    el.onclick = null;
    if (onDone) onDone();
  };

  typeNext();
}

function showChoices(npcId, choices) {
  const el = document.getElementById('dialogue-choices');
  el.innerHTML = '';

  choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice.text;
    btn.style.opacity = '0';
    btn.style.transform = 'translateX(20px)';

    btn.onclick = () => {
      playClick();

      // Trust change
      if (choice.trust) {
        state.npcs[npcId].trust = Math.max(0, Math.min(100, state.npcs[npcId].trust + choice.trust));
        playTrust(choice.trust > 0);
        updateTrustBar(npcId);
      }

      state.npcs[npcId].talked++;

      // Remember
      if (choice.remember) {
        state.npcs[npcId].remember.push(choice.remember);
        setTimeout(() => rememberThis(choice.remember), 800);
      }

      // Action
      if (choice.action) handleAction(choice.action);

      // Next node
      if (choice.next === 'close') {
        closeDialogue();
      } else {
        showDialogueNode(npcId, choice.next);
      }
    };

    el.appendChild(btn);

    setTimeout(() => {
      btn.style.transition = 'all 0.4s';
      btn.style.opacity = '1';
      btn.style.transform = 'translateX(0)';
    }, 200 + i * 150);
  });
}

function updateTrustBar(npcId) {
  const trust = state.npcs[npcId].trust;
  const fill = document.getElementById('trust-fill');
  fill.style.width = trust + '%';
  fill.className = 'trust-fill ' + (trust < 30 ? 'trust-low' : trust < 60 ? 'trust-mid' : 'trust-high');
}

function closeDialogue() {
  document.getElementById('dialogue').classList.remove('active');
  state.dialogueActive = false;
  state.currentNPC = null;
}

// ============================================================
// ACTIONS
// ============================================================
function handleAction(action) {
  switch(action) {
    case 'unlock_market_quest':
      state.discoveries.push('market_quest');
      // Make market building glow
      document.querySelectorAll('.building')[1].style.boxShadow = '0 0 20px var(--cyan-glow)';
      break;
    case 'get_key':
      state.discoveries.push('has_key');
      collectShard(0); // Connection shard - earned through building trust
      break;
    case 'unlock_library':
      state.discoveries.push('library_open');
      document.querySelectorAll('.building')[2].style.boxShadow = '0 0 20px var(--purple-glow)';
      break;
    case 'ido_wants_proof':
      state.discoveries.push('ido_proof');
      break;
  }
}

function enterBuilding(id) {
  playClick();
  switch(id) {
    case 'tower':
      rememberThis('מגדל השמירה... מישהו היה כאן לאחרונה. יש אבק על הכל חוץ מהחלון.');
      break;
    case 'market':
      if (state.discoveries.includes('market_quest')) {
        rememberThis('הרצפה זוהרת. משהו מסתתר מתחת לאבנים.');
        if (state.npcs.noa.trust >= 30) {
          setTimeout(() => collectShard(1), 2000); // Listening shard
        }
      } else {
        rememberThis('השוק הישן. דוכנים ריקים, קורי עכביש. פעם היה כאן שוקק חיים.');
      }
      break;
    case 'library':
      if (state.discoveries.includes('library_open') || state.discoveries.includes('has_key')) {
        rememberThis('הדלת נפתחת. ריח של ספרים ישנים. על השולחן — מפה של העיר.');
        setTimeout(() => collectShard(2), 2000); // Drive shard
      } else {
        rememberThis('הדלת נעולה. המנעול ישן אבל חזק. צריך מפתח.');
      }
      break;
    case 'alley':
      rememberThis('הסמטה חשוכה. צלילים מוזרים. מישהי יושבת שם בפינה... דנה?');
      if (!state.npcs.dana.met) {
        document.getElementById('npc-dana').style.display = 'block';
      }
      break;
  }
}

// ============================================================
// GARDEN
// ============================================================
function openGarden() {
  playClick();
  goTo('garden');
  startBreathing();
  createParticles('garden-particles', 15, ['var(--green)', '#40c070', '#60e090']);
}
function closeGarden() {
  playClick();
  goTo('explore');
}
function startBreathing() {
  const circle = document.getElementById('breath-circle');
  const phases = [
    { text: 'שאפו', class: 'inhale', dur: 4000 },
    { text: 'החזיקו', class: 'hold', dur: 4000 },
    { text: 'נשפו', class: 'exhale', dur: 6000 },
    { text: 'המתינו', class: 'hold', dur: 2000 }
  ];
  let i = 0;
  function next() {
    if (state.currentScreen !== 'garden') return;
    const phase = phases[i % phases.length];
    circle.textContent = phase.text;
    circle.className = 'breath-circle ' + phase.class;
    i++;
    setTimeout(next, phase.dur);
  }
  next();
}

// ============================================================
// CINEMATIC INTRO
// ============================================================
function startGame() {
  const name = document.getElementById('player-name').value.trim() || 'נווד';
  state.playerName = name;
  try { initAudio(); } catch(e) {}
  goTo('cinematic');

  const lines = [
    { text: 'עיר מסתורית.', delay: 0 },
    { text: 'פעם היא היתה מלאה באנשים, בצחוק, בחיים.', delay: 2000 },
    { text: 'יום אחד — הכל שתק.', delay: 4500 },
    { text: 'העיר נשארה. האנשים נעלמו.', delay: 6500 },
    { text: '', delay: 8500 },
    { text: `ואז הגעת. ${name}.`, delay: 9500, highlight: true },
    { text: 'בלי סיבה. בלי שליחות.', delay: 11500 },
    { text: 'פשוט הגעת.', delay: 13500, highlight: true },
  ];

  const container = document.getElementById('cine-text');
  container.innerHTML = '';

  lines.forEach(line => {
    const p = document.createElement('p');
    p.className = 'cine-line' + (line.highlight ? ' highlight' : '');
    p.textContent = line.text;
    container.appendChild(p);
    setTimeout(() => {
      p.classList.add('visible');
      if (line.text) playTone(300 + Math.random() * 200, 0.1, 'triangle', 0.03);
    }, line.delay);
  });

  // Continue button after last line
  setTimeout(() => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = 'להיכנס לעיר';
    btn.style.opacity = '0';
    btn.style.transition = 'opacity 1s';
    btn.onclick = () => {
      goTo('explore');
      document.getElementById('loc-name').textContent = 'רחוב ראשי';
      updateShardsHUD();
      createParticles('explore-particles', 20);
      startAmbient();
    };
    container.appendChild(document.createElement('br'));
    container.appendChild(btn);
    setTimeout(() => btn.style.opacity = '1', 200);
  }, 15500);
}

// Parallax on mouse move
document.getElementById('splash').addEventListener('mousemove', e => {
  const x = (e.clientX / window.innerWidth - 0.5) * 20;
  const y = (e.clientY / window.innerHeight - 0.5) * 10;
  const layers = document.querySelectorAll('.city-layer');
  layers[0] && (layers[0].style.transform = `translateX(${x*0.3}px) translateY(${y*0.2}px)`);
  layers[1] && (layers[1].style.transform = `translateX(${x*0.6}px) translateY(${y*0.3}px)`);
  layers[2] && (layers[2].style.transform = `translateX(${x}px) translateY(${y*0.5}px)`);
});
