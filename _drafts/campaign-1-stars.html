<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קמפיין 1 — 8.9 מתוך 10 ממליצים</title>
    <link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Heebo:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Heebo', sans-serif;
        }

        .creative {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: #0a1a1f;
        }

        .bg-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.55) 0%,
                rgba(0,0,0,0.1) 35%,
                rgba(0,0,0,0.1) 65%,
                rgba(0,0,0,0.6) 100%
            );
        }

        .content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px 50px;
            z-index: 2;
        }

        /* Header */
        .header {
            text-align: center;
        }

        .headline {
            font-family: 'Karantina', sans-serif;
            font-size: 120px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            direction: ltr;
            unicode-bidi: bidi-override;
        }

        .headline .number {
            color: #ffd700;
            font-size: 140px;
        }

        /* Footer */
        .footer {
            text-align: center;
        }

        .tagline {
            font-family: 'Heebo', sans-serif;
            font-size: 42px;
            font-weight: 300;
            color: rgba(255,255,255,0.9);
            line-height: 1.4;
            text-shadow: 0 2px 12px rgba(0,0,0,0.5);
            margin-bottom: 24px;
        }

        .cta-badge {
            display: inline-block;
            background: linear-gradient(135deg, #0d9488, #14b8a6);
            color: #fff;
            font-family: 'Heebo', sans-serif;
            font-size: 28px;
            font-weight: 700;
            padding: 14px 48px;
            border-radius: 50px;
            letter-spacing: 0.5px;
        }

        /* Logo */
        .logo {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.5;
        }

        .logo svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        .logo span {
            color: #fff;
            font-size: 13px;
            font-family: 'Heebo', sans-serif;
        }

        /* Print/export helper */
        @media print {
            body { background: none; }
            .creative { box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="creative" id="creative">
        <!-- Background: Pomelli Photoshoot stars image -->
        <img class="bg-image" src="../.playwright-mcp/pomelli-extracted/pomelli-asset-3.png" alt="9 gold stars rating">

        <div class="overlay"></div>

        <div class="content">
            <!-- Headline — fixed RTL -->
            <div class="header">
                <div class="headline">
                    <span class="number">8.9</span> מתוך 10 ממליצים
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <div class="tagline">
                    ההדרכה המעשית ביותר למורים בישראל
                </div>
                <div class="cta-badge">
                    הצטרפו למחזור הבא
                </div>
            </div>
        </div>

        <!-- Claude Code logo -->
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <span>Claude Code</span>
        </div>
    </div>
</body>
</html>
