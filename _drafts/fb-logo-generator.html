<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>לוגו לרני — פייסבוק</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&family=Caveat:wght@400;500;600;700&family=Karantina:wght@300;400;700&family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
<style id="font-force">
  @font-face { font-family: 'Karantina'; font-display: block; }
  .karantina-preload { font-family: 'Karantina', cursive; font-size: 40px; position: absolute; left: -9999px; }
  .amatic-preload { font-family: 'Amatic SC', cursive; font-size: 40px; position: absolute; left: -9999px; }
</style>
<style>
  body { margin: 0; background: #f3f4f6; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Heebo', sans-serif; }
  h2 { color: #374151; margin-bottom: 8px; }
  p.note { color: #6b7280; font-size: 14px; margin-top: 0; }
  .preview { margin: 20px; }
  canvas { border: 1px solid #e5e7eb; border-radius: 12px; }
  button { margin: 12px 8px; padding: 12px 28px; background: #0d9488; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-family: 'Heebo', sans-serif; cursor: pointer; }
  button:hover { background: #0f766e; }
  .sizes { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .size-box { text-align: center; }
  .size-box p { font-size: 13px; color: #6b7280; margin: 4px 0; }
</style>
</head>
<body>

<h2>לוגו לרני — לדף העסקי בפייסבוק</h2>
<p class="note">תמונת פרופיל (ריבועית) + תמונת כיסוי</p>

<div class="sizes">
  <div class="size-box">
    <p>תמונת פרופיל — 500x500</p>
    <canvas id="profileCanvas" width="500" height="500"></canvas>
    <br>
    <button onclick="download('profileCanvas', 'lerani-fb-profile.png')">הורדה</button>
  </div>
  <div class="size-box">
    <p>תמונת כיסוי — 820x312</p>
    <canvas id="coverCanvas" width="820" height="312"></canvas>
    <br>
    <button onclick="download('coverCanvas', 'lerani-fb-cover.png')">הורדה</button>
  </div>
</div>

<script>
function drawProfile() {
  const c = document.getElementById('profileCanvas');
  const ctx = c.getContext('2d');
  const W = 500, H = 500;

  // Background — white with subtle gradient
  const bg = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 350);
  bg.addColorStop(0, '#ffffff');
  bg.addColorStop(1, '#f0fdf9');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Venn circles
  const cx1 = 200, cx2 = 300, cy = 195, r = 110;

  // Left circle (blue)
  const grad1 = ctx.createRadialGradient(cx1 - 20, cy - 20, 10, cx1, cy, r);
  grad1.addColorStop(0, '#a8c8f0');
  grad1.addColorStop(0.5, '#7babd4');
  grad1.addColorStop(1, '#5a93c0');
  ctx.globalAlpha = 0.8;
  ctx.beginPath(); ctx.arc(cx1, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = grad1; ctx.fill();

  // Right circle (green)
  const grad2 = ctx.createRadialGradient(cx2 + 20, cy - 20, 10, cx2, cy, r);
  grad2.addColorStop(0, '#a8e6cf');
  grad2.addColorStop(0.5, '#7dd4ac');
  grad2.addColorStop(1, '#5abf92');
  ctx.beginPath(); ctx.arc(cx2, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = grad2; ctx.fill();

  // Overlap
  ctx.globalAlpha = 0.3;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx2, cy, r, 0, Math.PI * 2); ctx.clip();
  const gradO = ctx.createLinearGradient(cx1-r, cy-r, cx2+r, cy+r);
  gradO.addColorStop(0, '#7babd4');
  gradO.addColorStop(1, '#7dd4ac');
  ctx.beginPath(); ctx.arc(cx1, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = gradO; ctx.fill();
  ctx.restore();

  // Circle outlines
  ctx.globalAlpha = 0.3;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx1, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx2, cy, r, 0, Math.PI * 2); ctx.stroke();

  // Sparkles
  ctx.globalAlpha = 0.45;
  drawSparkle(ctx, 250, 70, 8, '#9b7ed8');
  drawSparkle(ctx, 120, 140, 6, '#a8c8f0');
  drawSparkle(ctx, 380, 130, 6, '#a8e6cf');

  // Text: Learni
  ctx.globalAlpha = 1;
  ctx.font = "700 72px 'Caveat', cursive";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#1e3a5f';
  ctx.shadowColor = 'rgba(255,255,255,0.6)';
  ctx.shadowBlur = 6;
  ctx.fillText('Learni', W/2, cy - 5);
  ctx.shadowBlur = 0;

  // לרני in handwriting font
  ctx.font = '700 38px ' + (window.handFont || 'Karantina') + ', cursive';
  ctx.fillStyle = '#4a6a8a';
  ctx.globalAlpha = 0.85;
  ctx.fillText('לרני', W/2, cy + 30);

  // Subtitle Hebrew — colored per word
  ctx.font = '400 22px Heebo, sans-serif';
  ctx.globalAlpha = 0.9;
  ctx.textAlign = 'center';
  const tagY = 340;
  // Measure to center the whole line
  const parts = [
    { text: 'הגשמת חלומות', color: '#9b7ed8' },
    { text: '  ·  ', color: '#aaa' },
    { text: 'בינה מלאכותית', color: '#5a93c0' },
    { text: '  ·  ', color: '#aaa' },
    { text: 'חינוך', color: '#5abf92' }
  ];
  let totalW = parts.reduce((sum, p) => sum + ctx.measureText(p.text).width, 0);
  let curX = W/2 + totalW/2; // RTL — start from right
  ctx.textAlign = 'right';
  parts.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, curX, tagY);
    curX -= ctx.measureText(p.text).width;
  });
  ctx.textAlign = 'center';

  // Decorative line
  ctx.globalAlpha = 0.5;
  const lineGrad = ctx.createLinearGradient(130, 0, 370, 0);
  lineGrad.addColorStop(0, '#7babd4');
  lineGrad.addColorStop(1, '#7dd4ac');
  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(130, 365); ctx.lineTo(370, 365); ctx.stroke();

  // Name: Mital Peleg
  ctx.globalAlpha = 1;
  ctx.font = '700 26px Heebo, sans-serif';
  ctx.fillStyle = '#1e3a5f';
  ctx.fillText('מיטל פלג', W/2, 415);

  // Role
  ctx.font = '400 18px Heebo, sans-serif';
  ctx.fillStyle = '#6b9e8a';
  ctx.fillText('מומחית לחדשנות חינוכית ובינה מלאכותית', W/2, 450);
}

function drawCover() {
  const c = document.getElementById('coverCanvas');
  const ctx = c.getContext('2d');
  const W = 820, H = 312;

  // Light gradient background
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#f0fdf9');
  bg.addColorStop(0.5, '#e8f7f3');
  bg.addColorStop(1, '#eef6fc');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Subtle pattern dots
  ctx.globalAlpha = 0.08;
  for (let x = 0; x < W; x += 30) {
    for (let y = 0; y < H; y += 30) {
      ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = '#7babd4'; ctx.fill();
    }
  }

  // --- Big Learni logo in center ---
  const logoX = W/2, logoY = 115, r = 90;
  const cx1 = logoX - 50, cx2 = logoX + 50;

  ctx.globalAlpha = 0.75;
  const g1 = ctx.createRadialGradient(cx1, logoY, 10, cx1, logoY, r);
  g1.addColorStop(0, '#a8c8f0'); g1.addColorStop(1, '#5a93c0');
  ctx.beginPath(); ctx.arc(cx1, logoY, r, 0, Math.PI*2); ctx.fillStyle = g1; ctx.fill();

  const g2 = ctx.createRadialGradient(cx2, logoY, 10, cx2, logoY, r);
  g2.addColorStop(0, '#a8e6cf'); g2.addColorStop(1, '#5abf92');
  ctx.beginPath(); ctx.arc(cx2, logoY, r, 0, Math.PI*2); ctx.fillStyle = g2; ctx.fill();

  // Circle outlines
  ctx.globalAlpha = 0.4;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx1, logoY, r, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx2, logoY, r, 0, Math.PI*2); ctx.stroke();

  // Sparkles
  ctx.globalAlpha = 0.4;
  drawSparkle(ctx, logoX, logoY - r - 15, 7, '#9b7ed8');
  drawSparkle(ctx, cx1 - r + 10, logoY - 30, 5, '#a8c8f0');
  drawSparkle(ctx, cx2 + r - 10, logoY - 25, 5, '#a8e6cf');

  // Learni text
  ctx.globalAlpha = 1;
  ctx.font = "700 56px 'Caveat', cursive";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#1e3a5f';
  ctx.shadowColor = 'rgba(255,255,255,0.8)'; ctx.shadowBlur = 6;
  ctx.fillText('Learni', logoX, logoY - 5);
  ctx.shadowBlur = 0;

  // לרני in handwriting font
  ctx.font = '700 30px ' + (window.handFont || 'Karantina') + ', cursive';
  ctx.fillStyle = '#4a6a8a';
  ctx.globalAlpha = 0.85;
  ctx.fillText('לרני', logoX, logoY + 25);

  // Tagline under logo — colored
  ctx.font = '400 18px Heebo, sans-serif';
  ctx.globalAlpha = 0.9;
  const cTagY = logoY + r + 30;
  const cParts = [
    { text: 'הגשמת חלומות', color: '#9b7ed8' },
    { text: '  ·  ', color: '#aaa' },
    { text: 'בינה מלאכותית', color: '#5a93c0' },
    { text: '  ·  ', color: '#aaa' },
    { text: 'חינוך', color: '#5abf92' }
  ];
  let cTotalW = cParts.reduce((sum, p) => sum + ctx.measureText(p.text).width, 0);
  let cCurX = logoX + cTotalW/2;
  ctx.textAlign = 'right';
  cParts.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, cCurX, cTagY);
    cCurX -= ctx.measureText(p.text).width;
  });
  ctx.textAlign = 'center';

  // Decorative line
  ctx.globalAlpha = 0.4;
  const lineGrad = ctx.createLinearGradient(logoX - 140, 0, logoX + 140, 0);
  lineGrad.addColorStop(0, '#7babd4');
  lineGrad.addColorStop(1, '#7dd4ac');
  ctx.strokeStyle = lineGrad; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(logoX - 140, logoY + r + 48); ctx.lineTo(logoX + 140, logoY + r + 48); ctx.stroke();

  // Name + role — smaller, at bottom
  ctx.globalAlpha = 1;
  ctx.font = '700 20px Heebo, sans-serif';
  ctx.fillStyle = '#1e3a5f';
  ctx.fillText('מיטל פלג', logoX, H - 30);

  ctx.font = '400 15px Heebo, sans-serif';
  ctx.fillStyle = '#0d9488';
  ctx.fillText('מומחית לחדשנות חינוכית', logoX, H - 10);
}

function drawSparkle(ctx, x, y, size, color) {
  ctx.save();

  // Outer halo — soft radial glow
  const haloR = size * 3.5;
  const halo = ctx.createRadialGradient(x, y, size * 0.3, x, y, haloR);
  halo.addColorStop(0, color);
  halo.addColorStop(0.3, color + '55');
  halo.addColorStop(0.6, color + '22');
  halo.addColorStop(1, 'transparent');
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(x, y, haloR, 0, Math.PI * 2);
  ctx.fill();

  // Light rays — 6 thin lines radiating out
  ctx.globalAlpha = 0.2;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const angle = (i * Math.PI) / 3;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(angle) * size * 0.5, y + Math.sin(angle) * size * 0.5);
    ctx.lineTo(x + Math.cos(angle) * size * 2.5, y + Math.sin(angle) * size * 2.5);
    ctx.stroke();
  }

  // Main 4-point star — elegant thin shape
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - size * 1.2);
  ctx.quadraticCurveTo(x + size * 0.12, y - size * 0.12, x + size * 1.2, y);
  ctx.quadraticCurveTo(x + size * 0.12, y + size * 0.12, x, y + size * 1.2);
  ctx.quadraticCurveTo(x - size * 0.12, y + size * 0.12, x - size * 1.2, y);
  ctx.quadraticCurveTo(x - size * 0.12, y - size * 0.12, x, y - size * 1.2);
  ctx.closePath();
  ctx.fill();

  // Bright white center
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(x, y, size * 0.25, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function download(canvasId, filename) {
  const canvas = document.getElementById(canvasId);
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// Load fonts then draw
async function init() {
  // Force preload both handwriting fonts
  const d1 = document.createElement('div');
  d1.className = 'karantina-preload';
  d1.textContent = 'לרני טעינה';
  document.body.appendChild(d1);

  const d2 = document.createElement('div');
  d2.className = 'amatic-preload';
  d2.textContent = 'לרני טעינה';
  document.body.appendChild(d2);

  // Wait generously for fonts
  await new Promise(r => setTimeout(r, 1500));
  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 500));

  // Check which font loaded
  const testCtx = document.createElement('canvas').getContext('2d');
  testCtx.font = '700 40px Karantina';
  const karantinaW = testCtx.measureText('לרני').width;
  testCtx.font = '700 40px sans-serif';
  const sansW = testCtx.measureText('לרני').width;
  window.handFont = (karantinaW !== sansW) ? 'Karantina' : 'Amatic SC';
  console.log('Using handwriting font:', window.handFont);

  drawProfile();
  drawCover();
  d1.remove(); d2.remove();
}
init();
</script>

</body>
</html>
