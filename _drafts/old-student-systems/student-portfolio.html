<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>תיק תלמיד דיגיטלי — אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../js/ai-service.css">
<style>
@font-face{font-family:'Shuneet3';src:url('fonts/Shuneet3 Medium.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Shuneet3 Bold';src:url('fonts/Shuneet3 Square Bold.ttf') format('truetype');font-weight:700;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F5F0E8;--card:#FFFDF8;--primary:#7AADAD;--primary-dark:#5E9191;--primary-light:#96C5C5;
  --accent:#D4A574;--accent-dark:#B8885A;--text:#4A3F35;--muted:#8B7E74;--border:#E8DDD0;
  --success:#6A9F6A;--success-bg:#E8F3E8;--warn:#C4944A;--warn-bg:#FDF3E4;
  --danger:#C0605A;--danger-bg:#FAE8E6;--radius:20px;
  --sage:#A8B5A0;--dusty-rose:#C9A0A0;--warm-gold:#D4A574;
  --shadow-sm:0 2px 8px rgba(74,63,53,.05),0 1px 3px rgba(74,63,53,.04);
  --shadow-md:0 4px 20px rgba(74,63,53,.07),0 2px 6px rgba(74,63,53,.04);
  --shadow-lg:0 12px 40px rgba(74,63,53,.09),0 4px 12px rgba(74,63,53,.04);
}
body{font-family:Heebo,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:500px;background:linear-gradient(180deg,#FFF8F0 0%,#F5F0E8 100%);z-index:-2;pointer-events:none}
body::after{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(74,63,53,.03) 1px,transparent 1px);background-size:24px 24px;z-index:-1;pointer-events:none}
h1,h2,h3,h4{font-family:'Shuneet3 Bold','Shuneet3',Heebo,sans-serif}

/* ===== LOGIN SCREEN ===== */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;animation:fadeIn .5s ease}
.login-card{background:var(--card);border-radius:28px;border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:48px 44px;max-width:520px;width:100%;text-align:center;animation:slideUp .5s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.login-card .logo{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:20px;border:3px solid var(--border)}
.login-card h1{font-size:1.3rem;margin-bottom:6px;font-weight:800;font-family:Heebo}
.login-card .subtitle{color:var(--muted);font-size:.88rem;margin-bottom:32px}
.role-cards{display:flex;gap:14px;margin-bottom:28px;flex-wrap:wrap;justify-content:center}
.role-card{flex:1;min-width:130px;max-width:160px;padding:22px 14px 18px;border-radius:18px;border:2px solid var(--border);cursor:pointer;transition:.25s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.role-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.role-card.selected{border-width:3px}
.role-card.role-teacher{background:rgba(212,165,116,.08)}
.role-card.role-teacher.selected{border-color:var(--warm-gold);background:rgba(212,165,116,.16)}
.role-card.role-counselor{background:rgba(201,160,160,.08)}
.role-card.role-counselor.selected{border-color:var(--dusty-rose);background:rgba(201,160,160,.16)}
.role-card.role-principal{background:rgba(122,173,173,.08)}
.role-card.role-principal.selected{border-color:var(--primary);background:rgba(122,173,173,.16)}
.role-card svg{width:32px;height:32px;flex-shrink:0}
.role-card .role-name{font-size:.9rem;font-weight:700}
.login-name-area{margin-bottom:24px;text-align:right;display:none}
.login-name-area.visible{display:block;animation:fadeIn .3s ease}
.login-name-area label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
.login-name-area select{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:14px;font-family:Heebo;font-size:.92rem;color:var(--text);background:var(--card);cursor:pointer;outline:none;transition:border-color .2s}
.login-name-area select:focus{border-color:var(--primary)}
.login-btn{width:100%;padding:14px;border:none;border-radius:14px;background:var(--primary);color:#fff;font-family:Heebo;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s;opacity:.5;pointer-events:none}
.login-btn.ready{opacity:1;pointer-events:auto}
.login-btn.ready:hover{background:var(--primary-dark)}

/* ===== HEADER ===== */
.header{background:linear-gradient(180deg, rgba(122,173,173,.18) 0%, #FFFDF8 100%);color:var(--text);padding:0 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:50;min-height:64px;border-bottom:none;box-shadow:0 2px 12px rgba(74,63,53,.06)}
.header::before{content:'';position:absolute;bottom:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--primary),var(--primary-light),var(--primary),var(--primary-dark));pointer-events:none}
.header-right{display:flex;align-items:center;gap:14px}
.header-right img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.header-right h1{font-size:1.05rem;font-weight:800;font-family:Heebo;letter-spacing:-.2px}
.back-link,.switch-user{color:var(--muted);text-decoration:none;font-size:.82rem;font-weight:500;transition:color .2s;display:flex;align-items:center;gap:4px;cursor:pointer;background:none;border:none;font-family:Heebo}
.back-link:hover,.switch-user:hover{color:var(--primary-dark)}
.header-left{display:flex;align-items:center;gap:12px}
.role-badge{background:var(--primary);color:#fff;padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:600}

/* ===== MAIN APP ===== */
.app{display:none;min-height:100vh}
.main-content{max-width:1300px;margin:0 auto;padding:20px}

/* ===== SUMMARY CARDS ===== */
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.s-card{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow-sm);border-top:4px solid var(--primary);text-align:center;transition:transform .15s}
.s-card:hover{transform:translateY(-2px)}
.s-card .s-label{font-size:.75rem;color:var(--muted);font-weight:500}
.s-card .s-value{font-size:1.8rem;font-weight:800;margin:4px 0;color:var(--primary-dark)}
.s-card .s-detail{font-size:.72rem;color:var(--muted)}

/* ===== SEARCH & FILTER ===== */
.search-bar{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:200px;padding:12px 18px;border:1px solid var(--border);border-radius:14px;font-family:Heebo;font-size:.92rem;background:var(--card);outline:none;transition:border-color .2s,box-shadow .2s}
.search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(122,173,173,.15)}
.filter-select{padding:12px 18px;border:1px solid var(--border);border-radius:14px;font-family:Heebo;font-size:.92rem;background:var(--card);color:var(--text);cursor:pointer;outline:none;transition:border-color .2s}
.filter-select:focus{border-color:var(--primary)}
.search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-wrapper{position:relative;flex:1;min-width:200px}

/* ===== STUDENT GRID ===== */
.students-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.student-card{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.student-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--primary-light)}
.student-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:#fff;flex-shrink:0}
.avatar-male{background:linear-gradient(135deg,var(--primary),var(--primary-dark))}
.avatar-female{background:linear-gradient(135deg,var(--dusty-rose),#B88888)}
.student-card .st-name{font-size:.92rem;font-weight:700}
.student-card .st-class{font-size:.78rem;color:var(--muted);font-weight:500}
.student-card .st-megama{font-size:.7rem;color:var(--accent);font-weight:600}
.student-card .st-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.mini-badge{padding:2px 8px;border-radius:8px;font-size:.65rem;font-weight:600}
.badge-tachi{background:rgba(122,173,173,.15);color:var(--primary-dark)}
.badge-grades{background:rgba(106,159,106,.15);color:var(--success)}
.count-label{font-size:.82rem;color:var(--muted);margin-bottom:12px;font-weight:500}

/* ===== STUDENT PROFILE ===== */
.profile-view{display:none;animation:fadeIn .3s ease}
.profile-header{background:var(--card);border-radius:20px;padding:28px;box-shadow:var(--shadow-sm);margin-bottom:20px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.profile-avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;color:#fff;flex-shrink:0}
.profile-info{flex:1}
.profile-info h2{font-size:1.4rem;font-weight:800;margin-bottom:4px}
.profile-info .meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.profile-info .meta span{display:flex;align-items:center;gap:4px}
.profile-back{display:flex;align-items:center;gap:6px;color:var(--primary);font-weight:600;cursor:pointer;background:none;border:none;font-family:Heebo;font-size:.9rem;padding:8px 16px;border-radius:12px;transition:background .2s}
.profile-back:hover{background:rgba(122,173,173,.1)}

/* ===== TABS ===== */
.tabs{display:flex;gap:3px;margin-bottom:20px;background:var(--card);border-radius:16px;padding:4px;box-shadow:var(--shadow-sm);overflow-x:auto}
.tab-btn{flex:1;padding:12px 8px;border:none;background:transparent;cursor:pointer;border-radius:12px;font-family:Heebo;font-size:.82rem;font-weight:600;color:var(--muted);transition:all .2s;white-space:nowrap;min-width:90px}
.tab-btn.active{background:var(--primary);color:#fff}
.tab-btn:hover:not(.active){background:rgba(122,173,173,.1)}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .3s ease}

/* ===== SECTIONS ===== */
.section{background:var(--card);border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.section h3{font-size:1.05rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--text)}
.section h3 svg{width:20px;height:20px;color:var(--primary)}

/* ===== INFO GRID ===== */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.info-item{display:flex;flex-direction:column;gap:2px}
.info-label{font-size:.75rem;color:var(--muted);font-weight:500}
.info-value{font-size:.9rem;font-weight:600}

/* ===== GRADES TABLE ===== */
.grades-table{width:100%;border-collapse:collapse;font-size:.85rem}
.grades-table th{background:rgba(122,173,173,.08);padding:10px 12px;text-align:right;font-weight:600;color:var(--text);font-size:.78rem;position:sticky;top:0}
.grades-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.grades-table tr:hover td{background:rgba(122,173,173,.04)}
.grade-cell{font-weight:700;text-align:center;border-radius:8px;padding:4px 10px;display:inline-block;min-width:40px}
.grade-green{background:var(--success-bg);color:var(--success)}
.grade-yellow{background:var(--warn-bg);color:var(--warn)}
.grade-red{background:var(--danger-bg);color:var(--danger)}
.grade-na{color:var(--muted);font-weight:400}
.avg-row td{background:rgba(122,173,173,.08)!important;font-weight:700}

.grade-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.grade-summary .gs-card{background:var(--card);border-radius:14px;padding:16px;text-align:center;border:1px solid var(--border)}
.gs-card .gs-label{font-size:.75rem;color:var(--muted)}
.gs-card .gs-value{font-size:1.6rem;font-weight:800}

/* ===== TACHI ===== */
.tachi-section .tachi-row{display:flex;gap:8px;margin-bottom:6px;align-items:baseline}
.tachi-section .t-label{font-size:.78rem;color:var(--muted);font-weight:600;min-width:100px}
.tachi-section .t-value{font-size:.85rem}
.goal-item{background:rgba(122,173,173,.08);border-radius:10px;padding:8px 14px;margin:4px 0;font-size:.85rem}
.support-item{background:rgba(168,181,160,.12);border-radius:10px;padding:8px 14px;margin:4px 0;font-size:.85rem}
.emo-item{background:rgba(201,160,160,.12);border-radius:10px;padding:8px 14px;margin:4px 0;font-size:.85rem}

/* ===== REPORTS TIMELINE ===== */
.timeline{position:relative;padding-right:24px}
.timeline::before{content:'';position:absolute;right:8px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:20px;padding-right:28px}
.timeline-item::before{content:'';position:absolute;right:-2px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid var(--card);z-index:1}
.timeline-date{font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.timeline-title{font-size:.9rem;font-weight:700;margin-bottom:4px}
.timeline-files{display:flex;flex-wrap:wrap;gap:6px}
.timeline-file{display:flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(122,173,173,.08);border-radius:8px;font-size:.75rem;color:var(--primary-dark);font-weight:500}
.timeline-link{display:flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(106,159,106,.1);border-radius:8px;font-size:.75rem;color:var(--success);text-decoration:none;font-weight:500;transition:background .2s}
.timeline-link:hover{background:rgba(106,159,106,.2)}

/* ===== COUNSELOR STUDENT VIEW ===== */
.counselor-header{display:flex;align-items:center;gap:14px;padding:18px 20px;background:linear-gradient(135deg,rgba(201,160,160,.1),rgba(122,173,173,.08));border-radius:16px;margin-bottom:20px;border:1px solid var(--border)}
.counselor-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--dusty-rose),#B88888);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;font-weight:700;flex-shrink:0}
.counselor-info{flex:1}
.counselor-info .c-name{font-size:.95rem;font-weight:700;color:var(--text)}
.counselor-info .c-role{font-size:.78rem;color:var(--muted)}
.bg-card{background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--border);margin-bottom:16px}
.bg-card h4{font-size:.88rem;font-weight:700;color:var(--primary-dark);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.bg-card h4 svg{width:18px;height:18px;flex-shrink:0}
.bg-row{display:flex;gap:12px;margin-bottom:14px}
.bg-tag{padding:10px 16px;border-radius:12px;flex:1;text-align:center}
.bg-tag .bg-label{font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.bg-tag .bg-value{font-size:.88rem;font-weight:600}
.bg-tag.strengths{background:rgba(122,173,173,.08)}
.bg-tag.strengths .bg-value{color:var(--primary-dark)}
.bg-tag.challenges{background:rgba(201,160,160,.08)}
.bg-tag.challenges .bg-value{color:var(--dusty-rose)}
.bg-goals{list-style:none;padding:0;margin:0}
.bg-goals li{padding:8px 14px;margin:4px 0;border-radius:10px;font-size:.85rem;display:flex;align-items:baseline;gap:8px}
.bg-goals li::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px}
.bg-goals.learning li{background:rgba(122,173,173,.06)}
.bg-goals.learning li::before{background:var(--primary)}
.bg-goals.emotional li{background:rgba(201,160,160,.06)}
.bg-goals.emotional li::before{background:var(--dusty-rose)}
.dev-timeline{position:relative;padding-right:24px;margin-top:8px}
.dev-timeline::before{content:'';position:absolute;right:8px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--primary),var(--border))}
.dev-item{position:relative;margin-bottom:18px;padding-right:30px}
.dev-item::before{content:'';position:absolute;right:-3px;top:6px;width:14px;height:14px;border-radius:50%;border:3px solid var(--card);z-index:1}
.dev-item.status-progress::before{background:var(--success)}
.dev-item.status-stable::before{background:var(--primary)}
.dev-item.status-attention::before{background:var(--warn)}
.dev-item .dev-month{font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:2px;display:flex;align-items:center;gap:8px}
.dev-status{font-size:.68rem;padding:2px 8px;border-radius:6px;font-weight:600}
.dev-status.progress{background:var(--success-bg);color:var(--success)}
.dev-status.stable{background:rgba(122,173,173,.15);color:var(--primary-dark)}
.dev-status.attention{background:var(--warn-bg);color:var(--warn)}
.dev-item .dev-text{font-size:.85rem;color:var(--text);line-height:1.7;margin-top:4px}
.dev-empty{text-align:center;padding:24px;color:var(--muted);font-size:.85rem;background:rgba(122,173,173,.04);border-radius:12px;border:1px dashed var(--border)}
.docs-section{margin-top:8px}
.docs-section summary{font-size:.85rem;font-weight:700;color:var(--muted);cursor:pointer;padding:10px 0;list-style:none;display:flex;align-items:center;gap:6px}
.docs-section summary::before{content:'';width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-right:6px solid var(--muted);transition:transform .2s}
.docs-section[open] summary::before{transform:rotate(-90deg)}

/* ===== NOTES ===== */
.note-form{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;padding:20px;background:rgba(122,173,173,.05);border-radius:16px;border:1px dashed var(--border)}
.note-form textarea{width:100%;min-height:80px;padding:12px;border:1px solid var(--border);border-radius:12px;font-family:Heebo;font-size:.88rem;resize:vertical;outline:none;transition:border-color .2s}
.note-form textarea:focus{border-color:var(--primary)}
.note-form-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note-form select{padding:10px 14px;border:1px solid var(--border);border-radius:12px;font-family:Heebo;font-size:.85rem;background:var(--card);cursor:pointer;outline:none}
.save-note-btn{padding:10px 24px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-family:Heebo;font-size:.88rem;font-weight:600;cursor:pointer;transition:.2s}
.save-note-btn:hover{background:var(--primary-dark)}
.notes-list{display:flex;flex-direction:column;gap:10px}
.note-item{background:var(--card);border-radius:14px;padding:16px;border:1px solid var(--border)}
.note-item .note-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.note-item .note-author{font-size:.82rem;font-weight:700;color:var(--primary-dark)}
.note-item .note-time{font-size:.72rem;color:var(--muted)}
.note-item .note-text{font-size:.88rem;line-height:1.7}
.note-item .note-role-tag{font-size:.68rem;padding:2px 8px;border-radius:6px;background:rgba(212,165,116,.15);color:var(--accent-dark);font-weight:600}
.delete-note{background:none;border:none;cursor:pointer;color:var(--danger);font-size:.75rem;padding:4px 8px;border-radius:6px;transition:background .2s}
.delete-note:hover{background:var(--danger-bg)}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .summary-bar{grid-template-columns:repeat(2,1fr)}
  .students-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .profile-header{flex-direction:column;text-align:center}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab-btn{min-width:80px;font-size:.75rem;padding:10px 6px}
  .info-grid{grid-template-columns:1fr}
  .grade-summary{grid-template-columns:1fr}
  .header{padding:0 16px}
  .main-content{padding:12px}
  .login-card{padding:32px 24px}
}

/* ===== PRINT ===== */
@media print{
  .header,.tabs,.search-bar,.login-screen,.profile-back,.note-form,.switch-user,.summary-bar{display:none!important}
  .app{display:block!important}
  .profile-view{display:block!important}
  .tab-content{display:block!important;page-break-inside:avoid}
  .section{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}
  body{background:#fff}
  body::before,body::after{display:none}
}

/* Empty state */
.empty-state{text-align:center;padding:48px 24px;color:var(--muted)}
.empty-state svg{width:48px;height:48px;margin-bottom:16px;opacity:.4}
.empty-state p{font-size:.92rem}
</style>
</head>
<body>

<!-- ==================== LOGIN SCREEN ==================== -->
<div class="login-screen" id="loginScreen">
<div class="login-card">
  <img src="logo-ort.png" alt="אורט בית הערבה" class="logo">

  "היזמי נועם":{"class":"י1","teacher":"רעיה יצחקי","text":"מעגל משפחתי: הורים גרושים, 4 אחים ואחיות, נועם בן הזקונים. מתגורר בנוקדים.\nאבא - מתגורר בירושלים.\nבעיות נפשיות במשפחה מצד האבא. דוד שסובל מסכיזופרניה. האבא סבל בעבר מדיכאון קליני מאובחן ומצבים נפשיים מורכבים. לדברי האם, לא תיפקד כשהילדים היו קטנים.\nכיום - קשר טוב עם האבא. נמצא אצל האבא לא באופן מסודר. הילד בוחר.\nאבא: כתיבה ותוכן, תסריטאות; אמא: מורה\nבי\"ס קודם: דרך אבות\nבעיית ביקור סדיר: יש אבחון קשב וריכוז - אבל לא מצליח לקחת כדורים.\nהכדורים עוררו בעיות נפשיות, לא יכול ליטול כדורים.\nיש ועדת השמה אין בתיק\nקב\"ס מעורב (ציפי)\nמעגל חברתי-רגשי: בכיתה ו', טיפול לניהול עצמי, טיפול במשחק. 18 מפגשים. מאז הוא לא מטופל. היה ניסיון לטיפול פסיכולוגי שהוא לא הסכים להגיע אליו."},
  "חכמון  שובל":{"class":"י1","teacher":"רעיה יצחקי","text":"מעגל משפחתי: גרושים + 7\nתאום של תבל\nישנו אח בכיתה ו' הסובל מחרדות קשות ומטופל בהדסה, לעיתים קרובות האב מגיע לישון בבית כדי לעזור דבר שמבלבל את הילדים.\nהאם נתמכת ביטוח לאומי סביב נכות ומבקשת עזרה.\nהאב מתגורר אצל אמו והילדים מתראים איתו באופן קבוע.\nשיתוף פעולה עם הורים: האם והאב\nמצב כלכלי: קשה\nבי\"ס קודם: ניסוי ארגנטינה\nאבחון: כיתה רגילה\nאבחון פסיכודידקטי מגיל 12\nהמלצות: להוסיף זמן להבחנות, מקום שקט.\nהוראה מתקנת\nמעגל חברתי-רגשי: חברותי מאוד, יש חברים אחה\"צ.\nהיסטוריה טיפול רגשי: אין"},
  "חן דוד":{"class":"י1","teacher":"רעיה יצחקי","text":"מעגל משפחתי: ינון וחני נשואים + 5\nיש קשר טוב עם האחים, עוזר בבית\nקשר טוב עם בני דודים מבית שמש\nמצב כלכלי: קשה\nמעגל לימודי: בהתחלה היה לו טוב בביה\"ס בכיתה ז, בכיתה ח התחיל להיות לו קשה.\nילד טוב ואהוב?\nאין המלצה\nבי\"ס קודם: עתיד דביר\nכיתה מקדמת\nאבחון: יש\nגורם מטפל: לא עושה חיסונים\nהיה בטיפול קבוצתי בחווה ברמת רחל"},
  "ישראל דניאל":{"class":"י1","teacher":"רעיה יצחקי","text":"מעגל משפחתי: נשואים + 4\nהיחסים עם האב מורכבים. הוא בן דוד של נתנאל לגמי, האם לא מסכימה לדניאל להסתובב עם נתנאל.\nמצב כלכלי: טוב\nבי\"ס קודם: דנמרק\nרגילה\nאבחון: יש אין בתיק\nיש אין בתיק\nדיסקלציה, אימפולסיביות\nמעגל חברתי-רגשי: בעיות רגשיות מורכבות.\nבעבר חבר הכה אותו ומאז החליט שהוא לא מוכן לכתוב.\nלא יודע קרוא וכתוב זקוק לסייעת.\nלעיתים נראה שאין הבנת סיטואציות."},
  "לוי טליה":{"class":"י1","teacher":"רעיה יצחקי","text":"מעגל משפחתי: הורים גרושים. 2 אחיות, טליה הבכורה. מתגוררים בארנונה. האב מתגורר בהר חומה. מאבקי משמורת בין ההורים שהתגרשו כשטליה הייתה בת 9 השפיעו מאוד על טליה.\nקשיים מול האם, האב אינו מעורב.\nזקוקה ליחס חם ואוהב ולתחושת העצמה וקשר.\nמצב כלכלי: סביר\nבי\"ס קודם: קדמה\nאבחון: יש אבחון פסיכודידקטי ופסיכולוגי בתיק\nקבלת סמכות מורית: יש אבחון פסיכודידקטי מעודכן.\nקשיי קשב וריכוז\nתיק פלילי: הייתה קצינת מבחן בעבר"},
  "עזרא רבקה":{"class":"י1","teacher":"רעיה יצחקי","text":"מעגל משפחתי: אם אלמנה מגדלת 6 ילדים.\nאביה נפטר בפתאומיות כשרבקה היתה בכיתה ז', עברה משבר שהתבטא בחוסר מובטיבציה. רבקה בת הזקונים. קשר מאוד קרוב עם האח מיכאל בן 28. האמא מגדלת לבד את הילדים. מתגוררת ברמת בית שמש.\nאמא עו\"ד בבית משפט מלענייני משפחה.\nרבקה למדה בחינוך דתי וחזרה בשאלה, סביב הדת יש ויכוחים בבית.\nדמות משמעותית: אחיה מיכאל\nבי\"ס קודם: אהבת ישראל\nהיסטוריה טיפול רגשי: היתה מטופלת סביב מות האב בפסיכודרמה."},
  "צלח איתמר":{"class":"י1","teacher":"רעיה יצחקי","text":"מעגל משפחתי: גרושה + 2\nאמא שלו כוכבת רשת\nשיתוף פעולה עם הורים: אמא"},
  "קידר אוריאן":{"class":"י1","teacher":"רעיה יצחקי","text":"מעגל משפחתי: הורים נשואים. שלושה אחים גדולים (אחות נשואה גרה ליד, לא מסתדרת איתה; אח בן 24 בשיטור קהילתי; אחות בת 16 לומדת בתיכון \"דרך\")\n\nאבא - היה בקבע היום נהג מונית, אמא - מנהלת צהרונים\nמצב כלכלי: טוב מאוד\nמעגל לימודי: הפסיקה להגיע לביה\"ס בכיתה ח' בעקבות אירועים חברתיים חריגים\nבי\"ס קודם: ביה\"ס המסורתי\nאבחון: אין"},
  "קצב עילאי":{"class":"י1","teacher":"רעיה יצחקי","text":"מעגל משפחתי: נשואים + 5 האם אחות של רויטל אמיר\nמצב כלכלי: טוב מאוד\nמעגל לימודי: הפסיק להגיע לביה\"ס בכיתה ח' בעקבות אירועים חברתיים חריגים\nבי\"ס קודם: ביה\"ס המסורתי\nאבחון: אין ועדת השמה\nאבחון פסיכודיאגנוסטי\nהרווחה המליצה על אבחון בעקבות קושי בויסות רגשי, התנהגויות סיכוניות הכוללות שוטטות בשעות מאוחרות והשתתפות בקטטות.\nלבקש את האבחון הפסיכודידקטי שנעשה בשפח מעלה אדומים. בו עלתה אינטלגנציה תקנית וקשיי קשב אשר אינם מאפשרים לו להביא את הפוטנציאל למימוש. המלצה להדרכת הורים, ליווי פסיכולוגי ופסיכיאטרי.\nעילאי נוהג להתכנס ולא ליצור קשרים מתוך חוסר אמונה בזולת. הוא נמצא בהתדרדרות תפקודית ונפשית. הוא חסר אונים ומעדיף לא להתמודד עם העולם. הוא נותר בודד במצוקתו ואינו מתקשר אותה.\nאם לא יצליח בביהס שלנו ישנה המלצה למסגרת חוץ ביתית ותהליך שיקומי טיפולי.\nגורם מטפל: זקוק לרטלין לא לוקח ולכן לא מגיע להישגים\nטיפול תרופתי נוסף לברר?\nרווחה במעלה אדומים 0544944435\nבעיית ביקור סדיר: לא למד בכיתה ח\nמעגל חברתי-רגשי: עבר התעללות מצד ילדים כשהיה בכיתה ז', בכיתה ח' החלה התדרדרות בעקבות המקרה, חוסר מוטיבציה, התדרדרות התנהגותית ולימודית, דכאון.\nהיה בקשרים טובים עם היועצת והמחנך, לקראת סוף ח' נשר מהלימודים\nהיסטוריה טיפול רגשי: היה מטופל דרך השפ\"ח לא תמיד התחבר למטפלים, ועכשיו לא היה רצף סובל מחרדות חברתיות ולימודיות."},
  "ריכנשטיין מאיר":{"class":"י1","teacher":"רעיה יצחקי","text":"מעגל משפחתי: לא היו נשואים, יש 3 ילדים, תאומים בני 22, אחד עם פוסט טראומה מטופל.\nההורים נפרדו כשמאיר היה בן 6, פרידה טראומתית היו מעורבים משטרה וצווי בית משפט. האב התנגד ללימודי מאיר בביה\"ס הניסוי וגרם לו לא ללכת תקופה בשל העימות. לבסוף חזר לביה\"ס וסיים את החטיבה. לא המשיך בתיכון משום שסגנונו הפתוח של ביה\"ס אינו מתאים לאישיות של מאיר.\nבי\"ס קודם: ביה\"ס הניסוי\nאבחון: ועדת השמה יש צריך טופס 14\nאבחון פסיכודיאגנוסטי שלדברי האם אינו משקף את התקופה כיום\nהרווחה ערכה את האבחון בשל קשיים רגשיים והתנהגותיים, קשיי קשב.\nקושי בויסות רגשי, אימפולסיבי, אין חוויות הוריות בשל סיפור חייו, יש צמצום והכחשה. בתחושה שלו הוא שווה ערך יותר מאחרים כפיצוי על החוויה הפנימית חש נחיתות. מאיר נראה כנער חביב שעולמו ריק מצוקתו הפנימית משפיע על תפקודו היומיומי, זקוק למעטפת רגשית ולימודית.\nמעגל חברתי-רגשי: מעגל חברתי טוב יש לו חברים מביה\"ס הקודם.\nהיסטוריה טיפול רגשי: היה מטופל דרך השפ\"ח לא תמיד התחבר למטפלים, ועכשיו לא היה רצף סובל מחרדות חברתיות ולימודיות."},
  "שמעיה שובל":{"class":"י1","teacher":"רעיה יצחקי","text":"מעגל משפחתי: גרושים + 4\nמצב כלכלי: טוב\nבי\"ס קודם: קדמה\nאבחון: איו\nבעיית ביקור סדיר: קיימת, מנחם מלווה"},
  "אמינוף נהוראי":{"class":"י2","teacher":"אופירה מלכה","text":"מעגל משפחתי: גרושה + 1\nאבא לא בתמונה מבחירה. לפני 3 שנים פגישה אחרונה שלהם.\nהסב היה הדמות המשמעותית בחייו של נהוראי,\nהסב נפטר באפריל ואז החלה התדרדרות במצבו הנפשי של נהוראי, הפסיק להגיע לביה\"ס, נשאר בבית.\nיש לו חברים בבית הערבה, האמא לא מכירה.\nרמה שכלית גבולית\nשיתוף פעולה עם הורים: אמא\nבי\"ס קודם: טדי קולק\nמקדמת\nאבחון: דוח פסיכו-דיאגנוסטי\nמגיל 12, רמה תפקודית קוגנטיבית בתחום הגבולי.\nהמלצות:\n\n1. פסיכותרפיה אישית – פסיכולוג לטווח ארוך\n2. הערכה פסיכיאטרית – מומלץ להמשיך\n3. בדיקה בתחום הכתיבה והוראה מתקנת"},
  "בן סעדון נתאי":{"class":"י2","teacher":"אופירה מלכה","text":"מעגל משפחתי: אילן ומוריה נשואים + 6\nמצב כלכלי: קשה\nמעגל לימודי: היה בביה\"ס גוונים\nתיכון חדש הר חומה מקדמת, המורה הקודמת סיפרה כי הנער נבון ואינטלגנט יש לו יכולת הבנה ואפשר לגייס אותו, אך לאור בעיית ביקור סדיר וחוסר מוטיבציה ללמידה לא התקיימה למידה משמעותית ורצף.\nבי\"ס קודם: ביה\"ס דרך – תיכון חדש בהר חומה\nכיתה מקדמת\nבעיית ביקור סדיר: קיים\nמעגל חברתי-רגשי: אוהב לצאת עם חברים\nהיסטוריה טיפול רגשי: אין"},
  "ונסו עמית":{"class":"י2","teacher":"אופירה מלכה","text":"מעגל משפחתי: האב מגדל את עמית בשיתוף פעולה עם הסבתא מצד האם\nלעמית אח תאום מתגורר באופן קבוע אצל הסבתא מצד האם בקרית יובל\n, שמו דניאל.\n\nשהה באתנחתא כשנה בקירוב.\n\nמהוסטל בית אריאל בחסות חוק נוער, נמסר כי הם חושבים שעמית הוא פוסט אשפוזי, הוציאו צו הרחקה נגד האם לאחר איומים. לאחר ועדת הורות בה איימה.\nהאב גם הוא מאובחן אבל קצת יותר שפוי, עמית מסתובב הרבה, מדבר עם עצמו, מדבר לא קשור, הולך לאנשים שאינו מכיר הביתה.\nהאב עושה דברים כנגד החלטות הרווחה ובית המשפט.\nבבית השנטי הוא לא התקבל בשל חוסר התאמה.\nכשנודע שההוסטל עומד להסגר התנהגותו המפריע של עמית הפכה להיות קיצונית.\nמעו\"ד שירן של עמית ונסו נמסר:\nמלווה את עמית מאז אתנחתא.\nנער מקסים, משלם מחיר שלא באשמתו, סגירת ההוסטל מאוד השפיעה עליו, חיפש מקום משפחה, הציעו לו את בית הצייר אך הוא ואמו התנגדו בטענה שהמשמעת שם קשה מדי.\nמעגל לימודי: התעניין בבגרויות אך הרמה מאוד נמוכה לא הצליח לצמצם פערים\nאבחון: אין אבחונים, ועדות, פסיכיאטר\nאין ועדות השמה\nגורם מטפל: המלצה למעקב פסיכיאטרי צמוד בשל הגנטיקה שלו.\nסבתא מזל יהודה 052-5008330\nלשכת קרית יובל תום אלמוג עו\"סית מלווה 0509212210\nצו פיקוח והשגחה"},
  "ליאל ינאר":{"class":"י2","teacher":"אופירה מלכה","text":"מעגל משפחתי: גרושים + 4\nאח גדול גר אצל האב, אחות בת 19 יצאה מהבית והייתה באומנה\nאח בן 13?\nבי\"ס קודם: אלונים\nהצליח שם יותר מאחרים ולכן עבר אלינו\nאבחון: אין בתיק כלום\nגורם מטפל: לשכת גילה, הלל\nהיסטוריה טיפול רגשי: מי מהמטפלת שלו?"},
  "כהן שני":{"class":"י2","teacher":"אופירה מלכה","text":"מעגל משפחתי: נשואים + 5\nהיו חרדים וחזרו בשאלה\nהאם מתמודדת נפש\nבי\"ס קודם: עמית דתי מעלה אדומים\nהיסטוריה טיפול רגשי: דרך מוסיקה\nהשתמשו איתה בתכנית התנהגותית"},
  "לסרי איתי":{"class":"י2","teacher":"אופירה מלכה","text":"מעגל משפחתי: הורים גרושים + 3, עוד אח ואחות (איתי מיקום 2 במשפחה).\nאח בן 10 חולה במחלת דושן, מחלה סופנית. אחות גדולה, לא בקשר טוב איתה.\nשיתוף פעולה עם הורים: אמא\nמצב כלכלי: סביר\nבי\"ס קודם: נוער טכנולוגי בן יקיר\nגורם מטפל: איתנים, מחלקה פסיכיאטרית\nפרוטיאזין לשינה וסרוקרל להרגעה, אין חרדות.\nהיסטוריה טיפול רגשי: ממתין לטיפול במרכז מיטל\nנפגש עם העוסית פעם בחודש בבנימין\nמטופל כרגע באיתנים במחלקה הפסיכיאטרית, נשלח דוח\nממתינים לפסיכיאטר מהקופה כדי לעבור לטיפול קבוע"},
  "מועלם תהל":{"class":"י2","teacher":"אופירה מלכה","text":"מעגל משפחתי: גרושים + 3"},
  "מימוני משה":{"class":"י2","teacher":"אופירה מלכה","text":"מעגל משפחתי: גרושים + 9\n\nמצב כלכלי מאוד קשה\nמצב כלכלי: מאוד קשה\nשיתוף פעולה עם הורים\n\n\nדמות משמעותית\n\n\nמצב כלכלי\nגרוע\nאבחון: נתיבי נועם\nחינוך מיוחד\nקבלת סמכות מורית: טיפול"},
  "ליאן נחום":{"class":"י2","teacher":"אופירה מלכה","text":"מעגל משפחתי: הורים גרושים + 4\nהילדים רואים כרגע את האבא כל יום, אבל מתגוררים עם האם.\nהאבא גר אצל אמו בפסגת זאב וההורים התגרשו ביולי 25.\nהאב מעורב מאוד ויש לעדכן אותו תמיד.\nמעגל לימודי: קשיים לימודיים משום שההבנה נמוכה מאוד, לא מצליחה לעבוד בכיתה. לעיתים נראה שיש חוסר של הבנת סיטואציות.\nבי\"ס קודם: טדי\nמקדמת\nהיסטוריה טיפול רגשי: עד גיל 5 לא דיבר, עבר 2 ניתוחי אזניים ואז החלה לדבר."},
  "רושינעק שבי":{"class":"י2","teacher":"אופירה מלכה","text":"מעגל משפחתי: נשואים + 8\nנפגעה מינית על ידי סבא, היתה בדכאון\nהוחלט על מסגרת חוץ ביתית פוסט אשפוזית\nבי\"ס קודם: אולפנת דולב, פנימייה פוסט אשפוזית היתה שנתיים\nאחרי שנתיים הוסר הצו וחזרה לקהילה\nאבחון: אבחון פסיכודיאגנוסטי\nהיסטוריה טיפול רגשי: ממתינה בתור למיטל לטיפול בינתיים פוגשת את העו\"סית"},
  "שופמן משה":{"class":"י2","teacher":"אופירה מלכה","text":"מעגל משפחתי: רחל האם מאוקראינה. 054-3857469\nגרושה + 6\nבית שמש\nמעגל לימודי: קשיים לימודיים:\n* קריאה ברמת כיתה ב-ג\n* מתמטיקה פער עצום\n* שגיאות כתיב\n* בשעורים של תפעול הוא מעולה\nבי\"ס קודם: תפנית\nחינוך מיוחד\nאבחון: לא קיים בתיק\nדוח חינוכי תפקודי מינואר 2023\nדוח חינוכי תפקודי מתשפ\"ד\nבעיית ביקור סדיר: יצא לפנימייה לאחר בעיות ביקור סדיר\nמעגל חברתי-רגשי: התלמיד מתכנס בעצמו ביישן ומופנם\nחושד בכל אדם, ראייה שלילית עקב אירועי העבר ומציאות חייו המורכבת?\nהיה מפגין כוחניות ושליטה בכיתה כדי לצאת לשיעורי עמל בשל הקושי הלימודי\nמתנגד ללמידה\nהיסטוריה טיפול רגשי: מקבל טיפול בפנימייה\nעובד עוזר מאמן קרב מגע ?"},
  "שרי אגם":{"class":"י2","teacher":"אופירה מלכה","text":"מעגל משפחתי: נשואים +4\nשיתוף פעולה עם הורים: שניהם"},
  "ששון דוד":{"class":"י2","teacher":"אופירה מלכה","text":"מעגל משפחתי: גרושים + 5\nמתגורר אצל האמא"},
  "אדנה אוריין":{"class":"י3","teacher":"פרלה שאזו","text":"מעגל משפחתי: גרושים + 2\nמתגורר עם אביו, אמו נשואה בשנית והאחות הבכורה מתגוררת עם האם. אוריין מגיע לבקר את האמא לא בעקביות.\nהאב מספר שבביה\"ס זיו לא רצו שאוריין ישאר ולכן עשו הכל כדי שיעזוב, גם בכדורגל הוא היה מעולה ושמים לו מכשול, בקיצור אכלו לי שתו לי.\nבי\"ס קודם: זיו\nרגילה\nאבחון: אין\nגורם מטפל: רווחה קרית יובל, עדית עזבה יש בחור חדש\nקבלת סמכות מורית: אין בעיות משמעת והתנהגות, יחס מכבד לכולם.\nמעגל חברתי-רגשי: יש לו חברים מקבוצת הכדורגל ומהשכונה, האם טוענת שהאב לא שם גבולות ואוריין מסתובב הרבה ירד בלימודים וגם בכדורגל.\nהיסטוריה טיפול רגשי: היה מסלול נפרד מהכיתה, בחדר מלא בעבודה פרטנית. הדבר השפיע על הערך העצמי שלו."},
  "אונדריק חנה":{"class":"י3","teacher":"פרלה שאזו","text":"מעגל משפחתי: נשואים + 6\nההורים מהקהילה המשיחית הגיעו בעקבות טליתא וצופיה\nהאבא מלמד תנך וארכיאולוגיה באוניברסיטה.\nהילדים שמעל גיל 18 עזבו את הארץ משום שלא הייתה להם אגרת שהיה והם בגרמניה לומדים.\nשיתוף פעולה עם הורים: כן\nמצב כלכלי: טוב\nמעגל לימודי: קושי לימודי, לקות למידה\nבי\"ס קודם: מקור התקווה\nשל הקהילה המשיחית\nנוצרים\nאבחון: אבחון פסיכודידקטי\nהמלצות לביה\"ס:\nהוראה מתקנת ואסטרטגיות למידה\nטיפול רגשי פרטני\nקשה לה להשתתף בקבוצה\nלעשות התאמות על סמך דידקטי"},
  "אמבאו אורטל":{"class":"י3","teacher":"פרלה שאזו","text":"מעגל משפחתי: נשואים + 5\nבעבר התקבלה תלונה מביהס לרווחה שיש חשש לפגיעה של האב באורטל.\nמצב כלכלי: סביר\nאבחון: ברנקו וייס\nרגילה\nהיסטוריה טיפול רגשי: השתתפה בקבוצת פסיכודרמה"},
  "בורדיק צופיה":{"class":"י3","teacher":"פרלה שאזו","text":"מעגל משפחתי: 5 אחים ואחיות. מס' 2, אחות גדולה אלינור. בני דודים קרובים\nאבא יליד אנגליה\nמהקהילה המשיחית, נוצרים\nאבחון: אבחון פסיכודידקטי\nלהגיש להתאמות"},
  "חטיני גפן":{"class":"י3","teacher":"פרלה שאזו","text":"מעגל משפחתי: נשואים + 3\nאבא - הידרותרפיסט, אמא - אחות ראשית חדר מיון עין כרם\nבי\"ס קודם: אור בצור הדסה\nאבחון: אין\nמעגל חברתי-רגשי: עברה תקיפה מינית לפני שנתיים וחצי אף דיברה עליה בקבוצת הפסיכודרמה, ילדה מרגשת מאוד שעשתה תהליך מדהים בביה\"ס.\nהיסטוריה טיפול רגשי: אלון רז\nפסיכודרמה"},
  "חכמון תבל":{"class":"י3","teacher":"פרלה שאזו","text":"מעגל משפחתי: גרושים + 7\nתאום של שובל\nישנו אח בכיתה ו' הסובל מחרדות קשות ומטופל בהדסה, לעיתים קרובות האב מגיע לישון בבית כדי לעזור דבר שמבלבל את הילדים.\nהאם נתמכת ביטוח לאומי סביב נכות ומבקשת עזרה.\nהאב מתגורר אצל אמו והילדים מתראים איתו באופן קבוע.\nשיתוף פעולה עם הורים: כן\nמצב כלכלי: קשה מאוד\nבי\"ס קודם: ניסוי ארגנטינה\nרגילה\nאבחון: פסיכודידקטי אוגוסט 2022\nהמלצות:\nהוראה מתקנת ואסטרטגיות למידה\nמעגל חברתי-רגשי: ילד חברותי מאוד\nיש לו נטייה להגרר\nזקוק לתיווך וחוויות הצלחה"},
  "טויטו אביגיל":{"class":"י3","teacher":"פרלה שאזו","text":"מעגל משפחתי: הורים נשואים. 6 אחים (אביגיל מס' 3). ההורים עלו מצרפת.\nבי\"ס קודם: צביה\nכיתה רגילה\nאבחון: יש ועדת השמה"},
  "כהן מאי":{"class":"י3","teacher":"פרלה שאזו","text":"מעגל משפחתי: נשואים + 6\nמצב כלכלי: קשה\nהיסטוריה טיפול רגשי: עברה חרם בכיתות נמוכות, עברה חרם נוסף בכיתה ז'. קושי חברתי גדול. מרפאת נפש לאחר שני ניסיונות התאבדות. הוכנסה לאשפוז בעין כרם ויצאה לאחר יום. מפגשים עם פסיכיאטר במרפאה לבריאות הנפש בעין כרם. חשוב ליצור קשר עם היחידה למתבגרים על מנת לקבל טיפול\nמקבלת טיפול אצל מתיאס"},
  "מזרחי רוי דניאל":{"class":"י3","teacher":"פרלה שאזו","text":"מעגל משפחתי: נשואים + 4\nבי\"ס קודם: גבעת גונן כיתה רגילה\nאבחון: עבר אבחון קשב וריכוז - אין בעיית קשב, רק חוסר מוטיבציה\nאין טיפול תרופתי\nאין בתיק"},
  "מסלינקוב יוליה":{"class":"י3","teacher":"פרלה שאזו","text":"מעגל משפחתי: אירנה ואולג נשואים + 3\nשני אחים גדולים, אח בן 34 שגר עם חברה ברימונים\nואחות בת 21 שעושה לק ג'ל\nשיתוף פעולה עם הורים: אמא מקסימה התקיימה כבר שיחת אינטייק ביום הכרות\nמצב כלכלי: סביר\nמעגל לימודי: משבר לאחר הקורונה, לא הצליחה לחזור למעגל הלמידה בשל חרדה חברתית, לא יצאה מהבית. הופעלו לחצים מצד האם שגרמו לילדה להחמרה של המצב, קבס היה בתמונה, לא טיפלו נכון בבעיה הרגשית אלא ממקום משמעתי.\nהתלמידה יצרה פערים לימודיים בנוסף לקשיי הלמידה שקיימים אצלה יצרה פערים שלא הצליחה לגשר עליהם, ריחוק חברתי.\nבי\"ס קודם: אלומות, חינוך מיוחד\nאבחון: חידוש בטיפול\nבעיית ביקור סדיר: הייתה בביה\"ס הקודם\nקבלת סמכות מורית: מקבלת\nמעגל חברתי-רגשי: יש קושי חברתי מהמסגרת הקודמת\nהיסטוריה טיפול רגשי: קיבלה רק בבתי הספר ולא באופן עקבי"},
  "ספקטור ליאל":{"class":"י3","teacher":"פרלה שאזו","text":"מעגל משפחתי: האם נפטרה לפני שנתיים מסרטן (ליאל הייתה בכיתה ו'). האב יליד בריה\"מ. שלושה אחים (מיקום 2 בין האחים).\nבי\"ס קודם: ביה\"ס אור ברנקו וייס - מקיף בצור הדסה\nאבחון: אין אבחון\nאין ועדת השמה"},
  "צימרמן רונה":{"class":"י3","teacher":"פרלה שאזו","text":"מעגל משפחתי: נשואים + 3\nסיפור מורכב של יחסים מורכבים עם האם\nבית לא מאוזן, הילדה היתה באתנחתא לאחר אירוע עם אמה בו היתה מעורבת משטרה. לאחר מכן היתה בהערכות פסיכיאטריות, אין תיעוד מאף אחד מה\nיש עו\"סית מלווה\nדובר על התעללות בבית, לא ידוע חכמון\nגורם מטפל: מלכי עוס לחוק נוער 054-6986135"},
  "אלמלח גוני":{"class":"י1","teacher":"רעיה יצחקי","text":"מעגל משפחתי: ציון וסגול גרושים + 3\nלגוני אח אילי בן 17, אחות גיא בת 19\nגוני היה בן שנה ושמונה חודשים כשהוריו התגרשו\n\nמשיחה עם האם היא שמחה שגוני עוזב את ביה\"ס הוא חווה התקפי חרדה במיוחד בימי זיכרון ושם לא היתה הכלה.\nבילה הרבה מאוד בחוץ בביה\"ס הקודם, לא היו שעורי ספורט.\nילד שזקוק לפעילות ולא יכול לשבת.\nחושש קצת מילד נחמן נתן ממושב אדרת, אברר זאת, נתן היה אצלנו שנה קודם.\nזקוק לתפקיד בכיתה ועיסוקים.\n\nכל פעם שיש הסטריה עם המצב המלחמתי הוא מרגיש מוצף ואפשר להרגיע אותו.\nהאם גידלה אותו כל השנים ובשנים האחרונות הם גרים עם האב בעיקר במושב אדרת והאם מתגוררת במושב צפרירים 5 דקות .\nלאם יש בן זוג שאנחנו גרים בקרוון בשטח ולו יש 3 ילדים. יש עוד חדר נוסף או אוהלים. סגול ספרית כלבים ורפואה משלימה בבעלי חיים, עסק משלי עצמאית.\n\nגוני אוהב בעלי חיים, ממליצה להכניס לקבוצה של בעלי חיים ונבחרת כדורגל.\nרוצה עיצוב שיער. הוא עדין משחק בשכונה וגם באופן מקצועי יהיה השנה.\n\nכל היסודי היה מצויין רק סביב ז ח התחילו בעיות חברתיות כי היו קבוצות שלא רצו לשתף אותו.\nשיתוף פעולה עם הורים: האב והאם\nדמות משמעותית: ההורים\nמצב כלכלי: קשה\nמעגל לימודי: מעולה באנגלית\nבי\"ס קודם: דרור צור הדסה\nרגילה\nאבחון: דוח פסיכיאטרי מתאריך 21.5.24\nמאז גירושי הוריו מתואר כילד שסבל מחרת נטישה והתקפי זעם, קשר טוב עם האב. מגיל שלוש ישן במיטת הוריו.\nעד מספר חודשים לפני ה 7.10 היה נוהג לציין את ימי הזכרון כדי להתכונן לצפירה, כנראה שהצפירה מהווה איום.\nמצוק איתן סובל מחרדות וכאבי בטן, פחד ללכת לביה\"ס בגלל הפחד שלא ידע איפה הממד. גם כשהיה הולך היה מבקש מאביו לאסוף אותו במהלך היום.\nלא נשאר בבית לבד.\nמתואר כילד שאינו מסוגל לשבת, עד עתה לא נעשה אבחון קשב וריכוז ולא מטופל, לא מצליח בלמידה ולא ניגש למבחנים. הוא מתאר את חוסר השקט שלו והתזזתיות, החרדות מאזעקות וחוסר יכולת לישון בשל כך.\nחברתי מצבו טוב, יש לו חברים והוא שומר על קשר עין הופעה נקייה.\nהמלצות להורים:\n1. סל סיוע, לשם כך צריך אבחון פסיכודידקטי\n2. המשך טיפול רגשי לגוני בשל חרדה\n3. בדיקת קשב וריכוז וטיפול בהתאם\n4. הדרכת הורים\n\nמאובחן בקשב וריכוז לא לוקח רטלין בשל החרדות שלו.\nהאם מטפלת בו בשמנים הטריים.\n\n\nטופל בפסיכותרפיה דרך המרפאה, הפסיק כמה חודשים לפני מאי בשל יציאה לחופשת לידה של המטפלת.\nמתאר שהטיפול שיפר את הפחדים שלו והצליח לצאת מהבית."},

// ==================== STATE ====================
let currentRole = '';
let currentUser = '';
let allowedClasses = [];
let selectedStudent = null;

// ==================== LOGIN ====================
function selectRole(role) {
  document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('role-'+role).classList.add('selected');
  currentRole = role;

  const nameArea = document.getElementById('nameArea');
  const nameSelect = document.getElementById('nameSelect');
  nameSelect.innerHTML = '<option value="">-- \u05D1\u05D7\u05E8\u05D9 --</option>';

  if (role === 'principal') {
    nameArea.classList.remove('visible');
    document.getElementById('loginBtn').classList.add('ready');
    return;
  }

  const list = role === 'counselor' ? COUNSELORS : TEACHERS;
  list.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.name;
    opt.textContent = p.name;
    nameSelect.appendChild(opt);
  });
  nameArea.classList.add('visible');
  checkReady();
}

function checkReady() {
  const btn = document.getElementById('loginBtn');
  if (currentRole === 'principal') { btn.classList.add('ready'); return; }
  btn.classList.toggle('ready', document.getElementById('nameSelect').value !== '');
}

function doLogin() {
  if (currentRole === 'principal') {
    currentUser = '\u05DE\u05E0\u05D4\u05DC\u05EA';
    allowedClasses = [];
  } else {
    currentUser = document.getElementById('nameSelect').value;
    if (!currentUser) return;
    if (currentRole === 'counselor') {
      const c = COUNSELORS.find(x => x.name === currentUser);
      allowedClasses = c ? c.grades : [];
    } else {
      const t = TEACHERS.find(x => x.name === currentUser);
      allowedClasses = t ? t.classes : [];
    }
  }

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';

  const roleNames = {principal:'\u05DE\u05E0\u05D4\u05DC\u05EA',counselor:'\u05D9\u05D5\u05E2\u05E6\u05EA',teacher:'\u05DE\u05D7\u05E0\u05DB\u05EA'};
  document.getElementById('roleBadge').textContent = roleNames[currentRole] + (currentUser !== '\u05DE\u05E0\u05D4\u05DC\u05EA' ? ' | ' + currentUser : '');

  initApp();
}

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
  currentRole = '';
  currentUser = '';
  document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('nameArea').classList.remove('visible');
  document.getElementById('loginBtn').classList.remove('ready');
}

// ==================== APP INIT ====================
function initApp() {
  buildClassFilter();
  renderStudentsList();
  updateSummary();
}

function getVisibleStudents() {
  return STUDENTS.filter(s => {
    if (currentRole === 'principal') return true;
    if (currentRole === 'counselor') return allowedClasses.some(g => s.cls.startsWith(g));
    return allowedClasses.includes(s.cls);
  });
}

function buildClassFilter() {
  const sel = document.getElementById('classFilter');
  sel.innerHTML = '<option value="">\u05DB\u05DC \u05D4\u05DB\u05D9\u05EA\u05D5\u05EA</option>';
  const classes = [...new Set(getVisibleStudents().map(s => s.cls))].sort((a,b) => {
    const order = {'\u05D8':1,'\u05D9':2,'\u05D9\u05D0':3,'\u05D9\u05D1':4};
    const ga = a.replace(/[0-9]/g,''), gb = b.replace(/[0-9]/g,'');
    if (order[ga] !== order[gb]) return (order[ga]||99) - (order[gb]||99);
    return a.localeCompare(b,'he');
  });
  classes.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}

function updateSummary() {
  const vis = getVisibleStudents();
  document.getElementById('sumTotal').textContent = vis.length;
  const cls = new Set(vis.map(s=>s.cls));
  document.getElementById('sumClasses').textContent = cls.size;
  let gc = 0;
  vis.forEach(s => { if (GRADES[s.last+' '+s.first]) gc++; });
  document.getElementById('sumGrades').textContent = gc;
  let tc = 0;
  vis.forEach(s => { if (findTachi(s)) tc++; });
  document.getElementById('sumTachi').textContent = tc;
}

// ==================== STUDENT LIST ====================
function renderStudentsList() {
  const grid = document.getElementById('studentsGrid');
  const search = document.getElementById('searchInput').value.trim();
  const clsFilter = document.getElementById('classFilter').value;
  const megFilter = document.getElementById('megamaFilter').value;

  let students = getVisibleStudents();
  if (clsFilter) students = students.filter(s => s.cls === clsFilter);
  if (megFilter) students = students.filter(s => s.megama === megFilter);
  if (search) {
    students = students.filter(s =>
      (s.first+' '+s.last).includes(search) ||
      (s.last+' '+s.first).includes(search) ||
      s.tz.includes(search)
    );
  }

  document.getElementById('countLabel').textContent = '\u05DE\u05E6\u05D9\u05D2 ' + students.length + ' \u05EA\u05DC\u05DE\u05D9\u05D3\u05D9\u05DD';

  grid.innerHTML = students.map(s => {
    const fullName = s.last + ' ' + s.first;
    const hasGrades = !!GRADES[fullName];
    const hasTachi = !!findTachi(s);
    const initials = (s.first[0]||'') + (s.last[0]||'');
    const avatarClass = s.gender === '\u05E0' ? 'avatar-female' : 'avatar-male';
    const meg = s.megama ? MEGAMA[s.megama] || '' : '';

    return `<div class="student-card" onclick="showStudent(${s.id})">
      <div class="student-avatar ${avatarClass}">${initials}</div>
      <div class="st-name">${fullName}</div>
      <div class="st-class">${s.cls}</div>
      ${meg ? '<div class="st-megama">'+meg+'</div>' : ''}
      <div class="st-badges">
        ${hasGrades ? '<span class="mini-badge badge-grades">\u05E6\u05D9\u05D5\u05E0\u05D9\u05DD</span>' : ''}
        ${hasTachi ? '<span class="mini-badge badge-tachi">\u05EA\u05D7"\u05D9</span>' : ''}
      </div>
    </div>`;
  }).join('');
}

// ==================== STUDENT PROFILE ====================
function showStudent(id) {
  selectedStudent = STUDENTS.find(s => s.id === id);
  if (!selectedStudent) return;

  document.getElementById('studentsListView').style.display = 'none';
  document.getElementById('profileView').style.display = 'block';

  renderProfileHeader();
  renderProfileTabs();
  switchProfileTab('personal');

function switchProfileTab(tabId) {
  document.querySelectorAll('#profileTabs .tab-btn').forEach(b => b.classList.remove('active'));
  event && event.target && event.target.classList.add('active');

  const container = document.getElementById('tabContents');
  switch(tabId) {
    case 'personal': container.innerHTML = renderPersonalTab(); break;
    case 'grades': container.innerHTML = renderGradesTab(); break;
    case 'tachi': container.innerHTML = renderTachiTab(); break;
    case 'reports': container.innerHTML = renderReportsTab(); initPortfolioAI(); break;
    case 'notes': container.innerHTML = renderNotesTab(); break;
  }

  // Activate first tab button if called programmatically
  if (!event || !event.target) {
    const btns = document.querySelectorAll('#profileTabs .tab-btn');
    btns.forEach(b => {
      if (b.textContent.includes(tabId === 'personal' ? '\u05E4\u05E8\u05D8\u05D9\u05DD' : '')) b.classList.add('active');
    });
  }
}

function renderGradesTab() {
  const s = selectedStudent;
  const fullName = s.last + ' ' + s.first;
  const g = GRADES[fullName];

  if (!g || !g.subjects || Object.keys(g.subjects).length === 0) {
    return `<div class="tab-content active">
      <div class="section">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <p>\u05D0\u05D9\u05DF \u05E0\u05EA\u05D5\u05E0\u05D9 \u05E6\u05D9\u05D5\u05E0\u05D9\u05DD \u05DC\u05EA\u05DC\u05DE\u05D9\u05D3 \u05D6\u05D4</p>
        </div>
      </div>
    </div>`;
  }

  // Trend
  let trendIcon = '', trendColor = 'var(--muted)', trendText = '-';
  if (g.avg1 != null && g.avg2 != null) {
    const diff = g.avg2 - g.avg1;
    if (diff > 2) { trendIcon = '\u25B2'; trendColor = 'var(--success)'; trendText = '\u05E2\u05DC\u05D9\u05D9\u05D4'; }
    else if (diff < -2) { trendIcon = '\u25BC'; trendColor = 'var(--danger)'; trendText = '\u05D9\u05E8\u05D9\u05D3\u05D4'; }
    else { trendIcon = '\u25AC'; trendColor = 'var(--warn)'; trendText = '\u05D9\u05E6\u05D9\u05D1'; }
  }

  let html = `<div class="tab-content active">
    <div class="grade-summary">
      <div class="gs-card"><div class="gs-label">\u05DE\u05DE\u05D5\u05E6\u05E2 \u05E9\u05DC\u05D9\u05E9 \u05D0</div><div class="gs-value" style="color:${gradeColor(g.avg1)}">${g.avg1 != null ? g.avg1.toFixed(1) : '-'}</div></div>
      <div class="gs-card"><div class="gs-label">\u05DE\u05DE\u05D5\u05E6\u05E2 \u05E9\u05DC\u05D9\u05E9 \u05D1</div><div class="gs-value" style="color:${gradeColor(g.avg2)}">${g.avg2 != null ? g.avg2.toFixed(1) : '-'}</div></div>
      <div class="gs-card"><div class="gs-label">\u05DE\u05D2\u05DE\u05D4</div><div class="gs-value" style="color:${trendColor}">${trendIcon} ${trendText}</div></div>
    </div>
    <div class="section">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> \u05D2\u05DC\u05D9\u05D5\u05DF \u05E6\u05D9\u05D5\u05E0\u05D9\u05DD</h3>
      <div style="overflow-x:auto">
      <table class="grades-table">
        <thead><tr><th>\u05DE\u05E7\u05E6\u05D5\u05E2</th><th>\u05DE\u05D5\u05E8\u05D4</th><th>\u05E9\u05DC\u05D9\u05E9 \u05D0</th><th>\u05E9\u05DC\u05D9\u05E9 \u05D1</th></tr></thead>
        <tbody>`;

  Object.entries(g.subjects).forEach(([subj, data]) => {
    html += `<tr>
      <td style="font-weight:600">${subj}</td>
      <td style="color:var(--muted);font-size:.8rem">${data.t || ''}</td>
      <td>${gradeCell(data.s1)}</td>
      <td>${gradeCell(data.s2)}</td>
    </tr>`;
  });

  html += `</tbody>
      <tfoot><tr class="avg-row">
        <td colspan="2" style="font-weight:700">\u05DE\u05DE\u05D5\u05E6\u05E2</td>
        <td>${gradeCell(g.avg1)}</td>
        <td>${gradeCell(g.avg2)}</td>
      </tr></tfoot>
      </table></div>
    </div>
  </div>`;
  return html;
}

function gradeCell(val) {
  if (val == null) return '<span class="grade-na">-</span>';
  const cls = val >= 70 ? 'grade-green' : val >= 55 ? 'grade-yellow' : 'grade-red';
  return `<span class="grade-cell ${cls}">${val}</span>`;
}

function gradeColor(val) {
  if (val == null) return 'var(--muted)';
  if (val >= 70) return 'var(--success)';
  if (val >= 55) return 'var(--warn)';
  return 'var(--danger)';
}

// ==================== TAB: TACHI ====================
function findTachi(s) {
  if (!SHILUV_TACHI) return null;
  const fullName = s.last + ' ' + s.first;
  // Try exact match first
  if (SHILUV_TACHI[fullName]) return SHILUV_TACHI[fullName];
  // Try reverse
  const reverseName = s.first + ' ' + s.last;
  if (SHILUV_TACHI[reverseName]) return SHILUV_TACHI[reverseName];
  // Try partial match
  for (const key of Object.keys(SHILUV_TACHI)) {
    if (key.includes(s.last) && key.includes(s.first)) return SHILUV_TACHI[key];
    if (s.first.length > 2 && s.last.length > 2 && key.includes(s.first) && key.includes(s.last.substring(0,3))) return SHILUV_TACHI[key];
  }
  return null;
}

function getCounselorForStudent(s) {
  const grade = (s.cls || '').replace(/[0-9\s']/g, '');

  if (grade === 'ט' || grade === 'י') return {name:'דורית ויגדור', grades:'ט-י', initials:'ד׳'};
  if (grade === 'יא' || grade === 'יב') return {name:'צהיי גטהון', grades:'יא-יב', initials:'צ׳'};
  return null;
}

    }
    if (tachi.emo && tachi.emo.length && tachi.emo.some(x=>x)) {
      html += `<div><div style="font-size:.82rem;font-weight:700;margin-bottom:6px">מענה רגשי</div>`;
      tachi.emo.forEach(item => { if (item) html += `<div class="emo-item">${item}</div>`; });
      html += '</div>';
    }

    html += '</div>';
  } else {
    // Try COUNSELOR_BACKGROUND as fallback
    const bgKey = typeof COUNSELOR_BACKGROUND !== 'undefined' ? Object.keys(COUNSELOR_BACKGROUND).find(k => {
      const norm = n => n.replace(/\s+/g,' ').trim();
      return norm(k) === norm(fullName) || norm(k) === norm(s.first + ' ' + s.last)
        || (norm(k).includes(s.last) && norm(k).includes(s.first));
    }) : null;
    const bgData = bgKey ? COUNSELOR_BACKGROUND[bgKey] : null;

    if (bgData && bgData.text) {
      html += `<div class="bg-card"><h4><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> רקע התלמיד</h4>
        <div style="font-size:.85rem;line-height:1.8;white-space:pre-line">${bgData.text}</div></div>`;
    } else {
      html += `<div class="bg-card"><h4><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> רקע התלמיד</h4>
        <div class="dev-empty">טרם הוזן רקע עבור תלמיד זה</div></div>`;
    }
  }

  // === SECTION 3: Monthly Development Timeline ===
  html += `<div class="bg-card">
    <h4><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> מעקב התפתחות</h4>`;

  // Look up student in COUNSELOR_MONTHLY
  const studentKey = Object.keys(COUNSELOR_MONTHLY).find(k => {
    const norm = n => n.replace(/\s+/g,' ').trim();
    return norm(k) === norm(fullName) || norm(k) === norm(s.first + ' ' + s.last)
      || (norm(k).includes(s.last) && norm(k).includes(s.first));
  });
  const devEntries = studentKey ? COUNSELOR_MONTHLY[studentKey] : null;

  if (devEntries && devEntries.length) {
    html += '<div class="dev-timeline">';
    devEntries.forEach(d => {
      const statusLabel = d.status === 'progress' ? 'התקדמות' : d.status === 'attention' ? 'דורש תשומת לב' : 'יציב';
      html += `<div class="dev-item status-${d.status}">
        <div class="dev-month">${d.month} <span class="dev-status ${d.status}">${statusLabel}</span></div>
        <div class="dev-text">${d.text}</div>
      </div>`;
    });
    html += '</div>';
  } else {
    html += '<div class="dev-empty">טרם הוזנו עדכונים חודשיים עבור תלמיד זה</div>';
  }
  html += '</div>';

  // === SECTION 4: Attached Reports (collapsible) ===
  const counselorMap = {
    'צהיי': ['יא','יב'],
    'דורית': ['ט','י'],
    'ליאת': ['ט','י','יא','יב']
  };

  let hasReports = false;
  let reportsHtml = '';
  Object.entries(REPORTS).forEach(([counselor, reports]) => {
    const grades = counselorMap[counselor] || [];
    if (!grades.includes(grade)) return;
    hasReports = true;

    reportsHtml += `<div style="margin-bottom:16px">
      <div style="font-size:.82rem;font-weight:700;margin-bottom:8px;color:var(--muted)">דוחות — ${counselor}</div>
      <div class="timeline">`;

    reports.forEach(r => {
      reportsHtml += `<div class="timeline-item">
        <div class="timeline-date">${r.date}</div>
        <div class="timeline-title">${r.subject} <span style="font-size:.72rem;color:var(--muted);font-weight:400">(${r.type})</span></div>
        <div class="timeline-files">`;
      if (r.files) {
        r.files.forEach(f => {
          reportsHtml += `<span class="timeline-file"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg> ${f}</span>`;
        });
      }
      if (r.links) {
        r.links.forEach((l, i) => {
          reportsHtml += `<a class="timeline-link" href="${l}" target="_blank"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> קישור ${i+1}</a>`;
        });
      }
      reportsHtml += '</div></div>';
    });

    reportsHtml += '</div></div>';
  });

  if (hasReports) {
    let reportCount = 0;
    Object.entries(REPORTS).forEach(([c, reps]) => { if ((counselorMap[c]||[]).includes(grade)) reportCount += reps.length; });
    html += `<details class="docs-section">
      <summary><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> מסמכים ודוחות מצורפים (${reportCount})</summary>
      ${reportsHtml}
    </details>`;
  }

  // === AI Personal Plan Button ===
  html += '<div id="ai-portfolio-plan" style="margin-top:16px"></div>';

  html += '</div>';
  return html;
}

// ==================== TAB: NOTES ====================
function getNotesKey(s) { return 'portfolio_notes_' + s.id; }

function loadNotes(s) {
  try { return JSON.parse(localStorage.getItem(getNotesKey(s)) || '[]'); }
  catch { return []; }
}

function saveNote() {
  const text = document.getElementById('noteText').value.trim();
  const role = document.getElementById('noteRole').value;
  if (!text) return;

  const notes = loadNotes(selectedStudent);
  notes.unshift({
    text, role, author: currentUser,
    time: new Date().toLocaleString('he-IL')
  });
  localStorage.setItem(getNotesKey(selectedStudent), JSON.stringify(notes));
  document.getElementById('noteText').value = '';
  document.getElementById('tabContents').innerHTML = renderNotesTab();
}

function deleteNote(idx) {
  const notes = loadNotes(selectedStudent);
  notes.splice(idx, 1);
  localStorage.setItem(getNotesKey(selectedStudent), JSON.stringify(notes));
  document.getElementById('tabContents').innerHTML = renderNotesTab();
}

function renderNotesTab() {
  const notes = loadNotes(selectedStudent);

  let html = `<div class="tab-content active">
    <div class="section">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> \u05D4\u05D5\u05E1\u05E4\u05EA \u05D4\u05E2\u05E8\u05D4</h3>
      <div class="note-form">
        <textarea id="noteText" placeholder="\u05DB\u05EA\u05D1\u05D9 \u05D4\u05E2\u05E8\u05D4 \u05D7\u05D3\u05E9\u05D4..."></textarea>
        <div class="note-form-row">
          <select id="noteRole">
            <option value="\u05DE\u05E0\u05D4\u05DC\u05EA">\u05DE\u05E0\u05D4\u05DC\u05EA</option>
            <option value="\u05D9\u05D5\u05E2\u05E6\u05EA">\u05D9\u05D5\u05E2\u05E6\u05EA</option>
            <option value="\u05DE\u05D7\u05E0\u05DB\u05EA">\u05DE\u05D7\u05E0\u05DB\u05EA</option>
            <option value="\u05E8\u05DB\u05D6\u05EA \u05E9\u05D9\u05DC\u05D5\u05D1">\u05E8\u05DB\u05D6\u05EA \u05E9\u05D9\u05DC\u05D5\u05D1</option>
          </select>
          <button class="save-note-btn" onclick="saveNote()">\u05E9\u05DE\u05D5\u05E8 \u05D4\u05E2\u05E8\u05D4</button>
        </div>
      </div>
    </div>
    <div class="section">
      <h3>\u05D4\u05E2\u05E8\u05D5\u05EA \u05E7\u05D9\u05D9\u05DE\u05D5\u05EA (${notes.length})</h3>`;

  if (notes.length === 0) {
    html += `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><p>\u05D0\u05D9\u05DF \u05D4\u05E2\u05E8\u05D5\u05EA \u05E2\u05D3\u05D9\u05D9\u05DF</p></div>`;
  } else {
    html += '<div class="notes-list">';
    notes.forEach((n, i) => {
      html += `<div class="note-item">
        <div class="note-meta">
          <div><span class="note-author">${n.author}</span> <span class="note-role-tag">${n.role}</span></div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="note-time">${n.time}</span>
            <button class="delete-note" onclick="deleteNote(${i})">\u05DE\u05D7\u05E7</button>
          </div>
        </div>
        <div class="note-text">${n.text}</div>
      </div>`;
    });
    html += '</div>';
  }

  html += '</div></div>';
  return html;
}

</script>

// Sync counselor data to localStorage on load
if (typeof COUNSELOR_BACKGROUND !== 'undefined' && typeof COUNSELOR_MONTHLY !== 'undefined') {
  syncPortfolioToLocalStorage(COUNSELOR_BACKGROUND, COUNSELOR_MONTHLY, typeof SHILUV_TACHI !== 'undefined' ? SHILUV_TACHI : null);
}

function initPortfolioAI() {
  const container = document.getElementById('ai-portfolio-plan');
  if (!container || container.dataset.injected) return;
  container.dataset.injected = 'true';
  injectAIButton('ai-portfolio-plan', 'personal-plan', function() {
    const s = selectedStudent;
    return buildPersonalPlanData(s.last + ' ' + s.first, s.cls);
  }, { buttonText: 'תוכנית אישית AI' });
}
</script>
