<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טיפ יומי — Learni</title>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@300;400;500;600;700;800&family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #ddd; }

.canvas {
  width: 1080px; height: 1080px;
  position: relative; overflow: hidden;
  background: #f7f5f0;
  font-family: 'Playpen Sans Hebrew', cursive;
}

/* Mesh gradient background — no grain */
.canvas::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 65% 55% at 10% 15%, rgba(125,212,172,0.22) 0%, transparent 70%),
    radial-gradient(ellipse 55% 65% at 90% 80%, rgba(123,171,212,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 45% 45% at 50% 50%, rgba(184,169,212,0.12) 0%, transparent 70%);
}

/* ========== CATEGORY PILL ========== */
.cat {
  position: absolute; top: 50px; right: 60px; z-index: 10;
  background: #7dd4ac; color: #1e3a5f;
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 28px; font-weight: 700;
  padding: 12px 32px; border-radius: 28px;
  box-shadow: 0 4px 0 rgba(30,58,95,0.06), 0 8px 20px rgba(125,212,172,0.25);
  display: flex; align-items: center; gap: 12px;
}
.cat svg { width: 26px; height: 26px; fill: none; stroke: #1e3a5f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ========== TITLE ========== */
.title {
  position: absolute; top: 130px; right: 60px; left: 60px; z-index: 10;
  font-family: 'Playpen Sans Hebrew', cursive;
  font-weight: 800; font-size: 52px;
  color: #1e3a5f; line-height: 1.25;
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
}
.title .big-num {
  font-size: 140px;
  font-weight: 800;
  color: #7dd4ac;
  line-height: 1;
  text-shadow: 0 4px 20px rgba(125,212,172,0.3);
  letter-spacing: -4px;
}

/* ========== STICKER BADGE ========== */
.sticker {
  position: absolute;
  top: 280px; right: 60px;
  z-index: 30;
  transform: rotate(8deg);
  width: 200px;
  padding: 18px 22px;
  background: #f5e6a3;
  color: #3d2e0a;
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 30px;
  font-weight: 800;
  text-align: center;
  line-height: 1.3;
  border-radius: 14px;
  box-shadow:
    0 6px 20px rgba(0,0,0,0.18),
    0 2px 6px rgba(0,0,0,0.12),
    inset 0 -2px 4px rgba(0,0,0,0.06),
    inset 0 2px 4px rgba(255,255,255,0.5);
  /* Rough/torn edge feel via clip-path */
  clip-path: polygon(
    2% 4%, 8% 1%, 15% 3%, 22% 0%, 30% 2%, 38% 1%, 45% 3%, 52% 0%, 60% 2%, 68% 1%, 75% 3%, 82% 0%, 90% 2%, 96% 1%, 100% 4%,
    99% 12%, 100% 20%, 98% 28%, 100% 36%, 99% 44%, 100% 52%, 98% 60%, 100% 68%, 99% 76%, 100% 84%, 98% 92%, 100% 100%,
    96% 99%, 90% 100%, 82% 98%, 75% 100%, 68% 99%, 60% 100%, 52% 98%, 45% 100%, 38% 99%, 30% 100%, 22% 98%, 15% 100%, 8% 99%, 2% 100%,
    0% 92%, 2% 84%, 0% 76%, 2% 68%, 0% 60%, 2% 52%, 0% 44%, 2% 36%, 0% 28%, 2% 20%, 0% 12%, 2% 4%
  );
}
.sticker::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, transparent 50%);
  border-radius: 14px;
  pointer-events: none;
}
.sticker-icon {
  display: block;
  margin: 0 auto 6px;
}
.sticker-icon svg {
  width: 32px; height: 32px;
  fill: none; stroke: #3d2e0a; stroke-width: 2.2;
  stroke-linecap: round; stroke-linejoin: round;
}

/* ========== CARDS AREA ========== */

/* HERO CARD — large, full width */
.card-hero {
  position: absolute;
  top: 400px; right: 50px; left: 50px;
  z-index: 12;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 28px;
  padding: 38px 40px;
  border: 1.5px solid rgba(255,255,255,0.95);
  border-top: 6px solid #7dd4ac;
  transform: rotate(-1.5deg);
  box-shadow:
    0 14px 50px rgba(125,212,172,0.18),
    0 4px 14px rgba(0,0,0,0.07),
    0 28px 70px rgba(30,58,95,0.1);
  display: flex; align-items: center; gap: 24px;
}

/* Side cards — smaller, side by side */
.cards-row {
  position: absolute;
  top: 640px; right: 50px; left: 50px;
  z-index: 11;
  display: flex; gap: 28px;
  direction: rtl;
}

.card-side {
  flex: 1;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 30px 28px;
  border: 1.5px solid rgba(255,255,255,0.9);
  box-shadow:
    0 10px 35px rgba(0,0,0,0.06),
    0 20px 50px rgba(30,58,95,0.08);
  display: flex; align-items: center; gap: 18px;
}
.card-side-1 {
  border-top: 5px solid #7babd4;
  transform: rotate(2deg);
}
.card-side-2 {
  border-top: 5px solid #b8a9d4;
  transform: rotate(-1.8deg);
}

/* Number badge */
.num {
  flex-shrink: 0;
  width: 58px; height: 58px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 30px; font-weight: 800; color: #fff;
  box-shadow: 0 4px 14px rgba(0,0,0,0.14);
}
.num-green { background: linear-gradient(135deg, #7dd4ac, #5bc49a); }
.num-blue { background: linear-gradient(135deg, #7babd4, #5a94c4); }
.num-purple { background: linear-gradient(135deg, #b8a9d4, #9b8bc4); }

/* Icon */
.ico {
  flex-shrink: 0; width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.75;
}
.ico svg { width: 38px; height: 38px; }

/* Card text */
.txt {
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 32px; font-weight: 600;
  color: #1e3a5f; line-height: 1.45;
}
.txt-sm {
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 28px; font-weight: 500;
  color: #1e3a5f; line-height: 1.4;
}

/* ========== CTA PILL ========== */
.cta {
  position: absolute;
  bottom: 100px; left: 50%; transform: translateX(-50%);
  z-index: 15;
  background: rgba(125,212,172,0.18);
  border: 1.5px solid rgba(125,212,172,0.4);
  border-radius: 30px;
  padding: 12px 36px;
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 28px; font-weight: 600;
  color: #1e3a5f;
  white-space: nowrap;
}

/* ========== BOTTOM BAR ========== */
.bottom {
  position: absolute; bottom: 35px; right: 60px; left: 60px;
  z-index: 10; display: flex; align-items: center; justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 14px; }
.logo-circles { position: relative; width: 44px; height: 38px; }
.logo-circles .c1, .logo-circles .c2 {
  position: absolute; width: 30px; height: 30px; border-radius: 50%; top: 4px;
}
.logo-circles .c1 { right: 0; background: #7babd4; opacity: 0.85; }
.logo-circles .c2 { right: 15px; background: #7dd4ac; opacity: 0.85; }
.logo-name {
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 28px; font-weight: 700; color: #1e3a5f;
}
.url {
  font-family: 'Assistant', sans-serif;
  font-size: 24px; font-weight: 600; color: rgba(30,58,95,0.55);
  direction: ltr;
}
</style>
</head>
<body>
<div class="canvas">

  <!-- Category pill -->
  <div class="cat">
    <svg viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
    טיפ יומי
  </div>

  <!-- Title with dramatic "3" -->
  <div class="title">
    <span class="big-num">3</span>
    <span>פרומפטים<br>שישנו לכם את הבוקר</span>
  </div>

  <!-- Sticker badge — "שמרו את זה!" -->
  <div class="sticker">
    <span class="sticker-icon">
      <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
    </span>
    !שמרו את זה
  </div>

  <!-- HERO CARD (Card 1) — large -->
  <div class="card-hero">
    <div class="num num-green">1</div>
    <div class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l3 3L22 4"/>
        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>
    </div>
    <div class="txt">תכנן לי את היום ב-5 משימות מרכזיות</div>
  </div>

  <!-- Side cards row (Cards 2 + 3) -->
  <div class="cards-row">
    <div class="card-side card-side-1">
      <div class="num num-blue">2</div>
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <div class="txt-sm">תסכם לי את המייל הזה בשלוש נקודות</div>
    </div>

    <div class="card-side card-side-2">
      <div class="num num-purple">3</div>
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
        </svg>
      </div>
      <div class="txt-sm">תכתוב תשובה מנומסת ומקצועית למייל הזה</div>
    </div>
  </div>

  <!-- CTA pill -->
  <div class="cta">עוד טיפים בעמוד שלנו</div>

  <!-- Bottom bar -->
  <div class="bottom">
    <div class="logo">
      <div class="logo-circles"><div class="c1"></div><div class="c2"></div></div>
      <div class="logo-name">Learni</div>
    </div>
    <div class="url">learni.ai</div>
  </div>

</div>
</body>
</html>
