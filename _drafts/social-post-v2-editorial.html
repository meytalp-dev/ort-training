<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3 פרומפטים שישנו לכם את הבוקר — Learni</title>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@300;400;500;600;700;800&family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #e8e8e8;
    font-family: 'Assistant', sans-serif;
  }

  .post {
    width: 1080px;
    height: 1080px;
    background: #ffffff;
    position: relative;
    overflow: hidden;
  }

  /* Thin border frame inset */
  .frame {
    position: absolute;
    top: 28px;
    left: 28px;
    right: 28px;
    bottom: 28px;
    border: 1px solid #d0d0d0;
    pointer-events: none;
    z-index: 2;
  }

  /* Giant "3" background number */
  .giant-number {
    position: absolute;
    top: -40px;
    left: -30px;
    font-family: 'Playpen Sans Hebrew', cursive;
    font-weight: 800;
    font-size: 620px;
    line-height: 1;
    color: #7dd4ac;
    opacity: 0.10;
    z-index: 0;
    user-select: none;
  }

  /* Vertical side text */
  .vertical-text {
    position: absolute;
    left: 44px;
    top: 50%;
    transform: translateY(-50%) rotate(180deg);
    writing-mode: vertical-lr;
    font-family: 'Assistant', sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 3px;
    color: #b0b0b0;
    text-transform: lowercase;
    z-index: 3;
  }

  /* Category badge */
  .category {
    position: absolute;
    top: 72px;
    right: 80px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .category-line {
    width: 32px;
    height: 1px;
    background: #1e3a5f;
  }

  .category-label {
    font-family: 'Assistant', sans-serif;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 2px;
    color: #1e3a5f;
    text-transform: uppercase;
  }

  /* Title area */
  .title-area {
    position: absolute;
    top: 120px;
    right: 80px;
    z-index: 3;
    max-width: 620px;
  }

  .title-accent {
    font-family: 'Playpen Sans Hebrew', cursive;
    font-weight: 800;
    font-size: 160px;
    line-height: 0.85;
    color: #7dd4ac;
    margin-bottom: 8px;
    display: block;
  }

  .title-main {
    font-family: 'Assistant', sans-serif;
    font-weight: 300;
    font-size: 44px;
    line-height: 1.3;
    color: #1e3a5f;
    display: block;
  }

  .title-main strong {
    font-weight: 700;
  }

  .title-divider {
    width: 60px;
    height: 1px;
    background: #1e3a5f;
    margin-top: 20px;
  }

  /* Tips section */
  .tips {
    position: absolute;
    top: 480px;
    right: 80px;
    left: 120px;
    z-index: 3;
  }

  .tip {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    padding: 28px 0;
    border-bottom: 1px solid #e4e4e4;
  }

  .tip:first-child {
    border-top: 1px solid #e4e4e4;
  }

  .tip-number {
    font-family: 'Playpen Sans Hebrew', cursive;
    font-weight: 600;
    font-size: 28px;
    color: #7dd4ac;
    min-width: 32px;
    line-height: 1.3;
  }

  .tip-text {
    font-family: 'Assistant', sans-serif;
    font-weight: 400;
    font-size: 24px;
    line-height: 1.5;
    color: #2a2a2a;
  }

  .tip-text span {
    color: #666;
    font-weight: 300;
    font-size: 20px;
  }

  /* Decorative thin line — top left corner */
  .corner-line-h {
    position: absolute;
    top: 72px;
    left: 80px;
    width: 60px;
    height: 1px;
    background: #d0d0d0;
    z-index: 3;
  }

  .corner-line-v {
    position: absolute;
    top: 72px;
    left: 80px;
    width: 1px;
    height: 60px;
    background: #d0d0d0;
    z-index: 3;
  }

  /* Bottom logo area */
  .bottom-bar {
    position: absolute;
    bottom: 52px;
    right: 80px;
    left: 120px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 3;
  }

  .logo-group {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-circles {
    width: 36px;
    height: 36px;
    position: relative;
    flex-shrink: 0;
  }

  .logo-text {
    font-family: 'Playpen Sans Hebrew', cursive;
    font-weight: 600;
    font-size: 22px;
    color: #1e3a5f;
  }

  .site-url {
    font-family: 'Assistant', sans-serif;
    font-weight: 300;
    font-size: 15px;
    color: #999;
    letter-spacing: 1px;
  }

  /* Decorative dot pattern — bottom left */
  .dots {
    position: absolute;
    bottom: 160px;
    left: 80px;
    z-index: 1;
    opacity: 0.25;
  }
</style>
</head>
<body>

<div class="post">
  <!-- Thin border frame -->
  <div class="frame"></div>

  <!-- Giant background "3" -->
  <div class="giant-number">3</div>

  <!-- Vertical side text -->
  <div class="vertical-text">learni.ai</div>

  <!-- Decorative corner lines — top left -->
  <div class="corner-line-h"></div>
  <div class="corner-line-v"></div>

  <!-- Category badge -->
  <div class="category">
    <div class="category-line"></div>
    <div class="category-label">טיפ יומי</div>
  </div>

  <!-- Title -->
  <div class="title-area">
    <span class="title-accent">3</span>
    <span class="title-main">פרומפטים <strong>שישנו לכם</strong><br>את הבוקר</span>
    <div class="title-divider"></div>
  </div>

  <!-- Tips -->
  <div class="tips">
    <div class="tip">
      <div class="tip-number">01</div>
      <div class="tip-text">"תכנן לי את היום ב-5 משימות מרכזיות"</div>
    </div>
    <div class="tip">
      <div class="tip-number">02</div>
      <div class="tip-text">"תסכם לי את המייל הזה בשלוש נקודות"</div>
    </div>
    <div class="tip">
      <div class="tip-number">03</div>
      <div class="tip-text">"תכתוב תשובה מנומסת ומקצועית למייל הזה"</div>
    </div>
  </div>

  <!-- Decorative dot grid -->
  <div class="dots">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
      <circle cx="4" cy="4" r="2" fill="#7dd4ac"/>
      <circle cx="20" cy="4" r="2" fill="#7dd4ac"/>
      <circle cx="36" cy="4" r="2" fill="#7dd4ac"/>
      <circle cx="4" cy="20" r="2" fill="#7dd4ac"/>
      <circle cx="20" cy="20" r="2" fill="#7dd4ac"/>
      <circle cx="36" cy="20" r="2" fill="#7dd4ac"/>
      <circle cx="4" cy="36" r="2" fill="#7dd4ac"/>
      <circle cx="20" cy="36" r="2" fill="#7dd4ac"/>
      <circle cx="36" cy="36" r="2" fill="#7dd4ac"/>
    </svg>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="logo-group">
      <!-- Logo: two overlapping circles -->
      <div class="logo-circles">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <circle cx="14" cy="18" r="11" fill="#7babd4" opacity="0.7"/>
          <circle cx="22" cy="18" r="11" fill="#7dd4ac" opacity="0.7"/>
        </svg>
      </div>
      <span class="logo-text">Learni</span>
    </div>
    <span class="site-url">learni.ai</span>
  </div>
</div>

</body>
</html>
