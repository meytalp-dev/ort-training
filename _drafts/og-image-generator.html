<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Karantina:wght@700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Heebo', sans-serif;
    background: linear-gradient(135deg, #FFF7ED 0%, #FFFFFF 40%, #F0FDFA 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Decorative circles */
  .circle-1 {
    position: absolute;
    top: -80px;
    left: -80px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(13, 148, 136, 0.06);
  }
  .circle-2 {
    position: absolute;
    bottom: -100px;
    right: -60px;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: rgba(234, 118, 46, 0.06);
  }
  .circle-3 {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: rgba(13, 148, 136, 0.03);
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 60px;
    max-width: 1000px;
  }

  .badge {
    display: inline-block;
    background: rgba(13, 148, 136, 0.1);
    color: #0D9488;
    font-size: 18px;
    font-weight: 700;
    padding: 8px 24px;
    border-radius: 30px;
    margin-bottom: 28px;
    letter-spacing: 0.3px;
  }

  h1 {
    font-family: 'Heebo', sans-serif;
    font-size: 64px;
    font-weight: 900;
    color: #1F2937;
    line-height: 1.3;
    margin-bottom: 24px;
  }

  h1 .dream {
    font-family: 'Karantina', cursive;
    color: #EA762E;
    font-size: 78px;
    position: relative;
  }

  h1 .dream::after {
    content: '';
    position: absolute;
    bottom: 2px;
    right: 0;
    width: 100%;
    height: 6px;
    background: rgba(234, 118, 46, 0.25);
    border-radius: 3px;
  }

  .subtitle {
    font-size: 24px;
    color: #6B7280;
    line-height: 1.6;
    margin-bottom: 36px;
  }

  .subtitle strong {
    color: #374151;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 8px;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #1F2937;
    color: #fff;
    padding: 10px 24px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 700;
  }

  .brand-logo .cc {
    color: #EA762E;
    font-weight: 900;
  }

  .brand-text {
    font-size: 18px;
    color: #9CA3AF;
    font-weight: 400;
  }

  /* Corner accent */
  .corner-accent {
    position: absolute;
    top: 0;
    right: 0;
    width: 120px;
    height: 120px;
    overflow: hidden;
  }
  .corner-accent::after {
    content: '';
    position: absolute;
    top: -60px;
    right: -60px;
    width: 120px;
    height: 120px;
    background: linear-gradient(135deg, #EA762E, #F59E0B);
    border-radius: 50%;
    opacity: 0.15;
  }
</style>
</head>
<body>
  <div class="circle-1"></div>
  <div class="circle-2"></div>
  <div class="circle-3"></div>
  <div class="corner-accent"></div>

  <div class="content">
    <div class="badge">הדרכה מעשית בעברית לאנשי חינוך</div>
    <h1>יש לכם <span class="dream">חלום</span> שיכול<br>לשנות את עולם החינוך?</h1>
    <p class="subtitle">
      בנו <strong>כלים טכנולוגיים מתקדמים</strong> בעזרת בינה מלאכותית.<br>
      <strong>בלי לכתוב שורת קוד אחת.</strong>
    </p>
    <div class="brand">
      <div class="brand-logo"><span class="cc">Claude Code</span> Workshop</div>
      <span class="brand-text">|  Learni</span>
    </div>
  </div>
</body>
</html>
