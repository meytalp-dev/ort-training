<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<title>Managed Agents — Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@500;700;800&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Heebo', sans-serif;
    background: #f8fafb;
    color: #1e3a5f;
    position: relative;
    padding: 130px 80px 70px 80px;
  }

  /* Decorative gradient blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    pointer-events: none;
  }
  .blob-1 {
    width: 380px; height: 380px;
    background: #7babd4;
    top: -100px; left: -120px;
  }
  .blob-2 {
    width: 320px; height: 320px;
    background: #7dd4ac;
    bottom: -80px; right: -80px;
  }
  .blob-3 {
    width: 200px; height: 200px;
    background: #a8c8f0;
    top: 200px; right: 250px;
    opacity: 0.35;
  }

  /* Logo top-right (RTL) */
  .logo {
    position: absolute;
    top: 50px;
    right: 60px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 10;
  }
  .logo-mark {
    width: 56px;
    height: 36px;
    position: relative;
  }
  .logo-mark .circle {
    position: absolute;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    top: 0;
  }
  .logo-mark .left  { background: #7babd4; right: 0; }
  .logo-mark .right { background: #7dd4ac; left: 0; mix-blend-mode: multiply; }
  .logo-text {
    font-family: 'Playpen Sans Hebrew', cursive;
    font-weight: 700;
    font-size: 32px;
    color: #1e3a5f;
    letter-spacing: -1px;
  }

  /* Tag pill */
  .tag {
    display: inline-block;
    background: rgba(123, 171, 212, 0.15);
    color: #5a93c0;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 28px;
    border: 1.5px solid rgba(123, 171, 212, 0.3);
  }

  /* Headline — Heebo for reliable Hebrew rendering */
  .headline {
    font-family: 'Heebo', sans-serif;
    font-weight: 900;
    font-size: 76px;
    line-height: 1.05;
    color: #1e3a5f;
    max-width: 1040px;
    margin-bottom: 28px;
    position: relative;
    z-index: 5;
    letter-spacing: -2px;
  }
  .headline .accent {
    background: linear-gradient(135deg, #7babd4, #5abf92);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subhead {
    font-size: 28px;
    font-weight: 500;
    color: #4a6a8a;
    max-width: 900px;
    margin-bottom: 50px;
    position: relative;
    z-index: 5;
  }

  /* Pull quote box */
  .quote-box {
    position: absolute;
    bottom: 70px;
    right: 80px;
    left: 80px;
    background: #ffffff;
    border-radius: 24px;
    padding: 32px 40px;
    box-shadow: 0 20px 60px rgba(30, 58, 95, 0.12);
    border-right: 6px solid #7dd4ac;
    z-index: 5;
  }
  .quote-text {
    font-size: 24px;
    font-weight: 600;
    color: #1e3a5f;
    line-height: 1.5;
  }
  .quote-text .strong {
    font-weight: 800;
    color: #5a93c0;
  }
  .quote-author {
    font-family: 'Heebo', sans-serif;
    font-weight: 500;
    font-size: 18px;
    color: #4a6a8a;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="logo">
    <div class="logo-mark">
      <div class="circle left"></div>
      <div class="circle right"></div>
    </div>
    <div class="logo-text">Learni</div>
  </div>

  <div class="tag">חדש מ-Anthropic · אפריל 2026</div>

  <div class="headline">
    Managed Agents.<br>
    <span class="accent">בשורה אמיתית?</span>
  </div>

  <div class="subhead">
    בחרתי לחקור איך הפיצ'ר החדש עוזר לי — והגעתי למסקנה לא צפויה.
  </div>

  <div class="quote-box">
    <div class="quote-text">
      <span class="strong">"אני לא נגד לשלם על AI.</span> אני נגד לשלם על AI שאני לא באמת צריכה."
    </div>
    <div class="quote-author">— מיטל פלג, Learni</div>
  </div>
</body>
</html>
