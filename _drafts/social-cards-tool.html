<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כלי השבוע — Learni</title>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@300;400;500;600;700;800&family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #ccc; }

.canvas {
  width: 1080px; height: 1080px;
  position: relative; overflow: hidden;
  background: linear-gradient(160deg, #eaf2fa 0%, #f0f6fb 40%, #e8f4f0 100%);
}
.canvas::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 15%, rgba(123,171,212,0.22) 0%, transparent 70%),
    radial-gradient(ellipse 50% 55% at 85% 75%, rgba(125,212,172,0.16) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 50% 45%, rgba(184,169,212,0.12) 0%, transparent 70%);
}
.canvas::after {
  content: '';
  position: absolute; inset: 0; z-index: 50;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
}

/* ========== CATEGORY BADGE ========== */
.cat {
  position: absolute; top: 52px; right: 60px; z-index: 10;
  background: #7babd4; color: #fff;
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 28px; font-weight: 800;
  padding: 12px 32px; border-radius: 28px;
  box-shadow: 0 4px 0 rgba(30,58,95,0.08), 0 10px 28px rgba(123,171,212,0.3);
  display: flex; align-items: center; gap: 12px;
  letter-spacing: 0.5px;
}
.cat svg { width: 24px; height: 24px; fill: #fff; }

/* ========== HERO TITLE ========== */
.title-area {
  position: absolute; top: 120px; right: 60px; left: 60px; z-index: 10;
}
.title-label {
  font-family: 'Assistant', sans-serif;
  font-size: 30px; font-weight: 800; color: rgba(30,58,95,0.7);
  margin-bottom: 4px;
}
.title-name {
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 120px; font-weight: 800; color: #1e3a5f;
  line-height: 1;
  text-shadow: 0 4px 30px rgba(123,171,212,0.2);
}
.subtitle {
  font-family: 'Assistant', sans-serif;
  font-size: 34px; font-weight: 500; color: rgba(30,58,95,0.65);
  margin-top: 8px;
}

/* ========== HERO CARD (Featured) ========== */
.hero-card {
  position: absolute; top: 400px; right: 55px; left: 55px; z-index: 11;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-radius: 28px;
  padding: 38px 40px;
  border: 2px solid rgba(255,255,255,0.95);
  border-top: 6px solid #7babd4;
  transform: rotate(-1.5deg) scale(1.08);
  box-shadow:
    0 20px 60px rgba(123,171,212,0.22),
    0 6px 16px rgba(0,0,0,0.07),
    0 36px 80px rgba(30,58,95,0.1);
  display: flex; align-items: center; gap: 24px;
}
.hero-icon {
  flex-shrink: 0; width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, rgba(123,171,212,0.18), rgba(123,171,212,0.08));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(123,171,212,0.2);
}
.hero-icon svg { width: 34px; height: 34px; }
.hero-txt {
  font-family: 'Assistant', sans-serif;
  font-size: 34px; font-weight: 700;
  color: #1e3a5f; line-height: 1.45;
}

/* ========== COMPACT PILLS ========== */
.pills {
  position: absolute; top: 610px; right: 60px; left: 60px; z-index: 10;
  display: flex; gap: 24px;
}
.pill {
  flex: 1;
  background: rgba(255,255,255,0.82);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-radius: 22px;
  padding: 26px 28px;
  border: 1.5px solid rgba(255,255,255,0.9);
  display: flex; align-items: center; gap: 16px;
  transform: rotate(0.8deg);
  box-shadow:
    0 10px 35px rgba(123,171,212,0.15),
    0 4px 12px rgba(0,0,0,0.04),
    0 18px 50px rgba(30,58,95,0.06);
}
.pill:first-child {
  border-top: 4px solid #5a94c4;
  transform: rotate(1.2deg);
}
.pill:last-child {
  border-top: 4px solid #b8a9d4;
  transform: rotate(-0.8deg);
}
.pill-icon {
  flex-shrink: 0; width: 50px; height: 50px; border-radius: 50%;
  background: rgba(123,171,212,0.1);
  display: flex; align-items: center; justify-content: center;
}
.pill-icon svg { width: 26px; height: 26px; }
.pill-txt {
  font-family: 'Assistant', sans-serif;
  font-size: 28px; font-weight: 600;
  color: #1e3a5f; line-height: 1.4;
}

/* ========== CTA BUTTON ========== */
.cta {
  position: absolute; top: 780px; right: 60px; z-index: 12;
  background: linear-gradient(135deg, #1e3a5f, #2a5080);
  color: #fff;
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 30px; font-weight: 700;
  padding: 16px 48px; border-radius: 50px;
  box-shadow: 0 8px 28px rgba(30,58,95,0.25), 0 3px 8px rgba(0,0,0,0.1);
  display: flex; align-items: center; gap: 14px;
  text-decoration: none;
}
.cta svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ========== VERDICT STAMP ========== */
.stamp {
  position: absolute; bottom: 140px; left: 60px; z-index: 20;
  width: 160px; height: 160px;
  border: 6px solid #1e3a5f;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transform: rotate(-14deg);
  background: rgba(255,255,255,0.92);
  box-shadow:
    0 0 0 4px rgba(30,58,95,0.08),
    0 12px 36px rgba(30,58,95,0.18),
    inset 0 0 20px rgba(123,171,212,0.06);
}
.stamp-inner {
  width: 134px; height: 134px;
  border: 3px dashed rgba(30,58,95,0.35);
  border-radius: 50%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
}
.stamp-text {
  font-family: 'Playpen Sans Hebrew', cursive;
  font-size: 28px; font-weight: 800; color: #1e3a5f;
  text-align: center; line-height: 1.15;
}
.stamp-stars {
  display: flex; gap: 4px;
  margin-top: 2px;
}
.stamp-stars svg { width: 18px; height: 18px; }

/* ========== BOTTOM BAR ========== */
.bottom {
  position: absolute; bottom: 36px; right: 60px; left: 60px;
  z-index: 10; display: flex; align-items: center; justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 14px; }
.logo-circles { position: relative; width: 44px; height: 38px; }
.logo-circles .c1, .logo-circles .c2 { position: absolute; width: 30px; height: 30px; border-radius: 50%; top: 4px; }
.logo-circles .c1 { right: 0; background: #7babd4; opacity: 0.85; }
.logo-circles .c2 { right: 15px; background: #7dd4ac; opacity: 0.85; }
.logo-name { font-family: 'Playpen Sans Hebrew', cursive; font-size: 28px; font-weight: 700; color: #1e3a5f; }
.url { font-family: 'Assistant', sans-serif; font-size: 28px; font-weight: 600; color: rgba(30,58,95,0.55); direction: ltr; }
</style>
</head>
<body>
<div class="canvas">

  <!-- Category badge -->
  <div class="cat">
    <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" fill="none" stroke="#fff" stroke-width="2.5"/><polyline points="3.27 6.96 12 12.01 20.73 6.96" fill="none" stroke="#fff" stroke-width="2.5"/><line x1="12" y1="22.08" x2="12" y2="12" stroke="#fff" stroke-width="2.5"/></svg>
    כלי השבוע
  </div>

  <!-- Hero title -->
  <div class="title-area">
    <div class="title-label">כלי השבוע:</div>
    <div class="title-name">Gamma</div>
    <div class="subtitle">מצגות מקצועיות ב-30 שניות</div>
  </div>

  <!-- Hero featured card -->
  <div class="hero-card">
    <div class="hero-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5a94c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26z" fill="rgba(123,171,212,0.15)"/>
      </svg>
    </div>
    <div class="hero-txt">כותבים פרומפט &#x2190; מקבלים מצגת מוכנה עם עיצוב</div>
  </div>

  <!-- Compact pills -->
  <div class="pills">
    <div class="pill">
      <div class="pill-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5a94c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </div>
      <div class="pill-txt">עורכים כל שקף בנפרד</div>
    </div>
    <div class="pill">
      <div class="pill-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7b6daf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
        </svg>
      </div>
      <div class="pill-txt">משתפים בקישור — בלי הורדות</div>
    </div>
  </div>

  <!-- CTA button -->
  <div class="cta">
    <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    לנסות את Gamma
  </div>

  <!-- Verdict stamp -->
  <div class="stamp">
    <div class="stamp-inner">
      <div class="stamp-text">שווה<br>לנסות!</div>
      <div class="stamp-stars">
        <svg viewBox="0 0 24 24" fill="#1e3a5f"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01z"/></svg>
        <svg viewBox="0 0 24 24" fill="#1e3a5f"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01z"/></svg>
        <svg viewBox="0 0 24 24" fill="#1e3a5f"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01z"/></svg>
        <svg viewBox="0 0 24 24" fill="#1e3a5f"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01z"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="#1e3a5f" stroke-width="2.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01z"/></svg>
      </div>
    </div>
  </div>

  <!-- Bottom bar -->
  <div class="bottom">
    <div class="logo">
      <div class="logo-circles"><div class="c1"></div><div class="c2"></div></div>
      <div class="logo-name">Learni</div>
    </div>
    <div class="url">learni.ai</div>
  </div>

</div>
</body>
</html>
