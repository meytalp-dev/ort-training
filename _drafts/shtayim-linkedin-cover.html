<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שתיים — כיסוי לינקדאין</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Rubik:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --plum: #7B5EA7;
            --plum-dark: #5A3D8A;
            --coral: #E8836B;
            --coral-dark: #D06A52;
            --sand: #F9F6F1;
            --cream: #FFFCF8;
            --charcoal: #2D2B3A;
            --mint: #5BBF9E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Heebo', sans-serif;
            background: #f5f3ee;
            color: var(--charcoal);
            padding: 40px;
            direction: rtl;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Rubik', sans-serif;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
            color: var(--plum-dark);
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 32px;
            font-size: 14px;
        }

        canvas {
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-family: 'Heebo', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 16px;
            background: linear-gradient(135deg, var(--plum), var(--coral));
            color: #fff;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123,94,167,0.3);
        }
    </style>
</head>
<body>
    <h1>שתיים — תמונת כיסוי לינקדאין</h1>
    <p class="subtitle">1128x191 פיקסלים — המידה הנכונה ללינקדאין</p>

    <canvas id="cover" width="1128" height="191"></canvas>
    <button class="btn" onclick="download()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        הורדה
    </button>

    <script>
        document.fonts.ready.then(draw);

        function draw() {
            const c = document.getElementById('cover');
            const ctx = c.getContext('2d');
            const w = 1128, h = 191;

            // Background - dark
            ctx.fillStyle = '#0D0A14';
            ctx.fillRect(0, 0, w, h);

            // Gradient accent strip at bottom
            const stripGrad = ctx.createLinearGradient(0, h - 4, w, h - 4);
            stripGrad.addColorStop(0, '#7B5EA7');
            stripGrad.addColorStop(1, '#E8836B');
            ctx.fillStyle = stripGrad;
            ctx.fillRect(0, h - 4, w, 4);

            // Decorative background shapes
            ctx.globalAlpha = 0.06;
            ctx.fillStyle = '#7B5EA7';
            ctx.beginPath();
            ctx.arc(200, 30, 200, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#E8836B';
            ctx.beginPath();
            ctx.arc(900, 170, 180, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            // === Right side: Logo dots + שתיים ===
            const logoX = 900;
            const logoY = h / 2 - 15;
            const dotSize = 22;
            const gap = 32;

            // Plum dot
            ctx.shadowColor = 'rgba(0,0,0,0.1)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 2;

            const plumGrad = ctx.createRadialGradient(logoX - gap, logoY, 0, logoX - gap, logoY, dotSize);
            plumGrad.addColorStop(0, '#8B6FB7');
            plumGrad.addColorStop(1, '#5A3D8A');
            ctx.fillStyle = plumGrad;
            ctx.beginPath();
            ctx.arc(logoX - gap, logoY, dotSize, 0, Math.PI * 2);
            ctx.fill();

            // Bridge
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            const bridgeGrad = ctx.createLinearGradient(logoX - gap + dotSize, logoY, logoX + gap - dotSize, logoY);
            bridgeGrad.addColorStop(0, '#7B5EA7');
            bridgeGrad.addColorStop(1, '#E8836B');
            ctx.strokeStyle = bridgeGrad;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(logoX - gap + dotSize + 3, logoY);
            ctx.lineTo(logoX + gap - dotSize - 3, logoY);
            ctx.stroke();

            // Coral dot
            ctx.shadowColor = 'rgba(0,0,0,0.1)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 2;

            const coralGrad = ctx.createRadialGradient(logoX + gap, logoY, 0, logoX + gap, logoY, dotSize);
            coralGrad.addColorStop(0, '#F09580');
            coralGrad.addColorStop(1, '#D06A52');
            ctx.fillStyle = coralGrad;
            ctx.beginPath();
            ctx.arc(logoX + gap, logoY, dotSize, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            // "שתיים" under logo
            ctx.fillStyle = '#FFFCF8';
            ctx.font = '800 28px Rubik';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('שתיים', logoX, logoY + dotSize + 12);

            // === Left-center: Tagline + values ===
            const textX = 380;

            // Main tagline
            ctx.fillStyle = '#FFFCF8';
            ctx.font = '700 26px Rubik';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('שתיים בונות — עמותות גדלות', textX, 55);

            // Subtitle
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '400 15px Heebo';
            ctx.fillText('מערכות ניהול דיגיטליות בהתאמה אישית, באמצעות AI', textX, 90);

            // Three value pills
            const pills = ['AI מותאם', 'חיסכון מיידי', 'ניסיון ניהולי'];
            const pillColors = ['#7B5EA7', '#E8836B', '#5BBF9E'];
            const pillY = 120;
            const pillGap = 140;
            const startX = textX - pillGap;

            pills.forEach((text, i) => {
                const px = startX + i * pillGap;

                // Pill background
                ctx.fillStyle = pillColors[i] + '25';
                ctx.beginPath();
                ctx.roundRect(px - 50, pillY, 100, 30, 15);
                ctx.fill();

                // Pill border
                ctx.strokeStyle = pillColors[i] + '50';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(px - 50, pillY, 100, 30, 15);
                ctx.stroke();

                // Pill text
                ctx.fillStyle = pillColors[i];
                ctx.font = '600 13px Heebo';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, px, pillY + 15);
            });

            // Subtle separator line
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(680, 30);
            ctx.lineTo(680, h - 30);
            ctx.stroke();
        }

        function download() {
            const canvas = document.getElementById('cover');
            const link = document.createElement('a');
            link.download = 'shtayim-linkedin-cover-1128x191.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
