<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@400;700;800&family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1280px;
            height: 720px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .title {
            font-family: 'Playpen Sans Hebrew', cursive;
            font-size: 110px;
            font-weight: 800;
            color: #E8A0BF;
            text-shadow: 0 4px 30px rgba(0,0,0,0.8), 0 2px 10px rgba(0,0,0,0.6), 0 0 40px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 8px;
        }
        .subtitle {
            font-family: 'Playpen Sans Hebrew', cursive;
            font-size: 46px;
            font-weight: 700;
            color: white;
            text-shadow: 0 3px 20px rgba(0,0,0,0.8), 0 1px 6px rgba(0,0,0,0.6);
            margin-bottom: 10px;
        }
        .line {
            margin-bottom: 25px;
        }
        .body-text {
            font-family: 'Varela Round', sans-serif;
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 20px rgba(0,0,0,0.9), 0 1px 8px rgba(0,0,0,0.7), 0 0 30px rgba(0,0,0,0.5);
            text-align: center;
            line-height: 1.8;
        }
        .signature {
            font-family: 'Playpen Sans Hebrew', cursive;
            font-size: 26px;
            font-weight: 700;
            color: #F0C05A;
            text-shadow: 0 2px 15px rgba(0,0,0,0.9), 0 1px 6px rgba(0,0,0,0.7);
            text-align: center;
            margin-top: 25px;
        }
        .flower {
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
        }
    </style>
</head>
<body>
    <div class="title">
        <svg class="flower" viewBox="0 0 80 80" width="55" height="55">
            <g transform="translate(40,40)">
                <path d="M0,-18 C7,-16 11,-7 0,0 C-11,-7 -7,-16 0,-18Z" fill="#E84B8A" opacity="0.9"/>
                <path d="M0,-18 C7,-16 11,-7 0,0 C-11,-7 -7,-16 0,-18Z" fill="#D63A78" opacity="0.9" transform="rotate(72)"/>
                <path d="M0,-18 C7,-16 11,-7 0,0 C-11,-7 -7,-16 0,-18Z" fill="#E84B8A" opacity="0.9" transform="rotate(144)"/>
                <path d="M0,-18 C7,-16 11,-7 0,0 C-11,-7 -7,-16 0,-18Z" fill="#D63A78" opacity="0.9" transform="rotate(216)"/>
                <path d="M0,-18 C7,-16 11,-7 0,0 C-11,-7 -7,-16 0,-18Z" fill="#E84B8A" opacity="0.9" transform="rotate(288)"/>
                <circle cx="0" cy="0" r="4" fill="#F0C05A"/>
            </g>
        </svg>
        חג פסח שמח
        <svg class="flower" viewBox="0 0 80 80" width="55" height="55">
            <g transform="translate(40,40)">
                <path d="M0,-18 C7,-16 11,-7 0,0 C-11,-7 -7,-16 0,-18Z" fill="#E84B8A" opacity="0.9"/>
                <path d="M0,-18 C7,-16 11,-7 0,0 C-11,-7 -7,-16 0,-18Z" fill="#D63A78" opacity="0.9" transform="rotate(72)"/>
                <path d="M0,-18 C7,-16 11,-7 0,0 C-11,-7 -7,-16 0,-18Z" fill="#E84B8A" opacity="0.9" transform="rotate(144)"/>
                <path d="M0,-18 C7,-16 11,-7 0,0 C-11,-7 -7,-16 0,-18Z" fill="#D63A78" opacity="0.9" transform="rotate(216)"/>
                <path d="M0,-18 C7,-16 11,-7 0,0 C-11,-7 -7,-16 0,-18Z" fill="#E84B8A" opacity="0.9" transform="rotate(288)"/>
                <circle cx="0" cy="0" r="4" fill="#F0C05A"/>
            </g>
        </svg>
    </div>
    <div class="subtitle">קהילה יקרה</div>
    <svg class="line" width="250" height="20">
        <path d="M20,12 Q125,0 230,12" stroke="#E84B8A" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="body-text">
        הלוואי שחג החירות והאביב<br>
        יביא איתו תקווה לימים טובים יותר<br>
        וחזרה לשגרה מבורכת<br>
        עם התלמידים היקרים שלנו
    </div>
    <div class="signature">
        מאחלים לכם ולבני משפחותיכם חג פסח שמח וכשר<br>
        מיטל פלג וכל צוות בית הספר
    </div>
</body>
</html>
