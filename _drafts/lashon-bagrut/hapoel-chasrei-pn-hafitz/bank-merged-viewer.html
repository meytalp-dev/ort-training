      const bankNames = {lashonimi_single:'לש. single', lashonimi_select:'לש. select', antebi:'ענתבי'};
      const bankBadge = q._bank ? '<span class="badge b-bank-' + q._bank + '">' + (bankNames[q._bank]||q._bank) + '</span>' : '';
      const levelName = {easy:'בסיסי', mid:'בינוני', hard:'מתקדם'}[sec.cls];
      const trapBadge = q.trap ? '<span class="badge b-trap">\u26A0 מלכודת</span>' : '';
      const optionsHtml = q.options.map((opt, idx) =>
        '<div class="option ' + (idx === q.correct ? 'correct' : '') + '">' + opt + '</div>'
      ).join('');
      const verifyMethod = q.verified ? q.verified.method : '-';
      const verifyDate = q.verified ? q.verified.date : '-';
      const srcQuote = q.verified && q.verified.source_quote ?
        '<div style="background:#fff;border-right:3px solid #cbd5e1;padding:6px 10px;margin-top:6px;border-radius:4px;font-style:italic;font-size:12px">"' + q.verified.source_quote + '"</div>' : '';
      const srcUrl = q.source ? (q.source.url || '#') : '#';
      const srcQuiz = q.source ? (q.source.quiz || '?') : '?';
      const srcQid = q.source ? (q.source.qid || '?') : '?';
      html += '<div class="question-card" data-level="' + sec.cls + '" data-trap="' + (q.trap ? '1' : '0') + '" data-bank="' + (q._bank||'') + '">' +
        '<div class="q-header"><div class="q-num">' + q.id + '</div>' +
        '<div class="badges">' + bankBadge + gizraBadges + '<span class="badge b-level-' + sec.cls + '">' + levelName + '</span>' + trapBadge + '</div></div>' +
        '<div class="question-text">' + q.q + '</div>' +
        '<div class="options">' + optionsHtml + '</div>' +
        '<div class="explain"><strong>הסבר:</strong> ' + q.explain + '</div>' +
        '<details><summary>\uD83D\uDCDA מקור ואימות</summary>' +
        '<div class="source-box">' +
        '<div class="row"><span class="label">מקור:</span> <a href="' + srcUrl + '" target="_blank">' + srcQuiz + '</a> (' + srcQid + ')</div>' +
        '<div class="row"><span class="label">שיטה:</span> ' + verifyMethod + '</div>' +
        '<div class="row"><span class="label">תאריך:</span> ' + verifyDate + '</div>' +
        srcQuote + '</div></details></div>';
    });
  });
  wrap.innerHTML = html;

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const all = document.querySelectorAll('.question-card');
      const secs = document.querySelectorAll('.level-section');
      const isLevelFilter = !!btn.dataset.level;
      const isTrapFilter = btn.dataset.trap === '1';
      const isBankFilter = !!btn.dataset.bank;
      const isAll = btn.dataset.filter === 'all';

      if (isAll) {
        secs.forEach(s => s.style.display = '');
        all.forEach(c => c.style.display = '');
      } else if (isLevelFilter) {
        secs.forEach(s => s.style.display = s.dataset.level === btn.dataset.level ? '' : 'none');
        all.forEach(c => c.style.display = c.dataset.level === btn.dataset.level ? '' : 'none');
      } else if (isTrapFilter) {
        secs.forEach(s => s.style.display = 'none');
        all.forEach(c => c.style.display = c.dataset.trap === '1' ? '' : 'none');
      } else if (isBankFilter) {
        secs.forEach(s => s.style.display = 'none');
        all.forEach(c => c.style.display = c.dataset.bank === btn.dataset.bank ? '' : 'none');
      }
    });
  });
})();
</script>
</body>
</html>
