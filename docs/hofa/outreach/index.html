<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הופה — מפת קשרים ברשויות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --yellow: #FFF200;
    --pink: #FF6B9D;
    --black: #0A0A0A;
    --gray-50: #FAFAFA;
    --gray-100: #F4F4F5;
    --gray-200: #E4E4E7;
    --gray-400: #A1A1AA;
    --gray-600: #52525B;
    --gray-900: #18181B;
    --green: #10B981;
    --orange: #F59E0B;
    --blue: #3B82F6;
  }
  html, body { font-family: 'Heebo', sans-serif; background: var(--gray-50); color: var(--black); line-height: 1.5; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px; }

  /* Header */
  header {
    background: var(--black);
    color: var(--yellow);
    padding: 32px 24px;
    border-radius: 24px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -60px; left: -60px;
    width: 200px; height: 200px;
    background: var(--pink);
    border-radius: 50%;
    opacity: 0.2;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -80px; right: -40px;
    width: 220px; height: 220px;
    background: var(--yellow);
    border-radius: 50%;
    opacity: 0.1;
  }
  header h1 { font-size: 2.4rem; font-weight: 900; letter-spacing: -0.5px; position: relative; z-index: 1; }
  header p { font-size: 1.05rem; color: #fff; margin-top: 8px; opacity: 0.9; position: relative; z-index: 1; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat {
    background: white;
    padding: 16px 20px;
    border-radius: 16px;
    border: 2px solid var(--gray-200);
    transition: transform 0.2s;
  }
  .stat:hover { transform: translateY(-2px); }
  .stat-value { font-size: 1.8rem; font-weight: 900; color: var(--black); }
  .stat-label { font-size: 0.85rem; color: var(--gray-600); margin-top: 2px; }
  .stat.yellow { background: var(--yellow); border-color: var(--black); }
  .stat.pink { background: var(--pink); color: white; border-color: var(--black); }
  .stat.pink .stat-label { color: white; opacity: 0.9; }
  .stat.pink .stat-value { color: white; }

  /* Controls */
  .controls {
    background: white;
    padding: 20px;
    border-radius: 20px;
    margin-bottom: 20px;
    border: 2px solid var(--gray-200);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .search {
    flex: 1;
    min-width: 240px;
    padding: 12px 18px;
    border: 2px solid var(--gray-200);
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    background: var(--gray-50);
  }
  .search:focus { outline: none; border-color: var(--black); background: white; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 8px 14px;
    border: 2px solid var(--gray-200);
    background: white;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--black); }
  .chip.active { background: var(--black); color: var(--yellow); border-color: var(--black); }
  .chip.cat-large.active { background: var(--blue); color: white; border-color: var(--blue); }
  .chip.cat-periphery.active { background: var(--orange); color: white; border-color: var(--orange); }
  .chip.cat-mixed.active { background: var(--green); color: white; border-color: var(--green); }
  .chip.cat-arab.active { background: #8B5CF6; color: white; border-color: #8B5CF6; }
  .chip.cat-at-risk.active { background: var(--pink); color: white; border-color: var(--pink); }

  .export-btn {
    padding: 10px 18px;
    background: var(--yellow);
    color: var(--black);
    border: 2px solid var(--black);
    border-radius: 12px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .export-btn:hover { background: var(--black); color: var(--yellow); }

  /* Municipality cards */
  .muni-grid { display: grid; gap: 16px; }
  .muni {
    background: white;
    border-radius: 20px;
    border: 2px solid var(--gray-200);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .muni:hover { border-color: var(--black); }
  .muni-header {
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    gap: 12px;
    flex-wrap: wrap;
  }
  .muni-title { display: flex; align-items: center; gap: 12px; }
  .muni-name { font-size: 1.25rem; font-weight: 800; }
  .cat-badge {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    color: white;
  }
  .cat-large { background: var(--blue); }
  .cat-periphery { background: var(--orange); }
  .cat-mixed { background: var(--green); }
  .cat-arab { background: #8B5CF6; }
  .cat-at-risk { background: var(--pink); }

  .muni-meta { font-size: 0.85rem; color: var(--gray-600); display: flex; gap: 10px; align-items: center; }
  .toggle-icon { transition: transform 0.2s; font-size: 1.2rem; color: var(--gray-400); }
  .muni.open .toggle-icon { transform: rotate(180deg); }

  .contacts { display: none; padding: 0 20px 20px; border-top: 1px solid var(--gray-200); }
  .muni.open .contacts { display: block; }
  .contact {
    padding: 14px;
    margin-top: 12px;
    background: var(--gray-50);
    border-radius: 12px;
    border-right: 4px solid var(--yellow);
  }
  .contact.not-found { border-right-color: var(--gray-200); opacity: 0.6; }
  .contact-role { font-size: 0.8rem; color: var(--gray-600); font-weight: 500; margin-bottom: 4px; }
  .contact-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
  .contact-name.unknown { color: var(--gray-400); font-weight: 500; font-style: italic; }
  .contact-info { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .info-pill {
    font-size: 0.85rem;
    padding: 6px 12px;
    background: white;
    border: 1px solid var(--gray-200);
    border-radius: 999px;
    color: var(--gray-900);
    text-decoration: none;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .info-pill:hover { background: var(--black); color: var(--yellow); border-color: var(--black); }
  .info-pill .label { color: var(--gray-400); font-size: 0.75rem; }

  /* Status tracker */
  .status-row {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    padding-top: 10px;
    border-top: 1px dashed var(--gray-200);
  }
  .status-row label { font-size: 0.85rem; color: var(--gray-600); font-weight: 500; }
  .status-select {
    padding: 6px 10px;
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.85rem;
    background: white;
    cursor: pointer;
  }
  .note-input {
    flex: 1;
    min-width: 200px;
    padding: 6px 10px;
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.85rem;
  }

  .empty { text-align: center; padding: 60px 20px; color: var(--gray-400); }

  /* Note about role structure */
  .note-box {
    background: var(--yellow);
    border: 2px solid var(--black);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 20px;
    font-size: 0.95rem;
  }
  .note-box strong { font-weight: 800; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>מפת קשרים ברשויות</h1>
    <p>35 רשויות · אגפי חינוך · ליווי בוגרים 18-26 על הרצף</p>
  </header>

  <div class="note-box">
    <strong>הערה חשובה:</strong> תפקיד "רכז/ת בוגרים / מעבר לחיים עצמאיים" בדרך כלל לא קיים באגף חינוך — גילאי 18-26 מטופלים ב<strong>אגף הרווחה</strong> (רכז/ת אוטיזם או רכז/ת מוגבלויות). לפנייה ראשונית של הופה — עדיף לפנות לשני האגפים במקביל.
  </div>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <input type="text" class="search" id="search" placeholder="חיפוש לפי שם, רשות או תפקיד...">
    <div class="filters" id="catFilters">
      <button class="chip active" data-cat="all">הכל</button>
      <button class="chip cat-large" data-cat="large">רשויות גדולות</button>
      <button class="chip cat-periphery" data-cat="periphery">פריפריה דרום</button>
      <button class="chip cat-mixed" data-cat="mixed">מעורבות/צפון</button>
      <button class="chip cat-arab" data-cat="arab">רשות ערבית</button>
      <button class="chip cat-at-risk" data-cat="at-risk">נוער בסיכון</button>
    </div>
    <button class="export-btn" id="exportBtn">⬇ ייצא CSV</button>
    <button class="export-btn" id="expandAll" style="background: white;">⇕ פתח/סגור הכל</button>
  </div>

  <div class="muni-grid" id="grid"></div>

</div>

<script>
const STATUS_KEY = 'hofa-outreach-status-v1';
let DATA = [];
let statusMap = {};
let currentCat = 'all';
let currentSearch = '';
let allOpen = false;

const catLabels = {
  'large': 'רשות גדולה',
  'periphery': 'פריפריה',
  'mixed': 'מעורבת',
  'arab': 'ערבית',
  'at-risk': 'נוער בסיכון'
};

async function load() {
  const res = await fetch('contacts.json');
  DATA = await res.json();
  const saved = localStorage.getItem(STATUS_KEY);
  if (saved) statusMap = JSON.parse(saved);
  render();
}

function saveStatus() {
  localStorage.setItem(STATUS_KEY, JSON.stringify(statusMap));
}

function keyFor(muni, idx) {
  return `${muni}::${idx}`;
}

function statsFor(filtered) {
  const totalMuni = filtered.length;
  let named = 0, withLinkedIn = 0, withEmail = 0, withPhone = 0, contacted = 0;
  filtered.forEach(m => {
    m.contacts.forEach((c, i) => {
      if (c.name && c.name !== 'לא אותר') named++;
      if (c.linkedin) withLinkedIn++;
      if (c.email) withEmail++;
      if (c.phone) withPhone++;
      const st = statusMap[keyFor(m.municipality, i)]?.status;
      if (st && st !== 'not-contacted') contacted++;
    });
  });
  return { totalMuni, named, withLinkedIn, withEmail, withPhone, contacted };
}

function renderStats(s) {
  const el = document.getElementById('stats');
  el.innerHTML = `
    <div class="stat yellow"><div class="stat-value">${s.totalMuni}</div><div class="stat-label">רשויות</div></div>
    <div class="stat"><div class="stat-value">${s.named}</div><div class="stat-label">שמות זוהו</div></div>
    <div class="stat"><div class="stat-value">${s.withPhone}</div><div class="stat-label">עם טלפון</div></div>
    <div class="stat"><div class="stat-value">${s.withEmail}</div><div class="stat-label">עם מייל</div></div>
    <div class="stat"><div class="stat-value">${s.withLinkedIn}</div><div class="stat-label">עם LinkedIn</div></div>
    <div class="stat pink"><div class="stat-value">${s.contacted}</div><div class="stat-label">בוצעה פנייה</div></div>
  `;
}

function matchesFilter(muni) {
  if (currentCat !== 'all' && muni.category !== currentCat) return false;
  if (!currentSearch) return true;
  const q = currentSearch.toLowerCase();
  if (muni.municipality.toLowerCase().includes(q)) return true;
  return muni.contacts.some(c =>
    (c.name || '').toLowerCase().includes(q) ||
    (c.role || '').toLowerCase().includes(q) ||
    (c.email || '').toLowerCase().includes(q)
  );
}

function render() {
  const filtered = DATA.filter(matchesFilter);
  renderStats(statsFor(filtered));

  const grid = document.getElementById('grid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">לא נמצאו תוצאות</div>';
    return;
  }

  grid.innerHTML = filtered.map(muni => renderMuni(muni)).join('');
  wireInteractions();
}

function renderMuni(muni) {
  const catClass = `cat-${muni.category}`;
  const namedCount = muni.contacts.filter(c => c.name && c.name !== 'לא אותר').length;
  const totalCount = muni.contacts.length;
  const openClass = allOpen ? 'open' : '';

  return `
    <div class="muni ${openClass}" data-muni="${muni.municipality}">
      <div class="muni-header" onclick="this.parentElement.classList.toggle('open')">
        <div class="muni-title">
          <div class="muni-name">${muni.municipality}</div>
          <span class="cat-badge ${catClass}">${catLabels[muni.category]}</span>
        </div>
        <div class="muni-meta">
          <span>${namedCount}/${totalCount} אנשי קשר זוהו</span>
          <span class="toggle-icon">▾</span>
        </div>
      </div>
      <div class="contacts">
        ${muni.contacts.map((c, i) => renderContact(muni.municipality, c, i)).join('')}
      </div>
    </div>
  `;
}

function renderContact(muniName, c, idx) {
  const notFound = !c.name || c.name === 'לא אותר';
  const key = keyFor(muniName, idx);
  const saved = statusMap[key] || { status: 'not-contacted', note: '' };

  const pills = [];
  if (c.phone) pills.push(`<a class="info-pill" href="tel:${c.phone}"><span class="label">☎</span> ${c.phone}</a>`);
  if (c.email) pills.push(`<a class="info-pill" href="mailto:${c.email}"><span class="label">✉</span> ${c.email}</a>`);
  if (c.linkedin) pills.push(`<a class="info-pill" href="${c.linkedin}" target="_blank"><span class="label">in</span> LinkedIn</a>`);
  if (c.source) pills.push(`<a class="info-pill" href="${c.source}" target="_blank"><span class="label">🔗</span> מקור</a>`);

  return `
    <div class="contact ${notFound ? 'not-found' : ''}">
      <div class="contact-role">${c.role || ''}</div>
      <div class="contact-name ${notFound ? 'unknown' : ''}">${c.name || 'לא אותר'}</div>
      ${pills.length ? `<div class="contact-info">${pills.join('')}</div>` : ''}
      ${!notFound ? `
        <div class="status-row">
          <label>סטטוס:</label>
          <select class="status-select" data-key="${key}">
            <option value="not-contacted" ${saved.status === 'not-contacted' ? 'selected' : ''}>לא נוצר קשר</option>
            <option value="attempted" ${saved.status === 'attempted' ? 'selected' : ''}>נוסה קשר</option>
            <option value="contacted" ${saved.status === 'contacted' ? 'selected' : ''}>נוצר קשר</option>
            <option value="meeting" ${saved.status === 'meeting' ? 'selected' : ''}>פגישה נקבעה</option>
            <option value="not-relevant" ${saved.status === 'not-relevant' ? 'selected' : ''}>לא רלוונטי</option>
          </select>
          <input type="text" class="note-input" data-key="${key}" placeholder="הערות..." value="${(saved.note || '').replace(/"/g, '&quot;')}">
        </div>
      ` : ''}
    </div>
  `;
}

function wireInteractions() {
  document.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', e => {
      const key = e.target.dataset.key;
      if (!statusMap[key]) statusMap[key] = {};
      statusMap[key].status = e.target.value;
      saveStatus();
      renderStats(statsFor(DATA.filter(matchesFilter)));
    });
  });
  document.querySelectorAll('.note-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const key = e.target.dataset.key;
      if (!statusMap[key]) statusMap[key] = {};
      statusMap[key].note = e.target.value;
      saveStatus();
    });
  });
}

document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value;
  render();
});

document.querySelectorAll('.chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    render();
  });
});

document.getElementById('expandAll').addEventListener('click', () => {
  allOpen = !allOpen;
  render();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const rows = [['רשות', 'קטגוריה', 'תפקיד', 'שם', 'טלפון', 'מייל', 'LinkedIn', 'מקור', 'סטטוס', 'הערות']];
  DATA.forEach(m => {
    m.contacts.forEach((c, i) => {
      const key = keyFor(m.municipality, i);
      const saved = statusMap[key] || {};
      rows.push([
        m.municipality, catLabels[m.category], c.role || '', c.name || '',
        c.phone || '', c.email || '', c.linkedin || '', c.source || '',
        saved.status || '', saved.note || ''
      ]);
    });
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `hofa-outreach-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
});

load();
</script>
</body>
</html>
