    --dark: #212121;
    --dark-deep: #1A1A1A;

    --gray-border: #E6E6E6;
    --gray-bg: #F5F5F5;
    --green-success: #22C55E;
    --white: #FFFFFF;

    --facebook: #1877F2;
    --instagram: #E1306C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', sans-serif;
    background: var(--gray-bg);
    color: var(--dark);
    line-height: 1.6;
    padding-bottom: 80px;
  }
  .hero {
    background: var(--dark-deep);
    color: var(--white);
    padding: 48px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    background: var(--yellow-primary);
    border-radius: 50%;
    opacity: 0.15;
    filter: blur(60px);
    top: -100px; right: -100px;
  }
  .eyebrow {
    display: inline-block;
    padding: 6px 16px;
    background: var(--yellow-primary);
    color: var(--dark-deep);
    font-weight: 700;
    font-size: 13px;
    border-radius: 100px;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }
  .hero h1 {

    font-weight: 900;
    margin-bottom: 12px;
    position: relative;

  .hero p {

    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

    padding: 0 20px;
    position: relative;
    z-index: 2;

  .instructions {
    background: var(--white);

    color: var(--gray);

    align-items: center;
    gap: 12px;

  .post-num-badge {

    color: var(--white);
  }
  .post-body {
    padding: 28px;
  }
  .image-upload-zone {
    border: 2px dashed var(--gray-border);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--gray-bg);

    align-items: center;

    background: transparent;

    font-weight: 600;

  facebook: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.79-4.7 4.54-4.7 1.31 0 2.69.24 2.69.24v2.97h-1.52c-1.5 0-1.96.93-1.96 1.88v2.26h3.34l-.53 3.5h-2.81V24C19.61 23.1 24 18.1 24 12.07z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.72 3.72 0 01-1.38-.9 3.72 3.72 0 01-.9-1.38c-.16-.42-.36-1.06-.41-2.23C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41C8.42 2.17 8.8 2.16 12 2.16zM12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.8.3-1.48.72-2.15 1.4-.67.66-1.08 1.34-1.4 2.14-.3.77-.5 1.64-.56 2.91C.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.14.56 2.9.3.8.72 1.49 1.4 2.16.67.67 1.35 1.08 2.15 1.39.77.3 1.64.5 2.9.56 1.28.06 1.69.07 4.95.07s3.67-.01 4.95-.07c1.27-.06 2.14-.26 2.9-.56.8-.3 1.49-.72 2.16-1.4.67-.66 1.08-1.34 1.4-2.15.3-.77.5-1.64.56-2.9.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.14-.56-2.9a5.88 5.88 0 00-1.4-2.16A5.88 5.88 0 0019.86.63c-.77-.3-1.64-.5-2.91-.56C15.67.01 15.26 0 12 0zm0 5.84A6.16 6.16 0 005.84 12 6.16 6.16 0 0012 18.16 6.16 6.16 0 0018.16 12 6.16 6.16 0 0012 5.84zm0 10.16A4 4 0 1112 8a4 4 0 010 8zm7.85-10.4a1.44 1.44 0 11-2.88 0 1.44 1.44 0 012.88 0z"/></svg>'
};
const activePlatform = {};
posts.forEach(p => activePlatform[p.id] = 'linkedin');

function getStoredImages() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}

function saveImage(postId, dataUrl) {
  const images = getStoredImages();
  images[postId] = dataUrl;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(images)); }
  catch (e) { alert('התמונה גדולה מדי לשמירה במכשיר. נסי תמונה קטנה יותר.'); }
}

function removeImage(postId) {
  const images = getStoredImages();
  delete images[postId];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(images));
}

function renderPosts() {
  const container = document.getElementById('postsContainer');
  const images = getStoredImages();
  container.innerHTML = posts.map(post => {
    const hasImage = !!images[post.id];
    const platform = activePlatform[post.id];
    const text = post.variants[platform];
    const textWithLinks = text.replace(
      /hopa\.org\.il/g,
      '<a href="https://hopa.org.il" target="_blank">hopa.org.il</a>'
    );
    const charCount = text.length;
    return `
      <div class="post-card">
        <div class="post-header">
          <div class="post-number">
            <div class="post-num-badge">${post.id}</div>
            <div class="post-title-small">${post.title}</div>
          </div>
          <div class="status-badge ${hasImage ? 'ready' : ''}">
            ${hasImage ? 'מוכן לפרסום' : 'ממתין לתמונה'}
          </div>
        </div>
        <div class="post-body">
          <div class="image-upload-zone ${hasImage ? 'has-image' : ''}" id="zone-${post.id}">
            ${hasImage ? `
              <img data-img-id="${post.id}" class="image-preview" alt="תמונה לפוסט ${post.id}">
            ` : `
              <div class="upload-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"/>
                </svg>
              </div>
              <div class="upload-text"><strong>גררי תמונה</strong> או לחצי לבחירה</div>
              <div class="upload-hint">JPG, PNG, עד 2MB</div>
            `}
            <input type="file" accept="image/*" class="hidden-input" id="input-${post.id}">
          </div>
          ${hasImage ? `
            <div class="image-actions">
              <button class="btn-small" onclick="downloadImage(${post.id})">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                הורדה
              </button>
              <button class="btn-small" onclick="replaceImage(${post.id})">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
                החלפה
              </button>
              <button class="btn-small danger" onclick="deleteImage(${post.id})">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>
                מחיקה
              </button>
            </div>
          ` : ''}
          <div class="platform-tabs">
            ${['linkedin', 'facebook', 'instagram'].map(p => `
              <button class="platform-tab ${platform === p ? 'active ' + p : ''}" onclick="switchPlatform(${post.id}, '${p}')">
                ${platformIcons[p]}
                ${platformLabels[p]}
              </button>
            `).join('')}
          </div>
          <div class="platform-hint">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/></svg>
            ${platformHints[platform]}
          </div>
          <div class="post-text-wrapper">
            <span class="char-count">${charCount} תווים</span>
            <div class="post-text">${textWithLinks}</div>
          </div>
          <button class="copy-btn" onclick="copyText(${post.id}, this)">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184"/></svg>
            העתיקי גרסת ${platformLabels[platform]}
          </button>
        </div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('[data-img-id]').forEach(el => {
    const id = el.dataset.imgId;
    if (images[id]) el.setAttribute('src', images[id]);
  });

  posts.forEach(post => setupUploadZone(post.id));
}

function switchPlatform(postId, platform) {
  activePlatform[postId] = platform;
  renderPosts();
}

function setupUploadZone(postId) {
  const zone = document.getElementById(`zone-${postId}`);
  const input = document.getElementById(`input-${postId}`);
  if (!zone || !input) return;

  zone.addEventListener('click', (e) => {
    if (e.target.tagName === 'IMG') return;
    input.click();
  });
  input.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) handleFile(postId, e.target.files[0]);
  });
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(postId, e.dataTransfer.files[0]);
  });
}

function handleFile(postId, file) {
  if (!file.type.startsWith('image/')) {
    alert('קובץ זה אינו תמונה');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    compressImage(e.target.result, (compressed) => {
      saveImage(postId, compressed);
      renderPosts();
    });
  };
  reader.readAsDataURL(file);
}

function compressImage(dataUrl, callback) {
  const img = new Image();
  img.onload = () => {
    const maxWidth = 1600;
    let { width, height } = img;
    if (width > maxWidth) {
      height = (maxWidth / width) * height;
      width = maxWidth;
    }
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, width, height);
    callback(canvas.toDataURL('image/jpeg', 0.85));
  };
  img.src = dataUrl;
}

function downloadImage(postId) {
  const images = getStoredImages();
  if (!images[postId]) return;
  const a = document.createElement('a');
  a.href = images[postId];
  a.download = `hofa-post-${postId}.jpg`;
  a.click();
}

function replaceImage(postId) {
  document.getElementById(`input-${postId}`).click();
}

function deleteImage(postId) {
  if (!confirm('למחוק את התמונה?')) return;
  removeImage(postId);
  renderPosts();
}

function copyText(postId, btn) {
  const post = posts.find(p => p.id === postId);
  const platform = activePlatform[postId];
  const text = post.variants[platform];
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    const original = btn.innerHTML;
    btn.innerHTML = `
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
      הועתק
    `;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = original;
    }, 2000);
  });
}

function resetAll() {
  if (!confirm('למחוק את כל התמונות? פעולה זו לא הפיכה')) return;
  localStorage.removeItem(STORAGE_KEY);
  renderPosts();
}

renderPosts();
</script>

</body>
</html>
