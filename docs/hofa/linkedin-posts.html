          </div>
          <button class="copy-btn" onclick="copyText(${post.id}, this)">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184"/></svg>
            העתיקי גרסת ${platformLabels[platform]}
          </button>
        </div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('[data-img-id]').forEach(el => {
    const id = el.dataset.imgId;
    if (images[id]) el.setAttribute('src', images[id]);
  });

  posts.forEach(post => setupUploadZone(post.id));
}

function switchPlatform(postId, platform) {
  activePlatform[postId] = platform;
  renderPosts();
}

function setupUploadZone(postId) {
  const zone = document.getElementById(`zone-${postId}`);
  const input = document.getElementById(`input-${postId}`);
  if (!zone || !input) return;

  zone.addEventListener('click', (e) => {
    if (e.target.tagName === 'IMG') return;
    input.click();
  });
  input.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) handleFile(postId, e.target.files[0]);
  });
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(postId, e.dataTransfer.files[0]);
  });
}

function handleFile(postId, file) {
  if (!file.type.startsWith('image/')) {
    alert('קובץ זה אינו תמונה');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    compressImage(e.target.result, (compressed) => {
      saveImage(postId, compressed);
      renderPosts();
    });
  };
  reader.readAsDataURL(file);
}

function compressImage(dataUrl, callback) {
  const img = new Image();
  img.onload = () => {
    const maxWidth = 1600;
    let { width, height } = img;
    if (width > maxWidth) {
      height = (maxWidth / width) * height;
      width = maxWidth;
    }
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, width, height);
    callback(canvas.toDataURL('image/jpeg', 0.85));
  };
  img.src = dataUrl;
}

function downloadImage(postId) {
  const images = getStoredImages();
  if (!images[postId]) return;
  const a = document.createElement('a');
  a.href = images[postId];
  a.download = `hofa-post-${postId}.jpg`;
  a.click();
}

function replaceImage(postId) {
  document.getElementById(`input-${postId}`).click();
}

function deleteImage(postId) {
  if (!confirm('למחוק את התמונה?')) return;
  removeImage(postId);
  renderPosts();
}

function copyText(postId, btn) {
  const post = posts.find(p => p.id === postId);
  const platform = activePlatform[postId];
  const text = post.variants[platform];
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    const original = btn.innerHTML;
    btn.innerHTML = `
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
      הועתק
    `;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = original;
    }, 2000);
  });
}

function resetAll() {
  if (!confirm('למחוק את כל התמונות? פעולה זו לא הפיכה')) return;
  localStorage.removeItem(STORAGE_KEY);
  renderPosts();
}

renderPosts();
</script>

</body>
</html>
