<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="leftCircle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48cae4"/>
      <stop offset="45%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#8e5bc8"/>
    </linearGradient>
    <linearGradient id="rightCircle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c454b0"/>
      <stop offset="45%" stop-color="#e84393"/>
      <stop offset="100%" stop-color="#f9a06b"/>
    </linearGradient>
    <linearGradient id="overlapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8e5bc8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#c454b0" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="38%" stop-color="#8e5bc8"/>
      <stop offset="68%" stop-color="#e84393"/>
      <stop offset="100%" stop-color="#f9a06b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#2c3e5060"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdcb6e" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#fdcb6e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fdcb6e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipRight"><circle cx="290" cy="200" r="100"/></clipPath>
  </defs>

  <rect width="500" height="500" fill="white"/>

  <circle cx="210" cy="200" r="100" fill="url(#leftCircle)" opacity="0.8" filter="url(#softShadow)"/>
  <circle cx="290" cy="200" r="100" fill="url(#rightCircle)" opacity="0.8" filter="url(#softShadow)"/>
  <circle cx="210" cy="200" r="100" fill="url(#overlapGrad)" clip-path="url(#clipRight)" opacity="0.5"/>
  <circle cx="210" cy="200" r="100" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
  <circle cx="290" cy="200" r="100" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.3"/>

  <circle cx="155" cy="140" r="3" fill="#fff" opacity="0.5"/>
  <circle cx="345" cy="140" r="3" fill="#fff" opacity="0.5"/>

  <!-- Gold stars -->
  <g opacity="0.95">
    <circle cx="250" cy="82" r="16" fill="url(#starGlow)"/>
    <path d="M250 72 L251.8 80 L260 82 L251.8 84 L250 92 L248.2 84 L240 82 L248.2 80 Z" fill="#fdcb6e"/>
    <path d="M250 75 L251.2 80 L256 82 L251.2 84 L250 89 L248.8 84 L244 82 L248.8 80 Z" fill="#ffe3a3" opacity="0.6" transform="rotate(45,250,82)"/>
    <circle cx="250" cy="82" r="1.5" fill="#fff" opacity="0.95"/>
  </g>
  <g opacity="0.55">
    <path d="M140 155 L142 159 L146 161 L142 163 L140 167 L138 163 L134 161 L138 159 Z" fill="#fdcb6e"/>
    <path d="M360 145 L362 149 L366 151 L362 153 L360 157 L358 153 L354 151 L358 149 Z" fill="#fdcb6e"/>
  </g>

  <text x="250" y="215" text-anchor="middle" font-family="'Caveat', 'Segoe UI', cursive" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="1" filter="url(#textGlow)">Learni</text>

  <text x="250" y="350" text-anchor="middle" font-family="'Heebo', 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="url(#wordGrad)" letter-spacing="1" direction="rtl">חינוך · בינה מלאכותית · הגשמת חלומות</text>

  <line x1="145" y1="365" x2="355" y2="365" stroke="url(#wordGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
