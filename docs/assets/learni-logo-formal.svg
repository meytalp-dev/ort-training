<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="400" height="140">
  <defs>
    <linearGradient id="formalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#2D2D4A"/>
    </linearGradient>
    <radialGradient id="starGlowFormal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdcb6e" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#fdcb6e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fdcb6e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Wordmark: Learni AI in formal sans-serif -->
  <text x="200" y="68"
        text-anchor="middle"
        font-family="'Inter','Söhne','Segoe UI',system-ui,sans-serif"
        font-size="48"
        font-weight="700"
        fill="url(#formalGrad)"
        letter-spacing="-1.5">Learni<tspan fill="#e84393" font-weight="600" letter-spacing="0">·</tspan>AI</text>

  <!-- Lavender star — the equity asset -->
  <g transform="translate(305 35)">
    <circle cx="0" cy="0" r="14" fill="url(#starGlowFormal)"/>
    <path d="M0 -8 L1.5 -2 L8 0 L1.5 2 L0 8 L-1.5 2 L-8 0 L-1.5 -2 Z" fill="#fdcb6e"/>
    <path d="M0 -5.5 L1 -1.5 L5 0 L1 1.5 L0 5.5 L-1 1.5 L-5 0 L-1 -1.5 Z"
          fill="#ffe3a3" opacity="0.6" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="1.2" fill="#fff" opacity="0.95"/>
  </g>

  <!-- Tagline -->
  <text x="200" y="100"
        text-anchor="middle"
        font-family="'Heebo','Assistant','Segoe UI',sans-serif"
        font-size="14"
        font-weight="500"
        fill="#4a4a5e"
        letter-spacing="0.5"
        direction="rtl">AI שנשאר אצלכם</text>

  <!-- Subtle separator -->
  <line x1="155" y1="115" x2="245" y2="115"
        stroke="#e84393" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
</svg>
