<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <defs>
    <!-- Left circle — graded cyan → purple (right edge meets the overlap) -->
    <linearGradient id="leftCircle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48cae4"/>
      <stop offset="45%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#8e5bc8"/>
    </linearGradient>

    <!-- Right circle — graded pink → orange (left edge meets the overlap) -->
    <linearGradient id="rightCircle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c454b0"/>
      <stop offset="45%" stop-color="#e84393"/>
      <stop offset="100%" stop-color="#f9a06b"/>
    </linearGradient>

    <!-- Overlap blend — the purple midpoint of the site gradient -->
    <linearGradient id="overlapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8e5bc8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#c454b0" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Wordmark gradient — cyan → purple → pink → orange, like the site -->
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="38%" stop-color="#8e5bc8"/>
      <stop offset="68%" stop-color="#e84393"/>
      <stop offset="100%" stop-color="#f9a06b"/>
    </linearGradient>

    <!-- Subtle shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1e3a5f40"/>
    </filter>

    <!-- Glow for text -->
    <filter id="textGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gold star glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdcb6e" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#fdcb6e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fdcb6e" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip path for overlap effect -->
    <clipPath id="clipRight">
      <circle cx="218" cy="78" r="72"/>
    </clipPath>
  </defs>

  <!-- Left circle -->
  <circle cx="142" cy="78" r="72" fill="url(#leftCircle)" opacity="0.8" filter="url(#softShadow)"/>

  <!-- Right circle -->
  <circle cx="218" cy="78" r="72" fill="url(#rightCircle)" opacity="0.8" filter="url(#softShadow)"/>

  <!-- Overlap area -->
  <circle cx="142" cy="78" r="72" fill="url(#overlapGrad)" clip-path="url(#clipRight)" opacity="0.5"/>

  <!-- Decorative ring accents -->
  <circle cx="142" cy="78" r="72" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <circle cx="218" cy="78" r="72" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>

  <!-- Small decorative dots -->
  <circle cx="100" cy="28" r="2.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="260" cy="28" r="2.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="180" cy="14" r="2" fill="#ffffff" opacity="0.4"/>

  <!-- Gold star accent — main -->
  <g opacity="0.95">
    <circle cx="180" cy="10" r="14" fill="url(#starGlow)"/>
    <path d="M180 2 L181.5 8 L188 10 L181.5 12 L180 18 L178.5 12 L172 10 L178.5 8 Z" fill="#fdcb6e"/>
    <path d="M180 4.5 L181 8.5 L185 10 L181 11.5 L180 15.5 L179 11.5 L175 10 L179 8.5 Z" fill="#ffe3a3" opacity="0.6" transform="rotate(45,180,10)"/>
    <circle cx="180" cy="10" r="1.2" fill="#fff" opacity="0.95"/>
  </g>
  <!-- Small gold accent stars -->
  <g opacity="0.55">
    <path d="M82 62 L83.5 65 L86.5 66.5 L83.5 68 L82 71 L80.5 68 L77.5 66.5 L80.5 65 Z" fill="#fdcb6e"/>
    <path d="M278 55 L279.5 58 L282.5 59.5 L279.5 61 L278 64 L276.5 61 L273.5 59.5 L276.5 58 Z" fill="#fdcb6e"/>
  </g>

  <!-- Main text: Learni -->
  <text x="180" y="90" text-anchor="middle" font-family="'Caveat', 'Segoe UI', cursive" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="1" filter="url(#textGlow)">Learni</text>

  <!-- Subtitle - Hebrew -->
  <text x="180" y="172" text-anchor="middle" font-family="'Heebo', 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="url(#wordGrad)" letter-spacing="1.5" direction="rtl">חינוך · בינה מלאכותית · הגשמת חלומות</text>

  <!-- Decorative line under subtitle -->
  <line x1="100" y1="184" x2="260" y2="184" stroke="url(#wordGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
