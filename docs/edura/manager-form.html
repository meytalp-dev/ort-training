<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edura · פרסום משרה למנהלים</title>
<meta name="description" content="פרסמו משרה במאגר Edura וחפשו מורים — בחינם, בלי הגבלה." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green-deep: #1F6B5C;
    --green-soft: #2D8B76;
    --cream: #FBF7F0;
    --orange: #E85D40;
    --ink: #1A2B26;
    --ink-soft: #4A5A55;
    --ink-mute: #8A9994;
    --line: #E1DBD0;
    --bg: #FAFAF7;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--line);
    padding: 16px 24px;
  }
  .header-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    color: var(--green-deep);
    text-decoration: none;
  }
  .logo span { color: var(--orange); }
  .back-link {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }
  main {
    max-width: 560px;
    margin: 40px auto;
    padding: 0 24px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 36px);
    font-weight: 800;
    color: var(--ink);
    line-height: 1.2;
    margin-bottom: 12px;
  }
  .lead {
    color: var(--ink-soft);
    font-size: 16px;
    margin-bottom: 32px;
  }
  .coming-soon {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
  }
  .coming-soon-badge {
    display: inline-block;
    background: var(--cream);
    color: var(--green-deep);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
  }
  .coming-soon h2 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .coming-soon p {
    color: var(--ink-soft);
    margin-bottom: 24px;
  }
  .btn {
    display: inline-block;
    background: var(--green-deep);
    color: var(--white);
    padding: 12px 28px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    transition: background .15s;
  }
  .btn:hover { background: var(--green-soft); }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">Edura<span>.</span></a>
    <a href="index.html" class="back-link">← חזרה לעמוד הבית</a>
  </div>
</header>

<main>
  <h1>פרסום משרה</h1>
  <p class="lead">פרסמו משרה במאגר וגם חפשו מורים שכבר רשומים אצלנו — בחינם, בלי הגבלה.</p>

  <div class="coming-soon">
    <div class="coming-soon-badge">בקרוב</div>
    <h2>הטופס בבנייה</h2>
    <p>אנחנו עובדים על טופס פרסום למנהלים. בינתיים — תוכלו לראות אילו משרות כבר אוספים.</p>
    <a href="index.html" class="btn">לוח המשרות</a>
  </div>
</main>

<script src="analytics.js"></script>

</body>
</html>
