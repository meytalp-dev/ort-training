<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edura · בוט חיפוש משרה</title>
<meta name="description" content="בוט חכם שמוצא לך משרת הוראה מותאמת — אזור, מקצוע, שכבה. 818 משרות פתוחות." />
<meta property="og:title" content="Edura · בוט חיפוש משרה" />
<meta property="og:description" content="המשרה הבאה שלך — בשיחה אחת." />
<meta property="og:type" content="website" />
<meta property="og:locale" content="he_IL" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green-deep: #1F6B5C;
    --green-soft: #2D8B76;
    --green-pale: #E8F1ED;
    --cream: #FBF7F0;
    --cream-deep: #F2EBDF;
    --orange: #E85D40;
    --orange-soft: #FFF1ED;
    --ink: #1A2B26;
    --ink-soft: #4A5A55;
    --ink-mute: #8A9994;
    --line: #E1DBD0;
    --bg: #FAFAF7;
    --white: #FFFFFF;
    --shadow-sm: 0 1px 2px rgba(26,43,38,.04), 0 1px 3px rgba(26,43,38,.06);
    --shadow-md: 0 4px 12px rgba(26,43,38,.06), 0 2px 4px rgba(26,43,38,.04);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', 'Assistant', sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: none; background: none; }

  .header {
    background: var(--white);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 50;
  }
  .header-inner {
    max-width: 720px; margin: 0 auto;
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    font-size: 22px; font-weight: 800;
    color: var(--green-deep); letter-spacing: -0.5px;
  }
  .logo-dot { color: var(--orange); font-size: 26px; }
  .back-link {
    color: var(--ink-soft); font-size: 14px; font-weight: 500;
  }
  .back-link:hover { color: var(--green-deep); }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    min-height: calc(100vh - 120px);
    display: flex; flex-direction: column;
  }

  .chat-intro {
    text-align: center;
    margin-bottom: 16px;
  }
  .chat-intro h1 {
    font-size: 28px; font-weight: 800;
    color: var(--green-deep);
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  .chat-intro p {
    color: var(--ink-soft); font-size: 15px;
  }

  #ec-root {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    flex: 1;
    display: flex; flex-direction: column;
    overflow: hidden;
    min-height: 60vh;
  }

  .ec-stream {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex; flex-direction: column;
    gap: 12px;
  }

  .ec-msg {
    display: flex; flex-direction: column;
    gap: 8px;
    max-width: 85%;
  }
  .ec-msg-bot { align-self: flex-start; }
  .ec-msg-user { align-self: flex-end; align-items: flex-end; }

  .ec-bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.55;
    box-shadow: var(--shadow-sm);
    white-space: pre-wrap;
  }
  .ec-msg-bot .ec-bubble {
    background: var(--green-pale);
    color: var(--ink);
    border-bottom-right-radius: 4px;
  }
  .ec-msg-user .ec-bubble {
    background: var(--green-deep);
    color: var(--white);
    border-bottom-left-radius: 4px;
  }

  .ec-actions {
    display: flex; flex-wrap: wrap;
    gap: 8px;
  }
  .ec-action {
    padding: 8px 14px;
    background: var(--white);
    border: 1.5px solid var(--green-soft);
    color: var(--green-deep);
    border-radius: 999px;
    font-size: 14px; font-weight: 600;
    transition: all .15s ease;
  }
  .ec-action:hover:not(:disabled) {
    background: var(--green-soft); color: var(--white);
  }
  .ec-action:disabled {
    opacity: .5; cursor: not-allowed;
  }

  .ec-job-card {
    background: var(--cream);
    border: 1px solid var(--cream-deep);
    border-radius: var(--radius);
    padding: 16px;
    max-width: 100%;
  }
  .ec-job-source {
    font-size: 12px; font-weight: 600;
    color: var(--green-soft);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .ec-job-title {
    font-size: 16px; font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .ec-job-tags {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 8px;
  }
  .ec-tag {
    font-size: 11px; font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--white);
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }
  .ec-job-snippet {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .ec-job-actions {
    display: flex; gap: 8px; align-items: center;
  }
  .ec-job-cta {
    flex: 1;
    text-align: center;
    padding: 10px 16px;
    background: var(--orange);
    color: var(--white);
    border-radius: 8px;
    font-size: 14px; font-weight: 700;
    transition: background .15s ease;
  }
  .ec-job-cta:hover { background: #c94a30; }
  .ec-job-save {
    padding: 10px 14px;
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    border-radius: 8px;
    font-size: 14px; font-weight: 600;
  }
  .ec-job-save:hover:not(:disabled) {
    border-color: var(--green-soft); color: var(--green-deep);
  }
  .ec-job-save:disabled { opacity: .6; cursor: default; }

  .ec-status {
    padding: 8px 20px;
    color: var(--ink-mute);
    font-size: 13px;
    text-align: center;
    display: none;
  }

  .ec-input-row {
    display: flex; gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    background: var(--white);
  }
  .ec-input-row input {
    flex: 1;
    padding: 10px 14px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  .ec-input-row input:focus { border-color: var(--green-soft); }
  .ec-send-btn {
    padding: 10px 20px;
    background: var(--green-deep);
    color: var(--white);
    border-radius: 999px;
    font-weight: 700;
  }
  .ec-send-btn:hover { background: var(--green-soft); }

  @media (max-width: 600px) {
    .chat-intro h1 { font-size: 22px; }
    .ec-msg { max-width: 92%; }
    .ec-stream { padding: 16px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">Edura<span class="logo-dot">.</span></a>
    <a href="index.html" class="back-link">← לכל המשרות</a>
  </div>
</header>

<main>
  <div class="chat-intro">
    <h1>בואו נמצא לך משרה</h1>
    <p>שיחה קצרה. תשובות מותאמות. פנייה ישירה לבית הספר.</p>
  </div>
  <div id="ec-root"></div>
</main>

<script src="chat-engine.js"></script>
<script>
  const chat = new EduraChat(document.getElementById('ec-root'));
  chat.start();
</script>

</body>
</html>
