<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="leftCircle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48cae4"/>
      <stop offset="45%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#8e5bc8"/>
    </linearGradient>
    <linearGradient id="rightCircle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c454b0"/>
      <stop offset="45%" stop-color="#e84393"/>
      <stop offset="100%" stop-color="#f9a06b"/>
    </linearGradient>
    <linearGradient id="overlapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8e5bc8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#c454b0" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="38%" stop-color="#8e5bc8"/>
      <stop offset="68%" stop-color="#e84393"/>
      <stop offset="100%" stop-color="#f9a06b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2c3e5080"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdcb6e" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#fdcb6e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fdcb6e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipRight"><circle cx="240" cy="115" r="85"/></clipPath>
  </defs>

  <circle cx="160" cy="115" r="85" fill="url(#leftCircle)" opacity="0.8" filter="url(#softShadow)"/>
  <circle cx="240" cy="115" r="85" fill="url(#rightCircle)" opacity="0.8" filter="url(#softShadow)"/>
  <circle cx="160" cy="115" r="85" fill="url(#overlapGrad)" clip-path="url(#clipRight)" opacity="0.5"/>
  <circle cx="160" cy="115" r="85" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  <circle cx="240" cy="115" r="85" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>

  <circle cx="110" cy="75" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="290" cy="75" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="200" cy="50" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="130" cy="150" r="2.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="270" cy="150" r="2.5" fill="#ffffff" opacity="0.3"/>

  <!-- Gold star accent -->
  <g opacity="0.95">
    <circle cx="200" cy="40" r="14" fill="url(#starGlow)"/>
    <path d="M200 32 L201.5 38 L208 40 L201.5 42 L200 48 L198.5 42 L192 40 L198.5 38 Z" fill="#fdcb6e"/>
    <path d="M200 34.5 L201 38.5 L205 40 L201 41.5 L200 45.5 L199 41.5 L195 40 L199 38.5 Z" fill="#ffe3a3" opacity="0.6" transform="rotate(45,200,40)"/>
    <circle cx="200" cy="40" r="1.2" fill="#fff" opacity="0.95"/>
  </g>
  <g opacity="0.55">
    <path d="M98 100 L99.5 103 L102.5 104.5 L99.5 106 L98 109 L96.5 106 L93.5 104.5 L96.5 103 Z" fill="#fdcb6e"/>
    <path d="M302 90 L303.5 93 L306.5 94.5 L303.5 96 L302 99 L300.5 96 L297.5 94.5 L300.5 93 Z" fill="#fdcb6e"/>
  </g>

  <text x="200" y="125" text-anchor="middle" font-family="'Caveat', 'Segoe UI', cursive" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="1" filter="url(#textGlow)">Learni</text>

  <text x="200" y="228" text-anchor="middle" font-family="'Heebo', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="url(#wordGrad)" letter-spacing="1" direction="rtl">חינוך · בינה מלאכותית · הגשמת חלומות</text>

  <line x1="120" y1="240" x2="280" y2="240" stroke="url(#wordGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
