<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סיור וירטואלי — אורט בית הערבה</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #F4F2ED;
    --panel: #FFFFFF;
    --ink: #1F2A37;
    --ink-2: #4B5563;
    --ink-3: #6B7280;
    --line: #E5E7EB;
    --teal: #5BA89B;
    --orange: #E07B5B;
    --pink: #C76B98;
    --blue: #7B9FE0;
    --gold: #A89B5B;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }

  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Heebo', 'Assistant', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-columns: 320px 1fr 380px;
    grid-template-rows: 64px 1fr;
    grid-template-areas:
      "header header header"
      "sidebar viewer info";
    height: 100vh;
  }

  header {
    grid-area: header;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    z-index: 10;
  }
  header .logo {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--teal), var(--blue));
    display: grid; place-items: center;
    color: white; font-weight: 800; font-size: 18px;
    letter-spacing: -.5px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header .sub { margin: 0; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
  header .titles { flex: 1; }
  header .actions { display: flex; gap: 8px; }
  header .btn {
    padding: 8px 14px;
    border: 1px solid var(--line);
    background: white;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    text-decoration: none;
    transition: all .15s;
  }
  header .btn:hover { border-color: var(--ink-3); }
  header .btn.primary {
    background: var(--ink); color: white; border-color: var(--ink);
  }
  header .btn.tour {
    background: var(--teal); color: white; border-color: var(--teal);
    display: inline-flex; align-items: center; gap: 6px;
  }
  header .btn.tour.active {
    background: var(--orange); border-color: var(--orange);
    animation: pulse-soft 2s ease-in-out infinite;
  }
  header .btn.tour .play-icon { font-size: 11px; }
  @keyframes pulse-soft {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224,123,91,.4); }
    50% { box-shadow: 0 0 0 6px rgba(224,123,91,0); }
  }

  /* Sidebar */
  .sidebar {
    grid-area: sidebar;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 16px 12px 24px;
  }
  .sidebar h2 {
    margin: 12px 8px 8px;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .cat-group { margin-bottom: 10px; }
  .cat-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    border-radius: 8px;
    user-select: none;
  }
  .cat-header:hover { background: var(--bg); }
  .cat-header .dot {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .cat-header .count {
    margin-inline-start: auto;
    font-weight: 500;
    font-size: 12px;
    color: var(--ink-3);
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .scene-list { padding: 4px 0 8px; }
  .scene-btn {
    display: block;
    width: 100%;
    text-align: start;
    padding: 8px 12px 8px 32px;
    background: transparent;
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
    transition: all .12s;
    margin-bottom: 1px;
    border-inline-start: 3px solid transparent;
  }
  .scene-btn:hover { background: var(--bg); color: var(--ink); }
  .scene-btn.active {
    background: var(--bg);
    color: var(--ink);
    font-weight: 600;
    border-inline-start-color: var(--teal);
  }

  /* Viewer */
  .viewer-wrap {
    grid-area: viewer;
    position: relative;
    background: #000;
  }
  #panorama {
    width: 100%;
    height: 100%;
  }
  .viewer-overlay {
    position: absolute;
    top: 16px; right: 16px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(10px);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--ink);
    pointer-events: none;
    box-shadow: var(--shadow);
  }
  .viewer-overlay .name { font-weight: 700; font-size: 14px; }
  .viewer-overlay .cat-tag {
    display: inline-block;
    margin-top: 4px;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--bg);
    color: var(--ink-2);
    font-weight: 500;
  }
  .nav-arrows {
    position: absolute;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(10px);
    padding: 6px;
    border-radius: 999px;
    box-shadow: var(--shadow);
  }
  .nav-arrows button {
    border: none;
    background: transparent;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    color: var(--ink);
    display: grid; place-items: center;
    transition: background .12s;
  }
  .nav-arrows button:hover { background: var(--bg); }

  /* Tour progress bar */
  .tour-progress {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,.15);
    z-index: 5;
    display: none;
  }
  .tour-progress.active { display: block; }
  .tour-progress .bar {
    height: 100%;
    background: var(--orange);
    width: 0;
    transition: width .1s linear;
  }
  .tour-step-indicator {
    position: absolute;
    top: 16px; left: 16px;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(10px);
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    display: none;
  }
  .tour-step-indicator.active { display: block; }

  /* Info panel */
  .info {
    grid-area: info;
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 24px;
  }
  .info .title-row {
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 8px;
  }
  .info .cat-pill {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    color: white;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 6px;
  }
  .info h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    line-height: 1.3;
  }
  .info .desc {
    margin-top: 12px;
    font-size: 14px;
    color: var(--ink-2);
    line-height: 1.65;
  }
  .info-section { margin-top: 24px; }
  .info-section h3 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex; align-items: center; gap: 6px;
  }
  .info-section h3::before {
    content: '';
    display: inline-block;
    width: 4px; height: 14px;
    border-radius: 2px;
    background: var(--ink);
  }
  .info-section.equipment h3::before { background: var(--teal); }
  .info-section.needs h3::before { background: var(--orange); }

  .info-list {
    margin: 0; padding: 0; list-style: none;
  }
  .info-list li {
    padding: 8px 12px;
    margin-bottom: 4px;
    background: var(--bg);
    border-radius: 6px;
    font-size: 13.5px;
    color: var(--ink);
  }
  .info-list.empty li {
    color: var(--ink-3);
    font-style: italic;
    background: transparent;
    padding: 4px 0;
  }

  /* Mobile */
  @media (max-width: 1100px) {
    .app {
      grid-template-columns: 280px 1fr;
      grid-template-rows: 64px 1fr 240px;
      grid-template-areas:
        "header header"
        "sidebar viewer"
        "info info";
    }
    .info { border-right: none; border-top: 1px solid var(--line); }
  }
  @media (max-width: 720px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: 64px 50vh 1fr;
      grid-template-areas:
        "header"
        "viewer"
        "info";
    }
    .sidebar { display: none; }
    .mobile-menu { display: block; }
  }
  .mobile-menu { display: none; }

  /* Loader */
  .loader {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: #000;
    color: white;
    font-size: 14px;
    pointer-events: none;
    transition: opacity .3s;
  }
  .loader.hidden { opacity: 0; }
  .loader .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,.2);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo">א</div>
    <div class="titles">
      <h1>סיור וירטואלי — אורט בית הערבה</h1>
      <p class="sub">מסמך מבנה ותשתיות עבור עיריית ירושלים</p>
    </div>
    <div class="actions">
      <button id="tour-btn" class="btn tour" type="button">
        <span class="play-icon" id="tour-icon">▶</span>
        <span id="tour-label">סיור מודרך</span>
      </button>
      <a href="needs-report.html" class="btn primary">דוח צרכים מודפס ←</a>
    </div>
  </header>

  <aside class="sidebar" id="sidebar"></aside>

  <div class="viewer-wrap">
    <div id="panorama"></div>
    <div class="viewer-overlay">
      <div class="name" id="overlay-name">—</div>
      <div class="cat-tag" id="overlay-cat">—</div>
    </div>
    <div class="nav-arrows">
      <button id="prev-btn" title="הסצנה הקודמת">›</button>
      <button id="next-btn" title="הסצנה הבאה">‹</button>
    </div>
    <div class="tour-progress" id="tour-progress">
      <div class="bar" id="tour-progress-bar"></div>
    </div>
    <div class="tour-step-indicator" id="tour-step">סצנה 1 מתוך —</div>
    <div class="loader" id="loader">
      <div style="text-align:center">
        <div class="spinner"></div>
        טוען תמונה...
      </div>
    </div>
  </div>

  <aside class="info" id="info">
    <div class="title-row">
      <span class="cat-pill" id="info-pill">—</span>
      <h2 id="info-title">בחרו מקום בסיור</h2>
    </div>
    <p class="desc" id="info-desc">השתמשו בעכבר/אצבע כדי לסובב את התצוגה. בחרו חדר מהרשימה בצד.</p>

    <div class="info-section equipment">
      <h3>ציוד קיים</h3>
      <ul class="info-list" id="info-equip"></ul>
    </div>

    <div class="info-section needs">
      <h3>צרכים ושיפורים</h3>
      <ul class="info-list" id="info-needs"></ul>
    </div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script src="tour-data.js"></script>

<script>
const data = window.TOUR_DATA;
let viewer = null;
let currentSceneId = data.startScene;

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '<h2>חדרים ואזורים</h2>';

  const order = ['outdoor', 'classrooms', 'workshops', 'staff', 'services'];
  order.forEach(catKey => {
    const cat = data.categories[catKey];
    const scenes = data.scenes.filter(s => s.category === catKey && !s.noPhoto);
    if (!scenes.length) return;

    const group = document.createElement('div');
    group.className = 'cat-group';
    group.innerHTML = `
      <div class="cat-header">
        <span class="dot" style="background:${cat.color}"></span>
        <span>${cat.label}</span>
        <span class="count">${scenes.length}</span>
      </div>
      <div class="scene-list">
        ${scenes.map(s => `<button class="scene-btn" data-id="${s.id}">${s.title}</button>`).join('')}
      </div>
    `;
    sb.appendChild(group);
  });

  sb.addEventListener('click', e => {
    const btn = e.target.closest('.scene-btn');
    if (btn) loadScene(btn.dataset.id);
  });
}

function loadScene(id) {
  const scene = data.scenes.find(s => s.id === id);
  if (!scene) return;
  currentSceneId = id;

  document.querySelectorAll('.scene-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.id === id);
  });
  const activeBtn = document.querySelector('.scene-btn.active');
  if (activeBtn) activeBtn.scrollIntoView({ block: 'nearest' });

  const cat = data.categories[scene.category];
  document.getElementById('overlay-name').textContent = scene.title;
  document.getElementById('overlay-cat').textContent = cat.label;

  document.getElementById('info-title').textContent = scene.title;
  const pill = document.getElementById('info-pill');
  pill.textContent = cat.label;
  pill.style.background = cat.color;
  document.getElementById('info-desc').textContent = scene.description || '';

  const equipUl = document.getElementById('info-equip');
  if (scene.equipment && scene.equipment.length) {
    equipUl.classList.remove('empty');
    equipUl.innerHTML = scene.equipment.map(x => `<li>${x}</li>`).join('');
  } else {
    equipUl.classList.add('empty');
    equipUl.innerHTML = '<li>טרם תועד</li>';
  }

  const needsUl = document.getElementById('info-needs');
  if (scene.needs && scene.needs.length) {
    needsUl.classList.remove('empty');
    needsUl.innerHTML = scene.needs.map(x => `<li>${x}</li>`).join('');
  } else {
    needsUl.classList.add('empty');
    needsUl.innerHTML = '<li>טרם תועד</li>';
  }

  document.getElementById('loader').classList.remove('hidden');

  if (viewer) {
    viewer.destroy();
  }

  viewer = pannellum.viewer('panorama', {
    type: 'equirectangular',
    panorama: `panos/${id}.jpg`,
    autoLoad: true,
    autoRotate: -1.5,
    compass: false,
    showControls: true,
    showZoomCtrl: true,
    showFullscreenCtrl: true,
    hfov: 100,
    minHfov: 50,
    maxHfov: 120
  });

  viewer.on('load', () => {
    document.getElementById('loader').classList.add('hidden');
  });
}

function nav(direction) {
  const navScenes = data.scenes.filter(s => !s.noPhoto);
  const idx = navScenes.findIndex(s => s.id === currentSceneId);
  const newIdx = (idx + direction + navScenes.length) % navScenes.length;
  loadScene(navScenes[newIdx].id);
}

document.getElementById('prev-btn').addEventListener('click', () => { stopTour(); nav(-1); });
document.getElementById('next-btn').addEventListener('click', () => { stopTour(); nav(1); });

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { stopTour(); nav(-1); }
  else if (e.key === 'ArrowLeft') { stopTour(); nav(1); }
  else if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); toggleTour(); }
});

// ─── Guided Tour ───
const TOUR_SECONDS_PER_SCENE = 7;
const tourScenes = data.scenes.filter(s => !s.noPhoto);
let tourActive = false;
let tourTimer = null;
let tourProgressTimer = null;
let tourStartTime = 0;

function toggleTour() {
  if (tourActive) stopTour();
  else startTour();
}

function startTour() {
  tourActive = true;
  document.getElementById('tour-btn').classList.add('active');
  document.getElementById('tour-icon').textContent = '⏸';
  document.getElementById('tour-label').textContent = 'עצור סיור';
  document.getElementById('tour-progress').classList.add('active');
  document.getElementById('tour-step').classList.add('active');

  // Resume from current or restart from start
  const idx = tourScenes.findIndex(s => s.id === currentSceneId);
  if (idx === -1) loadScene(tourScenes[0].id);
  scheduleNext();
}

function stopTour() {
  tourActive = false;
  if (tourTimer) { clearTimeout(tourTimer); tourTimer = null; }
  if (tourProgressTimer) { clearInterval(tourProgressTimer); tourProgressTimer = null; }
  const btn = document.getElementById('tour-btn');
  if (btn) {
    btn.classList.remove('active');
    document.getElementById('tour-icon').textContent = '▶';
    document.getElementById('tour-label').textContent = 'סיור מודרך';
    document.getElementById('tour-progress').classList.remove('active');
    document.getElementById('tour-step').classList.remove('active');
    document.getElementById('tour-progress-bar').style.width = '0%';
  }
}

function scheduleNext() {
  if (!tourActive) return;
  tourStartTime = Date.now();
  document.getElementById('tour-progress-bar').style.width = '0%';

  // Update step indicator
  const idx = tourScenes.findIndex(s => s.id === currentSceneId);
  document.getElementById('tour-step').textContent =
    `סצנה ${idx + 1} מתוך ${tourScenes.length}`;

  // Progress bar
  if (tourProgressTimer) clearInterval(tourProgressTimer);
  tourProgressTimer = setInterval(() => {
    const elapsed = (Date.now() - tourStartTime) / 1000;
    const pct = Math.min(100, (elapsed / TOUR_SECONDS_PER_SCENE) * 100);
    document.getElementById('tour-progress-bar').style.width = pct + '%';
  }, 100);

  // Move to next after N seconds
  tourTimer = setTimeout(() => {
    if (!tourActive) return;
    const i = tourScenes.findIndex(s => s.id === currentSceneId);
    if (i >= tourScenes.length - 1) {
      // End of tour
      stopTour();
      return;
    }
    loadScene(tourScenes[i + 1].id);
    scheduleNext();
  }, TOUR_SECONDS_PER_SCENE * 1000);
}

document.getElementById('tour-btn').addEventListener('click', toggleTour);

// Stop tour when user clicks a sidebar scene
document.getElementById('sidebar').addEventListener('click', e => {
  if (e.target.closest('.scene-btn')) stopTour();
});

buildSidebar();
loadScene(data.startScene);
</script>

</body>
</html>
