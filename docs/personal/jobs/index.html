<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח משרות — מיטל פלג</title>
<meta name="description" content="לוח משרות אישי של מיטל פלג — חדשנות, טכנו-פדגוגיה וניהול חינוכי. כולל קישור לקורות חיים ותיק עבודות.">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Assistant:wght@400;500;600;700&family=Playpen+Sans+Hebrew:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #1e3a5f;
    --ink-soft: #4a6a8a;
    --teal: #2d7a6e;
    --mint: #5abf92;
    --sky: #7babd4;
    --sand: #f5f1ea;
    --cream: #faf7f2;
    --white: #ffffff;
    --rose: #e8a5a5;
    --amber: #f0c674;
    --line: #e4ddd0;
    --shadow-sm: 0 2px 8px rgba(30, 58, 95, 0.06);
    --shadow-md: 0 8px 24px rgba(30, 58, 95, 0.08);
    --shadow-lg: 0 20px 60px rgba(30, 58, 95, 0.12);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Heebo', 'Assistant', sans-serif;
    color: var(--ink);
    background: var(--cream);
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 24px 120px; }

  /* Hero */
  .hero {
    background: linear-gradient(135deg, var(--white) 0%, var(--sand) 100%);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 40px 36px;
    margin-bottom: 28px;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; top: -60px; left: -60px;
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(122,171,212,0.25) 0%, transparent 70%);
  }
  .hero-eyebrow {
    font-family: 'Playpen Sans Hebrew', 'Heebo', sans-serif;
    font-size: 13px; color: var(--teal); font-weight: 500;
    letter-spacing: 1px; margin-bottom: 8px;
  }
  .hero h1 {
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 800; letter-spacing: -0.5px;
    margin-bottom: 10px; line-height: 1.15;
  }
  .hero p {
    color: var(--ink-soft); font-size: 16px; max-width: 640px;
  }

  /* Quick links */
  .quick {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px; margin-top: 24px;
  }
  .quick a {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 14px;
    text-decoration: none; color: var(--ink);
    font-weight: 600; font-size: 14px;
    transition: all 0.2s ease;
  }
  .quick a:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--teal);
  }
  .quick a svg { flex-shrink: 0; color: var(--teal); }
  .quick a .sub { font-size: 12px; color: var(--ink-soft); font-weight: 400; display: block; }

  /* Filters */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin: 32px 0 20px;
  }
  .toolbar .count {
    font-size: 14px; color: var(--ink-soft);
    margin-inline-start: auto;
  }
  .filter-btn {
    padding: 8px 16px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: inherit; font-size: 13px;
    color: var(--ink-soft); cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-btn:hover { border-color: var(--teal); color: var(--teal); }
  .filter-btn.active {
    background: var(--ink); color: var(--white); border-color: var(--ink);
  }

  /* Jobs list */
  .jobs { display: flex; flex-direction: column; gap: 14px; }
  .job {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 24px;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 18px;
    align-items: start;
  }
  .job:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .job.done { opacity: 0.7; background: #fbf9f4; }
  .job.done .job-title { text-decoration: line-through; text-decoration-color: var(--ink-soft); }

  .job-check {
    width: 26px; height: 26px;
    border: 2px solid var(--line);
    border-radius: 8px;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
    background: var(--white);
    margin-top: 2px;
  }
  .job-check:hover { border-color: var(--teal); }
  .job-check.checked {
    background: var(--teal); border-color: var(--teal);
  }
  .job-check.checked::after {
    content: ""; width: 12px; height: 7px;
    border-right: 2px solid white; border-bottom: 2px solid white;
    transform: rotate(-135deg) translate(-1px, -2px);
  }

  .job-body { min-width: 0; }
  .job-org {
    font-size: 12px; font-weight: 600; color: var(--teal);
    letter-spacing: 0.5px; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .job-title {
    font-size: 18px; font-weight: 700; color: var(--ink);
    margin-bottom: 6px; line-height: 1.3;
  }
  .job-meta {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
  }
  .tag {
    font-size: 11px; padding: 3px 10px;
    background: var(--sand); color: var(--ink-soft);
    border-radius: 999px; font-weight: 500;
  }
  .tag.hot { background: #fde8e0; color: #c45530; }
  .tag.warm { background: #fdf4e0; color: #96701c; }
  .tag.primary { background: #e4f2ee; color: var(--teal); }

  .job-notes {
    margin-top: 12px;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: inherit; font-size: 13px;
    color: var(--ink); background: #fafaf7;
    resize: vertical; min-height: 40px;
    transition: border-color 0.15s ease;
  }
  .job-notes:focus {
    outline: none; border-color: var(--teal);
    background: var(--white);
  }

  .job-actions { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .job-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 14px;
    border-radius: 10px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    text-decoration: none; cursor: pointer;
    border: 1px solid var(--line);
    background: var(--white); color: var(--ink);
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .job-btn:hover { border-color: var(--teal); color: var(--teal); }
  .job-btn.primary {
    background: var(--ink); color: var(--white); border-color: var(--ink);
  }
  .job-btn.primary:hover {
    background: var(--teal); border-color: var(--teal); color: var(--white);
  }
  .status-select {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: inherit; font-size: 12px;
    background: var(--white); color: var(--ink);
    cursor: pointer;
  }

  @media (max-width: 680px) {
    .wrap { padding: 24px 14px 80px; }
    .hero { padding: 28px 22px; border-radius: 18px; }
    .job { grid-template-columns: auto 1fr; padding: 18px; border-radius: 14px; }
    .job-actions { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; }
    .job-btn, .status-select { flex: 1; justify-content: center; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Hero -->
  <section class="hero">
    <div class="hero-eyebrow">לוח אישי · לא מאונדקס</div>
    <h1>משרות בפוקוס</h1>
    <p>מעקב אחרי המשרות שאני מעוניינת בהן. סטטוס והערות נשמרים אוטומטית על המכשיר הזה.</p>

    <div class="quick">
      <a href="../cv/cv-meytal-peleg.html" target="_blank" rel="noopener">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <div>קורות חיים<span class="sub">HTML אינטראקטיבי</span></div>
      </a>
      <a href="../cv/cv-meytal-peleg.pdf" target="_blank" rel="noopener">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <div>קו"ח PDF<span class="sub">להורדה ושליחה</span></div>
      </a>
      <a href="../cv/cv-meytal-peleg-full.pdf" target="_blank" rel="noopener">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <div>קו"ח מורחבים<span class="sub">גרסה מלאה</span></div>
      </a>
      <a href="../portfolio/" target="_blank" rel="noopener">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        <div>תיק עבודות<span class="sub">40+ מערכות דיגיטליות</span></div>
      </a>
    </div>
  </section>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="filter-btn active" data-filter="all">הכל</button>
    <button class="filter-btn" data-filter="open">פתוחות</button>
    <button class="filter-btn" data-filter="applied">הוגשו</button>
    <button class="filter-btn" data-filter="interview">ראיון</button>
    <span class="count" id="count"></span>
  </div>

  <!-- Jobs -->
  <div class="jobs" id="jobs"></div>

</div>

<script>
  const JOBS = [
    {
      id: 'joint',
      org: 'ג׳וינט · ישראל',
      title: 'דרושים — קריירה בארגון',
      tags: ['ארגון חברתי', 'מגוון תפקידים'],
      priority: 'primary',
      url: 'https://share.google/I36bJiXx80payA7uZ'
    },
    {
      id: 'lavi-prizma',
      org: 'לביא · תאגיד החינוך העירוני ירושלים',
      title: 'מנהל/ת מרכז חדשנות פריזמה',
      tags: ['ירושלים', 'חדשנות חינוכית', 'ניהול'],
      priority: 'hot',
      url: 'https://share.google/KpGA9LMn66oHfSdWQ'
    },
    {
      id: 'lavi-innovation',
      org: 'לביא · תאגיד החינוך העירוני ירושלים',
      title: 'מנהל/ת מרכז החדשנות',
      tags: ['ירושלים', 'חדשנות', 'ניהול בכיר'],
      priority: 'hot',
      url: 'https://share.google/UbPbTuYTuW2bunKHk',
      extraUrl: 'https://www.facebook.com/share/p/17uMNB3NRk/',
      extraLabel: 'פוסט Facebook'
    },
    {
      id: 'osim-jlm',
      org: 'עושים חינוך ירושלמי',
      title: 'רכז/ת טכנו-פדגוגי/ת',
      tags: ['ירושלים', 'טכנו-פדגוגיה'],
      priority: 'hot',
      url: 'https://share.google/4zuoJYgtezV3CFNeh'
    },
    {
      id: 'lavi-techno-ped',
      org: 'לביא · תאגיד החינוך העירוני ירושלים',
      title: 'מנהל/ת פרויקט טכנו-פדגוגיה',
      tags: ['ירושלים', 'טכנו-פדגוגיה', 'ניהול פרויקט'],
      priority: 'hot',
      url: 'https://share.google/8vK786WNQBkfAsgK7'
    },
    {
      id: 'one-tech',
      org: 'One Technologies · וואן',
      title: 'הצטרפות לצוות הטכנולוגי',
      tags: ['טכנולוגיה', 'סקטור פרטי'],
      priority: 'warm',
      url: 'https://share.google/RbCpGHQn6ix06wSm3'
    },
    {
      id: 'cet-head',
      org: 'מט״ח · המרכז לטכנולוגיה חינוכית',
      title: 'תפקידי ראש תחום / ניהול',
      tags: ['ניהול בכיר', 'חינוך דיגיטלי'],
      priority: 'hot',
      url: 'https://cet.ac.il/jobs_categories/head/'
    },
    {
      id: 'fb-post-1',
      org: 'מודעה מ-Facebook',
      title: 'משרה שנשמרה מפייסבוק · 1',
      tags: ['לבדיקה'],
      priority: '',
      url: 'https://www.facebook.com/share/p/18FiHm1vrY/'
    },
    {
      id: 'fb-post-2',
      org: 'מודעה מ-Facebook',
      title: 'משרה שנשמרה מפייסבוק · 2',
      tags: ['לבדיקה'],
      priority: '',
      url: 'https://www.facebook.com/share/p/18XXjeFis5/'
    },
    {
      id: 'monday-form',
      org: 'טופס הגשה · Monday',
      title: 'טופס הגשת מועמדות',
      tags: ['טופס ישיר'],
      priority: 'warm',
      url: 'https://forms.monday.com/forms/0214100ca4bccf01c61cc9764e3fd25e?r=use1'
    }
  ];

  const STATUS_OPTIONS = [
    { v: 'open',       t: 'לא הוגש' },
    { v: 'applied',    t: 'הוגשה בקשה' },
    { v: 'interview',  t: 'בראיון' },
    { v: 'offer',      t: 'קיבלתי הצעה' },
    { v: 'rejected',   t: 'נדחה / לא רלוונטי' }
  ];

  const STORAGE_KEY = 'meytal_jobs_state_v1';
  let state = loadState();
  let activeFilter = 'all';

  function loadState() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
  function jobState(id) {
    return state[id] || { done: false, status: 'open', notes: '' };
  }

  function render() {
    const container = document.getElementById('jobs');
    const filtered = JOBS.filter(j => {
      const s = jobState(j.id);
      if (activeFilter === 'all') return true;
      if (activeFilter === 'open') return !s.done && s.status === 'open';
      if (activeFilter === 'applied') return s.status === 'applied' || s.status === 'interview' || s.status === 'offer';
      if (activeFilter === 'interview') return s.status === 'interview';
      return true;
    });

    document.getElementById('count').textContent =
      filtered.length + ' מתוך ' + JOBS.length + ' משרות';

    container.innerHTML = filtered.map(j => {
      const s = jobState(j.id);
      const tags = (j.tags || []).map(t => '<span class="tag">' + t + '</span>').join('');
      const priorityTag = j.priority
        ? '<span class="tag ' + j.priority + '">' + (j.priority === 'hot' ? 'בפוקוס' : j.priority === 'warm' ? 'לעקוב' : 'מעניין') + '</span>'
        : '';
      const extra = j.extraUrl
        ? '<a class="job-btn" href="' + j.extraUrl + '" target="_blank" rel="noopener">' + (j.extraLabel || 'קישור נוסף') + '</a>'
        : '';
      return (
        '<article class="job ' + (s.done ? 'done' : '') + '" data-id="' + j.id + '">' +
          '<div class="job-check ' + (s.done ? 'checked' : '') + '" data-action="toggle" title="סמן כטופל"></div>' +
          '<div class="job-body">' +
            '<div class="job-org">' + j.org + '</div>' +
            '<div class="job-title">' + j.title + '</div>' +
            '<div class="job-meta">' + priorityTag + tags + '</div>' +
            '<textarea class="job-notes" placeholder="הערות, תאריך הגשה, איש קשר…" data-action="notes">' + (s.notes || '') + '</textarea>' +
          '</div>' +
          '<div class="job-actions">' +
            '<a class="job-btn primary" href="' + j.url + '" target="_blank" rel="noopener">' +
              'פתח משרה' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H8M17 7v9"/></svg>' +
            '</a>' +
            extra +
            '<select class="status-select" data-action="status">' +
              STATUS_OPTIONS.map(o => '<option value="' + o.v + '"' + (s.status === o.v ? ' selected' : '') + '>' + o.t + '</option>').join('') +
            '</select>' +
          '</div>' +
        '</article>'
      );
    }).join('');

    wireCards();
  }

  function wireCards() {
    document.querySelectorAll('.job').forEach(card => {
      const id = card.dataset.id;
      card.querySelector('[data-action="toggle"]').addEventListener('click', () => {
        const s = jobState(id);
        s.done = !s.done;
        state[id] = s;
        saveState(); render();
      });
      card.querySelector('[data-action="notes"]').addEventListener('input', (e) => {
        const s = jobState(id);
        s.notes = e.target.value;
        state[id] = s;
        saveState();
      });
      card.querySelector('[data-action="status"]').addEventListener('change', (e) => {
        const s = jobState(id);
        s.status = e.target.value;
        state[id] = s;
        saveState(); render();
      });
    });
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      render();
    });
  });

  render();
</script>

</body>
</html>
