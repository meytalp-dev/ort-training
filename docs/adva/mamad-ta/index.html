  מצגת של מפגש = deck ב-SESSIONS. הדף המלווה = שאלות ב-COMP, בתוך הדף הזה (action:'answer' בשרת).
  שאלות קיר (wall) מוצגות במצגת דרך ?action=wall&q=<id>, בלי שמות. קישור ישיר לדף המלווה: ‎#m1‎ … ‎#m5‎.
  לבדיקה לפני יום המפגש: ?test=1 (עוקף רק את הנעילה בדף, השרת נועל לפי תאריך).

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Heebo', Arial, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.6; font-size: 16px; }

.mipui .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--cyan) 16%, transparent); color: var(--deep); flex: none; }
.mipui b { display: block; }
.mipui span { color: var(--muted); font-size: .9rem; }
.mipui .txt { flex: 1; min-width: 0; }

h2.sec { font-size: 1.1rem; margin: 26px 0 10px; }
.sess { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
.sess.next { border-color: color-mix(in srgb, var(--pink) 55%, var(--line)); box-shadow: 0 6px 22px -14px var(--pink); }
.sh { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; }
.num { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; flex: none;
  background: linear-gradient(135deg, var(--cyan), var(--pink)); }
.sess.locked .num { background: var(--line); color: var(--muted); }
.sh .meta { flex: 1; min-width: 0; }
.sh .date { font-size: .85rem; color: var(--muted); }
.sh .date b { color: var(--pink); font-weight: 700; }
.sh h3 { font-size: 1.08rem; line-height: 1.35; }
.sh .tool { color: var(--muted); font-size: .92rem; }
.items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 18px 16px; }
.it { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--soft); color: var(--ink); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; text-align: center; }
.it:hover { border-color: var(--cyan); }
.it.off { opacity: .55; cursor: default; font-weight: 500; }
.it.off:hover { border-color: var(--line); }
.it.done { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); color: var(--ok); }
.lockline { padding: 0 18px 16px; color: var(--muted); font-size: .9rem; display: flex; gap: 8px; align-items: center; }

.task { border-top: 1px solid var(--line); padding: 16px 18px 18px; background: var(--soft); }
.task h4 { font-size: 1rem; margin-bottom: 4px; }
.task .due { font-size: .85rem; color: var(--warn); font-weight: 600; }
.task p.what { margin: 6px 0 12px; }
label.f { display: block; font-weight: 600; font-size: .9rem; margin: 10px 0 4px; }
input.f, textarea.f { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea.f { min-height: 120px; resize: vertical; }
input.f[dir="ltr"] { text-align: left; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 10px 22px; border: 0; border-radius: 12px; font: inherit; font-weight: 700;
  color: #fff; background: linear-gradient(90deg, var(--pink), var(--cyan)); cursor: pointer; text-decoration: none; }
.btn.sec2 { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn[disabled] { opacity: .6; cursor: wait; }
.msg { margin-top: 10px; font-weight: 600; }
.msg.ok { color: var(--ok); } .msg.err { color: var(--warn); }

/* הדף המלווה */
.comp { border-top: 1px solid var(--line); padding: 16px 18px 18px; }
.comp h4 { font-size: 1.05rem; margin-bottom: 6px; }
.comp .note { display: flex; gap: 8px; align-items: center; color: var(--deep); font-size: .92rem; font-weight: 600; margin-bottom: 10px; }
.me { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); margin-bottom: 14px; }
.me span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.me.ask { display: block; border-color: color-mix(in srgb, var(--pink) 45%, var(--line)); }
.me.ask label.f { margin-top: 0; }
.inl { display: flex; gap: 8px; }
.inl input.f { flex: 1; min-width: 0; }
.inl .btn { flex: none; }
.lnk { font: inherit; font-weight: 700; color: var(--deep); background: none; border: 0; min-height: 44px; padding: 0 10px; cursor: pointer; text-decoration: underline; }
.q { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; background: var(--card); }
.q.has { border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.ql { display: block; font-weight: 700; font-size: 1.02rem; line-height: 1.4; }
.qh { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.qhead { margin: 18px 0 10px; padding-inline-start: 10px; border-inline-start: 4px solid var(--pink); }
.qhead h5 { font-size: 1.08rem; font-weight: 800; }
.q.cpy { background: var(--soft); }
.cptxt { white-space: pre-wrap; font-size: .92rem; line-height: 1.6; margin-top: 6px; padding: 10px 12px; background: var(--card); border: 1px dashed var(--line); border-radius: 10px; -webkit-user-select: text; user-select: text; }
.btn.ghost { background: var(--card); color: var(--deep); border: 1px solid var(--line); }
.q .f { margin-top: 10px; font-size: 16px; }
textarea.f.sm { min-height: 96px; }
.qa { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 10px; }
.qa .msg { margin-top: 0; }
.ch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.opt { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; padding: 10px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--soft); color: var(--ink); font: inherit; cursor: pointer; text-align: center; }
.opt b { font-size: 1.05rem; }
.opt span { font-size: .82rem; color: var(--muted); }
.opt.on { border-color: var(--pink); background: color-mix(in srgb, var(--pink) 10%, var(--card)); }
.ans-q { margin-top: 12px; }
.ans-q h5 { font-size: .95rem; margin-bottom: 2px; }

/* מבט מנחה */
.adm { background: var(--card); border: 1px dashed color-mix(in srgb, var(--pink) 60%, var(--line)); border-radius: 16px; padding: 16px 18px; margin-top: 18px; }
.adm h2 { font-size: 1.05rem; margin-bottom: 10px; }
.adm .row { display: flex; flex-wrap: wrap; gap: 8px; }
.subs { border-top: 1px solid var(--line); padding: 14px 18px; }
.subs summary { cursor: pointer; font-weight: 700; }
.sub { border-bottom: 1px solid var(--line); padding: 10px 0; }
.sub:last-child { border-bottom: 0; }
.sub .who { font-weight: 700; } .sub .when { color: var(--muted); font-size: .82rem; margin-inline-start: 6px; }
.sub .body { white-space: pre-wrap; margin-top: 2px; }
.sub a { color: var(--deep); word-break: break-all; }
.miss { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--peach) 18%, transparent); }
.miss b { display: block; margin-bottom: 4px; }
.small { font-size: .85rem; color: var(--muted); }

footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 40px 16px 34px; }
footer img { height: 54px; display: block; margin: 0 auto 6px; }
footer a { color: var(--muted); }

@media (max-width: 600px) {
  .items { grid-template-columns: 1fr; }
  .mipui { flex-wrap: wrap; }
  .mipui .btn { width: 100%; justify-content: center; }
  header.top .slogo { height: 44px; }
}
</style>

      .catch(function (e) {
        b.disabled = false; b.textContent = 'שליחה';
        msg(n, 'err', e && e.message === 'locked' ? 'המשימה תיפתח ביום המפגש.' : 'השליחה לא הצליחה. בדקו את החיבור ונסו שוב. התשובה נשארה כאן.');
      });
  }

  /* ---------- מבט מנחה ---------- */
  function adminSubs(s) {
    if (!s.task) return '';
    var subs = DATA.subs.filter(function (x) { return x.s === s.n; });
    var got = {}; subs.forEach(function (x) { got[norm(x.name)] = 1; });
    var missing = DATA.team.filter(function (n) { return !got[norm(n)]; });
    var h = '<details class="subs"' + (subs.length ? ' open' : '') + '><summary>הגשות: ' + subs.length +
      (DATA.team.length ? ' · טרם הגישו: ' + missing.length + ' מתוך ' + DATA.team.length : '') + '</summary>';
    if (DATA.team.length) {
      h += missing.length ? '<div class="miss"><b>מי טרם הגיש/ה</b>' + missing.map(esc).join(' · ') +
        '<div style="margin-top:8px"><button class="btn sec2" type="button" data-copy="' + esc(missing.join('\n')) + '"><svg class="i"><use href="#i-copy"/></svg>העתקת הרשימה</button></div></div>'
        : '<div class="miss"><b>כל הצוות הגיש</b></div>';
    }
    subs.slice().reverse().forEach(function (x) {
      h += '<div class="sub"><span class="who">' + esc(x.name) + '</span><span class="when">' + esc(x.t) + '</span>' +
        (x.text ? '<div class="body">' + esc(x.text) + '</div>' : '') +
        (x.link ? '<div><a href="' + esc(x.link) + '" target="_blank" rel="noopener" dir="ltr">' + esc(x.link) + '</a></div>' : '') + '</div>';
    });
    if (!subs.length) h += '<div class="small" style="margin-top:8px">עוד אין הגשות.</div>';
    return h + '</details>';
  }

  function adminBox(err) {
    var box = document.getElementById('admBox');
    if (!ADMIN) { box.innerHTML = ''; return; }
    var team = DATA ? DATA.team : [];
    box.innerHTML = '<section class="adm"><h2>מבט מנחה</h2>' +
      (err ? '<p class="msg err">' + esc(err) + '</p>' : '') +
      '<div class="row">' + (DATA && DATA.mipui ? '<a class="btn" href="' + esc(DATA.mipui) + '" target="_blank" rel="noopener"><svg class="i"><use href="#i-chart"/></svg>דשבורד המיפוי</a>' : '') +
      '<button class="btn sec2" type="button" id="rosterT">רשימת הצוות (' + team.length + ')</button>' +
      '<button class="btn sec2" type="button" id="logout">יציאה ממבט המנחה</button></div>' +
      '<div id="rosterBox" hidden><label class="f" for="rosterTx">שם בכל שורה. ההשוואה ל"מי טרם הגיש" לפי השם שכתבו בהגשה.</label>' +
      '<textarea class="f" id="rosterTx">' + esc(team.join('\n')) + '</textarea>' +
      '<div style="margin-top:10px"><button class="btn" type="button" id="rosterSave">שמירת הרשימה</button></div><div class="msg" id="rosterMsg"></div></div>' +
      adminAnswers() + '</section>';
    document.getElementById('rosterT').onclick = function () { var r = document.getElementById('rosterBox'); r.hidden = !r.hidden; };
    document.getElementById('logout').onclick = function () { st('adva_mamad_k', null); location.reload(); };
    document.getElementById('rosterSave').onclick = saveRoster;
  }

  // תשובות הדף המלווה, לפי מפגש ושאלה, עם שמות + העתקת הכול
  function adminAnswers() {
    var ans = (DATA && DATA.answers) || [];
    var h = '<details class="subs" style="padding-inline:0"' + (ans.length ? ' open' : '') + '><summary>תשובות הדף המלווה: ' + ans.length + '</summary>';
    if (!ans.length) return h + '<div class="small" style="margin-top:8px">עוד אין תשובות.</div></details>';
    var copy = [], body = '';
    SESSIONS.forEach(function (s) {
      var mine = ans.filter(function (a) { return a.s === s.n; });
      if (!mine.length) return;
      var ids = (COMP[s.n] || []).map(function (q) { return q.id; });
      mine.forEach(function (a) { if (ids.indexOf(a.q) < 0) ids.push(a.q); });
      body += '<h4 style="margin-top:14px">מפגש ' + s.n + ' · ' + esc(s.title) + '</h4>';
      copy.push('מפגש ' + s.n + ' · ' + s.title);
      ids.forEach(function (id) {
        var list = mine.filter(function (a) { return a.q === id; });
        if (!list.length) return;
        var q = qById(id), lab = q ? q.label : id;
        body += '<div class="ans-q"><h5>' + esc(lab) + ' (' + list.length + ')</h5>';
        copy.push('', lab);
        list.forEach(function (a) {
          var link = /^https?:\/\//i.test(a.text);
          body += '<div class="sub"><span class="who">' + esc(a.name) + '</span><span class="when">' + esc(a.t) + '</span>' +
            (link ? '<div><a href="' + esc(a.text) + '" target="_blank" rel="noopener" dir="ltr">' + esc(a.text) + '</a></div>' : '<div class="body">' + esc(a.text) + '</div>') + '</div>';
          copy.push(a.name + ': ' + a.text);
        });
        body += '</div>';
      });
      copy.push('');
    });
    return h + '<div style="margin-top:10px"><button class="btn sec2" type="button" data-copy="' + esc(copy.join('\n').trim()) + '"><svg class="i"><use href="#i-copy"/></svg>העתקת כל התשובות</button></div>' + body + '</details>';
  }

  function saveRoster() {
    var names = document.getElementById('rosterTx').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    var m = document.getElementById('rosterMsg'); m.className = 'msg'; m.textContent = 'שומר…';
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'roster', k: KEY, names: names }) })
      .then(function (r) { return r.json(); })
      .then(function (r) { if (!r.ok) throw 0; m.className = 'msg ok'; m.textContent = 'נשמרו ' + r.n + ' שמות.'; loadAdmin(); })
      .catch(function () { m.className = 'msg err'; m.textContent = 'השמירה לא הצליחה. נסו שוב.'; });
  }

  function loadAdmin() {
    if (!API) { adminBox('השרת עוד לא מחובר.'); return; }
    fetch(API + '?action=admin&k=' + encodeURIComponent(KEY), { credentials: 'omit' })
      .then(function (r) { return r.json(); })
      .then(function (r) { if (!r.ok) throw new Error(r.error); DATA = r; adminBox(); render(); })
      .catch(function (e) { adminBox(e && e.message === 'key' ? 'המפתח לא נכון.' : 'לא הצלחתי לטעון את ההגשות. רעננו את הדף.'); });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]'); if (!b) return;
    var t = b.getAttribute('data-copy');
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { b.lastChild.textContent = 'הועתק'; }, function () { prompt('העתיקו:', t); });
  });

  // הדף המלווה נפתח לבד ביום המפגש, או בקישור ‎#m1‎ (למשל מקוד QR במצגת)
  var hm = /^#m([1-5])$/.exec(location.hash);
  SESSIONS.forEach(function (s) { if (s.date === T && COMP[s.n].length) OPEN_COMP[s.n] = true; });
  if (TEST && COMP[1].length) OPEN_COMP[1] = true;
  if (hm) OPEN_COMP[+hm[1]] = true;
  render();
  if (hm) { var tg = document.getElementById('cb' + hm[1]) || document.getElementById('s' + hm[1]); if (tg) tg.scrollIntoView(); }
  if (ADMIN) { adminBox(); loadAdmin(); }
})();
</script>
</body>
</html>
