<title>מלווה עבודת חקר</title>
<!--
  מלווה עבודת חקר, לכל נושא (ממ"ד לטכנולוגיה ואומנות, לרני).
  תלמידים (הנגשה: מנות קטנות ושפה פשוטה): קוד כיתה + שם → 7 תחנות, בכל תחנה צעדים של משימה אחת במסך, עזרה מ-Gemini (לא חובה) ושליחה למורה. כניסה חוזרת: קוד אישי.
  מורה: קישור אישי #t=<key> (נשמר במכשיר) → הכיתה, מי טרם התחיל, עבודה של תלמיד.ה, הנחיות ל-Gemini להכנה לפגישה ולטיוטת משוב.
  אין קריאות ל-AI מהכלי ואין עלות: ההנחיה נבנית כאן, מועתקת ומודבקת ב-Gemini.
  שרת שמירה בלבד: לרני\heker-gas (חשבון mlypeleg).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1f2a37; --muted: #5b6676; --line: #e5e8ee; --soft: #f7f8fb; --bg: #fcfbfa; --card: #fff;
  --cyan: #3cc6e0; --pink: #e8619f; --peach: #f5a985; --deep: #234a63; --ok: #1f8a5b; --warn: #b4531f; --link: #1d6f8c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ink: #eef1f5; --muted: #a7b0bd; --line: #2c3540; --soft: #1c232c; --bg: #131820; --card: #1a2029; --deep: #9fd6e8; --ok: #5fcf9a; --warn: #f0a070; --link: #7fd0e6; }
}
:root[data-theme="dark"] { --ink: #eef1f5; --muted: #a7b0bd; --line: #2c3540; --soft: #1c232c; --bg: #131820; --card: #1a2029; --deep: #9fd6e8; --ok: #5fcf9a; --warn: #f0a070; --link: #7fd0e6; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Heebo', Arial, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.6; font-size: 16px; }
.bar { height: 6px; background: linear-gradient(90deg, var(--peach), var(--pink), var(--cyan)); }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: var(--link); }
[hidden] { display: none !important; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 8px; }
header.top .sname { font-weight: 800; line-height: 1.3; }
header.top .ssub { color: var(--muted); font-size: .88rem; }
.hero { padding: 16px 0 6px; }
h1 { font-family: 'Rubik', 'Heebo', sans-serif; font-size: clamp(1.7rem, 5vw, 2.4rem); line-height: 1.15; }
h1 em { font-style: normal; background: linear-gradient(90deg, var(--pink), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--muted); margin-top: 8px; max-width: 640px; }
h2 { font-size: 1.25rem; line-height: 1.3; }
h3 { font-size: 1.05rem; line-height: 1.35; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 14px; }
.doors { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
.doors .card { margin-top: 0; display: flex; flex-direction: column; gap: 4px; }
.doors .btn { margin-top: auto; }
.doors > .btn { min-height: 64px; font-size: 1.1rem; }
label.f { display: block; font-weight: 600; font-size: .92rem; margin: 12px 0 4px; }
label.f small { display: block; font-weight: 400; color: var(--muted); }
input.f, textarea.f, select.f { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
input.f:focus, textarea.f:focus, select.f:focus { outline: 2px solid var(--cyan); outline-offset: 0; border-color: transparent; }
textarea.f { min-height: 92px; resize: vertical; }
textarea.f.big { min-height: 190px; }
[dir="ltr"].f { text-align: left; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px; border: 0; border-radius: 12px; font: inherit; font-weight: 700;
  color: #fff; background: linear-gradient(90deg, #c8417f, #1f8ca6); cursor: pointer; text-decoration: none; }
.btn.alt { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn.sm { min-height: 38px; padding: 6px 14px; font-size: .92rem; font-weight: 600; }
.btn[disabled] { opacity: .6; cursor: wait; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.sp { justify-content: space-between; }
.msg { margin-top: 10px; font-weight: 600; min-height: 1.4em; }
.msg.ok { color: var(--ok); } .msg.err { color: var(--warn); }
.small { font-size: .87rem; color: var(--muted); }
.code { font-weight: 800; letter-spacing: .08em; unicode-bidi: isolate; direction: ltr; display: inline-block; }

/* מסלול התחנות */
.steps { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 14px 0 4px; position: relative; }
.step { background: none; border: 0; font: inherit; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; min-width: 0; font-size: .76rem; line-height: 1.2; text-align: center; }
.step b { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .98rem; border: 2px solid var(--line); background: var(--card); color: var(--muted); }
.step.has b { border-color: var(--cyan); color: var(--deep); }
.step.sent b { border-color: var(--peach); background: color-mix(in srgb, var(--peach) 22%, var(--card)); color: var(--ink); }
.step.fix b { border-color: var(--warn); color: var(--warn); }
.step.ok b { border-color: var(--ok); background: var(--ok); color: #fff; }
.step.on { color: var(--ink); font-weight: 700; }
.step.on b { box-shadow: 0 0 0 3px color-mix(in srgb, var(--pink) 45%, transparent); }

.lead { color: var(--muted); margin-top: 4px; }
.tcomment { margin-top: 14px; border-radius: 12px; padding: 12px 14px; background: color-mix(in srgb, var(--cyan) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--cyan) 35%, var(--line)); }
.tcomment b { display: block; }
.tcomment p { white-space: pre-wrap; }
.count { font-size: .82rem; color: var(--muted); text-align: left; margin-top: 2px; }
.srow { border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px 12px; margin-top: 10px; background: var(--soft); }
.srow .two { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
.srow .two label.f, .srow > label.f { margin-top: 8px; }

/* הכלי */
.tool { margin-top: 16px; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--pink) 35%, var(--line)); background: var(--card); overflow: hidden; }
.thead { display: flex; gap: 12px; padding: 14px 16px; background: color-mix(in srgb, var(--pink) 7%, var(--card)); }
.thead .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; color: #fff; background: linear-gradient(135deg, #c8417f, #1f8ca6); }
.thead b { display: block; }
.thead span { color: var(--muted); font-size: .92rem; display: block; }
.ask { padding: 0 16px 14px; }
.ask { padding-top: 14px; }
details.manual { margin-top: 6px; }
details.manual textarea { margin-top: 6px; }
.note { padding: 0 16px 14px; font-size: .84rem; color: var(--muted); }

/* צעד אחד במסך */
.prog { margin-top: 10px; font-weight: 600; font-size: .92rem; color: var(--muted); }
.q, label.f.q { display: block; font-size: 1.28rem; font-weight: 800; line-height: 1.35; margin: 16px 0 6px; color: var(--ink); }
.line { font-size: 1.1rem; margin-top: 8px; }
.kick { font-weight: 600; color: var(--muted); margin-top: 14px; font-size: .92rem; }
.tagline { font-weight: 700; margin-top: 6px; }
#fields .small { font-size: .98rem; }
#fields input.f, #fields textarea.f { font-size: 1.05rem; padding: 12px 14px; }
.ex, .term, .mine { border-radius: 12px; padding: 10px 14px; margin-top: 10px; }
.ex { background: var(--soft); border: 1px solid var(--line); }
.ex b, .term b, .minet { display: block; font-size: .88rem; color: var(--muted); font-weight: 700; }
.ex p { white-space: pre-wrap; }
.term { background: color-mix(in srgb, var(--peach) 16%, var(--card)); border: 1px solid color-mix(in srgb, var(--peach) 45%, var(--line)); margin-top: 16px; }
.term p { font-size: 1.05rem; }
.mine { background: color-mix(in srgb, var(--cyan) 9%, var(--card)); border: 1px solid color-mix(in srgb, var(--cyan) 30%, var(--line)); margin-top: 16px; max-height: 260px; overflow-y: auto; }
.mine .ans:first-of-type { margin-top: 4px; }
.cmp { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 10px 14px; margin-top: 10px; border: 1px solid var(--line); }
.cmp p { font-size: .98rem; }
.cmp.bad svg { color: var(--warn); } .cmp.good svg { color: var(--ok); }
.cmp.good { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.choices { display: grid; gap: 8px; }
.choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
.choice:has(input:checked) { border-color: var(--cyan); background: color-mix(in srgb, var(--cyan) 10%, var(--card)); }
.choice input { width: 20px; height: 20px; margin-top: 4px; flex: none; }
.choice b, .choice span span { display: block; }
.choice span span { color: var(--muted); font-size: .96rem; }
.chk { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.chk .row { margin-top: 6px; }
.yn.on { border-color: var(--deep); background: var(--soft); box-shadow: inset 0 0 0 1px var(--deep); }
.ckr { margin-top: 8px; font-weight: 600; }
.ckr.ok { color: var(--ok); } .ckr.no { color: var(--warn); }
.howto { padding-inline-start: 22px; margin: 10px 0 12px; }
.howto li { margin-top: 4px; }
.stuck { margin-top: 12px; }
.stuck summary { cursor: pointer; font-weight: 600; color: var(--link); min-height: 32px; }
.stuck p { margin-top: 4px; }
.sumrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding: 10px 0; margin-top: 8px; }
.sumrow > div:first-child { min-width: 0; }
.sumrow p { white-space: pre-wrap; overflow-wrap: anywhere; }
.sumrow .empty { color: var(--warn); }
.savedline { margin-top: 12px; min-height: 1.4em; }

/* מורה */
.num { font-size: 1.5rem; font-weight: 800; }
.meter { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--cyan)); }
.miss { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--peach) 18%, transparent); }
.sline { display: grid; grid-template-columns: 1.4fr 170px auto; gap: 12px; align-items: center; width: 100%; text-align: right; font: inherit; color: var(--ink); background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 2px; cursor: pointer; }
.sline:hover { background: var(--soft); }
.sline .nm { font-weight: 700; }
.dots { display: flex; gap: 5px; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.dot.has { border-color: var(--cyan); }
.dot.sent { border-color: var(--peach); background: var(--peach); }
.dot.fix { border-color: var(--warn); }
.dot.ok { border-color: var(--ok); background: var(--ok); }
.tag { display: inline-block; font-size: .8rem; font-weight: 700; border-radius: 20px; padding: 1px 10px; }
.tag.sent { background: color-mix(in srgb, var(--peach) 30%, transparent); }
.tag.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.tag.fix { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.tag.draft { color: var(--muted); background: var(--soft); }
details.st { border: 1px solid var(--line); border-radius: 12px; margin-top: 10px; background: var(--card); }
details.st > summary { cursor: pointer; padding: 12px 14px; font-weight: 700; display: flex; gap: 8px; align-items: center; justify-content: space-between; list-style: none; }
details.st > summary::-webkit-details-marker { display: none; }
details.st > div { padding: 0 14px 14px; }
.ans { margin-top: 8px; }
.ans b { display: block; font-size: .87rem; color: var(--muted); font-weight: 600; }
.ans p { white-space: pre-wrap; overflow-wrap: anywhere; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .84rem; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }

.helpbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 20px; padding: 4px 14px; font-size: .86rem; color: var(--muted); text-decoration: none; background: var(--card); }
.helpline { text-align: center; margin-top: 26px; }
footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 26px 16px 34px; }
footer img { height: 54px; display: block; margin: 0 auto 6px; }
footer a { color: var(--muted); }

@media (max-width: 600px) {
  .doors { grid-template-columns: 1fr; }
  .steps span { display: none; }
  .step b { width: 36px; height: 36px; }
  .sline { grid-template-columns: 1fr auto; }
  .sline .when { grid-column: 1 / -1; }
  .srow .two { grid-template-columns: 1fr; gap: 0; }
  .row.nav .btn { flex: 1; }
}
</style>
</head>

<script>

  function renderStudent() {

      (!last ? '<button class="btn" id="stepNext" type="button">הבא</button>' : (S.cur < 7 ? '<button class="btn alt" data-go="' + (S.cur + 1) + '" type="button">לתחנה הבאה</button>' : '<button class="btn alt" id="dl" type="button">' + icon('i-down') + 'הורדת העבודה ל-Word</button>')) + '</div>';

    });

  function bindStep(x, def, s, all, i) {
    function jump(b) { b.onclick = function () { goStep(Number(b.getAttribute('data-step'))); }; }
    Array.prototype.forEach.call(app.querySelectorAll('[data-step]'), jump);
    if (x.ai) {
      bindAi('aiGo', function () { return studentPrompt(def, S.stations); }, 'ההנחיה הועתקה. עכשיו מדביקים אותה ב-Gemini ושולחים.');
      return;
    }
    if (x.take) {
      $('F_aitake').oninput = function () { s.data.aitake = this.value; changed(); };
      return;
    }
    if (x.done) {
      $('submit').onclick = function () {
        flush();
        if (!hasContent(s.data)) { $('saved').textContent = 'עוד אין מה לשלוח. קודם כותבים משהו בתחנה.'; return; }
        var b = this, n = S.cur; b.disabled = true;
        $('saved').textContent = 'שולחים…';
        enqueue(n, true, function (r) {
          if ($('submit')) $('submit').disabled = false;
          if (!r.ok) return;
          s.status = 'sent';
          if (S.cur === n) { renderStudent(); $('saved').textContent = 'נשלח למורה. אפשר להמשיך בלי לחכות.'; }
        });
        pump();
      };
      return;
    }
    if (x.srcList) {
      var list = s.data[x.field.k];
      Array.prototype.forEach.call(app.querySelectorAll('[data-del]'), function (b) {
        b.onclick = function () { list.splice(Number(b.getAttribute('data-del')), 1); changed(); renderStudent(); };
      });
      if ($('addRow')) $('addRow').onclick = function () {
        list.push({ title: '', year: '', author: '', link: '', summary: '' }); changed();
        var src = list.length - 1, at = 0;
        stepsOf(def, s.data).some(function (y, j) { if (y.src === src) { at = j; return true; } return false; });
        goStep(at);
      };
      return;
    }
    if (x.item) {
      x.item.inputs.forEach(function (f) {
        $('L' + x.src + '_' + f.k).oninput = function () { s.data[x.field.k][x.src][f.k] = this.value; changed(); };
      });
      return;
    }
    if (x.checks) {
      Array.prototype.forEach.call(app.querySelectorAll('[data-ck]'), function (b) {
        b.onclick = function () {
          var n = Number(b.getAttribute('data-ck')), c = x.checks[n], box = $('ckr' + n), yes = b.getAttribute('data-v') === 'y', at = -1;
          Array.prototype.forEach.call(app.querySelectorAll('[data-ck="' + n + '"]'), function (o) { o.classList.toggle('on', o === b); });
          box.hidden = false;
          if (yes) { box.className = 'ckr ok'; box.textContent = 'מצוין.'; return; }
          all.forEach(function (y, j) { if (at < 0 && y.k === c.back) at = j; });
          box.className = 'ckr no';
          box.innerHTML = '<p>' + esc(c.no) + '</p><button class="btn alt sm" type="button" data-step="' + at + '" style="margin-top:6px">חזרה לתיקון</button>';
          jump(box.querySelector('[data-step]'));
        };
      });
      return;
    }
    if (x.k) {
      if (x.type === 'choice') {
        x.options.forEach(function (o, j) { $('F_' + x.k + '_' + j).onchange = function () { s.data[x.k] = o.v; changed(); }; });
        return;
      }
      var el = $('F_' + x.k);
      el.oninput = function () { s.data[x.k] = el.value; changed(); };
      el.onchange = el.oninput;
    }
  }

  function changed() {
    S.dirty = true;
    var sv = $('saved'); if (sv) sv.textContent = 'שומרים…';
    var tag = app.querySelector('section.card .tag'); if (tag) tag.textContent = statusLabel(station(S.cur));
    keepDraft(S.cur);
    clearTimeout(S.timer);
    S.timer = setTimeout(saveNow, 1500);
  }
  // שמירה ברקע, בלי לקטוע את ההקלדה. השרת איטי, ולכן בקשה אחת בכל פעם, ולכל תחנה נשלח רק המצב האחרון.
  // הטיוטה במכשיר נמחקת רק אחרי שהשרת אישר, כדי שסגירת הדף באמצע לא תאבד טקסט.
  var queue = {}, sending = false, retry = null, waiters = [];
  function drafts() { return stJson('heker_draft_' + S.me.sid) || {}; }
  function keepDraft(n) { var d = drafts(); d[n] = station(n).data; st('heker_draft_' + S.me.sid, JSON.stringify(d)); }
  function dropDraft(n) { var d = drafts(); delete d[n]; st('heker_draft_' + S.me.sid, Object.keys(d).length ? JSON.stringify(d) : null); }
  function isIdle() { return !sending && !S.dirty && !Object.keys(queue).length; }
  function showSaved() {
    var sv = $('saved'); if (!sv || !S) return;
    if (!isIdle()) sv.textContent = 'שומרים…'; else if (sv.textContent === 'שומרים…') sv.textContent = 'נשמר';
  }
  function enqueue(n, submit, done) {
    var old = queue[n] || {};
    queue[n] = { data: JSON.parse(JSON.stringify(station(n).data)), submit: submit || old.submit, done: done || old.done };
  }
  function pump() {
    if (sending || !S) return;
    var keys = Object.keys(queue);
    if (!keys.length) { var w = waiters; waiters = []; w.forEach(function (f) { f(); }); showSaved(); return; }
    var n = Number(keys[0]), job = queue[n], me = S.me;
    delete queue[n]; sending = true;
    var was = $('saved'); if (was && was.textContent.indexOf('לא נמחק') >= 0) was.textContent = 'שומרים…';
    call('student.save', { code: me.code, sid: me.sid, pin: me.pin, st: n, data: job.data, submit: !!job.submit }).then(function (r) {
      sending = false;
      if (!S) return;
      if (job.done) job.done(r);
      if (r.ok) {
        if (!queue[n] && !(S.dirty && S.cur === n)) dropDraft(n);
        pump();
        return;
      }
      if (!queue[n]) queue[n] = job;
      else if (job.submit) queue[n].submit = true;
      var sv = $('saved'); if (sv) sv.textContent = errText(r.error) + ' מה שכתבתם לא נמחק.';
      // בעיית רשת או שרת עמוס: מנסים שוב לבד
      if (r.error === 'net' || r.error === 'server') { clearTimeout(retry); retry = setTimeout(pump, 8000); }
      else { var w = waiters; waiters = []; w.forEach(function (f) { f(); }); }
    });
  }
  function saveNow() {
    clearTimeout(S.timer);
    if (S.dirty) { S.dirty = false; enqueue(S.cur); }
    pump();
    showSaved();
  }
  function flush() { saveNow(); }
  function whenSaved() {
    return new Promise(function (ok) {
      if (!S || isIdle()) { ok(); return; }
      waiters.push(ok);
      setTimeout(ok, 15000);
    });
  }

  /* ===== הורדה ל-Word ===== */

  function loadZip() {
    if (window.JSZip) return Promise.resolve();
    return new Promise(function (ok, no) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      s.onload = ok; s.onerror = no;
      document.head.appendChild(s);
    });
  }
  function xml(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, ''); }
  function para(text, size, bold, center, after) {
    var rp = '<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>' + (bold ? '<w:b/><w:bCs/>' : '') + '<w:sz w:val="' + size + '"/><w:szCs w:val="' + size + '"/><w:rtl/></w:rPr>';
    return String(text || '').split('\n').map(function (line) {
      return '<w:p><w:pPr><w:bidi/><w:spacing w:after="' + (after || 120) + '" w:line="324" w:lineRule="auto"/>' + (center ? '<w:jc w:val="center"/>' : '') + '</w:pPr><w:r>' + rp + '<w:t xml:space="preserve">' + xml(line) + '</w:t></w:r></w:p>';
    }).join('');
  }
  function buildDocx(me, stations) {
    function d(n) { return (stations[n] && stations[n].data) || {}; }
    var body = para('עבודת חקר', 44, true, true, 240);
    if (d(1).topic) body += para(d(1).topic, 32, true, true, 200);
    if (d(2).question) body += para('שאלת החקר: ' + d(2).question, 26, false, true, 240);
    body += para(me.name, 24, false, true, 480);
    STATIONS[5].fields.forEach(function (f) {
      var t = d(6)[f.k];
      if (t && t.trim()) body += para(f.label, 30, true, false, 120) + para(t, 24);
    });
    var src = (d(3).sources || []).filter(function (o) { return (o.title || o.author || o.link); });
    if (src.length) {
      body += para('ביבליוגרפיה', 30, true, false, 120);
      src.forEach(function (o) { body += para([o.author, o.year ? '(' + o.year + ')' : '', o.title, o.link].filter(Boolean).join('. '), 24); });
    }
    var used = STATIONS.filter(function (x) { return String(d(x.n).aitake || '').trim(); }).map(function (x) { return x.tool.name; });
    if (used.length || d(7).aiuse || d(7).ainot) {
      body += para('שימוש בבינה מלאכותית', 30, true, false, 120);
      if (used.length) body += para('העזרה שלקחתי מ-Gemini: ' + used.join(', ') + '.', 24);
      if (d(7).aiuse) body += para(d(7).aiuse, 24);
      if (d(7).ainot) body += para('מה לא לקחתי: ' + d(7).ainot, 24);
    }
    var docx = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + body +
      '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/><w:bidi/></w:sectPr></w:body></w:document>';
    var zip = new window.JSZip();
    zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
    zip.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
    zip.file('word/document.xml', docx);
    return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  }
  function downloadWork(btn) {
    var o = btn.innerHTML; btn.disabled = true; btn.textContent = 'מכינים קובץ…';
    var finish = function (text) { btn.disabled = false; btn.innerHTML = text || o; if (text) setTimeout(function () { btn.innerHTML = o; }, 3000); };
    loadZip().then(function () { return buildDocx(S.me, S.stations); }).then(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'עבודת-חקר-' + S.me.name + '.docx';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      finish();
    }).catch(function () { finish('ההורדה לא עבדה. נסו שוב.'); });
  }

    app.innerHTML = '<div class="card">טוענים את הכיתה…</div>';
    call('teacher.class', { key: key }).then(function (r) {
      if (!r.ok) {
        if (r.error === 'key') { st('heker_t', null); entry(''); return; }
        app.innerHTML = '<div class="card"><p>' + esc(errText(r.error)) + '</p><button class="btn" style="margin-top:10px" id="retry">ניסיון נוסף</button></div>';
        $('retry').onclick = function () { teacherHome(); };
        return;
      }
      T = r; T.key = key; T.isNew = !!isNew;
      setWho(r.teacher + ' · ' + r.name, true);
      renderClass();
    });
  }
  function norm(s) { return String(s || '').replace(/["'׳״.\-]/g, '').replace(/\s+/g, ' ').trim(); }
  function notStarted() {
    return (T.roster || []).filter(function (full) {
      var n = norm(full);
      return !T.students.some(function (s) { var m = norm(s.name); return m && (n === m || n.split(' ').indexOf(m) >= 0 || m.split(' ').indexOf(n) >= 0 || n.indexOf(m + ' ') === 0); });
    });
  }
  function dotClass(s, n) {
    var v = s.status[n];
    if (v === 'ok' || v === 'sent' || v === 'fix') return v;
    return s.touched.indexOf(n) >= 0 ? 'has' : '';
  }
  function renderClass() {
    var link = location.origin + location.pathname + '#c=' + T.code;
    var myLink = location.origin + location.pathname + '#t=' + T.key;
    var miss = notStarted(), total = T.roster.length || T.students.length, started = T.roster.length ? T.roster.length - miss.length : T.students.length;
    var waiting = T.students.reduce(function (acc, s) { return acc + Object.keys(s.status).filter(function (k) { return s.status[k] === 'sent'; }).length; }, 0);
    var html = '';
    if (T.isNew) html += '<div class="card"><b>הכיתה נפתחה.</b><div class="small">שמרו את הקישור האישי שלכם. זו הדרך היחידה להיכנס למבט המורה ממכשיר אחר.</div><div class="row" style="margin-top:8px"><button class="btn alt sm" id="copyMine">' + icon('i-copy') + 'העתקת הקישור האישי שלי</button></div></div>';
    html += '<section class="card"><div class="row sp"><h2>' + esc(T.name) + '</h2><div class="row"><span class="small">קוד כיתה: <span class="code">' + esc(T.code) + '</span></span><button class="btn alt sm" id="copyLink">' + icon('i-copy') + 'קישור לתלמידים</button></div></div>';
    html += '<div style="margin-top:12px"><span class="num">' + started + '</span> מתוך ' + total + ' התחילו' + (waiting ? ' · <b>' + waiting + '</b> תחנות מחכות לאישור' : '') + '<div class="meter"><i style="width:' + (total ? Math.round(started / total * 100) : 0) + '%"></i></div></div>';
    if (miss.length) html += '<div class="miss"><b>טרם התחילו (' + miss.length + ')</b><div>' + miss.map(esc).join(', ') + '</div><button class="btn alt sm" style="margin-top:8px" id="copyMiss">' + icon('i-copy') + 'העתקת השמות</button></div>';
    else if (!T.roster.length) html += '<p class="small" style="margin-top:10px">כדי לראות מי טרם התחיל, הוסיפו את רשימת הכיתה בהגדרות למטה.</p>';
    html += '</section>';
    html += '<section class="card"><h2>התלמידים</h2>' + (T.students.length ? '<div class="legend"><span><i class="dot has"></i>בעבודה</span><span><i class="dot sent"></i>מחכה לאישור</span><span><i class="dot fix"></i>לתיקון</span><span><i class="dot ok"></i>אושר</span></div>' : '<p class="small" style="margin-top:6px">עוד אין תלמידים. שלחו להם את הקישור או את קוד הכיתה.</p>') + '<div style="margin-top:10px">' +
      T.students.map(function (s) {
        var w = Object.keys(s.status).filter(function (k) { return s.status[k] === 'sent'; }).length;
        return '<button class="sline" data-sid="' + esc(s.sid) + '"><span class="nm">' + esc(s.name) + (w ? ' <span class="tag sent">' + w + ' לאישור</span>' : '') + '</span>' +
          '<span class="dots" aria-label="התקדמות בתחנות">' + STATIONS.map(function (d) { return '<i class="dot ' + dotClass(s, d.n) + '" title="' + esc(d.title) + '"></i>'; }).join('') + '</span>' +
          '<span class="small when">' + (s.updated ? 'עודכן ' + esc(s.updated) : '') + '</span></button>';
      }).join('') + '</div></section>';
    html += '<details class="st"><summary>הגדרות: רשימת הכיתה והמחוון</summary><div>' +
      '<label class="f" for="roster">רשימת הכיתה<small>שם בכל שורה. משמש רק ל"מי טרם התחיל".</small></label><textarea class="f" id="roster">' + esc((T.roster || []).join('\n')) + '</textarea>' +
      '<label class="f" for="rubric">המחוון של העבודה<small>הדביקו כאן את הקריטריונים. טיוטות המשוב ייצמדו אליהם. בלי מחוון המשוב יהיה כללי.</small></label><textarea class="f big" id="rubric" maxlength="8000">' + esc(T.rubric) + '</textarea>' +
      '<button class="btn sm" style="margin-top:10px" id="saveSet">שמירה</button><div class="msg" id="setMsg"></div></div></details>';
    app.innerHTML = html;
    if (T.isNew) $('copyMine').onclick = function () { copy(myLink, this); };
    $('copyLink').onclick = function () { copy(link, this); };
    if (miss.length) $('copyMiss').onclick = function () { copy(miss.join('\n'), this); };
    Array.prototype.forEach.call(app.querySelectorAll('.sline'), function (b) { b.onclick = function () { openStudent(b.getAttribute('data-sid')); }; });
    $('saveSet').onclick = function () {
      var b = this, m = $('setMsg'), names = $('roster').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean), rub = $('rubric').value;
      b.disabled = true; setMsg(m, 'שומרים…');
      call('teacher.settings', { key: T.key, roster: names, rubric: rub }).then(function (r) {
        b.disabled = false;
        if (!r.ok) { setMsg(m, errText(r.error), 'err'); return; }
        T.roster = names; T.rubric = rub; T.isNew = false; renderClass();
      });
    };
  }

  function openStudent(sid) {
    app.innerHTML = '<div class="card">טוענים…</div>';
    window.scrollTo(0, 0);
    call('teacher.student', { key: T.key, sid: sid }).then(function (r) {
      if (!r.ok) { app.innerHTML = '<div class="card">' + esc(errText(r.error)) + '</div>'; return; }
      renderStudentForTeacher(sid, r);
    });
  }
  function answersHtml(def, data) {
    var parts = [];
    def.fields.forEach(function (f) {
      var v = data[f.k];
      if (f.type === 'list') {
        (v || []).forEach(function (o, i) {
          parts.push('<div class="ans"><b>מקור ' + (i + 1) + '</b><p>' + esc([o.title, o.author, o.year].filter(Boolean).join(' · ')) + '</p>' +
            (/^https?:\/\//i.test(o.link || '') ? '<p dir="ltr" style="text-align:left"><a href="' + esc(o.link) + '" target="_blank" rel="noopener">' + esc(o.link) + '</a></p>' : (o.link ? '<p dir="ltr" style="text-align:left">' + esc(o.link) + '</p>' : '')) +
            (o.summary ? '<p>' + esc(o.summary) + '</p>' : '') + '</div>');
        });
      } else if (v && String(v).trim()) parts.push('<div class="ans"><b>' + esc(f.label) + '</b><p>' + esc(v) + '</p></div>');
    });
    return parts.join('') || '<p class="small">עוד אין תוכן בתחנה הזו.</p>';
  }
  function renderStudentForTeacher(sid, r) {
    var html = '<div class="row sp" style="margin-top:8px"><button class="btn alt sm" id="back">לכל הכיתה</button><span class="small">קוד אישי: <span class="code">' + esc(r.pin) + '</span></span></div>';
    html += '<section class="card"><h2>' + esc(r.name) + '</h2>' +
      '<p class="small">דף הכנה לשיחה של 10 דקות, לפי מה שכתוב בעבודה. ההנחיה כוללת את העבודה ואת המחוון, בלי שם התלמיד.ה. התשובה ב-Gemini לעיניכם בלבד.</p><div style="margin-top:10px">' + aiButton('prepGo') + '</div></section>';
    STATIONS.forEach(function (def) {
      var s = r.stations[def.n] || { data: {}, status: 'draft', comment: '' };
      html += '<details class="st" data-st="' + def.n + '"' + (s.status === 'sent' ? ' open' : '') + '><summary><span>' + def.n + '. ' + esc(def.title) + '</span><span class="tag ' + s.status + '">' + statusLabel(s) + '</span></summary><div>' +
        answersHtml(def, s.data) +
        (s.data.aitake ? '<div class="ans"><b>מה לקח.ה מ' + esc(def.tool.name) + '</b><p>' + esc(s.data.aitake) + '</p></div>' : '') +
        '<label class="f" for="cm' + def.n + '">הערה לתלמיד.ה</label><textarea class="f" id="cm' + def.n + '" maxlength="4000">' + esc(s.comment) + '</textarea>' +
        '<div style="margin-top:10px"><b class="small">טיוטת משוב ב-Gemini</b><div style="margin-top:4px">' + aiButton('fb' + def.n, 'alt sm') + '</div><p class="small">את התשובה עורכים ומדביקים בהערה למעלה.</p></div>' +
        '<div class="row" style="margin-top:8px"><button class="btn sm" data-rev="' + def.n + '" data-s="ok">אישור</button><button class="btn alt sm" data-rev="' + def.n + '" data-s="fix">החזרה לתיקון</button></div><div class="msg" id="rv' + def.n + '"></div></div></details>';
    });
    app.innerHTML = html;
    $('back').onclick = function () { teacherHome(); };
    bindAi('prepGo', function () { return teacherPrompt(PREP_PROMPT, r.stations, T.rubric); }, 'ההנחיה הועתקה. הדביקו אותה ב-Gemini ושלחו.');
    STATIONS.forEach(function (def) {
      bindAi('fb' + def.n, function () { return teacherPrompt(FEEDBACK_PROMPT, r.stations, T.rubric, 'התחנה למשוב: ' + def.title); }, 'ההנחיה הועתקה. הדביקו אותה ב-Gemini, ערכו את התשובה והדביקו אותה בהערה.');
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-rev]'), function (b) {
      b.onclick = function () {
        var n = Number(b.getAttribute('data-rev')), status = b.getAttribute('data-s'), m = $('rv' + n);
        b.disabled = true; setMsg(m, 'שומרים…');
        call('teacher.review', { key: T.key, sid: sid, st: n, status: status, comment: $('cm' + n).value }).then(function (x) {
          b.disabled = false;
          if (!x.ok) { setMsg(m, errText(x.error), 'err'); return; }
          setMsg(m, status === 'ok' ? 'אושר.' : 'הוחזר לתיקון. ההערה תופיע אצל התלמיד.ה.', 'ok');
          var tag = app.querySelector('details[data-st="' + n + '"] > summary .tag');
          tag.className = 'tag ' + status; tag.textContent = STATUS[status];
        });
      };
    });
  }

  /* ===== כללי ===== */

  $('logout').onclick = function () {
    if (S) { flush(); }
    var leave = function () {
      st('heker_t', null); st('heker_s', null); st('heker_cur', null); st('heker_role', null);
      S = null; T = null; entry('');
      window.scrollTo(0, 0);
    };
    if (S) whenSaved().then(leave); else leave();
  };
  // סגירת הדף: שולחים מה שאפשר. הטיוטה נשארת במכשיר עד שהשרת מאשר, ונשלחת שוב בכניסה הבאה.
  window.addEventListener('pagehide', function () {
    if (!S || !navigator.sendBeacon) return;
    if (S.dirty) { S.dirty = false; enqueue(S.cur); }
    Object.keys(queue).forEach(function (n) {
      var me = S.me, job = queue[n];
      try { navigator.sendBeacon(API, JSON.stringify({ action: 'student.save', code: me.code, sid: me.sid, pin: me.pin, st: Number(n), data: job.data, submit: !!job.submit })); } catch (e) {}
    });
  });
  var helpBody = 'שלום,\n\nנתקלתי בבעיה במלווה עבודת החקר.\nתיאור הבעיה:\n\n';
  $('help').href = 'mailto:' + HELP_TO + '?subject=' + encodeURIComponent('מלווה עבודת חקר: נתקלתי בבעיה') + '&body=' + encodeURIComponent(helpBody);

  if (!API) { app.innerHTML = '<div class="card">הכלי בהקמה ויהיה זמין בקרוב.</div>'; return; }
  route();
})();
</script>
</body>
</html>
