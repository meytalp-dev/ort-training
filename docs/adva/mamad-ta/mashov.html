<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>תוצאות המשוב</title>
<!--
  תוצאות המשוב האנונימי (mashov-0N.html) — למנחה בלבד.
  כניסה: מפתח המנחה שנשמר במכשיר מדף ההשתלמות (adva_mamad_k), או ?k=<ADMIN_KEY>.
  נתונים: GET ?action=admin בשרת adva-mamad-gas (אותה קריאה של מבט המנחה), בלי שינוי שרת.
  מפגש חדש: להוסיף רשומה ל-MASHOV עם מזהי השאלות של mashov-0N.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1f2a37; --muted: #5b6676; --line: #e5e8ee; --soft: #f7f8fb; --bg: #fcfbfa; --card: #fff;
  --cyan: #3cc6e0; --pink: #e8619f; --peach: #f5a985; --deep: #234a63; --ok: #1f8a5b; --warn: #b4531f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ink: #eef1f5; --muted: #a7b0bd; --line: #2c3540; --soft: #1c232c; --bg: #131820; --card: #1a2029; --deep: #9fd6e8; --ok: #5fcf9a; --warn: #f0a070; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Heebo', Arial, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.6; font-size: 16px; }
.bar { height: 6px; background: linear-gradient(90deg, var(--peach), var(--pink), var(--cyan)); }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
header.top { padding: 22px 0 6px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.sname { font-weight: 800; font-size: 1.05rem; line-height: 1.3; }
.ssub { color: var(--muted); font-size: .88rem; }
.back { color: var(--deep); font-weight: 700; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; min-height: 44px; }
h1 { font-family: 'Rubik', 'Heebo', sans-serif; font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.15; margin-top: 14px; }
h1 em { font-style: normal; background: linear-gradient(90deg, var(--pink), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip { min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
.chip.on { border-color: var(--pink); background: color-mix(in srgb, var(--pink) 12%, var(--card)); color: var(--ink); }
.stitle { margin-top: 18px; font-size: 1.15rem; font-weight: 800; line-height: 1.4; }
.sdate { color: var(--muted); font-size: .92rem; }
.count { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 14px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.count .n { font-family: 'Rubik', 'Heebo', sans-serif; font-size: 2.6rem; font-weight: 800; line-height: 1; color: var(--deep); }
.count .t { color: var(--muted); }
.count .t b { color: var(--ink); display: block; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-top: 14px; }
.card h2 { font-size: 1.04rem; line-height: 1.4; }
.card .hint { color: var(--muted); font-size: .86rem; }
.rate { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
.avg { text-align: center; flex: none; width: 84px; }
.avg .v { font-family: 'Rubik', 'Heebo', sans-serif; font-size: 2.2rem; font-weight: 800; line-height: 1; background: linear-gradient(135deg, var(--pink), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.avg .of { color: var(--muted); font-size: .82rem; }
.dist { flex: 1; min-width: 0; display: grid; gap: 5px; }
.drow { display: grid; grid-template-columns: 18px 1fr 28px; align-items: center; gap: 8px; font-size: .88rem; }
.drow .lb { font-weight: 700; text-align: center; }
.drow .cn { color: var(--muted); text-align: start; }
.track { height: 12px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); overflow: hidden; }
.fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--pink), var(--cyan)); }
.chrow { margin-top: 12px; }
.chrow .top { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-size: .95rem; }
.chrow .top span { color: var(--muted); font-weight: 500; flex: none; }
.chrow .track { height: 14px; margin-top: 4px; }
.txts { list-style: none; display: grid; gap: 8px; margin-top: 12px; }
.txts li { padding: 10px 14px; border-radius: 12px; background: var(--soft); border-inline-start: 4px solid var(--cyan); white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: .92rem; margin-top: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 10px 26px; border: 0; border-radius: 12px;
  font: inherit; font-weight: 700; color: #fff; background: linear-gradient(90deg, var(--pink), var(--cyan)); cursor: pointer; margin-top: 18px; }
.msg { margin-top: 10px; font-weight: 600; min-height: 1.6em; }
.msg.ok { color: var(--ok); } .msg.err { color: var(--warn); }
.gate { margin-top: 24px; padding: 24px 18px; text-align: center; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.gate svg.i { width: 40px; height: 40px; color: var(--muted); }
.gate p { color: var(--muted); margin-top: 6px; }
[hidden] { display: none !important; }
footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 40px 16px 34px; }
footer img { height: 54px; display: block; margin: 0 auto 6px; }
footer a { color: var(--deep); }
@media (max-width: 600px) {
  .rate { flex-direction: column; align-items: stretch; gap: 10px; }
  .avg { width: auto; display: flex; align-items: baseline; gap: 8px; text-align: start; }
  .btn { width: 100%; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
</svg>

<div class="bar"></div>
<div class="wrap">
  <header class="top">
    <div>
      <div class="sname">ממ"ד לטכנולוגיה ואומנות תל אביב</div>
      <div class="ssub">הטמעה ושינוי בעידן ה-AI · למנחה בלבד</div>
    </div>
    <a class="back" href="./"><svg class="i"><use href="#i-back"/></svg>לדף ההשתלמות</a>
  </header>

  <h1>תוצאות <em>המשוב</em></h1>

  <div class="gate" id="gate" hidden>
    <svg class="i"><use href="#i-lock"/></svg>
    <p><b>הדף למנחה בלבד.</b></p>
    <p id="gateTx">פתחו את דף ההשתלמות עם קישור המנחה, ואז חזרו לכאן.</p>
  </div>

  <div id="main" hidden>
    <div class="chips" id="chips"></div>
    <div id="view"></div>
    <button class="btn" type="button" id="copy"><svg class="i"><use href="#i-copy"/></svg>העתקת המשוב כולו</button>
    <div class="msg" id="msg" role="status"></div>
  </div>
  <p class="msg" id="load">טוען…</p>
</div>

<footer>
  <img src="learni-logo.png" alt="לרני">
  <div>השתלמות צוות: הטמעה ושינוי בעידן ה-AI · לרני</div>
  <div>נבנה על ידי <a href="https://impactos.co.il/" target="_blank" rel="noopener">impactos</a></div>
</footer>

<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbysvE4HwBtieGy5d99tZvPCwfg-VQvTD0hkQl6Tv4ZbNFkcLdbR6o-womnNupNhl3mj/exec'; // adva-mamad-gas

  // לכל מפגש עם משוב: מזהי השאלות כמו ב-mashov-0N.html
  var MASHOV = [
    { s: 1, date: 'יום ראשון, 8.11.26', title: 'מבוא לבינה מלאכותית יוצרת בהוראה',
      rates: [
        { id: 's1-mashov-dirug', label: 'איך היה המפגש?', lo: 'לא טוב', hi: 'מצוין' },
        { id: 's1-mashov-barur', label: 'האם המפגש היה ברור?', lo: 'לא ברור', hi: 'ברור מאוד' },
        { id: 's1-mashov-sakran', label: 'האם המפגש סקרן או עודד יצירתיות?', lo: 'בכלל לא', hi: 'מאוד' }
      ],
      choice: { id: 's1-mashov-chidush', label: 'האם המפגש חידש לך?',
        opts: ['כן, הרבה היה חדש לי', 'חלק היה חדש לי', 'לא, רוב הדברים כבר היו מוכרים לי'] },
      texts: [
        { id: 's1-mashov-lilmod', label: 'כלים או דברים שהייתי רוצה ללמוד' },
        { id: 's1-mashov-baksha', label: 'שאלה או בקשה למפגש הבא' }
      ] }
  ];

  function st(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }

  var P = new URLSearchParams(location.search);
  if (P.get('k')) { st('adva_mamad_k', P.get('k')); history.replaceState(null, '', location.pathname); }
  var KEY = st('adva_mamad_k') || '';
  var ANS = [], CUR = MASHOV[MASHOV.length - 1].s;

  function gate(t) { $('load').hidden = true; $('gate').hidden = false; if (t) $('gateTx').textContent = t; }
  if (!/^adm-/.test(KEY)) { gate(); return; }

  fetch(API + '?action=admin&k=' + encodeURIComponent(KEY), { credentials: 'omit' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) { gate(d.error === 'key' ? 'מפתח המנחה שבמכשיר הזה לא תקין. פתחו את דף ההשתלמות עם קישור המנחה המעודכן.' : ''); return; }
      ANS = d.answers || [];
      $('load').hidden = true; $('main').hidden = false;
      draw();
    })
    .catch(function () { $('load').className = 'msg err'; $('load').textContent = 'הטעינה לא הצליחה. בדקו את החיבור ורעננו את הדף.'; });

  function of(id) {
    return ANS.filter(function (a) { return a.q === id; })
      .map(function (a) { return String(a.text).trim(); })
      .filter(function (t) { return t && t !== '(נמחק)'; });
  }
  function pct(n, tot) { return tot ? Math.round(n / tot * 100) : 0; }

  function draw() {
    $('chips').innerHTML = MASHOV.map(function (m) {
      return '<button type="button" class="chip' + (m.s === CUR ? ' on' : '') + '" data-s="' + m.s + '" aria-pressed="' + (m.s === CUR) + '">מפגש ' + m.s + '</button>';
    }).join('');
    var m = MASHOV.filter(function (x) { return x.s === CUR; })[0];
    var n = of(m.rates[0].id).length;
    var h = '<div class="stitle">מפגש ' + m.s + ' · ' + esc(m.title) + '</div><div class="sdate">' + esc(m.date) + '</div>' +
      '<div class="count"><div class="n">' + n + '</div><div class="t"><b>' + (n === 1 ? 'משוב אחד' : 'מילאו את המשוב') + '</b>המשוב אנונימי, אז אין רשימת שמות.</div></div>';

    m.rates.forEach(function (r) {
      var v = of(r.id).map(Number).filter(function (x) { return x >= 1 && x <= 5; });
      var avg = v.length ? (v.reduce(function (a, b) { return a + b; }, 0) / v.length).toFixed(1) : '–';
      var rows = '';
      for (var i = 5; i >= 1; i--) {
        var c = v.filter(function (x) { return x === i; }).length;
        rows += '<div class="drow"><span class="lb">' + i + '</span><div class="track"><div class="fill" style="width:' + pct(c, v.length) + '%"></div></div><span class="cn">' + c + '</span></div>';
      }
      h += '<section class="card"><h2>' + esc(r.label) + '</h2><div class="hint">1 = ' + esc(r.lo) + ' · 5 = ' + esc(r.hi) + '</div>' +
        '<div class="rate"><div class="avg"><div class="v">' + avg + '</div><div class="of">ממוצע מתוך 5</div></div><div class="dist">' + rows + '</div></div></section>';
    });

    var ch = of(m.choice.id);
    h += '<section class="card"><h2>' + esc(m.choice.label) + '</h2>';
    m.choice.opts.forEach(function (o) {
      var c = ch.filter(function (x) { return x === o; }).length;
      h += '<div class="chrow"><div class="top">' + esc(o) + '<span>' + c + ' · ' + pct(c, ch.length) + '%</span></div><div class="track"><div class="fill" style="width:' + pct(c, ch.length) + '%"></div></div></div>';
    });
    h += '</section>';

    m.texts.forEach(function (t) {
      var list = of(t.id);
      h += '<section class="card"><h2>' + esc(t.label) + ' (' + list.length + ')</h2>' +
        (list.length ? '<ul class="txts">' + list.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '<p class="empty">עוד אין תשובות.</p>') + '</section>';
    });
    $('view').innerHTML = h;
  }

  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    CUR = +b.getAttribute('data-s'); $('msg').textContent = ''; draw();
  });

  function asText() {
    var m = MASHOV.filter(function (x) { return x.s === CUR; })[0], L = [];
    L.push('משוב · מפגש ' + m.s + ' · ' + m.title + ' (' + m.date + ')');
    L.push('מילאו: ' + of(m.rates[0].id).length);
    m.rates.forEach(function (r) {
      var v = of(r.id).map(Number).filter(function (x) { return x >= 1 && x <= 5; });
      var avg = v.length ? (v.reduce(function (a, b) { return a + b; }, 0) / v.length).toFixed(1) : '–';
      var d = []; for (var i = 5; i >= 1; i--) d.push(i + ': ' + v.filter(function (x) { return x === i; }).length);
      L.push('', r.label, 'ממוצע ' + avg + ' מתוך 5 (' + d.join(' · ') + ')');
    });
    var ch = of(m.choice.id);
    L.push('', m.choice.label);
    m.choice.opts.forEach(function (o) { L.push('- ' + o + ': ' + ch.filter(function (x) { return x === o; }).length); });
    m.texts.forEach(function (t) {
      var list = of(t.id);
      L.push('', t.label + ' (' + list.length + ')');
      list.forEach(function (x) { L.push('- ' + x); });
    });
    return L.join('\n');
  }

  $('copy').addEventListener('click', function () {
    var t = asText(), msg = $('msg');
    function ok() { msg.className = 'msg ok'; msg.textContent = 'הועתק. אפשר להדביק במייל או במסמך.'; }
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? ok() : fail(); } catch (e) { fail(); }
      document.body.removeChild(ta);
    }
    function fail() { msg.className = 'msg err'; msg.textContent = 'ההעתקה לא הצליחה. נסו שוב.'; }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, fallback); else fallback();
  });
})();
</script>
</body>
</html>
