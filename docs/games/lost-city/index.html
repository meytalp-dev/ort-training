<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>העיר האבודה — The Lost City</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <!-- SPLASH SCREEN -->
    <div id="screen-splash" class="screen active">
        <div class="splash-bg">
            <!-- Moon/Orb -->
            <div class="moon">
                <div class="moon-core"></div>
                <div class="moon-glow"></div>
            </div>

            <!-- 3-layer parallax city -->
            <svg class="city-layer city-far" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice">
                <rect x="50" y="120" width="40" height="180" rx="2" fill="#0d1220"/>
                <rect x="100" y="80" width="55" height="220" rx="2" fill="#0c1020"/>
                <rect x="170" y="140" width="35" height="160" rx="2" fill="#0d1220"/>
                <rect x="220" y="60" width="45" height="240" rx="2" fill="#0b0f1e"/>
                <rect x="280" y="100" width="60" height="200" rx="2" fill="#0d1220"/>
                <rect x="360" y="130" width="40" height="170" rx="2" fill="#0c1020"/>
                <rect x="420" y="70" width="50" height="230" rx="2" fill="#0b0f1e"/>
                <rect x="490" y="110" width="45" height="190" rx="2" fill="#0d1220"/>
                <rect x="550" y="90" width="55" height="210" rx="2" fill="#0c1020"/>
                <rect x="620" y="150" width="35" height="150" rx="2" fill="#0d1220"/>
                <rect x="670" y="65" width="50" height="235" rx="2" fill="#0b0f1e"/>
                <rect x="740" y="120" width="40" height="180" rx="2" fill="#0d1220"/>
                <rect x="800" y="85" width="60" height="215" rx="2" fill="#0c1020"/>
                <rect x="880" y="140" width="45" height="160" rx="2" fill="#0d1220"/>
                <rect x="940" y="100" width="50" height="200" rx="2" fill="#0b0f1e"/>
                <rect x="1010" y="75" width="40" height="225" rx="2" fill="#0d1220"/>
                <rect x="1070" y="130" width="55" height="170" rx="2" fill="#0c1020"/>
                <rect x="1140" y="95" width="45" height="205" rx="2" fill="#0d1220"/>
            </svg>

            <svg class="city-layer city-mid" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice">
                <rect x="30" y="130" width="50" height="170" rx="2" fill="#111830"/>
                <rect x="90" y="80" width="65" height="220" rx="2" fill="#131a35"/>
                <rect x="170" y="110" width="45" height="190" rx="2" fill="#111830"/>
                <rect x="230" y="60" width="70" height="240" rx="2" fill="#151c38"/>
                <rect x="230" y="60" width="70" height="8" rx="1" fill="#1a2245"/>
                <rect x="320" y="100" width="55" height="200" rx="2" fill="#131a35"/>
                <rect x="395" y="75" width="60" height="225" rx="2" fill="#111830"/>
                <rect x="395" y="75" width="60" height="8" rx="1" fill="#1a2245"/>
                <rect x="475" y="140" width="40" height="160" rx="2" fill="#151c38"/>
                <rect x="530" y="90" width="70" height="210" rx="2" fill="#131a35"/>
                <rect x="620" y="120" width="50" height="180" rx="2" fill="#111830"/>
                <rect x="690" y="55" width="65" height="245" rx="2" fill="#151c38"/>
                <rect x="690" y="55" width="65" height="8" rx="1" fill="#1a2245"/>
                <rect x="775" y="100" width="55" height="200" rx="2" fill="#131a35"/>
                <rect x="850" y="130" width="45" height="170" rx="2" fill="#111830"/>
                <rect x="910" y="70" width="60" height="230" rx="2" fill="#151c38"/>
                <rect x="990" y="110" width="50" height="190" rx="2" fill="#131a35"/>
                <rect x="1060" y="85" width="65" height="215" rx="2" fill="#111830"/>
                <rect x="1140" y="120" width="50" height="180" rx="2" fill="#151c38"/>
                <!-- Windows -->
                <rect x="103" y="100" width="6" height="8" rx="1" fill="#1a3050" opacity="0.6"/>
                <rect x="120" y="100" width="6" height="8" rx="1" fill="#1a3050" opacity="0.4"/>
                <rect x="103" y="120" width="6" height="8" rx="1" fill="#1a3050" opacity="0.5"/>
                <rect x="243" y="80" width="6" height="8" rx="1" fill="#1a3050" opacity="0.6"/>
                <rect x="260" y="80" width="6" height="8" rx="1" fill="#1a3050" opacity="0.4"/>
                <rect x="243" y="100" width="6" height="8" rx="1" fill="#1a3050" opacity="0.3"/>
                <rect x="700" y="75" width="6" height="8" rx="1" fill="#1a3050" opacity="0.5"/>
                <rect x="720" y="75" width="6" height="8" rx="1" fill="#1a3050" opacity="0.6"/>
                <rect x="700" y="95" width="6" height="8" rx="1" fill="#1a3050" opacity="0.4"/>
            </svg>

            <svg class="city-layer city-near" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice">
                <rect x="0" y="150" width="80" height="150" rx="2" fill="#181f38"/>
                <rect x="95" y="90" width="75" height="210" rx="2" fill="#1a2240"/>
                <rect x="95" y="90" width="75" height="10" rx="1" fill="#222a4a"/>
                <rect x="185" y="120" width="60" height="180" rx="2" fill="#181f38"/>
                <rect x="260" y="70" width="85" height="230" rx="2" fill="#1c2445"/>
                <rect x="260" y="70" width="85" height="10" rx="1" fill="#252d50"/>
                <rect x="365" y="110" width="65" height="190" rx="2" fill="#1a2240"/>
                <rect x="450" y="80" width="80" height="220" rx="2" fill="#181f38"/>
                <rect x="450" y="80" width="80" height="10" rx="1" fill="#222a4a"/>
                <rect x="550" y="140" width="55" height="160" rx="2" fill="#1c2445"/>
                <rect x="620" y="65" width="75" height="235" rx="2" fill="#1a2240"/>
                <rect x="620" y="65" width="75" height="10" rx="1" fill="#252d50"/>
                <rect x="715" y="100" width="65" height="200" rx="2" fill="#181f38"/>
                <rect x="800" y="130" width="70" height="170" rx="2" fill="#1c2445"/>
                <rect x="885" y="75" width="80" height="225" rx="2" fill="#1a2240"/>
                <rect x="885" y="75" width="80" height="10" rx="1" fill="#222a4a"/>
                <rect x="985" y="110" width="60" height="190" rx="2" fill="#181f38"/>
                <rect x="1060" y="90" width="75" height="210" rx="2" fill="#1c2445"/>
                <rect x="1150" y="130" width="60" height="170" rx="2" fill="#1a2240"/>
                <!-- Lit windows -->
                <rect x="110" y="110" width="8" height="10" rx="1" fill="#00e5ff" opacity="0.15"/>
                <rect x="130" y="110" width="8" height="10" rx="1" fill="#a07de0" opacity="0.1"/>
                <rect x="110" y="135" width="8" height="10" rx="1" fill="#00e5ff" opacity="0.1"/>
                <rect x="150" y="135" width="8" height="10" rx="1" fill="#e06090" opacity="0.08"/>
                <rect x="275" y="90" width="8" height="10" rx="1" fill="#00e5ff" opacity="0.15"/>
                <rect x="300" y="90" width="8" height="10" rx="1" fill="#a07de0" opacity="0.12"/>
                <rect x="275" y="115" width="8" height="10" rx="1" fill="#00e5ff" opacity="0.1"/>
                <rect x="325" y="115" width="8" height="10" rx="1" fill="#e06090" opacity="0.08"/>
                <rect x="465" y="100" width="8" height="10" rx="1" fill="#a07de0" opacity="0.12"/>
                <rect x="490" y="100" width="8" height="10" rx="1" fill="#00e5ff" opacity="0.15"/>
                <rect x="465" y="125" width="8" height="10" rx="1" fill="#00e5ff" opacity="0.08"/>
                <rect x="510" y="125" width="8" height="10" rx="1" fill="#e06090" opacity="0.1"/>
                <rect x="635" y="85" width="8" height="10" rx="1" fill="#00e5ff" opacity="0.12"/>
                <rect x="660" y="85" width="8" height="10" rx="1" fill="#a07de0" opacity="0.1"/>
                <rect x="635" y="110" width="8" height="10" rx="1" fill="#e06090" opacity="0.08"/>
                <rect x="675" y="110" width="8" height="10" rx="1" fill="#00e5ff" opacity="0.15"/>
                <rect x="900" y="95" width="8" height="10" rx="1" fill="#a07de0" opacity="0.12"/>
                <rect x="925" y="95" width="8" height="10" rx="1" fill="#00e5ff" opacity="0.1"/>
                <rect x="945" y="120" width="8" height="10" rx="1" fill="#e06090" opacity="0.08"/>
            </svg>

            <!-- Particles container -->
            <div class="particles" id="splash-particles"></div>

            <!-- Fog layers -->
            <div class="fog fog-1"></div>
            <div class="fog fog-2"></div>
        </div>

        <div class="splash-content">
            <h1 class="glitch-title" data-text="העיר האבודה">העיר האבודה</h1>
            <p class="splash-subtitle">THE LOST CITY</p>
            <p class="splash-tagline">עיר ששכחו. אנשים שנמצאו. עכשיו תורך.</p>
            <div class="splash-buttons">
                <button class="btn-primary btn-glow" id="btn-start">התחל מסע</button>
                <button class="btn-secondary" id="btn-continue" style="display:none;">המשך מסע</button>
            </div>
        </div>

        <!-- Audio mute toggle -->
        <button class="audio-toggle" id="audio-toggle" aria-label="השתק/הפעל צלילים">
            <svg class="icon-sound-on" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.08"/>
            </svg>
            <svg class="icon-sound-off" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <line x1="23" y1="9" x2="17" y2="15"/>
                <line x1="17" y1="9" x2="23" y2="15"/>
            </svg>
        </button>
    </div>

    <!-- NAME INPUT SCREEN -->
    <div id="screen-name" class="screen">
        <div class="name-bg">
            <div class="name-orb"></div>
            <div class="particles" id="name-particles"></div>
        </div>
        <div class="name-content">
            <h2 class="name-heading">איך קוראים לך?</h2>
            <div class="name-form">
                <input type="text" id="input-name" class="game-input" placeholder="השם שלך..." maxlength="20" autocomplete="off">
                <select id="select-class" class="game-select">
                    <option value="" disabled selected>בחר כיתה</option>
                    <option value="ט">כיתה ט׳</option>
                    <option value="י">כיתה י׳</option>
                    <option value="יא">כיתה י״א</option>
                    <option value="יב">כיתה י״ב</option>
                </select>
                <button class="btn-primary" id="btn-enter" disabled>נכנס</button>
            </div>
        </div>
    </div>

    <!-- INTRO CINEMATIC SCREEN -->
    <div id="screen-intro" class="screen">
        <div class="intro-bg" id="intro-bg">
            <!-- Scene SVG backgrounds inserted dynamically -->
        </div>
        <div class="intro-content">
            <p class="intro-text" id="intro-text"></p>
        </div>
        <div class="intro-controls">
            <div class="intro-dots" id="intro-dots"></div>
            <button class="btn-primary" id="btn-intro-next">המשך</button>
            <button class="btn-skip" id="btn-intro-skip">דלג</button>
        </div>
    </div>

    <!-- EXPLORATION SCREEN -->
    <div id="screen-exploration" class="screen">
        <div class="hud-bar">
            <div class="hud-right">
                <div class="hud-avatar" id="hud-avatar"></div>
                <span class="hud-name" id="hud-name"></span>
            </div>
            <div class="hud-left">
                <div class="hud-shards">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <polygon points="12,2 15,9 22,9 16,14 18,22 12,17 6,22 8,14 2,9 9,9" fill="#00e5ff" opacity="0.8"/>
                    </svg>
                    <span id="hud-shard-count">0</span>
                </div>
                <button class="btn-garden-hud" id="btn-garden-hud" aria-label="גן שקט">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a92a8" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6c-3 3-3 6 0 6s3 3 0 6"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="exploration-content">
            <div class="quarter-header">
                <h2 class="quarter-title">רובע השקט</h2>
                <p class="quarter-subtitle">הרחובות ריקים. אבל מישהו מחכה.</p>
            </div>

            <div class="npc-grid" id="npc-grid">
                <!-- NPC cards rendered by JS -->
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-btn active" id="nav-map">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="1,6 1,22 8,18 16,22 23,18 23,2 16,6 8,2"/>
                </svg>
                <span>מפה</span>
            </button>
            <button class="nav-btn disabled" id="nav-journal" disabled>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                <span>בקרוב</span>
            </button>
            <button class="nav-btn disabled" id="nav-me" disabled>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>בקרוב</span>
            </button>
        </nav>
    </div>

    <!-- DIALOGUE SCREEN -->
    <div id="screen-dialogue" class="screen">
        <div class="dlg-bg"></div>

        <!-- Back button -->
        <button class="dlg-back-btn" id="dlg-back" aria-label="חזרה">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
            </svg>
        </button>

        <!-- NPC Header -->
        <div class="dlg-header">
            <div class="dlg-portrait" id="dlg-portrait"></div>
            <div class="dlg-header-info">
                <h3 class="dlg-npc-name" id="dlg-npc-name"></h3>
                <div class="dlg-trust-meter" id="dlg-trust-meter">
                    <div class="dlg-trust-track">
                        <div class="dlg-trust-fill" id="dlg-trust-fill"></div>
                    </div>
                    <span class="dlg-trust-value" id="dlg-trust-value">50</span>
                </div>
            </div>
        </div>

        <!-- Chat area -->
        <div class="dlg-chat-area" id="dlg-chat"></div>

        <!-- Silence timer bar -->
        <div class="dlg-silence-container" id="dlg-silence-container" style="display:none;">
            <div class="dlg-silence-bar" id="dlg-silence-bar"></div>
        </div>

        <!-- Choice panel -->
        <div class="dlg-choice-panel" id="dlg-choices"></div>

        <!-- Remember toast -->
        <div class="dlg-toast" id="dlg-toast">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b388ff" stroke-width="2">
                <path d="M12 2L15 9H22L16 14L18 22L12 17L6 22L8 14L2 9H9Z"/>
            </svg>
            <span>...תזכור את זה</span>
        </div>
    </div>

    <!-- QUIET GARDEN SCREEN -->
    <div id="screen-garden" class="screen">
        <div class="garden-bg">
            <div class="particles garden-particles" id="garden-particles"></div>
        </div>
        <div class="garden-content">
            <div class="breathing-circle">
                <div class="breathing-ring"></div>
                <div class="breathing-core"></div>
            </div>
            <div class="breathing-guide" id="breathing-guide">שאף פנימה...</div>
        </div>
        <button class="btn-garden-back" id="btn-garden-back">חזרה למשחק</button>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/screens.js"></script>
    <script src="js/dialogue-data.js"></script>
    <script src="js/dialogue.js"></script>
</body>
</html>
