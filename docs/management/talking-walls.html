<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>קירות מדברים — אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Dream Theme — לחלום.ליצור.להוביל */
  --dream:#8E7ED4;--dream-light:#D4CEF0;--dream-dark:#5B4BA0;
  --create:#E8B060;--create-light:#F5DEB0;--create-dark:#D48A2C;
  --lead:#3AACA0;--lead-light:#B8E4DE;--lead-dark:#1B7A6E;
  --spark:#E8909C;--spark-dark:#D45C6E;
  --bg:#fff;--bg-alt:#FAFBFC;--card:#fff;
  --text:#2C2622;--text-light:#6E6258;--text-lighter:#8C7E72;--muted:#6E6258;
  --border:#EDE6D8;--border-light:#F5F0E8;
  --primary:#3AACA0;--primary-dark:#1B7A6E;--primary-light:#B8E4DE;
  --accent:#E8B060;--accent-dark:#D48A2C;
  --success:#4CAF50;--success-bg:#E8F5E9;--warn:#E8B060;--warn-bg:#FFF3E0;
  --danger:#D45C6E;--danger-bg:#FCE7EA;--info:#5B9BD5;--info-bg:#E6F0FA;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 8px rgba(44,38,34,.05);--shadow-sm:0 2px 8px rgba(44,38,34,.05);
  --shadow-md:0 6px 20px rgba(44,38,34,.08);--shadow-lg:0 12px 40px rgba(44,38,34,.1);
  --dim-belong:#E06090;--dim-respect:#5B9BD5;--dim-motiv:#E8A838;--dim-capable:#8B6BC0;--dim-auto:#7AB648;
}
body{font-family:Heebo,sans-serif;background:#fff;color:var(--text);min-height:100vh;line-height:1.6}
h1,h2,h3,h4,h5,h6,.card-title,.section-title,.header-title{font-family:'Playpen Sans Hebrew','Heebo',sans-serif;font-weight:700}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.04) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.04) 0%,transparent 70%),
    radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.03) 0%,transparent 70%);
  pointer-events:none;z-index:0}

/* Header */
.header{
  background:var(--card);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  box-shadow:0 2px 12px rgba(74,63,53,.06);position:sticky;top:0;z-index:50;
}
.header::before{content:'';position:absolute;bottom:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--dim-belong),var(--dim-respect),var(--dim-motiv),var(--dim-capable),var(--dim-auto))}
.header h1{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:10px}
.header .back-link{color:var(--muted);text-decoration:none;font-size:.82rem;font-weight:500;display:flex;align-items:center;gap:4px;transition:color .2s}
.header .back-link:hover{color:var(--primary-dark)}

/* Controls */
.controls{max-width:1300px;margin:24px auto 0;padding:0 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filter-btn{
  padding:8px 18px;border-radius:24px;border:1.5px solid var(--border);background:var(--card);
  font-family:Heebo;font-size:.82rem;font-weight:600;color:var(--text);cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:6px;
}
.filter-btn:hover{border-color:var(--primary);color:var(--primary-dark)}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-btn[data-dim="belong"].active{background:var(--dim-belong);border-color:var(--dim-belong)}
.filter-btn[data-dim="respect"].active{background:var(--dim-respect);border-color:var(--dim-respect)}
.filter-btn[data-dim="motiv"].active{background:var(--dim-motiv);border-color:var(--dim-motiv)}
.filter-btn[data-dim="capable"].active{background:var(--dim-capable);border-color:var(--dim-capable)}
.filter-btn[data-dim="auto"].active{background:var(--dim-auto);border-color:var(--dim-auto)}
.download-all{
  margin-right:auto;padding:8px 20px;border-radius:12px;border:none;
  background:var(--primary);color:#fff;font-family:Heebo;font-size:.82rem;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .2s;
}
.download-all:hover{background:var(--primary-dark)}

/* Grid */
.poster-grid{
  max-width:1300px;margin:24px auto;padding:0 24px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;
}

/* Poster Card */
.poster-wrap{position:relative;border-radius:18px;overflow:hidden;transition:transform .25s,box-shadow .25s}
.poster-wrap:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.15)}
.poster{
  width:100%;aspect-ratio:1/1;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 36px;overflow:hidden;
}

/* Poster Text */
.poster-text{
  position:relative;z-index:5;text-align:center;max-width:88%;
}
.poster-text .quote{
  font-family:'Secular One',Heebo,sans-serif;font-size:1.55rem;line-height:1.85;color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.15);
}
.poster-text .dim-label{
  display:inline-block;margin-top:14px;padding:5px 16px;border-radius:20px;
  background:rgba(255,255,255,.2);backdrop-filter:blur(8px);
  font-size:.72rem;font-weight:700;color:#fff;letter-spacing:.5px;
}

/* Poster Overlay Actions */
.poster-overlay{
  position:absolute;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;
  background:linear-gradient(transparent 50%,rgba(0,0,0,.4));
  opacity:0;transition:opacity .25s;padding-bottom:18px;gap:10px;
}
.poster-wrap:hover .poster-overlay{opacity:1}
.poster-btn{
  padding:8px 18px;border-radius:12px;border:none;font-family:Heebo;font-size:.78rem;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .2s;
}
.poster-btn-dl{background:rgba(255,255,255,.92);color:var(--text)}
.poster-btn-dl:hover{background:#fff}

/* Location badge */
.poster-loc-badge{
  position:absolute;top:14px;left:14px;z-index:6;
  padding:4px 12px;border-radius:16px;background:rgba(0,0,0,.25);backdrop-filter:blur(6px);
  font-size:.68rem;font-weight:600;color:rgba(255,255,255,.9);display:flex;align-items:center;gap:4px;
}

/* ===== POSTER DESIGNS — Each with unique visual identity ===== */

/* --- BELONG (Pink/Rose) --- */
.poster-belong-1{background:linear-gradient(135deg,#E06090,#C8507A,#A0406A)}
.poster-belong-2{background:linear-gradient(160deg,#D4547E,#E88AAC,#C8507A)}
.poster-belong-3{background:linear-gradient(145deg,#B84872,#E06090,#F0A0B8)}
.poster-belong-4{background:linear-gradient(130deg,#C05080,#E87098,#D05878)}
.poster-belong-5{background:linear-gradient(155deg,#E06090,#D06888,#A84870)}
.poster-belong-6{background:linear-gradient(140deg,#C85880,#E890B0,#D06888)}
.poster-belong-7{background:linear-gradient(150deg,#D05878,#E06090,#B04868)}
.poster-belong-8{background:linear-gradient(135deg,#C04870,#E06898,#D87898)}

/* --- RESPECT (Blue) --- */
.poster-respect-1{background:linear-gradient(135deg,#5B9BD5,#4080C0,#3068A0)}
.poster-respect-2{background:linear-gradient(160deg,#4888C0,#6AAAE0,#3878B0)}
.poster-respect-3{background:linear-gradient(145deg,#3870A8,#5B9BD5,#78B8E8)}
.poster-respect-4{background:linear-gradient(130deg,#4080B8,#68A8D8,#5090C0)}
.poster-respect-5{background:linear-gradient(155deg,#5B9BD5,#4888C0,#3068A0)}
.poster-respect-6{background:linear-gradient(140deg,#5090C0,#78B8E8,#4888C0)}
.poster-respect-7{background:linear-gradient(150deg,#4080B8,#5B9BD5,#3870A8)}
.poster-respect-8{background:linear-gradient(135deg,#3878B0,#5898D0,#6AAAE0)}

/* --- MOTIV (Gold/Orange) --- */
.poster-motiv-1{background:linear-gradient(135deg,#E8A838,#D08820,#B87018)}
.poster-motiv-2{background:linear-gradient(160deg,#D89828,#F0C060,#C88820)}
.poster-motiv-3{background:linear-gradient(145deg,#C08020,#E8A838,#F0C868)}
.poster-motiv-4{background:linear-gradient(130deg,#D09028,#E8B848,#C88820)}
.poster-motiv-5{background:linear-gradient(155deg,#E8A838,#D09830,#B87820)}
.poster-motiv-6{background:linear-gradient(140deg,#C88820,#F0C060,#D89828)}
.poster-motiv-7{background:linear-gradient(150deg,#D08820,#E8A838,#C08020)}
.poster-motiv-8{background:linear-gradient(135deg,#B87820,#D8A038,#F0B850)}

/* --- CAPABLE (Purple) --- */
.poster-capable-1{background:linear-gradient(135deg,#8B6BC0,#7050A0,#583888)}
.poster-capable-2{background:linear-gradient(160deg,#7858A8,#A088D0,#6848A0)}
.poster-capable-3{background:linear-gradient(145deg,#604090,#8B6BC0,#A890D8)}
.poster-capable-4{background:linear-gradient(130deg,#7050A0,#9078C0,#8060B0)}
.poster-capable-5{background:linear-gradient(155deg,#8B6BC0,#7858A8,#583888)}
.poster-capable-6{background:linear-gradient(140deg,#8060B0,#A890D8,#7858A8)}
.poster-capable-7{background:linear-gradient(150deg,#7050A0,#8B6BC0,#604090)}
.poster-capable-8{background:linear-gradient(135deg,#6848A0,#8868B8,#A088D0)}

/* --- AUTO (Green) --- */
.poster-auto-1{background:linear-gradient(135deg,#7AB648,#5C9830,#488020)}
.poster-auto-2{background:linear-gradient(160deg,#6AA038,#90D060,#5C9030)}
.poster-auto-3{background:linear-gradient(145deg,#508828,#7AB648,#98D070)}
.poster-auto-4{background:linear-gradient(130deg,#5C9030,#80C050,#6CA038)}
.poster-auto-5{background:linear-gradient(155deg,#7AB648,#6AA038,#488020)}
.poster-auto-6{background:linear-gradient(140deg,#6CA038,#98D070,#6AA038)}
.poster-auto-7{background:linear-gradient(150deg,#5C9830,#7AB648,#508828)}
.poster-auto-8{background:linear-gradient(135deg,#5C9030,#78B040,#90D060)}

/* SVG Decorations */
.poster svg.deco{position:absolute;pointer-events:none;z-index:1;opacity:.15}
.poster svg.deco-bright{opacity:.25}

/* Geometric patterns overlay */
.poster::before{
  content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
}
.pattern-dots::before{background-image:radial-gradient(circle,rgba(255,255,255,.1) 1.5px,transparent 1.5px);background-size:20px 20px}
.pattern-lines::before{background-image:repeating-linear-gradient(45deg,transparent,transparent 14px,rgba(255,255,255,.05) 14px,rgba(255,255,255,.05) 15px)}
.pattern-cross::before{background-image:repeating-linear-gradient(0deg,transparent,transparent 24px,rgba(255,255,255,.04) 24px,rgba(255,255,255,.04) 25px),repeating-linear-gradient(90deg,transparent,transparent 24px,rgba(255,255,255,.04) 24px,rgba(255,255,255,.04) 25px)}
.pattern-diag::before{background-image:repeating-linear-gradient(-45deg,transparent,transparent 18px,rgba(255,255,255,.05) 18px,rgba(255,255,255,.05) 19px)}
.pattern-circles::before{background-image:radial-gradient(circle at 15% 85%,rgba(255,255,255,.08) 0%,transparent 45%),radial-gradient(circle at 85% 15%,rgba(255,255,255,.1) 0%,transparent 35%)}
.pattern-waves::before{background-image:url("data:image/svg+xml,%3Csvg width='120' height='24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 12Q30 0 60 12Q90 24 120 12' fill='none' stroke='rgba(255,255,255,0.06)' stroke-width='2'/%3E%3C/svg%3E");background-size:120px 24px}
.pattern-grid::before{background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px}
.pattern-diamond::before{background-image:repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(255,255,255,.04) 20px,rgba(255,255,255,.04) 21px),repeating-linear-gradient(-45deg,transparent,transparent 20px,rgba(255,255,255,.04) 20px,rgba(255,255,255,.04) 21px)}

/* Corner decorations */
.corner-tl{position:absolute;top:0;right:0;width:120px;height:120px;z-index:1;pointer-events:none}
.corner-br{position:absolute;bottom:0;left:0;width:100px;height:100px;z-index:1;pointer-events:none}

/* Decorative shapes */
.shape-circle{position:absolute;border-radius:50%;pointer-events:none;z-index:1}
.shape-ring{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.12);pointer-events:none;z-index:1}

/* Stats bar */
.stats-bar{
  max-width:1300px;margin:8px auto 32px;padding:0 24px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;
}
.stat-card{
  background:var(--card);border-radius:14px;padding:16px;text-align:center;
  border:1px solid var(--border);box-shadow:0 2px 8px rgba(74,63,53,.04);
}
.stat-num{font-size:1.5rem;font-weight:800}
.stat-label{font-size:.72rem;color:var(--muted);margin-top:2px}

/* Responsive */
@media(max-width:700px){
  .poster-grid{grid-template-columns:1fr 1fr;gap:14px}
  .poster-text .quote{font-size:1.15rem}
  .poster{padding:24px 20px}
  .controls{gap:8px}
  .filter-btn{padding:6px 12px;font-size:.76rem}
}
@media(max-width:420px){
  .poster-grid{grid-template-columns:1fr}
}
@media print{
  .header,.controls,.poster-overlay,.download-all,.back-link{display:none!important}
  .poster-wrap{break-inside:avoid;margin-bottom:16px}
}
</style>
</head>
<body>

<div class="header">
  <h1>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    קירות מדברים
  </h1>
  <a href="five-dimensions.html" class="back-link">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"/></svg>
    חזרה לחמשת הממדים
  </a>
</div>

<div class="controls">
  <button class="filter-btn active" data-filter="all" onclick="filterPosters('all')">הכל</button>
  <button class="filter-btn" data-dim="belong" data-filter="belong" onclick="filterPosters('belong')">שייכות</button>
  <button class="filter-btn" data-dim="respect" data-filter="respect" onclick="filterPosters('respect')">כבוד</button>
  <button class="filter-btn" data-dim="motiv" data-filter="motiv" onclick="filterPosters('motiv')">מוטיבציה</button>
  <button class="filter-btn" data-dim="capable" data-filter="capable" onclick="filterPosters('capable')">מסוגלות</button>
  <button class="filter-btn" data-dim="auto" data-filter="auto" onclick="filterPosters('auto')">אוטונומיה</button>
  <span style="width:1px;height:24px;background:var(--border)"></span>
  <button class="filter-btn" data-filter="classroom" onclick="filterPosters('classroom')">כיתות</button>
  <button class="filter-btn" data-filter="hallway" onclick="filterPosters('hallway')">מסדרונות</button>
  <button class="filter-btn" data-filter="yard" onclick="filterPosters('yard')">חצר</button>
  <button class="filter-btn" data-filter="teachers" onclick="filterPosters('teachers')">חדר מורים</button>
  <button class="download-all" onclick="downloadAll()">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
    הורדת הכל
  </button>
</div>

<div class="stats-bar">
  <div class="stat-card"><div class="stat-num" style="color:var(--primary-dark)" id="statTotal">40</div><div class="stat-label">סה"כ פוסטרים</div></div>
  <div class="stat-card"><div class="stat-num" style="color:var(--dim-belong)" id="statBelong">8</div><div class="stat-label">שייכות</div></div>
  <div class="stat-card"><div class="stat-num" style="color:var(--dim-respect)" id="statRespect">8</div><div class="stat-label">כבוד</div></div>
  <div class="stat-card"><div class="stat-num" style="color:var(--dim-motiv)" id="statMotiv">8</div><div class="stat-label">מוטיבציה</div></div>
  <div class="stat-card"><div class="stat-num" style="color:var(--dim-capable)" id="statCapable">8</div><div class="stat-label">מסוגלות</div></div>
  <div class="stat-card"><div class="stat-num" style="color:var(--dim-auto)" id="statAuto">8</div><div class="stat-label">אוטונומיה</div></div>
</div>

<div class="poster-grid" id="posterGrid"></div>

<script>
const POSTERS = [
  // ===== שייכות =====
  {dim:'belong',quote:'אנחנו לא רק כיתה\nאנחנו משפחה',loc:'hallway',cls:'poster-belong-1 pattern-dots',
   decos:[
     {type:'circle',top:'8%',right:'6%',w:80,color:'rgba(255,255,255,.1)'},
     {type:'circle',bottom:'12%',left:'8%',w:50,color:'rgba(255,255,255,.08)'},
     {type:'ring',top:'60%',right:'10%',w:60},
     {type:'svg',name:'people',bottom:'8%',left:'50%',transform:'translateX(-50%)',w:200,h:60},
   ]},
  {dim:'belong',quote:'כל אחד שייך\nכל אחד חשוב',loc:'classroom',cls:'poster-belong-2 pattern-circles',
   decos:[
     {type:'ring',top:'10%',left:'10%',w:70},

     {type:'svg',name:'hearts',top:'8%',right:'8%',w:80,h:80},
   ]},
  {dim:'belong',quote:'בית הספר שלנו\nהבית השני שלי',loc:'yard',cls:'poster-belong-3 pattern-waves',

     {type:'svg',name:'home',bottom:'10%',right:'10%',w:90,h:90},
     {type:'circle',top:'10%',left:'15%',w:60,color:'rgba(255,255,255,.08)'},
   ]},
  {dim:'belong',quote:'ביחד\nאנחנו יותר חזקים',loc:'classroom',cls:'poster-belong-4 pattern-cross',
   decos:[
     {type:'svg',name:'hands',bottom:'8%',left:'50%',transform:'translateX(-50%)',w:160,h:70},
     {type:'ring',top:'12%',right:'12%',w:50},
   ]},
  {dim:'belong',quote:'תיקון עולם\nמתחיל כאן\nממך, ממני, מאיתנו',loc:'hallway',cls:'poster-belong-5 pattern-lines',
   decos:[
     {type:'svg',name:'globe',top:'8%',left:'8%',w:70,h:70},
     {type:'circle',bottom:'10%',right:'10%',w:50,color:'rgba(255,255,255,.1)'},
   ]},
  {dim:'belong',quote:'אנחנו דואגים\nאחד לשני',loc:'yard',cls:'poster-belong-6 pattern-grid',
   decos:[
     {type:'svg',name:'shield',bottom:'10%',left:'10%',w:70,h:80},
     {type:'ring',top:'15%',right:'15%',w:45},
   ]},
  {dim:'belong',quote:'המקום הזה שלי\nאני שייך/ת',loc:'classroom',cls:'poster-belong-7 pattern-diamond',
   decos:[
     {type:'svg',name:'star',top:'10%',right:'10%',w:60,h:60},
     {type:'circle',bottom:'15%',left:'12%',w:45,color:'rgba(255,255,255,.1)'},
   ]},
  {dim:'belong',quote:'כל תלמיד צריך\nמבוגר אחד\nשמאמין בו',loc:'teachers',cls:'poster-belong-8 pattern-dots',
   decos:[
     {type:'svg',name:'lightbulb',bottom:'10%',right:'10%',w:60,h:80},
     {type:'ring',top:'10%',left:'10%',w:55},
   ]},

  // ===== כבוד =====
  {dim:'respect',quote:'דיבור מכבד\nהכוח הכי גדול\nשיש לך',loc:'hallway',cls:'poster-respect-1 pattern-lines',
   decos:[
     {type:'svg',name:'chat',top:'8%',right:'8%',w:70,h:70},
     {type:'circle',bottom:'12%',left:'10%',w:55,color:'rgba(255,255,255,.08)'},
   ]},
  {dim:'respect',quote:'אני מקשיב/ה\nגם כשאני\nלא מסכים/ה',loc:'classroom',cls:'poster-respect-2 pattern-dots',
   decos:[
     {type:'svg',name:'ear',bottom:'10%',right:'10%',w:70,h:80},

  path: `<path d="M10 40C30 40 30 15 60 15C90 15 90 40 120 40C150 40 150 15 170 15" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="3" stroke-linecap="round"/><circle cx="170" cy="15" r="5" fill="rgba(255,255,255,.2)"/>`,

};

function buildPosterHTML(p, i) {
  const locName = LOC_NAMES[p.loc];
  const dimName = DIM_NAMES[p.dim];
  const quoteHTML = p.quote.replace(/\n/g, '<br>');

  let decosHTML = '';
  (p.decos || []).forEach(d => {
    const style = Object.entries(d).filter(([k]) => !['type','name','color','w','h','transform'].includes(k))
      .map(([k,v]) => `${k}:${v}`).join(';');
    if (d.type === 'circle') {
      decosHTML += `<div class="shape-circle" style="${style};width:${d.w}px;height:${d.w}px;background:${d.color || 'rgba(255,255,255,.1)'}${d.transform ? ';transform:'+d.transform : ''}"></div>`;
    } else if (d.type === 'ring') {
      decosHTML += `<div class="shape-ring" style="${style};width:${d.w}px;height:${d.w}px${d.transform ? ';transform:'+d.transform : ''}"></div>`;
    } else if (d.type === 'svg' && SVG_ICONS[d.name]) {
      decosHTML += `<svg class="deco" style="${style};width:${d.w}px;height:${d.h}px${d.transform ? ';transform:'+d.transform : ''}" viewBox="0 0 ${d.w} ${d.h}">${SVG_ICONS[d.name]}</svg>`;
    }
  });

  return `<div class="poster-wrap" data-dim="${p.dim}" data-loc="${p.loc}" data-idx="${i}">
    <div class="poster ${p.cls}" id="poster-${i}">
      ${decosHTML}
      <div class="poster-loc-badge">
        <svg width="10" height="10" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/></svg>
        ${locName}
      </div>
      <div class="poster-text">
        <div class="quote">${quoteHTML}</div>
        <div class="dim-label">${dimName}</div>
      </div>
    </div>
    <div class="poster-overlay">
      <button class="poster-btn poster-btn-dl" onclick="downloadPoster(${i},'${p.dim}-${i+1}')">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        הורדה PNG
      </button>
    </div>
  </div>`;
}

function renderPosters() {
  const grid = document.getElementById('posterGrid');
  grid.innerHTML = POSTERS.map((p, i) => buildPosterHTML(p, i)).join('');
}

function filterPosters(filter) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.filter-btn[data-filter="${filter}"]`).classList.add('active');
  document.querySelectorAll('.poster-wrap').forEach(w => {
    const show = filter === 'all' || w.dataset.dim === filter || w.dataset.loc === filter;
    w.style.display = show ? '' : 'none';
  });
  updateStats();
}

function updateStats() {
  const vis = sel => document.querySelectorAll(sel + ':not([style*="display: none"])').length;
  document.getElementById('statTotal').textContent = vis('.poster-wrap');
  document.getElementById('statBelong').textContent = vis('.poster-wrap[data-dim="belong"]');
  document.getElementById('statRespect').textContent = vis('.poster-wrap[data-dim="respect"]');
  document.getElementById('statMotiv').textContent = vis('.poster-wrap[data-dim="motiv"]');
  document.getElementById('statCapable').textContent = vis('.poster-wrap[data-dim="capable"]');
  document.getElementById('statAuto').textContent = vis('.poster-wrap[data-dim="auto"]');
}

async function downloadPoster(idx, name) {
  const el = document.getElementById('poster-' + idx);
  if (!el) return;
  // Temporarily hide overlay
  const overlay = el.parentElement.querySelector('.poster-overlay');
  if (overlay) overlay.style.display = 'none';
  try {
    const canvas = await html2canvas(el, {
      scale: 3,
      useCORS: true,
      backgroundColor: null,
      logging: false,
    });
    const link = document.createElement('a');
    link.download = `poster-${name}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) {
    console.error(e);
    alert('שגיאה בהורדה — נסי שוב');
  }
  if (overlay) overlay.style.display = '';
}

async function downloadAll() {
  const visible = document.querySelectorAll('.poster-wrap:not([style*="display: none"])');
  for (let i = 0; i < visible.length; i++) {
    const idx = visible[i].dataset.idx;
    const dim = visible[i].dataset.dim;
    await downloadPoster(idx, `${dim}-${parseInt(idx)+1}`);
    await new Promise(r => setTimeout(r, 400));
  }
}

// Init
renderPosters();
</script>
