<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טופס הכנה למבחן — אורט בית הערבה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Heebo', sans-serif; background: #F5F7FA; color: #263238; min-height: 100vh; padding-bottom: 40px; }

        .header { background: linear-gradient(135deg, #00838F 0%, #26A69A 100%); color: white; padding: 28px 20px; text-align: center; }
        .header h1 { font-size: 26px; font-weight: 800; }
        .header .sub { font-size: 14px; opacity: 0.85; margin-top: 4px; }

        .exam-info { background: white; margin: 20px auto; max-width: 600px; border-radius: 14px; padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06); border-right: 5px solid #26A69A; }
        .exam-info h2 { font-size: 20px; color: #00838F; margin-bottom: 10px; }
        .exam-detail { font-size: 16px; color: #546E7A; margin: 4px 0; }
        .exam-detail strong { color: #263238; }

        .form-card { background: white; margin: 16px auto; max-width: 600px; border-radius: 14px; padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .form-card h3 { font-size: 18px; color: #00838F; margin-bottom: 14px; }

        label { display: block; font-size: 15px; font-weight: 600; color: #37474F; margin-bottom: 6px; margin-top: 16px; }
        label:first-child { margin-top: 0; }
        textarea, input[type="text"] {
            width: 100%; padding: 12px 14px; border: 2px solid #E0E0E0; border-radius: 10px;
            font-family: 'Heebo', sans-serif; font-size: 15px; transition: border-color 0.2s; resize: vertical; }
        textarea:focus, input:focus { border-color: #26A69A; outline: none; }
        textarea { min-height: 120px; line-height: 1.7; }
        .hint { font-size: 13px; color: #90A4AE; margin-top: 4px; }

        .submit-btn { display: block; width: 100%; max-width: 600px; margin: 24px auto 0; padding: 16px;
            background: #00838F; color: white; border: none; border-radius: 12px;
            font-family: 'Heebo', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer;
            transition: background 0.2s; }
        .submit-btn:hover { background: #006064; }
        .submit-btn:disabled { background: #B0BEC5; cursor: not-allowed; }

        .success-card { display: none; background: #E8F5E9; margin: 20px auto; max-width: 600px; border-radius: 14px;
            padding: 32px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .success-card h2 { font-size: 24px; color: #2E7D32; margin-bottom: 8px; }
        .success-card .msg { font-size: 16px; color: #546E7A; }

        .error-msg { color: #C62828; font-size: 14px; margin-top: 8px; display: none; }

        @media (max-width: 640px) {
            .header h1 { font-size: 22px; }
            .form-card, .exam-info { margin: 12px 10px; }
            .submit-btn { margin: 16px 10px 0; width: calc(100% - 20px); }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>טופס הכנה למבחן</h1>
    <div class="sub">אורט בית הערבה — ירושלים</div>
</div>

<div class="exam-info" id="examInfo">
    <h2 id="examTitle">טוען פרטי בחינה...</h2>
    <div class="exam-detail" id="examDate"></div>
    <div class="exam-detail" id="examClasses"></div>
</div>

<div class="form-card" id="formCard">
    <h3>פרטי ההכנה למבחן</h3>

    <label for="teacherName">שם המורה</label>
    <input type="text" id="teacherName" placeholder="השם המלא שלך">

    <label for="topics">נושאי לימוד</label>
    <textarea id="topics" placeholder="פרטו את הנושאים שהתלמידים צריכים ללמוד&#10;&#10;נושא 1&#10;נושא 2&#10;נושא 3"></textarea>
    <div class="hint">רשמו כל נושא בשורה נפרדת</div>

    <label for="questions">שאלות הכנה</label>
    <textarea id="questions" placeholder="כתבו שאלות הכנה לתלמידים&#10;&#10;1. שאלה ראשונה?&#10;2. שאלה שנייה?&#10;3. שאלה שלישית?"></textarea>
    <div class="hint">שאלות תרגול שיעזרו לתלמידים להתכונן</div>

    <label for="notes">הערות נוספות (לא חובה)</label>
    <textarea id="notes" rows="3" placeholder="טיפים, חומר עזר, עמודים בספר..."></textarea>

    <div class="error-msg" id="errorMsg"></div>
</div>

<button class="submit-btn" id="submitBtn" onclick="submitForm()">שלח טופס הכנה</button>

<div class="success-card" id="successCard">
    <h2>הטופס נשלח בהצלחה!</h2>
    <div class="msg">תודה רבה. ההנהלה קיבלה הודעה.</div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzmtPGyyw5R-V8sVfhqiHsJD6hinMOrAPshdzAcAvD4ziDS3OwvDq4qPur5xNkJrS4CNw/exec';

// Parse URL params
const params = new URLSearchParams(window.location.search);
const examId = params.get('examId') || '';
const subject = params.get('subject') || '';
const type = params.get('type') || '';
const date = params.get('date') || '';
const classes = params.get('classes') || '';
const teacher = params.get('teacher') || '';

// Fill exam info
document.getElementById('examTitle').textContent = subject + (type ? ' (' + type + ')' : '');
document.getElementById('examDate').innerHTML = '<strong>תאריך:</strong> ' + formatDate(date);
document.getElementById('examClasses').innerHTML = '<strong>כיתות:</strong> ' + classes;
if (teacher) document.getElementById('teacherName').value = teacher;

function formatDate(d) {
    if (!d) return '—';
    try {
        const dt = new Date(d);
        return dt.getDate() + '.' + (dt.getMonth() + 1) + '.' + dt.getFullYear();
    } catch(e) { return d; }
}

function submitForm() {
    const teacherName = document.getElementById('teacherName').value.trim();
    const topics = document.getElementById('topics').value.trim();
    const questions = document.getElementById('questions').value.trim();
    const notes = document.getElementById('notes').value.trim();
    const errorEl = document.getElementById('errorMsg');

    if (!teacherName) { errorEl.textContent = 'נא למלא שם מורה'; errorEl.style.display = 'block'; return; }
    if (!topics) { errorEl.textContent = 'נא למלא נושאי לימוד'; errorEl.style.display = 'block'; return; }
    if (!questions) { errorEl.textContent = 'נא למלא שאלות הכנה'; errorEl.style.display = 'block'; return; }
    errorEl.style.display = 'none';

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'שולח...';

    const prep = { examId, teacherName, teacherPhone: '', topics, questions, notes };

    if (APPS_SCRIPT_URL) {
        fetch(APPS_SCRIPT_URL, {
            method: 'POST', mode: 'no-cors',
            body: JSON.stringify({ action: 'submitPrepForm', prep })
        }).then(() => showSuccess()).catch(() => showSuccess());
    } else {
        // No backend - show success anyway (data saved locally concept)
        setTimeout(showSuccess, 500);
    }
}

function showSuccess() {
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('submitBtn').style.display = 'none';
    document.getElementById('successCard').style.display = 'block';
}
</script>
</body>
</html>
