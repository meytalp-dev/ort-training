<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>הכנות לתשפ"ז — אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --dream:#8E7ED4; --dream-light:#D4CEF0; --dream-dark:#5B4BA0;
    --create:#E8B060; --create-light:#F5DEB0; --create-dark:#D48A2C;
    --lead:#3AACA0; --lead-light:#B8E4DE; --lead-dark:#1B7A6E;
    --spark:#E8909C; --spark-dark:#D45C6E;
    --bg:#fff; --bg-alt:#FAFBFC; --card:#fff;
    --text:#2C2622; --text-light:#6E6258; --text-lighter:#8C7E72;
    --border:#EDE6D8; --border-light:#F5F0E5;
    --radius:16px; --radius-lg:24px;
    --shadow-sm:0 2px 8px rgba(44,38,34,.05);
    --shadow-md:0 6px 20px rgba(44,38,34,.08);
    --shadow-lg:0 12px 40px rgba(44,38,34,.1);
  }

  body {
    font-family:'Heebo',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; line-height:1.7; position:relative; overflow-x:hidden;
  }

  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 500px 400px at 15% 25%, rgba(142,126,212,.06) 0%, transparent 70%),
      radial-gradient(ellipse 400px 350px at 85% 60%, rgba(232,176,96,.05) 0%, transparent 70%),
      radial-gradient(ellipse 450px 350px at 50% 85%, rgba(58,172,160,.04) 0%, transparent 70%);
  }

  .floating-shape { position:fixed; pointer-events:none; z-index:0; opacity:.4;
    animation: float 22s ease-in-out infinite; }
  .floating-shape.s1 { top:8%; right:4%; width:140px; height:140px;
    background:radial-gradient(circle, var(--dream-light), transparent 70%); border-radius:50%; }
  .floating-shape.s2 { bottom:15%; left:3%; width:160px; height:160px;
    background:radial-gradient(circle, var(--create-light), transparent 70%); border-radius:50%;
    animation-delay:-7s; }

  @keyframes float {
    0%, 100% { transform: translate(0,0) rotate(0deg); }
    50% { transform: translate(20px,-25px) rotate(6deg); }
  }

  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(14px); }
    to { opacity:1; transform:translateY(0); }
  }

  header {
    background:#fff; padding:22px 40px; display:flex; align-items:center; gap:18px;
    position:sticky; top:0; z-index:50; box-shadow:0 2px 12px rgba(44,38,34,.04);
    flex-wrap:wrap;
  }
  header::after {
    content:''; position:absolute; bottom:0; left:0; right:0; height:4px;
    background:linear-gradient(90deg, var(--dream), var(--create), var(--lead));
  }
  header h1 {
    font-family:'Playpen Sans Hebrew','Heebo',sans-serif; font-weight:800;
    font-size:24px; color:var(--text); letter-spacing:-.3px;
  }
  header .subtitle { color:var(--text-lighter); font-size:14px; margin-top:2px; }
  header .role-name-badge {
    background:linear-gradient(135deg, rgba(142,126,212,.12), rgba(58,172,160,.12));
    padding:6px 16px; border-radius:20px; font-size:13px; font-weight:600;
    color:var(--dream-dark); border:1px solid rgba(142,126,212,.2);
  }
  header .header-spacer { flex:1; }
  header .save-status {
    font-size:13px; color:var(--text-lighter); display:flex; align-items:center; gap:6px;
  }
  header .save-status.saved { color:var(--lead-dark); }
  header .save-status.saving { color:var(--create-dark); }
  header .save-status.error { color:var(--spark-dark); }

  .container { max-width:1080px; margin:0 auto; padding:32px 28px 80px; position:relative; z-index:1; }

  .role-info-card {
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:0; margin-bottom:24px; box-shadow:var(--shadow-sm);
    animation:fadeInUp .4s ease; overflow:hidden;
  }
  .role-info-header {
    padding:20px 26px; cursor:pointer; display:flex; align-items:center; gap:14px;
    background:linear-gradient(135deg, rgba(142,126,212,.05), rgba(58,172,160,.04));
    border-bottom:1px solid var(--border-light);
  }
  .role-info-card:not(.open) .role-info-header { border-bottom:none; }
  .role-info-header .icon-circle {
    width:36px; height:36px; border-radius:10px; background:var(--dream-light);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .role-info-header h2 {
    font-family:'Playpen Sans Hebrew','Heebo',sans-serif; font-size:18px; font-weight:700;
    color:var(--text);
  }
  .role-info-header .toggle {
    margin-right:auto; color:var(--text-lighter); font-size:14px;
    transition:transform .25s ease;
  }
  .role-info-card.open .toggle { transform:rotate(180deg); }
  .role-info-body {
    padding:0 26px; max-height:0; overflow:hidden; transition:all .3s ease;
  }
  .role-info-card.open .role-info-body {
    padding:22px 26px 26px; max-height:none;
  }
  .role-info-body h3 {
    font-size:14px; font-weight:700; color:var(--dream-dark); margin:18px 0 8px;
    text-transform:uppercase; letter-spacing:.4px;
  }
  .role-info-body h3:first-child { margin-top:0; }
  .role-info-body p { color:var(--text-light); font-size:14.5px; }
  .role-info-body ul { list-style:none; padding:0; }
  .role-info-body ul li {
    padding:5px 0 5px 16px; position:relative; font-size:14px; color:var(--text-light);
  }
  .role-info-body ul li::before {
    content:'◆'; position:absolute; right:0; color:var(--dream); font-size:9px; top:11px;
  }
  .reporting-line {
    background:rgba(58,172,160,.08); border-right:3px solid var(--lead);
    padding:10px 14px; border-radius:6px; font-size:13.5px; color:var(--text);
    margin-top:6px;
  }

  /* ===== Prep Section ===== */
  .prep-section {
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:28px 30px; box-shadow:var(--shadow-md);
    animation:fadeInUp .5s ease;
  }
  .prep-header {
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    margin-bottom:22px; padding-bottom:18px; border-bottom:2px solid var(--border-light);
    flex-wrap:wrap;
  }
  .prep-header h2 {
    font-family:'Playpen Sans Hebrew','Heebo',sans-serif; font-size:24px; font-weight:800;
    color:var(--text);
  }
  .prep-header .target-date {
    font-size:13px; color:var(--text-lighter); margin-top:2px;
  }
  .prep-stats {
    display:flex; gap:10px; align-items:center;
  }
  .stat-chip {
    background:var(--bg-alt); border:1px solid var(--border); padding:6px 12px;
    border-radius:20px; font-size:13px; color:var(--text); display:flex; align-items:center; gap:6px;
  }
  .stat-chip strong { font-weight:700; }
  .stat-chip.done { background:rgba(58,172,160,.1); border-color:rgba(58,172,160,.25); color:var(--lead-dark); }
  .stat-chip.open { background:rgba(232,176,96,.1); border-color:rgba(232,176,96,.3); color:var(--create-dark); }

  .progress-bar {
    width:100%; height:8px; background:var(--bg-alt); border-radius:6px; overflow:hidden;
    margin-bottom:22px; border:1px solid var(--border-light);
  }
  .progress-bar-fill {
    height:100%; background:linear-gradient(90deg, var(--lead), var(--lead-dark));
    transition:width .4s ease; border-radius:6px;
  }

  /* ===== Tasks ===== */
  .tasks-list { list-style:none; padding:0; display:flex; flex-direction:column; gap:10px; }
  .task-card {
    background:var(--card); border:1px solid var(--border-light); border-radius:14px;
    padding:14px 16px; display:flex; gap:12px; align-items:flex-start;
    transition:all .2s ease; position:relative;
  }
  .task-card:hover { border-color:var(--dream-light); box-shadow:var(--shadow-sm); }
  .task-card.done {
    background:rgba(58,172,160,.04); border-color:rgba(58,172,160,.2);
  }
  .task-card.done .task-title { text-decoration:line-through; color:var(--text-lighter); }
  .task-card.done .task-desc { color:var(--text-lighter); }
  .task-card.editing { border-color:var(--dream); box-shadow:0 0 0 3px rgba(142,126,212,.15); }

  .task-check {
    width:24px; height:24px; border-radius:7px; border:2px solid var(--border);
    background:#fff; cursor:pointer; flex-shrink:0; margin-top:2px;
    transition:all .2s ease; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .task-check:hover { border-color:var(--lead); }
  .task-check.checked {
    background:var(--lead); border-color:var(--lead);
  }
  .task-check.checked::after {
    content:''; width:11px; height:6px; border:2px solid white; border-top:0; border-right:0;
    transform:rotate(-45deg) translateY(-1px);
  }

  .task-content { flex:1; min-width:0; }
  .task-title {
    font-size:15.5px; font-weight:600; color:var(--text); line-height:1.45;
    word-break:break-word;
  }
  .task-desc {
    font-size:13.5px; color:var(--text-light); margin-top:4px;
    line-height:1.55; word-break:break-word;
  }
  .task-meta {
    display:flex; gap:10px; align-items:center; margin-top:8px; flex-wrap:wrap;
  }
  .deadline-chip {
    font-size:12px; padding:3px 10px; border-radius:14px; font-weight:600;
    display:inline-flex; align-items:center; gap:5px;
    background:var(--bg-alt); color:var(--text-light); border:1px solid var(--border);
  }
  .deadline-chip.urgent { background:rgba(232,144,156,.1); color:var(--spark-dark); border-color:rgba(232,144,156,.3); }
  .deadline-chip.soon { background:rgba(232,176,96,.1); color:var(--create-dark); border-color:rgba(232,176,96,.3); }
  .deadline-chip.later { background:rgba(58,172,160,.08); color:var(--lead-dark); border-color:rgba(58,172,160,.2); }
  .deadline-chip.overdue { background:#FCE7EA; color:#9B2C2C; border-color:#F5B5C0; }

  .task-actions { display:flex; gap:4px; opacity:0; transition:opacity .2s ease; flex-shrink:0; }
  .task-card:hover .task-actions { opacity:1; }
  .task-card.editing .task-actions { opacity:1; }
  .task-actions button {
    background:transparent; border:none; padding:6px; border-radius:6px;
    cursor:pointer; color:var(--text-lighter); transition:all .15s ease;
    display:flex; align-items:center; justify-content:center;
  }
  .task-actions button:hover { background:var(--bg-alt); color:var(--text); }
  .task-actions button.delete-btn:hover { background:#FCE7EA; color:#9B2C2C; }

  /* Edit mode */
  .task-card.editing .task-title,
  .task-card.editing .task-desc,
  .task-card.editing .task-meta { display:none; }
  .task-edit-form { display:none; flex:1; flex-direction:column; gap:8px; }
  .task-card.editing .task-edit-form { display:flex; }
  .task-edit-form input[type=text],
  .task-edit-form textarea,
  .task-edit-form input[type=date] {
    font-family:inherit; font-size:14px; padding:8px 10px; border-radius:8px;
    border:1px solid var(--border); background:var(--bg-alt); color:var(--text);
    outline:none; transition:border-color .15s;
  }
  .task-edit-form input[type=text]:focus,
  .task-edit-form textarea:focus,
  .task-edit-form input[type=date]:focus { border-color:var(--dream); background:#fff; }
  .task-edit-form textarea { resize:vertical; min-height:50px; line-height:1.5; }
  .task-edit-form .edit-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .task-edit-form .edit-row label { font-size:12.5px; color:var(--text-lighter); }
  .task-edit-form .edit-actions { display:flex; gap:8px; margin-top:4px; }
  .task-edit-form button {
    font-family:inherit; font-size:13px; font-weight:600; padding:7px 14px;
    border-radius:8px; border:none; cursor:pointer; transition:all .15s ease;
  }
  .task-edit-form button.save-btn { background:var(--lead); color:#fff; }
  .task-edit-form button.save-btn:hover { background:var(--lead-dark); }
  .task-edit-form button.cancel-btn { background:transparent; color:var(--text-light); border:1px solid var(--border); }
  .task-edit-form button.cancel-btn:hover { background:var(--bg-alt); }

  /* Add task */
  .add-task-section { margin-top:18px; padding-top:18px; border-top:1px dashed var(--border); }
  .add-task-btn {
    width:100%; padding:14px; background:transparent; border:2px dashed var(--border);
    border-radius:12px; color:var(--text-light); cursor:pointer; font-family:inherit;
    font-size:14px; font-weight:600; transition:all .2s ease; display:flex;
    align-items:center; justify-content:center; gap:8px;
  }
  .add-task-btn:hover { border-color:var(--dream); color:var(--dream-dark); background:rgba(142,126,212,.04); }

  /* Empty state */
  .empty-state {
    text-align:center; padding:48px 24px; color:var(--text-lighter);
  }
  .empty-state h3 {
    font-family:'Playpen Sans Hebrew','Heebo',sans-serif; font-size:18px; color:var(--text);
    margin-bottom:8px;
  }
  .empty-state p { font-size:14px; }

  /* Loading state */
  .loading-state { text-align:center; padding:48px 20px; color:var(--text-lighter); font-size:14px; }
  .loading-state::before {
    content:''; display:inline-block; width:14px; height:14px;
    border:2px solid var(--border); border-top-color:var(--dream);
    border-radius:50%; animation:spin 1s linear infinite; margin-left:8px;
    vertical-align:middle;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Error banner */
  .error-banner {
    background:#FCE7EA; color:#9B2C2C; border:1px solid #F5B5C0;
    padding:14px 18px; border-radius:12px; margin-bottom:20px; font-size:14px;
    display:none;
  }
  .error-banner.show { display:block; }

  /* Mobile */
  @media (max-width:640px) {
    header { padding:16px 18px; gap:10px; }
    header h1 { font-size:20px; }
    .container { padding:20px 14px 60px; }
    .role-info-header { padding:14px 18px; }
    .role-info-card.open .role-info-body { padding:16px 18px 20px; }
    .prep-section { padding:20px 18px; }
    .prep-header h2 { font-size:20px; }
    .task-card { padding:12px 14px; gap:10px; }
    .task-actions { opacity:1; }
    .floating-shape { display:none; }
  }

  /* Print */
  @media print {
    header, .floating-shape, .task-actions, .add-task-section, .save-status { display:none !important; }
    body::before { display:none !important; }
    .role-info-card { box-shadow:none; }
    .role-info-card .role-info-body { padding:18px 26px !important; max-height:none !important; }
    .prep-section { box-shadow:none; border:1px solid var(--border); }
    .container { padding:0; }
  }
</style>
</head>
<body>

<div class="floating-shape s1"></div>
<div class="floating-shape s2"></div>

<header>
  <div>
    <h1>הכנות לתשפ"ז</h1>
    <div class="subtitle" id="roleHeaderSubtitle">אורט בית הערבה</div>
  </div>
  <span class="role-name-badge" id="roleNameBadge">—</span>
  <div class="header-spacer"></div>
  <div class="save-status" id="saveStatus">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
    <span id="saveStatusText">טוען…</span>
  </div>
</header>

<div class="container">

  <div class="error-banner" id="errorBanner">
    <strong>שים לב:</strong> <span id="errorText"></span>
  </div>

  <!-- כרטיס הגדרת תפקיד (מתקפל) -->
  <section class="role-info-card" id="roleInfoCard">
    <div class="role-info-header" onclick="document.getElementById('roleInfoCard').classList.toggle('open')">
      <div class="icon-circle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B4BA0" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <h2>הגדרת התפקיד</h2>
      <span class="toggle">&#9660;</span>
    </div>
    <div class="role-info-body">
      <h3>יעדי התפקיד</h3>
      <p id="roleGoals">—</p>
      <h3>תחומי אחריות</h3>
      <ul id="roleResponsibilities"></ul>
      <h3>כפיפות ודיווח</h3>
      <div class="reporting-line" id="roleReporting">—</div>
    </div>
  </section>

  <!-- אזור משימות -->
  <section class="prep-section">
    <div class="prep-header">
      <div>
        <h2>הכנות לשנת הלימודים</h2>
        <div class="target-date">יעד: 1.7.2026</div>
      </div>
      <div class="prep-stats">
        <span class="stat-chip done"><strong id="doneCount">0</strong> הושלמו</span>
        <span class="stat-chip open"><strong id="openCount">0</strong> פתוחות</span>
      </div>
    </div>

    <div class="progress-bar">
      <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
    </div>

    <ul class="tasks-list" id="tasksList">
      <li class="loading-state">טוען משימות מהענן…</li>
    </ul>

    <div class="add-task-section">
      <button class="add-task-btn" onclick="startAddTask()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        הוספת משימה חדשה
      </button>
    </div>
  </section>

</div>

<script src="prep-shared.js?v=3"></script>
<script>
// ===== Get role from URL =====
const params = new URLSearchParams(location.search);
const roleSlug = params.get('role');
const role = roleSlug ? PREP_ROLES[roleSlug] : null;

if (!role) {
  document.querySelector('.container').innerHTML = `
    <div class="prep-section">
      <h2 style="font-family:'Playpen Sans Hebrew',sans-serif">לא נבחר תפקיד</h2>
      <p style="margin-top:14px;color:var(--text-light)">הוסיפי לכתובת <code>?role=שם-תפקיד</code></p>
      <p style="margin-top:14px;font-size:14px">לדוגמה: <a href="?role=rivit">rivit</a> · <a href="?role=dorit">dorit</a> · <a href="?role=yiska">yiska</a> · <a href="?role=yaakov">yaakov</a> · <a href="?role=ofira">ofira</a> · <a href="?role=manu">manu</a></p>
    </div>`;
} else {
  initRolePage();
}

// ===== Render role info =====
function initRolePage() {
  document.title = `${role.title} — הכנות תשפ"ז`;
  document.getElementById('roleHeaderSubtitle').textContent = `${role.title} · אורט בית הערבה`;
  document.getElementById('roleNameBadge').textContent = role.name;
  document.getElementById('roleNameBadge').style.background =
    `linear-gradient(135deg, ${hexA(role.color, .12)}, rgba(58,172,160,.08))`;
  document.getElementById('roleNameBadge').style.color = role.color;
  document.getElementById('roleNameBadge').style.borderColor = hexA(role.color, .25);

  document.getElementById('roleGoals').textContent = role.goals;
  document.getElementById('roleResponsibilities').innerHTML =
    role.responsibilities.map(r => `<li>${escapeHtml(r)}</li>`).join('');
  document.getElementById('roleReporting').textContent = role.reporting;

  loadTasks();
}

function hexA(hex, alpha) {
  const h = hex.replace('#','');
  const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ===== Save status =====
function setStatus(state, text) {
  const el = document.getElementById('saveStatus');
  const txt = document.getElementById('saveStatusText');
  el.classList.remove('saved','saving','error');
  el.classList.add(state);
  txt.textContent = text;
}

function showError(msg) {
  const banner = document.getElementById('errorBanner');
  document.getElementById('errorText').textContent = msg;
  banner.classList.add('show');
}

// ===== Load tasks =====
let tasks = [];

async function loadTasks() {
  // 1. Try cache first for instant render
  const cached = prepCache.get(role.slug);
  if (cached && cached.length) {
    tasks = cached;
    renderTasks();
  }

  setStatus('saving', 'טוען…');

  // 2. Fetch from cloud
  const result = await prepListTasks(role.slug);

  if (result.error === 'not_configured') {
    setStatus('error', 'לא מחובר לענן');
    showError('שמירה לענן לא מוגדרת. כל שינוי יישמר רק במחשב הזה. פני למיטל להגדרה.');
    if (!cached || !cached.length) {
      // Seed from defaults locally
      tasks = role.defaultTasks.map((t,i) => ({ ...t, id: `local-${Date.now()}-${i}`, order:i, done:false }));
      prepCache.set(role.slug, tasks);
      renderTasks();
    }
    return;
  }

  if (result.error) {
    setStatus('error', 'שגיאה בטעינה');
    showError('שגיאה בטעינה מהענן. עובדים מהמטמון.');
    return;
  }

  let cloudTasks = result.tasks || [];

  // 3. If empty cloud — seed defaults in ONE call
  if (cloudTasks.length === 0) {
    setStatus('saving', 'מאתחל משימות ראשוניות…');
    const seeded = role.defaultTasks.map((t,i) => ({ ...t, order:i, done:false }));
    const seedResult = await prepApi('seed', { role: role.slug, tasks: seeded });
    if (seedResult.ids && seedResult.ids.length === seeded.length) {
      cloudTasks = seeded.map((t,i) => ({ ...t, id: seedResult.ids[i] }));
    } else {
      // Fallback: refetch
      const refetch = await prepListTasks(role.slug);
      cloudTasks = refetch.tasks || [];
    }
  }

  tasks = cloudTasks;
  prepCache.set(role.slug, tasks);
  renderTasks();
  setStatus('saved', 'נשמר לענן');
}

// ===== Render =====
function renderTasks() {
  const list = document.getElementById('tasksList');
  if (!tasks.length) {
    list.innerHTML = `<li class="empty-state"><h3>אין עדיין משימות</h3><p>לחצי על "הוספת משימה" כדי להתחיל</p></li>`;
    updateStats();
    return;
  }

  // Sort: by order, but done items keep their position
  const sorted = [...tasks].sort((a,b) => (a.order||0) - (b.order||0));

  list.innerHTML = sorted.map(t => taskHtml(t)).join('');
  updateStats();
}

function taskHtml(t) {
  const urgency = prepDeadlineUrgency(t.deadline);
  const deadlineLabel = t.deadline ? prepFormatDate(t.deadline) : 'אין דדליין';
  return `
  <li class="task-card ${t.done ? 'done' : ''}" data-id="${escapeAttr(t.id)}">
    <div class="task-check ${t.done ? 'checked' : ''}" onclick="toggleDone('${escapeAttr(t.id)}')" role="checkbox" aria-checked="${t.done}" tabindex="0"></div>
    <div class="task-content">
      <div class="task-title">${escapeHtml(t.title || '(ללא כותרת)')}</div>
      ${t.description ? `<div class="task-desc">${escapeHtml(t.description)}</div>` : ''}
      <div class="task-meta">
        <span class="deadline-chip ${urgency}">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          ${deadlineLabel}
        </span>
      </div>
      <form class="task-edit-form" onsubmit="saveEdit(event,'${escapeAttr(t.id)}')">
        <input type="text" name="title" value="${escapeAttr(t.title||'')}" placeholder="כותרת המשימה" required>
        <textarea name="description" placeholder="תיאור (אופציונלי)">${escapeHtml(t.description||'')}</textarea>
        <div class="edit-row">
          <label>דדליין:</label>
          <input type="date" name="deadline" value="${escapeAttr(t.deadline||'')}">
        </div>
        <div class="edit-actions">
          <button type="submit" class="save-btn">שמירה</button>
          <button type="button" class="cancel-btn" onclick="cancelEdit('${escapeAttr(t.id)}')">ביטול</button>
        </div>
      </form>
    </div>
    <div class="task-actions">
      <button onclick="startEdit('${escapeAttr(t.id)}')" title="עריכה" aria-label="עריכה">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
      <button class="delete-btn" onclick="deleteTask('${escapeAttr(t.id)}')" title="מחיקה" aria-label="מחיקה">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      </button>
    </div>
  </li>`;
}

function updateStats() {
  const done = tasks.filter(t => t.done).length;
  const total = tasks.length;
  const open = total - done;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('openCount').textContent = open;
  const pct = total > 0 ? (done / total) * 100 : 0;
  document.getElementById('progressBar').style.width = `${pct}%`;
}

// ===== Actions =====
async function toggleDone(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  renderTasks();
  prepCache.set(role.slug, tasks);
  setStatus('saving', 'שומר…');
  const r = await prepUpdateTask(id, { done: t.done });
  if (r.error) {
    setStatus('error', 'שגיאה בשמירה');
    showError('הסטטוס לא נשמר בענן. נסי שוב מאוחר יותר.');
  } else {
    setStatus('saved', 'נשמר לענן');
  }
}

function startEdit(id) {
  document.querySelectorAll('.task-card.editing').forEach(c => c.classList.remove('editing'));
  document.querySelector(`.task-card[data-id="${cssEscape(id)}"]`)?.classList.add('editing');
}

function cancelEdit(id) {
  document.querySelector(`.task-card[data-id="${cssEscape(id)}"]`)?.classList.remove('editing');
}

async function saveEdit(e, id) {
  e.preventDefault();
  const form = e.target;
  const fields = {
    title: form.title.value.trim(),
    description: form.description.value.trim(),
    deadline: form.deadline.value,
  };
  if (!fields.title) return;

  const t = tasks.find(x => x.id === id);
  if (!t) return;
  Object.assign(t, fields);
  renderTasks();
  prepCache.set(role.slug, tasks);
  setStatus('saving', 'שומר…');
  const r = await prepUpdateTask(id, fields);
  if (r.error) {
    setStatus('error', 'שגיאה בשמירה');
    showError('השינוי לא נשמר בענן.');
  } else {
    setStatus('saved', 'נשמר לענן');
  }
}

async function deleteTask(id) {
  if (!confirm('למחוק את המשימה?')) return;
  tasks = tasks.filter(x => x.id !== id);
  renderTasks();
  prepCache.set(role.slug, tasks);
  setStatus('saving', 'מוחק…');
  const r = await prepDeleteTask(id);
  if (r.error) {
    setStatus('error', 'שגיאה במחיקה');
    showError('המחיקה לא הסתנכרנה לענן.');
  } else {
    setStatus('saved', 'נמחק מהענן');
  }
}

async function startAddTask() {
  const newTask = {
    title: 'משימה חדשה',
    description: '',
    deadline: '2026-07-01',
    order: tasks.length,
    done: false,
  };
  setStatus('saving', 'מוסיף…');
  const r = await prepAddTask(role.slug, newTask);
  if (r.error || !r.id) {
    setStatus('error', 'שגיאה בהוספה');
    // Local fallback
    newTask.id = `local-${Date.now()}`;
    tasks.push(newTask);
    renderTasks();
    startEdit(newTask.id);
    return;
  }
  newTask.id = r.id;
  tasks.push(newTask);
  prepCache.set(role.slug, tasks);
  renderTasks();
  setStatus('saved', 'נשמר לענן');
  startEdit(newTask.id);
}

// ===== Utils =====
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }
function cssEscape(s) {
  if (window.CSS && CSS.escape) return CSS.escape(s);
  return String(s).replace(/[^a-zA-Z0-9_-]/g, c => '\\' + c);
}

// Open role info by default if first time visiting
if (!localStorage.getItem(`prep-info-seen-${roleSlug}`)) {
  setTimeout(() => {
    document.getElementById('roleInfoCard')?.classList.add('open');
    localStorage.setItem(`prep-info-seen-${roleSlug}`, '1');
  }, 200);
}
</script>
