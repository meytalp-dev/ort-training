<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דשבורד תכנון שנתי — אורט בית הערבה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Dream Theme — לחלום.ליצור.להוביל */
  --dream:#8E7ED4;--dream-light:#D4CEF0;--dream-dark:#5B4BA0;
  --create:#E8B060;--create-light:#F5DEB0;--create-dark:#D48A2C;
  --lead:#3AACA0;--lead-light:#B8E4DE;--lead-dark:#1B7A6E;
  --spark:#E8909C;--spark-dark:#D45C6E;
  --bg:#fff;--bg-alt:#FAFBFC;--card:#fff;
  --text:#2C2622;--text-light:#6E6258;--text-lighter:#8C7E72;--muted:#6E6258;
  --border:#EDE6D8;--border-light:#fff;
  --primary:#3AACA0;--primary-dark:#1B7A6E;--primary-light:#B8E4DE;
  --accent:#E8B060;--accent-dark:#D48A2C;
  --success:#4CAF50;--success-bg:#E8F5E9;--warn:#E8B060;--warn-bg:#FFF3E0;
  --danger:#D45C6E;--danger-bg:#FCE7EA;--info:#5B9BD5;--info-bg:#E6F0FA;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 8px rgba(44,38,34,.05);--shadow-sm:0 2px 8px rgba(44,38,34,.05);
  --shadow-md:0 6px 20px rgba(44,38,34,.08);--shadow-lg:0 12px 40px rgba(44,38,34,.1);
}
body{font-family:Heebo,sans-serif;background:#fff;color:var(--text);min-height:100vh;line-height:1.6}
h1,h2,h3,h4,h5,h6,.card-title,.section-title,.header-title{font-family:'Playpen Sans Hebrew','Heebo',sans-serif;font-weight:700}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.04) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.04) 0%,transparent 70%),
    radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.03) 0%,transparent 70%);
  pointer-events:none;z-index:0}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  padding:14px 24px;background:var(--card);border-bottom:2px solid var(--border);
  position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(44,38,34,.08)}
.hdr h1{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.badge{background:rgba(58,172,160,.15);padding:3px 12px;border-radius:20px;font-size:11px;
  font-weight:600;color:var(--primary-dark);border:1px solid rgba(58,172,160,.25)}
.hdr-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:8px 16px;border:none;border-radius:8px;font-family:Heebo;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}

/* Content */
.content{max-width:1100px;margin:0 auto;padding:24px}

/* Summary cards */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  box-shadow:0 2px 8px rgba(44,38,34,.04);text-align:center}
.summary-card .sc-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  margin:0 auto 10px}
.summary-card .sc-icon svg{width:20px;height:20px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.summary-card .sc-num{font-size:32px;font-weight:800;color:var(--primary-dark);line-height:1}
.summary-card .sc-label{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}

/* Section */
.dash-section{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
  padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(44,38,34,.04)}
.dash-section-title{font-size:17px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.dash-section-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.sec-icon{width:28px;height:28px;border-radius:8px;background:rgba(58,172,160,.12);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec-icon svg{width:16px;height:16px;stroke:var(--primary-dark);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Role section — full width cards */
.role-section{margin-bottom:24px}
.role-section-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  padding:16px 20px;border-radius:var(--radius) var(--radius) 0 0;cursor:pointer;transition:background .15s}
.role-section-header:hover{filter:brightness(.97)}
.role-section-name{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px}
.role-section-stats{display:flex;gap:16px;font-size:12px;font-weight:600}
.role-section-stat{display:flex;align-items:center;gap:4px}
.role-section-body{background:var(--card);border:1.5px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:0}
.role-section-body.open{padding:20px}
.role-section-body:not(.open){display:none}

/* Area block inside role */
.area-block{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.area-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.area-block-title{font-size:14px;font-weight:800;color:var(--primary-dark);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.area-block-title .area-count{font-size:11px;font-weight:600;color:var(--muted);background:#EDEAE3;padding:2px 8px;border-radius:10px}

/* Goal detail card */
.goal-detail{background:#FAFAF6;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.goal-detail-header{font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;align-items:flex-start;gap:8px}
.goal-detail-num{width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.goal-detail-field{font-size:12px;color:var(--muted);margin-bottom:4px;line-height:1.5}
.goal-detail-field strong{color:var(--text-light);font-weight:700}
.goal-detail-principle{display:inline-block;padding:2px 10px;border-radius:10px;font-size:10px;font-weight:700;margin-top:4px}

/* Activity card in dashboard */
.dash-activity{background:#F0F7F7;border:1px solid rgba(58,172,160,.2);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.dash-activity-header{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;margin-bottom:4px}
.dash-activity-month{background:var(--primary);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.dash-activity-area{background:rgba(142,126,212,.15);color:var(--dream-dark);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.dash-activity-desc{font-size:12px;color:var(--text);line-height:1.5}
.dash-task-list{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(58,172,160,.3)}
.dash-task{font-size:11px;color:var(--muted);padding:2px 0;display:flex;align-items:center;gap:6px}
.dash-task-done{text-decoration:line-through;color:#bbb}
.dash-task-check{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px}
.dash-task-check.done{background:var(--success);border-color:var(--success);color:#fff}

/* Status indicators */
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-green{background:var(--success)}
.status-yellow{background:var(--warn)}
.status-gray{background:#EDE6D8}

/* Eval summary */
.eval-summary{background:#FAF8F4;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:16px}
.eval-summary-title{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.eval-row{display:flex;gap:12px;font-size:12px;margin-bottom:4px}
.eval-row-label{font-weight:700;color:var(--muted);min-width:80px}
.eval-row-val{color:var(--text);flex:1;line-height:1.5}

/* Timeline */
.timeline-wrap{overflow-x:auto;padding-bottom:8px}
.timeline{display:flex;gap:0;min-width:900px}
.timeline-month{flex:1;min-width:80px;text-align:center;border-left:1px solid var(--border)}
.timeline-month:last-child{border-left:none}
.timeline-month-name{font-size:12px;font-weight:700;padding:8px 4px;background:#EDEAE3;border-bottom:1px solid var(--border)}
.timeline-events{padding:8px 4px;min-height:60px;display:flex;flex-direction:column;gap:3px;align-items:center}
.timeline-pill{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* Role colors */
.role-color-ravit{background:#E0F5F5;color:#1A5E5E}
.role-color-yaakov{background:#EDE0F7;color:#4A1D8C}
.role-color-counselor{background:#BFDBFE;color:#1E3A5F}
.role-color-ofira{background:#FDF0D5;color:#7C4A0D}
.role-color-homeroom{background:#FDE0E0;color:#7A1A1A}
.role-border-ravit{border-right:4px solid #3AACA0}
.role-border-yaakov{border-right:4px solid #9B5DE5}
.role-border-counselor{border-right:4px solid #3B82F6}
.role-border-ofira{border-right:4px solid #D47A35}
.role-border-homeroom{border-right:4px solid #E05050}
.role-color-mano{background:#DDEEDD;color:#1A5C1A}
.role-color-yiska{background:#FCE4EC;color:#880E4F}
.role-color-dorit{background:#E8EAF6;color:#283593}
.role-border-mano{border-right:4px solid #4CAF50}
.role-border-yiska{border-right:4px solid #EC407A}
.role-border-dorit{border-right:4px solid #5C6BC0}

/* Bar chart */
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding:0 12px;margin-top:12px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:6px 6px 0 0;transition:height .4s ease;min-height:2px}
.bar-label{font-size:10px;font-weight:700;color:var(--muted)}
.bar-count{font-size:11px;font-weight:800}
.bar-green{background:linear-gradient(180deg,#6BCB77,#27AE60)}
.bar-yellow{background:linear-gradient(180deg,#FFD93D,#E67E22)}
.bar-red{background:linear-gradient(180deg,#FF6B6B,#C0392B)}

/* Principles */
.principles-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.principle-card{border-radius:10px;padding:14px 16px}
.principle-card .p-name{font-size:13px;font-weight:700;margin-bottom:4px}
.principle-card .p-count{font-size:24px;font-weight:800;line-height:1}
.principle-card .p-label{font-size:11px;font-weight:600;margin-top:2px}

/* Empty state */
.empty-state{text-align:center;padding:48px 24px;color:var(--muted)}
.empty-state svg{width:48px;height:48px;stroke:var(--border);fill:none;stroke-width:1.5;margin-bottom:12px}
.empty-state p{font-size:14px;font-weight:500}
.empty-state a{color:var(--primary-dark);font-weight:700}

/* Print */
@media print{
  .hdr,.btn{display:none!important}
  body{background:#fff}
  .content{padding:0}
  .dash-section,.summary-card,.role-section{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  .role-section-body{display:block!important;padding:16px!important}
}

@media(max-width:600px){
  .content{padding:12px}
  .summary-grid{grid-template-columns:1fr 1fr}
  .role-section{margin-bottom:12px}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <h1>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      דשבורד תכנון שנתי
      <span class="badge">תשפ"ז -- אורט בית הערבה</span>
      <span class="badge" id="dataSource" style="background:rgba(39,174,96,.12);color:#1E8449;border-color:rgba(39,174,96,.25)">...</span>
    </h1>
  </div>
  <div class="hdr-btns">
    <a class="btn btn-outline" href="planning-form.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      טופס תכנון
    </a>
    <a class="btn btn-outline" href="gantt.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      לוח גאנט
    </a>
    <button class="btn btn-outline" onclick="window.print()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      הדפסה
    </button>
  </div>
</div>

<div class="content" id="dashContent">
  <!-- Populated by JS -->
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycby_PjhdOFI8mr1u9h5h0qi2uCkK3GkJP--iMo-GjIDPXRT2H7nLxO5UWMv6Ek70uDfv/exec';
let _jsonpCounter = 0;

const ROLE_KEYS = ['ravit', 'yaakov', 'counselor', 'ofira', 'homeroom', 'mano', 'yiska', 'dorit'];
const ROLE_LABELS = {
  ravit: 'רוית — סגנית/רכזת פדגוגית',
  yaakov: 'יעקב — רכז חברתי',
  counselor: 'יועצת',
  ofira: 'אופירה — שורשי ישראל',
  homeroom: 'מחנכת',
  mano: 'מנו — רכז מוגנות',
  yiska: 'יסכה — רכזת טיפול',
  dorit: 'דורית — רכזת יועצות'
};

const PRINCIPLE_LABELS = {
  human: 'האדם במרכז',
  relevance: 'רלוונטיות',
  tikkun: 'תיקון הלב ותיקון עולם',
  dual: 'למידה דואלית ומיומנויות',
  leadership: 'הובלה מקצועית'
};

const PRINCIPLE_COLORS = {
  human: { bg: '#E0F5F5', color: '#1A5E5E', border: '#3AACA0' },
  relevance: { bg: '#FDF0D5', color: '#7C4A0D', border: '#D47A35' },
  tikkun: { bg: '#EDE0F7', color: '#4A1D8C', border: '#9B5DE5' },
  dual: { bg: '#FDE0E0', color: '#7A1A1A', border: '#E05050' },
  leadership: { bg: '#DDEEDD', color: '#1A5C1A', border: '#4CAF50' }
};

const MONTHS_ORDER = ['ספטמבר','אוקטובר','נובמבר','דצמבר','ינואר','פברואר','מרץ','אפריל','מאי','יוני'];

function loadAllDataLocal() {
  const allData = {};
  ROLE_KEYS.forEach(role => {
    try {
      const raw = localStorage.getItem('planning_' + role);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && (d.areas || d.goals || d.name)) {
          allData[role] = d;
        }
      }
    } catch(e) {}
  });
  return allData;
}

function convertSheetPlan(plan) {
  const data = {};
  if (plan.profile) Object.keys(plan.profile).forEach(k => { data[k] = plan.profile[k]; });
  // readGoals_ returns { areaName: [goals] } — convert to { areaName: { goals: [...] } }
  if (plan.goals) {
    const goalsObj = plan.goals.areas || plan.goals;
    const areas = {};
    Object.keys(goalsObj).forEach(area => {
      if (area === 'role') return; // skip metadata keys
      const val = goalsObj[area];
      if (Array.isArray(val)) {
        areas[area] = { goals: val };
      } else if (val && val.goals) {
        areas[area] = val;
      }
    });
    if (Object.keys(areas).length > 0) {
      data.areas = areas;
      data.selectedAreas = Object.keys(areas);
    }
  }
  if (plan.activities) data.activities = plan.activities;
  if (plan.evaluation) data.evaluation = plan.evaluation;
  return data;
}

function loadAllDataFromSheet() {
  return new Promise((resolve, reject) => {
    const cbName = '_jsonpCb_' + (++_jsonpCounter);
    const timeout = setTimeout(() => {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('JSONP timeout'));
    }, 12000);

    window[cbName] = function(response) {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      resolve(response);
    };

    const script = document.createElement('script');
    script.src = API_URL + '?action=getAllPlans&callback=' + cbName;
    script.onerror = function() {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('JSONP network error'));
    };
    document.head.appendChild(script);
  });
}

function getAllGoals(data) {
  const goals = [];
  Object.keys(data).forEach(role => {
    const d = data[role];
    if (d.areas) {
      Object.keys(d.areas).forEach(area => {
        (d.areas[area].goals || []).forEach(g => {
          goals.push({ ...g, role, area });
        });
      });
    }
  });
  return goals;
}

function getAllEvents(data) {
  const events = [];
  const goals = getAllGoals(data);
  goals.forEach(g => {
    (g.events || []).forEach(ev => {
      if (ev && (ev.date || ev.desc)) {
        events.push({ ...ev, role: g.role, area: g.area, goalWhat: g.what });
      }
    });
  });
  // Also check activities in trimester tables
  Object.keys(data).forEach(role => {
    const d = data[role];
    if (d.activities) {
      ['A','B','C'].forEach(trim => {
        (d.activities[trim] || []).forEach(act => {
          if (act.activity) {
            events.push({ desc: act.activity, role, month: act.month, fromTrimester: true });
          }
        });
      });
    }
  });
  return events;
}

function getEventMonth(ev) {
  if (ev.month) return ev.month;
  if (ev.date) {
    const d = new Date(ev.date);
    const monthNames = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
    return monthNames[d.getMonth()] || '';
  }
  return '';
}

function showSource(src) {
  const el = document.getElementById('dataSource');
  if (el) el.textContent = src;
}

function getAllActivities(data) {
  const activities = [];
  Object.keys(data).forEach(role => {
    const d = data[role];
    if (d.activities) {
      ['A','B','C'].forEach(trim => {
        (d.activities[trim] || []).forEach(act => {
          if (act.activity && act.activity.trim()) {
            activities.push({ ...act, role, trimester: trim, roleName: d.name || ROLE_LABELS[role] });
          }
        });
      });
    }
  });
  return activities;
}

function render(data) {
  const container = document.getElementById('dashContent');
  const roleCount = Object.keys(data).length;

  if (roleCount === 0) {
    container.innerHTML = '<div class="empty-state">' +
      '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>' +
      '<p>אין נתוני תכנון עדיין</p>' +
      '<p style="margin-top:8px"><a href="planning-form.html">מלאו את טופס התכנון</a> כדי לראות את הדשבורד</p>' +
      '</div>';
    return;
  }

  const allGoals = getAllGoals(data);
  const allActivities = getAllActivities(data);
  const allEvents = getAllEvents(data);
  const totalBudget = calcTotalBudget(data);
  const totalActivities = allActivities.length;
  const totalTasks = allActivities.reduce((sum, a) => sum + (a.tasks || []).length, 0);

  let html = '';

  // ============ SUMMARY CARDS ============
  html += '<div class="summary-grid">';
  html += summaryCard('rgba(58,172,160,.12)', 'var(--primary-dark)',
    '<svg viewBox="0 0 24 24" stroke="var(--primary-dark)"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    roleCount, 'בעלי תפקידים');
  html += summaryCard('rgba(142,126,212,.12)', '#5B4BA0',
    '<svg viewBox="0 0 24 24" stroke="#5B4BA0"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    allGoals.length, 'מטרות שנתיות');
  html += summaryCard('rgba(155,93,229,.12)', '#4A1D8C',
    '<svg viewBox="0 0 24 24" stroke="#4A1D8C"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
    totalActivities, 'פעילויות מתוכננות');
  html += summaryCard('rgba(232,176,96,.12)', '#7C4A0D',
    '<svg viewBox="0 0 24 24" stroke="#7C4A0D"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
    totalTasks, 'פעולות ביצוע');
  html += summaryCard('rgba(39,174,96,.12)', '#1E8449',
    '<svg viewBox="0 0 24 24" stroke="#1E8449"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>',
    totalBudget > 0 ? totalBudget.toLocaleString() + ' &#8362;' : 'לא הוגדר', 'תקציב כולל');
  html += '</div>';

  // ============ DETAILED ROLE SECTIONS ============
  Object.keys(data).forEach(role => {
    const d = data[role];
    const areas = d.selectedAreas || (d.areas ? Object.keys(d.areas) : []);
    const roleGoals = allGoals.filter(g => g.role === role);
    const roleActivities = allActivities.filter(a => a.role === role);
    const roleName = d.name || ROLE_LABELS[role];

    // Role colors
    const roleColors = {
      ravit: { bg: '#E0F5F5', text: '#1A5E5E', border: '#3AACA0' },
      yaakov: { bg: '#EDE0F7', text: '#4A1D8C', border: '#9B5DE5' },
      counselor: { bg: '#BFDBFE', text: '#1E3A5F', border: '#3B82F6' },
      ofira: { bg: '#FDF0D5', text: '#7C4A0D', border: '#D47A35' },
      homeroom: { bg: '#FDE0E0', text: '#7A1A1A', border: '#E05050' },
      mano: { bg: '#DDEEDD', text: '#1A5C1A', border: '#4CAF50' },
      yiska: { bg: '#FCE4EC', text: '#880E4F', border: '#EC407A' },
      dorit: { bg: '#E8EAF6', text: '#283593', border: '#5C6BC0' }
    };
    const rc = roleColors[role] || { bg: '#EDEAE3', text: '#2C2622', border: '#6E6258' };

    html += '<div class="role-section">';
    html += '<div class="role-section-header" style="background:' + rc.bg + ';border:1.5px solid ' + rc.border + ';border-right:5px solid ' + rc.border + '" onclick="toggleRoleSection(this)">';
    html += '<div class="role-section-name" style="color:' + rc.text + '">';
    html += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="' + rc.text + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="role-arrow"><polyline points="9 18 15 12 9 6"/></svg>';
    html += roleName + '</div>';
    html += '<div class="role-section-stats" style="color:' + rc.text + '">';
    html += '<div class="role-section-stat">' + areas.length + ' תחומים</div>';
    html += '<div class="role-section-stat">' + roleGoals.length + ' מטרות</div>';
    html += '<div class="role-section-stat">' + roleActivities.length + ' פעילויות</div>';
    if (d.hours) html += '<div class="role-section-stat">' + d.hours + ' ש"ש</div>';
    html += '</div></div>';

    html += '<div class="role-section-body" id="roleBody_' + role + '">';

    // Vision
    if (d.vision) {
      html += '<div style="background:rgba(58,172,160,.06);border-right:3px solid var(--primary);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:16px;font-size:13px;line-height:1.6;color:var(--text)">';
      html += '<div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px">חזון אישי לתפקיד</div>';
      html += d.vision + '</div>';
    }

    // Per-area breakdown with goals and linked activities
    if (d.areas) {
      Object.keys(d.areas).forEach(area => {
        const areaGoals = d.areas[area].goals || [];
        // Find activities linked to this area
        const areaActs = roleActivities.filter(a => a.area === area);
        const hasGoals = areaGoals.some(g => g.what && g.what.trim());

        html += '<div class="area-block">';
        html += '<div class="area-block-title">';
        html += '<div class="status-dot ' + (hasGoals ? 'status-green' : 'status-gray') + '"></div>';
        html += area;
        html += '<span class="area-count">' + areaGoals.length + ' מטרות, ' + areaActs.length + ' פעילויות</span>';
        html += '</div>';

        // Goals with full detail
        areaGoals.forEach((g, i) => {
          if (!g.what) return;
          html += '<div class="goal-detail">';
          html += '<div class="goal-detail-header"><div class="goal-detail-num">' + (i + 1) + '</div><div>' + g.what + '</div></div>';
          if (g.measures) html += '<div class="goal-detail-field"><strong>מדדים:</strong> ' + g.measures + '</div>';
          if (g.partners) html += '<div class="goal-detail-field"><strong>שותפים:</strong> ' + g.partners + '</div>';
          if (g.extra_needs) html += '<div class="goal-detail-field"><strong>צרכים נוספים:</strong> ' + g.extra_needs + '</div>';
          if (g.principle && PRINCIPLE_LABELS[g.principle]) {
            const pc = PRINCIPLE_COLORS[g.principle] || {};
            html += '<div class="goal-detail-principle" style="background:' + (pc.bg || '#eee') + ';color:' + (pc.color || '#333') + '">' + PRINCIPLE_LABELS[g.principle] + '</div>';
          }
          html += '</div>';
        });

        // Activities linked to this area
        if (areaActs.length > 0) {
          html += '<div style="margin-top:8px;margin-bottom:4px;font-size:12px;font-weight:700;color:var(--muted)">פעילויות בתחום:</div>';
          areaActs.forEach(act => {
            const trimLabel = act.trimester === 'A' ? "שליש א'" : act.trimester === 'B' ? "שליש ב'" : "שליש ג'";
            html += '<div class="dash-activity">';
            html += '<div class="dash-activity-header">';
            if (act.month) html += '<span class="dash-activity-month">' + act.month + '</span>';
            html += '<span style="font-size:11px;color:var(--muted)">' + trimLabel + '</span>';
            if (act.audience) html += '<span style="font-size:10px;color:var(--muted)">| ' + act.audience + '</span>';
            if (act.responsible) html += '<span style="font-size:10px;color:var(--muted)">| ' + act.responsible + '</span>';
            if (act.cost && act.cost !== '0') html += '<span style="font-size:10px;color:var(--muted)">| ' + act.cost + ' &#8362;</span>';
            html += '</div>';
            html += '<div class="dash-activity-desc">' + act.activity + '</div>';
            if (act.notes) html += '<div style="font-size:11px;color:var(--muted);margin-top:2px">' + act.notes + '</div>';

            // Sub-tasks
            if (act.tasks && act.tasks.length > 0) {
              html += '<div class="dash-task-list">';
              act.tasks.forEach(task => {
                const isDone = task.done;
                html += '<div class="dash-task' + (isDone ? ' dash-task-done' : '') + '">';
                html += '<div class="dash-task-check' + (isDone ? ' done' : '') + '">' + (isDone ? 'V' : '') + '</div>';
                html += (task.desc || '');
                if (task.responsible && task.responsible !== '-') html += ' <span style="color:var(--primary-dark);font-weight:600">(' + task.responsible + ')</span>';
                if (task.cost && task.cost !== '0') html += ' <span style="color:var(--muted)">' + task.cost + '&#8362;</span>';
                html += '</div>';
              });
              html += '</div>';
            }
            html += '</div>';
          });
        }

        html += '</div>'; // area-block
      });
    }

    // Activities not linked to any area
    const unlinkedActs = roleActivities.filter(a => !a.area || !areas.includes(a.area));
    if (unlinkedActs.length > 0) {
      html += '<div class="area-block">';
      html += '<div class="area-block-title"><div class="status-dot status-yellow"></div>פעילויות ללא תחום מוגדר<span class="area-count">' + unlinkedActs.length + '</span></div>';
      unlinkedActs.forEach(act => {
        const trimLabel = act.trimester === 'A' ? "שליש א'" : act.trimester === 'B' ? "שליש ב'" : "שליש ג'";
        html += '<div class="dash-activity">';
        html += '<div class="dash-activity-header">';
        if (act.month) html += '<span class="dash-activity-month">' + act.month + '</span>';
        html += '<span style="font-size:11px;color:var(--muted)">' + trimLabel + '</span>';
        if (act.responsible) html += '<span style="font-size:10px;color:var(--muted)">| ' + act.responsible + '</span>';
        html += '</div>';
        html += '<div class="dash-activity-desc">' + act.activity + '</div>';
        if (act.tasks && act.tasks.length > 0) {
          html += '<div class="dash-task-list">';
          act.tasks.forEach(task => {
            const isDone = task.done;
            html += '<div class="dash-task' + (isDone ? ' dash-task-done' : '') + '">';
            html += '<div class="dash-task-check' + (isDone ? ' done' : '') + '">' + (isDone ? 'V' : '') + '</div>';
            html += (task.desc || '');
            if (task.responsible && task.responsible !== '-') html += ' <span style="color:var(--primary-dark);font-weight:600">(' + task.responsible + ')</span>';
            html += '</div>';
          });
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    }

    // Evaluation summary if exists
    const evalFields = ['eval_a_success','eval_a_challenges','eval_b_success','eval_b_challenges','eval_c_success','eval_c_challenges'];
    const hasEval = evalFields.some(f => d[f] && d[f].trim());
    if (hasEval) {
      html += '<div class="eval-summary">';
      html += '<div class="eval-summary-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> רפלקציה</div>';
      const evals = [
        { label: "שליש א'", success: d.eval_a_success, challenges: d.eval_a_challenges, status: d.eval_a_status, score: d.eval_a_score },
        { label: "שליש ב'", success: d.eval_b_success, challenges: d.eval_b_challenges, status: d.eval_b_status, score: d.eval_b_score },
        { label: "שליש ג'", success: d.eval_c_success, challenges: d.eval_c_challenges, status: d.eval_c_status, score: d.eval_c_score }
      ];
      evals.forEach(ev => {
        if (!ev.success && !ev.challenges && !ev.status) return;
        html += '<div style="margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)">';
        html += '<div style="font-size:12px;font-weight:700;margin-bottom:4px">' + ev.label;
        if (ev.status) {
          const statusLabels = { on_track: 'במסלול', needs_adjustment: 'צריך התאמה', behind: 'בפיגור', exceeded: 'מעבר לציפיות' };
          const statusColors = { on_track: 'var(--success)', needs_adjustment: 'var(--warn)', behind: 'var(--danger)', exceeded: 'var(--primary)' };
          html += ' <span style="font-size:10px;padding:1px 8px;border-radius:10px;background:' + (statusColors[ev.status] || '#eee') + ';color:#fff">' + (statusLabels[ev.status] || '') + '</span>';
        }
        if (ev.score) html += ' <span style="font-size:10px;color:var(--muted)">ציון: ' + ev.score + '/10</span>';
        html += '</div>';
        if (ev.success) html += '<div class="eval-row"><div class="eval-row-label">הצלחות:</div><div class="eval-row-val">' + ev.success + '</div></div>';
        if (ev.challenges) html += '<div class="eval-row"><div class="eval-row-label">אתגרים:</div><div class="eval-row-val">' + ev.challenges + '</div></div>';
        html += '</div>';
      });
      html += '</div>';
    }

    html += '</div>'; // role-section-body
    html += '</div>'; // role-section
  });

  // ============ TIMELINE ============
  html += '<div class="dash-section">';
  html += '<div class="dash-section-title"><div class="sec-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>ציר זמן חודשי</div>';
  html += '<div class="dash-section-sub">כל האירועים והפעילויות מכל התפקידים, לפי חודש</div>';
  html += '<div class="timeline-wrap"><div class="timeline">';

  const monthEvents = {};
  MONTHS_ORDER.forEach(m => { monthEvents[m] = []; });
  allEvents.forEach(ev => {
    const m = getEventMonth(ev);
    if (monthEvents[m]) monthEvents[m].push(ev);
  });

  MONTHS_ORDER.forEach(m => {
    html += '<div class="timeline-month">';
    html += '<div class="timeline-month-name">' + m + '</div>';
    html += '<div class="timeline-events">';
    monthEvents[m].forEach(ev => {
      const desc = ev.desc || ev.activity || '';
      if (!desc) return;
      html += '<div class="timeline-pill role-color-' + (ev.role || 'ravit') + '" title="' + desc.replace(/"/g, '&quot;') + '">' + truncate(desc, 18) + '</div>';
    });
    if (monthEvents[m].length === 0) {
      html += '<div style="font-size:10px;color:var(--border);margin-top:16px">--</div>';
    }
    html += '</div></div>';
  });

  html += '</div></div></div>';

  // ============ WORKLOAD BAR CHART ============
  html += '<div class="dash-section">';
  html += '<div class="dash-section-title"><div class="sec-icon"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>מבט על עומסים</div>';
  html += '<div class="dash-section-sub">מספר אירועים בכל חודש -- ירוק: עד 5, צהוב: 6-10, אדום: 11+</div>';

  let maxEvents = 1;
  MONTHS_ORDER.forEach(m => { if (monthEvents[m].length > maxEvents) maxEvents = monthEvents[m].length; });

  html += '<div class="bar-chart">';
  MONTHS_ORDER.forEach(m => {
    const count = monthEvents[m].length;
    const heightPct = Math.max(5, (count / maxEvents) * 100);
    let barClass = 'bar-green';
    if (count > 10) barClass = 'bar-red';
    else if (count > 5) barClass = 'bar-yellow';
    html += '<div class="bar-col">';
    html += '<div class="bar-count">' + count + '</div>';
    html += '<div class="bar ' + barClass + '" style="height:' + heightPct + '%"></div>';
    html += '<div class="bar-label">' + m.substring(0, 3) + '</div>';
    html += '</div>';
  });
  html += '</div></div>';

  // ============ PRINCIPLES ============
  html += '<div class="dash-section">';
  html += '<div class="dash-section-title"><div class="sec-icon"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>לפי עקרון עבודה</div>';
  html += '<div class="dash-section-sub">כמה מטרות מחוברות לכל אחד מ-5 עקרונות העבודה</div>';

  const principleCount = {};
  Object.keys(PRINCIPLE_LABELS).forEach(p => { principleCount[p] = 0; });
  allGoals.forEach(g => {
    if (g.principle && principleCount[g.principle] !== undefined) {
      principleCount[g.principle]++;
    }
  });

  html += '<div class="principles-grid">';
  Object.keys(PRINCIPLE_LABELS).forEach(p => {
    const c = PRINCIPLE_COLORS[p];
    html += '<div class="principle-card" style="background:' + c.bg + ';border-right:4px solid ' + c.border + '">';
    html += '<div class="p-name" style="color:' + c.color + '">' + PRINCIPLE_LABELS[p] + '</div>';
    html += '<div class="p-count" style="color:' + c.color + '">' + principleCount[p] + '</div>';
    html += '<div class="p-label" style="color:' + c.color + '">מטרות מחוברות</div>';
    html += '</div>';
  });
  html += '</div></div>';

  container.innerHTML = html;
}

function summaryCard(iconBg, iconColor, iconSvg, value, label) {
  return '<div class="summary-card">' +
    '<div class="sc-icon" style="background:' + iconBg + '">' + iconSvg + '</div>' +
    '<div class="sc-num" style="color:' + iconColor + '">' + value + '</div>' +
    '<div class="sc-label">' + label + '</div></div>';
}

function calcTotalBudget(data) {
  let total = 0;
  Object.keys(data).forEach(role => {
    const d = data[role];
    // From global budget field
    if (d.budget && !isNaN(parseInt(d.budget))) {
      total += parseInt(d.budget);
    }
    // From goal-level budgets
    if (d.areas) {
      Object.keys(d.areas).forEach(area => {
        (d.areas[area].goals || []).forEach(g => {
          if (g.budget) {
            const num = parseInt(g.budget.replace(/[^\d]/g, ''));
            if (!isNaN(num)) total += num;
          }
        });
      });
    }
  });
  return total;
}

function truncate(str, len) {
  if (!str) return '';
  return str.length > len ? str.substring(0, len) + '...' : str;
}

function toggleRoleSection(header) {
  const body = header.nextElementSibling;
  body.classList.toggle('open');
  const arrow = header.querySelector('.role-arrow');
  if (arrow) arrow.style.transform = body.classList.contains('open') ? 'rotate(90deg)' : '';
}

// Initialize — try Sheet first, fallback to localStorage
document.addEventListener('DOMContentLoaded', function() {
  // Show loading state
  const container = document.getElementById('dashContent');
  container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted)"><div style="font-size:18px;font-weight:600;margin-bottom:8px">טוען נתונים מהענן...</div></div>';

  loadAllDataFromSheet()
    .then(response => {
      if (response && response.result === 'success' && response.plans) {
        const allData = {};
        Object.keys(response.plans).forEach(role => {
          const plan = response.plans[role];
          const converted = convertSheetPlan(plan);
          if (converted && (converted.areas || converted.name)) {
            allData[role] = converted;
            // Cache locally
            try { localStorage.setItem('planning_' + role, JSON.stringify(converted)); } catch(e) {}
          }
        });
        showSource('ענן');
        render(allData);
      } else {
        showSource('מקומי');
        render(loadAllDataLocal());
      }
    })
    .catch(err => {
      console.warn('Sheet load failed, using localStorage:', err);
      showSource('מקומי');
      render(loadAllDataLocal());
    });
});
</script>
</body>
</html>
