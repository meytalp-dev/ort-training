<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הזוג שלך לשיחה | אורט בית הערבה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Playpen+Sans+Hebrew:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00bcd4;
            --cyan-light: #e0f7fa;
            --pink: #ec407a;
            --pink-light: #fce4ec;
            --turquoise: #26a69a;
            --turquoise-light: #e0f2f1;
            --lavender: #b39ddb;
            --lavender-light: #ede7f6;
            --bg: #fafbfc;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-light: #718096;
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Assistant', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2, h3 { font-family: 'Playpen Sans Hebrew', 'Assistant', sans-serif; }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 40px 20px 32px;
            max-width: 600px;
        }

        .hero-icon {
            width: 64px; height: 64px;
            margin: 0 auto 16px;
            color: var(--turquoise);
        }

        .hero h1 {
            font-size: 1.6rem;
            color: var(--text-light);
            font-weight: 400;
            margin-bottom: 8px;
        }

        .partner-name {
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--turquoise);
            margin-bottom: 4px;
        }

        .partner-role {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 24px;
        }

        .pair-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            border-radius: 50px;
            padding: 12px 28px;
            box-shadow: var(--shadow);
            font-size: 1rem;
            color: var(--text);
        }

        .pair-badge .you { font-weight: 700; color: var(--pink); }
        .pair-badge .and { color: var(--text-light); font-size: 0.9rem; }
        .pair-badge .them { font-weight: 700; color: var(--turquoise); }

        /* Instructions */
        .instructions {
            text-align: center;
            max-width: 500px;
            margin: 24px auto 32px;
            padding: 20px;
            background: var(--turquoise-light);
            border-radius: var(--radius);
        }

        .instructions h2 {
            font-size: 1.2rem;
            color: var(--turquoise);
            margin-bottom: 8px;
        }

        .instructions p {
            font-size: 1rem;
            color: var(--text);
            line-height: 1.6;
        }

        /* Card Deck */
        .card-deck {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 0 16px;
            perspective: 1000px;
        }

        .flip-card {
            height: 200px;
            cursor: pointer;
            perspective: 1000px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .flip-card-front {
            background: linear-gradient(135deg, var(--cyan), var(--turquoise));
            color: white;
        }

        .flip-card-front .card-icon { width: 40px; height: 40px; margin-bottom: 10px; opacity: 0.9; }
        .flip-card-front .card-label { font-family: 'Playpen Sans Hebrew', sans-serif; font-size: 1rem; font-weight: 700; }
        .flip-card-front .card-number { font-size: 1.6rem; font-weight: 700; font-family: 'Playpen Sans Hebrew', sans-serif; opacity: 0.25; position: absolute; bottom: 10px; left: 14px; }

        .flip-card-back {
            background: var(--card-bg);
            transform: rotateY(180deg);
            text-align: center;
            border: 2px solid var(--cyan-light);
        }

        .flip-card-back .card-category { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--turquoise); margin-bottom: 8px; padding: 3px 10px; border-radius: 20px; background: var(--turquoise-light); }
        .flip-card-back .card-question { font-size: 0.95rem; line-height: 1.55; color: var(--text); font-weight: 500; }

        .flip-card:nth-child(4n+1) .flip-card-front { background: linear-gradient(135deg, var(--cyan), var(--turquoise)); }
        .flip-card:nth-child(4n+2) .flip-card-front { background: linear-gradient(135deg, var(--pink), #f48fb1); }
        .flip-card:nth-child(4n+3) .flip-card-front { background: linear-gradient(135deg, var(--lavender), #9575cd); }
        .flip-card:nth-child(4n+4) .flip-card-front { background: linear-gradient(135deg, var(--turquoise), #66bb6a); }

        .flip-card:nth-child(4n+2) .flip-card-back { border-color: var(--pink-light); }
        .flip-card:nth-child(4n+3) .flip-card-back { border-color: var(--lavender-light); }
        .flip-card:nth-child(4n+4) .flip-card-back { border-color: var(--turquoise-light); }

        .flip-card.flipped { cursor: default; }
        .flip-card:not(.flipped):hover .flip-card-inner { transform: rotateY(8deg); }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: var(--shadow); }
            50% { box-shadow: 0 4px 25px rgba(0,188,212,0.25); }
        }

        .flip-card:not(.flipped) { animation: pulseGlow 2.5s ease-in-out infinite; }
        .flip-card:nth-child(2n):not(.flipped) { animation-delay: 0.4s; }
        .flip-card:nth-child(3n):not(.flipped) { animation-delay: 0.8s; }

        /* Timer */
        .timer-section { text-align: center; margin: 40px 0 24px; }
        .timer-display { font-size: 3rem; font-weight: 700; font-family: 'Playpen Sans Hebrew', sans-serif; color: var(--turquoise); margin-bottom: 12px; }
        .timer-buttons { display: flex; gap: 12px; justify-content: center; }
        .btn-timer { padding: 10px 24px; font-size: 1rem; font-family: 'Assistant', sans-serif; font-weight: 600; border-radius: 50px; cursor: pointer; border: none; transition: all 0.3s ease; }
        .btn-timer.start { background: var(--turquoise); color: white; }
        .btn-timer.pause { background: var(--pink); color: white; }
        .btn-timer.reset { background: var(--card-bg); color: var(--text-light); border: 2px solid #e0e0e0; }
        .btn-timer:hover { transform: translateY(-1px); }

        /* Error state */
        .error-state {
            text-align: center;
            padding: 80px 20px;
            display: none;
        }

        .error-state h2 { color: var(--pink); margin-bottom: 12px; }
        .error-state p { color: var(--text-light); font-size: 1.1rem; }

        @media (max-width: 600px) {
            .partner-name { font-size: 1.8rem; }
            .card-deck { grid-template-columns: repeat(2, 1fr); }
            .timer-display { font-size: 2.2rem; }
            .pair-badge { flex-direction: column; gap: 4px; padding: 12px 20px; }
        }
    </style>
</head>
<body>

<div class="error-state" id="errorState">
    <h2>הקישור לא תקין</h2>
    <p>לא נמצא משתתף עם המזהה הזה. בדקו שקיבלתם את הקישור הנכון.</p>
</div>

<div id="mainContent" style="display:none;width:100%;max-width:900px">
    <div class="hero">
        <svg class="hero-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <h1>הזוג שלך לשיחה</h1>
        <div class="partner-name" id="partnerName"></div>
        <div class="partner-role" id="partnerRole"></div>
        <div class="pair-badge">
            <span class="you" id="youName"></span>
            <span class="and">&</span>
            <span class="them" id="themName"></span>
        </div>
    </div>

    <div class="instructions">
        <h2>איך זה עובד?</h2>
        <p>לחצו על קלף כדי לחשוף שאלה. ענו עליה ביחד ואז שלפו עוד אחד. אין סדר — פשוט תהנו מהשיחה.</p>
    </div>

    <div class="card-deck" id="cardDeck"></div>

    <div class="timer-section">
        <div class="timer-display" id="timerDisplay">20:00</div>
        <div class="timer-buttons">
            <button class="btn-timer start" id="btnStart" onclick="toggleTimer()">התחל</button>
            <button class="btn-timer reset" onclick="resetTimer()">אפס</button>
        </div>
    </div>
</div>

<script>
// ============================================
// Fixed Pairs — הגרלה קבועה
// ============================================

const PAIRS = [
    [
        { id: 1, name: 'אושר אהרוני', role: 'מחנכת ט2' },
        { id: 2, name: 'דורית ויגדור מועלם', role: 'יועצת יב' }
    ],
    [
        { id: 3, name: 'אושרת אסור', role: 'מזכירת מש"א' },
        { id: 4, name: 'גיא נתנאל', role: 'מחנך יא3 / רכז שכבה' }
    ],
    [
        { id: 5, name: 'שי בגלר', role: 'מורה מחשבים' },
        { id: 6, name: 'שרה מרציאנו', role: 'עובדת סוציאלית' }
    ],
    [
        { id: 7, name: 'ליאת בנבג\'י רוזנר', role: 'יועצת יא' },
        { id: 8, name: 'משה צברי', role: 'מחנך ט1' }
    ],
    [
        { id: 9, name: 'אפרת בר אשר', role: 'מורה לשון' },
        { id: 10, name: 'אליאל קוסקאס', role: 'מורה מקצועי' }
    ],
    [
        { id: 11, name: 'יעקב גרונספלד', role: 'מחנך יא1 / רכז חברתי' },
        { id: 12, name: 'ויקטוריה קלדרון', role: 'מורה מקצועי' }
    ],
    [
        { id: 13, name: 'מנו דהאן', role: 'מחנך יב3' },
        { id: 14, name: 'פרלה שאזו', role: 'מחנכת י3' }
    ],
    [
        { id: 15, name: 'יסכה הגר', role: 'רכזת נשירה וטיפול' },
        { id: 16, name: 'לינוי בנג\'י', role: 'רכזת חניכות ותעסוקה' }
    ],
    [
        { id: 17, name: 'רעיה יצחקי', role: 'מחנכת י1' },
        { id: 18, name: 'יוסף רבבשי', role: 'מחנך יב1' }
    ],
    [
        { id: 19, name: 'מיטל לאלום', role: 'מזכירה' },
        { id: 20, name: 'נעמה קוסטן', role: 'מחנכת יא2' }
    ],
    [
        { id: 21, name: 'צהיי ממו גטהון', role: 'יועצת יב' },
        { id: 22, name: 'אהוד פרידס', role: 'אב בית' }
    ]
];

// ============================================
// Questions
// ============================================

const CARD_QUESTIONS = [
    { cat: 'חימום', q: 'על סולם של 1 עד "כבר שכחתי מה זה שגרה" — איפה את/ה היום?' },
    { cat: 'חימום', q: 'מה הדבר הכי נורמלי שעשית השבוע שפתאום הרגיש כמו הישג?' },
    { cat: 'חימום', q: 'אם היית מתאר/ת את התקופה הזו כסרט — מה הז\'אנר? קומדיה? מותחן? דוקו?' },
    { cat: 'חימום', q: 'מה הסדרה / השיר / הממ שהציל אותך בתקופה הזו?' },
    { cat: 'מה מחזיק', q: 'מה הדבר הקטן שמחזיק אותך? (קפה? שיר? מישהו? סדרה? שוקולד?)' },
    { cat: 'מה מחזיק', q: 'מה הרגע בעבודה שהזכיר לך למה את/ה עושה את זה — גם כשהכל הפוך?' },
    { cat: 'מה מחזיק', q: 'מה כוח-על שלא ידעת שיש לך, שהתגלה דווקא בתקופה הזו?' },
    { cat: 'מה מחזיק', q: 'מה ההרגל החדש שנולד בתקופה הזו שאת/ה דווקא רוצה לשמור?' },
    { cat: 'ביחד', q: 'מה הדבר שהכי קשה באי-הוודאות? ומה דווקא הפתיע לטובה?' },
    { cat: 'ביחד', q: 'ספר/י על רגע עם תלמיד/ה שהזכיר לך שיש בשביל מי לקום בבוקר' },
    { cat: 'ביחד', q: 'אם היית כותב/ת מכתב לעצמך של תחילת השנה — מה היית כותב/ת?' },
    { cat: 'ביחד', q: 'מה דבר אחד שלמדת על עצמך שלא היית לומד/ת בשנה רגילה?' },
    { cat: 'ביחד', q: 'אם הייתם כותבים ביוגרפיה על השנה — מה שם הפרק שלכם?' },
    { cat: 'חיזוק', q: 'תגיד/י לבן/בת הזוג שלך דבר אחד שאת/ה מעריך/ה — בלי להתבייש' },
    { cat: 'חיזוק', q: 'מה דבר קטן שמישהו בצוות עשה בשבילך ועשה לך את היום?' },
    { cat: 'חיזוק', q: 'מתי בפעם האחרונה צחקת ממש מהבטן בעבודה? ספר/י!' },
    { cat: 'חיזוק', q: 'סיימו במשפט: "מה שאני לוקח/ת מהשיחה הזו הוא..."' },
    { cat: 'חיזוק', q: 'מה הדבר שהכי מטעין אותך? ומה שואב אנרגיה? (תשובות כנות מותרות)' },
];

const CARD_ICONS = {
    'חימום': '<svg xmlns="http://www.w3.org/2000/svg" class="card-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>',
    'מה מחזיק': '<svg xmlns="http://www.w3.org/2000/svg" class="card-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
    'ביחד': '<svg xmlns="http://www.w3.org/2000/svg" class="card-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    'חיזוק': '<svg xmlns="http://www.w3.org/2000/svg" class="card-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
};

// ============================================
// Init
// ============================================

function init() {
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id'));

    if (!id) {
        document.getElementById('errorState').style.display = 'block';
        return;
    }

    // Find this person and their partner
    let me = null, partner = null;
    for (const pair of PAIRS) {
        for (let i = 0; i < pair.length; i++) {
            if (pair[i].id === id) {
                me = pair[i];
                partner = pair[1 - i];
                break;
            }
        }
        if (me) break;
    }

    if (!me || !partner) {
        document.getElementById('errorState').style.display = 'block';
        return;
    }

    // Show content
    document.getElementById('mainContent').style.display = 'flex';
    document.getElementById('mainContent').style.flexDirection = 'column';
    document.getElementById('mainContent').style.alignItems = 'center';

    document.getElementById('partnerName').textContent = partner.name;
    document.getElementById('partnerRole').textContent = partner.role;
    document.getElementById('youName').textContent = me.name;
    document.getElementById('themName').textContent = partner.name;
    document.title = 'הזוג שלך: ' + partner.name + ' | אורט בית הערבה';

    buildCardDeck();
}

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function buildCardDeck() {
    const deck = document.getElementById('cardDeck');
    deck.innerHTML = '';
    const shuffled = shuffle(CARD_QUESTIONS);

    shuffled.forEach((card, idx) => {
        const el = document.createElement('div');
        el.className = 'flip-card';
        el.onclick = function() { this.classList.add('flipped'); };
        el.innerHTML = `
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    ${CARD_ICONS[card.cat] || ''}
                    <div class="card-label">לחצו לחשיפה</div>
                    <div class="card-number">${idx + 1}</div>
                </div>
                <div class="flip-card-back">
                    <div class="card-category">${card.cat}</div>
                    <div class="card-question">${card.q}</div>
                </div>
            </div>
        `;
        deck.appendChild(el);
    });
}

// Timer
let timerSeconds = 20 * 60;
let timerInterval = null;
let timerRunning = false;

function updateTimerDisplay() {
    const m = Math.floor(timerSeconds / 60);
    const s = timerSeconds % 60;
    document.getElementById('timerDisplay').textContent =
        String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function toggleTimer() {
    const btn = document.getElementById('btnStart');
    if (timerRunning) {
        clearInterval(timerInterval);
        timerRunning = false;
        btn.textContent = 'המשך';
        btn.className = 'btn-timer start';
    } else {
        timerRunning = true;
        btn.textContent = 'עצור';
        btn.className = 'btn-timer pause';
        timerInterval = setInterval(() => {
            timerSeconds--;
            if (timerSeconds <= 0) {
                clearInterval(timerInterval);
                timerRunning = false;
                timerSeconds = 0;
                btn.textContent = 'התחל';
                btn.className = 'btn-timer start';
                document.getElementById('timerDisplay').style.color = '#ec407a';
            }
            updateTimerDisplay();
        }, 1000);
    }
}

function resetTimer() {
    clearInterval(timerInterval);
    timerRunning = false;
    timerSeconds = 20 * 60;
    updateTimerDisplay();
    document.getElementById('timerDisplay').style.color = '';
    document.getElementById('btnStart').textContent = 'התחל';
    document.getElementById('btnStart').className = 'btn-timer start';
}

init();
</script>

</body>
</html>
