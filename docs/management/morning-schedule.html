<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח פתיחות בוקר — אורט בית הערבה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Playpen+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dream: #E8D5F5;
    --dream-deep: #C9A8E8;
    --create: #D5EDE2;
    --create-deep: #8FCDB0;
    --lead: #F5E6D0;
    --lead-deep: #E8C9A0;
    --rose: #F5D5DE;
    --rose-deep: #E8A8B8;
    --sky: #D5E5F5;
    --sky-deep: #A0C4E8;
    --belong: #F5D5DE;
    --belong-deep: #E06090;
    --white: #FEFEFE;
    --cream: #FBF9F6;
    --text: #2D2A3E;
    --text-light: #6B6880;
    --text-muted: #9B98A8;
    --shadow-sm: 0 2px 8px rgba(45,42,62,0.06);
    --shadow-md: 0 4px 20px rgba(45,42,62,0.08);
    --shadow-lg: 0 8px 40px rgba(45,42,62,0.12);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Heebo', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  .page {
    max-width: 940px;
    margin: 0 auto;
    background: var(--white);
    border-radius: 24px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    position: relative;
  }

  .page::before {
    content: '';
    position: absolute;
    top: -60px;
    left: -60px;
    width: 200px;
    height: 200px;
    background: var(--dream);
    border-radius: 50%;
    opacity: 0.3;
    z-index: 0;
  }
  .page::after {
    content: '';
    position: absolute;
    bottom: -40px;
    right: -40px;
    width: 160px;
    height: 160px;
    background: var(--create);
    border-radius: 50%;
    opacity: 0.3;
    z-index: 0;
  }

  .header {
    position: relative;
    z-index: 1;
    padding: 40px 40px 24px;
    text-align: center;
    background: linear-gradient(135deg, var(--dream) 0%, var(--sky) 50%, var(--create) 100%);
  }

  .header h1 {
    font-family: 'Playpen Sans Hebrew', cursive;
    font-size: 2rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }

  .header .subtitle {
    font-size: 1rem;
    color: var(--text-light);
    font-weight: 400;
  }

  .header .period {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 20px;
    background: rgba(255,255,255,0.7);
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text);
    backdrop-filter: blur(8px);
  }

  .content {
    position: relative;
    z-index: 1;
    padding: 28px 32px 36px;
  }

  /* Month section */
  .month-section {
    margin-bottom: 36px;
  }

  .month-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .month-name {
    font-family: 'Playpen Sans Hebrew', cursive;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text);
  }

  .dim-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 500;
  }

  .dim-capable { background: var(--lead); color: #8B6914; }
  .dim-auto { background: var(--create); color: #2D6B4A; }
  .dim-belong { background: var(--belong); color: #B03060; }

  /* Calendar grid */
  .calendar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .day-header {
    text-align: center;
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--text-muted);
    padding: 8px 4px;
    letter-spacing: 0.5px;
  }

  .day-cell {
    background: var(--cream);
    border-radius: var(--radius-sm);
    padding: 10px 8px;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: all 0.2s ease;
    border: 2px solid transparent;
    position: relative;
  }

  .day-cell:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .day-cell.today {
    border-color: var(--dream-deep);
    background: linear-gradient(135deg, #F5EEFA, #EDE5F8);
  }

  .day-cell.past {
    opacity: 0.5;
  }

  .day-cell.holiday {
    background: var(--rose);
    opacity: 0.7;
  }

  .day-cell.empty {
    background: transparent;
    min-height: auto;
  }

  .day-cell.empty:hover {
    transform: none;
    box-shadow: none;
  }

  .day-date {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-bottom: 3px;
    font-weight: 500;
  }

  .day-num {
    font-family: 'Playpen Sans Hebrew', cursive;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    margin-bottom: 5px;
  }

  .day-cell.holiday .day-num {
    color: var(--rose-deep);
  }

  .staff-name {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .holiday-label {
    font-size: 0.75rem;
    color: #B85070;
    font-weight: 500;
    line-height: 1.3;
  }

  .today-dot {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 8px;
    height: 8px;
    background: var(--dream-deep);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.3); }
  }

  /* Legend */
  .legend {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    margin-top: 8px;
    padding-top: 20px;
    border-top: 1px solid #EDE9F0;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--text-light);
  }

  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  /* Share bar */
  .share-bar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .share-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    border-radius: 12px;
    border: 1.5px solid #EDE9F0;
    background: var(--white);
    font-family: 'Heebo', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
  }

  .share-btn:hover {
    border-color: var(--dream-deep);
    color: var(--dream-deep);
    background: #FAF5FF;
  }

  .share-btn svg { width: 16px; height: 16px; }

  /* Footer */
  .footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 16px 32px 28px;
    color: var(--text-muted);
    font-size: 0.78rem;
    line-height: 1.6;
  }

  .footer a {
    color: var(--dream-deep);
    text-decoration: none;
    font-weight: 500;
  }

  .reminder-note {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--dream);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 0.85rem;
    color: var(--text);
    font-weight: 500;
    margin-bottom: 12px;
  }

  .reminder-note svg { flex-shrink: 0; }

  /* Print styles */
  @media print {
    body { padding: 0; background: white; }
    .page { box-shadow: none; border-radius: 0; }
    .share-bar { display: none !important; }
    .day-cell:hover { transform: none; box-shadow: none; }
    .day-cell.past { opacity: 0.7; }
  }

  /* Responsive */
  @media (max-width: 640px) {
    body { padding: 12px; }
    .header { padding: 28px 20px 20px; }
    .header h1 { font-size: 1.5rem; }
    .content { padding: 20px 16px 28px; }
    .calendar { gap: 4px; }
    .day-cell { padding: 8px 4px; min-height: 70px; }
    .day-num { font-size: 1.1rem; }
    .staff-name { font-size: 0.72rem; }
    .legend { gap: 14px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <h1>פתיחות בוקר</h1>
    <div class="subtitle">אורט בית הערבה -- לוח שיבוצים לצוות</div>
    <div class="period">אפריל -- יוני 2026</div>
  </div>

  <div class="content">

    <!-- Share buttons -->
    <div class="share-bar" id="shareBar">
      <button class="share-btn" onclick="sharePrint()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        הדפסה
      </button>
      <button class="share-btn" onclick="shareWhatsApp()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
        שיתוף בוואטסאפ
      </button>
      <button class="share-btn" onclick="copyLink()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
        העתקת קישור
      </button>
    </div>

    <div id="calendarContainer"></div>

    <!-- Legend & Note -->
    <div class="reminder-note">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
      תזכורת אוטומטית מגיעה ב-WhatsApp יום לפני התורנות
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--lead);"></div>
        <span>מסוגלות ומימוש עצמי (אפריל)</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--create);"></div>
        <span>אוטונומיה (מאי)</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--belong);"></div>
        <span>שייכות (יוני)</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--rose);"></div>
        <span>חג / אין לימודים</span>
      </div>
    </div>
  </div>

  <div class="footer">
    כל בוקר 8:10 | 8 דקות | פעילות צוותית
    <br>
    <a href="https://meytalp-dev.github.io/ort-presentation-builder/docs/management/morning-opening.html">תיעוד ובנק רעיונות</a>
  </div>
</div>

<script>
// ========== SCHEDULE DATA ==========
const SCHEDULE = [
  {d:'2026-04-09',n:'אושר אהרוני'},
  {d:'2026-04-12',n:'שי בגלר'},
  {d:'2026-04-13',n:'ליאת רוזנר'},
  {d:'2026-04-14',n:'אפרת בר אשר'},
  {d:'2026-04-15',n:'רווית גל'},
  {d:'2026-04-16',n:'יעקב גרונספלד'},
  {d:'2026-04-19',n:'עמנואל דהאן'},
  {d:'2026-04-20',n:'יסכה הגר'},
  {d:'2026-04-23',n:'מריאן זרצקי'},
  {d:'2026-04-26',n:'יעל טטנבאום'},
  {d:'2026-04-27',n:'רעיה יצחקי'},
  {d:'2026-04-28',n:'מיטל לאלום'},
  {d:'2026-04-29',n:'אופירה מלכה'},
  {d:'2026-04-30',n:'גיא נתנאל'},
  {d:'2026-05-03',n:'משה צברי'},
  {d:'2026-05-04',n:'נעמה קוסטן'},
  {d:'2026-05-05',n:'ויקטוריה קלדרון'},
  {d:'2026-05-06',n:'יוסף רבבשי'},
  {d:'2026-05-07',n:'יואב רוט'},
  {d:'2026-05-10',n:'פרלה שאזו'},
  {d:'2026-05-11',n:'מיטל פלג'},
  {d:'2026-05-12',n:'אושר אהרוני'},
  {d:'2026-05-13',n:'שי בגלר'},
  {d:'2026-05-14',n:'מירב בטיטו'},
  {d:'2026-05-17',n:'ליאת רוזנר'},
  {d:'2026-05-18',n:'אפרת בר אשר'},
  {d:'2026-05-19',n:'רווית גל'},
  {d:'2026-05-20',n:'יעקב גרונספלד'},
  {d:'2026-05-21',n:'עמנואל דהאן'},
  {d:'2026-05-24',n:'יסכה הגר'},
  {d:'2026-05-25',n:'דורית ויגדור'},
  {d:'2026-05-26',n:'מריאן זרצקי'},
  {d:'2026-05-27',n:'יעל טטנבאום'},
  {d:'2026-05-28',n:'מיטל לאלום'},
  {d:'2026-05-31',n:'אופירה מלכה'},
  {d:'2026-06-01',n:'צהיי גטהון'},
  {d:'2026-06-02',n:'גיא נתנאל'},
  {d:'2026-06-03',n:'משה צברי'},
  {d:'2026-06-04',n:'נעמה קוסטן'},
  {d:'2026-06-07',n:'ויקטוריה קלדרון'},
  {d:'2026-06-08',n:'יוסף רבבשי'},
  {d:'2026-06-09',n:'יואב רוט'},
  {d:'2026-06-10',n:'פרלה שאזו'},
  {d:'2026-06-11',n:'מיטל פלג'},
  {d:'2026-06-14',n:'אושר אהרוני'},
  {d:'2026-06-15',n:'שי בגלר'},
  {d:'2026-06-16',n:'מירב בטיטו'},
  {d:'2026-06-17',n:'ליאת רוזנר'},
  {d:'2026-06-18',n:'אפרת בר אשר'}
];

const HOLIDAYS = {
  '2026-04-21': 'יום הזיכרון',
  '2026-04-22': 'יום העצמאות'
};

const MONTHS = [
  { key: '2026-04', name: 'אפריל', dim: 'מסוגלות ומימוש עצמי', dimClass: 'dim-capable',
    icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',
    firstDay: [2026, 3, 1], lastDay: [2026, 3, 30] },
  { key: '2026-05', name: 'מאי', dim: 'אוטונומיה', dimClass: 'dim-auto',
    icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>',
    firstDay: [2026, 4, 1], lastDay: [2026, 4, 31] },
  { key: '2026-06', name: 'יוני', dim: 'שייכות', dimClass: 'dim-belong',
    icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>',
    firstDay: [2026, 5, 1], lastDay: [2026, 5, 19] }
];

const DAY_NAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי'];
const DAY_SHORT = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳'];

function toDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getScheduleEntry(dateStr) {
  return SCHEDULE.find(function(s) { return s.d === dateStr; });
}

function render() {
  var container = document.getElementById('calendarContainer');
  var today = new Date();
  today.setHours(0,0,0,0);
  var todayStr = toDateStr(today);

  var html = '';

  for (var mi = 0; mi < MONTHS.length; mi++) {
    var month = MONTHS[mi];
    var firstDay = new Date(month.firstDay[0], month.firstDay[1], month.firstDay[2]);
    var lastDay = new Date(month.lastDay[0], month.lastDay[1], month.lastDay[2]);

    html += '<div class="month-section">';
    html += '<div class="month-header">';
    html += '<span class="month-name">' + month.name + '</span>';
    html += '<span class="dim-badge ' + month.dimClass + '">' + month.icon + ' ' + month.dim + '</span>';
    html += '</div>';
    html += '<div class="calendar">';

    // Day headers
    for (var h = 0; h < DAY_NAMES.length; h++) {
      html += '<div class="day-header">' + DAY_NAMES[h] + '</div>';
    }

    // Offset for first day of month
    var startDow = firstDay.getDay();
    // Only show offset for Sun(0)-Thu(4), if starts on Fri/Sat skip
    if (startDow <= 4) {
      for (var e = 0; e < startDow; e++) {
        html += '<div class="day-cell empty"></div>';
      }
    }

    var d = new Date(firstDay);
    while (d <= lastDay) {
      var dow = d.getDay();
      var dateStr = toDateStr(d);
      var dayNum = d.getDate();

      if (dow >= 0 && dow <= 4) {
        var isToday = dateStr === todayStr;
        var isPast = d < today && !isToday;
        var holiday = HOLIDAYS[dateStr];
        var entry = getScheduleEntry(dateStr);

        var cellClass = 'day-cell';
        if (isToday) cellClass += ' today';
        if (isPast) cellClass += ' past';
        if (holiday) cellClass += ' holiday';

        html += '<div class="' + cellClass + '">';
        if (isToday) html += '<div class="today-dot"></div>';
        html += '<div class="day-date">יום ' + DAY_SHORT[dow] + '</div>';
        html += '<div class="day-num">' + dayNum + '</div>';

        if (holiday) {
          html += '<div class="holiday-label">' + holiday + '</div>';
        } else if (entry) {
          html += '<div class="staff-name">' + entry.n + '</div>';
        }
        html += '</div>';
      }

      // Advance: after Thursday skip weekend
      if (dow === 4) {
        d.setDate(d.getDate() + 3);
      } else if (dow === 5) {
        d.setDate(d.getDate() + 2);
      } else if (dow === 6) {
        d.setDate(d.getDate() + 1);
      } else {
        d.setDate(d.getDate() + 1);
      }
    }

    html += '</div></div>';
  }

  container.innerHTML = html;
}

// ========== SHARE FUNCTIONS ==========
function sharePrint() {
  window.print();
}

function shareWhatsApp() {
  var today = new Date();
  var lines = ['*לוח פתיחות בוקר -- אורט בית הערבה*', ''];

  // Next 10 upcoming entries
  var upcoming = SCHEDULE.filter(function(s) {
    var parts = s.d.split('-');
    var date = new Date(+parts[0], +parts[1]-1, +parts[2]);
    return date >= new Date(today.getFullYear(), today.getMonth(), today.getDate());
  }).slice(0, 10);

  if (upcoming.length > 0) {
    lines.push('השבועות הקרובים:');
    for (var i = 0; i < upcoming.length; i++) {
      var parts = upcoming[i].d.split('-');
      var date = new Date(+parts[0], +parts[1]-1, +parts[2]);
      var dow = DAY_NAMES[date.getDay()];
      lines.push(dow + ' ' + parts[2].replace(/^0/,'') + '.' + parts[1].replace(/^0/,'') + ' - ' + upcoming[i].n);
    }
  }

  lines.push('', 'לוח מלא:');
  lines.push(location.href);

  var text = encodeURIComponent(lines.join('\n'));
  window.open('https://api.whatsapp.com/send?text=' + text, '_blank');
}

function copyLink() {
  var btn = event.target.closest('.share-btn');
  navigator.clipboard.writeText(location.href).then(function() {
    var orig = btn.innerHTML;
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> הועתק!';
    setTimeout(function() { btn.innerHTML = orig; }, 2000);
  });
}

// Render
render();
</script>
