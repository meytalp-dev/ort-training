<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>שיחות יחד — מורה ותלמיד | אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Dream Theme — לחלום.ליצור.להוביל */
  --dream:#8E7ED4;--dream-light:#D4CEF0;--dream-dark:#5B4BA0;
  --create:#E8B060;--create-light:#F5DEB0;--create-dark:#D48A2C;
  --lead:#3AACA0;--lead-light:#B8E4DE;--lead-dark:#1B7A6E;
  --spark:#E8909C;--spark-dark:#D45C6E;
  --bg:#fff;--bg-alt:#FAFBFC;--card:#fff;
  --text:#2C2622;--text-light:#6E6258;--text-lighter:#8C7E72;--muted:#6E6258;
  --border:#EDE6D8;--border-light:#fff;
  --primary:#3AACA0;--primary-dark:#1B7A6E;--primary-light:#B8E4DE;
  --accent:#E8B060;--accent-dark:#D48A2C;
  --success:#4CAF50;--success-bg:#E8F5E9;--warn:#E8B060;--warn-bg:#FFF3E0;
  --danger:#D45C6E;--danger-bg:#FCE7EA;--info:#5B9BD5;--info-bg:#E6F0FA;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 8px rgba(44,38,34,.05);--shadow-sm:0 2px 8px rgba(44,38,34,.05);
  --shadow-md:0 6px 20px rgba(44,38,34,.08);--shadow-lg:0 12px 40px rgba(44,38,34,.1);
  --dim-belong:#e84393;--dim-respect:#00b4d8;--dim-motiv:#f59e0b;--dim-capable:#6c5ce7;--dim-auto:#00cec9;
}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);color:var(--text);background:var(--bg-alt);line-height:1.7;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0;position:relative;overflow-x:hidden}
h1,h2,h3,h4,h5,h6,.card-title,.section-title,.header-title{font-family:'Playpen Sans Hebrew','Heebo',sans-serif;font-weight:700}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.04) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.04) 0%,transparent 70%),
    radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.03) 0%,transparent 70%);
  pointer-events:none;z-index:0}
.shape{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.shape-1{width:250px;height:250px;background:rgba(0,180,216,.03);top:-50px;right:-60px;animation:floatShape 12s ease-in-out infinite}
.shape-2{width:200px;height:200px;background:rgba(232,67,147,.03);bottom:-40px;left:-50px;animation:floatShape 10s ease-in-out infinite;animation-delay:3s}
.shape-3{width:140px;height:140px;background:rgba(0,206,201,.04);top:40%;left:10%;animation:floatShape 14s ease-in-out infinite;animation-delay:5s;border-radius:30%}
@keyframes floatShape{0%,100%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(15px,-20px) rotate(5deg)}50%{transform:translate(-10px,15px) rotate(-3deg)}75%{transform:translate(20px,10px) rotate(4deg)}}

/* HEADER */
.main-header{
  position:sticky;top:0;z-index:100;width:100%;
  background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
}
.main-header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--dream),var(--create-dark),var(--lead-dark)))}
.header-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 24px}
.header-right{display:flex;align-items:center;gap:12px}
.learni-logo{display:flex;align-items:center;gap:6px;text-decoration:none}
.learni-logo svg{width:22px;height:22px}
.learni-logo span{font-family:var(--font-body);font-size:.85rem;font-weight:800;color:var(--text)}
.header-title{font-family:var(--font-heading);font-size:.95rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.header-title svg{width:18px;height:18px;color:var(--primary)}

/* PROGRESS */
.progress-wrap{position:sticky;top:56px;z-index:99;width:100%;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.04);padding:10px 24px;display:none}
.progress-wrap.visible{display:block}
.progress-inner{max-width:680px;margin:0 auto}
.progress-label{font-size:.78rem;font-weight:600;color:var(--text-lighter);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.progress-label .section-name{color:var(--text);font-weight:700}
.progress-track{height:5px;background:rgba(0,0,0,.06);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s ease,background .3s ease;width:0}

/* CONTAINER */
.container{max-width:680px;width:100%;margin:0 auto;padding:24px;position:relative;z-index:1}

/* SCREENS */
.screen{display:none;animation:fadeSlide .35s ease}
.screen.active{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* MAIN CARD */
.main-card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;position:relative}
.main-card::before{content:'';position:absolute;top:0;right:0;left:0;height:5px;background:linear-gradient(90deg,var(--dream),var(--create-dark),var(--lead-dark)))}

/* WELCOME */
.welcome-inner{padding:2.5rem 2.5rem 2rem;text-align:center}
.welcome-icon{margin:0 auto 20px;width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,180,216,.25)}
.welcome-icon svg{width:36px;height:36px;color:#fff}
.welcome-title{font-family:var(--font-heading);font-size:1.8rem;font-weight:800;margin-bottom:8px;line-height:1.4}
.welcome-title .gradient{background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.welcome-sub{font-size:.95rem;color:var(--text-light);line-height:1.7;margin-bottom:28px}

/* FORM */
.field-group{margin-bottom:16px;text-align:right}
.field-group label{display:block;font-family:var(--font-heading);font-size:.82rem;font-weight:600;margin-bottom:6px;color:var(--text)}
.field-group select,.field-group input{
  width:100%;padding:14px 18px;font-family:var(--font-body);font-size:1rem;font-weight:600;
  border:1.5px solid rgba(0,0,0,.08);border-radius:var(--radius);background:#fff;
  color:var(--text);appearance:none;cursor:pointer;transition:all .2s;
}
.field-group select:focus,.field-group input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,180,216,.1)}
.field-group .select-wrap{position:relative}
.field-group .select-wrap::after{content:'';position:absolute;left:16px;top:50%;transform:translateY(-50%) rotate(45deg);width:8px;height:8px;border-bottom:2px solid var(--text-lighter);border-left:2px solid var(--text-lighter);pointer-events:none}

/* CATEGORY PICKER */
.cat-section-title{font-family:var(--font-heading);font-size:.78rem;font-weight:700;color:var(--text-lighter);margin:20px 0 10px;letter-spacing:.5px;padding-right:4px}
.cat-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.cat-pick-btn{display:flex;align-items:center;gap:10px;padding:14px 16px;border:1.5px solid rgba(0,0,0,.06);border-radius:var(--radius);background:#fff;cursor:pointer;font-family:var(--font-body);font-size:.88rem;font-weight:600;color:var(--text);transition:all .25s}
.cat-pick-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.cat-pick-btn.selected{border-width:2px;transform:scale(1.02);box-shadow:var(--shadow-md)}
.cat-pick-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.cat-pick-icon svg{width:18px;height:18px;color:#fff}
.cat-pick-label{text-align:right;line-height:1.3}
.cat-pick-label small{font-size:.68rem;font-weight:400;color:var(--text-lighter);display:block;margin-top:2px}

/* BUTTONS */
.btn-primary{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:14px 32px;border:none;border-radius:var(--radius);cursor:pointer;
  font-family:var(--font-body);font-size:1.05rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  box-shadow:0 4px 15px rgba(0,180,216,.25);transition:all .2s;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,180,216,.35)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-primary svg{width:18px;height:18px}
.btn-secondary{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px;border:1.5px solid rgba(0,0,0,.08);border-radius:var(--radius);cursor:pointer;
  font-family:var(--font-body);font-size:.95rem;font-weight:600;color:var(--text-light);
  background:#fff;transition:all .2s;flex:1;
}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary)}
.btn-secondary svg{width:16px;height:16px}
.nav-buttons{display:flex;gap:10px;margin-top:24px;padding-bottom:32px}
.nav-buttons .btn-primary{flex:1}

/* SECTION HEADER */
.section-header{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);overflow:hidden;margin-bottom:16px;border:1px solid rgba(0,0,0,.04)}
.section-color-bar{height:4px}
.section-header-inner{padding:24px 24px 20px;display:flex;align-items:center;gap:14px}
.section-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.section-icon svg{width:24px;height:24px;color:#fff}
.section-title-text{font-family:var(--font-heading);font-size:1.2rem;font-weight:800}
.section-desc{font-size:.82rem;color:var(--text-light);margin-top:2px}

/* ===== STYLE A: DUAL COLUMNS ===== */
.dual-card{background:#fff;border-radius:var(--radius);border:1px solid rgba(0,0,0,.04);box-shadow:var(--shadow-sm);padding:22px;margin-bottom:14px;transition:all .2s}
.dual-card:hover{box-shadow:var(--shadow-md)}
.dual-card.answered{border-color:rgba(0,180,216,.2)}
.dual-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.perspective-label{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;margin-bottom:10px;padding:6px 12px;border-radius:10px}
.perspective-label.student-label{background:rgba(0,180,216,.08);color:var(--primary-dark)}
.perspective-label.teacher-label{background:rgba(232,67,147,.08);color:var(--accent)}
.perspective-label svg{width:14px;height:14px}
.question-text{font-family:var(--font-heading);font-size:.88rem;font-weight:600;line-height:1.7;margin-bottom:12px;color:var(--text)}
.level-buttons{display:flex;flex-direction:column;gap:5px}
.level-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:1.5px solid rgba(0,0,0,.06);border-radius:12px;background:transparent;cursor:pointer;font-family:var(--font-body);font-size:.78rem;font-weight:600;color:var(--text);transition:all .2s;min-height:42px;text-align:right}
.level-btn:hover{border-color:var(--text-lighter);background:var(--bg-alt)}
.level-btn.selected{border-left-width:3px}
.level-btn .level-icon{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.level-btn .level-icon svg{width:20px;height:20px;transition:all .2s}
.level-btn .level-label{font-weight:700;min-width:50px;font-size:.75rem}
.level-btn .level-text{color:var(--text-lighter);font-weight:400;font-size:.72rem}
.level-btn.selected{animation:levelPop .25s ease}
@keyframes levelPop{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}

/* ===== STYLE B: SLIDER SCALE ===== */
.slider-card{background:#fff;border-radius:var(--radius);border:1px solid rgba(0,0,0,.04);box-shadow:var(--shadow-sm);padding:24px;margin-bottom:14px;transition:all .2s}
.slider-card:hover{box-shadow:var(--shadow-md)}
.slider-card.answered{border-color:rgba(0,150,183,.2)}
.slider-question{font-family:var(--font-heading);font-size:.95rem;font-weight:700;line-height:1.7;margin-bottom:18px;text-align:center}
.slider-dual{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.slider-track-wrap{position:relative;padding:10px 0}
.slider-track{display:flex;justify-content:space-between;align-items:center;position:relative}
.slider-track::before{content:'';position:absolute;top:50%;left:0;right:0;height:4px;background:rgba(0,0,0,.06);border-radius:2px;transform:translateY(-50%)}
.slider-dot{width:44px;height:44px;border-radius:50%;border:2px solid rgba(0,0,0,.08);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--font-heading);font-size:.9rem;font-weight:800;color:var(--text-lighter);transition:all .25s;position:relative;z-index:1}
.slider-dot:hover{transform:scale(1.12);border-color:var(--text-lighter);box-shadow:var(--shadow-sm)}
.slider-dot.selected{color:#fff;border-color:transparent;transform:scale(1.18);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.slider-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:.65rem;color:var(--text-lighter)}

/* ===== STYLE C: ATTENDANCE CIRCLES ===== */
.attend-card{background:#fff;border-radius:var(--radius);border:1px solid rgba(0,0,0,.04);box-shadow:var(--shadow-sm);padding:24px;margin-bottom:14px;transition:all .2s}
.attend-card:hover{box-shadow:var(--shadow-md)}
.attend-card.answered{border-color:rgba(225,112,85,.2)}
.attend-question{font-family:var(--font-heading);font-size:.95rem;font-weight:700;line-height:1.7;margin-bottom:16px;text-align:center}
.attend-dual{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.attend-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.attend-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:1.5px solid rgba(0,0,0,.06);border-radius:14px;cursor:pointer;transition:all .25s;background:#fff;font-family:var(--font-body)}
.attend-opt:hover{border-color:var(--text-lighter);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.attend-opt.selected{border-width:2px;transform:scale(1.04);box-shadow:var(--shadow-md)}
.attend-circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .3s}
.attend-circle svg{width:22px;height:22px;color:#fff}
.attend-opt-label{font-size:.72rem;font-weight:700;color:var(--text)}
.attend-opt-desc{font-size:.62rem;color:var(--text-lighter);text-align:center}

/* ===== STYLE D: TOGGLE STRIP ===== */
.toggle-card{background:#fff;border-radius:var(--radius);border:1px solid rgba(0,0,0,.04);box-shadow:var(--shadow-sm);padding:24px;margin-bottom:14px;transition:all .2s}
.toggle-card:hover{box-shadow:var(--shadow-md)}
.toggle-card.answered{border-color:rgba(108,92,231,.2)}
.toggle-question{font-family:var(--font-heading);font-size:.95rem;font-weight:700;line-height:1.7;margin-bottom:16px;text-align:center}
.toggle-dual{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.toggle-strip{display:flex;border-radius:14px;overflow:hidden;border:1.5px solid rgba(0,0,0,.06);background:#fff}
.toggle-opt{flex:1;padding:12px 6px;text-align:center;cursor:pointer;font-family:var(--font-body);font-size:.72rem;font-weight:700;color:var(--text-lighter);transition:all .25s;background:#fff;border:none;position:relative}
.toggle-opt:not(:last-child)::after{content:'';position:absolute;left:0;top:20%;height:60%;width:1px;background:rgba(0,0,0,.06)}
.toggle-opt:hover{background:var(--bg-alt)}
.toggle-opt.selected{color:#fff;z-index:1}
.toggle-opt .toggle-icon{display:block;font-size:1.2rem;margin-bottom:4px}
.toggle-opt .toggle-label{display:block;line-height:1.3}

/* ===== STYLE E: MILESTONE PATH ===== */
.milestone-card{background:#fff;border-radius:var(--radius);border:1px solid rgba(0,0,0,.04);box-shadow:var(--shadow-sm);padding:24px;margin-bottom:14px;transition:all .2s}
.milestone-card:hover{box-shadow:var(--shadow-md)}
.milestone-card.answered{border-color:rgba(253,203,110,.3)}
.milestone-question{font-family:var(--font-heading);font-size:.95rem;font-weight:700;line-height:1.7;margin-bottom:16px;text-align:center}
.milestone-dual{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.milestone-path{display:flex;flex-direction:column;gap:0;position:relative}
.milestone-path::before{content:'';position:absolute;right:19px;top:20px;bottom:20px;width:3px;background:rgba(0,0,0,.06);border-radius:2px}
.milestone-step{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;transition:all .2s;position:relative}
.milestone-step:hover .milestone-node{transform:scale(1.15);box-shadow:var(--shadow-sm)}
.milestone-node{width:40px;height:40px;border-radius:50%;border:2px solid rgba(0,0,0,.08);background:#fff;display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0;z-index:1}
.milestone-node svg{width:18px;height:18px;color:var(--text-lighter);transition:all .3s}
.milestone-step.selected .milestone-node{border-color:transparent}
.milestone-step.selected .milestone-node svg{color:#fff}
.milestone-info{flex:1}
.milestone-info .ms-label{font-size:.78rem;font-weight:700;color:var(--text)}
.milestone-info .ms-desc{font-size:.65rem;color:var(--text-lighter)}

/* GAP INDICATOR */
.gap-indicator{margin-top:10px;padding:8px 14px;border-radius:12px;font-size:.78rem;font-weight:600;display:none;align-items:center;gap:6px}
.gap-indicator svg{width:14px;height:14px;flex-shrink:0}
.gap-match{background:rgba(16,185,129,.08);color:var(--success)}
.gap-small{background:rgba(245,158,11,.08);color:var(--warn)}
.gap-big{background:rgba(239,68,68,.08);color:var(--danger)}

/* OPEN QUESTIONS */
.open-question-card{background:#fff;border-radius:var(--radius-lg);border:1px solid rgba(0,0,0,.04);box-shadow:var(--shadow-sm);padding:24px;margin-bottom:14px}
.open-q-text{font-family:var(--font-heading);font-size:1.05rem;font-weight:700;line-height:1.6;margin-bottom:16px;text-align:center}
.open-q-dual{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:right}
.open-q-block label{font-size:.78rem;font-weight:700;display:block;margin-bottom:6px}
.open-q-textarea{width:100%;min-height:90px;padding:14px 16px;border:1.5px solid rgba(0,0,0,.06);border-radius:var(--radius);font-family:var(--font-body);font-size:.88rem;line-height:1.7;color:var(--text);background:var(--bg-alt);resize:vertical;transition:all .2s}
.open-q-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,180,216,.08)}
.open-q-textarea::placeholder{color:var(--text-lighter)}

/* RESULTS */
.results-card{background:#fff;border-radius:var(--radius-lg);border:1px solid rgba(0,0,0,.04);box-shadow:var(--shadow-lg);overflow:hidden;margin-bottom:16px;position:relative}
.results-card::before{content:'';position:absolute;top:0;right:0;left:0;height:5px;background:linear-gradient(90deg,var(--dream),var(--create-dark),var(--lead-dark)))}
.results-inner{padding:28px 24px}
.results-title{font-family:var(--font-heading);font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:4px}
.results-sub{font-size:.88rem;color:var(--text-light);text-align:center;margin-bottom:24px}
.results-names{display:flex;justify-content:center;gap:16px;margin-bottom:24px}
.results-name-tag{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:.82rem;font-weight:600}
.results-name-tag.student-tag{background:rgba(0,180,216,.08);color:var(--primary-dark)}
.results-name-tag.teacher-tag{background:rgba(232,67,147,.08);color:var(--accent)}
.results-name-tag svg{width:14px;height:14px}
.comparison-grid{display:grid;gap:10px;margin-bottom:20px}
.compare-row{background:var(--bg-alt);border-radius:var(--radius);padding:14px 16px;display:grid;grid-template-columns:100px 1fr 40px 1fr 40px;align-items:center;gap:10px;border:1px solid rgba(0,0,0,.03)}
.compare-label{font-size:.78rem;font-weight:700;line-height:1.3}
.compare-bar-wrap{height:10px;background:rgba(0,0,0,.06);border-radius:5px;overflow:hidden}
.compare-bar{height:100%;border-radius:5px;transition:width .8s ease .2s}
.compare-val{font-size:.88rem;font-weight:800;text-align:center}

.insight-card{background:var(--bg-alt);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;border-right:4px solid transparent;border:1px solid rgba(0,0,0,.03);border-right-width:4px}
.insight-title{font-family:var(--font-heading);font-size:.85rem;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.insight-title svg{width:16px;height:16px}
.insight-text{font-size:.82rem;color:var(--text-light);line-height:1.7}

.action-plan{background:#fff;border-radius:var(--radius-lg);border:2px solid var(--primary);box-shadow:var(--shadow-md);padding:24px 20px;margin:20px 0;position:relative;overflow:hidden}
.action-plan::before{content:'';position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--secondary))}
.action-title{font-family:var(--font-heading);font-size:1.1rem;font-weight:800;color:var(--primary-dark);margin-bottom:4px}
.action-sub{font-size:.78rem;color:var(--text-light);margin-bottom:16px}
.action-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:rgba(0,180,216,.04);border:1px solid rgba(0,180,216,.1);border-radius:12px;margin-bottom:8px;font-size:.82rem;line-height:1.6}
.action-item svg{width:16px;height:16px;flex-shrink:0;margin-top:3px;color:var(--primary)}
.action-commitments{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.commit-block label{font-size:.78rem;font-weight:700;display:block;margin-bottom:4px}
.commit-block label.student-commit{color:var(--primary-dark)}
.commit-block label.teacher-commit{color:var(--accent)}
.commit-block textarea{width:100%;min-height:70px;padding:10px 12px;border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:var(--font-body);font-size:.82rem;line-height:1.6;color:var(--text);background:var(--bg-alt);resize:vertical}
.commit-block textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,180,216,.08)}
.checkin-note{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--bg-alt);border-radius:10px;font-size:.72rem;color:var(--text-lighter);font-style:italic;margin-top:12px}

.btn-submit{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border:none;border-radius:var(--radius);cursor:pointer;font-family:var(--font-body);font-size:1.1rem;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--success),#059669);box-shadow:0 4px 15px rgba(16,185,129,.25);transition:all .2s;margin-top:16px}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(16,185,129,.35)}
.btn-submit svg{width:20px;height:20px}
.btn-print{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:1.5px solid rgba(0,0,0,.06);border-radius:var(--radius);cursor:pointer;font-family:var(--font-body);font-size:.88rem;font-weight:600;color:var(--text-light);background:#fff;transition:all .2s;margin-top:10px}
.btn-print:hover{border-color:var(--primary);color:var(--primary)}
.btn-print svg{width:16px;height:16px}
.safety-text{text-align:center;font-size:.78rem;color:var(--text-lighter);margin:20px 0 8px;font-style:italic}

/* FOOTER */
.main-footer{width:100%;max-width:680px;padding:20px 24px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.footer-brand{font-family:var(--font-body);font-weight:800;font-size:.85rem;color:var(--text-light)}
.footer-info{font-size:.72rem;color:var(--text-lighter)}

/* SUCCESS */
.success-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(247,248,252,.96);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.success-overlay.visible{display:flex}
.success-check{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,var(--success),#059669);display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:popIn .4s ease;box-shadow:0 8px 24px rgba(16,185,129,.25)}
.success-check svg{width:40px;height:40px;color:#fff}
@keyframes popIn{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.success-title{font-family:var(--font-heading);font-size:1.5rem;font-weight:800;margin-bottom:8px}
.success-sub{font-size:.92rem;color:var(--text-light);line-height:1.6}

@media print{
  .main-header,.progress-wrap,.nav-buttons,.btn-submit,.btn-print,.safety-text,.main-footer,.shape{display:none!important}
  body::before{display:none}
  .screen{display:block!important;page-break-inside:avoid}
  .screen:not(#screen-results){display:none!important}
  #screen-results{display:block!important}
}
@media(max-width:680px){
  .welcome-inner{padding:2rem 1.5rem}
  .welcome-title{font-size:1.4rem}
  .container{padding:16px}
  .dual-columns,.open-q-dual,.slider-dual,.attend-dual,.toggle-dual,.milestone-dual,.action-commitments{grid-template-columns:1fr}
  .compare-row{grid-template-columns:70px 1fr 30px 1fr 30px;gap:6px}
  .cat-picker{grid-template-columns:1fr}
  .results-names{flex-direction:column;align-items:center;gap:8px}
}

const str=gaps.filter(g=>g.student>=3&&g.teacher>=3);if(str.length>0)ins+=`<div class="insight-card" style="border-right-color:var(--success)"><div class="insight-title" style="color:var(--success)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>חוזקות משותפות</div><div class="insight-text">שניכם מסכימים ש${str.length>1?`ב-${str.length} תחומים`:'בתחום אחד'} יש בסיס יציב!</div></div>`;
const gr=gaps.filter(g=>g.student<=2&&g.teacher<=2);if(gr.length>0)ins+=`<div class="insight-card" style="border-right-color:var(--warn)"><div class="insight-title" style="color:var(--warn)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>מקום לצמיחה</div><div class="insight-text">שניכם מזהים ${gr.length>1?`${gr.length} תחומים`:'תחום אחד'} שאפשר לחזק. ההכרה הזו היא הצעד הראשון!</div></div>`;
let act='';if(sorted[0]&&sorted[0].gap>=2)act+=`<div class="action-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>לדבר על הפער בשאלה ${sorted[0].idx+1}</span></div>`;if(gr.length>0)act+=`<div class="action-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><span>לבנות יחד תוכנית קטנה לחיזוק תחום אחד</span></div>`;if(str.length>0)act+=`<div class="action-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span>לחגוג את החוזקות! לשמור על מה שעובד טוב</span></div>`;
let oS='';OPEN_QUESTIONS.forEach(oq=>{const sAn=state.openStudent[oq.key]||'',tAn=state.openTeacher[oq.key]||'';if(sAn||tAn)oS+=`<div style="margin-bottom:12px"><div style="font-family:var(--font-heading);font-size:.85rem;font-weight:700;margin-bottom:8px">${oq.text}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${sAn?`<div style="background:rgba(0,180,216,.04);border-radius:12px;padding:10px 14px;font-size:.82rem;line-height:1.6"><span style="font-size:.7rem;font-weight:700;color:var(--primary-dark);display:block;margin-bottom:4px">${state.studentName}</span>${sAn}</div>`:'<div></div>'}${tAn?`<div style="background:rgba(232,67,147,.04);border-radius:12px;padding:10px 14px;font-size:.82rem;line-height:1.6"><span style="font-size:.7rem;font-weight:700;color:var(--accent);display:block;margin-bottom:4px">${state.teacherName}</span>${tAn}</div>`:'<div></div>'}</div></div>`});
el.innerHTML=`<div class="results-card"><div class="results-inner"><div class="results-title" style="color:${cat.color}">סיכום — ${cat.name}</div><div class="results-sub">ציון ממוצע מתוך 4</div><div class="results-names"><div class="results-name-tag student-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4-4v2"/><circle cx="12" cy="7" r="4"/></svg>${state.studentName}: <strong>${sA}</strong></div><div class="results-name-tag teacher-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/></svg>${state.teacherName}: <strong>${tA}</strong></div></div><div class="comparison-grid">${cH}</div></div></div>${ins?`<div style="margin-bottom:16px">${ins}</div>`:''}${oS?`<div class="results-card"><div class="results-inner"><div style="font-family:var(--font-heading);font-size:1rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px"><svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" width="18" height="18"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>מה אמרנו בשיחה</div>${oS}</div></div>`:''}
<div class="action-plan"><div class="action-title">תוכנית פעולה משותפת</div><div class="action-sub">מה עושים מכאן?</div>${act}<div class="action-commitments"><div class="commit-block"><label class="student-commit">מה ${state.studentName} מתחייב/ת</label><textarea placeholder="דבר אחד קטן שאני אעשה..."></textarea></div><div class="commit-block"><label class="teacher-commit">מה ${state.teacherName} מתחייב/ת</label><textarea placeholder="מה אני נותן/ת כדי לעזור..."></textarea></div></div><div class="checkin-note"><svg viewBox="0 0 24 24" fill="none" stroke="var(--text-lighter)" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>נפגשים שוב בעוד שבועיים לצ'ק-אין קצר</span></div></div>
<div class="safety-text">זו שיחה, לא מבחן. אין תשובות נכונות או לא נכונות</div>
<button class="btn-submit" onclick="submitFeedback()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>שמירת המשוב</button>
<button class="btn-print" onclick="window.print()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>הדפסה</button>`}
function submitFeedback(){const cat=CATEGORIES.find(c=>c.key===state.selectedCat);console.log('Feedback:',JSON.stringify({timestamp:new Date().toISOString(),studentName:state.studentName,teacherName:state.teacherName,category:cat.name,studentAnswers:state.studentAnswers,teacherAnswers:state.teacherAnswers,openStudent:state.openStudent,openTeacher:state.openTeacher},null,2));document.getElementById('successOverlay').classList.add('visible')}
init();
</script>
</body>
</html>
