<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>שיחות יחד — מורה ותלמיד | אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FAF7F2;--card:#FFFDF8;--text:#3A3530;--muted:#8B7E74;--border:#E8DDD0;
  --primary:#7AADAD;--primary-dark:#5E9191;
  --accent:#D4A574;--accent-light:#F0DCC4;
  --success:#6A9F6A;--warn:#C4944A;--danger:#C0605A;
  --dim-belong:#E06090;--dim-respect:#5B9BD5;--dim-motiv:#E8A838;--dim-capable:#8B6BC0;--dim-auto:#7AB648;
  --cat-serious:#3D8B8B;--cat-attend:#D4726A;--cat-function:#5A7FBA;--cat-goals:#B8860B;
  --radius:20px;
  --shadow-sm:0 2px 8px rgba(74,63,53,.05);
  --shadow-md:0 4px 20px rgba(74,63,53,.08);
  --shadow-lg:0 12px 40px rgba(74,63,53,.1);
}
body{font-family:Heebo,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:500px;background:linear-gradient(180deg,#FFF8F0 0%,var(--bg) 100%);z-index:-2;pointer-events:none}
body::after{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background-image:radial-gradient(circle,var(--border) .6px,transparent .6px);background-size:28px 28px;opacity:.35;z-index:-1;pointer-events:none}

/* HEADER */
.main-header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,rgba(122,173,173,.12),rgba(212,165,116,.08));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 20px}
.header-inner{max-width:800px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.header-right{display:flex;align-items:center;gap:10px}
.learni-logo{display:flex;align-items:center;gap:6px;text-decoration:none}
.learni-logo svg{width:22px;height:22px}
.learni-logo span{font-size:.82rem;font-weight:700;color:#9B8EC4}
.header-title{font-size:.95rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
.header-title svg{width:18px;height:18px;color:var(--primary)}

/* PROGRESS */
.progress-wrap{position:sticky;top:56px;z-index:99;background:linear-gradient(135deg,rgba(255,253,248,.95),rgba(250,247,242,.95));backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 20px;display:none}
.progress-wrap.visible{display:block}
.progress-inner{max-width:800px;margin:0 auto}
.progress-label{font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.progress-label .section-name{color:var(--text);font-weight:700}
.progress-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s ease,background .3s ease;width:0}

/* CONTAINER */
.container{max-width:800px;margin:0 auto;padding:20px}

/* SCREENS */
.screen{display:none;animation:fadeSlide .35s ease}
.screen.active{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* WELCOME */
.welcome-card{background:var(--card);border-radius:28px;border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:40px 28px;text-align:center;max-width:560px;margin:40px auto 0}
.welcome-icon{margin:0 auto 20px;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center}
.welcome-icon svg{width:40px;height:40px;color:#fff}
.welcome-title{font-size:1.5rem;font-weight:900;margin-bottom:8px}
.welcome-sub{font-size:.92rem;color:var(--muted);line-height:1.7;margin-bottom:24px}

/* FORM FIELDS */
.field-group{margin-bottom:16px;text-align:right}
.field-group label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px;color:var(--muted)}
.field-group select,.field-group input{width:100%;padding:14px 18px;font-family:Heebo;font-size:1rem;font-weight:600;border:2px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);appearance:none;cursor:pointer;transition:border-color .2s}
.field-group select:focus,.field-group input:focus{outline:none;border-color:var(--primary)}
.field-group .select-wrap{position:relative}
.field-group .select-wrap::after{content:'';position:absolute;left:16px;top:50%;transform:translateY(-50%) rotate(45deg);width:8px;height:8px;border-bottom:2px solid var(--muted);border-left:2px solid var(--muted);pointer-events:none}

/* CATEGORY PICKER */
.cat-section-title{font-size:.78rem;font-weight:700;color:var(--muted);margin:20px 0 10px;text-transform:uppercase;letter-spacing:.5px;padding-right:4px}
.cat-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.cat-pick-btn{display:flex;align-items:center;gap:10px;padding:14px 16px;border:2px solid var(--border);border-radius:16px;background:var(--card);cursor:pointer;font-family:Heebo;font-size:.88rem;font-weight:600;color:var(--text);transition:all .25s}
.cat-pick-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.cat-pick-btn.selected{border-width:3px;transform:scale(1.02);box-shadow:var(--shadow-md)}
.cat-pick-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cat-pick-icon svg{width:18px;height:18px;color:#fff}
.cat-pick-label{text-align:right;line-height:1.3}
.cat-pick-label small{font-size:.68rem;font-weight:400;color:var(--muted);display:block;margin-top:2px}

/* BUTTONS */
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border:none;border-radius:14px;cursor:pointer;font-family:Heebo;font-size:1.05rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-dark));box-shadow:0 4px 16px rgba(122,173,173,.3);transition:all .2s}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(122,173,173,.4)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-primary svg{width:18px;height:18px}
.btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px;border:2px solid var(--border);border-radius:14px;cursor:pointer;font-family:Heebo;font-size:.95rem;font-weight:600;color:var(--muted);background:var(--card);transition:all .2s;flex:1}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary)}
.btn-secondary svg{width:16px;height:16px}
.nav-buttons{display:flex;gap:10px;margin-top:24px;padding-bottom:32px}
.nav-buttons .btn-primary{flex:1}

/* SECTION HEADER */
.section-header{background:var(--card);border-radius:24px;border:1px solid var(--border);box-shadow:var(--shadow-md);overflow:hidden;margin-bottom:20px}
.section-color-bar{height:4px}
.section-header-inner{padding:24px 24px 20px;display:flex;align-items:center;gap:14px}
.section-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.section-icon svg{width:24px;height:24px;color:#fff}
.section-title-text{font-size:1.25rem;font-weight:800}
.section-desc{font-size:.82rem;color:var(--muted);margin-top:2px;line-height:1.5}

/* ===== STYLE A: DUAL COLUMNS (5 dimensions) ===== */
.dual-card{background:var(--card);border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow-sm);padding:20px;margin-bottom:14px;transition:all .2s}
.dual-card.answered{border-color:rgba(122,173,173,.3)}
.question-num{font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.question-text{font-size:.92rem;font-weight:700;line-height:1.7;margin-bottom:14px}
.dual-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.perspective-label{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;margin-bottom:10px;padding:6px 12px;border-radius:10px}
.perspective-label.student-label{background:rgba(122,173,173,.1);color:var(--primary-dark)}
.perspective-label.teacher-label{background:rgba(212,165,116,.15);color:var(--accent)}
.perspective-label svg{width:14px;height:14px}
.level-buttons{display:flex;flex-direction:column;gap:5px}
.level-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:10px;background:transparent;cursor:pointer;font-family:Heebo;font-size:.78rem;font-weight:600;color:var(--text);transition:all .2s;min-height:42px;text-align:right}
.level-btn:hover{border-color:var(--muted);background:rgba(139,126,116,.04)}
.level-btn.selected{border-left-width:4px}
.level-btn .level-icon{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.level-btn .level-icon svg{width:20px;height:20px;transition:all .2s}
.level-btn .level-label{font-weight:700;min-width:50px;font-size:.75rem}
.level-btn .level-text{color:var(--muted);font-weight:400;font-size:.72rem}
.level-btn.selected{animation:levelPop .25s ease}
@keyframes levelPop{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}

/* ===== STYLE B: SLIDER SCALE (רצינות לימודית) ===== */
.slider-card{background:var(--card);border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow-sm);padding:24px;margin-bottom:14px;transition:all .2s}
.slider-card.answered{border-color:rgba(61,139,139,.3)}
.slider-question{font-size:.95rem;font-weight:700;line-height:1.7;margin-bottom:18px;text-align:center}
.slider-dual{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.slider-col .perspective-label{margin-bottom:12px}
.slider-track-wrap{position:relative;padding:10px 0}
.slider-track{display:flex;justify-content:space-between;align-items:center;position:relative}
.slider-track::before{content:'';position:absolute;top:50%;left:0;right:0;height:4px;background:var(--border);border-radius:2px;transform:translateY(-50%)}
.slider-dot{width:44px;height:44px;border-radius:50%;border:3px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:Heebo;font-size:.85rem;font-weight:800;color:var(--muted);transition:all .25s;position:relative;z-index:1}
.slider-dot:hover{transform:scale(1.1);border-color:var(--muted)}
.slider-dot.selected{color:#fff;border-color:transparent;transform:scale(1.15);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.slider-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:.65rem;color:var(--muted)}

/* ===== STYLE C: ATTENDANCE CIRCLES (נוכחות) ===== */
.attend-card{background:var(--card);border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow-sm);padding:24px;margin-bottom:14px;transition:all .2s}
.attend-card.answered{border-color:rgba(212,114,106,.3)}
.attend-question{font-size:.95rem;font-weight:700;line-height:1.7;margin-bottom:16px;text-align:center}
.attend-dual{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.attend-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.attend-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:2px solid var(--border);border-radius:14px;cursor:pointer;transition:all .25s;background:transparent;font-family:Heebo}
.attend-opt:hover{border-color:var(--muted);transform:translateY(-2px)}
.attend-opt.selected{border-width:3px;transform:scale(1.04)}
.attend-circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .3s}
.attend-circle svg{width:22px;height:22px;color:#fff}
.attend-opt-label{font-size:.72rem;font-weight:700;color:var(--text)}
.attend-opt-desc{font-size:.62rem;color:var(--muted);text-align:center}

/* ===== STYLE D: TOGGLE CARDS (תפקוד) ===== */
.toggle-card{background:var(--card);border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow-sm);padding:24px;margin-bottom:14px;transition:all .2s}
.toggle-card.answered{border-color:rgba(90,127,186,.3)}
.toggle-question{font-size:.95rem;font-weight:700;line-height:1.7;margin-bottom:16px;text-align:center}
.toggle-dual{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.toggle-strip{display:flex;border-radius:12px;overflow:hidden;border:2px solid var(--border)}
.toggle-opt{flex:1;padding:12px 6px;text-align:center;cursor:pointer;font-family:Heebo;font-size:.72rem;font-weight:700;color:var(--muted);transition:all .25s;background:var(--card);border:none;position:relative}
.toggle-opt:not(:last-child)::after{content:'';position:absolute;left:0;top:20%;height:60%;width:1px;background:var(--border)}
.toggle-opt:hover{background:rgba(90,127,186,.05)}
.toggle-opt.selected{color:#fff;z-index:1}
.toggle-opt .toggle-icon{display:block;font-size:1.2rem;margin-bottom:4px}
.toggle-opt .toggle-label{display:block;line-height:1.3}

/* ===== STYLE E: MILESTONE PATH (מטרות) ===== */
.milestone-card{background:var(--card);border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow-sm);padding:24px;margin-bottom:14px;transition:all .2s}
.milestone-card.answered{border-color:rgba(184,134,11,.3)}
.milestone-question{font-size:.95rem;font-weight:700;line-height:1.7;margin-bottom:16px;text-align:center}
.milestone-dual{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.milestone-path{display:flex;flex-direction:column;gap:0;position:relative}
.milestone-path::before{content:'';position:absolute;right:19px;top:20px;bottom:20px;width:3px;background:var(--border);border-radius:2px}
.milestone-step{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;transition:all .2s;position:relative}
.milestone-step:hover .milestone-node{transform:scale(1.15)}
.milestone-node{width:40px;height:40px;border-radius:50%;border:3px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0;z-index:1}
.milestone-node svg{width:18px;height:18px;color:var(--muted);transition:all .3s}
.milestone-step.selected .milestone-node{border-color:transparent}
.milestone-step.selected .milestone-node svg{color:#fff}
.milestone-info{flex:1}
.milestone-info .ms-label{font-size:.78rem;font-weight:700;color:var(--text);transition:color .3s}
.milestone-info .ms-desc{font-size:.65rem;color:var(--muted)}

/* GAP INDICATOR */
.gap-indicator{margin-top:10px;padding:8px 12px;border-radius:10px;font-size:.75rem;font-weight:600;display:none;align-items:center;gap:6px}
.gap-indicator svg{width:14px;height:14px;flex-shrink:0}
.gap-match{background:rgba(106,159,106,.1);color:var(--success)}
.gap-small{background:rgba(232,168,56,.1);color:var(--warn)}
.gap-big{background:rgba(192,96,90,.1);color:var(--danger)}

/* OPEN QUESTIONS */
.open-question-card{background:var(--card);border-radius:24px;border:1px solid var(--border);box-shadow:var(--shadow-sm);padding:24px;margin-bottom:14px}
.open-q-text{font-size:1.05rem;font-weight:800;line-height:1.6;margin-bottom:16px;text-align:center}
.open-q-dual{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:right}
.open-q-block label{font-size:.78rem;font-weight:700;display:block;margin-bottom:6px}
.open-q-textarea{width:100%;min-height:90px;padding:14px 16px;border:2px solid var(--border);border-radius:14px;font-family:Heebo;font-size:.88rem;line-height:1.7;color:var(--text);background:var(--bg);resize:vertical;transition:border-color .2s}
.open-q-textarea:focus{outline:none;border-color:var(--primary)}
.open-q-textarea::placeholder{color:var(--muted)}

/* RESULTS */
.results-card{background:var(--card);border-radius:24px;border:1px solid var(--border);box-shadow:var(--shadow-lg);overflow:hidden;margin-bottom:16px}
.results-strip{height:6px}
.results-inner{padding:28px 24px}
.results-title{font-size:1.5rem;font-weight:900;text-align:center;margin-bottom:4px}
.results-sub{font-size:.88rem;color:var(--muted);text-align:center;margin-bottom:24px;line-height:1.6}
.results-names{display:flex;justify-content:center;gap:20px;margin-bottom:24px}
.results-name-tag{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:12px;font-size:.82rem;font-weight:600}
.results-name-tag.student-tag{background:rgba(122,173,173,.1);color:var(--primary-dark)}
.results-name-tag.teacher-tag{background:rgba(212,165,116,.15);color:var(--accent)}
.results-name-tag svg{width:14px;height:14px}
.comparison-grid{display:grid;gap:10px;margin-bottom:20px}
.compare-row{background:var(--bg);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:100px 1fr 40px 1fr 40px;align-items:center;gap:10px}
.compare-label{font-size:.78rem;font-weight:700;line-height:1.3}
.compare-bar-wrap{height:10px;background:var(--border);border-radius:5px;overflow:hidden}
.compare-bar{height:100%;border-radius:5px;transition:width .8s ease .2s}
.compare-val{font-size:.88rem;font-weight:800;text-align:center}

.insight-card{background:var(--bg);border-radius:14px;padding:16px;margin-bottom:10px;border-right:4px solid transparent}
.insight-title{font-size:.85rem;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.insight-title svg{width:16px;height:16px}
.insight-text{font-size:.82rem;color:var(--muted);line-height:1.7}

.action-plan{background:var(--card);border-radius:22px;border:2px solid var(--primary);box-shadow:var(--shadow-md);padding:24px 20px;margin:20px 0}
.action-title{font-size:1.1rem;font-weight:900;color:var(--primary-dark);margin-bottom:4px}
.action-sub{font-size:.78rem;color:var(--muted);margin-bottom:16px}
.action-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:rgba(122,173,173,.06);border:1px solid rgba(122,173,173,.15);border-radius:12px;margin-bottom:8px;font-size:.82rem;line-height:1.6}
.action-item svg{width:16px;height:16px;flex-shrink:0;margin-top:3px;color:var(--primary)}
.action-commitments{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.commit-block label{font-size:.78rem;font-weight:700;display:block;margin-bottom:4px}
.commit-block label.student-commit{color:var(--primary-dark)}
.commit-block label.teacher-commit{color:var(--accent)}
.commit-block textarea{width:100%;min-height:70px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-family:Heebo;font-size:.82rem;line-height:1.6;color:var(--text);background:#fff;resize:vertical}
.commit-block textarea:focus{outline:none;border-color:var(--primary)}
.checkin-note{display:flex;align-items:center;gap:6px;padding:10px 14px;background:rgba(139,126,116,.06);border-radius:10px;font-size:.72rem;color:var(--muted);font-style:italic;margin-top:12px}

.btn-submit{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:18px;border:none;border-radius:16px;cursor:pointer;font-family:Heebo;font-size:1.1rem;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--success),#4D8A4D);box-shadow:0 4px 20px rgba(106,159,106,.3);transition:all .2s;margin-top:16px}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(106,159,106,.4)}
.btn-submit svg{width:20px;height:20px}
.btn-print{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:2px solid var(--border);border-radius:14px;cursor:pointer;font-family:Heebo;font-size:.88rem;font-weight:600;color:var(--muted);background:var(--card);transition:all .2s;margin-top:10px}
.btn-print:hover{border-color:var(--primary);color:var(--primary)}
.btn-print svg{width:16px;height:16px}
.safety-text{text-align:center;font-size:.78rem;color:var(--muted);margin:20px 0 8px;font-style:italic;line-height:1.6}

/* SUCCESS */
.success-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(250,247,242,.96);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.success-overlay.visible{display:flex}
.success-check{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--success),#4D8A4D);display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:popIn .4s ease}
.success-check svg{width:40px;height:40px;color:#fff}
@keyframes popIn{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.success-title{font-size:1.5rem;font-weight:900;margin-bottom:8px}
.success-sub{font-size:.92rem;color:var(--muted);line-height:1.6}

@media print{
  .main-header,.progress-wrap,.nav-buttons,.btn-submit,.btn-print,.safety-text{display:none!important}
  body::before,body::after{display:none}
  .screen{display:block!important;page-break-inside:avoid}
  .screen:not(#screen-results){display:none!important}
  #screen-results{display:block!important}
}

// ===== INIT =====
function init(){
  const sel = document.getElementById('teacherSelect');
  ALL_STAFF.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.name;
    opt.textContent = `${s.name} — ${s.class}`;
    sel.appendChild(opt);
  });

  // Build pickers
  const dimPicker = document.getElementById('dimPicker');
  const extraPicker = document.getElementById('extraPicker');
  CATEGORIES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-pick-btn';
    btn.dataset.cat = c.key;
    btn.innerHTML = `<div class="cat-pick-icon" style="background:${c.color}">${c.icon}</div><div class="cat-pick-label">${c.name}<small>${c.description}</small></div>`;
    btn.onclick = () => selectCategory(c.key);
    (c.group === 'dim' ? dimPicker : extraPicker).appendChild(btn);
  });
}

function selectCategory(key){
  state.selectedCat = key;
  const cat = CATEGORIES.find(c => c.key === key);
  document.querySelectorAll('.cat-pick-btn').forEach(b => {
    if(b.dataset.cat === key){
      b.classList.add('selected');
      b.style.borderColor = cat.color;
      b.style.background = cat.color + '10';
    } else {
      b.classList.remove('selected');
      b.style.borderColor = '';
      b.style.background = '';
    }
  });
  checkReady();
}

function checkReady(){
  const name = document.getElementById('studentName').value.trim();
  const teacher = document.getElementById('teacherSelect').value;
  document.getElementById('btnStart').disabled = !(name && teacher && state.selectedCat);
}

function startFeedback(){
  state.studentName = document.getElementById('studentName').value.trim();
  state.teacherName = document.getElementById('teacherSelect').value;
  buildScreens();
  showScreen(1);
}

// ===== BUILD SCREENS =====

  screenOrder = [{type:'welcome'}];

  cat.studentQ.forEach((sq, i) => {
    screenOrder.push({type:'question', idx:i});
    const div = document.createElement('div');
    div.className = 'screen';
    div.id = `screen-q-${i}`;

    const sectionHeader = `
      <div class="section-header">
        <div class="section-color-bar" style="background:${cat.color}"></div>
        <div class="section-header-inner">
          <div class="section-icon" style="background:${cat.color}">${cat.icon}</div>
          <div>
            <div class="section-title-text" style="color:${cat.color}">${cat.name}</div>
            <div class="section-desc">שאלה ${i+1} מתוך ${cat.studentQ.length}</div>
          </div>
        </div>
      </div>`;

        <button class="btn-secondary" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          הקודם
        </button>
        <button class="btn-primary" id="nextBtn-${i}" onclick="goNext()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          הבא
        </button>
      </div>`;

    let cardHTML = '';
    if(cat.style === 'A') cardHTML = buildStyleA(cat, i);
    else if(cat.style === 'B') cardHTML = buildStyleB(cat, i);
    else if(cat.style === 'C') cardHTML = buildStyleC(cat, i);
    else if(cat.style === 'D') cardHTML = buildStyleD(cat, i);
    else if(cat.style === 'E') cardHTML = buildStyleE(cat, i);

    div.innerHTML = sectionHeader + cardHTML + `<div class="gap-indicator" id="gap-${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span id="gap-text-${i}"></span></div>` + navBtns;
    container.appendChild(div);
  });

  // Open questions
  screenOrder.push({type:'open'});
  const openDiv = document.createElement('div');
  openDiv.className = 'screen';
  openDiv.id = 'screen-open';

    <div class="section-header">

// ===== UNIVERSAL ANSWER HANDLER =====
function pickAnswer(who, qKey, value, el, color, qIdx){
  const cat = CATEGORIES.find(c => c.key === state.selectedCat);

  // Style-specific selection logic
  if(cat.style === 'A'){
    // Level buttons
    el.parentElement.querySelectorAll('.level-btn').forEach(b => {
      b.classList.remove('selected');b.style.borderColor='';b.style.background='';
      const ic = b.querySelector('.level-icon svg');if(ic)ic.style.color='';
    });
    el.classList.add('selected');
    el.style.borderColor = color;
    el.style.background = color + '08';
    const ic = el.querySelector('.level-icon svg');if(ic) ic.style.color = color;
  }
  else if(cat.style === 'B'){
    // Slider dots
    el.parentElement.querySelectorAll('.slider-dot').forEach(d => {
      d.classList.remove('selected');d.style.background='';
    });
    el.classList.add('selected');
    el.style.background = color;
  }
  else if(cat.style === 'C'){
    // Attendance circles
    el.closest('.attend-options').querySelectorAll('.attend-opt').forEach(o => {
      o.classList.remove('selected');o.style.borderColor='';o.style.background='';
    });
    el.classList.add('selected');
    el.style.borderColor = color;
    el.style.background = color + '08';
  }
  else if(cat.style === 'D'){
    // Toggle strip
    el.closest('.toggle-strip').querySelectorAll('.toggle-opt').forEach(o => {
      o.classList.remove('selected');o.style.background='';
    });
    el.classList.add('selected');
    el.style.background = color;
  }
  else if(cat.style === 'E'){
    // Milestone path
    el.closest('.milestone-path').querySelectorAll('.milestone-step').forEach(s => {
      s.classList.remove('selected');
      s.querySelector('.milestone-node').style.background = '';
      s.querySelector('.milestone-node').style.borderColor = '';
      s.querySelector('.milestone-node svg').style.color = 'var(--muted)';
    });
    el.classList.add('selected');
    el.querySelector('.milestone-node').style.background = color;
    el.querySelector('.milestone-node').style.borderColor = 'transparent';
    el.querySelector('.milestone-node svg').style.color = '#fff';
  }

  // Save answer
  if(who === 'student') state.studentAnswers[qKey] = value;
  else state.teacherAnswers[qKey] = value;

  // Check gap
  const sVal = state.studentAnswers[qKey];
  const tVal = state.teacherAnswers[qKey];
  if(sVal && tVal) showGap(qIdx, sVal, tVal);

  // Enable next
  const btn = document.getElementById(`nextBtn-${qIdx}`);
  if(btn && sVal && tVal) btn.disabled = false;
}

function showGap(idx, sVal, tVal){
  const gap = Math.abs(sVal - tVal);
  const el = document.getElementById(`gap-${idx}`);
  const txt = document.getElementById(`gap-text-${idx}`);
  el.style.display = 'flex';
  el.className = 'gap-indicator';
  if(gap === 0){el.classList.add('gap-match');txt.textContent='רואים את זה אותו דבר! מעולה'}
  else if(gap === 1){el.classList.add('gap-small');txt.textContent='פער קטן — שווה לדבר על זה'}
  else{el.classList.add('gap-big');txt.textContent='פער משמעותי — הזדמנות לשיחה חשובה'}
}

// ===== NAVIGATION =====
function showScreen(idx){
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  const s = screenOrder[idx];
  let el;
  if(s.type==='welcome')el=document.getElementById('screen-welcome');
  else if(s.type==='question')el=document.getElementById(`screen-q-${s.idx}`);
  else if(s.type==='open')el=document.getElementById('screen-open');
  else if(s.type==='results')el=document.getElementById('screen-results');
  if(el)el.classList.add('active');
  currentScreenIdx = idx;
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProgress(){
  const wrap = document.getElementById('progressWrap');
  const s = screenOrder[currentScreenIdx];
  if(s.type==='welcome'||s.type==='results'){wrap.classList.remove('visible');return}
  wrap.classList.add('visible');
  const cat = CATEGORIES.find(c => c.key === state.selectedCat);
  let partText = s.type==='question' ? `שאלה ${s.idx+1} מתוך ${cat.studentQ.length}` : 'שאלות פתוחות';
  document.getElementById('progressPart').textContent = partText;
  document.getElementById('progressName').textContent = cat.name;
  const total = screenOrder.length - 2;
  const pct = Math.round((currentScreenIdx / total) * 100);
  const fill = document.getElementById('progressFill');
  fill.style.width = pct + '%';
  fill.style.background = cat.color;
}

function goNext(){if(currentScreenIdx < screenOrder.length-1) showScreen(currentScreenIdx+1)}
function goBack(){if(currentScreenIdx > 0) showScreen(currentScreenIdx-1)}
function goToResults(){buildResults();showScreen(screenOrder.length-1)}

// ===== RESULTS =====
function buildResults(){
  const cat = CATEGORIES.find(c => c.key === state.selectedCat);
  const el = document.getElementById('screen-results');
  const count = cat.studentQ.length;
  let sSum=0,tSum=0,gaps=[];
  for(let i=0;i<count;i++){
    const qKey=`${cat.key}_${i}`;
    const s=state.studentAnswers[qKey]||0, t=state.teacherAnswers[qKey]||0;
    sSum+=s;tSum+=t;
    gaps.push({idx:i,student:s,teacher:t,gap:Math.abs(s-t)});
  }
  const sAvg=(sSum/count).toFixed(1), tAvg=(tSum/count).toFixed(1);

  let compHTML='';
  cat.studentQ.forEach((q,i)=>{
    const qKey=`${cat.key}_${i}`;
    const s=state.studentAnswers[qKey]||0, t=state.teacherAnswers[qKey]||0;
    const short=q.replace(/^(אני |הרגשתי |היו |ידעתי |יכולתי |לקחתי |היה |הגעתי |השתתפתי |הגשתי |השקעתי |שמרתי |שיתפתי |הייתי |הצבתי |עקבתי )/,'').substring(0,22);
    compHTML+=`<div class="compare-row"><div class="compare-label">${short}</div><div class="compare-bar-wrap"><div class="compare-bar" style="width:${s*25}%;background:var(--primary)"></div></div><div class="compare-val" style="color:var(--primary-dark)">${s}</div><div class="compare-bar-wrap"><div class="compare-bar" style="width:${t*25}%;background:var(--accent)"></div></div><div class="compare-val" style="color:var(--accent)">${t}</div></div>`;
  });

  const sorted=[...gaps].sort((a,b)=>b.gap-a.gap);
  let insights='';
  if(sorted[0]&&sorted[0].gap>=2){
    const dir=sorted[0].student>sorted[0].teacher?'התלמיד/ה מרגיש/ה חזק יותר ממה שהמורה רואה':'המורה רואה פוטנציאל שהתלמיד/ה עוד לא מזהה';
    insights+=`<div class="insight-card" style="border-right-color:var(--danger)"><div class="insight-title" style="color:var(--danger)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>פער שחשוב לדבר עליו</div><div class="insight-text">בשאלה ${sorted[0].idx+1}: ${dir}. זו הזדמנות לשיחה חשובה.</div></div>`;
  }
  const strengths=gaps.filter(g=>g.student>=3&&g.teacher>=3);
  if(strengths.length>0) insights+=`<div class="insight-card" style="border-right-color:var(--success)"><div class="insight-title" style="color:var(--success)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>חוזקות משותפות</div><div class="insight-text">שניכם מסכימים ש${strengths.length>1?`ב-${strengths.length} תחומים`:'בתחום אחד'} יש בסיס יציב!</div></div>`;
  const growth=gaps.filter(g=>g.student<=2&&g.teacher<=2);
  if(growth.length>0) insights+=`<div class="insight-card" style="border-right-color:var(--warn)"><div class="insight-title" style="color:var(--warn)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>מקום לצמיחה</div><div class="insight-text">שניכם מזהים ${growth.length>1?`${growth.length} תחומים`:'תחום אחד'} שאפשר לחזק. ההכרה הזו היא הצעד הראשון!</div></div>`;

  let actions='';
  if(sorted[0]&&sorted[0].gap>=2) actions+=`<div class="action-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>לדבר על הפער בשאלה ${sorted[0].idx+1} — מה כל אחד רואה אחרת?</span></div>`;
  if(growth.length>0) actions+=`<div class="action-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><span>לבנות יחד תוכנית קטנה לחיזוק תחום אחד — התחלה קטנה</span></div>`;
  if(strengths.length>0) actions+=`<div class="action-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span>לחגוג את החוזקות! לשמור על מה שעובד טוב</span></div>`;

  let openSum='';
  OPEN_QUESTIONS.forEach(oq=>{
    const sA=state.openStudent[oq.key]||'',tA=state.openTeacher[oq.key]||'';
    if(sA||tA) openSum+=`<div style="margin-bottom:12px"><div style="font-size:.85rem;font-weight:700;margin-bottom:8px">${oq.text}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${sA?`<div style="background:rgba(122,173,173,.06);border-radius:10px;padding:10px 14px;font-size:.82rem;line-height:1.6"><span style="font-size:.7rem;font-weight:700;color:var(--primary-dark);display:block;margin-bottom:4px">${state.studentName}</span>${sA}</div>`:'<div></div>'}${tA?`<div style="background:rgba(212,165,116,.08);border-radius:10px;padding:10px 14px;font-size:.82rem;line-height:1.6"><span style="font-size:.7rem;font-weight:700;color:var(--accent);display:block;margin-bottom:4px">${state.teacherName}</span>${tA}</div>`:'<div></div>'}</div></div>`;
  });

  el.innerHTML=`
    <div class="results-card"><div class="results-strip" style="background:${cat.color}"></div><div class="results-inner">
      <div class="results-title" style="color:${cat.color}">סיכום — ${cat.name}</div>
      <div class="results-sub">ציון ממוצע מתוך 4</div>
      <div class="results-names">
        <div class="results-name-tag student-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4-4v2"/><circle cx="12" cy="7" r="4"/></svg>${state.studentName}: <strong>${sAvg}</strong></div>
        <div class="results-name-tag teacher-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/></svg>${state.teacherName}: <strong>${tAvg}</strong></div>
      </div>
      <div class="comparison-grid">${compHTML}</div>
    </div></div>
    ${insights?`<div style="margin-bottom:16px">${insights}</div>`:''}
    ${openSum?`<div class="results-card"><div class="results-inner"><div style="font-size:1rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px"><svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" width="18" height="18"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>מה אמרנו בשיחה</div>${openSum}</div></div>`:''}
    <div class="action-plan"><div class="action-title">תוכנית פעולה משותפת</div><div class="action-sub">מה עושים מכאן?</div>${actions}
      <div class="action-commitments">
        <div class="commit-block"><label class="student-commit">מה ${state.studentName} מתחייב/ת</label><textarea placeholder="דבר אחד קטן שאני אעשה..."></textarea></div>
        <div class="commit-block"><label class="teacher-commit">מה ${state.teacherName} מתחייב/ת</label><textarea placeholder="מה אני נותן/ת כדי לעזור..."></textarea></div>
      </div>
      <div class="checkin-note"><svg viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>נפגשים שוב בעוד שבועיים לצ'ק-אין קצר</span></div>
    </div>
    <div class="safety-text">זו שיחה, לא מבחן. אין תשובות נכונות או לא נכונות</div>
    <button class="btn-submit" onclick="submitFeedback()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>שמירת המשוב</button>
    <button class="btn-print" onclick="window.print()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>הדפסה</button>`;
}

function submitFeedback(){
  const cat = CATEGORIES.find(c => c.key === state.selectedCat);
  const data = {timestamp:new Date().toISOString(),studentName:state.studentName,teacherName:state.teacherName,category:cat.name,studentAnswers:state.studentAnswers,teacherAnswers:state.teacherAnswers,openStudent:state.openStudent,openTeacher:state.openTeacher};
  console.log('Feedback data:',JSON.stringify(data,null,2));
  document.getElementById('successOverlay').classList.add('visible');
}

init();
</script>
</body>
</html>
