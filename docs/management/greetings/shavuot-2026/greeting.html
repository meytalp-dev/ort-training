<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>חג שבועות שמח — אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;700&family=Playpen+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1080px;
    background: #FAF6EE;
    font-family: 'Heebo', sans-serif;
    overflow: hidden;
  }
  .card {
    width: 1080px;
    height: 1080px;
    position: relative;
    background:
      radial-gradient(ellipse at top, #F9EFD8 0%, transparent 55%),
      radial-gradient(ellipse at bottom, #EFE4CC 0%, transparent 60%),
      linear-gradient(180deg, #FAF6EE 0%, #F4E8D0 100%);
    overflow: hidden;
  }

  .corner {
    position: absolute;
    width: 280px;
    height: 280px;
    opacity: 0.55;
  }
  .corner.tl { top: -20px; right: -20px; }
  .corner.br { bottom: -20px; left: -20px; transform: rotate(180deg); }

  .frame {
    position: absolute;
    inset: 50px;
    border: 2px solid rgba(193, 154, 91, 0.35);
    border-radius: 24px;
    pointer-events: none;
  }
  .frame::before, .frame::after {
    content: '';
    position: absolute;
    width: 32px;
    height: 32px;
    border: 2px solid #C19A5B;
  }
  .frame::before {
    top: -8px; right: -8px;
    border-bottom: none; border-left: none;
    border-top-right-radius: 8px;
  }
  .frame::after {
    bottom: -8px; left: -8px;
    border-top: none; border-right: none;
    border-bottom-left-radius: 8px;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 80px 100px 60px;
    text-align: center;
  }

  .eyebrow {
    font-family: 'Heebo', sans-serif;
    font-weight: 400;
    font-size: 20px;
    color: #8B6F3F;
    letter-spacing: 6px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .eyebrow::before, .eyebrow::after {
    content: '';
    width: 50px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #C19A5B, transparent);
  }

  h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 900;
    font-size: 116px;
    color: #3E2F1F;
    line-height: 1.0;
    letter-spacing: -2px;
    margin-top: 38px;
  }
  h1 .accent {
    color: #B8893E;
    display: inline-block;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 28px;
  }
  .divider .line {
    width: 70px; height: 1px;
    background: #C19A5B;
  }
  .divider .dot {
    width: 7px; height: 7px;
    background: #B8893E;
    border-radius: 50%;
    transform: rotate(45deg);
  }

  .message {
    font-family: 'Playpen Sans Hebrew', sans-serif;
    font-weight: 500;
    font-size: 26px;
    color: #4A3826;
    line-height: 1.7;
    max-width: 740px;
    margin-top: 30px;
  }
  .message strong {
    color: #8B6F3F;
    font-weight: 600;
  }

  .signature {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-top: auto;
  }
  .signature-name {
    font-family: 'Playpen Sans Hebrew', sans-serif;
    font-weight: 600;
    font-size: 28px;
    color: #3E2F1F;
  }
  .signature-school {
    font-family: 'Heebo', sans-serif;
    font-weight: 400;
    font-size: 18px;
    color: #8B6F3F;
    letter-spacing: 2px;
  }

  .logos {
    margin-top: 30px;
    padding-top: 26px;
    border-top: 1px solid rgba(193, 154, 91, 0.3);
    width: 80%;
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 50px;
  }
  .logos img {
    height: 100px;
    width: auto;
    object-fit: contain;
  }
  .logos .logo-misrad {
    height: 70px;
  }

  /* שיבולים */
  .wheat-decor {
    position: absolute;
    z-index: 1;
  }
  .wheat-left {
    top: 240px;
    right: 70px;
    width: 110px;
    transform: rotate(-15deg);
    opacity: 0.45;
  }
  .wheat-right {
    top: 240px;
    left: 70px;
    width: 110px;
    transform: rotate(15deg) scaleX(-1);
    opacity: 0.45;
  }
</style>
</head>
<body>
  <div class="card">

    <!-- שיבולים בפינות עליונה-ימנית ותחתונה-שמאלית -->
    <svg class="corner tl" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#C19A5B" stroke-width="2.5" stroke-linecap="round">
        <path d="M 280 40 Q 200 120 140 220"/>
        <ellipse cx="265" cy="55" rx="6" ry="14" fill="#D4A574" stroke="none" transform="rotate(35 265 55)"/>
        <ellipse cx="245" cy="75" rx="6" ry="14" fill="#D4A574" stroke="none" transform="rotate(35 245 75)"/>
        <ellipse cx="225" cy="95" rx="6" ry="14" fill="#D4A574" stroke="none" transform="rotate(35 225 95)"/>
        <ellipse cx="205" cy="115" rx="6" ry="14" fill="#D4A574" stroke="none" transform="rotate(35 205 115)"/>
        <ellipse cx="185" cy="135" rx="6" ry="14" fill="#D4A574" stroke="none" transform="rotate(35 185 135)"/>
        <ellipse cx="165" cy="160" rx="6" ry="14" fill="#D4A574" stroke="none" transform="rotate(35 165 160)"/>
        <path d="M 280 40 Q 295 60 280 80" stroke="#8BA888" stroke-width="3" fill="#A8C09A"/>
        <path d="M 250 70 Q 270 85 260 105" stroke="#8BA888" stroke-width="2.5" fill="#A8C09A"/>
        <circle cx="100" cy="260" r="20" fill="#C25B5B" opacity="0.7"/>
        <path d="M 100 240 L 95 234 L 105 234 Z" fill="#8B4A3F"/>
        <circle cx="100" cy="260" r="2" fill="#FAF6EE"/>
        <circle cx="95" cy="263" r="2" fill="#FAF6EE"/>
        <circle cx="105" cy="263" r="2" fill="#FAF6EE"/>
      </g>
    </svg>

    <svg class="corner br" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#C19A5B" stroke-width="2.5" stroke-linecap="round">
        <path d="M 280 40 Q 200 120 140 220"/>
        <ellipse cx="265" cy="55" rx="6" ry="14" fill="#D4A574" stroke="none" transform="rotate(35 265 55)"/>
        <ellipse cx="245" cy="75" rx="6" ry="14" fill="#D4A574" stroke="none" transform="rotate(35 245 75)"/>
        <ellipse cx="225" cy="95" rx="6" ry="14" fill="#D4A574" stroke="none" transform="rotate(35 225 95)"/>
        <ellipse cx="205" cy="115" rx="6" ry="14" fill="#D4A574" stroke="none" transform="rotate(35 205 115)"/>
        <ellipse cx="185" cy="135" rx="6" ry="14" fill="#D4A574" stroke="none" transform="rotate(35 185 135)"/>
        <ellipse cx="165" cy="160" rx="6" ry="14" fill="#D4A574" stroke="none" transform="rotate(35 165 160)"/>
        <path d="M 280 40 Q 295 60 280 80" stroke="#8BA888" stroke-width="3" fill="#A8C09A"/>
        <g transform="translate(80,250)">
          <circle cx="0" cy="0" r="8" fill="#7A5A8A" opacity="0.7"/>
          <circle cx="13" cy="0" r="8" fill="#7A5A8A" opacity="0.7"/>
          <circle cx="-13" cy="0" r="8" fill="#7A5A8A" opacity="0.7"/>
          <circle cx="6" cy="13" r="8" fill="#7A5A8A" opacity="0.7"/>
          <circle cx="-6" cy="13" r="8" fill="#7A5A8A" opacity="0.7"/>
          <circle cx="0" cy="24" r="8" fill="#7A5A8A" opacity="0.7"/>
        </g>
      </g>
    </svg>

    <svg class="wheat-decor wheat-left" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
      <line x1="50" y1="10" x2="50" y2="190" stroke="#B8893E" stroke-width="2"/>
      <g fill="#D4A574">
        <ellipse cx="40" cy="30" rx="7" ry="16" transform="rotate(-25 40 30)"/>
        <ellipse cx="60" cy="30" rx="7" ry="16" transform="rotate(25 60 30)"/>
        <ellipse cx="38" cy="60" rx="7" ry="16" transform="rotate(-25 38 60)"/>
        <ellipse cx="62" cy="60" rx="7" ry="16" transform="rotate(25 62 60)"/>
        <ellipse cx="38" cy="90" rx="7" ry="16" transform="rotate(-25 38 90)"/>
        <ellipse cx="62" cy="90" rx="7" ry="16" transform="rotate(25 62 90)"/>
        <ellipse cx="38" cy="120" rx="7" ry="16" transform="rotate(-25 38 120)"/>
        <ellipse cx="62" cy="120" rx="7" ry="16" transform="rotate(25 62 120)"/>
      </g>
    </svg>

    <svg class="wheat-decor wheat-right" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
      <line x1="50" y1="10" x2="50" y2="190" stroke="#B8893E" stroke-width="2"/>
      <g fill="#D4A574">
        <ellipse cx="40" cy="30" rx="7" ry="16" transform="rotate(-25 40 30)"/>
        <ellipse cx="60" cy="30" rx="7" ry="16" transform="rotate(25 60 30)"/>
        <ellipse cx="38" cy="60" rx="7" ry="16" transform="rotate(-25 38 60)"/>
        <ellipse cx="62" cy="60" rx="7" ry="16" transform="rotate(25 62 60)"/>
        <ellipse cx="38" cy="90" rx="7" ry="16" transform="rotate(-25 38 90)"/>
        <ellipse cx="62" cy="90" rx="7" ry="16" transform="rotate(25 62 90)"/>
        <ellipse cx="38" cy="120" rx="7" ry="16" transform="rotate(-25 38 120)"/>
        <ellipse cx="62" cy="120" rx="7" ry="16" transform="rotate(25 62 120)"/>
      </g>
    </svg>

    <div class="frame"></div>

    <div class="content">
      <div class="eyebrow">חג מתן תורה · חג הביכורים · חג הקציר</div>

      <h1>חג שבועות <span class="accent">שמח</span></h1>

      <div class="divider">
        <div class="line"></div>
        <div class="dot"></div>
        <div class="line"></div>
      </div>

      <div class="message">
        לקהילת <strong>אורט בית הערבה</strong> היקרה —<br>
        מורים ומורות, תלמידים ותלמידות,<br>
        <strong>הורים ושותפים יקרים</strong>.<br><br>
        שיהיה חג של <strong>למידה, גילוי וצמיחה</strong>,<br>
        ושנזכה לקצור יחד את פירות מה שזרענו השנה.
      </div>

      <div class="signature">
        <div class="signature-name">מיטל פלג והצוות החינוכי</div>
        <div class="signature-school">אורט בית הערבה</div>
      </div>

      <div class="logos">
        <img src="logo-ort.png" alt="אורט בית הערבה" class="logo-ort">
        <img src="logo-misrad.png" alt="משרד העבודה — אגף בכיר להכשרה מקצועית" class="logo-misrad">
      </div>
    </div>

  </div>
</body>
</html>
