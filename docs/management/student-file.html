<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>תיק תלמיד — אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Dream Theme — לחלום.ליצור.להוביל */
  --dream:#8E7ED4;--dream-light:#D4CEF0;--dream-dark:#5B4BA0;
  --create:#E8B060;--create-light:#F5DEB0;--create-dark:#D48A2C;
  --lead:#3AACA0;--lead-light:#B8E4DE;--lead-dark:#1B7A6E;
  --spark:#E8909C;--spark-dark:#D45C6E;
  --bg:#fff;--bg-alt:#FAFBFC;--card:#fff;
  --text:#2C2622;--text-light:#6E6258;--text-lighter:#8C7E72;--muted:#6E6258;
  --border:#EDE6D8;--border-light:#fff;
  --primary:#3AACA0;--primary-dark:#1B7A6E;--primary-light:#B8E4DE;
  --accent:#E8B060;--accent-dark:#D48A2C;
  --success:#4CAF50;--success-bg:#E8F5E9;--warn:#E8B060;--warn-bg:#FFF3E0;
  --danger:#D45C6E;--danger-bg:#FCE7EA;--info:#5B9BD5;--info-bg:#E6F0FA;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 8px rgba(44,38,34,.05);--shadow-sm:0 2px 8px rgba(44,38,34,.05);
  --shadow-md:0 6px 20px rgba(44,38,34,.08);--shadow-lg:0 12px 40px rgba(44,38,34,.1);
  --sage:#8E7ED4;--dusty-rose:#C9A0A0;--warm-gold:#E8B060;
  --dim-belong:#E06090;--dim-respect:#5B9BD5;--dim-motiv:#E8A838;--dim-capable:#8B6BC0;--dim-auto:#7AB648;
}
body{font-family:'Heebo',sans-serif;background:#fff;color:var(--text);min-height:100vh;line-height:1.6}
h1,h2,h3,h4{font-family:'Playpen Sans Hebrew','Heebo',sans-serif}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.04) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.04) 0%,transparent 70%),
    radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.03) 0%,transparent 70%);
  pointer-events:none;z-index:0}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

/* ===== LOGIN ===== */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-card{background:var(--card);border-radius:28px;border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:48px 44px;max-width:540px;width:100%;text-align:center;animation:slideUp .5s ease}
.login-card img{height:64px;margin-bottom:16px}
.login-card h1{font-size:1.3rem;margin-bottom:6px;font-weight:800;font-family:Heebo}
.login-card .subtitle{color:var(--muted);font-size:.88rem;margin-bottom:32px}
.role-cards{display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap;justify-content:center}
.role-card{flex:1;min-width:90px;max-width:130px;padding:18px 10px;border-radius:18px;border:2px solid var(--border);cursor:pointer;transition:.25s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.role-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.role-card.selected{border-width:3px}
.role-card svg{width:28px;height:28px}
.role-card .role-name{font-size:.82rem;font-weight:700}
.role-card[data-role="principal"]{background:rgba(58,172,160,.08)}.role-card[data-role="principal"].selected{border-color:var(--primary);background:rgba(58,172,160,.16)}
.role-card[data-role="deputy"]{background:rgba(91,155,213,.08)}.role-card[data-role="deputy"].selected{border-color:var(--dim-respect);background:rgba(91,155,213,.16)}
.role-card[data-role="treatment"]{background:rgba(232,144,156,.08)}.role-card[data-role="treatment"].selected{border-color:var(--dusty-rose);background:rgba(232,144,156,.16)}
.role-card[data-role="counselor"]{background:rgba(232,176,96,.08)}.role-card[data-role="counselor"].selected{border-color:var(--warm-gold);background:rgba(232,176,96,.16)}
.role-card[data-role="teacher"]{background:rgba(142,126,212,.08)}.role-card[data-role="teacher"].selected{border-color:var(--sage);background:rgba(142,126,212,.16)}
.role-card[data-role="student"]{background:rgba(139,107,192,.08)}.role-card[data-role="student"].selected{border-color:var(--dim-capable);background:rgba(139,107,192,.16)}
.login-fields{margin-bottom:24px;text-align:right;display:none}
.login-fields.visible{display:block;animation:fadeIn .3s ease}
.login-fields label{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px}
.login-fields select{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:14px;font-family:Heebo;font-size:.92rem;color:var(--text);background:var(--card);cursor:pointer;outline:none;margin-bottom:12px}
.login-btn{width:100%;padding:14px;border:none;border-radius:14px;background:var(--primary);color:#fff;font-family:Heebo;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s;opacity:.5;pointer-events:none}
.login-btn.ready{opacity:1;pointer-events:auto}
.login-btn.ready:hover{background:var(--primary-dark)}

/* ===== HEADER ===== */
.header{background:linear-gradient(180deg,rgba(142,126,212,.18) 0%,#fff 100%);color:var(--text);padding:0 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:50;min-height:64px;box-shadow:0 2px 12px rgba(44,38,34,.06)}
.header::before{content:'';position:absolute;bottom:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--dim-belong),var(--dim-respect),var(--dim-motiv),var(--dim-capable),var(--dim-auto));pointer-events:none}
.header-right{display:flex;align-items:center;gap:14px}
.header-right img{height:36px}
.header-right h1{font-size:1.05rem;font-weight:800;font-family:Heebo;display:flex;align-items:center;gap:8px}
.header-badge{background:linear-gradient(135deg,rgba(142,126,212,.2),rgba(142,126,212,.15));padding:4px 14px;border-radius:20px;font-size:.72rem;font-weight:600;color:#5B4BA0;border:1px solid rgba(142,126,212,.3)}
.header-left{display:flex;align-items:center;gap:12px}
.back-link,.switch-user{color:var(--muted);text-decoration:none;font-size:.82rem;font-weight:500;transition:color .2s;display:flex;align-items:center;gap:4px;cursor:pointer;background:none;border:none;font-family:Heebo}
.back-link:hover,.switch-user:hover{color:var(--primary-dark)}
.role-badge{padding:4px 14px;border-radius:20px;font-size:.75rem;font-weight:600;color:#fff}

/* ===== MAIN APP ===== */
.main-app{display:none;min-height:100vh}
.container{max-width:1400px;margin:0 auto;padding:20px 28px}

/* ===== SIDEBAR + CONTENT LAYOUT ===== */
.app-layout{display:grid;grid-template-columns:300px 1fr;gap:20px;min-height:calc(100vh - 80px)}
@media(max-width:900px){.app-layout{grid-template-columns:1fr}}

/* ===== STUDENT LIST (sidebar) ===== */
.student-list{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden;position:sticky;top:80px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.list-header{padding:14px 16px;border-bottom:1px solid var(--border);background:rgba(245,240,232,.4)}
.list-header h3{font-size:.9rem;font-weight:700;font-family:Heebo;margin-bottom:8px}
.list-search{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:Heebo;font-size:.82rem;background:#fff;transition:border-color .2s}
.list-search:focus{outline:none;border-color:var(--primary)}
.list-filters{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.list-filter{padding:4px 10px;border:1px solid var(--border);border-radius:8px;font-size:.72rem;font-family:Heebo;cursor:pointer;background:var(--card);transition:all .15s;font-weight:500}
.list-filter:hover{border-color:var(--primary)}
.list-filter.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.list-body{flex:1;overflow-y:auto;padding:4px 0}
.student-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;transition:background .15s;border-bottom:1px solid rgba(232,221,208,.3)}
.student-item:hover{background:rgba(58,172,160,.04)}
.student-item.selected{background:rgba(58,172,160,.08);border-right:3px solid var(--primary)}
.student-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:#fff;flex-shrink:0}
.student-avatar.male{background:linear-gradient(135deg,var(--primary),var(--primary-dark))}
.student-avatar.female{background:linear-gradient(135deg,var(--dusty-rose),#B08080)}
.student-info{flex:1;min-width:0}
.student-info .name{font-size:.88rem;font-weight:700;font-family:Heebo;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.student-info .meta{font-size:.72rem;color:var(--muted)}
.student-avg{font-size:.82rem;font-weight:800;min-width:32px;text-align:center;padding:2px 6px;border-radius:8px}
.avg-green{background:var(--success-bg);color:var(--success)}
.avg-yellow{background:var(--warn-bg);color:var(--warn)}
.avg-red{background:var(--danger-bg);color:var(--danger)}
.avg-none{background:rgba(0,0,0,.04);color:var(--muted)}
.list-count{padding:8px 16px;border-top:1px solid var(--border);font-size:.72rem;color:var(--muted);text-align:center;background:rgba(245,240,232,.3)}

/* ===== STUDENT DETAIL (main area) ===== */
.student-detail{min-width:0}
.detail-empty{display:flex;align-items:center;justify-content:center;min-height:400px;color:var(--muted);text-align:center}
.detail-empty svg{width:64px;height:64px;margin-bottom:16px;opacity:.3}
.detail-empty h3{font-size:1.1rem;font-weight:700;font-family:Heebo;color:var(--text);margin-bottom:4px}

/* ===== STUDENT HEADER CARD ===== */
.student-header{background:var(--card);border-radius:var(--radius);padding:24px 28px;margin-bottom:16px;border:1px solid var(--border);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:20px}
.student-header .avatar-lg{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.4rem;color:#fff;flex-shrink:0}
.student-header .info{flex:1}
.student-header .info h2{font-size:1.25rem;font-weight:900;font-family:Heebo;margin-bottom:4px}
.student-header .info .tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:3px 12px;border-radius:20px;font-size:.72rem;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.tag-class{background:rgba(58,172,160,.1);color:var(--primary-dark);border:1px solid rgba(58,172,160,.2)}
.tag-megama{background:rgba(232,176,96,.1);color:var(--accent-dark);border:1px solid rgba(232,176,96,.2)}
.tag-gender{background:rgba(142,126,212,.1);color:#5B4BA0;border:1px solid rgba(142,126,212,.2)}
.student-header .stats{display:flex;gap:16px;text-align:center}
.student-header .stat{min-width:60px}
.student-header .stat .val{font-size:1.5rem;font-weight:900;font-family:Heebo;line-height:1}
.student-header .stat .lbl{font-size:.68rem;color:var(--muted);margin-top:2px}

/* ===== TABS ===== */
.tabs{display:flex;gap:2px;background:var(--card);border-radius:16px 16px 0 0;border:1px solid var(--border);border-bottom:none;overflow-x:auto;box-shadow:var(--shadow-sm)}
.tab-btn{background:transparent;border:none;color:var(--muted);padding:14px 16px;font-family:Heebo;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .2s;position:relative;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--primary-dark);font-weight:700}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:8px;right:8px;height:2.5px;background:linear-gradient(90deg,var(--primary),var(--warm-gold));border-radius:2px 2px 0 0}
.tab-btn svg{width:15px;height:15px;flex-shrink:0}
.tab-panel{display:none;background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 16px 16px;padding:24px;box-shadow:var(--shadow-sm)}
.tab-panel.active{display:block;animation:fadeIn .3s ease}

/* ===== INFO CARDS ===== */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.info-grid{grid-template-columns:1fr}}
.info-card{background:rgba(245,240,232,.4);border-radius:14px;padding:16px 18px;border:1px solid rgba(232,221,208,.5)}
.info-card h4{font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:10px;font-family:Heebo;display:flex;align-items:center;gap:6px}
.info-card h4 svg{width:14px;height:14px;flex-shrink:0}
.info-row{display:flex;justify-content:space-between;padding:5px 0;font-size:.83rem;border-bottom:1px solid rgba(232,221,208,.3)}
.info-row:last-child{border-bottom:none}
.info-row .lbl{color:var(--muted);font-size:.78rem}
.info-row .val{font-weight:600;text-align:left;max-width:60%}

/* ===== GRADES TABLE ===== */
.grades-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.83rem}
.grades-table th{background:rgba(245,240,232,.6);padding:10px 12px;font-weight:700;font-family:Heebo;text-align:right;border-bottom:2px solid var(--border);font-size:.78rem;color:var(--muted)}
.grades-table td{padding:9px 12px;border-bottom:1px solid rgba(232,221,208,.4);vertical-align:middle}
.grades-table tr:last-child td{border-bottom:none}
.grade-cell{font-weight:700;text-align:center;min-width:36px;padding:2px 8px;border-radius:8px;display:inline-block}
.grade-green{background:var(--success-bg);color:var(--success)}
.grade-yellow{background:var(--warn-bg);color:var(--warn)}
.grade-red{background:var(--danger-bg);color:var(--danger)}
.grade-none{color:var(--muted);font-weight:400}

/* ===== COUNSELOR REPORT ===== */
.report-section{background:rgba(245,240,232,.4);border-radius:14px;padding:18px 20px;margin-bottom:14px;border:1px solid rgba(232,221,208,.5)}
.report-section h4{font-size:.88rem;font-weight:700;font-family:Heebo;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.report-text{font-size:.85rem;line-height:1.8;white-space:pre-wrap}
.monthly-entry{background:var(--card);border-radius:10px;padding:12px 16px;margin-bottom:8px;border:1px solid var(--border)}
.monthly-entry .month-label{font-weight:700;font-size:.82rem;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.monthly-entry .month-text{font-size:.83rem;line-height:1.7;white-space:pre-wrap}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.status-dot.stable{background:var(--success)}
.status-dot.improving{background:var(--primary)}
.status-dot.declining{background:var(--danger)}
.status-dot.at-risk{background:var(--warn)}

/* ===== TACHI CARD ===== */
.tachi-card{background:rgba(58,172,160,.04);border:1.5px solid rgba(58,172,160,.15);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.tachi-card h4{font-size:.88rem;font-weight:700;color:var(--primary-dark);margin-bottom:10px;font-family:Heebo}
.tachi-goals{list-style:none;padding:0}
.tachi-goals li{padding:4px 0;font-size:.83rem;display:flex;align-items:flex-start;gap:6px}
.tachi-goals li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:8px}
.support-item{display:flex;gap:12px;padding:6px 0;font-size:.83rem;border-bottom:1px solid rgba(232,221,208,.3)}
.support-item:last-child{border-bottom:none}

/* ===== DEVELOPMENT — HOLISTIC MAP ===== */
.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
@media(max-width:700px){.dev-grid{grid-template-columns:1fr}}
.dev-card{background:var(--card);border-radius:16px;padding:18px 20px;border:2px solid var(--border);transition:transform .15s}
.dev-card:hover{transform:translateY(-2px)}
.dev-card h4{font-size:.88rem;font-weight:700;font-family:Heebo;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.dev-card h4 .dev-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dev-card h4 svg{width:18px;height:18px}
.dev-score-big{font-size:2rem;font-weight:900;font-family:Heebo;line-height:1}
.dev-bar-wrap{height:8px;background:rgba(0,0,0,.06);border-radius:8px;overflow:hidden;margin-top:6px}
.dev-bar{height:100%;border-radius:8px;transition:width .6s ease}
.dev-sub{display:flex;justify-content:space-between;padding:5px 0;font-size:.78rem;border-bottom:1px solid rgba(232,221,208,.2)}
.dev-sub:last-child{border-bottom:none}
.dev-sub .sub-label{color:var(--muted)}
.dev-sub .sub-val{font-weight:700}

/* ===== TIMELINE CHART ===== */
.timeline-chart{position:relative;margin:20px 0;padding:20px 0}
.timeline-chart canvas{width:100%;max-height:260px}
.timeline-legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.timeline-legend-item{display:flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600}
.timeline-legend-dot{width:10px;height:10px;border-radius:50%}

/* ===== SKILLS RUBRIC ===== */
.skill-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(232,221,208,.3)}
.skill-row:last-child{border-bottom:none}
.skill-name{font-size:.83rem;font-weight:600;min-width:140px}
.skill-dots{display:flex;gap:4px}
.skill-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;transition:all .2s}
.skill-dot.filled{border-color:var(--primary);background:var(--primary);color:#fff}

/* ===== NOTES ===== */
.note-item{background:rgba(245,240,232,.5);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px}
.note-item .note-text{flex:1;font-size:.85rem;line-height:1.5}
.note-item .note-meta{font-size:.7rem;color:var(--muted);white-space:nowrap}
.note-input-row{display:flex;gap:8px;margin-top:12px}
.note-input{flex:1;padding:9px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:Heebo;font-size:.85rem;background:#fff;transition:border-color .2s}
.note-input:focus{outline:none;border-color:var(--primary)}
.btn{padding:8px 18px;border:none;border-radius:10px;font-family:Heebo;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-sm{padding:5px 12px;font-size:.78rem}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .header{padding:0 16px}
  .container{padding:16px}
  .student-list{position:static;max-height:300px}
  .student-header{flex-direction:column;text-align:center}
  .student-header .stats{justify-content:center}
  .tabs{padding:0 4px}
  .tab-btn{padding:10px 10px;font-size:.78rem}
  .tab-panel{padding:16px}
}
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <img src="logo-ort.png" alt="אורט בית הערבה">
    <h1>תיק תלמיד</h1>
    <div class="subtitle">מערכת מאוחדת לליווי תלמידים — אורט בית הערבה</div>

    <div class="role-cards" id="roleCards">
      <div class="role-card" data-role="principal" onclick="selectRole('principal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0113 0"/><path d="M17 11l2 2 4-4"/></svg>
        <div class="role-name">מנהלת</div>
      </div>
      <div class="role-card" data-role="deputy" onclick="selectRole('deputy')">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--dim-respect)" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <div class="role-name">סגנית</div>
      </div>
      <div class="role-card" data-role="treatment" onclick="selectRole('treatment')">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--dusty-rose)" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg>
        <div class="role-name">רכזת טיפול</div>
      </div>
      <div class="role-card" data-role="counselor" onclick="selectRole('counselor')">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--warm-gold)" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        <div class="role-name">יועצת</div>
      </div>
      <div class="role-card" data-role="teacher" onclick="selectRole('teacher')">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--sage)" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
        <div class="role-name">מחנכת</div>
      </div>
      <div class="role-card" data-role="student" onclick="selectRole('student')">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--dim-capable)" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c6 3 12 0 12 0v-5"/></svg>
        <div class="role-name">תלמיד/ה</div>
      </div>
    </div>

    <div class="login-fields" id="loginFields">
      <label id="loginLabel">בחרי שם:</label>
      <select id="loginSelect" onchange="checkReady()">
        <option value="">בחרי...</option>
      </select>
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()">כניסה</button>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="main-app" id="mainApp">

  <!-- Header -->
  <header class="header">
    <div class="header-right">
      <img src="logo-ort.png" alt="אורט">
      <h1>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4-4v2"/><circle cx="12" cy="7" r="4"/></svg>
        תיק תלמיד
        <span class="header-badge">תשפ"ז</span>

      <span class="role-badge" id="roleBadge" style="background:var(--primary)"></span>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        החלפת משתמש
      </button>
      <a href="index.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        חזרה למערכת

  <div class="container">
    <div class="app-layout">

      <!-- Student List Sidebar -->
      <div class="student-list" id="studentList">
        <div class="list-header">

          <input type="text" class="list-search" id="listSearch" placeholder="חיפוש לפי שם..." oninput="renderList()">
          <div class="list-filters" id="listFilters"></div>
        </div>
        <div class="list-body" id="listBody"></div>
        <div class="list-count" id="listCount"></div>

      <!-- Student Detail -->
      <div class="student-detail" id="studentDetail">
        <div class="detail-empty" id="detailEmpty">
          <div>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4-4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <h3>בחרי תלמיד/ה</h3>
            <p style="font-size:.85rem">לחצי על שם ברשימה כדי לפתוח את התיק</p>
          </div>
        </div>
        <div id="detailContent" style="display:none">
          <!-- Student Header -->
          <div class="student-header" id="sHeader"></div>

          <!-- Tabs -->

          <!-- Tab Panels -->

<!-- Load student data -->
<script src="student-data.js"></script>
<script src="student-data-extra.js"></script>
<script src="counselor-reports-data.js"></script>
<script src="cloud-storage.js"></script>

<script>
// ============================================================
// STATE
// ============================================================
var state = {
  role: null,
  userName: '',
  allowedClasses: [],
  selectedStudentId: null,
  activeTab: 'profile'
};

var ROLE_LABELS = {principal:'מנהלת',deputy:'סגנית',treatment:'רכזת טיפול',counselor:'יועצת',teacher:'מחנכת',student:'תלמיד/ה'};
var ROLE_COLORS = {principal:'var(--primary)',deputy:'var(--dim-respect)',treatment:'var(--dusty-rose)',counselor:'var(--warm-gold)',teacher:'var(--sage)',student:'var(--dim-capable)'};
var MEGAMA_LABELS = {"90306":"מחשבים","90603":"עיצוב שיער","91206":"אוטוטרוניקה","91207":"חשמל רכב"};
var CLASS_ORDER = ['ט1','ט2','י1','י2','י3','יא1','יא2','יא3','יב1','יב2','יב3'];

var TAB_DEFS = [
  {id:'profile',label:'פרופיל',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4-4v2"/><circle cx="12" cy="7" r="4"/></svg>'},
  {id:'academic',label:'לימודי',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>'},
  {id:'treatment',label:'טיפולי',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg>'},
  {id:'development',label:'התפתחות',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'},
  {id:'conversations',label:'שיחות',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>'},
  {id:'journey',label:'מסע אישי',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'},
  {id:'investments',label:'בנק השקעות',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>'},
  {id:'attendance',label:'נוכחות',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>'},
  {id:'tardiness',label:'איחורים',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/><path d="M4.93 4.93l14.14 14.14"/></svg>'},
  {id:'incidents',label:'אירועים חריגים',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'},
  {id:'documents',label:'מסמכים',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>'}
];

// ============================================================
// LOGIN
// ============================================================
function selectRole(role) {
  state.role = role;
  document.querySelectorAll('.role-card').forEach(function(c) { c.classList.toggle('selected', c.dataset.role === role); });

  var fields = document.getElementById('loginFields');
  var sel = document.getElementById('loginSelect');
  var label = document.getElementById('loginLabel');
  sel.innerHTML = '<option value="">בחרי...</option>';

  if (role === 'principal') {
    fields.classList.add('visible');
    label.textContent = 'שם:';
    sel.innerHTML = '<option value="מיטל פלג">מיטל פלג</option>';
    sel.value = 'מיטל פלג';
    checkReady();
  } else if (role === 'deputy') {
    fields.classList.add('visible');
    label.textContent = 'שם:';
    sel.innerHTML = '<option value="רווית גל">רווית גל</option>';
    sel.value = 'רווית גל';
    checkReady();
  } else if (role === 'treatment') {
    fields.classList.add('visible');
    label.textContent = 'שם:';
    sel.innerHTML = '<option value="יסכה">יסכה</option>';
    sel.value = 'יסכה';
    checkReady();
  } else if (role === 'counselor') {
    fields.classList.add('visible');
    label.textContent = 'שם היועצת:';
    COUNSELORS.forEach(function(c) {
      sel.innerHTML += '<option value="' + c.name + '">' + c.name + ' (' + c.classes.join(', ') + ')</option>';
    });
    checkReady();
  } else if (role === 'teacher') {
    fields.classList.add('visible');
    label.textContent = 'שם המחנכת:';
    TEACHERS.forEach(function(t) {
      sel.innerHTML += '<option value="' + t.name + '">' + t.name + '</option>';
    });
    checkReady();
  } else if (role === 'student') {
    fields.classList.add('visible');
    label.textContent = 'שם התלמיד/ה:';
    STUDENTS.forEach(function(s) {
      sel.innerHTML += '<option value="' + s.id + '">' + s.first + ' ' + s.last + ' — ' + s.cls + '</option>';
    });
    checkReady();
  }
}

function checkReady() {
  var sel = document.getElementById('loginSelect');
  var btn = document.getElementById('loginBtn');
  btn.classList.toggle('ready', !!sel.value);
}

function doLogin() {
  var sel = document.getElementById('loginSelect');
  if (!sel.value) return;

  state.userName = sel.options[sel.selectedIndex].textContent;

  // Set allowed classes
  if (state.role === 'principal' || state.role === 'deputy' || state.role === 'treatment') {
    state.allowedClasses = CLASS_ORDER.slice();
  } else if (state.role === 'counselor') {
    var counselor = COUNSELORS.find(function(c) { return c.name === sel.value; });
    state.allowedClasses = counselor ? counselor.classes.slice() : [];
    state.userName = sel.value;
  } else if (state.role === 'teacher') {
    var teacher = TEACHERS.find(function(t) { return t.name === sel.value; });
    state.allowedClasses = teacher ? teacher.classes : [];
    state.userName = sel.value;
  } else if (state.role === 'student') {
    state.selectedStudentId = parseInt(sel.value);
    state.allowedClasses = [];
  }

  // Show app
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';

  // Set role badge
  var badge = document.getElementById('roleBadge');
  badge.textContent = state.userName;
  badge.style.background = ROLE_COLORS[state.role];

  // Student mode — go directly to their file
  if (state.role === 'student') {
    document.getElementById('studentList').style.display = 'none';
    document.querySelector('.app-layout').style.gridTemplateColumns = '1fr';
    selectStudent(state.selectedStudentId);
    return;
  }

  buildFilters();
  renderList();
}

function switchUser() {
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  state.role = null;
  state.selectedStudentId = null;
  document.querySelectorAll('.role-card').forEach(function(c) { c.classList.remove('selected'); });
  document.getElementById('loginFields').classList.remove('visible');
  document.getElementById('loginBtn').classList.remove('ready');
  document.getElementById('studentList').style.display = '';
  document.querySelector('.app-layout').style.gridTemplateColumns = '';
}

// ============================================================
// STUDENT LIST
// ============================================================
function getVisibleStudents() {
  if (state.role === 'student') return STUDENTS.filter(function(s) { return s.id === state.selectedStudentId; });
  return STUDENTS.filter(function(s) { return state.allowedClasses.indexOf(s.cls) > -1; });
}

function buildFilters() {
  var container = document.getElementById('listFilters');
  container.innerHTML = '<span class="list-filter active" data-cls="all" onclick="setClassFilter(this)">הכל</span>';
  state.allowedClasses.forEach(function(cls) {
    container.innerHTML += '<span class="list-filter" data-cls="' + cls + '" onclick="setClassFilter(this)">' + cls + '</span>';
  });
}

var activeClassFilter = 'all';
function setClassFilter(el) {
  activeClassFilter = el.dataset.cls;
  document.querySelectorAll('.list-filter').forEach(function(f) { f.classList.toggle('active', f === el); });
  renderList();
}

function renderList() {
  var search = document.getElementById('listSearch').value.trim().toLowerCase();
  var students = getVisibleStudents();

  if (activeClassFilter !== 'all') {
    students = students.filter(function(s) { return s.cls === activeClassFilter; });
  }
  if (search) {
    students = students.filter(function(s) {
      return (s.first + ' ' + s.last).toLowerCase().indexOf(search) > -1 ||
             (s.last + ' ' + s.first).toLowerCase().indexOf(search) > -1;
    });
  }

  // Sort by class order, then name
  students.sort(function(a, b) {
    var ci = CLASS_ORDER.indexOf(a.cls) - CLASS_ORDER.indexOf(b.cls);
    if (ci !== 0) return ci;
    return (a.last + a.first).localeCompare(b.last + b.first, 'he');
  });

  var body = document.getElementById('listBody');
  body.innerHTML = students.map(function(s) {
    var fullName = s.last + ' ' + s.first;
    var g = GRADES[fullName] || GRADES[s.first + ' ' + s.last] || {};
    var avg = g.avg2 || g.avg1 || null;
    var avgClass = avg === null ? 'avg-none' : avg >= 70 ? 'avg-green' : avg >= 55 ? 'avg-yellow' : 'avg-red';
    var sel = s.id === state.selectedStudentId ? ' selected' : '';
    var initial = s.first.charAt(0);
    var genderClass = s.gender === 'נ' ? 'female' : 'male';

    return '<div class="student-item' + sel + '" onclick="selectStudent(' + s.id + ')">' +
      '<div class="student-avatar ' + genderClass + '">' + initial + '</div>' +
      '<div class="student-info"><div class="name">' + esc(s.first + ' ' + s.last) + '</div><div class="meta">' + s.cls + (MEGAMA_LABELS[s.megama] ? ' · ' + MEGAMA_LABELS[s.megama] : '') + '</div></div>' +
      '<div class="student-avg ' + avgClass + '">' + (avg !== null ? avg : '—') + '</div>' +
    '</div>';
  }).join('');

  document.getElementById('listCount').textContent = students.length + ' תלמידים';
}

// ============================================================
// SELECT STUDENT
// ============================================================
function selectStudent(id) {
  state.selectedStudentId = id;
  state.activeTab = 'profile';
  var s = STUDENTS.find(function(st) { return st.id === id; });
  if (!s) return;

  document.getElementById('detailEmpty').style.display = 'none';
  document.getElementById('detailContent').style.display = 'block';

  // Mark selected in list
  document.querySelectorAll('.student-item').forEach(function(el) {
    el.classList.toggle('selected', el.onclick.toString().indexOf(id + ')') > -1);
  });

  renderStudentHeader(s);
  renderTabs();
  renderTabContent(s);
}

function renderStudentHeader(s) {
  var fullName = s.last + ' ' + s.first;
  var g = GRADES[fullName] || GRADES[s.first + ' ' + s.last] || {};
  var avg2 = g.avg2 || null;
  var avg1 = g.avg1 || null;
  var genderClass = s.gender === 'נ' ? 'female' : 'male';
  var genderLabel = s.gender === 'נ' ? 'בת' : 'בן';

  // Check TACHI
  var hasTachi = !!(SHILUV_TACHI && SHILUV_TACHI[fullName]);
  var shiluv = hasTachi ? SHILUV_TACHI[fullName] : null;

  document.getElementById('sHeader').innerHTML =
    '<div class="avatar-lg" style="background:' + (s.gender === 'נ' ? 'linear-gradient(135deg,var(--dusty-rose),#B08080)' : 'linear-gradient(135deg,var(--primary),var(--primary-dark))') + '">' + s.first.charAt(0) + '</div>' +
    '<div class="info"><h2>' + esc(s.first + ' ' + s.last) + '</h2>' +
    '<div class="tags">' +
      '<span class="tag tag-class">' + s.cls + '</span>' +
      (MEGAMA_LABELS[s.megama] ? '<span class="tag tag-megama">' + MEGAMA_LABELS[s.megama] + '</span>' : '') +
      '<span class="tag tag-gender">' + genderLabel + '</span>' +
      (hasTachi ? '<span class="tag" style="background:rgba(58,172,160,.1);color:var(--primary-dark);border:1px solid rgba(58,172,160,.2)">תח"י</span>' : '') +
    '</div></div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="val" style="color:' + gradeColor(avg2 || avg1) + '">' + (avg2 || avg1 || '—') + '</div><div class="lbl">ממוצע</div></div>' +
      (avg1 && avg2 ? '<div class="stat"><div class="val" style="color:' + (avg2 > avg1 ? 'var(--success)' : avg2 < avg1 ? 'var(--danger)' : 'var(--muted)') + '">' + (avg2 > avg1 ? '&#x25B2;' : avg2 < avg1 ? '&#x25BC;' : '=') + '</div><div class="lbl">מגמה</div></div>' : '') +
    '</div>';
}

function renderTabs() {
  // Filter tabs based on role
  var visibleTabs = TAB_DEFS;
  if (state.role === 'student') {
    visibleTabs = TAB_DEFS.filter(function(t) { return ['profile','development','journey'].indexOf(t.id) > -1; });
  }

  var bar = document.getElementById('tabsBar');
  bar.innerHTML = visibleTabs.map(function(t) {
    return '<button class="tab-btn' + (t.id === state.activeTab ? ' active' : '') + '" onclick="switchTab(\'' + t.id + '\')">' + t.icon + ' ' + t.label + '</button>';
  }).join('');
}

function switchTab(tabId) {
  state.activeTab = tabId;
  document.querySelectorAll('.tab-btn').forEach(function(b, i) {
    b.classList.toggle('active', b.onclick.toString().indexOf("'" + tabId + "'") > -1);
  });
  var s = STUDENTS.find(function(st) { return st.id === state.selectedStudentId; });
  if (s) renderTabContent(s);
}

// ============================================================
// TAB CONTENT RENDERERS
// ============================================================
function renderTabContent(s) {
  var panels = document.getElementById('tabPanels');
  var fn = {
    profile: renderProfile,
    academic: renderAcademic,
    treatment: renderTreatment,
    development: renderDevelopment,
    conversations: renderConversations,
    journey: renderJourney,
    investments: renderInvestments,
    attendance: renderAttendance,
    tardiness: renderTardiness,
    incidents: renderIncidents,
    documents: renderDocuments
  };
  var renderer = fn[state.activeTab];
  if (renderer) {
    panels.innerHTML = '<div class="tab-panel active">' + renderer(s) + '</div>';
  }
}

// ===== PROFILE TAB =====
function renderProfile(s) {
  var html = '<div class="info-grid">';

  // Personal info
  html += '<div class="info-card"><h4><svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4-4v2"/><circle cx="12" cy="7" r="4"/></svg> פרטים אישיים</h4>';
  html += infoRow('ת.ז.', s.tz);
  html += infoRow('תאריך לידה', s.dob);
  html += infoRow('מין', s.gender === 'נ' ? 'נקבה' : 'זכר');
  html += infoRow('מגמה', MEGAMA_LABELS[s.megama] || '—');
  html += infoRow('תאריך רישום', s.regDate || '—');
  html += '</div>';

  // Address
  html += '<div class="info-card"><h4><svg viewBox="0 0 24 24" fill="none" stroke="var(--sage)" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 10-16 0c0 3 2.7 7 8 11.7z"/></svg> כתובת</h4>';
  html += infoRow('עיר', s.city);
  html += infoRow('רחוב', s.street);
  html += infoRow('מספר', s.num);
  html += infoRow('דירה', s.apt);
  html += '</div>';

  // Parents
  html += '<div class="info-card"><h4><svg viewBox="0 0 24 24" fill="none" stroke="var(--dusty-rose)" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg> הורים</h4>';
  html += infoRow('הורה 1', s.parent1);
  html += infoRow('הורה 2', s.parent2);
  html += '</div>';

  // TACHI if exists
  var fullName = s.last + ' ' + s.first;
  var tachi = SHILUV_TACHI ? SHILUV_TACHI[fullName] : null;
  if (tachi) {
    html += '<div class="info-card" style="border-color:rgba(58,172,160,.3)"><h4><svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg> תח"י — סיכום</h4>';
    html += infoRow('סוג', tachi.tip || '—');
    html += infoRow('מוגבלויות', tachi.mug || '—');
    html += infoRow('חוזקות', tachi.cho || '—');
    html += infoRow('המלצות', tachi.lec || '—');
    html += '</div>';
  }

  html += '</div>';

  // Notes section
  html += renderNotesSection(s);

  return html;
}

function getMonthlyData(s) {
  // Read from monthly reports localStorage
  var data = {};
  try { data = JSON.parse(localStorage.getItem('ort_monthly_reports_v2') || '{}'); } catch(e) {}
  var reports = data.homeroomReports || {};
  var classReports = reports[s.cls] || {};

  var fullName = s.last + ' ' + s.first;
  var g = GRADES[fullName] || GRADES[s.first + ' ' + s.last] || {};

  var timeline = [];
  MONTHS_ORDER.forEach(function(m) {
    var report = classReports[m];
    if (!report || !report.studentTracking) return;
    // Find student in tracking by id or name match
    var st = report.studentTracking[s.id] || report.studentTracking[String(s.id)];
    if (!st) {
      // Try matching by name
      for (var k in report.studentTracking) {
        var t = report.studentTracking[k];
        if (t && t.name && (t.name === fullName || t.name === s.first + ' ' + s.last)) {
          st = t; break;
        }
      }
    }
    if (!st) return;

    var dimL = (st.dimLevel || 0);
    var skillL = (st.skillLevel || 0);
    var acadL = (st.academicLevel || 0);
    var attL = (st.attendanceLevel || 0);
    var perfL = (st.performanceLevel || 0);

    // Compute holistic scores (0-100 scale from 0-4 inputs)
    var avgGrade = g.avg2 || g.avg1 || 0;
    var gradeNorm = Math.min(100, Math.round(avgGrade));

    var academic = Math.round(((acadL / 4) * 50) + (gradeNorm * 0.5));
    var social = Math.round(((dimL + perfL) / 8) * 100);
    var personal = Math.round(((skillL + attL) / 8) * 100);
    var professional = gradeNorm; // Will enhance when track grades available

    timeline.push({
      month: m,
      label: MONTHS_HE[m],
      academic: academic,
      social: social,
      personal: personal,
      professional: professional,
      raw: st
    });
  });

  return timeline;
}

function getCurrentScores(s, timeline) {
  // Latest month data, or fallback to grades
  var fullName = s.last + ' ' + s.first;
  var g = GRADES[fullName] || GRADES[s.first + ' ' + s.last] || {};
  var avgGrade = g.avg2 || g.avg1 || 0;
  var gradeNorm = Math.min(100, Math.round(avgGrade));

  if (timeline.length > 0) {
    var latest = timeline[timeline.length - 1];
    return {
      academic: latest.academic,
      social: latest.social,
      personal: latest.personal,
      professional: latest.professional
    };
  }

  // Fallback — only grades available
  return {
    academic: gradeNorm,
    social: 0,
    personal: 0,
    professional: gradeNorm
  };
}

// ===== TIMELINE CHART DRAWING =====
function drawTimelineChart(timeline) {
  var canvas = document.getElementById('timelineCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');

  // High DPI
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 240 * dpr;
  ctx.scale(dpr, dpr);
  canvas.style.width = rect.width + 'px';
  canvas.style.height = '240px';

  var w = rect.width, h = 240;
  var padL = 40, padR = 20, padT = 20, padB = 40;
  var chartW = w - padL - padR;
  var chartH = h - padT - padB;
  var n = timeline.length;

  ctx.clearRect(0, 0, w, h);

  // Grid lines
  ctx.font = '11px Heebo';
  ctx.textAlign = 'right';
  for (var y = 0; y <= 4; y++) {
    var yy = padT + (chartH / 4) * y;
    var val = 100 - y * 25;
    ctx.fillStyle = '#6E6258';
    ctx.fillText(val, padL - 8, yy + 4);
    ctx.beginPath();
    ctx.moveTo(padL, yy);
    ctx.lineTo(w - padR, yy);
    ctx.strokeStyle = 'rgba(44,38,34,.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Month labels
  ctx.textAlign = 'center';
  ctx.fillStyle = '#6E6258';
  timeline.forEach(function(t, i) {
    var x = padL + (chartW / (n - 1)) * i;
    ctx.fillText(t.label, x, h - 10);
  });

  // Draw lines for each dimension
  var colors = ['#5B9BD5','#E06090','#8B6BC0','#7AB648'];
  var keys = ['academic','social','personal','professional'];

  keys.forEach(function(key, di) {
    ctx.beginPath();
    timeline.forEach(function(t, i) {
      var x = padL + (chartW / (n - 1)) * i;
      var y = padT + chartH - (chartH * (t[key] || 0) / 100);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = colors[di];
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Dots
    timeline.forEach(function(t, i) {
      var x = padL + (chartW / (n - 1)) * i;
      var y = padT + chartH - (chartH * (t[key] || 0) / 100);
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = colors[di];
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    });
  });
}

// מיפוי קטגוריה → ממד (לתלמידים שהגיעו לפני האיחוד)
function dimForCategory(cat){
  if (!cat) return null;
  if (/שייך|חיברת|קהילת|תרמת/.test(cat)) return 'belong';
  if (/כבוד|הקשבת|תקשורת|פתרת/.test(cat)) return 'respect';
  if (/סקרנות|התמדת|זמן|מוטיבציה/.test(cat)) return 'motiv';
  if (/האמנת|יצירתי|שיפור|מסוגלות|העזת/.test(cat)) return 'capable';
  if (/יוזמה|אחריות|תיקנת|אמין|אוטונומיה/.test(cat)) return 'auto';
  return null;
}

function getAttendanceData(studentId, fullName, fullNameRev) {
  var result = {totalDays:0,presentDays:0,absentDays:0,sickDays:0,absentStreak:0,months:[],recent:[]};

  // Try loading from localStorage (synced from attendance system)
  var stored = null;
  try { stored = JSON.parse(localStorage.getItem('sf_attendance_' + studentId)); } catch(e) {}

  // Also try cloud storage
  if (!stored && typeof cloudStorage !== 'undefined') {
    try { stored = JSON.parse(cloudStorage.get('sf_attendance_' + studentId)); } catch(e) {}
  }

  if (stored) return stored;

  // Try reading from ATTENDANCE global (if loaded from attendance system)
  if (typeof ATTENDANCE !== 'undefined' && ATTENDANCE[studentId]) {
    var records = ATTENDANCE[studentId];
    var byMonth = {};
    var sortedDates = Object.keys(records).sort().reverse();
    var streak = 0;
    var streakBroken = false;

    sortedDates.forEach(function(date) {
      var r = records[date];
      result.totalDays++;
      if (r.status === 'present' || r.status === 'late') { result.presentDays++; if (!streakBroken) { streakBroken = true; streak = 0; } }
      else if (r.status === 'absent') { result.absentDays++; if (!streakBroken) streak++; }
      else if (r.status === 'sick') { result.sickDays++; if (!streakBroken) streak++; }

      // Monthly grouping
      var monthKey = date.substring(0, 7);
      if (!byMonth[monthKey]) byMonth[monthKey] = {present:0,absent:0,sick:0,total:0};
      byMonth[monthKey].total++;
      if (r.status === 'present' || r.status === 'late') byMonth[monthKey].present++;
      else if (r.status === 'absent') byMonth[monthKey].absent++;
      else if (r.status === 'sick') byMonth[monthKey].sick++;

      // Recent
      if (result.recent.length < 10) result.recent.push({date:date,status:r.status,reason:r.reason||''});
    });

    result.absentStreak = streak;
    var MONTH_NAMES = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
    Object.keys(byMonth).sort().reverse().forEach(function(k) {
      var m = byMonth[k];
      var monthIdx = parseInt(k.split('-')[1]) - 1;
      m.label = MONTH_NAMES[monthIdx] || k;
      result.months.push(m);
    });
  }

  return result;
}

function saveIncident() {
  var studentId = state.selectedStudentId;
  var type = document.getElementById('incType').value;
  var title = document.getElementById('incTitle').value.trim();
  if (!title) return;

  var data = getIncidentsData(studentId);
  var incident = {
    id: Date.now().toString(36),
    type: type,
    title: title,
    description: document.getElementById('incDesc').value.trim(),
    action_taken: document.getElementById('incAction').value.trim(),
    reporter: state.userName,
    date: new Date().toLocaleDateString('he-IL'),
    status: 'open'
  };
  data.events.unshift(incident);
  if (type === 'discipline') data.disciplineCount++;
  else data.specialCount++;
  data.openCount++;

  localStorage.setItem('sf_incidents_' + studentId, JSON.stringify(data));
  if (typeof cloudStorage !== 'undefined') cloudStorage.set('sf_incidents_' + studentId, JSON.stringify(data));

  var modal = document.querySelector('div[style*="fixed"][style*="z-index:1000"]');
  if (modal) modal.remove();

  var s = STUDENTS.find(function(st) { return st.id === studentId; });
  if (s) renderTabContent(s);
}

// ===== DOCUMENTS TAB =====
function renderDocuments(s) {
  var docs = getDocuments(s);
  var html = '<h4 style="font-size:.92rem;font-weight:700;margin-bottom:14px;font-family:Heebo">מסמכים</h4>';

  var DOC_TYPES = ['ת.ז. תלמיד','ת.ז. הורה','תעודה מביה"ס קודם','אבחון','ועדת השמה','אישור רפואי'];
  DOC_TYPES.forEach(function(docType) {
    var doc = docs.find(function(d) { return d.type === docType; });
    var hasDoc = !!doc;
    html += '<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(232,221,208,.3)">';
    if (hasDoc) {
      html += '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2"><path d="M9 11l3 3L22 4"/></svg>';
      html += '<span style="font-size:.85rem;color:var(--success);flex:1">' + esc(docType) + '</span>';
      if (doc.url) html += '<a href="' + doc.url + '" target="_blank" style="font-size:.75rem;color:var(--primary)">פתח</a>';
    } else {
      html += '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>';
      html += '<span style="font-size:.85rem;color:var(--muted);flex:1">' + esc(docType) + '</span>';
    }
    html += '</div>';
  });

  return html;
}

// ============================================================
// NOTES SECTION (reusable)
// ============================================================
function renderNotesSection(s) {
  var notes = getNotes(s.id);
  var html = '<div style="margin-top:20px"><h4 style="font-size:.92rem;font-weight:700;margin-bottom:10px;font-family:Heebo">הערות צוות</h4>';

  if (notes.length > 0) {
    notes.slice().reverse().forEach(function(n) {
      html += '<div class="note-item"><div class="note-text">' + esc(n.text) + '</div><div class="note-meta">' + esc(n.role || '') + '<br>' + esc(n.author || '') + '<br>' + (n.time || '') + '</div></div>';
    });
  } else {
    html += '<div style="color:var(--muted);font-size:.85rem;padding:8px 0">אין הערות</div>';
  }

  html += '<div class="note-input-row"><input type="text" class="note-input" id="noteInput" placeholder="הוסיפי הערה..."><button class="btn btn-primary btn-sm" onclick="addNote()">הוספה</button></div></div>';
  return html;
}

// ============================================================
// DATA HELPERS (localStorage)
// ============================================================
function getNotes(studentId) {
  try { return JSON.parse(localStorage.getItem('sf_notes_' + studentId) || '[]'); } catch(e) { return []; }
}

function addNote() {
  var input = document.getElementById('noteInput');
  var text = input.value.trim();
  if (!text || !state.selectedStudentId) return;

  var notes = getNotes(state.selectedStudentId);
  notes.push({ text: text, role: ROLE_LABELS[state.role], author: state.userName, time: new Date().toLocaleString('he-IL') });
  cloudStorage.set('sf_notes_' + state.selectedStudentId, notes);
  input.value = '';

  var s = STUDENTS.find(function(st) { return st.id === state.selectedStudentId; });
  if (s) renderTabContent(s);
}

function getConversations(studentId) {
  try { return JSON.parse(localStorage.getItem('sf_convs_' + studentId) || '[]'); } catch(e) { return []; }
}

function addConversation() {
  var input = document.getElementById('convInput');
  var text = input.value.trim();
  if (!text || !state.selectedStudentId) return;

  var convs = getConversations(state.selectedStudentId);
  convs.push({ text: text, author: state.userName, date: new Date().toLocaleDateString('he-IL') });
  cloudStorage.set('sf_convs_' + state.selectedStudentId, convs);
  input.value = '';

  var s = STUDENTS.find(function(st) { return st.id === state.selectedStudentId; });
  if (s) renderTabContent(s);
}

function getDimensions(studentId) {
  try {
    var saved = JSON.parse(localStorage.getItem('sf_dims_' + studentId));
    if (saved) return saved;
  } catch(e) {}
  return { belong: 0, respect: 0, motivation: 0, capability: 0, autonomy: 0 };
}

function getSkills(studentId) {
  try {
    var saved = JSON.parse(localStorage.getItem('sf_skills_' + studentId));
    if (saved) return saved;
  } catch(e) {}
  return { comm: 0, resp: 0, create: 0, time: 0, tikun: 0 };
}

function getJourneyData(studentId) {
  try {
    var saved = JSON.parse(localStorage.getItem('sf_journey_' + studentId));
    if (saved) return saved;
  } catch(e) {}
  return { reflections: [], portfolio: [], milestones: [] };
}

function getDocuments(s) {
  // Check admission docs
  var key = 'ort_docs_' + (s.first + '_' + s.last).replace(/\s/g, '_');
  var docs = [];
  try {
    var saved = JSON.parse(localStorage.getItem(key) || '{}');
    var map = { docStudentId: 'ת.ז. תלמיד', docParentId: 'ת.ז. הורה', docCertificate: 'תעודה מביה"ס קודם', docOther: 'אבחון' };
    for (var k in map) {
      if (saved[k]) docs.push({ type: map[k], name: saved[k].name, url: saved[k].driveUrl || '' });
    }
  } catch(e) {}
  return docs;
}

// Migrate existing portfolio notes
function migratePortfolioNotes() {
  STUDENTS.forEach(function(s) {
    var oldKey = 'portfolio_notes_' + s.id;
    var newKey = 'sf_notes_' + s.id;
    try {
      var old = localStorage.getItem(oldKey);
      if (old && !localStorage.getItem(newKey)) {
        localStorage.setItem(newKey, old);
      }
    } catch(e) {}
  });
}

// (Spider chart replaced by holistic timeline chart)

// ============================================================
// HELPERS
// ============================================================
function esc(str) {
  if (!str) return '';
  var d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

function infoRow(label, value) {
  return '<div class="info-row"><span class="lbl">' + esc(label) + '</span><span class="val">' + esc(value || '—') + '</span></div>';
}

function gradeColor(v) {
  if (v === null || v === undefined) return 'var(--muted)';
  return v >= 70 ? 'var(--success)' : v >= 55 ? 'var(--warn)' : 'var(--danger)';
}

function gradeCell(v) {
  if (v === null || v === undefined) return '<span class="grade-none">—</span>';
  var cls = v >= 70 ? 'grade-green' : v >= 55 ? 'grade-yellow' : 'grade-red';
  return '<span class="grade-cell ' + cls + '">' + v + '</span>';
}

// ============================================================
// ADMISSION IMPORT — read exported leads from student-admission
// ============================================================
function getAdmissionData(s) {
  try {
    var exported = JSON.parse(localStorage.getItem('ort_admission_exports') || '{}');
    // Match by name
    for (var key in exported) {
      var pkg = exported[key];
      if (pkg.firstName === s.first && pkg.lastName === s.last) return pkg;
    }
  } catch(e) {}
  return null;
}

// Enhance profile tab with admission data
var _origRenderProfile = renderProfile;
renderProfile = function(s) {
  var html = _origRenderProfile(s);
  var admission = getAdmissionData(s);
  if (admission) {
    var extra = '<div style="margin-top:16px"><div class="info-card" style="border-color:rgba(106,159,106,.3)"><h4><svg viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" style="width:14px;height:14px"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg> נתוני קבלה</h4>';
    extra += infoRow('ערוץ גיוס', {'word-of-mouth':'מפה לאוזן','kabs':'קב"ס','ad':'פרסום ממומן','other':'אחר'}[admission.source] || admission.source);
    extra += infoRow('מי טיפל/ה', admission.handler);
    extra += infoRow('תאריך כניסה', admission.createdAt ? new Date(admission.createdAt).toLocaleDateString('he-IL') : '');
    if (admission.notes) extra += infoRow('הערות קבלה', admission.notes);

    // Interview data
    var iv = admission.interview;
    if (iv) {
      if (iv.intMotivation) extra += infoRow('מוטיבציה', iv.intMotivation);
      if (iv.intDream) extra += infoRow('חלום', iv.intDream);
      if (iv.intImpression) extra += infoRow('התרשמות מראיין/ת', iv.intImpression);
      if (iv.intRecommendations) extra += infoRow('המלצות', iv.intRecommendations);
    }
    extra += '</div></div>';
    // Insert before notes section
    html = html.replace('<div style="margin-top:20px"><h4', extra + '<div style="margin-top:20px"><h4');
  }
  return html;
};

// ============================================================
// INIT
// ============================================================
cloudStorage.mountStatusBadge();
cloudStorage.prefetchAll(['sf_notes_','sf_convs_','sf_dims_','sf_skills_','sf_journey_','ort_docs_','investment_bank_','ort_admission_']).then(function(){
  migratePortfolioNotes();
});
