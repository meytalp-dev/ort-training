<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>בדיקת מערכות תח"י</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f3f0;padding:20px;direction:rtl}
.card{background:#fff;border-radius:10px;padding:14px;border:1px solid #ddd;cursor:pointer;display:inline-block;margin:6px;min-width:180px}
.card:hover{border-color:#805AD5;box-shadow:0 2px 8px rgba(128,90,213,.2)}
.card .name{font-weight:700;font-size:14px}
.card .cls{font-size:11px;color:#888;margin-top:2px}
#grid{margin-bottom:20px}
#timetable{display:none;background:#fff;border-radius:10px;padding:20px;margin-top:10px}
#timetable table{width:100%;border-collapse:collapse;font-size:13px}
#timetable th{background:#f0ecf8;padding:8px;text-align:center}
#timetable td{padding:8px;border:1px solid #eee;text-align:center;min-width:100px}
.badge{background:#E9D8FD;color:#44337A;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;display:inline-block}
.empty{background:#f8f8f8;height:24px;border-radius:4px}
button{padding:8px 16px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;margin-bottom:12px}
h2{margin-bottom:16px;color:#44337A}
#debug{background:#ffe;border:1px solid #dda;padding:10px;margin-bottom:16px;font-size:12px;border-radius:6px}
</style>
</head>
<body>

<h2>בדיקת מערכות תח"י — לחצי על כרטיס</h2>
<div id="debug">ממתין ללחיצה...</div>
<div id="grid"></div>
<div id="timetable">
  <button id="back-btn">חזרה</button>
  <h3 id="person-name"></h3>
  <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
</div>

<script>
var DAYS = ['sunday','monday','tuesday','wednesday','thursday'];
var DAYS_HE = ['ראשון','שני','שלישי','רביעי','חמישי'];
var PERIODS = ['1','2','3','4','5','6','7'];

var STUDENTS = [
  {name:'צלח איתמר', cls:'י1', schedule:{sunday:{2:'אליאל',3:'אלון',4:'יסכה',5:'שירלי'},monday:{},tuesday:{},wednesday:{},thursday:{}}},
  {name:'אלקריף דוד', cls:'י1', schedule:{sunday:{1:'אליאל',2:'אליאל',3:'אלון'},monday:{},tuesday:{},wednesday:{},thursday:{}}},
  {name:'פאנה', cls:'יא1', schedule:{sunday:{},monday:{1:'שירלי',2:'שירלי',4:'יעל'},tuesday:{},wednesday:{5:'שרה'},thursday:{}}},
  {name:'ברוק טפרה', cls:'יא1', schedule:{sunday:{},monday:{1:'שירלי',2:'שירלי'},tuesday:{5:'יסכה'},wednesday:{3:'שי'},thursday:{}}},
  {name:'עידו בן שמחון', cls:'יב2', schedule:{sunday:{1:'יעל',2:'יעל',3:'שירלי',4:'שירלי'},monday:{},tuesday:{1:'שירלי',4:'מוריס'},wednesday:{},thursday:{}}}
];

var currentList = STUDENTS;

function renderCards() {
  var grid = document.getElementById('grid');
  var html = '';
  for (var i = 0; i < currentList.length; i++) {
    var s = currentList[i];
    html += '<div class="card" onclick="showTimetable(' + i + ')">';
    html += '<div class="name">' + s.name + '</div>';
    html += '<div class="cls">' + s.cls + '</div>';
    html += '</div>';
  }
  grid.innerHTML = html;
  document.getElementById('grid').style.display = 'block';
  document.getElementById('timetable').style.display = 'none';
}

function showTimetable(idx) {
  document.getElementById('debug').textContent = 'לחיצה זוהתה! אינדקס: ' + idx + ' שם: ' + currentList[idx].name;
  var person = currentList[idx];
  document.getElementById('grid').style.display = 'none';
  document.getElementById('timetable').style.display = 'block';
  document.getElementById('person-name').textContent = person.name + ' (' + person.cls + ')';

  var headHtml = '<tr><th>שעה</th>';
  for (var d = 0; d < DAYS_HE.length; d++) {
    headHtml += '<th>יום ' + DAYS_HE[d] + '</th>';
  }
  headHtml += '</tr>';
  document.getElementById('thead').innerHTML = headHtml;

  var bodyHtml = '';
  for (var p = 0; p < PERIODS.length; p++) {
    bodyHtml += '<tr><td><strong>' + PERIODS[p] + '</strong></td>';
    for (var d2 = 0; d2 < DAYS.length; d2++) {
      var cell = (person.schedule[DAYS[d2]] || {})[PERIODS[p]] || '';
      if (cell) {
        bodyHtml += '<td><span class="badge">' + cell + '</span></td>';
      } else {
        bodyHtml += '<td><div class="empty"></div></td>';
      }
    }
    bodyHtml += '</tr>';
  }
  document.getElementById('tbody').innerHTML = bodyHtml;
}

document.getElementById('back-btn').onclick = function() {
  document.getElementById('grid').style.display = 'block';
  document.getElementById('timetable').style.display = 'none';
};

renderCards();
</script>
</body>
</html>
