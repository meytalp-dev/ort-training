<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>הדפסת פתק השקעה | אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&family=Playpen+Sans+Hebrew:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --dream:#8E7ED4;--primary-dark:#5B4BA0;
  --create:#E8B060;--create-dark:#D48A2C;
  --lead:#3AACA0;--spark:#E8909C;
  --text:#2C2622;--text-light:#6E6258;
  --font-body:'Heebo',sans-serif;--font-heading:'Playpen Sans Hebrew','Heebo',sans-serif;
}
body{font-family:var(--font-body);color:var(--text);background:#f4f2ed;padding:20px;min-height:100vh}

.controls{max-width:800px;margin:0 auto 20px;background:#fff;padding:16px 22px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;gap:12px}
.controls h1{font-family:var(--font-heading);font-size:1.1rem;font-weight:800;color:var(--primary-dark)}
.controls button{background:linear-gradient(135deg,var(--dream),var(--spark));color:#fff;border:none;padding:10px 20px;border-radius:10px;font-family:var(--font-heading);font-weight:800;font-size:.9rem;cursor:pointer;transition:all .2s}
.controls button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(142,126,212,.3)}
.controls .info{font-size:.8rem;color:var(--text-light)}

/* Page */
.page{width:210mm;min-height:297mm;margin:0 auto;background:#fff;padding:30mm 25mm;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,.1)}

/* Ticket */
.ticket{position:relative;border:2px dashed rgba(142,126,212,.4);border-radius:22px;padding:30px 36px;display:flex;flex-direction:column;background:linear-gradient(135deg,#fafaff 0%,#fff5f8 100%);overflow:hidden;width:100%;max-width:160mm;min-height:170mm}
.ticket::before{content:'';position:absolute;top:0;right:0;left:0;height:8px;background:linear-gradient(90deg,var(--dream),var(--spark),var(--lead));border-radius:22px 22px 0 0}
.ticket::after{content:'';position:absolute;bottom:-60px;left:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(232,176,96,.12) 0%,transparent 70%);pointer-events:none}

.t-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;padding-bottom:14px;border-bottom:1.5px dashed rgba(142,126,212,.25)}
.t-brand{display:flex;align-items:center;gap:8px}
.t-brand svg{flex-shrink:0;width:40px;height:40px}
.t-brand .t-brand-text{display:flex;flex-direction:column}
.t-brand .t-brand-title{font-family:var(--font-heading);font-size:1.35rem;font-weight:800;color:var(--primary-dark);line-height:1.1}
.t-brand .t-brand-sub{font-size:.85rem;color:var(--text-light);font-weight:500;margin-top:2px}
.t-id{font-family:monospace;font-size:.75rem;color:var(--text-light);background:rgba(0,0,0,.04);padding:5px 10px;border-radius:6px;margin-top:8px}

.t-slogan{font-family:var(--font-heading);font-size:2.4rem;font-weight:800;color:var(--primary-dark);margin-bottom:24px;line-height:1.2;text-align:center}
.t-slogan span{background:linear-gradient(135deg,var(--dream),var(--spark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.t-student{font-family:var(--font-heading);font-size:2rem;font-weight:700;color:var(--text);margin-bottom:4px;text-align:center}
.t-class{font-size:1rem;color:var(--text-light);margin-bottom:20px;text-align:center}

.t-category{display:block;background:rgba(142,126,212,.12);color:var(--primary-dark);padding:10px 20px;border-radius:12px;font-size:1.1rem;font-weight:700;margin-bottom:22px;text-align:center}
.t-points{position:absolute;top:22px;left:22px;background:linear-gradient(135deg,var(--create),var(--create-dark));color:#fff;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:2rem;box-shadow:0 6px 18px rgba(232,176,96,.4)}

.t-note{flex:1;background:#fff;border-right:5px solid var(--spark);padding:20px 24px;border-radius:10px;font-size:1.15rem;line-height:1.7;color:var(--text);font-style:italic;margin-bottom:22px;box-shadow:0 2px 6px rgba(0,0,0,.04);min-height:100px}

.t-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;padding-top:14px;border-top:1.5px dashed rgba(142,126,212,.25)}
.t-signature{font-size:.95rem;color:var(--text-light);line-height:1.5}
.t-signature strong{color:var(--text);font-weight:700;font-size:1.05rem;display:block;margin-bottom:2px}
.t-qr{width:80px;height:80px;background:#fff;padding:4px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.t-qr img,.t-qr canvas{width:100%;height:100%;display:block}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-light)}
.empty-state h2{font-family:var(--font-heading);font-size:1.3rem;margin-bottom:8px}

@media print{
  body{background:#fff;padding:0;margin:0}
  .controls{display:none}
  .page{width:210mm;height:297mm;margin:0;padding:12mm 10mm;box-shadow:none;page-break-after:always}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>

<div class="controls">
  <h1>פתק השקעה — תצוגה להדפסה</h1>
  <div class="info" id="info"></div>
  <button onclick="window.print()">הדפס</button>
</div>

<div class="page" id="page"></div>

<script>
function loadTicket(){
  var raw = sessionStorage.getItem('print_ticket');
  if (!raw) {
    document.getElementById('page').innerHTML = '<div class="empty-state" style="grid-column:1/-1;grid-row:1/-1"><h2>אין פתק להדפסה</h2><p>חזרי לטופס ההנפקה והנפיקי פתק חדש.</p></div>';
    document.getElementById('info').textContent = '';
    return;
  }
  var t = JSON.parse(raw);
  document.getElementById('info').textContent = 'תלמיד: ' + t.student_name;

  var page = document.getElementById('page');
  page.innerHTML = '';

  // פתק יחיד, גדול, במרכז הדף
  page.appendChild(renderTicket(t, 0));

  // QR codes — אחרי שה-DOM נוצר
  setTimeout(function(){
    document.querySelectorAll('.t-qr').forEach(function(el){
      var id = el.dataset.id;
      new QRCode(el, {
        text: id,
        width: 44, height: 44,
        colorDark: '#2C2622',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    });
  }, 50);
}

function renderTicket(t, idx){
  var div = document.createElement('div');
  div.className = 'ticket';
  var date = new Date(t.timestamp).toLocaleDateString('he-IL');
  div.innerHTML =
    '<div class="t-points">' + t.points + '</div>' +
    '<div class="t-head">' +
      '<div class="t-brand">' +
        '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--dream)" stroke-width="2.2" stroke-linecap="round">' +
          '<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' +
        '</svg>' +
        '<div class="t-brand-text">' +
          '<div class="t-brand-title">בנק השקעות</div>' +
          '<div class="t-brand-sub">אורט בית הערבה</div>' +
        '</div>' +
      '</div>' +
      '<div class="t-id">' + (t.id || '').slice(-6).toUpperCase() + '</div>' +
    '</div>' +
    '<div class="t-slogan"><span>השקעת בעצמך</span></div>' +
    '<div class="t-student">' + escapeHtml(t.student_name) + '</div>' +
    '<div class="t-class">כיתה ' + escapeHtml(t.student_class || '') + '</div>' +
    '<div class="t-category">' + escapeHtml(t.category) + '</div>' +
    '<div class="t-note">"' + escapeHtml(t.personal_note) + '"</div>' +
    '<div class="t-foot">' +
      '<div class="t-signature">' +
        '<strong>' + escapeHtml(t.issuer_name) + '</strong><br>' +
        escapeHtml(t.issuer_role) + ' · ' + date +
      '</div>' +
      '<div class="t-qr" data-id="' + escapeAttr(t.id) + '"></div>' +
    '</div>';
  return div;
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
function escapeAttr(s){ return escapeHtml(s); }

loadTicket();
</script>
</body>
</html>
