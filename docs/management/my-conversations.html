<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>שיחות מנהלת — אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Dream Theme — לחלום.ליצור.להוביל */
  --dream:#8E7ED4;--dream-light:#D4CEF0;--dream-dark:#5B4BA0;
  --create:#E8B060;--create-light:#F5DEB0;--create-dark:#D48A2C;
  --lead:#3AACA0;--lead-light:#B8E4DE;--lead-dark:#1B7A6E;
  --spark:#E8909C;--spark-dark:#D45C6E;
  --bg:#fff;--bg-alt:#FAFBFC;--card:#fff;
  --text:#2C2622;--text-light:#6E6258;--muted:#6E6258;
  --border:#EDE6D8;
  --primary:#3AACA0;--primary-dark:#1B7A6E;--primary-light:#B8E4DE;
  --accent:#E8B060;--accent-dark:#D48A2C;
  --success:#4CAF50;--success-bg:#E8F5E9;--warn:#E8B060;--warn-bg:#FFF3E0;
  --danger:#D45C6E;--danger-bg:#FCE7EA;--info:#5B9BD5;--info-bg:#E6F0FA;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 8px rgba(44,38,34,.05);--shadow-md:0 6px 20px rgba(44,38,34,.08);
}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0;line-height:1.6}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.04) 0%,transparent 70%),radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.04) 0%,transparent 70%),radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.03) 0%,transparent 70%);pointer-events:none;z-index:0}
h1,h2,h3,h4{font-family:'Playpen Sans Hebrew','Heebo',sans-serif}
.header{background:linear-gradient(180deg,rgba(142,126,212,.18) 0%,#fff 100%);color:var(--text);padding:0 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:50;min-height:64px;box-shadow:0 2px 12px rgba(44,38,34,.06)}
.header::before{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#E06090,#5B9BD5,#E8A838,#8B6BC0,#7AB648);pointer-events:none}
.header-right{display:flex;align-items:center;gap:12px}
.header-logo{height:36px;width:auto}
.header h1{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--text);margin:0;padding:14px 0}
.header .back-link{color:var(--muted);text-decoration:none;font-size:.84rem;display:flex;align-items:center;gap:4px;padding:6px 0;min-height:44px;transition:color .2s}
.header .back-link:hover{color:var(--primary)}
.container{max-width:800px;margin:0 auto;padding:20px 16px;position:relative;z-index:1}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);position:relative;z-index:1}
.stat-num{font-size:1.5rem;font-weight:800;color:var(--primary)}
.stat-num.warn{color:var(--danger)}
.stat-label{font-size:.78rem;color:var(--muted);margin-top:2px}

/* New conversation */
.new-conv-btn{display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:var(--radius);border:2px dashed var(--primary);color:var(--primary);background:rgba(58,172,160,.04);font-family:'Heebo';font-size:.88rem;font-weight:600;cursor:pointer;width:100%;justify-content:center;margin-bottom:20px;transition:all .2s;min-height:48px}
.new-conv-btn:hover{background:rgba(58,172,160,.1);border-style:solid}
.new-conv-btn.active{background:var(--primary);color:#fff;border-style:solid}

/* Form */
.conv-form{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px;max-height:0;overflow:hidden;opacity:0;transition:max-height .35s ease,opacity .25s ease,padding .3s ease;padding-top:0;padding-bottom:0;position:relative;z-index:1}
.conv-form.open{max-height:1200px;opacity:1;padding:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.82rem;font-weight:600;margin-bottom:4px;color:var(--text)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Heebo';font-size:16px;background:#fff;transition:border-color .2s,box-shadow .2s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(58,172,160,.12)}
.form-group textarea{resize:vertical;min-height:80px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.btn{padding:10px 20px;border-radius:10px;font-family:'Heebo';font-size:.86rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;min-height:44px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--bg);color:var(--muted);border:1.5px solid var(--border)}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary)}
.btn:disabled{opacity:.5;cursor:default}

/* Recording */
.rec-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.rec-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:20px;border:1.5px solid var(--danger);color:var(--danger);background:#fff;font-family:'Heebo';font-size:.86rem;font-weight:600;cursor:pointer;transition:all .2s;min-height:44px}
.rec-btn:hover{background:#FEF0EF}
.rec-btn.recording{background:var(--danger);color:#fff;animation:pulse 1.2s ease-in-out infinite;box-shadow:0 0 12px rgba(212,92,110,.3)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.03)}}
.rec-timer{font-size:.86rem;font-weight:700;color:var(--danger);font-variant-numeric:tabular-nums;display:none}
.rec-status{font-size:.8rem;color:var(--muted)}
.transcript-box{background:#FFFBF0;border:1.5px dashed var(--accent);border-radius:10px;padding:12px 16px;margin-top:8px;font-size:.86rem;line-height:1.7;max-height:250px;overflow-y:auto;white-space:pre-wrap;display:none;cursor:text}
.transcript-box:focus{border-color:var(--primary);border-style:solid;outline:none}
.ai-row{display:flex;gap:10px;align-items:center;margin-top:10px}
.ai-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--dream);color:var(--dream);background:#fff;font-family:'Heebo';font-size:.84rem;font-weight:600;cursor:pointer;transition:all .2s;min-height:44px}
.ai-btn:hover{background:var(--dream);color:#fff}
.ai-status{font-size:.8rem;color:var(--muted)}

/* Follow-up */
.followup-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}

/* Filters */
.filter-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-row input{flex:1;min-width:180px;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Heebo';font-size:16px}
.filter-row input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(58,172,160,.12)}
.filter-chip{padding:8px 14px;border-radius:16px;font-size:.8rem;font-weight:600;border:1.5px solid var(--border);background:#fff;cursor:pointer;transition:all .15s;min-height:36px;display:inline-flex;align-items:center}
.filter-chip:hover{border-color:var(--primary);color:var(--primary)}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Conversation cards */
.conv-card{background:var(--card);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;border-right:4px solid transparent;transition:all .2s;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.conv-card:hover{box-shadow:0 4px 16px rgba(44,38,34,.1)}
.conv-card[data-type="תלמיד"]{border-right-color:#5B9BD5}
.conv-card[data-type="הורים"]{border-right-color:#E8B060}
.conv-card[data-type="צוות"]{border-right-color:#3AACA0}
.conv-card[data-type="גורמי חוץ"]{border-right-color:#8E7ED4}
.conv-card[data-type="פיקוח"]{border-right-color:#E8909C}
.conv-card[data-type="אחר"]{border-right-color:#8C7E72}
.conv-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.badge{font-size:.78rem;padding:4px 10px;border-radius:8px;font-weight:600}
.badge-type{background:#E8F4FD;color:#2980B9}
.badge-type[data-t="תלמיד"]{background:#E8F4FD;color:#2980B9}
.badge-type[data-t="הורים"]{background:#FFF3E0;color:#E08A00}
.badge-type[data-t="צוות"]{background:#E0F5F2;color:#1B7A6E}
.badge-type[data-t="גורמי חוץ"]{background:#F0E8F5;color:#6B4FA0}
.badge-type[data-t="פיקוח"]{background:#FCE7EA;color:#C0506A}
.badge-type[data-t="אחר"]{background:#F0EDE8;color:#6E6258}
.badge-attendees{background:#E8F4FD;color:#2471A3}
.badge-followup{background:#FFF3E0;color:#E08A00;font-size:.72rem}
.badge-done{background:#E8F5E9;color:#27A844;font-size:.72rem}
.conv-date{font-size:.78rem;color:var(--muted);margin-right:auto}
.conv-body{font-size:.86rem;line-height:1.7;color:var(--text)}
.conv-decision{background:#F0FAF0;border-radius:8px;padding:10px 14px;margin-top:8px;font-size:.86rem;border-right:3px solid var(--success);line-height:1.6}
.conv-followup{background:#FFF8EE;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:.82rem;border-right:3px solid var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.conv-followup-check{width:18px;height:18px;cursor:pointer;accent-color:var(--success)}
.conv-transcript-toggle{font-size:.8rem;color:var(--muted);cursor:pointer;margin-top:6px;padding:6px 0;display:inline-block}
.conv-transcript-toggle:hover{color:var(--primary)}
.conv-transcript-content{font-size:.82rem;color:var(--text);line-height:1.6;margin-top:6px;padding:10px;background:#FFFBF0;border-radius:8px}
.conv-actions{position:absolute;top:10px;left:10px;display:flex;gap:2px}
.conv-action-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.82rem;padding:8px;border-radius:6px;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center}
.conv-action-btn:hover{background:#F0EDE8}
.conv-action-btn.del:hover{color:var(--danger);background:#FEF0EF}

/* Empty state */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.3;margin-bottom:12px}
.empty-text{font-size:.88rem;margin-bottom:8px}
.empty-hint{font-size:.8rem;color:var(--muted)}

/* Export */
.export-btn{font-size:.82rem;color:var(--muted);background:none;border:1px solid var(--border);padding:8px 14px;border-radius:8px;cursor:pointer;font-family:'Heebo';min-height:36px}
.export-btn:hover{border-color:var(--primary);color:var(--primary)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#2C2622;color:#fff;padding:12px 24px;border-radius:10px;font-family:'Heebo';font-size:.86rem;font-weight:500;z-index:1000;opacity:0;transition:all .3s ease;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:var(--success)}
.toast.danger{background:var(--danger)}

@media(max-width:600px){
  .form-row,.followup-row{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr 1fr}
  .container{padding:12px 10px}
  .rec-btn{width:100%;justify-content:center;padding:12px}
  .rec-row{flex-direction:column;align-items:stretch}
  .conv-action-btn{min-width:44px;min-height:44px;padding:10px}
  .filter-chip{padding:10px 16px;min-height:44px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-right">
    <img src="logo-ort.svg" alt="אורט בית הערבה" class="header-logo">
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      שיחות מנהלת
    </h1>
  </div>
  <a href="index.html" class="back-link">
    <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"/></svg>
    חזרה למערכות
  </a>
</div>

<div class="container">

  <!-- Stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- New conversation button -->
  <button class="new-conv-btn" id="newConvBtn" onclick="toggleForm()">
    <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"/></svg>
    תיעוד שיחה חדשה
  </button>

  <!-- Form -->
  <div class="conv-form" id="convForm">
    <div class="form-row">
      <div class="form-group">
        <label>תאריך</label>
        <input type="date" id="fDate">
      </div>
      <div class="form-group">
        <label>סוג השיחה</label>
        <select id="fType">
          <option value="תלמיד">פגישה עם תלמיד/ה</option>
          <option value="הורים">פגישה עם הורים</option>
          <option value="צוות">פגישה עם צוות</option>
          <option value="גורמי חוץ">גורמי חוץ</option>
          <option value="פיקוח">פיקוח</option>
          <option value="אחר">אחר</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>נוכחים</label>
      <input type="text" id="fAttendees" placeholder="שמות המשתתפים בשיחה...">
    </div>
    <div class="form-group">
      <label>נושא / כותרת</label>
      <input type="text" id="fTitle" placeholder="למשל: שיחת מעקב עם הורי...">
    </div>

    <!-- Recording -->
    <div class="form-group">
      <label>תקציר השיחה</label>
      <div class="rec-row">
        <button class="rec-btn" id="recBtn" onclick="toggleRec()" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="6"/></svg>
          הקלטה
        </button>
        <span class="rec-timer" id="recTimer">00:00</span>
        <span class="rec-status" id="recStatus"></span>
      </div>
      <textarea id="fSummary" rows="3" placeholder="תקציר השיחה — או הקליטי ולחצי סכם..."></textarea>
      <div class="transcript-box" id="transcriptBox" contenteditable="true"></div>
      <div class="ai-row" id="aiRow" style="display:none">
        <button class="ai-btn" id="aiBtn" onclick="aiSummarize()" type="button">
          <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M10 2a1 1 0 011 1v1.323l3.954 1.582a1 1 0 01.589.769l.452 3.166a1 1 0 01-.293.874L12 14.414V17a1 1 0 11-2 0v-2.586l-3.702-3.7a1 1 0 01-.293-.874l.452-3.166a1 1 0 01.59-.769L11 4.323V3a1 1 0 011-1z"/></svg>
          סכם שיחה (AI)
        </button>
        <span class="ai-status" id="aiStatus"></span>
      </div>
    </div>

    <div class="form-group">
      <label>החלטות וצעדים הבאים</label>
      <textarea id="fDecision" rows="2" placeholder="מה הוחלט? מה השלב הבא?"></textarea>
    </div>

    <div class="followup-row">
      <div class="form-group">
        <label>תאריך מעקב (follow-up)</label>
        <input type="date" id="fFollowUp">
      </div>
      <div class="form-group" style="display:flex;align-items:flex-end;padding-bottom:12px">
        <span style="font-size:.82rem;color:var(--muted)">אופציונלי — תזכורת לחזור לנושא</span>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-secondary" onclick="cancelForm()" type="button">ביטול</button>
      <button class="btn btn-primary" onclick="saveConv()" type="button">שמירה</button>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-row">
    <input type="text" id="searchInput" placeholder="חיפוש בשיחות..." oninput="renderList()">
    <div style="display:flex;gap:6px;flex-wrap:wrap" id="filterChips"></div>
    <button class="export-btn" onclick="exportCSV()" type="button">ייצוא CSV</button>
  </div>

  <!-- Conversations list -->
  <div id="convList"></div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="cloud-storage.js"></script>
<script>
// ===== DATA =====
var STORAGE_KEY = 'principal_conversations';
var conversations = [];
var editingId = null; // null = new, string = editing existing

var TYPE_COLORS = {
  'תלמיד': '#5B9BD5', 'הורים': '#E8B060', 'צוות': '#3AACA0',
  'גורמי חוץ': '#8E7ED4', 'פיקוח': '#E8909C', 'אחר': '#8C7E72'
};

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    conversations = raw ? JSON.parse(raw) : [];
  } catch(e) { conversations = []; }
}

function saveData() {
  cloudStorage.set(STORAGE_KEY, conversations);
}

// ===== TOAST =====
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  setTimeout(function() { t.classList.add('show'); }, 10);
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

// ===== INIT =====
function init() {
  document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
  cloudStorage.mountStatusBadge();
  cloudStorage.prefetchAll([STORAGE_KEY]).then(function() {
    loadData();
    renderStats();
    renderFilterChips();
    renderList();
  });
}

// ===== STATS =====
function renderStats() {
  var total = conversations.length;
  var thisMonth = conversations.filter(function(c) {
    var d = c.dateRaw || '';
    var now = new Date();
    return d.startsWith(now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0'));
  }).length;

  // Open follow-ups (have followUpDate, not done)
  var openFollowups = conversations.filter(function(c) {
    return c.followUpDate && !c.followUpDone;
  }).length;

  var overdueFollowups = conversations.filter(function(c) {
    if (!c.followUpDate || c.followUpDone) return false;
    return c.followUpDate < new Date().toISOString().split('T')[0];
  }).length;

  var types = {};
  conversations.forEach(function(c) { types[c.type] = (types[c.type]||0) + 1; });
  var topType = '';
  var topCount = 0;
  Object.keys(types).forEach(function(t) { if(types[t]>topCount){topCount=types[t];topType=t;} });

  var html = '';
  html += '<div class="stat-card"><div class="stat-num">' + total + '</div><div class="stat-label">שיחות סה"כ</div></div>';
  html += '<div class="stat-card"><div class="stat-num">' + thisMonth + '</div><div class="stat-label">החודש</div></div>';
  html += '<div class="stat-card"><div class="stat-num' + (overdueFollowups > 0 ? ' warn' : '') + '">' + openFollowups + '</div><div class="stat-label">' + (overdueFollowups > 0 ? overdueFollowups + ' באיחור' : 'מעקב פתוח') + '</div></div>';
  html += '<div class="stat-card"><div class="stat-num" style="font-size:1rem">' + (topType || '—') + '</div><div class="stat-label">סוג נפוץ</div></div>';
  document.getElementById('statsRow').innerHTML = html;
}

// ===== FILTER CHIPS =====
var activeFilter = '';

function renderFilterChips() {
  var types = ['תלמיד','הורים','צוות','גורמי חוץ','פיקוח','אחר'];
  var html = '';
  types.forEach(function(t) {
    html += '<span class="filter-chip' + (activeFilter===t?' active':'') + '" onclick="setFilter(\'' + t + '\')">' + t + '</span>';
  });
  document.getElementById('filterChips').innerHTML = html;
}

function setFilter(type) {
  activeFilter = activeFilter === type ? '' : type;
  renderFilterChips();
  renderList();
}

// ===== RENDER LIST =====
function renderList() {
  var search = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  var filtered = conversations.slice().reverse().filter(function(c) {
    if (activeFilter && c.type !== activeFilter) return false;
    if (search) {
      var haystack = [c.title,c.attendees,c.summary,c.decision,c.type,c.date,c.transcript||''].join(' ').toLowerCase();
      if (haystack.indexOf(search) === -1) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    var emptyMsg = conversations.length === 0
      ? '<div class="empty-text">עוד אין שיחות מתועדות</div><div class="empty-hint">לחצי על הכפתור למעלה כדי לתעד שיחה ראשונה</div>'
      : '<div class="empty-text">אין תוצאות לחיפוש</div>';
    document.getElementById('convList').innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>' + emptyMsg + '</div>';
    return;
  }

  var html = '';
  filtered.forEach(function(c) {
    var today = new Date().toISOString().split('T')[0];
    var isOverdue = c.followUpDate && !c.followUpDone && c.followUpDate < today;

    html += '<div class="conv-card" data-type="' + esc(c.type) + '">';
    html += '<div class="conv-actions">';
    html += '<button class="conv-action-btn" onclick="editConv(\'' + c.id + '\')" title="עריכה"><svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg></button>';
    html += '<button class="conv-action-btn del" onclick="deleteConv(\'' + c.id + '\')" title="מחיקה">&times;</button>';
    html += '</div>';
    html += '<div class="conv-header">';
    html += '<span class="badge badge-type" data-t="' + esc(c.type) + '">' + esc(c.type) + '</span>';
    if (c.attendees) html += '<span class="badge badge-attendees">' + esc(c.attendees) + '</span>';
    if (c.followUpDate && !c.followUpDone) html += '<span class="badge badge-followup">' + (isOverdue ? 'באיחור' : 'מעקב') + '</span>';
    if (c.followUpDone) html += '<span class="badge badge-done">הושלם</span>';
    html += '<span class="conv-date">' + esc(c.date) + '</span>';
    html += '</div>';
    if (c.title) html += '<div style="font-size:.9rem;font-weight:600;margin-bottom:6px">' + esc(c.title) + '</div>';
    if (c.summary) html += '<div class="conv-body">' + esc(c.summary).replace(/\n/g,'<br>') + '</div>';
    if (c.transcript) {
      html += '<details style="margin-top:6px"><summary class="conv-transcript-toggle">תמלול מלא</summary>';
      html += '<div class="conv-transcript-content">' + esc(c.transcript).replace(/\n/g,'<br>') + '</div></details>';
    }
    if (c.decision) html += '<div class="conv-decision"><strong>החלטה:</strong> ' + esc(c.decision).replace(/\n/g,'<br>') + '</div>';
    if (c.followUpDate) {
      var fuDate = new Date(c.followUpDate).toLocaleDateString('he-IL');
      html += '<div class="conv-followup' + (isOverdue ? ' style="border-right-color:var(--danger);background:#FEF0EF"' : '') + '">';
      html += '<input type="checkbox" class="conv-followup-check" ' + (c.followUpDone ? 'checked' : '') + ' onchange="toggleFollowUp(\'' + c.id + '\')">';
      html += '<span>' + (c.followUpDone ? '<s>מעקב: ' + fuDate + '</s>' : 'מעקב עד: ' + fuDate) + '</span>';
      html += '</div>';
    }
    html += '</div>';
  });

  document.getElementById('convList').innerHTML = html;
}

function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ===== FORM =====
function toggleForm() {
  var form = document.getElementById('convForm');
  var btn = document.getElementById('newConvBtn');
  var isOpen = form.classList.contains('open');
  if (isOpen) {
    cancelForm();
  } else {
    editingId = null;
    resetForm();
    form.classList.add('open');
    btn.classList.add('active');
  }
}

function cancelForm() {
  var form = document.getElementById('convForm');
  var btn = document.getElementById('newConvBtn');
  form.classList.remove('open');
  btn.classList.remove('active');
  stopRec();
  editingId = null;
}

function resetForm() {
  document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('fType').selectedIndex = 0;
  document.getElementById('fAttendees').value = '';
  document.getElementById('fTitle').value = '';
  document.getElementById('fSummary').value = '';
  document.getElementById('fDecision').value = '';
  document.getElementById('fFollowUp').value = '';
  document.getElementById('transcriptBox').textContent = '';
  document.getElementById('transcriptBox').style.display = 'none';
  document.getElementById('aiRow').style.display = 'none';
  document.getElementById('recTimer').style.display = 'none';
  document.getElementById('recStatus').textContent = '';
  document.getElementById('aiStatus').textContent = '';
  transcriptText = '';
}

function editConv(id) {
  var conv = conversations.find(function(c) { return c.id === id; });
  if (!conv) return;

  editingId = id;
  document.getElementById('fDate').value = conv.dateRaw || '';
  document.getElementById('fAttendees').value = conv.attendees || '';
  document.getElementById('fTitle').value = conv.title || '';
  document.getElementById('fSummary').value = conv.summary || '';
  document.getElementById('fDecision').value = conv.decision || '';
  document.getElementById('fFollowUp').value = conv.followUpDate || '';

  // Set type
  var sel = document.getElementById('fType');
  for (var i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === conv.type) { sel.selectedIndex = i; break; }
  }

  // Transcript
  if (conv.transcript) {
    document.getElementById('transcriptBox').textContent = conv.transcript;
    document.getElementById('transcriptBox').style.display = 'block';
    document.getElementById('aiRow').style.display = 'flex';
    transcriptText = conv.transcript;
  }

  var form = document.getElementById('convForm');
  var btn = document.getElementById('newConvBtn');
  form.classList.add('open');
  btn.classList.add('active');
  form.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function saveConv() {
  var summary = document.getElementById('fSummary').value.trim();
  var transcript = document.getElementById('transcriptBox').innerText.trim();
  var decision = document.getElementById('fDecision').value.trim();
  var title = document.getElementById('fTitle').value.trim();

  if (!summary && !transcript && !decision && !title) {
    alert('יש למלא לפחות נושא, תקציר או החלטה');
    return;
  }

  stopRec();

  var dateVal = document.getElementById('fDate').value;
  if (!dateVal) dateVal = new Date().toISOString().split('T')[0];

  var convData = {
    dateRaw: dateVal,
    date: new Date(dateVal).toLocaleDateString('he-IL'),
    type: document.getElementById('fType').value,
    attendees: document.getElementById('fAttendees').value.trim(),
    title: title,
    summary: summary,
    transcript: transcript || '',
    decision: decision,
    followUpDate: document.getElementById('fFollowUp').value || '',
  };

  if (editingId) {
    // Update existing
    var idx = conversations.findIndex(function(c) { return c.id === editingId; });
    if (idx !== -1) {
      convData.id = editingId;
      convData.createdAt = conversations[idx].createdAt;
      convData.followUpDone = conversations[idx].followUpDone || false;
      convData.updatedAt = new Date().toISOString();
      conversations[idx] = convData;
    }
    showToast('השיחה עודכנה');
  } else {
    // New
    convData.id = 'mc_' + Date.now();
    convData.createdAt = new Date().toISOString();
    convData.followUpDone = false;
    conversations.push(convData);
    showToast('השיחה נשמרה');
  }

  saveData();
  editingId = null;
  resetForm();
  cancelForm();
  renderStats();
  renderList();
}

function deleteConv(id) {
  if (!confirm('למחוק שיחה זו?')) return;
  conversations = conversations.filter(function(c) { return c.id !== id; });
  saveData();
  renderStats();
  renderList();
  showToast('השיחה נמחקה', 'danger');
}

function toggleFollowUp(id) {
  var conv = conversations.find(function(c) { return c.id === id; });
  if (!conv) return;
  conv.followUpDone = !conv.followUpDone;
  saveData();
  renderStats();
  renderList();
  showToast(conv.followUpDone ? 'מעקב הושלם' : 'מעקב נפתח מחדש');
}

// ===== RECORDING =====
var recognition = null;
var isRecording = false;
var transcriptText = '';
var timerInterval = null;
var startTime = null;

function toggleRec() {
  if (isRecording) { stopRec(); return; }
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('הדפדפן לא תומך בתמלול קולי. יש להשתמש ב-Chrome.');
    return;
  }

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'he-IL';
  recognition.continuous = true;
  recognition.interimResults = true;
  transcriptText = '';
  var finalText = '';

  var box = document.getElementById('transcriptBox');
  box.style.display = 'block';
  box.textContent = '';

  recognition.onresult = function(e) {
    var interim = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalText += e.results[i][0].transcript + ' ';
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    transcriptText = finalText;
    box.innerHTML = esc(finalText) + '<span style="color:var(--muted)">' + esc(interim) + '</span>';
  };

  recognition.onerror = function(e) {
    if (e.error === 'no-speech') return;
    document.getElementById('recStatus').textContent = 'שגיאה: ' + e.error;
    stopRec();
  };

  recognition.onend = function() {
    if (isRecording) recognition.start();
  };

  recognition.start();
  isRecording = true;

  startTime = Date.now();
  var timerEl = document.getElementById('recTimer');
  timerEl.style.display = 'inline';
  timerInterval = setInterval(function() {
    var sec = Math.floor((Date.now() - startTime) / 1000);
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    timerEl.textContent = (h > 0 ? h + ':' : '') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }, 1000);

  var btn = document.getElementById('recBtn');
  btn.classList.add('recording');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><rect x="6" y="6" width="12" height="12" rx="2"/></svg> עצירה';
  document.getElementById('recStatus').textContent = 'מקליט... התמלול מופיע בזמן אמת';
}

function stopRec() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (recognition) { recognition.onend = null; recognition.abort(); recognition = null; }
  isRecording = false;

  var btn = document.getElementById('recBtn');
  if (btn) {
    btn.classList.remove('recording');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="6"/></svg> הקלטה';
  }

  var status = document.getElementById('recStatus');
  if (status) status.textContent = transcriptText ? 'תמלול הושלם — לחצי "סכם שיחה" למילוי אוטומטי' : '';

  var aiRow = document.getElementById('aiRow');
  if (aiRow && transcriptText) aiRow.style.display = 'flex';
}

// ===== AI SUMMARY =====
var GEMINI_KEY = 'AIzaSyDKNEikoSozZIDOFN2lR6S6yc9MDPy74ok';
var GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + GEMINI_KEY;

function aiSummarize() {
  var transcript = document.getElementById('transcriptBox').innerText.trim();
  if (!transcript || transcript.length < 20) {
    alert('אין מספיק תמלול לסיכום.');
    return;
  }

  var statusEl = document.getElementById('aiStatus');
  var btn = document.getElementById('aiBtn');
  statusEl.textContent = 'מנתח תמלול...';
  statusEl.style.color = 'var(--muted)';
  btn.disabled = true;
  btn.style.opacity = '0.5';

  var prompt = 'אתה עוזר למנהלת בית ספר תיכון לסכם שיחות.\n';
  prompt += 'קיבלת תמלול של שיחה. נתח אותו והחזר JSON בלבד (בלי markdown, בלי ```):\n';
  prompt += '{\n';
  prompt += '  "type": "אחד מ: תלמיד / הורים / צוות / גורמי חוץ / פיקוח / אחר",\n';
  prompt += '  "title": "כותרת קצרה לשיחה (עד 8 מילים)",\n';
  prompt += '  "attendees": "מי השתתף בשיחה (שמות/תפקידים לפי מה שעולה מהתמלול)",\n';
  prompt += '  "summary": "תקציר של 3-5 משפטים — הנקודות המרכזיות",\n';
  prompt += '  "decision": "החלטות וצעדים הבאים. אם אין — כתוב: לא צוינה החלטה"\n';
  prompt += '}\n\n';
  prompt += '=== תמלול ===\n' + transcript.substring(0, 30000);

  fetch(GEMINI_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.2, maxOutputTokens: 1000 }
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var text = '';
    try { text = data.candidates[0].content.parts[0].text; } catch(e) {
      // Check for safety block
      if (data.candidates && data.candidates[0] && data.candidates[0].finishReason === 'SAFETY') {
        throw new Error('התוכן נחסם — נסי לערוך את התמלול ולנסות שוב');
      }
      throw new Error('לא התקבלה תשובה מהשרת');
    }
    text = text.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();

    var parsed;
    try {
      parsed = JSON.parse(text);
    } catch(parseErr) {
      throw new Error('הסיכום לא התקבל בפורמט תקין — נסי שוב');
    }

    if (parsed.type) {
      var sel = document.getElementById('fType');
      for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === parsed.type) { sel.selectedIndex = i; break; }
      }
    }
    if (parsed.title) document.getElementById('fTitle').value = parsed.title;
    if (parsed.attendees) document.getElementById('fAttendees').value = parsed.attendees;
    if (parsed.summary) document.getElementById('fSummary').value = parsed.summary;
    if (parsed.decision) document.getElementById('fDecision').value = parsed.decision;

    statusEl.textContent = 'הסיכום מולא — בדקי ועדכני לפני שמירה';
    statusEl.style.color = 'var(--success)';
  })
  .catch(function(err) {
    statusEl.textContent = err.message || 'שגיאה — נסי שוב';
    statusEl.style.color = 'var(--danger)';
  })
  .finally(function() {
    btn.disabled = false;
    btn.style.opacity = '1';
  });
}

// ===== EXPORT CSV =====
function exportCSV() {
  if (conversations.length === 0) { alert('אין שיחות לייצוא'); return; }
  var BOM = '\uFEFF';
  var header = 'תאריך,סוג,נושא,נוכחים,תקציר,החלטה,מעקב,הושלם\n';
  var rows = conversations.map(function(c) {
    return [c.date, c.type, c.title||'', c.attendees||'', (c.summary||'').replace(/\n/g,' '), (c.decision||'').replace(/\n/g,' '), c.followUpDate ? new Date(c.followUpDate).toLocaleDateString('he-IL') : '', c.followUpDone ? 'כן' : '']
      .map(function(f) { return '"' + (f||'').replace(/"/g,'""') + '"'; }).join(',');
  }).join('\n');

  var blob = new Blob([BOM + header + rows], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'שיחות-מנהלת-' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  showToast('קובץ CSV יורד');
}
