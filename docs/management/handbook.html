<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ספר בית הספר — אורט בית הערבה | תשפ"ו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0E8;--card:#FFFDF8;
  --primary:#7AADAD;--primary-dark:#5E9191;--primary-light:#96C5C5;
  --primary-bg:rgba(122,173,173,.08);
  --accent:#D4A574;--accent-dark:#B8885A;
  --text:#4A3F35;--text-muted:#8B7E74;--muted:#8B7E74;
  --border:#E8DDD0;
  --success:#6A9F6A;--warn:#C4944A;--danger:#C0605A;
  --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Heebo,Rubik,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55}
a{color:var(--primary-dark);text-decoration:none}
a:hover{text-decoration:underline}

.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);background:rgba(255,253,248,.92)}
.topbar h1{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-.2px}
.topbar h1 .badge{background:linear-gradient(135deg,rgba(168,181,160,.18),rgba(122,173,173,.18));padding:4px 14px;border-radius:20px;font-size:.72rem;font-weight:700;color:var(--primary-dark);border:1px solid rgba(122,173,173,.28)}
.topbar nav{display:flex;gap:6px;align-items:center;font-size:.85rem}
.topbar nav a{color:var(--text-muted);padding:6px 10px;border-radius:8px;transition:.18s}
.topbar nav a:hover{background:var(--primary-bg);color:var(--primary-dark);text-decoration:none}

.container{max-width:1100px;margin:0 auto;padding:28px}

.hero{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 32px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--primary-light),var(--primary),var(--accent))}
.hero .icon{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,#0D9488,#0F766E);display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:12px}
.hero h2{font-size:1.8rem;font-weight:900;letter-spacing:-.4px;margin-bottom:6px}
.hero p{color:var(--text-muted);font-size:1rem;font-weight:500}

.controls{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.controls input{flex:1;min-width:220px;padding:11px 16px;border:1px solid var(--border);border-radius:12px;font-size:.95rem;font-family:Heebo;background:var(--card);color:var(--text);transition:.18s}
.controls input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(122,173,173,.15)}
.btn{padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:Heebo;font-size:.88rem;font-weight:600;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--primary);color:var(--primary-dark)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-color:transparent;color:#fff}
.btn-primary:hover{color:#fff;filter:brightness(1.05)}

.toc-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 22px;margin-bottom:18px}
.toc-title{font-size:1.05rem;font-weight:800;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:8px}
.toc-title::before{content:'';width:4px;height:18px;background:var(--primary);border-radius:2px}
.toc-section-label{font-size:.78rem;font-weight:700;text-transform:none;letter-spacing:.4px;color:var(--accent-dark);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px dashed var(--border)}
.toc-section-label:first-child{margin-top:0}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px}
.toc-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:.95rem;color:var(--text-muted);transition:.18s}
.toc-item:hover{background:var(--primary-bg);color:var(--primary-dark)}
.toc-num{width:26px;height:26px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:var(--text-muted);flex-shrink:0;transition:.18s}
.toc-item:hover .toc-num{background:var(--primary);color:#fff}

.section-header{font-size:.92rem;font-weight:800;color:var(--accent-dark);margin:24px 0 12px;padding:8px 16px;background:rgba(212,165,116,.08);border-right:4px solid var(--accent);border-radius:0 12px 12px 0}
.section-header:first-of-type{margin-top:0}

.hb-chapter{margin-bottom:12px}
.hb-chapter-header{display:flex;align-items:center;gap:12px;padding:15px 22px;background:var(--card);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:.18s;user-select:none}
.hb-chapter-header:hover{border-color:var(--primary);box-shadow:0 2px 12px rgba(74,63,53,.06)}
.hb-chapter-header.open{border-radius:14px 14px 0 0;border-color:var(--primary);border-bottom-color:var(--border)}
.hb-chapter-num{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-size:.88rem;font-weight:800;flex-shrink:0}
.hb-chapter-icon{width:26px;height:26px;color:var(--primary);flex-shrink:0}
.hb-chapter-icon svg{width:100%;height:100%}
.hb-chapter-title{flex:1;font-size:1.1rem;font-weight:700;color:var(--text)}
.hb-chapter-arrow{transition:transform .25s;color:var(--text-muted)}
.hb-chapter-header.open .hb-chapter-arrow{transform:rotate(180deg)}

.hb-chapter-body{display:none;border:1px solid var(--primary);border-top:none;border-radius:0 0 14px 14px;padding:22px 28px;background:var(--card);animation:fadeIn .25s ease}
.hb-chapter-body.open{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

.hb-chapter-body h3{font-size:1.22rem;font-weight:800;color:var(--text);margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--primary-bg)}
.hb-chapter-body h3:first-child{margin-top:0}
.hb-chapter-body h4{font-size:1.05rem;font-weight:700;color:var(--text);margin:18px 0 8px}
.hb-chapter-body p{font-size:1rem;line-height:1.78;color:var(--text-muted);margin-bottom:12px}
.hb-chapter-body ul,.hb-chapter-body ol{padding-right:22px;margin-bottom:12px}
.hb-chapter-body li{font-size:1rem;line-height:1.78;color:var(--text-muted);margin-bottom:6px}
.hb-chapter-body table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.94rem}
.hb-chapter-body th{background:var(--primary-bg);color:var(--primary-dark);padding:11px 14px;text-align:right;font-weight:700;border:1px solid var(--border)}
.hb-chapter-body td{padding:10px 14px;border:1px solid var(--border);color:var(--text-muted)}
.hb-chapter-body tr:hover td{background:rgba(122,173,173,.04)}
.hb-chapter-body strong{color:var(--text);font-weight:700}

.info-box{background:var(--primary-bg);border-right:4px solid var(--primary);border-radius:0 12px 12px 0;padding:14px 18px;margin:14px 0;font-size:.94rem;line-height:1.72;color:var(--text-muted)}
.info-box h4{color:var(--primary-dark);margin:0 0 6px;font-size:.96rem}
.warning-box{background:#FEF3C7;border-right:4px solid #F59E0B;border-radius:0 12px 12px 0;padding:14px 18px;margin:14px 0;font-size:.94rem;line-height:1.72;color:#92400E}
.accent-box{background:rgba(212,165,116,.08);border-right:4px solid var(--accent);border-radius:0 12px 12px 0;padding:14px 18px;margin:14px 0;font-size:.94rem;line-height:1.72;color:var(--text-muted)}

.dim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.dim-card{background:var(--primary-bg);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.dim-card .dim-num{font-size:1.6rem;font-weight:900;color:var(--primary-dark);font-family:Heebo}
.dim-card .dim-name{font-weight:700;color:var(--text);margin-top:4px;font-size:.98rem}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(74,63,53,.04)}
.kpi .kpi-num{font-size:1.6rem;font-weight:900;color:var(--primary-dark);line-height:1;font-family:Heebo}
.kpi .kpi-label{font-size:.82rem;color:var(--text-muted);margin-top:6px;font-weight:600}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:1rem;display:none}
.empty-state.show{display:block}

.footer{text-align:center;padding:32px 20px;color:var(--text-muted);font-size:.85rem;border-top:1px solid var(--border);margin-top:30px}

@media (max-width:640px){
  .container{padding:16px}
  .hero{padding:22px}
  .hero h2{font-size:1.4rem}
  .hb-chapter-header{padding:12px 16px;gap:10px}
  .hb-chapter-title{font-size:.98rem}
  .hb-chapter-body{padding:18px 18px}
  .toc-grid{grid-template-columns:1fr 1fr}
  .topbar{padding:12px 16px}
  .topbar nav{display:none}
}

@media print{
  body{background:#fff}
  .topbar,.controls,.hb-chapter-arrow,.footer,.empty-state{display:none!important}
  .hb-chapter-body{display:block!important;border:1px solid #ccc;border-top:none}
  .hb-chapter-header{break-inside:avoid;border:1px solid #ccc!important;box-shadow:none!important}
  .hb-chapter{break-inside:avoid;page-break-inside:avoid}
  .hero,.toc-card{border:1px solid #ccc}
  .container{max-width:none;padding:10px}
}
</style>
</head>
<body>

<header class="topbar">
  <h1>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary-dark)" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    ספר בית הספר
    <span class="badge">תשפ"ו</span>
  </h1>
  <nav>
    <a href="index.html">← חזרה למערכת הניהול</a>
  </nav>
</header>

<main class="container">

  <section class="hero">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    </div>
    <h2>ספר בית הספר — אורט בית הערבה</h2>
    <p>היכרות עם בית הספר ונהלי עבודה פדגוגיים · תשפ"ו</p>
  </section>

  <div class="controls">
    <input type="text" id="handbookSearch" placeholder="חיפוש בספר הנהלים..." oninput="filterHandbook()">
    <button class="btn btn-primary" onclick="expandAllChapters()">פתח הכל</button>
    <button class="btn" onclick="collapseAllChapters()">סגור הכל</button>
    <button class="btn" onclick="printHandbook()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      הדפסה
    </button>
  </div>

  <div class="toc-card" id="handbookTOC"></div>

  <div id="handbookChapters"></div>

  <div class="empty-state" id="emptyState">
    <p>לא נמצאו פרקים שתואמים את החיפוש.</p>
  </div>

  <div class="footer">
    בית ספר אורט בית הערבה · תשפ"ו · מנהלת: מיטל פלג
  </div>

</main>

<script>
const handbookSections=[
  {id:'about', label:'חלק א — היכרות עם בית הספר'},
  {id:'procedures', label:'חלק ב — נהלי עבודה פדגוגיים'}
];

const handbookChapters=[

/* =================== חלק א — היכרות עם בית הספר =================== */

{id:'ch1', num:1, section:'about', title:'תעודת זהות בית ספרית', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="13" y2="12"/><line x1="7" y1="16" x2="10" y2="16"/></svg>', content:`<div class="ch-body">
<h3>דבר המנהלת</h3>
<div class="accent-box">
<p>בית הספר שלנו הוא בית של ערכים, עשייה וחדשנות — אבל בעיקר בית של משפחה.</p>
<p>אנו גאים להוביל תלמידים במסע ייחודי המשלב בין חינוך מקצועי וחינוך ערכי, ומעניק להם כלים משמעותיים לעתיד. במידעון תכירו את העקרונות המנחים את עשייתנו: <strong>החינוך היוצר, חמשת הממדים, ושבעת עקרונות השינוי</strong> שמובילים את העשייה בבית הספר. פעילויות בית הספר, ההתמחויות וההתנדבויות שלנו משקפים את הערכים ואת קהילת המשמעות שיצרנו, ואת המחויבות שלנו להצלחת תלמידינו.</p>
<p style="text-align:left;margin-top:8px"><strong>מיטל פלג</strong> · מנהלת</p>
</div>

<h3>נתוני מפתח</h3>
<div class="kpi-grid">
<div class="kpi"><div class="kpi-num">70%</div><div class="kpi-label">זכאות לבגרות</div></div>
<div class="kpi"><div class="kpi-num">90%</div><div class="kpi-label">זכאות לתעודת מקצוע</div></div>
<div class="kpi"><div class="kpi-num">83%</div><div class="kpi-label">תעסוקה — אוטוטרוניקה</div></div>
<div class="kpi"><div class="kpi-num">84%</div><div class="kpi-label">תעסוקה — מחשבים</div></div>
</div>

<h3>עקרונות החינוך היוצר</h3>
<ul>
<li><strong>האדם במרכז</strong> — התייחסות לכל תלמידה ותלמיד כאדם שלם.</li>
<li><strong>למידה דואלית</strong> — שילוב בין למידה עיונית להתנסות מעשית.</li>
<li><strong>מודל מתחדש ודינמי</strong> — התאמה מתמשכת לעולם משתנה.</li>
<li><strong>רלוונטי לכל תלמידה ותלמיד</strong> — מענה אישי ומדויק.</li>
</ul>
<div class="info-box">בית הספר מאמץ את <strong>תפיסת "דרך כפר"</strong> — חינוך התיישבותי המדגיש קהילתיות, עבודה מעשית ואחריות אישית.</div>
</div>`},

{id:'ch2', num:2, section:'about', title:'חמשת הממדים, ערכים ועקרונות השינוי', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>', content:`<div class="ch-body">
<h3>חמשת הממדים</h3>
<p>תיכון אורט בית הערבה פועל לפי תפיסה חינוכית המבוססת על חמשת הממדים. כל ממד מקבל חודש או חודשיים של התמקדות, עם פעילויות ויוזמות המקדמות צמיחה אישית, חברתית וחינוכית.</p>
<div class="dim-grid">
<div class="dim-card"><div class="dim-num">1</div><div class="dim-name">שייכות</div></div>
<div class="dim-card"><div class="dim-num">2</div><div class="dim-name">כבוד</div></div>
<div class="dim-card"><div class="dim-num">3</div><div class="dim-name">מוטיבציה פנימית</div></div>
<div class="dim-card"><div class="dim-num">4</div><div class="dim-name">אוטונומיה</div></div>
<div class="dim-card"><div class="dim-num">5</div><div class="dim-name">מימוש עצמי</div></div>
</div>

<h3>ערכים — הלכה למעשה</h3>
<ul>
<li><strong>מצוינות</strong></li>
<li><strong>שייכות</strong></li>
<li><strong>שוויון</strong></li>
<li><strong>קשר אישי משמעותי</strong> — "כל ילד צריך מבוגר אחד שיאמין בו" (הרב קרליבך)</li>
<li><strong>בחירה ואחריות</strong></li>
</ul>

<h3>שבעת עקרונות השינוי</h3>
<ol>
<li><strong>סדירויות</strong></li>
<li><strong>שפה ונראות</strong></li>
<li><strong>רפלקציה</strong></li>
<li><strong>פיתוח צוות</strong></li>
<li><strong>תוכניות עבודה</strong></li>
<li><strong>מענה על צורכי התלמידים</strong></li>
<li><strong>דיוק עבודת החינוך</strong></li>
</ol>

<h3>מערכת מילגו — פדגוגיה מבוססת נתונים</h3>
<div class="info-box">
<p>מערכת <strong>מילגו</strong> מהווה כלי מרכזי בתפיסה הפדגוגית של בית הספר. המערכת מאפשרת איסוף שיטתי של נתונים על התקדמות התלמידים במגוון תחומים: הישגים לימודיים, נוכחות, התנהגות ומעורבות חברתית.</p>
<p>באמצעות ניתוח הנתונים אנו מזהים מגמות, מאתרים צרכים ומתאימים מענים פדגוגיים באופן מדויק לכל תלמיד — תוך יצירת תמונה הוליסטית של התקדמותו.</p>
</div>
</div>`},

{id:'ch3', num:3, section:'about', title:'דרך כפר וקהילה של משמעות', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>', content:`<div class="ch-body">
<h3>תפיסת "דרך כפר"</h3>
<p>תיכון אורט בית הערבה מאמץ את תפיסת "דרך כפר" כמצפן חינוכי מוביל. גישה זו, המבוססת על ערכי החינוך ההתיישבותי, מדגישה את:</p>
<ul>
<li><strong>קהילתיות</strong></li>
<li><strong>עבודה מעשית</strong></li>
<li><strong>אחריות אישית</strong></li>
</ul>
<p>התפיסה באה לידי ביטוי בשילוב הייחודי בין למידה מקצועית למעורבות קהילתית — דוגמת המספרה החברתית ושיתופי הפעולה עם הקהילה. גישה זו משתלבת באופן טבעי עם חמשת הממדים, ויחד הם יוצרים מארג חינוכי המטפח את התפתחות התלמיד.</p>

<h3>פתיחות בוקר לצוות בית הספר</h3>
<div class="info-box">
<p>מדי יום, לפני השיעור הראשון, מתקיימת פתיחת בוקר שבה חבר צוות משתף את משנתו החינוכית או רעיון יצירתי.</p>
<p><strong>היוזמה תורמת:</strong></p>
<ul>
<li>חיזוק תחושת השייכות</li>

{id:'ch4', num:4, section:'about', title:'למידה דואלית', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>', content:`<div class="ch-body">
<h3>מהי למידה דואלית?</h3>
<p>הלמידה הדואלית בחינוך היוצר משלבת בין למידה עיונית לעשייה מעשית-יצירתית, במטרה לטפח יצירתיות, חשיבה ביקורתית ומיומנויות פרקטיות. התלמידים עובדים על פרויקטים רב-תחומיים, מיישמים ידע בצורה מעשית ומשתפים פעולה עם תעשיות וקהילות.</p>

<h3>עקרונות המודל</h3>

<li><strong>שילוב למידה עיונית ומעשית</strong></li>
<li><strong>שילוב בין תחומי ידע</strong></li>
<li><strong>התנסות מעשית</strong></li>
<li><strong>חיבור בין בית הספר לעולם האמיתי</strong></li>
</ul>

<h3>דוגמאות בשטח</h3>
<ul>
<li><strong>עבודה בשכר במספרה החברתית</strong></li>
<li><strong>יצירת פודקאסט בתחומי דעת</strong></li>
<li><strong>למידה מחוץ לבית הספר</strong> — שכבת ט'</li>
</ul>

<h3>יזמות — פדגוגיה חדשנית בכיתה ט'</h3>
<div class="accent-box">
<p>בכיתה ט' אנחנו מיישמים פדגוגיה חדשנית שמחלקת את השנה ל<strong>שלושה חלקים</strong>, כאשר כל חלק מתמקד בהיבטים שונים של החוק והחברה.</p>
<p>השליש הראשון עוסק בנושא <strong>חוקים וכללים</strong>, בהתאמה לחומרי הלימוד במקצועות: תנ"ך, אזרחות, היסטוריה.</p>
<p><strong>למידה מחוץ לכיתה:</strong> מייקרס, מוזיאון הסובלנות, הרצאה של עו"ד לענייני זכויות, סיור במשטרת ישראל, סיור בבית המשפט העליון.</p>
</div>
</div>`},

{id:'ch5', num:5, section:'about', title:'מגמות המקצוע', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 20l9.5-9.5L15 14l7-7"/><polyline points="17 7 22 7 22 12"/></svg>', content:`<div class="ch-body">
<h3>שלוש המגמות המקצועיות</h3>
<p>תחום התעסוקה בתיכון אורט בית הערבה הוא חלק מרכזי בתפיסת הלמידה הייחודית שלנו, המשלבת בין לימודים תיאורטיים לניסיון מעשי.</p>

<h4>1. אוטוטרוניקה</h4>
<p>מגמת דגל המשלבת בין טכנולוגיות מתקדמות בתחום הרכב לבין הכשרה מעשית מקיפה. תלמידי המגמה רוכשים תעודות מקצועיות נוספות המוכרות בתעשייה, ומכינים את עצמם להובלת תחום הרכב המודרני.</p>

<h4>2. מחשבים וניהול רשתות</h4>
<p>מגמה המעניקה הכשרה מקצועית בתחומי המחשבים, רשתות וסייבר בסיסי, בשיתוף פעולה עם גופים מובילים בתעשייה. תלמידי המגמה משתלבים בעבודה במחלקת המחשבים של משטרת ישראל ובמעבדות מקומיות.</p>

<h4>3. עיצוב שיער</h4>
<p>מכשירה את התלמידים למקצועות היופי והאסתטיקה, עם דגש על רכישת תעודות מקצועיות (עיצוב גבות, לק ג'ל, הדבקת ריסים). במסגרת המספרה החברתית של בית הספר התלמידים עובדים עם לקוחות אמיתיים — וצוברים ניסיון מעשי תוך קבלת שכר.</p>

<h3>אסטרטגיית קריירה — תפירת חליפה ייחודית</h3>
<ul>
<li><strong>אופק תעסוקתי</strong> — תמונת עתיד ברורה</li>
<li><strong>ניהול עסק</strong></li>
<li><strong>התנסות מעשית</strong></li>
<li><strong>מנטורינג</strong></li>
</ul>
<div class="info-box">המודל הדואלי מחזק את הקשר בין בית הספר לשוק העבודה ומכין את התלמידים להשתלבות מקצועית בעתיד.</div>
</div>`},

{id:'ch10', num:10, section:'procedures', title:'שגרת יום הלימודים וצלצולים', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>', content:`<div class="ch-body">
<h3>שעות יום העבודה</h3>
<ul>
<li><strong>יום העבודה (צוות)</strong> מתחיל ב-<strong>08:00</strong> ומסתיים ב-<strong>15:30</strong>.</li>
<li><strong>יום הלימודים (תלמידים)</strong> מתחיל ב-<strong>08:30</strong> בדיוק.</li>
<li><strong>שער בית הספר ננעל ב-08:40.</strong></li>
</ul>
<div class="warning-box">כל יציאה באמצע יום עבודה מחייבת יידוע וקבלת אישור מהמנהלת.</div>

<h3>צלצולים</h3>
<ul>
<li>על המורה להגיע לכיתה <strong>עם הישמע הצלצול</strong>.</li>
<li>להיכנס בזמן לכל השיעור.</li>
<li>לצאת מהכיתה <strong>רק עם הישמע הצלצול</strong> בסיום השיעור.</li>
<li>בדרך לכיתה — לאסוף את התלמידים.</li>
</ul>
<div class="warning-box"><strong>אין לקצר שיעורים!</strong></div>

<h3>פתיחת השיעור</h3>
<ul>
<li>אין להתחיל שיעור לפני שהכיתה <strong>נקייה ומסודרת</strong>.</li>
<li>חובה לנעול בהפסקות, או להשאיר תורן אחראי.</li>
<li>חובה לרשום נוכחות ותוכן השיעור ב-SmartSchool בכל שיעור.</li>
<li>יש להגיע מוכן מראש עם מערכי שיעור וחומרי למידה מגוונים, מתאימים ויצירתיים.</li>
<li>יש להקפיד על קישוט הכיתה והחצר.</li>
</ul>

<h3>תורנות חצר</h3>
<div class="info-box">
<p>הדרך הטובה ביותר לשמירה על בטיחות התלמידים ועל קיום סדר טוב בבית הספר היא ביצוע התורניות על ידי המורים. <strong>התורנות חובה</strong> על פי הוראות משרד החינוך.</p>
<p><strong>אחראי תורנות מורים:</strong> רכז מוגנות ומנו.</p>
<p>האחריות על המתרחש בהפסקות חלה על המורים התורניים. <strong>נוכחות בחדר המורים בעת ההפסקה אינה מראה ביצוע תורנות</strong> — יש לעמוד בעמדות שנקבעו.</p>
<p>מורה שלא יכול לבצע את משימתו — תפקידו ליידע את רכז המוגנות ולדאוג למחליף.</p>
</div>
</div>`},

</div>`},

{id:'ch12', num:12, section:'procedures', title:'משמעת — נהלים בסיסיים', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>', content:`<div class="ch-body">
<h3>שחרור כיתה ושינוי מערכת</h3>
<div class="warning-box">בשום פנים ואופן <strong>אין לשחרר כיתה</strong> ללא אישור מנהלת בית הספר. כל שינוי מערכת דורש תיאום מול המנהלת / מנהלת פדגוגית.</div>

<h3>בחינות וסיום מוקדם</h3>
<p><strong>אין לשחרר תלמידים שסיימו בחינה.</strong> יש להיערך ולהכין דף עבודה לתלמידים המסיימים מוקדם.</p>

<h3>הוצאת תלמידים משיעור</h3>
<ul>
<li><strong>ככלל — אין להוציא תלמידים משיעור.</strong> תלמידים המסתובבים בחוץ גורמים להפרת סדר.</li>
<li>בעיות משמעת שגרתיות — לטפל בתוך השיעור או לאחריו.</li>
<li>במקרים קשים (טובת כיתה, אלימות) — ניתן להוציא את התלמיד <strong>ולוודא שרכז המוגנות או מנו פוגשים אותו</strong>.</li>
<li>באחריות המורה <strong>לעדכן את המחנך ואת הורי התלמיד</strong> על כך שהוצא מהשיעור.</li>
</ul>

<h3>אחריות על הכיתה</h3>
<ul>
<li>חובת המורה לדאוג שהכיתה בה הוא מלמד תהיה מסודרת ונקייה.</li>
<li>לכבות חשמל ומזגנים.</li>
<li>חובה לנעול את דלת הכיתה לפני כל הפסקה — או על פי הנחיית מחנך לתורנות כיתתית.</li>
<li>המורה המלמד בשיעור האחרון אחראי <strong>להשאיר כיתה מסודרת ונקייה</strong> ו<strong>להוציא את התלמידים משער בית הספר</strong>.</li>
</ul>

<h3>שפה ויחס</h3>
<p>על מנת למנוע עימותים מיותרים ולהפחית אלימות מילולית — חשוב להתבטא בצורה מכובדת לתלמידים. כך נשמר כבודך וכבודם של התלמידים, וכך תשמש דוגמה נאותה.</p>

<h3>סנקציות — אישור חובה</h3>
<div class="warning-box">
<ul>
<li><strong>חל איסור לשלוח תלמיד הביתה</strong> ללא אישור המנהלת ויידוע ההורים.</li>
<li><strong>חל איסור להשעות תלמיד</strong> ללא יידוע ואישור המנהלת.</li>
<li>השעיית תלמיד תיעשה על פי נוהל השעיה בחוזר מנכ"ל — לא כדרך קבע, אלא במקרים שאין ברירה.</li>
</ul>
</div>

<h3>אלימות — חובת דיווח מיידי</h3>
<div class="warning-box"><strong>חובה ליידע את רכז המוגנות / מנו / המנהלת באופן מיידי</strong> על כל אירוע אלימות (הקטן ביותר!).</div>

<h3>שונות</h3>
<ul>
<li><strong>זמן התכנסות</strong> (פעילות חברתית, הרצאה) — המורה המלמד בכיתה אחראי על התלמידים וייוותר לאורך כל הפעילות.</li>
<li>אין לסמס או להשתמש בשיעור בפלאפון שלא למטרת השיעור (דוגמה אישית!).</li>
<li>אין לצאת בשעת השיעור ולהשאיר כיתה ללא מורה או כוח עזר.</li>
<li>נא להקפיד שתלמידים לא נכנסים לשטח חדר מורים.</li>
<li><strong>מכתב מודפס יוצא רק באישור מנהלת בית הספר.</strong></li>
</ul>
</div>`},

{id:'ch13', num:13, section:'procedures', title:'מדרג תגובות לבעיות משמעת', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>', content:`<div class="ch-body">
<h3>נקודת המוצא</h3>
<div class="info-box">מרבית בעיות המשמעת יכולות להימנע כאשר השיעור מובנה בצורה <strong>מעניינת, משמעותית, מפעילה ומאתגרת</strong>. קשר אישי יכול למנוע הרבה בעיות!</div>

<h3>מדרג תגובות — שלבים</h3>
<ol>
<li><strong>שיחה אישית</strong> לבירור מצבו הכללי של התלמיד.</li>
<li><strong>השלמה בסוף יום</strong> — לקיחת אחריות ותיקון.</li>
<li><strong>עבודה בבית או בסוף יום.</strong></li>
<li><strong>שיחה עם מחנך הכיתה.</strong></li>
<li><strong>שיחה עם רכז המשמעת.</strong></li>
<li><strong>שיחה משותפת — מחנך + יועץ/ת.</strong></li>
<li><strong>טלפון להורים.</strong></li>
<li><strong>הזמנת הורים.</strong></li>
<li><strong>שיחה עם מנהלת בית הספר.</strong></li>
</ol>

<h3>מעורבות המורה המקצועי</h3>
<p>המורה המקצועי יטפל בבעיות המשמעת המתרחשות בזמן השיעורים שלו, ולאחר טיפול יעדכן את המחנך.</p>
<h4>טיפים למורה המקצועי</h4>
<ul>
<li>קשר אישי, מכתבים חיוביים, סיפוק מיידי של ציונים</li>
<li>הפעלת התלמידים, יצירתיות, אמון בתלמיד</li>
<li>משימות לפי מדרג יכולות</li>
<li>שילוב של משחקים</li>
</ul>

<h3>טיפול בכיתה — מומלץ</h3>
<ul>
<li>בפעם הראשונה — לגשת לתלמיד ולשוחח בשקט.</li>
<li>לתת הזדמנות נוספת.</li>
<li>להוציא רק כאשר זה מפריע לשאר הכיתה — ולטפל בהפסקה במיידית.</li>
<li>לעדכן מחנך, ובמידת הצורך — רכז משמעת.</li>
</ul>

<h3>תגובות חינוכיות תואמות התנהגות</h3>
<p>חשוב שיהיה קשר ישיר בין ההתנהגות לבין התוצאות (התיקון, התגובה):</p>
<table>
<tr><th>התנהגות</th><th>תגובה חינוכית</th></tr>
<tr><td>זרק לכלוך על הרצפה</td><td>ניקוי הכיתה או חצר בית הספר</td></tr>
<tr><td>השתמש באלימות</td><td>עבודה בנושא אלימות — מצגת, פלקט, הרצאה לשאר התלמידים</td></tr>
<tr><td>הפרעה בשיעור</td><td>השלמת זמן בסוף היום, השלמת חומר, בוחן, הורדת ציון בתעודה, עדכון הורים</td></tr>
</table>

<h3>שיחות בירור ויידוע הורים</h3>
<div class="info-box">רכז המשמעת ישוחח עם התלמיד במידת הצורך, ויודיע להורים בכל קשת המקרים. אין זה פוטר את המורה המקצועי או המחנך מאחריות לטפל באירוע — שיחה, הבהרה, חוזה מחודש, התחייבות, מטלה חינוכית, שיחה עם הורים.</div>
</div>`},

{id:'ch14', num:14, section:'procedures', title:'תפקידי המורה — מחנך, מקצועי, מילוי מקום', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>', content:`<div class="ch-body">
<h3>מחנך הכיתה</h3>
<ul>
<li>אחראי על ביקור סדיר של התלמידים בכיתתו.</li>
<li>שעת אפס יומית — דיווח נוכחות עד 11:00 ב-SmartSchool.</li>
<li>מעל יומיים היעדרות רצופים — עדכון יועצת.</li>
<li>אחרי 3 ימי היעדרות — עדכון מנהלת ורכזת מניעת נשירה.</li>
<li>בכל יום היעדרות — שיחה עם הורים (אם לא עונים, להשאיר הודעה).</li>
<li>אחראי להעצמת תלמידיו: שיחות אישיות, חלוקת תפקידים, ימי גיבוש, שיעורי מחנך, כישורי חיים (יחד עם היועצת), קישוט כיתה, אחראיות על פעילויות חברתיות והתנדבות.</li>
<li>בדיקת המערכת המעודכנת בכל בוקר — ועדכון התלמידים.</li>
</ul>

<h3>מורה מקצועי</h3>
<ul>
<li>בשעת השיעור — אחראי לכל נושא המתעורר בשיעור.</li>
<li>חובה לטפל באופן אישי — כולל פנייה להורים ויידוע המחנך.</li>
<li>חובה לעדכן את המחנך על היעדרות תלמיד מהשיעור.</li>
<li>המורה המלמד שיעור אחרון — אחראי להשאיר כיתה מסודרת ונקייה ולהוציא את התלמידים משער בית הספר.</li>
</ul>

<h3>מילוי מקום</h3>
<div class="info-box">
<ul>
<li>יש להתייחס לשיעור מילוי המקום כאל שיעור לכל דבר.</li>
<li>השיעור מתקיים בחדר הכיתה לפי המערכת של הכיתה.</li>
<li>השיעור יתקיים בכל כמות של תלמידים.</li>
<li>המורה ממלא המקום מתבקש לבדוק נוכחות לפי יומן הכיתה ב-SmartSchool.</li>
<li><strong>אין להוציא תלמידים</strong> בשעת מילוי מקום (ולא בשיעורים אחרים) להסתובב. הלימודים מתקיימים בכיתות בלבד.</li>
<li>אין להוציא תלמיד מהשיעור למנוחה ללא יידוע רכז התלמידים.</li>
</ul>
</div>
</div>`},

{id:'ch15', num:15, section:'procedures', title:'כללי התנהלות צוות וישיבות פדגוגיות', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>', content:`<div class="ch-body">
<h3>צוות כדמות לחיקוי</h3>
<div class="accent-box">איש צוות בבית הספר הוא מודל ודמות לחיקוי עבור התלמידים.</div>

<h3>ימי חיסור ואישורים</h3>
<ul>
<li>ימי חיסור שעליהם לא יתקבלו אישורים <strong>עד סוף החודש</strong> שבו החסירו — יורדו מהשכר. <strong>נא לדאוג לאישורים במועד.</strong></li>
<li>מורה המבקש להשתחרר מיום עבודה — יתאם עם מנהלת ביה"ס והמנהלת הפדגוגית.</li>
<li>מורה המבקש להשתחרר תוך כדי יום לימוד — יתאם עם מנהלת ביה"ס והמנהלת הפדגוגית. בית הספר ירשום לחובת המורה את שעות ההוראה, והוא יחויב להחזירן.</li>
<li>היעדרות ממועצה פדגוגית, ישיבה או השתלמות — <strong>באישור מנהלת ביה"ס בלבד</strong>. ככלל — אין נעדרים!</li>
</ul>

<h3>ישיבות צוות — לוח קבוע</h3>
<table>
<tr><th>סוג ישיבה</th><th>יום ושעה</th></tr>
<tr><td>ישיבת צוות כללית</td><td>יום ראשון · 13:45–15:30</td></tr>
<tr><td>השתלמות בית-ספרית</td><td>יום שלישי · 13:45–15:30</td></tr>
<tr><td>ישיבת הנהלה</td><td>יום שני</td></tr>
<tr><td>ישיבות צוותים מקצועיים</td><td>קבועות במערכת</td></tr>
</table>
<div class="info-box">
<p><strong>ישיבות צוותים מקצועיים ורכזי מגמה / שכבה</strong> — קבועות במערכת. דיונים והחלטות, ייעול והתקדמות המגמה / המקצוע / השכבה. גוון פדגוגי: תוכניות לימודים, דרכי הוראה, אמצעי הוראה והעשרה.</p>
<p>ניהול הישיבה ורישום הפרוטוקול והפצתו — באחריות רכז המקצוע / המגמה / השכבה. <strong>המנהלת הפדגוגית</strong> אחראית כללית על ישיבות הצוותים.</p>
</div>

<h3>ישיבות פדגוגיות — פעם בשליש</h3>
<div class="warning-box">
<p><strong>ישיבות פדגוגיות מתרחשות פעם בשליש.</strong></p>
<p><strong>חובת השתתפות לכל הצוות שמלמד או נמצא בקשר עם הכיתה.</strong></p>
<p>התאריכים מפורסמים מראש — אנא היערכו לכך.</p>
</div>

<h4>הכנה לישיבה פדגוגית — חובת מחנכים ומורים מקצועיים</h4>
<p>לפני הישיבה הפדגוגית, מחנכים ומורים מקצועיים צריכים:</p>
<ul>
<li><strong>למלא ציונים</strong> במלואם.</li>
<li><strong>למלא נתונים</strong> ככל שיתבקשו.</li>
<li>לוודא ששיעורים ותכני שיעור מדווחים ב-SmartSchool.</li>
<li>להכין הערה פדגוגית: חוזקות, אתגרים, המלצות לכל תלמיד.</li>
</ul>
</div>`},

{id:'ch16', num:16, section:'procedures', title:'סביבה ומשאבים — חדר מורים, מערכת שעות, כיתות', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>', content:`<div class="ch-body">
<h3>חדר מורים</h3>
<ul>
<li>חדר המורים נועד להיות מקום נעים לצוות — נא לשמור על ניקיון וסדר, להתחשב אחד בשני.</li>
<li>נא להקפיד <strong>לנעול את הדלת</strong> — לשם כך הותקן <strong>קודן</strong>.</li>
<li><strong>אין לשבת עם תלמידים</strong> בחדר מורים.</li>
<li>כל מורה מתבקש לפנות את כלי האוכל / שתייה מהשולחן.</li>
<li>נא לא להשאיר חפצים מפוזרים.</li>
<li>הגדילו ראש ואכפתיות — שלא להשאיר אוכל במקרר, שקיות מסתובבות, כלים וקופסאות.</li>
</ul>

<h3>מערכת שעות</h3>
<p>מערכת השעות השבועית היא <strong>מסמך תפעול ותפקוד</strong> ומסגרת בסיסית לעבודה היומיומית עבור התלמידים.</p>
<ul>
<li>המערכת מופצת למורים ולמחנכים. <strong>באחריות המחנכים</strong> להעביר לתלמידי כיתתם את המערכת ולעדכן בכל שינוי: מקצוע, מורה, חדר לימוד.</li>
<li>בכל כיתה תלויה מערכת שעות מסודרת. שינוי קבוע — באחריות המחנך לעדכן.</li>
<li>שינויי מערכת משודרים במסך המערכת ליד חדר מורים, ועדכון נשלח לפלאפונים של המורים הרלוונטיים.</li>
</ul>

<h4>נהלי עבודה — מערכת שעות</h4>
<ul>
<li>מורה הצפוי להיעדר — יבקש אישור מהמנהלת מבעוד מועד. לאחר קבלת אישור — להתקשר לאחראית מערכת ולעדכן. אחראית המערכת אחראית להודיע על השינוי לשאר המורים ולתלמידים — באמצעות הטלוויזיה ועדכון בחדר מורים.</li>
<li>מורה היודע על פעילות חברתית של הכיתה בה הוא אמור ללמד ושיעורו מתבטל — <strong>חייב בנוכחות</strong>, על פי המערכת והשינויים החדשים.</li>
<li>מורה המתחיל יום עבודה — יבדוק בלוח המערכת ויתעדכן בשינויים אפשריים: מילוי מקום, שינוי מקום או כל שינוי אחר. כמו כן — יעדכן את הכיתה באשר לשינוי באותו היום.</li>
</ul>
<div class="info-box">נא לעדכן את התלמידים על שינויים. נעשו המון ניסיונות שהמערכת תענה על צורכי התלמידים והמורים — נא להקפיד על עבודה לפי הכללים והנהלים.</div>

<h3>חדרי לימוד</h3>
<ul>
<li>באחריות המחנך והתלמידים <strong>לקשט את הכיתה</strong>, לעדכן בלוחות המשתנים, ולשמור על ניקיון וסדר.</li>
<li>בשיעורי <strong>מתמטיקה ואנגלית</strong> שיש בהם פיצול — מתפצלים לפי כיתות האם של השכבה. המחנך אחראי להכין טבלה מסודרת לפי חלוקת הקבוצות התלויה בכיתה.</li>
<li>באחריות כל מורה בסוף השיעור <strong>להגיד לתלמידים איזה שיעור יש להם אחריו ובאיזה חדר</strong> (במידה ויש שינוי).</li>
<li>באחריות כל מורה לדאוג שהוא <strong>מקבל ומוסר כיתה נקייה ומסודרת</strong> — דוגמה אישית של כל מורה תוסיף המון!</li>
</ul>
</div>`},

{id:'ch17', num:17, section:'procedures', title:'SmartSchool ו-3 שלישים', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>', content:`<div class="ch-body">
<h3>SmartSchool — חובת מילוי</h3>
<div class="warning-box">יומן הכיתה המודפס עבר למערכת ה-SmartSchool באופן מלא. <strong>כל מורה חייב למלא נוכחות תלמידים ותוכן השיעור ב-SmartSchool — כל שיעור.</strong></div>

<h3>השנה ל-3 שלישים</h3>
<div class="info-box">השנה מחולקת ל-<strong>3 שלישים</strong>. יש להקפיד על תאריכי הגשת הדוחות.</div>

<h3>דיווחים פדגוגיים</h3>
<table>
<tr><th>מועד</th><th>פעולה</th></tr>
<tr><td><strong>תחילת השנה</strong></td><td>הגשת תוכנית לימודים</td></tr>
<tr><td><strong>במהלך השליש</strong></td><td>הכנסת ציונים ב-SmartSchool — שימו לב לתאריכים שאחריהם אי אפשר להכניס ציונים</td></tr>
<tr><td><strong>סיום שליש</strong></td><td>לוח מבחנים לכל כיתה — קבוע ומפורסם</td></tr>
<tr><td><strong>שוטף</strong></td><td>עדכון רכז המגמה לגבי התקדמות לימודית, קשיים וצרכים</td></tr>
</table>

<h3>מעקב פדגוגי</h3>
<ul>
<li>כל אינטראקציה משמעותית עם תלמיד מתועדת בהערות מעקב במשו"ב.</li>
<li>התיעוד הוא כלי ניהולי-פדגוגי מרכזי.</li>
</ul>

<h3>הזמנת ציוד ורב קו</h3>
<h4>הזמנת ציוד</h4>
<ul>
<li>כל איש צוות שצריך לרכוש ציוד עבור בית הספר ממלא <strong>טופס</strong> ומגיש לחתימת המנהלת.</li>
<li><strong>לא יתקבלו קבלות לא מפורטות.</strong></li>
<li>יש להגיש את הקבלות סמוך ביותר לקנייה.</li>
</ul>

<h4>חלוקת רב קו</h4>
<div class="info-box">
<p>עיריית ירושלים מחלקת כרטיסיות לתלמידים על פי 2 קריטריונים: תלמיד שהוגדר חינוך מיוחד, ודרגת זכאות א'. החישוב לפי מרחק מהבית לבית הספר.</p>
<p>כל התלמידים הזכאים חייבים <strong>לחתום על קבלת רב קו</strong> לפי דרישת העירייה. בתחילת כל חודש המזכירות שולחת הודעה — תשלחו את התלמידים לקבל זאת במזכירות.</p>
</div>
</div>`},

{id:'ch18', num:18, section:'procedures', title:'תקנון תלמידאות — חוזה תלמידים', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>', content:`<div class="ch-body">
<h3>תפיסה</h3>
<div class="accent-box">אנו במשפחת אורט בית הערבה רוצים להכין את התלמידים לחיים בצורה הטובה ביותר. תקבלו המון אהבה, תשומת לב ולימודים ברמה מתאימה — וגם גבולות ומשמעת שיעזרו לכם לבנות הרגלי חיים ולהצליח בלימודים.</div>

<h3>תלבושת בית הספר</h3>
<p>כשמגיעים לבית הספר עם תלבושת אחידה — מגיעים עם כוונה ללמוד ולהיות חלק. בנוסף, תלבושת אחידה מייצרת שוויוניות ואחידות.</p>
<ul>
<li>חובה להגיע לבית הספר עם <strong>תלבושת קיץ/חורף — חולצה / סווצ'ר</strong>, מדי בוקר.</li>
<li>יש להישאר עם התלבושת במשך כל יום הלימודים.</li>
<li>תלמיד שמגיע ללא תלבושת — יתבקש לחזור הביתה או לקנות תלבושת באותו היום. הודעה תימסר להורים.</li>
<li>לנוחיותכם יש אפשרות לרכוש תלבושת בבית הספר.</li>
</ul>

<h3>ציוד</h3>
<ul>
<li>חובה להגיע עם <strong>תיק וציוד מתאים</strong> למערכת השעות.</li>
<li>תלמיד שלא יגיע עם ציוד — יירשם אצל רכז המשמעת. במידת הצורך — המשך טיפול חינוכי.</li>
</ul>

<h3>הגעה בזמן</h3>
<div class="warning-box">
<p>יום הלימודים מתחיל בשעה <strong>08:30</strong> בדיוק. חשוב להגיע לפני הזמן כדי להתארגן. <strong>שער בית הספר ננעל בשעה 08:40.</strong></p>
<p>כל איחור יירשם וילווה בתגובה חינוכית. התלמיד יורשה להיכנס לכיתה רק באישור רכז המשמעת. במקרים חריגים — ישלח התלמיד הביתה עם הודעה להורים.</p>
</div>
<p><strong>הגעה בזמן במהלך היום:</strong> הצלצול בשביל כולנו ומחייב כולם להגיע לכיתה לאחר ההפסקה. כל איחור יירשם וילווה בתגובה חינוכית.</p>

<h3>יציאה משטח בית הספר</h3>
<ul>
<li><strong>חל איסור לעזוב את שטח בית הספר ללא אישור בכתב.</strong></li>
<li>שחרור תלמידים במהלך היום — רק עם אישור הורים ואישור יציאה למאבטח.</li>
<li>תלמיד שיעזוב ללא אישורים — תגובה משמעתית וחינוכית.</li>
</ul>

<h3>כבוד בבית הספר</h3>
<ul>
<li>במהלך השיעור — חובה להתנהג בכבוד ובנימוס כלפי צוות המורים וחברי הכיתה.</li>
<li>שימוש בשפה לא נקייה — ילווה במטלה חינוכית / לימודית. הודעה תימסר להורים.</li>
<li>במהלך השיעורים <strong>אין להשתמש בפלאפון נייד</strong> — יש להשאיר את הפלאפון סגור וכבוי בתיק, או להניח במתקן הפלאפונים. אפשר להטעין בבית הספר (מטענים באחריות התלמידים).</li>
</ul>

<h3>קו אדום — אלימות</h3>
<div class="warning-box">
<p><strong>חל איסור מוחלט בשימוש באלימות מילולית או פיזית</strong> בבית הספר ובחיים בכלל.</p>
<p>במקרה של אלימות פיזית — התלמיד יורחק מיידית מבית הספר עד לבירור האירוע. הודעה תימסר להורים.</p>
</div>

<h3>בריאות</h3>
<p>בריאותכם חשובה לנו — אנו מקפידים להעניק כריך או ארוחת צהריים חמה במהלך השבוע.</p>
<p><strong>חל איסור מוחלט לעשן בשטח בית הספר.</strong> תלמיד שלא מכבד את האיסור — יאלץ להגיע עם הוריו לבית הספר, וכמו כן יקבל תגובה חינוכית.</p>
</div>`},

{id:'ch19', num:19, section:'procedures', title:'כוחות עזר ושעות פרטניות', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>', content:`<div class="ch-body">
<h3>שיבוץ כוחות עזר בכיתות</h3>
<div class="info-box">
<p><strong>המנהלת הפדגוגית</strong> אחראית על כוחות העזר בבית הספר.</p>
<p>כל מורה שמבקש לקבל עזרה לכיתתו (בת שירות, שינשין, סטודנט, פו"ש) — מתבקש ליידע את המנהלת הפדגוגית. לאחר אישור — <strong>המנהלת</strong> אחראית לשבץ.</p>
</div>

<h3>תגבורים — יציאה משיעורים</h3>
<ul>
<li>יש לקחת בחשבון שתלמידים יוצאים משיעורים על מנת לקבל תגבורים.</li>
<li><strong>המורה המקצועי אחראי</strong> על העברת החומר הלימודי שהתלמיד זקוק לכוח העזר שיש עם התלמיד.</li>
</ul>

<h3>ספרי לימוד וציוד תלמידים</h3>
<ul>
<li>ספרי לימוד מחולקים <strong>בשקית אישית</strong> לכל תלמיד — בנוכחות הוריו.</li>
<li>חשוב מאוד שהתלמידים יגיעו עם <strong>תיק</strong> לבית הספר ועם <strong>כלי כתיבה</strong>.</li>
<li>בשבוע הראשון ללימודים — על המחנכים להתמקד <strong>בבדיקת ציוד</strong> ולדאוג שלתלמידים יהיו ספרים, מחברות וכלי כתיבה.</li>
</ul>
<div class="info-box"><strong>המנהלת הפדגוגית</strong> אחראית על גביית ומסירת הספרים.</div>
</div>`},

{id:'ch20', num:20, section:'procedures', title:'אני מאמין — חיזוקים חיוביים', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>', content:`<div class="ch-body">
<h3>הנשמה היתרה — כלים לעבודה חינוכית-טיפולית מיטבית</h3>
<div class="accent-box">
<p><strong>סבלנות, הקשבה, לראות תהליך ולא רק תוצאות מיידיות.</strong></p>
<p>לשקף לתלמידים התנהלות, לתווך דרישות וכללים. שיחות אישיות. לזכור — <strong>לא לקחת את הדברים באופן אישי</strong>. כשמתעצבנים — להפסיק את השיח ולהירגע.</p>
<p>יש להיעזר באנשי צוות נוספים: <strong>יסכה, רכז המוגנות, מנו, יועצות</strong>.</p>
</div>

<h3>חיזוקים חיוביים — תרבות בית הספר</h3>
<p>מורה יפתח תרבות של מתן חיזוקים חיוביים לתלמידים המתנהגים כיאות. נעשה זאת על ידי מורים מקצועיים, מחנכים, יועצות ומנהלת.</p>

<h4>רעיונות לחיזוקים חיוביים</h4>
<ul>
<li><strong>ציון שיפור</strong> של התלמיד מול כל הכיתה — שיפור בביצוע משימות, שיפור התנהגותי, שליטה עצמית, לקיחת אחריות</li>
<li><strong>מכתב טוב</strong></li>
<li><strong>דיווח</strong> של מורה מקצועי למחנך, של מחנך למנהלת</li>
<li><strong>טלפון חיובי להורים</strong></li>
<li><strong>תעודת הצטיינות חודשית</strong> בפני כל הכיתה</li>
<li><strong>אמירת משפט טוב</strong> על כל ילד באחד השיעורים בסוף השבוע</li>
</ul>

<h3>אפשרויות תיווך חוויות הצלחה</h3>
<table>
<tr><th>רמה</th><th>אפשרויות</th></tr>
<tr><td><strong>ברמת הפרט</strong></td><td>שיחה אישית עם איש צוות / הנהלה, תעודה</td></tr>
<tr><td><strong>הקבוצה / כיתה</strong></td><td>פרסום בקבוצה, מעמד הענקת תעודה לחניך, ציון בלוח מודעות, הערה מיוחדת בתעודה</td></tr>
<tr><td><strong>הרמה הבית-ספרית</strong></td><td>פרסום בלוח מודעות, ציון החניך בשיחת בית ספר</td></tr>
<tr><td><strong>המשפחה</strong></td><td>זימון להורים, מכתב, טלפון, שיחה. הזמנה לאירועים משמעותיים, ציון ביום הורים / ביקור בית</td></tr>
</table>

<h3>עדכון מידע חשוב</h3>
<div class="warning-box"><strong>חובה ליידע</strong> את אנשי הצוות הרלוונטיים על כל סימן מצוקה ולו הקטן ביותר. כל מידע ששמעתם, ראיתם, או שיש לכם חשד — להעביר בזמן אמת כדי למנוע סיכונים ולתת מענים מיידיים.</div>

<h3>מעורבות תלמידים</h3>
<ul>
<li>חונכויות חברתית או לימודית (אישיות / קבוצתיות)</li>
<li>פרויקטים סביב (הדרכה, בית הספר, מנהלה) — צוות אנשי עזרה</li>
<li>שגרירים מול מפקחים, ביקורים וכדומה</li>
<li>השתתפות בטקסים</li>
<li>מנהיגות חניכים (מועצת תלמידים)</li>
<li>תפקידים בכיתה / בבית ספר</li>
<li>אחריות בפעילות כלל בית-ספרית (סיכום שבוע, טקסים, חגים)</li>
<li>השתתפות בפרויקטים מיוחדים</li>
<li>תכנון וביצוע ערב כיתה</li>
</ul>
</div>`},

{id:'ch21', num:21, section:'procedures', title:'נוהל מבחנים והתאמות', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h8M8 14h4"/><path d="M15 17l2 2 4-4"/></svg>', content:`<div class="ch-body">
<h3>לוח מבחנים</h3>
<p>ישנו לוח מבחנים לכל סיום שליש, לכל כיתה — קבוע ומפורסם.</p>

<h3>במהלך הבחינה</h3>
<div class="warning-box"><strong>אין לשחרר תלמידים שסיימו בחינה.</strong> יש להיערך ולהכין דף עבודה לתלמידים המסיימים מוקדם.</div>

<h3>התאמות בדרכי היבחנות</h3>
<p>תלמידים עם לקויות למידה מאובחנות זכאים להתאמות. סוגי ההתאמות:</p>
<table>
<tr><th>סוג</th><th>פירוט</th></tr>
<tr><td><strong>הקלדה</strong></td><td>תשובות במחשב במקום כתב יד</td></tr>
<tr><td><strong>הקראה</strong></td><td>שאלות מוקראות בחדר נפרד</td></tr>
<tr><td><strong>בחינה בעל-פה</strong></td><td>בוחן רושם את התשובות</td></tr>
<tr><td><strong>מבחן מותאם</strong></td><td>ניסוח פשוט, חלוקה ויזואלית ברורה</td></tr>
<tr><td><strong>תוספת זמן</strong></td><td>הארכה של 25%–33%</td></tr>
</table>
<div class="info-box">תהליך הגשת תיק התאמות לוועדה — באחריות רכז ההתאמות בבית הספר. בקשו פרטים מהמנהלת הפדגוגית.</div>
</div>`},

{id:'ch22', num:22, section:'procedures', title:'ציוני הגשה, בגרויות ותעודות', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>', content:`<div class="ch-body">
<h3>ציון הגשה לבגרות</h3>
<p>כל תלמיד תיכון נדרש לציון הגשה בכל שאלון בגרות. הציון משקף שליטה לאורך השנה ומהווה תנאי כניסה לבגרות.</p>

<h3>חישוב ציון שנתי</h3>
<p>השנה מחולקת ל-<strong>3 שלישים</strong>. הציון השנתי בכל מקצוע מורכב מהציונים שנצברו לאורך השלישים, יחד עם ציון מתכונת / בגרות שבסיום.</p>
<div class="warning-box">לאחר חישוב הציון — אין לשנותו ידנית. טעות? יש לתקן את ציוני המקור ולחשב מחדש.</div>

<h3>תעודות והערות מילוליות</h3>
<ul>
<li>ההערה המילולית חייבת לתאום את הציון. אין הערה חיובית לציון נכשל.</li>
<li>ההערה כוללת: ביצוע, נקודות חוזק, המלצה.</li>
<li>כל תלמיד חייב לקבל הערה מילולית.</li>
</ul>

<h3>תעודות הצטיינות חודשיות</h3>
<div class="info-box">חלק מתרבות החיזוקים החיוביים בבית הספר — תעודת הצטיינות חודשית מוענקת בפני כל הכיתה. (ראו פרק "אני מאמין — חיזוקים חיוביים".)</div>

<h3>בגרויות ומתכונות — יום הבחינה</h3>
<table>
<tr><th>זמן</th><th>פעולה</th></tr>
<tr><td>30 דק' לפני</td><td>תלמידים מגיעים</td></tr>
<tr><td>20 דק' לפני</td><td>בדיקת נוכחות</td></tr>
<tr><td>10 דק' לפני</td><td>כניסה לכיתה, הנחת תיקים</td></tr>
<tr><td>שעת הבחינה</td><td>חלוקת שאלונים, תחילת מבחן</td></tr>
</table>
<div class="warning-box"><strong>לאחר חלוקת השאלון — אין כניסה.</strong> תלמיד שלא הגיע בזמן לא ייכנס.</div>

<h3>זכאות לבגרות ולתעודת מקצוע</h3>
<div class="kpi-grid">
<div class="kpi"><div class="kpi-num">70%</div><div class="kpi-label">זכאות לבגרות</div></div>
<div class="kpi"><div class="kpi-num">90%</div><div class="kpi-label">זכאות לתעודת מקצוע</div></div>
</div>
<div class="info-box"><strong>מרכז למידה פעיל</strong> בכל ימות השבוע — לתמיכה בלמידה משמעותית.</div>
</div>`},

{id:'ch23', num:23, section:'procedures', title:'יום הורים', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>', content:`<div class="ch-body">
<h3>הכנות</h3>
<ul>
<li>כל רכיבי ההערכה מוזנים לפני יום ההורים.</li>
<li>שיעורים ואירועים התנהגותיים מדווחים ב-SmartSchool.</li>
<li>מחנכים מפיקים דוח לכל תלמיד.</li>
<li>הזמנה שבועיים לפני, בכל אמצעי תקשורת.</li>
</ul>

<h3>ארגון המפגשים</h3>
<p>מינימום 10 דקות לפגישה. כל המורים נוכחים לאורך כל היום — אין יציאה מוקדמת.</p>
<div class="info-box">הורים גרושים — פגישות נפרדות לכל הורה. ההזמנה נשלחת לשניהם בנפרד.</div>

<h3>תיעוד</h3>
<p>כל מורה מתעד עיקרי שיחה. נושאים לטיפול מועברים ליועצת או למנהלת.</p>
<div class="warning-box">אין לשחרר ציונים או מידע רגיש בטלפון לפני יום ההורים. מידע נמסר פנים אל פנים בלבד.</div>
</div>`},

{id:'ch24', num:24, section:'procedures', title:'דיווח אירוע חריג', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>', content:`<div class="ch-body">
<h3>מהו אירוע חריג?</h3>
<p>אירוע חריג הוא כל אירוע שאינו שגרתי ועלול להשפיע על שלום התלמידים, הצוות או על תפקוד בית הספר — למשל: אלימות פיזית או מילולית, פגיעה רגשית, פגיעה בין תלמידים, אירוע ברשת, פגיעה עצמית, חשד להתעללות, אירוע ביטחוני.</p>

<h3>תהליך הדיווח — שלבים</h3>
<ol>
<li><strong>דיווח מיידי בעל-פה</strong> — לרכז המוגנות, יועצת ולמנהלת.</li>
<li><strong>מילוי טופס דיווח אירוע חריג</strong> — באחריות היועצת. במקרים דחופים — גם המחנך או המורה המקצועי.</li>
<li><strong>אישור המנהלת</strong> — לפני העברת הדיווח הלאה.</li>
<li><strong>בירור פנימי</strong> — איסוף עדויות, שיחות עם המעורבים.</li>
<li><strong>הודעה להורים</strong> — של כל התלמידים המעורבים.</li>
<li><strong>תיעוד</strong> — במשו"ב / SmartSchool.</li>
<li><strong>דיווח חיצוני</strong> — במקרים חמורים, דיווח למפקחת, משרד החינוך, רווחה, משטרה.</li>
</ol>

<h3>גורמים מעורבים</h3>
<table>
<tr><th>גורם</th><th>אחריות</th></tr>
<tr><td>היועצת</td><td>מילוי הטופס, בירור, תיעוד</td></tr>
<tr><td>המנהלת</td><td>אישור הדיווח, החלטות על המשך טיפול ודיווח חיצוני</td></tr>
<tr><td>רכז המוגנות</td><td>טיפול מידי באלימות וביטחון</td></tr>
<tr><td>מחנך הכיתה</td><td>הודעה להורים, מעקב יומיומי</td></tr>
<tr><td>רכזת מניעת נשירה</td><td>שילוב בתוכנית התערבות במידת הצורך</td></tr>
</table>
<div class="warning-box"><strong>חובת דיווח מיידי</strong> על כל אירוע אלימות — הקטן ביותר! ראו פרק "משמעת — נהלים בסיסיים".</div>
</div>`},

{id:'ch25', num:25, section:'procedures', title:'נוהל טיפולים', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>', content:`<div class="ch-body">
<h3>הצוות הטיפולי</h3>
<ul>
<li><strong>רכזת טיפול</strong> — מרכזת את כל הטיפולים בבית הספר, אחראית לשיבוץ ולתיאום.</li>
<li><strong>יועצת חינוכית</strong> — תמיכה רגשית, ליווי במשבר, ועדות.</li>
<li><strong>פסיכולוג בית הספר</strong> — אבחון, ייעוץ, התערבות.</li>
<li><strong>מטפלים חיצוניים</strong> — פסיכודרמה, אומנות, רגשי, התמכרויות.</li>
</ul>

<h3>שיבוץ תלמיד לטיפול — שלבים</h3>
<ol>
<li><strong>זיהוי צורך</strong> — מחנך / מורה מקצועי / יועצת / הורה.</li>
<li><strong>פנייה לרכזת טיפול</strong> — עם תיאור הקושי וההמלצה.</li>
<li><strong>שיחת אבחון</strong> — של רכזת הטיפול עם התלמיד.</li>
<li><strong>אישור הורים</strong> — בכתב, לפני תחילת הטיפול.</li>
<li><strong>שיבוץ למטפל</strong> — לפי סוג הטיפול וזמינות.</li>
<li><strong>תיאום עם המורה המקצועי</strong> — לעניין יציאה משיעורים (ראו פרק "כוחות עזר").</li>
</ol>

<h3>מעקב ודיווח</h3>
<ul>
<li>דיווחים תקופתיים של המטפל לרכזת הטיפול.</li>
<li>עדכון המחנך והיועצת לפי הצורך — תוך שמירה על חיסיון.</li>
<li>דוח שליש על מצב התלמיד.</li>
</ul>
<div class="info-box"><strong>חיסיון:</strong> מידע אישי על תלמידים ומשפחותיהם הוא חסוי. אין להעביר מידע למורים שאינם מעורבים ישירות בטיפול.</div>
</div>`},

{id:'ch26', num:26, section:'procedures', title:'קבלת תלמידים', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>', content:`<div class="ch-body">
<h3>תהליך הקבלה — שלבים</h3>
<ol>
<li><strong>רישום</strong> — פנייה ראשונית של הורים או רישום ממשרד החינוך.</li>
<li><strong>ראיון אישי</strong> — תלמיד והוריו עם היועצת והמנהלת.</li>
<li><strong>בדיקה לימודית והערכת רמה</strong> — לקראת שיבוץ למגמה ולכיתה.</li>
<li><strong>אישור מצבת</strong> — אישור משרד החינוך לקליטת התלמיד.</li>
<li><strong>שיבוץ למגמה</strong> — אוטוטרוניקה / מחשבים / עיצוב שיער — לאחר היכרות ושיחות עם רכזי המגמות.</li>
<li><strong>שיחת קליטה</strong> — עם המחנך לפני פתיחת שנה.</li>
</ol>

<h3>גורמים מעורבים</h3>
<table>
<tr><th>גורם</th><th>אחריות</th></tr>
<tr><td>המנהלת</td><td>אישור סופי, מצבת, החלטות חריגות</td></tr>
<tr><td>היועצת</td><td>ראיון אישי, אבחון רגשי-חברתי, מילוי תיק תלמיד</td></tr>
<tr><td>המנהלת הפדגוגית</td><td>הערכת רמה לימודית, שיבוץ לקבוצות</td></tr>
<tr><td>רכזי המגמות</td><td>היכרות עם המגמה, התאמה מקצועית</td></tr>
<tr><td>מחנך הכיתה</td><td>שיחת קליטה, ליווי בחודש הראשון</td></tr>
</table>

<h3>טפסים נדרשים</h3>
<ul>
<li>טופס רישום מלא + חתימת הורים</li>
<li>תעודות שנים קודמות</li>
<li>אבחונים — אם קיימים</li>
<li>אישור מצבת — ממשרד החינוך</li>
<li>טופס פרטים אישיים ומידע רפואי</li>
</ul>
<div class="info-box">חודש ראשון מהקליטה — תקופת ליווי צמודה של מחנך הכיתה, יועצת ורכזת מגמה. מטרת התקופה: היכרות, בניית קשר, איתור קשיים ראשוניים.</div>
</div>`},

{id:'ch27', num:27, section:'procedures', title:'הסעות', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M2 17.4V9.5C2 7.5 4 6 8 6h7c4 0 5 1.5 5 3.5v7.9c0 .9-.4 1.6-1 1.6H3c-.6 0-1-.7-1-1.6Z"/><circle cx="6" cy="18" r="1"/><circle cx="18" cy="18" r="1"/></svg>', content:`<div class="ch-body">
<h3>הסעות יומיות</h3>
<ul>
<li>מסלולי ההסעות מפורסמים בתחילת שנה — לפי שכונה.</li>
<li>רשימת תלמידים מוסעים מתעדכנת במזכירות.</li>
<li><strong>המורה המלמד שיעור אחרון אחראי להוציא את התלמידים לשער הסעות.</strong></li>
<li>שינויים בלוח הסעות — מועברים להורים ב-WhatsApp או SMS.</li>
</ul>

<h3>הסעות לטיולים ופעילויות חוץ בית-ספריות</h3>
<div class="warning-box">
<ul>
<li><strong>אישור הורים בכתב</strong> — אישור טלפוני <strong>לא מספיק</strong>.</li>
<li><strong>אישור ביטחוני</strong> — ממרכז שדה / מטבע.</li>
<li><strong>אישור הנהלה</strong> — שבוע מראש לפחות.</li>
<li><strong>תלמיד ללא טופס חתום — לא יוצא לפעילות.</strong></li>
</ul>
</div>

<h3>היערכות ליום היציאה</h3>
<ul>
<li>בדיקת האוטובוס לפני יציאה</li>
<li>רשימת תלמידים מועברת למזכירות</li>
<li>ערכת עזרה ראשונה</li>
<li>טלפוני הורים זמינים</li>
<li>חובת תלבושת מלאה</li>
<li><strong>ספירת תלמידים</strong> ביציאה ובחזרה</li>
</ul>
</div>`},

{id:'ch28', num:28, section:'procedures', title:'בנות שירות וכוחות עזר', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>', content:`<div class="ch-body">
<h3>שיבוץ בנות שירות</h3>
<div class="info-box">
<p>שיבוץ בנות שירות מתבצע על ידי <strong>המנהלת</strong>, לאחר אישור <strong>המנהלת הפדגוגית</strong>.</p>
<p>הבקשה לכוח עזר לכיתה — באמצעות פנייה למנהלת הפדגוגית. לאחר אישור — שיבוץ סופי על ידי המנהלת.</p>
</div>

<h3>תפקידים</h3>
<ul>
<li><strong>כוח עזר בכיתות</strong> — תמיכה בלמידה דיפרנציאלית, ליווי תלמידים בשעות פרטניות.</li>
<li><strong>ליווי תלמידים בסיכון</strong> — מענה אישי לתלמידים שנדרש להם.</li>
<li><strong>תורנויות</strong> — סיוע בחצר ובהפסקות.</li>
<li><strong>פעילויות חברתיות</strong> — סיוע בארגון אירועים וטקסים.</li>
<li><strong>שינשינים, סטודנטים, פו"ש</strong> — שיבוץ דומה לפי צורכי בית הספר.</li>
</ul>

<h3>שעות עבודה ודיווח</h3>
<ul>
<li>שעות העבודה — לפי תכנית המערכת.</li>
<li>דיווח שעות — יומן שבועי.</li>
<li><strong>היעדרויות</strong> — דיווח מיידי למנהלת הפדגוגית.</li>
<li>שיחת הערכה תקופתית.</li>
</ul>

<h3>חובות המורה כלפי כוח העזר</h3>
<ul>
<li>תיאום מטרות לכל שיעור</li>
<li>העברת חומר הלימוד שהתלמיד זקוק לו</li>
<li>גיבוי בכיתה — בת השירות אינה אחראית להוראה</li>
</ul>
</div>`},

{id:'ch29', num:29, section:'procedures', title:'דוחות חודשיים', icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>', content:`<div class="ch-body">
<h3>סוגי דוחות</h3>

<h4>1. דוח מחנך כיתה</h4>
<ul>
<li>סיכום פעילות חודשית של הכיתה</li>
<li>מצב נוכחות והיעדרויות</li>
<li>אירועים חינוכיים / משמעתיים</li>
<li>תלמידים בסיכון או בקושי</li>
<li>תוכניות התערבות שמתבצעות</li>
</ul>

<h4>2. דוח יועצת</h4>
<ul>
<li>תלמידים בטיפול / בליווי</li>
<li>אירועים חריגים שטופלו</li>
<li>פעילויות מניעה וסדנאות</li>
<li>שיחות עם הורים</li>
<li>שיתוף פעולה עם גורמי חוץ (רווחה, פסיכולוג, מטפלים)</li>
</ul>

<h4>3. דוח ביקור בית</h4>
<ul>
<li>תאריך וגורם מבקר (מחנך / יועצת / רכזת מניעת נשירה)</li>
<li>מטרת הביקור — היעדרויות, התערבות במשבר, היכרות</li>
<li>סיכום השיחה והמלצות להמשך</li>
</ul>

<h3>לוח זמנים והגשה</h3>
<table>
<tr><th>שלב</th><th>מועד</th></tr>
<tr><td>איסוף נתונים</td><td>במהלך החודש</td></tr>
<tr><td>כתיבת הדוח</td><td>בסיום החודש</td></tr>
<tr><td>הגשה למנהלת ולמנהלת פדגוגית</td><td>עד ה-5 לחודש העוקב</td></tr>
</table>

</div>`},

(function(){
  const toc=document.getElementById('handbookTOC');
  let tocHtml='<div class="toc-title">תוכן עניינים</div>';
  handbookSections.forEach(sec=>{
    const items=handbookChapters.filter(ch=>ch.section===sec.id);
    if(!items.length)return;
    tocHtml+=`<div class="toc-section-label">${sec.label}</div><div class="toc-grid">${
      items.map(ch=>`<div class="toc-item" onclick="openChapter('${ch.id}')"><span class="toc-num">${ch.num}</span><span>${ch.title}</span></div>`).join('')
    }</div>`;
  });
  toc.innerHTML=tocHtml;

  const container=document.getElementById('handbookChapters');
  let html='';
  handbookSections.forEach(sec=>{
    const items=handbookChapters.filter(ch=>ch.section===sec.id);
    if(!items.length)return;
    html+=`<div class="section-header">${sec.label}</div>`;
    html+=items.map(ch=>`
      <div class="hb-chapter" id="hbc-${ch.id}" data-section="${ch.section}">
        <div class="hb-chapter-header" onclick="toggleChapter('${ch.id}')">
          <div class="hb-chapter-num">${ch.num}</div>
          <div class="hb-chapter-icon">${ch.icon}</div>
          <div class="hb-chapter-title">${ch.title}</div>
          <div class="hb-chapter-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
        </div>
        <div class="hb-chapter-body" id="hbb-${ch.id}">${ch.content}</div>
      </div>
    `).join('');
  });
  container.innerHTML=html;
})();

function toggleChapter(id){
  const header=document.querySelector(`#hbc-${id} .hb-chapter-header`);
  const body=document.getElementById('hbb-'+id);
  header.classList.toggle('open');
  body.classList.toggle('open');
}

function openChapter(id){
  const body=document.getElementById('hbb-'+id);
  const header=document.querySelector(`#hbc-${id} .hb-chapter-header`);
  if(!body.classList.contains('open')){
    header.classList.add('open');
    body.classList.add('open');
  }
  document.getElementById('hbc-'+id).scrollIntoView({behavior:'smooth',block:'start'});
}

function expandAllChapters(){
  handbookChapters.forEach(ch=>{
    document.querySelector(`#hbc-${ch.id} .hb-chapter-header`).classList.add('open');
    document.getElementById('hbb-'+ch.id).classList.add('open');
  });
}

function collapseAllChapters(){
  handbookChapters.forEach(ch=>{
    document.querySelector(`#hbc-${ch.id} .hb-chapter-header`).classList.remove('open');
    document.getElementById('hbb-'+ch.id).classList.remove('open');
  });
}

function filterHandbook(){
  const q=document.getElementById('handbookSearch').value.trim().toLowerCase();
  const empty=document.getElementById('emptyState');
  let visible=0;
  handbookChapters.forEach(ch=>{
    const el=document.getElementById('hbc-'+ch.id);
    const body=document.getElementById('hbb-'+ch.id);
    const header=document.querySelector(`#hbc-${ch.id} .hb-chapter-header`);
    if(!q){el.style.display='';visible++;return;}
    const text=(ch.title+' '+body.textContent).toLowerCase();
    if(text.includes(q)){
      el.style.display='';
      header.classList.add('open');
      body.classList.add('open');
      visible++;
    }else{
      el.style.display='none';
    }
  });
  empty.classList.toggle('show',visible===0 && q.length>0);
}

function printHandbook(){
  expandAllChapters();
  setTimeout(()=>window.print(),300);
}

if(location.hash){
  const id=location.hash.replace('#','');
  if(handbookChapters.some(ch=>ch.id===id)){
    setTimeout(()=>openChapter(id),100);
  }
}
