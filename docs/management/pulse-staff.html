<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>פולס צוות — חזרה לשגרה | אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
html:not(.results-mode) body,html:not(.results-mode){overflow:hidden}
h1,h2,h3,h4,h5,h6{font-family:'Playpen Sans Hebrew','Heebo',sans-serif;font-weight:700}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.04) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.04) 0%,transparent 70%),
    radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.03) 0%,transparent 70%);
  pointer-events:none;z-index:0}
body{
  font-family:Heebo,sans-serif;color:#fff;
  display:flex;align-items:center;justify-content:center;
  background:#1a1a2e;-webkit-user-select:none;user-select:none;
}

/* Frame */
.frame{
  width:100%;max-width:420px;height:100vh;max-height:780px;
  overflow:hidden;position:relative;
}
@media(min-width:500px){
  .frame{border-radius:36px;height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.4)}
}

/* Progress bars */
.bars{
  position:absolute;top:8px;left:8px;right:8px;z-index:20;
  display:flex;gap:3px;padding:0 4px;
}
.bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.bar .fill{height:100%;width:0;background:#fff;border-radius:3px;transition:width .3s}
.bar.done .fill{width:100%}
.bar.now .fill{width:100%;transition:none}

/* Screen */
.scr{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;padding:48px 24px 48px;
  text-align:center;opacity:0;pointer-events:none;
  transition:opacity .4s,transform .4s;transform:translateX(-30px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.scr>*:first-child{margin-top:auto}
.scr>*:last-child{margin-bottom:auto}
.scr.on{opacity:1;pointer-events:auto;transform:translateX(0)}

/* Intro */
.intro-icon{
  width:72px;height:72px;border-radius:24px;display:flex;align-items:center;justify-content:center;
  margin-bottom:20px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.15);
}
h1{font-size:1.5rem;font-weight:900;margin-bottom:8px}
.sub{font-size:.88rem;opacity:.6;line-height:1.5;margin-bottom:28px}
.pill{
  padding:14px 48px;border:none;border-radius:50px;font-family:Heebo;
  font-size:1rem;font-weight:700;color:#fff;cursor:pointer;
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,.2);transition:all .2s;
}
.pill:active{transform:scale(.96)}
.tag{font-size:.7rem;opacity:.3;margin-top:14px}

/* Slider questions */
.q-num{font-size:.75rem;font-weight:600;opacity:.4;margin-bottom:10px;letter-spacing:1px}
.q-text{font-size:1.2rem;font-weight:700;line-height:1.45;margin-bottom:32px;max-width:320px}
.slider-wrap{width:100%;max-width:300px;position:relative;padding:0 8px}
.slider-face{
  font-size:3.5rem;margin-bottom:16px;transition:transform .15s;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.2));
}
.slider-track{
  width:100%;height:8px;border-radius:8px;position:relative;
  background:linear-gradient(to left,rgba(126,207,160,.5),rgba(240,216,122,.4),rgba(240,144,144,.5));
}
.slider-input{
  -webkit-appearance:none;appearance:none;width:100%;height:8px;
  background:transparent;position:absolute;top:0;left:0;margin:0;cursor:pointer;
}
.slider-input::-webkit-slider-thumb{
  -webkit-appearance:none;width:32px;height:32px;border-radius:50%;
  background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:grab;
  border:3px solid rgba(255,255,255,.8);opacity:.2;transition:opacity .3s;
}
.slider-input.touched::-webkit-slider-thumb{opacity:1}
.slider-input::-moz-range-thumb{
  width:32px;height:32px;border-radius:50%;
  background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:grab;
  border:3px solid rgba(255,255,255,.8);opacity:.2;transition:opacity .3s;
}
.slider-input.touched::-moz-range-thumb{opacity:1}
.slider-labels{display:flex;justify-content:space-between;margin-top:10px}
.slider-labels span{font-size:.7rem;opacity:.4;font-weight:500}
.slider-val{
  font-size:1rem;font-weight:700;margin-top:14px;opacity:0;
  transition:opacity .3s;
}
.slider-val.show{opacity:.8}
.btn-next{
  margin-top:20px;padding:10px 36px;border:none;border-radius:50px;
  font-family:Heebo;font-size:.88rem;font-weight:700;color:#fff;
  cursor:pointer;transition:all .2s;opacity:0;pointer-events:none;
  background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.2);
}
.btn-next.show{opacity:1;pointer-events:auto}
.btn-next:active{transform:scale(.96)}

/* Multi-choice */
.choices{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.choice-btn{
  padding:14px 18px;border:2px solid rgba(255,255,255,.12);border-radius:16px;
  background:rgba(255,255,255,.04);color:#fff;font-family:Heebo;
  font-size:.9rem;font-weight:600;cursor:pointer;transition:all .25s;
  text-align:right;display:flex;align-items:center;gap:10px;
}
.choice-btn:active{transform:scale(.97)}
.choice-btn.sel{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.15)}
.choice-btn .check{
  width:22px;height:22px;border-radius:6px;border:2px solid rgba(255,255,255,.25);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.choice-btn.sel .check{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.5)}
.choice-btn.sel .check::after{content:'';width:10px;height:10px;border-radius:3px;background:#fff}

/* Dimension select */
.dim-choices{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.dim-btn{
  padding:16px 18px;border:2px solid rgba(255,255,255,.1);border-radius:16px;
  background:rgba(255,255,255,.04);color:#fff;font-family:Heebo;
  font-size:.92rem;font-weight:700;cursor:pointer;transition:all .3s;
  display:flex;align-items:center;gap:12px;
}
.dim-btn:active{transform:scale(.97)}
.dim-btn.sel{transform:scale(1.02)}
.dim-icon-wrap{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.dim-icon-wrap svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Free text */
.free-text{
  width:100%;max-width:320px;min-height:100px;padding:16px;
  border:2px solid rgba(255,255,255,.15);border-radius:16px;
  background:rgba(255,255,255,.06);color:#fff;font-family:Heebo;
  font-size:.9rem;resize:none;line-height:1.6;direction:rtl;
}
.free-text::placeholder{color:rgba(255,255,255,.3)}
.free-text:focus{outline:none;border-color:rgba(255,255,255,.35)}

/* Word input */
.word-input{
  width:100%;max-width:280px;padding:16px;text-align:center;
  border:2px solid rgba(255,255,255,.15);border-radius:50px;
  background:rgba(255,255,255,.06);color:#fff;font-family:'Playpen Sans Hebrew',Heebo;
  font-size:1.3rem;font-weight:700;direction:rtl;
}
.word-input::placeholder{color:rgba(255,255,255,.2);font-size:1rem}
.word-input:focus{outline:none;border-color:rgba(255,255,255,.35)}

/* Done */
.done-icon{
  width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin-bottom:20px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);
  animation:pop .5s ease;
}
@keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.done-msg{font-size:.9rem;opacity:.6;line-height:1.6;max-width:300px;margin-top:12px}

/* Confetti */
.confetti-box{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.cft{position:absolute;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{
  0%{transform:translateY(-20px) rotate(0);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* Blobs */
.blob{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0}

/* Name input */
.name-input{
  width:100%;max-width:280px;padding:14px 20px;text-align:center;
  border:2px solid rgba(255,255,255,.15);border-radius:50px;
  background:rgba(255,255,255,.06);color:#fff;font-family:Heebo;
  font-size:1.1rem;font-weight:600;direction:rtl;margin-bottom:16px;
}
.name-input::placeholder{color:rgba(255,255,255,.25)}
.name-input:focus{outline:none;border-color:rgba(255,255,255,.35)}

/* Anonymous toggle */
.anon-toggle{
  display:flex;align-items:center;gap:8px;font-size:.8rem;opacity:.5;
  margin-bottom:20px;cursor:pointer;
}
.anon-toggle input{accent-color:#3AACA0}

/* ==================== RESULTS DASHBOARD ==================== */
.results-mode body,.results-mode{background:#fff!important;color:#2C2622}
.dashboard{
  display:none;min-height:100vh;background:#fff;color:#2C2622;
  font-family:Heebo,sans-serif;padding:24px;direction:rtl;
  overflow-y:auto;
}
.dashboard.active{display:block}
.dashboard h1{font-family:'Playpen Sans Hebrew',Heebo;font-size:1.6rem;font-weight:800;color:#2C2622;margin-bottom:4px}
.dashboard .dash-sub{color:#6E6258;font-size:.9rem;margin-bottom:24px}
.dash-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:28px}
.stat-card{
  background:#FAFBFC;border:1px solid #EDE6D8;border-radius:16px;padding:20px;text-align:center;
}
.stat-card .stat-val{font-family:'Playpen Sans Hebrew';font-size:2rem;font-weight:800;color:#3AACA0}
.stat-card .stat-label{font-size:.78rem;color:#6E6258;margin-top:4px}
.dash-section{margin-bottom:28px}
.dash-section h2{font-family:'Playpen Sans Hebrew';font-size:1.1rem;font-weight:700;margin-bottom:14px;color:#2C2622;display:flex;align-items:center;gap:8px}
.dash-section h2 svg{width:20px;height:20px;color:#3AACA0}
/* Bar charts */
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar-label{width:140px;font-size:.82rem;font-weight:600;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:28px;background:#F5F2ED;border-radius:10px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:10px;transition:width .8s ease;min-width:fit-content}
.bar-val{font-size:.78rem;font-weight:700;min-width:36px;text-align:center;flex-shrink:0}
.bar-avg{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:.78rem;font-weight:700;color:#6E6258}
@media(max-width:480px){
  .bar-row{flex-wrap:wrap;gap:4px;margin-bottom:14px}
  .bar-label{width:100%;font-size:.8rem;margin-bottom:2px}
  .bar-track{height:24px;min-width:0}
  .dash-stats{grid-template-columns:repeat(2,1fr)}
  .dim-bars{height:120px}
  .dim-bar-wrap{max-width:60px}
  .refresh-bar{flex-direction:column;gap:8px;text-align:center}
  .refresh-bar .title-area{justify-content:center}
  .qr-section{padding:16px}
}
/* Challenge / support tags */
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px}
.tag-item{
  padding:8px 16px;border-radius:20px;font-size:.82rem;font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.tag-count{
  width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:700;background:rgba(255,255,255,.5);
}
/* Dimension chart */
.dim-bars{display:flex;gap:8px;align-items:flex-end;height:160px;justify-content:center;margin:20px 0}
.dim-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;max-width:80px}
.dim-bar{width:100%;border-radius:10px 10px 4px 4px;transition:height .8s ease;min-height:4px;position:relative}
.dim-bar-count{font-size:.8rem;font-weight:700;color:#fff;position:absolute;top:8px;left:50%;transform:translateX(-50%)}
.dim-bar-name{font-size:.72rem;font-weight:600;color:#6E6258;text-align:center;line-height:1.3}
/* Free text responses */
.free-responses{display:flex;flex-direction:column;gap:8px}
.free-item{
  padding:14px 18px;background:#FAFBFC;border:1px solid #EDE6D8;border-radius:14px;
  font-size:.85rem;line-height:1.6;color:#2C2622;
}
/* Refresh */
.refresh-bar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid #EDE6D8;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;
  margin:-24px -24px 20px;
}
.refresh-bar .title-area{display:flex;align-items:center;gap:12px}
.refresh-bar .title-area h1{margin-bottom:0;font-size:1.2rem}
.refresh-btn{
  padding:8px 18px;border:1.5px solid #EDE6D8;border-radius:12px;
  background:transparent;font-family:Heebo;font-size:.82rem;font-weight:600;
  cursor:pointer;color:#3AACA0;transition:all .2s;display:flex;align-items:center;gap:6px;
}
.refresh-btn:hover{border-color:#3AACA0;background:rgba(58,172,160,.06)}
.refresh-btn svg{width:16px;height:16px}
.resp-count-badge{
  background:rgba(58,172,160,.1);color:#1B7A6E;padding:4px 12px;border-radius:20px;
  font-size:.78rem;font-weight:600;
}
.auto-refresh-note{font-size:.7rem;color:#8C7E72;margin-top:2px}
/* QR section */
.qr-section{
  background:linear-gradient(135deg,rgba(58,172,160,.06),rgba(142,126,212,.06));
  border:1px solid #EDE6D8;border-radius:16px;padding:24px;text-align:center;margin-bottom:28px;
}
.qr-section h3{font-family:'Playpen Sans Hebrew';font-size:1rem;margin-bottom:8px}
.qr-url{
  font-size:.82rem;color:#3AACA0;font-weight:600;word-break:break-all;
  background:#fff;padding:10px 16px;border-radius:10px;border:1px solid #EDE6D8;
  display:inline-block;margin-top:8px;cursor:pointer;
}
.qr-url:hover{background:#F5F2ED}
.copied-msg{font-size:.75rem;color:#4CAF50;margin-top:6px;opacity:0;transition:opacity .3s}
.copied-msg.show{opacity:1}
</style>

</head>
<body>

<div class="frame" id="frame">
  <div class="bars" id="bars"></div>
  <div class="blob" id="b1" style="width:200px;height:200px;top:-40px;right:-60px;opacity:.3;background:#3AACA0"></div>
  <div class="blob" id="b2" style="width:160px;height:160px;bottom:10%;left:-40px;opacity:.2;background:#8E7ED4"></div>
  <div id="screens"></div>
</div>

<!-- Results Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="refresh-bar">
    <div class="title-area">
      <h1>פולס צוות — תוצאות</h1>
      <span class="resp-count-badge" id="respCount">0 תגובות</span>
    </div>
    <div style="text-align:left">
      <button class="refresh-btn" onclick="loadResults()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        רענון
      </button>
      <div class="auto-refresh-note">מתרענן כל 30 שניות</div>
    </div>
  </div>

  <div class="qr-section">
    <h3>שתפו את הקישור לצוות</h3>
    <div>הצוות ממלא בטלפון, התוצאות מתעדכנות כאן בזמן אמת</div>
    <div class="qr-url" id="pulseUrl" onclick="copyUrl()"></div>
    <div class="copied-msg" id="copiedMsg">הקישור הועתק!</div>
  </div>

  <div class="dash-stats" id="dashStats"></div>

  <div class="dash-section">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
      ציוני סקאלה — ממוצעים
    </h2>
    <div id="sliderBars"></div>
  </div>

  <div class="dash-section">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      מה הכי מאתגר
    </h2>
    <div class="tag-cloud" id="challengeTags"></div>
  </div>

  <div class="dash-section">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
      סוג תמיכה משמעותי
    </h2>
    <div class="tag-cloud" id="supportTags"></div>
  </div>

  <div class="dash-section">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      ממד לחיזוק
    </h2>
    <div class="dim-bars" id="dimBars"></div>
  </div>

  <div class="dash-section">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      מה יעזור לצוות — תשובות פתוחות
    </h2>
    <div class="free-responses" id="freeResponses"></div>
  </div>
</div>

<script>
// ============================================
// CONFIG
// ============================================

const API = 'https://script.google.com/macros/s/AKfycbz2QOG5BU0ET12IE5hUWMrhlqWDupWWeuiO2l5AoqJqRi8tfoj5mGPXMqPUcZw_pamH/exec';
const SHEET_NAME = 'פולס צוות';

const FACES = ['\u{1F625}','\u{1F615}','\u{1F610}','\u{1F642}','\u{1F929}'];
const FACE_LABELS = ['\u05DB\u05DC\u05DC \u05DC\u05D0','\u05DE\u05E2\u05D8','\u05DB\u05DB\u05D4 \u05DB\u05DB\u05D4','\u05DB\u05DF','\u05DC\u05D2\u05DE\u05E8\u05D9!'];

const DIMS = [
  { id:'belong', name:'שייכות', color:'#E06090', icon:'<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>' },
  { id:'respect', name:'כבוד', color:'#5B9BD5', icon:'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>' },
  { id:'motiv', name:'מוטיבציה פנימית', color:'#E8A838', icon:'<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>' },
  { id:'auto', name:'אוטונומיה', color:'#7AB648', icon:'<path d="M22 11.08V12a10 10 0 11-5.93-9.14M22 4L12 14.01l-3-3"/>' },
  { id:'capable', name:'מסוגלות עצמית', color:'#8B6BC0', icon:'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>' }
];

// ============================================
// QUESTIONS
// ============================================

const QUESTIONS = [
  { id:'routine', type:'slider', text:'עד כמה את/ה מרגיש/ה חזרה לשגרה בעבודה?', low:'בכלל לא', high:'לגמרי' },
  { id:'emotional', type:'slider', text:'איך היית מתאר/ת את מצבך הרגשי בתקופה זו?', low:'כבד', high:'יציב ושלם' },
  { id:'belonging', type:'slider', text:'עד כמה את/ה מרגיש/ה שייכות וחיבור לצוות?', low:'בכלל לא', high:'מאוד' },
  { id:'support', type:'slider', text:'עד כמה הצוות סביבך מהווה עבורך מקור תמיכה?', low:'בכלל לא', high:'מאוד' },
  { id:'challenge', type:'multi', text:'מה הכי מאתגר אותך כרגע בעבודה?',
    options:['עומס','חוסר ודאות','מצב התלמידים','קושי רגשי אישי','חזרה לשגרה','אחר'] },
  { id:'support_type', type:'multi', text:'איזה סוג תמיכה הכי משמעותי עבורך כרגע?',
    options:['שיחה אישית','תמיכה מקצועית','גמישות בלו"ז','פעילות צוותית','אני בסדר'] },
  { id:'access', type:'slider', text:'עד כמה את/ה מרגיש/ה שיש למי לפנות בבית הספר בעת קושי?', low:'אין למי', high:'תמיד יש' },
  { id:'team_help', type:'free', text:'מה לדעתך הכי יעזור לצוות לחזור לתפקוד מיטבי?' },
  { id:'dimension', type:'dims', text:'מתוך חמשת הממדים — איזה ממד הכי חשוב לחזק עכשיו?' }
];

// ============================================
// STATE
// ============================================

let current = 0; // 0 = intro, 1..9 = questions, 10 = done
const totalScreens = QUESTIONS.length + 2; // intro + questions + done
const answers = {};
let userName = '';
let isAnonymous = false;

// ============================================
// BUILD SCREENS
// ============================================

function init() {
  const barsEl = document.getElementById('bars');
  for (let i = 0; i < totalScreens; i++) {
    barsEl.innerHTML += `<div class="bar" data-i="${i}"><div class="fill"></div></div>`;
  }

  const container = document.getElementById('screens');

  // Intro screen
  container.innerHTML += `
    <div class="scr on" data-s="0" style="background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#1a1a2e 100%)">
      <div class="intro-icon">
        <svg width="32" height="32" fill="none" stroke="#3AACA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
        </svg>
      </div>
      <h1>פולס צוות</h1>
      <div class="sub">חזרה לשגרה — בודקים את הדופק<br>9 שאלות קצרות, פחות מ-2 דקות</div>
      <input class="name-input" id="nameInput" placeholder="השם שלי" autocomplete="off"/>
      <label class="anon-toggle">
        <input type="checkbox" id="anonCheck" onchange="toggleAnon(this)">
        אני מעדיף/ה להישאר אנונימי/ת
      </label>
      <button class="pill" onclick="startPulse()">יאללה, מתחילים</button>
      <div class="tag">אורט בית הערבה תשפ"ז</div>
    </div>
  `;

  // Question screens
  QUESTIONS.forEach((q, i) => {
    const sIdx = i + 1;
    const bg = getScreenBg(i);
    let content = '';

    if (q.type === 'slider') {
      content = `
        <div class="q-num">שאלה ${i + 1} מתוך ${QUESTIONS.length}</div>
        <div class="q-text">${q.text}</div>
        <div class="slider-wrap">
          <div class="slider-face" id="face_${q.id}">${FACES[2]}</div>
          <div class="slider-track">
            <input type="range" class="slider-input" id="sl_${q.id}" min="1" max="5" value="3" step="1"
              oninput="onSlider('${q.id}',this)" ontouchstart="touchSlider('${q.id}',this)" onmousedown="touchSlider('${q.id}',this)">
          </div>
          <div class="slider-labels"><span>${q.low}</span><span>${q.high}</span></div>
          <div class="slider-val" id="val_${q.id}"></div>
        </div>
        <button class="btn-next" id="btn_${q.id}" onclick="next()">המשך</button>
      `;
    } else if (q.type === 'multi') {
      const opts = q.options.map(o => `
        <button class="choice-btn" onclick="toggleChoice('${q.id}',this,'${o}')">
          <span class="check"></span>
          <span>${o}</span>
        </button>
      `).join('');
      content = `
        <div class="q-num">שאלה ${i + 1} מתוך ${QUESTIONS.length}</div>
        <div class="q-text">${q.text}</div>
        <div class="choices" id="choices_${q.id}">${opts}</div>
        <button class="btn-next show" id="btn_${q.id}" onclick="next()" style="margin-top:16px">המשך</button>
      `;
    } else if (q.type === 'free') {
      content = `
        <div class="q-num">שאלה ${i + 1} מתוך ${QUESTIONS.length}</div>
        <div class="q-text">${q.text}</div>
        <textarea class="free-text" id="txt_${q.id}" placeholder="כתוב/י כאן..." oninput="onFreeText('${q.id}',this)"></textarea>
        <button class="btn-next show" id="btn_${q.id}" onclick="next()" style="margin-top:16px">המשך</button>
      `;
    } else if (q.type === 'dims') {
      const dims = DIMS.map(d => `
        <button class="dim-btn" data-dim="${d.id}" onclick="selectDim('${q.id}','${d.id}','${d.name}',this)" style="border-color:${d.color}22">
          <div class="dim-icon-wrap" style="background:${d.color}22;color:${d.color}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d.icon}</svg>
          </div>
          <span>${d.name}</span>
        </button>
      `).join('');
      content = `
        <div class="q-num">שאלה ${i + 1} מתוך ${QUESTIONS.length}</div>
        <div class="q-text">${q.text}</div>
        <div class="dim-choices" id="dims_${q.id}">${dims}</div>
      `;
    }

    container.innerHTML += `
      <div class="scr" data-s="${sIdx}" style="background:${bg}">
        ${content}
      </div>
    `;
  });

  // Done screen
  container.innerHTML += `
    <div class="scr" data-s="${totalScreens - 1}" style="background:linear-gradient(135deg,#0f3443 0%,#34e89e22 100%)">
      <div class="confetti-box" id="confetti"></div>
      <div class="done-icon">
        <svg width="36" height="36" fill="none" stroke="#3AACA0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 11-5.93-9.14M22 4L12 14.01l-3-3"/>
        </svg>
      </div>
      <h1>תודה רבה!</h1>
      <div class="done-msg">התשובות שלך חשובות לנו.<br>ביחד נחזור לשגרה — צעד אחר צעד.</div>
    </div>
  `;

  updateBars();
}

function getScreenBg(i) {
  const bgs = [
    'linear-gradient(135deg,#1a1a2e,#16213e)',
    'linear-gradient(135deg,#1a1a2e,#1e2240)',
    'linear-gradient(135deg,#16213e,#1a1a2e)',
    'linear-gradient(135deg,#1e2240,#16213e)',
    'linear-gradient(135deg,#1a1a2e,#1a2030)',
    'linear-gradient(135deg,#16213e,#1e2240)',
    'linear-gradient(135deg,#1a2030,#1a1a2e)',
    'linear-gradient(135deg,#1e2240,#1a2030)',
    'linear-gradient(135deg,#1a1a2e,#16213e)'
  ];
  return bgs[i % bgs.length];
}

// ============================================
// NAVIGATION
// ============================================

function toggleAnon(cb) {
  isAnonymous = cb.checked;
  document.getElementById('nameInput').style.opacity = cb.checked ? '.3' : '1';
  document.getElementById('nameInput').disabled = cb.checked;
}

function startPulse() {
  userName = isAnonymous ? 'אנונימי/ת' : (document.getElementById('nameInput').value.trim() || 'אנונימי/ת');
  next();
}

function next() {
  if (current >= totalScreens - 1) return;
  const prev = document.querySelector(`.scr[data-s="${current}"]`);
  if (prev) { prev.classList.remove('on'); prev.style.transform = 'translateX(30px)'; }
  current++;
  const cur = document.querySelector(`.scr[data-s="${current}"]`);
  if (cur) cur.classList.add('on');
  updateBars();

  // If done screen
  if (current === totalScreens - 1) {
    saveToSheet();
    launchConfetti();
  }
}

function updateBars() {
  document.querySelectorAll('.bar').forEach((b, i) => {
    b.classList.remove('done', 'now');
    if (i < current) b.classList.add('done');
    if (i === current) b.classList.add('now');
    const fill = b.querySelector('.fill');
    fill.style.width = i <= current ? '100%' : '0';
  });
}

// ============================================
// HANDLERS
// ============================================

function touchSlider(id, el) {
  el.classList.add('touched');
  document.getElementById('btn_' + id).classList.add('show');
  onSlider(id, el);
}

function onSlider(id, el) {
  const v = parseInt(el.value);
  answers[id] = v;
  document.getElementById('face_' + id).textContent = FACES[v - 1];
  document.getElementById('face_' + id).style.transform = 'scale(1.1)';
  setTimeout(() => document.getElementById('face_' + id).style.transform = '', 150);
  const valEl = document.getElementById('val_' + id);
  valEl.textContent = FACE_LABELS[v - 1];
  valEl.classList.add('show');
}

function toggleChoice(id, btn, val) {
  btn.classList.toggle('sel');
  if (!answers[id]) answers[id] = [];
  const idx = answers[id].indexOf(val);
  if (idx >= 0) answers[id].splice(idx, 1);
  else answers[id].push(val);
}

function onFreeText(id, el) {
  answers[id] = el.value.trim();
}

function selectDim(id, dimId, dimName, btn) {
  document.querySelectorAll(`#dims_${id} .dim-btn`).forEach(b => {
    b.classList.remove('sel');
    b.style.borderColor = 'rgba(255,255,255,.1)';
    b.style.background = 'rgba(255,255,255,.04)';
  });
  btn.classList.add('sel');
  const dim = DIMS.find(d => d.id === dimId);
  btn.style.borderColor = dim.color;
  btn.style.background = dim.color + '22';
  answers[id] = dimName;
  setTimeout(() => next(), 400);
}

// ============================================
// SAVE
// ============================================

function saveToSheet() {
  const fields = {
    'שם': userName,
    'חזרה לשגרה': answers.routine || '',
    'מצב רגשי': answers.emotional || '',
    'שייכות וחיבור': answers.belonging || '',
    'תמיכת צוות': answers.support || '',
    'אתגר מרכזי': Array.isArray(answers.challenge) ? answers.challenge.join(', ') : '',
    'סוג תמיכה': Array.isArray(answers.support_type) ? answers.support_type.join(', ') : '',
    'יש למי לפנות': answers.access || '',
    'מה יעזור לצוות': answers.team_help || '',
    'ממד לחיזוק': answers.dimension || ''
  };

  fetch(API, {
    method: 'POST',
    body: JSON.stringify({ action: 'saveForm', sheet: SHEET_NAME, fields: fields })
  }).catch(err => console.log('Save error:', err));
}

// ============================================
// CONFETTI
// ============================================

function launchConfetti() {
  const box = document.getElementById('confetti');
  const colors = ['#E06090','#5B9BD5','#E8A838','#8B6BC0','#7AB648','#3AACA0','#fff'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'cft';
    c.style.cssText = `
      left:${Math.random()*100}%;top:${-10-Math.random()*20}px;
      width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${1.5+Math.random()*2}s;
      animation-delay:${Math.random()*.5}s;
    `;
    box.appendChild(c);
  }
}

// ============================================
// RESULTS DASHBOARD
// ============================================

const SLIDER_FIELDS = [
  { key:'חזרה לשגרה', label:'חזרה לשגרה', color:'#3AACA0' },
  { key:'מצב רגשי', label:'מצב רגשי', color:'#8E7ED4' },
  { key:'שייכות וחיבור', label:'שייכות וחיבור', color:'#E06090' },
  { key:'תמיכת צוות', label:'תמיכת צוות', color:'#5B9BD5' },
  { key:'יש למי לפנות', label:'יש למי לפנות', color:'#7AB648' }
];

const DIM_COLORS = {
  'שייכות':'#E06090','כבוד':'#5B9BD5','מוטיבציה פנימית':'#E8A838',
  'אוטונומיה':'#7AB648','מסוגלות עצמית':'#8B6BC0'
};

function isResultsMode() {
  return location.search.includes('results') || location.hash === '#results';
}

function initDashboard() {
  document.documentElement.classList.add('results-mode');
  document.getElementById('frame').style.display = 'none';
  document.getElementById('dashboard').classList.add('active');
  document.body.style.background = '#fff';
  document.body.style.color = '#2C2622';
  document.body.style.display = 'block';
  document.body.style.height = 'auto';
  document.body.style.overflow = 'auto';
  document.documentElement.style.overflow = 'auto';

  // Set URL for sharing
  const baseUrl = location.href.split('?')[0].split('#')[0];
  document.getElementById('pulseUrl').textContent = baseUrl;

  loadResults();
  setInterval(loadResults, 30000);
}

function copyUrl() {
  const url = location.href.split('?')[0].split('#')[0];
  navigator.clipboard.writeText(url).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2000);
  });
}

function loadResults() {
  const cb = 'pulseResults_' + Date.now();
  window[cb] = function(data) {
    delete window[cb];
    const script = document.getElementById('resultsScript');
    if (script) script.remove();
    if (data.result === 'success') renderResults(data.rows || []);
  };
  const oldScript = document.getElementById('resultsScript');
  if (oldScript) oldScript.remove();
  const s = document.createElement('script');
  s.id = 'resultsScript';
  s.src = API + '?callback=' + cb + '&action=getForm&sheet=' + encodeURIComponent(SHEET_NAME);
  document.head.appendChild(s);
}

function renderResults(rows) {
  const n = rows.length;
  document.getElementById('respCount').textContent = n + ' תגובות';

  // Stats cards
  const avgRoutine = calcAvg(rows, 'חזרה לשגרה');
  const avgEmotional = calcAvg(rows, 'מצב רגשי');
  const avgBelonging = calcAvg(rows, 'שייכות וחיבור');
  const overallAvg = ((avgRoutine + avgEmotional + avgBelonging) / 3).toFixed(1);

  document.getElementById('dashStats').innerHTML = `
    <div class="stat-card">
      <div class="stat-val">${n}</div>
      <div class="stat-label">משיבים</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:#8E7ED4">${overallAvg}</div>
      <div class="stat-label">ממוצע כללי</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:${avgRoutine >= 3.5 ? '#4CAF50' : avgRoutine >= 2.5 ? '#E8A838' : '#D45C6E'}">${avgRoutine.toFixed(1)}</div>
      <div class="stat-label">חזרה לשגרה</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:${avgEmotional >= 3.5 ? '#4CAF50' : avgEmotional >= 2.5 ? '#E8A838' : '#D45C6E'}">${avgEmotional.toFixed(1)}</div>
      <div class="stat-label">מצב רגשי</div>
    </div>
  `;

  // Slider bars
  let barsHtml = '';
  SLIDER_FIELDS.forEach(f => {
    const avg = calcAvg(rows, f.key);
    const pct = (avg / 5) * 100;
    barsHtml += `
      <div class="bar-row">
        <div class="bar-label">${f.label}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%;background:${f.color}"></div>
        </div>
        <span class="bar-val" style="color:${f.color}">${avg.toFixed(1)}</span>
      </div>
    `;
  });
  document.getElementById('sliderBars').innerHTML = barsHtml;

  // Challenge tags
  const challenges = countTags(rows, 'אתגר מרכזי');
  const tagColors = ['#E06090','#5B9BD5','#E8A838','#8B6BC0','#7AB648','#D47B6A'];
  document.getElementById('challengeTags').innerHTML = challenges.map((t, i) =>
    `<div class="tag-item" style="background:${tagColors[i % tagColors.length]}18;color:${tagColors[i % tagColors.length]}">
      <span class="tag-count" style="background:${tagColors[i % tagColors.length]}30">${t.count}</span>
      ${t.name}
    </div>`
  ).join('');

  // Support tags
  const supports = countTags(rows, 'סוג תמיכה');
  document.getElementById('supportTags').innerHTML = supports.map((t, i) =>
    `<div class="tag-item" style="background:${tagColors[(i + 2) % tagColors.length]}18;color:${tagColors[(i + 2) % tagColors.length]}">
      <span class="tag-count" style="background:${tagColors[(i + 2) % tagColors.length]}30">${t.count}</span>
      ${t.name}
    </div>`
  ).join('');

  // Dimension bars
  const dimCounts = {};
  Object.keys(DIM_COLORS).forEach(d => dimCounts[d] = 0);
  rows.forEach(r => {
    const dim = (r['ממד לחיזוק'] || '').trim();
    if (dim && dimCounts[dim] !== undefined) dimCounts[dim]++;
  });
  const maxDim = Math.max(1, ...Object.values(dimCounts));
  document.getElementById('dimBars').innerHTML = Object.entries(DIM_COLORS).map(([name, color]) => {
    const count = dimCounts[name] || 0;
    const h = Math.max(8, (count / maxDim) * 140);
    return `
      <div class="dim-bar-wrap">
        <div class="dim-bar" style="height:${h}px;background:${color}">
          ${count > 0 ? `<span class="dim-bar-count">${count}</span>` : ''}
        </div>
        <div class="dim-bar-name">${name}</div>
      </div>
    `;
  }).join('');

  // Free text
  const freeTexts = rows.map(r => (r['מה יעזור לצוות'] || '').trim()).filter(t => t.length > 0);
  document.getElementById('freeResponses').innerHTML = freeTexts.length > 0
    ? freeTexts.map(t => `<div class="free-item">${escapeHtml(t)}</div>`).join('')
    : '<div style="color:#8C7E72;font-size:.85rem">עדיין אין תשובות פתוחות</div>';
}

function calcAvg(rows, key) {
  const vals = rows.map(r => parseFloat(r[key])).filter(v => !isNaN(v) && v > 0);
  if (vals.length === 0) return 0;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function countTags(rows, key) {
  const counts = {};
  rows.forEach(r => {
    const val = (r[key] || '').toString().trim();
    if (!val) return;
    val.split(',').forEach(t => {
      t = t.trim();
      if (t) counts[t] = (counts[t] || 0) + 1;
    });
  });
  return Object.entries(counts)
    .map(([name, count]) => ({ name, count }))
    .sort((a, b) => b.count - a.count);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ============================================
// INIT
// ============================================

if (isResultsMode()) {
  initDashboard();
} else {
  init();
}
</script>
</body>
</html>
