<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח בחינות תשפ"ז — אורט בית הערבה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00BCD4;
            --cyan-light: #E0F7FA;
            --cyan-dark: #00838F;
            --turquoise: #26A69A;
            --turquoise-light: #E0F2F1;
            --green-light: #C8E6C9;
            --green: #66BB6A;
            --pink: #F48FB1;
            --pink-light: #FCE4EC;
            --purple: #CE93D8;
            --purple-light: #F3E5F5;
            --orange: #FFB74D;
            --orange-light: #FFF3E0;
            --blue: #64B5F6;
            --blue-light: #E3F2FD;
            --red: #EF5350;
            --red-light: #FFEBEE;
            --yellow: #FFD54F;
            --yellow-light: #FFFDE7;
            --gray: #90A4AE;
            --gray-light: #ECEFF1;
            --bg: #FAFBFC;
            --card-bg: #FFFFFF;
            --text: #263238;
            --text-light: #546E7A;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --shadow-hover: 0 4px 20px rgba(0,0,0,0.12);
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Heebo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--cyan-dark) 0%, var(--turquoise) 100%);
            color: white;
            padding: 32px 24px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .header .subtitle {
            font-size: 15px;
            opacity: 0.85;
            font-weight: 300;
        }

        /* Controls */
        .controls {
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid #E0E0E0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .filter-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #E0E0E0;
            border-radius: 24px;
            background: white;
            font-family: 'Heebo', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-light);
            white-space: nowrap;
        }
        .filter-btn:hover {
            border-color: var(--cyan);
            color: var(--cyan-dark);
        }
        .filter-btn.active {
            background: var(--cyan);
            border-color: var(--cyan);
            color: white;
        }
        .filter-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            padding: 8px 4px;
            white-space: nowrap;
        }
        .separator {
            width: 1px;
            height: 32px;
            background: #E0E0E0;
            margin: 0 6px;
        }

        /* Stats bar */
        .stats-bar {
            padding: 10px 20px;
            background: var(--cyan-light);
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: var(--cyan-dark);
            font-weight: 500;
            flex-wrap: wrap;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-num {
            font-weight: 700;
            font-size: 16px;
        }

        /* Content */
        .content {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Month sections */
        .month-section {
            margin-bottom: 28px;
        }
        .month-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--cyan);
        }
        .month-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--cyan-dark);
        }
        .month-count {
            background: var(--cyan);
            color: white;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Exam cards */
        .exam-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .exam-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px 18px;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: 70px 1fr auto;
            gap: 14px;
            align-items: center;
            transition: all 0.2s;
            border-right: 4px solid var(--cyan);
        }
        .exam-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-1px);
        }

        /* Subject colors */
        .exam-card[data-subject="עברית"] { border-right-color: var(--blue); }
        .exam-card[data-subject="אנגלית"] { border-right-color: var(--purple); }
        .exam-card[data-subject="מתמטיקה"] { border-right-color: var(--red); }
        .exam-card[data-subject="היסטוריה"] { border-right-color: var(--orange); }
        .exam-card[data-subject="תנ\"ך"] { border-right-color: var(--green); }
        .exam-card[data-subject="אזרחות"] { border-right-color: var(--cyan); }
        .exam-card[data-subject="ספרות"] { border-right-color: var(--pink); }
        .exam-card[data-subject="תקשוב"] { border-right-color: #78909C; }
        .exam-card[data-subject="חינוך תעבורתי"] { border-right-color: var(--yellow); }
        .exam-card[data-subject="מו\"טל"] { border-right-color: #A1887F; }
        .exam-card[data-subject="אווטר"] { border-right-color: #4DB6AC; }
        .exam-card[data-subject="מגמה"] { border-right-color: var(--gray); }

        .exam-date {
            text-align: center;
        }
        .exam-day {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            line-height: 1;
        }
        .exam-month-label {
            font-size: 12px;
            color: var(--text-light);
            font-weight: 500;
        }
        .exam-weekday {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 2px;
        }

        .exam-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .exam-subject {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
        }
        .exam-details {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .exam-tag {
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        .tag-type {
            background: var(--cyan-light);
            color: var(--cyan-dark);
        }
        .tag-time {
            background: var(--orange-light);
            color: #E65100;
        }
        .tag-code {
            background: var(--purple-light);
            color: #6A1B9A;
        }
        .tag-note {
            background: var(--gray-light);
            color: #37474F;
        }

        .exam-classes {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: flex-end;
        }
        .class-badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            background: #F5F5F5;
            color: var(--text-light);
            white-space: nowrap;
        }
        .class-badge.grade-10 { background: #E8F5E9; color: #2E7D32; }
        .class-badge.grade-11 { background: #E3F2FD; color: #1565C0; }
        .class-badge.grade-12 { background: #FFF3E0; color: #E65100; }
        .class-badge.all { background: var(--cyan-light); color: var(--cyan-dark); }
        .class-badge.graduates { background: var(--pink-light); color: #AD1457; }

        /* Legend */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 20px;
            background: white;
            margin: 0 20px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }
        .legend-title {
            font-weight: 700;
            font-size: 14px;
            width: 100%;
            margin-bottom: 4px;
            color: var(--text-light);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        /* Print styles */
        @media print {
            .controls, .stats-bar { display: none; }
            .header { padding: 16px; }
            .exam-card { box-shadow: none; border: 1px solid #E0E0E0; }
            body { background: white; }
            .content { padding: 10px; }
        }

        /* Mobile */
        @media (max-width: 640px) {
            .header h1 { font-size: 22px; }
            .exam-card {
                grid-template-columns: 55px 1fr;
                gap: 10px;
            }
            .exam-classes {
                grid-column: 1 / -1;
                justify-content: flex-start;
            }
            .controls { padding: 12px 14px; }
            .content { padding: 14px; }
            .separator { display: none; }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.4;
        }
        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        /* Highlight today / upcoming */
        .exam-card.today {
            box-shadow: 0 0 0 2px var(--cyan), var(--shadow);
        }
        .exam-card.past {
            opacity: 0.55;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>לוח בחינות ובגרויות תשפ"ז</h1>
        <div class="subtitle">אורט בית הערבה — ירושלים</div>
    </div>

    <div class="controls">
        <span class="filter-label">שכבה:</span>
        <div class="filter-group" id="gradeFilters">
            <button class="filter-btn active" data-grade="all">הכל</button>
            <button class="filter-btn" data-grade="10">י׳</button>
            <button class="filter-btn" data-grade="11">יא׳</button>
            <button class="filter-btn" data-grade="12">יב׳</button>
            <button class="filter-btn" data-grade="graduates">בוגרים</button>
        </div>
        <div class="separator"></div>
        <span class="filter-label">כיתה:</span>
        <div class="filter-group" id="classFilters">
            <button class="filter-btn active" data-class="all">הכל</button>
        </div>
        <div class="separator"></div>
        <span class="filter-label">סוג:</span>
        <div class="filter-group" id="typeFilters">
            <button class="filter-btn active" data-type="all">הכל</button>
            <button class="filter-btn" data-type="בגרות">בגרות</button>
            <button class="filter-btn" data-type="מתכונת">מתכונת</button>
            <button class="filter-btn" data-type="מבחן">מבחן</button>
            <button class="filter-btn" data-type="מטלה">מטלה</button>
        </div>
    </div>

    <div class="stats-bar" id="statsBar">
        <div class="stat-item"><span class="stat-num" id="totalExams">0</span> בחינות</div>
        <div class="stat-item"><span class="stat-num" id="upcomingExams">0</span> קרובות</div>
        <div class="stat-item"><span class="stat-num" id="pastExams">0</span> עברו</div>
    </div>

    <div class="content">
        <div class="legend">
            <div class="legend-title">מקצועות</div>
            <div class="legend-item"><div class="legend-color" style="background:var(--blue)"></div>עברית</div>
            <div class="legend-item"><div class="legend-color" style="background:var(--purple)"></div>אנגלית</div>

            <div class="legend-item"><div class="legend-color" style="background:var(--orange)"></div>היסטוריה</div>
            <div class="legend-item"><div class="legend-color" style="background:var(--green)"></div>תנ"ך</div>
            <div class="legend-item"><div class="legend-color" style="background:var(--cyan)"></div>אזרחות</div>
            <div class="legend-item"><div class="legend-color" style="background:var(--pink)"></div>ספרות</div>
            <div class="legend-item"><div class="legend-color" style="background:#78909C"></div>תקשוב</div>
            <div class="legend-item"><div class="legend-color" style="background:var(--yellow)"></div>חינוך תעבורתי</div>
        </div>
        <div id="examsList"></div>
    </div>

    <script>
    // ============================================
    // Exam Data

    const exams = [

        { date: '2026-05-19', subject: 'אנגלית', type: 'בגרות', time: '13:30', code: 'שאלון G — 16585', classes: [], grades: [11,12] },

        { date: '2026-05-21', subject: 'תנ"ך', type: 'סימולציה', time: '', code: '', classes: [], grades: [11] },

        { date: '2026-06-01', subject: 'היסטוריה', type: 'בגרות', time: '12:30', code: '22261', classes: [], grades: [11] },

        { date: '2026-06-30', subject: 'אנגלית', type: 'מועד ב׳', time: '', code: '', classes: [], grades: [11,12] },

        // יולי
        { date: '2026-07-06', subject: 'מתמטיקה', type: 'מועד ב׳', time: '', code: '', classes: [], grades: [11,12] },
        { date: '2026-07-09', subject: 'עברית', type: 'מועד ב׳', time: '', code: '', classes: [], grades: [11,12] },
    ];

    // ============================================
    // Month names
    // ============================================
    const hebrewMonths = {
        1: 'ינואר', 2: 'פברואר', 3: 'מרץ', 4: 'אפריל',
        5: 'מאי', 6: 'יוני', 7: 'יולי', 8: 'אוגוסט',
        9: 'ספטמבר', 10: 'אוקטובר', 11: 'נובמבר', 12: 'דצמבר'
    };
    const hebrewDays = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

    // ============================================
    // State
    // ============================================
    let activeGrade = 'all';
    let activeClass = 'all';
    let activeType = 'all';

    // ============================================
    // Filter logic
    // ============================================
    function getClassesForGrade(grade) {
        const classSet = new Set();
        exams.forEach(e => {
            if (grade === 'all' || e.grades.includes(parseInt(grade)) || (grade === 'graduates' && e.note === 'בוגרים')) {
                e.classes.forEach(c => classSet.add(c));
            }
        });
        return [...classSet].sort();
    }

    function updateClassFilters() {
        const container = document.getElementById('classFilters');
        const classes = getClassesForGrade(activeGrade);
        container.innerHTML = '<button class="filter-btn active" data-class="all">הכל</button>';
        classes.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.dataset.class = c;
            btn.textContent = c;
            container.appendChild(btn);
        });
        activeClass = 'all';
        bindClassFilters();
    }

    function matchesFilter(exam) {
        // Grade filter
        if (activeGrade !== 'all') {
            if (activeGrade === 'graduates') {
                if (exam.note !== 'בוגרים') return false;
            } else {
                const g = parseInt(activeGrade);
                if (!exam.grades.includes(g)) return false;
            }
        }
        // Class filter
        if (activeClass !== 'all') {
            if (exam.classes.length > 0 && !exam.classes.includes(activeClass)) return false;
        }
        // Type filter
        if (activeType !== 'all') {
            const t = exam.type.toLowerCase();
            switch (activeType) {
                case 'בגרות': if (!t.includes('בגרות') && !t.includes('30%') && !t.includes('25%')) return false; break;
                case 'מתכונת': if (!t.includes('מתכונת') && !t.includes('סימולציה') && !t.includes('הדמיה')) return false; break;
                case 'מבחן': if (t !== 'מבחן' && !t.includes('cobe')) return false; break;
                case 'מטלה': if (!t.includes('מטלה') && !t.includes('תלקיט')) return false; break;
            }
        }
        return true;
    }

    // ============================================
    // Render
    // ============================================
    function render() {
        const container = document.getElementById('examsList');
        const filtered = exams.filter(matchesFilter);

        // Group by month
        const months = {};
        filtered.forEach(e => {
            const d = new Date(e.date);
            const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
            if (!months[key]) months[key] = [];
            months[key].push(e);
        });

        const today = new Date();
        today.setHours(0, 0, 0, 0);
        let upcoming = 0, past = 0;

        let html = '';
        const sortedKeys = Object.keys(months).sort();

        sortedKeys.forEach(key => {
            const [year, monthNum] = key.split('-').map(Number);
            const monthExams = months[key];
            html += `<div class="month-section">
                <div class="month-header">
                    <span class="month-name">${hebrewMonths[monthNum]} ${year}</span>
                    <span class="month-count">${monthExams.length} בחינות</span>
                </div>
                <div class="exam-grid">`;

            monthExams.forEach(exam => {
                const d = new Date(exam.date);
                const dayNum = d.getDate();
                const weekday = hebrewDays[d.getDay()];
                const isPast = d < today;
                const isToday = d.getTime() === today.getTime();
                if (isPast) past++; else upcoming++;

                let statusClass = '';
                if (isToday) statusClass = 'today';
                else if (isPast) statusClass = 'past';

                // Build tags
                let tags = '';
                if (exam.type) tags += `<span class="exam-tag tag-type">${exam.type}</span>`;
                if (exam.time) tags += `<span class="exam-tag tag-time">${exam.time}</span>`;
                if (exam.code) tags += `<span class="exam-tag tag-code">${exam.code}</span>`;
                if (exam.note) tags += `<span class="exam-tag tag-note">${exam.note}</span>`;

                // Build class badges
                let badges = '';
                if (exam.classes.length > 0) {
                    exam.classes.forEach(c => {
                        let badgeClass = '';
                        if (c.startsWith('י') && !c.startsWith('יא') && !c.startsWith('יב')) badgeClass = 'grade-10';
                        else if (c.startsWith('יא')) badgeClass = 'grade-11';
                        else if (c.startsWith('יב')) badgeClass = 'grade-12';
                        badges += `<span class="class-badge ${badgeClass}">${c}</span>`;
                    });
                } else {
                    // Show grade badges
                    exam.grades.forEach(g => {
                        const label = g === 10 ? 'שכבת י׳' : g === 11 ? 'שכבת יא׳' : 'שכבת יב׳';
                        const cls = g === 10 ? 'grade-10' : g === 11 ? 'grade-11' : 'grade-12';
                        badges += `<span class="class-badge ${cls}">${label}</span>`;
                    });
                }

                html += `
                    <div class="exam-card ${statusClass}" data-subject="${exam.subject}">
                        <div class="exam-date">
                            <div class="exam-day">${dayNum}</div>
                            <div class="exam-month-label">${hebrewMonths[monthNum]}</div>
                            <div class="exam-weekday">יום ${weekday}</div>
                        </div>
                        <div class="exam-info">
                            <div class="exam-subject">${exam.subject}</div>
                            <div class="exam-details">${tags}</div>
                        </div>
                        <div class="exam-classes">${badges}</div>
                    </div>`;
            });

            html += '</div></div>';
        });

        if (filtered.length === 0) {
            html = `<div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                <h3>אין בחינות לסינון הנבחר</h3>
                <p>נסו לשנות את הסינון</p>
            </div>`;
        }

        container.innerHTML = html;

        // Update stats
        document.getElementById('totalExams').textContent = filtered.length;
        document.getElementById('upcomingExams').textContent = upcoming;
        document.getElementById('pastExams').textContent = past;
    }

    // ============================================
    // Event binding
    // ============================================
    function bindGradeFilters() {
        document.querySelectorAll('#gradeFilters .filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#gradeFilters .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeGrade = btn.dataset.grade;
                updateClassFilters();
                render();
            });
        });
    }

    function bindClassFilters() {
        document.querySelectorAll('#classFilters .filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#classFilters .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeClass = btn.dataset.class;
                render();
            });
        });
    }

    function bindTypeFilters() {
        document.querySelectorAll('#typeFilters .filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#typeFilters .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeType = btn.dataset.type;
                render();
            });
        });
    }

    // ============================================
    // Init
    // ============================================
    bindGradeFilters();
    bindClassFilters();
    bindTypeFilters();
    updateClassFilters();
    render();
    </script>
</body>
</html>
