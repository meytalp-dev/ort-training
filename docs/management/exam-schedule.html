<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח בחינות תשפ"ו — אורט בית הערבה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Heebo', sans-serif;
            background: #F5F7FA;
            color: #263238;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #00838F 0%, #26A69A 100%);
            color: white;
            padding: 28px 24px 20px;
            text-align: center;
        }
        .header h1 { font-size: 26px; font-weight: 800; }
        .header .sub { font-size: 14px; opacity: 0.8; margin-top: 4px; }

        /* Grade Tabs */
        .grade-tabs {
            display: flex;
            justify-content: center;
            gap: 0;
            background: white;
            border-bottom: 2px solid #E0E0E0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .grade-tab {
            flex: 1;
            max-width: 180px;
            padding: 16px 12px;
            text-align: center;
            font-family: 'Heebo', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: white;
            color: #90A4AE;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .grade-tab:hover { color: #00838F; }
        .grade-tab.active {
            color: #00838F;
            border-bottom-color: #00838F;
            background: #E0F7FA;
        }
        .grade-tab .count {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: #90A4AE;
            margin-top: 2px;
        }
        .grade-tab.active .count { color: #00838F; }

        /* Class filter */
        .class-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            background: #FAFAFA;
            border-bottom: 1px solid #EEE;
            flex-wrap: wrap;
        }
        .class-btn {
            padding: 6px 20px;
            border: 2px solid #CFD8DC;
            border-radius: 20px;
            background: white;
            font-family: 'Heebo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #546E7A;
        }
        .class-btn:hover { border-color: #26A69A; color: #00838F; }
        .class-btn.active {
            background: #26A69A;
            border-color: #26A69A;
            color: white;
        }

        /* Content area */
        .content {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        /* Exam table */
        .exam-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .exam-table thead th {
            background: #00838F;
            color: white;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 600;
            text-align: right;
            white-space: nowrap;
        }
        .exam-table tbody tr {
            border-bottom: 1px solid #F0F0F0;
            transition: background 0.15s;
        }
        .exam-table tbody tr:last-child { border-bottom: none; }
        .exam-table tbody tr:hover { background: #F5FAFA; }
        .exam-table td {
            padding: 12px 14px;
            font-size: 14px;
            vertical-align: middle;
        }

        .exam-table tr.past { opacity: 0.5; }
        .exam-table tr.today { background: #E0F7FA; }
        .exam-table tr.today td:first-child { font-weight: 800; }

        /* Subject pill */
        .subject-cell {
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .subject-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Date cell */
        .date-cell {
            white-space: nowrap;
            font-weight: 600;
        }
        .date-weekday {
            font-size: 11px;
            color: #90A4AE;
            font-weight: 400;
        }

        /* Type badge */
        .type-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .type-bagrut { background: #FFEBEE; color: #C62828; }
        .type-matkonet { background: #E3F2FD; color: #1565C0; }
        .type-exam { background: #FFF3E0; color: #E65100; }
        .type-task { background: #F3E5F5; color: #6A1B9A; }
        .type-sim { background: #E0F2F1; color: #00695C; }
        .type-moed-b { background: #ECEFF1; color: #37474F; }
        .type-other { background: #F5F5F5; color: #546E7A; }

        .code-cell {
            font-family: monospace;
            font-size: 13px;
            color: #6A1B9A;
        }

        .classes-cell {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .class-chip {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            background: #E8F5E9;
            color: #2E7D32;
        }
        .class-chip.all-classes {
            background: #E0F7FA;
            color: #00838F;
        }

        /* Section headers in table */
        .month-row td {
            background: #FAFAFA;
            font-weight: 700;
            font-size: 15px;
            color: #00838F;
            padding: 10px 14px;
            border-top: 2px solid #E0E0E0;
        }
        .exam-table tbody tr.month-row:hover { background: #FAFAFA; }

        .note-cell {
            font-size: 13px;
            color: #546E7A;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #90A4AE;
        }
        .empty-state h3 { font-size: 18px; margin-bottom: 8px; }

        /* Print */
        @media print {
            .grade-tabs, .class-bar { position: static; }
            .exam-table { box-shadow: none; }
            .exam-table tbody tr.past { opacity: 1; }
            body { background: white; }
        }

        /* Mobile */
        @media (max-width: 640px) {
            .header h1 { font-size: 20px; }
            .grade-tab { font-size: 15px; padding: 12px 8px; }
            .exam-table td, .exam-table thead th { padding: 8px 8px; font-size: 13px; }
            .content { padding: 12px 8px 40px; }
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>

// ============================================
// Helpers
// ============================================
const hebrewMonths = {1:'ינואר',2:'פברואר',3:'מרץ',4:'אפריל',5:'מאי',6:'יוני',7:'יולי',8:'אוגוסט',9:'ספטמבר',10:'אוקטובר',11:'נובמבר',12:'דצמבר'};
const hebrewDays = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

function getTypeBadgeClass(type) {
    const t = type.toLowerCase();
    if (t.includes('בגרות') || t.includes('30%') || t.includes('25%') || t.includes('תלקיט')) return 'type-bagrut';
    if (t.includes('מתכונת')) return 'type-matkonet';
    if (t.includes('מבחן') || t.includes('cobe')) return 'type-exam';
    if (t.includes('מטלה') || t.includes('ביצוע')) return 'type-task';
    if (t.includes('סימולציה') || t.includes('הדמיה')) return 'type-sim';
    if (t.includes('מועד ב')) return 'type-moed-b';
    return 'type-other';
}

// ============================================
// State
// ============================================
let activeGrade = 'יא';
let activeClass = 'כולם';

// ============================================
// Render grade tabs
// ============================================
function renderGradeTabs() {
    const container = document.getElementById('gradeTabs');
    const grades = ['י', 'יא', 'יב'];
    container.innerHTML = grades.map(g => {
        const count = data[g] ? data[g].exams.length : 0;
        return `<button class="grade-tab ${g === activeGrade ? 'active' : ''}" data-grade="${g}">
            שכבת ${g}׳
            <span class="count">${count} בחינות</span>
        </button>`;
    }).join('');

    container.querySelectorAll('.grade-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            activeGrade = btn.dataset.grade;
            activeClass = 'כולם';
            renderGradeTabs();
            renderClassBar();
            renderExams();
        });
    });
}

// ============================================
// Render class bar
// ============================================
function renderClassBar() {
    const container = document.getElementById('classBar');
    const gradeData = data[activeGrade];
    if (!gradeData) { container.innerHTML = ''; return; }

    const classes = ['כולם', ...gradeData.classes];
    container.innerHTML = classes.map(c =>
        `<button class="class-btn ${c === activeClass ? 'active' : ''}" data-class="${c}">${c}</button>`
    ).join('');

    container.querySelectorAll('.class-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            activeClass = btn.dataset.class;
            renderClassBar();
            renderExams();
        });
    });
}

// ============================================
// Render exams table
// ============================================
function renderExams() {
    const tbody = document.getElementById('examBody');
    const emptyState = document.getElementById('emptyState');
    const table = document.getElementById('examTable');
    const gradeData = data[activeGrade];

    if (!gradeData) {
        tbody.innerHTML = '';
        table.style.display = 'none';
        emptyState.style.display = 'block';
        return;
    }

    // Filter by class
    let exams = gradeData.exams;
    if (activeClass !== 'כולם') {
        exams = exams.filter(e => e.classes.includes('כולם') || e.classes.includes(activeClass));
    }

    if (exams.length === 0) {
        tbody.innerHTML = '';
        table.style.display = 'none';
        emptyState.style.display = 'block';
        return;
    }

    table.style.display = '';
    emptyState.style.display = 'none';

    const today = new Date();
    today.setHours(0,0,0,0);

    let html = '';
    let currentMonth = '';

    exams.forEach(exam => {
        const d = new Date(exam.date);
        const monthKey = d.getFullYear() + '-' + (d.getMonth()+1);
        const monthLabel = hebrewMonths[d.getMonth()+1] + ' ' + d.getFullYear();

        // Month separator
        if (monthKey !== currentMonth) {
            currentMonth = monthKey;
            html += `<tr class="month-row"><td colspan="7">${monthLabel}</td></tr>`;
        }

        const isPast = d < today;
        const isToday = d.getTime() === today.getTime();
        let rowClass = '';
        if (isToday) rowClass = 'today';
        else if (isPast) rowClass = 'past';

        const dayNum = d.getDate();
        const monthNum = d.getMonth() + 1;
        const weekday = hebrewDays[d.getDay()];
        const color = subjectColors[exam.subject] || '#90A4AE';

        // Classes display
        let classesHtml = '';
        if (exam.classes.includes('כולם')) {
            classesHtml = '<span class="class-chip all-classes">כל השכבה</span>';
        } else {
            classesHtml = exam.classes.map(c => `<span class="class-chip">${c}</span>`).join('');
        }

        html += `<tr class="${rowClass}">
            <td class="date-cell">${dayNum}.${monthNum} <span class="date-weekday">יום ${weekday}</span></td>
            <td><div class="subject-cell"><span class="subject-dot" style="background:${color}"></span>${exam.subject}</div></td>
            <td>${exam.type ? `<span class="type-badge ${getTypeBadgeClass(exam.type)}">${exam.type}</span>` : ''}</td>
            <td>${exam.time || '—'}</td>
            <td class="code-cell">${exam.code || '—'}</td>
            <td class="hide-mobile"><div class="classes-cell">${classesHtml}</div></td>
            <td class="hide-mobile note-cell">${exam.note || ''}</td>
        </tr>`;
    });

    tbody.innerHTML = html;
}
