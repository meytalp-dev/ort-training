<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת בחינות תשפ"ו — אורט בית הערבה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="student-data.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Heebo', sans-serif; background: #F5F7FA; color: #263238; min-height: 100vh; }

        /* ===== Header ===== */
        .header { background: linear-gradient(135deg, #00838F 0%, #26A69A 100%); color: white; padding: 24px 20px 16px; text-align: center; }
        .header h1 { font-size: 28px; font-weight: 800; }
        .header .sub { font-size: 15px; opacity: 0.8; margin-top: 2px; }

        /* ===== Main Tabs ===== */
        .main-tabs { display: flex; background: white; border-bottom: 2px solid #E0E0E0; position: sticky; top: 0; z-index: 200; }
        .main-tab { flex: 1; padding: 14px 8px; text-align: center; font-family: 'Heebo', sans-serif; font-size: 17px; font-weight: 700;
            cursor: pointer; border: none; background: white; color: #90A4AE; border-bottom: 3px solid transparent; transition: all 0.2s; }
        .main-tab:hover { color: #00838F; }
        .main-tab.active { color: #00838F; border-bottom-color: #00838F; background: #E0F7FA; }
        .main-tab svg { width: 18px; height: 18px; vertical-align: middle; margin-left: 6px; }

        /* ===== Grade Tabs ===== */
        .grade-tabs { display: flex; justify-content: center; gap: 0; background: #FAFAFA; border-bottom: 1px solid #E0E0E0; }
        .grade-tab { flex: 1; max-width: 160px; padding: 12px 8px; text-align: center; font-family: 'Heebo', sans-serif;
            font-size: 18px; font-weight: 700; cursor: pointer; border: none; background: transparent; color: #90A4AE;
            border-bottom: 3px solid transparent; transition: all 0.2s; }
        .grade-tab:hover { color: #00838F; }
        .grade-tab.active { color: #00838F; border-bottom-color: #26A69A; }

        /* ===== Class Bar ===== */
        .class-bar { display: flex; justify-content: center; gap: 8px; padding: 10px 16px; background: white; border-bottom: 1px solid #EEE; flex-wrap: wrap; }
        .class-btn { padding: 5px 18px; border: 2px solid #CFD8DC; border-radius: 20px; background: white; font-family: 'Heebo', sans-serif;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; color: #546E7A; }
        .class-btn:hover { border-color: #26A69A; color: #00838F; }
        .class-btn.active { background: #26A69A; border-color: #26A69A; color: white; }

        /* ===== Action Bar ===== */
        .action-bar { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 20px; flex-wrap: wrap; }
        .action-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: 8px;
            font-family: 'Heebo', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-print { background: #E3F2FD; color: #1565C0; }
        .btn-print:hover { background: #BBDEFB; }
        .btn-wa { background: #E8F5E9; color: #2E7D32; }
        .btn-wa:hover { background: #C8E6C9; }
        .btn-save { background: #00838F; color: white; }
        .btn-save:hover { background: #006064; }
        .btn-danger { background: #FFEBEE; color: #C62828; }
        .btn-danger:hover { background: #FFCDD2; }
        .action-btn svg { width: 16px; height: 16px; }

        /* ===== Content ===== */
        .content { max-width: 960px; margin: 0 auto; padding: 16px 16px 60px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ===== Table ===== */
        .exam-table { width: 100%; border-collapse: separate; border-spacing: 0; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .exam-table thead th { background: #00838F; color: white; padding: 12px 14px; font-size: 15px; font-weight: 600; text-align: right; white-space: nowrap; }
        .exam-table tbody tr { border-bottom: 1px solid #F0F0F0; transition: background 0.15s; }
        .exam-table tbody tr:last-child { border-bottom: none; }
        .exam-table tbody tr:hover { background: #F5FAFA; }
        .exam-table td { padding: 12px 14px; font-size: 15px; vertical-align: middle; }
        .exam-table tr.past { opacity: 0.5; }
        .exam-table tr.today { background: #E0F7FA; }

        .subject-cell { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 6px; }
        .subject-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .date-cell { white-space: nowrap; font-weight: 600; font-size: 15px; }
        .date-weekday { font-size: 13px; color: #78909C; font-weight: 400; }

        .type-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 14px; font-weight: 600; white-space: nowrap; }
        .type-bagrut { background: #FFEBEE; color: #C62828; }
        .type-matkonet { background: #E3F2FD; color: #1565C0; }
        .type-exam { background: #FFF3E0; color: #E65100; }
        .type-task { background: #F3E5F5; color: #6A1B9A; }
        .type-sim { background: #E0F2F1; color: #00695C; }
        .type-moed-b { background: #ECEFF1; color: #37474F; }
        .type-marathon { background: #FFF8E1; color: #F57F17; }
        .type-quiz { background: #E8EAF6; color: #283593; }
        .type-summary { background: #E0F2F1; color: #00695C; }
        .type-other { background: #F5F5F5; color: #546E7A; }

        .code-cell { font-family: monospace; font-size: 14px; color: #6A1B9A; }
        .month-row td { background: #FAFAFA; font-weight: 700; font-size: 16px; color: #00838F; padding: 10px 14px; border-top: 2px solid #E0E0E0; }
        .exam-table tbody tr.month-row:hover { background: #FAFAFA; }

        /* ===== Review Cards ===== */
        .review-card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-right: 4px solid #26A69A; }
        .review-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .review-card-title { font-size: 18px; font-weight: 700; }
        .review-card-meta { font-size: 14px; color: #546E7A; }
        .review-card-body { margin-top: 10px; }
        .review-topics { white-space: pre-line; font-size: 15px; line-height: 1.7; padding: 10px; background: #F5F7FA; border-radius: 8px; margin-bottom: 10px; }
        .review-links { list-style: none; }
        .review-links li { padding: 4px 0; }
        .review-links a { color: #1565C0; text-decoration: none; font-size: 15px; }
        .review-links a:hover { text-decoration: underline; }
        .review-files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .file-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; background: #E3F2FD; color: #1565C0; border-radius: 16px; font-size: 12px; font-weight: 500; }
        .review-empty { color: #78909C; font-size: 13px; font-style: italic; }
        .review-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

        /* ===== Modal ===== */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal { background: white; border-radius: 16px; max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 24px; }
        .modal h2 { font-size: 20px; margin-bottom: 16px; color: #00838F; }
        .modal label { display: block; font-size: 13px; font-weight: 600; color: #546E7A; margin-bottom: 4px; margin-top: 12px; }
        .modal textarea, .modal input[type="text"], .modal input[type="url"], .modal select {
            width: 100%; padding: 10px 12px; border: 2px solid #E0E0E0; border-radius: 8px; font-family: 'Heebo', sans-serif;
            font-size: 14px; transition: border-color 0.2s; resize: vertical; }
        .modal textarea:focus, .modal input:focus, .modal select:focus { border-color: #26A69A; outline: none; }
        .modal textarea { min-height: 100px; }
        .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
        .links-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
        .link-row { display: flex; gap: 6px; align-items: center; }
        .link-row input { flex: 1; }
        .link-row button { flex-shrink: 0; }
        .btn-add-link { background: none; border: 1px dashed #90A4AE; color: #546E7A; padding: 6px 12px; border-radius: 8px;
            font-family: 'Heebo', sans-serif; font-size: 12px; cursor: pointer; margin-top: 6px; }
        .btn-add-link:hover { border-color: #26A69A; color: #00838F; }

        /* ===== File Upload ===== */
        .upload-area { border: 2px dashed #CFD8DC; border-radius: 12px; padding: 20px; text-align: center; margin-top: 8px;
            cursor: pointer; transition: all 0.2s; }
        .upload-area:hover { border-color: #26A69A; background: #F5FAFA; }
        .upload-area.dragging { border-color: #00838F; background: #E0F7FA; }
        .upload-area p { font-size: 13px; color: #90A4AE; }
        .uploaded-files { margin-top: 8px; }
        .uploaded-file { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: #F5F7FA; border-radius: 8px; margin-top: 4px; font-size: 13px; }
        .uploaded-file .remove-file { background: none; border: none; color: #C62828; cursor: pointer; font-size: 16px; }

        /* ===== Grades ===== */
        .grades-table { width: 100%; border-collapse: separate; border-spacing: 0; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .grades-table thead th { background: #00838F; color: white; padding: 12px 10px; font-size: 14px; font-weight: 600; text-align: right; }
        .grades-table td { padding: 10px; font-size: 15px; border-bottom: 1px solid #F0F0F0; }
        .grades-table input { width: 100%; padding: 8px 10px; border: 1px solid #E0E0E0; border-radius: 6px; font-family: 'Heebo', sans-serif; font-size: 15px; text-align: center; }
        .grades-table input[type="number"] { width: 70px; }
        .grades-table input:focus { border-color: #26A69A; outline: none; }
        .grade-input.fail { background: #FFEBEE; }
        .grade-input.pass { background: #E8F5E9; }

        /* ===== KPI Cards ===== */
        .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 16px 0; }
        .kpi-card { background: white; border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .kpi-value { font-size: 28px; font-weight: 800; }
        .kpi-label { font-size: 12px; color: #546E7A; margin-top: 4px; }
        .kpi-green .kpi-value { color: #2E7D32; }
        .kpi-red .kpi-value { color: #C62828; }
        .kpi-blue .kpi-value { color: #1565C0; }
        .kpi-orange .kpi-value { color: #E65100; }

        /* ===== Bar Chart ===== */
        .bar-chart { display: flex; align-items: flex-end; gap: 12px; height: 160px; padding: 16px; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin: 16px 0; }
        .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .bar { border-radius: 6px 6px 0 0; min-height: 4px; transition: height 0.5s; width: 100%; max-width: 80px; }
        .bar-val { font-size: 14px; font-weight: 700; }
        .bar-label { font-size: 11px; color: #546E7A; text-align: center; }

        /* ===== Insights ===== */
        .insight-card { background: white; border-radius: 12px; padding: 16px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .insight-card h4 { font-size: 14px; color: #00838F; margin-bottom: 8px; }
        .insight-list { list-style: none; }
        .insight-list li { padding: 4px 0; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .insight-list .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

        /* ===== Confirm Section ===== */
        .confirm-section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        .confirm-section .info { font-size: 14px; }
        .confirm-section .info strong { color: #00838F; }
        .confirmed-badge { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; background: #E8F5E9; color: #2E7D32;
            border-radius: 8px; font-size: 13px; font-weight: 600; }

        /* ===== Exam Selector ===== */
        .exam-selector { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
        .exam-selector select { padding: 8px 12px; border: 2px solid #E0E0E0; border-radius: 8px; font-family: 'Heebo', sans-serif;
            font-size: 14px; min-width: 250px; }
        .exam-selector select:focus { border-color: #26A69A; outline: none; }
        .teacher-input { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .teacher-input input { padding: 8px 12px; border: 2px solid #E0E0E0; border-radius: 8px; font-family: 'Heebo', sans-serif; font-size: 14px; }

        /* ===== Toast ===== */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #263238; color: white;
            padding: 12px 24px; border-radius: 10px; font-size: 14px; z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }

        /* ===== Empty ===== */
        .empty-state { text-align: center; padding: 40px 20px; color: #90A4AE; }
        .empty-state h3 { font-size: 16px; margin-bottom: 6px; }

        /* ===== Print ===== */
        @media print {
            .main-tabs, .action-bar, .class-bar, .modal-overlay, .toast, .review-actions, .btn-wa, .btn-print { display: none !important; }
            .header { padding: 12px; }
            .grade-tabs { position: static; }
            body { background: white; }
            .exam-table { box-shadow: none; }
            .exam-table tr.past { opacity: 1; }
            .content { padding: 8px; }
        }

        /* ===== Accessibility ===== */
        .main-tab:focus-visible, .grade-tab:focus-visible, .class-btn:focus-visible,
        .action-btn:focus-visible, .filter-btn:focus-visible {
            outline: 3px solid #00838F; outline-offset: 2px;
        }
        .modal input:focus-visible, .modal textarea:focus-visible, .modal select:focus-visible {
            outline: 2px solid #00838F; outline-offset: 1px;
        }
        .grades-table input:focus-visible { outline: 2px solid #26A69A; outline-offset: 1px; }

        /* ===== Table scroll wrapper ===== */
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; }

        /* ===== Mobile ===== */
        @media (max-width: 640px) {
            .header h1 { font-size: 20px; }
            .main-tab { font-size: 13px; padding: 12px 6px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
            .main-tab svg { width: 14px; height: 14px; }
            .grade-tab { font-size: 14px; min-height: 44px; max-width: 100px; }
            .class-btn { padding: 8px 14px; min-height: 44px; display: inline-flex; align-items: center; }
            .action-btn { padding: 10px 14px; min-height: 44px; }
            .action-bar { flex-direction: column; gap: 6px; }
            .action-btn { width: 100%; justify-content: center; }
            .exam-table td, .exam-table thead th { padding: 8px 6px; font-size: 13px; }
            .content { padding: 10px 8px 40px; }
            .hide-mobile { display: none; }
            .kpi-row { grid-template-columns: repeat(2, 1fr); }
            .exam-selector { flex-direction: column; }
            .exam-selector select { min-width: unset; width: 100%; }
            .teacher-input { flex-direction: column; gap: 6px; }
            .teacher-input input { width: 100% !important; }
            .modal { padding: 16px; max-height: 90vh; }
            .upload-area { padding: 14px; }
            /* Grades: card layout on mobile */
            .grades-table thead { display: none; }
            .grades-table tbody, .grades-table tr { display: block; width: 100%; }
            .grades-table tr { background: white; border-radius: 10px; margin-bottom: 10px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 1px solid #E0E0E0; }
            .grades-table td { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #F5F5F5; font-size: 14px; }
            .grades-table td:last-child { border-bottom: none; }
            .grades-table td::before { content: attr(data-label); font-weight: 600; color: #546E7A; font-size: 13px; margin-left: 10px; }
            .grades-table input[type="number"] { width: 80px; }
            .grades-table input { text-align: right; }
        }
        @media (max-width: 480px) {
            .exam-table .hide-narrow { display: none; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>מערכת ניהול בחינות תשפ"ו</h1>
    <div class="sub">אורט בית הערבה — ירושלים</div>
</div>

<!-- Main Navigation -->
<div class="main-tabs">
    <button class="main-tab active" onclick="switchMainTab(1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        לוח בחינות
    </button>
    <button class="main-tab" onclick="switchMainTab(2)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        דפי חזרה
    </button>
    <button class="main-tab" onclick="switchMainTab(3)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        ציונים ואנליזה
    </button>
</div>

<!-- ============================================ -->
<!-- TAB 1: EXAM SCHEDULE -->
<!-- ============================================ -->
<div class="tab-content active" id="tab1">
    <div class="grade-tabs" id="gradeTabs1"></div>
    <div class="class-bar" id="classBar1"></div>
    <div class="action-bar">
        <button class="action-btn btn-print" onclick="window.print()" aria-label="הדפסת לוח בחינות">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
            הדפסה
        </button>
        <button class="action-btn btn-wa" onclick="openWhatsAppModal()" aria-label="שיתוף לוח בWhatsApp">
            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><circle cx="12" cy="12" r="10"/><text x="12" y="16" text-anchor="middle" fill="white" font-size="12">W</text></svg>
            שתף בWhatsApp
        </button>
        <button class="action-btn" style="background:#FFF3E0;color:#E65100;" onclick="sendPrepFormsToTeachers()" aria-label="שליחת טפסי הכנה למורים">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            שלח טפסי הכנה למורים
        </button>
    </div>
    <div class="content">
        <div class="table-scroll">
        <table class="exam-table" id="examTable1">
            <thead><tr>
                <th>תאריך</th><th>מקצוע</th><th>סוג</th><th class="hide-narrow">שעה</th><th class="hide-narrow">סמל שאלון</th><th>מורה</th><th>הכנה</th><th class="hide-mobile">כיתות</th><th class="hide-mobile">הערות</th>
            </tr></thead>
            <tbody id="examBody1"></tbody>
        </table>
        </div>
        <div class="empty-state" id="empty1" style="display:none"><h3>אין בחינות לשכבה/כיתה שנבחרה</h3></div>
    </div>
</div>

<!-- ============================================ -->
<!-- TAB 2: REVIEW PAGES -->
<!-- ============================================ -->
<div class="tab-content" id="tab2">
    <div class="grade-tabs" id="gradeTabs2"></div>
    <div class="class-bar" id="classBar2"></div>
    <div class="content" id="reviewContent"></div>
</div>

<!-- ============================================ -->
<!-- TAB 3: GRADES & ANALYTICS -->
<!-- ============================================ -->
<div class="tab-content" id="tab3">
    <div class="grade-tabs" id="gradeTabs3"></div>
    <div class="class-bar" id="classBar3"></div>
    <div class="content">
        <div class="exam-selector">
            <label style="font-weight:700;font-size:14px;">בחירת בחינה:</label>

    s3.src = APPS_SCRIPT_URL + '?callback=onPrepsLoaded&action=getPreps';
    document.body.appendChild(s3);
}
function onReviewsLoaded(data) {
    if (data.result === 'success' && data.reviews) {
        data.reviews.forEach(r => { reviewCache[r.examId] = r; });
        saveToStorage();
        if (activeMainTab === 2) renderReview();
    }
}
function onConfirmationsLoaded(data) {
    if (data.result === 'success' && data.confirmations) {
        confirmationsCache = data.confirmations;
        saveToStorage();
        if (activeMainTab === 3) { const sel = document.getElementById('examSelect'); if (sel.value) onExamSelected(); }
    }
}
function onPrepsLoaded(data) {
    if (data.result === 'success' && data.preps) {
        data.preps.forEach(p => { prepStatus[p.examId + '|' + p.teacherName] = true; });
        saveToStorage();
        if (activeMainTab === 1) renderSchedule();
    }

// ============================================
// MAIN TAB SWITCH
// ============================================
function switchMainTab(n) {
    activeMainTab = n;
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
    document.getElementById('tab' + n).classList.add('active');
    document.querySelectorAll('.main-tab')[n - 1].classList.add('active');
    renderGradeTabs(n);
    renderClassBar(n);
    renderTab(n);
}

// ============================================
// GRADE & CLASS TABS
// ============================================
function renderGradeTabs(tab) {
    const container = document.getElementById('gradeTabs' + tab);
    const grades = ['י','יא','יב'];
    container.innerHTML = grades.map(g => {
        const count = examData[g] ? examData[g].exams.length : 0;
        return `<button class="grade-tab ${g === state[tab].grade ? 'active' : ''}" onclick="setGrade(${tab},'${g}')">${'שכבת ' + g + '׳'}</button>`;
    }).join('');
}

function renderClassBar(tab) {
    const container = document.getElementById('classBar' + tab);
    const gd = examData[state[tab].grade];
    if (!gd) { container.innerHTML = ''; return; }
    const classes = ['כולם', ...gd.classes];
    container.innerHTML = classes.map(c =>
        `<button class="class-btn ${c === state[tab].cls ? 'active' : ''}" onclick="setClass(${tab},'${c}')">${c}</button>`
    ).join('');
}

function setGrade(tab, g) { state[tab].grade = g; state[tab].cls = 'כולם'; renderGradeTabs(tab); renderClassBar(tab); renderTab(tab); }
function setClass(tab, c) { state[tab].cls = c; renderClassBar(tab); renderTab(tab); }

function renderTab(tab) {
    if (tab === 1) renderSchedule();
    else if (tab === 2) renderReview();
    else if (tab === 3) renderGradesTab();
}

// ============================================
// HELPERS
// ============================================
function getTypeBadgeClass(type) {
    const t = (type || '').toLowerCase();
    if (t.includes('בגרות') || t.includes('30%') || t.includes('25%') || t.includes('תלקיט')) return 'type-bagrut';
    if (t.includes('מרתון')) return 'type-marathon';
    if (t.includes('חידון')) return 'type-quiz';
    if (t.includes('מסכם')) return 'type-summary';
    if (t.includes('מתכונת')) return 'type-matkonet';
    if (t.includes('מבחן') || t.includes('cobe')) return 'type-exam';
    if (t.includes('מטלה') || t.includes('ביצוע')) return 'type-task';
    if (t.includes('סימולציה') || t.includes('הדמיה')) return 'type-sim';
    if (t.includes('מועד ב')) return 'type-moed-b';
    return 'type-other';
}

function getFilteredExams(tab) {
    const gd = examData[state[tab].grade];
    if (!gd) return [];
    let exams = gd.exams;
    if (state[tab].cls !== 'כולם') {
        exams = exams.filter(e => e.classes.includes('כולם') || e.classes.includes(state[tab].cls));
    }
    return exams;
}

function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.getDate() + '.' + (d.getMonth() + 1);
}

function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');

}

    document.getElementById(id).classList.remove('show');

}

function normalizePhone(phone) {
    let p = (phone || '').toString().replace(/[^0-9]/g, '');
    if (p.startsWith('0')) p = '972' + p.substring(1);
    if (!p.startsWith('972')) p = '972' + p;
    return p;
}

// ============================================
function renderSchedule() {
    const tbody = document.getElementById('examBody1');
    const empty = document.getElementById('empty1');
    const table = document.getElementById('examTable1');
    const exams = getFilteredExams(1);

    if (exams.length === 0) { tbody.innerHTML = ''; table.style.display = 'none'; empty.style.display = 'block'; return; }
    table.style.display = ''; empty.style.display = 'none';

    const today = new Date(); today.setHours(0,0,0,0);
    let html = '', currentMonth = '';

    exams.forEach(exam => {
        const d = new Date(exam.date);
        const mk = d.getFullYear() + '-' + (d.getMonth()+1);
        if (mk !== currentMonth) {
            currentMonth = mk;
            html += `<tr class="month-row"><td colspan="9">${hebrewMonths[d.getMonth()+1]} ${d.getFullYear()}</td></tr>`;
        }
        const isPast = d < today, isToday = d.getTime() === today.getTime();
        const rc = isToday ? 'today' : isPast ? 'past' : '';
        const wd = hebrewDays[d.getDay()];
        const color = subjectColors[exam.subject] || '#90A4AE';

        // Prep status check
        let prepIcon = '—';
        if (exam.prep !== false && exam.teacher) {
            const teachers = exam.teacher.split(',').map(t => t.replace(/\(.*?\)/g,'').trim());
            const prepDone = teachers.some(t => prepStatus[exam.id + '|' + t]);
            prepIcon = prepDone
                ? '<span style="color:#2E7D32;font-weight:800;font-size:18px;" title="טופס הוגש" aria-label="טופס הוגש">V</span>'
                : '<span style="color:#C62828;font-weight:800;font-size:18px;" title="ממתין" aria-label="ממתין להגשה">X</span>';
        }

        html += `<tr class="${rc}" style="cursor:pointer;" onclick="goToGrades('${exam.id}')">
            <td class="date-cell">${d.getDate()}.${d.getMonth()+1} <span class="date-weekday">יום ${wd}</span></td>

function sendScheduleWA() {
    const target = document.querySelector('input[name="waTarget"]:checked').value;

    const grade = state[1].grade;
    const cls = state[1].cls;

    let msg = '📋 לוח בחינות — שכבת ' + grade + '׳\n';
    if (cls !== 'כולם') msg += '🏫 כיתה: ' + cls + '\n';
    msg += '\n';

    exams.forEach(e => {
        const d = new Date(e.date);
        msg += '📅 ' + d.getDate() + '.' + (d.getMonth()+1) + ' | ' + e.subject;
        if (e.type) msg += ' (' + e.type + ')';
        if (e.time) msg += ' | ⏰ ' + e.time;
        if (e.teacher) msg += '\n   👨‍🏫 ' + e.teacher;
        msg += '\n';
    });
    msg += '\nבהצלחה! 🍀\nאורט בית הערבה';

    // Get phones based on target
    let phones = [];
    if (typeof STUDENTS !== 'undefined') {
        if (target === 'class' && cls !== 'כולם') {
            phones = STUDENTS.filter(s => s.cls === cls && s.status === 'active' && s.phone).map(s => normalizePhone(s.phone));
        } else if (target === 'grade') {
            phones = STUDENTS.filter(s => s.cls.startsWith(grade) && s.status === 'active' && s.phone).map(s => normalizePhone(s.phone));
        }
    }
    if (target === 'staff') {
        // Use api.whatsapp.com for staff (open in browser)
        const encoded = encodeURIComponent(msg);
        window.open('https://api.whatsapp.com/send?text=' + encoded, '_blank');
        closeModal('waModal');
        toast('WhatsApp נפתח — שלחו לקבוצת הצוות');
        return;
    }

    if (phones.length === 0) {
        // Fallback: open WhatsApp with text
        const encoded = encodeURIComponent(msg);
        window.open('https://api.whatsapp.com/send?text=' + encoded, '_blank');
        closeModal('waModal');
        toast('WhatsApp נפתח — בחרו נמען');
        return;
    }

    if (APPS_SCRIPT_URL) {
        fetch(APPS_SCRIPT_URL, {
            method: 'POST', mode: 'no-cors',
            body: JSON.stringify({ action: 'sendScheduleWhatsApp', phones: phones, message: msg })
        }).then(() => { toast('נשלח ל-' + phones.length + ' נמענים'); }).catch(() => { toast('שגיאה בשליחה'); });
    } else {
        const encoded = encodeURIComponent(msg);
        window.open('https://api.whatsapp.com/send?text=' + encoded, '_blank');
        toast('WhatsApp נפתח');
    }
    closeModal('waModal');
}

function sendPrepFormsToTeachers() {

                + '📝 ' + e.subject + (e.type ? ' (' + e.type + ')' : '') + '\n'

// ============================================
// FILE UPLOAD
// ============================================
function handleFileUpload(event) {
    const files = event.target.files;
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64 = e.target.result.split(',')[1];
            if (APPS_SCRIPT_URL) {
                toast('מעלה: ' + file.name + '...');
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'uploadFile',
                        fileName: file.name,
                        fileData: base64,
                        mimeType: file.type,
                        examId: document.getElementById('editExamId').value
                    })
                }).then(r => r.json()).then(data => {
                    if (data.result === 'success') {
                        currentUploadedFiles.push({ name: file.name, url: data.fileUrl });
                        renderUploadedFiles();
                        toast('הועלה: ' + file.name);
                    } else {
                        toast('שגיאה: ' + (data.message || ''));
                    }
                }).catch(() => {
                    // Fallback: save base64 reference
                    currentUploadedFiles.push({ name: file.name, url: 'local://' + file.name });
                    renderUploadedFiles();
                    toast(file.name + ' — נשמר מקומית (חבר Apps Script להעלאה ל-Drive)');
                });
            } else {
                currentUploadedFiles.push({ name: file.name, url: 'local://' + file.name });
                renderUploadedFiles();
                toast(file.name + ' — חבר Apps Script להעלאה');
            }
        };
        reader.readAsDataURL(file);
    }
    event.target.value = '';
}

// Drag & drop
const uploadArea = document.getElementById('uploadArea');
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragging'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragging'));
uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('dragging');
    handleFileUpload({ target: { files: e.dataTransfer.files }, value: '' });
});

    const examId = document.getElementById('editExamId').value;

function sendReviewWA(examId) {
    let examInfo = null;
    for (const g in examData) {
        const found = examData[g].exams.find(e => e.id === examId);
        if (found) { examInfo = found; break; }
    }
    if (!examInfo) return;

    const review = reviewCache[examId];
    if (!review) { toast('אין דף חזרה לשליחה'); return; }

    const d = new Date(examInfo.date);
    let msg = '📚 דף חזרה — ' + examInfo.subject + (examInfo.type ? ' (' + examInfo.type + ')' : '') + '\n';
    msg += '📅 תאריך בחינה: ' + d.getDate() + '.' + (d.getMonth()+1) + '.' + d.getFullYear() + '\n';
    if (examInfo.teacher) msg += '👨‍🏫 מורה: ' + examInfo.teacher + '\n';
    msg += '\n📝 נושאים ללמוד:\n' + (review.topics || 'לא צוינו') + '\n';

    if (review.links) {
        msg += '\n🔗 חומרי עזר:\n' + review.links.split('\n').filter(l => l.trim()).join('\n') + '\n';
    }
    if (review.files) {
        const fileLinks = review.files.split('\n').filter(f => f.trim()).map(f => {
            const parts = f.split('|');
            return parts[1] && !parts[1].startsWith('local://') ? parts[1] : parts[0];
        }).join('\n');
        if (fileLinks) msg += '\n📎 קבצים:\n' + fileLinks + '\n';
    }
    msg += '\nבהצלחה! 🍀\nאורט בית הערבה';

    const encoded = encodeURIComponent(msg);
    window.open('https://api.whatsapp.com/send?text=' + encoded, '_blank');
    toast('WhatsApp נפתח — בחרו נמען');
}

function renderGradesEntry(exam, examGrade) {
    const container = document.getElementById('gradesSection');
    const cls = state[3].cls;

    // Get students for this class
    let students = [];
    if (typeof STUDENTS !== 'undefined') {
        students = STUDENTS.filter(s => {
            if (s.status !== 'active') return false;
            if (cls !== 'כולם') return s.cls === cls;
            return s.cls.startsWith(examGrade);
        });
    }

    if (students.length === 0) {
        container.innerHTML = '<div class="empty-state"><h3>לא נמצאו תלמידים — ודאו ש-student-data.js נטען</h3></div>';
        return;
    }

    // Check existing grades
    const existingGrades = gradesCache[exam.id] || {};

    let html = `<div style="margin:16px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <h3 style="font-size:16px;color:#00838F;">הזנת ציונים — ${students.length} תלמידים</h3>
        <button class="action-btn btn-save" onclick="saveAllGrades('${exam.id}')">שמור ציונים</button>
    </div>
    <div style="overflow-x:auto;">
    <table class="grades-table"><thead><tr>
        <th>#</th><th>שם תלמיד/ה</th><th>כיתה</th><th>ציון</th><th>שאלות קשות</th><th>שאלות קלות</th><th class="hide-mobile">הערות</th>
    </tr></thead><tbody>`;

    students.sort((a, b) => (a.last + a.first).localeCompare(b.last + b.first));
    students.forEach((s, i) => {
        const existing = existingGrades[s.id] || {};
        html += `<tr>
            <td data-label="#">${i + 1}</td>
            <td data-label="שם" style="font-weight:600;">${s.last} ${s.first}</td>
            <td data-label="כיתה">${s.cls}</td>
            <td data-label="ציון"><input type="number" class="grade-input" data-sid="${s.id}" data-name="${s.last} ${s.first}" data-cls="${s.cls}" min="0" max="100" value="${existing.grade !== undefined ? existing.grade : ''}" onchange="colorGradeInput(this)"></td>
            <td data-label="שאלות קשות"><input type="text" class="hard-q" data-sid="${s.id}" placeholder="3,5,7" value="${existing.hardQuestions || ''}"></td>
            <td data-label="שאלות קלות"><input type="text" class="easy-q" data-sid="${s.id}" placeholder="1,2,4" value="${existing.easyQuestions || ''}"></td>
            <td data-label="הערות" class="hide-mobile"><input type="text" class="grade-note" data-sid="${s.id}" placeholder="הערה" value="${existing.notes || ''}"></td>
        </tr>`;
    });

    html += '</tbody></table></div>';
    container.innerHTML = html;

    // Color existing grades
    document.querySelectorAll('.grade-input').forEach(colorGradeInput);
}

function colorGradeInput(el) {
    if (el.target) el = el.target;
    const v = parseInt(el.value);
    el.classList.remove('pass', 'fail');
    if (!isNaN(v)) el.classList.add(v >= 55 ? 'pass' : 'fail');
}

function saveAllGrades(examId) {
    const gradeInputs = document.querySelectorAll('.grade-input');
    const grades = [];
    gradeInputs.forEach(input => {
        const sid = input.dataset.sid;
        const grade = input.value.trim();
        if (!grade) return;
        const hard = document.querySelector(`.hard-q[data-sid="${sid}"]`);
        const easy = document.querySelector(`.easy-q[data-sid="${sid}"]`);
        const note = document.querySelector(`.grade-note[data-sid="${sid}"]`);
        grades.push({
            studentId: sid,
            studentName: input.dataset.name,
            cls: input.dataset.cls,
            grade: parseInt(grade),
            hardQuestions: hard ? hard.value : '',
            easyQuestions: easy ? easy.value : '',
            notes: note ? note.value : ''
        });
    });

    if (grades.length === 0) { toast('לא הוזנו ציונים'); return; }

    // Cache locally
    if (!gradesCache[examId]) gradesCache[examId] = {};
    grades.forEach(g => { gradesCache[examId][g.studentId] = g; });
    saveToStorage();

    const teacherName = document.getElementById('teacherNameInput').value || '';

    if (APPS_SCRIPT_URL) {
        fetch(APPS_SCRIPT_URL, {
            method: 'POST', mode: 'no-cors',
            body: JSON.stringify({ action: 'saveGrades', examId, grades, teacherName })
        }).then(() => toast(grades.length + ' ציונים נשמרו — סיכום נשלח להנהלה'));
    } else {
        toast(grades.length + ' ציונים נשמרו מקומית');
    }

    renderAnalytics(examId);
}

// ============================================
// TAB 3: ANALYTICS
// ============================================
function renderAnalytics(examId) {
    const container = document.getElementById('analyticsSection');
    const gradeData = gradesCache[examId];
    if (!gradeData || Object.keys(gradeData).length === 0) {
        container.innerHTML = '';
        return;
    }

    const scores = Object.values(gradeData).map(g => g.grade).filter(g => g !== null && g !== undefined && !isNaN(g));
    if (scores.length === 0) { container.innerHTML = ''; return; }

    const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
    const max = Math.max(...scores);
    const min = Math.min(...scores);
    const passCount = scores.filter(s => s >= 55).length;
    const failCount = scores.length - passCount;
    const passRate = Math.round(passCount / scores.length * 100);

    // Distribution
    const dist = { '0-54': 0, '55-69': 0, '70-84': 0, '85-100': 0 };
    scores.forEach(s => {
        if (s < 55) dist['0-54']++;
        else if (s < 70) dist['55-69']++;
        else if (s < 85) dist['70-84']++;
        else dist['85-100']++;
    });
    const maxDist = Math.max(...Object.values(dist), 1);

    // Hard/Easy questions
    const hardMap = {}, easyMap = {};
    Object.values(gradeData).forEach(g => {
        (g.hardQuestions || '').split(',').map(q => q.trim()).filter(q => q).forEach(q => { hardMap[q] = (hardMap[q] || 0) + 1; });
        (g.easyQuestions || '').split(',').map(q => q.trim()).filter(q => q).forEach(q => { easyMap[q] = (easyMap[q] || 0) + 1; });
    });
    const hardSorted = Object.entries(hardMap).sort((a, b) => b[1] - a[1]);
    const easySorted = Object.entries(easyMap).sort((a, b) => b[1] - a[1]);

    // Struggling students
    const struggling = Object.values(gradeData).filter(g => g.grade < 55);

    let html = '<h3 style="font-size:18px;color:#00838F;margin:20px 0 12px;">ניתוח ציונים</h3>';

    // KPI Cards
    html += `<div class="kpi-row">
        <div class="kpi-card kpi-blue"><div class="kpi-value">${avg}</div><div class="kpi-label">ממוצע כיתתי</div></div>
        <div class="kpi-card ${passRate >= 70 ? 'kpi-green' : 'kpi-red'}"><div class="kpi-value">${passRate}%</div><div class="kpi-label">אחוז עוברים</div></div>
        <div class="kpi-card kpi-green"><div class="kpi-value">${max}</div><div class="kpi-label">ציון גבוה</div></div>
        <div class="kpi-card kpi-orange"><div class="kpi-value">${min}</div><div class="kpi-label">ציון נמוך</div></div>
    </div>`;

    // Bar chart
    const colors = { '0-54': '#EF5350', '55-69': '#FFA726', '70-84': '#42A5F5', '85-100': '#66BB6A' };
    html += '<div class="bar-chart">';
    for (const [range, count] of Object.entries(dist)) {
        const pct = Math.round(count / maxDist * 100);
        html += `<div class="bar-col">
            <div class="bar-val">${count}</div>
            <div class="bar" style="height:${Math.max(pct, 5)}%;background:${colors[range]}"></div>
            <div class="bar-label">${range}</div>
        </div>`;
    }
    html += '</div>';

    // Hard questions
    if (hardSorted.length > 0) {
        html += '<div class="insight-card"><h4>שאלות קשות (לפי מספר תלמידים שהתקשו)</h4><ul class="insight-list">';
        hardSorted.slice(0, 8).forEach(([q, count]) => {
            const pct = Math.round(count / scores.length * 100);
            html += `<li><span class="dot" style="background:#EF5350"></span> שאלה ${q} — ${count} תלמידים (${pct}%)</li>`;
        });
        html += '</ul></div>';
    }

    // Easy questions
    if (easySorted.length > 0) {
        html += '<div class="insight-card"><h4>שאלות קלות</h4><ul class="insight-list">';
        easySorted.slice(0, 5).forEach(([q, count]) => {
            const pct = Math.round(count / scores.length * 100);
            html += `<li><span class="dot" style="background:#66BB6A"></span> שאלה ${q} — ${count} תלמידים (${pct}%)</li>`;
        });
        html += '</ul></div>';
    }

    // Struggling students
    if (struggling.length > 0) {
        html += '<div class="insight-card"><h4 style="color:#C62828;">תלמידים מתקשים (מתחת ל-55)</h4><ul class="insight-list">';
        struggling.forEach(s => {
            html += `<li><span class="dot" style="background:#EF5350"></span> ${s.studentName} (${s.cls}) — ציון ${s.grade}</li>`;
        });
        html += '</ul></div>';
    }

    // Recommendations
    if (hardSorted.length > 0) {
        html += '<div class="insight-card"><h4>המלצות — על מה לחזור</h4><ul class="insight-list">';
        hardSorted.slice(0, 5).forEach(([q, count]) => {
            const pct = Math.round(count / scores.length * 100);
            html += `<li><span class="dot" style="background:#FF9800"></span> מומלץ לחזור על החומר של שאלה ${q} — ${pct}% מהתלמידים התקשו</li>`;
        });
        if (struggling.length > 0) {
            html += `<li><span class="dot" style="background:#C62828"></span> ${struggling.length} תלמידים צריכים תגבור אישי</li>`;
        }
        html += '</ul></div>';
    }

    container.innerHTML = html;
}

// ============================================
// INIT
// ============================================
function init() {
    renderGradeTabs(1); renderClassBar(1); renderSchedule();
    renderGradeTabs(2); renderClassBar(2);
    renderGradeTabs(3); renderClassBar(3);
    loadFromServer();
}
init();
</script>
</body>
