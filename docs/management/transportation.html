<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>מערכת הסעות — אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Dream Theme — לחלום.ליצור.להוביל */
  --dream:#8E7ED4;--dream-light:#D4CEF0;--dream-dark:#5B4BA0;
  --create:#E8B060;--create-light:#F5DEB0;--create-dark:#D48A2C;
  --lead:#3AACA0;--lead-light:#B8E4DE;--lead-dark:#1B7A6E;
  --spark:#E8909C;--spark-dark:#D45C6E;
  --bg:#fff;--bg-alt:#FAFBFC;--card:#fff;
  --text:#2C2622;--text-light:#6E6258;--text-lighter:#8C7E72;--muted:#6E6258;
  --border:#EDE6D8;--border-light:#fff;
  --primary:#3AACA0;--primary-dark:#1B7A6E;--primary-light:#B8E4DE;
  --accent:#E8B060;--accent-dark:#D48A2C;
  --success:#4CAF50;--success-bg:#E8F5E9;--warn:#E8B060;--warn-bg:#FFF3E0;
  --danger:#D45C6E;--danger-bg:#FCE7EA;--info:#5B9BD5;--info-bg:#E6F0FA;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 8px rgba(44,38,34,.05);--shadow-sm:0 2px 8px rgba(44,38,34,.05);
  --shadow-md:0 6px 20px rgba(44,38,34,.08);--shadow-lg:0 12px 40px rgba(44,38,34,.1);
}
body{font-family:var(--font-body);color:var(--text);background:#fff;line-height:1.7;min-height:100vh;
  position:relative;overflow-x:hidden}
h1,h2,h3,h4,h5,h6,.card-title,.section-title,.header-title{font-family:'Playpen Sans Hebrew','Heebo',sans-serif;font-weight:700}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.04) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.04) 0%,transparent 70%),
    radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.03) 0%,transparent 70%);
  pointer-events:none;z-index:0}

@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* HEADER */
.header{background:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100;height:60px;
  box-shadow:0 2px 12px rgba(0,0,0,.04);position:relative}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--dream),var(--create-dark),var(--lead-dark)));pointer-events:none}
.header-title{display:flex;align-items:center;gap:10px;font-family:var(--font-heading);font-size:1.1rem;font-weight:700}
.header-btn{background:#fff;border:1px solid var(--border);padding:6px 14px;border-radius:10px;
  font-family:var(--font-body);font-size:.82rem;font-weight:600;cursor:pointer;color:var(--text);transition:all .2s;
  text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.header-btn:hover{border-color:var(--primary);color:var(--primary)}

/* CONTAINER */
.container{max-width:1100px;margin:0 auto;padding:28px 24px;position:relative;z-index:1}

/* HERO */
.hero{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  padding:32px 36px;margin-bottom:28px;position:relative;overflow:hidden;
  animation:fadeInUp .4s ease;text-align:center}
.hero::before{content:'';position:absolute;top:0;right:0;left:0;height:5px;
  background:linear-gradient(90deg,var(--dream),var(--create-dark),var(--lead-dark)))}
.hero h1{font-family:var(--font-heading);font-size:1.9rem;font-weight:800;color:var(--text);margin-bottom:6px}
.hero .subtitle{font-family:var(--font-heading);font-size:1rem;font-weight:700;margin-bottom:8px;
  background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--text-light);font-size:.92rem;max-width:560px;margin:0 auto}
.hero-stats{display:flex;gap:12px;margin-top:22px;justify-content:center;flex-wrap:wrap}
.hero-stat{display:flex;align-items:center;gap:10px;background:var(--bg-alt);padding:10px 18px;
  border-radius:12px;border:1px solid rgba(0,0,0,.04)}
.hero-stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.hero-stat .h-num{font-family:var(--font-heading);font-size:1.4rem;font-weight:800;line-height:1;color:var(--text)}
.hero-stat .h-label{font-size:.72rem;color:var(--text-light)}

/* TABS */
.tabs-bar{display:flex;gap:8px;background:#fff;border-radius:var(--radius);padding:8px;
  box-shadow:var(--shadow);margin-bottom:24px;flex-wrap:wrap;border:1px solid var(--border)}
.tab-btn{flex:1;min-width:140px;background:transparent;border:none;padding:14px 18px;border-radius:12px;
  font-family:var(--font-heading);font-size:.95rem;font-weight:700;cursor:pointer;color:var(--text-light);
  transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px;position:relative}
.tab-btn:hover{background:var(--bg-alt);color:var(--text)}
.tab-btn.active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;
  box-shadow:0 4px 14px rgba(0,180,216,.3)}
.tab-btn.active.pink{background:linear-gradient(135deg,var(--accent),var(--accent-light));
  box-shadow:0 4px 14px rgba(232,67,147,.3)}
.tab-btn.active.teal{background:linear-gradient(135deg,var(--secondary),var(--secondary-light));
  box-shadow:0 4px 14px rgba(0,206,201,.3)}
.tab-btn.active.green{background:linear-gradient(135deg,#10b981,#34d399);
  box-shadow:0 4px 14px rgba(16,185,129,.3)}
.tab-btn.active.purple{background:linear-gradient(135deg,#8b5cf6,#a78bfa);
  box-shadow:0 4px 14px rgba(139,92,246,.3)}
.tab-btn .tab-count{font-size:.72rem;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-weight:700}
.tab-btn:not(.active) .tab-count{background:var(--bg-alt);color:var(--text-light)}

/* TAB CONTENT */
.tab-content{display:none;animation:fadeInUp .35s ease}
.tab-content.active{display:block}

/* SECTION CARD */
.card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
  padding:26px 28px;margin-bottom:22px;border:1px solid var(--border);
  position:relative;overflow:hidden}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.card-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:#fff;flex-shrink:0;background:linear-gradient(135deg,var(--primary),var(--secondary))}
.card-icon.pink{background:linear-gradient(135deg,var(--accent),var(--accent-light))}
.card-icon.teal{background:linear-gradient(135deg,var(--secondary),var(--secondary-light))}
.card-icon.green{background:linear-gradient(135deg,#10b981,#34d399)}
.card-icon.purple{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}

/* STOPS LIST */
.stops-list{display:flex;flex-direction:column;gap:8px}
.stop-item{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--bg-soft);
  border-radius:12px;border:1px solid var(--border);transition:all .2s;position:relative}
.stop-item:hover{border-color:var(--primary);background:#fff;transform:translateX(-2px)}
.stop-num{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);
  font-weight:800;font-size:.85rem;flex-shrink:0}
.stop-item.pink-stop .stop-num{background:linear-gradient(135deg,var(--accent),var(--accent-light))}
.stop-item.teal-stop .stop-num{background:linear-gradient(135deg,var(--secondary),var(--secondary-light))}
.stop-item.green-stop .stop-num{background:linear-gradient(135deg,#10b981,#34d399)}
.stop-item.purple-stop .stop-num{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}
.stop-name{flex:1;font-weight:600;font-size:.95rem;color:var(--text)}
.stop-time{font-family:var(--font-heading);font-weight:800;font-size:1rem;color:var(--primary-dark);
  background:#fff;padding:6px 14px;border-radius:10px;border:1px solid var(--border)}
.stop-empty{text-align:center;padding:30px;color:var(--text-light);font-style:italic;
  background:var(--bg-soft);border-radius:12px;border:1px dashed var(--border)}

/* SAFETY CARD */
.safety-card{background:linear-gradient(135deg,#fef3f2,#fff);border:1px solid #fecaca;
  border-radius:var(--radius);padding:20px 24px;margin-top:6px}
.safety-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.safety-header svg{color:#dc2626}
.safety-title{font-family:var(--font-heading);font-weight:800;color:#dc2626;font-size:1rem}
.safety-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.safety-list li{display:flex;align-items:flex-start;gap:10px;font-size:.9rem;color:var(--text)}
.safety-list li::before{content:'';width:6px;height:6px;border-radius:50%;background:#dc2626;
  margin-top:9px;flex-shrink:0}
.card-title{font-family:var(--font-heading);font-size:1.15rem;font-weight:800;flex:1}
.card-sub{font-size:.82rem;color:var(--text-light);margin-top:2px;font-family:var(--font-body)}

/* ROUTE INFO BADGES */
.route-badges{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.route-badge{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--bg-alt);
  border-radius:20px;font-size:.82rem;font-weight:600;color:var(--text);border:1px solid var(--border)}
.route-badge svg{color:var(--primary)}

/* MAP UPLOAD AREA */
.map-area{background:var(--bg-soft);border:2px dashed var(--border);border-radius:var(--radius);
  padding:24px;text-align:center;transition:all .25s;margin-bottom:6px;cursor:pointer}
.map-area:hover{border-color:var(--primary);background:rgba(0,180,216,.03)}
.map-area.has-image{padding:0;border-style:solid;border-color:var(--border);overflow:hidden;cursor:default}
.map-area img{max-width:100%;height:auto;display:block;border-radius:calc(var(--radius) - 4px)}
.map-placeholder{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;color:var(--text-light)}
.map-placeholder svg{color:var(--text-lighter)}
.map-placeholder strong{font-family:var(--font-heading);font-size:1rem;color:var(--text);font-weight:700}
.map-placeholder span{font-size:.85rem}
.map-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.map-input{display:none}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:10px;
  font-family:var(--font-body);font-size:.85rem;font-weight:600;cursor:pointer;border:none;
  transition:all .2s;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,180,216,.3)}
.btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary)}
.btn-pink{background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff}
.btn-pink:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(232,67,147,.3)}
.btn-whatsapp{background:linear-gradient(135deg,var(--whatsapp),var(--whatsapp-dark));color:#fff}
.btn-whatsapp:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(37,211,102,.35)}
.btn-danger{background:#fff;color:#dc2626;border:1px solid #fca5a5;padding:7px 12px;font-size:.78rem}
.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:6px 12px;font-size:.78rem}
.input-link{flex:1;min-width:200px;padding:9px 14px;border:1px solid var(--border);border-radius:10px;
  font-family:var(--font-body);font-size:.85rem;background:#fff;color:var(--text)}
.input-link:focus{outline:none;border-color:var(--primary)}

/* STUDENTS TABLE */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
.students-table{width:100%;border-collapse:collapse;background:#fff;font-size:.9rem}
.students-table th{background:linear-gradient(135deg,var(--bg-alt),#fff);padding:14px 12px;
  font-family:var(--font-heading);font-weight:700;text-align:right;color:var(--text);
  font-size:.85rem;border-bottom:2px solid var(--border);white-space:nowrap}
.students-table td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.students-table tr:last-child td{border-bottom:none}
.students-table tr:hover td{background:var(--bg-soft)}
.students-table input{width:100%;padding:7px 10px;border:1px solid transparent;border-radius:8px;
  font-family:var(--font-body);font-size:.88rem;background:transparent;color:var(--text)}
.students-table input:hover{background:#fff;border-color:var(--border)}
.students-table input:focus{outline:none;background:#fff;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(0,180,216,.1)}
.col-num{width:48px;text-align:center;color:var(--text-lighter);font-weight:700}
.col-actions{width:120px;text-align:center}
.empty-row td{text-align:center;padding:30px;color:var(--text-light);font-style:italic}

/* TABLE TOOLBAR */
.table-toolbar{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.toolbar-info{margin-right:auto;font-size:.82rem;color:var(--text-light)}

/* WHATSAPP BULK */
.whatsapp-bulk{margin-top:16px;padding:18px;background:linear-gradient(135deg,rgba(37,211,102,.06),rgba(37,211,102,.02));
  border:1px solid rgba(37,211,102,.2);border-radius:var(--radius)}
.whatsapp-bulk-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.whatsapp-bulk-header svg{color:var(--whatsapp)}
.whatsapp-bulk-title{font-family:var(--font-heading);font-weight:700;font-size:.95rem}
.whatsapp-textarea{width:100%;min-height:80px;padding:12px;border:1px solid var(--border);
  border-radius:10px;font-family:var(--font-body);font-size:.88rem;resize:vertical;background:#fff}
.whatsapp-textarea:focus{outline:none;border-color:var(--whatsapp)}

/* FOOTER */
.footer{text-align:center;padding:32px 0 24px;color:var(--text-lighter);font-size:.78rem}

@media(max-width:700px){
  .container{padding:18px 14px}
  .hero{padding:24px 20px}
  .hero h1{font-size:1.5rem}
  .card{padding:20px 18px}
  .header{padding:0 16px}
  .header-title{font-size:.92rem}
  .tab-btn{min-width:auto;padding:12px 10px;font-size:.82rem}
  .tab-btn .tab-label{display:none}
  .students-table{font-size:.82rem}
  .students-table td,.students-table th{padding:8px 6px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-title">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#hg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00b4d8"/><stop offset="100%" stop-color="#e84393"/></linearGradient></defs>
      <path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h.01"/><path d="M6 18h.01"/>
      <path d="M2 17.4V9.5C2 7.5 4 6 8 6h7c4 0 5 1.5 5 3.5v7.9c0 .9-.4 1.6-1 1.6H3c-.6 0-1-.7-1-1.6Z"/>
    </svg>
    מערכת הסעות
  </div>
  <a href="index.html" class="header-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    חזרה
  </a>
</header>

<div class="container">

  <div class="hero">
    <div class="subtitle">אורט בית הערבה · ירושלים</div>
    <h1>מערכת הסעות בית הספר</h1>
    <p>ניהול מסלולי הסעה, רשימות תלמידים, פרטי קשר ושליחת הודעות מרוכזות בוואטסאפ</p>
    <div class="hero-stats">
      <div class="hero-stat">
        <div class="hero-stat-icon" style="background:linear-gradient(135deg,#00b4d8,#48cae4)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M2 17.4V9.5C2 7.5 4 6 8 6h7c4 0 5 1.5 5 3.5v7.9c0 .9-.4 1.6-1 1.6H3c-.6 0-1-.7-1-1.6Z"/></svg>
        </div>
        <div><div class="h-num">4</div><div class="h-label">מסלולים</div></div>
      </div>
      <div class="hero-stat">
        <div class="hero-stat-icon" style="background:linear-gradient(135deg,#e84393,#fd79a8)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        </div>
        <div><div class="h-num" id="totalStudents">0</div><div class="h-label">תלמידים מוסעים</div></div>
      </div>
      <div class="hero-stat">
        <div class="hero-stat-icon" style="background:linear-gradient(135deg,#00cec9,#55efc4)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </div>
        <div><div class="h-num">הלוך/חזור</div><div class="h-label">פעיל יומיומי</div></div>
      </div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs-bar">
    <button class="tab-btn green active" data-tab="beit-shemesh">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span class="tab-label">בית שמש</span>
      <span class="tab-count" id="count-beit-shemesh">0</span>
    </button>
    <button class="tab-btn pink" data-tab="adam-pisgat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span class="tab-label">אדם ופסגת זאב</span>
      <span class="tab-count" id="count-adam-pisgat">0</span>
    </button>
    <button class="tab-btn teal" data-tab="maale-adumim">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span class="tab-label">מעלה אדומים</span>
      <span class="tab-count" id="count-maale-adumim">0</span>
    </button>
    <button class="tab-btn purple" data-tab="tzur-hadassah">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span class="tab-label">צור הדסה / מטה יהודה</span>
      <span class="tab-count" id="count-tzur-hadassah">0</span>
    </button>
  </div>

  <div class="tab-content active" id="tab-beit-shemesh"></div>
  <div class="tab-content" id="tab-adam-pisgat"></div>
  <div class="tab-content" id="tab-maale-adumim"></div>
  <div class="tab-content" id="tab-tzur-hadassah"></div>

  <div class="footer">
    מערכת הסעות · אורט בית הערבה · נשמר אוטומטית בדפדפן
  </div>

</div>

<script>
const ROUTES = {
  'beit-shemesh': {
    name: 'בית שמש',
    iconClass: 'green',
    direction: 'הלוך וחזור',
    pickupTime: 'יציאה 07:00 · הגעה ~07:55',
    description: 'מסלול הסעה יומי מבית שמש לבית הספר וחזרה',
    stops: [
      { name: 'רמה ה׳', time: '07:00' },
      { name: 'נחל דולב', time: '07:05' },
      { name: 'רמה ג׳', time: '07:10' },
      { name: 'אלישע הנביא', time: '07:15' },
      { name: 'השושן 4 א׳', time: '07:20' },

const SAFETY_RULES = [
  'יש להגיע לתחנה 5 דקות לפני השעה הקבועה',
  'חובה לחגור חגורות בטיחות',
  'שמירה על כללי התנהגות באוטובוס',
  'אין לעמוד במהלך הנסיעה'
];

const STORAGE_KEY = 'ort_transportation_v1';

function loadData(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveData(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let state = loadData();
// Initialize structure
Object.keys(ROUTES).forEach(key => {
  if (!state[key]) state[key] = { mapImage: null, mapLink: '', students: [] };
});

      <div class="map-actions">
        <button class="btn btn-whatsapp" onclick="sendBulkWhatsApp('${key}')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 0 1-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 0 1 8.413 3.488 11.824 11.824 0 0 1 3.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 0 1-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>

      <span class="safety-title">חשוב לדעת</span>

function renderRoute(key){
  document.getElementById('tab-' + key).innerHTML = buildRouteHTML(key);
  renderStudents(key);
  // Wire file input
  const fi = document.getElementById('file-' + key);
  if (fi) {
    fi.addEventListener('change', (e) => handleFileUpload(key, e));
  }
  // Drag-drop on map area
  const ma = document.getElementById('map-' + key);
  if (ma) {
    ma.addEventListener('click', (e) => {
      if (!state[key].mapImage) document.getElementById('file-' + key).click();
    });
    ma.addEventListener('dragover', (e) => { e.preventDefault(); ma.style.borderColor = '#00b4d8'; });
    ma.addEventListener('dragleave', (e) => { ma.style.borderColor = ''; });
    ma.addEventListener('drop', (e) => {
      e.preventDefault();
      ma.style.borderColor = '';
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) processImageFile(key, f);
    });
  }
}

function handleFileUpload(key, e){
  const f = e.target.files[0];
  if (f) processImageFile(key, f);
}

function processImageFile(key, file){
  const reader = new FileReader();
  reader.onload = (e) => {
    state[key].mapImage = e.target.result;
    saveData(state);
    renderRoute(key);
  };
  reader.readAsDataURL(file);
}

function saveLinkRoute(key){
  const v = document.getElementById('link-' + key).value.trim();
  state[key].mapLink = v;
  saveData(state);
  renderRoute(key);
}

function clearMap(key){
  if (!confirm('לנקות את מפת המסלול?')) return;
  state[key].mapImage = null;
  state[key].mapLink = '';
  saveData(state);
  renderRoute(key);
}

function renderStudents(key){
  const tbody = document.getElementById('tbody-' + key);
  const students = state[key].students;
  if (students.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="6">אין תלמידים מוסעים עדיין — לחצו על "הוסף תלמיד/ה" כדי להתחיל</td></tr>`;
  } else {
    tbody.innerHTML = students.map((s, i) => `
      <tr>
        <td class="col-num">${i + 1}</td>
        <td><input type="text" value="${escapeHtml(s.name)}" placeholder="שם מלא" oninput="updateStudent('${key}',${i},'name',this.value)"></td>
        <td><input type="text" value="${escapeHtml(s.class)}" placeholder="כיתה" oninput="updateStudent('${key}',${i},'class',this.value)"></td>
        <td><input type="text" value="${escapeHtml(s.pickup)}" placeholder="כתובת איסוף" oninput="updateStudent('${key}',${i},'pickup',this.value)"></td>
        <td><input type="tel" value="${escapeHtml(s.phone)}" placeholder="050-0000000" oninput="updateStudent('${key}',${i},'phone',this.value)"></td>
        <td class="col-actions">
          <button class="btn btn-whatsapp btn-sm" onclick="sendSingleWhatsApp('${key}',${i})" title="שלח הודעה בוואטסאפ">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 0 1-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 0 1 8.413 3.488 11.824 11.824 0 0 1 3.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 0 1-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
          </button>
          <button class="btn btn-danger btn-sm" onclick="removeStudent('${key}',${i})" title="הסר">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
          </button>
        </td>
      </tr>
    `).join('');
  }
  document.getElementById('info-' + key).textContent = students.length + ' תלמידים';
  document.getElementById('count-' + key).textContent = students.length;
  updateTotalCount();
}

function updateTotalCount(){
  const total = Object.keys(ROUTES).reduce((sum, k) => sum + (state[k]?.students?.length || 0), 0);
  document.getElementById('totalStudents').textContent = total;
}

function addStudent(key){
  state[key].students.push({ name: '', class: '', pickup: '', phone: '' });
  saveData(state);
  renderStudents(key);
}

function updateStudent(key, idx, field, value){
  state[key].students[idx][field] = value;
  saveData(state);
}

function removeStudent(key, idx){
  if (!confirm('להסיר את התלמיד/ה מהרשימה?')) return;
  state[key].students.splice(idx, 1);
  saveData(state);
  renderStudents(key);
}

function normalizePhone(phone){
  let p = (phone || '').replace(/\D/g, '');
  if (p.startsWith('0')) p = '972' + p.substring(1);
  else if (!p.startsWith('972')) p = '972' + p;
  return p;
}

function sendSingleWhatsApp(key, idx){
  const s = state[key].students[idx];
  if (!s.phone) { alert('אין מספר טלפון לתלמיד/ה זו'); return; }
  const msg = document.getElementById('msg-' + key).value || 'שלום, הודעה לגבי ההסעה';
  const personalMsg = `שלום ${s.name ? 'הורי ' + s.name : ''},\n\n${msg}`;
  const url = `https://wa.me/${normalizePhone(s.phone)}?text=${encodeURIComponent(personalMsg)}`;
  window.open(url, '_blank');
}

function sendBulkWhatsApp(key){
  const students = state[key].students.filter(s => s.phone);
  if (students.length === 0) { alert('אין תלמידים עם מספרי טלפון ברשימה'); return; }
  const msg = document.getElementById('msg-' + key).value;
  if (!msg.trim()) { alert('כתבו הודעה לפני השליחה'); return; }
  if (!confirm(`לשלוח את ההודעה ל-${students.length} הורים? ייפתח חלון וואטסאפ נפרד לכל אחד.`)) return;
  students.forEach((s, i) => {
    setTimeout(() => {
      const personalMsg = `שלום ${s.name ? 'הורי ' + s.name : ''},\n\n${msg}`;
      const url = `https://wa.me/${normalizePhone(s.phone)}?text=${encodeURIComponent(personalMsg)}`;
      window.open(url, '_blank');
    }, i * 600);
  });
}

function escapeHtml(t){
  return (t || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// Initial render
Object.keys(ROUTES).forEach(key => renderRoute(key));
</script>
