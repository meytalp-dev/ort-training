<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>דשבורד כרטיסי סיום שנה — אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Dream Theme — לחלום.ליצור.להוביל */
  --dream:#8E7ED4;--dream-light:#D4CEF0;--dream-dark:#5B4BA0;
  --create:#E8B060;--create-light:#F5DEB0;--create-dark:#D48A2C;
  --lead:#3AACA0;--lead-light:#B8E4DE;--lead-dark:#1B7A6E;
  --spark:#E8909C;--spark-dark:#D45C6E;
  --bg:#fff;--bg-alt:#FAFBFC;--card:#fff;
  --text:#2C2622;--text-light:#6E6258;--text-lighter:#8C7E72;--muted:#6E6258;
  --border:#EDE6D8;--border-light:#fff;
  --primary:#3AACA0;--primary-dark:#1B7A6E;--primary-light:#B8E4DE;
  --accent:#E8B060;--accent-dark:#D48A2C;
  --success:#4CAF50;--success-bg:#E8F5E9;--warn:#E8B060;--warn-bg:#FFF3E0;
  --danger:#D45C6E;--danger-bg:#FCE7EA;--info:#5B9BD5;--info-bg:#E6F0FA;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 8px rgba(44,38,34,.05);--shadow-sm:0 2px 8px rgba(44,38,34,.05);
  --shadow-md:0 6px 20px rgba(44,38,34,.08);--shadow-lg:0 12px 40px rgba(44,38,34,.1);
  --dim-belong:#E06090;--dim-respect:#5B9BD5;--dim-motiv:#E8A838;--dim-capable:#8B6BC0;--dim-auto:#7AB648;
}
body{font-family:Heebo,sans-serif;background:#fff;color:var(--text);min-height:100vh}
h1,h2,h3,h4,h5,h6,.card-title,.section-title,.header-title{font-family:'Playpen Sans Hebrew','Heebo',sans-serif;font-weight:700}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.04) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.04) 0%,transparent 70%),
    radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.03) 0%,transparent 70%);
  pointer-events:none;z-index:0}

.container{max-width:960px;margin:0 auto;padding:24px}

/* === HEADER === */
.dash-header{
  background:var(--card);border-radius:24px;border:1px solid var(--border);
  box-shadow:var(--shadow-md);padding:32px;margin-bottom:24px;
  position:relative;overflow:hidden;
}
.dash-header::before{
  content:'';position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--dim-motiv),var(--dim-respect),var(--dim-capable));
}
.header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-top h1{font-size:1.5rem;font-weight:800}
.header-meta{display:flex;gap:16px;flex-wrap:wrap}
.meta-badge{
  display:inline-flex;align-items:center;gap:6px;padding:6px 14px;
  border-radius:20px;font-size:.82rem;font-weight:600;
}
.meta-badge svg{width:16px;height:16px}
.meta-badge.total{background:rgba(58,172,160,.12);color:var(--primary-dark)}
.meta-badge.date{background:rgba(232,176,96,.1);color:var(--warn)}
.refresh-btn{
  border:1.5px solid var(--border);background:var(--card);border-radius:12px;
  padding:8px 16px;font-family:Heebo;font-size:.82rem;font-weight:600;
  color:var(--muted);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;
}
.refresh-btn:hover{border-color:var(--primary);color:var(--primary-dark)}
.refresh-btn svg{width:16px;height:16px}

/* === LOADING === */
.loading-state{text-align:center;padding:80px 24px;color:var(--muted)}
.loading-state svg{width:48px;height:48px;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* === SUMMARY CARDS === */
.summary-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.summary-card{
  background:var(--card);border-radius:18px;border:1px solid var(--border);
  box-shadow:var(--shadow-sm);padding:20px;position:relative;overflow:hidden;
}
.summary-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;border-radius:0 4px 4px 0}
.summary-card.sc-goals::before{background:var(--dim-motiv)}
.summary-card.sc-support::before{background:var(--dim-respect)}
.summary-card.sc-strengths::before{background:var(--dim-capable)}
.sc-label{font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:6px}
.sc-value{font-size:1.8rem;font-weight:800;margin-bottom:2px}
.sc-sub{font-size:.78rem;color:var(--muted)}

/* === PATTERNS === */
.patterns-section{
  background:var(--card);border-radius:20px;border:1px solid var(--border);
  box-shadow:var(--shadow-sm);padding:28px;margin-bottom:24px;
}
.section-title{font-size:1.1rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title svg{width:20px;height:20px}
.pattern-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.pattern-card{
  background:var(--bg);border-radius:14px;padding:16px;
  border:1px solid var(--border);
}
.pattern-card h4{font-size:.88rem;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pattern-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pattern-items{list-style:none;font-size:.82rem;color:var(--text);line-height:1.8}
.pattern-items li{display:flex;align-items:flex-start;gap:6px}
.pattern-items li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--border);flex-shrink:0;margin-top:8px}
.pattern-count{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;border-radius:11px;font-size:.7rem;font-weight:700;
  padding:0 6px;margin-right:4px;
}

/* === TEACHER CARDS === */
.teachers-section{margin-bottom:24px}
.teacher-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.teacher-card{
  background:var(--card);border-radius:18px;border:1px solid var(--border);
  box-shadow:var(--shadow-sm);padding:24px;transition:all .2s;position:relative;
}
.teacher-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.teacher-name{font-size:1.05rem;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.teacher-avatar{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.82rem;font-weight:700;color:#fff;flex-shrink:0;
}
.field-block{margin-bottom:12px}
.field-block:last-child{margin-bottom:0}
.field-label{
  font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
  margin-bottom:4px;display:flex;align-items:center;gap:5px;
}
.field-label .fl-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.field-label.goal{color:var(--dim-motiv)}.field-label.goal .fl-dot{background:var(--dim-motiv)}
.field-label.support{color:var(--dim-respect)}.field-label.support .fl-dot{background:var(--dim-respect)}
.field-label.strength{color:var(--dim-capable)}.field-label.strength .fl-dot{background:var(--dim-capable)}
.field-text{font-size:.85rem;line-height:1.6;color:var(--text)}
.teacher-date{position:absolute;top:16px;left:16px;font-size:.7rem;color:var(--border)}

/* === EMPTY === */
.empty-state{
  text-align:center;padding:80px 24px;
  background:var(--card);border-radius:24px;border:1px solid var(--border);
}
.empty-state svg{width:64px;height:64px;margin-bottom:16px;color:var(--border)}
.empty-state h3{font-size:1.1rem;font-weight:700;margin-bottom:6px}
.empty-state p{color:var(--muted);font-size:.88rem}

/* === FOOTER === */
.dash-footer{text-align:center;padding:24px;font-size:.75rem;color:var(--muted)}

/* === RESPONSIVE === */
@media(max-width:600px){
  .container{padding:12px}
  .dash-header{padding:24px 20px}
  .header-top h1{font-size:1.2rem}
  .summary-row{grid-template-columns:1fr}
  .teacher-grid{grid-template-columns:1fr}
}
@media print{
  body{background:#fff}
  body::before{display:none}
  .refresh-btn{display:none}
  .teacher-card{break-inside:avoid;box-shadow:none;border:1px solid #ddd}
}
</style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="dash-header">
    <div class="header-top">
      <h1>כרטיסי סיום שנה</h1>
      <button class="refresh-btn" onclick="loadData()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
        רענון
      </button>
    </div>
    <div class="header-meta" id="metaArea"></div>
  </div>

  <!-- LOADING -->
  <div class="loading-state" id="loadingState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10" stroke-dasharray="30 70"><animateTransform attributeName="transform" type="rotate" values="0 12 12;360 12 12" dur=".8s" repeatCount="indefinite"/></circle></svg>
    <div>טוען נתונים...</div>
  </div>

  <!-- CONTENT (hidden until loaded) -->
  <div id="content" style="display:none">
    <!-- SUMMARY -->
    <div class="summary-row" id="summaryRow"></div>

    <!-- PATTERNS -->
    <div class="patterns-section" id="patternsSection" style="display:none">
      <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 002 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0022 16z"/></svg>
        דפוסים חוזרים
      </div>
      <div class="pattern-grid" id="patternGrid"></div>
    </div>

    <!-- TEACHERS -->
    <div class="teachers-section">
      <div class="section-title" style="margin-bottom:16px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        כרטיסים אישיים
      </div>
      <div class="teacher-grid" id="teacherGrid"></div>
    </div>
  </div>

  <!-- EMPTY -->
  <div class="empty-state" id="emptyState" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v4m0 4h.01"/></svg>
    <h3>אין כרטיסים עדיין</h3>
    <p>ברגע שמורים ימלאו את כרטיס סיום השנה — הנתונים יופיעו כאן</p>
  </div>
</div>

<div class="dash-footer">אורט בית הערבה &middot; דשבורד כרטיסי סיום שנה תשפ"ו</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwzddi-gCLNdZBLYIhz17w_O5HESymDOT5FRJD_PphE-uLUfvNmBdeBfIujuVfz8O-IgQ/exec';

const COLORS = ['#3AACA0','#E06090','#5B9BD5','#E8A838','#8B6BC0','#7AB648','#E8B060','#D45C6E','#4CAF50','#D48A2C'];

function getColor(i){ return COLORS[i % COLORS.length] }

async function loadData(){
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  document.getElementById('emptyState').style.display = 'none';

  let rows = [];
  try {
    // JSONP approach for cross-origin
    rows = await new Promise((resolve, reject) => {
      const cb = 'formCb_' + Date.now();
      window[cb] = function(res){
        delete window[cb];
        document.getElementById('jsonpScript')?.remove();
        resolve(res.rows || []);
      };
      const s = document.createElement('script');
      s.id = 'jsonpScript';
      // Use POST via fetch as primary
      fetch(API, {
        method: 'POST',
        body: JSON.stringify({ action: 'getForm', sheet: 'כרטיס סיום שנה' }),
        headers: {'Content-Type':'text/plain'}
      })
      .then(r => r.json())
      .then(res => resolve(res.rows || []))
      .catch(() => resolve([]));
    });
  } catch(e) {
    rows = [];
  }

  document.getElementById('loadingState').style.display = 'none';

  if(!rows.length){
    document.getElementById('emptyState').style.display = 'block';
    return;
  }

  document.getElementById('content').style.display = 'block';
  renderMeta(rows);
  renderSummary(rows);
  renderPatterns(rows);
  renderTeachers(rows);
}

function renderMeta(rows){
  const dates = rows.map(r => r['תאריך']).filter(Boolean);
  const latest = dates.length ? new Date(dates[dates.length-1]).toLocaleDateString('he-IL') : '';
  document.getElementById('metaArea').innerHTML = `
    <span class="meta-badge total">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      ${rows.length} כרטיסים
    </span>
    ${latest ? `<span class="meta-badge date">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      עדכון: ${latest}
    </span>` : ''}
  `;
}

function renderSummary(rows){
  const goals = rows.filter(r => r['יעד']).length;
  const supports = rows.filter(r => r['מה יעזור']).length;
  const strengths = rows.filter(r => r['חוזקה']).length;

  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-card sc-goals">
      <div class="sc-label">יעדים שהוגדרו</div>
      <div class="sc-value">${goals}</div>
      <div class="sc-sub">מתוך ${rows.length} מורים</div>
    </div>
    <div class="summary-card sc-support">
      <div class="sc-label">בקשות תמיכה</div>
      <div class="sc-value">${supports}</div>
      <div class="sc-sub">דברים שהצוות צריך ממך</div>
    </div>
    <div class="summary-card sc-strengths">
      <div class="sc-label">חוזקות שזוהו</div>
      <div class="sc-value">${strengths}</div>
      <div class="sc-sub">מה הצוות כבר יודע לעשות טוב</div>
    </div>
  `;
}

function renderPatterns(rows){
  // Extract keywords/themes from text fields
  const goalTexts = rows.map(r => r['יעד'] || '').filter(Boolean);
  const supportTexts = rows.map(r => r['מה יעזור'] || '').filter(Boolean);
  const strengthTexts = rows.map(r => r['חוזקה'] || '').filter(Boolean);

  const goalKeywords = extractThemes(goalTexts);
  const supportKeywords = extractThemes(supportTexts);
  const strengthKeywords = extractThemes(strengthTexts);

  const hasPatterns = goalKeywords.length || supportKeywords.length || strengthKeywords.length;
  const section = document.getElementById('patternsSection');

  if(!hasPatterns || rows.length < 2){
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';
  let html = '';

  if(goalKeywords.length){
    html += `<div class="pattern-card">
      <h4><span class="pattern-dot" style="background:var(--dim-motiv)"></span> יעדים — נושאים חוזרים</h4>
      <ul class="pattern-items">${goalKeywords.map(k =>
        `<li><span class="pattern-count" style="background:rgba(232,168,56,.12);color:var(--dim-motiv)">${k.count}</span>${k.word}</li>`
      ).join('')}</ul>
    </div>`;
  }

  if(supportKeywords.length){
    html += `<div class="pattern-card">
      <h4><span class="pattern-dot" style="background:var(--dim-respect)"></span> מה הצוות צריך</h4>
      <ul class="pattern-items">${supportKeywords.map(k =>
        `<li><span class="pattern-count" style="background:rgba(91,155,213,.12);color:var(--dim-respect)">${k.count}</span>${k.word}</li>`
      ).join('')}</ul>
    </div>`;
  }

  if(strengthKeywords.length){
    html += `<div class="pattern-card">
      <h4><span class="pattern-dot" style="background:var(--dim-capable)"></span> חוזקות הצוות</h4>
      <ul class="pattern-items">${strengthKeywords.map(k =>
        `<li><span class="pattern-count" style="background:rgba(139,107,192,.12);color:var(--dim-capable)">${k.count}</span>${k.word}</li>`
      ).join('')}</ul>
    </div>`;
  }

  document.getElementById('patternGrid').innerHTML = html;
}

function extractThemes(texts){
  if(texts.length < 2) return [];

  // Common Hebrew educational keywords to look for
  const keywords = [
    {pattern:/תלמיד|תלמידים|תלמידות/,label:'תלמידים'},
    {pattern:/תכנון|תכנית|לתכנן/,label:'תכנון'},
    {pattern:/זמן|שעה|שעות/,label:'זמן'},
    {pattern:/קשר|קשרים|קשר אישי/,label:'קשר אישי'},
    {pattern:/פרויקט|פרויקטים/,label:'פרויקטים'},
    {pattern:/שגרה|שגרות/,label:'שגרה'},
    {pattern:/צוות|צוותי|קולגה/,label:'עבודת צוות'},
    {pattern:/למידה|ללמוד|הוראה/,label:'למידה/הוראה'},
    {pattern:/תמיכה|עזרה|ליווי/,label:'תמיכה וליווי'},
    {pattern:/רגש|רגשי|רגשית/,label:'רגשי'},
    {pattern:/כיתה|כיתות/,label:'ניהול כיתה'},
    {pattern:/הורים|הורה/,label:'הורים'},
    {pattern:/הערכה|מבחן|ציונים/,label:'הערכה'},
    {pattern:/יצירתי|יצירתיות|חדשנות/,label:'יצירתיות'},
    {pattern:/סדר|ארגון|מסודר/,label:'סדר וארגון'},
    {pattern:/הקשבה|שיחה|דיאלוג/,label:'הקשבה'},
    {pattern:/בגרות|בגרויות/,label:'בגרויות'},
    {pattern:/מוטיבציה|הנעה/,label:'מוטיבציה'},
  ];

  const found = [];
  keywords.forEach(kw => {
    const count = texts.filter(t => kw.pattern.test(t)).length;
    if(count >= 2) found.push({word: kw.label, count});
  });

  found.sort((a,b) => b.count - a.count);
  return found.slice(0, 5);
}

function renderTeachers(rows){
  const grid = document.getElementById('teacherGrid');
  grid.innerHTML = rows.map((r, i) => {
    const name = r['שם'] || 'ללא שם';
    const initial = name.charAt(0);
    const date = r['תאריך'] ? new Date(r['תאריך']).toLocaleDateString('he-IL') : '';
    const goal = r['יעד'] || '';
    const support = r['מה יעזור'] || '';
    const strength = r['חוזקה'] || '';

    return `<div class="teacher-card">
      ${date ? `<span class="teacher-date">${date}</span>` : ''}
      <div class="teacher-name">
        <span class="teacher-avatar" style="background:${getColor(i)}">${initial}</span>
        ${name}
      </div>
      ${goal ? `<div class="field-block">
        <div class="field-label goal"><span class="fl-dot"></span>יעד</div>
        <div class="field-text">${goal}</div>
      </div>` : ''}
      ${support ? `<div class="field-block">
        <div class="field-label support"><span class="fl-dot"></span>מה יעזור</div>
        <div class="field-text">${support}</div>
      </div>` : ''}
      ${strength ? `<div class="field-block">
        <div class="field-label strength"><span class="fl-dot"></span>חוזקה</div>
        <div class="field-text">${strength}</div>
      </div>` : ''}
    </div>`;
  }).join('');
}

// Load on page open
loadData();
</script>
</body>
</html>
