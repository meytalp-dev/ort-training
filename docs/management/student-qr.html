<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הפקת QR אישי — אורט בית הערבה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="student-data.js"></script>
<style>
  :root{
  /* Dream Theme — לחלום.ליצור.להוביל */
  --dream:#8E7ED4;--dream-light:#D4CEF0;--dream-dark:#5B4BA0;
  --create:#E8B060;--create-light:#F5DEB0;--create-dark:#D48A2C;
  --lead:#3AACA0;--lead-light:#B8E4DE;--lead-dark:#1B7A6E;
  --spark:#E8909C;--spark-dark:#D45C6E;
  --bg:#fff;--bg-alt:#FAFBFC;--card:#fff;
  --text:#2C2622;--text-light:#6E6258;--text-lighter:#8C7E72;--muted:#6E6258;
  --border:#EDE6D8;--border-light:#F5F0E8;
  --primary:#3AACA0;--primary-dark:#1B7A6E;--primary-light:#B8E4DE;
  --accent:#E8B060;--accent-dark:#D48A2C;
  --success:#4CAF50;--success-bg:#E8F5E9;--warn:#E8B060;--warn-bg:#FFF3E0;
  --danger:#D45C6E;--danger-bg:#FCE7EA;--info:#5B9BD5;--info-bg:#E6F0FA;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 8px rgba(44,38,34,.05);--shadow-sm:0 2px 8px rgba(44,38,34,.05);
  --shadow-md:0 6px 20px rgba(44,38,34,.08);--shadow-lg:0 12px 40px rgba(44,38,34,.1);
}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Heebo',sans-serif; background:var(--cream); color:var(--text); padding:24px}
  .wrap{max-width:1000px; margin:0 auto}
  h1{font-family:'Playpen Sans Hebrew',sans-serif; font-size:2rem; color:var(--cyan); margin-bottom:8px}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.04) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.04) 0%,transparent 70%),
    radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.03) 0%,transparent 70%);
  pointer-events:none;z-index:0}
  .sub{color:var(--muted); margin-bottom:24px}
  .controls{background:var(--card); padding:20px; border-radius:20px; border:1px solid var(--border); margin-bottom:24px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
  .controls select, .controls input{padding:10px 14px; border:1px solid var(--border); border-radius:12px; font-family:inherit; font-size:.95rem}
  .controls button{padding:12px 20px; background:var(--cyan); color:#fff; border:none; border-radius:12px; font-family:inherit; font-weight:700; cursor:pointer}
  .controls button.secondary{background:var(--pink)}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px}
  .qr-card{
    background:var(--card); border:2px dashed var(--border); border-radius:20px;
    padding:20px; text-align:center; page-break-inside:avoid;
  }
  .qr-card img{width:180px; height:180px; display:block; margin:0 auto 12px}
  .qr-card .name{font-weight:800; font-size:1.1rem; font-family:'Playpen Sans Hebrew',sans-serif}
  .qr-card .meta{font-size:.85rem; color:var(--muted); margin-top:4px}
  .qr-card .id-num{font-size:.8rem; color:var(--cyan); margin-top:6px; font-family:monospace}
  @media print{
    body{background:#fff; padding:10px}
    .controls, h1, .sub{display:none}
    .qr-card{border-color:#ccc}
    .grid{grid-template-columns:repeat(3,1fr); gap:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>הפקת QR אישי לתלמידים</h1>
  <div class="sub">סריקת ה-QR בעמדת הכניסה ובמרכז הלמידה. הדפסת הכרטיסים: Ctrl+P</div>

  <div class="controls">
    <label>סינון לפי כיתה:</label>
    <select id="classFilter" onchange="render()">
      <option value="">כל הכיתות</option>
    </select>
    <input type="text" id="searchInput" placeholder="חיפוש לפי שם..." oninput="render()">
    <button onclick="window.print()">הדפס</button>
    <button class="secondary" onclick="downloadAll()">הורד הכל (ZIP)</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const classes = [...new Set(STUDENTS.map(s => s.cls))].sort();
const sel = document.getElementById('classFilter');
classes.forEach(c => sel.innerHTML += '<option value="'+c+'">'+c+'</option>');

// בונה URL אישי של learning-center.html עם מזהה התלמיד
function buildStudentUrl(studentId){
  const base = window.location.origin + window.location.pathname.replace(/student-qr\.html.*$/, 'learning-center.html');
  return base + '?sid=' + studentId;
}
function qrUrl(text, size){
  return 'https://api.qrserver.com/v1/create-qr-code/?size='+(size||180)+'x'+(size||180)+'&data='+encodeURIComponent(text);
}

function render(){
  const cls = document.getElementById('classFilter').value;
  const q = document.getElementById('searchInput').value.trim();
  const filtered = STUDENTS.filter(s => {
    if (cls && s.cls !== cls) return false;
    if (q && !(s.first+' '+s.last).includes(q)) return false;
    return true;
  });
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  filtered.forEach(s => {
    const card = document.createElement('div');
    card.className = 'qr-card';
    const img = document.createElement('img');
    img.alt = 'QR';
    img.setAttribute('src', qrUrl(buildStudentUrl(s.id)));
    card.appendChild(img);
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = s.first + ' ' + s.last;
    card.appendChild(name);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = 'כיתה ' + s.cls;
    card.appendChild(meta);
    const idNum = document.createElement('div');
    idNum.className = 'id-num';
    idNum.textContent = 'ID: ' + s.id;
    card.appendChild(idNum);
    grid.appendChild(card);
  });
}

function downloadAll(){
  alert('להורדה בכמות: השתמשי ב"הדפס" ושמרי כ-PDF. לצורך שליחה אישית — לחיצה ימנית על QR → שמירה.');
}

render();
</script>
</body>
</html>
