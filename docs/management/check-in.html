<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עמדת כניסה — אורט בית הערבה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="student-data.js"></script>
<style>
  :root{
  /* Dream Theme — לחלום.ליצור.להוביל */
  --dream:#8E7ED4;--dream-light:#D4CEF0;--dream-dark:#5B4BA0;
  --create:#E8B060;--create-light:#F5DEB0;--create-dark:#D48A2C;
  --lead:#3AACA0;--lead-light:#B8E4DE;--lead-dark:#1B7A6E;
  --spark:#E8909C;--spark-dark:#D45C6E;
  --bg:#fff;--bg-alt:#FAFBFC;--card:#fff;
  --text:#2C2622;--text-light:#6E6258;--text-lighter:#8C7E72;--muted:#6E6258;
  --border:#EDE6D8;--border-light:#fff;
  --primary:#3AACA0;--primary-dark:#1B7A6E;--primary-light:#B8E4DE;
  --accent:#E8B060;--accent-dark:#D48A2C;
  --success:#4CAF50;--success-bg:#E8F5E9;--warn:#E8B060;--warn-bg:#FFF3E0;
  --danger:#D45C6E;--danger-bg:#FCE7EA;--info:#5B9BD5;--info-bg:#E6F0FA;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 8px rgba(44,38,34,.05);--shadow-sm:0 2px 8px rgba(44,38,34,.05);
  --shadow-md:0 6px 20px rgba(44,38,34,.08);--shadow-lg:0 12px 40px rgba(44,38,34,.1);
}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Heebo',sans-serif; background:var(--cream); color:var(--text);
    min-height:100vh; position:relative; padding:24px 20px 40px;
  }
  body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.04) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.04) 0%,transparent 70%),
    radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.03) 0%,transparent 70%);
  pointer-events:none;z-index:0}
  .wrap{position:relative; z-index:1; max-width:1100px; margin:0 auto}
  .clock-row{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:24px}
  .clock{
    font-family:'Playpen Sans Hebrew',sans-serif; font-weight:800;
    font-size:clamp(3rem,8vw,5.5rem); color:var(--text); line-height:1; letter-spacing:-2px;
  }
  .date{font-size:clamp(1rem,2vw,1.3rem); color:var(--muted); font-weight:600}

  .main-grid{display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:stretch}
  @media (max-width:900px){ .main-grid{grid-template-columns:1fr} }

  .panel{
    background:var(--card); border-radius:28px; box-shadow:var(--shadow);
    padding:28px; display:flex; flex-direction:column;
  }
  .panel h2{
    font-family:'Playpen Sans Hebrew',sans-serif; font-size:1.6rem; font-weight:800;
    color:var(--cyan); margin-bottom:6px; text-align:center;
  }
  .panel .sub{color:var(--muted); font-size:1rem; margin-bottom:20px; text-align:center; font-weight:600}

  /* QR panel */
  .qr-panel{align-items:center}
  .qr-big{
    background:#fff; padding:20px; border-radius:24px; border:3px solid var(--cyan);
    box-shadow:0 4px 20px rgba(6,182,212,.2);
  }
  .qr-big img{display:block; width:320px; height:320px; max-width:100%}
  .qr-help{
    margin-top:22px; text-align:center; font-size:1.05rem; color:var(--text); font-weight:600; line-height:1.6;
  }
  .qr-help strong{color:var(--cyan)}
  .qr-steps{
    margin-top:16px; padding:18px; background:#ecfeff; border-radius:18px; width:100%;
    text-align:right; font-size:.95rem; color:var(--text); line-height:1.7;
  }
  .qr-steps ol{padding-inline-start:22px}
  .qr-steps li{margin-bottom:4px}

  /* Manual panel */
  .manual-panel .sub{color:var(--pink)}
  .search-box{
    width:100%; padding:16px 20px; border:2px solid var(--border); border-radius:18px;
    font-family:inherit; font-size:1.1rem; margin-bottom:14px;
  }
  .search-box:focus{outline:none; border-color:var(--pink)}
  .student-list{
    flex:1; overflow-y:auto; max-height:440px; border:1px solid var(--border);
    border-radius:18px; padding:8px;
  }
  .student-item{
    padding:14px 18px; border-radius:14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    font-size:1rem; font-weight:600; transition:.15s; margin-bottom:4px;
  }
  .student-item:hover{background:#fdf2f8}
  .student-item .cls-badge{
    background:#f3f4f6; padding:4px 12px; border-radius:100px; font-size:.82rem; color:var(--muted); font-weight:700;
  }
  .empty-list{text-align:center; padding:40px 20px; color:var(--muted)}

  /* Feedback overlay */
  .feedback{
    position:fixed; inset:0; background:var(--card); z-index:100;
    display:none; align-items:center; justify-content:center; flex-direction:column;
    padding:40px; text-align:center; animation:fadeIn .3s;
  }
  .feedback.show{display:flex}
  .feedback.success{background:linear-gradient(135deg,#ecfdf5,#d1fae5)}
  .feedback.late{background:linear-gradient(135deg,#fef3c7,#fde68a)}
  .feedback.error{background:linear-gradient(135deg,#fee2e2,#fecaca)}
  .feedback .icon{
    width:140px; height:140px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    margin-bottom:24px; background:var(--card);
  }
  .feedback.success .icon{color:var(--success)}
  .feedback.late .icon{color:var(--warning)}
  .feedback.error .icon{color:var(--danger)}
  .feedback .icon svg{width:80px; height:80px}
  .feedback .headline{
    font-family:'Playpen Sans Hebrew',sans-serif; font-weight:800;
    font-size:clamp(2.5rem,6vw,4.5rem); margin-bottom:16px;
  }
  .feedback .subline{
    font-size:clamp(1.3rem,2.8vw,2rem); color:var(--text); max-width:800px; line-height:1.4; font-weight:600;
  }
  .feedback .stay-required{
    margin-top:24px; padding:20px 40px; background:var(--card); border-radius:20px;
    font-size:clamp(1.5rem,3vw,2.2rem); font-weight:800; color:var(--warning);
  }
  .feedback .countdown{margin-top:32px; font-size:1.2rem; color:var(--muted); font-weight:600}
  .feedback .undo-btn{
    margin-top:20px; padding:14px 32px; background:var(--card); border:2px solid var(--danger);
    border-radius:16px; color:var(--danger); font-family:inherit; font-size:1.05rem; font-weight:800;
    cursor:pointer; transition:.2s;
  }
  .feedback .undo-btn:hover{background:var(--danger); color:#fff}
  .feedback .undo-btn[disabled]{opacity:.4; cursor:not-allowed}
  @keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>

<div class="wrap">
  <div class="clock-row">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date">---</div>
  </div>

  <div class="main-grid">

    <!-- פאנל QR — לתלמידים -->
    <div class="panel qr-panel">
      <h2>סריקה עם הטלפון</h2>
      <div class="sub">כוון את מצלמת הטלפון אל ה-QR</div>
      <div class="qr-big"><img id="stationQr" alt="QR"></div>
      <div class="qr-help">נפתח ישירות במרכז הלמידה<br>ללא הורדת אפליקציה</div>
      <div class="qr-steps">
        <ol>
          <li>פתחי את אפליקציית <strong>המצלמה</strong> בטלפון</li>
          <li>כווני למסך הזה — ה-QR יזוהה אוטומטית</li>
          <li>לחצי על ההתראה שנפתחת למעלה</li>
          <li>בחרי את שמך מהרשימה בפעם הראשונה</li>
        </ol>
      </div>
    </div>

    <!-- פאנל ידני — למנו -->
    <div class="panel manual-panel">
      <h2>רישום ידני</h2>
      <div class="sub">למנו/שומר — אם תלמיד לא מצליח</div>
      <input class="search-box" id="searchBox" type="text" placeholder="חיפוש תלמיד לפי שם או כיתה...">
      <div class="student-list" id="studentList"></div>
    </div>

  </div>
</div>

<div class="feedback" id="feedback">
  <div class="icon" id="fbIcon"></div>
  <div class="headline" id="fbHeadline"></div>
  <div class="subline" id="fbSubline"></div>
  <div class="stay-required" id="fbStay" style="display:none"></div>
  <button class="undo-btn" id="fbUndoBtn" style="display:none" onclick="undoLastRegistration()">ביטול רישום (טעות)</button>
  <div class="countdown" id="fbCountdown"></div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxRvmeIURPFfIE6RWqrNQ2RxzzKv9JJAdxxRbaVoQg2f7x-51pm2DUIA2fvubYB6bpR/exec';
const DEMO_MODE = APPS_SCRIPT_URL.indexOf('REPLACE') >= 0;
let lastEventId = null;  // לביטול רישום אחרון

// ============ STATION QR ============
// ה-QR מצביע על דף מרכז הלמידה — כשסורקים, הדף נפתח בטלפון
function buildLearningCenterUrl(){
  const base = window.location.origin + window.location.pathname.replace(/check-in\.html.*$/, 'learning-center.html');
  return base;
}
function qrImageUrl(text, size){
  return 'https://api.qrserver.com/v1/create-qr-code/?size='+(size||320)+'x'+(size||320)+'&data='+encodeURIComponent(text);
}
document.getElementById('stationQr').setAttribute('src', qrImageUrl(buildLearningCenterUrl(), 320));

// ============ CLOCK ============
function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  document.getElementById('date').textContent = now.toLocaleDateString('he-IL', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
}
updateClock(); setInterval(updateClock, 1000);

// ============ STUDENT LIST (manual fallback) ============
function renderStudentList(query){
  const q = (query||'').trim();
  const filtered = STUDENTS.filter(s => {
    if (!q) return true;
    return (s.first+' '+s.last).includes(q) || s.cls.includes(q);
  });
  const list = document.getElementById('studentList');
  if (filtered.length === 0){
    list.innerHTML = '<div class="empty-list">לא נמצא תלמיד</div>';
    return;
  }
  list.innerHTML = '';
  filtered.slice(0, 60).forEach(s => {
    const item = document.createElement('div');
    item.className = 'student-item';
    const name = document.createElement('span');
    name.textContent = s.first + ' ' + s.last;
    const cls = document.createElement('span');
    cls.className = 'cls-badge';
    cls.textContent = s.cls;
    item.appendChild(name);
    item.appendChild(cls);
    item.onclick = () => identifyStudent(s);
    list.appendChild(item);
  });
}
renderStudentList('');
document.getElementById('searchBox').addEventListener('input', e => renderStudentList(e.target.value));

// ============ IDENTIFY (manu taps a student) ============
function extractPhone(parentStr){
  if (!parentStr) return '';
  const m = parentStr.match(/0\d{8,9}/);
  return m ? '972'+m[0].substring(1) : '';
}

async function identifyStudent(student){
  const payload = {
    action:'checkin',
    studentId: student.id,
    student:{
      id: student.id,
      name: student.first+' '+student.last,
      cls: student.cls,
      megama: student.megama || '',
      parentPhone: extractPhone(student.parent1) || extractPhone(student.parent2)
    }
  };
  try {
    let data;
    if (DEMO_MODE){
      const now = new Date();
      const lateMin = now.getHours() < 8 ? 0 : Math.max(25, (now.getHours()-8)*60 + now.getMinutes());
      data = lateMin <= 0
        ? { ok:true, status:'on_time', studentName: student.first }
        : { ok:true, status:'late', eventId:'DEMO'+Date.now(), lateMinutes:lateMin, requiredMinutes: Math.min(lateMin, 60), studentName: student.first };
    } else {
      const res = await fetch(APPS_SCRIPT_URL, {
        method:'POST', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify(payload)
      });
      data = await res.json();
    }
    if (!data.ok){ showFeedback('error','שגיאה', data.error||'', null); return; }
    if (data.status === 'on_time'){
      lastEventId = null;
      showFeedback('success', 'ברוך הבא ' + student.first + '!', 'יום טוב', null);
    } else {
      lastEventId = data.eventId || null;
      showFeedback('late', 'איחרת ' + data.lateMinutes + ' דקות', student.first + ' ' + student.last, data.requiredMinutes);
    }
  } catch(err){
    showFeedback('error', 'שגיאה', err.message, null);
  }
}

function showFeedback(type, headline, subline, stayMinutes){
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + type;
  document.getElementById('fbHeadline').textContent = headline;
  document.getElementById('fbSubline').textContent = subline;
  const icons = {
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>',
    late: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>'
  };
  document.getElementById('fbIcon').innerHTML = icons[type] || '';
  const stayEl = document.getElementById('fbStay');
  if (stayMinutes){
    stayEl.innerHTML = 'אחרי הלימודים — מרכז למידה<br><span style="font-size:.8em">החל מ-13:30, ' + stayMinutes + ' דקות</span>';
    stayEl.style.display = 'block';
  } else {
    stayEl.style.display = 'none';
  }
  // כפתור ביטול רק באיחור, וכשיש eventId תקף
  const undoBtn = document.getElementById('fbUndoBtn');
  undoBtn.style.display = (type === 'late' && lastEventId) ? 'inline-block' : 'none';
  undoBtn.disabled = false;
  undoBtn.textContent = 'ביטול רישום (טעות)';

  // זמן תצוגה גדל ל-10 שניות כדי להספיק ללחוץ ביטול
  let remaining = 10;
  const cd = document.getElementById('fbCountdown');
  cd.textContent = 'סגירה בעוד ' + remaining + '...';
  const iv = setInterval(() => {
    remaining--;
    cd.textContent = 'סגירה בעוד ' + remaining + '...';
    if (remaining <= 0){
      clearInterval(iv);
      fb.classList.remove('show');
      document.getElementById('searchBox').value = '';
      renderStudentList('');
      lastEventId = null;
    }
  }, 1000);
  window._fbCloseInterval = iv;
}

async function undoLastRegistration(){
  if (!lastEventId){ alert('אין רישום לבטל'); return; }
  const btn = document.getElementById('fbUndoBtn');
  btn.disabled = true;
  btn.textContent = 'מבטל...';
  try {
    if (!DEMO_MODE){
      const res = await fetch(APPS_SCRIPT_URL, {
        method:'POST', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({ action:'cancelEvent', eventId: lastEventId })
      });
      const data = await res.json();
      if (!data.ok){ alert('לא ניתן לבטל: ' + data.error); btn.disabled = false; btn.textContent = 'ביטול רישום (טעות)'; return; }
    }
    lastEventId = null;
    if (window._fbCloseInterval) clearInterval(window._fbCloseInterval);
    document.getElementById('feedback').classList.remove('show');
    document.getElementById('searchBox').value = '';
    renderStudentList('');
  } catch(err){
    alert('שגיאה: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'ביטול רישום (טעות)';
  }
}
</script>
</body>
</html>
