<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>מערכת תורנויות — אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Dream Theme — לחלום.ליצור.להוביל */
  --dream:#8E7ED4;--dream-light:#D4CEF0;--dream-dark:#5B4BA0;
  --create:#E8B060;--create-light:#F5DEB0;--create-dark:#D48A2C;
  --lead:#3AACA0;--lead-light:#B8E4DE;--lead-dark:#1B7A6E;
  --spark:#E8909C;--spark-dark:#D45C6E;
  --bg:#fff;--bg-alt:#FAFBFC;--card:#fff;
  --text:#2C2622;--text-light:#6E6258;--text-lighter:#8C7E72;--muted:#6E6258;
  --border:#EDE6D8;--border-light:#fff;
  --primary:#3AACA0;--primary-dark:#1B7A6E;--primary-light:#B8E4DE;
  --accent:#E8B060;--accent-dark:#D48A2C;
  --success:#4CAF50;--success-bg:#E8F5E9;--warn:#E8B060;--warn-bg:#FFF3E0;
  --danger:#D45C6E;--danger-bg:#FCE7EA;--info:#5B9BD5;--info-bg:#E6F0FA;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 8px rgba(44,38,34,.05);--shadow-sm:0 2px 8px rgba(44,38,34,.05);
  --shadow-md:0 6px 20px rgba(44,38,34,.08);--shadow-lg:0 12px 40px rgba(44,38,34,.1);
  --sage:#8E7ED4;--dusty-rose:#C9A0A0;--warm-gold:#E8B060;
}
body{font-family:Heebo,sans-serif;background:#fff;color:var(--text);min-height:100vh;direction:rtl}
h1,h2,h3,h4,h5,h6,.card-title,.section-title,.header-title{font-family:'Playpen Sans Hebrew','Heebo',sans-serif;font-weight:700}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.04) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.04) 0%,transparent 70%),
    radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.03) 0%,transparent 70%);
  pointer-events:none;z-index:0}

/* HEADER */
.header{
  background:linear-gradient(180deg, rgba(142,126,212,.18) 0%, #fff 100%);
  padding:0 24px;display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100;height:60px;
  box-shadow:0 2px 12px rgba(44,38,34,.06)
}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--sage),var(--primary),var(--warm-gold),var(--dusty-rose));pointer-events:none}
.header-title{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:800}
.header-logo{width:32px;height:32px;opacity:.85}
.header-actions{display:flex;gap:8px;align-items:center}

/* TABS */
.day-tabs{display:flex;gap:4px;background:rgba(58,172,160,.08);border-radius:12px;padding:4px}
.day-tab{background:transparent;border:none;padding:7px 18px;border-radius:9px;font-family:Heebo;
  font-size:.9rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .2s}
.day-tab:hover{background:rgba(58,172,160,.12);color:var(--text)}
.day-tab.active{background:#fff;color:var(--primary-dark);box-shadow:0 1px 6px rgba(44,38,34,.1)}
.day-tab.today{position:relative}
.day-tab.today::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  color:var(--primary);font-size:.5rem}

/* CONTAINER */
.container{max-width:1100px;margin:0 auto;padding:28px 24px}

/* SECTION */
.section{margin-bottom:32px}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.section-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff}
.section-title{font-size:1.15rem;font-weight:800}
.section-sub{font-size:.82rem;color:var(--muted);margin-right:auto}

/* TABLE */
.duty-table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border)}
.duty-table th{background:linear-gradient(135deg,#1B7A6E,#3AACA0);color:#fff;
  padding:14px 16px;font-weight:700;text-align:center;border:1px solid rgba(255,255,255,.2);font-size:.95rem}
.duty-table th.area-col{background:linear-gradient(135deg,#2C2622,#6B5D52);min-width:160px;text-align:right}
.duty-table td{padding:12px 14px;border:1px solid #EEE;text-align:center;vertical-align:middle;
  font-size:.92rem;transition:background .15s}
.duty-table tr:nth-child(even) td{background:#FAFCFC}
.duty-table tr:hover td{background:#F0F8F8}
.area-cell{text-align:right!important;background:#F9F7F4!important;font-weight:700;color:var(--text)}
.area-name{font-size:.95rem;font-weight:800;color:var(--primary-dark);display:block}
.area-location{font-size:.78rem;color:var(--muted);font-weight:400}

/* TEACHER BADGE */
.teacher-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;
  font-weight:600;font-size:.88rem;color:#fff;white-space:nowrap}
.teacher-badge.multi{flex-direction:column;gap:2px}
.teacher-badge .name{line-height:1.3}

/* HIGHLIGHT TODAY */
.today-col{background:rgba(58,172,160,.06)!important}
.duty-table th.today-col{background:linear-gradient(135deg,#4A8A8A,#5DA0A0)!important;
  box-shadow:inset 0 -3px 0 var(--warm-gold)}

/* LUNCH SECTION */
.lunch-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.lunch-card{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow);
  border:1px solid var(--border);text-align:center;transition:transform .15s,box-shadow .15s}
.lunch-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(44,38,34,.1)}
.lunch-card.today-card{border-color:var(--primary);background:rgba(58,172,160,.05);
  box-shadow:0 4px 16px rgba(58,172,160,.15)}
.lunch-day{font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:8px}
.lunch-day.today-label{color:var(--primary-dark)}
.lunch-teachers{display:flex;flex-direction:column;gap:4px;align-items:center}
.lunch-empty{color:var(--muted);font-size:.82rem;font-style:italic}

/* STATUS BAR */
.status-bar{display:flex;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.status-card{background:#fff;border-radius:14px;padding:14px 20px;box-shadow:var(--shadow);
  border:1px solid var(--border);flex:1;min-width:200px;display:flex;align-items:center;gap:14px}
.status-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;color:#fff;flex-shrink:0}
.status-label{font-size:.78rem;color:var(--muted)}
.status-value{font-size:1.2rem;font-weight:800}

/* BACK LINK */
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--primary-dark);
  font-size:.85rem;font-weight:600;text-decoration:none;margin-bottom:16px;
  padding:6px 14px;border-radius:10px;background:rgba(58,172,160,.08);
  border:1px solid rgba(58,172,160,.15);transition:background .2s}
.back-link:hover{background:rgba(58,172,160,.15)}

/* PRINT */
@media print{
  .header,.back-link,.status-bar{display:none!important}
  body{background:#fff}
  .duty-table{box-shadow:none}
}

/* RESPONSIVE */
@media(max-width:768px){
  .header{height:auto;padding:10px 16px}
  .day-tabs{overflow-x:auto}
  .container{padding:16px 12px}
  .duty-table th,.duty-table td{font-size:.8rem;padding:8px 6px}
  .teacher-badge{padding:3px 8px;font-size:.78rem}
  .lunch-cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .status-bar{flex-direction:column}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-title">
    <img src="logo-ort.png" class="header-logo" alt="">
    <span>מערכת תורנויות — תשפ"ו</span>
  </div>
  <div class="header-actions">
    <div class="day-tabs" id="dayTabs"></div>
  </div>
</div>

<div class="container">

  <a href="index.html" class="back-link">&larr; חזרה לדף הראשי</a>

  <!-- STATUS BAR -->
  <div class="status-bar" id="statusBar"></div>

  <!-- RECESS DUTIES -->
  <div class="section">
    <div class="section-header">
      <div class="section-icon" style="background:var(--primary)">
        <svg width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="7"/><path d="M9 5v4l3 2"/></svg>
      </div>
      <span class="section-title">תורנויות הפסקות — הנהלה</span>
      <span class="section-sub" id="currentDayLabel"></span>
    </div>
    <div style="overflow-x:auto">
      <table class="duty-table" id="recessTable"></table>
    </div>
  </div>

  <!-- LUNCH DUTIES -->
  <div class="section">
    <div class="section-header">
      <div class="section-icon" style="background:var(--warm-gold)">
        <svg width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 9h12M7 3v12M11 3v12"/></svg>
      </div>
      <span class="section-title">תורנויות צהריים</span>
    </div>
    <div class="lunch-cards" id="lunchCards"></div>
  </div>

</div>

<script>
// ===== DATA =====
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי'];
const DAY_MAP = {0:'ראשון',1:'שני',2:'שלישי',3:'רביעי',4:'חמישי'};

const AREAS = [
  {name:'כדורגל', location:'דשא + פינג פונג'},
  {name:'כדורסל', location:'פרגולה'},
  {name:'דמקה', location:'מספרה'},
  {name:'שש בש', location:'כיתות 1-2-3'},
  {name:'כדורעף', location:'סדנא + 7-8-9'}
];

// Recess duties: [ראשון, שני, שלישי, רביעי, חמישי]
const RECESS_DUTIES = [
  ['יוסי','מנו','גיא','יוסי','יואב'],
  ['מנו','אושר','אופירה','ויקי','נעמה'],
  ['מאיה','פרלה','יעל / גיא','לינוי',''],
  ['אפרת','משה','יואב','מירב','אליאל'],
  ['רעיה','אליאל / שי','','יעקב','שי']
];

// Lunch duties
const LUNCH_DUTIES = {
  'ראשון': [],
  'שני': ['רווית','יסכה'],
  'שלישי': ['דורית','יואב'],
  'רביעי': ['רווית','מנו'],
  'חמישי': ['אופירה']
};

// Teacher colors (same palette as timetable)
const TEACHER_COLORS = {
  'יוסי':'#884499','מנו':'#337766','גיא':'#558844','יואב':'#2288AA',
  'אושר':'#D47A35','אופירה':'#7AA868','ויקי':'#AA4466','נעמה':'#D45577',
  'מאיה':'#CC4444','פרלה':'#8855CC','יעל':'#669944','לינוי':'#BB6677',
  'אפרת':'#C06090','משה':'#5E8DB8','מירב':'#CC5588','אליאל':'#4488AA',
  'רעיה':'#AA6644','יעקב':'#3A9999','שי':'#996655',
  'רווית':'#CC7733','יסכה':'#8877AA','דורית':'#8877AA'
};

function getColor(name){
  // Handle multi-teacher strings
  const first = name.split(/[\/,]/)[0].trim();
  return TEACHER_COLORS[first] || '#888';
}

// ===== RENDER =====
function getTodayIndex(){
  const d = new Date().getDay(); // 0=Sun
  return d >= 0 && d <= 4 ? d : -1; // Sun=0..Thu=4
}

function renderDayTabs(){
  const container = document.getElementById('dayTabs');
  const todayIdx = getTodayIndex();
  DAYS.forEach((day,i) => {
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (i === todayIdx ? ' active today' : '');
    btn.textContent = day;
    btn.onclick = () => selectDay(i);
    container.appendChild(btn);
  });
}

function selectDay(idx){
  document.querySelectorAll('.day-tab').forEach((b,i) => b.classList.toggle('active', i===idx));
  highlightColumn(idx);
  document.getElementById('currentDayLabel').textContent = 'יום ' + DAYS[idx];
  renderStatus(idx);
}

function renderRecessTable(){
  const table = document.getElementById('recessTable');
  const todayIdx = getTodayIndex();

  let html = '<thead><tr><th class="area-col">אזור</th>';
  DAYS.forEach((day,i) => {
    html += `<th class="${i===todayIdx?'today-col':''}">${day}</th>`;
  });
  html += '</tr></thead><tbody>';

  AREAS.forEach((area,ai) => {
    html += '<tr>';
    html += `<td class="area-cell"><span class="area-name">${area.name}</span><span class="area-location">${area.location}</span></td>`;
    DAYS.forEach((day,di) => {
      const teacher = RECESS_DUTIES[ai][di];
      const isToday = di === todayIdx;
      html += `<td class="${isToday?'today-col':''}">`;
      if(teacher){
        // Handle multi-teacher (slash separated)
        const names = teacher.split(' / ');
        names.forEach(n => {
          html += `<span class="teacher-badge" style="background:${getColor(n.trim())}">${n.trim()}</span> `;
        });
      } else {
        html += '<span style="color:#ccc">—</span>';
      }
      html += '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody>';
  table.innerHTML = html;
}

function renderLunchCards(){
  const container = document.getElementById('lunchCards');
  const todayIdx = getTodayIndex();
  container.innerHTML = '';

  DAYS.forEach((day,i) => {
    const card = document.createElement('div');
    card.className = 'lunch-card' + (i===todayIdx ? ' today-card' : '');

    const teachers = LUNCH_DUTIES[day];
    let teacherHtml = '';
    if(teachers.length === 0){
      teacherHtml = '<span class="lunch-empty">לא מוגדר</span>';
    } else {
      teacherHtml = teachers.map(t =>
        `<span class="teacher-badge" style="background:${getColor(t)}">${t}</span>`
      ).join('');
    }

    card.innerHTML = `
      <div class="lunch-day ${i===todayIdx?'today-label':''}">יום ${day}</div>
      <div class="lunch-teachers">${teacherHtml}</div>
    `;
    container.appendChild(card);
  });
}

function renderStatus(dayIdx){
  const bar = document.getElementById('statusBar');
  const day = DAYS[dayIdx];

  // Count today's duty teachers
  const recessTeachers = new Set();
  RECESS_DUTIES.forEach(row => {
    const t = row[dayIdx];
    if(t) t.split(' / ').forEach(n => recessTeachers.add(n.trim()));
  });
  const lunchTeachers = LUNCH_DUTIES[day] || [];

  bar.innerHTML = `
    <div class="status-card">
      <div class="status-icon" style="background:var(--primary)">
        <svg width="20" height="20" fill="none" stroke="#fff" stroke-width="2"><circle cx="10" cy="10" r="8"/><path d="M10 6v4l3 2"/></svg>
      </div>
      <div>
        <div class="status-label">תורנים בהפסקות</div>
        <div class="status-value">${recessTeachers.size}</div>
      </div>
    </div>
    <div class="status-card">
      <div class="status-icon" style="background:var(--warm-gold)">
        <svg width="20" height="20" fill="none" stroke="#fff" stroke-width="2"><path d="M3 10h14M7 4v12M13 4v12"/></svg>
      </div>
      <div>
        <div class="status-label">תורנים בצהריים</div>
        <div class="status-value">${lunchTeachers.length}</div>
      </div>
    </div>
    <div class="status-card">
      <div class="status-icon" style="background:var(--sage)">
        <svg width="20" height="20" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M7 10l2 2 4-4"/></svg>
      </div>
      <div>
        <div class="status-label">סה"כ תורנים היום</div>
        <div class="status-value">${recessTeachers.size + lunchTeachers.length}</div>
      </div>
    </div>
  `;
}

function highlightColumn(idx){
  // Remove old highlights
  document.querySelectorAll('.duty-table th, .duty-table td').forEach(el => el.classList.remove('today-col'));
  // Add new
  document.querySelectorAll('.duty-table tr').forEach(row => {
    const cells = row.children;
    if(cells[idx+1]) cells[idx+1].classList.add('today-col');
  });
  // Lunch cards
  document.querySelectorAll('.lunch-card').forEach((c,i) => {
    c.classList.toggle('today-card', i===idx);
    c.querySelector('.lunch-day').classList.toggle('today-label', i===idx);
  });
}

// ===== INIT =====
renderDayTabs();
renderRecessTable();
renderLunchCards();

const todayIdx = getTodayIndex();
if(todayIdx >= 0){
  selectDay(todayIdx);
} else {
  selectDay(0);
}
</script>
</body>
</html>
