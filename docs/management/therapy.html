<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>מערכת טיפולים — אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Dream Theme — לחלום.ליצור.להוביל */
  --dream:#8E7ED4;--dream-light:#D4CEF0;--dream-dark:#5B4BA0;
  --create:#E8B060;--create-light:#F5DEB0;--create-dark:#D48A2C;
  --lead:#3AACA0;--lead-light:#B8E4DE;--lead-dark:#1B7A6E;
  --spark:#E8909C;--spark-dark:#D45C6E;
  --bg:#fff;--bg-alt:#FAFBFC;--card:#fff;
  --text:#2C2622;--text-light:#6E6258;--text-lighter:#8C7E72;--muted:#6E6258;
  --border:#EDE6D8;--border-light:#fff;
  --primary:#3AACA0;--primary-dark:#1B7A6E;--primary-light:#B8E4DE;
  --accent:#E8B060;--accent-dark:#D48A2C;
  --success:#4CAF50;--success-bg:#E8F5E9;--warn:#E8B060;--warn-bg:#FFF3E0;
  --danger:#D45C6E;--danger-bg:#FCE7EA;--info:#5B9BD5;--info-bg:#E6F0FA;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 8px rgba(44,38,34,.05);--shadow-sm:0 2px 8px rgba(44,38,34,.05);
  --shadow-md:0 6px 20px rgba(44,38,34,.08);--shadow-lg:0 12px 40px rgba(44,38,34,.1);
  --sage:#8E7ED4;--dusty-rose:#C9A0A0;--warm-gold:#E8B060;--lavender:#A89BC5;
}
body{font-family:Heebo,sans-serif;background:#fff;color:var(--text);min-height:100vh;direction:rtl}
h1,h2,h3,h4,h5,h6,.card-title,.section-title,.header-title{font-family:'Playpen Sans Hebrew','Heebo',sans-serif;font-weight:700}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.04) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.04) 0%,transparent 70%),
    radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.03) 0%,transparent 70%);
  pointer-events:none;z-index:0}

@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Header */
.header{
  background:linear-gradient(180deg,rgba(142,126,212,.18) 0%,#fff 100%);
  padding:0 24px;display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100;height:60px;
  box-shadow:0 2px 12px rgba(44,38,34,.06)
}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--sage),var(--primary),var(--warm-gold),var(--dusty-rose));pointer-events:none}
.header-title{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:800}
.header-actions{display:flex;gap:8px;align-items:center}
.back-link{text-decoration:none;color:var(--primary-dark);font-size:.85rem;font-weight:600;
  display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:10px;
  background:rgba(58,172,160,.08);border:1px solid rgba(58,172,160,.15);transition:.2s}
.back-link:hover{background:rgba(58,172,160,.15)}

/* Container */
.container{max-width:1280px;margin:0 auto;padding:28px 24px}

/* Search */
.search-bar{
  background:var(--card);border:2px solid var(--border);border-radius:14px;
  padding:10px 16px;display:flex;align-items:center;gap:10px;margin-bottom:24px;
  box-shadow:var(--shadow-sm);transition:border-color .2s
}
.search-bar:focus-within{border-color:var(--primary)}
.search-bar input{border:none;outline:none;background:transparent;font-family:Heebo;
  font-size:.92rem;flex:1;color:var(--text)}
.search-bar input::placeholder{color:var(--muted)}

/* Tabs */
.view-tabs{display:flex;gap:4px;background:rgba(58,172,160,.08);border-radius:12px;padding:4px;margin-bottom:24px;flex-wrap:wrap}
.view-tab{background:transparent;border:none;padding:8px 18px;border-radius:9px;font-family:Heebo;
  font-size:.88rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .2s}
.view-tab:hover{background:rgba(58,172,160,.12);color:var(--text)}
.view-tab.active{background:#fff;color:var(--primary-dark);box-shadow:0 1px 6px rgba(44,38,34,.1)}
.view-tab .tab-count{font-size:.72rem;background:rgba(58,172,160,.15);padding:1px 7px;border-radius:8px;margin-right:4px}

/* Stats Row */
.stats-row{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.stat-box{flex:1;min-width:140px;background:var(--card);border-radius:16px;padding:18px 16px;
  text-align:center;border:3px solid var(--border);display:flex;flex-direction:column;
  align-items:center;gap:4px;box-shadow:var(--shadow-sm);transition:.3s;animation:fadeInUp .5s ease backwards}
.stat-box:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.stat-box:nth-child(1){border-color:var(--primary);animation-delay:.05s}
.stat-box:nth-child(2){border-color:var(--sage);animation-delay:.1s}
.stat-box:nth-child(3){border-color:var(--warm-gold);animation-delay:.15s}
.stat-box:nth-child(4){border-color:var(--dusty-rose);animation-delay:.2s}
.stat-box:nth-child(5){border-color:var(--lavender);animation-delay:.25s}
.stat-box .num{font-size:1.8rem;font-weight:900;line-height:1}
.stat-box .label{font-size:.72rem;color:var(--muted);font-weight:500}
.stat-box .icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;margin-bottom:4px}

/* Section */
.section{margin-bottom:32px;animation:fadeInUp .5s ease}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.section-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:1.1rem;flex-shrink:0}
.section-title{font-size:1.1rem;font-weight:800}
.section-sub{font-size:.82rem;color:var(--muted);margin-right:auto}

/* Therapist Cards Grid */
.therapists-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.therapist-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  border:2px solid var(--border);overflow:hidden;transition:.3s;
  animation:fadeInUp .5s ease backwards
}
.therapist-card:hover{box-shadow:var(--shadow-md);border-color:var(--dusty-rose)}
.therapist-header{padding:16px 20px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--border);position:relative}
.therapist-avatar{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:1.2rem;font-weight:800;color:#fff;flex-shrink:0}
.therapist-name{font-size:1rem;font-weight:800}
.therapist-role{font-size:.78rem;color:var(--muted)}
.therapist-count{position:absolute;left:16px;top:50%;transform:translateY(-50%);
  background:rgba(58,172,160,.1);color:var(--primary-dark);font-size:.8rem;font-weight:700;
  padding:4px 12px;border-radius:20px;border:1px solid rgba(58,172,160,.2)}
.therapist-schedule{font-size:.78rem;color:var(--primary-dark);font-weight:600;
  background:rgba(58,172,160,.06);padding:2px 8px;border-radius:6px;margin-top:2px;display:inline-block}

.student-list{padding:12px 20px;display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto}
.student-list::-webkit-scrollbar{width:4px}
.student-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.student-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;
  background:var(--bg);font-size:.87rem;transition:.15s}
.student-item:hover{background:rgba(58,172,160,.08)}
.student-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.student-dot.active{background:var(--success)}
.student-dot.waiting{background:var(--warn)}
.student-dot.refused{background:var(--danger)}
.student-dot.group{background:var(--lavender)}
.student-name{flex:1;font-weight:500}
.student-note{font-size:.73rem;color:var(--muted);max-width:140px;text-overflow:ellipsis;
  overflow:hidden;white-space:nowrap}
.student-badge{font-size:.68rem;padding:2px 8px;border-radius:6px;font-weight:600}
.badge-group{background:rgba(168,155,197,.12);color:#7C6FA0;border:1px solid rgba(168,155,197,.2)}
.badge-parent{background:rgba(232,176,96,.12);color:#A07840;border:1px solid rgba(232,176,96,.25)}
.badge-refused{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(232,144,156,.2);text-decoration:line-through}
.badge-committee{background:rgba(58,172,160,.1);color:var(--primary-dark);border:1px solid rgba(58,172,160,.2)}
.badge-new{background:rgba(106,159,106,.1);color:var(--success);border:1px solid rgba(106,159,106,.2)}

.empty-card{padding:24px;text-align:center;color:var(--muted);font-size:.85rem}

/* Waiting List */
.waiting-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.waiting-card{background:var(--card);border-radius:12px;padding:14px 18px;border:2px solid var(--border);
  display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);transition:.2s}
.waiting-card:hover{border-color:var(--warm-gold);box-shadow:var(--shadow-md)}
.waiting-card .w-num{width:28px;height:28px;border-radius:50%;background:var(--warn-bg);
  color:var(--warn);font-weight:800;font-size:.8rem;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;border:1px solid rgba(212,138,44,.2)}
.waiting-card .w-name{font-weight:700;font-size:.9rem}
.waiting-card .w-note{font-size:.75rem;color:var(--muted)}
.waiting-card .w-badges{display:flex;gap:4px;margin-right:auto}

/* Summary Table */
.summary-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.summary-table th{background:linear-gradient(135deg,#1B7A6E,#3AACA0);color:#fff;
  padding:12px 16px;font-weight:700;text-align:right;font-size:.85rem;border:1px solid rgba(255,255,255,.15)}
.summary-table td{padding:10px 16px;border:1px solid var(--border);font-size:.85rem;
  transition:background .15s;vertical-align:top}
.summary-table tr:nth-child(even) td{background:rgba(245,240,232,.5)}
.summary-table tr:hover td{background:rgba(58,172,160,.05)}

/* ===== Schedule Table ===== */
.schedule-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.schedule-table th{background:linear-gradient(135deg,#1B7A6E,#3AACA0);color:#fff;
  padding:12px 14px;font-weight:700;text-align:center;font-size:.85rem;border:1px solid rgba(255,255,255,.15)}
.schedule-table th:first-child{text-align:right;min-width:80px}
.schedule-table td{padding:10px 12px;border:1px solid var(--border);font-size:.82rem;
  text-align:center;vertical-align:top;min-height:50px}
.schedule-table tr:nth-child(even) td{background:rgba(245,240,232,.4)}
.schedule-cell{display:flex;flex-direction:column;gap:4px}
.schedule-slot{background:rgba(58,172,160,.08);border:1px solid rgba(58,172,160,.15);
  border-radius:8px;padding:6px 10px;font-size:.78rem;text-align:right}
.schedule-slot .slot-therapist{font-weight:700;color:var(--primary-dark)}
.schedule-slot .slot-student{color:var(--text)}
.schedule-slot .slot-room{font-size:.7rem;color:var(--muted);margin-top:2px}

/* Room Cards */
.rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:16px}
.room-card{background:var(--card);border-radius:14px;padding:18px;border:2px solid var(--border);
  box-shadow:var(--shadow-sm);transition:.2s}
.room-card:hover{border-color:var(--primary);box-shadow:var(--shadow-md)}
.room-name{font-size:1rem;font-weight:800;margin-bottom:4px}
.room-detail{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px}
.room-schedule-list{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.room-slot{font-size:.8rem;padding:6px 10px;background:var(--bg);border-radius:8px;
  display:flex;justify-content:space-between;align-items:center}
.room-slot-day{font-weight:700;color:var(--primary-dark);min-width:50px}
.room-slot-info{color:var(--text)}

/* ===== Admin Panel ===== */
.admin-section{background:var(--card);border-radius:var(--radius);border:2px solid var(--border);
  box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:20px}
.admin-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;gap:12px;background:rgba(245,240,232,.5)}
.admin-header h3{font-size:1rem;font-weight:800}
.admin-body{padding:20px}
.admin-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.admin-field{display:flex;flex-direction:column;gap:4px}
.admin-field label{font-size:.75rem;font-weight:700;color:var(--muted)}
.admin-field select,.admin-field input{padding:8px 14px;border:2px solid var(--border);border-radius:10px;
  font-family:Heebo;font-size:.87rem;background:#fff;color:var(--text);min-width:160px;transition:.2s}
.admin-field select:focus,.admin-field input:focus{outline:none;border-color:var(--primary)}
.admin-btn{padding:8px 20px;border-radius:10px;border:none;font-family:Heebo;font-size:.85rem;
  font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.admin-btn-add{background:var(--success);color:#fff}
.admin-btn-add:hover{background:#5A8F5A}
.admin-btn-remove{background:var(--danger);color:#fff;font-size:.75rem;padding:4px 10px;border-radius:8px}
.admin-btn-remove:hover{background:#A04A44}
.admin-btn-room{background:var(--primary);color:#fff}
.admin-btn-room:hover{background:var(--primary-dark)}

.admin-log{margin-top:16px;max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.admin-log-item{font-size:.8rem;padding:8px 12px;border-radius:8px;animation:fadeInUp .3s ease}
.log-add{background:var(--success-bg);color:#2D6A2D;border:1px solid rgba(106,159,106,.2)}
.log-remove{background:var(--danger-bg);color:#8B3A36;border:1px solid rgba(232,144,156,.2)}
.log-room{background:rgba(58,172,160,.08);color:var(--primary-dark);border:1px solid rgba(58,172,160,.2)}

.admin-student-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.admin-student-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;
  border-radius:20px;font-size:.8rem;font-weight:600;background:var(--bg);border:1px solid var(--border)}
.admin-student-tag .remove-x{cursor:pointer;color:var(--danger);font-weight:800;font-size:.85rem;
  width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  transition:.15s}
.admin-student-tag .remove-x:hover{background:var(--danger-bg)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--text);color:#fff;padding:12px 24px;border-radius:12px;font-size:.88rem;
  font-weight:600;box-shadow:var(--shadow-lg);z-index:999;transition:transform .4s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;gap:8px}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== Tracking Tab ===== */
.tracking-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.tracking-week-nav{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;
  padding:6px 14px;border:2px solid var(--border);box-shadow:var(--shadow-sm)}
.tracking-week-nav button{background:none;border:none;cursor:pointer;font-size:1.1rem;padding:4px 8px;
  border-radius:8px;transition:.2s;color:var(--primary-dark);font-weight:700}
.tracking-week-nav button:hover{background:rgba(58,172,160,.12)}
.tracking-week-label{font-size:.88rem;font-weight:700;color:var(--text);min-width:180px;text-align:center}
.tracking-therapist-select{padding:8px 16px;border:2px solid var(--border);border-radius:12px;
  font-family:Heebo;font-size:.88rem;background:#fff;color:var(--text);min-width:180px}
.tracking-therapist-select:focus{outline:none;border-color:var(--primary)}

.tracking-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.tracking-card{background:var(--card);border-radius:var(--radius);border:2px solid var(--border);
  box-shadow:var(--shadow-sm);overflow:hidden;transition:.3s}
.tracking-card:hover{box-shadow:var(--shadow-md)}
.tracking-card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;gap:10px;background:rgba(245,240,232,.3)}
.tracking-card-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tracking-card-name{font-weight:700;font-size:.92rem;flex:1}
.tracking-card-badge{font-size:.68rem;padding:2px 8px;border-radius:6px;font-weight:600;
  background:rgba(58,172,160,.1);color:var(--primary-dark);border:1px solid rgba(58,172,160,.2)}
.tracking-card-body{padding:14px 18px}
.tracking-textarea{width:100%;min-height:80px;border:2px solid var(--border);border-radius:10px;
  font-family:Heebo;font-size:.85rem;padding:10px 14px;resize:vertical;color:var(--text);
  background:#fff;transition:border-color .2s;direction:rtl}
.tracking-textarea:focus{outline:none;border-color:var(--primary)}
.tracking-textarea::placeholder{color:var(--muted)}
.tracking-save-btn{margin-top:8px;padding:6px 16px;border-radius:8px;border:none;
  font-family:Heebo;font-size:.8rem;font-weight:700;cursor:pointer;transition:.2s;
  display:inline-flex;align-items:center;gap:6px}
.tracking-save-btn.unsaved{background:var(--primary);color:#fff}
.tracking-save-btn.unsaved:hover{background:var(--primary-dark)}
.tracking-save-btn.saved{background:var(--success-bg);color:var(--success);cursor:default}
.tracking-history{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.tracking-history-toggle{background:none;border:none;cursor:pointer;font-family:Heebo;
  font-size:.78rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px}
.tracking-history-toggle:hover{color:var(--primary-dark)}
.tracking-history-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.tracking-history-item{font-size:.8rem;padding:8px 12px;border-radius:8px;
  background:rgba(245,240,232,.5);border:1px solid var(--border)}
.tracking-history-item .th-date{font-weight:700;color:var(--primary-dark);margin-bottom:2px;font-size:.75rem}
.tracking-history-item .th-author{font-size:.7rem;color:var(--muted)}
.tracking-history-item .th-text{margin-top:4px;line-height:1.5}
.tracking-stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.tracking-stat{background:var(--card);border-radius:12px;padding:12px 18px;border:2px solid var(--border);
  box-shadow:var(--shadow-sm);text-align:center;min-width:120px}
.tracking-stat .ts-num{font-size:1.4rem;font-weight:900;color:var(--primary)}
.tracking-stat .ts-label{font-size:.72rem;color:var(--muted);font-weight:500}

/* ===== Upload ===== */
.upload-zone{border:3px dashed var(--border);border-radius:var(--radius);padding:40px 20px;
  text-align:center;cursor:pointer;transition:.3s;background:var(--bg);margin-bottom:20px}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--primary);background:rgba(58,172,160,.04)}
.upload-zone svg{margin-bottom:8px}
.upload-zone-title{font-weight:700;font-size:.95rem;margin-bottom:4px}
.upload-zone-sub{font-size:.8rem;color:var(--muted)}
.upload-preview{margin-top:16px;max-height:300px;overflow:auto}
.upload-preview table{width:100%;border-collapse:collapse;font-size:.8rem}
.upload-preview th{background:var(--primary);color:#fff;padding:8px 10px;text-align:right;font-weight:600}
.upload-preview td{padding:6px 10px;border:1px solid var(--border)}
.upload-preview tr:nth-child(even) td{background:rgba(245,240,232,.4)}
.upload-actions{display:flex;gap:10px;margin-top:12px;justify-content:center}

/* Print */
@media print{
  .header,.search-bar,.view-tabs,.back-link,.header-actions,.admin-section{display:none!important}
  .container{padding:0}
  .therapist-card,.stat-box,.waiting-card,.room-card,.tracking-card{break-inside:avoid}
  body{background:#fff}
}

/* Mobile */
@media(max-width:768px){
  .stats-row{gap:8px}
  .stat-box{min-width:100px;padding:12px 8px}
  .stat-box .num{font-size:1.4rem}
  .therapists-grid{grid-template-columns:1fr}
  .waiting-grid{grid-template-columns:1fr}
  .rooms-grid{grid-template-columns:1fr}
  .tracking-cards{grid-template-columns:1fr}
  .container{padding:16px}
  .admin-form{flex-direction:column}
  .admin-field select,.admin-field input{min-width:100%}
  .schedule-table{font-size:.75rem}

  const waitingCount = WAITING_LIST.length;

function renderTabs() {
  document.getElementById('tabTherapists').textContent = THERAPISTS.length;
  document.getElementById('tabWaiting').textContent = WAITING_LIST.length;
}

function switchView(view, btn) {
  currentView = view;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderContent();
}

function filterAll() {
  searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
  renderContent();
}

function renderContent() {
  const area = document.getElementById('contentArea');
  if (currentView === 'therapists') area.innerHTML = renderTherapistsView();
  else if (currentView === 'waiting') area.innerHTML = renderWaitingView();
  else if (currentView === 'rooms') area.innerHTML = renderRoomsView();
  else if (currentView === 'admin') area.innerHTML = renderAdminView();
  else if (currentView === 'tracking') area.innerHTML = renderTrackingView();
  else if (currentView === 'upload') area.innerHTML = renderUploadView();
  else area.innerHTML = renderSummaryView();
}

function matchSearch(text) {
  if (!searchTerm) return true;
  return text.toLowerCase().includes(searchTerm);
}

// ==================== THERAPISTS VIEW ====================

function renderTherapistsView() {
  let html = '<div class="therapists-grid">';

  THERAPISTS.forEach((t, idx) => {
    const activeStudents = t.students.filter(s => s.status === 'active' && matchSearch(s.name));
    const refusedStudents = t.students.filter(s => s.status === 'refused' && matchSearch(s.name));
    const groupStudents = (t.individualGroup || []).filter(s => matchSearch(s.name));
    const parentStudents = (t.parentGroup || []).filter(s => matchSearch(s.name));
    const groups = (t.groups || []);

    if (searchTerm && activeStudents.length === 0 && refusedStudents.length === 0 &&
        groupStudents.length === 0 && parentStudents.length === 0 && !matchSearch(t.name)) {
      return;
    }

    const totalActive = t.students.filter(s => s.status === 'active').length +
                        (t.individualGroup || []).length;

    html += `
      <div class="therapist-card" style="animation-delay:${idx * 0.05}s">
        <div class="therapist-header">
          <div class="therapist-avatar" style="background:${t.color}">${t.name.charAt(0)}</div>
          <div>
            <div class="therapist-name">${t.name}</div>
            <div class="therapist-role">${t.role}</div>
            ${t.schedule ? `<div class="therapist-schedule">${t.schedule}</div>` : ''}
          </div>
          <div class="therapist-count">${totalActive} תלמידים</div>
        </div>
        <div class="student-list">`;

    activeStudents.forEach(s => {
      html += `
          <div class="student-item">
            <span class="student-dot active"></span>
            <span class="student-name">${highlightSearch(s.name)}</span>
            ${s.note ? `<span class="student-note" title="${s.note}">${s.note}</span>` : ''}
          </div>`;
    });

    groupStudents.forEach(s => {
      html += `
          <div class="student-item">
            <span class="student-dot group"></span>
            <span class="student-name">${highlightSearch(s.name)}</span>
            <span class="student-badge badge-group">קבוצתי</span>
          </div>`;
    });

    parentStudents.forEach(s => {
      html += `
          <div class="student-item">
            <span class="student-dot active"></span>
            <span class="student-name">${highlightSearch(s.name)}</span>
            <span class="student-badge badge-parent">קב׳ הורים</span>
          </div>`;
    });

    groups.forEach(g => {
      html += `
          <div class="student-item">
            <span class="student-dot group"></span>
            <span class="student-name">${g.name}</span>
            <span class="student-badge badge-group">קבוצה</span>
          </div>`;
    });

    refusedStudents.forEach(s => {
      html += `
          <div class="student-item" style="opacity:.55">
            <span class="student-dot refused"></span>
            <span class="student-name">${highlightSearch(s.name)}</span>
            <span class="student-badge badge-refused">${s.note || 'סירב/ה'}</span>
          </div>`;
    });

    if (activeStudents.length === 0 && refusedStudents.length === 0 &&
        groupStudents.length === 0 && parentStudents.length === 0 && groups.length === 0) {
      html += `<div class="empty-card">לא נמצאו תוצאות</div>`;
    }

    html += `</div></div>`;
  });

  html += '</div>';
  return html;
}

// ==================== ROOMS & SCHEDULE VIEW ====================

const DAY_NAMES = ['ראשון','שני','שלישי','רביעי','חמישי'];
const HOURS = ['שעה 1','שעה 2','שעה 3','שעה 4','שעה 5','שעה 6','הפסקה 1','הפסקה 2','צהריים'];

function renderRoomsView() {
  let html = '';

  // Schedule table
  html += `
    <div class="section">
      <div class="section-header">
        <div class="section-icon" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark))">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div>
          <div class="section-title">לו"ז טיפולים שבועי</div>
          <div class="section-sub">לפי ימים ושעות</div>
        </div>
      </div>`;

  // Build schedule from therapist data
  const schedule = {}; // {dayIdx: {hour: [{therapist, student, room}]}}
  THERAPISTS.forEach(t => {
    t.students.forEach(s => {
      if (s.status !== 'active' || !s.note) return;
      const note = s.note;
      // Parse day+hour from note
      const dayMatch = note.match(/יום ([אבגדהו]׳?)/);
      const hourMatch = note.match(/שעה (\d)/);
      const breakMatch = note.match(/הפסקה (\d)/);
      if (!dayMatch && !hourMatch && !breakMatch) return;

      let dayIdx = -1;
      if (dayMatch) {
        const dayLetter = dayMatch[1].replace('׳','');
        const dayMap = {'א':0,'ב':1,'ג':2,'ד':3,'ה':4,'ו':5};
        dayIdx = dayMap[dayLetter] !== undefined ? dayMap[dayLetter] : -1;
      }

      let hourLabel = '';
      if (hourMatch) hourLabel = 'שעה ' + hourMatch[1];
      else if (breakMatch) hourLabel = 'הפסקה ' + breakMatch[1];

      if (dayIdx >= 0 && hourLabel) {
        if (!schedule[dayIdx]) schedule[dayIdx] = {};
        if (!schedule[dayIdx][hourLabel]) schedule[dayIdx][hourLabel] = [];
        // Find room assignment
        let roomName = '';
        ROOMS.forEach(r => {
          (r.slots || []).forEach(sl => {
            if (sl.day === dayIdx && sl.hour === hourLabel && sl.therapist === t.name) {
              roomName = r.name;
            }
          });
        });
        schedule[dayIdx][hourLabel].push({therapist:t.name, student:s.name, color:t.color, room:roomName});
      }
    });
  });

  // Also add room-based slots that may not be in therapist notes
  ROOMS.forEach(r => {
    (r.slots || []).forEach(sl => {
      if (!schedule[sl.day]) schedule[sl.day] = {};
      if (!schedule[sl.day][sl.hour]) schedule[sl.day][sl.hour] = [];
      // Check if already exists
      const exists = schedule[sl.day][sl.hour].some(x => x.therapist === sl.therapist && x.student === (sl.student||''));
      if (!exists) {
        const therapist = THERAPISTS.find(t => t.name === sl.therapist);
        schedule[sl.day][sl.hour].push({
          therapist: sl.therapist,
          student: sl.student || '',
          color: therapist ? therapist.color : 'var(--muted)',
          room: r.name
        });
      }
    });
  });

  // Collect all hours that have data
  const usedHours = new Set();
  Object.values(schedule).forEach(dayData => {
    Object.keys(dayData).forEach(h => usedHours.add(h));
  });
  const sortedHours = HOURS.filter(h => usedHours.has(h));
  if (sortedHours.length === 0) sortedHours.push(...HOURS.slice(0,6));

  html += `<table class="schedule-table"><thead><tr><th>שעה</th>`;
  for (let d = 0; d < 5; d++) {
    html += `<th>יום ${DAY_NAMES[d]}</th>`;
  }
  html += `</tr></thead><tbody>`;

  sortedHours.forEach(hour => {
    html += `<tr><td style="font-weight:700;text-align:right;background:rgba(245,240,232,.5)">${hour}</td>`;
    for (let d = 0; d < 5; d++) {
      const slots = (schedule[d] && schedule[d][hour]) || [];
      html += `<td><div class="schedule-cell">`;
      if (slots.length === 0) {
        html += `<span style="color:var(--border);font-size:.75rem">—</span>`;
      } else {
        slots.forEach(sl => {
          html += `<div class="schedule-slot">
            <div class="slot-therapist" style="color:${sl.color}">${sl.therapist}</div>
            <div class="slot-student">${sl.student}</div>
            ${sl.room ? `<div class="slot-room">&#x1F3E0; ${sl.room}</div>` : ''}
          </div>`;
        });
      }
      html += `</div></td>`;
    }
    html += `</tr>`;
  });

  html += `</tbody></table></div>`;

  // Rooms cards
  html += `
    <div class="section" style="margin-top:28px">
      <div class="section-header">
        <div class="section-icon" style="background:linear-gradient(135deg,var(--sage),#8BA08B)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div>
          <div class="section-title">חדרי טיפול</div>
          <div class="section-sub">${ROOMS.length} חדרים</div>
        </div>
      </div>
      <div class="rooms-grid">`;

  ROOMS.forEach(r => {
    const slotCount = (r.slots || []).length;
    html += `
        <div class="room-card">
          <div class="room-name">${r.name}</div>
          <div class="room-detail">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            ${r.location}
          </div>
          <div class="room-detail">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            ${slotCount} טיפולים משובצים
          </div>
          <div class="room-schedule-list">`;

    (r.slots || []).forEach(sl => {
      html += `
            <div class="room-slot">
              <span class="room-slot-day">יום ${DAY_NAMES[sl.day]}</span>
              <span class="room-slot-info">${sl.hour} — ${sl.therapist}${sl.student ? ' / '+sl.student : ''}</span>
            </div>`;
    });

    if (slotCount === 0) {
      html += `<div style="text-align:center;color:var(--muted);font-size:.8rem;padding:12px">אין שיבוצים — הוסיפי דרך טאב ניהול</div>`;
    }

    html += `</div></div>`;
  });

  html += '</div></div>';
  return html;
}

// ==================== ADMIN ACTIONS ====================

function pickTherapistColor(el) {
  document.getElementById('newTherapistColor').value = el.dataset.color;
}

function toggleCustomRole() {
  var sel = document.getElementById('newTherapistRole');
  var field = document.getElementById('customRoleField');
  if (field) field.style.display = sel.value === 'אחר' ? '' : 'none';
}

function addTherapist() {
  var nameEl = document.getElementById('newTherapistName');
  var name = nameEl.value.trim();
  if (!name) { showToast('יש להזין שם מטפל/ת'); return; }

  var existing = THERAPISTS.find(function(t) { return t.name === name; });
  if (existing) { showToast('מטפל/ת בשם זה כבר קיים/ת'); return; }

  var roleSel = document.getElementById('newTherapistRole');
  var role = roleSel.value === 'אחר'
    ? (document.getElementById('newTherapistCustomRole').value.trim() || 'אחר')
    : roleSel.value;
  var color = document.getElementById('newTherapistColor').value;
  var schedule = document.getElementById('newTherapistSchedule').value.trim();

  var newT = { name: name, color: color, role: role, students: [], groups: [] };
  if (schedule) newT.schedule = schedule;

  THERAPISTS.push(newT);
  logAction('log-add', 'מטפל/ת חדש/ה: ' + name + ' (' + role + ')');
  saveData();
  renderStats();
  renderTabs();
  renderContent();
  showToast(name + ' נוסף/ה כמטפל/ת');
}

function addStudent() {
  const therapistName = document.getElementById('addTherapist').value;
  const studentName = document.getElementById('addStudentName').value.trim();
  const studentNote = document.getElementById('addStudentNote').value.trim();

  if (!studentName) { showToast('יש להזין שם תלמיד/ה'); return; }

  const therapist = THERAPISTS.find(t => t.name === therapistName);
  if (!therapist) return;

  therapist.students.push({name: studentName, status: 'active', note: studentNote || undefined});
  logAction('log-add', `${studentName} נוסף/ה ל${therapistName}`);
  saveData();
  renderStats();
  renderTabs();
  renderContent();
  showToast(`${studentName} נוסף/ה ל${therapistName}`);
}

function removeStudent() {
  const therapistName = document.getElementById('removeTherapist').value;
  const studentName = document.getElementById('removeStudent').value;

  if (!studentName) { showToast('יש לבחור תלמיד/ה'); return; }

  const therapist = THERAPISTS.find(t => t.name === therapistName);
  if (!therapist) return;

  therapist.students = therapist.students.filter(s => s.name !== studentName);
  logAction('log-remove', `${studentName} הוסר/ה מ${therapistName}`);
  saveData();
  renderStats();
  renderTabs();
  renderContent();
  showToast(`${studentName} הוסר/ה מ${therapistName}`);
}

function updateRemoveStudents() {
  const sel = document.getElementById('removeTherapist');
  const studentSel = document.getElementById('removeStudent');
  if (!sel || !studentSel) return;

  const therapist = THERAPISTS.find(t => t.name === sel.value);
  if (!therapist) return;

  studentSel.innerHTML = '<option value="">— בחרי תלמיד/ה —</option>' +
    therapist.students.map(s => `<option value="${s.name}">${s.name} ${s.status === 'refused' ? '(סירב/ה)' : ''}</option>`).join('');
}

function addRoom() {
  const name = document.getElementById('newRoomName').value.trim();
  const location = document.getElementById('newRoomLocation').value.trim();
  if (!name) { showToast('יש להזין שם חדר'); return; }

  ROOMS.push({name, location: location || '', slots: []});
  logAction('log-room', `חדר "${name}" נוסף`);
  saveData();
  renderContent();
  showToast(`חדר "${name}" נוסף`);
}

function addRoomSlot() {
  const roomName = document.getElementById('slotRoom').value;
  const day = parseInt(document.getElementById('slotDay').value);
  const hour = document.getElementById('slotHour').value;
  const therapist = document.getElementById('slotTherapist').value;
  const student = document.getElementById('slotStudent').value.trim();

  const room = ROOMS.find(r => r.name === roomName);
  if (!room) return;

  room.slots.push({day, hour, therapist, student});
  logAction('log-room', `${therapist}${student ? ' / '+student : ''} — יום ${DAY_NAMES[day]} ${hour} — ${roomName}`);
  saveData();
  renderContent();
  showToast(`שובץ ב${roomName}: יום ${DAY_NAMES[day]} ${hour}`);
}

function logAction(type, text) {
  const now = new Date();
  const time = now.toLocaleDateString('he-IL') + ' ' + now.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  adminLog.push({type, text, time});
  saveData();
}

function clearLog() {
  adminLog = [];
  saveData();
  renderContent();
}

function resetData() {
  if (!confirm('לאפס את כל הנתונים לברירת מחדל? כל השינויים שביצעת יימחקו.')) return;
  localStorage.removeItem(STORAGE_KEY);
  THERAPISTS.length = 0;
  DEFAULT_THERAPISTS.forEach(t => THERAPISTS.push(JSON.parse(JSON.stringify(t))));
  WAITING_LIST.length = 0;
  DEFAULT_WAITING.forEach(w => WAITING_LIST.push(JSON.parse(JSON.stringify(w))));
  ROOMS.length = 0;
  DEFAULT_ROOMS.forEach(r => ROOMS.push(JSON.parse(JSON.stringify(r))));
  adminLog = [];
  saveData();
  renderStats();
  renderTabs();
  renderContent();
  showToast('הנתונים אופסו בהצלחה');
}

function highlightSearch(text) {
  if (!searchTerm) return text;
  const re = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<mark style="background:#FBBF24;border-radius:3px;padding:0 2px">$1</mark>');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

const TRACKING_KEY = 'ort_therapy_tracking';
// *** הגדירי כאן את ה-URL של Web App אחרי Deploy ***
const TRACKING_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyV6HMn1BFLu7WtdZjoYx9LxfqlP_-FeYXC8v9KeEsMAFEu3ftYATcxve_-M6TmS1jiXA/exec';
let trackingData = {}; // { weekKey: { therapistName: { studentName: { text, date, author } } } }
let trackingWeekOffset = 0;
let trackingFilterTherapist = '';

function getWeekKey(offset) {
  const d = new Date();
  d.setDate(d.getDate() + (offset * 7));
  const day = d.getDay();
  const diff = d.getDate() - day;
  const sunday = new Date(d.setDate(diff));
  return sunday.toISOString().slice(0, 10);
}

function getWeekLabel(offset) {
  const d = new Date();
  d.setDate(d.getDate() + (offset * 7));
  const day = d.getDay();
  const diff = d.getDate() - day;
  const sunday = new Date(new Date(d).setDate(diff));
  const saturday = new Date(sunday);
  saturday.setDate(saturday.getDate() + 6);
  const fmt = d2 => d2.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' });
  return `${fmt(sunday)} — ${fmt(saturday)}`;
}

function loadTracking() {
  return cloudStorage.get(TRACKING_KEY).then(function(saved) {
    if (saved) trackingData = saved;
  });
}

function saveTracking() {
  cloudStorage.set(TRACKING_KEY, trackingData);
}

function saveTrackingToSheet(week, therapist, student, text, author) {
  if (!TRACKING_APPS_SCRIPT_URL) return;
  fetch(TRACKING_APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({
      action: 'saveTracking',
      week: week,
      therapist: therapist,
      student: student,
      text: text,
      author: author
    })
  }).catch(function(err) { console.log('Sheet save error:', err); });
}

function loadTrackingFromSheet() {
  if (!TRACKING_APPS_SCRIPT_URL) return Promise.resolve();
  return fetch(TRACKING_APPS_SCRIPT_URL + '?action=getTracking')
    .then(function(r) { return r.json(); })
    .then(function(result) {
      if (result.status === 'ok' && result.data) {
        result.data.forEach(function(row) {
          const wk = row.week;
          const t = row.therapist;
          const s = row.student;
          if (!trackingData[wk]) trackingData[wk] = {};
          if (!trackingData[wk][t]) trackingData[wk][t] = {};
          trackingData[wk][t][s] = { text: row.text, date: row.date, author: row.author };
        });
      }
    })
    .catch(function(err) { console.log('Sheet load error:', err); });
}

function renderTrackingView() {
  const weekKey = getWeekKey(trackingWeekOffset);
  const weekLabel = getWeekLabel(trackingWeekOffset);
  const weekData = trackingData[weekKey] || {};

  // Filter therapists
  let therapists = THERAPISTS.filter(t => {
    const activeStudents = t.students.filter(s => s.status === 'active');
    return activeStudents.length > 0;
  });

  if (trackingFilterTherapist) {
    therapists = therapists.filter(t => t.name === trackingFilterTherapist);
  }

  // Stats
  let totalStudents = 0, filledCount = 0;
  THERAPISTS.forEach(t => {
    const active = t.students.filter(s => s.status === 'active');
    totalStudents += active.length;
    active.forEach(s => {
      if (weekData[t.name] && weekData[t.name][s.name] && weekData[t.name][s.name].text) {
        filledCount++;
      }
    });
  });

  const therapistOptions = THERAPISTS
    .filter(t => t.students.some(s => s.status === 'active'))
    .map(t => `<option value="${t.name}" ${trackingFilterTherapist === t.name ? 'selected' : ''}>${t.name}</option>`)
    .join('');

  let html = `
    <div class="tracking-stats">
      <div class="tracking-stat">
        <div class="ts-num">${filledCount}</div>
        <div class="ts-label">דיווחים השבוע</div>
      </div>
      <div class="tracking-stat">
        <div class="ts-num">${totalStudents - filledCount}</div>
        <div class="ts-label">ממתינים לדיווח</div>
      </div>
      <div class="tracking-stat">
        <div class="ts-num">${totalStudents > 0 ? Math.round((filledCount/totalStudents)*100) : 0}%</div>
        <div class="ts-label">השלמה</div>
      </div>
    </div>
    <div class="tracking-header">
      <div class="tracking-week-nav">
        <button onclick="changeTrackingWeek(-1)">&rarr;</button>
        <div class="tracking-week-label">${weekLabel}</div>
        <button onclick="changeTrackingWeek(1)">&larr;</button>
      </div>
      <select class="tracking-therapist-select" onchange="filterTrackingTherapist(this.value)">
        <option value="">כל המטפלים</option>
        <option value="__yiskah__" ${trackingFilterTherapist === '__yiskah__' ? 'selected' : ''}>יסכה (רכזת)</option>
        ${therapistOptions}
      </select>
    </div>`;

  // Yiskah coordinator mode - show all students grouped by therapist
  if (trackingFilterTherapist === '__yiskah__') {
    html += '<div class="tracking-cards">';
    THERAPISTS.forEach(t => {
      const active = t.students.filter(s => s.status === 'active');
      if (active.length === 0) return;
      active.forEach(s => {
        const saved = weekData[t.name] && weekData[t.name][s.name];
        const yiskahSaved = weekData['__yiskah__'] && weekData['__yiskah__'][s.name];
        const history = getTrackingHistory(t.name, s.name);
        html += renderTrackingCard(s.name, t.name, t.color, yiskahSaved, history, '__yiskah__', saved);
      });
    });
    html += '</div>';
  } else {
    html += '<div class="tracking-cards">';
    therapists.forEach(t => {
      const active = t.students.filter(s => s.status === 'active' && matchSearch(s.name));
      active.forEach(s => {
        const saved = weekData[t.name] && weekData[t.name][s.name];
        const history = getTrackingHistory(t.name, s.name);
        html += renderTrackingCard(s.name, t.name, t.color, saved, history, t.name, null);
      });
    });
    html += '</div>';
  }

  return html;
}

function renderTrackingCard(studentName, therapistName, color, savedData, history, author, therapistNote) {
  const weekKey = getWeekKey(trackingWeekOffset);
  const text = savedData ? savedData.text : '';
  const isSaved = !!text;
  const cardId = `track_${therapistName}_${studentName}`.replace(/[^a-zA-Z0-9\u0590-\u05FF]/g, '_');

  let therapistNoteHtml = '';
  if (author === '__yiskah__' && therapistNote && therapistNote.text) {
    therapistNoteHtml = `
      <div style="margin-bottom:8px;padding:8px 12px;border-radius:8px;background:rgba(142,126,212,.08);border:1px solid rgba(142,126,212,.15);font-size:.8rem">
        <div style="font-weight:700;color:var(--sage);font-size:.72rem;margin-bottom:2px">${therapistName} כתב/ה:</div>
        <div>${therapistNote.text}</div>
      </div>`;
  }

  let historyHtml = '';
  if (history.length > 0) {
    historyHtml = `
      <div class="tracking-history">
        <button class="tracking-history-toggle" onclick="toggleHistory('${cardId}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          היסטוריה (${history.length})
        </button>
        <div class="tracking-history-list" id="hist_${cardId}" style="display:none">
          ${history.map(h => `
            <div class="tracking-history-item">
              <div class="th-date">${h.weekLabel} <span class="th-author">— ${h.author || therapistName}</span></div>
              <div class="th-text">${h.text}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }

  return `
    <div class="tracking-card">
      <div class="tracking-card-header">
        <div class="tracking-card-dot" style="background:${color}"></div>
        <div class="tracking-card-name">${studentName}</div>
        <div class="tracking-card-badge">${therapistName}</div>
        ${isSaved ? '<span style="color:var(--success);font-size:.75rem;font-weight:700">&#10003;</span>' : ''}
      </div>
      <div class="tracking-card-body">
        ${therapistNoteHtml}
        <textarea class="tracking-textarea" id="${cardId}" placeholder="כתוב/י עדכון שבועי על ${studentName}...">${text}</textarea>
        <button class="tracking-save-btn ${isSaved ? 'saved' : 'unsaved'}" id="btn_${cardId}"
          onclick="saveTrackingNote('${encodeURIComponent(therapistName)}','${encodeURIComponent(studentName)}','${cardId}','${encodeURIComponent(author)}')">
          ${isSaved ? 'נשמר' : 'שמור'}
        </button>
        ${historyHtml}
      </div>
    </div>`;
}

function getTrackingHistory(therapistName, studentName) {
  const results = [];
  const currentWeek = getWeekKey(0);
  // Look back up to 12 weeks
  for (let i = 1; i <= 12; i++) {
    const wk = getWeekKey(-i);
    if (trackingData[wk] && trackingData[wk][therapistName] && trackingData[wk][therapistName][studentName]) {
      const entry = trackingData[wk][therapistName][studentName];
      if (entry.text) {
        results.push({ weekLabel: getWeekLabel(-i), text: entry.text, author: entry.author });
      }
    }
    // Also check yiskah notes
    if (trackingData[wk] && trackingData[wk]['__yiskah__'] && trackingData[wk]['__yiskah__'][studentName]) {
      const entry = trackingData[wk]['__yiskah__'][studentName];
      if (entry.text) {
        results.push({ weekLabel: getWeekLabel(-i), text: entry.text, author: 'יסכה' });
      }
    }
  }
  return results;
}

function toggleHistory(cardId) {
  const el = document.getElementById('hist_' + cardId);
  if (el) el.style.display = el.style.display === 'none' ? 'flex' : 'none';
}

function saveTrackingNote(therapistEnc, studentEnc, cardId, authorEnc) {
  const therapistName = decodeURIComponent(therapistEnc);
  const studentName = decodeURIComponent(studentEnc);
  const author = decodeURIComponent(authorEnc);
  const weekKey = getWeekKey(trackingWeekOffset);
  const text = document.getElementById(cardId).value.trim();

  if (!trackingData[weekKey]) trackingData[weekKey] = {};
  if (!trackingData[weekKey][author]) trackingData[weekKey][author] = {};
  const authorLabel = author === '__yiskah__' ? 'יסכה' : therapistName;
  trackingData[weekKey][author][studentName] = {
    text: text,
    date: new Date().toISOString(),
    author: authorLabel
  };
  saveTracking();
  saveTrackingToSheet(weekKey, author, studentName, text, authorLabel);

  const btn = document.getElementById('btn_' + cardId);
  if (btn) {
    btn.className = 'tracking-save-btn saved';
    btn.textContent = 'נשמר';
  }
  showToast('נשמר עדכון ל' + studentName);
  // Re-render stats
  renderStats();
}

function changeTrackingWeek(dir) {
  trackingWeekOffset += dir;
  renderContent();
}

function filterTrackingTherapist(val) {
  trackingFilterTherapist = val;
  renderContent();
}

              עמודה A: שם מטפל/ת<br>
              עמודה B: תפקיד<br>
              עמודה C: שם תלמיד/ה<br>
              עמודה D: סטטוס (פעיל/סירוב)<br>
              עמודה E: הערה
            </div>
          </div>
          <div style="background:var(--card);border-radius:12px;padding:16px;border:2px solid var(--border)">
            <div style="font-weight:700;font-size:.88rem;margin-bottom:8px;color:var(--primary)">חדרים</div>
            <div style="font-size:.8rem;color:var(--muted);line-height:1.7">
              עמודה A: שם חדר<br>
              עמודה B: מיקום
            </div>
          </div>
          <div style="background:var(--card);border-radius:12px;padding:16px;border:2px solid var(--border)">
            <div style="font-weight:700;font-size:.88rem;margin-bottom:8px;color:var(--warm-gold)">שיבוצים</div>
            <div style="font-size:.8rem;color:var(--muted);line-height:1.7">
              עמודה A: חדר<br>
              עמודה B: יום (ראשון-חמישי)<br>
              עמודה C: שעה<br>
              עמודה D: מטפל/ת<br>
              עמודה E: תלמיד/ה
            </div>
          </div>
        </div>
      </div>
    </div>`;

  return html;
}

function handleFileDrop(e) {
  const file = e.dataTransfer.files[0];
  if (file) processUploadFile(file);
}

function handleFileSelect(input) {
  const file = input.files[0];
  if (file) processUploadFile(file);
}

function processUploadFile(file) {
  const type = document.getElementById('uploadType').value;
  uploadType = type;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });

      if (json.length < 2) {
        showToast('הקובץ ריק או חסרות שורות');
        return;
      }

      uploadedData = json;
      showUploadPreview(json, type);
    } catch (err) {
      showToast('שגיאה בקריאת הקובץ: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function showUploadPreview(rows, type) {
  const preview = document.getElementById('uploadPreview');
  const maxRows = Math.min(rows.length, 20);

  let html = `
    <div style="margin-bottom:12px;font-weight:700;font-size:.9rem">
      תצוגה מקדימה — ${rows.length - 1} שורות נתונים (${type === 'therapists' ? 'מטפלים' : type === 'rooms' ? 'חדרים' : 'שיבוצים'})
    </div>
    <div class="upload-preview">
      <table><thead><tr>`;

  // Header row
  (rows[0] || []).forEach(h => { html += `<th>${h || ''}</th>`; });
  html += '</tr></thead><tbody>';

  for (let i = 1; i < maxRows; i++) {
    html += '<tr>';
    (rows[i] || []).forEach(cell => { html += `<td>${cell !== undefined ? cell : ''}</td>`; });
    html += '</tr>';
  }
  if (rows.length > 20) {
    html += `<tr><td colspan="${(rows[0]||[]).length}" style="text-align:center;color:var(--muted)">... ו-${rows.length - 20} שורות נוספות</td></tr>`;
  }

  html += `</tbody></table></div>
    <div class="upload-actions">
      <button class="admin-btn" style="background:var(--success);color:#fff;padding:10px 28px;font-size:.9rem" onclick="applyUpload()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        אשר והחל
      </button>
      <button class="admin-btn" style="background:var(--bg);color:var(--muted);border:1px solid var(--border);padding:10px 28px;font-size:.9rem" onclick="cancelUpload()">
        ביטול
      </button>
    </div>`;

  preview.innerHTML = html;
}

function cancelUpload() {
  uploadedData = null;
  document.getElementById('uploadPreview').innerHTML = '';
  document.getElementById('fileInput').value = '';
}

function applyUpload() {
  if (!uploadedData || uploadedData.length < 2) { showToast('אין נתונים'); return; }

  if (!confirm('לעדכן את הנתונים? הנתונים הנוכחיים יוחלפו.')) return;

  const rows = uploadedData;

  if (uploadType === 'therapists') {
    applyTherapistsUpload(rows);
  } else if (uploadType === 'rooms') {
    applyRoomsUpload(rows);
  } else if (uploadType === 'schedule') {
    applyScheduleUpload(rows);
  }

  uploadedData = null;
  document.getElementById('uploadPreview').innerHTML = '';
  document.getElementById('fileInput').value = '';
  saveData();
  renderStats();
  renderTabs();
  renderContent();
}

function applyTherapistsUpload(rows) {
  const therapistMap = {};

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const tName = String(r[0] || '').trim();
    const role = String(r[1] || '').trim();
    const sName = String(r[2] || '').trim();
    const status = String(r[3] || 'פעיל').trim();
    const note = String(r[4] || '').trim();

    if (!tName) continue;

    if (!therapistMap[tName]) {
      // Check if therapist already exists for color
      const existing = THERAPISTS.find(t => t.name === tName);
      therapistMap[tName] = {
        name: tName,
        color: existing ? existing.color : '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'),
        role: role || (existing ? existing.role : ''),
        students: [],
        groups: existing ? (existing.groups || []) : []
      };
      if (existing && existing.schedule) therapistMap[tName].schedule = existing.schedule;
    }

    if (sName) {
      const sStatus = (status === 'סירוב' || status === 'refused') ? 'refused' : 'active';
      therapistMap[tName].students.push({ name: sName, status: sStatus, note: note || undefined });
    }
  }

  THERAPISTS.length = 0;
  Object.values(therapistMap).forEach(t => THERAPISTS.push(t));
  logAction('log-add', 'נתוני מטפלים עודכנו מקובץ — ' + Object.keys(therapistMap).length + ' מטפלים');
  showToast('נתוני מטפלים עודכנו בהצלחה');
}

function applyRoomsUpload(rows) {
  const newRooms = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const name = String(r[0] || '').trim();
    const location = String(r[1] || '').trim();
    if (!name) continue;
    // Preserve existing slots
    const existing = ROOMS.find(rm => rm.name === name);
    newRooms.push({ name, location, slots: existing ? existing.slots : [] });
  }
  ROOMS.length = 0;
  newRooms.forEach(r => ROOMS.push(r));
  logAction('log-room', 'חדרים עודכנו מקובץ — ' + newRooms.length + ' חדרים');
  showToast('חדרים עודכנו בהצלחה');
}

function applyScheduleUpload(rows) {
  const dayMap = {'ראשון':0,'שני':1,'שלישי':2,'רביעי':3,'חמישי':4};
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const roomName = String(r[0] || '').trim();
    const dayStr = String(r[1] || '').trim();
    const hour = String(r[2] || '').trim();
    const therapist = String(r[3] || '').trim();
    const student = String(r[4] || '').trim();

    if (!roomName || !therapist) continue;

    const room = ROOMS.find(rm => rm.name === roomName);
    if (!room) continue;

    const day = dayMap[dayStr];
    if (day === undefined) continue;

    room.slots.push({ day, hour, therapist, student });
  }
  logAction('log-room', 'שיבוצים עודכנו מקובץ');
  showToast('שיבוצים עודכנו בהצלחה');
}

// Init
cloudStorage.mountStatusBadge();
Promise.all([
  cloudStorage.get(STORAGE_KEY),
  cloudStorage.get(TRACKING_KEY)
]).then(function(results) {
  const saved = results[0];
  const trackingSaved = results[1];
  if (saved) {
    if (saved.therapists) THERAPISTS = saved.therapists;
    if (saved.waiting) WAITING_LIST = saved.waiting;
    if (saved.rooms) ROOMS = saved.rooms;
    if (saved.log) adminLog = saved.log;
  }
  if (trackingSaved) trackingData = trackingSaved;

  // טעינה מ-Google Sheets (משלים את cloudStorage)
  loadTrackingFromSheet().then(function() {
    // שמור את המיזוג חזרה ל-cloudStorage
    saveTracking();
  });

  // קריאת פרמטרים מה-URL — פתיחה ישירה מתזכורת WhatsApp
  const urlParams = new URLSearchParams(window.location.search);
  const viewParam = urlParams.get('view');
  const therapistParam = urlParams.get('therapist');
  if (viewParam === 'tracking') {
    currentView = 'tracking';
    if (therapistParam) trackingFilterTherapist = decodeURIComponent(therapistParam);
    // סימון הטאב הנכון
    setTimeout(() => {
      document.querySelectorAll('.view-tab').forEach(t => {
        t.classList.remove('active');
        if (t.textContent.includes('מעקב')) t.classList.add('active');
      });
    }, 100);
  }

  init();
});
</script>
