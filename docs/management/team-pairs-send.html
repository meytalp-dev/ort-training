<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שליחת קישורים לזוגות | אורט בית הערבה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Playpen+Sans+Hebrew:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00bcd4;
            --cyan-light: #e0f7fa;
            --pink: #ec407a;
            --pink-light: #fce4ec;
            --turquoise: #26a69a;
            --turquoise-light: #e0f2f1;
            --green-wa: #25D366;
            --green-wa-dark: #128C7E;
            --bg: #fafbfc;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-light: #718096;
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Assistant', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }

        h1, h2, h3 { font-family: 'Playpen Sans Hebrew', 'Assistant', sans-serif; }

        .header {
            text-align: center;
            padding: 24px 0 16px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--turquoise);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-light);
            font-size: 1.05rem;
        }

        .progress-bar {
            max-width: 600px;
            margin: 20px auto;
            background: #e0e0e0;
            border-radius: 20px;
            height: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--green-wa), var(--turquoise));
            border-radius: 20px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .progress-text {
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-light);
            margin-top: 6px;
            margin-bottom: 24px;
        }

        /* Send All Button */
        .send-all-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .btn-send-all {
            background: linear-gradient(135deg, var(--green-wa), var(--green-wa-dark));
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1.15rem;
            font-family: 'Playpen Sans Hebrew', sans-serif;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37,211,102,0.3);
        }

        .btn-send-all:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(37,211,102,0.4);
        }

        .btn-send-all svg { vertical-align: middle; margin-left: 8px; }

        /* Pairs List */
        .pairs-list {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pair-row {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
        }

        .pair-row.sent {
            opacity: 0.5;
            background: #f5f5f5;
        }

        .pair-row.sent .btn-wa {
            background: #bdbdbd;
            pointer-events: none;
        }

        .pair-number {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--cyan-light);
            color: var(--cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .pair-info {
            flex: 1;
            min-width: 0;
        }

        .pair-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 2px;
        }

        .pair-partner {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .pair-partner span {
            color: var(--turquoise);
            font-weight: 600;
        }

        .btn-wa {
            background: var(--green-wa);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-family: 'Assistant', sans-serif;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-wa:hover { transform: translateY(-1px); background: var(--green-wa-dark); }

        .btn-wa svg { width: 18px; height: 18px; }

        .sent-badge {
            display: none;
            color: var(--green-wa);
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .pair-row.sent .sent-badge { display: flex; align-items: center; gap: 4px; }
        .pair-row.sent .btn-wa { display: none; }

        /* Pair divider */
        .pair-group {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 4px;
        }

        .pair-group-header {
            background: linear-gradient(135deg, var(--cyan-light), var(--turquoise-light));
            padding: 8px 20px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--turquoise);
            text-align: center;
        }

        .pair-group .pair-row {
            box-shadow: none;
            border-radius: 0;
        }

        .pair-group .pair-row:first-of-type {
            border-bottom: 1px solid #f0f0f0;
        }

        @media (max-width: 600px) {
            .pair-row { flex-wrap: wrap; }
            .btn-wa { width: 100%; justify-content: center; margin-top: 8px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-left:8px"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        שליחת קישורים לזוגות
    </h1>
    <p>לחצי על "שלח בוואטסאפ" ליד כל שם — נפתחת שיחה עם ההודעה מוכנה</p>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="progress-text" id="progressText">0 מתוך 22 נשלחו</div>

<div class="pairs-list" id="pairsList"></div>

<script>
const BASE_URL = 'https://meytalp-dev.github.io/ort-training/management/team-pair-personal.html';

const PAIRS = [
    {
        num: 1,
        a: { id: 1, name: 'אושר אהרוני', phone: '972508882402' },
        b: { id: 2, name: 'דורית ויגדור מועלם', phone: '972523464235' }
    },
    {
        num: 2,
        a: { id: 3, name: 'אושרת אסור', phone: '972523847420' },
        b: { id: 4, name: 'גיא נתנאל', phone: '972542007155' }
    },
    {
        num: 3,
        a: { id: 5, name: 'שי בגלר', phone: '972522285773' },
        b: { id: 6, name: 'שרה מרציאנו', phone: '972506614801' }
    },
    {
        num: 4,
        a: { id: 7, name: 'ליאת בנבג\'י רוזנר', phone: '972528980191' },
        b: { id: 8, name: 'משה צברי', phone: '972547195033' }
    },
    {
        num: 5,
        a: { id: 9, name: 'אפרת בר אשר', phone: '972522460684' },
        b: { id: 10, name: 'אליאל קוסקאס', phone: '972527902270' }
    },
    {
        num: 6,
        a: { id: 11, name: 'יעקב גרונספלד', phone: '972546995254' },
        b: { id: 12, name: 'ויקטוריה קלדרון', phone: '972586528820' }
    },
    {
        num: 7,
        a: { id: 13, name: 'מנו דהאן', phone: '972505852852' },
        b: { id: 14, name: 'פרלה שאזו', phone: '972525115337' }
    },
    {
        num: 8,
        a: { id: 15, name: 'יסכה הגר', phone: '972526995309' },
        b: { id: 16, name: 'לינוי בנג\'י', phone: '972502737161' }
    },
    {
        num: 9,
        a: { id: 17, name: 'רעיה יצחקי', phone: '972504726066' },
        b: { id: 18, name: 'יוסף רבבשי', phone: '972506563344' }
    },
    {
        num: 10,
        a: { id: 19, name: 'מיטל לאלום', phone: '972506239018' },
        b: { id: 20, name: 'נעמה קוסטן', phone: '972524295181' }
    },
    {
        num: 11,
        a: { id: 21, name: 'צהיי ממו גטהון', phone: '972527783903' },
        b: { id: 22, name: 'אהוד פרידס', phone: '972545630212' }
    }
];

function buildMessage(person, partner) {
    const link = BASE_URL + '?id=' + person.id;
    return `היי ${person.name.split(' ')[0]} :)\n\nיש לנו פעילות זוגות צוות!\nבן/בת הזוג שלך לשיחה: *${partner.name}*\n\nהנה הדף האישי שלכם עם שאלות לשיחה:\n${link}\n\nלחצו על הקלפים כדי לחשוף שאלות ותהנו מהשיחה`;
}

function getWaLink(phone, message) {
    return 'https://api.whatsapp.com/send?phone=' + phone + '&text=' + encodeURIComponent(message);
}

let sentCount = 0;
const sentState = JSON.parse(localStorage.getItem('teamPairsSent') || '{}');

function markSent(personId) {
    sentState[personId] = true;
    localStorage.setItem('teamPairsSent', JSON.stringify(sentState));
    const row = document.getElementById('row-' + personId);
    if (row) row.classList.add('sent');
    updateProgress();
}

function updateProgress() {
    sentCount = Object.keys(sentState).length;
    const pct = (sentCount / 22) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = sentCount + ' מתוך 22 נשלחו';
}

function buildList() {
    const list = document.getElementById('pairsList');

    PAIRS.forEach(pair => {
        const group = document.createElement('div');
        group.className = 'pair-group';
        group.innerHTML = `<div class="pair-group-header">זוג ${pair.num}</div>`;

        [
            { person: pair.a, partner: pair.b },
            { person: pair.b, partner: pair.a }
        ].forEach(({ person, partner }) => {
            const msg = buildMessage(person, partner);
            const waLink = getWaLink(person.phone, msg);
            const isSent = sentState[person.id];

            const row = document.createElement('div');
            row.className = 'pair-row' + (isSent ? ' sent' : '');
            row.id = 'row-' + person.id;

            row.innerHTML = `
                <div class="pair-number">${person.id}</div>
                <div class="pair-info">
                    <div class="pair-name">${person.name}</div>
                    <div class="pair-partner">הזוג: <span>${partner.name}</span></div>
                </div>
                <a href="${waLink}" target="_blank" class="btn-wa" onclick="markSent(${person.id})">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                    שלח בוואטסאפ
                </a>
                <div class="sent-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    נשלח
                </div>
            `;

            group.appendChild(row);
        });

        list.appendChild(group);
    });

    updateProgress();
}

buildList();
</script>

</body>
</html>
