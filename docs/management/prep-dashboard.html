<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>הכנות תשפ"ז — דשבורד מנהלת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --dream:#8E7ED4; --dream-light:#D4CEF0; --dream-dark:#5B4BA0;
    --create:#E8B060; --create-light:#F5DEB0; --create-dark:#D48A2C;
    --lead:#3AACA0; --lead-light:#B8E4DE; --lead-dark:#1B7A6E;
    --spark:#E8909C; --spark-dark:#D45C6E;
    --bg:#fff; --bg-alt:#FAFBFC; --card:#fff;
    --text:#2C2622; --text-light:#6E6258; --text-lighter:#8C7E72;
    --border:#EDE6D8; --border-light:#F5F0E5;
    --radius:16px; --radius-lg:24px;
    --shadow-sm:0 2px 8px rgba(44,38,34,.05);
    --shadow-md:0 6px 20px rgba(44,38,34,.08);
    --shadow-lg:0 12px 40px rgba(44,38,34,.1);
  }

  body {
    font-family:'Heebo',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; line-height:1.65; position:relative; overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 600px 450px at 12% 15%, rgba(142,126,212,.07) 0%, transparent 70%),
      radial-gradient(ellipse 500px 400px at 88% 70%, rgba(232,176,96,.05) 0%, transparent 70%),
      radial-gradient(ellipse 500px 400px at 50% 100%, rgba(58,172,160,.05) 0%, transparent 70%);
  }

  .floating-shape { position:fixed; pointer-events:none; z-index:0; opacity:.35;
    animation: float 25s ease-in-out infinite; }
  .floating-shape.s1 { top:5%; right:3%; width:160px; height:160px;
    background:radial-gradient(circle, var(--dream-light), transparent 70%); border-radius:50%; }
  .floating-shape.s2 { bottom:10%; left:3%; width:180px; height:180px;
    background:radial-gradient(circle, var(--lead-light), transparent 70%); border-radius:50%;
    animation-delay:-9s; }

  @keyframes float {
    0%,100% { transform:translate(0,0) rotate(0deg); }
    50% { transform:translate(15px,-20px) rotate(5deg); }
  }
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(14px); }
    to { opacity:1; transform:translateY(0); }
  }

  header {
    background:#fff; padding:22px 40px; display:flex; align-items:center; gap:18px;
    position:sticky; top:0; z-index:50; box-shadow:0 2px 12px rgba(44,38,34,.04);
    flex-wrap:wrap;
  }
  header::after {
    content:''; position:absolute; bottom:0; left:0; right:0; height:4px;
    background:linear-gradient(90deg, var(--dream), var(--create), var(--lead));
  }
  header h1 {
    font-family:'Playpen Sans Hebrew','Heebo',sans-serif; font-weight:800;
    font-size:26px; color:var(--text); letter-spacing:-.3px;
  }
  header .subtitle { color:var(--text-lighter); font-size:14px; margin-top:2px; }
  header .header-spacer { flex:1; }
  header .refresh-btn {
    background:linear-gradient(135deg, var(--dream), var(--lead));
    color:#fff; border:none; padding:9px 18px; border-radius:10px;
    font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:7px; transition:transform .15s ease;
  }
  header .refresh-btn:hover { transform:translateY(-1px); box-shadow:var(--shadow-sm); }

  .container { max-width:1280px; margin:0 auto; padding:32px 28px 80px; position:relative; z-index:1; }

  /* ===== Hero stats ===== */
  .hero-card {
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:30px 34px; margin-bottom:28px; box-shadow:var(--shadow-md);
    animation:fadeInUp .4s ease; position:relative; overflow:hidden;
  }
  .hero-card::before {
    content:''; position:absolute; top:-40px; right:-40px; width:200px; height:200px;
    border-radius:50%; background:radial-gradient(circle, rgba(142,126,212,.1), transparent 70%);
  }
  .hero-card::after {
    content:''; position:absolute; bottom:-50px; left:-30px; width:180px; height:180px;
    border-radius:50%; background:radial-gradient(circle, rgba(58,172,160,.08), transparent 70%);
  }
  .hero-card h2 {
    font-family:'Playpen Sans Hebrew','Heebo',sans-serif; font-size:28px; font-weight:800;
    margin-bottom:8px; position:relative;
  }
  .hero-card .target-line {
    color:var(--text-light); font-size:14.5px; position:relative;
  }
  .hero-stats {
    display:flex; gap:14px; margin-top:24px; position:relative; flex-wrap:wrap;
  }
  .hero-stat {
    flex:1; min-width:160px; background:var(--bg-alt); padding:18px 20px;
    border-radius:14px; border:1px solid var(--border-light);
  }
  .hero-stat .num {
    font-family:'Playpen Sans Hebrew',sans-serif; font-size:36px; font-weight:800;
    line-height:1; margin-bottom:6px;
  }
  .hero-stat .num.lead { color:var(--lead-dark); }
  .hero-stat .num.create { color:var(--create-dark); }
  .hero-stat .num.spark { color:var(--spark-dark); }
  .hero-stat .num.dream { color:var(--dream-dark); }
  .hero-stat .label { font-size:13px; color:var(--text-light); }

  /* ===== Filters ===== */
  .filters-bar {
    display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:10px 14px; box-shadow:var(--shadow-sm);
  }
  .filter-btn {
    background:transparent; border:1px solid var(--border); padding:7px 14px;
    border-radius:8px; cursor:pointer; font-family:inherit; font-size:13px;
    color:var(--text-light); transition:all .15s ease;
  }
  .filter-btn:hover { border-color:var(--dream); color:var(--dream-dark); }
  .filter-btn.active {
    background:var(--dream); color:#fff; border-color:var(--dream);
  }

  /* ===== Role grid ===== */
  .roles-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
    gap:18px;
  }
  .role-card {
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:0; box-shadow:var(--shadow-sm); transition:all .25s ease;
    animation:fadeInUp .5s ease; overflow:hidden; position:relative;
  }
  .role-card:hover {
    transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--dream-light);
  }
  .role-card .color-bar {
    height:5px; width:100%;
  }
  .role-card-body { padding:20px 22px; }
  .role-card-header {
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    margin-bottom:14px;
  }
  .role-card-title-wrap { flex:1; min-width:0; }
  .role-card-title {
    font-family:'Playpen Sans Hebrew','Heebo',sans-serif; font-size:18px; font-weight:700;
    color:var(--text); margin-bottom:2px;
  }
  .role-card-name {
    font-size:13.5px; color:var(--text-light); font-weight:600;
  }
  .role-card-warn {
    background:#FCE7EA; color:#9B2C2C; padding:3px 8px; border-radius:10px;
    font-size:11px; font-weight:700; flex-shrink:0;
  }
  .role-card-stats {
    display:flex; gap:14px; margin:14px 0 10px;
    padding:12px; background:var(--bg-alt); border-radius:10px;
  }
  .role-card-stat {
    flex:1; text-align:center;
  }
  .role-card-stat .n {
    font-family:'Playpen Sans Hebrew',sans-serif; font-size:24px; font-weight:800; line-height:1;
  }
  .role-card-stat .l { font-size:11px; color:var(--text-light); margin-top:3px; }
  .role-card-stat .n.lead { color:var(--lead-dark); }
  .role-card-stat .n.create { color:var(--create-dark); }
  .role-card-stat .n.spark { color:var(--spark-dark); }

  .role-progress {
    height:8px; background:var(--bg-alt); border-radius:5px; overflow:hidden;
    margin:12px 0; border:1px solid var(--border-light);
  }
  .role-progress-fill {
    height:100%; background:linear-gradient(90deg, var(--lead), var(--lead-dark));
    transition:width .5s ease; border-radius:5px;
  }
  .role-card-progress-label {
    display:flex; justify-content:space-between; font-size:12px; color:var(--text-lighter);
    margin-bottom:4px;
  }

  .role-card-actions {
    display:flex; gap:8px; margin-top:14px;
  }
  .role-card-actions a {
    flex:1; text-align:center; padding:9px 12px; border-radius:9px;
    text-decoration:none; font-size:13px; font-weight:600; transition:all .15s;
    border:1px solid var(--border);
  }
  .role-card-actions a.open-btn {
    background:var(--dream); color:#fff; border-color:var(--dream);
  }
  .role-card-actions a.open-btn:hover { background:var(--dream-dark); border-color:var(--dream-dark); }
  .role-card-actions a.copy-btn {
    background:transparent; color:var(--text-light);
  }
  .role-card-actions a.copy-btn:hover { background:var(--bg-alt); color:var(--text); }

  /* Recent activity */
  .role-card-meta {
    margin-top:10px; padding-top:10px; border-top:1px solid var(--border-light);
    font-size:11.5px; color:var(--text-lighter); display:flex; gap:6px; align-items:center;
  }

  /* Empty/loading */
  .grid-empty, .grid-loading {
    grid-column:1/-1; text-align:center; padding:60px 24px; color:var(--text-lighter);
  }
  .grid-loading::before {
    content:''; display:inline-block; width:14px; height:14px;
    border:2px solid var(--border); border-top-color:var(--dream);
    border-radius:50%; animation:spin 1s linear infinite; margin-left:8px;
    vertical-align:middle;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .error-banner {
    background:#FCE7EA; color:#9B2C2C; border:1px solid #F5B5C0;
    padding:14px 18px; border-radius:12px; margin-bottom:20px; font-size:14px;
    display:none;
  }
  .error-banner.show { display:block; }

  /* Mobile */
  @media (max-width:640px) {
    header { padding:16px 18px; }
    header h1 { font-size:22px; }
    .container { padding:20px 14px 60px; }
    .hero-card { padding:22px 20px; }
    .hero-card h2 { font-size:22px; }
    .hero-stat { min-width:130px; padding:14px 16px; }
    .hero-stat .num { font-size:28px; }
    .roles-grid { grid-template-columns:1fr; }
    .floating-shape { display:none; }
  }

  /* Print */
  @media print {
    header, .floating-shape, .role-card-actions, .filters-bar, .refresh-btn { display:none !important; }
    body::before { display:none !important; }
    .role-card { box-shadow:none; break-inside:avoid; }
    .roles-grid { grid-template-columns:1fr 1fr; }
    .container { padding:0; }
  }
</style>
</head>
<body>

<div class="floating-shape s1"></div>
<div class="floating-shape s2"></div>

<header>
  <div>
    <h1>הכנות לתשפ"ז — דשבורד</h1>
    <div class="subtitle">מבט-על על התקדמות בעלי התפקידים · אורט בית הערבה</div>
  </div>
  <div class="header-spacer"></div>
  <button class="refresh-btn" onclick="loadAll()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
    רענון
  </button>
</header>

<div class="container">

  <div class="error-banner" id="errorBanner">
    <strong>שים לב:</strong> <span id="errorText"></span>
  </div>

  <section class="hero-card">
    <h2>סטטוס הכנות לתשפ"ז</h2>
    <div class="target-line">יעד סופי: <strong>1.7.2026</strong> · <span id="daysLeft">—</span></div>
    <div class="hero-stats">
      <div class="hero-stat">
        <div class="num dream" id="totalRoles">6</div>
        <div class="label">בעלי תפקידים</div>
      </div>
      <div class="hero-stat">
        <div class="num lead" id="totalDone">—</div>
        <div class="label">משימות הושלמו</div>
      </div>
      <div class="hero-stat">
        <div class="num create" id="totalOpen">—</div>
        <div class="label">משימות פתוחות</div>
      </div>
      <div class="hero-stat">
        <div class="num spark" id="totalOverdue">—</div>
        <div class="label">חורגות מהדדליין</div>
      </div>
    </div>
  </section>

  <div class="filters-bar">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">הכל</button>
    <button class="filter-btn" data-filter="behind" onclick="setFilter('behind')">בפיגור</button>
    <button class="filter-btn" data-filter="active" onclick="setFilter('active')">פעילים השבוע</button>
    <button class="filter-btn" data-filter="inactive" onclick="setFilter('inactive')">לא נגעו שבוע</button>
  </div>

  <div class="roles-grid" id="rolesGrid">
    <div class="grid-loading">טוען מהענן…</div>
  </div>

</div>

<script src="prep-shared.js"></script>
<script>
let allData = {};
let currentFilter = 'all';

document.addEventListener('DOMContentLoaded', () => {
  updateDaysLeft();
  loadAll();
});

function updateDaysLeft() {
  const target = new Date(PREP_CONFIG.DEADLINE_FINAL);
  const today = new Date();
  today.setHours(0,0,0,0);
  const days = Math.floor((target - today) / (1000*60*60*24));
  document.getElementById('daysLeft').textContent =
    days > 0 ? `נשארו ${days} ימים` : (days === 0 ? 'היום!' : `${Math.abs(days)} ימים אחרי הדדליין`);
}

async function loadAll() {
  document.getElementById('rolesGrid').innerHTML = '<div class="grid-loading">טוען מהענן…</div>';
  document.getElementById('errorBanner').classList.remove('show');

  const result = await prepGetAll();

  if (result.error === 'not_configured') {
    showError('שמירה לענן לא מוגדרת. הדשבורד מציג רק נתונים מקומיים של בעלי תפקידים שנכנסו ממחשב זה.');
    allData = {};
    PREP_ROLES_KEYS().forEach(k => {
      const cached = prepCache.get(k);
      if (cached) allData[k] = cached;
    });
    renderGrid();
    return;
  }

  if (result.error) {
    showError('שגיאה בטעינה מהענן. מציג נתונים מהמטמון אם יש.');
    allData = {};
    PREP_ROLES_KEYS().forEach(k => {
      const cached = prepCache.get(k);
      if (cached) allData[k] = cached;
    });
    renderGrid();
    return;
  }

  allData = result.byRole || {};
  renderGrid();
}

function PREP_ROLES_KEYS() {
  return Object.keys(PREP_ROLES);
}

function showError(msg) {
  document.getElementById('errorText').textContent = msg;
  document.getElementById('errorBanner').classList.add('show');
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  renderGrid();
}

function isOverdue(t) {
  if (t.done) return false;
  if (!t.deadline) return false;
  const today = new Date();
  today.setHours(0,0,0,0);
  return new Date(t.deadline) < today;
}

function getLastUpdate(tasks) {
  if (!tasks || !tasks.length) return null;
  let latest = null;
  tasks.forEach(t => {
    if (t.updated_at) {
      const d = new Date(t.updated_at);
      if (!latest || d > latest) latest = d;
    }
  });
  return latest;
}

function daysSince(date) {
  if (!date) return null;
  const today = new Date();
  return Math.floor((today - date) / (1000*60*60*24));
}

function renderGrid() {
  const grid = document.getElementById('rolesGrid');
  const roleKeys = Object.keys(PREP_ROLES);

  let totalDone = 0, totalOpen = 0, totalOverdue = 0;
  const cards = [];

  roleKeys.forEach(slug => {
    const role = PREP_ROLES[slug];
    const tasks = allData[slug] || [];
    const done = tasks.filter(t => t.done).length;
    const total = tasks.length;
    const open = total - done;
    const overdue = tasks.filter(isOverdue).length;
    const pct = total > 0 ? Math.round((done/total)*100) : 0;
    const lastUpdate = getLastUpdate(tasks);
    const daysAgo = daysSince(lastUpdate);

    totalDone += done;
    totalOpen += open;
    totalOverdue += overdue;

    // Filter
    if (currentFilter === 'behind' && overdue === 0) return;
    if (currentFilter === 'active' && (daysAgo === null || daysAgo > 7)) return;
    if (currentFilter === 'inactive' && daysAgo !== null && daysAgo <= 7) return;

    const lastUpdateLabel = daysAgo === null ? 'לא נגעה עדיין' :
      daysAgo === 0 ? 'עודכן היום' :
      daysAgo === 1 ? 'עודכן אתמול' :
      daysAgo < 7 ? `עודכן לפני ${daysAgo} ימים` :
      `לא נגעה ${daysAgo} ימים`;

    cards.push(`
      <div class="role-card">
        <div class="color-bar" style="background:${role.color}"></div>
        <div class="role-card-body">
          <div class="role-card-header">
            <div class="role-card-title-wrap">
              <div class="role-card-title">${escapeHtml(role.title)}</div>
              <div class="role-card-name">${escapeHtml(role.name)}</div>
            </div>
            ${overdue > 0 ? `<span class="role-card-warn">${overdue} בפיגור</span>` : ''}
          </div>

          <div class="role-card-stats">
            <div class="role-card-stat"><div class="n lead">${done}</div><div class="l">הושלמו</div></div>
            <div class="role-card-stat"><div class="n create">${open}</div><div class="l">פתוחות</div></div>
            <div class="role-card-stat"><div class="n">${total}</div><div class="l">סה"כ</div></div>
          </div>

          <div class="role-card-progress-label">
            <span>התקדמות</span>
            <strong>${pct}%</strong>
          </div>
          <div class="role-progress">
            <div class="role-progress-fill" style="width:${pct}%; background:${pct>=80 ? 'linear-gradient(90deg,#3AACA0,#1B7A6E)' : (pct>=40 ? 'linear-gradient(90deg,#E8B060,#D48A2C)' : 'linear-gradient(90deg,#E8909C,#D45C6E)')}"></div>
          </div>

          <div class="role-card-actions">
            <a class="open-btn" href="prep.html?role=${escapeAttr(slug)}" target="_blank">פתחי דף תפקיד</a>
            <a class="copy-btn" href="#" onclick="copyLink(event, '${escapeAttr(slug)}', '${escapeAttr(role.name)}')">העתיקי קישור</a>
          </div>

          <div class="role-card-meta">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ${lastUpdateLabel}
          </div>
        </div>
      </div>
    `);
  });

  if (!cards.length) {
    grid.innerHTML = '<div class="grid-empty">אין תוצאות לסינון הנוכחי</div>';
  } else {
    grid.innerHTML = cards.join('');
  }

  document.getElementById('totalDone').textContent = totalDone;
  document.getElementById('totalOpen').textContent = totalOpen;
  document.getElementById('totalOverdue').textContent = totalOverdue;
}

function copyLink(e, slug, name) {
  e.preventDefault();
  const url = `${location.origin}${location.pathname.replace(/[^/]+$/, '')}prep.html?role=${slug}`;
  navigator.clipboard.writeText(url).then(() => {
    const a = e.target;
    const orig = a.textContent;
    a.textContent = 'הקישור הועתק ✓';
    setTimeout(() => { a.textContent = orig; }, 1800);
  });
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }
</script>

</body>
</html>
