<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מדריך/ה — פיקוח הדרכות</title>
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <div class="topbar-brand">
      <a href="../" style="display:flex;align-items:center;color:var(--text-3);text-decoration:none;" title="חזרה לדף הבית">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <svg class="emblem" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" style="width:32px;height:32px;color:var(--brand-primary);">
        <circle cx="32" cy="32" r="29" fill="none"/>
        <circle cx="32" cy="32" r="25" stroke-opacity="0.35" fill="none"/>
        <path d="M32 16v36M24 22v30M40 22v30M18 28v20M46 28v20" stroke-linecap="round" stroke-width="1.4"/>
        <path d="M18 50h28" stroke-linecap="round" stroke-width="2"/>
        <circle cx="32" cy="16" r="2" fill="currentColor"/>
        <circle cx="24" cy="22" r="1.6" fill="currentColor"/>
        <circle cx="40" cy="22" r="1.6" fill="currentColor"/>
        <circle cx="18" cy="28" r="1.4" fill="currentColor"/>
        <circle cx="46" cy="28" r="1.4" fill="currentColor"/>
      </svg>
      <div class="brand-stack">
        <span class="ministry">משרד העבודה</span>
        <span class="system-name">מדריך/ה</span>
      </div>
    </div>
    <div class="topbar-user">
      <div class="topbar-user-name" id="user-name">—</div>
    </div>
  </header>

  <main class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:20px;">
      <h1>ההדרכות שלי — <span id="month-label"></span></h1>
      <button class="btn btn-primary" id="btn-new-training">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        הדרכה חדשה
      </button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">הדרכות החודש</div>
        <div class="stat-value" id="stat-trainings">—</div>
        <div class="stat-sub">פעמיים בחודש מומלץ</div>
      </div>
    </div>

    <div class="card" style="padding:0;">
      <div style="padding: 20px 24px 8px;">
        <h2 style="margin:0;">לוח הדרכות החודש</h2>
        <p style="color:var(--text-2); font-size:14px; margin-top:6px;">לחיצה על "רישום נוכחות" — דף פשוט לסימון מי הגיע ומי לא</p>
      </div>
      <div class="table-wrap" style="border:none;">
        <table class="table">
          <thead>
            <tr>
              <th>תאריך</th>
              <th>מקצוע</th>
              <th>קהל יעד</th>
              <th>מיקום</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="trainings-body">
            <tr><td colspan="5" class="empty">טוען...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- New training modal -->
<div class="modal-overlay" id="modal-training">
  <div class="modal">
    <div class="modal-head">
      <h3>הדרכה חדשה</h3>
      <button class="modal-close" onclick="closeNewTraining()">×</button>
    </div>
    <form id="form-training">
      <div class="form-grid">
        <div class="form-row">
          <label class="form-label">מקצוע *</label>
          <select class="select" name="subject" id="t-subject" required>
            <option value="">בחרי מקצוע</option>
          </select>
          <small class="form-hint">המורים שיוצגו לרישום נוכחות הם כל מורי המקצוע מכל הרשתות</small>
        </div>
        <div class="form-row">
          <label class="form-label">תאריך *</label>
          <input type="date" class="input" name="date" id="t-date" required>
        </div>
        <div class="form-row">
          <label class="form-label">סוג הדרכה</label>
          <select class="select" name="sector">
            <option value="">פתוחה לכל המגזרים</option>
            <option value="haredi">מגזר חרדי</option>
            <option value="arab">מגזר ערבי</option>
            <option value="kelali">מגזר כללי</option>
          </select>
          <small class="form-hint">אופציונלי. השאירי "פתוחה" אם ההדרכה לכלל המורים</small>
        </div>
        <div class="form-row">
          <label class="form-label">מיקום</label>
          <input class="input" name="location" placeholder='למשל: זום / בית הספר X'>
        </div>
        <div class="form-row" style="grid-column:1/-1;">
          <label class="form-label">שם מדריך/ה</label>
          <input class="input" name="guideName">
        </div>
        <div class="form-row" style="grid-column:1/-1;">
          <label class="form-label">מייל מדריך/ה</label>
          <input type="email" class="input" name="guideEmail">
        </div>
        <div class="form-row" style="grid-column:1/-1;">
          <label class="form-label">הערות</label>
          <textarea class="textarea" name="notes" placeholder="נושאים, חומרים..."></textarea>
        </div>
      </div>
      <div class="btn-row" style="margin-top:16px;">
        <button type="submit" class="btn btn-primary">צור והתחל רישום</button>
        <button type="button" class="btn btn-secondary" onclick="closeNewTraining()">ביטול</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/app.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
