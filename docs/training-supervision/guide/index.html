<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבט מקצועי — מצפן הפיקוח</title>
<link rel="stylesheet" href="../assets/fonts-local.css">
<link rel="stylesheet" href="../assets/styles.css">
<style>
  /* command-strip עם 4 KPIs */
  .command-strip { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 760px) { .command-strip { grid-template-columns: repeat(2, 1fr); } }

  /* כפתור פעולה בראש העמוד */
  .page-header-actions { display:flex; flex-direction:column; align-items:flex-end; gap:16px; }

  .tabs-bar {
    display: flex;
    gap: 4px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 24px;
    overflow-x: auto;
  }
  .tab-btn {
    background: none;
    border: none;
    padding: 12px 20px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-2);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--brand-accent); border-bottom-color: var(--brand-accent); }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  .att-grid { width: 100%; border-collapse: collapse; font-size: 14px; }
  .att-grid th, .att-grid td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: center; }
  .att-grid th { background: var(--surface-2); font-weight: 700; color: var(--text); }
  .att-grid td.name-cell { text-align: right; font-weight: 600; }
  .att-grid td.school-cell { text-align: right; color: var(--text-2); font-size: 13px; }
  .att-cell { width: 50px; }
  .att-mark { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; font-weight:700; font-size:13px; }
  .att-mark.present { background: var(--ok-soft); color: var(--ok); }
  .att-mark.partial { background: var(--warn-soft); color: #92400e; }
  .att-mark.absent { background: var(--surface-2); color: var(--text-3); }
  .att-mark.future { background: #f1f5f9; color: var(--text-3); border: 1px dashed var(--border); }

  .rate-cell { font-weight: 700; }
  .rate-cell.high { color: var(--ok); }
  .rate-cell.mid { color: #d97706; }
  .rate-cell.low { color: var(--err); }

  .school-group { margin-bottom: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .school-header { padding: 12px 16px; background: var(--surface-2); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .school-header h3 { margin: 0; font-size: 16px; }
  .school-header .meta { font-size: 13px; color: var(--text-2); }

  .search-bar { margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .search-bar input { flex: 1; min-width: 220px; }

  .copy-link-btn {
    display:inline-flex; align-items:center; gap:6px;
    padding: 6px 12px; border-radius: 8px;
    background: var(--brand-accent); color: white;
    border: none; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600;
  }
  .copy-link-btn.copied { background: var(--ok); }
  .copy-link-btn svg { width: 14px; height: 14px; }

  .training-row { padding: 14px 16px; border-bottom: 1px solid var(--border); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  .training-row:last-child { border-bottom: none; }
  .training-row .when { font-weight: 700; }
  .training-row .where { color: var(--text-2); font-size: 13px; }
  .training-row .actions { display:flex; gap:8px; flex-wrap:wrap; }

  @media (max-width: 720px) {
    .att-grid { font-size: 12px; }
    .att-grid th, .att-grid td { padding: 6px 4px; }
    .att-grid .school-cell { display: none; }
    .page-header-actions { align-items: stretch; }
  }
</style>
</head>
<body data-role="guide">

  <!-- System Command Bar -->
  <header class="command-bar">
    <div class="command-bar-left">
      <a href="../" style="display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;" title="חזרה לדף הבית">
        <svg class="compass-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="2" fill="currentColor"/>
          <path d="M16 6 L18 16 L16 16 Z M16 26 L14 16 L16 16 Z" fill="currentColor" opacity="0.85"/>
          <path d="M6 16 L16 14 L16 16 Z M26 16 L16 18 L16 16 Z" fill="currentColor" opacity="0.45"/>
        </svg>
        <div class="command-bar-text">
          <span class="unit">משרד העבודה</span>
          <span class="sub">מבט מקצועי · מדריך/ה</span>
        </div>
      </a>
    </div>
    <div class="command-bar-status">
      <span class="status-dot" aria-hidden="true"></span>
      <span>מבט מקצועי</span>
    </div>
  </header>

  <main class="dashboard-shell">

    <!-- Page Header -->
    <section class="page-header">
      <div>
        <div class="page-header-eyebrow">מבט מקצועי · המורים שלי</div>
        <h1 id="page-title">דשבורד מדריכה</h1>
        <p class="page-header-sub" id="page-subtitle">—</p>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-primary" id="btn-new-training">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          הדרכה חדשה
        </button>
        <div class="page-compass">
          <svg class="page-compass-svg" viewBox="0 0 80 80" fill="none" aria-hidden="true">
            <circle cx="40" cy="40" r="34" stroke="#D8E1E5" stroke-width="1" stroke-dasharray="3 4"/>
            <circle cx="40" cy="40" r="22" stroke="#D8E1E5" stroke-width="1"/>
            <circle cx="40" cy="40" r="10" stroke="#6FB7A6" stroke-width="1.2" opacity="0.7"/>
            <path d="M40 18 L43 40 L40 38 L37 40 Z" fill="#256A8A"/>
            <path d="M40 62 L37 40 L40 42 L43 40 Z" fill="#C8B9D9" opacity="0.7"/>
            <circle cx="40" cy="40" r="3.5" fill="#FFFFFF" stroke="#256A8A" stroke-width="1.2"/>
            <circle cx="40" cy="40" r="1.5" fill="#256A8A"/>
            <text x="40" y="15" text-anchor="middle" font-family="Frank Ruhl Libre" font-size="8" font-weight="700" fill="#256A8A">N</text>
          </svg>
          <div class="page-compass-info">
            <strong id="user-name">—</strong>
            <div class="page-compass-status">
              <span>מערכת מעודכנת</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Compass Divider -->
    <div class="compass-divider" aria-hidden="true">
      <span class="label">תמונת מצב</span>
      <div class="line"></div>
      <div class="node"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg></div>
      <div class="line"></div>
    </div>

    <!-- Command Strip — 4 KPIs -->
    <section class="command-strip" aria-label="נתוני המדריך/ה">
      <div class="cmd-metric">
        <div class="cmd-metric-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          מורים שלי
        </div>
        <div class="cmd-metric-value" id="stat-teachers">—</div>
      </div>
      <div class="cmd-metric">
        <div class="cmd-metric-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21h18M3 10l9-7 9 7M5 10v11M19 10v11M9 14h6v7H9z"/></svg>
          בתי ספר
        </div>
        <div class="cmd-metric-value" id="stat-schools">—</div>
      </div>
      <div class="cmd-metric">
        <div class="cmd-metric-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          הדרכות השנה
        </div>
        <div class="cmd-metric-value" id="stat-trainings">—</div>
      </div>
      <div class="cmd-metric">
        <div class="cmd-metric-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
          אחוז נוכחות ממוצע
        </div>
        <div class="cmd-metric-value mint" id="stat-rate">—</div>
      </div>
    </section>

    <div class="tabs-bar">
      <button class="tab-btn active" data-tab="teachers">המורים שלי</button>
      <button class="tab-btn" data-tab="trainings">ההדרכות שלי</button>
      <button class="tab-btn" data-tab="stats">סטטיסטיקה חודשית</button>
    </div>

    <div class="tab-pane active" id="tab-teachers">
      <div class="search-bar">
        <input type="search" class="input" id="teacher-search" placeholder="חיפוש מורה / בית ספר...">
      </div>
      <div id="teachers-container">
        <div class="empty" style="padding:32px;">טוען...</div>
      </div>
    </div>

    <div class="tab-pane" id="tab-trainings">
      <div class="card" style="padding:0;">
        <div id="trainings-list">
          <div class="empty" style="padding:32px;">טוען...</div>
        </div>
      </div>
    </div>

    <div class="tab-pane" id="tab-stats">
      <div class="card">
        <div class="card-title">אחוז נוכחות חודשי</div>
        <div id="stats-chart"></div>
      </div>
    </div>
  </main>

<!-- New training modal -->
<div class="modal-overlay" id="modal-training">
  <div class="modal">
    <div class="modal-head">
      <h3>הדרכה חדשה</h3>
      <button class="modal-close" onclick="closeNewTraining()">×</button>
    </div>
    <form id="form-training">
      <div class="form-grid">
        <div class="form-row">
          <label class="form-label">מקצוע *</label>
          <select class="select" name="subject" id="t-subject" required>
            <option value="">בחרי מקצוע</option>
          </select>
        </div>
        <div class="form-row">
          <label class="form-label">תאריך *</label>
          <input type="date" class="input" name="date" id="t-date" required>
        </div>
        <div class="form-row">
          <label class="form-label">מיקום</label>
          <input class="input" name="location" placeholder='זום / בית הספר X'>
        </div>
        <div class="form-row">
          <label class="form-label">שם מדריך/ה</label>
          <input class="input" name="guideName">
        </div>
        <div class="form-row" style="grid-column:1/-1;">
          <label class="form-label">מייל מדריך/ה</label>
          <input type="email" class="input" name="guideEmail">
        </div>
        <div class="form-row" style="grid-column:1/-1;">
          <label class="form-label">הערות</label>
          <textarea class="textarea" name="notes" placeholder="נושאים, חומרים..."></textarea>
        </div>
      </div>
      <div class="btn-row" style="margin-top:16px;">
        <button type="submit" class="btn btn-primary">צרי הדרכה</button>
        <button type="button" class="btn btn-secondary" onclick="closeNewTraining()">ביטול</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/app.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
