<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הסטטוס שלי — פיקוח הדרכות</title>
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <div class="topbar-brand">
      <a href="../" style="color:inherit; display:flex; align-items:center; gap:8px; text-decoration:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <span style="font-family: 'Playpen Sans Hebrew', sans-serif; font-weight:800;">הסטטוס שלי</span>
    </div>
    <div class="topbar-user">
      <div>
        <div class="topbar-user-name" id="user-name">—</div>
        <div class="topbar-user-meta" id="user-meta">—</div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Profile card -->
    <div class="card" style="margin-bottom:20px;">
      <h2 style="margin-bottom:12px;">הפרטים שלי</h2>
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px;">
        <div><div style="font-size:13px; color:var(--text-2);">מקצוע</div><div style="font-weight:700; margin-top:4px;" id="p-subject">—</div></div>
        <div><div style="font-size:13px; color:var(--text-2);">סוג</div><div style="margin-top:4px;" id="p-type">—</div></div>
        <div><div style="font-size:13px; color:var(--text-2);">מגזר</div><div style="margin-top:4px;" id="p-sector">—</div></div>
        <div><div style="font-size:13px; color:var(--text-2);">ותק</div><div style="font-weight:700; margin-top:4px;" id="p-seniority">—</div></div>
        <div><div style="font-size:13px; color:var(--text-2);">יח"ל</div><div style="font-weight:700; margin-top:4px;" id="p-units">—</div></div>
        <div><div style="font-size:13px; color:var(--text-2);">תלמידים</div><div style="font-weight:700; margin-top:4px;" id="p-students">—</div></div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;">
        <span id="pd-status"></span>
        <span id="moe-status"></span>
      </div>
    </div>

    <!-- Attendance stats -->
    <h2 style="margin-bottom:12px;">הנוכחות שלי</h2>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">סה"כ הדרכות</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">השתתפתי</div>
        <div class="stat-value ok" id="stat-present">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">חסרתי</div>
        <div class="stat-value warn" id="stat-missed">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">אחוז נוכחות</div>
        <div class="stat-value ok" id="stat-rate">—</div>
      </div>
    </div>

    <!-- Attendance history -->
    <div class="card" style="padding:0; margin-bottom: 32px;">
      <div style="padding: 20px 24px 8px;">
        <h3 style="margin:0;">היסטוריית הדרכות</h3>
      </div>
      <div class="table-wrap" style="border:none;">
        <table class="table">
          <thead>
            <tr>
              <th>תאריך</th>
              <th>מקצוע / נושא</th>
              <th>סטטוס</th>
            </tr>
          </thead>
          <tbody id="history-body">
            <tr><td colspan="3" class="empty">טוען...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Knowledge link -->
    <div class="card" style="margin-bottom: 32px; background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%); border-color: #c4b5fd;">
      <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
        <div style="flex:1; min-width:200px;">
          <h3 style="margin-bottom:6px;">מאגר ידע למורות ומורים</h3>
          <p style="margin:0; color:var(--text-2);">מערכי שיעור, חומרי תרגול, סרטונים — לכל המקצועות.</p>
        </div>
        <a class="btn btn-primary" href="../knowledge/">פתחו את המאגר</a>
      </div>
    </div>

    <!-- Ask a question -->
    <h2 style="margin-bottom:12px;">שאלות למדריכה</h2>
    <div id="questions-list"></div>
    <div class="card" style="margin-top:16px;">
      <form id="form-question">
        <div class="form-row">
          <label class="form-label">שאלה חדשה</label>
          <textarea class="textarea" id="q-text" placeholder="כתבי כאן את השאלה. המדריכה תקבל מייל ותענה בהקדם." required></textarea>
        </div>
        <div class="btn-row" style="margin:0;">
          <button type="submit" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            שליחה למדריכה
          </button>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="../assets/app.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
