<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מאגר ידע — פיקוח הדרכות</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
.kn-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}
.kn-card {
  display: block;
  text-decoration: none;
  color: inherit;
  transition: transform 0.15s, box-shadow 0.2s;
}
.kn-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  text-decoration: none;
}
</style>
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <div class="topbar-brand">
      <a href="../" style="display:flex;align-items:center;color:var(--text-3);text-decoration:none;" title="חזרה לדף הבית">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <svg class="emblem" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" style="width:32px;height:32px;color:var(--brand-primary);">
        <circle cx="32" cy="32" r="29" fill="none"/>
        <circle cx="32" cy="32" r="25" stroke-opacity="0.35" fill="none"/>
        <path d="M32 16v36M24 22v30M40 22v30M18 28v20M46 28v20" stroke-linecap="round" stroke-width="1.4"/>
        <path d="M18 50h28" stroke-linecap="round" stroke-width="2"/>
        <circle cx="32" cy="16" r="2" fill="currentColor"/>
        <circle cx="24" cy="22" r="1.6" fill="currentColor"/>
        <circle cx="40" cy="22" r="1.6" fill="currentColor"/>
        <circle cx="18" cy="28" r="1.4" fill="currentColor"/>
        <circle cx="46" cy="28" r="1.4" fill="currentColor"/>
      </svg>
      <div class="brand-stack">
        <span class="ministry">משרד העבודה</span>
        <span class="system-name">מאגר ידע</span>
      </div>
    </div>
    <div class="topbar-user">
      <button class="btn btn-primary" onclick="openAddItem()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        הוספת פריט
      </button>
    </div>
  </header>

  <main class="container">
    <div style="margin-bottom:24px;">
      <h1>מאגר ידע משותף</h1>
      <p style="color:var(--text-2); margin-top:6px;">מערכי שיעור, תבניות, סרטונים וחומרי הדרכה — לכל המקצועות והתפקידים.</p>
    </div>

    <div class="filter-bar">
      <input type="search" id="search" class="input" placeholder="חיפוש בכותרת או בתיאור..." style="max-width:280px;">
      <select id="cat-filter" class="select">
        <option value="">כל הקטגוריות</option>
      </select>
      <select id="aud-filter" class="select">
        <option value="">לכל קהל היעד</option>
        <option value="teacher">למורים</option>
        <option value="guide">למדריכים</option>
        <option value="principal">למנהלים</option>
      </select>
      <span id="count" style="color:var(--text-2); font-size:14px;">—</span>
    </div>

    <div class="kn-grid" id="items">
      <div class="empty card">טוען...</div>
    </div>
  </main>
</div>

<!-- Add modal -->
<div class="modal-overlay" id="modal-add">
  <div class="modal">
    <div class="modal-head">
      <h3>הוספת פריט חדש</h3>
      <button class="modal-close" onclick="closeAddItem()">×</button>
    </div>
    <form id="form-knowledge">
      <div class="form-row">
        <label class="form-label">כותרת *</label>
        <input class="input" name="title" required>
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label class="form-label">קטגוריה</label>
          <input class="input" name="category" placeholder="למשל: מתמטיקה / מנהלי">
        </div>
        <div class="form-row">
          <label class="form-label">קהל יעד</label>
          <select class="select" name="audience">
            <option value="all">לכולם</option>
            <option value="teacher">למורים</option>
            <option value="guide">למדריכים</option>
            <option value="principal">למנהלים</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">קישור *</label>
        <input type="url" class="input" name="link" required placeholder="https://...">
        <small class="form-hint">קישור ל-Google Doc / Drive / YouTube / אתר חיצוני</small>
      </div>
      <div class="form-row">
        <label class="form-label">תיאור קצר</label>
        <textarea class="textarea" name="description"></textarea>
      </div>
      <div class="btn-row" style="margin:0;">
        <button type="submit" class="btn btn-primary">הוספה</button>
        <button type="button" class="btn btn-secondary" onclick="closeAddItem()">ביטול</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/app.js"></script>
<script src="app.js"></script>
</body>
</html>
