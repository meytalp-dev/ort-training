<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 110" role="img" aria-label="משרד העבודה">
  <!-- Hebrew text "משרד העבודה" — RTL, on the right (visually) -->
  <text x="372" y="68" font-family="Heebo, 'Frank Ruhl Libre', sans-serif"
        font-size="42" font-weight="900" fill="#0b2545"
        text-anchor="end" direction="rtl" letter-spacing="-0.5">משרד העבודה</text>

  <!-- Hexagonal badge on the left -->
  <g transform="translate(55 55)">
    <!-- Outer ring -->
    <circle r="48" fill="#ffffff" stroke="#e5e9f0" stroke-width="1.5"/>

    <!-- Six radial darts, alternating navy and cyan -->
    <path fill="#0b2545" d="M0 -34 L10 -18 L0 -8 L-10 -18 Z"/>
    <path fill="#5fb8d4" d="M0 -34 L10 -18 L0 -8 L-10 -18 Z" transform="rotate(60)"/>
    <path fill="#0b2545" d="M0 -34 L10 -18 L0 -8 L-10 -18 Z" transform="rotate(120)"/>
    <path fill="#5fb8d4" d="M0 -34 L10 -18 L0 -8 L-10 -18 Z" transform="rotate(180)"/>
    <path fill="#0b2545" d="M0 -34 L10 -18 L0 -8 L-10 -18 Z" transform="rotate(240)"/>
    <path fill="#5fb8d4" d="M0 -34 L10 -18 L0 -8 L-10 -18 Z" transform="rotate(300)"/>

    <!-- Center accent dot -->
    <circle r="3" fill="#0b2545"/>
  </g>
</svg>
