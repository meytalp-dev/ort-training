<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משרד העבודה — פיקוח הדרכות</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
.net-card { padding: 20px; }
.net-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}
</style>
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <div class="topbar-brand">
      <a href="../" style="color:inherit; display:flex; align-items:center; gap:8px; text-decoration:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <span style="font-family: 'Playpen Sans Hebrew', sans-serif; font-weight:800;">משרד העבודה</span>
    </div>
    <div class="topbar-user">
      <div class="topbar-user-name">יחידת הפיקוח</div>
      <div class="topbar-user-meta">הדרכות מורים</div>
    </div>
  </header>

  <main class="container">
    <div style="margin-bottom:24px;">
      <h1>תמונת מצב כלל-רשתית — <span id="month-label"></span></h1>
      <p style="color:var(--text-2); margin-top:4px;">סקירה של כל רשתות הפיקוח. לחיצה על כפתור "שליחה" מייצרת מייל מוכן לרשת המסוימת.</p>
    </div>

    <!-- Top stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-label">רשתות</div>
        <div class="stat-value" id="stat-networks">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">בתי ספר</div>
        <div class="stat-value" id="stat-schools">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">סה"כ מורים</div>
        <div class="stat-value" id="stat-teachers">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">נוכחות כללית</div>
        <div class="stat-value ok" id="stat-rate">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">בהשתלמות פעילה</div>
        <div class="stat-value info" id="stat-pd">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">פספסו החודש</div>
        <div class="stat-value warn" id="stat-missed">—</div>
      </div>
    </div>

    <!-- Per network cards -->
    <h2 style="margin-bottom:12px;">פילוח לפי רשת</h2>
    <div class="net-grid" id="cards">
      <div class="empty card">טוען...</div>
    </div>
  </main>
</div>

<script src="../assets/app.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
