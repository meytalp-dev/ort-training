<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מנהל רשת — פיקוח הדרכות</title>
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <div class="topbar-brand">
      <a href="../" style="color:inherit; display:flex; align-items:center; gap:8px; text-decoration:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <span style="font-family: 'Playpen Sans Hebrew', sans-serif; font-weight:800;">מנהל רשת</span>
    </div>
    <div class="topbar-user">
      <div>
        <div class="topbar-user-name" id="user-name">—</div>
        <div class="topbar-user-meta">
          <span id="user-network">—</span>
          <span class="network-tag" style="margin-right:6px;"></span>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:20px;">
      <h1>תמונת מצב חודשית — <span id="month-label"></span></h1>
      <button class="btn btn-primary" id="btn-send-report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        שליחת דוח למשרד העבודה
      </button>
    </div>

    <!-- Top stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-label">בתי ספר ברשת</div>
        <div class="stat-value" id="stat-schools">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">סה"כ מורים</div>
        <div class="stat-value" id="stat-teachers">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">אחוז נוכחות החודש</div>
        <div class="stat-value ok" id="stat-attendance">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">בהשתלמות פעילה</div>
        <div class="stat-value info" id="stat-pd">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">פספסו החודש</div>
        <div class="stat-value warn" id="stat-missed">—</div>
      </div>
    </div>

    <!-- Sector breakdown -->
    <div class="card" style="margin-bottom: 24px;">
      <div class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        פילוח לפי מגזר
      </div>
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px;">
        <div style="background: var(--surface-2); border-radius: 12px; padding: 16px;">
          <div style="font-size:13px; color:var(--text-2);">מגזר חרדי</div>
          <div style="font-family:'Playpen Sans Hebrew'; font-size:28px; font-weight:800;" id="sec-haredi">—</div>
          <div style="font-size:12px; color:var(--text-3);" id="sec-haredi-pct">—</div>
        </div>
        <div style="background: var(--surface-2); border-radius: 12px; padding: 16px;">
          <div style="font-size:13px; color:var(--text-2);">מגזר ערבי</div>
          <div style="font-family:'Playpen Sans Hebrew'; font-size:28px; font-weight:800;" id="sec-arab">—</div>
          <div style="font-size:12px; color:var(--text-3);" id="sec-arab-pct">—</div>
        </div>
        <div style="background: var(--surface-2); border-radius: 12px; padding: 16px;">
          <div style="font-size:13px; color:var(--text-2);">מגזר כללי</div>
          <div style="font-family:'Playpen Sans Hebrew'; font-size:28px; font-weight:800;" id="sec-kelali">—</div>
          <div style="font-size:12px; color:var(--text-3);" id="sec-kelali-pct">—</div>
        </div>
      </div>
    </div>

    <!-- Schools table -->
    <div class="card" style="padding:0;">
      <div style="padding: 24px 24px 0;">
        <h2 style="margin:0;">בתי הספר ברשת</h2>
        <p style="color:var(--text-2); font-size:14px; margin-top:8px;">לחיצה על "פתח" — צפייה בדשבורד של בית הספר</p>
      </div>
      <div class="table-wrap" style="border:none; margin-top:16px;">
        <table class="table">
          <thead>
            <tr>
              <th>בית ספר</th>
              <th>מורים</th>
              <th>השתתפו החודש</th>
              <th>אחוז</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="schools-body">
            <tr><td colspan="5" class="empty">טוען נתונים...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../assets/app.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
