<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>היום שלך במערכת | פולס מיפוי שימוש</title>
<meta name="description" content="פולס דקה — איך אתה משתמש במערכת הפדגוגית של בית הספר. בסוף — דיוקן אישי.">
<meta property="og:title" content="היום שלך במערכת">
<meta property="og:description" content="פולס דקה שממפה את היום שלך במערכת הפדגוגית. בסוף — דיוקן אישי.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
h1,h2,h3,h4,h5,h6,.card-title,.section-title,.header-title{font-family:'Playpen Sans Hebrew','Heebo',sans-serif;font-weight:700}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.04) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.04) 0%,transparent 70%),
    radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.03) 0%,transparent 70%);
  pointer-events:none;z-index:0}
body{
  font-family:Heebo,sans-serif;color:#fff;
  display:flex;align-items:center;justify-content:center;
  background:#111;-webkit-user-select:none;user-select:none;
}

/* ==================== FRAME ==================== */
.frame{
  width:100%;max-width:420px;height:100vh;max-height:780px;
  overflow:hidden;position:relative;
  background:linear-gradient(135deg,#6B5BD8,#3a2b8a);
}
@media(min-width:500px){
  .frame{border-radius:36px;height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.4)}
}

/* ==================== PROGRESS ==================== */
.bars{
  position:absolute;top:8px;left:8px;right:8px;z-index:20;
  display:flex;gap:3px;padding:0 4px;
}
.bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.bar .fill{height:100%;width:0;background:#fff;border-radius:3px;transition:width .3s}
.bar.done .fill{width:100%}
.bar.now .fill{width:100%;transition:none}

/* ==================== SCREEN ==================== */
.scr{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:48px 24px 48px;
  text-align:center;opacity:0;pointer-events:none;
  transition:opacity .4s,transform .4s;transform:translateX(-30px);
}
.scr.on{opacity:1;pointer-events:auto;transform:translateX(0)}

/* ==================== INTRO ==================== */
.intro-icon{
  width:72px;height:72px;border-radius:24px;display:flex;align-items:center;justify-content:center;
  margin-bottom:20px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.15);
}
h1{font-size:1.6rem;font-weight:900;margin-bottom:8px}
.sub{font-size:.9rem;opacity:.7;line-height:1.5;margin-bottom:28px;max-width:300px}
.pill{
  padding:14px 48px;border:none;border-radius:50px;font-family:Heebo;
  font-size:1rem;font-weight:700;color:#fff;cursor:pointer;
  background:rgba(255,255,255,.18);backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,.25);transition:all .2s;
}
.pill:active{transform:scale(.96)}
.tag{font-size:.7rem;opacity:.4;margin-top:14px;letter-spacing:1px}

/* ==================== THIS OR THAT ==================== */
.tot-label{font-size:.85rem;opacity:.55;margin-bottom:12px;font-weight:600}
.tot-q{font-size:1.1rem;font-weight:700;margin-bottom:24px;line-height:1.4;max-width:320px}
.tot-vs{
  display:flex;gap:12px;width:100%;max-width:340px;height:200px;
}
.tot-side{
  flex:1;border-radius:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:2px solid rgba(255,255,255,.12);transition:all .35s;
  position:relative;overflow:hidden;padding:16px 12px;
  background:rgba(255,255,255,.05);
}
.tot-side:active{transform:scale(.97)}
.tot-side.picked{border-color:#fff;background:rgba(255,255,255,.18)}
.tot-side.not-picked{opacity:.35;transform:scale(.94)}
.tot-emoji{font-size:2.6rem;transition:transform .3s}
.tot-side.picked .tot-emoji{transform:scale(1.15)}
.tot-text{font-size:.88rem;font-weight:600;line-height:1.4}
.tot-pct{font-size:1.6rem;font-weight:900;opacity:0;transition:opacity .4s;margin-top:4px}
.tot-side.picked .tot-pct,.tot-side.not-picked .tot-pct{opacity:.7}
.tot-divider{
  display:flex;align-items:center;font-size:.75rem;font-weight:800;
  opacity:.3;writing-mode:vertical-rl;letter-spacing:2px;
}
.trivia-result{margin-top:16px;font-size:.85rem;opacity:0;transition:opacity .4s;line-height:1.5;max-width:320px}

/* ==================== ID GRID (role/stage/size) ==================== */
.id-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:300px}
.id-grid.three{grid-template-columns:repeat(2,1fr)}
.id-btn{
  padding:18px 10px;border:2px solid rgba(255,255,255,.12);border-radius:16px;
  background:rgba(255,255,255,.04);color:#fff;font-family:Heebo;
  font-size:.95rem;font-weight:600;cursor:pointer;transition:all .25s;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.id-btn:active{transform:scale(.95)}
.id-btn.sel{border-color:#fff;background:rgba(255,255,255,.18)}
.id-btn .id-emoji{font-size:1.6rem}
.id-btn .id-label{font-size:.85rem;font-weight:600}

/* ==================== EMOJI SLIDER ==================== */
.q-num{font-size:.75rem;font-weight:600;opacity:.5;margin-bottom:10px;letter-spacing:1px}
.q-text{font-size:1.25rem;font-weight:700;line-height:1.45;margin-bottom:24px;max-width:320px}

.slider-wrap{width:100%;max-width:300px;position:relative;padding:0 8px}
.slider-face{
  font-size:3.5rem;margin-bottom:16px;transition:transform .15s;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.2));
}
.slider-track{
  width:100%;height:8px;border-radius:8px;position:relative;
  background:linear-gradient(to right,rgba(240,144,144,.5),rgba(240,216,122,.4),rgba(126,207,160,.5));
}
.slider-input{
  -webkit-appearance:none;appearance:none;width:100%;height:8px;
  background:transparent;position:absolute;top:0;left:0;margin:0;cursor:pointer;
}
.slider-input::-webkit-slider-thumb{
  -webkit-appearance:none;width:32px;height:32px;border-radius:50%;
  background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:grab;
  border:3px solid rgba(255,255,255,.8);opacity:.2;transition:opacity .3s;
}
.slider-input.touched::-webkit-slider-thumb{opacity:1}
.slider-input::-moz-range-thumb{
  width:32px;height:32px;border-radius:50%;
  background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:grab;
  border:3px solid rgba(255,255,255,.8);opacity:.2;transition:opacity .3s;
}
.slider-input.touched::-moz-range-thumb{opacity:1}
.slider-labels{display:flex;justify-content:space-between;margin-top:10px}
.slider-labels span{font-size:.7rem;opacity:.5;font-weight:500}
.slider-val{
  font-size:1rem;font-weight:700;margin-top:14px;opacity:0;
  transition:opacity .3s;
}
.slider-val.show{opacity:.85}
.btn-next{
  margin-top:20px;padding:10px 36px;border:none;border-radius:50px;
  font-family:Heebo;font-size:.88rem;font-weight:700;color:#fff;
  cursor:pointer;transition:all .2s;opacity:0;pointer-events:none;
  background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.25);
}
.btn-next.show{opacity:1;pointer-events:auto}
.btn-next:active{transform:scale(.96)}

/* ==================== ALERTNESS ==================== */
.alert-icon{font-size:2.8rem;margin-bottom:12px}
.alert-q{font-size:1.05rem;font-weight:700;margin-bottom:6px;line-height:1.4;max-width:300px}
.alert-sub{font-size:.85rem;opacity:.55;margin-bottom:24px}
.alert-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:280px}
.alert-btn{
  padding:16px;border:2px solid rgba(255,255,255,.12);border-radius:16px;
  background:rgba(255,255,255,.05);color:#fff;font-family:Heebo;
  font-size:.95rem;font-weight:600;cursor:pointer;transition:all .3s;
}
.alert-btn:active{transform:scale(.95)}
.alert-btn.yes{border-color:#7ecfa0;background:rgba(126,207,160,.2)}
.alert-btn.no{border-color:#f09090;background:rgba(240,144,144,.15);opacity:.4}

/* ==================== MULTI SELECT ==================== */
.multi-q{font-size:1.1rem;font-weight:700;margin-bottom:6px;line-height:1.4;max-width:320px}
.multi-sub{font-size:.78rem;opacity:.55;margin-bottom:18px}
.multi-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  width:100%;max-width:340px;max-height:380px;overflow-y:auto;padding:4px;
}
.multi-btn{
  padding:12px 10px;border:2px solid rgba(255,255,255,.12);border-radius:14px;
  background:rgba(255,255,255,.04);color:#fff;font-family:Heebo;
  font-size:.78rem;font-weight:600;cursor:pointer;transition:all .25s;line-height:1.3;
}
.multi-btn:active{transform:scale(.95)}
.multi-btn.sel{border-color:#7ecfa0;background:rgba(126,207,160,.18)}
.multi-done{
  margin-top:14px;padding:11px 32px;border:none;border-radius:50px;
  font-family:Heebo;font-size:.88rem;font-weight:700;color:#fff;cursor:pointer;
  background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.25);
}
.multi-done:active{transform:scale(.96)}

/* ==================== TIME SLIDER ==================== */
.time-val{
  font-family:'Playpen Sans Hebrew',sans-serif;font-size:3.2rem;font-weight:800;
  margin-bottom:4px;
}
.time-unit{font-size:.95rem;opacity:.6;margin-bottom:24px}
.time-slider-track{
  width:100%;height:10px;border-radius:8px;
  background:rgba(255,255,255,.15);position:relative;
}
.time-slider-input{
  -webkit-appearance:none;appearance:none;width:100%;height:10px;
  background:transparent;position:absolute;top:0;left:0;margin:0;cursor:pointer;
}
.time-slider-input::-webkit-slider-thumb{
  -webkit-appearance:none;width:34px;height:34px;border-radius:50%;
  background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:grab;
  border:4px solid #fff;
}
.time-slider-input::-moz-range-thumb{
  width:34px;height:34px;border-radius:50%;
  background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:grab;
  border:4px solid #fff;
}

/* ==================== CONTACT ==================== */
.input-stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-bottom:14px}
.input-field{
  padding:14px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);color:#fff;font-family:Heebo;
  font-size:.95rem;text-align:right;outline:none;transition:border-color .2s;
}
.input-field::placeholder{color:rgba(255,255,255,.5)}
.input-field:focus{border-color:rgba(255,255,255,.5)}
.skip-link{font-size:.8rem;color:rgba(255,255,255,.6);cursor:pointer;margin-top:8px;text-decoration:underline}

/* ==================== DONE / RESULT ==================== */
.done-icon{
  width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin-bottom:16px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);
  animation:pop .5s ease;
}
@keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.15)}100%{transform:scale(1)}}

.persona-tag{
  font-family:'Playpen Sans Hebrew',sans-serif;font-size:.8rem;font-weight:600;
  opacity:.7;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;
}
.persona-name{
  font-family:'Playpen Sans Hebrew',sans-serif;font-size:2.2rem;font-weight:800;
  line-height:1.1;margin-bottom:14px;
}
.persona-tagline{
  font-size:.92rem;line-height:1.5;opacity:.85;max-width:300px;margin-bottom:20px;
}
.persona-stats{
  display:flex;gap:22px;margin-bottom:18px;
}
.persona-stat{text-align:center}
.persona-stat .v{font-family:'Playpen Sans Hebrew',sans-serif;font-size:1.5rem;font-weight:800}
.persona-stat .l{font-size:.65rem;opacity:.55;margin-top:2px}
.share-pill{
  margin-top:8px;padding:11px 28px;border:none;border-radius:50px;
  font-family:Heebo;font-size:.85rem;font-weight:700;color:#fff;cursor:pointer;
  background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.3);
  display:inline-flex;align-items:center;gap:8px;
}
.share-pill:active{transform:scale(.96)}

/* Confetti */
.confetti-box{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.cft{position:absolute;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{
  0%{transform:translateY(-20px) rotate(0);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* Shake */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* Blobs */
.blob{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0}

/* Shtayim footer */
.shtayim-footer{
  position:absolute;bottom:6px;left:0;right:0;text-align:center;
  font-size:9px;opacity:.35;color:#fff;letter-spacing:.5px;z-index:15;
  pointer-events:auto;
}
.shtayim-footer a{color:#fff;text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.3)}
</style>
</head>
<body>

<div class="frame" id="frame">
  <div class="bars" id="bars"></div>
  <div class="blob" id="b1" style="width:200px;height:200px;top:-40px;right:-60px;opacity:.3;background:#C9B8E8"></div>
  <div class="blob" id="b2" style="width:160px;height:160px;bottom:10%;left:-40px;opacity:.2;background:#8FD4C4"></div>
  <div id="screens"></div>
  <div class="shtayim-footer">כלי של <a href="https://meytalp-dev.github.io/ort-training/shtayim/site.html" target="_blank">שתיים</a></div>
</div>

<script>
// ============================================
// CONFIG
// ============================================
const API = 'https://script.google.com/macros/s/AKfycbyPD4m86R6j9EEotSgWjqwc0BHqMPyLnwsriVOe8jgVz6-oyRhsuqYuoC9vqucIdZxDmw/exec';

// 7 modules — questions framed as frequency
const MODULES = [
  { id:'attendance', q:'כמה פעמים אתה רושם נוכחות במערכת?' },
  { id:'grades',     q:'כמה פעמים אתה נכנס למודול הציונים?' },
  { id:'parents',    q:'כמה פעמים אתה משתמש בתקשורת עם הורים דרך המערכת?' },
  { id:'timetable',  q:'כמה פעמים אתה נוגע במערכת השעות / מילוי מקום?' },
  { id:'reports',    q:'כמה פעמים אתה מפיק דוחות פדגוגיים?' },
  { id:'planning',   q:'כמה פעמים אתה עובד עם תוכניות עבודה / מעקב יעדים?' },
  { id:'discipline', q:'כמה פעמים אתה מטפל באישורי היעדרות / משמעת?' }
];

// 5-point frequency scale (matches FACES order)
const FACES = ['&#128548;','&#128533;','&#128528;','&#128578;','&#128293;'];
const FACE_LABELS = ['לא משתמש','פחות','פעם בשבוע','כמה פעמים בשבוע','כל יום'];
const FREQ_KEYS = ['never','rare','weekly','often','daily'];

// Warm-up: 2 trivia/preference cards
const WARMUP = [
  { mode:'fact',
    q:'נכון או לא נכון?',
    fact:'&#128187; משתמש ממוצע במערכת ניהול עובר 47 לחיצות עכבר רק כדי לרשום נוכחות לכיתה אחת',
    answer:'נכון! מחקרים מראים שמערכות פדגוגיות דורשות בממוצע יותר מ-40 קליקים למשימה בסיסית.' },
  { mode:'pref',
    q:'מה אתה מעדיף?',
    a:'&#128241; אפליקציה בסלולר',
    b:'&#128187; דסקטופ במחשב',
    ap:62, bp:38 }
];

// Alertness check
const ALERT = { q:'סמן את התשובה שכתוב בה "פדגוגי"', o:['מנהלי','חינוכי','פדגוגי','טכני'], c:2 };

// Outside-system options
const OUTSIDE_OPTIONS = [
  'תקשורת בוואטסאפ',
  'אקסל לציונים',
  'אקסל לנוכחות',
  'מחברת/דף אישי',
  'גוגל שיטס משותף',
  'מערכת שעות בנפרד',
  'מעקב משמעת בנפרד',
  'תכנון פדגוגי בנפרד',
  'דוחות בנפרד',
  'אחר'
];

// 9 personas
const PERSONAS = {
  contact:    { name:'איש הקשר',  tag:'מתחבר',           tagline:'הלב של בית הספר עובר דרכך — אתה זה שמדבר עם ההורים, מעדכן ומחבר.' },
  documenter: { name:'המתעד',     tag:'מדייק',           tagline:'נוכחות, ציונים, פרטים קטנים — אתה דואג שהכול יהיה במקום ובזמן.' },
  strategist: { name:'האסטרטג',   tag:'רואה רחוק',       tagline:'דוחות, יעדים ותכנון — אתה עובד על התמונה הגדולה, לא על הניהול היומי.' },
  pragmatist: { name:'הפרגמטי',   tag:'עוקף את הבירוקרטיה', tagline:'אקסל, וואטסאפ, גוגל שיטס — אתה משתמש במה שעובד, גם מחוץ למערכת.' },
  adaptive:   { name:'המסתגל',    tag:'מאזן בין השניים', tagline:'גם בתוך המערכת וגם בלעדיה. בוחר לכל משימה את הכלי הנכון.' },
  swift:      { name:'הזריז',     tag:'יעיל ולעניין',     tagline:'נכנס, עושה את שלך, יוצא. מעט מודולים — אבל בדיוק מה שצריך.' },
  mentor:     { name:'המנטור',    tag:'אישי וחם',         tagline:'הערות איכותיות, משוב, מעקב — אתה משקיע באנשים, לא רק בנתונים.' },
  starter:    { name:'המתחיל',    tag:'בתחילת הדרך',     tagline:'עוד גילית רק חלק מהמערכת. הרבה מקום לגדול — וגם לחסוך זמן.' },
  routine:    { name:'השגרתי',    tag:'יציב ועקבי',       tagline:'אותה שגרה, יום אחר יום, בכל המודולים. הבסיס שכולם נשענים עליו.' }
};

// ============================================
// STATE
// ============================================
let cur = 0, total = 0;
const ans = {
  role:null, stage:null, schoolSize:null,
  modules:{}, outsideSystem:[], minutesPerDay:30,
  name:'', email:'', alertness:null
};

// Screen indices
const SCREENS = {
  intro: 0,
  warmup1: 1,
  warmup2: 2,
  role: 3,
  stage: 4,
  size: 5,
  // modules: 6..6+halfA-1, alertness: 6+halfA, modules: 6+halfA+1..., outside, time, contact, done
};
let MODULE_SCREENS = [];
let ALERT_SCREEN = 0, OUTSIDE_SCREEN = 0, TIME_SCREEN = 0, CONTACT_SCREEN = 0, DONE_SCREEN = 0;

// ============================================
// BUILD
// ============================================
function init() {
  const halfA = Math.ceil(MODULES.length / 2); // alertness after first half

  // Compute screen layout
  let si = 6; // after intro+2warmup+role+stage+size
  for (let i = 0; i < MODULES.length; i++) {
    if (i === halfA) {
      ALERT_SCREEN = si;
      si++;
    }
    MODULE_SCREENS[i] = si;
    si++;
  }
  OUTSIDE_SCREEN = si++;
  TIME_SCREEN = si++;
  CONTACT_SCREEN = si++;
  DONE_SCREEN = si;
  total = DONE_SCREEN + 1;

  // Render bars
  document.getElementById('bars').innerHTML = Array(total).fill('<div class="bar"><div class="fill"></div></div>').join('');

  let h = '';

  // 0 — Intro
  h += `<div class="scr on" data-i="0">
    <div class="intro-icon">

// ============================================
// INTERACTIONS
// ============================================
function pickWarmup(si, side, el) {
  const parent = el.closest('.tot-vs');
  parent.querySelectorAll('.tot-side').forEach(s => {
    if (s === el) { s.classList.add('picked'); s.classList.remove('not-picked'); }
    else { s.classList.add('not-picked'); s.classList.remove('picked'); }
  });
  const resultEl = document.getElementById('totResult' + si);
  const delay = (resultEl && resultEl.textContent.trim()) ? 2200 : 1100;
  if (resultEl && resultEl.textContent.trim()) resultEl.style.opacity = '1';
  setTimeout(() => go(si + 1), delay);
}

function pickId(field, value, el) {
  ans[field] = value;
  el.parentElement.querySelectorAll('.id-btn').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
  setTimeout(() => go(cur + 1), 350);
}

let sliderTouched = {};
function onSlide(si, modId, val) {
  val = parseInt(val);
  const face = document.getElementById('face' + si);
  face.innerHTML = FACES[val - 1];
  face.style.opacity = '1';
  document.getElementById('val' + si).textContent = FACE_LABELS[val - 1];
  document.getElementById('val' + si).classList.add('show');
  document.getElementById('btn' + si).classList.add('show');
  sliderTouched[si] = true;
  ans.modules[modId] = FREQ_KEYS[val - 1];
  document.getElementById('sl' + si).classList.add('touched');
  face.style.transform = 'scale(1.2)';
  setTimeout(() => face.style.transform = 'scale(1)', 150);
}

function confirmModule(si, qi) {
  if (!sliderTouched[si]) {
    const wrap = document.getElementById('face' + si).parentElement;
    wrap.style.animation = 'none'; wrap.offsetHeight;
    wrap.style.animation = 'shake .4s ease';
    return;
  }
  if (qi === MODULES.length - 1) {
    go(OUTSIDE_SCREEN);
    return;
  }
  const halfA = Math.ceil(MODULES.length / 2);
  if (qi === halfA - 1) {
    go(ALERT_SCREEN);
  } else {
    go(MODULE_SCREENS[qi + 1]);
  }
}

function checkAl(idx, el) {
  ans.alertness = (idx === ALERT.c);
  const btns = el.closest('.alert-opts').querySelectorAll('.alert-btn');
  btns.forEach((b, bi) => {
    b.style.pointerEvents = 'none';
    if (bi === ALERT.c) b.classList.add('yes');
    else if (bi === idx && idx !== ALERT.c) b.classList.add('no');
  });
  const halfA = Math.ceil(MODULES.length / 2);
  setTimeout(() => go(MODULE_SCREENS[halfA]), 1100);
}

function toggleMulti(el, value) {
  el.classList.toggle('sel');
  if (el.classList.contains('sel')) {
    if (!ans.outsideSystem.includes(value)) ans.outsideSystem.push(value);
  } else {
    ans.outsideSystem = ans.outsideSystem.filter(v => v !== value);
  }
}

// ============================================
// NAV
// ============================================
function go(i) {
  document.querySelectorAll('.scr').forEach(s => {
    const si = +s.dataset.i;
    if (si === cur) s.classList.remove('on');
    if (si === i) s.classList.add('on');
  });
  cur = i;
  bars();
}

function bars() {
  document.querySelectorAll('.bar').forEach((b, i) => {
    b.classList.remove('done', 'now');
    if (i < cur) b.classList.add('done');
    if (i === cur) b.classList.add('now');
    const f = b.querySelector('.fill');
    f.style.width = i <= cur ? '100%' : '0%';
  });
}

// ============================================
// PERSONA + FINISH
// ============================================
function freqScore(f) { return { daily:4, often:3, weekly:2, rare:1, never:0 }[f] || 0; }

function calculatePersona() {
  const m = ans.modules;
  const outside = ans.outsideSystem.length;
  const minutes = ans.minutesPerDay;
  const activeCount = Object.values(m).filter(v => v === 'daily' || v === 'often').length;

  const score = {
    parents: freqScore(m.parents),
    documentation: freqScore(m.attendance) + freqScore(m.grades),
    strategy: freqScore(m.reports) + freqScore(m.planning),
    discipline: freqScore(m.discipline)
  };

  if (activeCount <= 2) return 'starter';
  if (outside >= 5) return 'pragmatist';
  if (score.parents >= 3 && score.documentation < 5) return 'contact';
  if (score.documentation >= 6) return 'documenter';
  if (score.strategy >= 4 && score.documentation < 4) return 'strategist';
  if (score.parents >= 2 && score.documentation >= 3 && ans.role === 'teacher') return 'mentor';
  if (activeCount >= 5 && minutes >= 45) return 'routine';
  if (activeCount <= 4 && minutes <= 30) return 'swift';
  return 'adaptive';
}

function finish() {
  const personaId = calculatePersona();
  const p = PERSONAS[personaId];
  const activeCount = Object.values(ans.modules).filter(v => v === 'daily' || v === 'often').length;

  document.getElementById('pTag').textContent = p.tag;
  document.getElementById('pName').textContent = p.name;
  document.getElementById('pTagline').textContent = p.tagline;
  document.getElementById('pActive').textContent = activeCount;
  document.getElementById('pOutside').textContent = ans.outsideSystem.length;
  document.getElementById('pMins').textContent = ans.minutesPerDay;

  go(DONE_SCREEN);
  confetti();
  save(personaId);
}

function save(personaId) {
  if (!API) return;
  const payload = {
    timestamp: new Date().toISOString(),
    role: ans.role,
    stage: ans.stage,
    schoolSize: ans.schoolSize,
    modules: ans.modules,
    outsideSystem: ans.outsideSystem,
    minutesPerDay: ans.minutesPerDay,
    name: ans.name || '(אנונימי)',
    email: ans.email || '',
    persona: personaId,
    alertness: ans.alertness,
    referrer: document.referrer || 'direct'
  };
  fetch(API, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).catch(() => {});
}

function confetti() {
  const box = document.getElementById('cft');
  const cols = ['#C9B8E8','#fff','#FFD700','#FF6B8A','#7ecfa0','#a0c4ff'];
  for (let i = 0; i < 50; i++) {
    const e = document.createElement('div');
    e.className = 'cft';
    e.style.background = cols[~~(Math.random() * cols.length)];
    e.style.left = Math.random() * 100 + '%';
    e.style.width = (4 + Math.random() * 8) + 'px';
    e.style.height = (4 + Math.random() * 8) + 'px';
    e.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    e.style.animationDelay = (Math.random() * .8) + 's';
    e.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    box.appendChild(e);
  }
}

function shareWA() {
  const url = window.location.href;
  const text = encodeURIComponent(`היום שלך במערכת — פולס דקה שמראה איך אתה משתמש במערכת הפדגוגית. בסוף יוצא דיוקן אישי. ${url}`);
  window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
}

// Touch swipe back (RTL)
const noBack = new Set([0, 1, 2]);
let tx = 0;
document.addEventListener('touchstart', e => tx = e.touches[0].clientX);
document.addEventListener('touchend', e => {
  const delta = e.changedTouches[0].clientX - tx;
  if (delta > 60 && !noBack.has(cur) && cur > 0 && cur < DONE_SCREEN) go(cur - 1);
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && !noBack.has(cur) && cur > 0 && cur < DONE_SCREEN) go(cur - 1);
});

init();
</script>
