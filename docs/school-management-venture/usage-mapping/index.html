<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
h1,h2,h3,h4,h5,h6,.card-title{font-family:'Playpen Sans Hebrew','Heebo',sans-serif;font-weight:700}
body{
  font-family:Heebo,sans-serif;color:#fff;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(at 30% 20%,#6B5BD8 0%,#3a2b8a 60%,#1a1240 100%);
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;
}

.frame{
  width:100%;max-width:430px;height:100dvh;max-height:900px;
  overflow:hidden;position:relative;
  background:transparent;
}
@media(min-width:500px) and (min-height:700px){
  .frame{border-radius:36px;height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.4);background:radial-gradient(at 30% 20%,#6B5BD8 0%,#3a2b8a 60%,#1a1240 100%)}
}

/* Floating blobs */
.blob{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0;animation:blobFloat 14s ease-in-out infinite}
.blob.b1{width:200px;height:200px;top:-40px;right:-60px;background:#C9B8E8;opacity:.35}
.blob.b2{width:160px;height:160px;bottom:8%;left:-40px;background:#8FD4C4;opacity:.25;animation-delay:-7s}
@keyframes blobFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(20px,-30px) scale(1.1)}
}

/* Progress bars */
.bars{
  position:absolute;
  top:calc(8px + env(safe-area-inset-top,0px));
  left:8px;right:8px;z-index:20;
  display:flex;gap:3px;padding:0 4px;
}
.bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.bar .fill{height:100%;width:0;background:#fff;border-radius:3px;transition:width .3s}
.bar.done .fill{width:100%}
.bar.now .fill{width:100%}

/* Step text */
.step-text{
  position:absolute;
  top:calc(20px + env(safe-area-inset-top,0px));
  right:16px;z-index:20;
  font-size:.7rem;font-weight:600;color:rgba(255,255,255,.55);letter-spacing:.5px;
}

/* Screens */
.scr{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:56px 22px calc(56px + env(safe-area-inset-bottom,0px));
  text-align:center;opacity:0;pointer-events:none;
  transition:opacity .35s ease;
  z-index:5;
}
.scr.on{opacity:1;pointer-events:auto}

/* Intro */
.intro-icon{
  width:72px;height:72px;border-radius:24px;display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.18);
}
h1{font-size:1.55rem;font-weight:900;margin-bottom:8px;line-height:1.2}
.sub{font-size:.92rem;opacity:.78;line-height:1.5;margin-bottom:22px;max-width:320px}
.trust-line{
  font-size:.72rem;opacity:.7;line-height:1.5;
  background:rgba(255,255,255,.08);padding:10px 14px;border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  max-width:330px;margin-bottom:18px;
}
.trust-line strong{font-weight:700;opacity:.9}
.pill{
  padding:14px 44px;border:none;border-radius:50px;font-family:Heebo;
  font-size:1rem;font-weight:700;color:#fff;cursor:pointer;
  background:rgba(255,255,255,.18);backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,.28);transition:transform .2s, background .2s;
}
.pill:active{transform:scale(.96)}
.pill.primary{background:#fff;color:#3a2b8a;border-color:#fff}
.tag{font-size:.7rem;opacity:.45;margin-top:14px;letter-spacing:1px}

/* Audience selector */
.aud-grid{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.aud-btn{
  padding:22px 18px;border:2px solid rgba(255,255,255,.15);border-radius:18px;
  background:rgba(255,255,255,.06);color:#fff;font-family:Heebo;cursor:pointer;
  transition:all .25s;text-align:right;
  display:flex;align-items:center;gap:14px;
}
.aud-btn:active{transform:scale(.97)}
.aud-btn:hover{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.12)}
.aud-icon{
  width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.aud-text{flex:1}
.aud-title{font-size:1.05rem;font-weight:700;margin-bottom:3px}
.aud-desc{font-size:.78rem;opacity:.7;line-height:1.4}

/* ID grid */
.id-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:320px}
.id-grid.col1{grid-template-columns:1fr}
.id-btn{
  padding:16px 12px;border:2px solid rgba(255,255,255,.12);border-radius:14px;
  background:rgba(255,255,255,.05);color:#fff;font-family:Heebo;
  font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;
  min-height:54px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;
}
.id-btn:active{transform:scale(.95)}
.id-btn.sel{border-color:#fff;background:rgba(255,255,255,.2)}

/* Question (signal bars) */
.q-num{font-size:.72rem;font-weight:600;opacity:.55;margin-bottom:8px;letter-spacing:1px}
.q-text{font-size:1.18rem;font-weight:700;line-height:1.4;margin-bottom:8px;max-width:330px}
.q-context{font-size:.78rem;opacity:.6;margin-bottom:18px;font-weight:500;max-width:320px;line-height:1.5}

.signal-display{
  display:flex;flex-direction:row-reverse;align-items:flex-end;
  justify-content:center;gap:7px;height:88px;margin-bottom:14px;
}
.sig-bar{
  width:20px;border-radius:5px 5px 3px 3px;
  background:rgba(255,255,255,.13);
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
}
.sig-bar:nth-child(1){height:22px}
.sig-bar:nth-child(2){height:38px}
.sig-bar:nth-child(3){height:54px}
.sig-bar:nth-child(4){height:70px}
.sig-bar:nth-child(5){height:88px}
.sig-bar.lit{box-shadow:0 0 18px currentColor}
/* Color levels — by how many bars are lit (set on container) */
.signal-display.lvl-1 .sig-bar.lit{background:#8FD4C4;color:#8FD4C4}
.signal-display.lvl-2 .sig-bar.lit{background:#7ecfa0;color:#7ecfa0}
.signal-display.lvl-3 .sig-bar.lit{background:#FFD96B;color:#FFD96B}
.signal-display.lvl-4 .sig-bar.lit{background:#FFB89B;color:#FFB89B}
.signal-display.lvl-5 .sig-bar.lit{background:#FF6B8A;color:#FF6B8A}
.sig-bar.bumped{animation:sigBump .35s ease}
@keyframes sigBump{
  0%{transform:scaleY(1)}
  50%{transform:scaleY(1.1)}
  100%{transform:scaleY(1)}
}

.sig-options{
  display:grid;grid-template-columns:repeat(5,1fr);gap:5px;
  width:100%;max-width:340px;margin-bottom:8px;
}
.sig-opt{
  padding:9px 3px;border:2px solid rgba(255,255,255,.13);border-radius:10px;
  background:rgba(255,255,255,.05);color:#fff;font-family:Heebo;
  font-size:.68rem;font-weight:600;cursor:pointer;transition:all .2s;line-height:1.15;
  min-height:46px;display:flex;align-items:center;justify-content:center;text-align:center;
}
.sig-opt:active{transform:scale(.94)}
.sig-opt.sel{border-color:#fff;background:rgba(255,255,255,.2)}

.sig-label{
  font-size:.92rem;font-weight:700;margin-top:4px;opacity:0;
  transition:opacity .3s;height:22px;
}
.sig-label.show{opacity:.92}

/* Multi-select */
.multi-q{font-size:1.1rem;font-weight:700;margin-bottom:4px;line-height:1.4;max-width:320px}
.multi-sub{font-size:.75rem;opacity:.6;margin-bottom:14px}
.multi-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:7px;
  width:100%;max-width:340px;
  max-height:min(360px,52vh);overflow-y:auto;padding:4px 4px 28px;
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 28px),transparent 100%);
  mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 28px),transparent 100%);
}
.multi-btn{
  padding:11px 9px;border:2px solid rgba(255,255,255,.12);border-radius:12px;
  background:rgba(255,255,255,.05);color:#fff;font-family:Heebo;
  font-size:.76rem;font-weight:600;cursor:pointer;transition:all .2s;line-height:1.25;
  min-height:44px;
}
.multi-btn:active{transform:scale(.95)}
.multi-btn.sel{border-color:#7ecfa0;background:rgba(126,207,160,.22)}

/* Pain question */
.pain-grid{
  display:flex;flex-direction:column;gap:8px;
  width:100%;max-width:340px;
  max-height:min(360px,52vh);overflow-y:auto;padding:4px 4px 28px;
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 28px),transparent 100%);
  mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 28px),transparent 100%);
}
.pain-btn{
  padding:13px 14px;border:2px solid rgba(255,255,255,.12);border-radius:12px;
  background:rgba(255,255,255,.05);color:#fff;font-family:Heebo;
  font-size:.86rem;font-weight:600;cursor:pointer;transition:all .2s;text-align:right;line-height:1.35;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.pain-btn:active{transform:scale(.97)}
.pain-btn.sel{border-color:#FFB89B;background:rgba(255,184,155,.22)}
.pain-btn .ring{
  width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;
}
.pain-btn.sel .ring{border-color:#FFB89B;background:#FFB89B}

.done-pill{
  margin-top:10px;padding:11px 32px;border:none;border-radius:50px;
  font-family:Heebo;font-size:.9rem;font-weight:700;color:#fff;cursor:pointer;
  background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.28);
  transition:transform .2s;
}
.done-pill:active{transform:scale(.96)}

/* Open text */
.open-input{
  width:100%;max-width:340px;min-height:90px;padding:14px 16px;
  border:2px solid rgba(255,255,255,.15);border-radius:14px;
  background:rgba(255,255,255,.06);color:#fff;font-family:Heebo;
  font-size:.92rem;line-height:1.5;outline:none;resize:none;text-align:right;
  transition:border-color .2s;
}
.open-input::placeholder{color:rgba(255,255,255,.45)}
.open-input:focus{border-color:rgba(255,255,255,.5)}

/* Battery (time) */
.battery{
  position:relative;width:200px;height:78px;margin:0 auto 12px;
  border:3px solid rgba(255,255,255,.7);border-radius:14px;
  display:flex;align-items:center;padding:5px;
  background:rgba(255,255,255,.04);
}
.battery::after{
  content:'';position:absolute;right:-9px;top:50%;transform:translateY(-50%);
  width:6px;height:30px;background:rgba(255,255,255,.7);border-radius:3px 0 0 3px;
}
.battery-fill{
  height:100%;border-radius:8px;width:25%;
  transition:all .4s cubic-bezier(.34,1.56,.64,1);
}
.battery-pct{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Playpen Sans Hebrew',sans-serif;font-size:1.7rem;font-weight:800;
  color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4);
}
.time-val{
  font-family:'Playpen Sans Hebrew',sans-serif;font-size:2.6rem;font-weight:800;
  margin-bottom:0;line-height:1;
}
.time-unit{font-size:.88rem;opacity:.65;margin-bottom:18px}
.time-slider-track{
  width:100%;height:10px;border-radius:8px;
  background:rgba(255,255,255,.15);position:relative;
}
.time-slider-input{
  -webkit-appearance:none;appearance:none;width:100%;height:10px;
  background:transparent;position:absolute;top:0;left:0;margin:0;cursor:pointer;
}
.time-slider-input::-webkit-slider-thumb{
  -webkit-appearance:none;width:32px;height:32px;border-radius:50%;
  background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:grab;border:4px solid #fff;
}
.time-slider-input::-moz-range-thumb{
  width:32px;height:32px;border-radius:50%;
  background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:grab;border:4px solid #fff;
}
.slider-labels{display:flex;justify-content:space-between;margin-top:8px;width:100%;max-width:280px}
.slider-labels span{font-size:.7rem;opacity:.55;font-weight:500}

/* Contact */
.input-stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-bottom:12px}
.input-field{
  padding:14px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);color:#fff;font-family:Heebo;
  font-size:.95rem;text-align:right;outline:none;transition:border-color .2s;
}
.input-field::placeholder{color:rgba(255,255,255,.5)}
.input-field:focus{border-color:rgba(255,255,255,.5)}
.skip-link{font-size:.82rem;color:rgba(255,255,255,.65);cursor:pointer;margin-top:10px;text-decoration:underline}
.privacy-mini{font-size:.66rem;opacity:.55;margin-top:8px;max-width:280px;line-height:1.4}

/* Result */
.done-icon{
  width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);
  animation:pop .5s ease;
}
@keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.15)}100%{transform:scale(1)}}

.persona-tag{
  font-family:'Playpen Sans Hebrew',sans-serif;font-size:.78rem;font-weight:600;
  opacity:.75;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;
}
.persona-name{
  font-family:'Playpen Sans Hebrew',sans-serif;font-size:2.3rem;font-weight:800;
  line-height:1.1;margin-bottom:12px;
}
.persona-tagline{
  font-size:.92rem;line-height:1.5;opacity:.88;max-width:320px;margin-bottom:16px;
}
.persona-stats{display:flex;gap:18px;margin-bottom:14px}
.persona-stat{text-align:center}
.persona-stat .v{font-family:'Playpen Sans Hebrew',sans-serif;font-size:1.5rem;font-weight:800}
.persona-stat .l{font-size:.65rem;opacity:.6;margin-top:2px}
.share-pill{
  margin-top:6px;padding:11px 26px;border:none;border-radius:50px;
  font-family:Heebo;font-size:.86rem;font-weight:700;color:#fff;cursor:pointer;
  background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.32);
  display:inline-flex;align-items:center;gap:8px;transition:transform .2s;
}
.share-pill:active{transform:scale(.96)}
.share-pill.copy{margin-top:8px;background:transparent}

/* Confetti */
.confetti-box{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.cft{position:absolute;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{
  0%{transform:translateY(-20px) rotate(0);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* Footer */
.footer-credit{
  position:absolute;
  bottom:calc(6px + env(safe-area-inset-bottom,0px));
  left:0;right:0;text-align:center;
  font-size:10px;opacity:.45;color:#fff;letter-spacing:.5px;z-index:15;
}
.footer-credit a{color:#fff;text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.4)}

@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<noscript>
  <div>השאלון דורש JavaScript. אנא הפעל JavaScript בדפדפן וטען מחדש.</div>
</noscript>

<div class="frame" id="frame">
  <div class="bars" id="bars"></div>
  <div class="step-text" id="stepText" style="display:none"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div id="screens"></div>
</div>

<script>
// ============================================
// CONFIG
// ============================================
const API = 'https://script.google.com/macros/s/AKfycbyPD4m86R6j9EEotSgWjqwc0BHqMPyLnwsriVOe8jgVz6-oyRhsuqYuoC9vqucIdZxDmw/exec';
const STORAGE_KEY = 'usage-mapping-state-v2';

// ============================================
// SHARED OPTIONS
// ============================================

const SYSTEMS = [
  { id:'manbas',     label:'מנב"סנט / מנב"ס' },
  { id:'mashov',     label:'משוב' },
  { id:'smart',      label:'סמארט סקול / מסכת' },
  { id:'tiktak',     label:'תיק תק' },
  { id:'pilon',      label:'פילון' },
  { id:'iscool',     label:'Iscool' },
  { id:'multi',      label:'משלב כמה מערכות' },
  { id:'other',      label:'אחר' }
];

const FREQ_LABELS = ['לא משתמש/ת', 'מדי פעם', 'פעם בשבוע', 'כמה פעמים בשבוע', 'כל יום'];
const FREQ_KEYS = ['never','rare','weekly','often','daily'];

// ============================================
// TEACHER FLOW
// ============================================

const MODULES_TEACHER = [
  { id:'attendance',    q:'רישום נוכחות',                  sub:'נוכחות יומית, איחורים, חיסורים' },
  { id:'grades',        q:'הזנת ציונים',                  sub:'מבחנים, עבודות, בוחני בקיאות' },
  { id:'behavior',      q:'הערות התנהגות / משמעת',        sub:'דיווחים, אירועי משמעת, פניות לרכז' },
  { id:'parents_msg',   q:'הודעות להורים',               sub:'יידועים, מכתבים, אישורים' },
  { id:'lesson_plan',   q:'תיעוד שיעורים / מערכי שיעור', sub:'נושאי שיעור, מטרות, חומרי הוראה' },
  { id:'individual',    q:'מעקב אישי אחרי תלמידים',       sub:'הערות אישיות, מעקב התקדמות, מחנך/ת' },
  { id:'assessments',   q:'מחוונים והערכות איכותיות',     sub:'תעודות, פירוט הישגים, הערכה מילולית' }
];

// When in system — same for both audiences
const WHEN_OPTIONS = [
  ['morning','תחילת יום (לפני שיעורים)'],
  ['breaks','בהפסקות / בין שיעורים'],
  ['end_school','בסוף יום בבית הספר'],
  ['evening','בערב / בבית'],
  ['allday','לאורך כל היום'],
  ['weekend','בעיקר בסופ"ש'],
  ['other','אחר']
];

// Purpose — different per audience
const PURPOSE_TEACHER = [
  ['documenting','תיעוד נתונים (נוכחות, ציונים)'],
  ['communication','תקשורת (הורים, תלמידים)'],
  ['individual','מעקב אישי אחרי תלמידים'],
  ['mandates','חובות מערכתיות (דוחות, טפסים)'],
  ['teaching','הוראה ולמידה (מערכי שיעור)'],
  ['feedback','משוב והערכה איכותית'],
  ['other','אחר']
];

// ============================================
// STATE
// ============================================
let state = loadState() || {
  audience: null,
  system: null,
  systemOther: '',
  role: null,
  stage: null,
  stageOther: '',
  schoolSize: null,
  modules: {},
  whenUse: null,
  whenOther: '',
  purpose: null,
  purposeOther: '',
  outsideSystem: [],
  outsideOther: '',
  minutesPerDay: 30,
  name: '',
  email: ''
};
// Migration: clear old fields
if (state.pains) delete state.pains;
if (state.wishOpenText !== undefined) delete state.wishOpenText;
let cur = 0, total = 0;
let SCREENS = {};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function clearState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
}

// ============================================

// ============================================

  const isTeacher = state.audience === 'teacher';

  const OUTSIDE = isTeacher ? OUTSIDE_TEACHER : OUTSIDE_PRINCIPAL;
  const ROLES = isTeacher ? ROLES_TEACHER : ROLES_PRINCIPAL;

  // Compute screen indices
  // 0: intro, 1: audience
  // 2: role, 3: stage, 4: size, 5: system
  // 6..6+M-1: modules
  // M+6: pains, M+7: outside, M+8: time, M+9: wish, M+10: contact, M+11: done
  let idx = 0;
  SCREENS.intro = idx++;
  SCREENS.audience = idx++;
  if (state.audience) {
    SCREENS.role = idx++;
    SCREENS.stage = idx++;
    SCREENS.size = idx++;
    SCREENS.system = idx++;
    SCREENS.modules = [];
    for (let i = 0; i < MODULES.length; i++) {
      SCREENS.modules.push(idx++);
    }
    SCREENS.whenUse = idx++;
    SCREENS.purpose = idx++;
    SCREENS.outside = idx++;
    SCREENS.time = idx++;
    SCREENS.contact = idx++;
    SCREENS.done = idx++;

    <div id="pPurposeLine" style="font-size:.78rem;opacity:.7;margin-top:-2px;margin-bottom:14px;max-width:300px;line-height:1.4"></div>
    <button class="share-pill" onclick="shareWA()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      שלחו לקולגה
    </button>
    <button class="share-pill copy" onclick="copyLink()">העתק קישור</button>
  </div>`;

  document.getElementById('screens').innerHTML = h;
  // Activate current screen
  const target = document.querySelector(`[data-i="${cur}"]`);
  if (target) target.classList.add('on');
  bars();
  restoreSelections();
}

function restoreSelections() {
  // Restore module selections visually
  if (state.audience && SCREENS.modules) {
    const MODULES = state.audience === 'teacher' ? MODULES_TEACHER : MODULES_PRINCIPAL;
    MODULES.forEach((m, i) => {
      if (state.modules[m.id]) {
        const si = SCREENS.modules[i];
        const idx = FREQ_KEYS.indexOf(state.modules[m.id]);
        if (idx >= 0) {
          const opts = document.querySelectorAll(`[data-i="${si}"] .sig-opt`);
          if (opts[idx]) opts[idx].classList.add('sel');
          const display = document.getElementById('sig' + si);
          if (display) {
            display.classList.add('lvl-' + (idx + 1));
            display.querySelectorAll('.sig-bar').forEach((b, bi) => { if (bi <= idx) b.classList.add('lit'); });
          }
          const lbl = document.getElementById('sigLbl' + si);
          if (lbl) { lbl.textContent = FREQ_LABELS[idx]; lbl.classList.add('show'); }
        }
      }
    });
  }
  // Restore outside
  if (state.outsideSystem.length) {
    document.querySelectorAll('.multi-btn').forEach(btn => {
      if (state.outsideSystem.includes(btn.textContent.trim())) btn.classList.add('sel');
    });
    if (state.outsideSystem.includes('אחר') && state.outsideOther) {
      const inp = document.getElementById('outsideOtherInput');
      if (inp) { inp.style.display = ''; inp.value = state.outsideOther; }
    }
  }
  // Restore role/stage/size/system/whenUse/purpose selections
  ['role','stage','schoolSize','system','whenUse','purpose'].forEach(field => {
    if (state[field]) {
      document.querySelectorAll('.id-btn').forEach(btn => {
        const onclick = btn.getAttribute('onclick') || '';
        if (onclick.includes(`'${field}','${state[field]}'`)) btn.classList.add('sel');
      });
      // Show "other" input if applicable
      if (state[field] === 'other' && state[field + 'Other']) {
        const inputMap = { stage:'stageOtherInput', system:'systemOtherInput', whenUse:'whenOtherInput', purpose:'purposeOtherInput' };
        const inp = document.getElementById(inputMap[field]);
        if (inp) { inp.style.display = ''; inp.value = state[field + 'Other']; }
        const screen = inp ? inp.closest('.scr') : null;
        const btn = screen ? screen.querySelector('.done-pill') : null;
        if (btn) btn.style.display = '';
      }
    }
  });
}

// ============================================
// INTERACTIONS
// ============================================
function pickAudience(aud) {
  // Clear audience-specific state when switching
  if (state.audience !== aud) {
    state.modules = {};
    state.pains = [];
    state.role = null;
    state.outsideSystem = [];
  }
  state.audience = aud;
  saveState();
  rebuild();
  setTimeout(() => go(SCREENS.role), 200);
}

function rebuild() {
  document.getElementById('screens').innerHTML = '';
  init();
}

function resumeFlow() {
  let target = SCREENS.role || 1;
  if (state.role && SCREENS.stage) target = SCREENS.stage;
  if (state.stage && SCREENS.size) target = SCREENS.size;
  if (state.schoolSize && SCREENS.system) target = SCREENS.system;
  if (state.system && SCREENS.modules) target = SCREENS.modules[0];
  const MODULES = state.audience === 'teacher' ? MODULES_TEACHER : MODULES_PRINCIPAL;
  for (let i = 0; i < MODULES.length; i++) {
    if (state.modules[MODULES[i].id]) {
      target = (i < MODULES.length - 1) ? SCREENS.modules[i + 1] : SCREENS.whenUse;
    }
  }
  if (state.whenUse) target = SCREENS.purpose;
  if (state.purpose) target = SCREENS.outside;
  if (state.outsideSystem.length) target = SCREENS.time;
  go(target);
}

function pickId(field, value, btn) {
  state[field] = value;
  btn.parentElement.querySelectorAll('.id-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  saveState();
  setTimeout(() => go(cur + 1), 280);
}

function pickSignal(si, modId, idx, btn) {
  const opts = btn.parentElement.querySelectorAll('.sig-opt');
  opts.forEach(o => o.classList.remove('sel'));
  btn.classList.add('sel');

  const display = document.getElementById('sig' + si);
  // Update intensity level on the container — drives color
  display.classList.remove('lvl-1','lvl-2','lvl-3','lvl-4','lvl-5');
  display.classList.add('lvl-' + (idx + 1));

  const bars = display.querySelectorAll('.sig-bar');
  bars.forEach((b, i) => {
    b.classList.remove('lit', 'bumped');
    if (i <= idx) {
      setTimeout(() => {
        b.classList.add('lit', 'bumped');
        setTimeout(() => b.classList.remove('bumped'), 350);
      }, i * 55);
    }
  });

  const lbl = document.getElementById('sigLbl' + si);
  lbl.textContent = FREQ_LABELS[idx];
  lbl.classList.add('show');

  state.modules[modId] = FREQ_KEYS[idx];
  saveState();

  // Auto-advance after a moment
  const MODULES = state.audience === 'teacher' ? MODULES_TEACHER : MODULES_PRINCIPAL;
  const moduleIdx = SCREENS.modules.indexOf(si);
  const nextScreen = (moduleIdx === MODULES.length - 1) ? SCREENS.whenUse : SCREENS.modules[moduleIdx + 1];
  setTimeout(() => go(nextScreen), 700);
}

// Single choice with "other" support — auto-advances unless "other" picked
function pickSingle(field, value, btn, nextScreen) {
  state[field] = value;
  btn.parentElement.querySelectorAll('.id-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  saveState();
  // Show/hide "other" input
  const screen = btn.closest('.scr');
  const otherInput = screen.querySelector('.other-input');
  const continueBtn = screen.querySelector('.done-pill');
  if (value === 'other') {
    if (otherInput) { otherInput.style.display = ''; otherInput.focus(); }
    if (continueBtn) continueBtn.style.display = '';
  } else {
    if (otherInput) otherInput.style.display = 'none';
    if (continueBtn) continueBtn.style.display = 'none';
    setTimeout(() => go(nextScreen), 280);
  }
}

// Same as pickSingle but for the existing pickId fields (id-grid screens)
function pickIdWithOther(field, value, btn, nextScreen) {
  pickSingle(field, value, btn, nextScreen);
}

function toggleOutside(btn, value) {
  btn.classList.toggle('sel');
  if (btn.classList.contains('sel')) {
    if (!state.outsideSystem.includes(value)) state.outsideSystem.push(value);
  } else {
    state.outsideSystem = state.outsideSystem.filter(v => v !== value);
    if (value === 'אחר') state.outsideOther = '';
  }
  // Show/hide "other" input
  if (value === 'אחר') {
    const otherInput = document.getElementById('outsideOtherInput');
    if (otherInput) {
      otherInput.style.display = btn.classList.contains('sel') ? '' : 'none';
      if (btn.classList.contains('sel')) otherInput.focus();
    }
  }
  saveState();
}

function onTimeChange(v, max) {
  v = parseInt(v);
  state.minutesPerDay = v;
  document.getElementById('timeVal').textContent = v;
  const pct = Math.round((v / max) * 100);
  const fill = document.getElementById('batFill');
  fill.style.width = Math.max(8, pct) + '%';
  document.getElementById('batPct').textContent = pct + '%';
  // Discrete colors
  if (pct < 35) fill.style.background = '#7ecfa0';
  else if (pct < 70) fill.style.background = '#FFD96B';
  else fill.style.background = '#FF9B6B';
  saveState();
}

// ============================================
// NAV
// ============================================
function go(i) {
  document.querySelectorAll('.scr').forEach(s => {
    const si = +s.dataset.i;
    if (si === cur) s.classList.remove('on');
    if (si === i) s.classList.add('on');
  });
  cur = i;
  bars();
  updateStepText();
  saveState();
}

function bars() {
  document.querySelectorAll('.bar').forEach((b, i) => {
    b.classList.remove('done', 'now');
    if (i < cur) b.classList.add('done');
    if (i === cur) b.classList.add('now');
    const f = b.querySelector('.fill');
    f.style.width = i <= cur ? '100%' : '0%';
  });
}

function updateStepText() {
  const el = document.getElementById('stepText');
  if (cur === 0 || cur >= total - 1) {
    el.style.display = 'none';
  } else {
    el.style.display = 'block';
    el.textContent = `${cur} / ${total - 1}`;
  }
}

// ============================================
// PERSONA
// ============================================
function freqScore(f) { return { daily:4, often:3, weekly:2, rare:1, never:0 }[f] || 0; }

function calculatePersona() {
  const m = state.modules;
  const outside = state.outsideSystem.length;
  const isTeacher = state.audience === 'teacher';
  const activeCount = Object.values(m).filter(v => v === 'daily' || v === 'often').length;
  const totalScore = Object.values(m).reduce((s, v) => s + freqScore(v), 0);
  const purpose = state.purpose;

  if (isTeacher) {
    // Teacher: purpose drives archetype, modules confirm
    const docScore = freqScore(m.attendance) + freqScore(m.grades);
    const eduScore = freqScore(m.individual) + freqScore(m.assessments) + freqScore(m.parents_msg) + freqScore(m.behavior);

    if (activeCount <= 1 && totalScore <= 5) return 'starter';
    if (outside >= 5) return 'pragmatist';
    // Purpose-led routing
    if (purpose === 'individual' || purpose === 'feedback' || purpose === 'communication') return 'educator';
    if (purpose === 'documenting' || purpose === 'mandates') return 'documenter';
    // Module-led fallback
    if (eduScore >= 8) return 'educator';
    if (docScore >= 6) return 'documenter';
    if (activeCount <= 3 && outside <= 2) return 'efficient';
    return 'hybrid';
  } else {
    // Principal: purpose drives archetype
    const dataScore = freqScore(m.reports_data) + freqScore(m.regulation);
    const opScore = freqScore(m.staff_mgmt) + freqScore(m.committees) + freqScore(m.parents_comm);

    if (activeCount <= 1 && totalScore <= 5) return 'builder';
    if (outside >= 5) return 'pragmatist';
    // Purpose-led routing
    if (purpose === 'analysis' || purpose === 'mandates') return 'analyst';
    if (purpose === 'planning') return 'strategist';
    if (purpose === 'operations' || purpose === 'committees' || purpose === 'communication') return 'operator';
    // Module-led fallback
    if (dataScore >= 6) return 'analyst';
    if (freqScore(m.planning) >= 3) return 'strategist';
    if (opScore >= 7) return 'operator';
    return 'hybrid';
  }
}

function finish() {
  if (window._submitted) return;
  window._submitted = true;

  const personaId = calculatePersona();
  const PERSONAS = state.audience === 'teacher' ? TEACHER_PERSONAS : PRINCIPAL_PERSONAS;
  const p = PERSONAS[personaId];
  const activeCount = Object.values(state.modules).filter(v => v === 'daily' || v === 'often').length;

  // Map purpose+when to display labels
  const purposeMap = {
    documenting:'תיעוד', communication:'תקשורת', individual:'מעקב אישי',
    mandates:'חובות מערכתיות', teaching:'הוראה ולמידה', feedback:'משוב והערכה',
    analysis:'ניתוח נתונים', operations:'תפעול שוטף', planning:'תכנון ויעדים',
    committees:'ועדות', other: state.purposeOther || 'אחר'
  };
  const whenMap = {
    morning:'תחילת יום', breaks:'בהפסקות', end_school:'בסוף יום בבי"ס',
    evening:'בערב/בבית', allday:'לאורך היום', weekend:'בסופ"ש',
    other: state.whenOther || 'אחר'
  };

  document.getElementById('pTag').textContent = p.tag;
  document.getElementById('pName').textContent = p.name;
  document.getElementById('pTagline').textContent = p.tagline;
  document.getElementById('pActive').textContent = activeCount;
  document.getElementById('pOutside').textContent = state.outsideSystem.length;
  document.getElementById('pTime').textContent = state.minutesPerDay;

  // Purpose + When line
  const purposeLabel = purposeMap[state.purpose] || '';
  const whenLabel = whenMap[state.whenUse] || '';
  if (purposeLabel || whenLabel) {
    document.getElementById('pPurposeLine').innerHTML =
      (purposeLabel ? `<strong>מטרה:</strong> ${purposeLabel}` : '') +
      (purposeLabel && whenLabel ? ' · ' : '') +
      (whenLabel ? `<strong>מתי:</strong> ${whenLabel}` : '');
  }

  go(SCREENS.done);
  confetti();
  save(personaId, p.name);
}

function save(personaId, personaName) {
  const payload = {
    timestamp: new Date().toISOString(),
    audience: state.audience,
    role: state.role,
    stage: state.stage,
    stageOther: state.stageOther || '',
    schoolSize: state.schoolSize,
    system: state.system,
    systemOther: state.systemOther || '',
    modules: state.modules,
    whenUse: state.whenUse,
    whenOther: state.whenOther || '',
    purpose: state.purpose,
    purposeOther: state.purposeOther || '',
    outsideSystem: state.outsideSystem,
    outsideOther: state.outsideOther || '',
    minutesPerDay: state.minutesPerDay,
    name: state.name || '(אנונימי)',
    email: state.email || '',
    persona: personaId,
    personaName: personaName,
    referrer: document.referrer || 'direct'
  };
  const body = JSON.stringify(payload);

  // Use sendBeacon for reliability on tab close
  if (navigator.sendBeacon) {
    try {
      const blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
      navigator.sendBeacon(API, blob);
    } catch(e) {
      fetch(API, { method:'POST', mode:'no-cors', body }).catch(()=>{});
    }
  } else {
    fetch(API, { method:'POST', mode:'no-cors', body }).catch(()=>{});
  }

  // Clear local state after successful submission
  setTimeout(() => clearState(), 1500);
}

function confetti() {
  const box = document.getElementById('cft');
  if (!box) return;
  const cols = ['#C9B8E8','#fff','#FFD96B','#FF9B6B','#7ecfa0','#a0c4ff'];
  for (let i = 0; i < 50; i++) {
    const e = document.createElement('div');
    e.className = 'cft';
    e.style.background = cols[~~(Math.random() * cols.length)];
    e.style.left = Math.random() * 100 + '%';
    e.style.width = (4 + Math.random() * 8) + 'px';
    e.style.height = (4 + Math.random() * 8) + 'px';
    e.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    e.style.animationDelay = (Math.random() * .8) + 's';
    e.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    box.appendChild(e);
  }
}

function shareWA() {
  const url = window.location.href.split('?')[0].split('#')[0];
  const persona = document.getElementById('pName').textContent;
  const text = encodeURIComponent(`גליתי שאני "${persona}" — בא תגלו מה אתם. מיפוי שימוש קצר במערכות הפדגוגיות, דקה. ${url}`);
  window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
}

function copyLink() {
  const url = window.location.href.split('?')[0].split('#')[0];
  navigator.clipboard.writeText(url).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = 'הועתק ✓';
    setTimeout(() => btn.textContent = orig, 1800);
  });
}

// ============================================
// TOUCH SWIPE BACK (RTL)
// ============================================
let tx = 0;
document.addEventListener('touchstart', e => tx = e.touches[0].clientX);
document.addEventListener('touchend', e => {
  const delta = e.changedTouches[0].clientX - tx;
  // Ignore swipes near right edge (iOS back gesture)
  if (tx > 30 && delta > 70 && cur > 0 && cur < (SCREENS.done || total - 1)) {
    go(cur - 1);
  }
});

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && cur > 0 && cur < (SCREENS.done || total - 1)) go(cur - 1);
  if (e.key === 'ArrowLeft' && cur < (SCREENS.done || total - 1)) go(cur + 1);
});

// ============================================
// INIT
// ============================================
init();
setTimeout(() => {
  if (document.getElementById('batFill')) {
    const isTeacher = state.audience === 'teacher';
    onTimeChange(state.minutesPerDay || 30, isTeacher ? 600 : 240);
  }
}, 150);
</script>
