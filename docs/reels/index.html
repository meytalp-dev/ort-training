<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ספריית רילס — Learni</title>
<meta name="description" content="כל הרילס שיצרנו — סרטונים קצרים על כלי AI לחינוך, ניהול, יזמות ושיווק.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --dream:#8E7ED4;--lead:#3AACA0;--lead-dark:#1B7A6E;--create:#E8B060;--spark:#E8909C;
  --bg:#fff;--bg-alt:#FAFBFC;--text:#2C2622;--muted:#6E6258;--text-lighter:#8C7E72;--border:#EDE6D8;
  --radius:16px;--radius-lg:22px;
  --shadow-sm:0 2px 8px rgba(44,38,34,.05);
  --shadow-md:0 6px 20px rgba(44,38,34,.08);
  --shadow-lg:0 12px 40px rgba(44,38,34,.1);
}
body{font-family:'Heebo',sans-serif;background:#fff;color:var(--text);min-height:100vh;line-height:1.6}
h1,h2,h3{font-family:'Playpen Sans Hebrew','Heebo',sans-serif;font-weight:700;letter-spacing:-.2px}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 600px 450px at 12% 18%,rgba(142,126,212,.05) 0%,transparent 70%),
    radial-gradient(ellipse 500px 400px at 88% 65%,rgba(232,176,96,.05) 0%,transparent 70%);
  pointer-events:none;z-index:0}

.header{background:#fff;padding:0 28px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;height:64px;box-shadow:0 2px 12px rgba(44,38,34,.04)}
.header::before{content:'';position:absolute;bottom:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--dream),var(--create),var(--lead),var(--spark));pointer-events:none}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--dream),var(--lead));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-family:'Playpen Sans Hebrew',sans-serif;font-size:1.2rem}
.brand h1{font-size:1.1rem;font-weight:800;font-family:Heebo}
.back-link{font-size:.85rem;color:var(--lead-dark);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:9px;background:rgba(58,172,160,.08);transition:background .15s}
.back-link:hover{background:rgba(58,172,160,.18)}

.container{max-width:1280px;margin:0 auto;padding:36px 28px;position:relative;z-index:1}

.hero{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:32px 36px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.hero::before{content:'';position:absolute;top:-50px;right:-30px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(142,126,212,.1),transparent 70%)}
.hero h2{font-size:1.85rem;font-family:Heebo;font-weight:900;letter-spacing:-.4px;margin-bottom:6px;position:relative}
.hero p{color:var(--muted);font-size:.95rem;max-width:680px;position:relative}
.hero-stats{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap;position:relative}
.hero-stat{padding:8px 16px;background:var(--bg-alt);border:1px solid var(--border);border-radius:14px;font-size:.85rem;font-weight:600;color:var(--text)}
.hero-stat .num{font-weight:900;color:var(--lead-dark);margin-left:4px}

.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filter-row .label{font-size:.82rem;color:var(--muted);font-weight:600}
.filter-chip{padding:6px 14px;border-radius:14px;font-size:.78rem;font-weight:600;cursor:pointer;background:#fff;border:1.5px solid var(--border);color:var(--muted);font-family:Heebo;transition:all .15s}
.filter-chip:hover{border-color:var(--dream)}
.filter-chip.active{background:var(--dream-dark,var(--dream));color:#fff;border-color:var(--dream)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.reel-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow-sm);transition:all .25s;display:flex;flex-direction:column}
.reel-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:var(--dream)}
.reel-video{width:100%;aspect-ratio:9/16;background:#000;position:relative;cursor:pointer;overflow:hidden}
.reel-video.landscape{aspect-ratio:16/9}
.reel-video video{width:100%;height:100%;object-fit:cover;display:block}
.reel-video .play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);transition:opacity .2s;pointer-events:none}
.reel-video.playing .play-overlay{opacity:0}
.play-icon{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:var(--lead-dark);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.reel-meta{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.reel-tool{font-size:.7rem;font-weight:700;color:var(--lead-dark);text-transform:uppercase;letter-spacing:.4px;display:inline-flex;align-items:center;gap:5px}
.reel-tool .dot{width:6px;height:6px;border-radius:50%;background:var(--lead)}
.reel-card[data-tool="claude"] .reel-tool{color:#D97706}
.reel-card[data-tool="claude"] .reel-tool .dot{background:#F59E0B}
.reel-card[data-tool="veo"] .reel-tool{color:#7C3AED}
.reel-card[data-tool="veo"] .reel-tool .dot{background:#8E7ED4}
.reel-card[data-tool="stitch"] .reel-tool{color:#DC2626}
.reel-card[data-tool="stitch"] .reel-tool .dot{background:#EF4444}
.reel-card[data-tool="pulse"] .reel-tool{color:#059669}
.reel-card[data-tool="pulse"] .reel-tool .dot{background:#10B981}
.reel-card[data-tool="hourglass"] .reel-tool{color:#0891B2}
.reel-card[data-tool="hourglass"] .reel-tool .dot{background:#06B6D4}
.reel-card[data-tool="pomelli"] .reel-tool{color:#BE185D}
.reel-card[data-tool="pomelli"] .reel-tool .dot{background:#E8909C}
.reel-card[data-tool="remotion"] .reel-tool{color:#1E40AF}
.reel-card[data-tool="remotion"] .reel-tool .dot{background:#3B82F6}
.reel-title{font-size:1rem;font-weight:700;font-family:Heebo;line-height:1.35;color:var(--text)}
.reel-desc{font-size:.8rem;color:var(--muted);line-height:1.5}
.reel-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.reel-tag{font-size:.68rem;padding:2px 9px;border-radius:10px;background:var(--bg-alt);color:var(--text-light);font-weight:600;border:1px solid var(--border)}
.reel-actions{padding:0 16px 14px;display:flex;gap:6px}
.reel-btn{flex:1;padding:8px;border-radius:9px;font-family:Heebo;font-size:.78rem;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text);transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.reel-btn:hover{border-color:var(--dream);background:var(--bg-alt)}
.reel-btn.primary{background:var(--lead-dark);color:#fff;border-color:var(--lead-dark)}
.reel-btn.primary:hover{background:var(--lead)}

.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .icon{font-size:2.4rem;display:block;margin-bottom:8px;opacity:.5}

@media(max-width:600px){
  .container{padding:20px 16px}
  .hero{padding:22px 22px}
  .hero h2{font-size:1.4rem}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-mark">▶</div>
    <h1>ספריית רילס</h1>
  </div>
  <a class="back-link" href="../quartet/">← מפת המערכות</a>
</div>

<div class="container">
  <div class="hero">
    <h2>כל הרילס שיצרנו</h2>
    <p>סרטונים קצרים על כלי AI — מותאמים לשיתוף ברשתות חברתיות, להכרת כלי, או הסבר מהיר. בנויים בעיקר עם Remotion, Veo, Pomelli ו-Stitch.</p>
    <div class="hero-stats">
      <div class="hero-stat"><span class="num" id="totalCount">0</span> רילס</div>
      <div class="hero-stat"><span class="num" id="toolsCount">0</span> כלים שונים</div>
    </div>
  </div>

  <div class="filter-row">
    <span class="label">סינון:</span>
    <button class="filter-chip active" data-filter="all">הכל</button>
    <button class="filter-chip" data-filter="claude">Claude</button>
    <button class="filter-chip" data-filter="veo">Veo</button>
    <button class="filter-chip" data-filter="stitch">Stitch</button>
    <button class="filter-chip" data-filter="pulse">Pulse</button>
    <button class="filter-chip" data-filter="hourglass">Hourglass</button>
    <button class="filter-chip" data-filter="pomelli">Pomelli</button>
    <button class="filter-chip" data-filter="remotion">Remotion</button>
  </div>

  <div class="grid" id="reelsGrid"></div>
</div>

<script>
const REELS = [
  {
    title: 'Claude Skills — מה זה ולמה צריך',
    desc: 'הסבר קצר על Claude Skills — מתי משתמשים, ולמה זה משנה את האופן שעובדים עם AI.',
    tool: 'claude',
    toolName: 'Claude',
    tags: ['Claude','Skills','AI'],
    src: '../marketing/assets/posts/claude-skills-reel.mp4',
    landscape: false
  },
  {
    title: 'Claude Code — לפייסבוק',
    desc: 'גרסה מותאמת לפייסבוק של ההיכרות עם Claude Code — מה הוא יכול ולמה כל מורה צריכה אותו.',
    tool: 'claude',
    toolName: 'Claude Code',
    tags: ['Claude Code','Facebook'],
    src: '../marketing/assets/posts/claude-code-reel-facebook.mp4',
    landscape: false
  },
  {
    title: 'Claude Code — לאינסטגרם',
    desc: 'גרסת אינסטגרם של אותו רעיון — אנכי, ויזואלי, מהיר.',
    tool: 'claude',
    toolName: 'Claude Code',
    tags: ['Claude Code','Instagram'],
    src: '../marketing/assets/posts/claude-code-reel-instagram.mp4',
    landscape: false
  },
  {
    title: 'Veo 3 — אינסטגרם',
    desc: 'מנוע הוידאו של גוגל — דוגמת תוצר ישירות לאינסטגרם.',
    tool: 'veo',
    toolName: 'Veo (Google)',
    tags: ['Veo','Google','Instagram'],
    src: '../marketing/assets/posts/2026-04-01-veo3-instagram-reel.mp4',
    landscape: false
  },
  {
    title: 'Stitch — בנייה מהירה של UI',
    desc: 'איך בונים ממשק יפה ב-Stitch בלי שורת קוד — מהפכה לעיצוב מהיר.',
    tool: 'stitch',
    toolName: 'Stitch',
    tags: ['Stitch','UI','Design'],
    src: '../marketing/assets/posts/2026-04-03-stitch-reel.mp4',
    landscape: false
  },
  {
    title: 'Pulse — סקרי דופק שבועיים',
    desc: 'הצגת מערכת Pulse: סקר דופק קצר → דשבורד אגרגטיבי → ראייה רגשית של הכיתה.',
    tool: 'pulse',
    toolName: 'Pulse',
    tags: ['Pulse','חינוך','אקלים'],
    src: '../marketing/assets/posts/2026-04-15-pulse-reel.mp4',
    landscape: false
  },
  {
    title: 'שעון חול — 3 פרומפטים שחוסכים שעות',
    desc: 'רילס סטייל "Hourglass" עם 3 פרומפטים שמורות מתחילות צריכות.',
    tool: 'hourglass',
    toolName: 'Hourglass',
    tags: ['פרומפטים','טיפים'],
    src: '../marketing/assets/posts/2026-03-31-reels-hourglass-3-prompts.mp4',
    landscape: false
  },
  {
    title: 'Pomelli — מחולל קמפיינים',
    desc: '3 פרומפטים ב-Pomelli שחוסכים שעות שבועיות לקידום עסק קטן.',
    tool: 'pomelli',
    toolName: 'Pomelli',
    tags: ['Pomelli','שיווק'],
    src: '../training/claude-code/pomely/3_פרומפטים_שחוסכים_שעות_שבועיות_version_1.mp4',
    landscape: false
  },
  {
    title: 'Remotion — סרטון מקוד',
    desc: 'דוגמת רילס שנבנה ב-Remotion (React + Animation) — בסיס למחולל הוידאו הלימודי.',
    tool: 'remotion',
    toolName: 'Remotion',
    tags: ['Remotion','React','קוד'],
    src: '../training/remotion-reel.mp4',
    landscape: false
  }
];

const grid = document.getElementById('reelsGrid');
let currentFilter = 'all';

function render(){
  const filtered = currentFilter === 'all' ? REELS : REELS.filter(r => r.tool === currentFilter);
  if(!filtered.length){
    grid.innerHTML = '<div class="empty"><span class="icon">🎬</span>אין רילס בקטגוריה הזאת</div>';
    return;
  }
  grid.innerHTML = filtered.map(r => `
    <div class="reel-card" data-tool="${r.tool}">
      <div class="reel-video ${r.landscape?'landscape':''}" data-src="${r.src}">
        <video preload="metadata" muted playsinline>
          <source src="${r.src}#t=0.5" type="video/mp4">
        </video>
        <div class="play-overlay">
          <div class="play-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
      </div>
      <div class="reel-meta">
        <div class="reel-tool"><span class="dot"></span>${r.toolName}</div>
        <div class="reel-title">${r.title}</div>
        <div class="reel-desc">${r.desc}</div>
        <div class="reel-tags">${r.tags.map(t => `<span class="reel-tag">${t}</span>`).join('')}</div>
      </div>
      <div class="reel-actions">
        <a class="reel-btn primary" href="${r.src}" target="_blank" rel="noopener">▶ צפו במלא</a>
        <a class="reel-btn" href="${r.src}" download>⬇ הורדה</a>
      </div>
    </div>
  `).join('');

  // Click on video → toggle play
  grid.querySelectorAll('.reel-video').forEach(v => {
    v.addEventListener('click', () => {
      const video = v.querySelector('video');
      if(!video) return;
      // Pause others
      grid.querySelectorAll('video').forEach(other => {
        if(other !== video){ other.pause(); other.parentElement.classList.remove('playing'); }
      });
      if(video.paused){
        video.controls = true;
        video.play();
        v.classList.add('playing');
      } else {
        video.pause();
        v.classList.remove('playing');
      }
    });
  });
}

// Stats
document.getElementById('totalCount').textContent = REELS.length;
document.getElementById('toolsCount').textContent = new Set(REELS.map(r => r.tool)).size;

// Filter chips
document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    render();
  });
});

render();
</script>
</body>
</html>
