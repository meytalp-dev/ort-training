<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דוגמאות לגיוס באמצעות הקהילה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF6EE;
    --cream-2:#F2EBDC;
    --ink:#1F2A3A;
    --ink-soft:#3A4A60;
    --muted:#6B7484;
    --gold:#B5894A;
    --gold-soft:#D9B681;
    --line:#D9CFB8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Heebo','Frank Ruhl Libre',serif;
    background:var(--cream);
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .deck{position:relative;width:100vw;height:100vh;overflow:hidden}
  .slide{
    position:absolute;inset:0;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:5vh 6vw;
    opacity:0;visibility:hidden;
    transition:opacity .6s ease, transform .6s ease;
    transform:translateY(20px);
  }
  .slide.active{opacity:1;visibility:visible;transform:translateY(0)}

  /* gold corner accents */
  .corner{
    position:absolute;width:42px;height:42px;
    border:1px solid var(--gold);
    opacity:.7;
  }
  .corner.tl{top:4vh;right:4vw;border-bottom:none;border-left:none}
  .corner.tr{top:4vh;left:4vw;border-bottom:none;border-right:none}
  .corner.bl{bottom:4vh;right:4vw;border-top:none;border-left:none}
  .corner.br{bottom:4vh;left:4vw;border-top:none;border-right:none}

  h1{
    font-family:'Frank Ruhl Libre',serif;
    font-weight:700;
    font-size:clamp(2.2rem,5.5vw,4.6rem);
    color:var(--ink);
    line-height:1.25;
    letter-spacing:-.01em;
  }

  /* slide 1 — title */
  .slide-title{text-align:center}
  .slide-title h1{margin-bottom:1.4rem}
  .slide-title .sub{
    font-family:'Heebo',sans-serif;
    font-size:1.15rem;letter-spacing:.15em;
    color:var(--muted);
    margin-top:1.6rem;
  }
  .ornament{
    display:flex;align-items:center;justify-content:center;gap:1.2rem;
    color:var(--gold);
  }
  .ornament .bar{width:80px;height:1px;background:var(--gold-soft)}
  .ornament .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}

  .candle{width:62px;height:auto;margin-bottom:2.5rem;color:var(--gold)}

  /* image slides */
  .slide-image{
    padding:3vh 4vw;
  }
  .slide-image .img-wrap{
    height:88vh;
    max-width:90vw;
    display:flex;align-items:center;justify-content:center;
  }
  .slide-image img{
    max-height:100%;
    max-width:100%;
    object-fit:contain;
    border-radius:6px;
    box-shadow:
      0 1px 0 rgba(181,137,74,.2),
      0 30px 60px -20px rgba(31,42,58,.25),
      0 12px 24px -8px rgba(31,42,58,.15);
  }

  /* footer / nav */
  .footer{
    position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:1.4rem;
    font-family:'Heebo',sans-serif;
    z-index:50;
  }
  .footer .counter{
    font-size:.85rem;color:var(--muted);letter-spacing:.15em;
    min-width:60px;text-align:center;
    background:rgba(250,246,238,.85);
    padding:.3rem .6rem;border-radius:14px;
  }
  .nav-btn{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line);background:rgba(255,255,255,.85);
    color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .2s ease;
  }
  .nav-btn:hover{border-color:var(--gold);color:var(--gold);background:#fff}
  .nav-btn svg{width:14px;height:14px}

  .progress-bar{
    position:fixed;top:0;left:0;height:2px;
    background:var(--gold);width:0%;
    transition:width .4s ease;
    z-index:60;
  }

  .hint{
    position:fixed;top:1.2rem;left:50%;transform:translateX(-50%);
    font-family:'Heebo',sans-serif;font-size:.78rem;
    color:var(--muted);letter-spacing:.12em;opacity:.55;
    z-index:50;
    background:rgba(250,246,238,.7);
    padding:.25rem .8rem;border-radius:12px;
  }

  @media (max-width:768px){
    .slide{padding:4vh 4vw}
    .corner{width:28px;height:28px}
    .slide-image .img-wrap{height:82vh}
  }
</style>
</head>
<body>

<div class="progress-bar" id="progress"></div>
<div class="hint">← → לחיצים לניווט</div>

<div class="deck" id="deck">

  <!-- Slide 1: Title -->
  <section class="slide slide-title active" data-slide="1">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>

    <svg class="candle" viewBox="0 0 64 80" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 4 C36 12, 42 18, 42 26 C42 32, 37 36, 32 36 C27 36, 22 32, 22 26 C22 18, 28 12, 32 4 Z"
            fill="currentColor" opacity=".85"/>
      <path d="M32 10 C34 16, 37 20, 37 24 C37 28, 35 30, 32 30 C29 30, 27 28, 27 24 C27 20, 30 16, 32 10 Z"
            fill="#FFF8E7"/>
      <rect x="28" y="40" width="8" height="32" fill="currentColor" opacity=".4"/>
      <rect x="22" y="72" width="20" height="4" fill="currentColor" opacity=".6"/>
    </svg>

    <div class="ornament" style="margin-bottom:2rem">
      <span class="bar"></span><span class="dot"></span><span class="bar"></span>
    </div>

    <h1>דוגמאות לגיוס באמצעות הקהילה</h1>

    <div class="ornament" style="margin-top:2rem">
      <span class="bar"></span><span class="dot"></span><span class="bar"></span>
    </div>
  </section>

  <!-- Slide 2: Joint Israel -->
  <section class="slide slide-image" data-slide="2">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="img-wrap">
      <img src="01-joint.jpeg" alt="ג'וינט ישראל · חקוקים בנצח">
    </div>
  </section>

  <!-- Slide 3: Rotary -->
  <section class="slide slide-image" data-slide="3">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="img-wrap">
      <img src="02-rotary.jpeg" alt="רוטרי ישראל · יהלום גדרה">
    </div>
  </section>

  <!-- Slide 4: B'nai B'rith -->
  <section class="slide slide-image" data-slide="4">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="img-wrap">
      <img src="03-bnai-brit.jpeg" alt="בני ברית">
    </div>
  </section>

</div>

<div class="footer">
  <button class="nav-btn" id="prev" aria-label="הקודם">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </button>
  <div class="counter"><span id="cur">1</span> / <span id="total">4</span></div>
  <button class="nav-btn" id="next" aria-label="הבא">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  const cur = document.getElementById('cur');
  const totalEl = document.getElementById('total');
  const progress = document.getElementById('progress');
  let idx = 0;

  totalEl.textContent = total;

  function show(n){
    idx = (n + total) % total;
    slides.forEach((s,i)=>s.classList.toggle('active', i===idx));
    cur.textContent = idx + 1;
    progress.style.width = ((idx + 1) / total * 100) + '%';
  }

  document.getElementById('next').addEventListener('click', ()=>show(idx+1));
  document.getElementById('prev').addEventListener('click', ()=>show(idx-1));

  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowLeft' || e.key===' ' || e.key==='PageDown') show(idx+1);
    else if(e.key==='ArrowRight' || e.key==='PageUp') show(idx-1);
    else if(e.key==='Home') show(0);
    else if(e.key==='End') show(total-1);
  });

  show(0);
</script>

</body>
</html>
