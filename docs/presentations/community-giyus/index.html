<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דוגמאות לגיוס באמצעות הקהילה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF6EE;
    --ink:#1F2A3A;
    --muted:#6B7484;
    --gold:#B5894A;
    --gold-soft:#D9B681;
    --line:#D9CFB8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--cream);
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    font-family:'Heebo',system-ui,-apple-system,sans-serif;
  }

  .deck{position:relative;width:100vw;height:100vh;overflow:hidden}
  .slide{
    position:absolute;inset:0;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:4vh 4vw;
    opacity:0;visibility:hidden;
    transition:opacity .6s ease, transform .6s ease;
    transform:translateY(20px);
  }
  .slide.active{opacity:1;visibility:visible;transform:translateY(0)}

  /* gold corner accents */
  .corner{
    position:absolute;width:42px;height:42px;
    border:1px solid var(--gold);
    opacity:.7;
  }
  .corner.tl{top:4vh;right:4vw;border-bottom:none;border-left:none}
  .corner.tr{top:4vh;left:4vw;border-bottom:none;border-right:none}
  .corner.bl{bottom:4vh;right:4vw;border-top:none;border-left:none}
  .corner.br{bottom:4vh;left:4vw;border-top:none;border-right:none}

  .img-wrap{
    height:90vh;
    max-width:92vw;
    display:flex;align-items:center;justify-content:center;
  }
  img{
    max-height:100%;
    max-width:100%;
    object-fit:contain;
    border-radius:6px;
    box-shadow:
      0 1px 0 rgba(181,137,74,.2),
      0 30px 60px -20px rgba(31,42,58,.25),
      0 12px 24px -8px rgba(31,42,58,.15);
  }

  /* footer / nav */
  .footer{
    position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:1.4rem;
    z-index:50;
  }
  .footer .counter{
    font-size:.85rem;color:var(--muted);letter-spacing:.15em;
    min-width:60px;text-align:center;
    background:rgba(250,246,238,.85);
    padding:.3rem .6rem;border-radius:14px;
  }
  .nav-btn{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line);background:rgba(255,255,255,.85);
    color:#3A4A60;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .2s ease;
  }
  .nav-btn:hover{border-color:var(--gold);color:var(--gold);background:#fff}
  .nav-btn svg{width:14px;height:14px}

  .progress-bar{
    position:fixed;top:0;left:0;height:2px;
    background:var(--gold);width:0%;
    transition:width .4s ease;
    z-index:60;
  }

  @media (max-width:768px){
    .slide{padding:3vh 3vw}
    .corner{width:28px;height:28px}
    .img-wrap{height:84vh}
  }
</style>
</head>
<body>

<div class="progress-bar" id="progress"></div>

<div class="deck" id="deck">

  <section class="slide active" data-slide="1">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="img-wrap">
      <img src="01-joint.jpeg" alt="">
    </div>
  </section>

  <section class="slide" data-slide="2">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="img-wrap">
      <img src="02-rotary.jpeg" alt="">
    </div>
  </section>

  <section class="slide" data-slide="3">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="img-wrap">
      <img src="03-bnai-brit.jpeg" alt="">
    </div>
  </section>

</div>

<div class="footer">
  <button class="nav-btn" id="prev" aria-label="הקודם">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </button>
  <div class="counter"><span id="cur">1</span> / <span id="total">3</span></div>
  <button class="nav-btn" id="next" aria-label="הבא">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  const cur = document.getElementById('cur');
  const totalEl = document.getElementById('total');
  const progress = document.getElementById('progress');
  let idx = 0;

  totalEl.textContent = total;

  function show(n){
    idx = (n + total) % total;
    slides.forEach((s,i)=>s.classList.toggle('active', i===idx));
    cur.textContent = idx + 1;
    progress.style.width = ((idx + 1) / total * 100) + '%';
  }

  document.getElementById('next').addEventListener('click', ()=>show(idx+1));
  document.getElementById('prev').addEventListener('click', ()=>show(idx-1));

  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowLeft' || e.key===' ' || e.key==='PageDown') show(idx+1);
    else if(e.key==='ArrowRight' || e.key==='PageUp') show(idx-1);
    else if(e.key==='Home') show(0);
    else if(e.key==='End') show(total-1);
  });

  show(0);
</script>

</body>
</html>
