<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דוגמאות לגיוס באמצעות הקהילה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF6EE;
    --cream-2:#F2EBDC;
    --ink:#1F2A3A;
    --muted:#6B7484;
    --gold:#B5894A;
    --gold-soft:#D9B681;
    --line:#D9CFB8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Heebo',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(217,182,129,.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(217,182,129,.06) 0%, transparent 50%),
      var(--cream);
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .deck{position:relative;width:100vw;height:100vh;overflow:hidden}
  .slide{
    position:absolute;inset:0;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:6vh 6vw;
    opacity:0;visibility:hidden;
    transition:opacity .6s ease, transform .6s ease;
    transform:translateY(20px);
  }
  .slide.active{opacity:1;visibility:visible;transform:translateY(0)}

  /* gold corner accents */
  .corner{
    position:absolute;width:46px;height:46px;
    border:1px solid var(--gold);
    opacity:.7;
  }
  .corner.tl{top:4vh;right:4vw;border-bottom:none;border-left:none}
  .corner.tr{top:4vh;left:4vw;border-bottom:none;border-right:none}
  .corner.bl{bottom:4vh;right:4vw;border-top:none;border-left:none}
  .corner.br{bottom:4vh;left:4vw;border-top:none;border-right:none}

  /* logo frame card */
  .logo-frame{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    width:min(76vh, 80vw);
    aspect-ratio:1/1;
    background:#fff;
    border-radius:8px;
    padding:6vh 6vh;
    box-shadow:
      0 1px 0 rgba(181,137,74,.25) inset,
      0 0 0 1px rgba(217,182,129,.4),
      0 40px 80px -30px rgba(31,42,58,.3),
      0 16px 32px -12px rgba(31,42,58,.18);
  }
  .logo-frame.portrait{
    aspect-ratio:3/4;
  }
  .logo-frame::before,
  .logo-frame::after{
    content:"";
    position:absolute;
    width:24px;height:24px;
    border:1px solid var(--gold-soft);
    opacity:.7;
  }
  .logo-frame::before{
    top:14px;right:14px;
    border-bottom:none;border-left:none;
  }
  .logo-frame::after{
    bottom:14px;left:14px;
    border-top:none;border-right:none;
  }
  .logo-frame img{
    max-width:100%;
    max-height:100%;
    width:auto;height:auto;
    object-fit:contain;
  }

  /* placeholder for missing logo (slide 3) */
  .placeholder{
    text-align:center;
    color:var(--muted);
  }
  .placeholder .ico{
    width:80px;height:80px;
    margin:0 auto 1.5rem;
    border:1px dashed var(--gold-soft);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);
  }
  .placeholder .ttl{
    font-size:1.5rem;font-weight:500;
    color:var(--ink);
    margin-bottom:.6rem;
  }
  .placeholder .note{
    font-size:.95rem;
    color:var(--muted);
    letter-spacing:.05em;
  }

  /* footer / nav */
  .footer{
    position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:1.4rem;
    z-index:50;
  }
  .footer .counter{
    font-size:.85rem;color:var(--muted);letter-spacing:.15em;
    min-width:60px;text-align:center;
    background:rgba(250,246,238,.85);
    padding:.3rem .6rem;border-radius:14px;
  }
  .nav-btn{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line);background:rgba(255,255,255,.85);
    color:#3A4A60;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .2s ease;
  }
  .nav-btn:hover{border-color:var(--gold);color:var(--gold);background:#fff}
  .nav-btn svg{width:14px;height:14px}

  .progress-bar{
    position:fixed;top:0;left:0;height:2px;
    background:var(--gold);width:0%;
    transition:width .4s ease;
    z-index:60;
  }

  @media (max-width:768px){
    .slide{padding:4vh 4vw}
    .corner{width:30px;height:30px}
    .logo-frame{width:88vw;padding:4vh 4vh}
  }
</style>
</head>
<body>

<div class="progress-bar" id="progress"></div>

<div class="deck" id="deck">

  <!-- Slide 1: Rotary -->
  <section class="slide active" data-slide="1">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="logo-frame">
      <img src="logo-rotary.jpg" alt="">
    </div>
  </section>

  <!-- Slide 2: שולחן עגול 3 -->
  <section class="slide" data-slide="2">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="logo-frame">
      <img src="logo-shulchan-3.webp" alt="">
    </div>
  </section>

  <!-- Slide 3: שולחן עגול 5 (placeholder — waiting for logo) -->
  <section class="slide" data-slide="3">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="logo-frame">
      <div class="placeholder">
        <div class="ico">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
        </div>
        <div class="ttl">שולחן עגול 5</div>
        <div class="note">ממתין ללוגו</div>
      </div>
    </div>
  </section>

  <!-- Slide 4: B'nai B'rith -->
  <section class="slide" data-slide="4">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="logo-frame portrait">
      <img src="logo-bnai-brit.jpg" alt="">
    </div>
  </section>

</div>

<div class="footer">
  <button class="nav-btn" id="prev" aria-label="הקודם">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </button>
  <div class="counter"><span id="cur">1</span> / <span id="total">4</span></div>
  <button class="nav-btn" id="next" aria-label="הבא">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  const cur = document.getElementById('cur');
  const totalEl = document.getElementById('total');
  const progress = document.getElementById('progress');
  let idx = 0;

  totalEl.textContent = total;

  function show(n){
    idx = (n + total) % total;
    slides.forEach((s,i)=>s.classList.toggle('active', i===idx));
    cur.textContent = idx + 1;
    progress.style.width = ((idx + 1) / total * 100) + '%';
  }

  document.getElementById('next').addEventListener('click', ()=>show(idx+1));
  document.getElementById('prev').addEventListener('click', ()=>show(idx-1));

  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowLeft' || e.key===' ' || e.key==='PageDown') show(idx+1);
    else if(e.key==='ArrowRight' || e.key==='PageUp') show(idx-1);
    else if(e.key==='Home') show(0);
    else if(e.key==='End') show(total-1);
  });

  show(0);
</script>

</body>
</html>
