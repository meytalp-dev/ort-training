<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שתיים — תמונות פייסבוק</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Rubik:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --plum: #7B5EA7;
            --plum-dark: #5A3D8A;
            --coral: #E8836B;
            --coral-dark: #D06A52;
            --sand: #F9F6F1;
            --cream: #FFFCF8;
            --charcoal: #2D2B3A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Heebo', sans-serif;
            background: #f5f3ee;
            color: var(--charcoal);
            padding: 40px;
            direction: rtl;
        }

        h1 {
            font-family: 'Rubik', sans-serif;
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 12px;
            color: var(--plum-dark);
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 15px;
        }

        .section-title {
            font-family: 'Rubik', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin: 40px 0 16px;
            color: var(--charcoal);
        }

        .canvas-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        canvas {
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-family: 'Heebo', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--plum), var(--coral));
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123,94,167,0.3);
        }

        .both-wrapper {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <h1>שתיים — תמונות לפייסבוק</h1>
    <p class="subtitle">תמונת פרופיל + תמונת כיסוי להורדה</p>

    <div class="both-wrapper">
        <!-- Profile Picture -->
        <div class="canvas-wrapper">
            <div class="section-title">תמונת פרופיל (500x500)</div>
            <canvas id="profile" width="500" height="500"></canvas>
            <button class="btn btn-primary" onclick="download('profile', 'shtayim-profile-500.png')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                הורדה
            </button>
        </div>

        <!-- Cover Photo -->
        <div class="canvas-wrapper">
            <div class="section-title">תמונת כיסוי (820x312)</div>
            <canvas id="cover" width="820" height="312"></canvas>
            <button class="btn btn-primary" onclick="download('cover', 'shtayim-cover-820.png')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                הורדה
            </button>
        </div>
    </div>

    <script>
        // Wait for fonts
        document.fonts.ready.then(() => {
            drawProfile();
            drawCover();
        });

        function drawProfile() {
            const c = document.getElementById('profile');
            const ctx = c.getContext('2d');
            const w = 500, h = 500;

            // Background - dark
            ctx.fillStyle = '#0D0A14';
            ctx.fillRect(0, 0, w, h);

            // Subtle gradient overlay
            const bgGrad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, 300);
            bgGrad.addColorStop(0, 'rgba(123,94,167,0.08)');
            bgGrad.addColorStop(1, 'rgba(232,131,107,0.04)');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            // Decorative subtle circles in background
            ctx.globalAlpha = 0.08;
            ctx.fillStyle = '#7B5EA7';
            ctx.beginPath();
            ctx.arc(100, 100, 120, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#E8836B';
            ctx.beginPath();
            ctx.arc(400, 400, 100, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            const centerX = w / 2;
            const centerY = h / 2 - 30;

            // Plum dot
            const dotSize = 38;
            const gap = 50;

            const plumGrad = ctx.createRadialGradient(centerX - gap, centerY, 0, centerX - gap, centerY, dotSize);
            plumGrad.addColorStop(0, '#8B6FB7');
            plumGrad.addColorStop(1, '#5A3D8A');
            ctx.fillStyle = plumGrad;
            ctx.beginPath();
            ctx.arc(centerX - gap, centerY, dotSize, 0, Math.PI * 2);
            ctx.fill();

            // Shadow for dots
            ctx.shadowColor = 'rgba(0,0,0,0.12)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 5;

            ctx.fillStyle = plumGrad;
            ctx.beginPath();
            ctx.arc(centerX - gap, centerY, dotSize, 0, Math.PI * 2);
            ctx.fill();

            // Bridge
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            const bridgeGrad = ctx.createLinearGradient(centerX - gap + dotSize, centerY, centerX + gap - dotSize, centerY);
            bridgeGrad.addColorStop(0, '#7B5EA7');
            bridgeGrad.addColorStop(1, '#E8836B');
            ctx.strokeStyle = bridgeGrad;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(centerX - gap + dotSize + 4, centerY);
            ctx.lineTo(centerX + gap - dotSize - 4, centerY);
            ctx.stroke();

            // Coral dot
            ctx.shadowColor = 'rgba(0,0,0,0.12)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 5;

            const coralGrad = ctx.createRadialGradient(centerX + gap, centerY, 0, centerX + gap, centerY, dotSize);
            coralGrad.addColorStop(0, '#F09580');
            coralGrad.addColorStop(1, '#D06A52');
            ctx.fillStyle = coralGrad;
            ctx.beginPath();
            ctx.arc(centerX + gap, centerY, dotSize, 0, Math.PI * 2);
            ctx.fill();

            // Reset shadow
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            // "שתיים" text
            ctx.fillStyle = '#FFFCF8';
            ctx.font = '800 62px Rubik';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('שתיים', centerX, centerY + dotSize + 30);

            // Tagline
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.font = '400 18px Heebo';
            ctx.fillText('מערכות דיגיטליות לעמותות', centerX, centerY + dotSize + 100);
        }

        function drawCover() {
            const c = document.getElementById('cover');
            const ctx = c.getContext('2d');
            const w = 820, h = 312;

            // Background - dark
            ctx.fillStyle = '#0D0A14';
            ctx.fillRect(0, 0, w, h);

            // Gradient accent strip at bottom
            const stripGrad = ctx.createLinearGradient(0, h - 6, w, h - 6);
            stripGrad.addColorStop(0, '#7B5EA7');
            stripGrad.addColorStop(1, '#E8836B');
            ctx.fillStyle = stripGrad;
            ctx.fillRect(0, h - 5, w, 5);

            // Decorative background shapes
            ctx.globalAlpha = 0.08;
            ctx.fillStyle = '#7B5EA7';
            ctx.beginPath();
            ctx.arc(150, 50, 180, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#E8836B';
            ctx.beginPath();
            ctx.arc(700, 280, 160, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            // Logo - dots + bridge (right side)
            const logoX = 620;
            const logoY = h / 2 - 20;
            const dotSize = 28;
            const gap = 38;

            // Plum dot
            ctx.shadowColor = 'rgba(0,0,0,0.1)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 3;

            const plumGrad = ctx.createRadialGradient(logoX - gap, logoY, 0, logoX - gap, logoY, dotSize);
            plumGrad.addColorStop(0, '#8B6FB7');
            plumGrad.addColorStop(1, '#5A3D8A');
            ctx.fillStyle = plumGrad;
            ctx.beginPath();
            ctx.arc(logoX - gap, logoY, dotSize, 0, Math.PI * 2);
            ctx.fill();

            // Bridge
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            const bridgeGrad = ctx.createLinearGradient(logoX - gap + dotSize, logoY, logoX + gap - dotSize, logoY);
            bridgeGrad.addColorStop(0, '#7B5EA7');
            bridgeGrad.addColorStop(1, '#E8836B');
            ctx.strokeStyle = bridgeGrad;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(logoX - gap + dotSize + 3, logoY);
            ctx.lineTo(logoX + gap - dotSize - 3, logoY);
            ctx.stroke();

            // Coral dot
            ctx.shadowColor = 'rgba(0,0,0,0.1)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 3;

            const coralGrad = ctx.createRadialGradient(logoX + gap, logoY, 0, logoX + gap, logoY, dotSize);
            coralGrad.addColorStop(0, '#F09580');
            coralGrad.addColorStop(1, '#D06A52');
            ctx.fillStyle = coralGrad;
            ctx.beginPath();
            ctx.arc(logoX + gap, logoY, dotSize, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            // "שתיים" under logo
            ctx.fillStyle = '#FFFCF8';
            ctx.font = '800 36px Rubik';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('שתיים', logoX, logoY + dotSize + 16);

            // Left side text
            const textX = 260;

            ctx.fillStyle = '#FFFCF8';
            ctx.font = '700 30px Rubik';
            ctx.textAlign = 'center';
            ctx.fillText('שתיים בונות — עמותות גדלות', textX, 90);

            // Subtitle
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '400 17px Heebo';
            ctx.fillText('מערכות ניהול דיגיטליות בהתאמה אישית', textX, 140);
            ctx.fillText('באמצעות AI, בעלות כמעט אפסית', textX, 165);

            // Three value pills
            const pills = ['AI מותאם', 'חיסכון מיידי', 'ניסיון ניהולי'];
            const pillColors = ['#7B5EA7', '#E8836B', '#5BBF9E'];
            const pillY = 210;
            const pillGap = 130;
            const startX = textX - pillGap;

            pills.forEach((text, i) => {
                const px = startX + i * pillGap;

                // Pill background
                ctx.fillStyle = pillColors[i] + '25';
                ctx.beginPath();
                ctx.roundRect(px - 52, pillY, 104, 34, 17);
                ctx.fill();

                // Pill border
                ctx.strokeStyle = pillColors[i] + '50';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(px - 52, pillY, 104, 34, 17);
                ctx.stroke();

                // Pill text
                ctx.fillStyle = pillColors[i];
                ctx.font = '600 14px Heebo';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, px, pillY + 17);
            });
        }

        function download(id, filename) {
            const canvas = document.getElementById(id);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
