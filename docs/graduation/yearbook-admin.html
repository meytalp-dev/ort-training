<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ספר מחזור — תשובות התלמידים | אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --dream:#8E7ED4;--dream-light:#D4CEF0;--dream-dark:#5B4BA0;
  --create:#E8B060;--create-light:#F5DEB0;--create-dark:#D48A2C;
  --lead:#3AACA0;--lead-light:#B8E4DE;--lead-dark:#1B7A6E;
  --spark:#E8909C;--spark-dark:#D45C6E;
  --info:#5B9BD5;--info-light:#C7DDF0;--info-dark:#3B7EC0;
  --bg:#FAFBFC;--card:#fff;
  --text:#2C2622;--text-light:#6E6258;--muted:#8C7E72;
  --border:#EDE6D8;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 8px rgba(44,38,34,.05);
  --shadow-md:0 6px 20px rgba(44,38,34,.08);
  --shadow-lg:0 12px 40px rgba(44,38,34,.1);
}
body{font-family:Heebo,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.05) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.05) 0%,transparent 70%),
    radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.04) 0%,transparent 70%);
  pointer-events:none;z-index:0}
h1,h2,h3,h4{font-family:'Playpen Sans Hebrew','Heebo',sans-serif}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== HEADER ===== */
.header{text-align:center;padding:48px 24px 24px;position:relative;z-index:1}
.header-icon{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,var(--dream),var(--lead));
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;box-shadow:0 8px 32px rgba(142,126,212,.25);
  animation:slideUp .5s ease;
}
.header-icon svg{width:40px;height:40px;fill:#fff}
.header h1{font-size:1.7rem;font-weight:800;font-family:Heebo;margin-bottom:4px;animation:slideUp .5s ease .1s both}
.header .subtitle{color:var(--muted);font-size:.95rem;animation:slideUp .5s ease .2s both}
.header .school{
  display:inline-block;margin-top:10px;padding:5px 16px;
  background:var(--dream-light);color:var(--dream-dark);
  border-radius:20px;font-size:.8rem;font-weight:600;
  animation:slideUp .5s ease .3s both;
}

/* ===== CONTAINER ===== */
.container{
  max-width:1100px;margin:0 auto 60px;padding:0 20px;
  position:relative;z-index:1;
}

/* ===== STATS ===== */
.stats-row{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:28px;animation:fadeIn .4s ease .2s both;
}
.stat-card{
  background:var(--card);border-radius:var(--radius);
  border:1px solid var(--border);box-shadow:var(--shadow);
  padding:18px 20px;display:flex;align-items:center;gap:14px;
}
.stat-icon{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.stat-icon svg{width:22px;height:22px}
.stat-info{flex:1;min-width:0}
.stat-value{font-size:1.5rem;font-weight:800;line-height:1.1;font-family:Heebo}
.stat-label{font-size:.78rem;color:var(--muted);margin-top:2px}

.stat-total .stat-icon{background:linear-gradient(135deg,var(--dream-light),rgba(142,126,212,.2))}
.stat-total .stat-icon svg{fill:var(--dream-dark)}
.stat-total .stat-value{color:var(--dream-dark)}

.stat-yb1 .stat-icon{background:linear-gradient(135deg,var(--lead-light),rgba(58,172,160,.2))}
.stat-yb1 .stat-icon svg{fill:var(--lead-dark)}
.stat-yb1 .stat-value{color:var(--lead-dark)}

.stat-yb2 .stat-icon{background:linear-gradient(135deg,var(--create-light),rgba(232,176,96,.2))}
.stat-yb2 .stat-icon svg{fill:var(--create-dark)}
.stat-yb2 .stat-value{color:var(--create-dark)}

.stat-yb3 .stat-icon{background:linear-gradient(135deg,rgba(232,144,156,.25),rgba(212,92,110,.12))}
.stat-yb3 .stat-icon svg{fill:var(--spark-dark)}
.stat-yb3 .stat-value{color:var(--spark-dark)}

/* ===== TOOLBAR ===== */
.toolbar{
  background:var(--card);border-radius:var(--radius);
  border:1px solid var(--border);box-shadow:var(--shadow);
  padding:18px 20px;margin-bottom:24px;
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  animation:fadeIn .4s ease .3s both;
}
.search-box{
  flex:1;min-width:200px;position:relative;
}
.search-box svg{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;fill:var(--muted);pointer-events:none;
}
.search-box input{
  width:100%;padding:11px 42px 11px 14px;
  border:1.5px solid var(--border);border-radius:12px;
  font-family:Heebo;font-size:.92rem;direction:rtl;
  background:#FAFBFC;transition:all .2s ease;
}
.search-box input:focus{
  outline:none;border-color:var(--dream);background:#fff;
  box-shadow:0 0 0 3px rgba(142,126,212,.12);
}

.filter-chips{display:flex;gap:8px;flex-wrap:wrap}
.filter-chip{
  padding:8px 16px;border-radius:10px;
  border:1.5px solid var(--border);background:#FAFBFC;
  font-family:Heebo;font-size:.85rem;font-weight:500;
  cursor:pointer;transition:all .2s ease;color:var(--text-light);
}
.filter-chip:hover{border-color:var(--dream);color:var(--dream-dark)}
.filter-chip.active{border-color:var(--dream);background:var(--dream);color:#fff}

.action-btn{
  padding:10px 18px;border-radius:12px;border:1.5px solid var(--lead);
  background:transparent;color:var(--lead-dark);font-family:Heebo;
  font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s ease;
  display:inline-flex;align-items:center;gap:6px;
}
.action-btn:hover{background:var(--lead-light)}
.action-btn svg{width:16px;height:16px;fill:currentColor}

/* ===== CARDS GRID ===== */
.cards-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:18px;
}
.student-card{
  background:var(--card);border-radius:var(--radius-lg);
  border:1px solid var(--border);box-shadow:var(--shadow);
  padding:24px;transition:all .25s ease;
  animation:fadeIn .4s ease both;
  display:flex;flex-direction:column;
}
.student-card:hover{
  transform:translateY(-3px);box-shadow:var(--shadow-md);
  border-color:var(--dream-light);
}
.card-head{
  display:flex;align-items:center;gap:12px;margin-bottom:16px;
  padding-bottom:14px;border-bottom:1px solid var(--border);
}
.card-avatar{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--dream),var(--dream-dark));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-family:Heebo;font-size:1.05rem;
  flex-shrink:0;
}
.card-name-row{flex:1;min-width:0}
.card-name{font-size:1.05rem;font-weight:700;line-height:1.2;color:var(--text)}
.card-class{
  display:inline-block;margin-top:4px;padding:2px 10px;
  background:var(--lead-light);color:var(--lead-dark);
  border-radius:10px;font-size:.75rem;font-weight:600;
}
.card-class.yb2{background:var(--create-light);color:var(--create-dark)}
.card-class.yb3{background:rgba(232,144,156,.25);color:var(--spark-dark)}

.field-block{margin-bottom:14px}
.field-block:last-child{margin-bottom:0}
.field-label{
  display:flex;align-items:center;gap:6px;
  font-size:.72rem;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;
}
.field-label svg{width:13px;height:13px;fill:currentColor}
.field-value{
  font-size:.92rem;color:var(--text);line-height:1.55;
  white-space:pre-wrap;word-break:break-word;
}
.field-empty{color:#C5BCB0;font-style:italic;font-size:.85rem}

/* ===== EMPTY / LOADING ===== */
.empty-state, .loading-state{
  background:var(--card);border-radius:var(--radius-lg);
  border:1px dashed var(--border);
  padding:60px 24px;text-align:center;
}
.empty-state svg, .loading-state svg{
  width:56px;height:56px;fill:var(--dream-light);margin-bottom:14px;
}
.empty-state h3, .loading-state h3{
  font-size:1.2rem;font-weight:700;margin-bottom:6px;color:var(--text);
}
.empty-state p, .loading-state p{color:var(--muted);font-size:.92rem}

.spinner{
  width:48px;height:48px;border:3px solid var(--dream-light);
  border-top-color:var(--dream);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 14px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
  .header{padding:32px 16px 16px}
  .header h1{font-size:1.35rem}
  .toolbar{padding:14px 16px;flex-direction:column;align-items:stretch}
  .search-box{min-width:0}
  .filter-chips{justify-content:center}
  .cards-grid{grid-template-columns:1fr}
  .student-card{padding:20px}
}

/* ===== PRINT ===== */
@media print{
  body::before, .toolbar, .header-icon, .header .school, .stats-row{display:none}
  .header{padding:12px 0 8px}
  .student-card{break-inside:avoid;page-break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  .cards-grid{display:block}
  .student-card{margin-bottom:14px}
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="header-icon">
    <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
  </div>
  <h1>ספר מחזור תשפ"ז — תשובות התלמידים</h1>
  <div class="subtitle">צפייה במה שהתלמידים מילאו על עצמם</div>
  <div class="school">אורט בית הערבה ירושלים</div>
</div>

<div class="container">

  <!-- ===== STATS ===== -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card stat-total">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      </div>
      <div class="stat-info">
        <div class="stat-value" id="statTotal">—</div>
        <div class="stat-label">סה"כ תשובות</div>
      </div>
    </div>
    <div class="stat-card stat-yb1">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
      <div class="stat-info">
        <div class="stat-value" id="statYb1">—</div>
        <div class="stat-label">יב1</div>
      </div>
    </div>
    <div class="stat-card stat-yb2">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
      <div class="stat-info">
        <div class="stat-value" id="statYb2">—</div>
        <div class="stat-label">יב2</div>
      </div>
    </div>
    <div class="stat-card stat-yb3">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
      <div class="stat-info">
        <div class="stat-value" id="statYb3">—</div>
        <div class="stat-label">יב3</div>
      </div>
    </div>
  </div>

  <!-- ===== TOOLBAR ===== -->
  <div class="toolbar">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="search" id="searchInput" placeholder="חיפוש לפי שם...">
    </div>
    <div class="filter-chips" id="filterChips">
      <div class="filter-chip active" data-class="all">הכל</div>
      <div class="filter-chip" data-class="יב1">יב1</div>
      <div class="filter-chip" data-class="יב2">יב2</div>
      <div class="filter-chip" data-class="יב3">יב3</div>
    </div>
    <button class="action-btn" onclick="loadFromSheet(true)">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      רענון
    </button>
    <button class="action-btn" onclick="exportCSV()" style="border-color:var(--create-dark);color:var(--create-dark)">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      ייצוא CSV
    </button>
    <button class="action-btn" onclick="window.print()" style="border-color:var(--info-dark);color:var(--info-dark)">
      <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
      הדפסה
    </button>
  </div>

  <!-- ===== CONTENT ===== -->
  <div id="content">
    <div class="loading-state">
      <div class="spinner"></div>
      <h3>טוען תשובות...</h3>
      <p>שואב נתונים מגיליון Google</p>
    </div>
  </div>

</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz2QOG5BU0ET12IE5hUWMrhlqWDupWWeuiO2l5AoqJqRi8tfoj5mGPXMqPUcZw_pamH/exec';
const SHEET_NAME = 'ספר מחזור';
const LS_KEY = 'ort_yearbook';

let submissions = [];
let activeClass = 'all';
let searchTerm = '';

// ===================== INIT =====================
document.addEventListener('DOMContentLoaded', () => {
  loadLocal();
  render();
  loadFromSheet();

  document.getElementById('searchInput').addEventListener('input', e => {
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });
  document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeClass = chip.dataset.class;
      render();
    });
  });
});

// ===================== LOAD =====================
function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (d && d.submissions) submissions = d.submissions;
  } catch(e) {}
}
function saveLocal() {
  localStorage.setItem(LS_KEY, JSON.stringify({ submissions, updated: new Date().toISOString() }));
}

function loadFromSheet(forceRefresh) {
  if (!APPS_SCRIPT_URL) return;
  if (forceRefresh) {
    document.getElementById('content').innerHTML =
      '<div class="loading-state"><div class="spinner"></div><h3>מרענן...</h3><p>שואב את התשובות העדכניות</p></div>';
  }
  try {
    const cb = 'cb_yb_' + Date.now();
    window[cb] = function(d) {
      delete window[cb];
      if (d && d.rows && d.rows.length) {
        submissions = d.rows.map(r => ({
          id: r['מזהה'] || ('YB' + Math.random()),
          name: r['שם'] || '',
          class: r['כיתה'] || '',
          next: r['מה עושה שנה הבאה'] || '',
          dream: r['חלום לעתיד'] || '',
          message: r['מסר לדורות הבאים'] || '',
          takeaway: r['משהו שלקחתי מבית הספר'] || '',
          date: r['תאריך'] || ''
        }));
        saveLocal();
      }
      render();
    };
    const s = document.createElement('script');
    s.src = APPS_SCRIPT_URL + '?action=getForm&sheet=' + encodeURIComponent(SHEET_NAME) + '&callback=' + cb;
    s.onerror = () => { delete window[cb]; render(); };
    document.head.appendChild(s);
  } catch(e) { render(); }
}

// ===================== RENDER =====================
function render() {
  // stats
  const total = submissions.length;
  const c1 = submissions.filter(s => s.class === 'יב1').length;
  const c2 = submissions.filter(s => s.class === 'יב2').length;
  const c3 = submissions.filter(s => s.class === 'יב3').length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statYb1').textContent = c1;
  document.getElementById('statYb2').textContent = c2;
  document.getElementById('statYb3').textContent = c3;

  // filter
  let filtered = submissions.slice();
  if (activeClass !== 'all') filtered = filtered.filter(s => s.class === activeClass);
  if (searchTerm) filtered = filtered.filter(s => (s.name || '').toLowerCase().includes(searchTerm));

  // sort by class then name
  filtered.sort((a, b) => {
    if (a.class !== b.class) return (a.class || '').localeCompare(b.class || '', 'he');
    return (a.name || '').localeCompare(b.name || '', 'he');
  });

  const content = document.getElementById('content');
  if (filtered.length === 0) {
    content.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .89-2 2v14c0 1.11.89 2 2 2h14c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm-1 16H6c-.55 0-1-.45-1-1V6c0-.55.45-1 1-1h12c.55 0 1 .45 1 1v12c0 .55-.45 1-1 1zm-7-4h6v2h-6v-2zm0-4h6v2h-6v-2zm0-4h6v2h-6V7zM7 7h2v2H7V7zm0 4h2v2H7v-2zm0 4h2v2H7v-2z"/></svg>
        <h3>${total === 0 ? 'אין עדיין תשובות' : 'אין תוצאות לסינון הנוכחי'}</h3>
        <p>${total === 0 ? 'התלמידים עוד לא התחילו למלא את הטופס' : 'נסי לשנות את החיפוש או הסינון'}</p>
      </div>`;
    return;
  }

  let html = '<div class="cards-grid">';
  filtered.forEach((s, idx) => {
    const initials = (s.name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('');
    const classMod = s.class === 'יב2' ? 'yb2' : (s.class === 'יב3' ? 'yb3' : '');
    html += `
      <div class="student-card" style="animation-delay:${Math.min(idx * 30, 600)}ms">
        <div class="card-head">
          <div class="card-avatar">${esc(initials)}</div>
          <div class="card-name-row">
            <div class="card-name">${esc(s.name || 'ללא שם')}</div>
            <span class="card-class ${classMod}">${esc(s.class || '—')}</span>
          </div>
        </div>
        ${fieldBlock('שנה הבאה', s.next, 'M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 002 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z')}
        ${fieldBlock('חלום לעתיד', s.dream, 'M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l1.92 4.53 4.92.42-3.73 3.23L16.23 18z')}
        ${fieldBlock('מסר לדורות הבאים', s.message, 'M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z')}
        ${fieldBlock('מה לקחתי מבית הספר', s.takeaway, 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z')}
      </div>`;
  });
  html += '</div>';
  content.innerHTML = html;
}

function fieldBlock(label, value, iconPath) {
  const v = (value || '').trim();
  return `
    <div class="field-block">
      <div class="field-label">
        <svg viewBox="0 0 24 24"><path d="${iconPath}"/></svg>
        ${label}
      </div>
      <div class="field-value ${v ? '' : 'field-empty'}">${v ? esc(v) : 'לא מילאו'}</div>
    </div>`;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ===================== EXPORT =====================
function exportCSV() {
  if (submissions.length === 0) return;
  const headers = ['שם', 'כיתה', 'שנה הבאה', 'חלום לעתיד', 'מסר לדורות הבאים', 'מה לקחתי מבית הספר'];
  const rows = submissions.map(s => [s.name, s.class, s.next, s.dream, s.message, s.takeaway]);
  const csv = [headers, ...rows].map(row =>
    row.map(cell => {
      const v = (cell || '').toString().replace(/"/g, '""');
      return /[",\n]/.test(v) ? `"${v}"` : v;
    }).join(',')
  ).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ספר-מחזור-תשפז-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
