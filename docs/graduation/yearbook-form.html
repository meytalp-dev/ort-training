<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ספר מחזור — אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --dream:#8E7ED4;--dream-light:#D4CEF0;--dream-dark:#5B4BA0;
  --create:#E8B060;--create-light:#F5DEB0;--create-dark:#D48A2C;
  --lead:#3AACA0;--lead-light:#B8E4DE;--lead-dark:#1B7A6E;
  --spark:#E8909C;--spark-dark:#D45C6E;
  --bg:#fff;--card:#fff;
  --text:#2C2622;--text-light:#6E6258;--muted:#8C7E72;
  --border:#EDE6D8;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 8px rgba(44,38,34,.05);
  --shadow-md:0 6px 20px rgba(44,38,34,.08);
  --shadow-lg:0 12px 40px rgba(44,38,34,.1);
}
body{font-family:Heebo,sans-serif;background:#FAFBFC;color:var(--text);min-height:100vh;line-height:1.6}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 500px 400px at 15% 25%,rgba(142,126,212,.05) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 85% 60%,rgba(232,176,96,.05) 0%,transparent 70%),
    radial-gradient(ellipse 450px 350px at 50% 85%,rgba(58,172,160,.04) 0%,transparent 70%);
  pointer-events:none;z-index:0}
h1,h2,h3,h4{font-family:'Playpen Sans Hebrew','Heebo',sans-serif}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes sparkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* ===== HEADER ===== */
.header{text-align:center;padding:48px 24px 32px;position:relative;z-index:1}
.header-icon{
  width:88px;height:88px;border-radius:50%;
  background:linear-gradient(135deg,var(--dream),var(--lead));
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;box-shadow:0 8px 32px rgba(142,126,212,.25);
  animation:slideUp .6s ease;
}
.header-icon svg{width:44px;height:44px;fill:#fff}
.header h1{font-size:1.6rem;font-weight:800;font-family:Heebo;margin-bottom:6px;animation:slideUp .6s ease .1s both}
.header .subtitle{color:var(--muted);font-size:.95rem;animation:slideUp .6s ease .2s both}
.header .school{
  display:inline-block;margin-top:12px;padding:6px 18px;
  background:var(--dream-light);color:var(--dream-dark);
  border-radius:20px;font-size:.82rem;font-weight:600;
  animation:slideUp .6s ease .3s both;
}

/* ===== FORM CONTAINER ===== */
.form-container{
  max-width:640px;margin:0 auto 80px;padding:0 20px;
  position:relative;z-index:1;
}
.form-card{
  background:var(--card);border-radius:var(--radius-lg);
  border:1px solid var(--border);box-shadow:var(--shadow-lg);
  padding:40px 36px;animation:slideUp .5s ease .2s both;
}
.form-group{margin-bottom:28px;animation:fadeIn .4s ease both}
.form-group:nth-child(1){animation-delay:.3s}
.form-group:nth-child(2){animation-delay:.4s}
.form-group:nth-child(3){animation-delay:.5s}
.form-group:nth-child(4){animation-delay:.6s}
.form-group:nth-child(5){animation-delay:.7s}

.form-label{
  display:flex;align-items:center;gap:10px;
  font-size:.92rem;font-weight:600;color:var(--text);
  margin-bottom:10px;
}
.form-label .label-icon{
  width:36px;height:36px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.form-label .label-icon svg{width:18px;height:18px}
.form-label .label-hint{font-weight:400;color:var(--muted);font-size:.8rem;margin-right:auto}

.form-input{
  width:100%;padding:14px 18px;border:1.5px solid var(--border);
  border-radius:14px;font-family:Heebo,sans-serif;font-size:.95rem;
  direction:rtl;color:var(--text);background:#FAFBFC;
  transition:all .25s ease;resize:none;line-height:1.6;
}
.form-input:focus{
  outline:none;border-color:var(--dream);
  box-shadow:0 0 0 3px rgba(142,126,212,.12);
  background:#fff;
}
.form-input::placeholder{color:#B8AFA4;font-weight:300}
textarea.form-input{min-height:100px}

/* Color accents per field */
.field-name .label-icon{background:linear-gradient(135deg,var(--lead-light),rgba(58,172,160,.15))}
.field-name .label-icon svg{fill:var(--lead-dark)}
.field-name .form-input:focus{border-color:var(--lead);box-shadow:0 0 0 3px rgba(58,172,160,.12)}

.field-next .label-icon{background:linear-gradient(135deg,var(--create-light),rgba(232,176,96,.15))}
.field-next .label-icon svg{fill:var(--create-dark)}
.field-next .form-input:focus{border-color:var(--create);box-shadow:0 0 0 3px rgba(232,176,96,.12)}

.field-dream .label-icon{background:linear-gradient(135deg,var(--dream-light),rgba(142,126,212,.15))}
.field-dream .label-icon svg{fill:var(--dream-dark)}
.field-dream .form-input:focus{border-color:var(--dream);box-shadow:0 0 0 3px rgba(142,126,212,.12)}

.field-message .label-icon{background:linear-gradient(135deg,rgba(232,144,156,.2),rgba(212,92,110,.1))}
.field-message .label-icon svg{fill:var(--spark-dark)}
.field-message .form-input:focus{border-color:var(--spark);box-shadow:0 0 0 3px rgba(232,144,156,.12)}

.field-takeaway .label-icon{background:linear-gradient(135deg,rgba(91,155,213,.15),rgba(91,155,213,.08))}
.field-takeaway .label-icon svg{fill:#3B7EC0}
.field-takeaway .form-input:focus{border-color:#5B9BD5;box-shadow:0 0 0 3px rgba(91,155,213,.12)}

/* ===== CLASS SELECT ===== */
.class-select-row{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;
  animation:fadeIn .4s ease .25s both;
}
.class-chip{
  padding:10px 20px;border-radius:12px;
  border:1.5px solid var(--border);background:#FAFBFC;
  font-family:Heebo;font-size:.88rem;font-weight:500;
  cursor:pointer;transition:all .25s ease;color:var(--text-light);
}
.class-chip:hover{border-color:var(--dream);color:var(--dream-dark);background:var(--dream-light)}
.class-chip.active{
  border-color:var(--dream);background:var(--dream);color:#fff;
  box-shadow:0 4px 12px rgba(142,126,212,.25);
}

/* ===== SUBMIT ===== */
.submit-btn{
  width:100%;padding:16px;border:none;border-radius:16px;
  background:linear-gradient(135deg,var(--dream),var(--dream-dark));
  color:#fff;font-family:Heebo;font-size:1.05rem;font-weight:700;
  cursor:pointer;transition:all .3s ease;
  box-shadow:0 6px 24px rgba(142,126,212,.3);
  margin-top:8px;
}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(142,126,212,.4)}
.submit-btn:active{transform:translateY(0)}
.submit-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.submit-btn .btn-text{display:flex;align-items:center;justify-content:center;gap:8px}

/* ===== SUCCESS ===== */
.success-screen{
  display:none;text-align:center;padding:60px 24px;
  max-width:540px;margin:0 auto;position:relative;z-index:1;
}
.success-screen.show{display:block;animation:slideUp .5s ease}
.success-icon{
  width:100px;height:100px;border-radius:50%;
  background:linear-gradient(135deg,var(--lead),var(--lead-dark));
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 24px;box-shadow:0 8px 32px rgba(58,172,160,.3);
  animation:pulse 2s ease infinite;
}
.success-icon svg{width:50px;height:50px;fill:#fff}
.success-screen h2{font-size:1.5rem;font-weight:800;font-family:Heebo;margin-bottom:8px}
.success-screen p{color:var(--muted);font-size:1rem;margin-bottom:32px;line-height:1.7}
.success-card{
  background:var(--card);border-radius:var(--radius-lg);
  border:1px solid var(--border);box-shadow:var(--shadow-md);
  padding:28px;text-align:right;margin-bottom:24px;
}
.success-card .sc-label{font-size:.78rem;color:var(--muted);margin-bottom:4px}
.success-card .sc-value{font-size:.95rem;font-weight:500;margin-bottom:16px;line-height:1.6}
.success-card .sc-value:last-child{margin-bottom:0}
.another-btn{
  padding:14px 32px;border:1.5px solid var(--dream);border-radius:14px;
  background:transparent;color:var(--dream-dark);font-family:Heebo;
  font-size:.92rem;font-weight:600;cursor:pointer;transition:all .25s ease;
}
.another-btn:hover{background:var(--dream-light)}

/* ===== CONFETTI ===== */
.confetti{position:fixed;top:-20px;width:10px;height:10px;border-radius:2px;z-index:100;animation:confetti-fall 3s ease forwards}

/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  padding:14px 28px;border-radius:14px;font-family:Heebo;font-size:.88rem;
  font-weight:500;z-index:200;transition:transform .3s ease;
  box-shadow:var(--shadow-lg);
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:#E8F5E9;color:#2E7D32;border:1px solid #C8E6C9}
.toast.error{background:#FCE7EA;color:#C62828;border:1px solid #F5C6CB}

/* ===== COUNTER ===== */
.counter{
  text-align:center;margin-bottom:24px;padding:12px;
  background:var(--dream-light);border-radius:12px;
  font-size:.85rem;color:var(--dream-dark);font-weight:500;
  animation:fadeIn .4s ease .15s both;
}
.counter strong{font-weight:700}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
  .header{padding:32px 16px 24px}
  .header-icon{width:72px;height:72px}
  .header-icon svg{width:36px;height:36px}
  .header h1{font-size:1.3rem}
  .form-card{padding:28px 22px;border-radius:20px}
  .form-input{padding:12px 14px;font-size:.9rem}
  .class-chip{padding:8px 16px;font-size:.82rem}
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="header-icon">
    <svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
  </div>
  <h1>ספר מחזור תשפ"ז</h1>
  <div class="subtitle">כל תלמיד, כל סיפור, כל חלום</div>
  <div class="school">אורט בית הערבה ירושלים</div>
</div>

<!-- ===== COUNTER ===== -->
<div class="form-container">
  <div class="counter" id="counter">
    <svg style="width:16px;height:16px;fill:currentColor;vertical-align:middle;margin-left:4px" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
    <span id="counterText">טוען...</span>
  </div>

  <!-- ===== FORM ===== -->
  <div class="form-card" id="formCard">
    <!-- Class Selection -->
    <div class="form-group">
      <div class="form-label">
        <div class="label-icon" style="background:linear-gradient(135deg,var(--create-light),rgba(232,176,96,.15))">
          <svg style="fill:var(--create-dark)" viewBox="0 0 24 24"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
        </div>
        <span>כיתה</span>
      </div>
      <div class="class-select-row" id="classSelect">
        <div class="class-chip" data-class="ט1" onclick="selectClass(this)">ט1</div>
        <div class="class-chip" data-class="ט2" onclick="selectClass(this)">ט2</div>
        <div class="class-chip" data-class="י1" onclick="selectClass(this)">י1</div>
        <div class="class-chip" data-class="י2" onclick="selectClass(this)">י2</div>
        <div class="class-chip" data-class="יא1" onclick="selectClass(this)">יא1</div>
        <div class="class-chip" data-class="יא2" onclick="selectClass(this)">יא2</div>
        <div class="class-chip" data-class="יב1" onclick="selectClass(this)">יב1</div>
        <div class="class-chip" data-class="יב2" onclick="selectClass(this)">יב2</div>
      </div>
    </div>

    <!-- Name -->
    <div class="form-group field-name">
      <label class="form-label">
        <div class="label-icon">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <span>השם שלי</span>
      </label>
      <input type="text" class="form-input" id="fieldName" placeholder="איך קוראים לך?" autocomplete="off">
    </div>

    <!-- Next Year -->
    <div class="form-group field-next">
      <label class="form-label">
        <div class="label-icon">
          <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 002 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5v-5z"/></svg>
        </div>
        <span>מה אני עושה שנה הבאה?</span>
        <span class="label-hint">צבא, שירות, עבודה, לימודים...</span>
      </label>
      <input type="text" class="form-input" id="fieldNext" placeholder="מה מחכה לי אחרי התיכון?" autocomplete="off">
    </div>

    <!-- Dream -->
    <div class="form-group field-dream">
      <label class="form-label">
        <div class="label-icon">
          <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l1.92 4.53 4.92.42-3.73 3.23L16.23 18z"/></svg>
        </div>
        <span>חלום לעתיד</span>
        <span class="label-hint">איפה אני רואה את עצמי בעוד כמה שנים?</span>
      </label>
      <textarea class="form-input" id="fieldDream" placeholder="החלום שלי הוא..."></textarea>
    </div>

    <!-- Message to Future -->
    <div class="form-group field-message">
      <label class="form-label">
        <div class="label-icon">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
        </div>
        <span>מסר לדורות הבאים</span>
        <span class="label-hint">מה הייתם אומרים לתלמידים שיבואו אחריכם?</span>
      </label>
      <textarea class="form-input" id="fieldMessage" placeholder="הטיפ שלי למי שמגיע אחריי..."></textarea>
    </div>

    <!-- Takeaway -->
    <div class="form-group field-takeaway">
      <label class="form-label">
        <div class="label-icon">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
        <span>משהו שלקחתי מבית הספר במסע שלי פה</span>
      </label>
      <textarea class="form-input" id="fieldTakeaway" placeholder="הדבר הכי חשוב שלקחתי איתי מבית הספר..."></textarea>
    </div>

    <!-- Submit -->
    <button class="submit-btn" id="submitBtn" onclick="submitForm()">
      <span class="btn-text">
        <svg style="width:20px;height:20px;fill:#fff" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        שליחה
      </span>
    </button>
  </div>
</div>

<!-- ===== SUCCESS SCREEN ===== -->
<div class="success-screen" id="successScreen">
  <div class="success-icon">
    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
  </div>
  <h2>נשמר בהצלחה!</h2>
  <p>התשובות שלך נכנסו לספר המחזור.<br>תודה שהשתתפת!</p>
  <div class="success-card" id="successSummary"></div>
  <button class="another-btn" onclick="resetForm()">
    <svg style="width:16px;height:16px;fill:currentColor;vertical-align:middle;margin-left:6px" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
    מילוי נוסף (תלמיד אחר)
  </button>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz2QOG5BU0ET12IE5hUWMrhlqWDupWWeuiO2l5AoqJqRi8tfoj5mGPXMqPUcZw_pamH/exec';
const SHEET_NAME = 'ספר מחזור';
const LS_KEY = 'ort_yearbook';

let selectedClass = '';
let submissions = [];

// ===================== INIT =====================
document.addEventListener('DOMContentLoaded', () => {
  loadLocal();
  updateCounter();
  loadFromSheet();
});

// ===================== CLASS SELECT =====================
function selectClass(el) {
  document.querySelectorAll('.class-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedClass = el.dataset.class;
}

// ===================== SUBMIT =====================
function submitForm() {
  const name = document.getElementById('fieldName').value.trim();
  const next = document.getElementById('fieldNext').value.trim();
  const dream = document.getElementById('fieldDream').value.trim();
  const message = document.getElementById('fieldMessage').value.trim();
  const takeaway = document.getElementById('fieldTakeaway').value.trim();

  if (!name) { showToast('נא למלא את השם', 'error'); return; }
  if (!selectedClass) { showToast('נא לבחור כיתה', 'error'); return; }
  if (!next && !dream && !message && !takeaway) { showToast('נא למלא לפחות שדה אחד', 'error'); return; }

  const entry = {
    id: 'YB' + Date.now(),
    name, class: selectedClass, next, dream, message, takeaway,
    date: new Date().toISOString()
  };

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.querySelector('.btn-text').textContent = 'שולח...';

  // Save locally first
  submissions.push(entry);
  saveLocal();

  // Send to Sheet
  saveToSheet(entry).then(() => {
    showSuccess(entry);
    updateCounter();
    btn.disabled = false;
    btn.querySelector('.btn-text').innerHTML = '<svg style="width:20px;height:20px;fill:#fff" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg> שליחה';
  });
}

// ===================== SHEET SYNC =====================
function saveToSheet(entry) {
  if (!APPS_SCRIPT_URL) return Promise.resolve();
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    mode: 'no-cors',
    body: JSON.stringify({
      action: 'saveForm',
      sheet: SHEET_NAME,
      fields: {
        'מזהה': entry.id,
        'שם': entry.name,
        'כיתה': entry.class,
        'מה עושה שנה הבאה': entry.next,
        'חלום לעתיד': entry.dream,
        'מסר לדורות הבאים': entry.message,
        'משהו שלקחתי מבית הספר': entry.takeaway
      }
    })
  }).catch(() => {});
}

function loadFromSheet() {
  if (!APPS_SCRIPT_URL) return;
  try {
    const cb = 'cb_yb_' + Date.now();
    window[cb] = function(d) {
      delete window[cb];
      if (d && d.rows && d.rows.length) {
        const localIds = new Set(submissions.map(s => s.id));
        d.rows.forEach(r => {
          if (r['מזהה'] && !localIds.has(r['מזהה'])) {
            submissions.push({
              id: r['מזהה'], name: r['שם'] || '', class: r['כיתה'] || '',
              next: r['מה עושה שנה הבאה'] || '', dream: r['חלום לעתיד'] || '',
              message: r['מסר לדורות הבאים'] || '', takeaway: r['משהו שלקחתי מבית הספר'] || '',
              date: r['תאריך'] || ''
            });
          }
        });
        saveLocal();
        updateCounter();
      }
    };
    const s = document.createElement('script');
    s.src = `${APPS_SCRIPT_URL}?action=getForm&sheet=${encodeURIComponent(SHEET_NAME)}&callback=${cb}`;
    s.onerror = () => delete window[cb];
    document.head.appendChild(s);
  } catch(e) {}
}

// ===================== LOCAL STORAGE =====================
function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (d && d.submissions) submissions = d.submissions;
  } catch(e) {}
}
function saveLocal() {
  localStorage.setItem(LS_KEY, JSON.stringify({ submissions, updated: new Date().toISOString() }));
}

// ===================== UI =====================
function updateCounter() {
  const el = document.getElementById('counterText');
  const count = submissions.length;
  el.textContent = count === 0 ? 'היו הראשונים למלא!' : `${count} תלמידים כבר מילאו`;
}

function showSuccess(entry) {
  document.getElementById('formCard').style.display = 'none';
  document.querySelector('.counter').style.display = 'none';
  const screen = document.getElementById('successScreen');
  screen.classList.add('show');

  const summary = document.getElementById('successSummary');
  let html = '';
  html += `<div class="sc-label">שם</div><div class="sc-value">${esc(entry.name)} (${esc(entry.class)})</div>`;
  if (entry.next) html += `<div class="sc-label">שנה הבאה</div><div class="sc-value">${esc(entry.next)}</div>`;
  if (entry.dream) html += `<div class="sc-label">חלום לעתיד</div><div class="sc-value">${esc(entry.dream)}</div>`;
  if (entry.message) html += `<div class="sc-label">מסר לדורות הבאים</div><div class="sc-value">${esc(entry.message)}</div>`;
  if (entry.takeaway) html += `<div class="sc-label">משהו שלקחתי מבית הספר</div><div class="sc-value">${esc(entry.takeaway)}</div>`;
  summary.innerHTML = html;

  launchConfetti();
}

function resetForm() {
  document.getElementById('formCard').style.display = '';
  document.querySelector('.counter').style.display = '';
  document.getElementById('successScreen').classList.remove('show');
  document.getElementById('fieldName').value = '';
  document.getElementById('fieldNext').value = '';
  document.getElementById('fieldDream').value = '';
  document.getElementById('fieldMessage').value = '';
  document.getElementById('fieldTakeaway').value = '';
  document.querySelectorAll('.class-chip').forEach(c => c.classList.remove('active'));
  selectedClass = '';
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.classList.remove('show'), 3000);
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ===================== CONFETTI =====================
function launchConfetti() {
  const colors = ['#8E7ED4','#E8B060','#3AACA0','#E8909C','#5B9BD5','#7AB648'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 2 + 's';
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.width = (6 + Math.random() * 8) + 'px';
    c.style.height = (6 + Math.random() * 8) + 'px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}
</script>
