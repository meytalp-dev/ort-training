<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>פנקס טיולים — אורט בית הערבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playpen+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --dream:#8E7ED4;--dream-light:#D4CEF0;--dream-dark:#5B4BA0;
  --create:#E8B060;--create-light:#F5DEB0;--create-dark:#D48A2C;
  --lead:#3AACA0;--lead-light:#B8E4DE;--lead-dark:#1B7A6E;
  --spark:#E8909C;--spark-dark:#D45C6E;
  --bg:#fff;--card:#fff;
  --text:#2C2622;--text-light:#6E6258;--muted:#8C7E72;
  --border:#EDE6D8;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 8px rgba(44,38,34,.05);
  --shadow-md:0 6px 20px rgba(44,38,34,.08);
  --shadow-lg:0 12px 40px rgba(44,38,34,.1);
}
body{font-family:Heebo,sans-serif;background:#FAFBFC;color:var(--text);min-height:100vh;line-height:1.6}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 600px 400px at 20% 20%,rgba(232,176,96,.06) 0%,transparent 70%),
    radial-gradient(ellipse 500px 400px at 80% 70%,rgba(58,172,160,.05) 0%,transparent 70%),
    radial-gradient(ellipse 400px 350px at 50% 90%,rgba(142,126,212,.04) 0%,transparent 70%);
  pointer-events:none;z-index:0}
h1,h2,h3,h4{font-family:'Playpen Sans Hebrew','Heebo',sans-serif}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes stamp{0%{transform:scale(0) rotate(-15deg);opacity:0}60%{transform:scale(1.15) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}

/* ===== HEADER ===== */
.header{text-align:center;padding:48px 24px 24px;position:relative;z-index:1}
.header-icon{
  width:88px;height:88px;border-radius:50%;
  background:linear-gradient(135deg,var(--create),var(--lead));
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;box-shadow:0 8px 32px rgba(232,176,96,.25);
  animation:slideUp .6s ease;
}
.header-icon svg{width:44px;height:44px;fill:#fff}
.header h1{font-size:1.5rem;font-weight:800;font-family:Heebo;margin-bottom:6px;animation:slideUp .6s ease .1s both}
.header .subtitle{color:var(--muted);font-size:.92rem;animation:slideUp .6s ease .2s both;max-width:420px;margin:0 auto}
.header .school{
  display:inline-block;margin-top:12px;padding:6px 18px;
  background:var(--create-light);color:var(--create-dark);
  border-radius:20px;font-size:.82rem;font-weight:600;
  animation:slideUp .6s ease .3s both;
}

/* ===== MAIN CONTAINER ===== */
.container{max-width:680px;margin:0 auto 80px;padding:0 20px;position:relative;z-index:1}

/* ===== STUDENT SELECT ===== */
.student-card{
  background:var(--card);border-radius:var(--radius-lg);
  border:1px solid var(--border);box-shadow:var(--shadow-lg);
  padding:32px;margin-bottom:20px;animation:slideUp .5s ease .2s both;
}
.student-card h2{font-size:1rem;font-weight:700;margin-bottom:16px;font-family:Heebo;
  display:flex;align-items:center;gap:8px}
.student-card h2 svg{width:22px;height:22px;fill:var(--create)}

.student-name-input{
  width:100%;padding:16px 20px;border:2px dashed var(--border);
  border-radius:16px;font-family:'Playpen Sans Hebrew',Heebo;
  font-size:1.3rem;font-weight:700;text-align:center;
  color:var(--text);background:#FAFBFC;direction:rtl;
  transition:all .3s ease;
}
.student-name-input:focus{
  outline:none;border-style:solid;border-color:var(--create);
  box-shadow:0 0 0 3px rgba(232,176,96,.15);background:#fff;
}
.student-name-input::placeholder{color:#C8BFB4;font-weight:400;font-size:1rem}

/* ===== PASSPORT PAGE ===== */
.passport{
  background:var(--card);border-radius:var(--radius-lg);
  border:1px solid var(--border);box-shadow:var(--shadow-lg);
  overflow:hidden;animation:slideUp .5s ease .3s both;
}
.passport-header{
  background:linear-gradient(135deg,var(--create-light) 0%,rgba(232,176,96,.08) 100%);
  padding:20px 28px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.passport-header .student-display{
  font-family:'Playpen Sans Hebrew';font-size:1.15rem;font-weight:700;color:var(--create-dark);
}
.passport-header .stamp-count{
  font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:4px;
}
.passport-header .stamp-count svg{width:16px;height:16px;fill:var(--muted)}

.sync-badge{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;
  border-radius:20px;font-size:.78rem;font-weight:600;
  margin-right:8px;transition:all .3s ease;
}
.sync-badge.synced{background:#E8F5E9;color:#2E7D32}
.sync-badge.pending{background:#FFF3E0;color:#E65100}
.sync-badge.error{background:#FCE7EA;color:#C62828}
.sync-badge svg{width:12px;height:12px;fill:currentColor}
.stamp.unsynced{border-color:#FFB74D;background:#FFFBF5}
.stamp.unsynced::after{
  content:'מסונכרן בקרוב';position:absolute;bottom:8px;left:12px;
  font-size:.7rem;color:#E65100;font-weight:600;
}

.stamps-grid{padding:24px;display:flex;flex-direction:column;gap:16px;min-height:200px}

/* ===== STAMP (each teacher note) ===== */
.stamp{
  background:#FAFBFC;border-radius:16px;border:1px solid var(--border);
  padding:20px;position:relative;animation:stamp .4s ease both;
  transition:all .25s ease;
}
.stamp:hover{box-shadow:var(--shadow-md);border-color:var(--create-light)}
.stamp-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stamp-avatar{
  width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.95rem;color:#fff;flex-shrink:0;
}
.stamp-teacher{font-weight:600;font-size:.92rem;color:var(--text)}
.stamp-date{font-size:.75rem;color:var(--muted);margin-right:auto}
.stamp-text{font-size:.92rem;color:var(--text-light);line-height:1.7;white-space:pre-wrap}
.stamp-delete{
  position:absolute;top:12px;left:12px;width:28px;height:28px;
  border:none;background:transparent;cursor:pointer;opacity:0;
  border-radius:8px;transition:all .2s ease;display:flex;
  align-items:center;justify-content:center;
}
.stamp:hover .stamp-delete{opacity:.5}
.stamp-delete:hover{opacity:1;background:var(--spark);color:#fff}
.stamp-delete svg{width:14px;height:14px;fill:currentColor}

.empty-state{
  text-align:center;padding:40px 20px;color:var(--muted);
  font-size:.9rem;line-height:1.7;
}
.empty-state svg{width:48px;height:48px;fill:var(--border);margin-bottom:12px;display:block;margin:0 auto 12px}

/* ===== ADD NOTE ===== */
.add-note{
  background:var(--card);border-radius:var(--radius-lg);
  border:1px solid var(--border);box-shadow:var(--shadow-lg);
  padding:28px;margin-top:20px;animation:slideUp .5s ease .4s both;
}
.add-note h3{font-size:.95rem;font-weight:700;margin-bottom:16px;font-family:Heebo;
  display:flex;align-items:center;gap:8px}
.add-note h3 svg{width:20px;height:20px;fill:var(--lead)}

.note-form{display:flex;flex-direction:column;gap:14px}
.note-row{display:flex;gap:12px;align-items:center}
.note-input{
  flex:1;padding:12px 16px;border:1.5px solid var(--border);
  border-radius:14px;font-family:Heebo;font-size:.9rem;
  direction:rtl;color:var(--text);background:#FAFBFC;
  transition:all .25s ease;
}
.note-input:focus{outline:none;border-color:var(--lead);box-shadow:0 0 0 3px rgba(58,172,160,.1);background:#fff}
.note-input::placeholder{color:#B8AFA4;font-weight:300}
textarea.note-input{min-height:80px;resize:none;line-height:1.6}

.add-btn{
  padding:14px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--lead),var(--lead-dark));
  color:#fff;font-family:Heebo;font-size:.95rem;font-weight:700;
  cursor:pointer;transition:all .3s ease;
  box-shadow:0 4px 16px rgba(58,172,160,.25);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.add-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(58,172,160,.35)}
.add-btn:active{transform:translateY(0)}
.add-btn svg{width:18px;height:18px;fill:#fff}

/* ===== SAVE/PRINT BAR ===== */
.action-bar{
  display:flex;gap:12px;margin-top:20px;animation:slideUp .5s ease .5s both;
}
.action-btn{
  flex:1;padding:14px;border-radius:14px;font-family:Heebo;
  font-size:.9rem;font-weight:600;cursor:pointer;
  transition:all .25s ease;display:flex;align-items:center;
  justify-content:center;gap:8px;
}
.action-btn svg{width:18px;height:18px}
.btn-save{
  background:linear-gradient(135deg,var(--dream),var(--dream-dark));
  color:#fff;border:none;box-shadow:0 4px 16px rgba(142,126,212,.25);
}
.btn-save:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(142,126,212,.35)}
.btn-save svg{fill:#fff}
.btn-print{
  background:#fff;color:var(--text);border:1.5px solid var(--border);
}
.btn-print:hover{border-color:var(--dream);color:var(--dream-dark)}
.btn-print svg{fill:currentColor}
.btn-new{
  background:#fff;color:var(--lead-dark);border:1.5px solid var(--lead-light);
}
.btn-new:hover{background:var(--lead-light)}
.btn-new svg{fill:currentColor}

/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  padding:14px 28px;border-radius:14px;font-family:Heebo;font-size:.88rem;
  font-weight:500;z-index:200;transition:transform .3s ease;box-shadow:var(--shadow-lg);
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:#E8F5E9;color:#2E7D32;border:1px solid #C8E6C9}
.toast.error{background:#FCE7EA;color:#C62828;border:1px solid #F5C6CB}

/* ===== PRINT ===== */
@media print{
  body{background:#fff}
  body::before{display:none}
  .student-card,.add-note,.action-bar,.counter,.stamp-delete,.sync-badge{display:none!important}
  .header{padding:24px 0 16px}
  .header .school{display:inline-block!important;margin-top:8px}
  .passport{box-shadow:none;border:2px solid #ddd}
  .stamp{break-inside:avoid;border:1px solid #ddd}
  .passport-header{background:#FFF8E7!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
  .header{padding:32px 16px 20px}
  .header-icon{width:72px;height:72px}
  .header-icon svg{width:36px;height:36px}
  .header h1{font-size:1.25rem}
  .student-card,.passport,.add-note{padding:22px;border-radius:20px}
  .note-row{flex-direction:column}
  .student-name-input{font-size:1.1rem;padding:14px 16px}
  .action-bar{flex-direction:column}
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="header-icon">
    <svg viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/></svg>
  </div>
  <h1>פנקס טיולים</h1>
  <div class="subtitle">כל איש צוות כותב כמה מילים חמות על התלמיד - למזכרת לכל החיים</div>
  <div class="school">אורט בית הערבה ירושלים</div>
</div>

<div class="container">

  <!-- ===== STUDENT SELECT ===== -->
  <div class="student-card">
    <h2>
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      בחירת תלמיד/ה
    </h2>
    <select class="student-name-input" id="studentSelect" onchange="selectStudent()" style="font-size:1.1rem;font-family:Heebo,sans-serif;cursor:pointer;text-align:center;text-align-last:center;appearance:auto">
      <option value="">-- בחרו תלמיד/ה --</option>
    </select>
  </div>

  <!-- ===== PASSPORT ===== -->
  <div class="passport" id="passport">
    <div class="passport-header">
      <div class="student-display" id="studentDisplay">---</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <div class="sync-badge synced" id="syncBadge" style="display:none">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          <span id="syncBadgeText">הכל בענן</span>
        </div>
        <div class="stamp-count">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
          <span id="stampCountText">0 הודעות</span>
        </div>
      </div>
    </div>
    <div class="stamps-grid" id="stampsGrid">
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
        עדיין אין הודעות.<br>אנשי צוות — כתבו משהו יפה!
      </div>
    </div>
  </div>

  <!-- ===== ADD NOTE ===== -->
  <div class="add-note">
    <h3>
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      הוספת הודעה מאיש צוות
    </h3>
    <div class="note-form">
      <div class="note-row">
        <input type="text" class="note-input" id="teacherName" placeholder="שם איש/אשת הצוות" style="flex:.6">
        <select class="note-input" id="teacherRole" style="flex:.4">
          <option value="">תפקיד (אופציונלי)</option>
          <option value="מחנך/ת">מחנך/ת</option>
          <option value="מורה">מורה</option>
          <option value="יועץ/ת">יועץ/ת</option>
          <option value="רכז/ת">רכז/ת</option>
          <option value="מנהל/ת">מנהל/ת</option>
          <option value="מדריך/ה">מדריך/ה</option>
        </select>
      </div>
      <textarea class="note-input" id="noteText" placeholder="כמה מילים חמות על התלמיד/ה...&#10;&#10;מה מיוחד בו/בה? רגע שזוכרים? ברכה לדרך?"></textarea>
      <button class="add-btn" onclick="addStamp()">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        הוספת הודעה
      </button>
    </div>
  </div>

  <!-- ===== ACTIONS ===== -->
  <div class="action-bar">
    <button class="action-btn btn-print" onclick="window.print()">
      <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
      הדפסה
    </button>
    <button class="action-btn btn-new" onclick="newStudent()">
      <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      תלמיד חדש
    </button>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz2QOG5BU0ET12IE5hUWMrhlqWDupWWeuiO2l5AoqJqRi8tfoj5mGPXMqPUcZw_pamH/exec';
const SHEET_NAME = 'פנקס טיולים';
const LS_KEY = 'ort_trip_notes';

const AVATAR_COLORS = [
  '#8E7ED4','#E8B060','#3AACA0','#E8909C','#5B9BD5',
  '#7AB648','#C06090','#D48A2C','#5B4BA0','#1B7A6E'
];

let stamps = [];
let currentStudent = '';
let allStudents = [];
let pendingSync = new Set(); // stamp IDs that haven't been confirmed in cloud yet

// ===================== INIT =====================
const STUDENT_VIEW_PARAM = new URLSearchParams(location.search).get('student');
const isStudentView = !!STUDENT_VIEW_PARAM;

document.addEventListener('DOMContentLoaded', () => {
  loadLocal();
  loadStudents();
  loadFromSheet();
  // Retry sync for any pending stamps every 30 seconds
  setInterval(retrySyncPending, 30000);

  if (isStudentView) applyStudentViewMode();
});

function applyStudentViewMode() {
  // Hide teacher controls — show only the passport for this one student
  document.querySelector('.student-card').style.display = 'none';
  document.querySelector('.add-note').style.display = 'none';
  document.querySelector('.btn-new').style.display = 'none';
  // Hide all delete buttons (CSS rule covers future-rendered stamps too)
  const style = document.createElement('style');
  style.textContent = '.stamp-delete{display:none!important}.sync-badge{display:none!important}';
  document.head.appendChild(style);

  currentStudent = STUDENT_VIEW_PARAM;
  document.getElementById('studentDisplay').textContent = currentStudent;
  renderStamps();
}

// ===================== LOAD STUDENTS =====================
function loadStudents() {
  const script = document.createElement('script');
  script.src = '../management/student-data.js';
  script.onload = () => {
    // Render immediately from cache (if available)
    refreshStudentSelect();
    // Then re-render after fresh API data arrives
    if (typeof STUDENTS_READY !== 'undefined' && STUDENTS_READY && typeof STUDENTS_READY.then === 'function') {
      STUDENTS_READY.then(refreshStudentSelect).catch(() => {});
    }
  };
  script.onerror = () => {
    console.warn('student-data.js not loaded, manual input fallback');
  };
  document.head.appendChild(script);
}

function refreshStudentSelect() {
  if (typeof STUDENTS === 'undefined' || !Array.isArray(STUDENTS)) return;
  allStudents = STUDENTS.filter(s => s.status === 'active');
  if (allStudents.length) populateStudentSelect();
}

function populateStudentSelect() {
  const select = document.getElementById('studentSelect');
  // Clear previous optgroups so we don't duplicate when called twice (cache + fresh API)
  Array.from(select.querySelectorAll('optgroup')).forEach(g => g.remove());
  // Group by class
  const classes = {};
  allStudents.forEach(s => {
    if (!classes[s.cls]) classes[s.cls] = [];
    classes[s.cls].push(s);
  });
  // Sort classes: יב first, then יא, י, ט
  const classOrder = ['יב1','יב2','יב3','יא1','יא2','י1','י2','ט1','ט2'];
  const sortedClasses = Object.keys(classes).sort((a,b) => {
    const ai = classOrder.indexOf(a), bi = classOrder.indexOf(b);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });

  sortedClasses.forEach(cls => {
    const group = document.createElement('optgroup');
    group.label = 'כיתה ' + cls;
    classes[cls].sort((a,b) => a.first.localeCompare(b.first,'he')).forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.first + ' ' + s.last;
      opt.textContent = s.first + ' ' + s.last;
      group.appendChild(opt);
    });
    select.appendChild(group);
  });
}

// ===================== DISPLAY =====================
function selectStudent() {
  const name = document.getElementById('studentSelect').value;
  currentStudent = name;
  document.getElementById('studentDisplay').textContent = name || '---';
  renderStamps();
}

function renderStamps() {
  const grid = document.getElementById('stampsGrid');
  const empty = document.getElementById('emptyState');
  const studentStamps = stamps.filter(s => s.student === currentStudent);

  document.getElementById('stampCountText').textContent = studentStamps.length + ' הודעות';
  updateSyncBadge();

  if (!studentStamps.length) {
    empty.style.display = '';
    grid.innerHTML = '';
    grid.appendChild(empty);
    return;
  }

  empty.style.display = 'none';
  grid.innerHTML = studentStamps.map((s, i) => {
    const initials = s.teacher.split(' ').map(w => w[0]).join('').substring(0, 2);
    const color = AVATAR_COLORS[Math.abs(hashStr(s.teacher)) % AVATAR_COLORS.length];
    const role = s.role ? ` (${esc(s.role)})` : '';
    const date = s.date ? new Date(s.date).toLocaleDateString('he-IL') : '';
    const unsynced = pendingSync.has(s.id) ? ' unsynced' : '';
    return `
      <div class="stamp${unsynced}" style="animation-delay:${i * .08}s">
        <div class="stamp-top">
          <div class="stamp-avatar" style="background:${color}">${initials}</div>
          <div>
            <div class="stamp-teacher">${esc(s.teacher)}${role}</div>
          </div>
          <div class="stamp-date">${date}</div>
        </div>
        <div class="stamp-text">${esc(s.text)}</div>
        <button class="stamp-delete" onclick="deleteStamp('${s.id}')" title="מחיקה">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>`;
  }).join('');
}

function updateSyncBadge() {
  const badge = document.getElementById('syncBadge');
  const text = document.getElementById('syncBadgeText');
  if (!currentStudent) { badge.style.display = 'none'; return; }
  const studentStamps = stamps.filter(s => s.student === currentStudent);
  if (!studentStamps.length) { badge.style.display = 'none'; return; }
  const unsyncedCount = studentStamps.filter(s => pendingSync.has(s.id)).length;
  badge.style.display = 'inline-flex';
  if (unsyncedCount === 0) {
    badge.className = 'sync-badge synced';
    badge.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg><span>הכל בענן</span>';
  } else {
    badge.className = 'sync-badge pending';
    badge.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8c-.45-.83-.7-1.79-.7-2.8 0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg><span>מסנכרן ' + unsyncedCount + '...</span>';
  }
}

// ===================== ADD/DELETE =====================
function addStamp() {
  const teacher = document.getElementById('teacherName').value.trim();
  const role = document.getElementById('teacherRole').value;
  const text = document.getElementById('noteText').value.trim();

  if (!currentStudent) { showToast('קודם כתבו את שם התלמיד/ה', 'error'); return; }
  if (!teacher) { showToast('נא למלא שם איש צוות', 'error'); return; }
  if (!text) { showToast('נא לכתוב הודעה', 'error'); return; }

  const newStamp = {
    id: 'TN' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
    student: currentStudent,
    teacher, role, text,
    date: new Date().toISOString()
  };

  stamps.push(newStamp);
  pendingSync.add(newStamp.id);
  saveLocal();
  renderStamps();
  showToast('ההודעה נוספה ונשמרת בענן...', 'success');

  // Auto-save to cloud immediately
  saveStampToSheet(newStamp);

  // Clear inputs
  document.getElementById('teacherName').value = '';
  document.getElementById('teacherRole').value = '';
  document.getElementById('noteText').value = '';
}

function deleteStamp(id) {
  const ok = confirm('המחיקה היא רק במכשיר הזה. ההודעה תישאר שמורה בענן ותחזור ברענון הבא.\n\nלמחיקה מלאה — להסיר את השורה ישירות מגיליון "פנקס טיולים".\n\nלהמשיך?');
  if (!ok) return;
  stamps = stamps.filter(s => s.id !== id);
  pendingSync.delete(id);
  saveLocal();
  renderStamps();
}

function newStudent() {
  document.getElementById('studentSelect').value = '';
  document.getElementById('teacherName').value = '';
  document.getElementById('teacherRole').value = '';
  document.getElementById('noteText').value = '';
  currentStudent = '';
  document.getElementById('studentDisplay').textContent = '---';
  renderStamps();
  document.getElementById('studentSelect').focus();
}

// ===================== SAVE TO SHEET (auto, per stamp) =====================
// no-cors blinds us to actual success. We verify by reading the sheet back
// and confirming the ID appeared. pendingSync is cleared only after verification.
function saveStampToSheet(s) {
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    mode: 'no-cors',
    body: JSON.stringify({
      action: 'saveForm',
      sheet: SHEET_NAME,
      fields: {
        'מזהה': s.id,
        'שם תלמיד': s.student,
        'שם איש צוות': s.teacher,
        'תפקיד': s.role || '',
        'הודעה': s.text
      }
    })
  }).then(() => {
    // Network call completed but no-cors hides whether the server actually saved.
    // Verify by re-reading the sheet after 3 seconds.
    setTimeout(loadFromSheet, 3000);
    updateSyncBadge();
  }).catch(() => {
    // network failed — leave in pendingSync for retry
    updateSyncBadge();
  });
}

function retrySyncPending() {
  if (!pendingSync.size) return;
  // Re-read sheet first to confirm what's already in the cloud, then re-post
  // ONLY what is still missing. Without this guard, every 30s would create a
  // duplicate row for any stamp whose original POST was actually successful.
  loadFromSheet().then(() => {
    stamps.forEach(s => {
      if (pendingSync.has(s.id)) saveStampToSheet(s);
    });
  });
}

// ===================== LOAD FROM SHEET =====================
// Uses fetch + manual JSONP unwrap. The script-tag JSONP approach silently
// failed in modern Chrome (onerror fires even though the response is valid),
// causing pendingSync to never clear and the 30s retry to create duplicates.
function loadFromSheet() {
  const url = APPS_SCRIPT_URL + '?action=getForm&sheet=' + encodeURIComponent(SHEET_NAME) + '&callback=cb';
  return fetch(url)
    .then(r => r.text())
    .then(text => {
      const m = text.match(/^cb\((.*)\);?\s*$/s);
      if (!m) throw new Error('invalid JSONP wrapper');
      const d = JSON.parse(m[1]);
      if (!d || !d.rows) return;
      const localIds = new Set(stamps.map(s => s.id));
      const cloudIds = new Set();
      let added = 0;
      d.rows.forEach(r => {
        if (!r['מזהה']) return;
        cloudIds.add(r['מזהה']);
        if (!localIds.has(r['מזהה'])) {
          stamps.push({
            id: r['מזהה'],
            student: r['שם תלמיד'] || '',
            teacher: r['שם איש צוות'] || '',
            role: r['תפקיד'] || '',
            text: r['הודעה'] || '',
            date: r['תאריך'] ? new Date(r['תאריך']).toISOString() : ''
          });
          added++;
        }
      });
      // Any pending stamp that now appears in the cloud is verified-saved
      let confirmed = 0;
      Array.from(pendingSync).forEach(id => {
        if (cloudIds.has(id)) { pendingSync.delete(id); confirmed++; }
      });
      if (added || confirmed) {
        saveLocal();
        renderStamps();
      } else {
        updateSyncBadge();
      }
    })
    .catch(e => console.warn('[trip-notes] loadFromSheet failed:', e.message));
}

// ===================== LOCAL STORAGE =====================
function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (d && d.stamps) stamps = d.stamps;
    if (d && d.pending) pendingSync = new Set(d.pending);
  } catch(e) {}
}
function saveLocal() {
  localStorage.setItem(LS_KEY, JSON.stringify({
    stamps,
    pending: Array.from(pendingSync),
    updated: new Date().toISOString()
  }));
}

// ===================== HELPERS =====================
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i); return h; }
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.classList.remove('show'), 3000);
}
