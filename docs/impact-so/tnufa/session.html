<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הסשן של היום · ImpactOS Tnufa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'heebo': ['Heebo', 'sans-serif'],
            'inter': ['Inter', 'sans-serif'],
          },
          colors: {
            'lead': { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81' },
            'dream': { 50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f9a8d4', 400: '#f472b6', 500: '#ec4899', 600: '#db2777' },
            'create': { 50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488' },
          },
        }
      }
    }
  </script>

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .activity-enter {
      animation: slide-up 0.4s ease forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    @keyframes slide-up {
      to { opacity: 1; transform: translateY(0); }
    }
    .english-text {
      font-family: 'Inter', sans-serif;
      direction: ltr;
      text-align: start;
    }
    .pulse-ring {
      animation: pulse-ring 1.6s ease-out infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(99,102,241,0.5); }
      100% { box-shadow: 0 0 0 24px rgba(99,102,241,0); }
    }
  </style>
</head>
<body class="font-heebo bg-gray-50 text-gray-900 antialiased min-h-screen">

  <!-- Top progress header -->
  <header class="bg-white border-b border-gray-100 sticky top-0 z-40">
    <div class="container mx-auto px-4 py-3 max-w-3xl">
      <div class="flex items-center justify-between gap-3 mb-2">
        <button onclick="confirmExit()" class="text-gray-500 hover:text-red-600 transition flex items-center gap-1 text-sm" title="יציאה מהסשן">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          יציאה
        </button>
        <div class="text-sm text-gray-600">
          <span id="step-current">1</span> / <span id="step-total">5</span>
        </div>
        <div class="text-sm font-semibold text-lead-700" id="timer">00:00</div>
      </div>
      <!-- Progress bar -->
      <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-lead-500 to-dream-500 transition-all duration-500" style="width: 0%"></div>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="container mx-auto px-4 py-6 max-w-3xl">

    <!-- Loading -->
    <div id="loading" class="text-center py-20">
      <div class="spinner mx-auto mb-4"></div>
      <p class="text-gray-500 text-sm">מכין את הסשן...</p>
    </div>

    <!-- Activity slot -->
    <div id="activity-slot" class="hidden"></div>

    <!-- Session summary (final screen) -->
    <div id="summary" class="hidden">
      <div class="bg-gradient-to-br from-lead-600 via-dream-500 to-create-500 rounded-3xl p-8 text-white text-center shadow-xl mb-4">
        <svg class="w-16 h-16 mx-auto mb-4 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        <h1 class="text-3xl font-bold mb-2">סיימת את הסשן!</h1>
        <p class="opacity-90" id="summary-tagline">עבודה יפה היום</p>
      </div>

      <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="bg-white rounded-2xl border border-gray-100 p-4 text-center">
          <div class="text-2xl font-bold text-lead-600" id="sum-activities">0</div>
          <div class="text-xs text-gray-500 mt-1">פעילויות</div>
        </div>
        <div class="bg-white rounded-2xl border border-gray-100 p-4 text-center">
          <div class="text-2xl font-bold text-dream-600" id="sum-correct">0</div>
          <div class="text-xs text-gray-500 mt-1">תשובות נכונות</div>
        </div>
        <div class="bg-white rounded-2xl border border-gray-100 p-4 text-center">
          <div class="text-2xl font-bold text-create-600" id="sum-time">0</div>
          <div class="text-xs text-gray-500 mt-1">דקות</div>
        </div>
      </div>

      <div class="bg-white rounded-2xl border border-gray-100 p-6 mb-4">
        <h2 class="font-bold text-lg mb-3">מה למדתי היום</h2>
        <ul id="learned-list" class="space-y-2 text-sm text-gray-700"></ul>
      </div>

      <a href="student.html" class="block w-full text-center bg-gradient-to-r from-lead-600 to-dream-600 hover:from-lead-700 hover:to-dream-700 text-white py-4 rounded-2xl font-semibold text-lg transition">
        חזרה לדשבורד
      </a>
    </div>

  </main>

  <!-- Exit confirmation modal -->
  <div id="exit-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full">
      <h3 class="font-bold text-lg mb-2">לצאת מהסשן?</h3>
      <p class="text-gray-600 text-sm mb-6">ההתקדמות שלך עד כה תישמר. תוכל.י לחזור לדשבורד ולהמשיך מאוחר יותר.</p>
      <div class="flex gap-3">
        <button onclick="closeExitModal()" class="flex-1 px-4 py-2 rounded-xl border border-gray-200 hover:bg-gray-50 transition">המשך הסשן</button>
        <button onclick="exitSession()" class="flex-1 px-4 py-2 rounded-xl bg-red-50 text-red-700 hover:bg-red-100 transition font-semibold">יציאה</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/data/unit-1-content.js"></script>
  <script src="assets/js/activities/vocabulary.js"></script>
  <script src="assets/js/activities/reading.js"></script>
  <script src="assets/js/activities/listening.js"></script>
  <script src="assets/js/activities/grammar.js"></script>
  <script src="assets/js/activities/writing.js"></script>
  <script src="assets/js/session.js"></script>

</body>
</html>
