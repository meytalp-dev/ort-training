<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>בקרוב · ImpactSO · תנ"ך כיתה ז'</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Heebo',sans-serif;background:#F9FAFB;color:#111827;display:grid;place-items:center;height:100vh}
    .card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:32px 40px;max-width:480px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.04)}
    .badge{display:inline-block;font-size:11px;font-weight:700;background:rgba(236,72,153,.12);color:#EC4899;padding:6px 12px;border-radius:999px;letter-spacing:.5px;margin-bottom:14px}
    h1{font-size:22px;font-weight:800;margin-bottom:8px;letter-spacing:-.5px}
    p{font-size:14px;color:#6B7280;line-height:1.6;margin-bottom:20px}
    a{display:inline-block;background:#EC4899;color:#fff;text-decoration:none;padding:9px 22px;border-radius:8px;font-weight:700;font-size:13px}
    a:hover{background:#DB2777}
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">בקרוב</span>
    <h1>מערך השיעור המלא בבנייה</h1>
    <p>חבילות שיעור מלאות לתנ"ך כיתה ז' (פתיחה · מערך · סרטון · משחקים · שאלון) — בפיתוח. כרגע זמינה התוכנית השנתית.</p>
    <a href="javascript:history.back()">חזרה לתוכנית השנתית</a>
  </div>
</body>
</html>
