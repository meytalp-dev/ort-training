<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>תרגול בגרות לשון 011281 · מצב תרגול</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{font-family:'Assistant','Heebo',sans-serif;color:#1f2937;background:#f8fafc;line-height:1.55;min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:24px}
  header{background:linear-gradient(135deg,#0891b2 0%,#06b6d4 100%);color:#fff;padding:28px 24px;border-radius:18px;margin-bottom:20px}
  header h1{font-size:28px;font-weight:800;margin-bottom:4px}
  header .sub{font-size:14px;opacity:.95}
  header .back{display:inline-block;margin-top:10px;color:#fff;text-decoration:underline;font-size:13px}

  .filters-card{background:#fff;padding:20px;border-radius:16px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .filters-card h2{font-size:16px;font-weight:700;margin-bottom:14px;color:#0f172a}
  .filter-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .filter-group label{display:block;font-size:12px;color:#64748b;margin-bottom:4px;font-weight:600}
  .filter-group select{width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:8px;font-family:inherit;font-size:14px;background:#fff}
  .filter-group select:focus{outline:none;border-color:#06b6d4}

  .quick-pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .quick-chip{background:#f0f9ff;border:1px solid #bae6fd;color:#0369a1;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
  .quick-chip:hover{background:#e0f2fe}
  .quick-chip.active{background:#0891b2;color:#fff;border-color:#0891b2}

  .question-card{background:#fff;padding:24px;border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.06);margin-bottom:20px}
  .question-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
  .badge{display:inline-block;padding:3px 10px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap}
  .badge-year{background:#dbeafe;color:#1e40af}
  .badge-moed-winter{background:#e0f2fe;color:#0369a1}
  .badge-moed-summer{background:#fef3c7;color:#92400e}
  .badge-moed-summerB{background:#fef9c3;color:#854d0e}
  .badge-topic{background:#ecfdf5;color:#047857;font-weight:700}
  .badge-track-shared{background:#d1fae5;color:#065f46}
  .badge-track-tzurot{background:#ede9fe;color:#5b21b6}
  .badge-track-tahbir{background:#dbeafe;color:#1e40af}
  .badge-gizra{background:#fef3c7;color:#92400e}

  .question-text{font-size:17px;line-height:1.85;white-space:pre-wrap;color:#1e293b;background:#f8fafc;padding:18px;border-radius:12px;margin-bottom:16px;border:1px solid #e2e8f0;font-family:inherit}
  .question-num{font-size:32px;font-weight:800;color:#06b6d4;margin-bottom:8px}

  .answer-section{background:#ecfdf5;border:2px solid #d1fae5;padding:18px;border-radius:12px;margin-bottom:16px;display:none}
  .answer-section.show{display:block}
  .answer-section .label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#065f46;margin-bottom:8px}
  .answer-text{white-space:pre-wrap;font-size:15px;line-height:1.8;color:#1f2937}
  .no-answer{background:#fef2f2;border-color:#fecaca;color:#991b1b;padding:14px;border-radius:10px;font-size:14px}

  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{padding:11px 22px;border:0;border-radius:10px;cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;transition:transform .1s}
  .btn:hover{transform:translateY(-1px)}
  .btn-primary{background:#06b6d4;color:#fff}
  .btn-primary:hover{background:#0891b2}
  .btn-reveal{background:#059669;color:#fff}
  .btn-reveal:hover{background:#047857}
  .btn-skip{background:#f1f5f9;color:#475569}
  .btn-skip:hover{background:#e2e8f0}

  .stats-bar{background:#fff;padding:14px 18px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
  .stats-bar .info{font-size:13px;color:#64748b}
  .stats-bar .info strong{color:#0f172a;font-size:18px;margin:0 4px}
  .pool-empty{background:#fef3c7;color:#92400e;padding:18px;border-radius:12px;text-align:center;font-weight:600}

  .empty-state{text-align:center;padding:50px 20px;background:#fff;border-radius:18px;color:#94a3b8}
  .empty-state .icon{font-size:50px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>תרגול בגרות לשון</h1>
  <div class="sub">שאלון 011281 · בנק 341 שאלות מ-2016-2026</div>
  <a href="bagrut-questions-table.html" class="back">← חזרה לטבלת כל השאלות</a>
</header>

<div class="filters-card">
  <h2>בחר נושא לתרגול</h2>
  <div class="quick-pick" id="quickPick"></div>
  <div class="filter-row" style="margin-top:14px">
    <div class="filter-group">
      <label>נושא</label>
      <select id="topicFilter"><option value="">הכל</option></select>
    </div>
    <div class="filter-group">
      <label>תת-נושא</label>
      <select id="subtopicFilter"><option value="">הכל</option></select>
    </div>
    <div class="filter-group">
      <label>גזרה (לפועל בלבד)</label>
      <select id="gizraFilter"><option value="">הכל</option></select>
    </div>
    <div class="filter-group">
      <label>מסלול</label>
      <select id="trackFilter">
        <option value="">הכל</option>
        <option value="shared">משותף</option>
        <option value="tzurot">צורות</option>
        <option value="tahbir">תחביר</option>
      </select>
    </div>
    <div class="filter-group">
      <label>שנים</label>
      <select id="yearFilter">
        <option value="">הכל</option>
        <option value="2022-2026">חדשות בלבד (פוסט-רפורמה)</option>
        <option value="2016-2021">ישנות בלבד (פרה-רפורמה)</option>
      </select>
    </div>
    <div class="filter-group">
      <label>עם פתרון</label>
      <select id="answerFilter">
        <option value="">הכל</option>
        <option value="yes">רק שאלות עם פתרון</option>
      </select>
    </div>
  </div>
</div>

<div class="stats-bar" id="statsBar"></div>

<div id="questionContainer">
  <div class="empty-state">
    <div class="icon">📚</div>
    <div>בחר נושא ולחץ "התחל תרגול"</div>
  </div>
</div>

</div>

<script>
const TOPIC_LABELS = {
  havana:'הבנת הנקרא', takinut_mispar:'שם המספר', takinut_otiyot:'אותיות השימוש',
  takinut_hagiya:'הגייה ומילות יחס',
  poel_shlemim:'פועל — שלמים', poel_chasrei_pn:'פועל — חסרי פ"נ',
  poel_chasrei_py:'פועל — חסרי פ"י', poel_nachei_li:'פועל — נחי ל"י',
  poel_chalulim:'פועל — נחי ע"ו/ע"י', poel_kfulim:'פועל — כפולים',
  poel_meruba:'פועל — מרובעים', poel_zmanim:'פועל — זמנים וצורות',
  tatzura_shoresh_mishkal:'תצורת השם — שורש+משקל',
  tatzura_basis_tzoran:'תצורת השם — בסיס+צורן',
  tatzura_helchaim:'תצורת השם — הלחמים',
  tahbir_mishpat_pashut:'תחביר — משפט פשוט', tahbir_psukit:'תחביר — פסוקיות',
  tahbir_advanced:'תחביר — תמורה/הסגר/חלקים', tahbir_sugei_mishpat:'תחביר — סוגי משפט',
  tahbir_hamarot:'תחביר — המרות/פיסוק', unknown:'לא מסווג',
};
const SUBTOPIC_LABELS = {
  mispar_zachar_nekeva:'זכר/נקבה', mispar_gdolim:'מספרים גדולים',
  mispar_8_9_10:'שמונה/תשעה/עשרה', mispar_ktiva_milim:'כתיבה במילים',
  shoresh_binyan:'שורש ובניין',
  zmanim_pail_savil:'פעיל/סביל', zmanim_shem_poel:'שם פועל',
  "shem_pe'ula_shalem":'שם פעולה',
  ts_mishkal_zihui:'זיהוי משקל', bt_tzoran_sofi:'צורן סופי',
  hl_zihui:'זיהוי הלחם',
  ps_zihui_tafkid:'תפקיד פסוקית', ps_teur:'פסוקית תיאור',
  adv_tmura:'תמורה', adv_hesger:'הסגר', adv_chalakim_kollim:'חלקים כוללים',
  sm_meurav:'משפט מורכב', sm_meuche:'משפט מאוחה', sm_dumeshma:'דו־משמעות',
  hm_pisuk:'פיסוק',
  hagiya_milat_yachas:'מילות יחס', hagiya_dagesh:'דגש',
};
// Quick-pick top topics
const QUICK_PICKS = [
  {label:'שם המספר', topic:'takinut_mispar'},
  {label:'הגייה ומילות יחס', topic:'takinut_hagiya'},
  {label:'פועל — שורש+בניין', topic:'poel_shlemim'},
  {label:'שם פעולה', topic:'poel_zmanim', subtopic:"shem_pe'ula_shalem"},
  {label:'תצורת השם — משקל', topic:'tatzura_shoresh_mishkal'},
  {label:'תצורת השם — צורן', topic:'tatzura_basis_tzoran'},
  {label:'תמורה', topic:'tahbir_advanced', subtopic:'adv_tmura'},
  {label:'הסגר', topic:'tahbir_advanced', subtopic:'adv_hesger'},
  {label:'חלקים כוללים', topic:'tahbir_advanced', subtopic:'adv_chalakim_kollim'},
  {label:'פסוקיות', topic:'tahbir_psukit'},
  {label:'סוגי משפט', topic:'tahbir_sugei_mishpat'},
];

let DATA = {questions:[]};
let POOL = [];
let SEEN = new Set();
let CURRENT = null;

async function loadData() {
  const res = await fetch('bagrut-questions.json');
  DATA = await res.json();
  init();
}

function init() {
  // Quick picks
  const qp = document.getElementById('quickPick');
  QUICK_PICKS.forEach(p => {
    const chip = document.createElement('button');
    chip.className = 'quick-chip';
    chip.textContent = p.label;
    chip.onclick = () => {
      document.querySelectorAll('.quick-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      document.getElementById('topicFilter').value = p.topic;
      updateSubtopicAndGizra();
      if (p.subtopic) document.getElementById('subtopicFilter').value = p.subtopic;
      applyFilters();
      next();
    };
    qp.appendChild(chip);
  });

  // Topic dropdown
  const topicSel = document.getElementById('topicFilter');
  const counts = {};
  DATA.questions.forEach(q => counts[q.topic] = (counts[q.topic] || 0) + 1);
  Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = `${TOPIC_LABELS[t] || t} (${counts[t]})`;
    topicSel.appendChild(opt);
  });

  ['topicFilter','subtopicFilter','gizraFilter','trackFilter','yearFilter','answerFilter']
    .forEach(id => document.getElementById(id).addEventListener('change', applyFilters));
  document.getElementById('topicFilter').addEventListener('change', updateSubtopicAndGizra);

  applyFilters();
}

function updateSubtopicAndGizra() {
  const topic = document.getElementById('topicFilter').value;
  const subSel = document.getElementById('subtopicFilter');
  const gzSel = document.getElementById('gizraFilter');
  subSel.innerHTML = '<option value="">הכל</option>';
  gzSel.innerHTML = '<option value="">הכל</option>';

  const filtered = DATA.questions.filter(q => !topic || q.topic === topic);
  const subs = {};
  const gzs = {};
  filtered.forEach(q => {
    subs[q.subtopic] = (subs[q.subtopic] || 0) + 1;
    (q.gizras_detected || []).forEach(g => gzs[g] = (gzs[g] || 0) + 1);
  });
  Object.entries(subs).sort((a,b)=>b[1]-a[1]).forEach(([s,c]) => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = `${SUBTOPIC_LABELS[s] || s} (${c})`;
    subSel.appendChild(opt);
  });
  Object.entries(gzs).sort((a,b)=>b[1]-a[1]).forEach(([g,c]) => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = `${g} (${c})`;
    gzSel.appendChild(opt);
  });
}

function applyFilters() {
  const topic = document.getElementById('topicFilter').value;
  const sub = document.getElementById('subtopicFilter').value;
  const gz = document.getElementById('gizraFilter').value;
  const track = document.getElementById('trackFilter').value;
  const year = document.getElementById('yearFilter').value;
  const answerOnly = document.getElementById('answerFilter').value === 'yes';

  POOL = DATA.questions.filter(q => {
    if (topic && q.topic !== topic) return false;
    if (sub && q.subtopic !== sub) return false;
    if (gz && !(q.gizras_detected || []).includes(gz)) return false;
    if (track && q.track !== track) return false;
    if (year === '2022-2026' && q.year_gregorian < 2022) return false;
    if (year === '2016-2021' && q.year_gregorian >= 2022) return false;
    if (answerOnly && !q.has_answer) return false;
    return true;
  });

  SEEN = new Set();
  updateStats();
}

function updateStats() {
  const bar = document.getElementById('statsBar');
  bar.innerHTML = `
    <div class="info"><strong>${POOL.length}</strong>שאלות זמינות לתרגול · <strong>${SEEN.size}</strong>נראו</div>
    <button class="btn btn-primary" onclick="next()">${SEEN.size === 0 ? 'התחל תרגול' : 'שאלה הבאה'}</button>
  `;
}

function next() {
  if (!POOL.length) {
    document.getElementById('questionContainer').innerHTML =
      '<div class="pool-empty">אין שאלות העונות על הסינון. נסה לשחרר את המסננים.</div>';
    return;
  }
  // Random pick from POOL minus SEEN
  let unseen = POOL.filter(q => !SEEN.has(q.id));
  if (!unseen.length) {
    // Reset
    SEEN = new Set();
    unseen = POOL;
  }
  CURRENT = unseen[Math.floor(Math.random() * unseen.length)];
  SEEN.add(CURRENT.id);
  render();
}

function render() {
  const q = CURRENT;
  const moedMap = {winter:'חורף', summer:'קיץ', summerB:'קיץ מ"ב', 'summer-special':'קיץ מיוחד'};
  const trackMap = {shared:'משותף', tzurot:'צורות', tahbir:'תחביר'};
  const gizras = (q.gizras_detected || []).map(g => `<span class="badge badge-gizra">${g}</span>`).join(' ');

  document.getElementById('questionContainer').innerHTML = `
    <div class="question-card">
      <div class="question-num">שאלה ${q.question_num}</div>
      <div class="question-meta">
        <span class="badge badge-year">${q.year_hebrew}</span>
        <span class="badge badge-moed-${q.moed}">${moedMap[q.moed]||q.moed}</span>
        <span class="badge badge-topic">${TOPIC_LABELS[q.topic]||q.topic}${q.subtopic && SUBTOPIC_LABELS[q.subtopic] ? ' · ' + SUBTOPIC_LABELS[q.subtopic] : ''}</span>
        <span class="badge badge-track-${q.track||'shared'}">${trackMap[q.track]||q.track}</span>
        ${gizras}
      </div>
      <div class="question-text">${escapeHTML(q.question_text || q.preview || '')}</div>
      <div class="actions">
        <button class="btn btn-reveal" onclick="reveal()">${q.has_answer ? 'הראה פתרון' : 'אין פתרון זמין'}</button>
        <button class="btn btn-skip" onclick="next()">דלג / שאלה הבאה</button>
      </div>
      <div class="answer-section" id="answerSection">
        ${q.has_answer ? `
          <div class="label">✓ פתרון מוצע (מהפתרון הרשמי)</div>
          <div class="answer-text">${escapeHTML(q.answer_text)}</div>
        ` : `<div class="no-answer">אין פתרון זמין לבגרות זו במאגר</div>`}
      </div>
    </div>
  `;
  updateStats();
}

function reveal() {
  document.getElementById('answerSection').classList.add('show');
}

function escapeHTML(s) {
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

loadData();
</script>
</body>
</html>
