<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>בנק שאלות בגרות לשון 011281 · 2016-2026</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{font-family:'Assistant','Heebo',sans-serif;color:#1f2937;background:#f8fafc;line-height:1.55}
  .wrap{max-width:1400px;margin:0 auto;padding:24px}
  header{background:linear-gradient(135deg,#0891b2 0%,#06b6d4 100%);color:#fff;padding:32px 24px;border-radius:20px;margin-bottom:24px;box-shadow:0 10px 30px rgba(6,182,212,.15)}
  header h1{font-size:32px;font-weight:700;margin-bottom:6px}
  header .sub{font-size:16px;opacity:.95}
  header .stats{display:flex;gap:32px;margin-top:18px;flex-wrap:wrap}
  header .stat{font-size:14px}
  header .stat strong{font-size:22px;display:block;font-weight:700}
  .filters{background:#fff;padding:18px;border-radius:16px;margin-bottom:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .filter-group label{display:block;font-size:12px;color:#64748b;margin-bottom:4px;font-weight:600}
  .filter-group select,.filter-group input{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;font-family:inherit;font-size:14px;background:#fff}
  .filter-group select:focus,.filter-group input:focus{outline:none;border-color:#06b6d4}
  .meta-row{display:flex;justify-content:space-between;align-items:center;padding:0 4px 12px}
  .meta-row .count{font-size:14px;color:#64748b}
  .meta-row .actions{display:flex;gap:8px}
  .btn{background:#06b6d4;color:#fff;padding:7px 14px;border:0;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit}
  .btn:hover{background:#0891b2}
  .btn-ghost{background:#fff;color:#475569;border:1px solid #e2e8f0}
  .btn-ghost:hover{background:#f1f5f9}
  table{width:100%;background:#fff;border-collapse:separate;border-spacing:0;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05)}
  thead th{background:#f1f5f9;color:#334155;font-weight:700;font-size:13px;text-align:right;padding:12px 14px;border-bottom:2px solid #e2e8f0;position:sticky;top:0;z-index:1}
  tbody td{padding:12px 14px;border-bottom:1px solid #f1f5f9;font-size:14px;vertical-align:top}
  tbody tr:hover{background:#fafbfc;cursor:pointer}
  tbody tr.expanded{background:#f0f9ff}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
  .badge-year{background:#dbeafe;color:#1e40af}
  .badge-moed-winter{background:#e0f2fe;color:#0369a1}
  .badge-moed-summer{background:#fef3c7;color:#92400e}
  .badge-moed-summerB{background:#fef9c3;color:#854d0e}
  .badge-shared{background:#d1fae5;color:#065f46}
  .badge-tzurot{background:#ede9fe;color:#5b21b6}
  .badge-tahbir{background:#dbeafe;color:#1e40af}
  .badge-unknown{background:#f3f4f6;color:#6b7280}
  .topic-cell{font-weight:600;color:#0f172a}
  .subtopic-cell{font-size:12px;color:#64748b}
  .preview-cell{color:#475569;font-size:13px;max-width:380px}
  .expand-row{background:#f0f9ff}
  .expand-row td{padding:16px 20px;border-bottom:1px solid #e0f2fe}
  .full-text{background:#fff;padding:16px;border-radius:10px;font-size:14px;line-height:1.7;white-space:pre-wrap;color:#1f2937;border:1px solid #e0f2fe}
  .full-text .meta{font-size:12px;color:#64748b;margin-bottom:10px}
  .full-text .meta-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .pre-reform-mark{display:inline-block;background:#fed7aa;color:#9a3412;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:700;margin-right:6px}
  .empty{padding:40px;text-align:center;color:#94a3b8;background:#fff;border-radius:14px}
  .topic-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:24px}
  .topic-card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.04);cursor:pointer;transition:all .15s;border:2px solid transparent}
  .topic-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08);border-color:#06b6d4}
  .topic-card.active{border-color:#06b6d4;background:#f0f9ff}
  .topic-card h3{font-size:16px;font-weight:700;margin-bottom:6px;color:#0f172a}
  .topic-card .topic-count{font-size:13px;color:#0891b2;font-weight:600}
  .topic-card .topic-sub{font-size:12px;color:#94a3b8;margin-top:4px}
  .gizra-section{background:#fffbeb;padding:18px;border-radius:14px;margin-bottom:20px;border:1px solid #fde68a}
  .gizra-section h2{font-size:18px;font-weight:700;margin-bottom:10px;color:#92400e}
  .gizra-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .gizra-chip{background:#fff;padding:10px 12px;border-radius:10px;font-size:13px;cursor:pointer;border:1px solid #fde68a;text-align:center}
  .gizra-chip:hover{background:#fef3c7}
  .gizra-chip strong{display:block;font-size:18px;color:#92400e}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>בנק שאלות בגרות לשון</h1>
  <div class="sub">שאלון 011281 · עברית: הבנה, הבעה ולשון · 2016–2026 (תשע"ו–תשפ"ו)</div>
  <div class="stats" id="stats"></div>
</header>

<div class="topic-groups" id="topicGroups"></div>

<div class="filters">
  <div class="filter-group">
    <label>חיפוש בטקסט</label>
    <input type="search" id="search" placeholder="חיפוש מילה...">
  </div>
  <div class="filter-group">
    <label>נושא</label>
    <select id="topicFilter"><option value="">הכל</option></select>
  </div>
  <div class="filter-group">
    <label>תת-נושא</label>
    <select id="subtopicFilter"><option value="">הכל</option></select>
  </div>
  <div class="filter-group">
    <label>שנה</label>
    <select id="yearFilter"><option value="">הכל</option></select>
  </div>
  <div class="filter-group">
    <label>מועד</label>
    <select id="moedFilter"><option value="">הכל</option></select>
  </div>
  <div class="filter-group">
    <label>מסלול</label>
    <select id="trackFilter">
      <option value="">הכל</option>
      <option value="shared">משותף</option>
      <option value="tzurot">מערכת הצורות</option>
      <option value="tahbir">תחביר</option>
    </select>
  </div>
</div>

<div class="meta-row">
  <div class="count" id="resultCount"></div>
  <div class="actions">
    <button class="btn btn-ghost" onclick="resetFilters()">נקה סינון</button>
    <button class="btn" onclick="downloadJSON()">הורד JSON</button>
  </div>
</div>

<table id="questionsTable">
  <thead>
    <tr>
      <th style="width:80px">שנה</th>
      <th style="width:90px">מועד</th>
      <th style="width:60px">#</th>
      <th>נושא</th>
      <th>תת-נושא</th>
      <th>תצוגה מקדימה</th>
      <th style="width:80px">מסלול</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div class="empty" id="empty" style="display:none">לא נמצאו שאלות שעונות על המסננים</div>

</div>

<script>
const TOPIC_LABELS = {
  havana: 'הבנת הנקרא',
  takinut_mispar: 'תקינות — שם המספר',
  takinut_otiyot: 'תקינות — אותיות השימוש',
  takinut_hagiya: 'תקינות — הגייה ומילות יחס',
  poel_shlemim: 'פועל — שלמים',
  poel_chasrei_pn: 'פועל — חסרי פ"נ',
  poel_chasrei_py: 'פועל — חסרי פ"י',
  poel_nachei_li: 'פועל — נחי ל"י (ל"ה)',
  poel_chalulim: 'פועל — נחי ע"ו/ע"י',
  poel_kfulim: 'פועל — כפולים',
  poel_meruba: 'פועל — מרובעים',
  poel_zmanim: 'פועל — זמנים וצורות',
  tatzura_shoresh_mishkal: 'תצורת השם — שורש+משקל',
  tatzura_basis_tzoran: 'תצורת השם — בסיס+צורן',
  tatzura_helchaim: 'תצורת השם — הלחמים',
  tahbir_mishpat_pashut: 'תחביר — משפט פשוט',
  tahbir_psukit: 'תחביר — פסוקיות',
  tahbir_advanced: 'תחביר — תמורה/הסגר/חלקים כוללים',
  tahbir_sugei_mishpat: 'תחביר — סוגי משפט',
  tahbir_hamarot: 'תחביר — המרות ופיסוק',
  unknown: 'לא מסווג',
};
const SUBTOPIC_LABELS = {
  mispar_zachar_nekeva: 'זכר/נקבה',
  mispar_gdolim: 'מספרים גדולים',
  mispar_8_9_10: 'שמונה/תשעה/עשרה',
  mispar_ktiva_milim: 'כתיבה במילים',
  mispar_sodi: 'מספר סודר',
  otiyot_nikud: 'ניקוד וכל"ב',
  otiyot_shimush: 'שימוש',
  neti_shlemim: 'נטיית שלמים',
  shoresh_binyan: 'שורש ובניין',
  chpn_neti: 'נטייה חסרי פ"נ',
  chpy_neti: 'נטייה חסרי פ"י',
  nli_neti: 'נטייה נחי ל"י',
  chal_neti: 'נטייה נחי ע"ו/ע"י',
  kf_neti: 'נטיית כפולים',
  mr_neti: 'נטיית מרובעים',
  zmanim_atid: 'זמן עתיד',
  zmanim_avar: 'זמן עבר',
  zmanim_tziuy: 'ציווי',
  zmanim_shem_poel: 'שם פועל',
  zmanim_pail_savil: 'פעיל/סביל',
  zmanim_yotze_omed: 'יוצא/עומד',
  "shem_pe'ula_shalem": 'שם פעולה',
  ts_mishkal_zihui: 'זיהוי משקל',
  ts_mishkal_baalei_miktzoa: 'משקל בעלי מקצוע',
  ts_yetzira_mishorech: 'יצירה מאותו השורש',
  bt_tzoran_sofi: 'צורן סופי',
  hl_zihui: 'זיהוי הלחם',
  mp_nitu_klali: 'ניתוח כללי',
  mp_nasu_shmani_poel: 'נשוא שמני/פועלי',
  ps_zihui_tafkid: 'תפקיד פסוקית',
  ps_levai_zikat: 'פסוקית זיקה/לוואי',
  ps_teur: 'פסוקית תיאור',
  ps_tnai_kayam_batel: 'תנאי קיים/בטל',
  ps_nose: 'פסוקית נושא',
  ps_musa: 'פסוקית מושא',
  adv_tmura: 'תמורה',
  adv_hesger: 'הסגר',
  adv_chalakim_kollim: 'חלקים כוללים',
  adv_dibur_yashir: 'דיבור ישיר/עקיף',
  sm_pashut: 'משפט פשוט',
  sm_meurav: 'משפט מורכב',
  sm_meuche: 'משפט מאוחה',
  sm_dumeshma: 'דו־משמעות',
  hm_pail_savil: 'המרת פעיל↔סביל',
  hm_meurav_meuche: 'המרת מורכב↔מאוחה',
  hm_kishur_logi: 'קשרים לוגיים',
  hm_pisuk: 'פיסוק',
  hagiya_dagesh: 'דגש',
  hagiya_tnuot: 'תנועות',
  hagiya_milat_yachas: 'מילות יחס',
  hagiya_otiyot: 'ב.כ.ת',
  unknown: 'לא מסווג',
};

let DATA = {questions:[]};
let FILTERED = [];

async function loadData() {
  const res = await fetch('bagrut-questions.json');
  DATA = await res.json();
  init();
}

function init() {
  // Stats
  const stats = document.getElementById('stats');
  const years = DATA.meta.years_covered;
  const exams = new Set(DATA.questions.map(q => q.exam_id)).size;
  const topics = new Set(DATA.questions.map(q => q.topic)).size;
  stats.innerHTML = `
    <div class="stat"><strong>${DATA.meta.total_questions}</strong>שאלות מתויגות</div>
    <div class="stat"><strong>${DATA.meta.with_answers||0}</strong>עם פתרון מצורף</div>
    <div class="stat"><strong>${exams}</strong>מועדי בגרות</div>
    <div class="stat"><strong>${years[0]}–${years[years.length-1]}</strong>טווח שנים</div>
    <div class="stat"><strong>${topics}</strong>נושאים</div>
    <div class="stat"><a href="bagrut-practice.html" style="color:#fff;text-decoration:underline;font-size:14px">מצב תרגול ←</a></div>
  `;

  // Topic dropdown
  const topicSel = document.getElementById('topicFilter');
  const topicCounts = {};
  DATA.questions.forEach(q => topicCounts[q.topic] = (topicCounts[q.topic] || 0) + 1);
  Object.keys(topicCounts).sort((a,b)=>topicCounts[b]-topicCounts[a]).forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = `${TOPIC_LABELS[t] || t} (${topicCounts[t]})`;
    topicSel.appendChild(opt);
  });

  // Year dropdown
  const yearSel = document.getElementById('yearFilter');
  years.forEach(y => {
    const opt = document.createElement('option');
    opt.value = y;
    const heb = DATA.questions.find(q => q.year_gregorian===y).year_hebrew;
    opt.textContent = `${heb} (${y})`;
    yearSel.appendChild(opt);
  });

  // Moed dropdown
  const moedSel = document.getElementById('moedFilter');
  ['winter','summer','summerB','summer-special'].forEach(m => {
    const cnt = DATA.questions.filter(q=>q.moed===m).length;
    if (!cnt) return;
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = `${{winter:'חורף',summer:'קיץ',summerB:'קיץ מועד ב','summer-special':'קיץ מועד מיוחד'}[m]} (${cnt})`;
    moedSel.appendChild(opt);
  });

  // Topic cards
  const topicGroups = document.getElementById('topicGroups');
  Object.entries(topicCounts).sort((a,b)=>b[1]-a[1]).slice(0,8).forEach(([t, cnt]) => {
    const card = document.createElement('div');
    card.className = 'topic-card';
    card.innerHTML = `
      <h3>${TOPIC_LABELS[t] || t}</h3>
      <div class="topic-count">${cnt} שאלות</div>
    `;
    card.onclick = () => {
      document.getElementById('topicFilter').value = t;
      applyFilters();
      document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
    };
    topicGroups.appendChild(card);
  });

  // Listen for filter changes
  ['search','topicFilter','subtopicFilter','yearFilter','moedFilter','trackFilter']
    .forEach(id => document.getElementById(id).addEventListener('input', applyFilters));
  document.getElementById('topicFilter').addEventListener('change', updateSubtopicFilter);

  applyFilters();
}

function updateSubtopicFilter() {
  const topic = document.getElementById('topicFilter').value;
  const sel = document.getElementById('subtopicFilter');
  sel.innerHTML = '<option value="">הכל</option>';
  if (!topic) return;
  const subs = {};
  DATA.questions.filter(q => q.topic === topic).forEach(q => {
    subs[q.subtopic] = (subs[q.subtopic] || 0) + 1;
  });
  Object.entries(subs).sort((a,b)=>b[1]-a[1]).forEach(([s, c]) => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = `${SUBTOPIC_LABELS[s] || s} (${c})`;
    sel.appendChild(opt);
  });
}

function applyFilters() {
  const s = document.getElementById('search').value.trim().toLowerCase();
  const topic = document.getElementById('topicFilter').value;
  const subtopic = document.getElementById('subtopicFilter').value;
  const year = document.getElementById('yearFilter').value;
  const moed = document.getElementById('moedFilter').value;
  const track = document.getElementById('trackFilter').value;

  FILTERED = DATA.questions.filter(q => {
    if (topic && q.topic !== topic) return false;
    if (subtopic && q.subtopic !== subtopic) return false;
    if (year && q.year_gregorian !== +year) return false;
    if (moed && q.moed !== moed) return false;
    if (track && q.track !== track) return false;
    if (s && !((q.question_text||q.preview||'').toLowerCase().includes(s))) return false;
    return true;
  });

  render();
}

function render() {
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  const count = document.getElementById('resultCount');
  count.textContent = `${FILTERED.length} שאלות נמצאו`;

  if (!FILTERED.length) {
    tbody.innerHTML = '';
    document.getElementById('questionsTable').style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  document.getElementById('questionsTable').style.display = '';
  empty.style.display = 'none';

  const moedMap = {winter:'חורף',summer:'קיץ',summerB:'קיץ מ"ב','summer-special':'קיץ מיוחד'};
  const trackMap = {shared:'משותף', tzurot:'צורות', tahbir:'תחביר', unknown:'?'};

  tbody.innerHTML = FILTERED.map((q,i) => {
    const preview = (q.question_text||q.preview||'').slice(0, 380);
    return `
    <tr onclick="toggleExpand(${i})">
      <td><span class="badge badge-year">${q.year_hebrew}</span></td>
      <td><span class="badge badge-moed-${q.moed}">${moedMap[q.moed]||q.moed}</span></td>
      <td><strong>${q.question_num}</strong></td>
      <td class="topic-cell">${q.pre_reform?'<span class="pre-reform-mark">פרה-רפ</span>':''}${TOPIC_LABELS[q.topic]||q.topic}</td>
      <td class="subtopic-cell">${SUBTOPIC_LABELS[q.subtopic]||q.subtopic}${q.gizra?' · '+q.gizra:''}${q.has_answer?' <span style="color:#059669">✓</span>':''}</td>
      <td class="preview-cell">${escapeHTML(preview)}${(q.question_text||'').length > 380 ? '...' : ''}</td>
      <td><span class="badge badge-${q.track||'unknown'}">${trackMap[q.track]||q.track}</span></td>
    </tr>`;
  }).join('');
}

function toggleExpand(i) {
  const q = FILTERED[i];
  const tbody = document.getElementById('tbody');
  const rows = tbody.children;
  for (let r = rows.length - 1; r >= 0; r--) {
    if (rows[r].classList.contains('expand-row')) rows[r].remove();
  }
  const newRow = document.createElement('tr');
  newRow.className = 'expand-row';
  const tags = (q.all_topics||[]).map(t => `<span class="badge badge-${q.track||'unknown'}">${TOPIC_LABELS[t.topic]||t.topic} / ${SUBTOPIC_LABELS[t.subtopic]||t.subtopic}</span>`).join(' ');
  const gizras = (q.gizras_detected||[]).map(g => `<span class="badge" style="background:#fef3c7;color:#92400e">${g}</span>`).join(' ');
  const answerSection = q.answer_text ? `
    <div style="margin-top:14px;background:#ecfdf5;border:1px solid #d1fae5;padding:14px;border-radius:10px">
      <div style="font-size:12px;font-weight:700;color:#065f46;margin-bottom:6px">✓ פתרון מוצע (מהאתר הרשמי)</div>
      <div style="white-space:pre-wrap;font-size:14px;line-height:1.7;color:#1f2937">${escapeHTML(q.answer_text)}</div>
    </div>` : `
    <div style="margin-top:14px;background:#fef2f2;border:1px solid #fecaca;padding:10px 14px;border-radius:10px;font-size:12px;color:#991b1b">אין פתרון זמין למועד זה</div>`;
  newRow.innerHTML = `<td colspan="7"><div class="full-text">
    <div class="meta">
      מזהה: <code>${q.id}</code> · קובץ: <code>${q.source_file}</code>
      ${gizras ? '· גזרות שזוהו: '+gizras : ''}
    </div>
    <div style="background:#f8fafc;padding:14px;border-radius:10px;border:1px solid #e2e8f0;white-space:pre-wrap;line-height:1.8">${escapeHTML(q.question_text||q.preview||'')}</div>
    ${answerSection}
    <div class="meta-tags" style="margin-top:12px">${tags}</div>
  </div></td>`;
  rows[i].after(newRow);
}

function resetFilters() {
  ['search','topicFilter','subtopicFilter','yearFilter','moedFilter','trackFilter'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('active'));
  updateSubtopicFilter();
  applyFilters();
}

function downloadJSON() {
  const blob = new Blob([JSON.stringify({meta:DATA.meta,questions:FILTERED},null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bagrut-questions-filtered.json';
  a.click();
}

function escapeHTML(s) {
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

loadData();
</script>
</body>
</html>
