<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מערכי השיעור שלך · לשון 70%</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .output-shell { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }

    .output-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .output-header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .chapter-summary {
      background: linear-gradient(135deg, var(--lavender-soft), var(--cyan-soft));
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .chapter-summary h3 { font-family: var(--font-display); margin-bottom: 0.75rem; }
    .concept-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .concept-pill {
      background: rgba(255,255,255,0.7);
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--ink);
    }

    /* Lesson tabs */
    .lesson-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      padding: 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    .tab-btn {
      flex: 1;
      min-width: 140px;
      padding: 0.85rem 1rem;
      border-radius: var(--radius);
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 600;
      color: var(--ink-soft);
      text-align: right;
      transition: all 0.15s;
    }
    .tab-btn:hover { background: var(--surface-2); color: var(--ink); }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--lavender), #c4b5fd);
      color: white;
      box-shadow: var(--shadow);
    }
    .tab-btn-id {
      display: block;
      font-size: 0.7rem;
      font-weight: 500;
      opacity: 0.7;
      margin-bottom: 0.15rem;
    }
    .tab-btn-title {
      display: block;
      font-size: 0.95rem;
      line-height: 1.3;
    }

    /* Lesson card */
    .lesson-container { display: none; }
    .lesson-container.active { display: block; animation: fadeUp 0.4s ease both; }

    .lesson-head {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    .lesson-meta-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .lesson-head h2 { font-size: 1.8rem; line-height: 1.25; }
    .lesson-head .subtitle { font-size: 1.05rem; }

    .objectives-list {
      list-style: none;
      margin-top: 1rem;
      padding: 1rem;
      background: var(--mint-soft);
      border-radius: var(--radius);
    }
    .objectives-list li {
      padding: 0.4rem 0;
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .objectives-list li::before {
      content: '✓';
      flex: 0 0 20px;
      width: 20px; height: 20px;
      background: var(--mint);
      color: white;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .vocab-item {
      padding: 0.85rem 1rem;
      background: var(--lavender-soft);
      border-radius: var(--radius);
      border-right: 3px solid var(--lavender);
    }
    .vocab-term { font-family: var(--font-display); font-weight: 700; color: var(--ink); }
    .vocab-def { font-size: 0.88rem; color: var(--ink-soft); margin-top: 0.25rem; }

    /* Phase blocks */
    .phase-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1rem;
      position: relative;
      transition: all 0.15s;
    }
    .phase-block:hover { box-shadow: var(--shadow); }
    .phase-block[data-phase="opening"] { border-right: 4px solid var(--cyan); }
    .phase-block[data-phase="instruction"] { border-right: 4px solid var(--lavender); }
    .phase-block[data-phase="guided_practice"] { border-right: 4px solid var(--amber); }
    .phase-block[data-phase="practice"] { border-right: 4px solid var(--mint); }
    .phase-block[data-phase="ai_integration"] { border-right: 4px solid var(--pink); }
    .phase-block[data-phase="closure"] { border-right: 4px solid var(--orange); }

    .phase-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .phase-title-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .phase-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: grid; place-items: center;
      flex: 0 0 36px;
    }
    .phase-icon-opening { background: var(--cyan-soft); color: #0891b2; }
    .phase-icon-instruction { background: var(--lavender-soft); color: #7c3aed; }
    .phase-icon-guided { background: var(--amber-soft); color: #d97706; }
    .phase-icon-practice { background: var(--mint-soft); color: #059669; }
    .phase-icon-ai { background: var(--pink-soft); color: #db2777; }
    .phase-icon-closure { background: var(--orange-soft); color: #ea580c; }

    .phase-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
    }
    .phase-duration {
      font-size: 0.85rem;
      color: var(--ink-muted);
      background: var(--surface-2);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .phase-content {
      color: var(--ink-soft);
      line-height: 1.7;
    }
    .phase-content strong { color: var(--ink); }

    .real-life-quote {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      background: var(--cyan-soft);
      border-radius: var(--radius);
      font-size: 0.92rem;
      color: #0e7490;
      font-style: italic;
    }

    /* Examples */
    .examples-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .example-card {
      background: var(--surface-2);
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .example-word { font-family: var(--font-display); font-weight: 700; color: var(--ink); }
    .example-detail { font-size: 0.82rem; color: var(--ink-soft); margin-top: 0.25rem; line-height: 1.4; }

    /* Q&A list */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 1rem;
    }
    .qa-item {
      background: var(--surface-2);
      padding: 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .qa-q {
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 0.4rem;
    }
    .qa-a {
      color: var(--ink-soft);
      font-size: 0.92rem;
      padding: 0.5rem 0.75rem;
      background: var(--mint-soft);
      border-radius: var(--radius-sm);
      margin-top: 0.4rem;
    }
    .qa-hint {
      font-size: 0.82rem;
      color: var(--amber);
      margin-top: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .qa-hint::before { content: '💡'; }

    /* Tracks */
    .tracks-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1rem;
    }
    @media (max-width: 800px) { .tracks-container { grid-template-columns: 1fr; } }
    .track-card {
      padding: 1.25rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .track-card-green { border-color: var(--mint); background: linear-gradient(180deg, var(--mint-soft) 0%, white 50%); }
    .track-card-blue { border-color: var(--blue); background: linear-gradient(180deg, var(--blue-soft) 0%, white 50%); }
    .track-card-purple { border-color: var(--lavender); background: linear-gradient(180deg, var(--lavender-soft) 0%, white 50%); }
    .track-head {
      font-family: var(--font-display);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .track-desc {
      font-size: 0.85rem;
      color: var(--ink-soft);
      margin-bottom: 0.75rem;
    }
    .track-questions {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .track-question {
      padding: 0.5rem 0.75rem;
      background: rgba(255,255,255,0.7);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
    }
    .track-question-q { font-weight: 600; }
    .track-question-a {
      font-size: 0.82rem;
      color: var(--ink-soft);
      margin-top: 0.25rem;
      padding-top: 0.25rem;
      border-top: 1px dashed var(--border);
    }

    /* AI Dialogue */
    .ai-dialogue {
      background: linear-gradient(135deg, var(--pink-soft), white);
      border-radius: var(--radius);
      padding: 1rem;
      margin-top: 1rem;
    }
    .ai-bubble {
      padding: 0.65rem 0.9rem;
      border-radius: var(--radius);
      margin-bottom: 0.5rem;
      max-width: 85%;
      line-height: 1.5;
      font-size: 0.92rem;
    }
    .ai-bubble-student {
      background: white;
      border: 1px solid var(--border);
      margin-right: auto;
    }
    .ai-bubble-ai {
      background: var(--lavender);
      color: white;
      margin-left: auto;
    }
    .ai-bubble-label {
      font-size: 0.7rem;
      font-weight: 600;
      opacity: 0.7;
      margin-bottom: 0.15rem;
    }

    /* Closure */
    .summary-list {
      list-style: none;
      margin-top: 1rem;
      padding: 1rem;
      background: var(--orange-soft);
      border-radius: var(--radius);
    }
    .summary-list li {
      padding: 0.35rem 0;
      display: flex;
      gap: 0.5rem;
    }
    .summary-list li::before {
      content: '★';
      color: var(--orange);
      font-weight: 700;
    }
    .exit-question-card {
      margin-top: 1rem;
      padding: 1rem;
      background: var(--cyan-soft);
      border-radius: var(--radius);
      border-right: 4px solid var(--cyan);
    }
    .exit-question-label {
      font-weight: 700;
      font-size: 0.85rem;
      color: #0e7490;
      margin-bottom: 0.4rem;
    }

    /* Homework + Assessment */
    .ha-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 700px) { .ha-grid { grid-template-columns: 1fr; } }

    .rubric-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.75rem;
      font-size: 0.9rem;
    }
    .rubric-table th, .rubric-table td {
      padding: 0.6rem 0.75rem;
      text-align: right;
      border-bottom: 1px solid var(--border);
    }
    .rubric-table th {
      background: var(--surface-2);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
    }
    .rubric-weight {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      background: var(--mint-soft);
      color: #059669;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    /* Edit mode */
    .edit-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 60, 0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .edit-overlay.active { display: flex; }
    .edit-modal {
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 2rem;
      max-width: 720px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }
    .edit-modal h3 { margin-bottom: 1rem; }
    .edit-textarea {
      width: 100%;
      min-height: 200px;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 0.95rem;
      line-height: 1.6;
      direction: rtl;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--ink-muted);
    }
    .empty-state h2 { color: var(--ink); margin-bottom: 0.5rem; }

    .edit-btn {
      padding: 0.4rem 0.8rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink-soft);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .edit-btn:hover { background: var(--lavender-soft); color: var(--lavender); border-color: var(--lavender); }
  </style>
</head>
<body>

<nav class="topnav">
  <a href="index.html" class="topnav-brand">
    <div class="topnav-brand-mark">ל</div>
    <div>
      <div class="topnav-brand-text">לשון 70%</div>
      <div class="topnav-brand-sub">Impact SO · מערכי שיעור</div>
    </div>
  </a>
  <div class="topnav-links">
    <a href="index.html" class="topnav-link">+ מערך חדש</a>
    <button class="btn btn-secondary btn-sm" id="export-btn">ייצוא DOCX</button>
    <button class="btn btn-primary btn-sm" id="print-btn">הדפסה</button>
  </div>
</nav>

<div class="output-shell" id="output-root">
  <div class="empty-state" id="empty-state" style="display:none;">
    <h2>לא נמצאו מערכי שיעור</h2>
    <p>נראה שהגעת לכאן בלי ליצור מערכי שיעור קודם.</p>
    <a href="index.html" class="btn btn-primary mt-2">צרי מערך חדש</a>
  </div>

  <div id="content-root"></div>
</div>

<div class="edit-overlay" id="edit-overlay">
  <div class="edit-modal">
    <h3>עריכת מקטע</h3>
    <p class="text-soft mb-2" id="edit-context"></p>
    <textarea class="edit-textarea" id="edit-textarea"></textarea>
    <div class="flex gap-1 mt-2 justify-between">
      <button class="btn btn-ghost" id="edit-cancel">ביטול</button>
      <button class="btn btn-primary" id="edit-save">שמרי שינוי</button>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  let lessonData = null;
  let activeLessonIndex = 0;

  // Load data
  if (!id) {
    $('empty-state').style.display = 'block';
  } else {
    const raw = localStorage.getItem('impact-so-lashon-output-' + id);
    if (!raw) {
      $('empty-state').style.display = 'block';
    } else {
      lessonData = JSON.parse(raw);
      render();
    }
  }

  function escapeHtml(text) {
    if (typeof text !== 'string') return '';
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderInline(text) {
    if (typeof text !== 'string') return '';
    return text.replace(/\n/g, '<br>');
  }

  function render() {
    const html = `
      <div class="output-header">
        <div>
          <span class="pill pill-lavender">תוצר מוכן</span>
          <h1 class="mt-1">${escapeHtml(lessonData.lessons[0]?.title?.split('—')[0] || 'מערכי שיעור')}</h1>
          <p class="subtitle">${lessonData.lessons.length} מערכי שיעור · ${lessonData.meta?.level || 'יא'} · ${lessonData.meta?.topic || 'לשון 70%'}</p>
        </div>
      </div>

      ${renderChapterSummary()}
      ${renderTabs()}
      ${renderLessons()}
    `;
    $('content-root').innerHTML = html;

    // Attach tab handlers
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
      btn.addEventListener('click', () => switchTab(i));
    });

    // Attach edit handlers
    document.querySelectorAll('[data-edit-key]').forEach(el => {
      el.addEventListener('click', (e) => openEdit(el.dataset.editKey, el.dataset.editLabel));
    });
  }

  function renderChapterSummary() {
    const a = lessonData.chapter_analysis;
    if (!a) return '';
    return `
      <div class="chapter-summary">
        <h3>ניתוח הפרק</h3>
        <div class="flex gap-2" style="flex-wrap: wrap;">
          <span class="pill pill-lavender">רמת קושי: ${a.estimated_difficulty === 'easy' ? 'קלה' : a.estimated_difficulty === 'medium' ? 'בינונית' : 'קשה'}</span>
          <span class="pill pill-cyan">ערך בבגרות: ${escapeHtml(a.exam_value_estimate || '')}</span>
        </div>
        <p class="mt-2 text-soft" style="font-size: 0.92rem;">המערכת זיהתה את יחידות הידע הבאות בפרק:</p>
        <div class="concept-pills">
          ${a.main_concepts.map(c => `<div class="concept-pill">${escapeHtml(c)}</div>`).join('')}
        </div>
      </div>
    `;
  }

  function renderTabs() {
    return `
      <div class="lesson-tabs">
        ${lessonData.lessons.map((l, i) => `
          <button class="tab-btn ${i === 0 ? 'active' : ''}" data-tab="${i}">
            <span class="tab-btn-id">שיעור ${i + 1}</span>
            <span class="tab-btn-title">${escapeHtml(l.title)}</span>
          </button>
        `).join('')}
      </div>
    `;
  }

  function switchTab(i) {
    activeLessonIndex = i;
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
      btn.classList.toggle('active', idx === i);
    });
    document.querySelectorAll('.lesson-container').forEach((c, idx) => {
      c.classList.toggle('active', idx === i);
    });
  }

  function renderLessons() {
    return lessonData.lessons.map((lesson, idx) => `
      <div class="lesson-container ${idx === 0 ? 'active' : ''}">
        ${renderLessonHead(lesson)}
        ${renderPhases(lesson)}
        ${renderHomeworkAndAssessment(lesson)}
      </div>
    `).join('');
  }

  function renderLessonHead(lesson) {
    return `
      <div class="lesson-head">
        <div class="lesson-meta-row">
          <span class="pill pill-lavender">${lesson.id || ''}</span>
          <span class="pill pill-cyan">45 דקות</span>
          <span class="pill pill-mint">${lesson.objectives?.length || 0} מטרות</span>
        </div>
        <h2>${escapeHtml(lesson.title)}</h2>
        <p class="subtitle">${escapeHtml(lesson.subtitle || '')}</p>

        ${lesson.objectives?.length ? `
          <h4 class="mt-3 mb-1">מטרות השיעור</h4>
          <ul class="objectives-list">
            ${lesson.objectives.map(o => `<li>${escapeHtml(o)}</li>`).join('')}
          </ul>
        ` : ''}

        ${lesson.vocabulary?.length ? `
          <h4 class="mt-3 mb-1">אוצר מילים</h4>
          <div class="vocab-grid">
            ${lesson.vocabulary.map(v => `
              <div class="vocab-item">
                <div class="vocab-term">${escapeHtml(v.term)}</div>
                <div class="vocab-def">${escapeHtml(v.definition)}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }

  function renderPhases(lesson) {
    if (!lesson.structure) return '';
    return lesson.structure.map(phase => renderPhase(phase)).join('');
  }

  function phaseInfo(name) {
    const map = {
      opening: {label: 'פתיחה', icon: '◐', cls: 'opening'},
      instruction: {label: 'הקנייה קצרה', icon: '✦', cls: 'instruction'},
      guided_practice: {label: 'תרגול מודרך', icon: '⊕', cls: 'guided'},
      practice: {label: 'תרגול דיפרנציאלי', icon: '◈', cls: 'practice'},
      ai_integration: {label: 'שילוב AI', icon: '✧', cls: 'ai'},
      closure: {label: 'סיכום ויציאה', icon: '◆', cls: 'closure'}
    };
    return map[name] || {label: name, icon: '•', cls: ''};
  }

  function renderPhase(phase) {
    const info = phaseInfo(phase.phase);
    let body = '';

    if (phase.content) {
      body += `<div class="phase-content">${renderInline(phase.content)}</div>`;
    }
    if (phase.real_life_example) {
      body += `<div class="real-life-quote">דוגמה מהחיים: ${escapeHtml(phase.real_life_example)}</div>`;
    }
    if (phase.examples?.length) {
      body += `<div class="examples-grid">
        ${phase.examples.map(ex => `
          <div class="example-card">
            <div class="example-word">${escapeHtml(ex.word || ex.wrong || '')}</div>
            <div class="example-detail">${escapeHtml(ex.process || ex.note || ex.explanation || ex.right || ex.binyan || ex.check || '')}</div>
          </div>
        `).join('')}
      </div>`;
    }
    if (phase.questions?.length) {
      body += `<div class="qa-list">
        ${phase.questions.map(q => `
          <div class="qa-item">
            <div class="qa-q">${escapeHtml(q.q || q.bagrut_question || '')}</div>
            ${q.text ? `<div class="text-soft mt-1" style="font-size: 0.88rem;">${escapeHtml(q.text)}</div>` : ''}
            ${q.a ? `<div class="qa-a"><strong>תשובה:</strong> ${escapeHtml(q.a)}</div>` : ''}
            ${q.hint ? `<div class="qa-hint">רמז: ${escapeHtml(q.hint)}</div>` : ''}
            ${q.explain ? `<div class="qa-hint">${escapeHtml(q.explain)}</div>` : ''}
          </div>
        `).join('')}
      </div>`;
    }
    if (phase.tracks) {
      body += `<div class="tracks-container">
        ${['green', 'blue', 'purple'].map(t => {
          const track = phase.tracks[t];
          if (!track) return '';
          return `
            <div class="track-card track-card-${t}">
              <div class="track-head">${escapeHtml(track.label || '')}</div>
              <div class="track-desc">${escapeHtml(track.description || '')}</div>
              <div class="track-questions">
                ${(track.questions || []).slice(0, 3).map(q => `
                  <div class="track-question">
                    <div class="track-question-q">${escapeHtml(q.q || q.bagrut_question || '')}</div>
                    ${q.a ? `<div class="track-question-a">${escapeHtml(q.a)}</div>` : ''}
                    ${q.category ? `<div class="track-question-a">סיווג: ${escapeHtml(q.category)}</div>` : ''}
                  </div>
                `).join('')}
                ${track.questions?.length > 3 ? `<div class="text-muted" style="font-size: 0.78rem; margin-top: 0.4rem;">+${track.questions.length - 3} שאלות נוספות</div>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>`;
    }
    if (phase.example_dialogue?.length) {
      body += `<div class="ai-dialogue">
        ${phase.example_dialogue.map(turn => `
          <div class="ai-bubble ai-bubble-${turn.role}">
            <div class="ai-bubble-label">${turn.role === 'student' ? 'תלמיד' : 'AI Tutor'}</div>
            ${escapeHtml(turn.text)}
          </div>
        `).join('')}
      </div>`;
    }
    if (phase.summary?.length) {
      body += `<ul class="summary-list">
        ${phase.summary.map(s => `<li>${escapeHtml(s)}</li>`).join('')}
      </ul>`;
    }
    if (phase.exit_question) {
      body += `<div class="exit-question-card">
        <div class="exit-question-label">שאלת יציאה</div>
        <div>${escapeHtml(phase.exit_question)}</div>
      </div>`;
    }

    return `
      <div class="phase-block" data-phase="${phase.phase}">
        <div class="phase-head">
          <div class="phase-title-row">
            <div class="phase-icon phase-icon-${info.cls}">${info.icon}</div>
            <div class="phase-name">${info.label}</div>
          </div>
          <div class="flex gap-1">
            <span class="phase-duration">${phase.duration_min} דק'</span>
            <button class="edit-btn" data-edit-key="phase-${activeLessonIndex}-${phase.phase}" data-edit-label="${info.label}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
              ערוך
            </button>
          </div>
        </div>
        ${body}
      </div>
    `;
  }

  function renderHomeworkAndAssessment(lesson) {
    if (!lesson.homework && !lesson.assessment) return '';
    return `
      <div class="ha-grid">
        ${lesson.homework ? `
          <div class="card">
            <h4>שיעורי בית</h4>
            <p class="text-soft mt-1"><strong>חובה:</strong> ${escapeHtml(lesson.homework.required || '')}</p>
            ${lesson.homework.challenge ? `<p class="text-soft mt-1" style="font-size: 0.88rem;"><strong>אתגר:</strong> ${escapeHtml(lesson.homework.challenge)}</p>` : ''}
          </div>
        ` : ''}
        ${lesson.assessment ? `
          <div class="card">
            <h4>הערכה</h4>
            ${lesson.assessment.exit_ticket ? `<p class="text-soft mt-1"><strong>שאלת יציאה:</strong> ${escapeHtml(lesson.assessment.exit_ticket)}</p>` : ''}
            ${lesson.assessment.rubric?.length ? `
              <table class="rubric-table">
                <thead><tr><th>קריטריון</th><th>משקל</th></tr></thead>
                <tbody>
                  ${lesson.assessment.rubric.map(r => `
                    <tr>
                      <td>
                        <div style="font-weight: 600;">${escapeHtml(r.criterion)}</div>
                        <div class="text-muted" style="font-size: 0.82rem;">${escapeHtml(r.description || '')}</div>
                      </td>
                      <td><span class="rubric-weight">${r.weight}%</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : ''}
          </div>
        ` : ''}
      </div>
    `;
  }

  // ── Edit modal
  let currentEditKey = null;
  function openEdit(key, label) {
    currentEditKey = key;
    $('edit-context').textContent = `עריכת ${label} — שיעור ${activeLessonIndex + 1}`;
    $('edit-textarea').value = '(תכונה זו פעילה בגרסה המלאה — תאפשר עריכה ישירה של תוכן המקטע)';
    $('edit-overlay').classList.add('active');
  }
  $('edit-cancel')?.addEventListener('click', () => $('edit-overlay').classList.remove('active'));
  $('edit-save')?.addEventListener('click', () => {
    alert('שמירה תפעל בגרסה המלאה. כרגע זה דמו של ממשק העריכה.');
    $('edit-overlay').classList.remove('active');
  });

  // ── Print
  $('print-btn')?.addEventListener('click', () => window.print());

  // ── Export DOCX (simple HTML-to-Word)
  $('export-btn')?.addEventListener('click', () => {
    if (!lessonData) return;
    const html = $('content-root').innerHTML;
    const blob = new Blob([
      `<html xmlns:office="urn:schemas-microsoft-com:office:office" xmlns:word="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
       <head><meta charset="utf-8"><title>מערכי שיעור</title></head>
       <body dir="rtl" lang="he">${html}</body></html>`
    ], {type: 'application/msword'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `מערכי-שיעור-${lessonData.lessons[0]?.id || 'output'}.doc`;
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
