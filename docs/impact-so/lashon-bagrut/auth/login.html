<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כניסת מורה · Impact SO לשון</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 15% 10%, rgba(167, 139, 250, 0.12), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(34, 211, 238, 0.10), transparent 45%),
        var(--bg);
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      max-width: 460px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-brand-mark {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--lavender), var(--cyan));
      color: white;
      display: grid; place-items: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.5rem;
      margin: 0 auto 0.75rem;
    }
    .auth-brand-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.2rem;
    }
    .auth-brand-sub {
      color: var(--ink-muted);
      font-size: 0.85rem;
    }
    .auth-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 0.4rem;
    }
    .auth-subtitle {
      text-align: center;
      color: var(--ink-soft);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .auth-form { display: flex; flex-direction: column; gap: 1rem; }
    .auth-submit {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, var(--lavender), #c4b5fd);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }
    .auth-submit:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
    .auth-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--ink-muted);
    }
    .auth-footer a { color: var(--lavender); font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    .error-msg {
      background: var(--rose-soft);
      color: var(--rose);
      padding: 0.7rem 1rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      display: none;
    }
    .error-msg.show { display: block; }
    .demo-banner {
      background: var(--lavender-soft);
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      color: #7c3aed;
      text-align: center;
    }
    .demo-banner strong { font-weight: 700; }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-brand">
    <div class="auth-brand-mark">ל</div>
    <div class="auth-brand-name">Impact SO · לשון 70%</div>
    <div class="auth-brand-sub">מערכת AI לבגרות בלשון</div>
  </div>

  <h1 class="auth-title">ברוכה השבה</h1>
  <p class="auth-subtitle">היכנסי לחשבון שלך כדי להמשיך</p>

  <div class="demo-banner">
    🎯 <strong>פיילוט פתוח</strong> — אם זו הפעם הראשונה, <a href="register.html" style="color: #7c3aed; font-weight: 700;">הירשמי כאן</a>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <form class="auth-form" id="login-form">
    <div class="field">
      <label class="field-label">כתובת מייל</label>
      <input type="email" class="field-input" id="email" required autocomplete="email" placeholder="meytalp@example.com">
    </div>
    <div class="field">
      <label class="field-label">סיסמה</label>
      <input type="password" class="field-input" id="password" required autocomplete="current-password" minlength="6">
    </div>
    <button type="submit" class="auth-submit" id="submit-btn">היכנסי</button>
  </form>

  <div class="auth-footer">
    אין לך חשבון? <a href="register.html">הירשמי כאן</a><br>
    <a href="../index.html" style="color: var(--ink-muted); font-size: 0.82rem;">← חזרה לדף הראשי</a>
  </div>
</div>

<script src="supabase-config.js"></script>
<script>
  const $ = (id) => document.getElementById(id);

  // Redirect if already logged in
  (async () => {
    const user = await window.ImpactAuth.getCurrentUser();
    if (user) window.location.href = '../teacher/today.html';
  })();

  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('email').value.trim();
    const password = $('password').value;
    const errorEl = $('error-msg');
    const btn = $('submit-btn');

    errorEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'נכנסת...';

    try {
      const supabase = await window.ImpactAuth.getSupabase();
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      window.location.href = '../teacher/today.html';
    } catch (e) {
      errorEl.textContent = e.message === 'Invalid login credentials'
        ? 'מייל או סיסמה לא נכונים. נסי שוב.'
        : 'שגיאה: ' + e.message;
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'היכנסי';
    }
  });
</script>

</body>
</html>
