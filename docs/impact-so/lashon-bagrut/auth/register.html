<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הרשמת מורה · Impact SO לשון</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 15% 10%, rgba(167, 139, 250, 0.12), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(34, 211, 238, 0.10), transparent 45%),
        var(--bg);
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      max-width: 460px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .auth-brand-mark {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--lavender), var(--cyan));
      color: white;
      display: grid; place-items: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.5rem;
      margin: 0 auto 0.75rem;
    }
    .auth-brand-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
    }
    .auth-brand-sub {
      color: var(--ink-muted);
      font-size: 0.85rem;
    }
    .auth-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 0.4rem;
    }
    .auth-subtitle {
      text-align: center;
      color: var(--ink-soft);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .auth-form { display: flex; flex-direction: column; gap: 0.85rem; }
    .auth-submit {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, var(--lavender), #c4b5fd);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }
    .auth-submit:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
    .auth-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--ink-muted);
    }
    .auth-footer a { color: var(--lavender); font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    .error-msg {
      background: var(--rose-soft);
      color: var(--rose);
      padding: 0.7rem 1rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      display: none;
    }
    .error-msg.show { display: block; }
    .success-msg {
      background: var(--mint-soft);
      color: #059669;
      padding: 0.7rem 1rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      display: none;
      margin-bottom: 1rem;
    }
    .success-msg.show { display: block; }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    @media (max-width: 540px) { .row-2 { grid-template-columns: 1fr; } }
    .helper-text {
      font-size: 0.78rem;
      color: var(--ink-muted);
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-brand">
    <div class="auth-brand-mark">ל</div>
    <div class="auth-brand-name">Impact SO · לשון 70%</div>
    <div class="auth-brand-sub">פיילוט פיצ'ר חדש לפני שנת תשפ"ז</div>
  </div>

  <h1 class="auth-title">הרשמה למערכת</h1>
  <p class="auth-subtitle">מורות בפיילוט הראשון — חינם לחלוטין</p>

  <div class="success-msg" id="success-msg">
    ✓ הרשמה הצליחה! תועברי לדף הכניסה...
  </div>
  <div class="error-msg" id="error-msg"></div>

  <form class="auth-form" id="register-form">
    <div class="field">
      <label class="field-label">שם מלא *</label>
      <input type="text" class="field-input" id="full_name" required placeholder="מיטל פלג">
    </div>

    <div class="row-2">
      <div class="field">
        <label class="field-label">בית ספר *</label>
        <input type="text" class="field-input" id="school_name" required placeholder="אורט בית הערבה">
      </div>
      <div class="field">
        <label class="field-label">עיר</label>
        <input type="text" class="field-input" id="school_city" placeholder="ירושלים">
      </div>
    </div>

    <div class="field">
      <label class="field-label">כתובת מייל *</label>
      <input type="email" class="field-input" id="email" required autocomplete="email" placeholder="meytalp@bethaarava.ort.org.il">
    </div>

    <div class="field">
      <label class="field-label">סיסמה *</label>
      <input type="password" class="field-input" id="password" required autocomplete="new-password" minlength="8">
      <div class="helper-text">לפחות 8 תווים</div>
    </div>

    <button type="submit" class="auth-submit" id="submit-btn">צרי חשבון</button>
  </form>

  <div class="auth-footer">
    כבר יש לך חשבון? <a href="login.html">היכנסי כאן</a><br>
    <a href="../index.html" style="color: var(--ink-muted); font-size: 0.82rem;">← חזרה לדף הראשי</a>
  </div>
</div>

<script src="supabase-config.js"></script>
<script>
  const $ = (id) => document.getElementById(id);

  (async () => {
    const user = await window.ImpactAuth.getCurrentUser();
    if (user) window.location.href = '../teacher/today.html';
  })();

  $('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fullName = $('full_name').value.trim();
    const schoolName = $('school_name').value.trim();
    const schoolCity = $('school_city').value.trim();
    const email = $('email').value.trim();
    const password = $('password').value;

    const errorEl = $('error-msg');
    const successEl = $('success-msg');
    const btn = $('submit-btn');

    errorEl.classList.remove('show');
    successEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'יוצרת חשבון...';

    try {
      const supabase = await window.ImpactAuth.getSupabase();
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName,
            school_name: schoolName,
            school_city: schoolCity || null
          }
        }
      });
      if (error) throw error;

      successEl.classList.add('show');
      btn.textContent = '✓ נוצר חשבון';

      // Wait briefly for trigger to create teacher record, then redirect
      setTimeout(() => {
        if (data.session) {
          window.location.href = '../teacher/today.html';
        } else {
          window.location.href = 'login.html?registered=1';
        }
      }, 1500);
    } catch (e) {
      let msg = 'שגיאה: ' + e.message;
      if (e.message?.includes('already registered')) {
        msg = 'המייל הזה כבר רשום. נסי להיכנס במקום.';
      }
      errorEl.textContent = msg;
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'צרי חשבון';
    }
  });
</script>

</body>
</html>
