<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>שאלון דיפרנציאלי · גזרת השלמים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700&family=Rubik:wght@400;700;900&family=Playpen+Sans+Hebrew:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#7C3AED;--primary-d:#5b21b6;--primary-l:#EDE7F6;
  --green:#34d399;--green-l:#d1fae5;
  --rose:#ef4444;--rose-l:#fee2e2;
  --amber:#fbbf24;--amber-l:#fef3c7;
  --cyan:#22d3ee;--cyan-l:#cffafe;
  --bg:#fafaff;--card:#fff;--dark:#1a1a2e;--gray:#64748B;
  --shadow:0 8px 32px rgba(0,0,0,.08);
  --r:24px;
}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh}
.topnav{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;background:white;border-bottom:1px solid #e8e8f0;position:sticky;top:0;z-index:50}
.topnav-back{color:var(--gray);text-decoration:none;font-weight:600}
.topnav-title{font-family:'Playpen Sans Hebrew',sans-serif;font-weight:700}
.container{max-width:780px;margin:1.5rem auto 3rem;padding:0 1.5rem}
.intro{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:white;border-radius:var(--r);padding:2rem;text-align:center;margin-bottom:1.5rem}
.intro h1{font-family:'Playpen Sans Hebrew',sans-serif;font-size:1.6rem;font-weight:800;margin-bottom:.5rem}
.intro p{opacity:.92;line-height:1.6;font-size:1rem}
.start-btn{margin-top:1.25rem;background:white;color:var(--primary-d);border:none;padding:.85rem 2rem;border-radius:14px;font-weight:700;cursor:pointer;font-family:'Heebo',sans-serif;font-size:1.05rem}
.start-btn:hover{transform:translateY(-2px)}

.section{display:none;animation:fadeUp .35s}
.section.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem;font-size:.9rem;color:var(--gray);font-weight:600}
.progress-bar{height:8px;background:#f0f0f5;border-radius:999px;overflow:hidden;margin-bottom:1.25rem}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--cyan));transition:width .4s}
.q-card{background:white;border-radius:var(--r);padding:2rem;box-shadow:var(--shadow);margin-bottom:1rem}
.q-num{font-size:.85rem;color:var(--primary);font-weight:700;margin-bottom:.4rem}
.q-text{font-size:1.1rem;font-weight:600;line-height:1.6;margin-bottom:1.25rem}
.q-options{display:flex;flex-direction:column;gap:.6rem}
.q-opt{background:white;border:2.5px solid #e8e8f0;border-radius:14px;padding:.95rem 1.25rem;font-family:'Heebo',sans-serif;font-weight:600;font-size:1rem;cursor:pointer;text-align:right;transition:all .15s}
.q-opt:hover{border-color:var(--primary)}
.q-opt.correct{background:var(--green-l);border-color:var(--green);color:#065f46}
.q-opt.incorrect{background:var(--rose-l);border-color:var(--rose);color:#991b1b}
.q-opt:disabled{cursor:not-allowed;opacity:.85}
.q-feedback{margin-top:.85rem;padding:.85rem 1.15rem;border-radius:10px;display:none;font-size:.92rem;line-height:1.6}
.q-feedback.show{display:block}
.q-feedback.right{background:var(--green-l);color:#065f46}
.q-feedback.wrong{background:var(--rose-l);color:#991b1b}
.q-actions{display:flex;justify-content:space-between;gap:.85rem;margin-top:1rem}
.next-btn{background:var(--primary);color:white;border:none;padding:.7rem 1.5rem;border-radius:12px;font-weight:700;cursor:pointer;font-family:'Heebo',sans-serif;font-size:.95rem}
.next-btn:disabled{opacity:.4;cursor:not-allowed}
.level-badge{display:inline-block;background:var(--cyan-l);color:#0891b2;padding:.3rem .85rem;border-radius:999px;font-size:.78rem;font-weight:700;margin-bottom:.85rem}
.level-badge.basic{background:var(--green-l);color:#059669}
.level-badge.medium{background:var(--amber-l);color:#92400e}
.level-badge.advanced{background:var(--primary-l);color:var(--primary-d)}

.results-card{background:white;border-radius:var(--r);padding:2.25rem;box-shadow:var(--shadow);text-align:center}
.score-display{font-family:'Playpen Sans Hebrew',sans-serif;font-size:4rem;font-weight:800;color:var(--primary);line-height:1;margin:.85rem 0}
.results-card h2{font-family:'Playpen Sans Hebrew',sans-serif;font-size:1.4rem;font-weight:800;margin-bottom:.5rem}
.results-card p{color:var(--gray);line-height:1.6;margin-bottom:.85rem}
.results-actions{display:flex;gap:.85rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem}
.action-btn{background:var(--primary);color:white;border:none;padding:.8rem 1.5rem;border-radius:12px;font-weight:700;cursor:pointer;font-family:'Heebo',sans-serif;font-size:.95rem;text-decoration:none;display:inline-block}
.action-btn.outline{background:white;color:var(--primary);border:2px solid var(--primary)}
</style>
</head>
<body>

<nav class="topnav">
  <a href="index.html" class="topnav-back">← חבילת השיעור</a>
  <span class="topnav-title">📝 שאלון</span>
  <span style="font-size:.85rem;color:var(--gray)">15 דק'</span>
</nav>

<div class="container">

  <!-- Intro -->
  <div class="section active" id="intro-section">
    <div class="intro">
      <h1>שאלון דיפרנציאלי — גזרת השלמים</h1>
      <p>2 שאלות אבחון יקבעו את רמת השאלון שלך (בסיסי / בינוני / מתקדם). אחר כך תקבלי 8 שאלות מותאמות אישית.</p>
      <button class="start-btn" onclick="startQuiz()">התחילי</button>
    </div>
  </div>

  <!-- Diagnostic -->
  <div class="section" id="diagnostic-section">
    <div class="progress-info">
      <span>אבחון רמה</span>
      <span id="diag-counter">שאלה 1 מתוך 2</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="diag-progress" style="width:0%"></div></div>
    <div id="diag-area"></div>
  </div>

  <!-- Adaptive -->
  <div class="section" id="quiz-section">
    <div class="progress-info">
      <span id="level-label">רמה: בינונית</span>
      <span id="quiz-counter">שאלה 1 מתוך 8</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="quiz-progress" style="width:0%"></div></div>
    <div id="quiz-area"></div>
  </div>

  <!-- Results -->
  <div class="section" id="results-section">
    <div class="results-card">
      <h2>סיימת! 🎯</h2>
      <div class="score-display" id="final-score">0</div>
      <p id="results-message"></p>
      <div class="results-actions">
        <a href="index.html" class="action-btn outline">חזרה למערך</a>
        <button class="action-btn" onclick="location.reload()">שאלון חדש</button>
      </div>
    </div>
  </div>

</div>

<script>
const DIAG=[
  {q:'מה השורש של הפועל "שָׁמַרְתִּי"?',opts:['ש.מ.ר','ש.ר.ת','ש.מ.ת','שָׁמַר'],correct:0,exp:'השורש הוא ש.מ.ר. שלוש אותיות בסיס.'},
  {q:'הפועל "כָּתַבְנוּ" שייך ל:',opts:['גזרת השלמים','חסרי פ"נ','נחי ל"י/ה','אין גזרה'],correct:0,exp:'שורש כ.ת.ב — 3 אותיות "רגילות". שלמים.'}
];

const QUESTIONS={
  basic:[
    {q:'מה השורש של "לָמַדְתִּי"?',opts:['ל.מ.ד','לָ.מַ.ד','ל.ד','אני'],correct:0,exp:'ל.מ.ד — 3 אותיות שורש. גזרת שלמים.'},
    {q:'איזה פועל שייך לגזרת השלמים?',opts:['קָם','שָׁמַר','קָנָה','אָכַל'],correct:1,exp:'שָׁמַר — שורש ש.מ.ר, שלמים. השאר: קָם (ע"ו/י), קָנָה (ל"י/ה), אָכַל (פ"א).'},
    {q:'הפועל "סָגַרְנוּ" — איזה גוף וזמן?',opts:['גוף ראשון רבים, עבר','גוף שני רבים, עתיד','גוף ראשון יחיד, עבר','אנו, הווה'],correct:0,exp:'הסיומת "-נוּ" מציינת גוף ראשון רבים בעבר.'},
    {q:'איזה בניין הוא הסביל של בניין קל?',opts:['פיעל','נפעל','הפעיל','התפעל'],correct:1,exp:'נפעל הוא הסביל של קל. כָּתַב (קל) ↔ נִכְתַּב (נפעל).'},
    {q:'"דִּבַּרְתִּי" שייך לאיזה בניין?',opts:['קל','נפעל','פיעל','הפעיל'],correct:2,exp:'פיעל. סימן: דגש בעין הפועל (ב' עם דגש), משמעות מודגשת/חזקה.'},
    {q:'מה השורש של "הִתְלַבַּשְׁתִּי"?',opts:['ה.ת.ל','ל.ב.ש','הִתְ.לַבֵּשׁ','ת.ל.ב'],correct:1,exp:'ל.ב.ש. ה-"הִתְ-" היא תחילית של בניין התפעל, לא חלק מהשורש.'},
    {q:'שם הפעולה של "כָּתַב" (בניין קל):',opts:['כְּתִיבָה','כִּיתּוּב','הַכְתָּבָה','כָּתוּב'],correct:0,exp:'משקל קְטִילָה הוא שם הפעולה של בניין קל. כְּתִיבָה.'},
    {q:'"בָּדַקְנוּ" שייך לגזרה:',opts:['חסרי פ"נ','נחי ע"ו','שלמים','ל"א'],correct:2,exp:'שורש ב.ד.ק — 3 אותיות "רגילות", אין נופלות. שלמים.'}
  ],
  medium:[
    {q:'מה ההבדל בין "כָּתַב" ל-"נִכְתַּב"?',opts:['אותו דבר','קל ↔ נפעל (פעיל ↔ סביל)','עבר ↔ הווה','שורש שונה'],correct:1,exp:'כָּתַב — קל (פעיל). נִכְתַּב — נפעל (סביל). אותו שורש כ.ת.ב.'},
    {q:'"לִמְּדוּ" — איזה גוף וזמן?',opts:['גוף שלישי רבים, עבר, פיעל','גוף ראשון רבים, עתיד','גוף שני יחיד, ציווי','גוף שלישי יחיד, הווה'],correct:0,exp:'בניין פיעל, עבר, גוף שלישי רבים. שורש ל.מ.ד.'},
    {q:'איזה פועל הוא שלמים על אף שמתחיל ב-נ\'?',opts:['נָפַל','נָגַע','נָסַע','נִכְנַס'],correct:2,exp:'נָסַע — שורש נ.ס.ע, הנ\' נשמרת בנטייה (יִסַּע, אֶסַּע — אבל הנ\' לא נופלת!). דוגמה לעיקרון "פועל בנ\' ≠ חסרי פ"נ".'},
    {q:'מה צורת הציווי של "כָּתַב" (קל, גוף שני יחיד)?',opts:['כָּתַבְתָּ','כְּתֹב','תִּכְתֹּב','כָּתוּב'],correct:1,exp:'כְּתֹב. ציווי בקל: בלי תחילית "ת-".'},
    {q:'"הוֹדִיעוּ" — באיזו גזרה?',opts:['שלמים','פ"י/ו','ל"י/ה','ע"ו/י'],correct:1,exp:'שורש י.ד.ע. י\' בראש השורש = פ"י/ו. ה-י\' מתחבאת בקצת מהצורות (כמו "מוֹדִיעַ").'},
    {q:'שם הפעולה של "הִתְלַבֵּשׁ" (התפעל):',opts:['לִבּוּשׁ','לְבִישָׁה','הִתְלַבְּשׁוּת','הַלְבָּשָׁה'],correct:2,exp:'משקל הִתְקַטְּלוּת = שם הפעולה של התפעל. הִתְלַבְּשׁוּת.'},
    {q:'"נִשְׁבְּרָה" — איזה בניין? איזה גוף?',opts:['קל, גוף שלישי יחיד','נפעל, גוף שלישי יחידה (היא)','פיעל, גוף שני','הפעיל, רבים'],correct:1,exp:'נפעל (סימן: "נִ-" + דגש). גוף שלישי יחידה (היא) — סיומת "-ָה".'},
    {q:'איזו טבלה נכונה: שורש ש.מ.ר, בניין הפעיל?',opts:['הִשְׁמִיר / יַשְׁמִיר','שָׁמַר / יִשְׁמֹר','שִׁמֵּר / יְשַׁמֵּר','הִשְׁתַּמֵּר / יִשְׁתַּמֵּר'],correct:0,exp:'בניין הפעיל = "הִ--ִיר" בעבר, "יַ--ִיר" בעתיד. לכן: הִשְׁמִיר / יַשְׁמִיר.'}
  ],
  advanced:[
    {q:'בקטע: "המורָה לִמְּדָה את הכיתה. התלמידים לָמְדוּ והִשְׁתַּלְּמוּ." — כמה פעלים מגזרת השלמים?',opts:['1','2','3','4'],correct:2,exp:'3 — לִמְּדָה (פיעל), לָמְדוּ (קל), הִשְׁתַּלְּמוּ (התפעל). כולם מגזרת השלמים.'},
    {q:'איזה זוג מציג נכון פעיל ↔ סביל?',opts:['כָּתַב ↔ הִכְתִּיב','דִּבֵּר ↔ דֻּבַּר','שָׁמַר ↔ שִׁמֵּר','בָּדַק ↔ בּוֹדֵק'],correct:1,exp:'דִּבֵּר (פיעל פעיל) ↔ דֻּבַּר (פועל סביל). שאר הזוגות: לא פעיל-סביל אלא בניינים שונים.'},
    {q:'"הִדְפַּסְתִּי" — מה הבניין? מה השורש?',opts:['פיעל / ד.פ.ס','הפעיל / ד.פ.ס','הופעל / הִ.ד.פ','התפעל / ד.פ.ס'],correct:1,exp:'בניין הפעיל (תחילית "הִ-" + תנועת חיריק/שווא). שורש ד.פ.ס.'},
    {q:'בבגרות חורף תשפ"ו: "שָׁעַבְּדוּ את הניב" — מה הבניין?',opts:['קל','פיעל','מרובע (פִּעֲלֵל)','התפעל'],correct:2,exp:'שָׁעַבְּדוּ — בניין מרובע! ש.ע.ב.ד 4 אותיות. בעבר רבים: שִׁעְבְּדוּ. דומה לפיעל אבל עם 4 אותיות.'},
    {q:'מה הבדיל בין "מַשִּׁיב" ל-"מֵשִׁיב"?',opts:['שניהם זהים','מַשִּׁיב — בניין הפעיל פעיל; מֵשִׁיב — שורש שונה','מַשִּׁיב — שורש ש.ו.ב; מֵשִׁיב — שורש י.ש.ב','שתי הצורות שגויות'],correct:2,exp:'מַשִּׁיב = הפעיל של ש.ו.ב (גזרת ע"ו/י). מֵשִׁיב = שורש י.ש.ב? לא — שניהם של ש.ו.ב, אבל הניקוד הנכון הוא מֵשִׁיב. תיקון הגייה שכיח בבגרות.'},
    {q:'בקטע "הם הִתְכַּתְּבוּ במשך שנים" — באיזה משמעות בניין התפעל?',opts:['חוזר על עצמו','הדדי (אחד עם השני)','גורם','סביל'],correct:1,exp:'הדדי. "הִתְכַּתְּבוּ" = כתבו אחד לשני. משמעות הדדית של בניין התפעל.'},
    {q:'מה ההבדל בין שם הפעולה לבין הבינוני?',opts:['אין הבדל','שם פעולה הוא שם עצם, בינוני הוא צורת זמן הווה','בינוני הוא רק לפעלים מסוימים','שם פעולה תמיד נקבי'],correct:1,exp:'שם פעולה (כְּתִיבָה, הַכְתָּבָה) = שם עצם. בינוני (כּוֹתֵב, מַכְתִּיב) = צורת הווה של הפועל. שניהם מגיעים מהפועל אבל מתפקדים אחרת תחבירית.'},
    {q:'אם "הִשְׁמִיד" שייך לגזרת השלמים, מה השורש?',opts:['ש.מ.ד','הִ.ש.מ','י.ש.ד','ש.מ.ד.ה'],correct:0,exp:'ש.מ.ד. תחילית "הִ-" של הפעיל לא שייכת לשורש.'}
  ]
};

let level='medium',score=0,answeredCount=0,diagScore=0;
let diagIdx=0,quizIdx=0,selectedQuestions=[];

function startQuiz(){
  document.getElementById('intro-section').classList.remove('active');
  document.getElementById('diagnostic-section').classList.add('active');
  renderDiag();
}

function renderDiag(){
  const q=DIAG[diagIdx];
  const area=document.getElementById('diag-area');
  area.innerHTML=`
    <div class="q-card">
      <div class="q-num">אבחון ${diagIdx+1}</div>
      <div class="q-text">${q.q}</div>
      <div class="q-options">${q.opts.map((o,i)=>`<button class="q-opt" data-i="${i}">${o}</button>`).join('')}</div>
      <div class="q-feedback" id="diag-fb"></div>
      <div class="q-actions"><span></span><button class="next-btn" id="diag-next" disabled>${diagIdx<DIAG.length-1?'הבא ←':'התחילי שאלון →'}</button></div>
    </div>
  `;
  area.querySelectorAll('.q-opt').forEach(b=>{
    b.onclick=()=>{
      const i=+b.dataset.i;
      const correct=i===q.correct;
      area.querySelectorAll('.q-opt').forEach((x,j)=>{
        x.disabled=true;
        if(j===q.correct)x.classList.add('correct');
        else if(j===i&&!correct)x.classList.add('incorrect');
      });
      const fb=document.getElementById('diag-fb');
      fb.classList.add('show',correct?'right':'wrong');
      fb.innerHTML=`<strong>${correct?'נכון!':'לא מדויק.'}</strong> ${q.exp}`;
      if(correct)diagScore++;
      document.getElementById('diag-next').disabled=false;
    };
  });
  document.getElementById('diag-progress').style.width=`${((diagIdx+1)/DIAG.length)*100}%`;
  document.getElementById('diag-counter').textContent=`שאלה ${diagIdx+1} מתוך ${DIAG.length}`;
  document.getElementById('diag-next').onclick=()=>{
    if(diagIdx<DIAG.length-1){diagIdx++;renderDiag()}
    else{
      level=diagScore===2?'advanced':diagScore===1?'medium':'basic';
      document.getElementById('diagnostic-section').classList.remove('active');
      document.getElementById('quiz-section').classList.add('active');
      const labels={basic:'בסיסית 🟢',medium:'בינונית 🟡',advanced:'מתקדמת 🟣'};
      document.getElementById('level-label').textContent=`רמה: ${labels[level]}`;
      selectedQuestions=QUESTIONS[level];
      renderQuiz();
    }
  };
}

function renderQuiz(){
  const q=selectedQuestions[quizIdx];
  const area=document.getElementById('quiz-area');
  const levelClass={basic:'basic',medium:'medium',advanced:'advanced'}[level];
  const levelText={basic:'בסיסית',medium:'בינונית',advanced:'מתקדמת'}[level];
  area.innerHTML=`
    <div class="q-card">
      <span class="level-badge ${levelClass}">רמה ${levelText}</span>
      <div class="q-num">שאלה ${quizIdx+1}</div>
      <div class="q-text">${q.q}</div>
      <div class="q-options">${q.opts.map((o,i)=>`<button class="q-opt" data-i="${i}">${o}</button>`).join('')}</div>
      <div class="q-feedback" id="quiz-fb"></div>
      <div class="q-actions"><span></span><button class="next-btn" id="quiz-next" disabled>${quizIdx<selectedQuestions.length-1?'הבא ←':'סיים שאלון →'}</button></div>
    </div>
  `;
  area.querySelectorAll('.q-opt').forEach(b=>{
    b.onclick=()=>{
      const i=+b.dataset.i;
      const correct=i===q.correct;
      area.querySelectorAll('.q-opt').forEach((x,j)=>{
        x.disabled=true;
        if(j===q.correct)x.classList.add('correct');
        else if(j===i&&!correct)x.classList.add('incorrect');
      });
      const fb=document.getElementById('quiz-fb');
      fb.classList.add('show',correct?'right':'wrong');
      fb.innerHTML=`<strong>${correct?'נכון!':'לא נכון.'}</strong> ${q.exp}`;
      if(correct)score++;
      answeredCount++;
      document.getElementById('quiz-next').disabled=false;
    };
  });
  document.getElementById('quiz-progress').style.width=`${((quizIdx+1)/selectedQuestions.length)*100}%`;
  document.getElementById('quiz-counter').textContent=`שאלה ${quizIdx+1} מתוך ${selectedQuestions.length}`;
  document.getElementById('quiz-next').onclick=()=>{
    if(quizIdx<selectedQuestions.length-1){quizIdx++;renderQuiz()}
    else showResults();
  };
}

function showResults(){
  document.getElementById('quiz-section').classList.remove('active');
  document.getElementById('results-section').classList.add('active');
  const total=selectedQuestions.length;
  const pct=Math.round(score/total*100);
  document.getElementById('final-score').textContent=`${score}/${total}`;
  let msg='';
  if(pct>=85)msg='שליטה מצוינת בגזרת השלמים! מוכנה להמשיך לגזרות הבאות.';
  else if(pct>=70)msg='שליטה טובה. כדאי לחזור על נושאים שטעית בהם לפני המעבר הלאה.';
  else if(pct>=50)msg='יש בסיס, אבל צריך להעמיק. חזרי על המצגת ותרגלי שוב.';
  else msg='הנושא דורש חזרה משמעותית. בקשי עזרה מהמורה ותעבוד שוב על המצגת והפעילויות.';
  document.getElementById('results-message').textContent=msg;
  // Save to localStorage for tracking
  try{localStorage.setItem('shlemim-score',JSON.stringify({score,total,level,date:new Date().toISOString()}))}catch(e){}
}
</script>
