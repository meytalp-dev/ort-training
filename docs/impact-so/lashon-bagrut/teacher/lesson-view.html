<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מערך שיעור · Impact SO</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    .lesson-shell { max-width: 980px; margin: 0 auto; padding: 1.5rem; padding-bottom: 4rem; }

    .lesson-hero {
      padding: 1.5rem 0 1rem;
    }
    .lesson-hero h1 { font-size: clamp(1.5rem, 3vw, 2.1rem); margin-bottom: 0.4rem; }
    .lesson-meta-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    /* Teacher prep card */
    .prep-card {
      background: linear-gradient(135deg, var(--lavender-soft), white);
      border: 1px solid var(--lavender);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    .prep-card-head {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
    }
    .prep-card-icon {
      width: 32px; height: 32px;
      border-radius: 10px;
      background: var(--lavender);
      color: white;
      display: grid; place-items: center;
    }
    .prep-card-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
    }
    .prep-card-body {
      color: var(--ink);
      font-size: 0.94rem;
      line-height: 1.6;
    }
    .prep-card-materials {
      margin-top: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .material-pill {
      padding: 0.3rem 0.7rem;
      background: white;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.82rem;
      color: var(--ink-soft);
    }

    /* Phases */
    .phases-timeline {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }
    .phase-pill {
      flex: 0 0 auto;
      padding: 0.5rem 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .phase-pill:hover { border-color: var(--lavender); color: var(--lavender); }
    .phase-pill .phase-time {
      font-size: 0.78rem;
      color: var(--ink-muted);
      margin-right: 0.4rem;
    }

    /* Phase block */
    .phase-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .phase-header {
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      cursor: pointer;
      background: var(--surface);
      transition: background 0.15s;
    }
    .phase-header:hover { background: var(--surface-2); }
    .phase-header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: 1;
      min-width: 0;
    }
    .phase-num {
      width: 36px; height: 36px;
      border-radius: 12px;
      display: grid; place-items: center;
      font-family: var(--font-display);
      font-weight: 800;
      flex: 0 0 36px;
    }
    .phase-num.opening { background: var(--cyan-soft); color: #0891b2; }
    .phase-num.instruction { background: var(--lavender-soft); color: #7c3aed; }
    .phase-num.guided_practice, .phase-num.guided_analysis { background: var(--amber-soft); color: #d97706; }
    .phase-num.practice_1_findmistake, .phase-num.practice_2_findmistake { background: var(--pink-soft); color: #db2777; }
    .phase-num.practice_2_adaptive, .phase-num.practice_adaptive { background: var(--mint-soft); color: #059669; }
    .phase-num.practice_courtroom { background: var(--rose-soft); color: var(--rose); }
    .phase-num.practice_story { background: var(--lavender-soft); color: #7c3aed; }
    .phase-num.ai_coach_break { background: var(--cyan-soft); color: #0891b2; }
    .phase-num.closure_portfolio, .phase-num.closure_dna, .phase-num.closure { background: var(--orange-soft); color: #ea580c; }

    .phase-info-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.3;
    }
    .phase-info-method {
      font-size: 0.85rem;
      color: var(--ink-muted);
      margin-top: 0.15rem;
    }
    .phase-meta-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 0 0 auto;
    }
    .phase-duration {
      font-size: 0.85rem;
      color: var(--ink-muted);
      background: var(--surface-2);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .phase-toggle {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: var(--surface-2);
      border: none;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .phase-block.expanded .phase-toggle { transform: rotate(180deg); }

    .phase-body {
      display: none;
      padding: 0 1.5rem 1.5rem;
      border-top: 1px solid var(--border);
      padding-top: 1.25rem;
      animation: fadeUp 0.3s ease;
    }
    .phase-block.expanded .phase-body { display: block; }

    .method-description {
      background: var(--surface-2);
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      color: var(--ink-soft);
      margin-bottom: 1rem;
      border-right: 3px solid var(--lavender);
    }

    .key-idea {
      background: linear-gradient(135deg, var(--cyan-soft), white);
      padding: 1rem 1.25rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
      border-right: 4px solid var(--cyan);
    }
    .key-idea strong { color: var(--ink); }

    .teacher-actions {
      margin: 1rem 0;
    }
    .teacher-actions h4 {
      font-family: var(--font-display);
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      color: var(--ink-soft);
    }
    .teacher-actions ol {
      padding-right: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .teacher-actions li {
      color: var(--ink-soft);
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .examples-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.6rem;
      margin: 1rem 0;
    }
    .example-card {
      background: var(--surface-2);
      padding: 0.8rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .example-card-word {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--ink);
      font-size: 1.05rem;
    }
    .example-card-meta {
      font-size: 0.82rem;
      color: var(--ink-soft);
      margin-top: 0.2rem;
    }

    /* AI feature badge */
    .ai-feature-banner {
      background: linear-gradient(135deg, var(--pink-soft), white);
      border: 1px solid var(--pink);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin: 1rem 0;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }
    .ai-feature-icon {
      flex: 0 0 36px;
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--pink);
      color: white;
      display: grid; place-items: center;
      font-size: 1.1rem;
    }
    .ai-feature-title {
      font-family: var(--font-display);
      font-weight: 700;
      color: #db2777;
    }
    .ai-feature-desc {
      font-size: 0.88rem;
      color: var(--ink-soft);
      margin-top: 0.25rem;
      line-height: 1.5;
    }

    /* Tracks */
    .tracks-block {
      margin: 1rem 0;
    }
    .tracks-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      margin-top: 0.5rem;
    }
    @media (max-width: 700px) { .tracks-grid { grid-template-columns: 1fr; } }
    .track-mini {
      padding: 0.85rem;
      border-radius: var(--radius);
      border: 1.5px solid;
    }
    .track-mini-green { border-color: var(--mint); background: var(--mint-soft); }
    .track-mini-blue { border-color: var(--blue); background: var(--blue-soft); }
    .track-mini-purple { border-color: var(--lavender); background: var(--lavender-soft); }
    .track-mini-label { font-weight: 700; margin-bottom: 0.25rem; }
    .track-mini-desc { font-size: 0.85rem; line-height: 1.5; }

    /* Closing summary */
    .summary-list {
      list-style: none;
      padding: 1rem 1.25rem;
      background: var(--orange-soft);
      border-radius: var(--radius);
      margin-top: 1rem;
    }
    .summary-list li {
      padding: 0.3rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .summary-list li::before {
      content: '★';
      color: var(--orange);
      font-weight: 700;
    }

    /* Vocab + Objectives */
    .info-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 700px) { .info-row { grid-template-columns: 1fr; } }
    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
    }
    .info-card-title {
      font-family: var(--font-display);
      font-weight: 700;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .objectives-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .objectives-list li {
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
      font-size: 0.92rem;
    }
    .objectives-list li::before {
      content: '✓';
      width: 18px; height: 18px;
      background: var(--mint);
      color: white;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 0.7rem;
      flex: 0 0 18px;
      margin-top: 2px;
    }
    .vocab-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .vocab-row {
      padding: 0.55rem 0.85rem;
      background: var(--lavender-soft);
      border-radius: var(--radius-sm);
      border-right: 3px solid var(--lavender);
    }
    .vocab-row-term { font-weight: 700; }
    .vocab-row-def { font-size: 0.85rem; color: var(--ink-soft); margin-top: 0.15rem; }

    /* Action bar */
    .action-bar {
      position: sticky;
      bottom: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 1rem 1.5rem;
      box-shadow: var(--shadow-lg);
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-top: 2rem;
      z-index: 50;
    }
    .action-bar-left { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .action-bar-right { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--ink-muted); }
  </style>
</head>
<body>

<nav class="topnav">
  <a href="today.html" class="topnav-brand">
    <div class="topnav-brand-mark">ל</div>
    <div>
      <div class="topnav-brand-text">לשון 70%</div>
      <div class="topnav-brand-sub">Impact SO · מערך שיעור</div>
    </div>
  </a>
  <div class="topnav-links">
    <a href="today.html" class="topnav-link">Today</a>
    <a href="../annual-plan.html" class="topnav-link">תוכנית שנתית</a>
    <a href="javascript:history.back()" class="topnav-link">← חזרה</a>
  </div>
</nav>

<div class="lesson-shell" id="lesson-root">
  <div class="empty-state">טוען מערך שיעור...</div>
</div>

<script src="../auth/supabase-config.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const lessonId = params.get('id') || 'hapoel-chasrei-pn';

  const PHASE_LABELS_HE = {
    opening: '1', instruction: '2', guided_practice: '3', guided_analysis: '3',
    practice_1_findmistake: '4', practice_2_findmistake: '4', practice_2_adaptive: '5',
    practice_adaptive: '5', practice_courtroom: '5', practice_story: '5',
    ai_coach_break: '6', closure_portfolio: '7', closure_dna: '7', closure: '7'
  };

  const FEATURE_LABELS = {
    g1_grader: 'בודק עבודות חכם',
    g1_quizgen: 'מחולל בחנים אישיים',
    g1_classanalysis: 'מנתח טעויות כיתה',
    g1_reminders: 'תזכורות חכמות',
    g2_findmistake: '"מצא את הטעות"',
    g2_story: 'סיפור אינטראקטיבי',
    g2_personalcontent: 'תוכן אישי של תלמיד',
    g2_courtroom: 'בית דין משפטי',
    g3_dna: 'מפת DNA תלמיד',
    g3_teachercoach: 'AI מאמן מורה',
    g3_typicalmistakes: 'תרגול לפי טעויות אופייניות',
    g3_portfolio: 'תיקיית עבודות',
    g4_examgen: 'מחולל בחינות',
    practice_engine: 'תרגול חי אדפטיבי',
    ai_tutor_socratic: 'AI Tutor סוקרטי',
    ai_writing_coach: 'AI Writing Coach',
    ai_coach: 'AI Coach'
  };

  function escapeHtml(text) {
    if (typeof text !== 'string') return '';
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderInline(text) {
    if (typeof text !== 'string') return '';
    return text.replace(/\n/g, '<br>');
  }

  async function init() {
    await window.ImpactAuth.requireAuth('../auth/login.html');

    try {
      const response = await fetch(`../curriculum/full-lessons/${lessonId}.json`);
      if (!response.ok) throw new Error('המערך לא נמצא');
      const lesson = await response.json();
      render(lesson);
    } catch (e) {
      $('lesson-root').innerHTML = `
        <div class="empty-state">
          <h2>מערך לא נמצא</h2>
          <p>השיעור בבנייה. נסי לבחור שיעור אחר.</p>
          <a class="btn btn-primary mt-2" href="../annual-plan.html">חזרה לתוכנית</a>
        </div>
      `;
    }
  }

  function render(lesson) {
    const html = `
      <div class="lesson-hero">
        <div class="lesson-meta-row">
          <span class="pill pill-lavender">${escapeHtml(lesson.topic_name)}</span>
          <span class="pill pill-cyan">${escapeHtml(lesson.subtopic)}</span>
          <span class="pill pill-mint">${lesson.duration_min} דקות</span>
          <span class="pill pill-amber">כיתה ${escapeHtml(lesson.grade)}</span>
        </div>
        <h1>${escapeHtml(lesson.title)}</h1>
        <p class="text-soft" style="font-size: 1.05rem; line-height: 1.6;">${escapeHtml(lesson.subtitle)}</p>
      </div>

      ${renderTeacherPrep(lesson.teacher_prep)}

      <div class="info-row">
        <div class="info-card">
          <div class="info-card-title">🎯 מטרות השיעור</div>
          <ul class="objectives-list">
            ${lesson.objectives.map(o => `<li>${escapeHtml(o)}</li>`).join('')}
          </ul>
        </div>
        <div class="info-card">
          <div class="info-card-title">📚 אוצר מילים</div>
          <div class="vocab-list">
            ${lesson.vocabulary.map(v => `
              <div class="vocab-row">
                <div class="vocab-row-term">${escapeHtml(v.term)}</div>
                <div class="vocab-row-def">${escapeHtml(v.definition)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <h2 style="margin-top: 1.5rem; margin-bottom: 1rem;">מבנה השיעור</h2>
      <div class="phases-timeline">
        ${lesson.structure.map((p, i) => `
          <div class="phase-pill" data-target="${i}">
            <span class="phase-time">${p.duration_min}'</span>
            ${escapeHtml(p.phase_label)}
          </div>
        `).join('')}
      </div>

      <div id="phases-container">
        ${lesson.structure.map((p, i) => renderPhase(p, i)).join('')}
      </div>

      ${renderHomework(lesson.homework)}
      ${renderAIFeaturesIntegrated(lesson.ai_features_integrated)}
      ${renderEvaluation(lesson.evaluation)}

      <div class="action-bar">
        <div class="action-bar-left">
          <button class="btn btn-secondary btn-sm" id="mark-done">✓ סמני שיעור הועבר</button>
          <span class="text-muted" style="font-size: 0.82rem;">השיעור יעודכן ב-DB</span>
        </div>
        <div class="action-bar-right">
          <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨 הדפסה</button>
          <a class="btn btn-primary btn-sm" href="../annual-plan.html">חזרה לתוכנית</a>
        </div>
      </div>
    `;

    $('lesson-root').innerHTML = html;
    attachHandlers();
  }

  function renderTeacherPrep(prep) {
    if (!prep) return '';
    return `
      <div class="prep-card">
        <div class="prep-card-head">
          <div class="prep-card-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v6m0 4v10M2 12h6m4 0h10"/></svg>
          </div>
          <div class="prep-card-title">הכנה למורה (לפני השיעור)</div>
        </div>
        <div class="prep-card-body">${escapeHtml(prep.before_lesson || '')}</div>
        ${prep.materials_needed?.length ? `
          <div class="prep-card-materials">
            ${prep.materials_needed.map(m => `<span class="material-pill">${escapeHtml(m)}</span>`).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }

  function renderPhase(phase, idx) {
    const num = PHASE_LABELS_HE[phase.phase] || (idx + 1);
    let body = '';

    if (phase.method_description) {
      body += `<div class="method-description"><strong>שיטה:</strong> ${escapeHtml(phase.method)}<br>${escapeHtml(phase.method_description)}</div>`;
    }
    if (phase.key_idea) {
      body += `<div class="key-idea">${renderInline(phase.key_idea)}</div>`;
    }
    if (phase.teacher_actions?.length) {
      body += `
        <div class="teacher-actions">
          <h4>פעולות המורה</h4>
          <ol>${phase.teacher_actions.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ol>
        </div>
      `;
    }
    if (phase.examples?.length) {
      body += `
        <div class="examples-grid">
          ${phase.examples.map(ex => `
            <div class="example-card">
              <div class="example-card-word">${escapeHtml(ex.word || ex.phase || '')}</div>
              <div class="example-card-meta">${escapeHtml(ex.weight || ex.tactic || ex.rule || ex.meaning || ex.example || '')}</div>
            </div>
          `).join('')}
        </div>
      `;
    }
    if (phase.exception) {
      body += `<div class="key-idea" style="background: linear-gradient(135deg, var(--amber-soft), white); border-color: var(--amber);"><strong>חריג:</strong> ${escapeHtml(phase.exception)}</div>`;
    }
    if (phase.feature) {
      const featLabel = FEATURE_LABELS[phase.feature] || phase.feature;
      body += `
        <div class="ai-feature-banner">
          <div class="ai-feature-icon">✨</div>
          <div>
            <div class="ai-feature-title">פיצ'ר AI: ${escapeHtml(featLabel)}</div>
            <div class="ai-feature-desc">${escapeHtml(phase.method_description || phase.instruction || '')}</div>
          </div>
        </div>
      `;
    }
    if (phase.instruction && !phase.feature) {
      body += `<div class="method-description"><strong>הוראה לתלמיד:</strong> ${escapeHtml(phase.instruction)}</div>`;
    }
    if (phase.tracks) {
      body += `
        <div class="tracks-block">
          <h4 style="font-family: var(--font-display); margin-bottom: 0.5rem;">3 רבדי תרגול</h4>
          <div class="tracks-grid">
            <div class="track-mini track-mini-green">
              <div class="track-mini-label">🟢 ירוק — תמיכה</div>
              <div class="track-mini-desc">${escapeHtml(phase.tracks.green || '')}</div>
            </div>
            <div class="track-mini track-mini-blue">
              <div class="track-mini-label">🔵 כחול — רגיל</div>
              <div class="track-mini-desc">${escapeHtml(phase.tracks.blue || '')}</div>
            </div>
            <div class="track-mini track-mini-purple">
              <div class="track-mini-label">🟣 סגול — אתגר</div>
              <div class="track-mini-desc">${escapeHtml(phase.tracks.purple || '')}</div>
            </div>
          </div>
        </div>
      `;
    }
    if (phase.summary_points?.length) {
      body += `<ul class="summary-list">${phase.summary_points.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>`;
    }
    if (phase.exit_question) {
      body += `<div class="key-idea" style="background: linear-gradient(135deg, var(--cyan-soft), white); border-color: var(--cyan); margin-top: 1rem;"><strong>שאלת יציאה:</strong> ${escapeHtml(phase.exit_question)}</div>`;
    }

    return `
      <div class="phase-block ${idx === 0 ? 'expanded' : ''}" data-phase-idx="${idx}">
        <div class="phase-header">
          <div class="phase-header-left">
            <div class="phase-num ${phase.phase}">${num}</div>
            <div>
              <div class="phase-info-title">${escapeHtml(phase.phase_label)}</div>
              <div class="phase-info-method">${escapeHtml(phase.method || '')}</div>
            </div>
          </div>
          <div class="phase-meta-right">
            <span class="phase-duration">${phase.duration_min} דק'</span>
            <button class="phase-toggle">▼</button>
          </div>
        </div>
        <div class="phase-body">${body}</div>
      </div>
    `;
  }

  function renderHomework(hw) {
    if (!hw) return '';
    return `
      <h2 style="margin-top: 2rem; margin-bottom: 0.75rem;">📝 שיעורי בית</h2>
      <div class="info-row">
        <div class="info-card">
          <div class="info-card-title">חובה</div>
          <p style="line-height: 1.6;">${escapeHtml(hw.required || '')}</p>
        </div>
        <div class="info-card" style="background: linear-gradient(180deg, var(--lavender-soft), white);">
          <div class="info-card-title">⭐ אתגר</div>
          <p style="line-height: 1.6;">${escapeHtml(hw.challenge || '')}</p>
        </div>
      </div>
    `;
  }

  function renderAIFeaturesIntegrated(features) {
    if (!features?.length) return '';
    return `
      <h2 style="margin-top: 2rem; margin-bottom: 0.75rem;">✨ פיצ'רי AI שמשולבים בשיעור</h2>
      <div class="info-card">
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.6rem;">
          ${features.map(f => {
            const label = FEATURE_LABELS[f.feature_id] || f.feature_id;
            const priorityColor = f.priority === 'high' ? 'var(--rose)' : 'var(--amber)';
            return `
              <div style="display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem; background: var(--surface-2); border-radius: var(--radius-sm);">
                <div style="width: 8px; height: 8px; border-radius: 50%; background: ${priorityColor}; flex: 0 0 8px;"></div>
                <div style="flex: 1;">
                  <div style="font-weight: 600; font-size: 0.9rem;">${escapeHtml(label)}</div>
                  <div style="font-size: 0.78rem; color: var(--ink-muted);">בשלב: ${escapeHtml(f.phase)}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  function renderEvaluation(ev) {
    if (!ev?.rubric) return '';
    const total = ev.rubric.reduce((sum, r) => sum + (r.weight || 0), 0);
    return `
      <h2 style="margin-top: 2rem; margin-bottom: 0.75rem;">📊 רובריקת הערכה</h2>
      <div class="info-card">
        <table style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr style="border-bottom: 1px solid var(--border);">
              <th style="text-align: right; padding: 0.5rem; font-family: var(--font-display); font-size: 0.85rem;">קריטריון</th>
              <th style="text-align: left; padding: 0.5rem; font-family: var(--font-display); font-size: 0.85rem;">משקל</th>
            </tr>
          </thead>
          <tbody>
            ${ev.rubric.map(r => `
              <tr style="border-bottom: 1px solid var(--border);">
                <td style="padding: 0.6rem 0.5rem;">
                  <div style="font-weight: 600; font-size: 0.92rem;">${escapeHtml(r.criterion)}</div>
                  ${r.description ? `<div style="font-size: 0.82rem; color: var(--ink-muted); margin-top: 0.15rem;">${escapeHtml(r.description)}</div>` : ''}
                </td>
                <td style="padding: 0.6rem 0.5rem; text-align: left; font-weight: 700; color: var(--lavender);">${r.weight}%</td>
              </tr>
            `).join('')}
            <tr>
              <td style="padding: 0.5rem; font-weight: 700;">סה"כ</td>
              <td style="padding: 0.5rem; text-align: left; font-weight: 700;">${total}%</td>
            </tr>
          </tbody>
        </table>
      </div>
    `;
  }

  function attachHandlers() {
    document.querySelectorAll('.phase-header').forEach(header => {
      header.addEventListener('click', () => {
        header.closest('.phase-block').classList.toggle('expanded');
      });
    });

    document.querySelectorAll('.phase-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        const idx = pill.dataset.target;
        const target = document.querySelector(`[data-phase-idx="${idx}"]`);
        if (target) {
          target.classList.add('expanded');
          target.scrollIntoView({behavior: 'smooth', block: 'start'});
        }
      });
    });

    $('mark-done')?.addEventListener('click', async () => {
      // Stub: would write to lessons_progress in DB
      const btn = $('mark-done');
      btn.textContent = '✓ שיעור הועבר';
      btn.style.background = 'var(--mint)';
      btn.style.color = 'white';
    });
  }

  init();
</script>

</body>
</html>
