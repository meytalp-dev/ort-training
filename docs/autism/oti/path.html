<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>המסלול שלך · אוטי</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@400;600;700&family=Bellefair&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .oti-logo .logo-mark span:nth-child(1) { background: var(--butter); }
  .oti-logo .logo-mark span:nth-child(2) { background: var(--teal); margin-top: 6px; }
  .oti-logo .logo-mark span:nth-child(3) { background: var(--lavender); }

  .path-header {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.6rem 1.8rem;
    box-shadow: var(--shadow-sm);
    margin-bottom: 1.6rem;
  }
  .path-header .eyebrow { color: var(--teal-deep); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.05em; }
  .path-header h1 { font-size: 1.8rem; margin-top: 0.4rem; }
  .path-header .filter-chips { margin-top: 0.8rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .chip {
    background: var(--teal-soft); color: var(--teal-deep);
    padding: 0.3rem 0.8rem; border-radius: 999px;
    font-size: 0.85rem; font-weight: 600;
  }

  .svc-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  .svc-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.4rem 1.6rem;
    box-shadow: var(--shadow-sm);
    transition: all 0.15s ease;
  }
  .svc-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }

  .svc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.5rem; }
  .svc-name { font-family: 'Bellefair', 'Heebo', sans-serif; font-size: 1.25rem; font-weight: 600; color: var(--ink); }
  .svc-cat { font-size: 0.8rem; font-weight: 700; color: var(--coral); letter-spacing: 0.05em; white-space: nowrap; }

  .svc-meta {
    display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem;
    font-size: 0.88rem; color: var(--ink-soft);
    margin-bottom: 0.8rem;
  }
  .svc-meta span { display: inline-flex; align-items: center; gap: 0.3rem; }
  .svc-meta svg { width: 14px; height: 14px; opacity: 0.7; }

  .svc-summary { color: var(--ink); line-height: 1.65; margin-bottom: 0.9rem; }

  .svc-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
  .svc-tag {
    font-size: 0.78rem;
    padding: 0.2rem 0.7rem;
    border-radius: 999px;
    font-weight: 600;
  }
  .tag-warm { background: var(--sage-soft); color: #5b8452; }
  .tag-neutral { background: var(--butter-soft); color: #8a6d1f; }
  .tag-concern { background: var(--coral-soft); color: #b26650; }

  .svc-actions { display: flex; gap: 0.7rem; flex-wrap: wrap; }
  .svc-actions a {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.5rem 1rem;
    border-radius: var(--radius-sm);
    font-weight: 600; font-size: 0.9rem;
    text-decoration: none;
  }
  .svc-link { background: var(--teal-soft); color: var(--teal-deep); }
  .svc-link:hover { background: var(--teal); color: var(--white); }
  .svc-phone { background: var(--paper-deep); color: var(--ink); }
  .svc-phone:hover { background: var(--butter-soft); }

  .next-step {
    background: var(--lavender-soft);
    border: 1px dashed var(--lavender);
    border-radius: var(--radius);
    padding: 1.4rem 1.6rem;
    margin-top: 2rem;
  }
  .next-step h3 { color: #6a5b8c; font-size: 1.1rem; }
  .next-step p { color: var(--ink-soft); font-size: 0.95rem; margin-bottom: 0.8rem; }

  .empty-state {
    background: var(--paper-cream);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 2.5rem 1.5rem;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty-state h3 { color: var(--ink); margin-bottom: 0.5rem; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo oti-logo">
      <span class="logo-mark"><span></span><span></span><span></span></span>
      אוטי
    </a>
    <div class="nav-links">
      <a href="index.html">בית</a>
      <a href="browse.html">כל המענים</a>
      <a href="table.html">טבלה מלאה</a>
      <a href="fb-leads.html">לידים מקבוצה</a>
      <a href="insights.html">תובנות</a>
    </div>
  </div>
</nav>

<div class="container">

  <div class="path-header">
    <span class="eyebrow">המסלול שלך</span>
    <h1 id="path-title">טוען...</h1>
    <div class="filter-chips" id="chips"></div>
  </div>

  <div class="svc-grid" id="results"></div>

  <div class="next-step" id="next-step" style="display: none;">
    <h3>מה אחרי?</h3>
    <p id="next-text"></p>
    <a class="btn btn-teal" id="next-btn" href="#">ראו מסלול הבא ←</a>
  </div>

  <div style="margin-top: 2rem; text-align: center;">
    <a href="index.html" class="btn btn-secondary">← התחל מחדש</a>
    <a href="browse.html" class="btn btn-secondary">דפדף בכל המענים</a>
  </div>

</div>

<script>
  const AGE_LABELS = {
    "0-3": "תינוק/פעוט (0–3)",
    "3-6": "גן (3–6)",
    "6-13": "יסודי (6–13)",
    "13-18": "תיכון (13–18)",
    "18-120": "בוגר (18+)"
  };
  const NEED_LABELS = {
    diagnosis: "אבחון",
    therapy: "טיפולים",
    rights: "זכויות",
    support: "תמיכה",
    framework: "מסגרת",
    employment: "תעסוקה",
    housing: "דיור",
    financial: "סיוע כלכלי",
    daycare: "מסגרת יום",
    equipment: "ציוד"
  };
  const CAT_LABELS = {
    education: "חינוך",
    therapy: "טיפול ואבחון",
    "adult-services": "שירותים לבוגרים",
    rights: "זכויות",
    organizations: "ארגונים"
  };
  const NEXT_AGE = {
    "0-3": "3-6",
    "3-6": "6-13",
    "6-13": "13-18",
    "13-18": "18-120"
  };

  function tagClass(tag) {
    if (["ממליצים בחום", "חובה", "המסגרת הכי מוזכרת בצ'אט"].includes(tag)) return "tag-warm";
    if (["המתנה ארוכה", "תהליך בירוקרטי", "היו קשיים"].includes(tag)) return "tag-concern";
    return "tag-neutral";
  }

  function parseAge(age) {
    const [min, max] = age.split("-").map(Number);
    return { min, max };
  }

  function ageMatch(svc, age) {
    const { min, max } = parseAge(age);
    return svc.ageMin <= max && svc.ageMax >= min;
  }

  function renderCard(svc) {
    const tagsHtml = (svc.tags || []).map(t =>
      `<span class="svc-tag ${tagClass(t)}">${t}</span>`
    ).join("");

    const phoneHtml = svc.phone ? `
      <a class="svc-phone" href="tel:${svc.phone.replace(/\s/g, "")}">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3.1-8.7A2 2 0 014 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.7a2 2 0 01-.5 2.1L7.9 9.8a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.5 2.7.6a2 2 0 011.7 2z"/></svg>
        ${svc.phone}
      </a>
    ` : "";

    const webHtml = svc.website ? `
      <a class="svc-link" href="${svc.website}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20"/></svg>
        לאתר
      </a>
    ` : "";

    return `
      <article class="svc-card">
        <div class="svc-head">
          <div class="svc-name">${svc.name}</div>
          <div class="svc-cat">${CAT_LABELS[svc.category] || svc.category}</div>
        </div>
        <div class="svc-meta">
          <span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            ${svc.location}
          </span>
          <span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a6 6 0 0116 0v2"/></svg>
            גילאים ${svc.ageMin}–${svc.ageMax === 120 ? "120+" : svc.ageMax}
          </span>
          <span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M5 9l7-7 7 7"/></svg>
            ${svc.model}
          </span>
          <span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M9 9h6a2 2 0 010 4H9a2 2 0 000 4h6"/></svg>
            ${svc.funding}
          </span>
        </div>
        ${tagsHtml ? `<div class="svc-tags">${tagsHtml}</div>` : ""}
        <p class="svc-summary">${svc.summary}</p>
        <div class="svc-actions">${webHtml}${phoneHtml}</div>
      </article>
    `;
  }

  async function load() {
    const params = new URLSearchParams(window.location.search);
    const age = params.get("age") || "6-13";
    const need = params.get("need") || "framework";

    document.getElementById("path-title").textContent =
      `${NEED_LABELS[need] || need} · ${AGE_LABELS[age] || age}`;

    document.getElementById("chips").innerHTML =
      `<span class="chip">${AGE_LABELS[age] || age}</span>
       <span class="chip">${NEED_LABELS[need] || need}</span>`;

    const res = await fetch("data/services.json");
    const data = await res.json();

    const matches = data.services.filter(svc =>
      ageMatch(svc, age) && (svc.need || []).includes(need)
    );

    const results = document.getElementById("results");
    if (matches.length === 0) {
      results.innerHTML = `
        <div class="empty-state">
          <h3>אין עדיין מענים מסווגים בקטגוריה הזו</h3>
          <p>הפיילוט כולל 12 מענים מוכרים. נרחיב בקרוב.</p>
          <a href="browse.html" class="btn btn-teal" style="margin-top: 1rem;">דפדף בכל המענים</a>
        </div>
      `;
    } else {
      results.innerHTML = matches.map(renderCard).join("");
    }

    // מה אחרי — קישור לגיל הבא
    const nextAge = NEXT_AGE[age];
    if (nextAge) {
      document.getElementById("next-step").style.display = "block";
      document.getElementById("next-text").textContent =
        `כשמגיעים לשלב ${AGE_LABELS[nextAge]}, מתחילים לחפש סוגי מענים אחרים. אפשר לראות כבר עכשיו.`;
      document.getElementById("next-btn").href =
        `path.html?age=${nextAge}&need=framework`;
    }
  }

  load();
</script>

</body>
</html>
