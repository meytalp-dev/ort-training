<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כל המענים · אוטי</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@400;600;700&family=Playpen+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .oti-logo .logo-mark span:nth-child(1) { background: var(--butter); }
  .oti-logo .logo-mark span:nth-child(2) { background: var(--teal); margin-top: 6px; }
  .oti-logo .logo-mark span:nth-child(3) { background: var(--lavender); }

  .browse-header {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.4rem 1.6rem;
    box-shadow: var(--shadow-sm);
    margin-bottom: 1.5rem;
  }
  .browse-header h1 { font-size: 1.8rem; margin-bottom: 0.4rem; }
  .browse-header p { color: var(--ink-soft); margin-bottom: 0; }

  .filters {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
    margin-bottom: 1.4rem;
  }
  .filter-btn {
    padding: 0.5rem 1rem;
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: 999px;
    font-weight: 600; font-size: 0.9rem;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-btn:hover { border-color: var(--teal); color: var(--ink); }
  .filter-btn.active {
    background: var(--teal-deep);
    border-color: var(--teal-deep);
    color: var(--white);
  }

  .search-input {
    width: 100%;
    padding: 0.8rem 1rem;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 1rem;
    background: var(--white);
  }
  .search-input:focus { outline: none; border-color: var(--teal); }

  .svc-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  .svc-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.4rem 1.6rem;
    box-shadow: var(--shadow-sm);
  }
  .svc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.5rem; }
  .svc-name { font-family: 'Playpen Sans Hebrew', 'Heebo', sans-serif; font-size: 1.25rem; font-weight: 600; }
  .svc-cat { font-size: 0.8rem; font-weight: 700; color: var(--coral); white-space: nowrap; }
  .svc-meta {
    display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem;
    font-size: 0.88rem; color: var(--ink-soft);
    margin-bottom: 0.8rem;
  }
  .svc-summary { color: var(--ink); line-height: 1.65; margin-bottom: 0.9rem; }
  .svc-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
  .svc-tag {
    font-size: 0.78rem;
    padding: 0.2rem 0.7rem;
    border-radius: 999px;
    font-weight: 600;
  }
  .tag-warm { background: var(--sage-soft); color: #5b8452; }
  .tag-neutral { background: var(--butter-soft); color: #8a6d1f; }
  .tag-concern { background: var(--coral-soft); color: #b26650; }

  .svc-actions { display: flex; gap: 0.7rem; flex-wrap: wrap; }
  .svc-actions a {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.5rem 1rem;
    border-radius: var(--radius-sm);
    font-weight: 600; font-size: 0.9rem;
    text-decoration: none;
  }
  .svc-link { background: var(--teal-soft); color: var(--teal-deep); }
  .svc-phone { background: var(--paper-deep); color: var(--ink); }

  .count-note {
    color: var(--ink-light);
    font-size: 0.9rem;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo oti-logo">
      <span class="logo-mark"><span></span><span></span><span></span></span>
      אוטי
    </a>
    <div class="nav-links">
      <a href="index.html">בית</a>
      <a href="browse.html" class="active">כל המענים</a>
      <a href="../index.html">מתחברים</a>
    </div>
  </div>
</nav>

<div class="container">

  <div class="browse-header">
    <h1>כל המענים</h1>
    <p>12 מענים בפיילוט. מסוננים לפי קטגוריה או חיפוש חופשי.</p>
  </div>

  <input type="search" class="search-input" id="search" placeholder="חיפוש חופשי — שם, מיקום, תוכן...">

  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="all">הכל</button>
    <button class="filter-btn" data-cat="education">חינוך</button>
    <button class="filter-btn" data-cat="therapy">טיפול ואבחון</button>
    <button class="filter-btn" data-cat="adult-services">שירותים לבוגרים</button>
    <button class="filter-btn" data-cat="rights">זכויות</button>
    <button class="filter-btn" data-cat="organizations">ארגונים</button>
  </div>

  <div class="count-note" id="count"></div>

  <div class="svc-grid" id="results"></div>

</div>

<script>
  const CAT_LABELS = {
    education: "חינוך",
    therapy: "טיפול ואבחון",
    "adult-services": "שירותים לבוגרים",
    rights: "זכויות",
    organizations: "ארגונים"
  };

  function tagClass(tag) {
    if (["ממליצים בחום", "חובה", "המסגרת הכי מוזכרת בצ'אט"].includes(tag)) return "tag-warm";
    if (["המתנה ארוכה", "תהליך בירוקרטי", "היו קשיים"].includes(tag)) return "tag-concern";
    return "tag-neutral";
  }

  function renderCard(svc) {
    const tagsHtml = (svc.tags || []).map(t =>
      `<span class="svc-tag ${tagClass(t)}">${t}</span>`
    ).join("");

    const phoneHtml = svc.phone ? `
      <a class="svc-phone" href="tel:${svc.phone.replace(/\s/g, "")}">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3.1-8.7A2 2 0 014 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.7a2 2 0 01-.5 2.1L7.9 9.8a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.5 2.7.6a2 2 0 011.7 2z"/></svg>
        ${svc.phone}
      </a>
    ` : "";

    const webHtml = svc.website ? `
      <a class="svc-link" href="${svc.website}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20"/></svg>
        לאתר
      </a>
    ` : "";

    return `
      <article class="svc-card" data-cat="${svc.category}" data-text="${(svc.name + " " + svc.summary + " " + svc.location).toLowerCase()}">
        <div class="svc-head">
          <div class="svc-name">${svc.name}</div>
          <div class="svc-cat">${CAT_LABELS[svc.category] || svc.category}</div>
        </div>
        <div class="svc-meta">
          <span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.7;vertical-align:-2px;margin-left:4px"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            ${svc.location}
          </span>
          <span>גילאים ${svc.ageMin}–${svc.ageMax === 120 ? "120+" : svc.ageMax}</span>
          <span>${svc.model}</span>
          <span>${svc.funding}</span>
        </div>
        ${tagsHtml ? `<div class="svc-tags">${tagsHtml}</div>` : ""}
        <p class="svc-summary">${svc.summary}</p>
        <div class="svc-actions">${webHtml}${phoneHtml}</div>
      </article>
    `;
  }

  let allServices = [];
  let currentCat = "all";

  function render() {
    const q = document.getElementById("search").value.toLowerCase().trim();
    const cards = document.querySelectorAll(".svc-card");
    let visible = 0;
    cards.forEach(card => {
      const catOk = currentCat === "all" || card.dataset.cat === currentCat;
      const textOk = !q || card.dataset.text.includes(q);
      const show = catOk && textOk;
      card.style.display = show ? "" : "none";
      if (show) visible++;
    });
    document.getElementById("count").textContent = `מציג ${visible} מתוך ${allServices.length}`;
  }

  async function load() {
    const res = await fetch("data/services.json");
    const data = await res.json();
    allServices = data.services;
    document.getElementById("results").innerHTML = allServices.map(renderCard).join("");
    render();
  }

  document.getElementById("filters").addEventListener("click", (e) => {
    if (!e.target.dataset.cat) return;
    currentCat = e.target.dataset.cat;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === currentCat));
    render();
  });

  document.getElementById("search").addEventListener("input", render);

  load();
</script>

</body>
</html>
