<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>נווט הכלים | Learni</title>
<meta name="description" content="נווט הכלים של לרני — בוחרים תפקיד, משימה, סגנון ותקציב ומקבלים מרשם אישי: כלי ה-AI שמתאימים בדיוק לכם.">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Rubik:wght@400;500;600;700&family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family:'Cafe'; src:url('/ort-training/fonts/Cafe.ttf'), url('../fonts/Cafe.ttf'), url('../design-studio/fonts/Cafe.ttf'); font-display:swap; }

:root {
  --bg: #f5f0e8;
  --card: rgba(255,255,255,0.85);
  --primary: #ec4899;
  --primary-dark: #be185d;
  --purple: #8b5cf6;
  --accent: #fbbf24;
  --text: #1e1b4b;
  --muted: #4b5563;
  --border: #e2e8f0;
  --radius: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Heebo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; direction:rtl; }
svg.ic { width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* Header */
.header {
  background:linear-gradient(135deg, #ec4899 0%, #f472b6 30%, #a855f7 70%, #8b5cf6 100%);
  background-size:200% 200%; animation:grad-shift 6s ease infinite;
  padding:24px 32px; text-align:center; color:white; position:relative; overflow:hidden;
}
@keyframes grad-shift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
.header h1 { font-family:'Cafe','Amatic SC',cursive; font-size:34px; margin-bottom:4px; }
.header p { font-size:14px; opacity:0.9; }
.header .logo-corner { position:absolute; top:12px; left:12px; display:flex; align-items:center; gap:4px; }
.header .logo-corner .dot { width:16px; height:16px; border-radius:50%; }
.header .logo-corner .dot-b { background:rgba(255,255,255,0.5); }
.header .logo-corner .dot-g { background:rgba(255,255,255,0.3); margin-right:-5px; }
.header .logo-corner span { font-size:11px; font-weight:700; color:rgba(255,255,255,0.7); }
.header .back {
  position:absolute; top:14px; right:14px; color:#fff; text-decoration:none; font-size:12px; font-weight:600;
  background:rgba(255,255,255,0.18); padding:6px 14px; border-radius:50px; transition:background 200ms;
}
.header .back:hover { background:rgba(255,255,255,0.32); }

/* Layout */
.main { max-width:1300px; margin:0 auto; padding:20px; display:grid; grid-template-columns:360px 1fr; gap:20px; align-items:start; }
@media (max-width:900px){ .main { grid-template-columns:1fr; } }

/* Controls sidebar */
.controls {
  background:var(--card); backdrop-filter:blur(16px); border-radius:var(--radius);
  padding:20px; box-shadow:0 4px 20px rgba(0,0,0,0.06);
}
.controls h2 { font-family:'Rubik',sans-serif; font-size:17px; font-weight:600; margin-bottom:4px; color:var(--primary-dark); }
.controls .sub { font-size:12px; color:var(--muted); margin-bottom:14px; }
.section-title {
  font-size:13px; font-weight:600; color:var(--primary);
  margin:14px 0 8px; padding-top:12px; border-top:1px solid #e8e4dc;
}
.section-title:first-of-type { border-top:none; padding-top:0; margin-top:0; }
.pick-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.pick-grid.two { grid-template-columns:repeat(2,1fr); }
.pick-card {
  border:2px solid var(--border); border-radius:12px; padding:10px 6px; cursor:pointer;
  transition:all 200ms; background:white; text-align:center; user-select:none;
}
.pick-card:hover { transform:translateY(-2px); border-color:#f9a8d4; }
.pick-card.active { border-color:var(--primary); background:#fdf2f8; }
.pick-card .pi { width:26px; height:26px; margin:0 auto 5px; color:var(--purple); }
.pick-card.active .pi { color:var(--primary); }
.pick-card .pn { font-size:12px; font-weight:600; display:block; line-height:1.25; }
.pick-card .pd { font-size:9.5px; color:var(--muted); display:block; margin-top:2px; line-height:1.3; }

/* Preview column */
.preview-col { min-width:0; }
.actionbar {
  display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;
  background:var(--card); backdrop-filter:blur(16px); border-radius:var(--radius);
  padding:12px 16px; box-shadow:0 4px 20px rgba(0,0,0,0.06); align-items:center;
}
.btn {
  font-family:'Heebo',sans-serif; border:none; cursor:pointer; border-radius:50px;
  padding:9px 20px; font-size:13px; font-weight:700; transition:all 200ms;
  display:inline-flex; align-items:center; gap:7px; text-decoration:none;
}
.btn .bi { width:16px; height:16px; }
.btn-main { background:linear-gradient(135deg,var(--primary),var(--purple)); color:#fff; box-shadow:0 3px 12px rgba(236,72,153,0.35); }
.btn-main:hover { transform:translateY(-2px); }
.btn-ghost { background:white; border:2px solid var(--border); color:var(--text); }
.btn-ghost:hover { border-color:var(--primary); color:var(--primary-dark); }
.actionbar .spacer { flex:1; }
.actionbar .hint { font-size:11.5px; color:var(--muted); }

/* Result card (capture area) */
.rcard { background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 10px 40px rgba(30,27,75,0.12); }
.rhead {
  background:linear-gradient(135deg, #ec4899 0%, #f472b6 30%, #a855f7 70%, #8b5cf6 100%);
  color:#fff; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
}
.rhead h2 { font-family:'Cafe','Amatic SC',cursive; font-size:30px; font-weight:700; }
.rhead .rbrand { display:flex; align-items:center; gap:5px; font-size:12px; font-weight:700; opacity:0.95; }
.rhead .rbrand .dot { width:13px; height:13px; border-radius:50%; background:rgba(255,255,255,0.55); }
.rhead .rbrand .dot2 { width:13px; height:13px; border-radius:50%; background:rgba(255,255,255,0.3); margin-right:-4px; }
.rchips { display:flex; flex-wrap:wrap; gap:8px; padding:16px 24px 0; }
.rchip { background:#f5f0e8; color:var(--text); font-size:12px; padding:5px 14px; border-radius:50px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
.rchip .ci { width:14px; height:14px; color:var(--primary-dark); }
.rbody { padding:16px 24px 22px; }
.winner {
  border:2px solid var(--primary); border-radius:16px; padding:18px;
  background:linear-gradient(135deg,#fdf2f8,#faf5ff); margin-bottom:14px; position:relative;
}
.winner .wtag {
  display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:var(--primary-dark);
  background:#fce7f3; border-radius:50px; padding:4px 12px; margin-bottom:8px;
}
.winner .wtag .wi { width:14px; height:14px; }
.winner h3 { font-size:24px; font-weight:900; }
.winner p { font-size:14px; color:var(--muted); margin-top:6px; line-height:1.6; }
.badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.bdg { font-size:11px; padding:4px 12px; border-radius:50px; background:#f5f0e8; color:var(--text); font-weight:600; }
.bdg.il { background:#e0e7ff; color:#3730a3; }
.bdg.tr { background:#dcfce7; color:#166534; }
.alts { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
.alt { border:1.5px solid var(--border); border-radius:14px; padding:14px; background:#fff; }
.alt .atag { font-size:10.5px; font-weight:700; color:var(--purple); margin-bottom:4px; }
.alt h4 { font-size:16px; font-weight:800; }
.alt p { font-size:12px; color:var(--muted); margin-top:4px; line-height:1.55; }
.flowstep { display:flex; gap:14px; align-items:flex-start; border:1.5px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px; background:#fff; }
.flowstep .num {
  flex-shrink:0; width:34px; height:34px; border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--purple)); color:#fff;
  font-weight:900; display:flex; align-items:center; justify-content:center; font-size:15px;
}
.flowstep h4 { font-size:16px; font-weight:800; }
.flowstep p { font-size:12px; color:var(--muted); margin-top:3px; line-height:1.55; }
.rwhy { font-size:13px; color:var(--text); background:#faf5ff; border:1px dashed #d8b4fe; border-radius:12px; padding:12px 16px; margin-bottom:14px; line-height:1.7; }
.toolinks { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.toolinks a {
  font-size:11.5px; padding:5px 14px; border-radius:50px; text-decoration:none; font-weight:700;
  display:inline-flex; align-items:center; gap:5px;
}
.toolinks a .li { width:13px; height:13px; }
.toolinks a.site { background:var(--primary); color:#fff; }
.toolinks a.learni { background:#fff; border:1.5px solid var(--primary); color:var(--primary-dark); }
.toolinks a.train { background:#fff; border:1.5px solid var(--purple); color:var(--purple); }
.rfoot {
  border-top:1px solid #efe9df; background:#faf7f1; padding:12px 24px;
  display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--muted); flex-wrap:wrap; gap:6px;
}
.rfoot b { color:var(--primary-dark); }

/* Empty state */
.empty {
  background:var(--card); border-radius:20px; padding:60px 30px; text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,0.06);
}
.empty .ei { width:74px; height:74px; margin:0 auto 16px; color:var(--primary); opacity:0.75; }
.empty h3 { font-family:'Cafe','Amatic SC',cursive; font-size:30px; color:var(--primary-dark); margin-bottom:6px; }
.empty p { font-size:14px; color:var(--muted); }

.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(90px);
  background:var(--text); color:#fff; padding:10px 24px; border-radius:50px; font-size:13.5px;
  transition:transform 300ms; z-index:99; box-shadow:0 6px 20px rgba(0,0,0,0.25);
}
.toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="logo-corner"><div class="dot dot-b"></div><div class="dot dot-g"></div><span>Learni</span></div>
  <a class="back" href="../">לאתר לרני</a>
  <h1>נווט הכלים</h1>
  <p>בוחרים תפקיד, משימה, סגנון ותקציב — ומקבלים מרשם אישי: כלי ה-AI שמתאימים בדיוק לכם</p>
</div>

<div class="main">

  <aside class="controls">
    <h2>בונים את המרשם</h2>
    <div class="sub">כל בחירה מעדכנת את ההמלצה מיד</div>

    <div class="section-title">מי אני?</div>
    <div class="pick-grid" id="gRole"></div>

    <div class="section-title">מה אני רוצה ליצור?</div>
    <div class="pick-grid two" id="gTask"></div>

    <div class="section-title">איך אני אוהב לעבוד?</div>
    <div class="pick-grid" id="gDepth"></div>

    <div class="section-title">תקציב</div>
    <div class="pick-grid two" id="gBudget"></div>
  </aside>

  <div class="preview-col">
    <div class="actionbar">
      <button class="btn btn-main" onclick="downloadCard()"><span class="bi" data-ic="download"></span>הורדת תמונה</button>
      <button class="btn btn-ghost" onclick="copyLink()"><span class="bi" data-ic="link"></span>העתקת קישור</button>
      <button class="btn btn-ghost" onclick="restart()"><span class="bi" data-ic="restart"></span>איפוס</button>
      <span class="spacer"></span>
      <a class="btn btn-ghost" href="../#tools"><span class="bi" data-ic="library"></span>לספרייה המלאה</a>
    </div>
    <div id="previewArea"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="../js/tools-data.js"></script>
<script>
/* ===== SVG icon set (stroke, Lucide-style) — no emoji per design rules ===== */
var IC={
teacher:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
manager:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>',
other:'<path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
writing:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
presentation:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 9l3 3 4-5 3 4"/>',
video:'<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
research:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
app:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
images:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
worksheets:'<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6"/><path d="M9 16h6"/>',
music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
transcript:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
marketing:'<path d="M3 11l18-5v12L3 13v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
fast:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
quality:'<path d="M6 3h12l4 6-10 13L2 9z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/>',
combined:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
free:'<path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
paid:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
restart:'<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>',
library:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/>',
compass:'<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88"/>',
training:'<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/>',
external:'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>'
};
function ic(name,cls){return '<svg class="ic '+(cls||'')+'" viewBox="0 0 24 24">'+(IC[name]||'')+'</svg>';}

var GROUPS=[
{key:"role",el:"gRole",opts:[
  ["מורה","teacher","מורה","הוראה והדרכה"],
  ["מנהל","manager","מנהל·ת","צוות, בי״ס, ארגון"],
  ["אחר","other","אחר","יזמות, עסק, אישי"]]},
{key:"task",el:"gTask",opts:[
  ["כתיבה","writing","כתיבה וניסוח",""],
  ["מצגת","presentation","מצגת",""],
  ["סרטון","video","סרטון",""],
  ["מחקר","research","מחקר וסיכום",""],
  ["אפליקציה","app","אפליקציה או אתר",""],
  ["תמונות","images","תמונות ועיצוב",""],
  ["שאלונים","worksheets","שאלונים ודפי עבודה",""],
  ["מוזיקה","music","מוזיקה וקריינות",""],
  ["תמלול","transcript","תמלול וישיבות",""],
  ["שיווק","marketing","שיווק ורשתות",""]]},
{key:"depth",el:"gDepth",opts:[
  ["מהיר","fast","מהיר","תוצאה בדקות"],
  ["איכותי","quality","איכותי","שליטה ועומק"],
  ["משולב","combined","משולב","כמה כלים בזרימה"]]},
{key:"budget",el:"gBudget",opts:[
  ["חינם","free","חינם בלבד",""],
  ["הכול","paid","גם בתשלום",""]]}
];
var sel={role:"מורה",task:"",depth:"מהיר",budget:"הכול"};

function renderControls(){
GROUPS.forEach(function(g){
document.getElementById(g.el).innerHTML=g.opts.map(function(o){
return '<div class="pick-card'+(sel[g.key]===o[0]?' active':'')+'" onclick="pick(\''+g.key+'\',\''+o[0]+'\')">'+
'<div class="pi">'+ic(o[1])+'</div><span class="pn">'+o[2]+'</span>'+(o[3]?'<span class="pd">'+o[3]+'</span>':'')+'</div>';
}).join('');
});
}
function pick(k,v){sel[k]=v;renderControls();renderResult();}
function optOf(key,v){
var g=GROUPS.filter(function(g){return g.key===key;})[0];
return g.opts.filter(function(o){return o[0]===v;})[0];
}
function toolLinks(t){
var h='<div class="toolinks">';
if(t.link)h+='<a class="site" href="'+t.link+'" target="_blank" rel="noopener"><span class="li">'+ic('external')+'</span>לאתר הכלי</a>';
h+='<a class="learni" href="../#'+toolSlug(t.name)+'" target="_blank"><span class="li">'+ic('library')+'</span>הכלי באתר לרני</a>';
if(t.training)h+='<a class="train" href="../'+t.training+'" target="_blank"><span class="li">'+ic('training')+'</span>הדרכה באתר לרני</a>';
return h+'</div>';
}
function badges(t){
var h='<div class="badges"><span class="bdg">עברית: '+t.hebrew+'</span><span class="bdg">'+t.pricing+'</span>';
if(t.israeli)h+='<span class="bdg il">כחול-לבן</span>';
if(t.training)h+='<span class="bdg tr">יש הדרכה בעברית</span>';
return h+'</div>';
}
function renderResult(){
var area=document.getElementById('previewArea');
if(!sel.task){
area.innerHTML='<div class="empty"><div class="ei">'+ic('compass')+'</div><h3>בוחרים משימה — ומקבלים מרשם</h3><p>סמנו בצד מה אתם רוצים ליצור, וההמלצה תופיע כאן מיד</p></div>';
history.replaceState(null,'',location.pathname);
return;
}
var freeOnly=sel.budget==='חינם';
var chips=['role','task','depth','budget'].map(function(k){
var o=optOf(k,sel[k]);
return '<span class="rchip"><span class="ci">'+ic(o[1])+'</span>'+o[2]+'</span>';
}).join('');
var h='<div class="rcard" id="resultCard">';
h+='<div class="rhead"><h2>המרשם שלי</h2><span class="rbrand"><span class="dot"></span><span class="dot2"></span>Learni · נווט הכלים</span></div>';
h+='<div class="rchips">'+chips+'</div><div class="rbody">';
if(sel.depth==='משולב'&&toolCombos[sel.task]){
var combo=toolCombos[sel.task];
h+='<div class="rwhy">'+combo.why+'</div>';
combo.steps.forEach(function(n,idx){
var t=toolByName(n);if(!t)return;
h+='<div class="flowstep"><div class="num">'+(idx+1)+'</div><div><h4>'+t.name+'</h4><p>'+t.desc+'</p>'+toolLinks(t)+'</div></div>';
});
}else{
var scored=scoreTools(sel.task,sel.depth,sel.role,freeOnly);
if(!scored.length){
h+='<div class="rwhy">לא מצאנו כלי חינמי שמתאים בדיוק — נסו לבחור "גם בתשלום".</div>';
}else{
var w=scored[0].t;
h+='<div class="winner"><span class="wtag"><span class="wi">'+ic('star')+'</span>הבחירה שלנו בשבילך</span><h3>'+w.name+'</h3><p>'+w.desc+'</p>'+badges(w)+toolLinks(w)+'</div>';
if(scored.length>1){
h+='<div class="alts">';
scored.slice(1,3).forEach(function(x){
h+='<div class="alt"><div class="atag">שווה להכיר גם</div><h4>'+x.t.name+'</h4><p>'+x.t.desc+'</p>'+toolLinks(x.t)+'</div>';
});
h+='</div>';
}
}
}
h+='</div><div class="rfoot"><span><b>Learni</b> · AI שנשאר אצלכם</span><span>meytalp-dev.github.io/ort-training/tool-finder</span></div></div>';
area.innerHTML=h;
history.replaceState(null,'','?r='+encodeURIComponent(sel.role)+'&t='+encodeURIComponent(sel.task)+'&d='+encodeURIComponent(sel.depth)+'&b='+encodeURIComponent(sel.budget));
}
function restart(){
sel={role:"מורה",task:"",depth:"מהיר",budget:"הכול"};
renderControls();renderResult();
}
function toast(m){
var t=document.getElementById('toast');
t.textContent=m;t.classList.add('show');
setTimeout(function(){t.classList.remove('show');},2200);
}
function copyLink(){
if(!sel.task){toast('קודם בוחרים משימה');return;}
navigator.clipboard.writeText(location.href).then(function(){toast('הקישור הועתק — אפשר לשתף');});
}
function downloadCard(){
if(!sel.task){toast('קודם בוחרים משימה');return;}
if(window.html2canvas){doCapture();return;}
var s=document.createElement('script');
s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
s.onload=doCapture;
document.body.appendChild(s);
}
function doCapture(){
html2canvas(document.getElementById('resultCard'),{scale:2,useCORS:true,backgroundColor:'#ffffff'}).then(function(canvas){
var a=document.createElement('a');
a.download='נווט-הכלים-'+(sel.task||'המלצה')+'.png';
a.href=canvas.toDataURL('image/png');
a.click();
toast('התמונה ירדה למחשב');
});
}
/* action bar icons */
document.querySelectorAll('[data-ic]').forEach(function(el){el.innerHTML=ic(el.getAttribute('data-ic'));});
/* restore from share link */
(function(){
var p=new URLSearchParams(location.search);
if(p.get('t')){
sel.role=p.get('r')||'מורה';sel.task=p.get('t');sel.depth=p.get('d')||'מהיר';sel.budget=p.get('b')||'הכול';
}
renderControls();renderResult();
})();
</script>
</body>
</html>
