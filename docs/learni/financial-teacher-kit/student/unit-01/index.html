<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF8F4">
<title>יחידה 1 · תקציב אישי · פיננסקלאס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_student-shell.css">
</head>
<body>
<a class="skip-link" href="#main">דלגי לתוכן הראשי</a>

<header class="s-topbar" id="sTopbar" data-back="../index.html" data-title="יחידה 1 · תקציב אישי" data-user-href="../index.html"></header>

<main class="s-page" id="main">
  <div id="appRoot"></div>
</main>

<script src="../_student-shell.js"></script>
<script>
  (function () {
    const root = document.getElementById('appRoot');
    const shell = window.studentShell;
    const u = shell.getUser();
    if (!u) { window.location.href = '../index.html'; return; }
    const unit = shell.COURSE.units.find(x => x.id === 1);
    const progress = shell.getProgress();
    const lessons = unit.lessons;

    const publishedTotal = lessons.filter(l => l.published !== false).length;
    const done = lessons.filter(l => progress[l.id]?.done).length;
    const pct = publishedTotal ? Math.round(done / publishedTotal * 100) : 0;

    root.innerHTML = `
      <div class="s-hero-greeting">
        <h1>${unit.title}</h1>
        <p>הסיפור של נועה — מאיפה הכסף ולאן הוא הולך, ואיך לבנות תקציב שעובד.</p>
      </div>

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap">
        <div class="s-prog-chip">
          <span class="s-prog-chip-circle" style="--p:${pct}"></span>
          <span>${done}/${publishedTotal} שיעורים</span>
        </div>
      </div>

      <div class="s-spacer"></div>

      <div class="s-lessons-grid">
        ${lessons.map((l, i) => {
          const isDone = !!progress[l.id]?.done;
          const isLocked = l.published === false;
          const href = isLocked ? null : l.slug;
          return `
            <a class="s-lesson-card${isDone ? ' done' : ''}${isLocked ? ' locked' : ''}" ${href ? `href="${href}"` : ''}>
              <div class="s-lesson-card-num">${l.id.split('.')[1]}</div>
              <div class="s-lesson-card-body">
                <h3>${l.title}</h3>
                <div class="s-lesson-card-meta">${isLocked ? 'משתחרר בהמשך' : `${l.tasks} משימות קצרות`}</div>
              </div>
              <div class="s-lesson-card-dot"></div>
            </a>
          `;
        }).join('')}
      </div>

      <div class="s-spacer-lg"></div>
      <p style="text-align:center;color:var(--muted);font-size:13px;margin:0">
        כל שיעור = משימות זעירות. אפשר לעצור באמצע ולחזור.
      </p>
    `;
  })();
</script>
</body>
</html>
