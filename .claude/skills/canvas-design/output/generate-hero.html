<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="675"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 1200, H = 675;

// Colors
const DARK = '#080C18';
const DARK2 = '#0B1225';
const TEAL = '#0D9488';
const TEAL_LIGHT = '#14B8A6';
const CYAN = '#22D3EE';
const ORANGE = '#E8784D';
const ORANGE_LIGHT = '#F09A76';

// Utility functions
function radialGlow(x, y, r, color, alpha) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, colorAlpha(color, alpha));
  g.addColorStop(0.5, colorAlpha(color, alpha * 0.4));
  g.addColorStop(1, colorAlpha(color, 0));
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function colorAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// === BACKGROUND ===
// Deep gradient
const bgGrad = ctx.createRadialGradient(600, 340, 50, 600, 340, 700);
bgGrad.addColorStop(0, '#0F1A2E');
bgGrad.addColorStop(0.4, '#0A0F1F');
bgGrad.addColorStop(1, '#050810');
ctx.fillStyle = bgGrad;
ctx.fillRect(0, 0, W, H);

// Subtle grid pattern
ctx.strokeStyle = colorAlpha(TEAL, 0.03);
ctx.lineWidth = 0.5;
for (let x = 0; x < W; x += 40) {
  ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
}
for (let y = 0; y < H; y += 40) {
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
}

// === ATMOSPHERIC GLOWS ===
radialGlow(750, 300, 350, TEAL, 0.12);
radialGlow(900, 200, 250, CYAN, 0.06);
radialGlow(350, 400, 280, ORANGE, 0.04);
radialGlow(600, 350, 200, TEAL, 0.08);

// === LEFT SIDE: ANALOG DECAY ===

// Scattered paper fragments
function drawPaper(x, y, w, h, rot, opacity) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalAlpha = opacity;

  // Paper shadow
  ctx.fillStyle = colorAlpha('#000000', 0.3);
  ctx.fillRect(3, 3, w, h);

  // Paper
  ctx.fillStyle = '#D4C9B8';
  ctx.fillRect(0, 0, w, h);

  // Lines on paper
  ctx.strokeStyle = colorAlpha('#8B8070', 0.4);
  ctx.lineWidth = 0.8;
  for (let ly = 8; ly < h - 4; ly += 6) {
    ctx.beginPath();
    ctx.moveTo(4, ly);
    ctx.lineTo(w - 4, ly);
    ctx.stroke();
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

// Decaying papers - scattered on left
drawPaper(80, 180, 55, 70, -0.3, 0.5);
drawPaper(130, 280, 50, 65, 0.2, 0.4);
drawPaper(60, 350, 60, 75, -0.15, 0.35);
drawPaper(150, 400, 48, 60, 0.35, 0.3);
drawPaper(100, 140, 45, 55, -0.4, 0.25);
drawPaper(180, 220, 42, 52, 0.1, 0.45);
drawPaper(40, 450, 50, 62, -0.25, 0.2);
drawPaper(200, 350, 38, 48, 0.4, 0.3);

// Paper particles dissolving (left to center)
for (let i = 0; i < 60; i++) {
  const px = 180 + Math.random() * 250;
  const py = 100 + Math.random() * 500;
  const size = 1 + Math.random() * 4;
  const alpha = 0.1 + Math.random() * 0.3;
  const progress = (px - 180) / 250; // 0 to 1

  // Transition from paper color to teal
  if (progress < 0.5) {
    ctx.fillStyle = colorAlpha('#C4B9A8', alpha * (1 - progress));
  } else {
    ctx.fillStyle = colorAlpha(TEAL, alpha * progress * 0.5);
  }

  ctx.beginPath();
  if (Math.random() > 0.5) {
    ctx.fillRect(px, py, size, size);
  } else {
    ctx.arc(px, py, size / 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Old clipboard icon (left)
ctx.save();
ctx.translate(160, 160);
ctx.globalAlpha = 0.4;
ctx.strokeStyle = '#8B7D6B';
ctx.lineWidth = 2;
roundRect(0, 0, 50, 65, 4);
ctx.stroke();
ctx.fillStyle = '#8B7D6B';
ctx.fillRect(15, -5, 20, 10);
// X marks (errors)
ctx.strokeStyle = '#C0392B';
ctx.lineWidth = 1.5;
ctx.beginPath(); ctx.moveTo(10, 20); ctx.lineTo(20, 30); ctx.stroke();
ctx.beginPath(); ctx.moveTo(20, 20); ctx.lineTo(10, 30); ctx.stroke();
ctx.beginPath(); ctx.moveTo(10, 38); ctx.lineTo(20, 48); ctx.stroke();
ctx.beginPath(); ctx.moveTo(20, 38); ctx.lineTo(10, 48); ctx.stroke();
ctx.restore();
ctx.globalAlpha = 1;

// === CENTER: SCHOOL BUILDING (THRESHOLD) ===

// Building glow underneath
radialGlow(580, 380, 180, TEAL, 0.15);

// Building base
const bx = 480, by = 220, bw = 200, bh = 220;

// Building shadow
ctx.fillStyle = colorAlpha('#000', 0.4);
roundRect(bx + 5, by + 5, bw, bh, 6);
ctx.fill();

// Building body - gradient
const buildGrad = ctx.createLinearGradient(bx, by, bx, by + bh);
buildGrad.addColorStop(0, '#1A2744');
buildGrad.addColorStop(0.5, '#152238');
buildGrad.addColorStop(1, '#101B30');
roundRect(bx, by, bw, bh, 6);
ctx.fillStyle = buildGrad;
ctx.fill();

// Building border glow
ctx.strokeStyle = colorAlpha(TEAL, 0.4);
ctx.lineWidth = 1.5;
roundRect(bx, by, bw, bh, 6);
ctx.stroke();

// Roof (triangle)
ctx.beginPath();
ctx.moveTo(bx - 15, by + 2);
ctx.lineTo(bx + bw / 2, by - 60);
ctx.lineTo(bx + bw + 15, by + 2);
ctx.closePath();
const roofGrad = ctx.createLinearGradient(bx, by - 60, bx, by);
roofGrad.addColorStop(0, '#1E3048');
roofGrad.addColorStop(1, '#1A2744');
ctx.fillStyle = roofGrad;
ctx.fill();
ctx.strokeStyle = colorAlpha(TEAL, 0.5);
ctx.lineWidth = 1.5;
ctx.stroke();

// Roof top glow
radialGlow(bx + bw/2, by - 40, 40, TEAL_LIGHT, 0.3);

// Windows (glowing)
function drawWindow(wx, wy, ww, wh, glowColor, glowAlpha) {
  // Window glow
  radialGlow(wx + ww/2, wy + wh/2, ww * 1.2, glowColor, glowAlpha);

  // Window frame
  roundRect(wx, wy, ww, wh, 2);
  ctx.fillStyle = colorAlpha(glowColor, 0.15);
  ctx.fill();
  ctx.strokeStyle = colorAlpha(glowColor, 0.6);
  ctx.lineWidth = 1;
  roundRect(wx, wy, ww, wh, 2);
  ctx.stroke();

  // Cross divider
  ctx.beginPath();
  ctx.moveTo(wx + ww/2, wy);
  ctx.lineTo(wx + ww/2, wy + wh);
  ctx.moveTo(wx, wy + wh/2);
  ctx.lineTo(wx + ww, wy + wh/2);
  ctx.strokeStyle = colorAlpha(glowColor, 0.3);
  ctx.lineWidth = 0.8;
  ctx.stroke();
}

// Row 1
drawWindow(bx + 20, by + 30, 30, 35, TEAL_LIGHT, 0.15);
drawWindow(bx + 85, by + 30, 30, 35, CYAN, 0.12);
drawWindow(bx + 150, by + 30, 30, 35, TEAL_LIGHT, 0.15);

// Row 2
drawWindow(bx + 20, by + 85, 30, 35, CYAN, 0.1);
drawWindow(bx + 85, by + 85, 30, 35, TEAL_LIGHT, 0.12);
drawWindow(bx + 150, by + 85, 30, 35, TEAL_LIGHT, 0.15);

// Door
const dx = bx + 75, dy = by + 150, dw = 50, dh = 70;
roundRect(dx, dy, dw, dh, 3);
ctx.fillStyle = colorAlpha(ORANGE, 0.12);
ctx.fill();
ctx.strokeStyle = colorAlpha(ORANGE, 0.5);
ctx.lineWidth = 1.5;
roundRect(dx, dy, dw, dh, 3);
ctx.stroke();

// Door glow
radialGlow(dx + dw/2, dy + dh/2, 40, ORANGE, 0.2);

// Door knob
ctx.beginPath();
ctx.arc(dx + 38, dy + 38, 3, 0, Math.PI * 2);
ctx.fillStyle = ORANGE;
ctx.fill();

// === GROUND LINE ===
const groundY = by + bh;
ctx.beginPath();
ctx.moveTo(0, groundY + 10);
ctx.lineTo(W, groundY + 10);
ctx.strokeStyle = colorAlpha(TEAL, 0.15);
ctx.lineWidth = 1;
ctx.stroke();

// Ground reflection
const groundGrad = ctx.createLinearGradient(0, groundY + 10, 0, H);
groundGrad.addColorStop(0, colorAlpha(TEAL, 0.05));
groundGrad.addColorStop(1, 'transparent');
ctx.fillStyle = groundGrad;
ctx.fillRect(0, groundY + 10, W, H - groundY - 10);

// === RIGHT SIDE: DIGITAL ELEMENTS ===

// Dashboard screen
function drawScreen(sx, sy, sw, sh, title) {
  // Screen glow
  radialGlow(sx + sw/2, sy + sh/2, sw * 0.8, TEAL, 0.1);

  // Screen body
  ctx.save();
  roundRect(sx, sy, sw, sh, 8);
  ctx.fillStyle = colorAlpha('#0A1628', 0.9);
  ctx.fill();
  ctx.strokeStyle = colorAlpha(TEAL, 0.5);
  ctx.lineWidth = 1.5;
  roundRect(sx, sy, sw, sh, 8);
  ctx.stroke();

  // Title bar
  ctx.fillStyle = colorAlpha(TEAL, 0.15);
  roundRect(sx, sy, sw, 20, 8);
  ctx.fill();
  ctx.fillStyle = colorAlpha(TEAL, 0.08);
  ctx.fillRect(sx, sy + 12, sw, 8);

  // Dots
  ctx.fillStyle = '#EF4444';
  ctx.beginPath(); ctx.arc(sx + sw - 12, sy + 10, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#F59E0B';
  ctx.beginPath(); ctx.arc(sx + sw - 22, sy + 10, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#22C55E';
  ctx.beginPath(); ctx.arc(sx + sw - 32, sy + 10, 3, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
  return { x: sx, y: sy + 24, w: sw, h: sh - 28 };
}

// Main dashboard (right center)
const dash = drawScreen(730, 140, 180, 140, 'Dashboard');

// Bar chart in dashboard
const bars = [0.4, 0.7, 0.5, 0.9, 0.6, 0.8, 0.65];
bars.forEach((val, i) => {
  const bx2 = dash.x + 15 + i * 22;
  const barH = val * 80;
  const by2 = dash.y + dash.h - barH - 10;

  const barGrad = ctx.createLinearGradient(bx2, by2, bx2, by2 + barH);
  barGrad.addColorStop(0, TEAL_LIGHT);
  barGrad.addColorStop(1, colorAlpha(TEAL, 0.4));
  ctx.fillStyle = barGrad;
  roundRect(bx2, by2, 16, barH, 3);
  ctx.fill();

  // Top glow
  radialGlow(bx2 + 8, by2, 12, TEAL_LIGHT, 0.3);
});

// Checklist screen (right top)
const check = drawScreen(940, 100, 160, 130, 'Tasks');

// Checklist items
const checkItems = [
  { done: true }, { done: true }, { done: true }, { done: false }, { done: false }
];
checkItems.forEach((item, i) => {
  const cy = check.y + 10 + i * 20;

  // Checkbox
  ctx.strokeStyle = item.done ? TEAL : colorAlpha('#64748B', 0.4);
  ctx.lineWidth = 1.2;
  roundRect(check.x + 12, cy, 12, 12, 2);
  ctx.stroke();

  if (item.done) {
    ctx.beginPath();
    ctx.moveTo(check.x + 15, cy + 6);
    ctx.lineTo(check.x + 18, cy + 9);
    ctx.lineTo(check.x + 22, cy + 3);
    ctx.strokeStyle = TEAL_LIGHT;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Line
  const lineW = 60 + Math.random() * 50;
  ctx.fillStyle = item.done ? colorAlpha(TEAL, 0.3) : colorAlpha('#64748B', 0.15);
  roundRect(check.x + 30, cy + 4, lineW, 4, 2);
  ctx.fill();
});

// Small analytics card (far right)
const mini = drawScreen(960, 290, 140, 100, 'Analytics');

// Pie chart
const pieX = mini.x + 45, pieY = mini.y + 42;
const pieR = 28;
const slices = [
  { start: 0, end: 2.2, color: TEAL },
  { start: 2.2, end: 4.0, color: CYAN },
  { start: 4.0, end: 5.2, color: ORANGE },
  { start: 5.2, end: 6.283, color: colorAlpha(TEAL_LIGHT, 0.5) }
];
slices.forEach(s => {
  ctx.beginPath();
  ctx.moveTo(pieX, pieY);
  ctx.arc(pieX, pieY, pieR, s.start, s.end);
  ctx.closePath();
  ctx.fillStyle = s.color;
  ctx.fill();
});
// Inner circle (donut)
ctx.beginPath();
ctx.arc(pieX, pieY, 14, 0, Math.PI * 2);
ctx.fillStyle = '#0A1628';
ctx.fill();

// Percentage text
ctx.fillStyle = TEAL_LIGHT;
ctx.font = 'bold 10px sans-serif';
ctx.textAlign = 'center';
ctx.fillText('87%', pieX, pieY + 4);

// Small line chart next to pie
ctx.beginPath();
ctx.moveTo(mini.x + 85, mini.y + 60);
ctx.lineTo(mini.x + 95, mini.y + 45);
ctx.lineTo(mini.x + 105, mini.y + 50);
ctx.lineTo(mini.x + 115, mini.y + 30);
ctx.lineTo(mini.x + 125, mini.y + 35);
ctx.strokeStyle = ORANGE;
ctx.lineWidth = 2;
ctx.stroke();

// Glowing dots on line
[{x: mini.x+95, y: mini.y+45}, {x: mini.x+115, y: mini.y+30}].forEach(p => {
  ctx.beginPath();
  ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = ORANGE;
  ctx.fill();
  radialGlow(p.x, p.y, 10, ORANGE, 0.4);
});

// === FLOATING ICONS ===

// Cloud icon (top right)
function drawCloud(cx, cy, scale) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  radialGlow(0, 0, 35, CYAN, 0.15);

  ctx.beginPath();
  ctx.arc(-15, 5, 18, 0, Math.PI * 2);
  ctx.arc(10, 0, 22, 0, Math.PI * 2);
  ctx.arc(30, 5, 16, 0, Math.PI * 2);
  ctx.rect(-30, 5, 60, 18);
  ctx.fillStyle = colorAlpha(CYAN, 0.08);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(-15, 5, 18, Math.PI, 0);
  ctx.arc(10, 0, 22, Math.PI * 1.15, Math.PI * 0.05);
  ctx.arc(30, 5, 16, Math.PI * 1.3, 0);
  ctx.lineTo(46, 23);
  ctx.lineTo(-33, 23);
  ctx.closePath();
  ctx.strokeStyle = colorAlpha(CYAN, 0.5);
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Upload arrow
  ctx.beginPath();
  ctx.moveTo(0, 18);
  ctx.lineTo(0, 5);
  ctx.moveTo(-6, 10);
  ctx.lineTo(0, 4);
  ctx.lineTo(6, 10);
  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 1.8;
  ctx.stroke();

  ctx.restore();
}

drawCloud(850, 65, 0.9);

// WiFi icon
function drawWifi(wx, wy) {
  radialGlow(wx, wy, 25, TEAL_LIGHT, 0.15);

  ctx.strokeStyle = colorAlpha(TEAL_LIGHT, 0.6);
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';

  // Arcs
  [22, 15, 8].forEach((r, i) => {
    ctx.beginPath();
    ctx.arc(wx, wy + 8, r, -Math.PI * 0.75, -Math.PI * 0.25);
    ctx.strokeStyle = colorAlpha(TEAL_LIGHT, 0.3 + i * 0.2);
    ctx.stroke();
  });

  // Dot
  ctx.beginPath();
  ctx.arc(wx, wy + 10, 3, 0, Math.PI * 2);
  ctx.fillStyle = TEAL_LIGHT;
  ctx.fill();
}

drawWifi(1110, 180);

// Gear icon
function drawGear(gx, gy, gr) {
  radialGlow(gx, gy, gr * 2, TEAL, 0.12);

  ctx.save();
  ctx.translate(gx, gy);
  ctx.strokeStyle = colorAlpha(TEAL, 0.5);
  ctx.lineWidth = 1.5;

  // Outer gear teeth
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const innerR = gr * 0.7;
    const outerR = gr;
    const toothW = 0.2;

    ctx.lineTo(Math.cos(angle - toothW) * innerR, Math.sin(angle - toothW) * innerR);
    ctx.lineTo(Math.cos(angle - toothW * 0.6) * outerR, Math.sin(angle - toothW * 0.6) * outerR);
    ctx.lineTo(Math.cos(angle + toothW * 0.6) * outerR, Math.sin(angle + toothW * 0.6) * outerR);
    ctx.lineTo(Math.cos(angle + toothW) * innerR, Math.sin(angle + toothW) * innerR);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.fillStyle = colorAlpha(TEAL, 0.08);
  ctx.fill();

  // Inner circle
  ctx.beginPath();
  ctx.arc(0, 0, gr * 0.3, 0, Math.PI * 2);
  ctx.strokeStyle = colorAlpha(TEAL, 0.4);
  ctx.stroke();

  ctx.restore();
}

drawGear(1050, 420, 20);
drawGear(720, 80, 14);

// === CONNECTION LINES (data flow) ===

function drawFlowLine(x1, y1, x2, y2, color) {
  ctx.beginPath();
  const midX = (x1 + x2) / 2;
  const midY = (y1 + y2) / 2 - 30;
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo(midX, midY, x2, y2);
  ctx.strokeStyle = colorAlpha(color, 0.2);
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 4]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Flowing dots
  for (let t = 0; t < 1; t += 0.25) {
    const tt = (t + Date.now() * 0.001) % 1;
    const px = (1-tt)*(1-tt)*x1 + 2*(1-tt)*tt*midX + tt*tt*x2;
    const py = (1-tt)*(1-tt)*y1 + 2*(1-tt)*tt*midY + tt*tt*y2;
    ctx.beginPath();
    ctx.arc(px, py, 2, 0, Math.PI * 2);
    ctx.fillStyle = colorAlpha(color, 0.5 + tt * 0.3);
    ctx.fill();
  }
}

// Lines from building to digital screens
drawFlowLine(680, 280, 730, 200, TEAL_LIGHT);
drawFlowLine(680, 320, 940, 150, CYAN);
drawFlowLine(680, 350, 960, 330, ORANGE);

// Lines from decay to building
drawFlowLine(250, 250, 480, 300, '#8B7D6B');
drawFlowLine(200, 380, 480, 360, '#8B7D6B');

// === FLOATING PARTICLES ===

// Digital particles (right side — more, brighter)
for (let i = 0; i < 80; i++) {
  const px = 650 + Math.random() * 550;
  const py = 30 + Math.random() * 600;
  const size = 0.5 + Math.random() * 2.5;
  const alpha = 0.1 + Math.random() * 0.5;
  const colors = [TEAL, TEAL_LIGHT, CYAN, ORANGE];
  const color = colors[Math.floor(Math.random() * colors.length)];

  ctx.beginPath();
  ctx.arc(px, py, size, 0, Math.PI * 2);
  ctx.fillStyle = colorAlpha(color, alpha);
  ctx.fill();

  if (size > 1.5) {
    radialGlow(px, py, size * 4, color, alpha * 0.3);
  }
}

// Small connecting nodes
function drawNode(nx, ny, nr, color) {
  ctx.beginPath();
  ctx.arc(nx, ny, nr, 0, Math.PI * 2);
  ctx.fillStyle = colorAlpha(color, 0.3);
  ctx.fill();
  ctx.strokeStyle = colorAlpha(color, 0.6);
  ctx.lineWidth = 1;
  ctx.stroke();
  radialGlow(nx, ny, nr * 3, color, 0.2);
}

drawNode(700, 120, 4, TEAL);
drawNode(880, 250, 3, CYAN);
drawNode(1000, 200, 3, TEAL_LIGHT);
drawNode(770, 340, 4, ORANGE);
drawNode(1080, 320, 3, TEAL);
drawNode(930, 430, 3, CYAN);

// Node connections (thin lines between nearby nodes)
ctx.strokeStyle = colorAlpha(TEAL, 0.08);
ctx.lineWidth = 0.5;
ctx.beginPath(); ctx.moveTo(700, 120); ctx.lineTo(770, 340); ctx.stroke();
ctx.beginPath(); ctx.moveTo(880, 250); ctx.lineTo(1000, 200); ctx.stroke();
ctx.beginPath(); ctx.moveTo(1000, 200); ctx.lineTo(1080, 320); ctx.stroke();
ctx.beginPath(); ctx.moveTo(770, 340); ctx.lineTo(930, 430); ctx.stroke();

// === DATABASE/SERVER ICON (bottom right) ===
function drawServer(sx, sy) {
  radialGlow(sx, sy, 30, TEAL, 0.12);

  // Three stacked cylinders
  for (let i = 0; i < 3; i++) {
    const cy = sy - 10 + i * 16;
    ctx.beginPath();
    ctx.ellipse(sx, cy, 22, 7, 0, 0, Math.PI * 2);
    ctx.fillStyle = colorAlpha('#0A1628', 0.9);
    ctx.fill();
    ctx.strokeStyle = colorAlpha(TEAL, 0.4);
    ctx.lineWidth = 1;
    ctx.stroke();

    if (i < 2) {
      ctx.beginPath();
      ctx.moveTo(sx - 22, cy);
      ctx.lineTo(sx - 22, cy + 16);
      ctx.moveTo(sx + 22, cy);
      ctx.lineTo(sx + 22, cy + 16);
      ctx.strokeStyle = colorAlpha(TEAL, 0.3);
      ctx.stroke();
    }

    // Status light
    ctx.beginPath();
    ctx.arc(sx + 14, cy, 2, 0, Math.PI * 2);
    ctx.fillStyle = i === 0 ? '#22C55E' : TEAL;
    ctx.fill();
  }
}

drawServer(1100, 500);

// === SHIELD ICON (security) ===
function drawShield(sx, sy, size) {
  radialGlow(sx, sy, size * 2, TEAL, 0.1);

  ctx.save();
  ctx.translate(sx, sy);

  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.quadraticCurveTo(size * 0.8, -size * 0.7, size * 0.8, 0);
  ctx.quadraticCurveTo(size * 0.8, size * 0.7, 0, size);
  ctx.quadraticCurveTo(-size * 0.8, size * 0.7, -size * 0.8, 0);
  ctx.quadraticCurveTo(-size * 0.8, -size * 0.7, 0, -size);
  ctx.closePath();
  ctx.fillStyle = colorAlpha(TEAL, 0.08);
  ctx.fill();
  ctx.strokeStyle = colorAlpha(TEAL, 0.5);
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Checkmark
  ctx.beginPath();
  ctx.moveTo(-5, 2);
  ctx.lineTo(-1, 6);
  ctx.lineTo(7, -4);
  ctx.strokeStyle = TEAL_LIGHT;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.restore();
}

drawShield(760, 460, 18);

// === SUBTLE HEXAGON PATTERN (background detail) ===
function drawHex(hx, hy, hr, alpha) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2 - Math.PI / 6;
    const x = hx + Math.cos(angle) * hr;
    const y = hy + Math.sin(angle) * hr;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = colorAlpha(TEAL, alpha);
  ctx.lineWidth = 0.5;
  ctx.stroke();
}

// Scattered hexagons
drawHex(800, 500, 15, 0.06);
drawHex(830, 485, 15, 0.04);
drawHex(815, 515, 15, 0.05);
drawHex(1020, 80, 12, 0.05);
drawHex(1040, 68, 12, 0.03);

// === FINAL POLISH: Edge vignette ===
const vignetteGrad = ctx.createRadialGradient(600, 337, 200, 600, 337, 700);
vignetteGrad.addColorStop(0, 'transparent');
vignetteGrad.addColorStop(0.7, 'transparent');
vignetteGrad.addColorStop(1, colorAlpha('#030510', 0.6));
ctx.fillStyle = vignetteGrad;
ctx.fillRect(0, 0, W, H);

// === Bottom subtle line ===
ctx.beginPath();
ctx.moveTo(100, H - 30);
ctx.lineTo(W - 100, H - 30);
const lineGrad = ctx.createLinearGradient(100, 0, W - 100, 0);
lineGrad.addColorStop(0, 'transparent');
lineGrad.addColorStop(0.3, colorAlpha(TEAL, 0.15));
lineGrad.addColorStop(0.7, colorAlpha(TEAL, 0.15));
lineGrad.addColorStop(1, 'transparent');
ctx.strokeStyle = lineGrad;
ctx.lineWidth = 0.5;
ctx.stroke();

</script>
